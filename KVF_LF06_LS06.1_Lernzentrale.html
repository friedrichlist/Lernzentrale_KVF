(46 %), Garage −10 %.","frage":"Wie hoch ist der Beitrag vor Zahlungsweise und Versicherungsteuer?","einheit":"€","loesung":207,"pruef":{"art":"beitrag","praemie":500.0,"prozente":[46,-10]},"hinweis":"Erst der Beitragssatz, dann der Nachlass vom neuen Betrag.","erkl":"500,00 € × 46 % = 230,00 €; −10 % = 207,00 €."}]},"minigames":{"1":{"typ":"karte","titel":"Europareise","intro":"Ein Kunde der Agentur Wendler plant Reisen mit seinem Auto. Spielen Sie sie durch: Wählen Sie selbst vier Reiseziele, mindestens eines außerhalb von Europa und der EU, und sagen Sie vor jeder Fahrt voraus, welche Sparten am Ziel gelten. Der Tacho zeigt den Schutz erst für Länder, durch die das Auto schon gefahren ist.","karte":"karte_europa.json","vertrag":"Kfz-Haftpflicht, Kasko, Autoschutzbrief und Fahrerschutz bei der Proximus · keine Internationale Versicherungskarte (IVK), keine besondere Vereinbarung zum Geltungsbereich","reisen":4,"mind_aussen":1,"sparten":[{"key":"kh","name":"Kfz-Haftpflicht","kurz":"Haftpflicht"},{"key":"kasko","name":"Kasko","kurz":"Kasko"},{"key":"sb","name":"Autoschutzbrief","kurz":"Schutzbrief"},{"key":"fs","name":"Fahrerschutz","kurz":"Fahrerschutz"}],"zonen":{"europa":{"marke":"EUROPA","text":"Das Ziel liegt in den geografischen Grenzen Europas. Alle vier Sparten gelten (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB).","sparten":{"kh":{"gilt":true,"warum":"Ziff. A.1.4.1 AKB: gilt in den geografischen Grenzen Europas"},"kasko":{"gilt":true,"warum":"Ziff. A.2.5.1 AKB: gilt in den geografischen Grenzen Europas"},"sb":{"gilt":true,"warum":"Ziff. A.3.4 AKB: gilt in den geografischen Grenzen Europas"},"fs":{"gilt":true,"warum":"Ziff. A.4.3 AKB: gilt in den geografischen Grenzen Europas"}},"ohne_eu":"Nicht in der EU – das spielt hier keine Rolle: Es zählt, dass das Ziel geografisch in Europa liegt (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB).","tipp_eu":"Eine IVK ist hier nur Nachweis; in der EU genügt schon das Kennzeichen. Geschützt ist der Kunde auch ohne Karte (Ziff. A.1.4.1 AKB).","tipp":"Eine IVK ist hier nur Nachweis; nach den AKB ist der Kunde auch ohne sie geschützt (Ziff. A.1.4.1 AKB). Ob das Land die Karte als Nachweis anerkennt oder an der Grenze eine eigene Versicherung verlangt, klärt die Agentur vor der Reise."},"eu":{"marke":"EU","text":"Das Ziel gehört zur EU, liegt aber geografisch außerhalb Europas oder nicht eindeutig darin. Die außereuropäischen Gebiete der EU sind eingeschlossen: Alle vier Sparten gelten (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB).","sparten":{"kh":{"gilt":true,"warum":"Ziff. A.1.4.1 AKB: gilt auch in den außereuropäischen Gebieten der EU"},"kasko":{"gilt":true,"warum":"Ziff. A.2.5.1 AKB: gilt auch in den außereuropäischen Gebieten der EU"},"sb":{"gilt":true,"warum":"Ziff. A.3.4 AKB: gilt auch in den außereuropäischen Gebieten der EU"},"fs":{"gilt":true,"warum":"Ziff. A.4.3 AKB: gilt auch in den außereuropäischen Gebieten der EU"}},"tipp":"Eine IVK oder eine besondere Vereinbarung braucht der Kunde dafür nicht (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB)."},"aussen":{"marke":"AUSSERHALB","text":"Das Ziel liegt außerhalb Europas und der EU. Ohne IVK und ohne Vereinbarung gilt hier keine der vier Sparten (Ziff. A.1.4.2, A.2.5.2, A.3.4, A.4.3 AKB).","sparten":{"kh":{"gilt":false,"warum":"Ziff. A.1.4.2 AKB: nur mit einer IVK, auf der das Land steht und nicht durchgestrichen ist – Ihr Kunde hat keine"},"kasko":{"gilt":false,"warum":"Ziff. A.2.5.2 AKB: nur mit einer gesonderten Vereinbarung – es gibt keine"},"sb":{"gilt":false,"warum":"Ziff. A.3.4 AKB: nur Europa und die außereuropäischen Gebiete der EU, eine Erweiterung ist nicht vorgesehen"},"fs":{"gilt":false,"warum":"Ziff. A.4.3 AKB: nur Europa und die außereuropäischen Gebiete der EU, eine Erweiterung ist nicht vorgesehen"}},"tipp":"Die Agentur beantragt bei der Proximus eine IVK – steht das Land darauf und ist es nicht durchgestrichen, gilt die Haftpflicht (Ziff. A.1.4.2 AKB) – und fragt eine Kasko-Vereinbarung an (Ziff. A.2.5.2 AKB). Schutzbrief und Fahrerschutz lassen sich nicht erweitern."},"grenzfall":{"marke":"GRENZFALL","text":"Ob das Ziel zum Geltungsbereich gehört, ist nicht eindeutig. Davon hängen alle vier Sparten ab (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB).","sparten":{"kh":{"gilt":null,"warum":"Ziff. A.1.4.1 AKB: Gehört der Ort zu Europa oder zur EU? Nicht eindeutig"},"kasko":{"gilt":null,"warum":"Ziff. A.2.5.1 AKB: hängt an derselben Frage"},"sb":{"gilt":null,"warum":"Ziff. A.3.4 AKB: hängt an derselben Frage"},"fs":{"gilt":null,"warum":"Ziff. A.4.3 AKB: hängt an derselben Frage"}},"tipp":"Im Zweifel fragt die Agentur vor der Reise bei der Proximus nach. Eine IVK hilft nur der Haftpflicht und nur, wenn das Land darauf steht und nicht durchgestrichen ist (Ziff. A.1.4.2 AKB); sonst braucht der Kunde eine Versicherung im Reiseland."}},"eu":["Belgien","Bulgarien","Dänemark","Deutschland","Estland","Finnland","Frankreich","Griechenland","Irland","Italien","Kroatien","Lettland","Litauen","Luxemburg","Malta","Niederlande","Österreich","Polen","Portugal","Rumänien","Schweden","Slowakei","Slowenien","Spanien","Tschechien","Ungarn","Zypern","Åland (Finnland)","Kanarische Inseln (Spanien)","Madeira (Portugal)","Azoren (Portugal)"],"hinweise":{"Türkei: europäischer Teil (z. B. Istanbul)":"Ostthrakien mit dem europäischen Teil Istanbuls liegt westlich des Bosporus und damit in Europa – wie Istanbul, das erste Ziel von Sabines Reise.","Türkei: asiatischer Teil (Anatolien, z. B. Kappadokien)":"Östlich von Bosporus und Dardanellen beginnt Anatolien und damit Asien. Dort liegt Kappadokien, das Ziel von Sabines Reise.","Kanarische Inseln (Spanien)":"Die Kanaren liegen vor der Küste Afrikas, gehören aber zu Spanien und damit zur EU.","Madeira (Portugal)":"Madeira liegt im Atlantik vor Afrika und gehört zu Portugal und damit zur EU.","Azoren (Portugal)":"Die Azoren liegen mitten im Atlantik und gehören zu Portugal und damit zur EU.","Zypern":"Zypern ist EU-Mitglied. Geografisch wird die Insel meist zu Asien gezählt – für den Schutz spielt das keine Rolle.","Nordteil Zyperns":"Der Norden der Insel gehört zum Staatsgebiet des EU-Mitglieds Zypern, das EU-Recht ist dort aber ausgesetzt. Ob er als Gebiet der EU zählt, klärt die Agentur mit der Proximus. An den Übergängen wird in der Regel eine eigene Versicherung verlangt; die IVK hilft hier nicht.","Georgien":"Wo im Kaukasus Europa endet, wird unterschiedlich gezogen: nördlich des Gebirges, am Kamm des Großen Kaukasus oder erst südlich davon. Georgien liegt fast ganz südlich des Kamms. Ob das Land dazugehört, klärt die Agentur mit der Proximus.","Aserbaidschan":"Wo im Kaukasus Europa endet, wird unterschiedlich gezogen: nördlich des Gebirges, am Kamm des Großen Kaukasus oder erst südlich davon. Der Norden Aserbaidschans liegt nördlich des Kamms, der größte Teil südlich davon. Ob das Land dazugehört, klärt die Agentur mit der Proximus.","Armenien":"Wo im Kaukasus Europa endet, wird unterschiedlich gezogen: nördlich des Gebirges, am Kamm des Großen Kaukasus oder erst südlich davon. Armenien liegt ganz südlich des Großen Kaukasus. Ob das Land dazugehört, klärt die Agentur mit der Proximus.","Kasachstan":"Meist wird nur der kleine Teil westlich des Flusses Ural zu Europa gezählt, der weitaus größte Teil liegt in Asien. Ob Ihr Ziel dazugehört, klärt die Agentur mit der Proximus.","Russland: europäischer Teil (z. B. Moskau)":"Moskau liegt eindeutig in Europa. Als Grenze zu Asien gelten meist Uralgebirge und Fluss Ural, im Süden der Kaukasus; wer in die Nähe dieser Linien fährt, lässt die Agentur bei der Proximus nachfragen. Eine IVK aus Deutschland wird in Russland seit 2023 nicht mehr anerkannt – an der Grenze muss der Kunde eine eigene Versicherung abschließen.","Russland: asiatischer Teil (Sibirien)":"Sibirien liegt weit östlich des Urals und damit eindeutig in Asien.","Belarus":"Belarus liegt in Europa, nach den AKB gelten die Sparten. Eine IVK aus Deutschland wird hier aber seit 2023 nicht mehr anerkannt – an der Grenze muss der Kunde eine eigene Versicherung abschließen. Vor so einer Reise fragt die Agentur bei der Proximus nach.","Ukraine":"Die Ukraine liegt in Europa und gehört damit zum Geltungsbereich. Wegen des Krieges fragt die Agentur vor so einer Reise bei der Proximus nach und prüft die Ausschlüsse im Vertrag.","Kosovo":"Kosovo liegt in Europa, nach den AKB gelten die Sparten. Die IVK wird hier aber nicht anerkannt – an der Grenze verlangt Kosovo eine eigene Versicherung.","Grönland (Dänemark)":"Grönland gehört zum Königreich Dänemark, aber nicht zur EU, und liegt geografisch in Nordamerika.","Färöer (Dänemark)":"Die Färöer gehören zum Königreich Dänemark, aber nicht zur EU.","Ägypten":"Ägypten liegt in Afrika, die Halbinsel Sinai in Asien.","Marokko":"An der Straße von Gibraltar trennen nur rund 14 km Meer Europa und Afrika. Trotzdem liegt Marokko außerhalb von Europa und der EU. Die spanischen Städte Ceuta und Melilla an der Küste Marokkos gehören dagegen zur EU.","Tunesien":"Von Sizilien ist es nur eine Fährfahrt – trotzdem liegt Tunesien außerhalb von Europa und der EU: Ohne IVK und Vereinbarung hat Ihr Kunde dort keinen Schutz.","Vatikanstadt":"Der kleinste Staat der Welt liegt mitten in Rom.","Sudan":"Der Sudan zählt nach der Einteilung der Vereinten Nationen zu Nordafrika.","Mauretanien":"Mauretanien liegt im Nordwesten Afrikas am Atlantik. Die Westsahara zwischen Marokko und Mauretanien ist ein umstrittenes Gebiet und nicht Teil der Reise."},"abschluss":"Erst die Sparte, dann das Land (Merkkasten TE 1): In Europa und den außereuropäischen Gebieten der EU gelten alle vier Sparten (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3 AKB). Außerhalb gilt die Haftpflicht nur mit IVK, auf der das Land steht (Ziff. A.1.4.2), die Kasko nur mit Vereinbarung (Ziff. A.2.5.2), Schutzbrief und Fahrerschutz gar nicht. Wo Europa endet, ist nicht überall klar – im Zweifel fragt die Agentur bei der Proximus nach.","kartendaten":{"quelle":"Natural Earth 1:50 Mio. (world-atlas 2), Lambert-flächentreu um 10 den","Nachweis:","eVB-Nummer bei der Zulassung"],"start":[2,8,6,1,7,3,0,4,5],"kuerzest":16,"abschluss":"Pflicht – Summe – Nachweis: Versichern muss der Halter (§ 1 PflVG). Mindestens 7.500.000 € für Personen-, 1.300.000 € für Sach- und 50.000 € für reine Vermögensschäden, und zwar je Schadensfall, nicht je Person (Anlage zu § 4 Abs. 2 PflVG). Nachgewiesen wird der Schutz bei der Zulassung mit der eVB-Nummer – Merkkasten TE 2."},"3":{"typ":"rettung","titel":"Rettungsgasse","intro":"Vor der Unfallstelle staut es sich. Bringen Sie den Rettungswagen nach rechts zur Unfallstelle. Ziehen Sie ein Fahrzeug oder tippen Sie es an und schieben Sie es mit den Pfeilen. Der Knopf „Tipp“ zeigt jederzeit den nächsten Zug.","fahrzeuge":[{"s":"RTW","h":true,"l":2,"r":2,"c":0},{"s":"MD","h":true,"l":3,"r":3,"c":0,"f":5},{"s":"HAL","h":false,"l":3,"r":2,"c":4,"f":1},{"s":"SK","h":false,"l":2,"r":1,"c":3,"f":2},{"s":"L","h":false,"l":2,"r":1,"c":2,"f":4},{"s":"MER","h":false,"l":2,"r":3,"c":3,"f":6},{"s":"WB","h":true,"l":3,"r":0,"c":0,"f":3},{"s":"ABI","h":false,"l":2,"r":4,"c":0,"f":2},{"s":"B","h":false,"l":2,"r":3,"c":5,"f":4},{"s":"PL","h":false,"l":2,"r":1,"c":5,"f":6},{"s":"DE","h":true,"l":2,"r":1,"c":0,"f":1}],"kuerzest":10,"abschluss":"Der Rettungswagen ist durch. Und wer zahlt dem Opfer den Schaden? Es kann sich direkt an den Kfz-Haftpflichtversicherer des Verursachers wenden (§ 115 Abs. 1 S. 1 Nr. 1 VVG). Hilft kein Versicherer – bei Fahrerflucht, fehlender Versicherung oder Vorsatz –, zahlt zuletzt der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 1 bis 3 PflVG)."},"4":{"typ":"wortsuche","titel":"Wortsuche Ausland","intro":"Sechs Begriffe zum Unfall mit Auslandsbezug verstecken sich im Gitter: waagerecht, senkrecht oder schräg. Tippen Sie den ersten und dann den letzten Buchstaben eines Begriffs an.","gitter":["GZZFTVGLÜE","RFEIRGLGGM","ÜTNWTÜRKEI","NBTLRCKNTU","EÜRTUENOTT","KRATLHGUEC","AOLNSWFSME","RRRAUEESRB","TSUÜHANRPÖ","EIFDMIGLFN"],"woerter":[{"wort":"GRÜNEKARTE","anzeige":"Grüne Karte","erkl":"In Europa und der EU nur Nachweis; außerhalb erweitert erst sie den Schutz der Kfz-Haftpflicht (Ziff. A.1.4.2 AKB)."},{"wort":"BÜRO","anzeige":"Büro","erkl":"Deutsches Büro Grüne Karte: zuständig, wenn ein ausländisches Auto in Deutschland einen Unfall verursacht (§ 10 Abs. 1 AuslPflVG)."},{"wort":"SRB","anzeige":"SRB","erkl":"Schadenregulierungsbeauftragter: bearbeitet und reguliert den Schaden in Deutschland im Auftrag des ausländischen Versicherers (§ 163 Abs. 1 VAG)."},{"wort":"ZENTRALRUF","anzeige":"Zentralruf","erkl":"Zentralruf der Autoversicherer: nennt als Auskunftsstelle Versicherer und SRB (§ 8a PflVG)."},{"wort":"EWR","anzeige":"EWR","erkl":"Die EU-Staaten und Island, Liechtenstein, Norwegen: Für Fahrzeuge von dort gibt es einen SRB in Deutschland (§ 163 Abs. 1 VAG)."},{"wort":"TÜRKEI","anzeige":"Türkei","erkl":"Weder EU noch EWR: Schädigt dort ein türkisches Auto Sabine, gibt es keinen SRB in Deutschland; sie wendet sich selbst an den türkischen Versicherer (§ 163 Abs. 1 und 4 VAG)."}],"abschluss":"Drei Fälle, drei Wege: Ausländisches Auto verursacht einen Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG). Unfall im EU- oder EWR-Ausland, Geschädigter wohnt in Deutschland: SRB des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG). Sie verursachen selbst einen Unfall im Ausland: Ihre Kfz-Haftpflicht zahlt, mindestens im Umfang Ihres Vertrags (Ziff. A.1.4.1 AKB) – Merkkasten TE 4."},"5":{"typ":"fahren","titel":"Schadenfrei fahren","intro":"Ein neuer Vertrag ohne Sondereinstufung beginnt in Klasse 0 (Ziff. I.2.1). Fahren Sie drei volle Kalenderjahre ohne Unfall: Zum 1. Januar führt das erste schadenfreie Jahr direkt in SF 1, jedes weitere eine Klasse höher. Mit den Pfeilen oder durch Antippen der linken oder rechten Fahrbahnhälfte wechseln Sie die Spur.","start":"Klasse 0","jahre":[{"klasse":"SF 1","text":"1. Januar: Aus Klasse 0 führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1)."},{"klasse":"SF 2","text":"1. Januar: Ein weiteres schadenfreies Kalenderjahr bringt eine Klasse mehr: SF 2 (Ziff. I.3.2)."},{"klasse":"SF 3","text":"1. Januar: SF 3 (Ziff. I.3.2)."}],"unfall":"Unfall verursacht! Dieses Jahr ist nicht schadenfrei, eine Besserstufung gibt es dafür nicht (Ziff. I.3.2). Im Spiel fahren Sie es noch einmal von Januar an; was ein Schaden in Wirklichkeit für die SF-Klasse bedeutet, klären Sie in TE 6.","takt":{"normal":380,"ruhig":620},"ticks_je_monat":2,"spuren":3,"reihen":8,"dichte":0.5,"seed":2026,"abschluss":"Drei schadenfreie Kalenderjahre: Klasse 0 → SF 1 → SF 2 → SF 3 (Ziff. I.3.4.1, I.3.2). Je höher die SF-Klasse, desto niedriger der Beitragssatz (Anhang 1 der AKB 2021, Tabelle 1.1)."}},"karteikarten":{"intervalle":[1,3,7]},"einschaetzung":[{"t":"sehr sicher","von":80,"bis":100},{"t":"eher sicher","von":60,"bis":79},{"t":"eher unsicher","von":40,"bis":59},{"t":"unsicher","von":0,"bis":39}]}</script>

    if (S.theme) document.documentElement.dataset.lzTheme = '1'; else delete document.documentElement.dataset.lzTheme;
  }

  // ------------------------------------------------------------ Start
  document.getElementById('k-eyebrow').textContent = 'Lernzentrale · ' + D.ls.nr + ' · LF 6';
  document.getElementById('k-titel').textContent = D.ls.titel;
  document.getElementById('k-meta').textContent = D.klasse + ' · Agentur Wendler, Halle-Neustadt · Stand ' + D.stand;
  document.getElementById('fuss').textContent = 'Lernzentrale ' + D.ls.nr + ' · Übungsangebot ohne Bewertung · Fortschritt nur in diesem Browser · Stand ' + D.stand + ' · BbS IV „Friedrich List“ Halle (Saale)';
  const reiter = document.getElementById('reiter');
  BEREICHE.forEach(b => reiter.appendChild(el('button', { type: 'button', data: { b: b[0] }, onclick: () => geh(b[0]) }, b[1])));
  anwendenAnsicht();
  const anker = (location.hash || '').slice(1);
  const mt = anker.match(/^te(\d+)$/);
  if (mt && TE[Number(mt[1])] && TE[Number(mt[1])].verfuegbar) geh('te', Number(mt[1]), true);
  else if (BEREICHE.some(b => b[0] === anker)) geh(anker, null, true);
  else geh('kompass', null, true);
})();
