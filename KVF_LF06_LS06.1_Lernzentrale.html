n Sommer mit dem Auto fahren will?","ziel":"Sie ordnen einem Schaden die Sparte der Kfz-Versicherung mit der Ziffer der AKB 2021 zu und prüfen für ein Reiseziel in zwei Schritten, welche Sparten dort gelten und wie sich der Schutz erweitern lässt.","lehrbuch":"S. 21–22 oben, S. 24 unten–25 (8. Aufl.: S. 448–449, 451–452)","abschnitt":"A 1.2.1 „Versicherungsarten“ und A 1.3 „Geltungsbereich der Kraftfahrtversicherung“","skriptseiten":"S. 8–11","proximus":["Einleitung (Versicherungsarten)","Ziff. A.1.4.1, A.1.4.2","Ziff. A.2.5.1, A.2.5.2","Ziff. A.3.4","Ziff. A.4.3","Ziff. A.5.4","in Übung 1: Ziff. A.1.1.1, A.1.5.3, A.2.3.2, A.3.5.3, A.4.1"],"merke":[{"kopf":"Erst die Sparte, dann das Land","zeilen":["Wessen Schaden? Der eines anderen: Haftpflicht. Das eigene Auto: Kasko. Hilfe unterwegs: Schutzbrief. Der verletzte Fahrer: Fahrerschutz.","Europa und die außereuropäischen Gebiete der EU: Alle Sparten gelten.","Außerhalb: Haftpflicht nur mit IVK, Kasko nur mit Vereinbarung, Schutzbrief und Fahrerschutz gar nicht."]}],"vf":[{"frage":"Welche fünf Versicherungsarten nennen die AKB 2021, und wessen Schaden trägt jede?"},{"frage":"Frau Brehmer will die Teilkasko für ihr Auto kündigen. Ist das Auto danach noch haftpflichtversichert? Begründen Sie."},{"frage":"Nennen Sie die beiden Gebiete, in denen alle Sparten ohne besondere Vereinbarung gelten, und je ein Beispiel für ein außereuropäisches Gebiet der EU (S. 25; 8. Aufl.: S. 451–452)."},{"frage":"Ein Kunde hat eine IVK. Für welche Sparte erweitert sie den Geltungsbereich, und für welche nicht?"}],"akte":{"pruef":"Wessen Schaden trägt welche Sparte – und gilt sie am Reiseziel?","ergebnis":"Pflicht ist nur die Kfz-Haftpflicht. Für Kappadokien braucht Sabine eine IVK (A.1.4.2) und eine Kasko-Vereinbarung (A.2.5.2); ihr Schutzbrief gilt dort nicht.","norm":"§ 1 PflVG; Ziff. A.1.4, A.2.5, A.3.4 AKB","merksatz":"Erst die Sparte, dann das Land: Europa und EU-Gebiete sind gedeckt, alles andere nur mit IVK oder Vereinbarung."},"exit":{"code":"LF6_LS061_TE1X","url":"https://forms.cloud.microsoft/e/kgiSGP3NQb"}},{"nr":2,"titel":"Versicherungspflicht, Deckungssummen und Nachweis","zyklus":"voll","minuten":90,"std":"2–3","woche":3,"verfuegbar":true,"leitfrage":"Wer muss sein Fahrzeug versichern, mit welcher Summe, und wie weist man den Schutz nach?","anlass":"Hendrik Brehmer holt seinen neuen Pkw ab. Weil die Zulassungsstelle am Wochenende geschlossen ist, will er ihn am Freitag, 30.10.2026, zulassen und ab Sonntag, 01.11.2026, fahren. Er fragt Frau Wendler: „Was braucht die Zulassungsstelle von Ihnen, und reicht die gesetzliche Mindestdeckung?“ Luca sitzt dabei. Er soll bald den Kleinwagen seiner Großmutter fahren und hat eigene Fragen. Heute klären Sie, wer versichern muss, welche Summen gelten und wie der Schutz nachgewiesen wird.","ziel":"Sie prüfen die Versicherungspflicht nach § 1 PflVG an drei Merkmalen, nennen die Mindestversicherungssummen je Schadensfall, vergleichen sie mit der Deckung der Proximus und erklären, wie der Schutz bei der Zulassung (eVB) und im Ausland (Grüne Karte) nachgewiesen wird – jeweils mit Norm oder Ziffer.","lehrbuch":"S. 27–29 und S. 34 unten bis S. 36 oben (8. Aufl.: S. 453, 457–458)","abschnitt":"A 2.1 „Bedeutung und Umfang der Versicherungspflicht“: A 2.1.1, A 2.1.6 und A 2.1.7","skriptseiten":"S. 12–17","proximus":["Ziff. A.1.1.1","Ziff. A.1.2","Ziff. A.1.3.1 bis A.1.3.3","Ziff. A.1.4","Ziff. B.2.1","Antrag Kraftfahrt: Deckungsumfang Haftpflicht"],"merke":[{"kopf":"Pflicht – Summe – Nachweis","zeilen":["Pflicht: Halter + Fahrzeug nach § 1a PflVG + Standort im Inland (§ 1 PflVG).","Summe: 7.500.000 € · 1.300.000 € · 50.000 € je Schadensfall, nicht je Person.","Nachweis: bei der Zulassung die eVB-Nummer. Die Grüne Karte ist in Europa und der EU nur Nachweis; außerhalb erweitert erst sie den Schutz (Ziff. A.1.4.2 AKB)."]}],"vf":[{"frage":"Nennen Sie die drei Merkmale des § 1 PflVG und die Pflicht, die daraus folgt."},{"frage":"Luca parkt auf dem Parkplatz eines Supermarkts. Beim Aussteigen schlägt seine Tür gegen ein anderes Auto. Ist das ein Schaden durch den Gebrauch des Fahrzeugs? Begründen Sie mit Norm."},{"frage":"Erklären Sie „je Schadensfall“ an einem Unfall mit drei Verletzten und gesetzlicher Mindestdeckung."},{"frage":"Was ist ein reiner Vermögensschaden? Ist der Verdienstausfall eines Verletzten ein reiner Vermögensschaden?"},{"frage":"Was ist die eVB-Nummer, und wer übermittelt die Versicherungsbestätigung an die Zulassungsbehörde?"}],"akte":{"pruef":"Muss das Fahrzeug versichert werden, mit welcher Summe, und wie wird der Schutz nachgewiesen?","ergebnis":"Hendriks Neuwagen: versicherungspflichtig, Schutz spätestens ab der Zulassung am 30.10.2026, eVB-Nummer an die Zulassungsstelle; Empfehlung 100 Mio. € pauschal statt Mindestdeckung.","norm":"§ 1, § 1a PflVG · Anlage zu § 4 Abs. 2 PflVG · § 49 FZV · Ziff. A.1.3, B.2.1 AKB","merksatz":"Der Halter muss versichern; die Mindestsumme gilt je Unfall, nicht je Person."},"exit":{"code":"LF6_LS061_TE2X","url":"https://forms.cloud.microsoft/e/uwAqwfw3vB"}},{"nr":3,"titel":"Schutz des Verkehrsopfers","zyklus":"voll","minuten":135,"std":"4–6","woche":3,"verfuegbar":true,"leitfrage":"Wie schützt das Gesetz einen Geschädigten – auch wenn der Versicherer nicht zahlen müsste oder der Schädiger flüchtet?","anlass":"Frau Wendler bespricht mit Hendrik Brehmer die Kundenakte. Er fragt: „Was passiert eigentlich, wenn Luca einen Unfall baut und mit dem Beitrag im Rückstand ist? Und wer zahlt, wenn uns nachts jemand das Auto anfährt und verschwindet?“ Bevor Sie antworten, brauchen Sie drei Dinge: wann sich ein Opfer direkt an den Versicherer wenden kann, wann der Versicherer trotzdem zahlen muss und was er sich danach zurückholt – und wann der Entschädigungsfonds einspringt.","ziel":"Sie prüfen in drei Schritten, wer einem Unfallopfer zahlt: Direktanspruch gegen den Versicherer, Leistungspflicht trotz Leistungsfreiheit oder nach Vertragsende mit Rückgriff beim Kunden, Entschädigungsfonds mit seinen Grenzen – jeweils mit Norm oder Ziffer.","lehrbuch":"S. 36 unten bis S. 45 (8. Aufl.: S. 459–467)","abschnitt":"A 2.2 „Vorschriften zum Schutz des Verkehrsopfers“, A 2.2.1 bis A 2.2.4, dazu „Auf einen Blick zu A 2.2“","skriptseiten":"S. 18–26","proximus":["Ziff. A.1.5.1","Ziff. A.2.2 und A.2.3.2","Ziff. C.2.3 und C.2.4","Ziff. C.5","Ziff. D.2.1 und D.5.3","Ziff. E.1.1, E.7.3 und E.7.4"],"merke":[{"kopf":"Außen zahlt der Versicherer, innen holt er zurück","zeilen":["Direktanspruch: § 115 Abs. 1 S. 1 Nr. 1 VVG.","Leistungsfrei gegenüber dem Kunden heißt nicht leistungsfrei gegenüber dem Opfer (§ 117 Abs. 1 VVG) – aber nur bis zu den Mindestsummen und nachrangig (§ 117 Abs. 3 VVG).","Rückgriff beim Zahlungsverzug in voller Höhe, bei Pflichtverletzungen höchstens 5.000 € oder 2.500 € (Ziff. D.5.3, E.7.3, E.7.4 AKB).","Nach Vertragsende: Nachhaftung bis einen Monat nach der Anzeige (§ 117 Abs. 2 VVG)."]},{"kopf":"Kein Versicherer? Dann der Fonds – aber zuletzt","zeilen":["Fahrerflucht, keine Versicherung, Vorsatz: § 12 Abs. 1 S. 1 Nr. 1 bis 3 PflVG.","Der Fonds zahlt nur, was sonst niemand zahlt.","Bei Fahrerflucht: Sachschaden nur über 500 €; Auto und Einrichtungen nur, wenn ein Mensch getötet oder erheblich verletzt wurde."]}],"vf":[{"frage":"Das Schaubild auf S. 37 (8. Aufl.: S. 460) zeigt drei Ansprüche. Wer hat gegen wen welchen Anspruch?"},{"frage":"Was ist ein „krankes“ Versicherungsverhältnis? Trennen Sie Innen- und Außenverhältnis."},{"frage":"Welche zwei Einschränkungen gelten, wenn der Versicherer nur wegen § 117 VVG zahlt – und wann entfällt eine davon?"},{"frage":"Ein Vertrag endet am 02.10.2026. Die Proximus zeigt das am 05.10.2026 der Zulassungsstelle an. Am 28.10.2026 verursacht der frühere Kunde einen Unfall. Muss die Proximus dem Opfer zahlen, und was verlangt sie danach vom früheren Kunden?"},{"frage":"Nennen Sie drei Fälle, in denen der Entschädigungsfonds einspringt, jeweils mit Nummer."},{"frage":"Warum zahlt der Fonds „subsidiär“? Nennen Sie zwei Stellen, an die er das Opfer zuerst verweist."},{"frage":"Bei Fahrerflucht gelten drei Grenzen. Welche? Rechnen Sie: Was zahlt der Fonds bei einem Sachschaden von 1.200 € an einem Gartenzaun?"},{"frage":"Der Fonds hat einem Opfer 4.000 € gezahlt. Später wird der unversicherte Fahrer gefunden. Was geschieht?"}],"akte":{"pruef":"Wer zahlt dem Opfer: der Versicherer trotz Leistungsfreiheit oder nach Vertragsende – oder der Entschädigungsfonds?","ergebnis":"Luca im Beitragsrückstand: Die Proximus zahlt dem Opfer und holt sich alles von Luca zurück. Fahrerflucht am Familien-Pkw: Ohne Vollkasko tragen die Brehmers den Schaden selbst.","norm":"§§ 115, 116, 117 VVG · § 12 PflVG · Ziff. C.2.3, D.5.3, E.7.3 AKB","merksatz":"Außen zahlt der Versicherer, innen holt er zurück – der Fonds zahlt nur, was sonst keiner zahlt."},"exit":{"code":"LF6_LS061_TE3X","url":"https://forms.cloud.microsoft/e/ggGT6xGmvH"}},{"nr":4,"titel":"Unfall im Ausland","zyklus":"kurz","minuten":45,"std":"7","woche":3,"verfuegbar":true,"leitfrage":"Wer hilft den Brehmers, wenn ein Unfall über die Grenze geht – und wer zahlt?","anlass":"Sabine Brehmer fährt mit dem Familien-Pkw in die Türkei, über Österreich, Ungarn, Serbien und Bulgarien. Sie fragt Frau Wendler: „Was mache ich, wenn mir unterwegs jemand ins Auto fährt? Und wenn ich selbst einen Unfall baue?“ Außerdem ist in Halle (Saale) gerade ein Auto mit polnischem Kennzeichen auf den Familien-Pkw aufgefahren. Heute klären Sie, welche Stelle in welchem Fall zuständig ist.","ziel":"Sie bestimmen für einen Unfall mit Auslandsbezug die zuständige Stelle – Deutsches Büro Grüne Karte, Schadenregulierungsbeauftragter, Entschädigungsstelle oder der ausländische Versicherer selbst – und den Umfang des Schutzes nach Ziff. A.1.4.1 AKB, jeweils mit Norm oder Ziffer.","lehrbuch":"S. 46–47 (8. Aufl.: S. 468–469)","abschnitt":"A 2.3 „Zuständigkeiten und internationale Vereinbarungen für die Regulierung von Unfällen mit Ausländern“ und A 2.3.1 „Schadenregulierung im Rahmen des Grüne-Karte-Systems“","skriptseiten":"S. 27–30","proximus":["Ziff. A.1.1.1","Ziff. A.1.4.1","Ziff. A.1.4.2","Ziff. A.1.5.3"],"merke":[{"kopf":"Drei Fälle, drei Wege","zeilen":["Ausländisches Auto verursacht einen Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG).","Unfall im EU- oder EWR-Ausland, Geschädigter wohnt in Deutschland: SRB des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG); Auskunft beim Zentralruf (§ 8a PflVG); notfalls Entschädigungsstelle (§ 15 PflVG).","Sie verursachen selbst einen Unfall im Ausland: Ihre Kfz-Haftpflicht zahlt, mindestens im Umfang Ihres Vertrags (Ziff. A.1.4.1 AKB)."]}],"vf":[{"frage":"Nach welchen drei Merkmalen ordnet die Tabelle auf S. 46 (8. Aufl.: S. 468) einen Unfall einer zuständigen Stelle zu?"},{"frage":"Unter welchen Voraussetzungen können Sie nach einem Unfall in Deutschland mit einem ausländischen Auto das Deutsche Büro Grüne Karte in Anspruch nehmen (S. 47; 8. Aufl.: S. 469)?"},{"frage":"Was bedeutet Passivlegitimation des Deutschen Büros Grüne Karte, und ändert sich daran etwas, wenn das Büro einen Versicherer mit der Regulierung beauftragt?"},{"frage":"Wozu gibt es den Schadenregulierungsbeauftragten, und wie erfahren Sie, wer es im Einzelfall ist?"}],"akte":{"pruef":"Wo war der Unfall, wer hat ihn verursacht – und welche Stelle ist zuständig?","ergebnis":"Polnisches Auto in Halle (Saale): Deutsches Büro Grüne Karte. Schaden in Budapest: SRB des ungarischen Versicherers in Deutschland. Schaden in der Türkei: selbst beim türkischen Versicherer. Sabine verursacht einen Schaden: Die Proximus zahlt, mindestens nach ihrem Vertrag.","norm":"§ 10 Abs. 1 AuslPflVG; § 163 Abs. 1 VAG; § 8a PflVG; Ziff. A.1.4.1 AKB","merksatz":"Wer im EU-Ausland geschädigt wird, meldet den Schaden zu Hause an; wer im Ausland schädigt, ist über die eigene Kfz-Haftpflicht geschützt."},"exit":{"code":"LF6_LS061_TE4X","url":"https://forms.cloud.microsoft/e/8QDYbbm7Yc"}},{"nr":5,"titel":"Tarif und Schadenfreiheitsrabatt","zyklus":"voll","minuten":90,"std":"8–9","woche":3,"verfuegbar":true,"leitfrage":"Wie berechnet die Proximus den Beitrag für Hendrik Brehmers Neuwagen – und in welche SF-Klasse kommt Luca?","anlass":"Hendrik Brehmer fährt ab 01.11.2026 seinen neuen Golf und fragt Frau Wendler, was die Kfz-Haftpflicht kostet. Im selben Gespräch will er wissen, ob Luca den Kleinwagen der Großmutter selbst versichern oder als Zweitwagen der Eltern fahren soll. Heute klären Sie, wie der Tarif der Proximus aus der Tarifprämie einen Beitrag macht und welche SF-Klasse ein neuer Vertrag bekommt.","ziel":"Sie bestimmen für einen Pkw die Tarifmerkmale mit Proximus 5, stufen einen neuen Vertrag mit Ziffer in die richtige SF-Klasse ein, berechnen den Kfz-Haftpflichtbeitrag aus der Tarifprämie und wägen für einen Fahranfänger eigenen Vertrag und Zweitwagen gegeneinander ab.","lehrbuch":"S. 59 bis S. 65 (8. Aufl.: S. 481–487)","abschnitt":"A 3.1.2 „Besonderheiten in Antrag und Tarif bei Proximus 5“","skriptseiten":"S. 31–36","proximus":["Ziff. I.2.1 bis I.2.4 AKB 2021","Ziff. I.3.1, I.3.2 und I.3.4 AKB 2021","Anhang 1, Tabelle 1.1 (SF-Klassen und Beitragssätze Pkw)","Tarif zur Kraftfahrtversicherung: Nachlässe und Zuschläge, Zahlungsweise, Versicherungsteuer","Kennzeichenverzeichnis (Regionalklassen) und Typklassenverzeichnis Pkw","Antrag auf Kraftfahrzeugversicherung, Feld „Fahrzeugnutzerkreis“"],"merke":[{"kopf":"Erst der Beitragssatz, dann die Nachlässe","zeilen":["Die Tarifprämie (100 %) kommt aus dem Tarifrechner; WKZ, Regional- und Typklasse stecken darin.","Neuer Vertrag: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt.","Nachlässe nacheinander, dann die Zahlungsweise, zuletzt 19 % Versicherungsteuer."]}],"vf":[{"frage":"Der Tarifrechner nennt für ein Auto eine Tarifprämie von 800,00 €. Welche Tarifmerkmale stecken schon darin, und was rechnen Sie selbst mit Proximus 5 ein?"},{"frage":"Warum dürfen Sie für die Brehmers aus Halle (Saale) nicht die Regionalklasse von SK (Saalekreis) nehmen?"},{"frage":"Nennen Sie die drei Sondereinstufungen nach Ziff. I.2.2 mit SF-Klasse. An welcher Voraussetzung scheitern Fahranfänger meistens?"},{"frage":"Ein neuer Vertrag beginnt in Klasse 0 und bleibt schadenfrei. Welche Klasse gilt am 1. Januar des Folgejahres bei Beginn am 01.03., welche bei Beginn am 01.09.?"}],"akte":{"pruef":"Welche SF-Klasse, welche Klassen und welche Nachlässe gelten für einen neuen Pkw-Vertrag – und was kostet er?","ergebnis":"Golf: SF 3 (46 %), Typklasse KH 13, −10 % Neuwagen, +5 % Fahrleistung, −10 % Eigenheim, −10 % Partner: 258,74 € im Jahr. Luca: eigener Vertrag in Klasse 0 (85 %) oder Zweitwagen auf Hendrik in SF 1 (52 %).","norm":"Ziff. I.2.1, I.2.2.2, I.2.2.3, I.3.2 AKB 2021 · Anhang 1 · Tarif: Nachlässe und Zuschläge","merksatz":"Erst der Beitragssatz, dann die Nachlässe – und eine Sondereinstufung nur, wenn jede Voraussetzung stimmt."},"exit":{"code":"LF6_LS061_TE5X","url":"https://forms.cloud.microsoft/e/aRNJjsu3gZ"}},{"nr":6,"titel":"Schadenverlauf übernehmen und Rückstufung","zyklus":"voll","minuten":90,"std":"10–11","woche":4,"verfuegbar":false},{"nr":7,"titel":"Vorläufige Deckung und Stilllegung","zyklus":"voll","minuten":90,"std":"12–13","woche":4,"verfuegbar":false}],"stationen":{"1":{"titel":"Welche Sparte? Welches Land?","untertitel":"Frau Wendler sortiert Schadenmeldungen und Reiseziele der Brehmers.","items":[{"id":"t1-09","typ":"frei","art":"abruf","titel":"Außerhalb von Europa und der EU","akte":"Kurzantwort","frage":"Ein Kunde fährt mit seinem Auto in ein Land außerhalb von Europa und der EU. Was gilt dort für Kfz-Haftpflicht, Kasko, Autoschutzbrief und Fahrerschutz? Nennen Sie jeweils die Ziffer.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Was gilt außerhalb von Europa und der EU für jede Sparte?","kategorien":["gilt mit IVK","gilt nur mit gesonderter Vereinbarung","keine Erweiterung vorgesehen"],"zeilen":[{"text":"Kfz-Haftpflicht","kat":0,"erkl":"Die IVK erweitert die Haftpflicht auf die Länder, die auf ihr nicht durchgestrichen sind (Ziff. A.1.4.2)."},{"text":"Kasko","kat":1,"erkl":"Die IVK erweitert die Kasko nicht; sie braucht eine eigene Vereinbarung (Ziff. A.2.5.2)."},{"text":"Autoschutzbrief","kat":2,"erkl":"Für den Schutzbrief sehen die AKB keine Erweiterung vor (Ziff. A.3.4)."},{"text":"Fahrerschutz","kat":2,"erkl":"Auch der Fahrerschutz lässt sich nach den AKB nicht erweitern (Ziff. A.4.3)."}]},"kernpunkte":["Kfz-Haftpflicht nur mit IVK, auf der das Land nicht durchgestrichen ist (Ziff. A.1.4.2)","Kasko nur mit gesonderter Vereinbarung (Ziff. A.2.5.2)","Autoschutzbrief: keine Erweiterung vorgesehen (Ziff. A.3.4)","Fahrerschutz: keine Erweiterung vorgesehen (Ziff. A.4.3)"],"muster":"Die Kfz-Haftpflicht gilt dort nur, wenn der Kunde eine IVK erhalten hat und das Land darauf nicht durchgestrichen ist (Ziff. A.1.4.2). Die Kasko gilt nur mit einer gesonderten Vereinbarung (Ziff. A.2.5.2). Für Autoschutzbrief und Fahrerschutz sehen die AKB keine Erweiterung vor (Ziff. A.3.4, A.4.3).","erkl":"Merkkasten TE 1: Außerhalb von Europa und der EU gilt die Haftpflicht nur mit IVK, die Kasko nur mit Vereinbarung, Schutzbrief und Fahrerschutz gar nicht."},{"id":"t1-01","typ":"zuordnung","titel":"Wer zahlt welchen Schaden?","akte":"Schadenmeldungen","fall":"Frau Wendler hat fünf Meldungen der Brehmers notiert. Nehmen Sie an, dass die passende Sparte jeweils vereinbart ist.","frage":"Ordnen Sie jedem Schaden die Sparte zu, die leistet.","kategorien":["Kfz-Haftpflicht (A.1)","Kasko (A.2)","Autoschutzbrief (A.3)","Fahrerschutz (A.4)"],"zeilen":[{"text":"Sabine streift beim Einparken den Gartenzaun eines Nachbarn.","kat":0,"erkl":"Eine fremde Sache ist beschädigt: Kfz-Haftpflicht, Ziff. A.1.1.1 b."},{"text":"Ein Sturm wirft einen Ast auf Hendriks geparkten Golf.","kat":1,"erkl":"Schaden am eigenen Auto durch Sturm: Teilkasko, Ziff. A.2.2."},{"text":"Lucas Kleinwagen bleibt auf der Autobahn bei Leipzig mit einer Panne liegen und wird in die Werkstatt geschleppt.","kat":2,"erkl":"Hilfe unterwegs nach einer Panne: Autoschutzbrief, Ziff. A.3.5."},{"text":"Hendrik kommt bei Glätte allein von der Straße ab und verletzt sich. Sonst ist niemand beteiligt.","kat":3,"erkl":"Personenschaden des Fahrers selbst: Fahrerschutz, Ziff. A.4.1."},{"text":"Luca verletzt beim Abbiegen eine Radfahrerin.","kat":0,"erkl":"Personenschaden eines anderen: Kfz-Haftpflicht, Ziff. A.1.1.1."}],"erkl":"Fragen Sie immer zuerst: Wessen Schaden? Der eines anderen: Haftpflicht. Das eigene Auto: Kasko. Hilfe unterwegs: Schutzbrief. Der verletzte Fahrer: Fahrerschutz (Merkkasten TE 1)."},{"id":"t1-02","typ":"mc","titel":"Eigenes Auto nach selbst verschuldetem Unfall","akte":"Kundengespräch","fall":"Hendrik verschuldet mit dem Golf einen Auffahrunfall. Er fragt, warum seine Kfz-Haftpflicht die Reparatur seines eigenen Autos nicht bezahlt.","frage":"Welche Antwort ist fachlich richtig?","optionen":["Die Kfz-Haftpflicht zahlt nicht für das versicherte Fahrzeug selbst; den Unfallschaden am eigenen Auto trägt nur eine Vollkasko.","Bei einem selbst verschuldeten Unfall zahlt keine Sparte der Kfz-Versicherung.","Die Kfz-Haftpflicht zahlt nur Personenschäden, keine Sachschäden.","Die Teilkasko reicht, weil sie alle Schäden am eigenen Auto übernimmt."],"richtig":0,"warum":[null,"Doch: Die Vollkasko zahlt auch einen selbst verschuldeten Unfall (Ziff. A.2.3.2).","Die Kfz-Haftpflicht zahlt auch Sachschäden, aber nur die anderer (Ziff. A.1.1.1 b).","Die Teilkasko deckt nur die Ereignisse der Ziff. A.2.2, etwa Diebstahl, Sturm oder Hagel, keinen selbst verschuldeten Unfall."],"erkl":"Ziff. A.1.5.3 AKB: Die Beschädigung des versicherten Fahrzeugs selbst ist in der Kfz-Haftpflicht nicht versichert. Einen Unfallschaden am eigenen Auto zahlt die Vollkasko (Ziff. A.2.3.2)."},{"id":"t1-03","typ":"mc","titel":"Eine Sparte kündigen","akte":"Notiz","fall":"Hendrik will für sein Motorrad nur die Teilkasko kündigen.","frage":"Was gilt danach für die Kfz-Haftpflicht des Motorrads?","optionen":["Sie bleibt bestehen; jede Sparte ist ein rechtlich selbstständiger Vertrag.","Sie endet mit der Teilkasko, weil beide ein Vertrag sind.","Sie ruht, bis eine neue Teilkasko abgeschlossen ist.","Sie wird in eine Vollkasko umgewandelt."],"richtig":0,"erkl":"Die AKB 2021 fassen rechtlich selbstständige Verträge zusammen (Einleitung). Die Kündigung eines Vertrags berührt die anderen nicht (Ziff. G.4.1)."},{"id":"t1-04","typ":"urteil","titel":"Grüne Karte für Kappadokien","sprecher":"Sabine Brehmer","aussage":"„Wenn ich mir die Grüne Karte besorge, bin ich in Kappadokien rundum versichert – auch mit meiner Teilkasko.“","urteil":"stimmt nicht","normfrage":"Auf welche Ziffer stützen Sie das Urteil zur Teilkasko?","normoptionen":["Ziff. A.2.5.2 AKB","Ziff. A.1.4.2 AKB","Ziff. A.3.4 AKB","§ 1 PflVG"],"norm":0,"erkl":"Die Internationale Versicherungskarte (Grüne Karte) erweitert nur die Kfz-Haftpflicht auf die dort genannten, nicht durchgestrichenen Länder (Ziff. A.1.4.2). Für die Kasko außerhalb von Europa und der EU braucht Sabine eine gesonderte Vereinbarung (Ziff. A.2.5.2)."},{"id":"t1-05","typ":"zuordnung","titel":"Wo liegt das Reiseziel?","frage":"Ordnen Sie jedes Reiseziel dem richtigen Gebiet zu.","kategorien":["Europa (geografisch)","außereuropäisches Gebiet der EU","außerhalb von beidem"],"zeilen":[{"text":"Serbien","kat":0,"erkl":"Serbien gehört nicht zur EU, liegt aber in den geografischen Grenzen Europas."},{"text":"Réunion","kat":1,"erkl":"Réunion gehört zur EU, liegt aber nicht in Europa (Lehrbuch S. 25)."},{"text":"Tunesien","kat":2,"erkl":"Tunesien liegt weder in Europa noch gehört es zur EU."},{"text":"Martinique","kat":1,"erkl":"Martinique zählt das Lehrbuch zu den außereuropäischen Gebieten der EU (S. 25)."},{"text":"Istanbul (europäischer Teil)","kat":0,"erkl":"Der europäische Teil Istanbuls liegt in Europa."},{"text":"Kappadokien (Anatolien)","kat":2,"erkl":"Kappadokien liegt im asiatischen Teil der Türkei, außerhalb Europas und der EU."}],"erkl":"Europa und die außereuropäischen Gebiete der EU sind ohne Vereinbarung gedeckt (Ziff. A.1.4.1, A.2.5.1, A.3.4, A.4.3). Für alles andere fragen Sie je Sparte nach einer Erweiterung."},{"id":"t1-06","typ":"mc","titel":"Untergrenze im Besuchsland","frage":"Die KfzPflVV verlangt im Ausland als Untergrenze nur den in Deutschland vorgeschriebenen Umfang. Was sehen die AKB 2021 der Proximus darüber hinaus vor?","optionen":["Es gilt der Umfang des Besuchslands, mindestens aber der des eigenen Vertrags.","Es gilt immer der Umfang des Besuchslands, auch wenn er niedriger ist als der Vertrag.","Es gilt nur die Summe, die auf der Grünen Karte steht.","Im Ausland gelten stets 100 Mio. € pauschal."],"richtig":0,"erkl":"Ziff. A.1.4.1 Satz 2 AKB: maßgeblich ist der im Besuchsland vorgeschriebene Umfang, mindestens aber der Umfang des eigenen Vertrags. § 1 Abs. 1 KfzPflVV verlangt nur den deutschen Mindestumfang."},{"id":"t1-07","typ":"mc","titel":"Mit dem Auto nach Tunesien","akte":"Kundengespräch","fall":"Ein Kunde hat Kfz-Haftpflicht und Autoschutzbrief, keine Kasko. Er nimmt sein Auto per Fähre mit nach Tunesien.","frage":"Was empfehlen Sie ihm?","optionen":["Eine IVK anfordern, auf der Tunesien nicht durchgestrichen ist; der Schutzbrief hilft ihm in Tunesien nicht.","Eine gesonderte Vereinbarung für den Schutzbrief beantragen.","Nichts regeln: Tunesien liegt am Mittelmeer und damit im Geltungsbereich.","Eine Kasko-Vereinbarung abschließen; sie erweitert auch die Haftpflicht."],"richtig":0,"warum":[null,"Für den Schutzbrief sehen die AKB keine Erweiterung vor (Ziff. A.3.4).","Tunesien liegt weder in Europa noch gehört es zur EU (Ziff. A.1.4.1).","Eine Kasko-Vereinbarung (Ziff. A.2.5.2) hilft der Haftpflicht nicht; dafür braucht es die IVK."],"erkl":"Haftpflicht außerhalb von Europa und der EU nur mit IVK (Ziff. A.1.4.2). Der Schutzbrief gilt in Europa und den außereuropäischen EU-Gebieten, eine Erweiterung ist nicht vorgesehen (Ziff. A.3.4)."},{"id":"t1-08","typ":"reihe","titel":"Prüfreihenfolge Geltungsbereich","frage":"Bringen Sie die Prüfschritte in die Reihenfolge, die das Skript vorgibt.","schritte":["Sparte bestimmen: Wessen Schaden trägt welche Sparte?","Ort prüfen: Europa oder außereuropäisches Gebiet der EU?","Liegt der Ort außerhalb: je Sparte nach einer Erweiterung fragen (IVK, gesonderte Vereinbarung)","Dem Kunden empfehlen, was die Agentur regelt – mit Ziffer"],"erkl":"Merkkasten TE 1: Erst die Sparte, dann das Land. Außerhalb von Europa und der EU klären Sie je Sparte die Erweiterung (Ziff. A.1.4.2, A.2.5.2)."},{"id":"t1-10","typ":"frei","art":"erklaerung","titel":"Warum die Haftpflicht das eigene Auto nicht zahlt","akte":"Kundengespräch","frage":"Erklären Sie einem Kunden in zwei Sätzen, warum seine Kfz-Haftpflicht nach einem selbst verschuldeten Unfall den Schaden an seinem eigenen Auto nicht bezahlt und welche Versicherung er dafür braucht.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für den Kunden?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die Kfz-Haftpflicht zahlt die Schäden, die Sie mit dem Auto anderen zufügen.","kat":0,"erkl":"So regelt es Ziff. A.1.1.1: Geschützt ist der Geschädigte."},{"text":"Ihr eigenes Auto ist in der Haftpflicht nicht versichert.","kat":0,"erkl":"Ziff. A.1.5.3 nimmt Schäden am versicherten Fahrzeug selbst aus."},{"text":"Den Unfallschaden an Ihrem Auto zahlt die Teilkasko.","kat":1,"erkl":"Die Teilkasko greift etwa bei Diebstahl oder Hagel (Ziff. A.2.2); einen Unfallschaden zahlt erst die Vollkasko (Ziff. A.2.3.2)."},{"text":"Weil Sie den Unfall verschuldet haben, zahlt keine Sparte der Kfz-Versicherung.","kat":1,"erkl":"Die Vollkasko zahlt auch einen selbst verschuldeten Unfall (Ziff. A.2.3.2)."}]},"kernpunkte":["Die Kfz-Haftpflicht deckt Schäden, die er mit dem Fahrzeug anderen zufügt (Ziff. A.1.1.1)","Das versicherte Fahrzeug selbst ist in der Haftpflicht nicht versichert (Ziff. A.1.5.3)","Für einen Unfallschaden am eigenen Auto braucht er eine Vollkasko (Ziff. A.2.3.2)"],"muster":"Ihre Kfz-Haftpflicht zahlt nur die Schäden, die Sie mit dem Auto anderen zufügen; das versicherte Auto selbst ist davon ausgenommen (Ziff. A.1.1.1, A.1.5.3). Den Unfallschaden an Ihrem eigenen Auto zahlt nur eine Vollkasko (Ziff. A.2.3.2).","erkl":"Erst die Sparte bestimmen: Wessen Schaden? Der eines anderen gehört in die Haftpflicht, das eigene Auto in die Kasko (Merkkasten TE 1)."}]},"2":{"titel":"Pflicht – Summe – Nachweis","untertitel":"Wer muss versichern, mit welcher Summe, und wie wird der Schutz nachgewiesen?","items":[{"id":"t2-10","typ":"frei","art":"abruf","titel":"Mindestversicherungssummen","akte":"Kurzantwort","frage":"Nennen Sie die drei gesetzlichen Mindestversicherungssummen mit ihrer Schadenart und sagen Sie, ob sie je Person oder je Schadensfall gelten.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Welche gesetzliche Mindestversicherungssumme je Schadensfall gilt?","kategorien":["7.500.000 €","1.300.000 €","50.000 €"],"zeilen":[{"text":"Personenschäden aller Verletzten eines Unfalls zusammen","kat":0,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 7.500.000 € je Schadensfall, nicht je Person."},{"text":"Sachschäden","kat":1,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 1.300.000 € je Schadensfall."},{"text":"Reine Vermögensschäden","kat":2,"erkl":"Anlage zu § 4 Abs. 2 PflVG: 50.000 € für Vermögensschäden ohne Personen- oder Sachschaden."},{"text":"Verdienstausfall eines Verletzten","kat":0,"erkl":"Der Verdienstausfall folgt aus der Verletzung und gehört zum Personenschaden: Es gilt die Summe für Personenschäden, nicht die 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 PflVG)."}]},"kernpunkte":["7.500.000 € für Personenschäden","1.300.000 € für Sachschäden","50.000 € für reine Vermögensschäden","je Schadensfall, nicht je Person (Anlage zu § 4 Abs. 2 PflVG)"],"muster":"Je Schadensfall mindestens 7.500.000 € für Personenschäden, 1.300.000 € für Sachschäden und 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 PflVG). Alle Verletzten eines Unfalls teilen sich die 7.500.000 €.","erkl":"Merkkasten TE 2: 7.500.000 € · 1.300.000 € · 50.000 € je Schadensfall, nicht je Person."},{"id":"t2-01","typ":"mc","titel":"Wer muss versichern?","akte":"Notiz","fall":"Ingrid Brehmer bleibt Halterin ihres Kleinwagens. Luca fährt ihn ab November regelmäßig.","frage":"Wen trifft die Versicherungspflicht nach § 1 PflVG?","optionen":["Ingrid als Halterin; Luca ist als Fahrer mitversichert.","Luca, weil er das Auto regelmäßig fährt.","Ingrid und Luca müssen je einen eigenen Vertrag abschließen.","Niemand, weil Ingrid selbst nicht mehr fährt."],"richtig":0,"erkl":"§ 1 PflVG verpflichtet den Halter. Fahrer und Eigentümer sind mitversichert (§ 4 Abs. 3 PflVG, Ziff. A.1.2 AKB)."},{"id":"t2-02","typ":"stufen","titel":"Pflicht-Check: Sabines S-Pedelec","akte":"Pflicht-Check","fall":"Sabine kauft ein S-Pedelec. Sein Motor unterstützt sie auch über 25 km/h hinaus. Es steht in Halle (Saale); Sabine nutzt es auf eigene Rechnung und bestimmt darüber.","schritte":[{"typ":"mc","frage":"Merkmal 1: Gibt es einen Halter?","optionen":["Ja, Sabine nutzt es auf eigene Rechnung und bestimmt darüber.","Nein, Fahrräder haben keinen Halter.","Nein, Halter ist immer der Händler bis zur Zulassung."],"richtig":0,"erkl":"Halter ist, wer das Fahrzeug auf eigene Rechnung nutzt und darüber bestimmt (Skript TE 2)."},{"typ":"mc","frage":"Merkmal 2: Ist das S-Pedelec ein Fahrzeug nach § 1a Abs. 1 Nr. 1 PflVG?","optionen":["Ja, es ist ein Fahrrad mit Hilfsmotor, das nicht unter § 1 Abs. 3 StVG fällt (Nr. 1 b).","Nein, alles mit Pedalen ist ein Fahrrad.","Nein, nur Fahrzeuge mit Kennzeichen fallen darunter."],"richtig":0,"erkl":"Nur ein Pedelec, das bloß beim Treten und nur bis 25 km/h unterstützt, ist kein Kraftfahrzeug (§ 1 Abs. 3 StVG). Das S-Pedelec unterstützt darüber hinaus."},{"typ":"mc","frage":"Merkmal 3: Hat es seinen Standort im Inland?","optionen":["Ja, in Halle (Saale).","Nein, Fahrräder haben keinen Standort.","Das spielt für die Pflicht keine Rolle."],"richtig":0,"erkl":"Der regelmäßige Standort ist Halle (Saale), also das Inland (§ 1 PflVG)."},{"typ":"mc","frage":"Ergebnis?","optionen":["Sabine muss eine Haftpflichtversicherung abschließen und aufrechterhalten.","Die Versicherung ist freiwillig.","Versichern muss der Händler, der das Rad verkauft hat."],"richtig":0,"erkl":"Alle drei Merkmale liegen vor: Versicherungspflicht nach § 1 PflVG."}],"erkl":"Pflicht-Check in drei Merkmalen: Halter + Fahrzeug nach § 1a PflVG + Standort im Inland (Merkkasten TE 2)."},{"id":"t2-03","typ":"stufen","titel":"Rechenfall Mindestdeckung","akte":"Schadenakte","fall":"Ein Kunde hat nur die gesetzliche Mindestdeckung. Bei einem Unfall werden drei Personen verletzt. Der Personenschaden beträgt zusammen 9.600.000 €, dazu kommt ein Sachschaden von 25.000 €.","schritte":[{"typ":"zahl","frage":"Wie viel zahlt der Versicherer für die Personenschäden?","einheit":"€","loesung":7500000,"weg":"Mindestsumme je Schadensfall für alle Verletzten zusammen: höchstens 7.500.000 € (Anlage zu § 4 Abs. 2 PflVG)."},{"typ":"zahl","frage":"Wie viel zahlt er insgesamt?","einheit":"€","loesung":7525000,"weg":"7.500.000 € + 25.000 € Sachschaden (unter 1.300.000 €) = 7.525.000 €."},{"typ":"zahl","frage":"Welchen Betrag muss der Kunde selbst tragen?","einheit":"€","loesung":2100000,"weg":"9.600.000 € − 7.500.000 € = 2.100.000 € (Ziff. A.1.3.3 AKB)."}],"erkl":"„Je Schadensfall“ heißt: Alle Verletzten eines Unfalls teilen sich die 7.500.000 €. Was die Summe übersteigt, trägt der Kunde selbst (Ziff. A.1.3.3 AKB)."},{"id":"t2-04","typ":"mc","titel":"100 Mio. € pauschal","akte":"Kundengespräch","fall":"Sabine liest im Antrag „100 Mio. € pauschal“ und sagt: „Dann ist jeder Verletzte bis 100 Mio. € gedeckt.“","frage":"Was gilt nach dem Antrag zur Kraftfahrtversicherung in Proximus 5?","optionen":["Innerhalb der 100 Mio. € gilt eine Grenze von höchstens 8 Mio. € je verletzter oder getöteter Person.","Jede verletzte Person ist bis 100 Mio. € gedeckt.","Die 100 Mio. € gelten nur für Sachschäden.","Die 100 Mio. € gelten je Person, die 8 Mio. € je Unfall."],"richtig":0,"erkl":"Antrag Kraftfahrt, Deckungsumfang Haftpflicht: 100 Mio. € pauschal für Personen-, Sach- und Vermögensschäden, höchstens 8 Mio. € je getöteter oder verletzter Person."},{"id":"t2-05","typ":"mc","titel":"Verdienstausfall","frage":"Ein Unfallopfer kann drei Monate nicht arbeiten. Zu welcher Schadenart gehört sein Verdienstausfall?","optionen":["zum Personenschaden","zu den reinen Vermögensschäden (50.000 €)","zum Sachschaden","zu keiner; er ist nicht versichert"],"richtig":0,"warum":[null,"Ein reiner Vermögensschaden hängt weder an einem Personen- noch an einem Sachschaden. Der Verdienstausfall folgt aber aus der Verletzung.","Sachschaden ist ein Schaden an einer Sache.","Der Verdienstausfall ist als Teil des Personenschadens gedeckt."],"erkl":"Der Verdienstausfall folgt aus der Verletzung und gehört zum Personenschaden, nicht zu den 50.000 € für reine Vermögensschäden (Anlage zu § 4 Abs. 2 Nr. 1 c PflVG; Ziff. A.1.1.1 c AKB)."},{"id":"t2-06","typ":"mc","titel":"Was ist kein Gebrauch?","frage":"Welche Situation ist kein Gebrauch des Fahrzeugs im Sinne des § 1a Abs. 3 PflVG?","optionen":["Ein seit Jahren außer Betrieb gesetztes Auto lagert in einer Scheune.","Luca steigt auf dem Supermarktparkplatz aus.","Hendrik belädt vor dem Haus den Kofferraum.","Das Auto steht abgestellt auf dem eigenen Hof."],"richtig":0,"erkl":"Gebrauch ist jede Verwendung als Beförderungsmittel, auch Aussteigen, Beladen und Abstellen, auf der Straße wie auf dem eigenen Hof (§ 1a Abs. 3 PflVG). Ein länger außer Betrieb gesetztes, nur gelagertes Fahrzeug ist nicht in Gebrauch (Lehrbuch S. 29)."},{"id":"t2-07","typ":"mc","titel":"Beginn des vorläufigen Schutzes","akte":"Aktennotiz","fall":"Ein Kunde bekommt von der Proximus am 27.10.2026 die eVB-Nummer. Vereinbarter Beginn ist der 01.11.2026. Der Wagen wird am 29.10.2026 zugelassen.","frage":"Ab wann hat er vorläufigen Schutz in der Kfz-Haftpflicht?","optionen":["ab 29.10.2026","ab 27.10.2026","ab 01.11.2026","erst ab Zahlung des ersten Beitrags"],"richtig":0,"warum":[null,"Die Nennung der Nummer allein startet den Schutz nicht; maßgeblich ist der vereinbarte Zeitpunkt, spätestens der Tag der Zulassung.","Der vereinbarte Beginn liegt nach der Zulassung. Spätestens mit der Zulassung beginnt der Schutz.","Regelfall nach den AKB ist vorläufiger Schutz schon vor der Zahlung (Ziff. B.2.1)."],"erkl":"Ziff. B.2.1 AKB: Mit der eVB-Nummer besteht vorläufiger Schutz ab dem vereinbarten Zeitpunkt, spätestens ab dem Tag der Zulassung – hier also ab 29.10.2026."},{"id":"t2-08","typ":"urteil","titel":"Bestätigung und erster Beitrag","sprecher":"Eine Kollegin in der Agentur","aussage":"„Die Proximus kann die Versicherungsbestätigung von der Zahlung des ersten Beitrags abhängig machen.“","urteil":"stimmt","normfrage":"Welche Norm trägt das Urteil?","normoptionen":["§ 5b Abs. 1 S. 2 PflVG","§ 49 Abs. 2 FZV","Ziff. A.1.3.3 AKB","§ 1a Abs. 3 PflVG"],"norm":0,"erkl":"§ 5b Abs. 1 PflVG: Der Versicherer muss die Bestätigung bei Beginn des Schutzes übermitteln, kann sie aber von der Zahlung der ersten Prämie abhängig machen. Regelfall nach Ziff. B.2.1 AKB ist trotzdem vorläufiger Schutz vor der Zahlung."},{"id":"t2-09","typ":"mc","titel":"Nachweis eines Touristen","frage":"Ein Tourist fährt mit seinem in Polen zugelassenen Auto nach Halle (Saale). Was genügt in Deutschland als Nachweis seiner Haftpflichtversicherung?","optionen":["das amtliche polnische Kennzeichen","eine an der Grenze abgeschlossene Grenzversicherung; das Kennzeichen genügt nicht","eine eVB-Nummer einer deutschen Versicherung","ein deutscher Versicherungsschein"],"richtig":0,"erkl":"Für Fahrzeuge aus der EU und einigen weiteren Staaten gilt schon das Kennzeichen als Nachweis (Lehrbuch S. 35). Fahrer aus anderen Staaten weisen den Schutz mit der Grünen Karte oder einer Grenzversicherung nach (§ 13 AuslPflVG)."},{"id":"t2-11","typ":"frei","art":"erklaerung","titel":"Warum 100 Mio. € pauschal","akte":"Kundengespräch","frage":"Erklären Sie Hendrik in zwei Sätzen, warum Sie ihm 100 Mio. € pauschal statt der gesetzlichen Mindestdeckung empfehlen.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Hendrik?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die 7.500.000 € Mindestdeckung gelten für alle Verletzten eines Unfalls zusammen.","kat":0,"erkl":"Die Mindestsumme gilt je Schadensfall, nicht je Person (Anlage zu § 4 Abs. 2 PflVG)."},{"text":"Mit der Mindestdeckung bekommt jede verletzte Person bis zu 7.500.000 €.","kat":1,"erkl":"Häufiger Irrtum: 7.500.000 € je Schadensfall für alle Verletzten zusammen (Anlage zu § 4 Abs. 2 PflVG)."},{"text":"Was über die Versicherungssumme hinausgeht, zahlen Sie selbst.","kat":0,"erkl":"Der Versicherer zahlt nur bis zur vereinbarten Summe; den Rest trägt der Kunde (Ziff. A.1.3.3 AKB)."},{"text":"Mit 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt.","kat":0,"erkl":"So steht es im Antrag der Proximus: 8 Mio. € je Person innerhalb der 100 Mio. €."}]},"kernpunkte":["Die Mindestsumme für Personenschäden gilt für alle Verletzten eines Unfalls zusammen","Was die Versicherungssumme übersteigt, trägt er selbst (Ziff. A.1.3.3 AKB)","Bei 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt (Antrag Proximus)"],"muster":"Mit der Mindestdeckung stehen für alle Verletzten eines Unfalls zusammen nur 7.500.000 € bereit; was darüber liegt, müssen Sie selbst zahlen (Ziff. A.1.3.3 AKB). Mit 100 Mio. € pauschal ist jede verletzte Person bis 8 Mio. € gedeckt.","erkl":"Je Schadensfall heißt: Mehrere Verletzte teilen sich die Mindestsumme. Den Rest trägt der Kunde (Ziff. A.1.3.3 AKB)."}]},"3":{"titel":"Wer zahlt dem Opfer?","untertitel":"Direktanspruch, krankes Versicherungsverhältnis, Nachhaftung und Entschädigungsfonds.","items":[{"id":"t3-11","typ":"frei","art":"abruf","titel":"Nach dem Vertragsende","akte":"Kurzantwort","frage":"Ein Kfz-Vertrag ist beendet. Wie lange muss der Versicherer dem Opfer noch leisten, ab wann läuft diese Frist, und wer hilft danach?","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Was gilt, wenn ein Kfz-Vertrag beendet ist?","kategorien":["einen Monat","ab der Anzeige an die Zulassungsstelle","ab dem Vertragsende","der Entschädigungsfonds, nachrangig"],"zeilen":[{"text":"Wie lange haftet der Versicherer dem Opfer noch?","kat":0,"erkl":"§ 117 Abs. 2 S. 1 VVG: Nachhaftung von einem Monat."},{"text":"Ab wann läuft die Frist der Nachhaftung?","kat":1,"erkl":"Die Frist beginnt mit der Anzeige des Versicherers an die Zulassungsstelle, nicht mit dem Vertragsende (§ 117 Abs. 2 S. 1 VVG)."},{"text":"Wer hilft dem Opfer, wenn das Auto nach dem Ende der Nachhaftung unversichert einen Unfall verursacht?","kat":3,"erkl":"§ 12 Abs. 1 S. 1 Nr. 2 PflVG: Der Fonds zahlt, aber nur, was sonst niemand zahlt (§ 12 Abs. 1 S. 2 und 3 PflVG)."}]},"kernpunkte":["noch einen Monat (§ 117 Abs. 2 S. 1 VVG)","ab der Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende","danach, wenn das Auto nicht versichert ist, nachrangig der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 2 PflVG)"],"muster":"Der Versicherer haftet dem Opfer noch einen Monat, gerechnet ab seiner Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende (§ 117 Abs. 2 S. 1 VVG). Ist das Auto danach nicht versichert, hilft nachrangig der Entschädigungsfonds (§ 12 Abs. 1 S. 1 Nr. 2 PflVG).","erkl":"Merkkasten TE 3: Nach Vertragsende Nachhaftung bis einen Monat nach der Anzeige (§ 117 Abs. 2 VVG); der Fonds zahlt nur, was sonst niemand zahlt."},{"id":"t3-01","typ":"zuordnung","titel":"Drei Ansprüche","fall":"Luca ist selbst Versicherungsnehmer bei der Proximus und fährt eine Radfahrerin an.","frage":"Ordnen Sie jedem Anspruch seinen Namen zu.","kategorien":["Haftungsanspruch","Deckungsanspruch","Direktanspruch"],"zeilen":[{"text":"Radfahrerin gegen Luca","kat":0,"erkl":"Das Opfer hat gegen den Schädiger einen Haftungsanspruch."},{"text":"Luca gegen die Proximus","kat":1,"erkl":"Der Versicherungsnehmer hat gegen seinen Versicherer einen Deckungsanspruch."},{"text":"Radfahrerin gegen die Proximus","kat":2,"erkl":"Das Opfer kann sich direkt an den Versicherer wenden (§ 115 Abs. 1 S. 1 Nr. 1 VVG)."}],"erkl":"Schaubild Lehrbuch S. 37: Haftungsanspruch Opfer gegen Schädiger, Deckungsanspruch Versicherungsnehmer gegen Versicherer, Direktanspruch Opfer gegen Versicherer."},{"id":"t3-02","typ":"mc","titel":"Gesamtschuldner","frage":"Versicherer und Schädiger haften dem Opfer als Gesamtschuldner. Was heißt das?","optionen":["Jeder schuldet den ganzen Schaden, das Opfer bekommt ihn aber nur einmal.","Jeder zahlt die Hälfte des Schadens.","Das Opfer muss zuerst den Schädiger verklagen.","Das Opfer bekommt den Schaden von beiden, also doppelt."],"richtig":0,"erkl":"§ 115 Abs. 1 S. 4 VVG: Versicherer und Versicherungsnehmer haften als Gesamtschuldner. Jeder schuldet den ganzen Schaden, ersetzt wird er nur einmal."},{"id":"t3-03","typ":"stufen","titel":"Hendrik im Beitragsrückstand","akte":"Schadenakte","fall":"Hendrik hat seinen Folgebeitrag nicht gezahlt. Die Proximus hat ihn qualifiziert gemahnt, die Zahlungsfrist ist abgelaufen. Hendrik hat die Mahnung gelesen und nichts unternommen; gekündigt hat die Proximus nicht. Danach fährt Hendrik einem Motorradfahrer auf. Dessen Schaden: Motorrad 4.000 € (dafür keine eigene Versicherung), Heilbehandlung 3.000 € (seine Krankenkasse übernimmt sie), Schmerzensgeld 2.000 €. Hendrik hat eine gültige Fahrerlaubnis, der Golf ist verkehrssicher.","schritte":[{"typ":"mc","frage":"Hat Hendrik für diesen Unfall Versicherungsschutz?","optionen":["Nein, die Proximus ist ihm gegenüber leistungsfrei.","Ja, weil der Vertrag nicht gekündigt ist.","Ja, aber nur für Personenschäden."],"richtig":0,"erkl":"Offener Beitrag nach Ablauf der Zahlungsfrist aus der qualifizierten Mahnung: kein Versicherungsschutz (Ziff. C.2.3 AKB; § 38 Abs. 2 VVG)."},{"typ":"mc","frage":"Muss die Proximus dem Motorradfahrer trotzdem zahlen?","optionen":["Ja, die Leistungspflicht gegenüber dem Opfer bleibt bestehen.","Nein, ohne Schutz für Hendrik zahlt sie niemandem.","Nein, der Motorradfahrer muss sich an den Entschädigungsfonds wenden."],"richtig":0,"erkl":"Krankes Versicherungsverhältnis: innen leistungsfrei, außen leistungspflichtig (§ 117 Abs. 1 VVG)."},{"typ":"zahl","frage":"Welchen Betrag zahlt die Proximus dem Motorradfahrer?","einheit":"€","loesung":6000,"weg":"Sie zahlt nur nachrangig (§ 117 Abs. 3 S. 2 VVG): Die Heilbehandlung trägt die Krankenkasse; ein Fall des § 3 PflVG liegt nicht vor. Motorrad 4.000 € + Schmerzensgeld 2.000 € = 6.000 €."},{"typ":"mc","frage":"Wie viel holt sich die Proximus danach von Hendrik zurück?","optionen":["die vollen 6.000 € und ihre Aufwendungen, ohne Obergrenze","höchstens 5.000 €","höchstens 2.500 €","nichts, sie haftet ja als Gesamtschuldnerin"],"richtig":0,"erkl":"Rückgriff nach § 116 Abs. 1 VVG. Die Grenzen von 5.000 € und 2.500 € gelten nur für Pflichtverletzungen, nicht beim Zahlungsverzug."}],"erkl":"Merkkasten TE 3: Außen zahlt der Versicherer, innen holt er zurück – beim Zahlungsverzug in voller Höhe."},{"id":"t3-04","typ":"mc","titel":"Rückgriff nach Alkoholfahrt","akte":"Schadenakte","fall":"Hendrik hat pünktlich gezahlt, war aber nach Alkohol nicht in der Lage, sicher zu fahren. Die Proximus zahlt dem Opfer 12.000 €.","frage":"Bis zu welchem Betrag kann sie Hendrik höchstens in Rückgriff nehmen?","optionen":["5.000 €","12.000 €","2.500 €","nichts"],"richtig":0,"warum":[null,"Volle Höhe gilt beim Zahlungsverzug, nicht bei einer Pflichtverletzung.","2.500 € gelten für Pflichtverletzungen im Schadenfall (Ziff. E.7.3).","Die Proximus ist wegen der Pflichtverletzung teilweise leistungsfrei und darf Rückgriff nehmen."],"erkl":"Pflichtverletzung beim Gebrauch (Ziff. D.2.1): Leistungsfreiheit höchstens 5.000 € (Ziff. D.5.3 AKB; § 5 KfzPflVV). Den Rest trägt die Proximus endgültig."},{"id":"t3-05","typ":"mc","titel":"Pflichtverletzung im Schadenfall","frage":"Ein Kunde verletzt nach einem Unfall eine Pflicht im Schadenfall; ein besonders schwerer Fall liegt nicht vor. Wie viel kann die Proximus höchstens zurückverlangen?","optionen":["2.500 €","5.000 €","die volle Leistung","500 €"],"richtig":0,"erkl":"Ziff. E.7.3 AKB: höchstens 2.500 €. Bei vorsätzlicher, besonders schwerer Verletzung der Aufklärungs- oder Schadenminderungspflicht höchstens 5.000 € (Ziff. E.7.4)."},{"id":"t3-06","typ":"stufen","titel":"Nachhaftung","akte":"Aktennotiz","fall":"Ein Kfz-Vertrag endet am 18.01.2027. Die Proximus zeigt das Vertragsende am 21.01.2027 der Zulassungsstelle an. Das Auto wird nicht neu versichert.","schritte":[{"typ":"datum","frage":"Mit Ablauf welches Tages endet die Nachhaftung?","loesung":"21.02.2027","pruef":{"art":"monat","anzeige":"21.01.2027"},"weg":"Ein Monat ab der Anzeige an die Zulassungsstelle, nicht ab dem Vertragsende (§ 117 Abs. 2 S. 1 VVG): Ablauf des 21.02.2027."},{"typ":"mc","frage":"Der frühere Kunde verursacht am 15.02.2027 einen Unfall. Was gilt?","optionen":["Die Proximus zahlt dem Opfer bis zu den Mindestversicherungssummen und holt sich das Geld beim früheren Kunden zurück.","Die Proximus zahlt nicht, weil der Vertrag beendet ist.","Die Proximus zahlt bis zur früher vereinbarten Summe und verzichtet auf den Rückgriff.","Nur der Entschädigungsfonds zahlt."],"richtig":0,"erkl":"Nachhaftung im Rahmen des § 117 Abs. 3 VVG, danach Rückgriff (§ 116 Abs. 1 VVG). Für die Zeit der Nachhaftung verlangt die Proximus die Prämie (Ziff. C.5 AKB)."},{"typ":"mc","frage":"Und bei einem Unfall am 25.02.2027?","optionen":["Die Proximus muss nicht mehr leisten; das Opfer kann sich nachrangig an den Entschädigungsfonds wenden.","Die Proximus zahlt noch bis zum Monatsende.","Die Proximus zahlt wie während der Nachhaftung."],"richtig":0,"erkl":"Die Nachhaftung ist abgelaufen. Für das nicht versicherte Auto springt der Fonds ein, soweit beim Schädiger nichts zu holen ist (§ 12 Abs. 1 S. 1 Nr. 2, S. 2 PflVG)."}],"erkl":"Nachhaftung: noch einen Monat nach der Anzeige an die Zulassungsstelle (§ 117 Abs. 2 VVG)."},{"id":"t3-07","typ":"zahl","titel":"Fahrerflucht am Garagentor","akte":"Schadenmeldung","fall":"In der Nacht beschädigt ein Unbekannter das Garagentor der Brehmers und flüchtet. Schaden 2.150 €. Verletzt wird niemand; keine andere Versicherung zahlt.","frage":"Welchen Betrag zahlt der Entschädigungsfonds?","einheit":"€","loesung":1650,"pruef":{"art":"fonds","schaden":2150},"weg":"Fahrerflucht (§ 12 Abs. 1 S. 1 Nr. 1 PflVG): Sachschäden nur, soweit sie 500 € übersteigen (§ 12 Abs. 2 S. 2 PflVG). 2.150 € − 500 € = 1.650 €.","erkl":"Die 500 € sind ein Abzug, keine Schwelle. Ein Garagentor ist weder ein Fahrzeug noch eine Einrichtung des Verkehrs oder der Versorgung."},{"id":"t3-08","typ":"mc","titel":"Auto bei Fahrerflucht","fall":"Derselbe Unbekannte hat auch Lucas geparkten Kleinwagen beschädigt (1.800 €). Luca hat keine Vollkasko.","frage":"Was zahlt der Fonds für den Kleinwagen?","optionen":["nichts","1.300 €","1.800 €","500 €"],"richtig":0,"warum":[null,"Der Abzug von 500 € gilt für Sachen wie Zäune oder Tore. Fahrzeuge ersetzt der Fonds bei Fahrerflucht nur, wenn ein Mensch getötet oder erheblich verletzt wurde.","Bei Fahrerflucht ersetzt der Fonds Fahrzeugschäden nicht in voller Höhe und hier gar nicht.","500 € sind der Abzug, kein Mindestbetrag."],"erkl":"§ 12 Abs. 2 S. 3 Nr. 1 PflVG: Schäden an Fahrzeugen nur, wenn beim selben Unfall ein Mensch getötet oder erheblich verletzt wurde. Ohne Vollkasko trägt Luca den Schaden selbst."},{"id":"t3-09","typ":"mc","titel":"Der Fonds zahlt subsidiär","frage":"Der Entschädigungsfonds zahlt „subsidiär“. Was bedeutet das?","optionen":["Er zahlt nur, soweit das Opfer weder von Halter, Eigentümer oder Fahrer noch von einem Schadensversicherer oder Sozialversicherungsträger Ersatz bekommt.","Er zahlt immer zuerst; die anderen Stellen danach.","Er zahlt nur Personenschäden.","Er zahlt nur bei Unfällen im Ausland."],"richtig":0,"erkl":"§ 12 Abs. 1 S. 2 und 3 PflVG: Der Fonds zahlt zuletzt. Wer von einer eigenen Vollkasko oder der Krankenkasse Ersatz bekommt, muss sich zuerst dorthin wenden."},{"id":"t3-10","typ":"urteil","titel":"Vorsatz","sprecher":"Hendrik Brehmer","aussage":"„Wenn jemand absichtlich ein Auto rammt, zahlt seine Versicherung nicht. Dann geht das Opfer leer aus.“","urteil":"stimmt nicht","normfrage":"Welche Norm hilft dem Opfer?","normoptionen":["§ 12 Abs. 1 S. 1 Nr. 3 PflVG","§ 117 Abs. 1 VVG","§ 115 Abs. 1 S. 1 Nr. 1 VVG","Ziff. A.1.5.1 AKB"],"norm":0,"erkl":"Der erste Satz stimmt: Bei Vorsatz besteht kein Versicherungsschutz (§ 103 VVG, Ziff. A.1.5.1 AKB), und § 117 VVG hilft nicht. Leer geht das Opfer aber nicht aus: Der Entschädigungsfonds springt ein (§ 12 Abs. 1 S. 1 Nr. 3 PflVG), soweit vom Schädiger nichts zu holen ist."},{"id":"t3-12","typ":"frei","art":"erklaerung","titel":"Außen zahlen, innen zurückholen","akte":"Kundengespräch","frage":"Erklären Sie Hendrik in zwei Sätzen, warum die Proximus einem Unfallopfer zahlt, obwohl er seinen Folgebeitrag trotz qualifizierter Mahnung bis zum Fristablauf nicht bezahlt hat, und was das für ihn bedeutet.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Hendrik?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Dem Opfer gegenüber bleibt die Proximus zur Leistung verpflichtet, obwohl sie Ihnen gegenüber leistungsfrei ist.","kat":0,"erkl":"§ 117 Abs. 1 VVG: Leistungsfrei gegenüber dem Kunden heißt nicht leistungsfrei gegenüber dem Opfer."},{"text":"Weil Sie nicht gezahlt haben, muss sich das Opfer an den Entschädigungsfonds wenden.","kat":1,"erkl":"Der Fonds zahlt nur, was sonst niemand zahlt; hier zahlt die Proximus nach § 117 Abs. 1 VVG (Merkkasten TE 3)."},{"text":"Das Geld, das die Proximus dem Opfer zahlt, holt sie sich bei Ihnen zurück.","kat":0,"erkl":"§ 116 Abs. 1 VVG: Im Verhältnis zum Kunden trägt er den Schaden; die Proximus nimmt Rückgriff."},{"text":"Der Rückgriff ist auf 5.000 € begrenzt.","kat":1,"erkl":"Die Grenzen von 5.000 € und 2.500 € gelten nur für Pflichtverletzungen; beim Zahlungsverzug holt sich der Versicherer alles zurück (§ 116 Abs. 1 VVG; Ziff. D.5.3, E.7.3, E.7.4 AKB)."}]},"kernpunkte":["Gegenüber dem Opfer bleibt die Proximus zur Leistung verpflichtet (§ 117 Abs. 1 VVG)","Grund ist der Schutz des Verkehrsopfers","Ihm gegenüber ist sie leistungsfrei und holt sich das Geld bei ihm zurück (§ 116 Abs. 1 VVG)","Beim Zahlungsverzug ohne Obergrenze"],"muster":"Das Gesetz schützt das Verkehrsopfer: Die Proximus muss ihm zahlen, auch wenn sie Ihnen gegenüber leistungsfrei ist (§ 117 Abs. 1 VVG). Das Geld holt sie sich danach von Ihnen zurück, beim Zahlungsverzug in voller Höhe (§ 116 Abs. 1 VVG).","erkl":"Merkkasten TE 3: Außen zahlt der Versicherer, innen holt er zurück – beim Zahlungsverzug ohne die Grenzen von 5.000 € und 2.500 €."}]},"4":{"titel":"Unfall über die Grenze","untertitel":"Welche Stelle hilft den Brehmers – und wer zahlt?","items":[{"id":"t4-09","typ":"frei","art":"abruf","titel":"Drei Fälle, drei Wege","akte":"Kurzantwort","frage":"Nennen Sie für jeden Fall die zuständige Stelle mit Norm oder Ziffer, für Fall (3) auch den Umfang des Schutzes: (1) Ein ausländisches Auto verursacht einen Unfall in Deutschland. (2) Unfall im EU-Ausland, der Geschädigte wohnt in Deutschland. (3) Sie verursachen selbst einen Unfall im Ausland.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: Wer ist zuständig?","kategorien":["Deutsches Büro Grüne Karte","SRB des fremden Versicherers in Deutschland","die eigene Kfz-Haftpflicht"],"zeilen":[{"text":"Ein ausländisches Auto verursacht einen Unfall in Deutschland.","kat":0,"erkl":"§ 10 Abs. 1 AuslPflVG: Sie machen Ihren Anspruch gegen das Büro wie gegen einen Haftpflichtversicherer geltend."},{"text":"Unfall im EU-Ausland, der Geschädigte wohnt in Deutschland.","kat":1,"erkl":"§ 163 Abs. 1 VAG: Der SRB des fremden Versicherers reguliert in Deutschland und auf Deutsch."},{"text":"Sie verursachen selbst einen Unfall im Ausland.","kat":2,"erkl":"Ziff. A.1.4.1 AKB: Ihre Kfz-Haftpflicht zahlt, mindestens im Umfang Ihres Vertrags."},{"text":"Ein Auto mit polnischem Kennzeichen fährt in Halle (Saale) auf den stehenden Familien-Pkw der Brehmers auf.","kat":0,"erkl":"Ausländisches Auto, Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)."}]},"kernpunkte":["(1) Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)","(2) Schadenregulierungsbeauftragter des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG)","(3) die eigene Kfz-Haftpflicht, mindestens im Umfang des Vertrags (Ziff. A.1.4.1 AKB)"],"muster":"(1) Das Deutsche Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG). (2) Der Schadenregulierungsbeauftragte des fremden Versicherers in Deutschland (§ 163 Abs. 1 VAG). (3) Die eigene Kfz-Haftpflicht, mindestens im Umfang des eigenen Vertrags (Ziff. A.1.4.1 AKB).","erkl":"Merkkasten TE 4: Drei Fälle, drei Wege. Versicherer und SRB nennt der Zentralruf (§ 8a PflVG)."},{"id":"t4-01","typ":"reihe","titel":"Drei Prüffragen","frage":"Bringen Sie die Prüffragen zur Tabelle auf S. 46 in die Reihenfolge, in der das Skript sie stellt.","schritte":["Wo ist der Unfall passiert?","Woher kommt der Schädiger?","Ist seine Versicherung bekannt?","Daraus folgt die zuständige Stelle."],"erkl":"Skript TE 4: Die Tabelle auf S. 46 folgt immer denselben drei Fragen; aus den Antworten ergibt sich die Stelle. Sie geht von einem Geschädigten aus, der in Deutschland wohnt."},{"id":"t4-02","typ":"mc","titel":"Gegen wen klagen?","akte":"Schadenakte","fall":"Ein Auto mit polnischem Kennzeichen beschädigt in Halle (Saale) den Familien-Pkw der Brehmers. Das Deutsche Büro Grüne Karte beauftragt einen deutschen Versicherer mit der Regulierung.","frage":"Gegen wen richten die Brehmers notfalls ihre Klage?","optionen":["gegen das Deutsche Büro Grüne Karte","gegen den beauftragten deutschen Versicherer","gegen die Verkehrsopferhilfe","gegen den Zentralruf der Autoversicherer"],"richtig":0,"erkl":"Das Büro ist passivlegitimiert: Es kann wie ein Haftpflichtversicherer in Anspruch genommen und verklagt werden (§ 10 Abs. 1 AuslPflVG), auch wenn es die Regulierung überträgt (§ 10 Abs. 4 AuslPflVG)."},{"id":"t4-03","typ":"mc","titel":"Versicherer unbekannt","akte":"Kundengespräch","fall":"In Spanien fährt ein Einheimischer auf Sabines Auto auf. Sie hat nur sein Kennzeichen notiert.","frage":"Wo erfährt Sabine, wer sein Versicherer und dessen Schadenregulierungsbeauftragter in Deutschland ist?","optionen":["beim Zentralruf der Autoversicherer","beim Deutschen Büro Grüne Karte","bei der spanischen Zulassungsbehörde","bei ihrer eigenen Kfz-Haftpflicht"],"richtig":0,"erkl":"Der Zentralruf der Autoversicherer ist die Auskunftsstelle (§ 8a Abs. 1 und 3 PflVG). Deshalb immer das Kennzeichen notieren."},{"id":"t4-04","typ":"mc","titel":"Keine Antwort vom SRB","frage":"Sabine hat den Schaden beim SRB angemeldet, bekommt aber keine begründete Antwort. Wann kann sie sich an die Verkehrsopferhilfe als Entschädigungsstelle wenden?","optionen":["wenn binnen drei Monaten keine begründete Antwort kommt","schon nach zwei Wochen","sofort nach der Anmeldung","gar nicht, Auslandsunfälle sind ausgeschlossen"],"richtig":0,"erkl":"§ 15 Abs. 1 PflVG: Die Entschädigungsstelle hilft, wenn Versicherer oder SRB nicht binnen drei Monaten mit Gründen antworten oder der Versicherer binnen zwei Monaten nicht zu ermitteln ist."},{"id":"t4-05","typ":"mc","titel":"Welches Recht?","frage":"Sabine verursacht in Ungarn einen Unfall mit einem ungarischen Auto. Nach welchem Recht wird in der Regel reguliert?","optionen":["nach ungarischem Recht, dem Recht des Unfalllandes","nach deutschem Recht, weil Sabine bei der Proximus versichert ist","nach dem Recht, das der Geschädigte wählt","nach dem Recht des Landes, in dem der Schädiger wohnt"],"richtig":0,"erkl":"Im Grüne-Karte-System gilt die Regel: Reguliert wird nach dem Recht des Landes, in dem der Unfall geschah (Skript TE 4)."},{"id":"t4-06","typ":"urteil","titel":"Umfang im Ausland","sprecher":"Sabine Brehmer","aussage":"„Verursache ich in Serbien einen Unfall, zahlt die Proximus höchstens das, was Serbien als Mindestsumme vorschreibt.“","urteil":"stimmt nicht","normfrage":"Welche Ziffer regelt den Umfang im Besuchsland?","normoptionen":["Ziff. A.1.4.1 S. 2 AKB","Ziff. A.1.4.2 AKB","Ziff. A.1.5.3 AKB","§ 163 Abs. 1 VAG"],"norm":0,"erkl":"Es gilt der im Besuchsland vorgeschriebene Umfang, mindestens aber der Umfang des eigenen Vertrags (Ziff. A.1.4.1 S. 2 AKB). Serbien liegt in Europa (Ziff. A.1.4.1 S. 1)."},{"id":"t4-07","typ":"zuordnung","titel":"Wer ist zuständig?","frage":"Ordnen Sie jedem Fall zu, wer zuständig ist bzw. wer den Schaden ersetzt.","kategorien":["Deutsches Büro Grüne Karte","SRB des fremden Versicherers in Deutschland","selbst beim ausländischen Versicherer","eigene Kfz-Haftpflicht (Proximus)"],"zeilen":[{"text":"Ein Auto mit dänischem Kennzeichen fährt in Halle (Saale) auf den Familien-Pkw auf.","kat":0,"erkl":"Ausländisches Auto verursacht Unfall in Deutschland: Deutsches Büro Grüne Karte (§ 10 Abs. 1 AuslPflVG)."},{"text":"In Wien beschädigt ein Österreicher mit seinem in Österreich zugelassenen Auto Sabines geparktes Auto.","kat":1,"erkl":"Unfall im EU-Ausland, Geschädigte wohnt in Deutschland: SRB in Deutschland (§ 163 Abs. 1 VAG)."},{"text":"In Anatolien fährt ein Einheimischer mit seinem dort zugelassenen Auto auf Sabines Auto auf.","kat":2,"erkl":"Türkei: weder EU noch EWR. Kein SRB, keine Entschädigungsstelle; Sabine wendet sich selbst an den türkischen Versicherer."},{"text":"Sabine fährt in Bulgarien einem Einheimischen auf. Wer ersetzt dessen Schaden?","kat":3,"erkl":"Wer im Ausland schädigt, ist über die eigene Kfz-Haftpflicht geschützt (Ziff. A.1.1.1, A.1.4.1)."}],"erkl":"Merkkasten TE 4: Ausländisches Auto in Deutschland → Büro Grüne Karte. Unfall im EU-Ausland → SRB zu Hause. Selbst verursacht → eigene Kfz-Haftpflicht."},{"id":"t4-08","typ":"mc","titel":"Das eigene Auto im Ausland","fall":"Sabine fährt in Serbien einem Einheimischen auf. Ihr eigenes Auto ist vorn beschädigt.","frage":"Wer zahlt den Schaden an Sabines Auto?","optionen":["nur eine Vollkasko, falls Sabine eine hat","ihre Kfz-Haftpflicht bei der Proximus","das serbische Grüne-Karte-Büro","der Versicherer des Serben"],"richtig":0,"erkl":"Die Kfz-Haftpflicht zahlt nicht für das versicherte Fahrzeug selbst (Ziff. A.1.5.3). Ein selbst verschuldeter Unfallschaden ist Sache der Vollkasko (Ziff. A.2.3.2)."},{"id":"t4-10","typ":"frei","art":"erklaerung","titel":"Kein SRB für die Türkei","akte":"Kundengespräch","frage":"Erklären Sie Sabine in zwei Sätzen, warum ihr nach einem Unfall mit einem türkischen Auto in der Türkei kein Schadenregulierungsbeauftragter in Deutschland hilft und an wen sie sich stattdessen wenden muss.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Sabine?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Die Türkei gehört weder zur EU noch zum EWR.","kat":0,"erkl":"Deshalb gelten die Regeln für EU und EWR hier nicht (Übung 1 c TE 4)."},{"text":"Einen SRB in Deutschland gibt es nur für Fahrzeuge aus der EU und dem EWR.","kat":0,"erkl":"§ 163 Abs. 1 und 4 VAG."},{"text":"Sie melden den Schaden beim Deutschen Büro Grüne Karte.","kat":1,"erkl":"Das Büro ist zuständig, wenn ein ausländisches Auto in Deutschland einen Unfall verursacht (§ 10 Abs. 1 AuslPflVG), nicht für einen Unfall in der Türkei."},{"text":"Ihre eigene Kfz-Haftpflicht zahlt Ihren Schaden.","kat":1,"erkl":"Die eigene Haftpflicht zahlt nur, was Sabine anderen zufügt (Ziff. A.1.1.1 AKB), nicht ihren eigenen Schaden."},{"text":"Sie wenden sich selbst an den türkischen Versicherer.","kat":0,"erkl":"Außerhalb von EU und EWR fehlt diese Hilfe meist; dann wendet sich die Geschädigte selbst an den ausländischen Versicherer (Skript TE 4; Tabelle S. 46)."}]},"kernpunkte":["Die Türkei gehört weder zur EU noch zum EWR","Einen SRB gibt es nur für Fahrzeuge aus EU und EWR (§ 163 Abs. 1 und 4 VAG)","Sie muss sich selbst an den türkischen Versicherer wenden"],"muster":"Einen Schadenregulierungsbeauftragten in Deutschland gibt es nur für Fahrzeuge aus der EU und dem EWR; die Türkei gehört zu keinem von beiden (§ 163 Abs. 1 und 4 VAG). Sie müssen Ihre Ansprüche deshalb selbst beim türkischen Versicherer geltend machen.","erkl":"Übung 1 c TE 4: Die Türkei gehört weder zur EU noch zum EWR; Sabine macht ihre Ansprüche selbst beim türkischen Versicherer geltend (Tabelle S. 46)."}]},"5":{"titel":"Tarif und SF-Klasse","untertitel":"Von der Tarifprämie zum Beitrag – und welche Klasse ein neuer Vertrag bekommt.","items":[{"id":"t5-10","typ":"frei","art":"abruf","titel":"Besserstufung","akte":"Kurzantwort","frage":"Nennen Sie die drei Regeln, nach denen ein neuer Vertrag aus Klasse 0 zum 1. Januar besser gestuft wird.","zuordnung":{"frage":"Prüfen Sie Ihr Wissen: In welcher Klasse steht der Vertrag am nächsten 1. Januar?","kategorien":["SF 1","SF ½","Klasse 0 bleibt"],"zeilen":[{"text":"Neuer Vertrag in Klasse 0, Beginn 1. März, bis 31. Dezember schadenfrei","kat":1,"erkl":"Beginn zwischen 2. Januar und 1. Juli, mindestens sechs Monate: Halbjahresregelung nach SF ½ (Ziff. I.3.4.2)."},{"text":"Neuer Vertrag in Klasse 0, Beginn 1. September, bis 31. Dezember schadenfrei","kat":2,"erkl":"Beginn nach dem 1. Juli: keine Halbjahresregelung, das angefangene Jahr zählt nicht (Ziff. I.3.4.2)."},{"text":"Vertrag in Klasse 0, ein volles Kalenderjahr schadenfrei","kat":0,"erkl":"Aus Klasse 0 führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1)."},{"text":"Lucas eigener Vertrag, Beginn 01.11.2026 in Klasse 0, bis 31. Dezember schadenfrei: Klasse am 01.01.2027","kat":2,"erkl":"Beginn nach dem 1. Juli: Das angefangene Jahr zählt nicht (Ziff. I.3.4.2); SF 1 frühestens am 01.01.2028 nach dem ersten vollen schadenfreien Kalenderjahr (Ziff. I.3.4.1)."}]},"kernpunkte":["Ein volles schadenfreies Kalenderjahr führt zum 1. Januar direkt in SF 1 (Ziff. I.3.2, I.3.4.1)","Beginn vom 2. Januar bis 1. Juli: Sechs Monate im ersten Jahr genügen für SF ½ zum 1. Januar (Ziff. I.3.4.2)","Beginn nach dem 1. Juli: keine Halbjahresregelung, das angefangene Jahr zählt nicht; zum nächsten 1. Januar bleibt Klasse 0 (Ziff. I.3.4.2)"],"muster":"Ein volles schadenfreies Kalenderjahr führt den Vertrag zum 1. Januar direkt in SF 1 (Ziff. I.3.2, I.3.4.1). Beginnt er zwischen dem 2. Januar und dem 1. Juli, genügen im ersten Jahr sechs Monate für SF ½ zum 1. Januar (Ziff. I.3.4.2). Beginnt er nach dem 1. Juli, zählt das angefangene Jahr nicht; zum nächsten 1. Januar bleibt er in Klasse 0.","erkl":"Skript TE 5, „Und im nächsten Jahr?“: Beginn 01.03. → SF ½ am 1. Januar; Beginn 01.09. → Klasse 0 bleibt, SF 1 erst nach dem ersten vollen schadenfreien Kalenderjahr."},{"id":"t5-01","typ":"reihe","titel":"Rechenreihenfolge","frage":"Bringen Sie die Rechenschritte für den Kfz-Beitrag in die richtige Reihenfolge.","schritte":["Tarifprämie (100 %) aus dem Tarifrechner","× Beitragssatz der SF-Klasse (Anhang 1)","Nachlässe und Zuschläge nacheinander, in der Reihenfolge des Tarifs","Abschlag für die Zahlungsweise","+ 19 % Versicherungsteuer"],"erkl":"Merkkasten TE 5: Erst der Beitragssatz, dann die Nachlässe, dann die Zahlungsweise, zuletzt die Versicherungsteuer. Jedes Zwischenergebnis auf den Cent runden."},{"id":"t5-02","typ":"mc","titel":"Was steckt in der Tarifprämie?","frage":"Was steckt bereits in der Tarifprämie aus dem Tarifrechner?","optionen":["Wagniskennziffer, Regionalklasse und Typklasse","SF-Klasse und Beitragssatz","alle Nachlässe und Zuschläge","Zahlungsweise und Versicherungsteuer"],"richtig":0,"erkl":"Proximus 5 enthält keine Grundprämien (Lehrbuch S. 59). In der Tarifprämie (100 %) stecken WKZ, Regional- und Typklasse; den Rest rechnen Sie mit dem Bedingungswerk."},{"id":"t5-03","typ":"urteil","titel":"Regionalklasse für Halle (Saale)","sprecher":"Eine Kollegin in der Agentur","aussage":"„HAL fehlt im Kennzeichenverzeichnis. Dann nehme ich für die Brehmers eben SK, den Saalekreis.“","urteil":"stimmt nicht","normfrage":"Woher kommt die Regionalklasse für Halle (Saale)?","normoptionen":["aus dem Tarifrechner; sie steckt in der Tarifprämie","vom Nachbarbezirk mit der höchsten Klasse","aus dem Typklassenverzeichnis","aus Anhang 1 der AKB"],"norm":0,"erkl":"Die Regionalklasse richtet sich nach dem Zulassungsbezirk am Wohnsitz. Das Verzeichnis in Proximus 5 ist ein Auszug; fehlt ein Bezirk, gilt der Wert aus dem Tarifrechner, nie der Nachbarbezirk (Lehrbuch S. 60–61)."},{"id":"t5-04","typ":"mc","titel":"HSN und TSN","frage":"Warum suchen Sie die Typklasse immer mit HSN und TSN zusammen?","optionen":["Dieselbe TSN kann bei zwei Herstellern vorkommen.","Die HSN gibt die Regionalklasse an.","Die TSN allein nennt nur das Baujahr.","Das Typklassenverzeichnis ist nach Kennzeichen sortiert."],"richtig":0,"erkl":"Die Typklasse finden Sie über Herstellerschlüsselnummer (HSN) und Typschlüsselnummer (TSN) aus der Zulassungsbescheinigung (Lehrbuch S. 61)."},{"id":"t5-05","typ":"zuordnung","titel":"Ersteinstufung","frage":"In welche Klasse stuft die Proximus den neuen Pkw-Vertrag in der Kfz-Haftpflicht ein?","kategorien":["Klasse 0 (85 %)","SF ½ (65 %)","SF 1 (52 %)","SF 3 (46 %)"],"zeilen":[{"text":"Luca (18), Fahrerlaubnis seit Juli 2026, eigener Vertrag für seinen ersten Pkw.","kat":0,"erkl":"Keine Sondereinstufung erfüllt: Klasse 0 (Ziff. I.2.1)."},{"text":"Eine Kundin (30), Fahrerlaubnis seit fünf Jahren, erster eigener Pkw; weder sie noch ein Partner hat einen weiteren Pkw.","kat":1,"erkl":"Mindestens drei Jahre Fahrerlaubnis: SF ½ (Ziff. I.2.2.1)."},{"text":"Ein Kunde (21), Fahrerlaubnis seit zwei Jahren, Zweitwagen; sein Erstwagen läuft in SF 1.","kat":2,"erkl":"Zweitwagen, Erstwagen mindestens SF 1, ein Jahr Fahrerlaubnis: SF 1 (Ziff. I.2.2.2). SF 3 scheitert am Alter, SF ½ an der Dauer der Fahrerlaubnis."},{"text":"Hendrik (49), Fahrerlaubnis seit 1996, Zweitwagen; Sabines Pkw läuft in SF 18; nur Hendrik und Sabine fahren.","kat":3,"erkl":"Erstwagen mindestens SF 3, mindestens ein Jahr Fahrerlaubnis, nur Kunde und Partner fahren, beide über 23: SF 3 (Ziff. I.2.2.3)."},{"text":"Eine Kundin (40), Fahrerlaubnis seit zwei Jahren, Zweitwagen; der Pkw ihres Ehemanns läuft in SF 10. Auch die 19-jährige Tochter fährt.","kat":2,"erkl":"SF 3 scheitert, weil die Tochter fährt und jünger als 23 ist; SF ½ an der Dauer der Fahrerlaubnis. Es bleibt SF 1 (Ziff. I.2.2.2)."}],"erkl":"Neuer Vertrag: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt (Merkkasten TE 5)."},{"id":"t5-06","typ":"mc","titel":"Prozent mal Prozent","frage":"Beitragssatz 46 %, dazu ein Nachlass von 10 %. Welcher Anteil der Tarifprämie ist zu zahlen?","optionen":["41,4 %","36 %","46 %","56 %"],"richtig":0,"warum":[null,"Hier wurden Prozentpunkte abgezogen. Der Nachlass bezieht sich auf den errechneten Betrag.","Der Nachlass fehlt.","Nachlass und Zuschlag verwechselt."],"erkl":"46 % × 0,9 = 41,4 %. Nachlässe rechnen Sie nacheinander vom zuletzt errechneten Betrag (Skript TE 5)."},{"id":"t5-07","typ":"stufen","titel":"Rechenfall Beitrag","akte":"Tarifberechnung","fall":"Tarifprämie (100 %) für einen Neuwagen: 720,00 €. Der Vertrag steht in SF 3 (46 %). Nachlässe laut Antrag: Neuwagen −10 %, Garage −10 %. Der Kunde zahlt jährlich (−5 %). Runden Sie jedes Zwischenergebnis auf den Cent.","pruef":{"art":"beitrag","praemie":720.0,"prozente":[46,-10,-10,-5,19]},"schritte":[{"typ":"zahl","frage":"Beitrag nach dem Beitragssatz der SF-Klasse?","einheit":"€","loesung":331.2,"weg":"720,00 € × 46 % = 331,20 €"},{"typ":"zahl","frage":"Nach dem Neuwagen-Nachlass (−10 %)?","einheit":"€","loesung":298.08,"weg":"331,20 € − 33,12 € = 298,08 €"},{"typ":"zahl","frage":"Nach dem Garagen-Nachlass (−10 %)?","einheit":"€","loesung":268.27,"weg":"298,08 € − 29,81 € = 268,27 €"},{"typ":"zahl","frage":"Nach dem Abschlag für jährliche Zahlung (−5 %)?","einheit":"€","loesung":254.86,"weg":"268,27 € − 13,41 € = 254,86 €"},{"typ":"zahl","frage":"Jahresbeitrag mit 19 % Versicherungsteuer?","einheit":"€","loesung":303.28,"weg":"254,86 € + 48,42 € = 303,28 €"}],"erkl":"Erst der Beitragssatz, dann jeder Nachlass vom zuletzt errechneten Betrag, dann die Zahlungsweise, zuletzt 19 % Versicherungsteuer (Skript TE 5, Schritte 2 bis 4)."},{"id":"t5-08","typ":"stufen","titel":"Lucas nächste Klassen","fall":"Lucas eigener Vertrag beginnt am 01.11.2026 in Klasse 0 und bleibt schadenfrei.","schritte":[{"typ":"mc","frage":"In welcher Klasse steht er am 01.01.2027?","optionen":["Klasse 0","SF ½","SF 1"],"richtig":0,"erkl":"Beginn nach dem 1. Juli: Die Halbjahresregelung greift nicht (Ziff. I.3.4.2)."},{"typ":"mc","frage":"Und am 01.01.2028?","optionen":["SF 1","SF ½","SF 2"],"richtig":0,"erkl":"Aus Klasse 0 führt ein volles schadenfreies Kalenderjahr direkt in SF 1 (Ziff. I.3.4.1)."}],"erkl":"Besserstufung zum 1. Januar nach einem ganzen schadenfreien Kalenderjahr (Ziff. I.3.2); die Halbjahresregelung gilt nur bei Beginn vom 2. Januar bis 1. Juli."},{"id":"t5-09","typ":"mc","titel":"Familien-Nachlass?","frage":"Bekommen die Brehmers für den Golf den Familien-Nachlass?","optionen":["Nein, das Antragsfeld verlangt ein Kind unter 16 Jahren; Luca ist 18.","Ja, weil mehrere Familienmitglieder fahren.","Ja, weil sie zwei Autos bei der Proximus versichern.","Nur, wenn Luca den Kleinwagen selbst versichert."],"richtig":0,"erkl":"Im Antrag zur Kraftfahrtversicherung in Proximus 5 heißt das Feld „Familie mit Kind unter 16 Jahre“. Luca ist 18, der Nachlass entfällt (Tarif: Nachlässe und Zuschläge)."},{"id":"t5-11","typ":"frei","art":"erklaerung","titel":"Warum Luca nicht in SF ½ kommt","akte":"Kundengespräch","frage":"Erklären Sie Luca in zwei Sätzen, warum er mit einem eigenen Vertrag nicht in SF ½ kommt, obwohl er einen gültigen Führerschein hat, und in welcher Klasse sein Vertrag stattdessen beginnt.","zuordnung":{"frage":"Gehört der Satz in eine richtige Erklärung für Luca?","kategorien":["richtig","falsch"],"zeilen":[{"text":"Für SF ½ brauchen Sie die Fahrerlaubnis seit mindestens drei Jahren.","kat":0,"erkl":"Ziff. I.2.2.1 verlangt mindestens drei Jahre Fahrerlaubnis."},{"text":"Sie haben die Fahrerlaubnis erst seit Juli 2026.","kat":0,"erkl":"So steht es in Lucas Daten (Übung 2 TE 5); die drei Jahre sind nicht erfüllt (Ziff. I.2.2.1)."},{"text":"Weil Ihre Eltern schon Autos versichert haben, bekommen Sie die Einstufung für einen Zweitwagen.","kat":1,"erkl":"Ziff. I.2.2.2 zählt nur Pkw des Versicherungsnehmers oder seines Ehe- oder Lebenspartners; die Autos der Eltern zählen nicht."},{"text":"Ohne Sondereinstufung beginnt Ihr eigener Vertrag in Klasse 0 mit 85 %.","kat":0,"erkl":"Ziff. I.2.1: Ohne Sondereinstufung beginnt ein neuer Vertrag in Klasse 0 mit 85 %."}]},"kernpunkte":["SF ½ verlangt mindestens drei Jahre Fahrerlaubnis (Ziff. I.2.2.1)","Luca hat die Fahrerlaubnis erst seit Juli 2026","Ohne Sondereinstufung beginnt der Vertrag in Klasse 0 mit 85 % (Ziff. I.2.1)"],"muster":"Für SF ½ brauchen Sie die Fahrerlaubnis seit mindestens drei Jahren (Ziff. I.2.2.1); Sie haben sie erst seit Juli 2026. Ohne Sondereinstufung beginnt Ihr Vertrag deshalb in Klasse 0 mit 85 % (Ziff. I.2.1).","erkl":"Merkkasten TE 5: Klasse 0 mit 85 % – es sei denn, jede Voraussetzung einer Sondereinstufung nach Ziff. I.2.2 ist erfüllt."}]}},"karten":[{"te":1,"vorn":"Kfz-Haftpflicht (A.1)","hinten":"Zahlt Schäden, die Sie mit dem Fahrzeug anderen zufügen. Einzige Pflichtsparte der Kfz-Versicherung (§ 1 PflVG)."},{"te":1,"vorn":"Kasko (A.2)","hinten":"Schäden am eigenen Fahrzeug: Teilkasko z. B. Diebstahl oder Hagel, Vollkasko zusätzlich Unfall, auch selbst verschuldet."},{"te":1,"vorn":"Autoschutzbrief (A.3)","hinten":"Hilft unterwegs, z. B. mit Pannenhilfe und Abschleppen."},{"te":1,"vorn":"Fahrerschutz-Versicherung (A.4)","hinten":"Zahlt für den verletzten Fahrer selbst."},{"te":1,"
