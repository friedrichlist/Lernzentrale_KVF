:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px color-mix(in srgb,#000000 15%,transparent);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>

<script>
const D={"key":"gap2_12_vorsorge_v1","titel":"Prüfungstraining GAP 2 · Teil 1.2 · Vorsorge","sparte":"Vorsorge","intro":"Hier üben Sie die Bearbeitung von Leistungsfällen in der Lebens-, Renten- und Berufsunfähigkeitsversicherung. Prüfen Sie jeweils die formelle und materielle Deckung und berechnen Sie die Leistung so, dass Sie sie dem Kunden erklären können.","lf":"LF 11","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · GAP 2 Teil 1.2","stand":"15.10.2026","module":[{"nr":"1","titel":"Der Versicherungsfall in der Lebensversicherung","abschnitte":[{"nr":"1.1","titel":"Erlebensfall: Ablaufleistung und Leistungsabrechnung","lf":"LF 11","buch":"PV2 8.5 S. 593–597 · Lösungen S. 754–755","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was benötigt die Proximus in der Regel, um die Ablaufleistung einer Kapitallebensversicherung auszuzahlen?","optionen":["Den Versicherungsschein und ein Zeugnis über den Tag der Geburt der versicherten Person.","Einen Erbschein und die Sterbeurkunde der versicherten Person, sonst keine Zahlung.","Eine Bescheinigung des Finanzamts, dass keine Steuerschulden des Kunden offen sind.","Eine notariell beglaubigte Abtretungserklärung des Versicherungsnehmers an seine eigene Person."],"richtig":[0],"erkl":"Wird eine Leistung beansprucht, kann die Proximus den Versicherungsschein und ein Zeugnis über den Tag der Geburt der versicherten Person verlangen. Erbschein und Sterbeurkunde betreffen nur den Todesfall.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 7.1","id":"1.1-1-1"},{"typ":"mc","frage":"Wann ist die Ablaufleistung fällig?","optionen":["Erst sechs Monate nach dem vereinbarten Ablauftermin des Vertrags.","Zum Ablauftermin, sobald die nötigen Erhebungen abgeschlossen sind.","Erst wenn der Kunde die Auszahlung schriftlich beantragt und begründet.","Erst nach Ablauf der dreijährigen Verjährungsfrist für den Anspruch."],"richtig":[1],"erkl":"Die Leistungen der Proximus werden fällig, nachdem sie die zur Feststellung des Versicherungsfalls und des Leistungsumfangs nötigen Erhebungen abgeschlossen hat. Im Erlebensfall ist das regelmäßig der Ablauftermin.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 7.4; § 14 Abs. 1 VVG","id":"1.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Zusammensetzung der Ablaufleistung treffen zu?","aussagen":[["Sie besteht aus der garantierten Versicherungssumme und den zugeteilten Überschussanteilen.",true],["Der Schlussüberschuss ist bei Vertragsschluss in fester Höhe garantiert.",false],["Bei Vertragsende wird der Kunde zur Hälfte an den ihm zugeordneten Bewertungsreserven beteiligt.",true],["Die Überschussbeteiligung wird von der garantierten Versicherungssumme abgezogen.",false]],"erkl":"Die angesammelten Überschussanteile, ein möglicher Schlussüberschuss und die Bewertungsreserven werden bei Vertragsende zusammen mit der Versicherungsleistung ausgezahlt; der Schlussüberschuss kann auch null Euro betragen. Bewertungsreserven teilt die Proximus nach der gesetzlichen Regelung zu, also zur Hälfte.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 2.3.2, 2.3.3 und 2.6; § 153 Abs. 3 VVG","id":"1.1-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Erlebensfall","Die versicherte Person lebt zum vereinbarten Ablauftermin."],["Todesfall","Die versicherte Person stirbt während der Vertragslaufzeit."],["Garantierte Versicherungssumme","Betrag, der bei Vertragsschluss fest zugesagt ist."],["Schlussüberschuss","Überschussanteil, der erst bei Vertragsende festgelegt wird."]],"erkl":"Die Kapitalversicherung auf den Todes- und Erlebensfall zahlt die vereinbarte Versicherungssumme zum Ablauftermin oder bei Tod vorher; zur Garantie kommen die Überschussanteile.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 1.1 und 2.3.2","id":"1.1-1-4"},{"typ":"mc","frage":"Unter welchen Voraussetzungen ist bei einer ab 2012 abgeschlossenen Kapitallebensversicherung nur die Hälfte des Ertrags steuerpflichtig?","optionen":["Wenn mindestens fünf Jahre lang Beiträge gezahlt wurden, und zwar unabhängig vom Alter des Kunden.","Wenn die Leistung vor dem 60. Lebensjahr fließt und die Laufzeit mindestens zehn Jahre beträgt.","Wenn der Vertrag mindestens 12 Jahre läuft und nach Vollendung des 62. Lebensjahres ausgezahlt wird.","Wenn der Kunde die Auszahlung sofort in eine neue Lebensversicherung der Proximus einzahlt."],"richtig":[2],"erkl":"Ertrag ist die Leistung minus Summe der Beiträge. Bei mindestens 12 Jahren Laufzeit und Auszahlung nach Vollendung des 62. Lebensjahres (Verträge ab 2012) ist nur die Hälfte steuerpflichtig.","norm":"§ 20 Abs. 1 Nr. 6 EStG","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Gerd Rasche (63) aus Halle-Neustadt hat bei der Proximus eine Kapitallebensversicherung auf den Todes- und Erlebensfall nach Tarif S 34 (Endalter 63). Beginn war der 01.12.2013 (Eintrittsalter 50), Ablauf ist der 01.12.2026. Er zahlte 13 Jahre lang jährlich 1.200 €. Die garantierte Ablaufleistung beträgt 14.983 €. Laut Leistungsabrechnung kommen hinzu: angesammelte Überschussanteile 3.560 €, Schlussüberschuss 596 € und Beteiligung an den Bewertungsreserven 160 €.","items":[{"typ":"zahl","frage":"Wie hoch ist die Ablaufleistung (vor Steuern), die die Proximus Herrn Rasche abrechnet?","wert":19299,"einheit":"€","tol":0.5,"erkl":"14.983 € + 3.560 € + 596 € + 160 € = 19.299 €. Das entspricht der Gesamt-Ablaufleistung laut Tarif S 34 für Eintrittsalter 50 und Endalter 63.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 1.1 und 2.3.3; Tarif S 34","id":"1.1-2-1"},{"typ":"zahl","frage":"Wie hoch ist der Teil des Ertrags, der bei Herrn Rasche der Einkommensteuer unterliegt?","wert":1849.5,"einheit":"€","tol":0.5,"erkl":"Beiträge: 13 × 1.200 € = 15.600 €. Ertrag: 19.299 € − 15.600 € = 3.699 €. 13 Jahre Laufzeit und älter als 62: steuerpflichtig ist die Hälfte, 1.849,50 €.","norm":"§ 20 Abs. 1 Nr. 6 Satz 2 EStG","id":"1.1-2-2"},{"typ":"mc","frage":"Herr Rasche fragt, mit welchem Steuersatz der halbe Ertrag am Ende besteuert wird. Was antworten Sie?","optionen":["Mit der Abgeltungsteuer von 25 % auf den gesamten Ertrag, ohne Steuererklärung.","Gar nicht, weil Lebensversicherungen nach 12 Jahren Laufzeit immer steuerfrei sind.","Mit einem festen Steuersatz von 15 %, den die Proximus einbehält und abführt.","Mit seinem persönlichen Einkommensteuersatz im Rahmen seiner Steuererklärung."],"richtig":[3],"erkl":"Bei der hälftigen Besteuerung gilt nicht die Abgeltungsteuer, sondern der persönliche Steuersatz. Die von der Proximus einbehaltene Kapitalertragsteuer wird in der Veranlagung angerechnet.","norm":"§ 20 Abs. 1 Nr. 6 EStG; § 32d Abs. 2 Nr. 2 EStG","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Todesfall: Prüfung der Leistungspflicht","lf":"LF 11","buch":"PV2 8.5 S. 593–597 · Lösungen S. 754–755","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welche Unterlagen verlangt der Versicherer im Todesfall typischerweise?","optionen":["Versicherungsschein, amtliche Sterbeurkunde und eine ärztliche Bescheinigung zur Todesursache.","Nur einen Erbschein, weil die Leistung immer in den Nachlass fällt und an die Erben geht.","Das Testament der verstorbenen Person und eine Bestätigung des zuständigen Nachlassgerichts.","Die Steuerbescheide der letzten drei Jahre der verstorbenen Person und aller ihrer Erben."],"richtig":[0],"erkl":"Der Tod ist unverzüglich mitzuteilen; vorzulegen sind eine amtliche Sterbeurkunde mit Alter und Geburtsort und eine ausführliche ärztliche oder amtliche Bescheinigung über die Todesursache, dazu auf Verlangen der Versicherungsschein. Ein Erbschein ist nur nötig, wenn die Leistung an die Erben geht.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 7.1 und 7.2","id":"1.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Selbsttötung der versicherten Person treffen zu?","aussagen":[["Bei vorsätzlicher Selbsttötung vor Ablauf von drei Jahren seit Vertragsabschluss besteht kein Versicherungsschutz.",true],["Der Schutz bleibt, wenn eine krankhafte Störung der Geistestätigkeit die freie Willensbestimmung ausschloss.",true],["Besteht wegen der Selbsttötung kein Schutz, zahlt die Proximus den Rückkaufswert zuzüglich Überschussbeteiligung.",true],["Die Dreijahresfrist kann auch durch Einzelvereinbarung nicht verlängert werden.",false],["Nach Ablauf der drei Jahre ist eine Selbsttötung generell vom Versicherungsschutz ausgeschlossen.",false]],"erkl":"Nach drei Jahren seit Vertragsabschluss leistet die Proximus auch bei vorsätzlicher Selbsttötung; vorher zahlt sie nur den Rückkaufswert zuzüglich Überschussbeteiligung, außer bei krankhafter Störung der Geistestätigkeit. Die Frist kann nach § 161 Abs. 2 VVG einzeln verlängert werden.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 5.1 bis 5.3; § 161 VVG","id":"1.2-1-2"},{"typ":"mc","frage":"Nach welcher Frist erlöschen die Rechte des Versicherers wegen Verletzung der vorvertraglichen Anzeigepflicht, wenn weder Vorsatz noch Arglist vorliegt?","optionen":["Nach drei Jahren ab Vertragsschluss, genauso wie bei der Selbsttötung.","Nach fünf Jahren ab Vertragsschluss, außer der Versicherungsfall trat vorher ein.","Nach zehn Jahren ab Vertragsschluss, und zwar unabhängig vom Grad des Verschuldens.","Nach zwei Jahren ab Zugang des Versicherungsscheins beim Versicherungsnehmer."],"richtig":[1],"erkl":"Die Rechte zu Rücktritt, Kündigung und Vertragsänderung erlöschen nach fünf Jahren seit Vertragsschluss, bei Vorsatz oder Arglist nach zehn Jahren – nicht für Versicherungsfälle, die vor Fristablauf eingetreten sind.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.16; § 21 Abs. 3 VVG","id":"1.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Verschulden bei falschen Gesundheitsangaben die Rechtsfolge zu.","paare":[["Arglistige Täuschung","Anfechtung des Vertrags"],["Vorsatz","Rücktritt vom Vertrag"],["Einfache Fahrlässigkeit","Kündigung mit Monatsfrist oder Vertragsanpassung"]],"erkl":"Rücktritt setzt Vorsatz oder grobe Fahrlässigkeit voraus; bei einfacher Fahrlässigkeit bleiben Kündigung mit Monatsfrist oder Vertragsanpassung; Arglist berechtigt zur Anfechtung.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.5, 6.8, 6.11 und 6.17; §§ 19, 22 VVG","id":"1.2-1-4"},{"typ":"mc","frage":"Der Versicherer tritt nach Eintritt des Versicherungsfalls wirksam zurück. Wann bleibt er trotzdem zur Leistung verpflichtet?","optionen":["Wenn der Versicherungsnehmer alle Beiträge bis zum Tod pünktlich gezahlt hat.","Wenn der Vermittler beim Ausfüllen des Antrags nicht persönlich anwesend war.","Wenn der verschwiegene Umstand für Eintritt und Umfang des Falls nicht ursächlich war.","Wenn die Erben dem Rücktritt nicht innerhalb eines Monats ausdrücklich zustimmen."],"richtig":[2],"erkl":"Nach dem Versicherungsfall bleibt die Leistungspflicht bestehen, wenn der nicht angezeigte Umstand weder für Eintritt, Feststellung noch Umfang ursächlich war – außer bei Arglist.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.6; § 21 Abs. 2 VVG","id":"1.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Sabine Ebert aus Halle (Saale) war Versicherungsnehmerin und versicherte Person einer gemischten Lebensversicherung (Todesfallsumme 60.000 €), Beginn 01.04.2024. Widerruflich bezugsberechtigt ist ihr Ehemann Thomas. Frau Ebert starb am 20.08.2026 an einem Herzinfarkt. Der Hausarzt bescheinigt eine Behandlung wegen Bluthochdruck seit 2021. Im Antrag hatte sie die Frage nach Behandlungen in den letzten fünf Jahren mit „nein“ beantwortet.","items":[{"typ":"mc","frage":"Sie prüfen zuerst die Fristen. Was stellen Sie fest?","optionen":["Nach dem Tod der versicherten Person sind die Rechte aus § 19 VVG grundsätzlich immer ausgeschlossen.","Die Proximus hätte ihre Rechte innerhalb eines Jahres nach Vertragsbeginn ausüben müssen.","Die Prüfung entfällt, weil der Ehemann als Bezugsberechtigter nicht gefragt wurde.","Die Fünfjahresfrist ist noch nicht abgelaufen; die Proximus kann ihre Rechte noch ausüben."],"richtig":[3],"erkl":"Seit Vertragsschluss sind erst knapp zweieinhalb Jahre vergangen; die Ausschlussfrist von fünf Jahren läuft noch. Die Proximus muss ihr Recht aber innerhalb eines Monats ab Kenntnis geltend machen.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.15 und 6.16","id":"1.2-2-1"},{"typ":"mc","frage":"Welche Voraussetzung muss neben der falschen Antwort vorliegen, damit die Proximus zurücktreten darf?","optionen":["Sie hat in Textform gefragt und gesondert in Textform auf die Folgen hingewiesen.","Sie hat Frau Ebert vor Vertragsschluss von einem eigenen Arzt untersuchen lassen.","Sie hat den Antrag innerhalb von 14 Tagen nach Beginn noch einmal geprüft.","Sie hat dem Ehemann vor Antragstellung eine Kopie des Antrags zugeschickt."],"richtig":[0],"erkl":"Anzeigepflichtig sind nur Umstände, nach denen die Proximus in Textform gefragt hat; Rücktritt, Kündigung oder Vertragsänderung setzen zudem einen gesonderten Hinweis in Textform auf die Folgen voraus.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.1 und 6.13; § 19 Abs. 1 und 5 VVG","id":"1.2-2-2"},{"typ":"mc","frage":"Ergebnis: Frau Ebert hat grob fahrlässig falsch geantwortet, die Proximus hätte den Vertrag bei Kenntnis nicht geschlossen, und der Bluthochdruck war für den Herzinfarkt mitursächlich. Was teilen Sie Herrn Ebert mit?","optionen":["Die Proximus zahlt die volle Todesfallsumme, weil Frau Ebert nicht arglistig handelte.","Die Proximus tritt zurück und ist leistungsfrei; sie zahlt aber den Rückkaufswert aus.","Die Proximus zahlt wegen der groben Fahrlässigkeit die Hälfte der Todesfallsumme.","Die Proximus zahlt gar nichts aus; auch die gezahlten Beiträge verfallen vollständig."],"richtig":[1],"erkl":"Bei grober Fahrlässigkeit ist der Rücktritt möglich, weil die Proximus den Vertrag bei Kenntnis nicht geschlossen hätte; da der Umstand ursächlich war, entfällt die Leistung. Nach Rücktritt zahlt die Proximus den Rückkaufswert; die Beiträge werden nicht erstattet.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 6.5 bis 6.7; § 169 Abs. 1 VVG","id":"1.2-2-3"}]}]},{"nr":"1.3","titel":"Bezugsrecht und Besonderheiten der Abwicklung","lf":"LF 11","buch":"PV2 8.5 S. 593–597 · Lösungen S. 754–755","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann erwirbt ein widerruflich Bezugsberechtigter das Recht auf die Leistung?","optionen":["Sofort mit der Benennung; danach ist eine Änderung nur mit seiner Zustimmung möglich.","Erst nach Erteilung eines Erbscheins, der ihn als gesetzlichen Erben ausweist.","Erst mit Eintritt des Versicherungsfalls; bis dahin kann der VN es jederzeit ändern.","Mit Zahlung des ersten Beitrags; danach wird das Bezugsrecht automatisch unwiderruflich."],"richtig":[2],"erkl":"Der widerruflich Bezugsberechtigte erwirbt das Recht erst mit dem Versicherungsfall; der unwiderruflich Bezugsberechtigte sofort, sobald der Proximus die Erklärung zugegangen ist.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.2; § 159 Abs. 2 und 3 VVG","id":"1.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Gestaltung die passende Rechtsfolge zu.","paare":[["Widerrufliches Bezugsrecht","Der Anspruch entsteht erst mit dem Versicherungsfall."],["Unwiderrufliches Bezugsrecht","Der Anspruch wird sofort mit der Benennung erworben."],["Leistung an einen Bezugsberechtigten","Sie fällt nicht in den Nachlass (Vertrag zugunsten Dritter)."],["Kein Bezugsberechtigter benannt","Die Leistung fällt in den Nachlass und geht an die Erben."]],"erkl":"Mit dem Bezugsrecht wird die Lebensversicherung ein Vertrag zugunsten Dritter; der Anspruch geht am Nachlass vorbei direkt an den Begünstigten. Ohne Bestimmung leistet die Proximus an den Versicherungsnehmer bzw. dessen Erben.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.1 und 9.2; § 159 VVG; §§ 328, 331 BGB","id":"1.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Abwicklung eines Todesfalls treffen zu?","aussagen":[["Ist ein Bezugsberechtigter benannt, braucht die Proximus in der Regel keinen Erbschein.",true],["Die Proximus zeigt Todesfallleistungen dem für die Erbschaftsteuer zuständigen Finanzamt an.",true],["Eine Todesfallleistung an einen Bezugsberechtigten ist immer erbschaftsteuerfrei.",false],["Die Todesfallleistung unterliegt beim Bezugsberechtigten der Abgeltungsteuer.",false]],"erkl":"Die Leistung an den Bezugsberechtigten ist ein Erwerb von Todes wegen und erbschaftsteuerpflichtig (Freibeträge beachten), aber nicht einkommensteuerpflichtig; der Versicherer hat eine Anzeigepflicht.","norm":"§ 3 Abs. 1 Nr. 4 und § 33 Abs. 3 ErbStG","id":"1.3-1-3"},{"typ":"zahl","frage":"Ein 55-jähriger Kunde erhält nach 10 Jahren Laufzeit eine Ablaufleistung von 30.000 €. Er hat 26.000 € Beiträge gezahlt. Wie hoch ist die Abgeltungsteuer (25 %, ohne Solidaritätszuschlag, Kirchensteuer und Sparer-Pauschbetrag)?","wert":1000,"einheit":"€","tol":0.5,"erkl":"Ertrag: 30.000 € − 26.000 € = 4.000 €. Die 12/62-Regel ist nicht erfüllt, also voller Ertrag: 4.000 € × 25 % = 1.000 €.","norm":"§ 20 Abs. 1 Nr. 6, § 32d Abs. 1 EStG","id":"1.3-1-4"},{"typ":"mc","frage":"Der Versicherungsschein enthält eine Inhaberklausel. Was bedeutet das für die Auszahlung?","optionen":["Die Proximus muss an jeden Inhaber zahlen, auch wenn sie weiß, dass er nicht berechtigt ist.","Nur der Inhaber des Scheins kann das Bezugsrecht ändern, nicht der Versicherungsnehmer.","Der Inhaber wird automatisch Versicherungsnehmer und muss die Beiträge weiterzahlen.","Die Proximus kann an den Inhaber befreiend leisten, ohne seine Berechtigung zu prüfen."],"richtig":[3],"erkl":"Die Proximus kann den Inhaber der Urkunde als berechtigt ansehen, Leistungen in Empfang zu nehmen; sie kann aber auch einen Nachweis seiner Berechtigung verlangen (qualifiziertes Legitimationspapier).","norm":"Proximus 5, AB kapitalbildende LV Ziff. 8.2; § 4 Abs. 1 VVG; § 808 BGB","id":"1.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Klaus Wendt aus Merseburg ist am 03.09.2026 gestorben. Seine gemischte Lebensversicherung bei der Proximus hat eine Todesfallsumme von 50.000 €, dazu kommen Überschussanteile von 2.400 €. Widerruflich bezugsberechtigt sind „meine Kinder Lena und Paul zu gleichen Teilen“. In seinem Testament hat er seine Lebensgefährtin Anke Fröhlich als Alleinerbin eingesetzt. Frau Fröhlich verlangt die Auszahlung an sich.","items":[{"typ":"mc","frage":"An wen zahlen Sie die Todesfallleistung aus?","optionen":["Lena und Paul je zur Hälfte, weil das Bezugsrecht dem Testament vorgeht.","Frau Fröhlich, weil sie als Alleinerbin den gesamten Nachlass allein erhält.","Allen drei Personen zu gleichen Teilen, also jeweils einem Drittel.","Niemandem, bis das Nachlassgericht über das Testament entschieden hat."],"richtig":[0],"erkl":"Die Leistung an Bezugsberechtigte fällt nicht in den Nachlass; das Testament ändert das Bezugsrecht nicht. Ein Widerruf hätte der Proximus in Textform angezeigt werden müssen. Mehrere Bezugsberechtigte erhalten den bestimmten Anteil.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.2 und 9.4; §§ 159, 160 Abs. 1 VVG; § 331 BGB","id":"1.3-2-1"},{"typ":"zahl","frage":"Wie viel Euro erhält jedes Kind?","wert":26200,"einheit":"€","tol":0.5,"erkl":"Versicherungssumme und Überschussanteile werden zusammen ausgezahlt: (50.000 € + 2.400 €) : 2 = 26.200 €.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 1.1 und 2.3.3; § 160 Abs. 1 VVG","id":"1.3-2-2"},{"typ":"mc","frage":"Was muss die Proximus vor der Auszahlung an Lena und Paul zusätzlich beachten?","optionen":["Sie behält 25 % Abgeltungsteuer auf die gesamte Todesfallleistung ein.","Sie zeigt die Auszahlung dem für die Erbschaftsteuer zuständigen Finanzamt an.","Sie braucht zuvor die schriftliche Zustimmung von Frau Fröhlich als Alleinerbin.","Sie muss für beide Kinder einen Erbschein beim Amtsgericht anfordern."],"richtig":[1],"erkl":"Versicherer müssen Zahlungen im Todesfall an andere Personen als den Versicherungsnehmer dem Erbschaftsteuer-Finanzamt anzeigen; Abgeltungsteuer fällt im Todesfall nicht an.","norm":"§ 33 Abs. 3 ErbStG","id":"1.3-2-3"}]}]}],"lf":"LF 11"},{"nr":"2","titel":"Vertragsänderungen und Verfügungen über die Lebensversicherung","abschnitte":[{"nr":"2.1","titel":"Kündigung und Rückkaufswert am Beispiel der gemischten Lebensversicherung","lf":"LF 11","buch":"PV2 4.1–4.8 S. 156–211 · Lösungen S. 687–695","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann kann der Versicherungsnehmer eine Lebensversicherung mit laufender Beitragszahlung kündigen?","optionen":["Nur zum Ende jedes fünften Versicherungsjahres mit einer Frist von drei Monaten.","Nur mit Zustimmung des Versicherers und des widerruflich Bezugsberechtigten.","Jederzeit für den Schluss der laufenden Versicherungsperiode.","Gar nicht, eine Lebensversicherung ist bis zum Ablauf unkündbar."],"richtig":[2],"erkl":"Der Versicherungsnehmer kann seinen Vertrag jederzeit zum Schluss der laufenden Versicherungsperiode in Textform kündigen, auch teilweise.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.1; § 168 Abs. 1 VVG","id":"2.1-1-1"},{"typ":"zahl","frage":"Die Proximus hat Abschluss- und Vertriebskosten von 3.000 € angesetzt und verteilt sie für den Mindest-Rückkaufswert gleichmäßig auf die ersten fünf Vertragsjahre. Wie viel Euro davon dürfen bei einer Kündigung zum Ende des zweiten Vertragsjahres höchstens verrechnet sein?","wert":1200,"einheit":"€","tol":0.5,"erkl":"3.000 € : 5 Jahre = 600 € je Jahr; nach zwei Jahren 2 × 600 € = 1.200 €.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.3 Satz 2; § 169 Abs. 3 VVG","id":"2.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Rückkaufswert bei der Proximus treffen zu?","aussagen":[["Der Rückkaufswert ist das nach anerkannten Regeln der Versicherungsmathematik berechnete Deckungskapital.",true],["Bei Kündigung nimmt die Proximus keinen Abzug einer Stornogebühr vor.",true],["Noch nicht getilgte Abschluss- und Vertriebskosten darf der Versicherer zusätzlich abziehen.",false],["Neben dem Rückkaufswert erhält der Kunde die ihm zugeteilten Überschussanteile.",true]],"erkl":"Die Proximus zahlt nach Kündigung den Rückkaufswert und die Überschussbeteiligung; eine Stornogebühr zieht sie nicht ab, nur Beitragsrückstände. Ein Abzug für noch nicht getilgte Abschlusskosten wäre nach § 169 Abs. 5 VVG unwirksam.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.2 bis 12.4 und 12.6; § 169 VVG","id":"2.1-1-3"},{"typ":"mc","frage":"Welcher wirtschaftliche Nachteil droht bei der Kündigung einer gemischten Lebensversicherung in den ersten Jahren?","optionen":["Der Kunde erhält alle Beiträge zurück, verliert aber die gutgeschriebenen Zinsen vollständig.","Der Kunde muss die Abschlusskosten nachzahlen, die durch Beiträge noch nicht gedeckt sind.","Der Kunde verliert den Todesfallschutz, bekommt aber in jedem Fall mindestens alle Beiträge zurück.","Der Rückkaufswert liegt meist unter den eingezahlten Beiträgen, und der Todesfallschutz entfällt."],"richtig":[3],"erkl":"In den ersten Jahren ist wegen der Verrechnung der Abschluss- und Vertriebskosten nur der Mindestwert vorhanden; der Rückkaufswert erreicht nicht unbedingt die Beitragssumme. Zudem endet der Versicherungsschutz.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.7 und 14.4","id":"2.1-1-4"},{"typ":"zuo","frage":"Ordnen Sie jeder Alternative zur vollständigen Kündigung die passende Beschreibung zu.","paare":[["Beitragsfreistellung","Die Beitragszahlung endet, der Vertrag läuft mit herabgesetzter Summe weiter."],["Teilweise Beitragsfreistellung","Ein Teil des Beitrags entfällt; mindestens 20 € monatlich sind weiterzuzahlen."],["Teilweise Kündigung","Ein Teil wird ausgezahlt; es bleiben mindestens 20.000 € Summe oder 240 € Jahresbeitrag."]],"erkl":"Alle drei Wege erhalten den Vertrag. Bei vollständiger Beitragsfreistellung muss die beitragsfreie Versicherungssumme mindestens 500 € erreichen, sonst wird der Auszahlungsbetrag gezahlt und der Vertrag endet.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.1, 13.1 und 13.4","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Jana Kowalski (38) aus Halle (Saale) hat seit dem 01.01.2022 eine Kapitallebensversicherung auf den Todes- und Erlebensfall bei der Proximus mit einem Monatsbeitrag von 150 €. Wegen Arbeitslosigkeit kündigt sie zum 31.12.2026. Die Proximus teilt mit: Rückkaufswert 7.640 €, zugeteilte Überschussanteile 410 €, Beitragsrückstände bestehen nicht.","items":[{"typ":"zahl","frage":"Welchen Betrag zahlt die Proximus an Frau Kowalski aus?","wert":8050,"einheit":"€","tol":0.5,"erkl":"Die Proximus zieht keine Stornogebühr ab. Auszahlung: Rückkaufswert 7.640 € + Überschussanteile 410 € = 8.050 €.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.2, 12.4 und 12.6","id":"2.1-2-1"},{"typ":"zahl","frage":"Wie viel Euro weniger erhält Frau Kowalski, als sie an Beiträgen eingezahlt hat?","wert":950,"einheit":"€","tol":0.5,"erkl":"Beiträge: 5 × 12 × 150 € = 9.000 €. 9.000 € − 8.050 € = 950 €. Weil kein Ertrag entsteht, fällt keine Steuer an.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 12.7 und 12.8; § 20 Abs. 1 Nr. 6 EStG","id":"2.1-2-2"},{"typ":"mc","frage":"Frau Kowalski möchte eigentlich nur vorübergehend Beiträge sparen. Welchen Rat geben Sie?","optionen":["Prüfen Sie eine ganze oder teilweise Beitragsfreistellung; der Vertrag bleibt bestehen.","Kündigen Sie lieber sofort, weil der Rückkaufswert später sinkt und danach nie wieder ansteigt.","Lassen Sie die Beiträge einfach offen; die Proximus mahnt nicht und der Schutz bleibt.","Schließen Sie zusätzlich einen neuen Vertrag ab, um den Verlust später auszugleichen."],"richtig":[0],"erkl":"Statt zu kündigen, kann Frau Kowalski ganz oder teilweise beitragsfrei stellen; der Vertrag läuft mit herabgesetzter Summe weiter. Offene Beiträge führen dagegen zu Zahlungsfrist (mindestens 2 Wochen) und Kündigung; in der Lebensversicherung wandelt sich der Vertrag dann in eine beitragsfreie Versicherung um (§ 166 VVG).","norm":"Proximus 5, AB kapitalbildende LV Ziff. 11.3 bis 11.5, 13.1 und 13.4; § 166 VVG","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Abtretung, Verpfändung, Policendarlehen und Beitragsfreistellung","lf":"LF 11","buch":"PV2 4.1–4.8 S. 156–211 · Lösungen S. 687–695","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Verfügung die passende Beschreibung zu.","paare":[["Abtretung","Der neue Gläubiger wird Inhaber der Ansprüche aus dem Vertrag."],["Verpfändung","Die Ansprüche bleiben beim Kunden, der Gläubiger erhält ein Pfandrecht."],["Sicherungsabtretung","Abtretung nur zur Sicherung eines Darlehens, Rückübertragung nach Tilgung."]],"erkl":"Bei der Abtretung wechselt der Gläubiger; bei der Verpfändung bleibt die Forderung beim Kunden und wird nur belastet.","norm":"§ 398 BGB; §§ 1273, 1279 ff. BGB","id":"2.2-1-1"},{"typ":"mc","frage":"Wann wird eine Abtretung der Ansprüche aus der Lebensversicherung gegenüber der Proximus wirksam?","optionen":["Sobald Kunde und Bank den Abtretungsvertrag mündlich vereinbart haben.","Wenn der bisherige Berechtigte sie der Proximus in Textform angezeigt hat.","Erst wenn ein Notar die Abtretung beurkundet und eingereicht hat.","Erst wenn auch der Bezugsberechtigte der Abtretung schriftlich zugestimmt hat."],"richtig":[1],"erkl":"Nach den Proximus-Bedingungen sind Abtretung und Verpfändung der Proximus gegenüber nur und erst dann wirksam, wenn der bisherige Berechtigte sie in Textform angezeigt hat.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.3 und 9.4; § 1280 BGB","id":"2.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Abtretung und Verpfändung treffen zu?","aussagen":[["Die Verpfändung einer Forderung ist nur wirksam, wenn sie dem Schuldner angezeigt wird.",true],["Vor Pfandreife kann der Versicherer nur an Kunde und Pfandgläubiger gemeinsam leisten.",true],["Bei der Abtretung bleibt der Kunde Inhaber der Ansprüche aus dem Vertrag.",false],["Mit der Abtretung wird der Versicherungsvertrag aufgehoben.",false]],"erkl":"Bei der Verpfändung ist die Anzeige Wirksamkeitsvoraussetzung; vor Pfandreife leistet der Schuldner an beide gemeinsam. Die Abtretung überträgt die Ansprüche, der Vertrag besteht fort.","norm":"§§ 1280, 1281 BGB; § 398 BGB; Proximus 5, AB kapitalbildende LV Ziff. 9.3 und 9.4","id":"2.2-1-3"},{"typ":"mc","frage":"Was versteht man allgemein unter einem Policendarlehen?","optionen":["Ein Bankkredit, für den der Versicherer gegenüber der Bank selbstschuldnerisch bürgt.","Eine zinslose Rückzahlung der bisher gezahlten Beiträge ohne Vertragsfolgen.","Eine verzinsliche Vorauszahlung auf die Leistung bis zur Höhe des Rückkaufswerts.","Ein zinsloses Darlehen des Versicherers in Höhe der vollen Versicherungssumme."],"richtig":[2],"erkl":"Das Policendarlehen ist eine verzinsliche Vorauszahlung, begrenzt durch den Rückkaufswert; es wird bei Auszahlung der Leistung verrechnet. Die Proximus-Bedingungen zur kapitalbildenden LV sehen es nicht vor; es wäre gesondert zu vereinbaren.","norm":"Fachbegriff (PV2 4); in Proximus 5, AB kapitalbildende LV nicht geregelt","id":"2.2-1-4"},{"typ":"mc","frage":"Was geschieht bei einer Beitragsfreistellung nach den Proximus-Bedingungen?","optionen":["Die Beitragszahlung endet; der Vertrag wird aufgelöst und der Rückkaufswert ausgezahlt.","Die Beitragszahlung ruht vorübergehend; die volle Versicherungssumme bleibt unverändert garantiert.","Die Beitragszahlung endet; die Beiträge werden später mit Zinsen nachgefordert.","Die Beitragszahlung endet; die Leistung sinkt auf eine beitragsfreie Versicherungssumme."],"richtig":[3],"erkl":"Die Proximus setzt die Versicherungssumme auf eine beitragsfreie Versicherungssumme herab; der Vertrag läuft weiter. Erreicht diese den Mindestbetrag von 500 € nicht, wird der Auszahlungsbetrag gezahlt und der Vertrag endet.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 13.1 und 13.4; § 165 VVG","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Dirk Sommer aus Halle (Saale) nimmt bei der Saalebank ein Darlehen über 30.000 € auf. Als Sicherheit tritt er die Ansprüche aus seiner kapitalbildenden Lebensversicherung bei der Proximus (Todesfallsumme 80.000 €) an die Bank ab und zeigt dies der Proximus in Textform an. Widerruflich bezugsberechtigt ist seine Ehefrau Ines. Herr Sommer stirbt. Die Restschuld beträgt 18.500 €, die Todesfallleistung einschließlich Überschüssen 82.300 €.","items":[{"typ":"mc","frage":"Welche Wirkung hat die Sicherungsabtretung auf das Bezugsrecht von Frau Sommer?","optionen":["Das Bezugsrecht tritt in Höhe der gesicherten Forderung hinter die Rechte der Bank zurück.","Das Bezugsrecht bleibt vorrangig; die Bank erhält nur, was Frau Sommer übrig lässt.","Das Bezugsrecht erlischt endgültig, auch nach vollständiger Tilgung des Darlehens.","Das Bezugsrecht geht vollständig auf die Bank über, und zwar auch für den nicht gesicherten Rest."],"richtig":[0],"erkl":"Die Sicherungsabtretung geht dem widerruflichen Bezugsrecht vor, aber nur soweit der Sicherungszweck reicht; der Rest steht der Bezugsberechtigten zu.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.2 bis 9.4; § 159 VVG; § 398 BGB","id":"2.2-2-1"},{"typ":"zahl","frage":"Wie viel Euro erhält Frau Sommer?","wert":63800,"einheit":"€","tol":0.5,"erkl":"82.300 € − 18.500 € (an die Saalebank) = 63.800 €.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.2 und 9.3; § 159 VVG; § 398 BGB","id":"2.2-2-2"},{"typ":"wf","frage":"Welche Aussagen zur Abwicklung treffen zu?","aussagen":[["Die Proximus zahlt 18.500 € an die Saalebank.",true],["Die Abtretung war gegenüber der Proximus wirksam, weil Herr Sommer sie in Textform angezeigt hat.",true],["Hätte Herr Sommer verpfändet statt abgetreten, wäre eine Anzeige entbehrlich gewesen.",false],["Nach Tilgung des Darlehens hätte die Bank die Ansprüche zurückübertragen müssen.",true]],"erkl":"Die Bank erhält nur die gesicherte Restschuld. Auch die Verpfändung braucht die Anzeige in Textform; nach Tilgung entfällt der Sicherungszweck.","norm":"Proximus 5, AB kapitalbildende LV Ziff. 9.4; § 1280 BGB","id":"2.2-2-3"}]}]}],"lf":"LF 11"},{"nr":"3","titel":"Rentenversicherung und Zusatzschutz","abschnitte":[{"nr":"3.1","titel":"Leibrentenversicherung mit aufgeschobener Rentenzahlung","lf":"LF 11","buch":"PV2 8.5.4 S. 598–604 · Lösungen S. 755–756","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was kennzeichnet die Leibrentenversicherung mit aufgeschobener Rentenzahlung?","optionen":["Der Kunde zahlt einen Einmalbeitrag, die Rente beginnt sofort und endet nach zehn Jahren.","Der Kunde zahlt in der Aufschubzeit Beiträge und erhält ab Rentenbeginn lebenslang Rente.","Der Kunde bzw. seine Erben erhalten bei Tod in der Aufschubzeit stets die doppelte Jahresrente.","Der Kunde erhält die Rente nur, solange er berufsunfähig ist, längstens bis zum 67."],"richtig":[1],"erkl":"In der Aufschubzeit wird Kapital angespart; erlebt die versicherte Person den Rentenzahlungsbeginn, zahlt die Proximus die Rente, solange sie lebt, und trägt damit das Langlebigkeitsrisiko.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.1","id":"3.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Aufschubzeit","Zeit zwischen Vertragsbeginn und Rentenbeginn"],["Rentengarantiezeit","Weiterzahlung bei Tod nach Rentenbeginn bis zu deren Ende"],["Beitragsrückgewähr","Rückzahlung der gezahlten Beiträge bei Tod vor Rentenbeginn"],["Kapitalwahlrecht","Einmalige Auszahlung statt Rente auf Antrag vor Rentenbeginn"]],"erkl":"Garantiezeit und Beitragsrückgewähr sind Todesfallleistungen für Hinterbliebene. Die Kapitalabfindung muss spätestens einen Monat vor Fälligkeit der ersten Rente beantragt werden.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.2 bis 1.4","id":"3.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur privaten Leibrentenversicherung treffen zu?","aussagen":[["Sie sichert vor allem das Risiko ab, länger zu leben, als das Ersparte reicht.",true],["Ohne vereinbarte Todesfallleistung endet die Rentenzahlung mit dem Tod der versicherten Person.",true],["Vor Abschluss prüft der Versicherer stets ausführlich die Gesundheit der versicherten Person.",false],["Die laufende Rente wird nur mit dem Ertragsanteil besteuert.",true]],"erkl":"Ohne Rentengarantiezeit endet der Vertrag mit dem Tod nach Rentenbeginn ohne weitere Leistung. Beim Langlebigkeitsrisiko ist eine Gesundheitsprüfung meist nicht nötig. Die laufende private Leibrente wird mit dem Ertragsanteil besteuert.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.1 und 1.4; § 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG","id":"3.1-1-3"},{"typ":"mc","frage":"Wie wird die Kapitalabfindung bei Ausübung des Kapitalwahlrechts steuerlich behandelt?","optionen":["Wie eine laufende Rente: nur der Ertragsanteil ist in einem Betrag zu versteuern.","Gar nicht, weil das Kapital aus bereits versteuertem Einkommen angespart wurde.","Wie eine Kapitallebensversicherung: Ertrag steuerpflichtig, bei 12/62 nur zur Hälfte.","Mit 25 % Abgeltungsteuer auf die gesamte Auszahlung, also nicht nur auf den Ertrag."],"richtig":[2],"erkl":"Die Kapitalauszahlung einer Rentenversicherung fällt unter § 20 Abs. 1 Nr. 6 EStG: Ertrag = Auszahlung minus Beiträge, bei 12 Jahren Laufzeit und Alter 62 hälftig.","norm":"§ 20 Abs. 1 Nr. 6 EStG; Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.2","id":"3.1-1-4"},{"typ":"mc","frage":"Warum vereinbaren viele Kunden eine Rentengarantiezeit?","optionen":["Damit die Rente in der Garantiezeit jedes Jahr um einen festen Prozentsatz steigen muss.","Damit der Versicherer in dieser Zeit keine Überschüsse an den Kunden zuteilen muss.","Damit der Kunde in der Garantiezeit keine Einkommensteuer auf die Rente zahlen muss.","Damit Hinterbliebene die Rente bis zum Ende der Garantiezeit erhalten, wenn er früh stirbt."],"richtig":[3],"erkl":"Die Rentengarantiezeit ist ein Hinterbliebenenschutz: Stirbt die versicherte Person nach Rentenbeginn früh, zahlt die Proximus die Rente bis zum Ende der Garantiezeit weiter.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.4","id":"3.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Petra Lange (geb. 1976) aus Halle (Saale) hat seit dem 01.01.2016 eine Rentenversicherung mit aufgeschobener Rentenzahlung nach Tarif S 30 bei der Proximus (Eintrittsalter 40, Rentenbeginnalter 67). Sie zahlt jährlich zum 01.01. einen Beitrag von 1.200 €. Rentenbeginn ist der 01.01.2043. Der Tarif sieht eine Beitragsrückgewähr bei Tod vor Rentenbeginn und eine Rentengarantiezeit von 10 Jahren vor. Laut Tarif S 30 beträgt die Monatsrente garantiert 127,25 € und voraussichtlich einschließlich Überschüssen 205,25 €. Ihr Ehemann fragt nach den Leistungen.","items":[{"typ":"zahl","frage":"Welche Beitragsrückgewähr erhielte der Bezugsberechtigte, wenn Frau Lange am 30.09.2026 stürbe (Beitrag 2026 gezahlt, ohne Überschussbeteiligung)?","wert":13200,"einheit":"€","tol":0.5,"erkl":"Gezahlt wurden die Jahresbeiträge zum 01.01.2016 bis 01.01.2026: 11 × 1.200 € = 13.200 €. Diese Beiträge zahlt die Proximus bei Tod vor Rentenbeginn zurück.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.3; Tarif S 30","id":"3.1-2-1"},{"typ":"zahl","frage":"Bei Rentenbeginn mit 67 beträgt der Ertragsanteil 17 %. Wie viel Euro der voraussichtlichen Jahresrente muss Frau Lange als sonstige Einkünfte versteuern?","wert":418.71,"einheit":"€","tol":0.5,"erkl":"Jahresrente: 12 × 205,25 € = 2.463,00 €. Ertragsanteil: 2.463,00 € × 17 % = 418,71 €.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG; Proximus 5, Tarif S 30","id":"3.1-2-2"},{"typ":"mc","frage":"Frau Lange stirbt vier Jahre nach Rentenbeginn. Was gilt?","optionen":["Die Rente wird noch sechs Jahre bis zum Ende der Garantiezeit an die Bezugsberechtigten gezahlt.","Die Rente endet sofort; die Hinterbliebenen erhalten die eingezahlten Beiträge zurück.","Die Rente wird lebenslang an den Ehemann weitergezahlt, solange er selbst noch lebt, ohne Begrenzung.","Die Rente wird zehn weitere Jahre gezahlt, weil die Garantiezeit erst mit dem Tod beginnt."],"richtig":[0],"erkl":"Die Garantiezeit läuft ab Rentenbeginn: 10 Jahre − 4 Jahre = noch 6 Jahre Rentenzahlung. Die Beitragsrückgewähr gilt nur vor Rentenbeginn.","norm":"Proximus 5, AB Rentenversicherung aufgeschoben Ziff. 1.3 und 1.4; Tarif S 30","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Berufsunfähigkeit im Leistungsfall und weitere Versicherungsschutzangebote","lf":"LF 11","buch":"PV2 8.5.5 S. 605–619 · Lösungen S. 756–758","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann liegt nach den Proximus-Bedingungen zur BUZ Berufsunfähigkeit vor?","optionen":["Wenn die versicherte Person mindestens drei Monate vollständig arbeitsunfähig krankgeschrieben ist.","Wenn die versicherte Person voraussichtlich mindestens sechs Monate zu mindestens 50 % ihren Beruf nicht ausüben kann.","Wenn die gesetzliche Rentenversicherung der versicherten Person eine volle Erwerbsminderungsrente bewilligt.","Wenn die versicherte Person ihren zuletzt ausgeübten Beruf zu mindestens 25 % auf Dauer nicht ausüben kann."],"richtig":[1],"erkl":"Berufsunfähig ist, wer infolge Krankheit, Körperverletzung oder mehr als altersentsprechenden Kräfteverfalls voraussichtlich mindestens 6 Monate ununterbrochen seinen zuletzt ausgeübten Beruf nicht mehr zu mindestens 50 % ausüben kann und keine vergleichbare andere Tätigkeit ausübt.","norm":"Proximus 5, BB BUZ Ziff. 2.1; § 172 Abs. 2 VVG","id":"3.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Berufsunfähigkeits-Zusatzversicherung (BUZ) der Proximus im Leistungsfall treffen zu?","aussagen":[["Bei anerkannter Berufsunfähigkeit wird der Kunde von der Beitragszahlung für Haupt- und Zusatzversicherung befreit.",true],["Die BU-Rente wird nur gezahlt, wenn die versicherte Person zusätzlich arbeitslos ist.",false],["Der Versicherer muss in Textform erklären, ob er seine Leistungspflicht anerkennt.",true],["Ein zeitlich befristetes Anerkenntnis ist beliebig oft hintereinander zulässig.",false]],"erkl":"Leistungen der BUZ sind Beitragsbefreiung für Haupt- und Zusatzversicherungen und ggf. BU-Rente. Die Proximus erklärt in Textform, ob sie ihre Leistungspflicht anerkennt; befristen darf sie das Anerkenntnis nur einmalig und mit sachlichem Grund.","norm":"Proximus 5, BB BUZ Ziff. 1.1, 5.1 und 5.2; § 173 VVG","id":"3.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Abstrakte Verweisung","Verweis auf einen zumutbaren anderen Beruf, auch wenn er nicht ausgeübt wird"],["Konkrete Verweisung","Verweis nur auf einen tatsächlich ausgeübten vergleichbaren Beruf"],["Beitragsbefreiung","Die Proximus übernimmt die Beiträge für Haupt- und Zusatzversicherung"],["Berufsunfähigkeitsrente","Monatliche Zahlung als Ersatz für das wegfallende Einkommen"]],"erkl":"Die Proximus-BUZ kennt nur die konkrete Verweisung: Keine BU liegt vor, wenn die versicherte Person eine andere Tätigkeit ausübt, die ihrer bisherigen Lebensstellung entspricht. Renten zahlt die Proximus monatlich im Voraus.","norm":"Proximus 5, BB BUZ Ziff. 1.1, 1.8 und 2.1; § 172 Abs. 3 VVG","id":"3.2-1-3"},{"typ":"mc","frage":"Die Proximus stellt bei der Nachprüfung fest, dass die Berufsunfähigkeit weggefallen ist. Ab wann wird sie frühestens leistungsfrei?","optionen":["Sofort mit dem Tag, an dem der Gutachter die Besserung festgestellt hat.","Erst nach Ablauf von drei Jahren seit dem ersten Leistungsanerkenntnis.","Mit Ablauf des dritten Monats nach Zugang der Mitteilung in Textform.","Rückwirkend ab dem Tag, an dem sich die Gesundheit tatsächlich besserte."],"richtig":[2],"erkl":"Die Proximus muss den Wegfall in Textform darlegen; sie kann ihre Leistungen frühestens mit Ablauf des dritten Monats nach Zugang dieser Erklärung einstellen. Ab dann sind auch wieder Beiträge zu zahlen.","norm":"Proximus 5, BB BUZ Ziff. 6.4; § 174 VVG","id":"3.2-1-4"},{"typ":"mc","frage":"Eine Familie hat ein Haus finanziert. Welches Angebot schließt die Versorgungslücke beim Tod des Hauptverdieners am günstigsten?","optionen":["Eine Berufsunfähigkeitsversicherung, weil sie auch beim Tod eine lebenslange Rente zahlt.","Eine aufgeschobene Leibrentenversicherung ohne Todesfallleistung und ohne Garantiezeit.","Eine Unfalltod-Zusatzversicherung, weil sie bei jeder Todesursache die volle Summe zahlt.","Eine Risikolebensversicherung mit einer Summe, die zur Restschuld des Darlehens passt."],"richtig":[3],"erkl":"Die Risikolebensversicherung zahlt die vereinbarte Versicherungssumme nur, wenn die versicherte Person während der Versicherungsdauer stirbt; deshalb ist sie günstig. Die Unfalltod-Zusatzversicherung leistet nur bei Tod durch Unfall.","norm":"Proximus 5, AB Risikolebensversicherung Ziff. 1.1; BB Unfalltod-Zusatzversicherung Ziff. 1.1","id":"3.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Marco Heinze (41), Dachdecker aus Halle (Saale), hat eine Kapitallebensversicherung mit Berufsunfähigkeits-Zusatzversicherung bei der Proximus. Der Monatsbeitrag beträgt insgesamt 185 €, die vereinbarte garantierte BU-Rente 1.200 € monatlich; die Proximus-BUZ sieht nur eine konkrete Verweisung vor. Am 14.03.2026 stürzte er vom Dach. Das Gutachten ergibt: Er kann voraussichtlich dauerhaft zu 70 % nicht mehr als Dachdecker arbeiten. Er meldet den Fall am 02.06.2026.","items":[{"typ":"mc","frage":"Liegt ein Leistungsfall vor?","optionen":["Ja, er kann voraussichtlich mindestens sechs Monate zu mehr als 50 % nicht als Dachdecker arbeiten.","Nein, weil er als Dachdecker noch in eine Bürotätigkeit wechseln könnte und das nach den Bedingungen tun muss.","Nein, weil die Meldung später als einen Monat nach dem Unfall bei der Proximus eingegangen ist.","Nein, weil Leistungen aus der BUZ erst nach einer Wartezeit von zwei Jahren gezahlt werden."],"richtig":[0],"erkl":"Der BU-Grad von 70 % liegt über 50 % und die Prognose ist dauerhaft. Die Proximus darf nur auf eine tatsächlich ausgeübte Tätigkeit verweisen, nicht auf eine mögliche Bürotätigkeit. Die Meldung kam innerhalb von drei Monaten nach Eintritt der BU; der Anspruch entsteht daher mit Ablauf des Monats, in dem die BU eingetreten ist.","norm":"Proximus 5, BB BUZ Ziff. 1.4 und 2.1","id":"3.2-2-1"},{"typ":"zahl","frage":"Wie hoch ist der laufende jährliche Vorteil für Herrn Heinze aus BU-Rente und Beitragsbefreiung zusammen (ohne die einmalige Anfangshilfe)?","wert":16620,"einheit":"€","tol":0.5,"erkl":"BU-Rente: 12 × 1.200 € = 14.400 €. Beitragsbefreiung: 12 × 185 € = 2.220 €. Zusammen 16.620 € pro Jahr. Zusätzlich zahlt die Proximus bei der ersten fälligen BU-Rente einmalig eine Anfangshilfe von 3 garantierten Monatsrenten (3.600 €).","norm":"Proximus 5, BB BUZ Ziff. 1.1 und 1.10","id":"3.2-2-2"},{"typ":"zuo","frage":"Herr Heinze fragt nach weiteren Absicherungen für seine Familie. Ordnen Sie jedem Angebot die passende Leistung zu.","paare":[["Unfalltod-Zusatzversicherung","Zusätzliche Todesfallleistung, wenn der Tod durch einen Unfall eintritt"],["Risikolebensversicherung","Reine Todesfallleistung für Hinterbliebene zu geringem Beitrag"],["Hinterbliebenenrenten-Zusatzversicherung","Laufende Rente an Hinterbliebene nach dem Tod der versicherten Person"]],"erkl":"Die Unfalltod-Zusatzversicherung zahlt die Zusatzversicherungssumme bei Tod an Unfallfolgen; die Hinterbliebenenrenten-Zusatzversicherung zahlt der mitversicherten Person eine lebenslange Rente. Für einen Dachdecker mit Familie ist der Hinterbliebenenschutz besonders wichtig.","norm":"Proximus 5, BB Unfalltod-Zusatzversicherung Ziff. 1.1; AB Hinterbliebenenrenten-Zusatzversicherung Ziff. 1.1; AB Risikolebensversicherung Ziff. 1.1","id":"3.2-2-3"}]}]}],"lf":"LF 11"}],"reset":["1.1-1-1","1.1-2-1","1.1-2-2","1.2-1-1","1.2-1-2","2.1-1-2","2.1-1-3","2.1-1-5","2.1-2-1","2.1-2-2","2.1-2-3","2.2-1-4","2.2-1-5","3.1-2-1","3.1-2-2","3.2-1-1","3.2-1-2","3.2-1-5","3.2-2-2","3.2-2-3"]};
const K=D.key;let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){S={}}
const save=()=>{S._rw=2;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
// Umstellung auf Proximus 5 (15.10.2026): alte Stände der Aufgaben mit geänderter Lösung (D.reset) gelten nicht mehr (einmalig löschen)
if(Object.keys(S).length&&S._rw!==2){for(const k of (D.reset||[]))delete S[k];save()}
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}
const online=/^https?:$/.test(location.protocol);
function simStand(){const s=S._sim;return s&&typeof s==='object'&&s.beste&&typeof s.beste.r==='number'?s:null}
const $=s=>document.querySelector(s);const app=$('#app');
$('#brand').innerHTML=D.titel+'<small>'+D.untertitel+'</small>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
function pills(st){return `<div class="pills"><span class="pill"><span class="dot ${st.pR?'g':''}"></span>${st.pR} % Richtig</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % Fortschritt</span></div>`}
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p[1]?`<a data-go="${p[1]}">${esc(p[0])}</a>`:esc(p[0])).join(' › ')+'</div>'}
function home(){const all=D.module.flatMap(modItems),st=stat(all);
 app.innerHTML=`<div class="box"><h1>${esc(D.sparte)} · GAP 2 Teil 1.2</h1><p class="hint">${esc(D.intro)} Jeder Abschnitt hat eine Lektion „Grundwissen“ und eine „Prüfungssituation“. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}</div>
 <div class="box">${D.module.map((m,i)=>{const s=stat(modItems(m));return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${m.abschnitte.length} Abschnitte · ${s.t} Seiten · ${esc(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">Drei Fälle aus verschiedenen Abschnitten wie in Teil 1.2 der Prüfung, Auswertung je Themenbereich</div>${simKurz()}</div></div></div>`}
function simKurz(){const s=simStand();if(!s)return '<div class="meta" data-sim="leer">Noch keine Simulation abgeschlossen.</div>';const p=x=>Math.round(100*x.r/x.n);return `<div class="pills" data-sim="${s.beste.r}"><span class="pill"><span class="dot g"></span>Bestes Ergebnis ${s.beste.r} von ${s.beste.n} (${p(s.beste)} %)</span><span class="pill"><span class="dot b"></span>Zuletzt ${s.letzte.r} von ${s.letzte.n}</span><span class="pill">${s.anz} ${s.anz===1?'Durchgang':'Durchgänge'}</span></div>`}
function modul(i){const m=D.module[i];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel]])+`<div class="box"><h1>${m.nr}. ${esc(m.titel)}</h1>${m.abschnitte.map((a,j)=>{const s=stat(abItems(a));return `<div class="card" data-go="a${i}.${j}"><div class="ic">${a.nr}</div><div><div class="ct">${a.nr} ${esc(a.titel)}</div><div class="meta">2 Lektionen · ${s.t} Seiten · ${esc(a.lf)}</div>${pills(s)}</div></div>`}).join('')}</div>`}
function abschnitt(i,j){const m=D.module[i],a=m.abschnitte[j];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel]])+`<div class="box"><h1>${a.nr} ${esc(a.titel)}</h1>${a.lektionen.map((l,k)=>{const s=stat(l.items);return `<div class="card" data-go="l${i}.${j}.${k}"><div class="ic">${k+1}</div><div><div class="ct">Lektion ${k+1}: ${esc(l.titel)}</div><div class="meta">${s.t} Seiten</div>${pills(s)}</div></div>`}).join('')}</div>`}
let P=null; // Spieler
function start(list,ctx){P={list,ctx,pos:0,ans:{},done:{}};show()}
function render(q,seed){let h=`<div class="q">${esc(q.frage)}</div>`;
 if(q.typ==='mc'||q.typ==='mehr'){const ord=shuf(q.optionen.map((_,i)=>i),q.id+seed);if(q.typ==='mehr')h+='<div class="hint">Mehrere Antworten können richtig sein.</div>';
  h+=ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='mc'?'radio':'checkbox'}" name="o" value="${i}"><span>${esc(q.optionen[i])}</span></label>`).join('')}
 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')return[...r.querySelectorAll('input:checked')].map(x=>+x.value);
 if(q.typ==='wf')return[...r.querySelectorAll('.wf')].map(w=>{const b=w.querySelector('button.on');return b?+b.dataset.v:null});
 if(q.typ==='zuo')return[...r.querySelectorAll('.zu select')].map(s=>s.value);
 if(q.typ==='zahl'){const v=r.querySelector('input').value.trim().replace(/\./g,'').replace(',','.');return v===''?null:+v}}
function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');
 if(q.typ==='zuo')return q.paare.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>');if(q.typ==='wf')return q.aussagen.map(x=>(x[1]?'✔ richtig: ':'✘ falsch: ')+esc(x[0])).join('<br>');
 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}
function mark(q,a){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(q.richtig.includes(i))o.classList.add('ok');else if(a.includes(i))o.classList.add('bad')});
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>w.classList.add((q.aussagen[i][1]?1:0)===a[i]?'ok':'bad'));
 if(q.typ==='zuo')r.querySelectorAll('.zu').forEach((z,i)=>z.classList.add(q.paare[i][1]===a[i]?'ok':'bad'));
 r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function show(){const q=P.list[P.pos],c=P.ctx,n=P.list.length,sit=c.sit?(c.sit[q.id]||''):'';
 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div></div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Themenbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);
 start(l.items,{titel:`${a.nr} · Lektion ${k+1}: ${l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],['Lektion '+(k+1)]],back:'a'+i+'.'+j,seed:'s',sit,full:l.items})}
function sim(){const L=[];D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>{if(l.situation)L.push(l)})));
 const seed=String(Date.now()),pick=shuf(L,seed).slice(0,3),sit={},list=[];pick.forEach(l=>l.items.forEach(q=>{list.push(q);sit[q.id]=l.situation}));
 start(list,{titel:'Prüfungssimulation Teil 1.2 · drei Fälle',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed,sit,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}

// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
