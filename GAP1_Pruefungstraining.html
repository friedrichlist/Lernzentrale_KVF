estimmt. Fehlt eine Pflichtangabe, ist die Fristbestimmung unwirksam.","norm":"§ 38 Abs. 1 VVG","id":"3.6-1-2"},{"typ":"mc","frage":"Muss die Proximus den Einbruch vom 27. Februar 2027 ersetzen?","optionen":["Nein, der Einbruch geschah nach Fristablauf, während Frau Okonkwo noch in Verzug war.","Ja, weil ein bestehender Vertrag nur durch eine gesonderte, spätere Kündigung beendet wird.","Ja, weil sie die Prämie am 15. März und damit noch rechtzeitig gezahlt hat.","Nur zur Hälfte, weil es sich um eine Folgeprämie und nicht um die Erstprämie handelt."],"richtig":[0],"erkl":"Tritt der Versicherungsfall nach Ablauf der wirksam gesetzten Zahlungsfrist ein und ist der Kunde noch in Verzug, ist der Versicherer leistungsfrei. Die spätere Zahlung ändert daran nichts.","norm":"§ 38 Abs. 2 VVG","id":"3.6-1-3"},{"typ":"mc","frage":"Welche Wirkung hat die Zahlung vom 15. März 2027 auf die mit der Mahnung verbundene Kündigung?","optionen":["Die Kündigung wird unwirksam, weil innerhalb eines Monats nach Fristablauf gezahlt wurde.","Keine; die Kündigung bleibt wirksam, weil Frau Okonkwo erst nach Ablauf der Zahlungsfrist gezahlt hat.","Die Kündigung wird unwirksam und der Einbruch vom 27. Februar ist doch versichert.","Die Kündigung wird erst unwirksam, wenn der Versicherer der Zahlung zustimmt."],"richtig":[0],"erkl":"Ist die Kündigung mit der Fristbestimmung verbunden, wird sie unwirksam, wenn der Kunde innerhalb eines Monats nach Fristablauf zahlt (hier bis 24.3.2027). Die Leistungsfreiheit für den Einbruch vom 27.2. bleibt bestehen.","norm":"§ 38 Abs. 3 VVG","id":"3.6-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Brandes – verschwiegene Rückenbehandlung","situation":"Herr Ole Brandes (39) hat am 1. April 2025 eine Berufsunfähigkeitsversicherung bei einem Lebensversicherer beantragt; der Vertrag kam im April 2025 zustande. Im Antrag wurde er in Textform nach Behandlungen der letzten fünf Jahre gefragt und durch gesonderte Mitteilung in Textform über die Folgen falscher Angaben belehrt. Eine Physiotherapie wegen Rückenbeschwerden aus dem Jahr 2023 gab er nicht an. Im Februar 2027 beantragt er Leistungen wegen eines Bandscheibenvorfalls. Der Versicherer erfährt am Freitag, 12. März 2027, von der früheren Behandlung.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Verschulden von Herrn Brandes die Rechtsfolge zu.","paare":[["Arglist: Er verschweigt die Behandlung bewusst, um den Vertrag zu bekommen.","Anfechtung; keine Leistung, auch wenn der Umstand für den Leistungsfall nicht ursächlich wäre"],["Vorsatz ohne Arglist","Rücktritt; Leistung nur, wenn der Umstand für den Leistungsfall nicht ursächlich war"],["Grobe Fahrlässigkeit; der Versicherer hätte mit Ausschluss von Rückenleiden angenommen","kein Rücktritt; auf Verlangen des Versicherers wird der Ausschluss rückwirkend Vertragsbestandteil"],["Einfache Fahrlässigkeit; der Versicherer hätte den Antrag abgelehnt","Kündigung mit Monatsfrist für die Zukunft; der eingetretene Leistungsfall bleibt gedeckt"]],"erkl":"Die Rechtsfolgen sind nach dem Verschulden abgestuft. Rücktritt wegen grober Fahrlässigkeit und Kündigung sind ausgeschlossen, wenn der Versicherer den Vertrag auch zu anderen Bedingungen geschlossen hätte; dann wird der Vertrag angepasst.","norm":"§§ 19 Abs. 2 bis 4, 21 Abs. 2, 22 VVG, § 123 BGB","id":"3.6-2-1"},{"typ":"mc","frage":"Bis wann muss der Versicherer seine Rechte wegen der Anzeigepflichtverletzung spätestens geltend machen?","optionen":["Bis zum 12. April 2027, schriftlich und unter Angabe der Gründe.","Bis zum 26. März 2027, in beliebiger Form auch telefonisch.","Bis zum 1. April 2027, also bis zwei Jahre nach Antragstellung.","Bis zum 12. März 2028, schriftlich und unter Angabe der Gründe."],"richtig":[0],"erkl":"Der Versicherer muss seine Rechte innerhalb eines Monats ab Kenntnis schriftlich geltend machen und die Umstände angeben, auf die er sich stützt: Kenntnis 12.3.2027 → Fristende Montag, 12.4.2027.","norm":"§ 21 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-2-2"},{"typ":"zahl","frage":"Nach wie vielen Jahren ab Vertragsschluss erlöschen die Rechte des Versicherers bei einer grob fahrlässigen Anzeigepflichtverletzung (für Versicherungsfälle nach Ablauf der Frist)?","wert":5,"einheit":"Jahre","tol":0,"erkl":"Die Rechte erlöschen fünf Jahre nach Vertragsschluss, außer für Versicherungsfälle, die vorher eingetreten sind. Bei Vorsatz oder Arglist beträgt die Frist zehn Jahre.","norm":"§ 21 Abs. 3 VVG","id":"3.6-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Anzeigepflicht von Herrn Brandes und zu den Rechten der Beteiligten treffen zu?","aussagen":[["Herr Brandes musste nur Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat.",true],["Ohne gesonderte Mitteilung in Textform über die Folgen hätte der Versicherer keine Rechte nach § 19 Abs. 2 bis 4 VVG.",true],["Steigt die Prämie durch eine Vertragsanpassung um mehr als 10 %, kann Herr Brandes innerhalb eines Monats nach Zugang der Mitteilung fristlos kündigen.",true],["Kannte der Versicherer die Behandlung bereits bei Vertragsschluss, kann er trotzdem zurücktreten.",false]],"erkl":"Die Anzeigepflicht ist auf Textform-Fragen beschränkt. Die Rechte des Versicherers setzen eine Belehrung voraus und sind ausgeschlossen, wenn er den Umstand kannte.","norm":"§ 19 Abs. 1, 5 und 6 VVG","id":"3.6-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Aydın – Werkstatt in der Garage","situation":"Herr Kemal Aydın besitzt ein Einfamilienhaus mit angebauter Garage in Halle (Saale), versichert in einer Wohngebäudeversicherung bei der Proximus Versicherung AG (Jahresbeitrag 480,00 €). Laut seinen Bedingungen liegt eine Gefahrerhöhung insbesondere vor, wenn im Gebäude ein Gewerbebetrieb aufgenommen wird. Im Februar 2027 richtet er ohne Rücksprache in der Garage eine Werkstatt ein, in der er nebenberuflich alte Möbel abschleift und lackiert. Im April meldet er dies der Agentur. Die Proximus verlangt statt einer Kündigung ab dem Zeitpunkt der Gefahrerhöhung einen Jahresbeitrag von 540,00 €.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Vorgang die richtige Einordnung zu.","paare":[["Herr Aydın richtet selbst die Lackierwerkstatt ein.","Gefahrerhöhung durch den Versicherungsnehmer – nur mit Einwilligung des Versicherers zulässig"],["Auf dem Nachbargrundstück eröffnet ein Fremder ein Lager für Feuerwerkskörper.","Gefahrerhöhung unabhängig vom Willen – nach Kenntnis unverzüglich anzeigen"],["Herr Aydın lässt Rauchwarnmelder und eine Rückstausicherung einbauen.","Gefahrminderung – keine Gefahrerhöhung"]],"erkl":"Eine vom Kunden vorgenommene oder gestattete Gefahrerhöhung braucht die Einwilligung des Versicherers; eine ungewollte muss er nach Kenntnis unverzüglich anzeigen.","norm":"§ 23 Abs. 1 und 3 VVG","id":"3.6-3-1"},{"typ":"zahl","frage":"Um wie viel Prozent erhöht sich der Jahresbeitrag von Herrn Aydın?","wert":12.5,"einheit":"%","tol":0.01,"erkl":"(540,00 € − 480,00 €) : 480,00 € × 100 = 12,5 %. Da die Erhöhung mehr als 10 % beträgt, hat Herr Aydın ein Sonderkündigungsrecht.","norm":"§ 25 Abs. 2 VVG","id":"3.6-3-2"},{"typ":"mc","frage":"Wie kann Herr Aydın auf die Beitragserhöhung reagieren?","optionen":["Innerhalb eines Monats nach Zugang der Mitteilung ohne Einhaltung einer Frist kündigen.","Nur zum Ende des Versicherungsjahres mit einer Frist von drei Monaten kündigen.","Gar nicht, weil er die Gefahrerhöhung selbst vorgenommen hat und deshalb an den neuen Beitrag gebunden ist.","Innerhalb von zwei Wochen nach Zugang widersprechen; dann gilt der alte Beitrag."],"richtig":[0],"erkl":"Erhöht sich die Prämie wegen der Gefahrerhöhung um mehr als 10 %, kann der Versicherungsnehmer innerhalb eines Monats nach Zugang der Mitteilung fristlos kündigen; der Versicherer muss darauf hinweisen.","norm":"§ 25 Abs. 2 VVG","id":"3.6-3-3"},{"typ":"wf","frage":"Bevor er die Werkstatt meldet, entsteht ein Schaden. Welche Aussagen zur Leistungspflicht der Proximus treffen zu?","aussagen":[["Hat Herr Aydın die Gefahr vorsätzlich ohne Einwilligung erhöht und entsteht ein Brand durch Lösemittel, ist der Versicherer leistungsfrei.",true],["Bei grober Fahrlässigkeit kann der Versicherer die Leistung entsprechend der Schwere des Verschuldens kürzen.",true],["Deckt ein Sturm das Dach ab, muss der Versicherer leisten, weil die Werkstatt dafür nicht ursächlich war.",true],["Der Versicherer ist bei jeder Gefahrerhöhung unabhängig vom Verschulden immer vollständig leistungsfrei.",false]],"erkl":"Die Leistungsfreiheit ist nach dem Verschulden abgestuft. Der Versicherer bleibt zur Leistung verpflichtet, soweit die Gefahrerhöhung nicht ursächlich war oder seine Kündigungsfrist ungenutzt abgelaufen ist.","norm":"§ 26 Abs. 1 und 3 VVG","id":"3.6-3-4"}]},{"typ":"situation","titel":"Fall 4: Herr Dos Santos – Kündigung nach dem Schaden","situation":"Herr Rafael Dos Santos (52) hat bei der Proximus Versicherung AG eine Hausrat- und eine Privathaftpflichtversicherung; die Versicherungsperiode läuft jeweils vom 1. Juli bis 30. Juni. Nach einem Leitungswasserschaden im Januar 2027 zahlt der Versicherer die abschließend berechnete Entschädigung; das Abrechnungsschreiben geht Herrn Dos Santos am Dienstag, 9. März 2027, zu. Damit sind die Verhandlungen über die Entschädigung abgeschlossen. Er ist mit der Bearbeitung unzufrieden und will den Hausratvertrag kündigen.","items":[{"typ":"mc","frage":"Bis wann muss Herr Dos Santos seine Kündigung des Hausratvertrags spätestens erklären?","optionen":["Bis zum 9. April 2027.","Bis zum 23. März 2027.","Bis zum 31. März 2027.","Bis zum 30. Juni 2027."],"richtig":[0],"erkl":"Die Kündigung nach dem Versicherungsfall ist nur bis zum Ablauf eines Monats seit Abschluss der Verhandlungen über die Entschädigung zulässig: 9.3.2027 → 9.4.2027 (Freitag).","norm":"§ 92 Abs. 2 Satz 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-4-1"},{"typ":"mc","frage":"Zu welchem Zeitpunkt kann Herr Dos Santos den Hausratvertrag nach dem Schaden kündigen?","optionen":["Sofort oder zu einem späteren Zeitpunkt, spätestens zum 30. Juni 2027.","Nur mit einer Frist von einem Monat zum Monatsende, frühestens zum 30. April 2027.","Nur mit einer Frist von drei Monaten zum Ende der Versicherungsperiode.","Zu jedem beliebigen Zeitpunkt, auch zum 30. Juni 2028 oder später."],"richtig":[0],"erkl":"Der Versicherungsnehmer kann fristlos kündigen, aber nicht für einen späteren Zeitpunkt als den Schluss der laufenden Versicherungsperiode (30.6.2027).","norm":"§ 92 Abs. 2 Satz 3 VVG","id":"3.6-4-2"},{"typ":"zuo","frage":"Ordnen Sie der Situation die passende Regel zur Kündigung nach einem Versicherungsfall zu.","paare":[["Die Proximus kündigt den Hausratvertrag nach dem Schaden.","Sie muss eine Kündigungsfrist von einem Monat einhalten."],["Herr Dos Santos kündigt den Hausratvertrag nach dem Schaden.","Er kann ohne Frist oder zum Schluss der laufenden Periode kündigen."],["Die Proximus erkennt in der Privathaftpflicht den Freistellungsanspruch an.","Kündigung ist innerhalb eines Monats seit der Anerkennung zulässig."],["Auf Weisung der Proximus kommt es zum Prozess mit dem Geschädigten.","Kündigung ist innerhalb eines Monats seit Rechtskraft des Urteils zulässig."]],"erkl":"Für die Sachversicherung gilt § 92 VVG, für die Haftpflichtversicherung die Sonderregel des § 111 VVG, die auf die Fristen des § 92 Abs. 2 Satz 2 und 3 verweist.","norm":"§§ 92 Abs. 2, 111 VVG","id":"3.6-4-3"},{"typ":"wf","frage":"Welche Aussagen zur Kündigung nach dem Schadenfall treffen zu?","aussagen":[["Das Kündigungsrecht nach dem Versicherungsfall steht beiden Vertragsparteien zu.",true],["Der Versicherer kann nach einem Schaden fristlos kündigen.",false],["Geht eine Kündigung der Proximus am 15. März 2027 zu, endet der Hausratschutz mit Ablauf des 15. April 2027.",true],["In der Privathaftpflicht besteht das Kündigungsrecht auch, wenn der Versicherer den Freistellungsanspruch zu Unrecht ablehnt.",true]],"erkl":"Der Versicherer muss eine Kündigungsfrist von einem Monat einhalten (Zugang 15.3. → Ende 15.4.). In der Haftpflicht lösen Anerkennung oder unberechtigte Ablehnung das Kündigungsrecht aus.","norm":"§§ 92 Abs. 1 und 2, 111 Abs. 1 VVG","id":"3.6-4-4"}]},{"typ":"situation","titel":"Fall 5: Verkauf des Hauses von Frau Lehmann","situation":"Frau Ingrid Lehmann (68) verkauft ihr Einfamilienhaus in Halle (Saale) an Herrn Amir Haddad. Der notarielle Kaufvertrag wird am 15. Januar 2027 geschlossen, Besitz, Nutzen und Lasten gehen am 1. März 2027 über, Herr Haddad wird am Dienstag, 20. April 2027, als Eigentümer im Grundbuch eingetragen. Für das Haus besteht eine Wohngebäudeversicherung bei der Proximus Versicherung AG; Versicherungsperiode ist das Kalenderjahr. Laut den Bedingungen gilt bei Immobilien das Datum der Grundbucheintragung als Zeitpunkt des Eigentumsübergangs.","items":[{"typ":"mc","frage":"Ab wann tritt Herr Haddad in die Wohngebäudeversicherung ein?","optionen":["Mit der Eintragung im Grundbuch am 20. April 2027.","Mit dem notariellen Kaufvertrag am 15. Januar 2027.","Mit dem Übergang von Besitz und Lasten am 1. März 2027.","Erst mit Beginn der nächsten Periode am 1. Januar 2028."],"richtig":[0],"erkl":"Der Erwerber tritt mit dem Eigentumsübergang in die Rechte und Pflichten des Versicherungsnehmers ein; bei Immobilien ist das die Eintragung im Grundbuch. Bis dahin bleibt Frau Lehmann Versicherungsnehmerin.","norm":"§ 95 Abs. 1 VVG","id":"3.6-5-1"},{"typ":"mc","frage":"Herr Haddad möchte den übernommenen Vertrag kündigen. Was gilt?","optionen":["Er kann bis zum 20. Mai 2027 mit sofortiger Wirkung oder zum 31. Dezember 2027 kündigen.","Er kann nur mit einer Frist von drei Monaten zum Ende der Periode am 31. Dezember 2027 kündigen.","Er kann bis zum 1. April 2027 nur mit einer Frist von einem Monat zum Monatsende kündigen.","Er kann nicht kündigen, weil er kraft Gesetzes in den laufenden Vertrag eingetreten ist."],"richtig":[0],"erkl":"Der Erwerber kann mit sofortiger Wirkung oder zum Schluss der laufenden Versicherungsperiode kündigen, aber nur innerhalb eines Monats nach dem Erwerb: 20.4.2027 → 20.5.2027.","norm":"§ 96 Abs. 2 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-5-2"},{"typ":"zuo","frage":"Ordnen Sie der Person ihr Recht bzw. ihre Pflicht nach der Veräußerung zu.","paare":[["Herr Haddad (Erwerber)","Kündigung sofort oder zum Periodenende, innerhalb eines Monats nach dem Erwerb"],["Proximus Versicherung AG","Kündigung mit einer Frist von einem Monat, innerhalb eines Monats ab Kenntnis"],["Frau Lehmann (Veräußerin)","zahlt bei einer Kündigung nach der Veräußerung die Prämie allein"]],"erkl":"Beide Vertragsparteien des übergegangenen Vertrags haben ein Sonderkündigungsrecht. Wird gekündigt, schuldet nur die Veräußerin die Prämie, der Erwerber haftet dafür nicht.","norm":"§ 96 Abs. 1 bis 3 VVG","id":"3.6-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Veräußerung treffen zu?","aussagen":[["Ohne Kündigung haften Frau Lehmann und Herr Haddad für die Prämie des Jahres 2027 als Gesamtschuldner.",true],["Die Veräußerung ist dem Versicherer vom Veräußerer oder vom Erwerber unverzüglich anzuzeigen.",true],["Unterbleibt die Anzeige, ist der Versicherer bei jedem späteren Schaden leistungsfrei.",false],["Der Versicherer muss den Eintritt des Erwerbers erst gegen sich gelten lassen, wenn er davon Kenntnis erlangt hat.",true]],"erkl":"Leistungsfrei wegen fehlender Anzeige ist der Versicherer nur, wenn der Schaden später als einen Monat nach dem Zeitpunkt eintritt, zu dem die Anzeige hätte zugehen müssen, und er den Vertrag mit dem Erwerber nicht geschlossen hätte.","norm":"§§ 95 Abs. 2 und 3, 97 VVG","id":"3.6-5-4"}]},{"typ":"situation","titel":"Fall 6: Familie Osei – Beitragsrechnung, Beitragsanpassung, Laufzeit","situation":"Familie Osei aus Halle (Saale) hat bei der Proximus Versicherung AG für ihr Einfamilienhaus eine verbundene Wohngebäudeversicherung (Nettobeitrag 850,00 € jährlich) und eine Glasversicherung (60,00 €) sowie eine Hausratversicherung (240,00 €). Für die Versicherungsteuer gilt: Wohngebäude 19 % auf 86 % des Nettobeitrags, Hausrat 19 % auf 85 %, Glas 19 % auf den vollen Nettobeitrag. Am 20. November 2026 geht der Familie eine Mitteilung zu: Aufgrund der Anpassungsklausel steigt der Hausratbeitrag ab 1. Januar 2027, der Versicherungsschutz bleibt unverändert; auf das Kündigungsrecht wird hingewiesen.","items":[{"typ":"zahl","frage":"Wie hoch ist die Versicherungsteuer für die Hausratversicherung (Nettobeitrag 240,00 €)?","wert":38.76,"einheit":"€","tol":0.01,"erkl":"Bemessungsgrundlage 85 % von 240,00 € = 204,00 €; 19 % davon = 38,76 €. Bruttobeitrag 278,76 €.","norm":"§ 5 Abs. 1 Nr. 3 Buchst. c, § 6 Abs. 2 Nr. 3 VersStG","id":"3.6-6-1"},{"typ":"zahl","frage":"Wie hoch ist der Gesamtbetrag der Rechnung für Wohngebäude- und Glasversicherung einschließlich Versicherungsteuer?","wert":1060.29,"einheit":"€","tol":0.01,"erkl":"Wohngebäude: 86 % von 850,00 € = 731,00 €, davon 19 % = 138,89 € → 988,89 €. Glas: 19 % von 60,00 € = 11,40 € → 71,40 €. Summe 988,89 € + 71,40 € = 1.060,29 €.","norm":"§ 5 Abs. 1 Nr. 1 und Nr. 3 Buchst. b, § 6 Abs. 1 und Abs. 2 Nr. 2 VersStG","id":"3.6-6-2"},{"typ":"mc","frage":"Wie kann Familie Osei auf die Beitragserhöhung in der Hausratversicherung reagieren?","optionen":["Innerhalb eines Monats nach Zugang kündigen, frühestens zum 1. Januar 2027.","Nur mit einer Frist von drei Monaten zum Ende des Versicherungsjahres kündigen.","Innerhalb von 14 Tagen widerrufen; dann gilt der bisherige Beitrag weiter.","Gar nicht, weil die Erhöhung auf einer vereinbarten Anpassungsklausel beruht."],"richtig":[0],"erkl":"Erhöht der Versicherer aufgrund einer Anpassungsklausel die Prämie ohne entsprechende Änderung des Schutzes, kann der Kunde innerhalb eines Monats nach Zugang mit sofortiger Wirkung kündigen, frühestens zum Wirksamwerden der Erhöhung. Die Mitteilung muss spätestens einen Monat vorher zugehen – hier erfüllt.","norm":"§ 40 Abs. 1 VVG","id":"3.6-6-3"},{"typ":"wf","frage":"Welche Aussagen zur Vertragsdauer und Kündigung nach § 11 VVG treffen zu?","aussagen":[["Verlängert sich ein Vertrag laut Bedingungen stillschweigend um jeweils drei Jahre, ist die Verlängerung nur für ein Jahr wirksam.",true],["Die Kündigungsfrist muss für beide Vertragsparteien gleich sein und zwischen einem und drei Monaten liegen.",true],["Ein Vertrag auf unbestimmte Zeit kann nur zum Schluss der laufenden Versicherungsperiode gekündigt werden.",true],["Auf das Kündigungsrecht bei unbestimmter Dauer kann einvernehmlich für bis zu fünf Jahre verzichtet werden.",false]],"erkl":"Ein Kündigungsverzicht ist nur bis zur Dauer von zwei Jahren möglich. Stillschweigende Verlängerungen sind auf je ein Jahr begrenzt.","norm":"§ 11 Abs. 1 bis 3 VVG","id":"3.6-6-4"}]}]}]},{"nr":"4","titel":"Wohnen und Wohneigentum absichern","lf":"LF 4","abschnitte":[{"nr":"4.1","titel":"Beratungsanlässe: Hausstandsgründung und veränderte Wohnsituation","lf":"LF 4","buch":"S. 123–124","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde zieht innerhalb Deutschlands um. Was gilt in der Hausratversicherung?","optionen":["Der Schutz geht auf die neue Wohnung über; während des Umzugs gilt er in beiden.","Der Vertrag endet mit dem Umzug; für die neue Wohnung ist ein neuer Antrag nötig.","Der Schutz bleibt in der alten Wohnung, bis der Versicherer der neuen schriftlich zustimmt.","Der Schutz geht erst nach der Anzeige über; bis dahin gilt er nur in der alten Wohnung."],"richtig":[0],"erkl":"Während des Umzugs besteht Schutz in beiden Wohnungen, in der alten längstens zwei Monate nach Umzugsbeginn. Der Umzug ist spätestens bei Beginn des Einzugs anzuzeigen; Wohnfläche und Tarifzone können sich ändern.","norm":"VHB, Wohnungswechsel","id":"4.1-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Umzug ins Ausland treffen zu?","aussagen":[["Der Versicherungsschutz geht bei einem Umzug ins Ausland nicht auf die neue Wohnung über.",true],["Der Versicherungsschutz in der bisherigen Wohnung erlischt spätestens zwei Monate nach Umzugsbeginn.",true],["Der Hausrat ist im Ausland automatisch weiter versichert.",false]],"erkl":"Versicherungsort ist die Wohnung in Deutschland; bei Auslandsumzug endet der Vertrag nach den Bedingungen.","norm":"VHB, Wohnungswechsel","id":"4.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie dem Anlass die wichtigste Prüfung zu.","paare":[["Zwei Haushalte werden zusammengelegt","doppelte Hausratverträge auflösen, Versicherungssumme anpassen"],["Erwerb einer Eigentumswohnung","Gemeinschaftseigentum über die Gemeinschaft, eigene Einbauten prüfen"],["Bau eines Einfamilienhauses","Bauherrenhaftpflicht, Bauleistung, Feuer-Rohbau, später Wohngebäude"]],"erkl":"Jeder Anlass verändert Risiko und Bedarf.","norm":"Bedarfsanalyse","id":"4.1-1-3"},{"typ":"mc","frage":"Eine Kundin zieht von ihrem Haus in ein Pflegeheim und nimmt nur einen Teil ihrer Möbel mit. Was gilt für die Hausratversicherung?","optionen":["Der Vertrag endet mit dem Auszug, weil Hausrat in einem Pflegeheim nicht versicherbar ist.","Der Hausrat im Heim ist als Außenversicherung zeitlich unbegrenzt und voll mitversichert.","Der Hausrat im Heim ist automatisch über die Gebäudeversicherung des Heimträgers versichert.","Der Hausrat im Heim kann je nach Tarif begrenzt versichert sein; der Vertrag ist anzupassen."],"richtig":[3],"erkl":"Viele Bedingungen enthalten Regelungen für den Umzug in ein Heim; Versicherungssumme und Ort sind anzupassen.","norm":"VHB, Wohnungswechsel","id":"4.1-1-4"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Jonas Becker (24) zieht nach seiner Ausbildung aus dem Elternhaus aus in seine erste eigene Mietwohnung (55 m²). Er fragt, ob er über die Verträge seiner Eltern weiter versichert ist.","items":[{"typ":"mc","frage":"Ist Jonas noch über die Privathaftpflicht seiner Eltern versichert?","optionen":["Ja, bis zum Ende des ersten Mietjahres in der neuen Wohnung.","Ja, solange er noch unter der Anschrift seiner Eltern gemeldet ist.","In der Regel nicht mehr, weil die Mitversicherung meist mit der ersten Ausbildung endet.","Ja, weil unverheiratete Kinder bis zum 25. Lebensjahr in jedem Fall mitversichert sind."],"richtig":[2],"erkl":"Unverheiratete Kinder sind in der Familien-Privathaftpflicht meist bis zum Ende der ersten Ausbildung mitversichert; manche Tarife sehen eine begrenzte Nachversicherung vor. Jonas braucht daher eine eigene Privathaftpflicht.","norm":"BBR PHV","id":"4.1-2-1"},{"typ":"zahl","frage":"Für den Unterversicherungsverzicht verlangt der Versicherer eine Versicherungssumme von 650 € je m² Wohnfläche. Wie hoch muss die Summe für Jonas mindestens sein?","wert":35750,"einheit":"€","tol":0,"erkl":"55 m² × 650 €/m² = 35.750 €.","norm":"VHB, Unterversicherungsverzicht","id":"4.1-2-2"},{"typ":"mc","frage":"Jonas fragt, ob sein Fahrrad, das er im Hausflur abschließt, gegen Diebstahl versichert ist. Was ist richtig?","optionen":["Der Diebstahl ist versichert, wenn das Fahrrad abgeschlossen war, auch ohne Zusatzklausel.","Diebstahl ohne Einbruch ist nur versichert, wenn die Fahrraddiebstahl-Klausel vereinbart ist.","Fahrräder sind nur versichert, wenn sie in der Wohnung selbst abgestellt werden.","Fahrräder sind in jeder Hausratversicherung auch gegen einfachen Diebstahl versichert."],"richtig":[1],"erkl":"Einfacher Diebstahl aus dem Hausflur ist kein Einbruchdiebstahl; dafür gibt es eine Zusatzvereinbarung.","norm":"VHB, Klausel Fahrraddiebstahl","id":"4.1-2-3"}]}]},{"nr":"4.2","titel":"Individuelle Bedarfe analysieren, Risikoprävention und -absicherung","lf":"LF 4","buch":"S. 125–140","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Gefahren sind in der Hausratversicherung nach den Musterbedingungen versichert?","aussagen":[["Brand, Blitzschlag, Explosion",true],["Einbruchdiebstahl, Raub und Vandalismus nach einem Einbruch",true],["Leitungswasser, Sturm und Hagel",true],["Überschwemmung durch Starkregen ohne besondere Vereinbarung",false]],"erkl":"Weitere Naturgefahren (Elementar) müssen gesondert eingeschlossen werden.","norm":"VHB","id":"4.2-1-1"},{"typ":"zahl","frage":"Ab welcher Windstärke liegt ein Sturm im Sinne der Bedingungen vor?","wert":8,"einheit":"Beaufort","tol":0,"erkl":"Sturm ist eine wetterbedingte Luftbewegung von mindestens Windstärke 8.","norm":"VHB/VGB, Sturm","id":"4.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie der Präventionsmaßnahme das Risiko zu, das sie mindert.","paare":[["Rückstauklappe im Abwasserrohr","Rückstau bei Starkregen"],["Rauchmelder","Personenschäden und Ausbreitung von Bränden"],["einbruchhemmende Fenster und Türen","Einbruchdiebstahl"],["Wasserleitungen im Winter entleeren","Frostschäden an Rohren"]],"erkl":"Prävention verringert Schäden und kann sich auf die Prämie auswirken; manche Maßnahmen sind vertragliche Sicherheitsvorschriften.","norm":"VGB/VHB, Sicherheitsvorschriften","id":"4.2-1-3"},{"typ":"mc","frage":"Wann liegt ein Einbruchdiebstahl im Sinne der Bedingungen vor?","optionen":["Der Dieb bricht die Wohnungstür auf, dringt ein und stiehlt Sachen.","Ein Gast nimmt bei einem Besuch heimlich eine wertvolle Uhr mit.","Einer Kundin wird im Café die Handtasche vom Stuhl gestohlen.","Ein Dieb nimmt ein unverschlossenes Fahrrad vom offenen Hinterhof mit."],"richtig":[0],"erkl":"Kennzeichnend ist das Eindringen in einen Raum eines Gebäudes, z. B. durch Einbrechen, Einsteigen oder mit falschen Schlüsseln.","norm":"VHB, Einbruchdiebstahl","id":"4.2-1-4"},{"typ":"mc","frage":"Welcher Schaden ist in der Hausratversicherung über die Gefahr Leitungswasser versichert?","optionen":["Regenwasser läuft durch ein offen gelassenes Fenster ins Wohnzimmer.","Beim Blumengießen kippt ein Eimer Wasser um und durchnässt den Teppich.","Nach starkem Regen dringt Grundwasser durch die Kellerwand in den Keller ein.","Aus einem geplatzten Waschmaschinenschlauch tritt Wasser aus und beschädigt Möbel."],"richtig":[3],"erkl":"Leitungswasser ist bestimmungswidrig ausgetretenes Wasser aus Rohren und angeschlossenen Einrichtungen.","norm":"VHB, Leitungswasser","id":"4.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Yilmaz wohnt in einem gemieteten Reihenhaus in Flussnähe. Im letzten Sommer lief nach einem Starkregen Wasser über die Kellertreppe in den Keller, in dem Möbel und eine Gefriertruhe standen. Die Hausratversicherung hat nicht gezahlt.","items":[{"typ":"mc","frage":"Warum hat die Hausratversicherung vermutlich nicht gezahlt?","optionen":["Wasser, das über die Kellertreppe eindringt, gilt immer als grob fahrlässig herbeigeführter Schaden.","Möbel und Gefriertruhen im Keller gehören grundsätzlich nicht zum versicherten Hausrat der Familie.","Überschwemmung durch Starkregen ist eine weitere Naturgefahr, die gesondert vereinbart sein muss.","Mieter eines Reihenhauses können eine Hausratversicherung nur über ihren Vermieter abschließen."],"richtig":[2],"erkl":"Leitungswasser deckt keinen Starkregen von außen.","norm":"VHB, weitere Naturgefahren","id":"4.2-2-1"},{"typ":"wf","frage":"Was empfehlen Sie der Familie?","aussagen":[["Einschluss der weiteren Naturgefahren in die Hausratversicherung prüfen",true],["hochwertige Sachen nicht im Keller lagern",true],["den Vermieter auf einen Schutz am Kellerabgang (Schwelle, Abdeckung) ansprechen",true],["die Hausratversicherung kündigen, weil sie nichts bringt",false]],"erkl":"Absicherung und Prävention ergänzen sich; Vorschäden können den Einschluss erschweren.","norm":"Beratung","id":"4.2-2-2"},{"typ":"mc","frage":"Wer versichert das Reihenhaus selbst gegen Elementarschäden?","optionen":["Die Gemeinde, weil sie für den Hochwasserschutz zuständig ist.","Der Vermieter über die Wohngebäudeversicherung mit Elementarschutz.","Die Familie Yilmaz über ihre eigene Hausratversicherung.","Der Vermieter über seine Haus- und Grundbesitzerhaftpflicht."],"richtig":[1],"erkl":"Gebäude und Gebäudebestandteile versichert der Eigentümer; der Mieter versichert seinen Hausrat.","norm":"VGB","id":"4.2-2-3"}]}]},{"nr":"4.3","titel":"Lösungsmöglichkeiten durch private Versicherungen aufzeigen","lf":"LF 4","buch":"S. 141–179","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Versicherungssumme 40.000 €, Versicherungswert 50.000 €, Schaden 10.000 €, kein Unterversicherungsverzicht. Wie hoch ist die Entschädigung?","wert":8000,"einheit":"€","tol":0,"erkl":"10.000 € × 40.000 € / 50.000 € = 8.000 € (Proportionalregel).","norm":"§ 75 VVG, VHB","id":"4.3-1-1"},{"typ":"mc","frage":"Was versteht man unter der Außenversicherung in der Hausratversicherung?","optionen":["Hausrat, der sich vorübergehend außerhalb der Wohnung befindet, ist begrenzt mitversichert.","Alle Sachen auf Balkon und Terrasse sind ohne jede Entschädigungsgrenze mitversichert.","Hausrat ist weltweit dauerhaft und ohne Begrenzung der Entschädigung versichert.","Nebengebäude wie Garagen und Gartenhäuser sind als Gebäude mitversichert."],"richtig":[0],"erkl":"Vorübergehend heißt: höchstens drei Monate. Die Entschädigung ist meist auf einen Prozentsatz der Versicherungssumme begrenzt; Einbruchdiebstahl setzt ein Gebäude voraus.","norm":"VHB, Außenversicherung","id":"4.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe der Wohngebäudeversicherung zu.","paare":[["Versicherungssumme 1914","Wert des Gebäudes in Preisen des Jahres 1914 als Rechengrundlage"],["Gleitender Neuwertfaktor","passt die Prämie jährlich an die Entwicklung von Baupreisen und Tariflöhnen an"],["Gleitende Neuwertversicherung","ersetzt den ortsüblichen Neubauwert zum Schadenzeitpunkt"]],"erkl":"Bei korrekt ermittelter Summe 1914 verzichtet der Versicherer auf den Einwand der Unterversicherung.","norm":"VGB, Versicherungswert","id":"4.3-1-3"},{"typ":"wf","frage":"Was gehört nach den Musterbedingungen zum versicherten Hausrat?","aussagen":[["Möbel, Kleidung, Bücher und Haushaltsgeräte",true],["vom Mieter auf eigene Kosten eingebaute Einbauküche",true],["das Auto in der Garage",false],["Bargeld und Schmuck mit Entschädigungsgrenzen",true]],"erkl":"Kraftfahrzeuge sind kein Hausrat (Ausnahmen z. B. Krankenfahrstühle, Rasenmäher); Wertsachen sind begrenzt.","norm":"VHB, versicherte Sachen","id":"4.3-1-4"},{"typ":"mc","frage":"Was ist in der Wohngebäudeversicherung, anders als in der Hausratversicherung, typischerweise versichert?","optionen":["Schäden an Kleidung durch Leitungswasser aus einem Rohrbruch.","Einbruchdiebstahl von Schmuck und Bargeld aus dem Wohnhaus.","Die Möbel und elektrischen Geräte des Mieters im Gebäude.","Frost- und Bruchschäden an Rohren der Wasserversorgung im Gebäude."],"richtig":[3],"erkl":"Rohrbruch und Frostschäden an Rohren gehören zur Gefahr Leitungswasser in der Wohngebäudeversicherung.","norm":"VGB, Leitungswasser","id":"4.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr und Frau Hartmann haben ein Einfamilienhaus mit Photovoltaikanlage auf dem Dach, eine Holzgartenhütte und einen Gartenteich. Im Wohnzimmer steht ein wertvolles Klavier, im Schlafzimmer ein Tresor mit Schmuck.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache dem passenden Vertrag zu.","paare":[["Photovoltaikanlage auf dem Dach","Wohngebäudeversicherung (oft nur mit Einschluss) oder eigene Photovoltaikversicherung"],["Klavier","Hausratversicherung"],["Schmuck im Tresor","Hausratversicherung mit Entschädigungsgrenzen für Wertsachen"],["fest errichtete Gartenhütte","Wohngebäudeversicherung, wenn sie als Nebengebäude mitversichert ist"]],"erkl":"Gebäude und fest verbundene Sachen gehören in die Wohngebäudeversicherung, bewegliche Sachen in die Hausratversicherung.","norm":"VGB/VHB","id":"4.3-2-1"},{"typ":"mc","frage":"Warum sollte die Versicherungssumme für den Schmuck genau geprüft werden?","optionen":["Schmuck ist in der Hausratversicherung grundsätzlich nicht versichert.","Für Schmuck zahlt der Versicherer nur bei Brand, nicht aber bei einem Einbruch.","Für Wertsachen gelten Entschädigungsgrenzen je nach Art der Aufbewahrung.","Schmuck wird immer zum Neuwert und ohne jede Höchstgrenze ersetzt."],"richtig":[2],"erkl":"Liegen Wertsachen außerhalb eines anerkannten Wertschutzschranks, sinkt die Entschädigungsgrenze deutlich.","norm":"VHB, Wertsachen","id":"4.3-2-2"},{"typ":"mc","frage":"Der Kunde fragt, ob ein Rasensprenger-Schlauch, der im Garten platzt und den Rasen flutet, über Leitungswasser versichert ist. Was ist richtig?","optionen":["Ja, wenn der Schaden am Rasen mehr als 1.000 € beträgt.","Nein, der Rasen gehört als Grund und Boden nicht zu den versicherten Sachen.","Ja, jeder Wasseraustritt auf dem versicherten Grundstück ist versichert.","Ja, aber nur, wenn der Schlauch durch Frost geplatzt ist."],"richtig":[1],"erkl":"Ersetzt werden nur Schäden an versicherten Sachen; Grund und Boden, also auch der Rasen, gehört nicht dazu.","norm":"VGB, Leitungswasser","id":"4.3-2-3"}]}]},{"nr":"4.4","titel":"Kundengerechte Angebote erstellen, Rechtsstreitigkeiten und Ansprüche Dritter, Vertragsschluss","lf":"LF 4 / LF 5","buch":"S. 180–227","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Versicherungssumme 1914: 22.000 Mark, gleitender Neuwertfaktor 24,9, Prämiensatz 1,5 ‰ (Promille). Wie hoch ist die Jahresprämie ohne Versicherungsteuer?","wert":821.7,"einheit":"€","tol":0.01,"erkl":"22.000 × 1,5 ‰ = 33 € (Grundbeitrag 1914) × 24,9 = 821,70 €.","norm":"VGB, Prämienberechnung","id":"4.4-1-1"},{"typ":"mc","frage":"Eine Kundin vermietet eine Wohnung in einem Zweifamilienhaus, die andere bewohnt sie selbst. Welche Haftpflichtversicherung braucht sie für die Vermietung?","optionen":["Eine Haus- und Grundbesitzerhaftpflicht, falls die Privathaftpflicht die Vermietung nicht deckt.","Keine, weil die Mieter für alle Schäden auf dem Grundstück selbst haften.","Eine Rechtsschutzversicherung, weil sie die Haftpflichtansprüche der Mieter vollständig bezahlt.","Eine Gewässerschadenhaftpflicht, weil sie das gesamte Vermietungsrisiko vollständig abdeckt."],"richtig":[0],"erkl":"Viele Privathaftpflicht-Tarife schließen die vermietete Wohnung im selbst bewohnten Zweifamilienhaus ein; deckt der Tarif sie nicht, ist eine Haus- und Grundbesitzerhaftpflicht nötig.","norm":"BBR PHV, Haus- und Grundbesitzerhaftpflicht","id":"4.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Rechtsschutzversicherung für Wohnungs- und Grundstückseigentum treffen zu?","aussagen":[["Sie hilft z. B. bei Streit mit dem Mieter über Mietzahlungen.",true],["Für sie gilt in der Regel eine Wartezeit von drei Monaten.",true],["Streitigkeiten rund um den Bau eines Hauses sind meist ausgeschlossen.",true],["Sie ersetzt Schäden, die der Kunde Dritten zufügt.",false]],"erkl":"Rechtsschutz trägt Kosten der Rechtsverfolgung; Schadenersatzansprüche Dritter gehören in die Haftpflicht.","norm":"ARB","id":"4.4-1-3"},{"typ":"mc","frage":"Wie verhält sich die Kundin richtig, wenn sie einen Heizöltank im Keller ihres Hauses hat?","optionen":["Sie meldet den Tank ihrem Wohngebäudeversicherer, der dann die Haftung übernimmt.","Sie schließt eine Glasversicherung ab, weil diese auch Schäden am Tank deckt.","Sie braucht nichts, weil Ölschäden immer gesetzlich über die Gemeinde gedeckt sind.","Sie prüft eine Gewässerschadenhaftpflicht für ihren Heizöltank (Anlagenrisiko)."],"richtig":[3],"erkl":"Für Anlagen, die Gewässer verunreinigen können, haftet der Betreiber verschuldensunabhängig.","norm":"§ 89 WHG","id":"4.4-1-4"},{"typ":"mc","frage":"Ein Kunde unterschreibt den Antrag für eine Wohngebäudeversicherung. Was ist der nächste Schritt bis zum Vertragsschluss?","optionen":["Der Vertrag ist bereits mit der Unterschrift des Kunden auf dem Antrag geschlossen.","Der Kunde muss den Antrag nach Ablauf von 14 Tagen erneut unterschreiben.","Der Versicherer prüft den Antrag und nimmt ihn durch Übersendung der Police an.","Der Vertrag muss vom Vermittler notariell beurkundet werden, um wirksam zu sein."],"richtig":[2],"erkl":"Beim Antragsmodell kommt der Vertrag mit Zugang der Annahme (Police) zustande; der Kunde ist bis dahin an seinen Antrag gebunden.","norm":"§§ 145 ff. BGB","id":"4.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Lorenz bittet um ein Angebot für die Hausratversicherung seiner neuen 80-m²-Wohnung in Tarifzone 3. Der Tarif kostet 1,20 € je 1.000 € Versicherungssumme im Jahr (inkl. Versicherungsteuer), der Versicherer verlangt 650 € je m² für den Unterversicherungsverzicht.","items":[{"typ":"zahl","frage":"Wie hoch ist die Mindestversicherungssumme für den Unterversicherungsverzicht?","wert":52000,"einheit":"€","tol":0,"erkl":"80 m² × 650 € = 52.000 €.","norm":"VHB, Unterversicherungsverzicht","id":"4.4-2-1"},{"typ":"zahl","frage":"Wie hoch ist die Jahresprämie für diese Versicherungssumme?","wert":62.4,"einheit":"€","tol":0.01,"erkl":"52.000 € / 1.000 × 1,20 € = 62,40 €.","norm":"Tarif","id":"4.4-2-2"},{"typ":"mc","frage":"Herr Lorenz möchte die Prämie monatlich zahlen. Was müssen Sie ihm erklären?","optionen":["Bei monatlicher Zahlung entfällt der Unterversicherungsverzicht.","Bei unterjähriger Zahlung kann ein Ratenzuschlag anfallen.","Bei monatlicher Zahlung sinkt die Jahresprämie um ein Skonto.","Bei monatlicher Zahlung muss er eine Selbstbeteiligung vereinbaren."],"richtig":[1],"erkl":"Viele Tarife berechnen für halb-, viertel- oder monatliche Zahlung Zuschläge.","norm":"Tarif","id":"4.4-2-3"}]}]},{"nr":"4.5","titel":"Ergänzende Serviceleistungen aufzeigen","lf":"LF 4","buch":"S. 228–230","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Leistungen werden häufig als Assistance- oder Serviceleistung zur Hausrat- oder Wohngebäudeversicherung angeboten?","aussagen":[["Vermittlung eines Schlüsseldienstes bei ausgesperrter Tür",true],["Vermittlung von Handwerkern nach einem Schaden",true],["Rohrreinigung bei Verstopfung, je nach Tarif",true],["Übernahme aller Handwerkerrechnungen ohne Schaden und ohne Höchstbetrag",false]],"erkl":"Serviceleistungen sind meist Organisations- und Vermittlungsleistungen, teils mit Kostenübernahme bis zu Grenzen.","norm":"Tarifbedingungen","id":"4.5-1-1"},{"typ":"mc","frage":"Welcher Nutzen steht bei Smart-Home-Bausteinen (z. B. Wassermelder mit Absperrventil) für Kunde und Versicherer im Vordergrund?","optionen":["Schäden früh erkennen und begrenzen.","Die Prämie automatisch erhöhen.","Verträge leichter kündigen können.","Kundendaten für Werbung auswerten."],"richtig":[0],"erkl":"Prävention senkt Schadenhöhe und -häufigkeit.","norm":"Prävention","id":"4.5-1-2"},{"typ":"mc","frage":"Nach einem Brand ist die Wohnung eines Kunden unbewohnbar. Welche Kosten übernimmt die Hausratversicherung in der Regel?","optionen":["Die Mehrkosten einer dauerhaft teureren Ersatzwohnung.","Die Miete für eine neue Wohnung für die Dauer von zehn Jahren.","Keine Kosten, ersetzt werden nur die beschädigten Sachen.","Hotelkosten für eine begrenzte Zeit und bis zu einem Höchstbetrag."],"richtig":[3],"erkl":"Versicherte Kosten sind u. a. Hotel-, Transport- und Lagerkosten.","norm":"VHB, versicherte Kosten","id":"4.5-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Demir ruft an einem Sonntagabend in der Agentur-Hotline an: Im Badezimmer läuft Wasser aus einem Anschluss, sie bekommt den Haupthahn nicht zu. Ihr Vertrag enthält einen Assistance-Baustein.","items":[{"typ":"mc","frage":"Welche Maßnahme hat für Frau Demir sofort Vorrang?","optionen":["Bis Montag warten und den Schaden dann in der Agentur persönlich melden.","Zuerst den Schaden fotografieren und erst danach das Wasser abstellen lassen.","Den Schaden mindern, z. B. das Wasser abstellen lassen und die Assistance anrufen.","Den Schaden schriftlich beim Versicherer melden und dessen Freigabe abwarten."],"richtig":[2],"erkl":"Der Versicherungsnehmer muss den Schaden abwenden und mindern; Kosten dafür ersetzt der Versicherer.","norm":"§§ 82, 83 VVG","id":"4.5-2-1"},{"typ":"mc","frage":"Wer trägt die Kosten für den Notdienst, der den Schaden begrenzt?","optionen":["Frau Demir allein, weil Notdienstkosten vom Versicherer nie übernommen werden.","Der Versicherer, weil er Aufwendungen zur Abwendung und Minderung ersetzt.","Der Versicherer, aber nur, wenn die Maßnahme den Schaden tatsächlich verhindert hat.","Der Notdienst selbst, wenn der Schaden trotz seines Einsatzes eintritt."],"richtig":[1],"erkl":"Rettungskosten werden ersetzt, auch wenn die Maßnahme erfolglos bleibt, soweit die Kundin sie den Umständen nach für geboten halten durfte.","norm":"§ 83 VVG","id":"4.5-2-2"}]}]},{"nr":"4.6","titel":"Versicherungsrelevante rechtliche Regelungen rund ums Wohnen","lf":"LF 4","buch":"S. 231–233","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein versichertes Haus wird verkauft. Was geschieht mit der Wohngebäudeversicherung?","optionen":["Der Erwerber tritt mit dem Eigentumsübergang in den Vertrag ein.","Der Verkäufer bleibt bis zum Vertragsende allein Versicherungsnehmer.","Der Vertrag endet automatisch mit Abschluss des Kaufvertrags.","Der Vertrag ruht, bis der Erwerber einen eigenen Antrag stellt."],"richtig":[0],"erkl":"Mit dem Eigentumsübergang (Grundbucheintrag) tritt der Erwerber anstelle des Veräußerers in den Vertrag ein. Für die laufende Versicherungsperiode haften Veräußerer und Erwerber gesamtschuldnerisch für die Prämie.","norm":"§ 95 VVG","id":"4.6-1-1"},{"typ":"zuo","frage":"Wer darf nach der Veräußerung wie kündigen?","paare":[["Erwerber","mit sofortiger Wirkung oder zum Schluss der laufenden Periode, innerhalb eines Monats nach Erwerb bzw. Kenntnis"],["Versicherer","mit einer Frist von einem Monat, innerhalb eines Monats nach Kenntnis"],["Veräußerer","hat nach dem Verkauf kein Kündigungsrecht mehr aus dem übergegangenen Vertrag"]],"erkl":"Die Kündigungsrechte stehen dem Erwerber und dem Versicherer zu.","norm":"§ 96 VVG","id":"4.6-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Haftung von Mietern treffen zu?","aussagen":[["Beschädigt ein Mieter grob fahrlässig das Mietobjekt, kann der Vermieter Schadenersatz verlangen.",true],["Schäden an der gemieteten Wohnung sind in vielen Privathaftpflichttarifen als Mietsachschäden eingeschlossen.",true],["Abnutzung durch normalen Gebrauch muss der Mieter ersetzen.",false],["Der Wohngebäudeversicherer kann den Mieter bei leichter Fahrlässigkeit in der Regel nicht in Regress nehmen.",true]],"erkl":"Normale Abnutzung ist durch die Miete abgegolten; der Regress des Gebäudeversicherers gegen Mieter ist nach der Rechtsprechung auf Vorsatz und grobe Fahrlässigkeit beschränkt.","norm":"§ 538 BGB, § 86 VVG","id":"4.6-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kraus hat sein Einfamilienhaus zum 1. Mai verkauft (Eigentumsumschreibung im Grundbuch). Die Wohngebäudeversicherung hat eine Versicherungsperiode vom 1. Januar bis 31. Dezember. Die Käuferin, Frau Neumann, möchte einen eigenen Vertrag bei ihrem Hausversicherer.","items":[{"typ":"mc","frage":"Was gilt für den bisherigen Vertrag ab dem 1. Mai?","optionen":["Der Vertrag endet zum 1. Mai automatisch, ohne dass jemand kündigen muss.","Frau Neumann tritt in den Vertrag ein, kann ihn aber erst zum Ende der Periode kündigen.","Herr Kraus bleibt Versicherungsnehmer und muss bis Jahresende weiterzahlen.","Frau Neumann tritt in den Vertrag ein und kann ihn binnen eines Monats nach Erwerb kündigen."],"richtig":[3],"erkl":"Der Vertrag geht mit dem Eigentum über; danach kann der Erwerber kündigen.","norm":"§§ 95, 96 VVG","id":"4.6-2-1"},{"typ":"mc","frage":"Frau Neumann kündigt den übergegangenen Vertrag fristgerecht. Wer schuldet die Prämie für die laufende Periode?","optionen":["Herr Kraus und Frau Neumann als Gesamtschuldner.","Beide je zur Hälfte.","Nur Herr Kraus.","Nur Frau Neumann."],"richtig":[2],"erkl":"Kündigt der Erwerber, ist er zur Zahlung der Prämie nicht verpflichtet; sie schuldet allein der Veräußerer. Ohne Kündigung hafteten beide als Gesamtschuldner (§ 95 Abs. 2 VVG).","norm":"§ 96 Abs. 3 VVG","id":"4.6-2-2"},{"typ":"mc","frage":"Was ist dem Versicherer mitzuteilen?","optionen":["Die Veräußerung ist ihm binnen drei Monaten anzuzeigen.","Die Veräußerung ist ihm unverzüglich anzuzeigen.","Nichts, weil ihm der Grundbucheintrag automatisch mitgeteilt wird.","Nur die neue Bankverbindung für den Lastschrifteinzug."],"richtig":[1],"erkl":"Unterbleibt die Anzeige, kann der Versicherer unter Umständen leistungsfrei sein.","norm":"§ 97 Abs. 1 VVG","id":"4.6-2-3"}]}]},{"nr":"4.7","titel":"Prüfungsfälle: Hausrat – Deckung prüfen","lf":"LF 4","buch":"S. 141–179","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Okafor – Einbruch in die Mietwohnung","situation":"Chiara und Daniel Okafor wohnen zur Miete in einer 92-m²-Wohnung im Paulusviertel in Halle (Saale). Ihre Hausratversicherung bei der Proximus Versicherung AG hat eine Versicherungssumme von 60.000 € mit Unterversicherungsverzicht. Laut ihren Bedingungen gilt: Wertsachen insgesamt bis 20 % der Versicherungssumme; außerhalb eines verschlossenen Wertschutzschranks Bargeld bis 1.500 € und Schmuck bis 10.000 €. Nach einem Einbruchdiebstahl müssen die Versicherten den Schaden unverzüglich der Polizei anzeigen und der Polizei unverzüglich eine Liste der gestohlenen Sachen (Stehlgutliste) einreichen. Am 14. November 2026 hebeln Täter abends die Wohnungstür auf. Sie stehlen 2.300 € Bargeld aus dem Schreibtisch, einen Laptop und einen Ring im Wert von 1.200 €, zerschneiden das Sofa und besprühen die Wohnzimmerwände mit Farbe.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden der Familie Okafor die passende Grundlage in der Hausratversicherung zu.","paare":[["gestohlener Laptop","Einbruchdiebstahl"],["zerschnittenes Sofa","Vandalismus nach einem Einbruch"],["aufgehebelte Wohnungstür der Mietwohnung","versicherte Kosten: Reparatur von Gebäudeschäden nach einem Einbruch"],["2.300 € Bargeld aus dem Schreibtisch","Wertsache mit eigener Entschädigungsgrenze"]],"erkl":"Die Täter sind durch Aufbrechen in die Wohnung eingedrungen: Der Diebstahl ist Einbruchdiebstahl, die mutwillige Zerstörung danach Vandalismus nach einem Einbruch. Schäden am Gebäude in einer gemieteten Wohnung ersetzt die Hausratversicherung als versicherte Kosten; Bargeld ist eine Wertsache mit Grenze.","norm":"VHB 2022 (GDV-Muster), Einbruchdiebstahl, Vandalismus nach einem Einbruch, versicherte Kosten, Wertsachen","id":"4.7-1-1"},{"typ":"zahl","frage":"Wie viel Euro ersetzt der Versicherer höchstens für das gestohlene Bargeld der Familie Okafor?","wert":1500,"einheit":"€","tol":0,"erkl":"Das Bargeld lag nicht in einem verschlossenen Wertschutzschrank, daher gilt die Grenze von 1.500 €. Die Gesamtgrenze für Wertsachen (20 % von 60.000 € = 12.000 €) ist mit Bargeld und Ring nicht erreicht. Von 2.300 € werden also 1.500 € ersetzt.","norm":"VHB, Entschädigungsgrenzen für Wertsachen","id":"4.7-1-2"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten der Familie Okafor nach dem Einbruch treffen zu?","aussagen":[["Die Okafors müssen den Einbruch unverzüglich bei der Polizei anzeigen.",true],["Die Stehlgutliste hilft der Polizei, gestohlene Sachen wiederzufinden, und ist deshalb unverzüglich einzureichen.",true],["Reichen sie die Liste grob fahrlässig verspätet ein, kann der Versicherer seine Leistung nach der Schwere des Verschuldens kürzen.",true],["Bei einer nur leicht fahrlässigen Verspätung ist der Versicherer vollständig leistungsfrei.",false],["Taucht der Laptop nach der Zahlung wieder auf, müssen sie das dem Versicherer nicht mitteilen.",false]],"erkl":"Stehlgutliste und Polizeianzeige sind Obliegenheiten nach dem Versicherungsfall. Bei Vorsatz ist der Versicherer leistungsfrei, bei grober Fahrlässigkeit kann er kürzen, bei leichter Fahrlässigkeit bleibt die volle Leistung. Wiedergefundene Sachen sind dem Versicherer unverzüglich anzuzeigen.","norm":"§ 28 Abs. 2 VVG; VHB, Obliegenheiten nach dem Versicherungsfall, wiederherbeigeschaffte Sachen","id":"4.7-1-3"},{"typ":"mc","frage":"Die Täter haben die Wände der Mietwohnung mit Farbe besprüht. Wer ersetzt die Kosten für die Beseitigung?","optionen":["die Hausratversicherung der Okafors als Reparaturkosten für Gebäudeschäden","nur die Wohngebäudeversicherung des Vermieters, weil Wände zum Gebäude gehören","niemand, weil Farbe an Wänden als gewöhnliche Abnutzung der Mietsache gilt","die Privathaftpflicht der Okafors, weil sie die Wohnung zurückgeben müssen"],"richtig":[0],"erkl":"In einer gemieteten Wohnung ersetzt die Hausratversicherung Kosten für Gebäudeschäden, die durch Einbruchdiebstahl, Raub oder Vandalismus entstehen. Die Wohngebäudeversicherung deckt Einbruch und Vandalismus im Grundumfang nicht; die Okafors haben den Schaden auch nicht verursacht.","norm":"VHB 2022 (GDV-Muster), versicherte Kosten (Reparatur von Gebäudeschäden)","id":"4.7-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Nowak – Außenversicherung und Raub","situation":"Familie Nowak wohnt im Stadtteil Neustadt von Halle (Saale) und hat eine Hausratversicherung mit 70.000 € Versicherungssumme. Laut Bedingungen sind Sachen weltweit versichert, solange sie nur vorübergehend, höchstens drei Monate, außerhalb der Wohnung sind (Außenversicherung). Die Entschädigung ist dort auf 10 % der Versicherungssumme, höchstens 15.000 €, begrenzt. Für Kinder, die während der Ausbildung auswärts wohnen und keinen eigenen Hausstand gründen, gilt die Außenversicherung ohne Zeitgrenze. Tochter Lena (20) studiert in Leipzig und wohnt im Wohnheim, ohne einen eigenen Hausstand zu gründen. Zum Versicherungsort gehören laut Bedingungen auch verschließbare, gemeinschaftlich genutzte Räume auf dem Grundstück, etwa der Fahrradkeller. Sohn Max (17) fährt zwei Wochen mit Kamera nach Spanien. Der Wintermantel von Frau Nowak liegt seit fünf Monaten bei ihrer Mutter.","items":[{"typ":"zahl","frage":"Bis zu welchem Betrag in Euro ersetzt der Versicherer einen Schaden in der Außenversicherung der Familie Nowak höchstens?","wert":7000,"einheit":"€","tol":0,"erkl":"10 % von 70.000 € = 7.000 €. Die Obergrenze von 15.000 € greift nicht, weil 7.000 € darunter liegen.","norm":"VHB, Außenversicherung (Entschädigungsgrenze laut Vertrag)","id":"4.7-2-1"},{"typ":"wf","frage":"Welche Aussagen zur Außenversicherung der Familie Nowak treffen zu?","aussagen":[["Die Kamera, die Max für zwei Wochen nach Spanien mitnimmt, ist über die Außenversicherung versichert.",true],["Wird sein verschlossenes Hotelzimmer aufgebrochen und die Kamera gestohlen, liegt ein Einbruchdiebstahl vor.",true],["Ein Taschendiebstahl am Strand ist als Einbruchdiebstahl versichert.",false],["Lenas Laptop im Wohnheimzimmer ist versichert, obwohl sie dort länger als drei Monate wohnt.",true],["Der Wintermantel bei der Mutter ist weiter versichert, weil er Frau Nowak gehört.",false]],"erkl":"Außenversicherung setzt einen nur vorübergehenden Aufenthalt voraus; nach mehr als drei Monaten ist der Mantel nicht mehr erfasst. Für Kinder in Ausbildung ohne eigenen Hausstand gilt die Ausnahme laut Vertrag. Einbruchdiebstahl verlangt das Eindringen in einen Raum; Taschendiebstahl ist einfacher Diebstahl.","norm":"VHB 2022 (GDV-Muster), Außenversicherung; Einbruchdiebstahl","id":"4.7-2-2"},{"typ":"mc","frage":"Welcher Vorfall ist über die Außenversicherung der Familie Nowak versichert?","optionen":["Ein Täter bedroht Herrn Nowak an der Haltestelle mit einem Messer und nimmt ihm die Uhr ab.","Am Bahnhof wird die Jacke von Frau Nowak aus dem Fahrradkorb des abgestellten Rades gestohlen.","Im Café wird Max die Geldbörse unbemerkt aus der Jacke über der Stuhllehne gezogen.","Ein Fremder bittet Lena um Wechselgeld und zieht dabei unbemerkt zwei Scheine aus ihrer Geldbörse."],"richtig":[0],"erkl":"Raub liegt vor, wenn der Täter Gewalt anwendet oder mit einer Gewalttat gegen Leib oder Leben droht, die an Ort und Stelle verübt werden soll. Die übrigen Fälle sind einfacher Diebstahl oder Trickdiebstahl ohne Gewalt; dafür besteht keine Deckung.","norm":"VHB 2022 (GDV-Muster), Raub; Außenversicherung","id":"4.7-2-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Sache der Familie Nowak den Versicherungsschutz laut Vertrag zu.","paare":[["Laptop von Lena im Wohnheim in Leipzig","Außenversicherung ohne Zeitgrenze (Ausbildung, kein eigener Hausstand)"],["Kamera von Max im Hotel in Spanien","Außenversicherung, weil nur vorübergehend außerhalb der Wohnung"],["Wintermantel seit fünf Monaten bei der Mutter","nicht versichert, weil nicht mehr vorübergehend außerhalb"],["Fahrrad im verschlossenen Gemeinschaftskeller des Wohnhauses","Versicherungsort (gemeinschaftlich genutzter Raum)"]],"erkl":"Die Außenversicherung erfasst nur vorübergehend ausgelagerte Sachen, hier höchstens drei Monate; für Kinder in Ausbildung gilt eine Ausnahme. Verschließbare, gemeinschaftlich genutzte Räume auf dem Grundstück, etwa der Fahrradkeller, gehören zum Versicherungsort.","norm":"VHB 2022 (GDV-Muster), Versicherungsort; Außenversicherung","id":"4.7-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Kaya – Was gehört zum Hausrat?","situation":"Ahmet Kaya (31) wohnt zur Miete in Halle (Saale). Er hat in die vorher leere Küche auf eigene Kosten eine Einbauküche einbauen lassen und trägt dafür die Gefahr. Am Balkon hängt seine Markise. Im Kellerverschlag lagern die Winterreifen seines Autos, außerdem besitzt er ein Pedelec (Unterstützung bis 25 km/h) und einen E-Scooter mit Versicherungskennzeichen. Laut seinen Bedingungen gehören Kraftfahrzeuge aller Art und Anhänger sowie deren Teile und Zubehör nicht zum Hausrat; ausgenommen sind nicht versicherungspflichtige Fahrzeuge wie Krankenfahrstühle, Rasenmäher und Spielfahrzeuge. Sachen außerhalb von Gebäuden, auch auf dem Balkon, sind gegen Sturm nicht versichert, ausgenommen Antennen und Markisen, die nur seiner Wohnung dienen. In seinem älteren Tarif ist Überspannung durch Blitz nur versichert, wenn sie besonders vereinbart ist; Herr Kaya hat sie eingeschlossen.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache von Herrn Kaya richtig zu.","paare":[["Einbauküche, die Herr Kaya auf eigene Kosten einbauen ließ","Hausrat, weil der Mieter sie beschafft hat und die Gefahr trägt"],["Pedelec mit Unterstützung bis 25 km/h","Hausrat, weil es rechtlich als Fahrrad gilt"],["Winterreifen im Kellerverschlag","kein Hausrat: Teile und Zubehör von Kraftfahrzeugen"],["E-Scooter mit Versicherungskennzeichen","kein Hausrat: versicherungspflichtiges Kraftfahrzeug"]],"erkl":"Einbauten des Mieters auf eigene Kosten zählen zum Hausrat. Ein Pedelec bis 25 km/h ist kein Kraftfahrzeug und wird wie ein Fahrrad behandelt. Kfz-Teile und versicherungspflichtige Fahrzeuge sind laut Bedingungen kein Hausrat; der E-Scooter braucht eine eigene Kfz-Versicherung.","norm":"VHB 2022 (GDV-Muster), Hausrat und nicht versicherte Sachen; § 1 Abs. 3 StVG; § 1 PflVG","id":"4.7-3-1"},{"typ":"mc","frage":"Ein Leitungswasserschaden zerstört die Einbauküche von Herrn Kaya und das Parkett, das der Vermieter beim Bau verlegt hat. Was gilt?","optionen":["Die Küche ersetzt die Hausratversicherung von Herrn Kaya, das Parkett die Wohngebäudeversicherung.","Beides ersetzt die Wohngebäudeversicherung, weil beides fest mit dem Gebäude verbunden ist.","Beides ersetzt die Hausratversicherung von Herrn Kaya, weil er die Wohnung nutzt.","Die Küche ersetzt die Wohngebäudeversicherung, das Parkett die Hausratversicherung."],"richtig":[0],"erkl":"Einbauten, die ein Mieter auf eigene Kosten beschafft hat und für die er die Gefahr trägt, gehören zu seinem Hausrat und sind in der Wohngebäudeversicherung ausgeschlossen. Das vom Eigentümer verlegte Parkett ist Gebäudebestandteil.","norm":"VHB 2022 und VGB 2022 (GDV-Muster), Einbauten von Mietern","id":"4.7-3-2"},{"typ":"mc","frage":"Ein Sturm mit Windstärke 9 reißt die Markise ab und weht die Balkonstühle von Herrn Kaya in den Hof. Was ersetzt die Hausratversicherung?","optionen":["nur die Markise, weil sie laut Bedingungen auch außen gegen Sturm versichert ist","nur die Balkonstühle, weil die Markise fest am Gebäude des Vermieters angebracht ist","beides, weil der Balkon zur versicherten Wohnung gehört","nichts, weil Sturmschäden nur die Wohngebäudeversicherung trägt"],"richtig":[0],"erkl":"Sachen außerhalb von Gebäuden sind gegen Sturm nicht versichert. Ausgenommen sind Antennen und Markisen, die nur der Wohnung dienen. Windstärke 9 erfüllt die Sturmdefinition (mindestens Windstärke 8).","norm":"VHB 2022 (GDV-Muster), Sturm und Hagel: nicht versicherte Schäden","id":"4.7-3-3"},{"typ":"wf","frage":"Welche Aussagen zum Einschluss „Überspannung durch Blitz“ im Vertrag von Herrn Kaya treffen zu?","aussagen":[["Zerstört ein Blitzeinschlag in der Nähe durch Überspannung seinen Fernseher, ist der Schaden versichert.",true],["Ein Kurzschluss im Fernseher ohne Blitz ist über diesen Einschluss versichert.",false],["Ohne den Einschluss wäre ein Überspannungsschaden durch Blitz in seinem Tarif nicht versichert.",true],["Ein Blitz, der ins Haus einschlägt und in der Wohnung einen Brand auslöst, ist auch ohne den Einschluss versichert.",true]],"erkl":"Brand und Blitzschlag sind Grundgefahren. Überspannung durch Blitz ist in älteren Tarifen oft nur mit Einschluss versichert; im GDV-Muster VHB 2022 gehört sie bereits zur Grunddeckung. Voraussetzung ist immer ein Blitz als Ursache; ein Defekt ohne Blitz ist nicht erfasst.","norm":"VHB 2022 (GDV-Muster), Brand, Blitzschlag, Überspannung durch Blitz","id":"4.7-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Schubert – Wasser, Sturm und Regen","situation":"Familie Schubert wohnt in einer Erdgeschosswohnung in Dessau-Roßlau. Ihre Hausratversicherung umfasst Feuer, Einbruchdiebstahl, Raub, Vandalismus, Leitungswasser, Sturm und Hagel, aber keine weiteren Naturgefahren. Im Jahr 2026 meldet Herr Schubert mehrere Schäden: Im März platzt der Schlauch der Waschmaschine. Im Mai platzt das Aquarium im Wohnzimmer. Im Juni läuft nach einem Starkregen Wasser über die Terrasse in die Wohnung. Im August tropft Wasser aus der Wohnung darüber auf das Sofa, weil dort ein Rohr gebrochen ist. Im Oktober drückt ein Sturm mit Windstärke 10 ein geschlossenes Fenster ein.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis bei Familie Schubert das Ergebnis der Deckungsprüfung zu.","paare":[["Waschmaschinenschlauch platzt, der Teppich wird nass","versichert: Leitungswasser"],["Starkregen, Wasser läuft über die Terrasse in die Wohnung","nicht versichert: weitere Naturgefahr ohne Einschluss"],["Aquarium platzt, die Zierfische verenden","nicht versichert: Inhalt des Aquariums"],["Sturm drückt das geschlossene Fenster ein, Regen beschädigt die Möbel","versichert: Sturm einschließlich Folgeschäden"],["Regen dringt bei einem Sturm durch ein offen gelassenes Fenster","nicht versichert: Regen durch nicht geschlossene Öffnung"]],"erkl":"Leitungswasser ist bestimmungswidrig ausgetretenes Wasser aus Rohren und angeschlossenen Einrichtungen; der Inhalt eines Aquariums ist ausgeschlossen. Starkregen ist eine weitere Naturgefahr. Bei Sturm sind Folgeschäden versichert, nicht aber Regen durch nicht ordnungsgemäß geschlossene Fenster.","norm":"VHB 2022 (GDV-Muster), Leitungswasser, Sturm und Hagel, weitere Naturgefahren","id":"4.7-4-1"},{"typ":"mc","frage":"Der Rohrbruch in der Wohnung über den Schuberts beschädigt ihr Sofa. Was gilt?","optionen":["Der Hausratversicherer zahlt und kann den Nachbarn in Regress nehmen, wenn dieser haftet.","Die Schuberts müssen sich zuerst an den Nachbarn wenden; der Versicherer zahlt nur ersatzweise.","Kein Schutz, weil das gebrochene Rohr nicht in der Wohnung der Schuberts liegt.","Nur die Wohngebäudeversicherung des Hauses ersetzt das Sofa, weil ein Rohr gebrochen ist."],"richtig":[0],"erkl":"Leitungswasser setzt nicht voraus, dass das Rohr in der eigenen Wohnung liegt. Der Hausratversicherer leistet und erwirbt einen möglichen Ersatzanspruch gegen den Verursacher. Die Wohngebäudeversicherung ersetzt Gebäudeschäden, keinen Hausrat.","norm":"§ 86 Abs. 1 VVG; VHB, Leitungswasser","id":"4.7-4-2"},{"typ":"wf","frage":"Welche Aussagen zur Gefahr Leitungswasser in der Hausratversicherung der Schuberts treffen zu?","aussagen":[["Kippt beim Wischen ein Eimer um und dringt Wasser in das Parkett, ist das kein Leitungswasserschaden.",true],["Läuft ein Wasserbett aus, ist das ein Leitungswasserschaden.",true],["Grundwasser, das durch die Kellerwand drückt, ist ein Leitungswasserschaden.",false],["Schäden durch Schwamm (Hausfäulepilz) sind über Leitungswasser ausgeschlossen.",true]],"erkl":"Ausgeschlossen sind u. a. Plansch- und Reinigungswasser, Schwamm sowie Grundwasser und Überschwemmung. Wasserbetten zählen zu den Einrichtungen, aus denen Leitungswasser austreten kann.","norm":"VHB 2022 (GDV-Muster), Leitungswasser: versicherte und nicht versicherte Schäden","id":"4.7-4-3"},{"typ":"mc","frage":"An Schuberts Wohnort wurde die Windstärke nicht gemessen. Wann gilt ein Sturm laut Bedingungen trotzdem als nachgewiesen?","optionen":["wenn der Wind in der Umgebung Schäden an einwandfreien Gebäuden verursacht hat","wenn Herr Schubert schriftlich versichert, dass es an dem Tag sehr stürmisch war","wenn der Wetterdienst für die Region eine Unwetterwarnung herausgegeben hatte","wenn der Schaden höher als 1.000 € ist und Fotos vom Schaden vorliegen"],"richtig":[0],"erkl":"Ist die Windstärke am Schadenort nicht feststellbar, genügt der Nachweis, dass der Wind in der Umgebung Schäden an einwandfreien Gebäuden verursacht hat oder dass der Schaden nur durch Sturm entstanden sein kann.","norm":"VHB 2022 (GDV-Muster), Sturm (Nachweis der Windstärke)","id":"4.7-4-4"}]},{"typ":"situation","titel":"Fall 5: Familie Lindner – Trennung und Umzug nach Wien","situation":"Tobias Lindner ist Versicherungsnehmer der Hausratversicherung für die Ehewohnung in Halle (Saale); der Jahresbeitrag ist jeweils am 1. Juli fällig. Seine Frau Sophie zieht nach der Trennung am 1. März 2027 in eine eigene Wohnung, Tobias bleibt in der Ehewohnung. Laut Bedingungen sind bei einer Trennung die bisherige Ehewohnung und die neue Wohnung des ausziehenden Ehegatten versichert, bis der Vertrag geändert wird, längstens bis drei Monate nach der nächsten Beitragsfälligkeit; danach nur noch die Wohnung des Versicherungsnehmers. Bei einem Umzug ins Ausland geht der Schutz nicht auf die neue Wohnung über; in der bisherigen Wohnung erlischt er spätestens zwei Monate nach Umzugsbeginn. Tobias zieht beruflich nach Wien und bringt am 1. April 2028 die ersten Möbel dauerhaft dorthin.","items":[{"typ":"mc","frage":"Bis wann ist Sophies neue Wohnung über den Vertrag von Tobias längstens versichert, wenn der Vertrag nicht geändert wird?","optionen":["bis 1. Oktober 2027, drei Monate nach der Fälligkeit am 1. Juli","bis 1. Juni 2027, drei Monate nach Sophies Auszug am 1. März","bis 1. Juli 2027, dem Tag der nächsten Fälligkeit","bis 1. März 2028, ein Jahr nach Sophies Auszug"],"richtig":[0],"erkl":"Maßgeblich ist die nächste Beitragsfälligkeit nach dem Auszug, hier der 1. Juli 2027. Drei Monate danach endet der Schutz in Sophies Wohnung spätestens.","norm":"VHB, Wohnungswechsel bei Trennung (Regelung laut Vertrag)","id":"4.7-5-1"},{"typ":"wf","frage":"Welche Aussagen zur Trennung der Lindners treffen zu?","aussagen":[["In der Übergangszeit sind Sophies Sachen in ihrer neuen Wohnung über den Vertrag von Tobias versichert.",true],["Nach Ablauf der Übergangszeit ist nur noch die Wohnung von Tobias Versicherungsort.",true],["Sophie bleibt als Ehefrau dauerhaft über den Vertrag von Tobias versichert.",false],["Sophie sollte rechtzeitig eine eigene Hausratversicherung für ihre Wohnung abschließen.",true]],"erkl":"Die Trennungsregel schafft nur eine Übergangszeit. Ohne sie wären Sophies Sachen nicht mehr erfasst, weil sie nicht mehr mit Tobias in häuslicher Gemeinschaft lebt. Danach gilt der Vertrag allein für die Wohnung des Versicherungsnehmers; Sophie braucht einen eigenen Vertrag.","norm":"VHB, Wohnungswechsel bei Trennung; § 89 Abs. 2 VVG","id":"4.7-5-2"},{"typ":"mc","frage":"Am 20. Mai 2028 wird in die noch nicht geräumte Wohnung von Tobias in Halle (Saale) eingebrochen. Ist der Schaden versichert?","optionen":["Ja, denn der Schutz dort endet erst zwei Monate nach Umzugsbeginn, also am 1. Juni.","Nein, denn mit dem ersten Möbeltransport nach Wien ist die alte Wohnung nicht mehr versichert.","Nein, denn bei einem Umzug ins Ausland endet der ganze Vertrag sofort.","Ja, denn die alte Wohnung bleibt bis zur Kündigung des Mietvertrags versichert."],"richtig":[0],"erkl":"Umzugsbeginn ist der 1. April 2028. Die bisherige Wohnung bleibt laut Vertrag noch höchstens zwei Monate versichert, also bis 1. Juni 2028. Der Einbruch am 20. Mai liegt in dieser Frist.","norm":"VHB 2022 (GDV-Muster), Wohnungswechsel (Umzug ins Ausland)","id":"4.7-5-3"},{"typ":"wf","frage":"Welche Aussagen zum Umzug von Tobias nach Wien treffen zu?","aussagen":[["Der Versicherungsschutz geht nicht auf die Wohnung in Wien über.",true],["Umzugsbeginn ist der Tag, an dem erstmals Sachen dauerhaft in die neue Wohnung gebracht werden.",true],["Während des Umzugs sind die Möbel in Wien über den bisherigen Vertrag voll versichert.",false],["Tobias muss seinen Hausrat in Wien neu versichern.",true]],"erkl":"Bei einem Umzug ins Ausland ist die neue Wohnung nicht versichert, auch nicht in der Übergangszeit. Der Schutz in der bisherigen Wohnung läuft nur noch befristet aus.","norm":"VHB 2022 (GDV-Muster), Wohnungswechsel","id":"4.7-5-4"}]},{"typ":"situation","titel":"Fall 6: Frau Hoffmann – Küchenbrand, Ferienwohnung und Pflegeheim","situation":"Gerda Hoffmann (81) wohnt in einer 70-m²-Wohnung in Halle (Saale) und hat dort eine Hausratversicherung. Außerdem besitzt sie eine dauerhaft eingerichtete Ferienwohnung in Zinnowitz auf Usedom, für die kein Vertrag besteht. Nach einem Küchenbrand im Januar 2027 ist ihre Wohnung drei Wochen unbewohnbar. Laut Bedingungen gilt: Zieht die Versicherungsnehmerin dauerhaft in ein Alten- oder Pflegeheim und gibt ihre Wohnung auf, wird das Heimzimmer zur versicherten Wohnung; Wohnfläche und Versicherungssumme sind anzupassen. In der kalten Jahreszeit ist die Wohnung zu beheizen und genügend häufig zu kontrollieren, oder alle wasserführenden Leitungen sind abzusperren und zu entleeren.","items":[{"typ":"zuo","frage":"Ordnen Sie den Kosten nach dem Küchenbrand die Regelung der Hausratversicherung zu.","paare":[["Hotelzimmer, solange die Wohnung unbewohnbar ist","Hotelkosten, zeitlich und der Höhe nach begrenzt"],["Abtransport des verbrannten Hausrats zur Entsorgung","Aufräumungskosten"],["Einlagerung der unbeschädigten Möbel während der Sanierung","Transport- und Lagerkosten"],["Frühstück im Hotel","nicht ersetzt: Nebenkosten der Unterkunft"]],"erkl":"Versicherte Kosten sind u. a. Aufräumungs-, Transport- und Lagerkosten sowie Hotelkosten, wenn die Wohnung unbewohnbar ist. Nebenkosten wie Frühstück sind ausdrücklich nicht erfasst.","norm":"VHB 2022 (GDV-Muster), versicherte Kosten","id":"4.7-6-1"},{"typ":"mc","frage":"Frau Hoffmann fragt, ob der Hausrat in ihrer Ferienwohnung über ihren Vertrag in Halle (Saale) versichert ist. Was antworten Sie?","optionen":["Nein, er ist dort dauerhaft und nicht nur vorübergehend; sie braucht einen eigenen Vertrag.","Ja, über die Außenversicherung, weil sie selbst nur in den Sommermonaten dort wohnt.","Ja, weil jede Wohnung der Versicherungsnehmerin in Deutschland automatisch versichert ist.","Ja, aber nur gegen Sturm und Hagel, weil die Ferienwohnung an der Ostseeküste liegt."],"richtig":[0],"erkl":"Versicherungsort ist die im Versicherungsschein genannte Wohnung. Die Außenversicherung erfasst nur Sachen, die vorübergehend außerhalb sind; die dauerhafte Einrichtung einer Ferienwohnung gehört nicht dazu.","norm":"VHB 2022 (GDV-Muster), Versicherungsort; Außenversicherung","id":"4.7-6-2"},{"typ":"wf","frage":"Frau Hoffmann zieht dauerhaft in ein Pflegeheim und löst ihre Wohnung auf. Welche Aussagen treffen nach den Bedingungen im Fall zu?","aussagen":[["Das Heimzimmer wird zur versicherten Wohnung.",true],["Wohnfläche und Versicherungssumme sind an das kleinere Zimmer anzupassen.",true],["Der Vertrag endet mit dem Einzug ins Heim automatisch.",false],["Möbel, die sie bei ihrem Sohn einlagert, sind dort ohne zeitliche Grenze versichert.",false]],"erkl":"Laut Vertrag gilt der Heimeinzug als Wohnungswechsel. Eingelagerte Sachen außerhalb des Versicherungsortes sind nur vorübergehend über die Außenversicherung geschützt.","norm":"VHB, Wohnungswechsel (Regelung zum Pflegeheim laut Vertrag)","id":"4.7-6-3"},{"typ":"mc","frage":"Im Februar 2027 ist Frau Hoffmann vier Wochen in Kur. Die Heizung ist aus, das Wasser nicht abgesperrt; ein Rohr platzt durch Frost. Was gilt?","optionen":["Sie hat eine Sicherheitsvorschrift verletzt; je nach Verschulden kann der Versicherer kürzen.","Der Schaden ist voll versichert, weil Frost eine Grundgefahr der Hausratversicherung ist.","Der Schaden ist nie versichert, weil Frostschäden ausschließlich den Gebäudeversicherer betreffen.","Sie verliert den Schutz nur, wenn sie die Kur nicht vorher beim Versicherer gemeldet hat."],"richtig":[0],"erkl":"Sicherheitsvorschriften sind Obliegenheiten vor dem Versicherungsfall. Bei Vorsatz ist der Versicherer leistungsfrei, bei grober Fahrlässigkeit kann er kürzen; das gilt nur, soweit die Verletzung für den Schaden ursächlich war.","norm":"§ 28 Abs. 2 und 3 VVG; VHB 2022 (GDV-Muster), Sicherheitsvorschriften","id":"4.7-6-4"}]}]},{"nr":"4.8","titel":"Prüfungsfälle: Wohngebäude – Deckung prüfen","lf":"LF 4","buch":"S. 141–179","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Brandt – Haus, Garage und Photovoltaik","situation":"Familie Brandt besitzt ein Einfamilienhaus von 1998 in Halle (Saale)-Kröllwitz mit Doppelgarage und Photovoltaikanlage auf dem Dach. Die Wohngebäudeversicherung (gleitende Neuwertversicherung, Versicherungssumme 1914 mit Unterversicherungsverzicht) umfasst Feuer, Leitungswasser sowie Sturm und Hagel; die Doppelgarage und Grundstücksbestandteile wie Zäune sind mitversichert. Laut Vertrag ist die Photovoltaikanlage nur versichert, wenn sie besonders vereinbart ist; das ist nicht geschehen. Den Teil der Entschädigung, der über den Zeitwert hinausgeht, erhält die Familie laut Bedingungen nur, wenn sie das Gebäude innerhalb von drei Jahren wiederherstellt.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache auf dem Grundstück der Brandts richtig zu.","paare":[["individuell für das Haus gefertigte, aufwendig eingepasste Küche","Gebäudebestandteil"],["Mülltonnenbox an der Hauswand","Gebäudezubehör"],["Gartenzaun","Grundstücksbestandteil"],["Waschmaschine im Keller","Hausrat"]],"erkl":"Individuell für das Gebäude gefertigte und eingepasste Küchen verlieren durch die feste Verbindung ihre Selbstständigkeit und sind Gebäudebestandteil. Müllboxen dienen dem Gebäude und sind Zubehör. Zäune sind mit dem Grundstück verbunden. Bewegliche Haushaltsgeräte gehören zum Hausrat.","norm":"VGB 2022 (GDV-Muster), Gebäudebestandteile, Gebäudezubehör, Grundstücksbestandteile; § 94 BGB","id":"4.8-1-1"},{"typ":"mc","frage":"Ein Sturm mit Windstärke 9 reißt Module der Photovoltaikanlage ab, die dabei Dachziegel zerschlagen. Was ersetzt die Wohngebäudeversicherung?","optionen":["die Dachziegel, nicht aber die Photovoltaikmodule","die Photovoltaikmodule und die Dachziegel","nur die Photovoltaikmodule, weil sie den Schaden ausgelöst haben","nichts, weil die Anlage den Schaden verursacht hat"],"richtig":[0],"erkl":"Das Dach ist Gebäudebestandteil und gegen Sturm versichert. Die Photovoltaikanlage ist laut Vertrag nur bei besonderer Vereinbarung versichert; auch im GDV-Muster VGB 2022 ist sie ohne Vereinbarung ausgeschlossen.","norm":"VGB 2022 (GDV-Muster), nicht versicherte Sachen (Photovoltaik)","id":"4.8-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Unterversicherungsverzicht im Vertrag der Brandts treffen zu?","aussagen":[["Er setzt voraus, dass die Versicherungssumme 1914 nach den Angaben der Brandts zu Größe, Ausbau und Ausstattung ermittelt wurde.",true],["Bauen die Brandts das Dachgeschoss aus und melden es nicht, kann der Versicherer bei einem späteren Schaden Unterversicherung einwenden.",true],["Der Verzicht gilt auch dann, wenn die Wohnfläche im Antrag zu niedrig angegeben wurde.",false],["Wegen des Verzichts darf der Beitrag nie an die Baupreise angepasst werden.",false]],"erkl":"Der Verzicht beruht auf richtigen Angaben zum Gebäude. Falsche Angaben oder nicht gemeldete wertsteigernde Umbauten lassen ihn entfallen. Die jährliche Anpassung über den gleitenden Neuwertfaktor bleibt davon unberührt.","norm":"VGB 2022 (GDV-Muster), Unterversicherungsverzicht; § 75 VVG","id":"4.8-1-3"},{"typ":"mc","frage":"Die Doppelgarage brennt ab. Die Brandts wollen sie nicht wieder aufbauen. Was erhalten sie nach den Bedingungen im Fall?","optionen":["nur den Zeitwertschaden, weil der Neuwertanteil an die Wiederherstellung gebunden ist","den vollen Neuwert, weil sie eine gleitende Neuwertversicherung ohne Unterversicherung haben","nichts, weil Garagen als Nebengebäude in keiner Wohngebäudeversicherung versichert sind","den Neuwert, wenn sie das Geld innerhalb von drei Jahren in eine andere Immobilie anlegen"],"richtig":[0],"erkl":"Ist ein Teil der Entschädigung an die Wiederherstellung gebunden (Wiederherstellungsklausel), kann der Betrag über den Zeitwert hinaus erst verlangt werden, wenn die Wiederherstellung gesichert ist. Ohne Wiederaufbau bleibt es beim Zeitwert.","norm":"§ 93 VVG; VGB, Entschädigung","id":"4.8-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Petrović – Leitungswasser im Mehrfamilienhaus","situation":"Milan Petrović besitzt ein Mehrfamilienhaus mit sechs Mietwohnungen in Halle (Saale)-Giebichenstein. Seine Wohngebäudeversicherung umfasst Leitungswasser und Mietausfall bis zu zwölf Monate. Bruchschäden an Ableitungsrohren außerhalb des Gebäudes sind laut Vertrag nur mit einer besonderen Klausel versichert, die nicht vereinbart ist. Im Winter 2026/2027 kommt es zu mehreren Schäden. Die Mieterin von Wohnung 3 hat auf eigene Kosten zusätzlich Laminat über den vorhandenen Dielenboden verlegen lassen und trägt dafür die Gefahr. Der Dachboden des Hauses ist unbeheizt.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden am Haus von Herrn Petrović das Ergebnis der Deckungsprüfung zu.","paare":[["Ein Wasserrohr in der Wand von Wohnung 2 bricht, die Wand wird nass","versichert: Bruchschaden innen und Nässeschaden"],["das Zuleitungsrohr im Vorgarten, das das Haus versorgt, bricht","versichert: Zuleitungsrohr außerhalb auf dem Grundstück"],["Wurzeln brechen das Abwasserrohr unter dem Rasen","nicht versichert: Ableitungsrohr außen ohne Klausel"],["der Küchenabfluss ist verstopft, ohne dass ein Rohr gebrochen ist","nicht versichert: kein Bruch- oder Nässeschaden"]],"erkl":"Innerhalb des Gebäudes sind Bruch- und Frostschäden an Zu- und Ableitungsrohren versichert, außerhalb nur Zuleitungs- und Heizungsrohre. Ableitungsrohre außerhalb brauchen eine Klausel. Eine bloße Verstopfung ist kein Versicherungsfall.","norm":"VGB 2022 (GDV-Muster), Leitungswasser: Bruchschäden innerhalb und außerhalb von Gebäuden","id":"4.8-2-1"},{"typ":"mc","frage":"Das Laminat in Wohnung 3, das die Mieterin auf eigene Kosten verlegt hat, wird durch Leitungswasser zerstört. Wer ersetzt es?","optionen":["die Hausratversicherung der Mieterin, weil sie es beschafft hat und die Gefahr trägt","die Wohngebäudeversicherung, weil Bodenbeläge in Mietwohnungen immer Gebäudebestandteile sind","Herr Petrović persönlich, weil er als Vermieter die Wohnung in gutem Zustand erhalten muss","niemand, weil Laminat weder Gebäude noch Hausrat ist"],"richtig":[0],"erkl":"Einbauten, die Mieter auf eigene Kosten beschafft haben und für die sie die Gefahr tragen, sind in der Wohngebäudeversicherung ausgeschlossen und gehören zum Hausrat der Mieterin.","norm":"VGB 2022 und VHB 2022 (GDV-Muster), Einbauten von Mietern","id":"4.8-2-2"},{"typ":"wf","frage":"Im Januar 2027 platzt die Wasserleitung im unbeheizten Dachboden durch Frost; sie war weder entleert noch abgesperrt. Welche Aussagen treffen zu?","aussagen":[["Herr Petrović hat eine Sicherheitsvorschrift (Obliegenheit vor dem Versicherungsfall) verletzt.",true],["Bei grober Fahrlässigkeit kann der Versicherer die Leistung nach der Schwere des Verschuldens kürzen.",true],["Bei leichter Fahrlässigkeit ist der Versicherer vollständig leistungsfrei.",false],["Der Versicherer kann den Vertrag innerhalb eines Monats nach Kenntnis fristlos kündigen, wenn die Verletzung vorsätzlich oder grob fahrlässig war.",true]],"erkl":"In der kalten Jahreszeit sind Gebäudeteile zu beheizen und zu kontrollieren oder wasserführende Anlagen abzusperren und zu entleeren. Die Rechtsfolgen richten sich nach § 28 VVG: Kürzung nach Verschulden, Kündigungsrecht bei Vorsatz und grober Fahrlässigkeit.","norm":"§ 28 Abs. 1 und 2 VVG; VGB 2022 (GDV-Muster), Sicherheitsvorschriften","id":"4.8-2-3"},{"typ":"mc","frage":"Wohnung 1 ist nach einem versicherten Rohrbruch vier Monate unbewohnbar; der Mieter zahlt keine Miete. Wer trägt den Mietausfall?","optionen":["die Wohngebäudeversicherung von Herrn Petrović über den mitversicherten Mietausfall","der Mieter, weil er trotz der unbewohnbaren Wohnung weiter die volle Miete schuldet","die Hausratversicherung des Mieters, weil er in der beschädigten Wohnung wohnt","Herr Petrović selbst, weil ein Mietausfall in der Wohngebäudeversicherung nie versichert ist"],"richtig":[0],"erkl":"Ist die Wohnung durch einen Mangel unbenutzbar, ist der Mieter von der Miete befreit. Den Mietausfall des Vermieters ersetzt die Wohngebäudeversicherung, hier bis zu zwölf Monate.","norm":"§ 536 Abs. 1 BGB; VGB 2022 (GDV-Muster), Mietausfall","id":"4.8-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Bergmann – Sturm, Hagel und Hochwassergefahr","situation":"Familie Bergmann besitzt ein Einfamilienhaus in Bad Dürrenberg nahe der Saale. Das Haus liegt in der ZÜRS-Gefährdungsklasse 3. Die Wohngebäudeversicherung umfasst Feuer, Leitungswasser sowie Sturm und Hagel; weitere Naturgefahren sind nicht eingeschlossen. Im Sommer 2027 gibt es mehrere Unwetter: Ein Sturm mit Windstärke 10 wirft einen Baum aus dem Garten auf das Dach, Hagel zerschlägt ein Dachfenster, und nach einem Starkregen steht Wasser im Keller.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis am Haus der Bergmanns das Ergebnis zu.","paare":[["Der vom Sturm umgeworfene Baum beschädigt das Dach","versichert: Sturm (Gegenstand auf das Gebäude geworfen)"],["Regen dringt durch das vom Hagel zerschlagene Dachfenster","versichert: Folgeschaden von Hagel"],["Starkregenwasser läuft über die Kellertreppe in den Keller","nicht versichert: Überschwemmung ohne Einschluss"],["Regen dringt während des Sturms durch ein gekipptes Dachfenster","nicht versichert: Regen durch nicht geschlossene Öffnung"]],"erkl":"Sturm umfasst auch Schäden durch Gegenstände, die der Sturm auf das Gebäude wirft, und Folgeschäden. Regen durch nicht ordnungsgemäß geschlossene Fenster ist ausgeschlossen, wenn die Öffnung nicht durch Sturm oder Hagel entstanden ist. Überschwemmung durch Starkregen ist eine weitere Naturgefahr.","norm":"VGB 2022 (GDV-Muster), Sturm und Hagel; weitere Naturgefahren","id":"4.8-3-1"},{"typ":"mc","frage":"Was bedeutet die ZÜRS-Gefährdungsklasse 3 für das Haus der Bergmanns?","optionen":["Hochwasser ist statistisch einmal in 10 bis 100 Jahren zu erwarten.","Hochwasser ist statistisch seltener als einmal in 200 Jahren zu erwarten.","Hochwasser ist statistisch mindestens einmal in 10 Jahren zu erwarten.","Das Haus ist gegen Hochwasser grundsätzlich nicht versicherbar."],"richtig":[0],"erkl":"ZÜRS teilt die Hochwassergefahr in vier Klassen: GK 1 seltener als alle 200 Jahre, GK 2 alle 100 bis 200 Jahre, GK 3 alle 10 bis 100 Jahre, GK 4 mindestens alle 10 Jahre. Auch in GK 3 ist Elementarschutz meist versicherbar, oft mit Selbstbehalt.","norm":"GDV, ZÜRS Geo (Zonierungssystem)","id":"4.8-3-2"},{"typ":"wf","frage":"Die Bergmanns überlegen, weitere Naturgefahren einzuschließen. Welche Aussagen treffen zu?","aussagen":[["Rückstau liegt vor, wenn Wasser infolge Starkregen oder Ausuferung
