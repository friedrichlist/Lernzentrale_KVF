rend des Ombudsmannverfahrens ist die Verjährung ihres Anspruchs gehemmt.",true],["Der Ombudsmann wird erst tätig, wenn sie ihren Anspruch zuvor bei der Proximus geltend gemacht hat.",true],["Die BaFin kann die Proximus im Einzelfall verbindlich zur Zahlung der 2.900,00 € verurteilen.",false],["Bei Streit mit einer privaten Krankenversicherung wäre ebenfalls der Versicherungsombudsmann zuständig.",false]],"erkl":"Die BaFin prüft Beschwerden aufsichtsrechtlich auf Missstände, entscheidet aber keine zivilrechtlichen Einzelansprüche. Für die private Kranken- und Pflegeversicherung gibt es einen eigenen Ombudsmann.","norm":"§§ 2, 12, 14 VomVO; §§ 294, 298 VAG","id":"2.5-4-4"}]}]},{"nr":"2.6","titel":"Prüfungsfälle: Informations-, Beratungs- und Dokumentationspflichten","lf":"LF 2","buch":"S. 42–58","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Erstinformation in der Agentur Costa","situation":"Rafael Costa ist gebundener Vertreter der Proximus Versicherung AG und ihrer Konzerngesellschaften für Leben und Kranken. Am 12. Oktober 2026 hat er den ersten Termin mit der Neukundin Svenja Albrecht (31) aus Halle (Saale). Sie sollen die Statusinformation vorbereiten. Herr Costa erhält Provisionen, die in den Prämien enthalten sind, und nimmt an Vertriebswettbewerben der Proximus teil.","items":[{"typ":"wf","frage":"Welche Angaben muss die Statusinformation von Herrn Costa enthalten?","aussagen":[["seinen Namen und seine betriebliche Anschrift",true],["seinen Status als gebundener Vertreter und wie sich die Registereintragung überprüfen lässt",true],["seine Registrierungsnummer und die Kontaktdaten der gemeinsamen Registerstelle",true],["die genaue Höhe seiner Provision in Euro für jeden angebotenen Vertrag",false],["die Anschrift der Schlichtungsstelle für Streitigkeiten mit Vermittlern",true],["seine private Wohnanschrift und sein Geburtsdatum",false]],"erkl":"Zur Statusinformation gehören u. a. Name, betriebliche Anschrift, Status, Registerdaten, Angaben zu Beratung und zur Art der Vergütung sowie die Schlichtungsstelle. Die Provisionshöhe in Euro ist nicht anzugeben.","norm":"§ 15 Abs. 1 VersVermV","id":"2.6-1-1"},{"typ":"mc","frage":"In welcher Form muss Herr Costa die Statusinformation übermitteln?","optionen":["Mündlich zu Beginn des Gesprächs; eine schriftliche Übergabe ist gesetzlich nicht vorgeschrieben.","Ausschließlich als Aushang in der Agentur, den die Kundin beim Termin lesen kann.","Unentgeltlich auf Papier oder – wenn die Kundin es wählt – auf anderem dauerhaftem Datenträger.","Auf Papier gegen eine Gebühr, die mit dem ersten Beitrag verrechnet werden darf."],"richtig":[2],"erkl":"Die Mitteilung erfolgt grundsätzlich auf Papier, klar, verständlich und unentgeltlich. Ein anderer dauerhafter Datenträger wie eine E-Mail ist möglich, wenn die Kundin die Wahl hatte und sich dafür entschieden hat.","norm":"§ 16 Abs. 1 und 2 VersVermV","id":"2.6-1-2"},{"typ":"mc","frage":"Frau Albrecht hatte schon am 8. Oktober angerufen, um einen Termin zu vereinbaren und erste Fragen zu ihrer Haftpflicht zu stellen. Wann hätte Herr Costa die Statusinformation übermitteln müssen?","optionen":["Unmittelbar nach diesem ersten telefonischen Geschäftskontakt.","Erst beim persönlichen Termin am 12. Oktober in der Agentur.","Mit dem Versicherungsschein, nachdem ein Vertrag geschlossen wurde.","Überhaupt nicht, weil am Telefon noch kein Antrag gestellt wurde."],"richtig":[0],"erkl":"Bei einem telefonischen Kontakt ist die Statusinformation unmittelbar nach dem ersten Geschäftskontakt zu erteilen, nicht erst beim Termin.","norm":"§ 16 Abs. 4 VersVermV, § 15 Abs. 1 VersVermV","id":"2.6-1-3"},{"typ":"zuo","frage":"Die Statusinformation muss die Art der Vergütung offenlegen. Ordnen Sie jedem Vergütungsmodell die passende Angabe zu.","paare":[["Herr Costa erhält Provision, die in der Prämie einkalkuliert ist","Vergütung als Provision in der Versicherungsprämie enthalten"],["Ein Honorarberater stellt der Kundin seine Stunden in Rechnung","Vergütung ist direkt vom Kunden zu zahlen"],["Herr Costa gewinnt eine Reise in einem Vertriebswettbewerb","Vermittler erhält als Vergütung andere Zuwendungen"],["Ein Makler erhält Courtage und zusätzlich eine Servicegebühr vom Kunden","Vergütung besteht aus einer Verknüpfung mehrerer Arten"]],"erkl":"Der Kunde soll erkennen, wer den Vermittler bezahlt und welche Interessenkonflikte entstehen können. Anzugeben ist die Art, nicht die Höhe.","norm":"§ 15 Abs. 1 Nr. 5 bis 8 VersVermV","id":"2.6-1-4"}]},{"typ":"situation","titel":"Fall 2: Ines Bauer will „nur schnell abschließen“","situation":"Ines Bauer (29) kommt in die Agentur von Marek Szabo, gebundener Vertreter der Proximus. Sie hat im Internet verglichen und möchte eine Privathaftpflicht- und eine Hausratversicherung abschließen. Außerdem überlegt sie, als frisch angestellte Physiotherapeutin eine Berufsunfähigkeitsversicherung abzuschließen. Sie bittet darum, den Rat mündlich zu bekommen, weil sie wenig Zeit hat.","items":[{"typ":"mc","frage":"Wovon hängt ab, wie ausführlich Herr Szabo Frau Bauer befragen und beraten muss?","optionen":["Allein von der Höhe der Provision, die Herr Szabo für den jeweiligen Vertrag erhält.","Allein davon, ob sich Frau Bauer vorher schon selbst im Internet über die angebotenen Tarife informiert hat.","Von den Vorgaben des Versicherers, der den Umfang der Beratung für jede Sparte verbindlich festlegt.","Von der Schwierigkeit des Produkts, von Person und Lage der Kundin und vom Verhältnis Aufwand zu Prämie."],"richtig":[3],"erkl":"Die Beratung ist anlassbezogen: Komplexe Produkte wie die Berufsunfähigkeitsversicherung erfordern mehr Beratung als eine einfache Haftpflicht. Der Aufwand muss in angemessenem Verhältnis zur Prämie stehen.","norm":"§ 61 Abs. 1 VVG","id":"2.6-2-1"},{"typ":"wf","frage":"Welche Aussagen zur Beratung von Frau Bauer treffen zu?","aussagen":[["Für die Berufsunfähigkeitsversicherung besteht wegen der Komplexität ein höherer Beratungsbedarf.",true],["Herr Szabo muss für jeden Rat die Gründe angeben.",true],["Weil Frau Bauer online verglichen hat, entfällt die Beratungspflicht automatisch.",false],["Der Umfang der Dokumentation richtet sich nach der Komplexität des Vertrags.",true]],"erkl":"Befragung, Beratung und Begründung sind Pflicht, soweit ein Anlass besteht. Ein eigener Vergleich der Kundin ersetzt die Beratung nicht; dafür wäre ein förmlicher Verzicht nötig.","norm":"§ 61 Abs. 1 und 2 VVG","id":"2.6-2-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation zu, wann und wie der Rat und die Gründe dokumentiert übermittelt werden müssen.","paare":[["Regelfall ohne besondere Wünsche","vor Abschluss des Vertrags in Textform"],["Frau Bauer wünscht die mündliche Übermittlung","unverzüglich nach Vertragsschluss, spätestens mit dem Versicherungsschein in Textform"],["Kunde hat durch gesonderte schriftliche Erklärung mit Warnhinweis verzichtet","keine Dokumentation, soweit der Verzicht reicht"],["Vorläufige Deckung in der Kfz-Haftpflicht als Pflichtversicherung","keine Nachholpflicht für den Vertrag über die vorläufige Deckung"]],"erkl":"Grundsätzlich ist vor Vertragsschluss in Textform zu dokumentieren. Bei mündlicher Übermittlung wird nachgeholt; bei vorläufiger Deckung in Pflichtversicherungen entfällt die Nachholpflicht.","norm":"§ 62 Abs. 1 und 2 VVG, § 61 Abs. 2 VVG","id":"2.6-2-3"},{"typ":"mc","frage":"Was muss Herr Szabo als Versicherungsvertreter Frau Bauer zusätzlich über seine Beratungsgrundlage mitteilen?","optionen":["Eine vollständige Liste aller Versicherer am Markt mit den jeweiligen Prämien.","Für welche Versicherer er tätig ist und ob er für diese ausschließlich tätig ist.","Die genaue Höhe seiner Provision in Euro für jeden angebotenen Vertrag.","Die Schadenquote der Proximus aus dem letzten abgeschlossenen Geschäftsjahr."],"richtig":[1],"erkl":"Vertreter müssen ihre Markt- und Informationsgrundlage offenlegen, die Versicherer nennen und angeben, ob sie ausschließlich für diese tätig sind. Eine breite Marktuntersuchung schuldet der Makler, nicht der Vertreter.","norm":"§ 60 Abs. 2 VVG","id":"2.6-2-4"}]},{"typ":"situation","titel":"Fall 3: Tomás Ferreira schließt online direkt ab","situation":"Tomás Ferreira (31) schließt am 30. Oktober 2026 direkt über die Website der Proximus Versicherung AG, ohne Vermittler, eine Hausratversicherung ab; der Versicherer nimmt den Antrag am selben Tag an und schickt ihm den Versicherungsschein per E-Mail. Wegen eines technischen Fehlers erhält er die Versicherungsbedingungen, die Verbraucherinformationen und die Widerrufsbelehrung erst am 3. November 2026 per E-Mail. Sonst ist alles ordnungsgemäß.","items":[{"typ":"mc","frage":"Wer muss Herrn Ferreira bei diesem Online-Abschluss nach seinen Wünschen und Bedürfnissen befragen und beraten?","optionen":["Niemand, weil bei einem Abschluss über eine Website grundsätzlich keine Beratungspflicht besteht.","Der Versicherer selbst, soweit Anlass besteht; im Fernabsatz ist ein Verzicht in Textform möglich.","Ein Versicherungsmakler, den der Direktversicherer für jeden Online-Kunden beauftragen muss.","Der Versicherer, ein Verzicht des Kunden ist im Fernabsatz aber ausgeschlossen."],"richtig":[1],"erkl":"Ohne Vermittler trifft die Beratungspflicht den Versicherer. Bei Fernabsatzverträgen genügt für den Verzicht die Textform.","norm":"§ 6 Abs. 1 und 3 VVG","id":"2.6-3-1"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten der Proximus bei diesem Direktabschluss treffen zu?","aussagen":[["Erkennt der Versicherer während der Laufzeit einen Anlass, muss er Herrn Ferreira auch dann beraten.",true],["Hätte ein Makler den Vertrag vermittelt, wäre der Versicherer von seiner Beratungspflicht befreit.",true],["Verletzt der Versicherer die Beratungspflicht, haftet er nur bei Vorsatz.",false],["Auf der Website, über die er abgeschlossen hat, muss während der Widerrufsfrist eine gut sichtbare Widerrufsfunktion „Vertrag widerrufen“ bereitstehen.",true],["Das Informationsblatt zu Versicherungsprodukten ersetzt die Versicherungsbedingungen.",false]],"erkl":"Die Beratungspflicht gilt auch während der Laufzeit und entfällt nur bei Maklervermittlung oder Großrisiken. Der Versicherer haftet, wenn er die Pflichtverletzung zu vertreten hat. Für Online-Abschlüsse gilt die elektronische Widerrufsfunktion.","norm":"§ 6 Abs. 4 bis 6 VVG, § 8 Abs. 1 Satz 3 VVG i. V. m. § 356a BGB, § 7 Abs. 1 VVG","id":"2.6-3-2"},{"typ":"zuo","frage":"Herr Ferreira hat auch ein Informationsblatt zu Versicherungsprodukten (IPID) erhalten. Ordnen Sie jeder Überschrift den passenden Inhalt zu.","paare":[["Was ist nicht versichert?","z. B. Sachen, die nicht zum Hausrat gehören, wie Kraftfahrzeuge"],["Wo bin ich versichert?","räumlicher Geltungsbereich, z. B. die Wohnung als Versicherungsort und die Außenversicherung"],["Welche Verpflichtungen habe ich?","z. B. Schäden unverzüglich melden und Stehlgutliste bei der Polizei einreichen"],["Wann und wie zahle ich?","Fälligkeit und Zahlungsweise der Prämie"]],"erkl":"Verbraucher erhalten ein Informationsblatt im EU-weit einheitlichen Format mit festen Überschriften; ausgedruckt umfasst es in der Regel zwei Seiten DIN A4.","norm":"§ 4 Abs. 1 und 2 VVG-InfoV, Durchführungsverordnung (EU) 2017/1469","id":"2.6-3-3"},{"typ":"zahl","frage":"Am wievielten Tag im November 2026 endet die Widerrufsfrist von Herrn Ferreira?","wert":17,"einheit":"November","tol":0,"erkl":"Die 14-tägige Frist beginnt erst, wenn Versicherungsschein, Bedingungen, Informationen und Belehrung in Textform zugegangen sind. Zugang 3. November; dieser Tag zählt nicht mit. 3 + 14 = 17. November (Dienstag).","norm":"§ 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"2.6-3-4"}]},{"typ":"situation","titel":"Fall 4: Schadenersatz für Familie Nguyen","situation":"Vertreter Henrik Lammers ist gebundener Vertreter der Proximus; sie hat die Haftung für ihn übernommen. Er hat im Mai 2024 für Familie Nguyen eine Wohngebäudeversicherung für ihr Haus in einer Senke in Halle (Saale) vermittelt. Herr Nguyen hatte nach Starkregen gefragt; Herr Lammers ging darauf nicht ein, bot keinen Elementarschutz an und dokumentierte nichts. Im Juli 2026 entsteht durch Überschwemmung nach Starkregen ein Schaden von 38.000,00 €, der nicht versichert ist. Laut den Bedingungen der Proximus hätte der Elementarbaustein einen Selbstbehalt von 10 % des Schadens, mindestens 500,00 €, höchstens 5.000,00 € gehabt.","items":[{"typ":"mc","frage":"Auf welche Rechtsgrundlage kann Familie Nguyen einen Anspruch gegen Herrn Lammers stützen?","optionen":["Leistung aus der Wohngebäudeversicherung, weil Elementar immer mitversichert ist.","Rücktritt vom Vertrag mit Rückzahlung aller seit 2024 gezahlten Beiträge.","Anfechtung des Vertrags wegen arglistiger Täuschung durch den Vertreter.","Schadenersatz wegen Verletzung seiner Beratungs- und Dokumentationspflicht."],"richtig":[3],"erkl":"Der Vermittler haftet für den Schaden, der aus einer Verletzung seiner Pflichten zur Befragung, Beratung und Dokumentation entsteht. Die Nguyens sind so zu stellen, als wären sie richtig beraten worden.","norm":"§ 63 VVG i. V. m. § 61 Abs. 1 VVG","id":"2.6-4-1"},{"typ":"wf","frage":"Welche Aussagen zur Haftung in diesem Fall treffen zu?","aussagen":[["Herr Lammers muss beweisen, dass er die Pflichtverletzung nicht zu vertreten hat.",true],["Die fehlende Dokumentation erschwert Herrn Lammers den Nachweis einer ordnungsgemäßen Beratung.",true],["Die Nguyens können sich wegen der Haftungsübernahme auch an die Proximus halten.",true],["Der Anspruch ist ausgeschlossen, weil die Nguyens den Antrag unterschrieben haben.",false]],"erkl":"Das Verschulden des Vermittlers wird vermutet. Fehlt die Dokumentation eines wichtigen Hinweises, wird vermutet, dass er nicht erteilt wurde (Beweiserleichterung für den Kunden). Für gebundene Vertreter haftet zudem der Versicherer.","norm":"§ 63 Satz 2 VVG, § 62 VVG, § 34d Abs. 7 Satz 1 Nr. 1 GewO","id":"2.6-4-2"},{"typ":"zahl","frage":"Unterstellen Sie, die Nguyens hätten bei richtiger Beratung den Elementarbaustein abgeschlossen. Welchen Schaden (in Euro) kann die Familie ersetzt verlangen? Ersparte Beiträge bleiben außer Betracht.","wert":34200,"einheit":"€","tol":0.01,"erkl":"Selbstbehalt: 10 % von 38.000,00 € = 3.800,00 € (liegt zwischen 500 € und 5.000 €). Die Versicherung hätte 38.000,00 € − 3.800,00 € = 34.200,00 € gezahlt; diesen Betrag schuldet Herr Lammers als Schadenersatz.","norm":"§ 63 VVG, § 249 Abs. 1 BGB","id":"2.6-4-3"},{"typ":"mc","frage":"In welchem Fall hätte Familie Nguyen keinen Schadenersatzanspruch gegen Herrn Lammers?","optionen":["Wenn sie den angebotenen Elementarschutz nach Beratung abgelehnt hätten und dies dokumentiert wäre.","Wenn Herr Lammers den Elementarschutz zwar nie angeboten, aber schon lange als Vertreter gearbeitet hätte.","Wenn der Schaden erst zwei Jahre nach Vertragsschluss eingetreten wäre.","Wenn Herr Lammers für die Wohngebäudeversicherung nur wenig Provision erhalten hätte."],"richtig":[0],"erkl":"Lehnt der Kunde nach richtiger Beratung einen Baustein ab, fehlt die Pflichtverletzung. Die Dokumentation dient dann als Beweis.","norm":"§ 61 Abs. 1 VVG, § 62 VVG, § 63 VVG","id":"2.6-4-4"}]},{"typ":"situation","titel":"Fall 5: Spartentrennung und Aufsicht im Proximus-Konzern","situation":"Praktikant Jannik Schulze fragt in Ihrer Agentur, warum zum Proximus-Konzern mehrere Gesellschaften gehören: die Proximus Versicherung AG (Sach-, Haftpflicht-, Unfall- und Rechtsschutzversicherung), die Proximus Lebensversicherung AG, die Proximus Krankenversicherung AG und die Proximus Rechtsschutz-Schadenservice GmbH. Außerdem möchte er wissen, wer die Gesellschaften kontrolliert.","items":[{"typ":"mc","frage":"Warum betreibt der Konzern die Lebensversicherung in einer eigenen Aktiengesellschaft?","optionen":["Lebensversicherungen dürfen nur von Gesellschaften mit Sitz außerhalb Deutschlands betrieben werden.","Eine eigene Gesellschaft für Leben ist nur aus steuerlichen Gründen vorteilhaft, aber gesetzlich nicht vorgeschrieben.","Das Gesetz verbietet einem Lebensversicherer andere Sparten, um die Sparanteile der Kunden vor deren Risiken zu schützen.","Die IHK erteilt Lebensversicherern nur dann eine Erlaubnis, wenn sie keine weiteren Sparten führen."],"richtig":[2],"erkl":"Die Erlaubnis für die Lebensversicherung und für andere Sparten schließen sich aus (Spartentrennung). So können Großschäden etwa in der Sachversicherung nicht die angesammelten Sparanteile der Lebensversicherten gefährden.","norm":"§ 8 Abs. 4 Satz 2 VAG","id":"2.6-5-1"},{"typ":"zuo","frage":"Ordnen Sie jedes Geschäft der zuständigen Gesellschaft im Proximus-Konzern zu.","paare":[["fondsgebundene Rentenversicherung","Proximus Lebensversicherung AG"],["private Krankenvollversicherung","Proximus Krankenversicherung AG"],["Wohngebäude- und Unfallversicherung","Proximus Versicherung AG"],["Leistungsbearbeitung der Rechtsschutzschäden","Proximus Rechtsschutz-Schadenservice GmbH"]],"erkl":"Leben und substitutive Krankenversicherung sind jeweils von anderen Sparten getrennt. Wer Rechtsschutz mit anderen Sparten betreibt, muss die Leistungsbearbeitung auf ein Schadenabwicklungsunternehmen übertragen.","norm":"§ 8 Abs. 4 VAG, § 164 Abs. 1 VAG, Anlage 1 VAG","id":"2.6-5-2"},{"typ":"wf","frage":"Welche Aussagen zur Aufsicht über die Proximus-Gesellschaften treffen zu?","aussagen":[["Die BaFin übt eine Rechtsaufsicht und eine Finanzaufsicht aus.",true],["Zur Finanzaufsicht gehört die Prüfung, ob die Verpflichtungen dauernd erfüllbar sind (z. B. Solvabilität).",true],["Ein Versicherer mit Sitz im Inland braucht für seinen Geschäftsbetrieb eine Erlaubnis der Aufsichtsbehörde.",true],["Die BaFin erteilt auch den gebundenen Vertretern der Proximus ihre Gewerbeerlaubnis.",false]],"erkl":"Die BaFin überwacht den gesamten Geschäftsbetrieb rechtlich und finanziell. Für die Erlaubnis und Registrierung der Vermittler sind die IHKs zuständig.","norm":"§ 8 Abs. 1 VAG, § 294 Abs. 2 bis 4 VAG, § 34d GewO","id":"2.6-5-3"},{"typ":"mc","frage":"Was ist nach dem Gesetz das Hauptziel der Versicherungsaufsicht?","optionen":["Die Sicherung möglichst hoher Gewinne für die Aktionäre der Versicherer.","Die Festsetzung einheitlicher Prämien für alle Versicherer am Markt.","Die verbindliche Entscheidung einzelner Leistungsstreitigkeiten zwischen Kunden und Versicherern.","Der Schutz der Versicherungsnehmer und der Begünstigten von Versicherungsleistungen."],"richtig":[3],"erkl":"Das VAG nennt den Schutz der Versicherten als Hauptziel. Prämien legen die Versicherer selbst fest; Einzelstreitigkeiten klären Ombudsmann oder Gerichte.","norm":"§ 294 Abs. 1 VAG","id":"2.6-5-4"}]},{"typ":"situation","titel":"Fall 6: Datenschutz und fairer Wettbewerb in der Agentur Frank","situation":"In der Agentur von Paula Frank, gebundene Vertreterin der Proximus in Halle (Saale), werden Kundendaten in einer eigenen Kundendatei geführt; die Agentur ist dafür selbst Verantwortliche im Sinne der DSGVO. Am Montag um 9:00 Uhr bemerkt sie, dass ein unverschlüsselter Laptop mit Kundendaten gestohlen wurde. Ein neuer Mitarbeiter will Kunden eines Mitbewerbers mit einem Flyer abwerben, auf dem steht: „Die Konkurrenz zahlt im Schadenfall sowieso nie.“","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Grundsatz der DSGVO das passende Beispiel aus der Agentur zu.","paare":[["Zweckbindung","Daten aus dem Hausratantrag werden nicht ohne Weiteres für Werbung eines Partnerunternehmens genutzt"],["Datenminimierung","für ein Hausratangebot wird nicht nach dem Arbeitgeber des Ehepartners gefragt"],["Speicherbegrenzung","Daten werden gelöscht, sobald Zweck und Aufbewahrungsfristen entfallen sind"],["Integrität und Vertraulichkeit","Laptops sind verschlüsselt und Kundenakten vor Zugriff Unbefugter geschützt"]],"erkl":"Die DSGVO verlangt u. a. Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung sowie Integrität und Vertraulichkeit; der Verantwortliche muss die Einhaltung nachweisen können (Rechenschaftspflicht).","norm":"Art. 5 Abs. 1 Buchst. b, c, e und f, Abs. 2 DSGVO","id":"2.6-6-1"},{"typ":"zahl","frage":"Innerhalb von wie vielen Stunden nach Bekanntwerden muss die Agentur den Laptopdiebstahl in der Regel der Datenschutzaufsichtsbehörde melden?","wert":72,"einheit":"Stunden","tol":0,"erkl":"Eine Verletzung des Schutzes personenbezogener Daten ist möglichst binnen 72 Stunden nach Bekanntwerden zu melden, außer sie führt voraussichtlich nicht zu einem Risiko für die Betroffenen. Bei unverschlüsselten Kundendaten ist ein Risiko anzunehmen.","norm":"Art. 33 Abs. 1 DSGVO","id":"2.6-6-2"},{"typ":"wf","frage":"Welche Aussagen zu Wettbewerbsrichtlinien und UWG treffen zu?","aussagen":[["Unwahre oder herabsetzende Äußerungen über Mitbewerber sind unzulässig.",true],["Vergleichende Werbung ist erlaubt, wenn sie sachlich, nachprüfbar und vollständig ist.",true],["Die Wettbewerbsrichtlinien sind ein Gesetz des Bundestages mit Bußgeldern der BaFin.",false],["Mit der staatlichen Versicherungsaufsicht darf als Besonderheit des eigenen Unternehmens geworben werden.",false]],"erkl":"Die Wettbewerbsrichtlinien sind eine Selbstverpflichtung von Versicherern und Vermittlerverbänden, die das UWG konkretisiert. Die Aufsicht gilt für alle Versicherer und ist kein Werbeargument.","norm":"Wettbewerbsrichtlinien der Versicherungswirtschaft Ziff. 3, 29, 36; § 6 UWG","id":"2.6-6-3"},{"typ":"mc","frage":"Wie ist der geplante Flyer „Die Konkurrenz zahlt im Schadenfall sowieso nie.“ zu beurteilen?","optionen":["Zulässig, weil Meinungsäußerungen in der Werbung grundsätzlich erlaubt sind.","Zulässig, wenn der Flyer nur an Kunden des Mitbewerbers verteilt wird.","Unlauter, weil er den Mitbewerber mit einer unwahren Pauschalbehauptung herabsetzt.","Unlauter nur dann, wenn der betroffene Mitbewerber vorher schriftlich widersprochen hat."],"richtig":[2],"erkl":"Wer Mitbewerber herabsetzt oder geschäftsschädigende Tatsachen behauptet, die nicht erweislich wahr sind, handelt unlauter; der Mitbewerber kann Unterlassung verlangen.","norm":"§ 4 Nr. 1 und 2 UWG, § 8 Abs. 1 UWG, Wettbewerbsrichtlinien Ziff. 3 und 8","id":"2.6-6-4"}]}]}]},{"nr":"3","titel":"Rechtliche und vertragliche Rahmenbedingungen einhalten","lf":"LF 2 / LF 3","abschnitte":[{"nr":"3.1","titel":"Verbraucherschutz, Wettbewerbsrecht, Geldwäsche, Aufsicht und Vermittlerrecht","lf":"LF 3","buch":"S. 59–72","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wer braucht für die Versicherungsvermittlung KEINE eigene Erlaubnis der IHK?","optionen":["Der Mehrfachvertreter, der ohne Haftungsübernahme für mehrere Versicherer tätig ist.","Der Versicherungsmakler, der im Auftrag des Kunden mehrere Versicherer vergleicht.","Der Versicherungsberater, der gegen Honorar unabhängig von Versicherern berät.","Der gebundene Vertreter, für den der Versicherer die uneingeschränkte Haftung übernimmt."],"richtig":[3],"erkl":"Der gebundene (Ausschließlichkeits-)Vertreter wird vom Versicherer ins Register gemeldet und braucht keine eigene Erlaubnis.","norm":"§ 34d Abs. 7 GewO","id":"3.1-1-1"},{"typ":"zahl","frage":"Wie viele Stunden Weiterbildung muss ein Versicherungsvermittler mindestens je Kalenderjahr nachweisen?","wert":15,"einheit":"Stunden","tol":0,"erkl":"Vermittler und die an der Vermittlung mitwirkenden Beschäftigten müssen sich jährlich mindestens 15 Stunden weiterbilden.","norm":"§ 34d Abs. 9 GewO, § 7 VersVermV","id":"3.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie den Vermittlertyp seiner Rechtsstellung zu.","paare":[["Versicherungsvertreter","ist vom Versicherer beauftragt und steht in dessen Lager"],["Versicherungsmakler","ist vom Kunden beauftragt und steht in dessen Lager"],["Versicherungsberater","berät gegen Honorar, ohne Provision von Versicherern anzunehmen"]],"erkl":"Die Stellung entscheidet über Pflichten und Haftung.","norm":"§ 59 VVG, § 34d GewO","id":"3.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Geldwäschegesetz bei der Vermittlung von Lebensversicherungen treffen zu?","aussagen":[["Ein Versicherungsmakler, der Lebensversicherungen vermittelt, gehört zu den Verpflichteten nach dem Geldwäschegesetz.",true],["Der Vertragspartner ist zu identifizieren, z. B. anhand des Personalausweises; ein gebundener Vertreter tut dies für den Versicherer.",true],["Verdachtsfälle werden an die Zentralstelle für Finanztransaktionsuntersuchungen (FIU) gemeldet.",true],["Der Kunde muss vorab darüber informiert werden, dass eine Verdachtsmeldung abgegeben wird.",false]],"erkl":"Gebundene Vertreter sind wegen der Ausnahme für § 34d Abs. 7 GewO nicht selbst Verpflichtete; sie wirken für den Versicherer mit und melden über dessen Geldwäschebeauftragten. Der Kunde darf über eine Verdachtsmeldung nicht informiert werden.","norm":"§§ 2, 10, 43, 47 GwG","id":"3.1-1-4"},{"typ":"mc","frage":"Ein Vertreter bietet einem Kunden an, ihm einen Teil seiner Provision zurückzugeben, wenn er den Vertrag abschließt. Wie ist das zu beurteilen?","optionen":["Zulässig, weil es sich um einen üblichen Preisnachlass handelt.","Zulässig bei Verträgen mit einer Laufzeit von mehr als zehn Jahren.","Unzulässig, weil es gegen das Provisionsabgabeverbot verstößt.","Zulässig, wenn der Vertreter den Versicherer vorher informiert."],"richtig":[2],"erkl":"Sondervergütungen an Versicherungsnehmer sind grundsätzlich verboten (Ausnahme: geringwertige Zuwendungen); zulässig ist sie außerdem zur dauerhaften Prämiensenkung oder Leistungserhöhung (§ 48c VAG).","norm":"§ 48b VAG","id":"3.1-1-5"},{"typ":"mc","frage":"Welche Behörde beaufsichtigt in Deutschland die Versicherungsunternehmen?","optionen":["Der Versicherungsombudsmann als unabhängige Schlichtungsstelle.","Die Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin).","Die Industrie- und Handelskammer am Sitz des Versicherers.","Das Bundeskartellamt als oberste Wettbewerbsbehörde."],"richtig":[1],"erkl":"Die BaFin übt die Rechts- und Finanzaufsicht aus; die IHK ist für die Erlaubnis und Registrierung der Vermittler zuständig.","norm":"§ 320 Abs. 1 VAG (Zuständigkeit), § 294 VAG (Aufgaben)","id":"3.1-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Brandt (62) möchte bei Ihnen eine Rentenversicherung gegen Einmalbeitrag von 180.000 € abschließen. Den Betrag will er bar einzahlen. Auf die Frage nach der Herkunft des Geldes reagiert er ausweichend.","items":[{"typ":"mc","frage":"Was muss vor Vertragsschluss in jedem Fall geschehen?","optionen":["Herrn Brandt identifizieren (lassen) und seine Daten aufzeichnen.","Auf die Identifizierung verzichten, weil er bereits älter als 60 Jahre ist.","Nichts, weil Rentenversicherungen nicht unter das Geldwäschegesetz fallen.","Den Betrag annehmen und die Herkunft erst nach Vertragsschluss klären."],"richtig":[0],"erkl":"Bei der Vermittlung von Lebensversicherungen ist der Vertragspartner zu identifizieren; ein gebundener Vertreter erledigt das für den Versicherer, der Verpflichteter nach dem GwG ist.","norm":"§§ 10, 11 GwG","id":"3.1-2-1"},{"typ":"mc","frage":"Welches Verhalten ist richtig, wenn Sie einen Geldwäscheverdacht haben?","optionen":["Den Verdacht der Polizei melden und den Kunden über die Meldung informieren.","Den Kunden auf den Verdacht ansprechen und ihm Gelegenheit zur Erklärung geben.","Den Vertrag abschließen und den Verdacht erst bei der nächsten Jahresprüfung melden.","Den Verdacht unverzüglich melden, ohne den Kunden darüber zu informieren."],"richtig":[3],"erkl":"Verdachtsmeldepflicht und Verbot der Informationsweitergabe gelten nebeneinander. Als gebundener Vertreter melden Sie über den Geldwäschebeauftragten des Versicherers an die FIU.","norm":"§§ 43, 47 GwG","id":"3.1-2-2"},{"typ":"zahl","frage":"Wie viele Jahre müssen die Aufzeichnungen aus der Identifizierung mindestens aufbewahrt werden?","wert":5,"einheit":"Jahre","tol":0,"erkl":"Die Aufzeichnungen sind fünf Jahre aufzubewahren.","norm":"§ 8 Abs. 4 GwG","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Über das Zustandekommen von Verträgen informieren","lf":"LF 2","buch":"S. 73–89","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Begriffe richtig zu.","paare":[["Antragsmodell","Der Kunde stellt den Antrag, der Versicherer nimmt ihn mit der Police an."],["Invitatiomodell","Der Kunde fordert ein Angebot an, der Versicherer macht es, der Kunde nimmt an."],["Vorläufige Deckung","eigenständiger Vertrag, der Schutz bis zur Entscheidung über den Hauptvertrag gibt"]],"erkl":"Beim Antragsmodell ist der Antrag des Kunden das Angebot im Sinne des BGB.","norm":"§§ 145 ff. BGB, §§ 49 ff. VVG","id":"3.2-1-1"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Hausratversicherung?","wert":14,"einheit":"Tage","tol":0,"erkl":"Die Frist beginnt, wenn der Kunde Police, Bedingungen, Informationen und die Belehrung in Textform erhalten hat.","norm":"§ 8 Abs. 1 und 2 VVG","id":"3.2-1-2"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Lebensversicherung?","wert":30,"einheit":"Tage","tol":0,"erkl":"Für Lebensversicherungen gilt eine verlängerte Widerrufsfrist.","norm":"§ 152 Abs. 1 VVG","id":"3.2-1-3"},{"typ":"mc","frage":"Die Police weicht vom Antrag ab, der Versicherer hat auf die Abweichung deutlich hingewiesen. Was gilt, wenn der Kunde nicht reagiert?","optionen":["Der Vertrag ist unwirksam, weil sich Antrag und Police inhaltlich nicht decken.","Die Abweichung gilt als genehmigt, wenn er nicht binnen 14 Tagen nach Zugang widerspricht.","Die Abweichung gilt als genehmigt, wenn er nicht binnen eines Monats nach Zugang widerspricht.","Der Vertrag gilt mit dem Inhalt des Antrags, solange der Kunde der Abweichung nicht zustimmt."],"richtig":[2],"erkl":"Bei deutlichem Hinweis gilt die Abweichung als genehmigt, wenn der Kunde nicht binnen eines Monats in Textform widerspricht; ohne Hinweis gilt der Antragsinhalt.","norm":"§ 5 VVG","id":"3.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe zum Versicherungsbeginn zu.","paare":[["Formeller Beginn","Zeitpunkt des Vertragsschlusses"],["Materieller Beginn","Zeitpunkt, ab dem der Versicherer haftet"],["Technischer Beginn","Zeitpunkt, ab dem die Prämie berechnet wird"]],"erkl":"Die drei Zeitpunkte können auseinanderfallen, z. B. bei einer Rückwärtsversicherung.","norm":"Grundlagen; § 2 VVG (Rückwärtsversicherung)","id":"3.2-1-5"},{"typ":"wf","frage":"Welche Aussagen zur Geschäftsfähigkeit treffen zu?","aussagen":[["Ein Sechsjähriger ist geschäftsunfähig.",true],["Ein 16-Jähriger braucht für einen Versicherungsvertrag grundsätzlich die Zustimmung seiner gesetzlichen Vertreter, es sei denn, er bewirkt die Leistung mit Mitteln, die ihm zur freien Verfügung überlassen wurden.",true],["Ein ohne Zustimmung geschlossener Vertrag eines Minderjährigen ist grundsätzlich schwebend unwirksam, bis die Eltern ihn genehmigen.",true],["Ab 14 Jahren ist man voll geschäftsfähig.",false]],"erkl":"Volle Geschäftsfähigkeit beginnt mit 18; zwischen 7 und 17 ist man beschränkt geschäftsfähig.","norm":"§§ 104, 106, 107, 108, 110 BGB","id":"3.2-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Leonie (17) hat einen E-Scooter von ihren Großeltern geschenkt bekommen und möchte bei Ihnen eine Versicherungsplakette kaufen. Sie will den Beitrag von ihrem Taschengeld bezahlen. Ihre Eltern wissen noch nichts davon.","items":[{"typ":"mc","frage":"Kann Leonie den Vertrag ohne Zustimmung der Eltern wirksam schließen?","optionen":["Ja, weil ihr der Versicherungsvertrag nur einen rechtlichen Vorteil bringt.","Ja, wenn sie den Beitrag sofort aus ihrem frei verfügbaren Taschengeld bezahlt.","Ja, weil sie mit 17 Jahren für Versicherungsverträge voll geschäftsfähig ist.","Nein, Minderjährige können Verträge nur durch ihre Eltern schließen lassen."],"richtig":[1],"erkl":"Ein Vertrag ist von Anfang an wirksam, wenn der Minderjährige die Leistung mit Taschengeld bewirkt. Ein Versicherungsvertrag bringt wegen der Prämienpflicht nicht nur einen rechtlichen Vorteil.","norm":"§§ 107, 110 BGB","id":"3.2-2-1"},{"typ":"mc","frage":"Welche Angabe ist für die Versicherungsplakette richtig?","optionen":["Sie gilt für ein Verkehrsjahr vom 1. März bis Ende Februar des Folgejahres.","Sie gilt immer genau zwölf Monate ab dem Tag des Kaufs der Plakette.","Sie gilt für ein Kalenderjahr vom 1. Januar bis zum 31. Dezember.","Sie gilt nur in der Saison vom 1. März bis zum 31. Oktober eines jeden Jahres."],"richtig":[0],"erkl":"Versicherungskennzeichen bzw. -plaketten (für E-Scooter) wechseln jährlich zum 1. März die Farbe.","norm":"FZV, eKFV","id":"3.2-2-2"},{"typ":"mc","frage":"Leonie fragt, ob sie den Vertrag widerrufen kann, wenn ihre Eltern dagegen sind. Was ist richtig?","optionen":["Nein, bei Versicherungskennzeichen ist der Widerruf gesetzlich grundsätzlich ausgeschlossen.","Nur mit Zustimmung des Versicherers, weil die Plakette bereits ausgehändigt wurde.","Ja, innerhalb von 30 Tagen ab Zahlung des Beitrags, auch ohne Belehrung in Textform.","Ja, innerhalb von 14 Tagen ab Erhalt aller Vertragsunterlagen und der Belehrung in Textform."],"richtig":[3],"erkl":"Das Widerrufsrecht entfällt nur in gesetzlichen Ausnahmen, z. B. bei Verträgen mit einer Laufzeit von weniger als einem Monat.","norm":"§ 8 VVG","id":"3.2-2-3"}]}]},{"nr":"3.3","titel":"Rechtsgrundlagen bei der Antrags- und Vertragsbearbeitung einhalten","lf":"LF 2","buch":"S. 90–122","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Der Kunde zahlt die erste Prämie nicht. Was gilt für den Versicherer, wenn vor der Zahlung ein Schaden eintritt?","optionen":["Der Vertrag ist rückwirkend nichtig, sodass der Kunde auch keine Prämie mehr schuldet.","Er muss leisten, darf aber die doppelte Erstprämie von der Entschädigung abziehen.","Er ist leistungsfrei, wenn der Kunde die Nichtzahlung zu vertreten hat und darauf hingewiesen wurde.","Er ist erst leistungsfrei, wenn er den Kunden gemahnt und eine Zahlungsfrist von zwei Wochen gesetzt hat."],"richtig":[2],"erkl":"Der Hinweis muss in Textform oder durch auffälligen Hinweis im Versicherungsschein erfolgen. Zusätzlich kann der Versicherer vom Vertrag zurücktreten, solange die Erstprämie nicht gezahlt ist.","norm":"§ 37 VVG","id":"3.3-1-1"},{"typ":"zahl","frage":"Wie viele Wochen muss die Zahlungsfrist bei einer nicht gezahlten Folgeprämie mindestens betragen?","wert":2,"einheit":"Wochen","tol":0,"erkl":"Der Versicherer bestimmt in Textform eine Zahlungsfrist von mindestens zwei Wochen mit Belehrung über die Folgen.","norm":"§ 38 Abs. 1 VVG","id":"3.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur vorvertraglichen Anzeigepflicht treffen zu?","aussagen":[["Der Kunde muss die ihm bekannten gefahrerheblichen Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat.",true],["Bei vorsätzlicher oder grob fahrlässiger Verletzung kann der Versicherer vom Vertrag zurücktreten.",true],["Bei einfacher Fahrlässigkeit kann der Versicherer kündigen oder den Vertrag anpassen.",true],["Der Kunde muss auch Umstände anzeigen, nach denen nie gefragt wurde, sonst ist der Vertrag nichtig.",false]],"erkl":"Die Rechtsfolgen sind nach dem Verschulden abgestuft; der Versicherer muss sie innerhalb eines Monats nach Kenntnis geltend machen.","norm":"§§ 19, 21 VVG","id":"3.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Verschulden bei einer Obliegenheitsverletzung die Rechtsfolge zu.","paare":[["Vorsatz","Der Versicherer ist leistungsfrei."],["Grobe Fahrlässigkeit","Der Versicherer kann die Leistung entsprechend der Schwere des Verschuldens kürzen."],["Einfache Fahrlässigkeit","Die Leistung bleibt voll erhalten."]],"erkl":"Außer bei Arglist bleibt der Versicherer zur Leistung verpflichtet, wenn die Verletzung weder für den Eintritt noch für den Umfang des Schadens ursächlich war.","norm":"§ 28 Abs. 2 und 3 VVG","id":"3.3-1-4"},{"typ":"mc","frage":"Ein Hausratvertrag läuft fünf Jahre. Wann kann der Kunde ihn nach dem VVG frühestens ordentlich kündigen?","optionen":["Zum Schluss des ersten Versicherungsjahres mit einer Frist von einem Monat.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von drei Monaten.","Zum Ende der fünfjährigen Laufzeit mit einer Frist von drei Monaten.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von einem Monat."],"richtig":[1],"erkl":"Verträge mit einer Laufzeit von mehr als drei Jahren kann der Versicherungsnehmer zum Schluss des dritten oder jedes folgenden Jahres kündigen.","norm":"§ 11 Abs. 4 VVG","id":"3.3-1-5"},{"typ":"mc","frage":"Nach einem Leitungswasserschaden hat der Versicherer gezahlt. Bis wann können beide Vertragspartner den Vertrag kündigen?","optionen":["Innerhalb eines Monats nach Abschluss der Verhandlungen über die Entschädigung.","Innerhalb eines Monats nach dem Schadentag, aber nur durch den Versicherer.","Innerhalb von drei Monaten nach dem Tag, an dem der Schaden eingetreten ist.","Nur zum Ende der laufenden Versicherungsperiode mit einer Frist von drei Monaten."],"richtig":[0],"erkl":"Der Versicherer muss eine Frist von einem Monat einhalten; der Kunde kann sofort oder zum Ende der laufenden Periode kündigen.","norm":"§ 92 VVG","id":"3.3-1-6"},{"typ":"mc","frage":"Ein Kunde lässt in seinem Einfamilienhaus die Einbruchmeldeanlage dauerhaft abschalten, deren Einbau ein Rabattgrund war. Wie nennt man diesen Vorgang?","optionen":["Doppelversicherung","Obliegenheit im Versicherungsfall","Unterversicherung","Gefahrerhöhung"],"richtig":[3],"erkl":"Nach Vertragsschluss darf der Kunde ohne Einwilligung des Versicherers keine Gefahrerhöhung vornehmen; er muss sie anzeigen.","norm":"§§ 23 ff. VVG","id":"3.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Albers hat am 3. März eine Hausratversicherung beantragt. Die Police (Versicherungsbeginn 10. März) mit Belehrung und Unterlagen geht ihr am 10. März zu, die Erstprämie wird zum 1. April fällig. Am 25. März wird in ihre Wohnung eingebrochen. Die Prämie hatte sie noch nicht gezahlt.","items":[{"typ":"mc","frage":"Muss der Versicherer für den Einbruch leisten?","optionen":["Nein, denn während der laufenden Widerrufsfrist besteht noch kein Schutz.","Nur anteilig, denn der Versicherungsbeginn liegt vor der Prämienfälligkeit.","Ja, denn die Erstprämie war am Schadentag noch nicht fällig.","Nein, denn ohne gezahlte Erstprämie beginnt der Versicherungsschutz nicht."],"richtig":[2],"erkl":"Leistungsfreiheit setzt voraus, dass die fällige Erstprämie schuldhaft nicht gezahlt wurde. Fällig war sie erst zum 1. April, die Kundin hat die Nichtzahlung am 25. März also nicht zu vertreten.","norm":"§ 37 Abs. 2 VVG","id":"3.3-2-1"},{"typ":"zahl","frage":"An welchem Tag endet die Widerrufsfrist von Frau Albers (Tag im März)?","wert":24,"einheit":". März","tol":0,"erkl":"Fristbeginn mit Zugang am 10. März; 14 Tage → Ende am 24. März (ein Werktag). Der rechtzeitige Versand des Widerrufs genügt.","norm":"§ 8 VVG, §§ 187, 188 BGB","id":"3.3-2-2"},{"typ":"mc","frage":"Frau Albers zahlt im Folgejahr den Beitrag nicht. Nach Ablauf der zweiwöchigen Zahlungsfrist kündigt der Versicherer. Wie kann sie den Vertrag noch retten?","optionen":["Sie zahlt innerhalb von zwei Wochen nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie widerspricht innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb von drei Monaten nach der Kündigung; dann lebt der Vertrag rückwirkend auf."],"richtig":[1],"erkl":"Die Zahlung heilt die Kündigung; für Versicherungsfälle zwischen Fristablauf und Zahlung bleibt der Versicherer leistungsfrei.","norm":"§ 38 Abs. 3 VVG","id":"3.3-2-3"}]}]},{"nr":"3.4","titel":"Prüfungsfälle: Verbraucherschutz, Geldwäsche, Datenschutz, AGB","lf":"LF 3","buch":"S. 59–72","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Kowalczyk – Einmalbeitrag einer ehemaligen Abgeordneten","situation":"Die Agentur Kowalczyk in Halle (Saale) arbeitet als gebundener Vertreter (§ 34d Abs. 7 Nr. 1 GewO) ausschließlich für die Versicherer einer Versicherungsgruppe, darunter deren Lebensversicherer. Frau Ilse Hartwig (61) war bis Februar 2026 Abgeordnete des Deutschen Bundestages. Im Oktober 2026 möchte sie eine private Rentenversicherung gegen Einmalbeitrag von 250.000,00 € abschließen. Bezugsberechtigt im Todesfall soll ihr Neffe Lars Hartwig sein. Den Beitrag will sie vom Konto einer Firma überweisen lassen, zu der sie keine Angaben machen möchte.","items":[{"typ":"mc","frage":"Wer ist bei diesem Geschäft Verpflichteter im Sinne des Geldwäschegesetzes?","optionen":["Der Lebensversicherer, für den die Agentur vermittelt; die gebundene Agentur selbst dagegen nicht.","Nur die Agentur Kowalczyk, weil sie Frau Hartwig persönlich trifft, berät und den Antrag aufnimmt.","Niemand, weil private Rentenversicherungen nicht unter die Pflichten des Geldwäschegesetzes fallen.","Versicherer und Agentur gleichermaßen, weil jeder Vermittler von Lebensversicherungen verpflichtet ist."],"richtig":[0],"erkl":"Lebensversicherer (dazu zählen Rentenversicherungen) sind Verpflichtete. Vermittler sind es nur, soweit sie keine gebundenen Vertreter nach § 34d Abs. 7 Nr. 1 GewO sind; die Agentur wirkt aber für den Versicherer an dessen Pflichten mit (z. B. Identifizierung).","norm":"§ 2 Abs. 1 Nr. 7 und 8 GwG, § 34d Abs. 7 Nr. 1 GewO","id":"3.4-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Identifizierung bei diesem Vertrag treffen zu?","aussagen":[["Von Frau Hartwig sind u. a. Vor- und Nachname, Geburtsort, Geburtsdatum, Staatsangehörigkeit und Wohnanschrift zu erheben.",true],["Beruf und Jahreseinkommen gehören zu den Pflichtangaben, die bei jeder Identifizierung einer natürlichen Person zu erheben sind.",false],["Die Identität des Neffen als abweichender Bezugsberechtigter ist festzustellen; die Überprüfung kann spätestens bis zur Auszahlung erfolgen.",true],["Auf Wunsch der Kundin darf die Identifizierung grundsätzlich erst nach Vertragsschluss erfolgen.",false]],"erkl":"Identifiziert wird grundsätzlich vor Begründung der Geschäftsbeziehung; § 11 Abs. 4 GwG nennt die zu erhebenden Angaben (Beruf und Einkommen gehören nicht zu diesen Pflichtangaben). Für einen abweichenden Bezugsberechtigten gilt die Sonderregel des VAG.","norm":"§ 11 Abs. 1 und 4 GwG, § 54 Abs. 1 und 2 VAG","id":"3.4-1-2"},{"typ":"mc","frage":"Welche Pflicht gilt wegen der früheren Tätigkeit von Frau Hartwig?","optionen":["Verstärkte Sorgfaltspflichten: u. a. Zustimmung der Führungsebene, Herkunft der Mittel klären, verstärkte Überwachung.","Keine besonderen Pflichten, weil sie ihr Mandat schon im Februar 2026 beendet hat und nicht mehr als politisch exponiert gilt.","Ein Vertrag mit einer politisch exponierten Person ist verboten und muss deshalb abgelehnt werden.","Nur vereinfachte Sorgfaltspflichten, weil Abgeordnete bereits staatlich überprüft und registriert sind."],"richtig":[0],"erkl":"Abgeordnete sind politisch exponierte Personen. Das besondere Risiko ist mindestens zwölf Monate nach dem Ausscheiden weiter zu berücksichtigen; deshalb gelten im Oktober 2026 noch die verstärkten Sorgfaltspflichten.","norm":"§ 1 Abs. 12 GwG, § 15 Abs. 3 Nr. 1 und Abs. 4 Satz 1 und 3 GwG","id":"3.4-1-3"},{"typ":"zahl","frage":"Angenommen, der Vertrag wird im Jahr 2031 vollständig abgewickelt und die Geschäftsbeziehung endet. Bis zum Ende welches Jahres müssen die Identifizierungsunterlagen mindestens aufbewahrt werden?","wert":2036,"einheit":"(Jahr)","tol":0,"erkl":"Die Aufbewahrungsfrist beträgt fünf Jahre und beginnt mit dem Schluss des Kalenderjahres, in dem die Geschäftsbeziehung endet: 31.12.2031 + 5 Jahre = 31.12.2036. Spätestens nach zehn Jahren sind die Unterlagen zu vernichten.","norm":"§ 8 Abs. 4 GwG","id":"3.4-1-4"},{"typ":"wf","frage":"Der Versicherer hält die Überweisung von einem unbekannten Firmenkonto für verdächtig. Welche Aussagen treffen zu?","aussagen":[["Der Verdacht ist unverzüglich der Zentralstelle für Finanztransaktionsuntersuchungen (FIU) zu melden.",true],["Gemeldet werden muss erst, wenn der Betrag 15.000,00 € übersteigt.",false],["Die Transaktion darf frühestens durchgeführt werden, wenn FIU oder Staatsanwaltschaft zugestimmt haben oder der dritte Werktag nach Abgang der Meldung ohne Untersagung verstrichen ist.",true],["Die Agentur darf Frau Hartwig über die Meldung informieren, damit sie Belege nachreichen kann.",false]],"erkl":"Die Meldepflicht gilt unabhängig vom Wert. Nach der Meldung gilt eine Stillhaltefrist; der Kunde darf über die Meldung nicht informiert werden (Verbot der Informationsweitergabe).","norm":"§§ 43 Abs. 1, 46 Abs. 1, 47 Abs. 1 GwG","id":"3.4-1-5"}]},{"typ":"situation","titel":"Fall 2: Agentur Ebert – Daten von Frau Nguyen","situation":"Frau Mai Linh Nguyen (29) lässt sich in der Agentur Ebert in Halle (Saale) zu einer Hausrat- und einer Berufsunfähigkeitsversicherung beraten. Die Agentur ist für die Verarbeitung der Daten ihrer Kunden und Interessenten selbst Verantwortliche im Sinne der DSGVO. Frau Nguyen hat noch keinen Vertrag bei der Agentur. Die Agentur möchte ihr außerdem einen monatlichen Werbe-Newsletter per E-Mail schicken.","items":[{"typ":"zuo","frage":"Ordnen Sie der Datenverarbeitung die passende Rechtsgrundlage zu.","paare":[["Name, Anschrift und Wohnfläche für das Hausratangebot","Art. 6 Abs. 1 Buchst. b DSGVO – Vertrag bzw. vorvertragliche Maßnahme"],["Angaben zu Vorerkrankungen für den BU-Antrag","Art. 9 Abs. 2 Buchst. a DSGVO – ausdrückliche Einwilligung"],["Werbe-Newsletter per E-Mail an Frau Nguyen","Art. 6 Abs. 1 Buchst. a DSGVO – Einwilligung"],["Aufbewahrung von Buchungsbelegen nach Handels- und Steuerrecht","Art. 6 Abs. 1 Buchst. c DSGVO – rechtliche Verpflichtung"]],"erkl":"Gesundheitsdaten sind besondere Kategorien personenbezogener Daten und brauchen eine ausdrückliche Einwilligung. E-Mail-Werbung an eine Interessentin ohne Kundenbeziehung setzt zusätzlich nach UWG eine vorherige ausdrückliche Einwilligung voraus.","norm":"Art. 6 Abs. 1, Art. 9 Abs. 2 DSGVO, § 7 Abs. 2 Nr. 2 UWG","id":"3.4-2-1"},{"typ":"zuo","frage":"Ordnen Sie dem Vorgehen der Agentur den Grundsatz der Datenverarbeitung zu, den es umsetzt.","paare":[["Für das Hausratangebot fragt die Agentur nicht nach Religion oder Einkommen.","Datenminimierung"],["Die Hausratdaten werden nicht an ein Autohaus für dessen Werbung weitergegeben.","Zweckbindung"],["Kundenakten liegen in verschlossenen Schränken, Passwörter werden nicht weitergegeben.","Integrität und Vertraulichkeit"],["Daten eines Interessenten ohne Vertrag werden gelöscht, sobald sie nicht mehr gebraucht werden.","Speicherbegrenzung"],["Eine falsch erfasste Anschrift wird sofort berichtigt.","Richtigkeit"]],"erkl":"Art. 5 Abs. 1 DSGVO nennt die Grundsätze; der Verantwortliche muss ihre Einhaltung nachweisen können (Rechenschaftspflicht).","norm":"Art. 5 Abs. 1 und 2 DSGVO","id":"3.4-2-2"},{"typ":"wf","frage":"Frau Nguyen macht ihre Rechte als betroffene Person geltend. Welche Aussagen treffen zu?","aussagen":[["Sie kann Auskunft darüber verlangen, welche Daten die Agentur über sie verarbeitet.",true],["Die Agentur muss grundsätzlich innerhalb eines Monats antworten; in begründeten Fällen ist eine Verlängerung um zwei Monate möglich.",true],["Für die erste Auskunft darf die Agentur eine Bearbeitungsgebühr verlangen.",false],["Der Verwendung ihrer Daten für Direktwerbung kann sie jederzeit widersprechen.",true],["Belege, die die Agentur aus rechtlichen Gründen aufbewahren muss, sind auf ihr Verlangen trotzdem sofort zu löschen.",false]],"erkl":"Auskunft und erste Kopie sind unentgeltlich. Das Recht auf Löschung gilt nicht, soweit eine rechtliche Aufbewahrungspflicht besteht.","norm":"Art. 12 Abs. 3 und 5, Art. 15, Art. 17 Abs. 3 Buchst. b, Art. 21 Abs. 2 DSGVO","id":"3.4-2-3"},{"typ":"mc","frage":"Frau Nguyen hat in den Newsletter eingewilligt, widerruft ihre Einwilligung aber nach drei Monaten per E-Mail. Was gilt?","optionen":["Der Widerruf wirkt ab sofort für die Zukunft; die bis dahin versandten Newsletter bleiben rechtmäßig.","Der Widerruf ist nur schriftlich mit eigenhändiger Unterschrift und mit einer Begründung wirksam.","Der Widerruf wirkt zurück; alle bisher versandten Newsletter waren damit von Anfang an rechtswidrig.","Ein Widerruf ist erst nach Ablauf von zwölf Monaten seit der Einwilligung und nur zum Monatsende möglich."],"richtig":[0],"erkl":"Eine Einwilligung kann jederzeit widerrufen werden; der Widerruf muss so einfach sein wie die Erteilung und berührt die Rechtmäßigkeit der bisherigen Verarbeitung nicht.","norm":"Art. 7 Abs. 3 DSGVO","id":"3.4-2-4"},{"typ":"zahl","frage":"Aus dem Auto eines Außendienstmitarbeiters wird ein unverschlüsseltes Notebook mit Kundendaten gestohlen. Die Agentur erfährt sofort davon. Binnen wie vielen Stunden soll sie die Datenpanne möglichst der Aufsichtsbehörde melden?","wert":72,"einheit":"Stunden","tol":0,"erkl":"Eine Verletzung des Schutzes personenbezogener Daten ist unverzüglich und möglichst binnen 72 Stunden nach Bekanntwerden zu melden, es sei denn, sie führt voraussichtlich nicht zu einem Risiko für die Betroffenen.","norm":"Art. 33 Abs. 1 DSGVO","id":"3.4-2-5"}]},{"typ":"situation","titel":"Fall 3: Herr Ohlsen – Bedingungen und Sonderabsprachen","situation":"Herr Sven Ohlsen (45) schließt in der Agentur eine Hausratversicherung bei der Proximus Versicherung AG ab. Die Allgemeinen Versicherungsbedingungen (AVB) und die Verbraucherinformationen hat er vorher in Textform erhalten. Laut AVB sind Fahrräder bis 1 % der Versicherungssumme von 50.000,00 € gegen Diebstahl versichert. Auf seinen Wunsch hat der Agent im Antrag vermerkt „Fahrraddiebstahl bis 3.000,00 €“; die Proximus hat den Antrag mit dieser Vereinbarung angenommen. Ein Bekannter zeigt ihm die Bedingungen eines anderen Anbieters mit der Klausel „Kündigungen sind nur per Einschreiben wirksam“.","items":[{"typ":"wf","frage":"Welche Aussagen zu Allgemeinen Geschäftsbedingungen treffen zu?","aussagen":[["Allgemeine Versicherungsbedingungen sind AGB, weil sie für eine Vielzahl von Verträgen vorformuliert sind und vom Versicherer gestellt werden.",true],["Versicherungsbedingungen sind keine AGB, weil sie vor ihrer Verwendung von der BaFin genehmigt werden.",false],["Ob AGB vorliegen, hängt nicht von Schriftart, Umfang oder der Form des Vertrags ab.",true],["Vertragsbedingungen, die im Einzelnen ausgehandelt wurden, sind keine AGB.",true]],"erkl":"AGB sind vorformulierte Bedingungen, die eine Partei der anderen stellt. Eine Vorabgenehmigung von AVB durch die Aufsicht gibt es nicht mehr.","norm":"§ 305 Abs. 1 BGB","id":"3.4-3-1"},{"typ":"mc","frage":"Herrn Ohlsens Fahrrad (Wert 2.400,00 €) wird gestohlen. Bis zu welchem Betrag ist der Diebstahl versichert?","optionen":["Bis 3.000,00 €, weil die individuelle Vereinbarung im Antrag den AVB vorgeht.","Bis 500,00 €, weil die AVB immer Vorrang vor handschriftlichen Vermerken des Agenten haben.","Gar nicht, weil der Vermerk im Antrag die AVB insgesamt unwirksam macht.","Bis 1.500,00 €, weil sich AVB und Vermerk zur Hälfte gegenseitig ausgleichen."],"richtig":[0],"erkl":"Individuelle Vertragsabreden haben Vorrang vor AGB. 1 % von 50.000,00 € wären nur 500,00 €; vereinbart sind aber 3.000,00 €, der Schaden von 2.400,00 € ist damit voll gedeckt.","norm":"§ 305b BGB","id":"3.4-3-2"},{"typ":"zuo","frage":"Ordnen Sie der Klausel bzw. dem Vorgang die richtige Rechtsfolge zu.","paare":[["Klausel: „Kündigungen sind nur per Einschreiben wirksam.“","unwirksam: Für Erklärungen des Kunden dürfen höchstens Textform und keine besonderen Zugangswege verlangt werden"],["Unklar formulierte Klausel: Es bleibt offen, ob eine Smartwatch als „Wertsache“ gilt.","Zweifel bei der Auslegung gehen zulasten des Versicherers"],["Unter „Begriffsbestimmungen“ versteckt: Pflicht zum jährlichen Kauf eines Gutachtens bei einer bestimmten Firma","wird als überraschende Klausel nicht Vertragsbestandteil"],["AVB, auf die bei Vertragsschluss weder hingewiesen noch deren Kenntnisnahme ermöglicht wurde","werden mangels Einbeziehung nicht Vertragsbestandteil"]],"erkl":"Das AGB-Recht schützt den Vertragspartner des Verwenders bei Einbeziehung, Auslegung und Inhalt der Klauseln.","norm":"§§ 305 Abs. 2, 305c Abs. 1 und 2, 309 Nr. 13 Buchst. b und c BGB","id":"3.4-3-3"},{"typ":"mc","frage":"Die Einschreiben-Klausel des anderen Anbieters ist unwirksam. Was bedeutet das für den betroffenen Versicherungsvertrag?","optionen":["Der Vertrag bleibt wirksam; statt der Klausel gelten die gesetzlichen Vorschriften.","Der gesamte Versicherungsvertrag ist unwirksam und muss rückabgewickelt werden.","Die Klausel wird so umgedeutet, dass nur noch der Versicherer per Einschreiben kündigen muss.","Die Klausel gilt weiter, bis ein Gericht ihre Unwirksamkeit festgestellt hat."],"richtig":[0],"erkl":"Ist eine AGB-Klausel unwirksam, bleibt der Vertrag im Übrigen wirksam; an ihre Stelle tritt das Gesetz. Eine Kündigung muss dann nicht per Einschreiben erklärt werden.","norm":"§ 306 Abs. 1 und 2 BGB","id":"3.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Adeyemi – Minderjährige als Kunden","situation":"Familie Adeyemi aus Halle (Saale) hat drei Kinder: Noah (6), Lina (15) und Ben (17). Ben ist Auszubildender, seine Ausbildungsvergütung steht ihm zur freien Verfügung. Ohne Wissen seiner Eltern schließt Ben bei der Proximus Versicherung AG eine Handyversicherung mit einem Monatsbeitrag von 9,90 € ab. Als der Versicherer von seinem Alter erfährt, fordert er die Eltern zur Genehmigung auf; das Schreiben geht ihnen am Dienstag, 3. November 2026, zu. Ben wird am 1. Dezember 2026 volljährig.","items":[{"typ":"zuo","frage":"Ordnen Sie der Person die richtige Einordnung zu.","paare":[["Noah, 6 Jahre","geschäftsunfähig – seine Willenserklärung ist nichtig"],["Lina, 15 Jahre","beschränkt geschäftsfähig – ein Vertrag mit Beitragspflicht braucht die Zustimmung der Eltern"],["Ben ab dem 1. Dezember 2026","voll geschäftsfähig – er kann Verträge allein schließen"]],"erkl":"Geschäftsunfähig ist, wer das siebte Lebensjahr nicht vollendet hat; bis 17 Jahre ist man beschränkt geschäftsfähig, mit 18 volljährig. Ein Versicherungsvertrag bringt wegen der Beitragspflicht nicht lediglich einen rechtlichen Vorteil.","norm":"§§ 2, 104 Nr. 1, 105, 106, 107 BGB","id":"3.4-4-1"},{"typ":"mc","frage":"Ben hat die ersten zwei Monatsbeiträge von seiner Ausbildungsvergütung bezahlt. Ist der Vertrag dadurch nach § 110 BGB wirksam geworden?","optionen":["Nein, die künftigen Beiträge sind noch nicht bewirkt; der Vertrag bleibt schwebend unwirksam.","Ja, weil jede Zahlung aus frei verfügbaren Mitteln den gesamten Vertrag sofort voll wirksam macht.","Ja, weil Auszubildende für alle Verträge, die sie von ihrer Vergütung zahlen, voll geschäftsfähig sind.","Nein, der Vertrag ist von Anfang an nichtig und kann auch später nicht mehr genehmigt werden."],"richtig":[0],"erkl":"Der „Taschengeldparagraf“ setzt voraus, dass die vertragsmäßige Leistung vollständig bewirkt ist. Bei laufenden Beiträgen ist das nicht der Fall. § 113 BGB hilft nicht: Er erfasst nur Geschäfte, die das Dienst- oder Arbeitsverhältnis selbst betreffen (auf Ausbildungsverhältnisse ist er nach h. M. ohnehin nicht anwendbar), keine private Versicherung.","norm":"§§ 108 Abs. 1, 110, 113 Abs. 1 BGB","id":"3.4-4-2"},{"typ":"mc","frage":"Bis wann können die Eltern den Vertrag nach der Aufforderung des Versicherers genehmigen?","optionen":["Bis zum Ablauf des 17. November 2026; danach gilt die Genehmigung als verweigert.","Bis zum Ablauf des 3. Dezember 2026; danach gilt die Genehmigung als stillschweigend erteilt.","Bis zum Ablauf des 10. November 2026; danach gilt die Genehmigung als verweigert.","Unbefristet, solange Ben noch minderjährig ist und den Beitrag weiter zahlt."],"richtig":[0],"erkl":"Nach der Aufforderung kann die Genehmigung nur bis zum Ablauf von zwei Wochen nach Empfang erklärt werden; Schweigen gilt als Verweigerung. Zugang Dienstag, 3.11.2026 → Fristende Dienstag, 17.11.2026.","norm":"§ 108 Abs. 2 BGB, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.4-4-3"},{"typ":"wf","frage":"Welche Aussagen zu Bens Vertrag treffen zu?","aussagen":[["Hatten die Eltern die Genehmigung vor der Aufforderung nur gegenüber Ben erklärt, wird diese durch die Aufforderung unwirksam; sie müssen sie gegenüber dem Versicherer erklären.",true],["Ist die Schwebezeit am 1. Dezember 2026 noch nicht beendet, kann Ben den Vertrag ab diesem Tag selbst genehmigen.",true],["Der Versicherer kann bis zur Genehmigung widerrufen, auch wenn er bei Vertragsschluss wusste, dass Ben minderjährig ist und keine Einwilligung hat.",false],["Kündigt Ben mit 17 ohne Einwilligung der Eltern eine bestehende, wirksame Versicherung, ist die Kündigung unwirksam.",true]],"erkl":"Die Aufforderung lenkt die Genehmigung auf den Versicherer um. Mit Volljährigkeit tritt Bens Genehmigung an die Stelle der Eltern. Wer die Minderjährigkeit kannte, kann nicht widerrufen (Ausnahme: falsche Behauptung der Einwilligung). Eine Kündigung ist ein einseitiges Rechtsgeschäft und ohne Einwilligung unwirksam.","norm":"§§ 108 Abs. 2 und 3, 109, 111 BGB","id":"3.4-4-4"}]}]},{"nr":"3.5","titel":"Prüfungsfälle: Zustandekommen und Beginn des Vertrags","lf":"LF 2","buch":"S. 73–89","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Herr Petrović – Antrag mit Bindefrist","situation":"Herr Jonas Petrović (31) hat die Bedingungen und Verbraucherinformationen in Textform erhalten. Am Montag, 2. November 2026, unterschreibt er in der Agentur einen Antrag auf Hausratversicherung bei der Proximus Versicherung AG. Laut Antrag hält er sich einen Monat ab Unterschrift an seinen Antrag gebunden. Die Proximus will den Antrag durch Übersendung des Versicherungsscheins annehmen.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Vorgang die rechtliche Bedeutung zu.","paare":[["Antrag von Herrn Petrović","Angebot (Antrag) im Sinne des BGB"],["Zugang des Versicherungsscheins bei Herrn Petrović","Annahme – der Vertrag kommt zustande"],["Ein Monat Bindung laut Antrag","Frist, innerhalb der der Antrag angenommen werden kann"],["Übermittlung von AVB und Informationen vor der Unterschrift","Erfüllung der Informationspflicht des Versicherers"]],"erkl":"Beim Antragsmodell macht der Kunde das Angebot, der Versicherer nimmt es mit dem Versicherungsschein an. Die Informationen müssen rechtzeitig vor der Vertragserklärung des Kunden in Textform vorliegen.","norm":"§§ 145, 148 BGB, § 7 Abs. 1 VVG","id":"3.5-1-1"},{"typ":"mc","frage":"Bis wann muss der Versicherungsschein Herrn Petrović spätestens zugehen, damit der Vertrag durch diese Annahme zustande kommt?","optionen":["Bis zum Ablauf des 2. Dezember 2026.","Bis zum Ablauf des 16. November 2026.","Bis zum Ablauf des 30. November 2026.","Bis zum Ablauf des 2. Februar 2027."],"richtig":[0],"erkl":"Eine nach Monaten bestimmte Frist, die mit einem Ereignis beginnt (Unterschrift am 2.11.), endet mit Ablauf des Tages im Folgemonat mit derselben Zahl: 2.12.2026 (Mittwoch). Die Annahme muss innerhalb der Frist zugehen.","norm":"§ 148 BGB, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-1-2"},{"typ":"mc","frage":"Der Versicherungsschein geht Herrn Petrović erst am 7. Dezember 2026 zu. Was gilt?","optionen":["Die verspätete Annahme gilt als neuer Antrag des Versicherers, den Herr Petrović annehmen kann.","Der Vertrag ist trotzdem am 2. November 2026 zustande gekommen, weil er unterschrieben hat.","Der Vertrag kommt automatisch zustande, weil Herr Petrović nicht widersprochen hat.","Der Vertrag ist endgültig nichtig; ein Vertragsschluss ist nur mit neuem Antragsformular möglich."],"richtig":[0],"erkl":"Nach Ablauf der Bindefrist ist der Antrag erloschen. Die verspätete Annahme ist ein neues Angebot des Versicherers; Herr Petrović kann es ausdrücklich oder schlüssig (z. B. durch Zahlung der Erstprämie) annehmen.","norm":"§§ 146, 148, 150 Abs. 1 BGB","id":"3.5-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Zustandekommen von Versicherungsverträgen treffen zu?","aussagen":[["Beim Invitatiomodell fordert der Kunde den Versicherer nur auf, ihm ein Angebot zu machen.",true],["Beim Invitatiomodell kommt der Vertrag zustande, wenn die Annahmeerklärung des Kunden dem Versicherer zugeht.",true],["Beim Antragsmodell kommt der Vertrag bereits mit der Unterschrift des Kunden unter den Antrag zustande.",false],["Schweigt der Versicherer auf den Antrag, gilt der Vertrag nach Ablauf der Bindefrist als geschlossen.",false]],"erkl":"Ein Vertrag braucht zwei übereinstimmende, zugegangene Willenserklärungen. Schweigen ist grundsätzlich keine Annahme.","norm":"§§ 145 ff. BGB, § 7 Abs. 1 VVG","id":"3.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Frau Krasniqi – Versicherungsschein weicht vom Antrag ab","situation":"Frau Leonora Krasniqi (36) hat eine Privathaftpflichtversicherung mit 15 Mio. € Deckungssumme ohne Selbstbeteiligung beantragt. Der Versicherungsschein geht ihr am Montag, 16. November 2026, zu. Er weist eine Selbstbeteiligung von 150,00 € je Schadenfall aus. Der Versicherer hat bei der Übermittlung auf die Genehmigungswirkung hingewiesen und die Abweichung im Versicherungsschein durch einen auffälligen Hinweis hervorgehoben.","items":[{"typ":"mc","frage":"Bis wann muss Frau Krasniqi spätestens widersprechen, damit die Abweichung nicht als genehmigt gilt?","optionen":["Innerhalb eines Monats nach Zugang, also bis zum 16. Dezember 2026.","Innerhalb von 14 Tagen nach Zugang, also bis zum 30. November 2026.","Innerhalb von drei Monaten nach Zugang, also bis zum 16. Februar 2027.","Innerhalb eines Jahres nach Zugang, also bis zum 16. November 2027."],"richtig":[0],"erkl":"Die Abweichung gilt als genehmigt, wenn die Kundin nicht innerhalb eines Monats nach Zugang des Versicherungsscheins in Textform widerspricht. Zugang 16.11.2026 → Fristende 16.12.2026.","norm":"§ 5 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-2-1"},{"typ":"mc","frage":"In welcher Form muss Frau Krasniqi widersprechen?","optionen":["In Textform, z. B. per E-Mail mit ihrem Namen.","Schriftlich mit eigenhändiger Unterschrift auf Papier.","Nur per Einschreiben mit Rückschein an den Versicherer.","Formlos, ein kurzer Anruf in der Agentur genügt."],"richtig":[0],"erkl":"Das Gesetz verlangt Textform: eine lesbare Erklärung mit Namen des Erklärenden auf einem dauerhaften Datenträger, z. B. E-Mail oder Brief.","norm":"§ 5 Abs. 1 VVG, § 126b BGB","id":"3.5-2-2"},{"typ":"zuo","frage":"Ordnen Sie der Fallvariante die Rechtsfolge zu.","paare":[["Hinweise ordnungsgemäß, kein Widerspruch innerhalb der Frist","Der Vertrag gilt mit der Selbstbeteiligung (Abweichung genehmigt)."],["Hinweise ordnungsgemäß, Widerspruch rechtzeitig in Textform","Ein Vertrag mit der abweichenden Selbstbeteiligung kommt nicht zustande."],["Auffälliger Hinweis auf die Abweichung fehlt","Der Vertrag gilt als mit dem Inhalt des Antrags geschlossen (ohne Selbstbeteiligung)."]],"erkl":"Nur wenn der Versicherer beide Hinweispflichten erfüllt, kann Schweigen zur Genehmigung führen; sonst gilt der Inhalt des Antrags.","norm":"§ 5 Abs. 1 bis 3 VVG","id":"3.5-2-3"},{"typ":"wf","frage":"Welche Aussagen zum abweichenden Versicherungsschein treffen zu?","aussagen":[["Der Versicherer muss auf jede einzelne Abweichung und ihre Rechtsfolgen durch einen auffälligen Hinweis im Versicherungsschein aufmerksam machen.",true],["Eine Vereinbarung, mit der Frau Krasniqi auf die Anfechtung wegen Irrtums verzichtet, ist unwirksam.",true],["Ein allgemeiner Satz in den AVB „Abweichungen gelten als genehmigt“ genügt als Hinweis.",false],["Die Monatsfrist beginnt bereits mit dem Datum, an dem der Versicherer den Schein ausgestellt hat.",false]],"erkl":"Die Frist läuft ab Zugang des Versicherungsscheins. Die Hinweise müssen bei Übermittlung erfolgen und die konkrete Abweichung hervorheben.","norm":"§ 5 Abs. 1, 2 und 4 VVG","id":"3.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Engel – Rückwärtsversicherung und Rückdatierung","situation":"Herr Tobias Engel hat sein neu gebautes Einfamilienhaus in Halle (Saale) am 1. Oktober 2026 übernommen. Erst am 20. Oktober 2026 beantragt er eine Wohngebäudeversicherung mit Versicherungsschutz und Beitragsberechnung ab dem 1. Oktober 2026. Der Versicherungsschein geht ihm am 30. Oktober 2026 zu; die Erstprämie zahlt er am 12. November 2026. Am 5. November entdeckt er einen Leitungswasserschaden, der am 14. Oktober entstanden ist. Seine Frau Miriam (geboren am 12. Oktober 1981) beantragt am 20. Oktober 2026 eine Risikolebensversicherung, die auf den 1. Oktober 2026 rückdatiert wird; laut Tarif richtet sich der Beitrag nach dem bei technischem Beginn vollendeten Lebensjahr.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Zeitpunkt aus dem Wohngebäudevertrag den passenden Begriff zu.","paare":[["30. Oktober 2026 – Zugang des Versicherungsscheins","formeller Beginn (Vertragsschluss)"],["1. Oktober 2026 – ab hier besteht Versicherungsschutz","materieller Beginn"],["1. Oktober 2026 – ab hier wird der Beitrag berechnet","technischer Beginn"],["12. November 2026 – Zahlung der Erstprämie","Einlösung des Versicherungsscheins"]],"erkl":"Bei einer Rückwärtsversicherung liegen materieller und technischer Beginn vor dem formellen Beginn.","norm":"§ 2 Abs. 1 VVG, § 37 VVG","id":"3.5-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Wohngebäudevertrag von Herrn Engel treffen zu?","aussagen":[["Der Leitungswasserschaden vom 14. Oktober ist versichert, weil Herr Engel ihn bei seinem Antrag am 20. Oktober nicht kannte.",true],["Hätte Herr Engel am 20. Oktober bereits von dem Schaden gewusst, müsste der Versicherer dafür nicht leisten.",true],["Weil die Erstprämie erst am 12. November gezahlt wurde, ist der Versicherer für den Schaden vom 14. Oktober leistungsfrei.",false],["Eine Rückwärtsversicherung ist nach dem VVG unzulässig, weil der Schutz nicht vor Vertragsschluss beginnen darf.",false]],"erkl":"Die Rückwärtsversicherung ist ausdrücklich erlaubt. Leistungsfrei ist der Versicherer nur, wenn der Kunde bei Abgabe seiner Vertragserklärung den eingetretenen Versicherungsfall kannte. Die Leistungsfreiheit wegen nicht gezahlter Erstprämie gilt hier nicht.","norm":"§ 2 Abs. 1, 2 und 4 VVG","id":"3.5-3-2"},{"typ":"mc","frage":"Angenommen, Frau Engel hat den Wohngebäudeantrag als bevollmächtigte Vertreterin ihres Mannes unterschrieben und wusste vom Schaden, er nicht. Was gilt?","optionen":["Der Versicherer muss nicht leisten, weil auch die Kenntnis der Vertreterin zählt.","Der Versicherer muss leisten, weil es nur auf das Wissen des Versicherungsnehmers ankommt.","Der Versicherer muss die Hälfte leisten, weil nur einer der Ehegatten Kenntnis hatte.","Der Vertrag ist nichtig, weil eine Vertreterin keine Rückwärtsversicherung beantragen darf."],"richtig":[0],"erkl":"Wird der Vertrag von einem Vertreter geschlossen, sind sowohl die Kenntnis des Vertreters als auch die des Vertretenen zu berücksichtigen.","norm":"§ 2 Abs. 2 Satz 2 und Abs. 3 VVG","id":"3.5-3-3"},{"typ":"mc","frage":"Was bewirkt die Rückdatierung der Risikolebensversicherung von Frau Engel auf den 1. Oktober 2026?","optionen":["Der technische Beginn liegt vor ihrem 45. Geburtstag: Beitrag nach Alter 44, Beiträge ab Oktober.","Der formelle Beginn wird vorverlegt: Der Vertrag gilt als am 1. Oktober 2026 geschlossen.","Der Beitrag wird nach Alter 45 berechnet, muss aber erst ab Dezember 2026 gezahlt werden.","Die Widerrufsfrist beginnt rückwirkend am 1. Oktober 2026 und ist deshalb schon fast vollständig abgelaufen."],"richtig":[0],"erkl":"Am 1.10.2026 ist Frau Engel noch 44 Jahre alt (45 erst am 12.10.). Die Rückdatierung legt den technischen Beginn vor: niedrigeres Eintrittsalter und damit geringerer Beitrag, dafür Beitragszahlung ab dem rückdatierten Beginn. Vertragsschluss und Widerrufsfrist bleiben unberührt.","norm":"Begriffe formeller und technischer Versicherungsbeginn; § 152 Abs. 1 VVG (Widerrufsfrist)","id":"3.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Frau Kaya – vorläufige Deckung","situation":"Frau Aylin Kaya (34) beantragt am Dienstag, 6. Oktober 2026, in der Agentur eine Unfallversicherung bei der Proximus Versicherung AG. Der Agent, der dafür Vollmacht hat, sagt ihr im Namen der Proximus sofort vorläufigen Versicherungsschutz ab dem 7. Oktober 2026 zu; die vorläufige Deckung ist auf unbestimmte Zeit geschlossen. Vereinbart ist: Kommt der Hauptvertrag nicht zustande, zahlt Frau Kaya für die vorläufige Deckung den anteiligen Beitrag. Der Jahresbeitrag des Hauptvertrags würde 365,00 € betragen. Nach Prüfung lehnt die Proximus den Antrag ab und kündigt die vorläufige Deckung; das Kündigungsschreiben geht Frau Kaya am Dienstag, 3. November 2026, zu.","items":[{"typ":"mc","frage":"Bis wann besteht die vorläufige Deckung nach der Kündigung des Versicherers noch?","optionen":["Bis zum Ablauf des 17. November 2026.","Nur bis zum Ablauf des 3. November 2026.","Bis zum Ablauf des 3. Dezember 2026.","Bis zum Ablauf des 6. Oktober 2027."],"richtig":[0],"erkl":"Bei einer vorläufigen Deckung auf unbestimmte Zeit kann jede Partei ohne Frist kündigen; die Kündigung des Versicherers wird aber erst nach Ablauf von zwei Wochen nach Zugang wirksam: Zugang 3.11. → Ende mit Ablauf des 17.11.2026.","norm":"§ 52 Abs. 4 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-4-1"},{"typ":"zahl","frage":"Die vorläufige Deckung bestand vom 7. Oktober bis einschließlich 17. November 2026. Wie viel Euro muss Frau Kaya dafür zahlen, wenn tagesgenau abgerechnet wird (365,00 € Jahresbeitrag = 1,00 € je Tag)?","wert":42.0,"einheit":"€","tol":0.01,"erkl":"Der Versicherer erhält den der Laufzeit entsprechenden Teil des Beitrags: 7.–31. Oktober = 25 Tage, 1.–17. November = 17 Tage, zusammen 42 Tage × 1,00 € = 42,00 €.","norm":"§ 50 VVG","id":"3.5-4-2"},{"typ":"wf","frage":"Welche Aussagen zur vorläufigen Deckung von Frau Kaya treffen zu?","aussagen":[["Die vorläufige Deckung ist ein eigener Versicherungsvertrag neben dem beantragten Hauptvertrag.",true],["Frau Kaya kann die in der Agentur vereinbarte vorläufige Deckung innerhalb von 14 Tagen widerrufen.",false],["Es kann vereinbart werden, dass ihr Bedingungen und Informationen erst auf Anforderung, spätestens mit dem Versicherungsschein, übermittelt werden.",true],["Wäre der Hauptvertrag zustande gekommen, hätte die vorläufige Deckung spätestens mit Beginn des Schutzes aus dem Hauptvertrag geendet.",true]],"erkl":"Bei vorläufiger Deckung besteht kein Widerrufsrecht, es sei denn, es handelt sich um einen Fernabsatzvertrag; hier wurde in der Agentur abgeschlossen.","norm":"§§ 8 Abs. 3 Nr. 2, 49 Abs. 1, 52 Abs. 1 VVG","id":"3.5-4-3"},{"typ":"mc","frage":"Angenommen, die Proximus hätte den Hauptvertrag angenommen und Frau Kaya ihn fristgerecht widerrufen; der Widerruf geht am 20. Oktober 2026 zu. Was gilt für die vorläufige Deckung?","optionen":["Sie endet spätestens mit dem Zugang des Widerrufs am 20. Oktober 2026.","Sie läuft unabhängig vom Widerruf weiter, bis ein volles Versicherungsjahr vorbei ist.","Sie gilt rückwirkend ab dem 7. Oktober 2026 als nie geschlossen.","Sie endet erst zwei Wochen nach Zugang des Widerrufs beim Versicherer."],"richtig":[0],"erkl":"Kommt der Hauptvertrag wegen eines Widerrufs nicht zustande, endet die vorläufige Deckung spätestens mit dem Zugang des Widerrufs beim Versicherer.","norm":"§ 52 Abs. 3 VVG","id":"3.5-4-4"}]},{"typ":"situation","titel":"Fall 5: Frau Haidari – Erstprämie und Einlösung","situation":"Frau Mariam Haidari (27) schließt eine Hausratversicherung bei der Proximus Versicherung AG ab, Versicherungsbeginn 1. Dezember 2026. Der Versicherungsschein geht ihr am Mittwoch, 18. November 2026, zu; er enthält einen auffälligen Hinweis auf die Folgen einer nicht rechtzeitig gezahlten Erstprämie. Zur Fälligkeit ist nichts Abweichendes vereinbart; Frau Haidari zahlt per Überweisung. Ohne besonderen Grund hat sie bis zum 21. Dezember 2026 nicht gezahlt; an diesem Tag wird in ihre Wohnung eingebrochen. Am selben Tag wie die Hausratversicherung hat sie auch eine private Rentenversicherung abgeschlossen.","items":[{"typ":"mc","frage":"Wann ist die Erstprämie der Hausratversicherung nach dem VVG zu zahlen?","optionen":["Unverzüglich nach Ablauf des 2. Dezember 2026 (14 Tage nach Zugang).","Sofort mit Zugang des Versicherungsscheins am 18. November 2026.","Am 1. Dezember 2026, dem vereinbarten Versicherungsbeginn.","Unverzüglich nach Ablauf des 18. Dezember 2026 (ein Monat nach Zugang)."],"richtig":[0],"erkl":"Die erste Prämie ist unverzüglich nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins zu zahlen: 19.11. bis 2.12. sind 14 Tage, fällig also ab 3.12.2026.","norm":"§ 33 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-5-1"},{"typ":"mc","frage":"Muss die Proximus den Einbruchschaden vom 21. Dezember 2026 ersetzen?","optionen":["Nein, die fällige Erstprämie ist schuldhaft nicht gezahlt und der Hinweis war erteilt.","Ja, weil der vereinbarte Versicherungsbeginn (1. Dezember) vor dem Schadentag lag.","Ja, aber nur zur Hälfte, weil die Prämie erst seit wenigen Tagen fällig und offen ist.","Nein, weil vor Zahlung der Erstprämie noch gar kein Versicherungsvertrag zustande kommt."],"richtig":[0],"erkl":"Ist die Erstprämie bei Eintritt des Versicherungsfalls nicht gezahlt, ist der Versicherer leistungsfrei, wenn der Kunde die Nichtzahlung zu vertreten hat und auf diese Folge auffällig oder gesondert in Textform hingewiesen wurde. Der Vertrag besteht trotzdem.","norm":"§ 37 Abs. 2 VVG","id":"3.5-5-2"},{"typ":"zahl","frage":"Wie viele Tage nach Zugang des Versicherungsscheins ist die erste Prämie der Rentenversicherung von Frau Haidari zu zahlen (ohne abweichende Vereinbarung)?","wert":30,"einheit":"Tage","tol":0,"erkl":"Bei der Lebensversicherung (dazu gehört die Rentenversicherung) ist die erste Prämie abweichend von § 33 VVG unverzüglich nach Ablauf von 30 Tagen nach Zugang des Versicherungsscheins zu zahlen – passend zur 30-tägigen Widerrufsfrist.","norm":"§ 152 Abs. 5 VVG","id":"3.5-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Erstprämie treffen zu?","aussagen":[["Solange die Erstprämie nicht gezahlt ist, kann der Versicherer hier vom Vertrag zurücktreten und eine angemessene Geschäftsgebühr verlangen.",true],["Wäre SEPA-Lastschrift vereinbart und hätte der Versicherer versehentlich nicht abgebucht, müsste er den Einbruch ersetzen.",true],["Ohne auffälligen Hinweis im Versicherungsschein oder gesonderte Mitteilung in Textform wäre der Versicherer nicht leistungsfrei.",true],["Zahlt Frau Haidari am 22. Dezember 2026, muss der Versicherer den Einbruch vom 21. Dezember nachträglich ersetzen.",false]],"erkl":"Die Zahlung wirkt nicht zurück; maßgeblich ist, ob die Prämie bei Eintritt des Versicherungsfalls gezahlt war. Hat der Kunde die Nichtzahlung nicht zu vertreten (z. B. Versäumnis des Versicherers beim Lastschrifteinzug), bleibt der Versicherer leistungspflichtig.","norm":"§§ 37 Abs. 1 und 2, 39 Abs. 1 Satz 3 VVG","id":"3.5-5-4"}]},{"typ":"situation","titel":"Fall 6: Herr Nowak – Widerruf von zwei Verträgen","situation":"Herr Dariusz Nowak (40) hat zwei neue Verträge. (1) Risikolebensversicherung bei einem Lebensversicherer: Versicherungsschein, Bedingungen, Informationen und Widerrufsbelehrung gehen ihm am Montag, 9. November 2026, in Textform zu. (2) Hausratversicherung bei der Proximus Versicherung AG, in der Agentur abgeschlossen, Versicherungsbeginn 1. Dezember 2026: Alle Unterlagen einschließlich Belehrung gehen ihm am Montag, 30. November 2026, zu. Vor seinem Antrag wurde er ordnungsgemäß darauf hingewiesen, dass bei Widerruf nur der Beitrag für die Zeit nach Zugang des Widerrufs erstattet wird. Den Hausrat-Jahresbeitrag von 146,00 € hat er am 1. Dezember gezahlt.","items":[{"typ":"zahl","frage":"An welchem Tag im Dezember 2026 endet die Widerrufsfrist für die Risikolebensversicherung?","wert":9,"einheit":". Dezember","tol":0,"erkl":"Bei der Lebensversicherung beträgt die Widerrufsfrist 30 Tage ab Zugang aller Unterlagen: 10.11. bis 9.12. sind 30 Tage; der 9.12.2026 ist ein Mittwoch. Zur Fristwahrung genügt die rechtzeitige Absendung.","norm":"§ 152 Abs. 1 VVG, § 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-6-1"},{"typ":"zahl","frage":"Herr Nowak widerruft die Hausratversicherung per E-Mail; der Widerruf geht am 10. Dezember 2026 zu. Wie viel Euro muss die Proximus erstatten? Rechnen Sie tagesgenau (146,00 € für 365 Tage); der Tag des Zugangs zählt noch zur Zeit mit Versicherungsschutz.","wert":142.0,"einheit":"€","tol":0.01,"erkl":"Der Schutz begann vor Ende der Widerrufsfrist und Herr Nowak war ordnungsgemäß hingewiesen; erstattet wird nur der Beitrag für die Zeit nach Zugang des Widerrufs. Gedeckt waren 1.–10.12. = 10 Tage; 146,00 € : 365 = 0,40 € je Tag; 355 Tage × 0,40 € = 142,00 €.","norm":"§ 9 Abs. 2 Satz 1 Nr. 1 VVG","id":"3.5-6-2"},{"typ":"mc","frage":"Angenommen, die Widerrufsbelehrung für die Hausratversicherung wäre Herrn Nowak erst am Montag, 7. Dezember 2026, in Textform zugegangen. Wann endet dann die Widerrufsfrist?","optionen":["Mit Ablauf des 21. Dezember 2026.","Mit Ablauf des 14. Dezember 2026.","Mit Ablauf des 30. Dezember 2026.","Mit Ablauf des 6. Januar 2027."],"richtig":[0],"erkl":"Die Frist beginnt erst, wenn Versicherungsschein, Bedingungen, Informationen und Belehrung in Textform zugegangen sind: Zugang der Belehrung 7.12. → 14 Tage → Ende am 21.12.2026 (Montag). Den Zugang muss der Versicherer nachweisen.","norm":"§ 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-6-3"},{"typ":"wf","frage":"Welche Aussagen zum Widerrufsrecht treffen zu?","aussagen":[["Der Widerruf muss nicht begründet werden.",true],["Für eine Reisekrankenversicherung mit drei Wochen Laufzeit besteht kein Widerrufsrecht.",true],["Nach einem wirksamen Widerruf muss der Versicherer die zu erstattenden Beträge spätestens innerhalb von 30 Tagen zurückzahlen.",true],["Der Widerruf ist nur wirksam, wenn er innerhalb der Frist beim Versicherer eingeht; die Absendung genügt nicht.",false],["Ein Widerruf per E-Mail ist unwirksam, weil der Widerruf schriftlich mit Unterschrift erklärt werden muss.",false]],"erkl":"Der Widerruf ist in Textform (z. B. E-Mail) ohne Begründung zu erklären; die rechtzeitige Absendung wahrt die Frist. Kein Widerrufsrecht besteht u. a. bei Verträgen mit weniger als einem Monat Laufzeit.","norm":"§§ 8 Abs. 1 und 3 Nr. 1, 9 Abs. 1 VVG","id":"3.5-6-4"}]}]},{"nr":"3.6","titel":"Prüfungsfälle: Prämie, Anzeigepflicht, Gefahrerhöhung, Kündigung","lf":"LF 2","buch":"S. 90–122","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Okonkwo – Folgeprämie im Verzug","situation":"Frau Nadine Okonkwo (44) hat bei der Proximus Versicherung AG eine Hausratversicherung. Der Jahresbeitrag von 186,00 € für 2027 ist am 1. Februar 2027 fällig; sie zahlt ohne besonderen Grund nicht. Die Proximus schickt ihr eine Mahnung in Textform, die am Mittwoch, 10. Februar 2027, zugeht. Darin wird eine Zahlungsfrist von zwei Wochen ab Zugang gesetzt und die Kündigung für den Fall erklärt, dass sie bei Fristablauf noch in Verzug ist. Am 27. Februar 2027 wird bei ihr eingebrochen. Am 15. März 2027 zahlt sie alle offenen Beträge.","items":[{"typ":"zahl","frage":"An welchem Tag im Februar 2027 endet die Zahlungsfrist?","wert":24,"einheit":". Februar","tol":0,"erkl":"Zwei Wochen ab Zugang am Mittwoch, 10.2.: Die Frist endet mit Ablauf des Tages der zweiten Woche, der durch seine Benennung dem Zugangstag entspricht – Mittwoch, 24.2.2027.","norm":"§ 38 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-1-1"},{"typ":"wf","frage":"Welche Anforderungen muss die Mahnung erfüllen, damit sie die Rechtsfolgen des § 38 VVG auslösen kann?","aussagen":[["Sie muss die rückständige Prämie, Zinsen und Kosten im Einzelnen beziffern.",true],["Sie muss die Rechtsfolgen angeben, die mit dem Fristablauf verbunden sind.",true],["Die Zahlungsfrist muss mindestens zwei Wochen betragen.",true],["Sie muss per Einschreiben mit eigenhändiger Unterschrift verschickt werden.",false],["Die Mahnkosten muss der Versicherer selbst tragen.",false]],"erkl":"Die Zahlungsfrist wird in Textform und auf Kosten des Versicherungsnehmers b
