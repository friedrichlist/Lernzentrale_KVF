yp":"mc","frage":"Ein Kunde wird von einem Radfahrer verletzt, der keine Haftpflichtversicherung hat und nicht zahlen kann. Welcher Baustein hilft dem Kunden?","optionen":["Die Unfallversicherung des Radfahrers, die für Schäden Dritter aufkommt","Die Hausratversicherung des Kunden, die auch Personenschäden ersetzt","Die Kfz-Haftpflichtversicherung des Kunden als Ausfalldeckung","Die Forderungsausfalldeckung seiner eigenen Privathaftpflichtversicherung"],"richtig":[3],"erkl":"Die Forderungsausfalldeckung zahlt, wenn der Anspruch durch rechtskräftiges Urteil oder vollstreckbaren Vergleich festgestellt ist und der Schädiger zahlungsunfähig ist, z. B. weil die Zwangsvollstreckung nicht zur vollen Befriedigung geführt hat.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 11.1, 11.2","id":"5.2-1-4"},{"typ":"mc","frage":"Ein Kunde will Schadenersatz von einem Schädiger einklagen. Welche Rechtsschutzleistungsart ist einschlägig?","optionen":["Steuer-Rechtsschutz vor Gerichten","Beratungs-Rechtsschutz im Familienrecht","Schadenersatz-Rechtsschutz","Verwaltungs-Rechtsschutz in Verkehrssachen"],"richtig":[2],"erkl":"Der Schadenersatz-Rechtsschutz deckt die Durchsetzung gesetzlicher, nicht vertraglicher Schadenersatzansprüche. Für ihn gilt nach den ARB 2021 der Proximus keine Wartezeit.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.1, 3.1.1","id":"5.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Schulte lässt beim Besuch bei Freunden deren Laptop fallen. Außerdem hat sie Streit mit ihrem Arbeitgeber über eine Abmahnung, die sie vor drei Wochen erhalten hat, und möchte einen Anwalt einschalten. Ihre Rechtsschutzversicherung hat sie vor zwei Monaten abgeschlossen.","items":[{"typ":"mc","frage":"Wer reguliert den Schaden am Laptop?","optionen":["Ihre eigene Hausratversicherung, weil der Schaden in einer fremden Wohnung entstand.","Ihre Privathaftpflicht bei Fahrlässigkeit, auch wenn ihr der Laptop geliehen war.","Die Hausratversicherung der Freunde, weil der Laptop zu deren Hausrat gehört.","Niemand, weil Schäden bei Besuchen unter Freunden nie versichert sind."],"richtig":[1],"erkl":"Die Privathaftpflicht leistet bei fahrlässiger Beschädigung fremder Sachen. Nach Proximus 5 sind auch geliehene oder gefälligkeitshalber überlassene bewegliche Sachen versichert, höchstens 15.000 € je Versicherungsfall und mit 100 € Selbstbeteiligung.","norm":"§ 823 Abs. 1 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.5.3","id":"5.2-2-1"},{"typ":"mc","frage":"Zahlt die Rechtsschutzversicherung den Anwalt wegen der Abmahnung?","optionen":["Nein, weil die Abmahnung in die dreimonatige Wartezeit fällt.","Ja, weil die Wartezeit im Arbeits-Rechtsschutz nur einen Monat beträgt.","Nein, weil Arbeits-Rechtsschutz nur für Selbstständige versicherbar ist.","Ja, weil für den Arbeits-Rechtsschutz keine Wartezeit gilt."],"richtig":[0],"erkl":"Im Arbeits-Rechtsschutz besteht Versicherungsschutz erst nach Ablauf von 3 Monaten nach Versicherungsbeginn. Versicherungsfall ist der Rechtsverstoß, hier die Abmahnung vor drei Wochen.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.2, 2.4.3, 3.1.1","id":"5.2-2-2"},{"typ":"mc","frage":"Wer darf den Anwalt auswählen, wenn die Rechtsschutzversicherung leistet?","optionen":["Der Arbeitgeber bestimmt den Anwalt im Arbeitsrechtsstreit.","Der Anwalt mit dem günstigsten Honorar laut Versicherer.","Der Versicherer bestimmt den Anwalt aus seinem Netzwerk.","Die versicherte Person kann den Anwalt frei wählen."],"richtig":[3],"erkl":"Das Recht auf freie Anwaltswahl ist gesetzlich garantiert. Der Versicherer wählt nur aus, wenn die versicherte Person das verlangt oder keinen Anwalt benennt.","norm":"§ 127 VVG, Proximus 5, ARB 2021 Ziff. 4.1.3","id":"5.2-2-3"}]}]},{"nr":"5.3","titel":"Rechtliche Regelungen in Beruf und Freizeit","lf":"LF 5","buch":"S. 239–269","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Grad des Verschuldens die Haftung des Arbeitnehmers gegenüber dem Arbeitgeber zu (innerbetrieblicher Schadensausgleich).","paare":[["leichteste Fahrlässigkeit","keine Haftung"],["mittlere Fahrlässigkeit","anteilige Haftung"],["grobe Fahrlässigkeit und Vorsatz","in der Regel volle Haftung"]],"erkl":"Die Rechtsprechung schützt Arbeitnehmer bei betrieblich veranlassten Tätigkeiten.","norm":"BAG, innerbetrieblicher Schadensausgleich","id":"5.3-1-1"},{"typ":"mc","frage":"Ein Kollege verletzt einen anderen Kollegen fahrlässig bei der Arbeit. Wer leistet für den Personenschaden?","optionen":["Der Kollege über seine Privathaftpflicht, weil er fahrlässig handelte.","Die Krankenkasse des Arbeitgebers; der Kollege haftet überhaupt nicht.","Die gesetzliche Unfallversicherung; der Kollege haftet nur bei Vorsatz.","Der Arbeitgeber über seine Betriebshaftpflicht in voller Höhe."],"richtig":[2],"erkl":"Arbeitskollegen sind für Personenschäden bei betrieblicher Tätigkeit privilegiert.","norm":"§§ 104, 105 SGB VII","id":"5.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Tierhalterhaftung treffen zu?","aussagen":[["Der Halter eines privat gehaltenen Hundes haftet auch ohne eigenes Verschulden.",true],["Bei Nutztieren, die dem Beruf dienen, kann sich der Halter entlasten, wenn er die Sorgfalt beachtet hat.",true],["Tierhalter haften nur, wenn sie das Tier absichtlich losgelassen haben.",false]],"erkl":"§ 833 BGB unterscheidet Luxustiere (Gefährdungshaftung) und Nutztiere (vermutetes Verschulden).","norm":"§ 833 BGB","id":"5.3-1-3"},{"typ":"zahl","frage":"Wie viele Jahre beträgt die regelmäßige Verjährungsfrist für Schadenersatzansprüche?","wert":3,"einheit":"Jahre","tol":0,"erkl":"Sie beginnt mit dem Schluss des Jahres, in dem der Anspruch entstanden ist und der Gläubiger davon Kenntnis erlangt hat oder ohne grobe Fahrlässigkeit hätte erlangen müssen.","norm":"§§ 195, 199 BGB","id":"5.3-1-4"},{"typ":"mc","frage":"Ein Geschädigter hat den Schaden selbst mitverursacht (z. B. unachtsam gelaufen). Welche Folge hat das?","optionen":["Der Schädiger haftet trotzdem in voller Höhe für den Schaden.","Sein Anspruch wird entsprechend seinem Mitverschulden gekürzt.","Sein Anspruch wird stets pauschal um die Hälfte gekürzt.","Sein Anspruch entfällt vollständig, auch bei geringem Mitverschulden."],"richtig":[1],"erkl":"Das Mitverschulden des Geschädigten mindert den Ersatzanspruch.","norm":"§ 254 BGB","id":"5.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Der Hund von Familie Peters reißt sich im Park los und bringt eine Joggerin zu Fall. Sie bricht sich das Handgelenk und verlangt Behandlungskosten, Verdienstausfall und Schmerzensgeld. Familie Peters hat eine Hundehalterhaftpflicht.","items":[{"typ":"mc","frage":"Muss Familie Peters haften, obwohl sie den Hund gut erzogen hat?","optionen":["Ja, als Halterin eines Luxustieres haftet sie ohne Verschulden.","Nein, Tierhalter haften nur, wenn der Hund tatsächlich zugebissen hat.","Nein, weil ohne eigenes Verschulden der Halter keine Haftung besteht.","Nein, weil die Joggerin das Risiko im Park selbst trägt."],"richtig":[0],"erkl":"Gefährdungshaftung des Tierhalters. Den Schaden reguliert die Hundehalter-Haftpflicht.","norm":"§ 833 S. 1 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 2 Ziff. 1.1","id":"5.3-2-1"},{"typ":"wf","frage":"Welche Forderungen der Joggerin sind grundsätzlich ersatzfähig?","aussagen":[["Behandlungskosten",true],["Verdienstausfall",true],["Schmerzensgeld",true],["ein neues Auto",false]],"erkl":"Ersatzfähig sind Vermögensschäden infolge der Verletzung und ein angemessenes Schmerzensgeld.","norm":"§§ 249, 252, 253 Abs. 2 BGB","id":"5.3-2-2"},{"typ":"mc","frage":"Was muss Familie Peters gegenüber ihrem Versicherer tun?","optionen":["Erst nach einer Einigung mit der Joggerin den Versicherer über den Fall informieren.","Nichts, weil die Joggerin ihren Schaden selbst beim Versicherer anmeldet.","Den Schaden binnen eines Monats melden und die Forderung vorab selbst begleichen.","Den Schaden binnen einer Woche melden und Zahlungen mit dem Versicherer abstimmen."],"richtig":[3],"erkl":"Die Anzeigepflicht innerhalb einer Woche bleibt bestehen. Ein eigenes Anerkenntnis bindet den Versicherer nur, soweit der Anspruch tatsächlich besteht; ein Anerkenntnisverbot wäre unwirksam (§ 105 VVG).","norm":"§ 104 Abs. 1 VVG, § 105 VVG, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 4.1, Teil B Abschnitt 3 Ziff. 3.1","id":"5.3-2-3"}]}]},{"nr":"5.4","titel":"Prüfungsfälle: Haftung und Privathaftpflicht","lf":"LF 5","buch":"S. 234–262","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Radfahrer Hartwig – Verschuldenshaftung","situation":"Leon Hartwig (34) fährt am 12.09.2026 in Halle (Saale) mit seinem Fahrrad (ohne Motor) und liest dabei eine Nachricht auf dem Smartphone. Er übersieht die Fußgängerin Marta Lewandowska (61), die bei Grün über den Überweg geht, und stößt mit ihr zusammen. Sie bricht sich das Handgelenk, ihre Brille geht zu Bruch. Frau Lewandowska ist selbstständige Physiotherapeutin und kann sechs Wochen nicht arbeiten. Herr Hartwig hat eine Privathaftpflichtversicherung bei der Proximus Versicherung AG ohne Selbstbeteiligung.","items":[{"typ":"wf","frage":"Welche Aussagen zur Haftung von Herrn Hartwig nach § 823 Abs. 1 BGB treffen zu?","aussagen":[["Er hat Körper, Gesundheit und Eigentum von Frau Lewandowska widerrechtlich verletzt.",true],["Er handelte fahrlässig, weil er die im Verkehr erforderliche Sorgfalt außer Acht ließ.",true],["Er haftet nicht, weil er den Unfall nicht absichtlich herbeigeführt hat.",false],["Er haftet nicht, weil zwischen ihm und Frau Lewandowska kein Vertrag besteht.",false]],"erkl":"§ 823 Abs. 1 BGB verlangt Vorsatz oder Fahrlässigkeit; Fahrlässigkeit genügt. Die Haftung aus unerlaubter Handlung setzt keinen Vertrag voraus. Wer beim Radfahren aufs Smartphone schaut, verletzt die verkehrserforderliche Sorgfalt.","norm":"§ 823 Abs. 1 BGB; § 276 Abs. 2 BGB","id":"5.4-1-1"},{"typ":"zahl","frage":"Die Brille kostete neu 480,00 € und war drei Jahre alt. Für die Abnutzung zieht der Versicherer 15 % des Neupreises je Jahr ab („neu für alt“). Wie viel Euro erstattet er für die Brille?","wert":264.0,"einheit":"€","tol":0.01,"erkl":"Abzug: 3 × 15 % = 45 % von 480,00 € = 216,00 €. Zeitwert: 480,00 € − 216,00 € = 264,00 €. Der Geschädigte soll durch den Ersatz nicht bessergestellt werden als vor dem Schaden. Die Neuwertentschädigung der Proximus-Privathaftpflicht hilft hier nicht: Sie gilt nur für Sachen bis 12 Monate ab Kauf, und Brillen sind ausdrücklich ausgenommen.","norm":"§ 249 Abs. 2 BGB (Vorteilsausgleich „neu für alt“); Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 12","id":"5.4-1-2"},{"typ":"zuo","frage":"Frau Lewandowska macht mehrere Positionen geltend. Ordnen Sie jede Position der passenden Rechtsgrundlage zu.","paare":[["Kosten der ärztlichen Behandlung des Handgelenks","Heilungskosten wegen Verletzung der Person, § 249 Abs. 2 BGB"],["Einnahmen, die ihr als Selbstständige in sechs Wochen entgehen","entgangener Gewinn, § 252 BGB"],["Ausgleich für Schmerzen und Beeinträchtigungen","billige Entschädigung in Geld, § 253 Abs. 2 BGB"],["zerbrochene Brille","Sachschaden, Ersatz des Zeitwerts (Abzug „neu für alt“)"]],"erkl":"Ersetzt werden die Kosten der Heilung, der entgangene Gewinn, bei Körperverletzung ein Schmerzensgeld und der Wert der zerstörten Sache. Die Privathaftpflicht stellt Herrn Hartwig als Radfahrer von diesen berechtigten Ansprüchen frei.","norm":"§§ 249, 252, 253 Abs. 2 BGB; § 100 VVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 4.1 und 6.7.3","id":"5.4-1-3"},{"typ":"mc","frage":"Herr Hartwig meint, Schmerzensgeld müsse er nicht zahlen, weil Schmerzen kein Vermögensschaden seien. Wie ist die Rechtslage?","optionen":["Bei einer Körperverletzung kann sie auch für den Nichtvermögensschaden Geld fordern.","Er hat recht; für Nichtvermögensschäden gibt es nie eine Entschädigung in Geld.","Schmerzensgeld gibt es nur, wenn er die Verletzung vorsätzlich verursacht hätte.","Schmerzensgeld zahlt ausschließlich ihre Krankenkasse, nicht der Schädiger selbst."],"richtig":[0],"erkl":"Grundsätzlich gibt es für Nichtvermögensschäden nur in gesetzlich bestimmten Fällen Geld. Bei Verletzung von Körper oder Gesundheit ist eine billige Entschädigung (Schmerzensgeld) vorgesehen – auch bei Fahrlässigkeit.","norm":"§ 253 Abs. 1 und 2 BGB","id":"5.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Albrecht – Kinder als Schädiger","situation":"Familie Albrecht wohnt in Halle (Saale), Stadtteil Neustadt. Die Kinder sind Mila (6), Ben (8) und Tom (13). Ihre Privathaftpflicht bei der Proximus Versicherung AG ist eine Familien-Versicherung mit 150 € Selbstbehalt. Nach den AVB PHV 2021 beruft sich der Versicherer auf Wunsch des Versicherungsnehmers nicht auf die Deliktsunfähigkeit mitversicherter Kinder; er leistet dann bis 100.000 € je Versicherungsfall. Das gilt nicht, wenn der Geschädigte selbst aufsichtspflichtig war, von einem Aufsichtspflichtigen Schadenersatz erlangt werden kann oder ein anderer Versicherungsvertrag (z. B. eine Sachversicherung) leistet.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die Rechtslage des Kindes nach § 828 BGB zu.","paare":[["Mila (6) zerkratzt beim Spielen mit einem Stein ein Auto.","nicht verantwortlich, weil sie das 7. Lebensjahr nicht vollendet hat"],["Ben (8) fährt mit dem Rad unachtsam vor ein fahrendes Auto; das Auto wird beschädigt.","nicht verantwortlich, weil er bei einem Unfall mit einem Kfz unter 10 Jahren ist und nicht vorsätzlich handelte"],["Tom (13) schießt beim Bolzen unachtsam den Ball in die Scheibe eines Nachbarn.","verantwortlich, wenn er die zur Erkenntnis der Verantwortlichkeit erforderliche Einsicht hat"]],"erkl":"Unter 7 Jahren sind Kinder nie verantwortlich; von 7 bis unter 10 Jahren nicht bei Unfällen mit Kfz, Schienen- oder Schwebebahn (außer bei Vorsatz); im Übrigen kommt es bis 18 auf die Einsichtsfähigkeit an.","norm":"§ 828 Abs. 1–3 BGB","id":"5.4-2-1"},{"typ":"zahl","frage":"Mila (6) zerkratzt beim Spielen mit einem Stein das Auto des Nachbarn; die Reparatur kostet 1.380,00 €. Die Eltern hatten Mila ausreichend beaufsichtigt; das Auto ist nicht kaskoversichert, und die Eltern wünschen die Regulierung. Wie viel Euro zahlt die Proximus Versicherung AG?","wert":1230.0,"einheit":"€","tol":0.01,"erkl":"Gesetzlich haftet niemand: Mila ist nicht verantwortlich, die Eltern haben ihre Aufsichtspflicht erfüllt. Der Versicherer beruft sich auf Wunsch nicht auf die Deliktsunfähigkeit (bis 100.000 €); kein Ausschlussgrund liegt vor: 1.380,00 € − 150,00 € Selbstbehalt = 1.230,00 €.","norm":"§ 828 Abs. 1 BGB; § 832 Abs. 1 Satz 2 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.1.6.1 und 5.4; Tarif Privat-Haftpflicht","id":"5.4-2-2"},{"typ":"mc","frage":"Ben (8) fährt mit dem Fahrrad unachtsam gegen ein ordnungsgemäß geparktes Auto. Was gilt nach der Rechtsprechung des BGH in der Regel?","optionen":["Das Haftungsprivileg für Kfz-Unfälle greift nicht; Ben haftet, wenn er einsichtsfähig ist.","Ben haftet nie, weil Kinder unter zehn Jahren bei allen Schäden an Autos geschützt sind.","Ben haftet nie, weil Kinder unter vierzehn Jahren grundsätzlich deliktsunfähig sind.","Für Ben haften stets die Eltern, auch wenn sie ihre Aufsichtspflicht erfüllt haben."],"richtig":[0],"erkl":"Das Privileg des § 828 Abs. 2 BGB soll Kinder vor der Überforderung durch den fließenden Verkehr schützen. Beim Anfahren eines ordnungsgemäß geparkten Autos verwirklicht sich diese Gefahr in der Regel nicht; dann gilt § 828 Abs. 3 BGB.","norm":"§ 828 Abs. 2 und 3 BGB; BGH, Urteile vom 30.11.2004 – VI ZR 365/03 und VI ZR 335/03","id":"5.4-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Haftung wegen Verletzung der Aufsichtspflicht treffen zu?","aussagen":[["Eltern haften für einen Schaden ihres Kindes, wenn sie ihre Aufsichtspflicht verletzt haben.",true],["Eltern haften nicht, wenn sie nachweisen, dass sie ausreichend beaufsichtigt haben oder der Schaden auch so entstanden wäre.",true],["Das Schild „Eltern haften für ihre Kinder“ bedeutet, dass Eltern stets ohne eigenes Verschulden haften.",false],["Eine bezahlte Babysitterin, die die Aufsicht vertraglich übernimmt, haftet nach denselben Grundsätzen.",true]],"erkl":"§ 832 BGB vermutet die Aufsichtspflichtverletzung, erlaubt aber den Entlastungsbeweis. Wer die Aufsicht durch Vertrag übernimmt, haftet ebenso.","norm":"§ 832 Abs. 1 und 2 BGB","id":"5.4-2-4"}]},{"typ":"situation","titel":"Fall 3: Labrador Bruno und die Hütehunde – Tierhalterhaftung","situation":"Familie Yılmaz aus Halle (Saale) hält privat den Labrador „Bruno“, eine Hauskatze und ein Freizeitpferd. Die Nachbarin Greta Hoffmann betreibt hauptberuflich eine Schäferei und setzt zwei Hütehunde beim Hüten ihrer Schafe ein. Am 14.09.2026 springt Bruno an der Leine plötzlich einen Radfahrer an. Der Radfahrer stürzt; sein Schaden beträgt 3.600,00 €. Er war in der Dämmerung ohne Licht unterwegs. Familie Yılmaz hat für Bruno eine Hundehalter-Haftpflichtversicherung bei der Proximus Versicherung AG ohne Selbstbeteiligung.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Tier die passende Haftpflichtabsicherung zu.","paare":[["Labrador Bruno (privat gehalten)","Hundehalter-Haftpflichtversicherung"],["Hauskatze der Familie Yılmaz","Privathaftpflichtversicherung (zahme Haustiere mitversichert)"],["Freizeitpferd der Familie Yılmaz","Pferdehalter-Haftpflichtversicherung"],["Hütehunde der Schäferei Hoffmann","Betriebshaftpflicht des landwirtschaftlichen Betriebs"]],"erkl":"Die Privathaftpflicht deckt zahme Haustiere, schließt Hunde und Pferde aber aus. Hunde- und Pferdehalter-Haftpflicht der Proximus versichern nur private Zwecke; Tiere eines gewerblichen oder landwirtschaftlichen Betriebs gehören in dessen Betriebshaftpflicht.","norm":"§ 833 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.9; Abschnitt 2 Ziff. 1.1; Abschnitt 3 Ziff. 1.1","id":"5.4-3-1"},{"typ":"mc","frage":"Ein Hütehund von Frau Hoffmann beißt beim Treiben der Herde einen Spaziergänger. Frau Hoffmann weist nach, dass sie den Hund sorgfältig beaufsichtigt hat. Haftet sie nach § 833 BGB?","optionen":["Nein, denn der Hund dient ihrem Erwerb und sie hat die nötige Sorgfalt beachtet.","Ja, denn Tierhalter haften für jedes Tier stets ohne Rücksicht auf Verschulden.","Ja, denn Hunde können nach dem Gesetz niemals als Nutztiere eingestuft werden.","Nein, denn Tierhalter haften für Schäden ihrer Tiere grundsätzlich nur bei Vorsatz."],"richtig":[0],"erkl":"Für Haustiere, die dem Beruf oder Erwerb des Halters dienen (Nutztiere), haftet der Halter nur für vermutetes Verschulden und kann sich durch den Nachweis der erforderlichen Sorgfalt entlasten. Für Luxustiere wie Bruno gilt dagegen Gefährdungshaftung.","norm":"§ 833 Satz 2 BGB","id":"5.4-3-2"},{"typ":"zahl","frage":"Für den Sturz des Radfahrers haftet Familie Yılmaz als Halterin von Bruno. Wegen der fehlenden Beleuchtung wird dem Radfahrer ein Mitverschulden von einem Drittel angerechnet. Wie viel Euro muss die Hundehalter-Haftpflicht von 3.600,00 € ersetzen?","wert":2400.0,"einheit":"€","tol":0.01,"erkl":"Der Anspruch wird um den Mitverschuldensanteil gekürzt: 3.600,00 € × 2/3 = 2.400,00 €. Die Hundehalter-Haftpflicht stellt nur von berechtigten Ansprüchen frei und wehrt den unberechtigten Teil ab.","norm":"§ 833 Satz 1 BGB; § 254 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 2 Ziff. 1.1; Abschnitt 1 Ziff. 4.1","id":"5.4-3-3"},{"typ":"wf","frage":"Nachbar Paul Krämer führt Bruno während des Urlaubs der Familie Yılmaz unentgeltlich aus. Welche Aussagen treffen zu?","aussagen":[["Familie Yılmaz bleibt als Halterin für Schäden durch Bruno nach § 833 BGB verantwortlich.",true],["Wer die Aufsicht über ein Tier durch Vertrag übernimmt, haftet nach § 834 BGB, kann sich aber durch Nachweis der Sorgfalt entlasten.",true],["Nach Proximus 5 ist Herr Krämer als nicht gewerbsmäßiger Hüter über die Hundehalter-Haftpflicht der Familie Yılmaz mitversichert.",true],["Beißt Bruno Herrn Krämer, sind dessen Ansprüche gegen Familie Yılmaz in ihrer Hundehalter-Haftpflicht ausgeschlossen.",false]],"erkl":"Die Halterhaftung endet nicht, wenn ein anderer das Tier führt; wer die Aufsicht vertraglich übernimmt, haftet daneben mit Entlastungsmöglichkeit. Die Hundehalter-Haftpflicht der Proximus schließt den nicht gewerbsmäßigen Hüter und dessen Ansprüche gegen den Halter ausdrücklich ein. Die Privathaftpflicht von Herrn Krämer deckt das Hüten fremder Hunde nur, soweit keine Tierhalter-Haftpflicht Schutz bietet.","norm":"§§ 833, 834 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 2 Ziff. 1.2; Abschnitt 1 Ziff. 6.9","id":"5.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Patchworkfamilie Weber – wer ist mitversichert?","situation":"Sandra Weber (45) hat eine Familien-Privathaftpflicht mit 150 € Selbstbehalt bei der Proximus Versicherung AG. Mit ihr leben in Halle (Saale): ihr nicht verheirateter Lebensgefährte Malik Haddad (47), der unter ihrer Anschrift gemeldet ist, ihr Sohn Felix (23, Masterstudium direkt im Anschluss an den Bachelor), ihre Tochter Lea (20, Ausbildung abgeschlossen, seit 01.08.2026 berufstätig) und Maliks Sohn Yusuf (16, Schüler). Nach den AVB PHV 2021 sind u. a. mitversichert: der Partner einer nichtehelichen Lebensgemeinschaft und dessen Kinder, wenn dies besonders vereinbart ist (für Malik ist es vereinbart), sowie unverheiratete Kinder, volljährige aber nur während einer Schul- oder unmittelbar anschließenden Berufsausbildung einschließlich eines unmittelbar angeschlossenen Masterstudiums. Ansprüche der Versicherten untereinander sind ausgeschlossen. Gefälligkeitsschäden ersetzt der Versicherer bis 100.000 € je Versicherungsfall.","items":[{"typ":"wf","frage":"Welche Personen sind laut Bedingungen über den Vertrag von Frau Weber mitversichert?","aussagen":[["Malik Haddad, der im Versicherungsschein genannte Lebensgefährte",true],["Felix, der sich im Masterstudium befindet",true],["Lea, die ihre Ausbildung abgeschlossen hat und berufstätig ist",false],["Yusuf, der Sohn des mitversicherten Lebensgefährten, der zur Schule geht",true]],"erkl":"Der Schutz volljähriger Kinder endet mit dem Ende der Ausbildung; ein unmittelbar angeschlossener Master zählt noch zur Erstausbildung. Lea braucht eine eigene Privathaftpflicht. Der besonders vereinbarte, unverheiratete und unter der Anschrift gemeldete Partner und sein minderjähriges Kind sind eingeschlossen.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 2.1.2 und 2.1.4","id":"5.4-4-1"},{"typ":"mc","frage":"Malik stößt in der gemeinsamen Wohnung versehentlich Sandras Laptop vom Tisch. Leistet die Privathaftpflicht?","optionen":["Nein, Ansprüche zwischen Versicherten desselben Vertrags sind ausgeschlossen.","Ja, weil Malik im Versicherungsschein namentlich als Mitversicherter genannt ist.","Ja, aber nur zum halben Zeitwert, weil beide im selben Haushalt leben.","Nein, weil Laptops in der Privathaftpflicht grundsätzlich nie versichert sind."],"richtig":[0],"erkl":"Schäden innerhalb des versicherten Personenkreises sind ausgeschlossen, damit sich die Familie Schäden nicht gegenseitig „in Rechnung stellt“. Ausgeschlossen sind u. a. Ansprüche des Versicherungsnehmers gegen mitversicherte Personen. Den Laptop könnte allenfalls eine Elektronik- oder Hausratversicherung abdecken, wenn die Gefahr versichert ist.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 7.3.1","id":"5.4-4-2"},{"typ":"zahl","frage":"Felix hilft einem Freund unentgeltlich beim Umzug und lässt dessen Fernseher fallen (Zeitwert 640,00 €). Der Versicherer erkennt den Schaden als Gefälligkeitsschaden an. Wie viel Euro zahlt er?","wert":490.0,"einheit":"€","tol":0.01,"erkl":"Felix ist als Student mitversichert. Zeitwert 640,00 € − Selbstbehalt 150,00 € = 490,00 € (innerhalb der Grenze von 100.000 €). Eine Neuwertentschädigung scheidet aus, weil elektronische Geräte davon ausgenommen sind.","norm":"§ 249 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.1.7, 5.4 und 12","id":"5.4-4-3"},{"typ":"mc","frage":"Warum enthält der Tarif eine besondere Regelung für Gefälligkeitsschäden?","optionen":["Sie leistet auch, falls ein stillschweigender Haftungsverzicht unter Freunden die Haftung entfallen ließe.","Weil Schäden bei Gefälligkeiten sonst grundsätzlich über die Hausratversicherung des Helfers reguliert würden.","Weil Helfer bei Gefälligkeiten rechtlich immer als vorsätzlich handelnd gelten und sonst ohne Schutz wären.","Weil Schäden bei Freunden nach dem BGB höchstens bis 100.000 € ersetzt werden müssen und darüber nicht."],"richtig":[0],"erkl":"Ohne gesetzliche Haftung zahlt die Privathaftpflicht nicht. Bei Gefälligkeiten wird oft ein stillschweigender Haftungsverzicht für leichte Fahrlässigkeit eingewandt; der BGH nimmt ihn nur ausnahmsweise an, in der Regel nicht, wenn der Helfer haftpflichtversichert ist. Die Klausel schafft Klarheit: Der Versicherer beruft sich dem Geschädigten gegenüber nicht auf diesen Einwand und zahlt bis 100.000 €, soweit kein anderer Versicherer oder Sozialversicherungsträger leistet.","norm":"§ 276 BGB; BGH, Urteil vom 26.04.2016 – VI ZR 467/15; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.1.7","id":"5.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Mieter Krüger – Mietsachschäden und Schlüsselverlust","situation":"Anton Krüger (22) mietet seit 2023 eine Zweizimmerwohnung in Halle (Saale); das Haus hat eine Zentralschließanlage. Seine Privathaftpflicht bei der Proximus Versicherung AG (Single-Versicherung mit 150 € Selbstbehalt) deckt nach den AVB PHV 2021 u. a. Mietsachschäden an Wohnräumen (ausgeschlossen: Abnutzung, Verschleiß und übermäßige Beanspruchung; Schäden an Heizungs- und Warmwasseranlagen sowie an Elektro- und Gasgeräten; Glasschäden, soweit gesondert versicherbar; Schimmel) sowie den Verlust fremder Schlüssel mit den Kosten für die notwendige Auswechslung von Schlössern bis 100.000 € je Versicherungsfall.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden die zutreffende Beurteilung zu.","paare":[["Die Badewanne läuft über; das Parkett der Mietwohnung quillt auf.","Mietsachschaden an Wohnräumen – mitversichert"],["Das Wasser dringt in die Wohnung darunter und beschädigt das Sofa der Nachbarin.","Sachschaden eines Dritten – Grunddeckung der Privathaftpflicht"],["Ein Topf fällt auf das Ceranfeld des mitvermieteten Herds; die Glaskeramik springt.","ausgeschlossen – Glas- bzw. Elektrogeräteschaden"],["Der Teppichboden ist nach drei Jahren normalen Wohnens abgetreten.","keine Haftung – Abnutzung durch vertragsgemäßen Gebrauch"]],"erkl":"Mietsachschäden an Wohnräumen sind ein Einschluss mit Ausschlüssen; Schäden an Sachen Dritter sind Grunddeckung. Für normale Abnutzung haftet der Mieter gar nicht.","norm":"§ 538 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.5.1 und 6.5.1.2","id":"5.4-5-1"},{"typ":"mc","frage":"Anton verliert seinen Wohnungsschlüssel. Der Vermieter verlangt 2.400,00 € für den Austausch der Schließanlage, will sie aber vorerst nicht austauschen. Was gilt nach der Rechtsprechung des BGH?","optionen":["Ein ersatzfähiger Schaden entsteht erst, wenn die Anlage tatsächlich ausgetauscht wird.","Der Vermieter kann die 2.400,00 € sofort als Pauschale verlangen, auch ohne Austausch.","Anton muss nur den Preis eines Nachschlüssels zahlen, selbst nach einem Austausch.","Mieter haften für verlorene Schlüssel nie, weil Schlüssel nur Zubehör der Wohnung sind."],"richtig":[0],"erkl":"Der Verlust verletzt eine Nebenpflicht aus dem Mietvertrag. Die Kosten einer neuen Schließanlage sind aber erst ein Schaden, wenn sie tatsächlich ausgetauscht wird.","norm":"§ 280 Abs. 1 BGB; BGH, Urteil vom 05.03.2014 – VIII ZR 205/13","id":"5.4-5-2"},{"typ":"zahl","frage":"Der Vermieter tauscht die Schließanlage aus Sicherheitsgründen tatsächlich aus und verlangt von Anton 2.400,00 €. Wie viel Euro zahlt die Privathaftpflicht?","wert":2250.0,"einheit":"€","tol":0.01,"erkl":"Der Verlust eines im Rahmen des Mietverhältnisses überlassenen Schlüssels ist mitversichert, einschließlich der notwendigen Auswechslung der Schlösser, bis 100.000 € je Versicherungsfall: 2.400,00 € − 150,00 € Selbstbehalt = 2.250,00 €. Folgeschäden wie ein Einbruch wären ausgeschlossen.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.6.1, 6.6.2, 6.6.4 und 5.4","id":"5.4-5-3"},{"typ":"wf","frage":"Welche Aussagen zu Antons Mietverhältnis und seiner Privathaftpflicht treffen zu?","aussagen":[["Für Veränderungen durch vertragsgemäßen Gebrauch muss Anton keinen Ersatz leisten.",true],["Beschädigt Anton eine gemietete Bohrmaschine, ist das nach Proximus 5 bis 15.000 € je Versicherungsfall mitversichert.",true],["Die vertraglich vereinbarten Schönheitsreparaturen beim Auszug bezahlt die Privathaftpflicht.",false],["Ersatzansprüche des Vermieters wegen Verschlechterung der Wohnung verjähren sechs Monate nach Rückgabe.",true]],"erkl":"Die Haftpflichtversicherung ersetzt Schadenersatz, keine Vertragserfüllung wie Schönheitsreparaturen. Gemietete bewegliche Sachen sind bei der Proximus gesondert bis 15.000 € je Versicherungsfall eingeschlossen (Selbstbeteiligung 100 €), soweit kein anderer Versicherungsschutz besteht. Vermieteransprüche wegen Verschlechterung verjähren kurz.","norm":"§ 538 BGB; § 548 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 3.2 und 6.5.3","id":"5.4-5-4"}]},{"typ":"situation","titel":"Fall 6: Jens Kowalczyk – Drohne, Pedelec, Ehrenamt","situation":"Jens Kowalczyk (52) aus Halle (Saale) fährt ein Pedelec mit Tretunterstützung bis 25 km/h; er überlegt, auf ein S-Pedelec (bis 45 km/h) umzusteigen. Er fliegt eine Kameradrohne mit 900 g Startmasse. Ehrenamtlich leitet er die Kinderturngruppe seines Sportvereins und ist seit Kurzem gewählter Kassenwart im Vereinsvorstand; Geld erhält er dafür nicht. Seine Privathaftpflicht bei der Proximus Versicherung AG richtet sich nach den AVB PHV 2021: Radfahren, auch mit Pedelecs bis 25 km/h, ist versichert; Multikopter (Drohnen) sind nur bis 250 g Fluggewicht eingeschlossen; ehrenamtliche Tätigkeit in Vereinen ist versichert, wenn sie unentgeltlich erfolgt, nicht aber ein leitendes Ehrenamt wie die Mitgliedschaft im Vereinsvorstand.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Risiko die passende Absicherung zu.","paare":[["Unfall mit dem Pedelec bis 25 km/h","Privathaftpflichtversicherung, weil es als Fahrrad gilt"],["Unfall mit einem S-Pedelec bis 45 km/h","Kfz-Haftpflichtversicherung mit Versicherungskennzeichen"],["Absturz der 900-g-Drohne auf ein parkendes Auto","eigene Drohnen-Haftpflicht, weil die Privathaftpflicht nur bis 250 g gilt"],["Fehler als Kassenwart im Vereinsvorstand","Vereinshaftpflicht bzw. D&O-Versicherung des Vereins"]],"erkl":"Pedelecs bis 25 km/h gelten als Fahrräder; S-Pedelecs sind Kraftfahrzeuge und fallen unter den Kfz-Ausschluss der Privathaftpflicht. Drohnen über 250 g sind weder eingeschlossen noch über die Vorsorgeversicherung erfasst. Leitende Vereinsämter sind über den Verein abzusichern.","norm":"§ 1 Abs. 3 StVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.7.3, 6.11.1, 6.2.2, 7.14 und 7.16","id":"5.4-6-1"},{"typ":"mc","frage":"Jens fragt, ob seine Privathaftpflicht bei der Proximus auch für seine 900-g-Kameradrohne reicht. Was raten Sie ihm?","optionen":["Eine eigene Drohnen-Haftpflicht abschließen, weil seine Privathaftpflicht nur bis 250 g gilt.","Nichts unternehmen, weil Drohnen über die Hausratversicherung haftpflichtversichert sind.","Nichts unternehmen, weil die Vorsorgeversicherung neue Drohnen jeder Größe sofort mitversichert.","Die Drohne über das Versicherungskennzeichen eines S-Pedelecs mitversichern lassen."],"richtig":[0],"erkl":"Halter von Luftfahrzeugen – auch von Drohnen – müssen eine Haftpflichtversicherung haben. Die Privathaftpflicht der Proximus schließt Multikopter nur bis 250 g Fluggewicht ein; für Drohnen über 250 g gilt auch die Vorsorgeversicherung nicht. Jens braucht einen eigenen Vertrag.","norm":"§ 43 Abs. 2 LuftVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.11.1 und 9.3.2","id":"5.4-6-2"},{"typ":"wf","frage":"Welche Aussagen zu den Ehrenämtern von Jens treffen zu?","aussagen":[["Als unentgeltlich tätiger Übungsleiter ist er über seine Privathaftpflicht versichert, soweit kein anderer Vertrag (z. B. des Vereins) leistet.",true],["Als Kassenwart im Vorstand übt er ein leitendes Ehrenamt aus, das seine Privathaftpflicht nach Proximus 5 nicht deckt.",true],["Als unentgeltlich tätiges Vorstandsmitglied haftet er dem Verein nur bei Vorsatz oder grober Fahrlässigkeit.",true],["Ehrenamtliche haften gegenüber Dritten grundsätzlich nicht, weil sie unentgeltlich handeln.",false]],"erkl":"Ehrenamtliche können Dritten gegenüber haften; das BGB privilegiert aber unentgeltlich tätige Organmitglieder gegenüber dem Verein und gibt ihnen bei leichter Fahrlässigkeit einen Freistellungsanspruch gegen den Verein. Die Proximus-Privathaftpflicht deckt ehrenamtliche Tätigkeit nachrangig, leitende Ehrenämter wie den Vereinsvorstand aber nicht.","norm":"§ 31a Abs. 1 und 2 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.2.2 und 7.16","id":"5.4-6-3"},{"typ":"zahl","frage":"Bis zu welcher jährlichen Vergütung (in Euro) gilt für Vorstandsmitglieder eines Vereins die Haftungsbeschränkung auf Vorsatz und grobe Fahrlässigkeit gegenüber dem Verein?","wert":3300,"einheit":"€","tol":0,"erkl":"Die Privilegierung gilt für unentgeltlich Tätige und für eine Vergütung von höchstens 3.300 € im Jahr.","norm":"§ 31a Abs. 1 Satz 1 BGB","id":"5.4-6-4"}]},{"typ":"situation","titel":"Fall 7: Ayşe Demir – Haftung und Deckung nach der Geburtstagsfeier","situation":"Ayşe Demir (29) aus Halle (Saale) leiht sich für ihre Geburtstagsfeier am Samstag, 03.10.2026, von ihrem Kollegen Marco Ferri unentgeltlich einen Beamer (Zeitwert 700,00 €). Beim Aufbauen stößt sie ihn aus Unachtsamkeit vom Tisch; er ist zerstört. Auf der Feier kippt sie außerdem Rotwein über die Wildlederjacke ihres Gastes Jonas Berg (Zeitwert 260,00 €). Herr Berg verlangt am Montag, 05.10.2026, schriftlich Ersatz. Frau Demir hat bei der Proximus Versicherung AG eine Privathaftpflicht als Single-Versicherung ohne Selbstbehalt; sonst besteht für den Beamer kein Versicherungsschutz.","items":[{"typ":"mc","frage":"Wie sind Haftung und Deckung beim zerstörten Beamer zu beurteilen?","optionen":["Sie haftet; die Privathaftpflicht zahlt bis 15.000 € abzüglich 100 € Selbstbeteiligung.","Sie haftet nicht, weil bei einer Leihe nur Vorsatz und grobe Fahrlässigkeit zu vertreten sind.","Sie haftet, die Privathaftpflicht leistet aber nicht, weil geliehene Sachen ausgeschlossen sind.","Sie haftet nicht, weil bei einer unentgeltlichen Leihe niemand Schadenersatz schuldet."],"richtig":[0],"erkl":"Erst die Haftungsfrage, dann die Deckungsfrage: Die Entleiherin muss die Sache zurückgeben und haftet für Fahrlässigkeit. Die Haftungsmilderung des § 599 BGB gilt nur für den Verleiher. Die Proximus-Privathaftpflicht schließt geliehene bewegliche Sachen ein, soweit kein anderer Versicherungsschutz besteht: höchstens 15.000 € je Versicherungsfall, Selbstbeteiligung 100 €. Hier: 700,00 € − 100,00 € = 600,00 €.","norm":"§§ 280 Abs. 1, 599, 604 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.5.3","id":"5.4-7-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Prüffrage zu.","paare":[["Haftung dem Grunde nach","Besteht nach dem Gesetz überhaupt eine Pflicht zum Schadenersatz?"],["Haftung der Höhe nach","Welchen Betrag muss der Schädiger ersetzen?"],["Deckung","Muss der Versicherer nach dem Vertrag für diese Haftung eintreten?"],["Passiver Rechtsschutz","Wehrt der Versicherer eine unbegründete Forderung auf eigene Kosten ab?"]],"erkl":"Die Haftpflichtversicherung prüft die Haftpflichtfrage, stellt von berechtigten Ansprüchen frei und wehrt unberechtigte ab.","norm":"§ 100 VVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 4.1","id":"5.4-7-2"},{"typ":"zahl","frage":"Herr Berg macht seinen Anspruch wegen der Jacke am Montag, 05.10.2026, schriftlich geltend. Bis zu welchem Tag im Oktober 2026 muss Frau Demir diese Geltendmachung ihrem Versicherer spätestens anzeigen (Absendung genügt)? Geben Sie den Tag an.","wert":12,"einheit":"Oktober","tol":0,"erkl":"Die Anzeige ist innerhalb einer Woche nach der Geltendmachung fällig. Der Tag der Geltendmachung zählt nicht mit; die Frist endet mit dem gleichnamigen Wochentag der Folgewoche: Montag, 12.10.2026. Die rechtzeitige Absendung genügt. Den Versicherungsfall selbst muss sie nach Proximus 5 ebenfalls innerhalb einer Woche anzeigen, auch wenn noch keine Ansprüche erhoben sind.","norm":"Proximus 5, AVB PHV 2021 Teil B Abschnitt 3 Ziff. 3.1; § 104 Abs. 1 Satz 2 und Abs. 3 VVG; §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"5.4-7-3"},{"typ":"wf","frage":"Der Versicherer zahlt Herrn Berg am 19.10.2026 den Schadenersatz für die Jacke. Welche Aussagen zur Kündigung nach dem Versicherungsfall treffen nach Proximus 5 zu?","aussagen":[["Sowohl Frau Demir als auch der Versicherer können den Vertrag kündigen.",true],["Die Kündigung ist nur bis zum Ablauf eines Monats seit der Schadenersatzzahlung zulässig.",true],["Kündigt der Versicherer, wird die Kündigung einen Monat nach ihrem Zugang wirksam.",true],["Frau Demir kann nur mit einer Frist von drei Monaten zum Ende des Versicherungsjahres kündigen.",false]],"erkl":"Nach einer Schadenersatzzahlung (oder der Zustellung einer Klage über einen gedeckten Anspruch) haben beide Seiten ein Sonderkündigungsrecht für einen Monat. Die Kundin kann sofort oder spätestens zum Ende der laufenden Versicherungsperiode kündigen; die Kündigung des Versicherers wird einen Monat nach Zugang wirksam.","norm":"Proximus 5, AVB PHV 2021 Teil B Abschnitt 2 Ziff. 3.1 und 3.2; § 111 VVG","id":"5.4-7-4"}]}]},{"nr":"5.5","titel":"Prüfungsfälle: Rechtsschutz und Freizeitrisiken","lf":"LF 5","buch":"S. 263–269","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Nowak – Bausteine und Leistungsarten","situation":"Familie Nowak aus Halle (Saale) – Kerstin (44, Angestellte), Piotr (46, Beamter) und Sohn Jakub (15) – hat seit 01.03.2025 bei der Proximus Versicherung AG eine Rechtsschutzversicherung nach den ARB 2021 (Familien-Variante) mit Privat-, Berufs- und Verkehrs-Rechtsschutz, aber ohne Wohnungs- und Grundstücks-Rechtsschutz. Die Familie wohnt zur Miete. Der Privat-Rechtsschutz enthält u. a. den Beratungs-Rechtsschutz im Familien-, Lebenspartnerschafts- und Erbrecht; ausgeschlossen sind u. a. Streitigkeiten um Planung und Errichtung eines eigenen Gebäudes, um Erwerb und Veräußerung von Wertpapieren sowie aus Familien- und Erbrecht, soweit es nicht um Beratung geht.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Streit die zuständige Leistungsart zu.","paare":[["Kerstin wehrt sich gegen die Kündigung ihres Arbeitsvertrags.","Arbeits-Rechtsschutz"],["Jakub wird von einem Hund gebissen und verlangt Schmerzensgeld vom Halter.","Schadenersatz-Rechtsschutz"],["Piotr streitet mit einem Onlinehändler über eine defekte Waschmaschine.","Rechtsschutz im Vertrags- und Sachenrecht"],["Kerstin klagt gegen die Ablehnung einer Erwerbsminderungsrente.","Sozial-Rechtsschutz"],["Piotr erhält einen Bußgeldbescheid wegen zu schnellen Fahrens.","Ordnungswidrigkeiten-Rechtsschutz"]],"erkl":"Die Bausteine (Privat, Beruf, Verkehr, Wohnen) legen fest, in welchen Lebensbereichen Schutz besteht; die Leistungsarten beschreiben die Rechtsgebiete. Arbeits-Rechtsschutz gehört zum Berufs-, Sozial-Rechtsschutz zum Privat-Rechtsschutz.","norm":"Proximus 5, ARB 2021 Ziff. 2.1.5, 2.2.1, 2.2.2, 2.2.4, 2.2.6 und 2.2.10","id":"5.5-1-1"},{"typ":"mc","frage":"Der Vermieter verlangt mit der Nebenkostenabrechnung 860,00 € nach; Familie Nowak hält die Abrechnung für falsch. Übernimmt die Rechtsschutzversicherung die Anwaltskosten?","optionen":["Nein, dafür ist Wohnungs- und Grundstücks-Rechtsschutz nötig, den die Familie nicht hat.","Ja, Streitigkeiten aus dem Mietvertrag sind immer über den Privat-Rechtsschutz versichert.","Ja, weil Streitigkeiten unter 1.000,00 € ohne besonderen Baustein mitversichert sind.","Nein, weil Streitigkeiten aus Mietverhältnissen in Deutschland nicht versicherbar sind."],"richtig":[0],"erkl":"Streit aus Miet- und Pachtverhältnissen über Wohnungen und Grundstücke deckt nur der Wohnungs- und Grundstücks-Rechtsschutz, der für die gemietete Wohnung vereinbart sein muss. Der Vertrags-Rechtsschutz nimmt Streit aus dem Mietverhältnis ausdrücklich aus.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.3 und 2.2.4","id":"5.5-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Versicherungsschutz der Familie Nowak treffen zu?","aussagen":[["Ein Streit mit der Baufirma über Mängel beim Bau eines Eigenheims ist ausgeschlossen.",true],["Für das Scheidungsverfahren von Kerstin und Piotr übernimmt der Versicherer die vollen Anwalts- und Gerichtskosten.",false],["Ein Streit mit der Bank über Verluste aus dem Kauf von Aktienfonds ist ausgeschlossen.",true],["Wird Piotr eine fahrlässige Körperverletzung bei einem Verkehrsunfall vorgeworfen, ist seine Verteidigung grundsätzlich versichert.",true]],"erkl":"Baurisiko, Wertpapiergeschäfte und Familienrecht (außer Beratung) sind ausgeschlossen. Für verkehrsrechtliche Vergehen besteht Straf-Rechtsschutz im Verkehrs-Rechtsschutz; nur wenn ein Gericht rechtskräftig Vorsatz feststellt, muss Piotr die Kosten erstatten.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.9.2, 3.2.2, 3.2.8 und 3.2.10","id":"5.5-1-3"},{"typ":"mc","frage":"Kerstins Vater stirbt; sie wurde im Testament übergangen und möchte sich zu ihrem Pflichtteil beraten lassen. Was übernimmt der Versicherer?","optionen":["Die Kosten für Rat oder Auskunft eines Anwalts bis 250 €, nicht aber eine Klage.","Alle Kosten eines Prozesses gegen die Erben bis zur vereinbarten Versicherungssumme.","Nichts, weil erbrechtliche Fragen vom Versicherungsschutz vollständig ausgeschlossen sind.","Nur die Notarkosten für den Erbschein, weil der Notar dort für die Erben tätig wird."],"richtig":[0],"erkl":"Der Beratungs-Rechtsschutz im Familien-, Lebenspartnerschafts- und Erbrecht deckt einen Rat oder eine Auskunft eines in Deutschland zugelassenen Anwalts; beschränkt sich die Tätigkeit darauf, trägt der Versicherer höchstens 250 € je Versicherungsfall. Ein Prozess gegen die Erben ist als Streit aus dem Erbrecht ausgeschlossen. Versicherungsfall ist der Tod des Vaters, der die Rechtslage ändert.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.11, 2.3.1.2, 2.4.1 und 3.2.10","id":"5.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Uwe Bergmann – Wartezeit und Selbstbeteiligung","situation":"Uwe Bergmann (39) aus Halle (Saale) hat eine Rechtsschutzversicherung mit Privat- und Berufs-Rechtsschutz bei der Proximus Versicherung AG nach den ARB 2021; Versicherungsbeginn ist der 01.06.2026, eine Vorversicherung bestand nicht. Nach den ARB 2021 gilt u. a. für Arbeits-Rechtsschutz und Rechtsschutz im Vertrags- und Sachenrecht eine Wartezeit von drei Monaten, nicht aber für Schadenersatz-, Straf- und Ordnungswidrigkeiten-Rechtsschutz. Versicherungsfall ist beim Schadenersatz-Rechtsschutz das erste Schadenereignis, sonst der (behauptete) Verstoß gegen Rechtspflichten. Laut Tarif ist eine Selbstbeteiligung von 250,00 € je Versicherungsfall vereinbart.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die zutreffende Beurteilung zu.","paare":[["10.07.2026: Ein Autofahrer verletzt Herrn Bergmann als Fußgänger; er verlangt Schmerzensgeld.","versichert – Schadenersatz-Rechtsschutz ohne Wartezeit"],["20.07.2026: Ein Handwerker stellt eine überhöhte Rechnung, Herr Bergmann will sie anfechten.","nicht versichert – Verstoß liegt in der Wartezeit"],["14.09.2026: Der Arbeitgeber zahlt die vereinbarte Überstundenvergütung nicht.","versichert – Verstoß nach Ablauf der Wartezeit"]],"erkl":"Die Wartezeit läuft vom 01.06. bis 31.08.2026. Entscheidend ist der Zeitpunkt des Versicherungsfalls, nicht der Zeitpunkt, zu dem der Kunde den Anwalt einschaltet. Für Schadenersatz-Rechtsschutz gibt es keine Wartezeit.","norm":"Proximus 5, ARB 2021 Ziff. 2.4.2, 2.4.3 und 3.1.1","id":"5.5-2-1"},{"typ":"zahl","frage":"Im Streit um die Überstundenvergütung entstehen Anwaltskosten von 1.480,00 € und Gerichtskosten von 438,00 €. Wie viel Euro erstattet der Versicherer?","wert":1668.0,"einheit":"€","tol":0.01,"erkl":"Der Versicherer trägt die gesetzliche Anwaltsvergütung und die Gerichtskosten: 1.480,00 € + 438,00 € = 1.918,00 €; abzüglich Selbstbeteiligung 250,00 € je Versicherungsfall = 1.668,00 €.","norm":"§ 125 VVG; Proximus 5, ARB 2021 Ziff. 2.3.1.2, 2.3.3.1 und 3.3.4; Prämientarif Rechtsschutz","id":"5.5-2-2"},{"typ":"mc","frage":"Der Versicherer lehnt eine weitere Klage von Herrn Bergmann ab, weil sie keine hinreichende Aussicht auf Erfolg biete. Was kann Herr Bergmann tun?","optionen":["Er kann seinen Anwalt eine für beide Seiten bindende Stellungnahme abgeben lassen.","Nichts; die Entscheidung des Versicherers ist endgültig und gerichtlich nicht überprüfbar.","Er muss vor der Klage zuerst die BaFin um eine ausdrückliche Erlaubnis bitten.","Er kann den Rechtsschutzfall rückwirkend auf einen anderen Versicherer übertragen."],"richtig":[0],"erkl":"Die ARB 2021 sehen bei Ablehnung wegen fehlender Erfolgsaussicht oder Mutwilligkeit den Stichentscheid vor: Der Anwalt des Kunden nimmt begründet Stellung; der Versicherer trägt die Kosten, und die Stellungnahme bindet beide Seiten, außer sie weicht offenbar erheblich von der Sach- oder Rechtslage ab. Die Ablehnung muss unverzüglich schriftlich mit Begründung erfolgen.","norm":"§ 128 VVG; Proximus 5, ARB 2021 Ziff. 3.4.1 und 3.4.2","id":"5.5-2-3"},{"typ":"wf","frage":"Nach den ARB 2021 können beide Seiten kündigen, wenn mindestens zwei Versicherungsfälle innerhalb von zwölf Monaten eingetreten sind, für die Versicherungsschutz besteht; die Kündigung muss innerhalb eines Monats zugehen, nachdem der Versicherer seine Leistungspflicht für den zweiten Fall bestätigt hat. Der Versicherer bestätigt bei Herrn Bergmann zwei Fälle aus dem Jahr 2026 am 05.10.2026 und am 18.11.2026. Welche Aussagen treffen zu?","aussagen":[["Auch der Versicherer darf den Vertrag kündigen.",true],["Die Kündigung muss spätestens am 18.12.2026 zugehen.",true],["Herr Bergmann muss seine Kündigung eigenhändig unterschrieben per Brief schicken.",false]],"erkl":"Die Frist von einem Monat beginnt mit der Bestätigung für den zweiten Fall (18.11.2026) und endet am 18.12.2026. Textform (z. B. E-Mail) genügt.","norm":"Proximus 5, ARB 2021 Ziff. 6.2.5.2; § 188 Abs. 2 BGB; § 126b BGB","id":"5.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Ehepaar Schubert – Öltank und Anbau","situation":"Ehepaar Schubert bewohnt ein eigenes Einfamilienhaus in Halle (Saale). Im Keller steht ein oberirdischer Heizöltank mit 6.000 l Fassungsvermögen. Im Frühjahr 2027 wollen sie einen Anbau mit Doppelgarage errichten lassen (Bausumme 240.000,00 €); Planung, Bauleitung und Bauausführung übernehmen ein Architekt und eine Baufirma. Ihre Privathaftpflicht bei der Proximus Versicherung AG (Familien-Versicherung, Alternative A) deckt nach den AVB PHV 2021 u. a.: Haftpflicht als Inhaber des selbst bewohnten Einfamilienhauses; Gewässerschäden nur aus Kleingebinden bis 100 l bei insgesamt höchstens 1.000 l; Haftpflicht als Bauherr bis zu einer Bausumme von 200.000 € je Bauvorhaben.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Risiko der Schuberts die passende Absicherung zu.","paare":[["Ein Fußgänger stürzt auf dem nicht geräumten Gehweg vor dem Haus.","Privathaftpflicht (selbst bewohntes Einfamilienhaus)"],["Aus dem 6.000-l-Tank sickert Heizöl ins Erdreich und ins Grundwasser.","Gewässerschaden-Haftpflicht für den Tank (Anlagenrisiko)"],["Ein Passant wird von herabfallendem Baumaterial des Anbaus verletzt.","eigene Bauherren-Haftpflichtversicherung"],["Ein ungewöhnlich schwerer Sturm zerstört den halbfertigen Rohbau des Anbaus.","Bauleistungsversicherung"]],"erkl":"Der Tank überschreitet die Mengengrenzen, die Bausumme die Grenze der Privathaftpflicht; für beide bietet die Proximus eigene Verträge (Gewässerschaden- und Bauherren-Haftpflicht). Schäden am eigenen Bauwerk sind kein Haftpflicht-, sondern ein Sachrisiko; die Wohngebäudeversicherung deckt Sturm an nicht bezugsfertigen Gebäudeteilen nicht.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.3.1, 6.3.2.4 und 6.21.1; Abschnitte 5 und 6; VGB 2021 Ziff. 5.5; § 89 Abs. 2 WHG","id":"5.5-3-1"},{"typ":"wf","frage":"Welche Aussagen zur Haftung der Schuberts für den Heizöltank treffen zu?","aussagen":[["Wer eine Anlage zum Lagern von Heizöl betreibt, haftet für eine nachteilige Veränderung eines Gewässers auch ohne Verschulden.",true],["Die Ersatzpflicht entfällt, wenn der Schaden durch höhere Gewalt verursacht wurde.",true],["Die Schuberts haften nur, wenn ihnen grobe Fahrlässigkeit nachgewiesen wird.",false],["Laut ihren Bedingungen ist der Tank über die Privathaftpflicht mitversichert, weil sie das Haus selbst bewohnen.",false]],"erkl":"Das Wasserhaushaltsgesetz sieht für Anlagen eine Gefährdungshaftung vor; nur höhere Gewalt entlastet. Gewässerschäden können Sanierungskosten in sechsstelliger Höhe verursachen. Die Privathaftpflicht deckt nur Kleingebinde bis 100 l (insgesamt 1.000 l); der 6.000-l-Tank braucht eine Gewässerschaden-Haftpflicht (Anlagenrisiko).","norm":"§ 89 Abs. 2 WHG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.21.1; Abschnitt 6 Ziff. 1.1","id":"5.5-3-2"},{"typ":"mc","frage":"Die Schuberts meinen, mit dem Auftrag an die Baufirma hätten sie keine Pflichten mehr für die Baustelle. Was trifft zu?","optionen":["Die Firma sichert die Baustelle; die Schuberts müssen sie sorgfältig auswählen und überwachen.","Das stimmt; ein Bauherr haftet nie, sobald er eine Fachfirma mit dem Bau beauftragt hat.","Die Schuberts haften allein; die beauftragte Baufirma haftet für die Baustelle nie.","Die Haftung trägt die Stadt Halle (Saale), weil sie die Baugenehmigung erteilt hat."],"richtig":[0],"erkl":"Der Bauherr eröffnet mit der Baustelle eine Gefahrenquelle. Die Verkehrssicherungspflicht geht weitgehend auf die Baufirma über; dem Bauherrn bleiben Auswahl- und Überwachungspflichten. Die Bauherren-Haftpflicht der Proximus setzt voraus, dass Planung, Bauleitung und Bauausführung an Dritte vergeben sind.","norm":"§ 823 Abs. 1 BGB (Verkehrssicherungspflicht); Proximus 5, AVB PHV 2021 Teil A Abschnitt 5 Ziff. 1","id":"5.5-3-3"},{"typ":"zahl","frage":"Die Schuberts schließen für den Anbau (Bausumme 240.000,00 €) eine Bauherren-Haftpflicht nach Alternative A ab. Laut Tarif beträgt die Einmalprämie bei einer Bausumme bis 250.000 € netto 91,00 €. Wie viel Euro zahlen sie einschließlich 19 % Versicherungsteuer?","wert":108.29,"einheit":"€","tol":0.01,"erkl":"Die Einmalprämie gilt für die ganze Bauzeit (höchstens 2 Jahre) und ist keine Jahresprämie; der Nachlass für die Zahlungsweise gilt laut Tarif nur für Jahresprämien. Versicherungsteuer: 91,00 € × 19 % = 17,29 €. Zu zahlen: 91,00 € + 17,29 € = 108,29 €. Hinweis für die Prüfung: Die IHK-Lösung GAP 2 Sommer 2025 hat auch von der Einmalprämie 5 % für jährliche Zahlung abgezogen (96,80 € − 5 % + Versicherungsteuer = 109,43 €). Schreiben Sie diese Alternativlösung in Klammern dazu, hier: (91,00 € − 4,55 € = 86,45 € + 16,43 € Versicherungsteuer = 102,88 €).","norm":"Proximus 5, Tarif für private Haftpflichtrisiken (Bauherren-Haftpflicht, Ratenzahlung, Versicherungsteuer); AVB PHV 2021 Teil A Abschnitt 5 Ziff. 1.3; § 6 Abs. 1 VersStG","id":"5.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Lina Petrović – Pedelec gestohlen","situation":"Lina Petrović (31) aus Halle (Saale) schließt ihr Pedelec (Tretunterstützung bis 25 km/h, Neupreis heute 3.900,00 €) am Dienstag, 06.10.2026, um 19:30 Uhr mit einem Faltschloss vor einem Kino an. Als sie um 21:45 Uhr zurückkommt, ist das Rad gestohlen. Ihre Hausratversicherung bei der Proximus Versicherung AG nach den VHB 2021 hat eine Versicherungssumme von 50.000,00 €; die Klausel PK 7110 Fahrraddiebstahl ist vereinbart. Danach sind Fahrräder (auch Pedelecs) gegen Diebstahl versichert, wenn sie mit einem verkehrsüblichen Schloss (kein Rahmenschloss) gesichert sind; die Entschädigung ist je Versicherungsfall auf 1 % der Versicherungssumme zuzüglich Vorsorge begrenzt. Die Vorsorge beträgt 10 % der Versicherungssumme.","items":[{"typ":"zahl","frage":"Wie viel Euro erstattet die Hausratversicherung für das gestohlene Pedelec?","wert":550.0,"einheit":"€","tol":0.01,"erkl":"Versicherungssumme mit Vorsorge: 50.000,00 € + 10 % = 55.000,00 €. Grenze: 1 % von 55.000,00 € = 550,00 €. Der Neuwert von 3.900,00 € liegt darüber, daher werden nur 550,00 € ersetzt. Das Faltschloss ist ein verkehrsübliches Schloss.","norm":"Proximus 5, VHB 2021 PK 7110 Ziff. 1 und 2; VHB 2021 Ziff. 8.3.4 und 17.2","id":"5.5-4-1"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten von Frau Petrović nach dem Diebstahl treffen zu?","aussagen":[["Sie muss den Diebstahl unverzüglich der Polizei anzeigen.",true],["Sie muss Unterlagen zu Erwerb, Hersteller, Marke und Rahmennummer des Pedelecs beschaffen und aufbewahren.",true],["Sie darf den Schaden dem Versicherer erst melden, wenn das Rad drei Wochen nicht wieder aufgetaucht ist.",false],["Sie muss dem Versicherer und der Polizei ein Verzeichnis der gestohlenen Sachen (Stehlgutliste) einreichen.",true]],"erkl":"Der Schaden ist dem Versicherer unverzüglich anzuzeigen; bei Diebstahl kommen die Anzeige bei der Polizei und die Stehlgutliste hinzu. Nach PK 7110 muss sie außerdem Erwerbs- und Identitätsnachweise aufbewahren und nachweisen, dass das Rad nicht binnen drei Wochen seit der Polizeianzeige wieder herbeigeschafft wurde – das ist ein Nachweis, keine Wartefrist für die Schadenmeldung.","norm":"Proximus 5, VHB 2021 Ziff. 22.1.2, 22.1.5 und 22.1.6; PK 7110 Ziff. 1.3 und 1.4; § 28 VVG","id":"5.5-4-2"},{"typ":"mc","frage":"Frau Petrović möchte ihr nächstes Pedelec zum vollen Wert und auch gegen Akkuschäden absichern. Was empfehlen Sie?","optionen":["Eine spezielle Fahrradversicherung, die Diebstahl zum Neuwert sowie Akku und Elektronik abdeckt.","Eine höhere Versicherungssumme in der Privathaftpflicht, weil diese eigene Sachen ersetzt.","Eine Kfz-Teilkasko, weil Pedelecs bis 25 km/h rechtlich als Kraftfahrzeuge gelten.","Keine weitere Absicherung, weil Pedelecs immer über die Wohngebäudeversicherung laufen."],"richtig":[0],"erkl":"Die Fahrradklausel PK 7110 ist auf 1 % der Versicherungssumme zuzüglich Vorsorge begrenzt; eine höhere Grenze kann gegen Zuschlag vereinbart werden, Akkuschäden deckt sie aber nicht. Eine eigene Fahrrad- bzw. E-Bike-Versicherung deckt Diebstahl ohne diese Grenze und oft auch Akku, Elektronik und Vandalismus. Die Privathaftpflicht ersetzt nie eigene Sachen; Pedelecs bis 25 km/h sind keine Kraftfahrzeuge.","norm":"§ 1 Abs. 3 StVG; § 100 VVG; Proximus 5, VHB 2021 PK 7110 Ziff. 2; Tarif Hausrat Ziff. 2.2.2","id":"5.5-4-3"},{"typ":"mc","frage":"Der Versicherer zahlt am 20.10.2026; die Verhandlungen über die Entschädigung sind damit abgeschlossen. Frau Petrović ist unzufrieden und möchte die Hausratversicherung kündigen. Was gilt?","optionen":["Sie kann bis 20.11.2026 kündigen, sofort oder spätestens zum Ende der laufenden Versicherungsperiode.","Sie kann nur mit einer Frist von drei Monaten zum Ende des laufenden Versicherungsjahres kündigen.","Nach einem Schaden darf nur der Versicherer kündigen, die Kundin selbst hat kein Kündigungsrecht.","Sie kann jederzeit innerhalb eines Jahres nach dem Schadentag fristlos und rückwirkend kündigen."],"richtig":[0],"erkl":"Nach dem Versicherungsfall haben beide Seiten ein Sonderkündigungsrecht bis einen Monat nach Abschluss der Verhandlungen über die Entschädigung; die Kündigung ist in Textform zu erklären. Die Kundin kann nicht für einen späteren Zeitpunkt als das Ende der laufenden Versicherungsperiode kündigen.","norm":"Proximus 5, VHB 2021 Ziff. 26.1 und 26.2; § 92 Abs. 1 und 2 VVG","id":"5.5-4-4"}]}]}]},{"nr":"6","titel":"Mobilität und Reisen absichern","lf":"LF 6 (2. AJ)","abschnitte":[{"nr":"6.1","titel":"Beratungsanlässe: Straßenverkehr und Reisen","lf":"LF 6","buch":"S. 270","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Fahrzeug die Versicherungspflicht zu.","paare":[["Pedelec bis 25 km/h mit Tretunterstützung","keine Kfz-Versicherungspflicht"],["S-Pedelec bis 45 km/h","Versicherungspflicht mit Versicherungskennzeichen, Führerschein Klasse AM nötig"],["E-Scooter (Elektrokleinstfahrzeug)","Versicherungspflicht mit Versicherungsplakette, kein Führerschein, ab 14 Jahren"],["Pkw","Versicherungspflicht mit amtlichem Kennzeichen"]],"erkl":"Pedelecs bis 25 km/h gelten als Fahrräder.","norm":"PflVG, eKFV, FZV","id":"6.1-1-1"},{"typ":"mc","frage":"Ein Kunde holt seinen neuen Gebrauchtwagen ab und braucht für die Zulassung einen Nachweis über die Kfz-Haftpflicht. Was erhält er vom Versicherer?","optionen":["Eine Zahlungsbestätigung über die erste Prämie","Die Grüne Karte, die bei der Zulassung abgestempelt wird","Eine elektronische Versicherungsbestätigung (eVB-Nummer)","Eine Bestätigung der Zulassungsstelle über die Versicherung"],"richtig":[2],"erkl":"Mit der eVB-Nummer sagt der Versicherer vorläufigen Schutz in der Kfz-Haftpflicht und beim Autoschutzbrief zu; er beginnt zum vereinbarten Zeitpunkt, spätestens mit der Zulassung.","norm":"Proximus 5, AKB 2021 B.2.1; § 49 VVG","id":"6.1-1-2"},{"typ":"wf","frage":"Welche Anlässe sollten Sie für eine Beratung zur Reiseversicherung nutzen?","aussagen":[["Buchung einer teuren Kreuzfahrt",true],["Reise außerhalb Europas",true],["Wechsel der Hausratversicherung",false],["Reise mit kleinen Kindern",true]],"erkl":"Hohe Reisepreise, Fernreisen und Mitreisende erhöhen den Bedarf an Rücktritts- und Auslandsreisekrankenschutz.","norm":"Bedarfsanalyse","id":"6.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Mia Schröder (19) hat den Führerschein bestanden und kauft einen gebrauchten Kleinwagen. Ihre Mutter bietet an, das Auto als Zweitwagen über ihren eigenen Vertrag laufen zu lassen.","items":[{"typ":"mc","frage":"Welcher Vorteil kann sich ergeben, wenn das Auto als Zweitwagen der Mutter versichert wird?","optionen":["Das Auto ist als Zweitwagen der Mutter nicht mehr versicherungspflichtig.","Eine günstigere Einstufung in der Schadenfreiheitsklasse als bei Fahranfängern.","Mias eigene Schadenfreiheitsklasse steigt dadurch jedes Jahr doppelt so schnell.","Mia ist automatisch über die Vollkasko des Erstwagens der Mutter versichert."],"richtig":[1],"erkl":"Ein Fahranfänger beginnt ohne Sonderregel in SF 0 (Beitragssatz 85 %). Ist auf die Mutter bereits ein Pkw mit mindestens SF 1 zugelassen und hat sie seit mindestens einem Jahr den Führerschein, wird der Zweitwagen in SF 1 (52 %) eingestuft. Mia muss als Fahrerin angegeben werden.","norm":"Proximus 5, AKB 2021 I.2.1, I.2.2.2 mit Anhang 1 Tabelle 1.1","id":"6.1-2-1"},{"typ":"mc","frage":"Was muss bei der Angabe der Fahrer beachtet werden?","optionen":["Mia muss als regelmäßige Fahrerin angegeben werden; sonst drohen Nachzahlungen.","Nur Fahrer ab 25 Jahren dürfen im Vertrag überhaupt angegeben werden.","Die Fahrerangabe zählt nur in der Kaskoversicherung, nicht in der Haftpflicht.","Fahrer müssen nie angegeben werden, weil das Fahrzeug selbst versichert ist."],"richtig":[0],"erkl":"Der Kreis der Fahrer ist ein Merkmal der Prämienberechnung (im Tarif der Proximus z. B. Einzel-/Partner- oder Familien-Nachlass). Bei unzutreffenden Angaben gilt rückwirkend ab Beginn des Versicherungsjahres die richtige Prämie; bei Vorsatz kommt eine Vertragsstrafe in Höhe einer Jahresprämie hinzu.","norm":"Proximus 5, AKB 2021 K.4.1, K.4.3, K.4.4; Tarif zur Kraftfahrtversicherung (Nachlässe)","id":"6.1-2-2"},{"typ":"zuo","frage":"Welche Kasko passt zu welchem Wunsch?","paare":[["Schutz bei Diebstahl, Brand und Glasbruch","Teilkasko"],["zusätzlich Schutz bei selbst verschuldetem Unfall","Vollkasko"],["nur Schäden anderer ersetzen","Kfz-Haftpflicht"]],"erkl":"Die Vollkasko umfasst die Teilkasko-Gefahren und zusätzlich Unfall und mut- oder böswillige Handlungen (Vandalismus).","norm":"Proximus 5, AKB 2021 A.1.1, A.2.2, A.2.3","id":"6.1-2-3"}]}]},{"nr":"6.2","titel":"Bedarfe analysieren, Risikoprävention und Absicherung","lf":"LF 6","buch":"S. 271–273","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Schäden sind in der Teilkasko versichert?","aussagen":[["Diebstahl des Fahrzeugs",true],["Zusammenstoß mit Haarwild",true],["Glasbruch an der Windschutzscheibe",true],["Unfall durch eigenes Verschulden",false],["mutwillige Beschädigung durch Unbekannte (Vandalismus)",false]],"erkl":"Unfall und Vandalismus sind Vollkasko-Gefahren. Die Teilkasko der Proximus deckt den Zusammenstoß des fahrenden Fahrzeugs mit Tieren aller Art.","norm":"Proximus 5, AKB 2021 A.2.2.2, A.2.2.4, A.2.2.5, A.2.3.2, A.2.3.3","id":"6.2-1-1"},{"typ":"mc","frage":"Was ersetzt die Kfz-Haftpflichtversicherung NICHT?","optionen":["Vermögensschäden des Unfallgegners","Sachschäden am Fahrzeug des Unfallgegners","Personenschäden des Unfallgegners","Schäden am eigenen versicherten Fahrzeug"],"richtig":[3],"erkl":"Eigenschäden am Fahrzeug deckt nur die Kaskoversicherung.","norm":"Proximus 5, AKB 2021 A.1.1.1, A.1.5.3","id":"6.2-1-2"},{"typ":"mc","frage":"Welchen Nutzen hat eine Auslandsreisekrankenversicherung zusätzlich zur gesetzlichen Krankenversicherung?","optionen":["Sie erstattet den Reisepreis, wenn der Veranstalter die Reise kurzfristig absagt.","Sie zahlt während der Reise die Beiträge zur gesetzlichen Krankenversicherung.","Sie übernimmt z. B. Behandlungen außerhalb der EU und einen notwendigen Rücktransport.","Sie kann nur für Geschäftsreisen außerhalb Europas abgeschlossen werden."],"richtig":[2],"erkl":"Die gesetzliche Krankenversicherung zahlt keinen Rücktransport und im Ausland nur eingeschränkt. Die Auslandsreisekrankenversicherung der Proximus zahlt medizinisch notwendige Behandlungen akut im Ausland eingetretener Krankheiten und Unfälle und den Krankenrücktransport bei medizinischer Notwendigkeit.","norm":"SGB V; Proximus 5, Tarif Auslandsreisekrankenversicherung (AKV)","id":"6.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Schadenereignis die passende Reiseversicherung zu.","paare":[["Die Kundin erkrankt schwer vor Reiseantritt und muss stornieren.","Reiserücktrittsversicherung"],["Der Kunde muss die Reise wegen eines Unfalls vorzeitig beenden.","Reiseabbruchversicherung"],["Der Koffer wird am Urlaubsort gestohlen.","Reisegepäckversicherung"],["Arztbesuch im Urlaub in den USA","Auslandsreisekrankenversicherung"]],"erkl":"Jede Reiseversicherung deckt einen anderen Abschnitt der Reise.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, VB-Reiseabbruch 2021 Ziff. 1, VB-Reisegepäck 2021 Ziff. 2.2.1, Tarif Auslandsreisekrankenversicherung (AKV)","id":"6.2-1-4"},{"typ":"mc","frage":"Wie berücksichtigt der Kfz-Tarif der Proximus, dass ein Kunde seinen Pkw nachts in einer Garage abstellt?","optionen":["Mit einem Zuschlag, weil in Garagen häufiger Brände entstehen.","Mit einem Garagen-Nachlass, in der Teilkasko zum Beispiel 15 %.","Gar nicht, weil der Abstellort kein Merkmal des Tarifs ist.","Nur in der Vollkasko mit einem Nachlass von 25 % der Prämie."],"richtig":[1],"erkl":"Der Tarif zur Kraftfahrtversicherung gewährt einen Garagen-Nachlass: 10 % in der Kfz-Haftpflicht, 5 % in der Vollkasko und 15 % in der Teilkasko. Wer das Risiko senkt, zahlt weniger.","norm":"Proximus 5, Tarif zur Kraftfahrtversicherung (Nachlässe und Zuschläge für individuelle Tarifmerkmale)","id":"6.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ehepaar Brenner bucht für 9.600 € eine Kreuzfahrt in die Karibik, Abreise in fünf Monaten. Sie fragen, welche Versicherungen sinnvoll sind. Herr Brenner hat eine Herzerkrankung, die gut eingestellt ist.","items":[{"typ":"mc","frage":"Welche Versicherung schützt die Brenners, wenn sie die Reise wegen einer plötzlichen schweren Erkrankung absagen müssen?","optionen":["Reiserücktrittsversicherung","Reiseabbruchversicherung","Reisegepäckversicherung","Auslandsreisekrankenversicherung"],"richtig":[0],"erkl":"Sie ersetzt die vertraglich geschuldeten Stornokosten bei versicherten Rücktrittsgründen, z. B. unerwarteter schwerer Erkrankung.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, 2.1.3","id":"6.2-2-1"},{"typ":"mc","frage":"Worauf müssen Sie wegen der Herzerkrankung besonders achten?","optionen":["Herr Brenner darf wegen der Erkrankung keine Reiseversicherung abschließen.","Die Erkrankung spielt keine Rolle, weil sie medikamentös gut eingestellt ist.","Bekannte Vorerkrankungen sind stets ohne Prüfung mitversichert.","Bekannte Vorerkrankungen können nach den Bedingungen ausgeschlossen sein."],"richtig":[3],"erkl":"Nach den Reisebedingungen der Proximus besteht kein Schutz bei Erkrankungen, die bei Abschluss bekannt waren und in den letzten 6 Monaten behandelt wurden (Kontrolluntersuchungen zählen nicht), und bei Schüben chronischer Erkrankungen. Das muss in der Beratung geklärt und offengelegt werden.","norm":"§ 61 VVG, Proximus 5, AT-Reise 2021 Ziff. 8.5, VB-Reiserücktritt 2021 Ziff. 4.4, 9","id":"6.2-2-2"},{"typ":"mc","frage":"Warum ist für die Karibikreise eine Auslandsreisekrankenversicherung besonders wichtig?","optionen":["Weil eine solche Versicherung für Kreuzfahrten in die Karibik gesetzlich vorgeschrieben ist.","Weil die Reiserücktrittsversicherung Arztkosten nur innerhalb Europas übernimmt.","Weil die GKV außerhalb von EU, EWR und Abkommensstaaten sowie an Bord grundsätzlich nicht zahlt.","Weil die GKV im Ausland Behandlungen nur bis zu einem Höchstbetrag von 5.000 € erstattet."],"richtig":[2],"erkl":"Behandlung und Rücktransport können sehr teuer werden. Zur Karibik gehören zwar auch EU-Gebiete (z. B. Guadeloupe); die Leistung an Bord und der Rücktransport bleiben trotzdem ungedeckt.","norm":"SGB V; Proximus 5, Tarif Auslandsreisekrankenversicherung (AKV)","id":"6.2-2-3"}]}]},{"nr":"6.3","titel":"Rechtliche Regelungen zu Mobilität und Reisen","lf":"LF 6","buch":"S. 274–294","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie der Rechtsgrundlage ihre Aussage zu.","paare":[["§ 7 StVG","Der Halter haftet verschuldensunabhängig für Schäden beim Betrieb seines Kfz (außer bei höherer Gewalt)."],["§ 18 StVG","Der Fahrer haftet, wenn er nicht beweist, dass ihn kein Verschulden trifft."],["§ 115 VVG","Der Geschädigte kann seinen Anspruch direkt gegen den Kfz-Haftpflichtversicherer geltend machen."],["§ 1 PflVG","Der Halter muss für sein Kfz eine Haftpflichtversicherung abschließen."]],"erkl":"Halterhaftung, Fahrerhaftung, Direktanspruch und Versicherungspflicht greifen ineinander.","norm":"StVG, VVG, PflVG","id":"6.3-1-1"},{"typ":"mc","frage":"Ein Fahrer verursacht alkoholbedingt einen Unfall (Obliegenheitsverletzung vor dem Versicherungsfall). Was gilt in der Kfz-Haftpflicht?","optionen":["Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer bis zu 2.500 € in Regress.","Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer bis zu 5.000 € in Regress.","Der Versicherer ist leistungsfrei; der Geschädigte muss sich an den Fahrer halten.","Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer unbegrenzt in Regress."],"richtig":[1],"erkl":"Im Außenverhältnis bleibt der Versicherer zur Leistung verpflichtet; im Innenverhältnis ist die Leistungsfreiheit auf 5.000 € begrenzt.","norm":"§ 117 VVG, § 5 Abs. 3 KfzPflVV, Proximus 5, AKB 2021 D.2.1, D.5.3","id":"6.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Ausgleichszahlung bei Flugausfall oder großer Verspätung nach der Fluggastrechte-VO zu.","paare":[["bis 1.500 km","250 €"],["über 1.500 km innerhalb der EU und andere Flüge bis 3.500 km","400 €"],["über 3.500 km außerhalb der EU","600 €"]],"erkl":"Der Anspruch besteht gegen die Fluggesellschaft, nicht gegen den Reiseversicherer. Stand Oktober 2026: Eine Reform ist beschlossen, aber noch nicht in Kraft.","norm":"Art. 7 VO (EG) Nr. 261/2004","id":"6.3-1-3"},{"typ":"mc","frage":"Wie wird ein Pauschalreisender vor der Insolvenz des Reiseveranstalters geschützt?","optionen":["Der Veranstalter muss die Kundengelder absichern und einen Sicherungsschein aushändigen.","Gar nicht, das Insolvenzrisiko des Reiseveranstalters trägt allein der Kunde selbst.","Durch eine Reiserücktrittsversicherung, die der Veranstalter abschließen muss.","Durch die Reisegepäckversicherung, die bei einer Insolvenz den Reisepreis erstattet."],"richtig":[0],"erkl":"Die Insolvenzabsicherung ist für Pauschalreisen vorgeschrieben.","norm":"§ 651r BGB","id":"6.3-1-4"},{"typ":"mc","frage":"Innerhalb welcher Frist muss ein Kfz-Versicherungsfall dem Versicherer in der Regel angezeigt werden?","optionen":["Innerhalb von drei Monaten","Innerhalb eines Monats","Innerhalb von zwei Wochen","Innerhalb einer Woche"],"richtig":[3],"erkl":"Nach den AKB 2021 ist jedes Schadenereignis innerhalb einer Woche anzuzeigen; die Entwendung des Fahrzeugs unverzüglich in Textform.","norm":"Proximus 5, AKB 2021 E.1.1, E.3.1","id":"6.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kaya verkauft seinen Pkw an Frau Jung. Am Tag nach der Übergabe verursacht Frau Jung mit dem Wagen, der noch auf Herrn Kaya zugelassen und versichert ist, einen Unfall. Herr Kaya hat den Verkauf seinem Versicherer noch nicht gemeldet.","items":[{"typ":"mc","frage":"Was geschieht mit Herrn Kayas Kfz-Versicherung durch den Verkauf?","optionen":["Sie bleibt bei Herrn Kaya, bis das Fahrzeug auf Frau Jung umgemeldet worden ist.","Sie endet mit der Übergabe der Schlüssel; Herr Kaya muss den Verkauf nicht anzeigen.","Sie geht auf die Erwerberin über; Herr Kaya muss den Verkauf unverzüglich anzeigen.","Sie ruht, bis Frau Jung bei ihrem Versicherer einen Antrag stellt."],"richtig":[2],"erkl":"Die Regeln zur Veräußerung gelten auch in der Kfz-Versicherung; nach den AKB 2021 müssen Veräußerer und Erwerber den Verkauf unverzüglich anzeigen.","norm":"§§ 95–97 VVG, Proximus 5, AKB 2021 G.7.1, G.7.4","id":"6.3-2-1"},{"typ":"mc","frage":"Wer ersetzt dem Unfallgegner den Schaden?","optionen":["Frau Jungs eigene Privathaftpflicht, weil sie den Unfall verursacht hat.","Der bisherige Kfz-Haftpflichtversicherer, weil der Vertrag übergegangen ist.","Herr Kaya persönlich, weil er den Verkauf nicht rechtzeitig gemeldet hat.","Niemand, weil das Fahrzeug nach dem Verkauf nicht mehr versichert war."],"richtig":[1],"erkl":"Der Geschädigte kann sich direkt an den Kfz-Haftpflichtversicherer wenden; der Vertrag ist mit dem Verkauf auf Frau Jung übergegangen.","norm":"§ 115 VVG, § 95 VVG, Proximus 5, AKB 2021 G.7.1","id":"6.3-2-2"},{"typ":"mc","frage":"Was sollten Herr Kaya und Frau Jung jetzt tun?","optionen":["Verkauf und Unfall dem Versicherer melden und klären, ob Frau Jung den Vertrag fortführt.","Nichts tun und abwarten, ob der Unfallgegner überhaupt Ansprüche geltend macht.","Frau Jung schließt sofort einen neuen Vertrag ab, der dann rückwirkend den Unfall bezahlt.","Nur den Unfall melden; der Verkauf wird erst bei der späteren Ummeldung angezeigt."],"richtig":[0],"erkl":"Anzeige der Veräußerung und des Schadenereignisses; die Erwerberin kann den Vertrag innerhalb eines Monats nach dem Erwerb kündigen.","norm":"§§ 96, 97 VVG, Proximus 5, AKB 2021 E.1.1, G.2.5, G.7.4","id":"6.3-2-3"}]}]},{"nr":"6.4","titel":"Prüfungsfälle: Kraftfahrt","lf":"LF 6","buch":"S. 270–288","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Yıldız – Antrag und Mindestdeckung","situation":"Sevda Yıldız (23) aus Halle (Saale) beantragt am Montag, 5. Oktober 2026, schriftlich bei der Proximus Versicherung AG eine Kfz-Haftpflichtversicherung und eine Vollkasko für ihren gebrauchten Pkw. Sie war noch nie bei der Proximus versichert. Ihr bisheriger Versicherer, die Nordhafen Versicherung AG, hatte ihr im Frühjahr nach einem Unfall gekündigt. Ihr Bruder Deniz betreut beim Fußballverein den Vereinsbus mit 20 Sitzplätzen ohne den Fahrersitz und fragt nach den gesetzlichen Mindestversicherungssummen.","items":[{"typ":"mc","frage":"Darf die Proximus den Antrag von Frau Yıldız auf Kfz-Haftpflichtversicherung ablehnen?","optionen":["Nein, denn ein gesetzlicher Ablehnungsgrund fehlt: Gekündigt hat ein anderer Versicherer.","Ja, denn ein Vorversicherer hat ihr nach einem Schadenfall den Vertrag gekündigt.","Ja, Kfz-Versicherer dürfen Anträge von Fahranfängern unter 25 Jahren stets ablehnen.","Nein, aber nur, wenn Frau Yıldız den ersten Beitrag schon mit dem Antrag zahlt."],"richtig":[0],"erkl":"Für die Kfz-Haftpflicht besteht Annahmezwang. Ablehnen darf der Versicherer nur bei Beschränkungen im Geschäftsplan oder wenn er selbst den Antragsteller früher versichert und z. B. nach einem Versicherungsfall gekündigt hat. Die Kündigung der Nordhafen zählt nicht.","norm":"§ 5 Abs. 2 und 4 PflVG","id":"6.4-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Antrag von Frau Yıldız treffen zu?","aussagen":[["Lehnt die Proximus den Haftpflichtantrag nicht innerhalb von zwei Wochen ab Eingang schriftlich ab und macht sie kein abweichendes schriftliches Angebot, gilt er zum allgemeinen Unternehmenstarif als angenommen.",true],["Für die Fristwahrung genügt es, dass die Proximus die Ablehnung rechtzeitig absendet.",true],["Der Annahmezwang gilt auch für die beantragte Vollkasko.",false],["Wäre der Pkw ein Taxi, würde der Antrag nach zwei Wochen ohne Antwort ebenso als angenommen gelten.",false]],"erkl":"Die Annahmefiktion gilt für Zweiräder, Pkw und Kombis bis eine Tonne Nutzlast, nicht für Taxen und Mietwagen. Der Kontrahierungszwang betrifft nur die Pflichtversicherung, also die Kfz-Haftpflicht, nicht die Kasko.","norm":"§ 5 Abs. 2 und 3 PflVG","id":"6.4-1-2"},{"typ":"zahl","frage":"Wie hoch ist die gesetzliche Mindestversicherungssumme für Personenschäden je Schadensfall beim Vereinsbus (20 Sitzplätze ohne Fahrersitz)? Geben Sie den Betrag in Euro an.","wert":8050000,"einheit":"€","tol":0.01,"erkl":"Grundbetrag 7.500.000 €; ab dem 10. Platz (ohne Fahrersitz) je Platz 50.000 € mehr. Plätze 10 bis 20 = 11 Plätze: 11 × 50.000 € = 550.000 €; 7.500.000 € + 550.000 € = 8.050.000 €.","norm":"§ 4 Abs. 2 PflVG mit Anlage Nr. 1 und 2","id":"6.4-1-3"},{"typ":"zuo","frage":"Ordnen Sie den Schadenarten die gesetzliche Mindestversicherungssumme je Schadensfall für den Pkw von Frau Yıldız zu.","paare":[["Personenschäden","7.500.000 €"],["Sachschäden","1.300.000 €"],["reine Vermögensschäden","50.000 €"]],"erkl":"Die Mindestsummen für Kraftfahrzeuge stehen in der Anlage zum PflVG. Viele Verträge bieten freiwillig deutlich höhere Summen, z. B. 100 Mio. € pauschal.","norm":"§ 4 Abs. 2 PflVG mit Anlage Nr. 1","id":"6.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Nowak – Fahrzeugwechsel mit eVB","situation":"Piotr Nowak (41) aus Halle (Saale) kauft am Freitag, 2. Oktober 2026, beim Händler einen gebrauchten SUV. Er beantragt bei der Proximus Kfz-Haftpflicht und Vollkasko und erhält sofort eine eVB-Nummer. Die Proximus sagt vorläufigen Schutz für die Kasko nicht ausdrücklich zu. Am Montag, 5. Oktober, wird der SUV zugelassen. Am Freitag, 9. Oktober, geht ihm der Versicherungsschein mit der ersten Beitragsrechnung zu. Laut AKB 2021 entfällt der vorläufige Schutz rückwirkend, wenn er den ersten Beitrag nicht unverzüglich nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins zahlt und dies zu vertreten hat. Seinen alten Kombi (ebenfalls bei der Proximus, Haftpflicht und Teilkasko) lässt er am 5. Oktober außer Betrieb setzen und stellt ihn bis zum Verkauf in seine abschließbare Garage. Laut AKB 2021 geht der Vertrag dann in eine prämienfreie Ruheversicherung mit Kfz-Haftpflicht und Teilkasko über; das Fahrzeug muss dafür in einem Einstellraum oder auf einem umfriedeten Abstellplatz stehen.","items":[{"typ":"mc","frage":"Ab wann hat Herr Nowak für den SUV vorläufigen Schutz in der Kfz-Haftpflicht?","optionen":["spätestens mit der Zulassung am 5. Oktober mit der eVB","erst mit dem Zugang des Versicherungsscheins am 9. Oktober","erst mit der Zahlung des ersten Beitrags nach der Zulassung","schon mit dem Kaufvertrag beim Händler am 2. Oktober"],"richtig":[0],"erkl":"Mit der Versicherungsbestätigung sagt die Proximus vorläufigen Schutz in der Kfz-Haftpflicht und beim Autoschutzbrief zu. Er beginnt zum vereinbarten Zeitpunkt, spätestens mit der Zulassung unter Verwendung der eVB; die Zahlung ist dafür nicht Voraussetzung.","norm":"Proximus 5, AKB 2021 B.2.1; §§ 49–52 VVG","id":"6.4-2-1"},{"typ":"wf","frage":"Am 7. Oktober streift Herr Nowak beim Einparken mit dem SUV einen städtischen Poller. Am Poller und am SUV entstehen Schäden. Welche Aussagen treffen zu?","aussagen":[["Den Schaden am Poller reguliert die Proximus aus der vorläufigen Kfz-Haftpflicht.",true],["Den Schaden am SUV ersetzt die Proximus aus der Vollkasko, weil Herr Nowak sie beantragt hat.",false],["Ohne ausdrückliche Zusage umfasst der vorläufige Schutz keine Kaskoversicherung.",true]],"erkl":"Die eVB löst vorläufigen Schutz für die Kfz-Haftpflicht aus. Kasko ist vorläufig nur versichert, wenn der Versicherer das ausdrücklich zusagt; der Eigenschaden am SUV ist daher bis zum Beginn der Vollkasko nicht gedeckt.","norm":"Proximus 5, AKB 2021 B.2.1 und B.2.2","id":"6.4-2-2"},{"typ":"mc","frage":"Bis wann muss Herr Nowak den ersten Beitrag spätestens zahlen, damit der vorläufige Schutz nicht rückwirkend entfällt?","optionen":["Montag, 26. Oktober 2026","Freitag, 23. Oktober 2026","Montag, 19. Oktober 2026","Donnerstag, 22. Oktober 2026"],"richtig":[0],"erkl":"Die erste Prämie ist unverzüglich nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins zu zahlen. Der Zugangstag (Freitag, 9. Oktober) zählt nicht mit; die 14 Tage laufen bis zum Ablauf des 23. Oktober. „Unverzüglich“ rechnet die IHK-Lösung mit 3 weiteren Tagen (GAP 1 Frühjahr 2024: 23.01. + 14 Tage + 3 Tage = 09.02.): spätestens Montag, 26. Oktober 2026. Maßgeblich ist der Zugang des Versicherungsscheins, nicht die Zulassung. Die Sonderregel für den Fahrzeugwechsel (C.3) hilft nicht, weil der Vertrag für den Kombi als Ruheversicherung weiterläuft.","norm":"Proximus 5, AKB 2021 B.2.4, C.1.1; §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"6.4-2-3"},{"typ":"mc","frage":"Am 20. Oktober drückt ein Sturm das Garagentor ein; das Tor beschädigt den abgemeldeten Kombi. Was gilt für den Kombi?","optionen":["Die Proximus leistet aus der Teilkasko der Ruheversicherung, weil Sturm eine Teilkasko-Gefahr ist.","Die Proximus leistet nicht, weil für abgemeldete Fahrzeuge kein Versicherungsschutz mehr besteht.","Die Proximus leistet aus der Vollkasko des neuen SUV, weil beide Fahrzeuge Herrn Nowak gehören.","Nur die Wohngebäudeversicherung ersetzt den Schaden am Kombi, weil er in der Garage stand."],"richtig":[0],"erkl":"Nach der Außerbetriebsetzung besteht eine prämienfreie Ruheversicherung mit Haftpflicht und Teilkasko; der Wagen steht wie verlangt in einem Einstellraum. Sturm gehört zu den Teilkasko-Gefahren, auch wenn er Gegenstände gegen das Fahrzeug wirft; die Gebäudeversicherung deckt das Tor, nicht das Auto.","norm":"Proximus 5, AKB 2021 H.1.2, H.1.4, H.1.5 (Ruheversicherung), A.2.2.3 (Sturm)","id":"6.4-2-4"},{"typ":"zuo","frage":"Ordnen Sie den Unterlagen und Meldungen rund um den Fahrzeugwechsel die passende Aussage zu.","paare":[["elektronische Versicherungsbestätigung (eVB)","wird vom Versicherer elektronisch an die Zulassungsbehörde übermittelt oder zum Abruf bereitgehalten"],["Zulassungsbescheinigung Teil I","ist von der Person, die das Fahrzeug führt, mitzuführen"],["Bescheinigung über den Schadenverlauf","erhält der Versicherungsnehmer bei Vertragsende oder auf Verlangen innerhalb von 15 Tagen"],["Anzeige des Versicherers an die Zulassungsbehörde über fehlenden Versicherungsschutz","beendet die Haftung gegenüber Dritten einen Monat nach der Anzeige"]],"erkl":"Die eVB ersetzt die frühere Papierdoppelkarte. Die Schadenverlaufsbescheinigung braucht ein neuer Versicherer für die SF-Einstufung. Gegenüber Geschädigten wirkt das Vertragsende erst einen Monat nach der Anzeige an die Zulassungsbeh
