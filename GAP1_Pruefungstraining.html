ten allein; die beauftragte Baufirma haftet für die Baustelle nie.","Die Haftung trägt die Stadt Halle (Saale), weil sie die Baugenehmigung erteilt hat."],"richtig":[0],"erkl":"Der Bauherr eröffnet mit der Baustelle eine Gefahrenquelle. Die Verkehrssicherungspflicht geht weitgehend auf die Baufirma über; dem Bauherrn bleiben Auswahl- und Überwachungspflichten.","norm":"§ 823 Abs. 1 BGB (Verkehrssicherungspflicht)","id":"5.5-3-3"},{"typ":"zahl","frage":"Für eine eigene Bauherren-Haftpflicht verlangt die Proximus Versicherung AG laut Tarif 1,2 Promille der Bausumme zuzüglich 19 % Versicherungsteuer. Wie hoch ist der Bruttobeitrag für den Anbau (Bausumme 180.000,00 €)?","wert":257.04,"einheit":"€","tol":0.01,"erkl":"Nettobeitrag: 180.000,00 € × 1,2 ‰ = 216,00 €. Versicherungsteuer: 216,00 € × 19 % = 41,04 €. Brutto: 257,04 €.","norm":"§ 6 Abs. 1 VersStG; Tarif laut Aufgabe","id":"5.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Lina Petrović – Pedelec gestohlen","situation":"Lina Petrović (31) aus Halle (Saale) schließt ihr Pedelec (Tretunterstützung bis 25 km/h, Neupreis heute 3.900,00 €) am Dienstag, 06.10.2026, um 19:30 Uhr mit einem Faltschloss vor einem Kino an. Als sie um 21:45 Uhr zurückkommt, ist das Rad gestohlen. Ihre Hausratversicherung bei der Proximus Versicherung AG hat eine Versicherungssumme von 50.000,00 €. Laut Bedingungen ist einfacher Diebstahl von Fahrrädern (auch Pedelecs) mitversichert, wenn das Rad durch ein Schloss gesichert war; ersetzt wird der Neuwert, höchstens 2 % der Versicherungssumme.","items":[{"typ":"zahl","frage":"Wie viel Euro erstattet die Hausratversicherung für das gestohlene Pedelec?","wert":1000.0,"einheit":"€","tol":0.01,"erkl":"Grenze: 2 % von 50.000,00 € = 1.000,00 €. Der Neuwert von 3.900,00 € liegt darüber, daher werden nur 1.000,00 € ersetzt.","norm":"VHB, Klausel Fahrraddiebstahl; Entschädigungsgrenze laut Situation","id":"5.5-4-1"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten von Frau Petrović nach dem Diebstahl treffen zu?","aussagen":[["Sie muss den Diebstahl unverzüglich der Polizei anzeigen.",true],["Auf Verlangen des Versicherers muss sie zumutbare Belege wie Kaufbeleg und Rahmennummer vorlegen.",true],["Sie darf den Schaden dem Versicherer erst melden, wenn das Rad vier Wochen nicht aufgetaucht ist.",false],["Sie muss der Polizei ein Verzeichnis der gestohlenen Sachen (Stehlgutliste) einreichen.",true]],"erkl":"Der Versicherungsfall ist dem Versicherer unverzüglich anzuzeigen; nach den Hausratbedingungen kommen bei Diebstahl die Anzeige bei der Polizei und die Stehlgutliste hinzu. Belege muss sie auf Verlangen vorlegen, soweit zumutbar.","norm":"§§ 30, 31 VVG; VHB, Obliegenheiten nach dem Versicherungsfall","id":"5.5-4-2"},{"typ":"mc","frage":"Frau Petrović möchte ihr nächstes Pedelec zum vollen Wert und auch gegen Akkuschäden absichern. Was empfehlen Sie?","optionen":["Eine spezielle Fahrradversicherung, die Diebstahl zum Neuwert sowie Akku und Elektronik abdeckt.","Eine höhere Versicherungssumme in der Privathaftpflicht, weil diese eigene Sachen ersetzt.","Eine Kfz-Teilkasko, weil Pedelecs bis 25 km/h rechtlich als Kraftfahrzeuge gelten.","Keine weitere Absicherung, weil Pedelecs immer über die Wohngebäudeversicherung laufen."],"richtig":[0],"erkl":"Die Fahrradklausel der Hausrat ist auf einen Prozentsatz der Versicherungssumme begrenzt. Eine eigene Fahrrad- bzw. E-Bike-Versicherung deckt Diebstahl ohne diese Grenze und oft auch Akku, Elektronik und Vandalismus. Die Privathaftpflicht ersetzt nie eigene Sachen; Pedelecs bis 25 km/h sind keine Kraftfahrzeuge.","norm":"§ 1 Abs. 3 StVG; § 100 VVG","id":"5.5-4-3"},{"typ":"mc","frage":"Der Versicherer zahlt am 20.10.2026; die Verhandlungen über die Entschädigung sind damit abgeschlossen. Frau Petrović ist unzufrieden und möchte die Hausratversicherung kündigen. Was gilt?","optionen":["Sie kann bis 20.11.2026 kündigen, sofort oder spätestens zum Ende der laufenden Versicherungsperiode.","Sie kann nur mit einer Frist von drei Monaten zum Ende des laufenden Versicherungsjahres kündigen.","Nach einem Schaden darf nur der Versicherer kündigen, die Kundin selbst hat kein Kündigungsrecht.","Sie kann jederzeit innerhalb eines Jahres nach dem Schadentag fristlos und rückwirkend kündigen."],"richtig":[0],"erkl":"Nach dem Versicherungsfall haben beide Seiten ein Sonderkündigungsrecht bis einen Monat nach Abschluss der Verhandlungen. Die Kundin kann nicht für einen späteren Zeitpunkt als das Ende der laufenden Versicherungsperiode kündigen.","norm":"§ 92 Abs. 1 und 2 VVG","id":"5.5-4-4"}]}]}]},{"nr":"6","titel":"Mobilität und Reisen absichern","lf":"LF 6 (2. AJ)","abschnitte":[{"nr":"6.1","titel":"Beratungsanlässe: Straßenverkehr und Reisen","lf":"LF 6","buch":"S. 270","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Fahrzeug die Versicherungspflicht zu.","paare":[["Pedelec bis 25 km/h mit Tretunterstützung","keine Kfz-Versicherungspflicht"],["S-Pedelec bis 45 km/h","Versicherungspflicht mit Versicherungskennzeichen, Führerschein Klasse AM nötig"],["E-Scooter (Elektrokleinstfahrzeug)","Versicherungspflicht mit Versicherungsplakette, kein Führerschein, ab 14 Jahren"],["Pkw","Versicherungspflicht mit amtlichem Kennzeichen"]],"erkl":"Pedelecs bis 25 km/h gelten als Fahrräder.","norm":"PflVG, eKFV, FZV","id":"6.1-1-1"},{"typ":"mc","frage":"Ein Kunde holt seinen neuen Gebrauchtwagen ab und braucht für die Zulassung einen Nachweis über die Kfz-Haftpflicht. Was erhält er vom Versicherer?","optionen":["Eine Zahlungsbestätigung über die erste Prämie","Die Grüne Karte, die bei der Zulassung abgestempelt wird","Eine elektronische Versicherungsbestätigung (eVB-Nummer)","Eine Bestätigung der Zulassungsstelle über die Versicherung"],"richtig":[2],"erkl":"Mit der eVB-Nummer wird vorläufiger Deckungsschutz zugesagt, der mit der Zulassung beginnt.","norm":"AKB B.2, § 49 VVG","id":"6.1-1-2"},{"typ":"wf","frage":"Welche Anlässe sollten Sie für eine Beratung zur Reiseversicherung nutzen?","aussagen":[["Buchung einer teuren Kreuzfahrt",true],["Reise außerhalb Europas",true],["Wechsel der Hausratversicherung",false],["Reise mit kleinen Kindern",true]],"erkl":"Hohe Reisepreise, Fernreisen und Mitreisende erhöhen den Bedarf an Rücktritts- und Auslandsreisekrankenschutz.","norm":"Bedarfsanalyse","id":"6.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Mia Schröder (19) hat den Führerschein bestanden und kauft einen gebrauchten Kleinwagen. Ihre Mutter bietet an, das Auto als Zweitwagen über ihren eigenen Vertrag laufen zu lassen.","items":[{"typ":"mc","frage":"Welcher Vorteil kann sich ergeben, wenn das Auto als Zweitwagen der Mutter versichert wird?","optionen":["Das Auto ist als Zweitwagen der Mutter nicht mehr versicherungspflichtig.","Eine günstigere Einstufung in der Schadenfreiheitsklasse als bei Fahranfängern.","Mias eigene Schadenfreiheitsklasse steigt dadurch jedes Jahr doppelt so schnell.","Mia ist automatisch über die Vollkasko des Erstwagens der Mutter versichert."],"richtig":[1],"erkl":"Viele Versicherer stufen Zweitwagen besser ein als Erstverträge von Fahranfängern; der Fahrerkreis muss korrekt angegeben werden.","norm":"AKB, Tarifbestimmungen","id":"6.1-2-1"},{"typ":"mc","frage":"Was muss bei der Angabe der Fahrer beachtet werden?","optionen":["Mia muss als regelmäßige Fahrerin angegeben werden; sonst drohen Nachzahlungen.","Nur Fahrer ab 25 Jahren dürfen im Vertrag überhaupt angegeben werden.","Die Fahrerangabe zählt nur in der Kaskoversicherung, nicht in der Haftpflicht.","Fahrer müssen nie angegeben werden, weil das Fahrzeug selbst versichert ist."],"richtig":[0],"erkl":"Das Alter der Fahrer ist ein Tarifmerkmal; falsche Angaben können zu Nachzahlung oder Vertragsstrafe führen, Einzelheiten regeln die AKB.","norm":"AKB K","id":"6.1-2-2"},{"typ":"zuo","frage":"Welche Kasko passt zu welchem Wunsch?","paare":[["Schutz bei Diebstahl, Brand und Glasbruch","Teilkasko"],["zusätzlich Schutz bei selbst verschuldetem Unfall","Vollkasko"],["nur Schäden anderer ersetzen","Kfz-Haftpflicht"]],"erkl":"Die Vollkasko umfasst die Teilkasko-Gefahren und zusätzlich Unfall und Vandalismus.","norm":"AKB A.2","id":"6.1-2-3"}]}]},{"nr":"6.2","titel":"Bedarfe analysieren, Risikoprävention und Absicherung","lf":"LF 6","buch":"S. 271–273","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Schäden sind in der Teilkasko versichert?","aussagen":[["Diebstahl des Fahrzeugs",true],["Zusammenstoß mit Haarwild",true],["Glasbruch an der Windschutzscheibe",true],["Unfall durch eigenes Verschulden",false],["mutwillige Beschädigung durch Unbekannte (Vandalismus)",false]],"erkl":"Unfall und Vandalismus sind Vollkasko-Gefahren.","norm":"AKB A.2.2","id":"6.2-1-1"},{"typ":"mc","frage":"Was ersetzt die Kfz-Haftpflichtversicherung NICHT?","optionen":["Vermögensschäden des Unfallgegners","Sachschäden am Fahrzeug des Unfallgegners","Personenschäden des Unfallgegners","Schäden am eigenen versicherten Fahrzeug"],"richtig":[3],"erkl":"Eigenschäden am Fahrzeug deckt nur die Kaskoversicherung.","norm":"AKB A.1","id":"6.2-1-2"},{"typ":"mc","frage":"Welchen Nutzen hat eine Auslandsreisekrankenversicherung zusätzlich zur gesetzlichen Krankenversicherung?","optionen":["Sie erstattet den Reisepreis, wenn der Veranstalter die Reise kurzfristig absagt.","Sie zahlt während der Reise die Beiträge zur gesetzlichen Krankenversicherung.","Sie übernimmt z. B. Behandlungen außerhalb der EU und einen sinnvollen Rücktransport.","Sie kann nur für Geschäftsreisen außerhalb Europas abgeschlossen werden."],"richtig":[2],"erkl":"Die gesetzliche Krankenversicherung zahlt keinen Rücktransport und im Ausland nur eingeschränkt.","norm":"SGB V","id":"6.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Schadenereignis die passende Reiseversicherung zu.","paare":[["Die Kundin erkrankt schwer vor Reiseantritt und muss stornieren.","Reiserücktrittsversicherung"],["Der Kunde muss die Reise wegen eines Unfalls vorzeitig beenden.","Reiseabbruchversicherung"],["Der Koffer wird am Urlaubsort gestohlen.","Reisegepäckversicherung"],["Arztbesuch im Urlaub in den USA","Auslandsreisekrankenversicherung"]],"erkl":"Jede Reiseversicherung deckt einen anderen Abschnitt der Reise.","norm":"VB-Reise","id":"6.2-1-4"},{"typ":"mc","frage":"Wie beeinflusst ein Telematiktarif die Kfz-Prämie?","optionen":["Der Versicherungsschutz entfällt nach jeder zu schnellen Fahrt.","Vorausschauendes Fahren wird mit einem Beitragsnachlass belohnt.","Die Prämie steigt für alle Kunden mit Telematik automatisch an.","Die Prämie richtet sich nur nach dem Kilometerstand bei Vertragsbeginn."],"richtig":[1],"erkl":"Telematik bewertet Daten zu Beschleunigung, Bremsen, Geschwindigkeit und Fahrzeit.","norm":"Tarifbestimmungen","id":"6.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ehepaar Brenner bucht für 9.600 € eine Kreuzfahrt in die Karibik, Abreise in fünf Monaten. Sie fragen, welche Versicherungen sinnvoll sind. Herr Brenner hat eine Herzerkrankung, die gut eingestellt ist.","items":[{"typ":"mc","frage":"Welche Versicherung schützt die Brenners, wenn sie die Reise wegen einer plötzlichen schweren Erkrankung absagen müssen?","optionen":["Reiserücktrittsversicherung","Reiseabbruchversicherung","Reisegepäckversicherung","Auslandsreisekrankenversicherung"],"richtig":[0],"erkl":"Sie ersetzt die vertraglich geschuldeten Stornokosten bei versicherten Rücktrittsgründen.","norm":"VB-Reise, Rücktritt","id":"6.2-2-1"},{"typ":"mc","frage":"Worauf müssen Sie wegen der Herzerkrankung besonders achten?","optionen":["Herr Brenner darf wegen der Erkrankung keine Reiseversicherung abschließen.","Die Erkrankung spielt keine Rolle, weil sie medikamentös gut eingestellt ist.","Bekannte Vorerkrankungen sind stets ohne Prüfung mitversichert.","Bekannte Vorerkrankungen können nach den Bedingungen ausgeschlossen sein."],"richtig":[3],"erkl":"Viele Tarife enthalten Regelungen zu bekannten Erkrankungen; das muss in der Beratung offengelegt werden.","norm":"§ 61 VVG","id":"6.2-2-2"},{"typ":"mc","frage":"Warum ist für die Karibikreise eine Auslandsreisekrankenversicherung besonders wichtig?","optionen":["Weil eine solche Versicherung für Kreuzfahrten in die Karibik gesetzlich vorgeschrieben ist.","Weil die Reiserücktrittsversicherung Arztkosten nur innerhalb Europas übernimmt.","Weil die GKV außerhalb von EU, EWR und Abkommensstaaten sowie an Bord grundsätzlich nicht zahlt.","Weil die GKV im Ausland Behandlungen nur bis zu einem Höchstbetrag von 5.000 € erstattet."],"richtig":[2],"erkl":"Behandlung und Rücktransport können sehr teuer werden. Zur Karibik gehören zwar auch EU-Gebiete (z. B. Guadeloupe); die Leistung an Bord und der Rücktransport bleiben trotzdem ungedeckt.","norm":"SGB V","id":"6.2-2-3"}]}]},{"nr":"6.3","titel":"Rechtliche Regelungen zu Mobilität und Reisen","lf":"LF 6","buch":"S. 274–294","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie der Rechtsgrundlage ihre Aussage zu.","paare":[["§ 7 StVG","Der Halter haftet verschuldensunabhängig für Schäden beim Betrieb seines Kfz (außer bei höherer Gewalt)."],["§ 18 StVG","Der Fahrer haftet, wenn er nicht beweist, dass ihn kein Verschulden trifft."],["§ 115 VVG","Der Geschädigte kann seinen Anspruch direkt gegen den Kfz-Haftpflichtversicherer geltend machen."],["§ 1 PflVG","Der Halter muss für sein Kfz eine Haftpflichtversicherung abschließen."]],"erkl":"Halterhaftung, Fahrerhaftung, Direktanspruch und Versicherungspflicht greifen ineinander.","norm":"StVG, VVG, PflVG","id":"6.3-1-1"},{"typ":"mc","frage":"Ein Fahrer verursacht alkoholbedingt einen Unfall (Obliegenheitsverletzung vor dem Versicherungsfall). Was gilt in der Kfz-Haftpflicht?","optionen":["Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer bis zu 2.500 € in Regress.","Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer bis zu 5.000 € in Regress.","Der Versicherer ist leistungsfrei; der Geschädigte muss sich an den Fahrer halten.","Der Versicherer zahlt dem Geschädigten und nimmt den Fahrer unbegrenzt in Regress."],"richtig":[1],"erkl":"Im Außenverhältnis bleibt der Versicherer zur Leistung verpflichtet; im Innenverhältnis ist die Leistungsfreiheit auf 5.000 € begrenzt.","norm":"§ 117 VVG, § 5 Abs. 3 KfzPflVV, AKB D","id":"6.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Ausgleichszahlung bei Flugausfall oder großer Verspätung nach der Fluggastrechte-VO zu.","paare":[["bis 1.500 km","250 €"],["über 1.500 km innerhalb der EU und andere Flüge bis 3.500 km","400 €"],["über 3.500 km außerhalb der EU","600 €"]],"erkl":"Der Anspruch besteht gegen die Fluggesellschaft, nicht gegen den Reiseversicherer. Stand Oktober 2026: Eine Reform ist beschlossen, aber noch nicht in Kraft.","norm":"Art. 7 VO (EG) Nr. 261/2004","id":"6.3-1-3"},{"typ":"mc","frage":"Wie wird ein Pauschalreisender vor der Insolvenz des Reiseveranstalters geschützt?","optionen":["Der Veranstalter muss die Kundengelder absichern und einen Sicherungsschein aushändigen.","Gar nicht, das Insolvenzrisiko des Reiseveranstalters trägt allein der Kunde selbst.","Durch eine Reiserücktrittsversicherung, die der Veranstalter abschließen muss.","Durch die Reisegepäckversicherung, die bei einer Insolvenz den Reisepreis erstattet."],"richtig":[0],"erkl":"Die Insolvenzabsicherung ist für Pauschalreisen vorgeschrieben.","norm":"§ 651r BGB","id":"6.3-1-4"},{"typ":"mc","frage":"Innerhalb welcher Frist muss ein Kfz-Versicherungsfall dem Versicherer in der Regel angezeigt werden?","optionen":["Innerhalb von drei Monaten","Innerhalb eines Monats","Innerhalb von zwei Wochen","Innerhalb einer Woche"],"richtig":[3],"erkl":"Die AKB sehen eine Anzeige innerhalb einer Woche vor.","norm":"AKB E.1.1.1","id":"6.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kaya verkauft seinen Pkw an Frau Jung. Am Tag nach der Übergabe verursacht Frau Jung mit dem Wagen, der noch auf Herrn Kaya zugelassen und versichert ist, einen Unfall. Herr Kaya hat den Verkauf seinem Versicherer noch nicht gemeldet.","items":[{"typ":"mc","frage":"Was geschieht mit Herrn Kayas Kfz-Versicherung durch den Verkauf?","optionen":["Sie bleibt bei Herrn Kaya, bis das Fahrzeug auf Frau Jung umgemeldet worden ist.","Sie endet mit der Übergabe der Schlüssel; Herr Kaya muss den Verkauf nicht anzeigen.","Sie geht auf die Erwerberin über; Herr Kaya muss den Verkauf unverzüglich anzeigen.","Sie ruht, bis Frau Jung bei ihrem Versicherer einen Antrag stellt."],"richtig":[2],"erkl":"Die Regeln zur Veräußerung gelten auch in der Kfz-Versicherung; die AKB enthalten ergänzende Bestimmungen.","norm":"§§ 95–97 VVG, AKB G.7","id":"6.3-2-1"},{"typ":"mc","frage":"Wer ersetzt dem Unfallgegner den Schaden?","optionen":["Frau Jungs eigene Privathaftpflicht, weil sie den Unfall verursacht hat.","Der bisherige Kfz-Haftpflichtversicherer, weil der Vertrag übergegangen ist.","Herr Kaya persönlich, weil er den Verkauf nicht rechtzeitig gemeldet hat.","Niemand, weil das Fahrzeug nach dem Verkauf nicht mehr versichert war."],"richtig":[1],"erkl":"Der Geschädigte kann sich direkt an den Kfz-Haftpflichtversicherer wenden.","norm":"§ 115 VVG, § 95 VVG","id":"6.3-2-2"},{"typ":"mc","frage":"Was sollten Herr Kaya und Frau Jung jetzt tun?","optionen":["Verkauf und Unfall dem Versicherer melden und klären, ob Frau Jung den Vertrag fortführt.","Nichts tun und abwarten, ob der Unfallgegner überhaupt Ansprüche geltend macht.","Frau Jung schließt sofort einen neuen Vertrag ab, der dann rückwirkend den Unfall bezahlt.","Nur den Unfall melden; der Verkauf wird erst bei der späteren Ummeldung angezeigt."],"richtig":[0],"erkl":"Anzeige der Veräußerung und des Versicherungsfalls; die Erwerberin hat ein Kündigungsrecht.","norm":"§§ 96, 97 VVG, AKB E.1","id":"6.3-2-3"}]}]},{"nr":"6.4","titel":"Prüfungsfälle: Kraftfahrt","lf":"LF 6","buch":"S. 270–288","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Yıldız – Antrag und Mindestdeckung","situation":"Sevda Yıldız (23) aus Halle (Saale) beantragt am Montag, 5. Oktober 2026, schriftlich bei der Proximus Versicherung AG eine Kfz-Haftpflichtversicherung und eine Vollkasko für ihren gebrauchten Pkw. Sie war noch nie bei der Proximus versichert. Ihr bisheriger Versicherer, die Nordhafen Versicherung AG, hatte ihr im Frühjahr nach einem Unfall gekündigt. Ihr Bruder Deniz betreut beim Fußballverein den Vereinsbus mit 20 Sitzplätzen ohne den Fahrersitz und fragt nach den gesetzlichen Mindestversicherungssummen.","items":[{"typ":"mc","frage":"Darf die Proximus den Antrag von Frau Yıldız auf Kfz-Haftpflichtversicherung ablehnen?","optionen":["Nein, denn ein gesetzlicher Ablehnungsgrund fehlt: Gekündigt hat ein anderer Versicherer.","Ja, denn ein Vorversicherer hat ihr nach einem Schadenfall den Vertrag gekündigt.","Ja, Kfz-Versicherer dürfen Anträge von Fahranfängern unter 25 Jahren stets ablehnen.","Nein, aber nur, wenn Frau Yıldız den ersten Beitrag schon mit dem Antrag zahlt."],"richtig":[0],"erkl":"Für die Kfz-Haftpflicht besteht Annahmezwang. Ablehnen darf der Versicherer nur bei Beschränkungen im Geschäftsplan oder wenn er selbst den Antragsteller früher versichert und z. B. nach einem Versicherungsfall gekündigt hat. Die Kündigung der Nordhafen zählt nicht.","norm":"§ 5 Abs. 2 und 4 PflVG","id":"6.4-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Antrag von Frau Yıldız treffen zu?","aussagen":[["Lehnt die Proximus den Haftpflichtantrag nicht innerhalb von zwei Wochen ab Eingang schriftlich ab und macht sie kein abweichendes schriftliches Angebot, gilt er zum allgemeinen Unternehmenstarif als angenommen.",true],["Für die Fristwahrung genügt es, dass die Proximus die Ablehnung rechtzeitig absendet.",true],["Der Annahmezwang gilt auch für die beantragte Vollkasko.",false],["Wäre der Pkw ein Taxi, würde der Antrag nach zwei Wochen ohne Antwort ebenso als angenommen gelten.",false]],"erkl":"Die Annahmefiktion gilt für Zweiräder, Pkw und Kombis bis eine Tonne Nutzlast, nicht für Taxen und Mietwagen. Der Kontrahierungszwang betrifft nur die Pflichtversicherung, also die Kfz-Haftpflicht, nicht die Kasko.","norm":"§ 5 Abs. 2 und 3 PflVG","id":"6.4-1-2"},{"typ":"zahl","frage":"Wie hoch ist die gesetzliche Mindestversicherungssumme für Personenschäden je Schadensfall beim Vereinsbus (20 Sitzplätze ohne Fahrersitz)? Geben Sie den Betrag in Euro an.","wert":8050000,"einheit":"€","tol":0.01,"erkl":"Grundbetrag 7.500.000 €; ab dem 10. Platz (ohne Fahrersitz) je Platz 50.000 € mehr. Plätze 10 bis 20 = 11 Plätze: 11 × 50.000 € = 550.000 €; 7.500.000 € + 550.000 € = 8.050.000 €.","norm":"§ 4 Abs. 2 PflVG mit Anlage Nr. 1 und 2","id":"6.4-1-3"},{"typ":"zuo","frage":"Ordnen Sie den Schadenarten die gesetzliche Mindestversicherungssumme je Schadensfall für den Pkw von Frau Yıldız zu.","paare":[["Personenschäden","7.500.000 €"],["Sachschäden","1.300.000 €"],["reine Vermögensschäden","50.000 €"]],"erkl":"Die Mindestsummen für Kraftfahrzeuge stehen in der Anlage zum PflVG. Viele Verträge bieten freiwillig deutlich höhere Summen, z. B. 100 Mio. € pauschal.","norm":"§ 4 Abs. 2 PflVG mit Anlage Nr. 1","id":"6.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Nowak – Fahrzeugwechsel mit eVB","situation":"Piotr Nowak (41) aus Halle (Saale) kauft am Freitag, 2. Oktober 2026, beim Händler einen gebrauchten SUV. Er beantragt bei der Proximus Kfz-Haftpflicht und Vollkasko und erhält sofort eine eVB-Nummer. Die Proximus sagt vorläufigen Schutz nur für die Kfz-Haftpflicht zu, nicht für die Kasko. Am Montag, 5. Oktober, wird der SUV zugelassen. Am Freitag, 9. Oktober, geht ihm der Versicherungsschein mit der ersten Beitragsrechnung zu. Laut seinen Bedingungen entfällt der vorläufige Schutz rückwirkend, wenn er den ersten Beitrag nicht innerhalb von 14 Tagen nach Zugang des Versicherungsscheins zahlt und dies zu vertreten hat. Seinen alten Kombi (ebenfalls bei der Proximus, Haftpflicht und Teilkasko) lässt er am 5. Oktober außer Betrieb setzen und stellt ihn bis zum Verkauf in seine abschließbare Garage. Laut Bedingungen geht der Vertrag dann in eine beitragsfreie Ruheversicherung über (Haftpflicht und Teilkasko), wenn das Fahrzeug in einem Einstellraum oder auf einem umfriedeten Abstellplatz steht.","items":[{"typ":"mc","frage":"Ab wann hat Herr Nowak für den SUV vorläufigen Schutz in der Kfz-Haftpflicht?","optionen":["spätestens mit der Zulassung am 5. Oktober mit der eVB","erst mit dem Zugang des Versicherungsscheins am 9. Oktober","erst mit der Zahlung des ersten Beitrags nach der Zulassung","schon mit dem Kaufvertrag beim Händler am 2. Oktober"],"richtig":[0],"erkl":"Mit der Versicherungsbestätigung sagt der Versicherer vorläufigen Haftpflichtschutz zu. Er beginnt zum vereinbarten Zeitpunkt, spätestens mit der Zulassung unter Verwendung der eVB; die Zahlung ist dafür nicht Voraussetzung.","norm":"AKB 2015 (GDV-Muster) B.2.1, §§ 49–52 VVG","id":"6.4-2-1"},{"typ":"wf","frage":"Am 7. Oktober streift Herr Nowak beim Einparken mit dem SUV einen städtischen Poller. Am Poller und am SUV entstehen Schäden. Welche Aussagen treffen zu?","aussagen":[["Den Schaden am Poller reguliert die Proximus aus der vorläufigen Kfz-Haftpflicht.",true],["Den Schaden am SUV ersetzt die Proximus aus der Vollkasko, weil Herr Nowak sie beantragt hat.",false],["Ohne ausdrückliche Zusage umfasst der vorläufige Schutz keine Kaskoversicherung.",true]],"erkl":"Die eVB löst vorläufigen Schutz für die Kfz-Haftpflicht aus. Kasko ist vorläufig nur versichert, wenn der Versicherer das ausdrücklich zusagt; der Eigenschaden am SUV ist daher bis zum Beginn der Vollkasko nicht gedeckt.","norm":"AKB 2015 (GDV-Muster) B.2.1 und B.2.2","id":"6.4-2-2"},{"typ":"mc","frage":"Bis wann muss Herr Nowak den ersten Beitrag spätestens zahlen, damit der vorläufige Schutz nicht rückwirkend entfällt?","optionen":["Freitag, 23. Oktober 2026","Donnerstag, 22. Oktober 2026","Montag, 19. Oktober 2026","Montag, 26. Oktober 2026"],"richtig":[0],"erkl":"Der Tag des Zugangs (Freitag, 9. Oktober) zählt nicht mit. Die 14-Tage-Frist läuft vom 10. bis zum Ablauf des 23. Oktober 2026, eines Freitags; § 193 BGB greift daher nicht. Maßgeblich ist der Zugang des Versicherungsscheins, nicht die Zulassung am 5. Oktober.","norm":"§§ 187 Abs. 1, 188 Abs. 1 BGB, AKB 2015 (GDV-Muster) B.2.4","id":"6.4-2-3"},{"typ":"mc","frage":"Am 20. Oktober drückt ein Sturm das Garagentor ein; das Tor beschädigt den abgemeldeten Kombi. Was gilt für den Kombi?","optionen":["Die Proximus leistet aus der Teilkasko der Ruheversicherung, weil Sturm eine Teilkasko-Gefahr ist.","Die Proximus leistet nicht, weil für abgemeldete Fahrzeuge kein Versicherungsschutz mehr besteht.","Die Proximus leistet aus der Vollkasko des neuen SUV, weil beide Fahrzeuge Herrn Nowak gehören.","Nur die Wohngebäudeversicherung ersetzt den Schaden am Kombi, weil er in der Garage stand."],"richtig":[0],"erkl":"Nach der Außerbetriebsetzung besteht laut Bedingungen eine Ruheversicherung mit Haftpflicht und Teilkasko, wenn der Wagen in einem Einstellraum steht. Sturm gehört zu den Teilkasko-Gefahren; die Gebäudeversicherung deckt das Tor, nicht das Auto.","norm":"AKB 2015 (GDV-Muster) H.1 (Ruheversicherung), A.2.2.1 (Sturm)","id":"6.4-2-4"},{"typ":"zuo","frage":"Ordnen Sie den Unterlagen und Meldungen rund um den Fahrzeugwechsel die passende Aussage zu.","paare":[["elektronische Versicherungsbestätigung (eVB)","wird vom Versicherer elektronisch an die Zulassungsbehörde übermittelt oder zum Abruf bereitgehalten"],["Zulassungsbescheinigung Teil I","ist von der Person, die das Fahrzeug führt, mitzuführen"],["Bescheinigung über den Schadenverlauf","erhält der Versicherungsnehmer bei Vertragsende oder auf Verlangen innerhalb von 15 Tagen"],["Anzeige des Versicherers an die Zulassungsbehörde über fehlenden Versicherungsschutz","beendet die Haftung gegenüber Dritten einen Monat nach der Anzeige"]],"erkl":"Die eVB ersetzt die frühere Papierdoppelkarte. Die Schadenverlaufsbescheinigung braucht ein neuer Versicherer für die SF-Einstufung. Gegenüber Geschädigten wirkt das Vertragsende erst einen Monat nach der Anzeige an die Zulassungsbehörde (Nachhaftung).","norm":"§ 49 FZV, § 13 Abs. 6 FZV, § 5c Abs. 1 PflVG, § 117 Abs. 2 VVG","id":"6.4-2-5"}]},{"typ":"situation","titel":"Fall 3: Frau Brandt verkauft ihren Pkw","situation":"Helga Brandt (67) aus Halle (Saale) verkauft ihren Pkw am Dienstag, 15. September 2026, an Jannik Weber und übergibt ihm Wagen und Papiere. Der Pkw ist bei der Proximus haftpflicht- und teilkaskoversichert. Frau Brandt hat den Jahresbeitrag von 876,00 € für das Versicherungsjahr 1. Januar bis 31. Dezember 2026 im Voraus bezahlt. Herr Weber kündigt den übergegangenen Vertrag wirksam zum 30. September 2026 (24 Uhr). Laut Bedingungen rechnet die Proximus bei vorzeitigem Vertragsende den Beitrag nach vollen Monaten ab.","items":[{"typ":"mc","frage":"Welche Rechtsfolge hat der Verkauf am 15. September für Frau Brandts Kfz-Versicherung?","optionen":["Herr Weber tritt in die Rechte und Pflichten aus dem Vertrag ein; er läuft weiter.","Der Vertrag endet automatisch mit der Übergabe von Wagen und Papieren an Herrn Weber.","Der Vertrag ruht, bis Herr Weber bei der Proximus einen eigenen Antrag stellt.","Der Vertrag bleibt bei Frau Brandt und erlischt erst mit Ablauf des Versicherungsjahres."],"richtig":[0],"erkl":"Bei Veräußerung der versicherten Sache tritt der Erwerber kraft Gesetzes in den Vertrag ein. Die AKB übernehmen diese Regel für das Kfz.","norm":"§ 95 Abs. 1 VVG, AKB G.7","id":"6.4-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Verkauf treffen zu?","aussagen":[["Bis zur Kündigung haften Frau Brandt und Herr Weber für die Prämie der laufenden Versicherungsperiode als Gesamtschuldner.",true],["Nach der Kündigung durch Herrn Weber schuldet allein Frau Brandt die Prämie; Herr Weber haftet dafür nicht.",true],["Die Proximus muss den Eintritt von Herrn Weber erst gegen sich gelten lassen, wenn sie davon Kenntnis erlangt.",true],["Unterbleibt die Anzeige des Verkaufs, ist die Proximus in der Kfz-Haftpflicht auch gegenüber einem Unfallopfer leistungsfrei.",false]],"erkl":"Veräußerer und Erwerber haften gemeinsam für die laufende Prämie; wird gekündigt, zahlt nur der Veräußerer. Eine mögliche Leistungsfreiheit wirkt in der Pflichtversicherung nur im Innenverhältnis; gegenüber dem Geschädigten bleibt der Versicherer verpflichtet.","norm":"§§ 95 Abs. 2 und 3, 96 Abs. 3, 117 Abs. 1 VVG","id":"6.4-3-2"},{"typ":"zuo","frage":"Ordnen Sie den Vorgängen nach einer Fahrzeugveräußerung die gesetzliche Regel zu.","paare":[["Anzeige der Veräußerung","unverzüglich durch Veräußerer oder Erwerber"],["Kündigung durch den Erwerber","mit sofortiger Wirkung oder zum Schluss der laufenden Versicherungsperiode"],["Kündigung durch den Versicherer gegenüber dem Erwerber","mit einer Frist von einem Monat"],["Erwerber schließt eine neue Kfz-Haftpflicht ab, ohne den alten Vertrag zu kündigen","der übergegangene Vertrag gilt mit Beginn des neuen als gekündigt"]],"erkl":"Die Kündigungsrechte erlöschen jeweils, wenn sie nicht innerhalb eines Monats ausgeübt werden. Für die Kfz-Haftpflicht ergänzt das PflVG eine Kündigungsfiktion.","norm":"§§ 96, 97 Abs. 1 VVG, § 5a Abs. 2 PflVG","id":"6.4-3-3"},{"typ":"zahl","frage":"Welchen Betrag erstattet die Proximus Frau Brandt nach dem Vertragsende zum 30. September 2026? Geben Sie den Betrag in Euro an.","wert":219.0,"einheit":"€","tol":0.01,"erkl":"Der Versicherer erhält nur die Prämie für die Zeit mit Versicherungsschutz: 876,00 € : 12 = 73,00 € je Monat; Januar bis September = 9 Monate = 657,00 €. Erstattung: 876,00 € − 657,00 € = 219,00 € an Frau Brandt, die als Veräußererin die Prämie schuldet und gezahlt hat.","norm":"§ 39 Abs. 1 VVG, § 96 Abs. 3 VVG","id":"6.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Hampel – Zweiräder und Saisonkennzeichen","situation":"Rüdiger Hampel (52) aus Halle (Saale) fährt ein Motorrad mit Saisonkennzeichen für den Betriebszeitraum 04–10 (April bis Oktober). Es ist bei der Proximus haftpflicht- und teilkaskoversichert. Laut Bedingungen gelten außerhalb der Saison die Regeln der Ruheversicherung: Haftpflicht und Teilkasko bestehen weiter, wenn das Motorrad in einem Einstellraum oder auf einem umfriedeten Abstellplatz steht und nicht gefahren wird. Tochter Lea (15) kauft am Donnerstag, 15. Oktober 2026, einen E-Scooter und erhält von der Proximus eine Versicherungsplakette. Ehefrau Sabine schwankt zwischen einem Pedelec (Unterstützung bis 25 km/h) und einem S-Pedelec (Unterstützung bis 45 km/h).","items":[{"typ":"zahl","frage":"In wie vielen Monaten des Jahres darf Herr Hampel sein Motorrad auf öffentlichen Straßen in Betrieb setzen und dort abstellen?","wert":7,"einheit":"Monate","tol":0,"erkl":"Der Betriebszeitraum April bis Oktober umfasst 7 volle Monate. Nur in diesem Zeitraum darf das Fahrzeug auf öffentlichen Straßen gefahren oder abgestellt werden; zulässig sind Zeiträume von 2 bis 11 Monaten.","norm":"§ 10 Abs. 3 FZV","id":"6.4-4-1"},{"typ":"mc","frage":"Im Januar 2027 wird das Motorrad aus Herrn Hampels abgeschlossener Einzelgarage gestohlen. Was gilt?","optionen":["Die Proximus leistet aus der Teilkasko, weil außerhalb der Saison die Regeln der Ruheversicherung gelten.","Die Proximus leistet nicht, weil außerhalb des Betriebszeitraums gar kein Versicherungsschutz besteht.","Die Proximus leistet nur aus der Kfz-Haftpflicht, weil die Teilkasko im Winter vollständig ruht.","Die Proximus leistet nur, wenn Herr Hampel den Diebstahl erst in der nächsten Saison anzeigt."],"richtig":[0],"erkl":"Außerhalb der Saison besteht laut Bedingungen Ruheversicherung mit Haftpflicht und Teilkasko, solange das Fahrzeug in einem Einstellraum steht. Diebstahl (Entwendung) ist eine Teilkasko-Gefahr; der Schaden ist unverzüglich anzuzeigen.","norm":"AKB H.2 (Saisonkennzeichen), AKB H.1, AKB A.2.2.1","id":"6.4-4-2"},{"typ":"zahl","frage":"Wie viele Kalendertage gilt Leas Versicherungsplakette, wenn man den 15. Oktober 2026 mitzählt?","wert":137,"einheit":"Tage","tol":0,"erkl":"Das Verkehrsjahr läuft vom 1. März bis zum Ablauf des Februars des Folgejahres; die Plakette gilt also bis 28. Februar 2027. Oktober 17 + November 30 + Dezember 31 + Januar 31 + Februar 28 = 137 Tage.","norm":"§ 56 Abs. 2 FZV i. V. m. § 52 Abs. 1 FZV","id":"6.4-4-3"},{"typ":"zuo","frage":"Ordnen Sie dem Fahrzeug der Familie den passenden Nachweis bzw. die passende Kennzeichnung zu.","paare":[["S-Pedelec mit Unterstützung bis 45 km/h","Versicherungskennzeichen: Schild mit Erkennungsnummer und Verkehrsjahr"],["E-Scooter (Elektrokleinstfahrzeug)","Versicherungsplakette: Aufkleber mit fälschungserschwerendem Hologramm"],["Motorrad, nur im Sommer genutzt","amtliches Saisonkennzeichen mit Betriebszeitraum in vollen Monaten"],["Pedelec mit Unterstützung bis 25 km/h","kein Kennzeichen, denn es gilt rechtlich als Fahrrad"]],"erkl":"S-Pedelecs sind Kleinkrafträder und brauchen ein Versicherungskennzeichen; für E-Scooter ist die Plakette der Versicherungsnachweis. Pedelecs bis 25 km/h mit höchstens 0,25 kW sind keine Kraftfahrzeuge; Haftpflichtschäden mit dem Pedelec deckt die Privathaftpflicht.","norm":"§§ 4 Abs. 3, 52 Abs. 2, 56 Abs. 2 FZV, § 10 Abs. 3 FZV, § 1 Abs. 3 StVG","id":"6.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Unfall mit dem geliehenen Wagen","situation":"Lukas Engel (29) aus Halle (Saale) ist Halter und Versicherungsnehmer eines Pkw, der bei der Proximus haftpflichtversichert ist. Er leiht den Wagen seiner Freundin Mira Haddad für einen Einkauf. Ohne sein Wissen fährt sie danach mit 1,2 Promille zu Freunden und übersieht den Radfahrer Karl Obst (63). Herr Obst wird verletzt, sein Rad ist zerstört. Er verlangt insgesamt 18.400,00 € (Behandlung, Verdienstausfall, Schmerzensgeld, Fahrrad). Die Proximus zahlt den Betrag.","items":[{"typ":"mc","frage":"Haftet Herr Engel als Halter gegenüber Herrn Obst, obwohl er selbst nicht gefahren ist?","optionen":["Ja, der Halter haftet ohne Verschulden für Schäden beim Betrieb seines Kfz; er hat ihn überlassen.","Nein, ohne eigenes Verschulden haftet nur Frau Haddad als Fahrerin des Wagens gegenüber Herrn Obst.","Nein, weil Frau Haddad den Wagen alkoholisiert ohne sein Wissen gefahren hat (Schwarzfahrt).","Ja, aber nur bis zur Höhe des Zeitwerts seines Pkw, weil er nicht selbst gefahren ist."],"richtig":[0],"erkl":"Die Halterhaftung ist eine Gefährdungshaftung. Eine Schwarzfahrt liegt nicht vor, wenn der Halter dem Fahrer das Fahrzeug überlassen hat.","norm":"§ 7 Abs. 1 und 3 StVG","id":"6.4-5-1"},{"typ":"wf","frage":"Welche Aussagen zum Anspruch von Herrn Obst treffen zu?","aussagen":[["Herr Obst kann seinen Schadensersatzanspruch direkt gegen die Proximus geltend machen.",true],["Die Proximus und Herr Engel als ersatzpflichtiger Versicherungsnehmer haften Herrn Obst als Gesamtschuldner.",true],["Die Proximus darf die Zahlung an Herrn Obst verweigern, weil die Fahrerin alkoholisiert war.",false],["Die Proximus muss den Schadensersatz in Geld leisten.",true]],"erkl":"In der Kfz-Pflichtversicherung hat der Geschädigte einen Direktanspruch gegen den Versicherer. Eine Leistungsfreiheit wegen Alkohols wirkt nur im Innenverhältnis; gegenüber dem Dritten bleibt die Leistungspflicht bestehen.","norm":"§ 115 Abs. 1 VVG, § 117 Abs. 1 VVG","id":"6.4-5-2"},{"typ":"zahl","frage":"Wie viel Euro kann die Proximus von Frau Haddad wegen der Trunkenheitsfahrt höchstens zurückfordern?","wert":5000.0,"einheit":"€","tol":0.01,"erkl":"Fahren unter Alkohol ist eine Obliegenheitsverletzung vor dem Versicherungsfall. Die Leistungsfreiheit ist gegenüber VN und mitversicherten Personen auf höchstens 5.000 € je Person begrenzt. Gegen Herrn Engel besteht kein Regress, weil er die Fahrt weder begangen noch schuldhaft ermöglicht hat.","norm":"§ 5 Abs. 1 Nr. 5, Abs. 2 und 3 KfzPflVV","id":"6.4-5-3"},{"typ":"zuo","frage":"Ordnen Sie dem Sachverhalt die zutreffende Rechtsfolge zu.","paare":[["Der Fahrer verursacht mit 1,4 Promille einen Unfall.","Regress beim Fahrer höchstens 5.000 €"],["Der VN macht nach dem Unfall grob fahrlässig unvollständige Angaben zum Hergang; das erschwert die Feststellung des Schadens.","Leistungsfreiheit gegenüber dem VN höchstens 2.500 €"],["Ein Dieb verursacht mit dem gestohlenen Wagen einen Unfall.","Regress beim Fahrer ohne die 5.000-€-Grenze"],["Ein Aufsitzrasenmäher mit höchstens 15 km/h beschädigt ein parkendes Auto.","keine Gefährdungshaftung des Halters nach § 7 StVG"]],"erkl":"Die KfzPflVV begrenzt den Regress bei Obliegenheitsverletzungen vor dem Versicherungsfall auf 5.000 €, danach in der Regel auf 2.500 € (bei besonders schwerwiegender vorsätzlicher Verletzung 5.000 €); für einen Fahrer, der das Fahrzeug durch eine Straftat erlangt hat, gilt die Grenze nicht. Fahrzeuge bis 20 km/h fallen nicht unter § 7 StVG.","norm":"§ 5 Abs. 3, § 6 Abs. 1 KfzPflVV, § 8 Nr. 1 StVG","id":"6.4-5-4"}]},{"typ":"situation","titel":"Fall 6: Frau Petersen – Kaskoschäden und Auslandsfahrt","situation":"Annika Petersen (34) aus Halle (Saale) hat ihren fünf Jahre alten Pkw bei der Proximus mit Kfz-Haftpflicht, Vollkasko (Selbstbeteiligung 500 €), Teilkasko (Selbstbeteiligung 150 €) und Autoschutzbrief versichert. Laut ihrem Vertrag gilt bei Teilkasko-Schäden die Teilkasko-Selbstbeteiligung, Teilkasko-Schäden führen nicht zu einer Rückstufung, und eine Neupreisentschädigung ist wegen des Fahrzeugalters nicht mehr vereinbart. Für den nächsten Sommer plant sie eine Urlaubsfahrt mit dem eigenen Pkw nach Montenegro.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Schadenereignis die Leistung aus Frau Petersens Vertrag zu.","paare":[["Hagel beschädigt das Dach des Pkw.","Teilkasko: 150 € Selbstbeteiligung, keine Rückstufung"],["Sie fährt beim Rückwärtsfahren selbst gegen eine Mauer.","Vollkasko: 500 € Selbstbeteiligung, Rückstufung"],["Die Batterie versagt 250 km von zu Hause; ein Pannendienst startet das Auto vor Ort.","Autoschutzbrief: Pannenhilfe am Schadenort"],["Der Motor wird ohne äußere Einwirkung durch Ölmangel zerstört.","keine Kaskoleistung, da Betriebsschaden"]],"erkl":"Hagel ist Teilkasko-Gefahr, der selbst verschuldete Unfall Vollkasko-Gefahr. Betriebs- und reine Bruchschäden sind keine Unfallschäden. Der Schutzbrief organisiert und bezahlt Hilfe bei Panne oder Unfall unterwegs.","norm":"AKB A.2.2.1, A.2.2.2, A.3","id":"6.4-6-1"},{"typ":"zahl","frage":"Frau Petersen verursacht selbst einen Unfall mit Totalschaden. Laut Gutachten beträgt der Wiederbeschaffungswert 16.400,00 €, der Restwert 3.900,00 €. Laut Vertrag zahlt die Vollkasko den Wiederbeschaffungswert abzüglich Restwert und Selbstbeteiligung. Wie hoch ist die Entschädigung in Euro?","wert":12000.0,"einheit":"€","tol":0.01,"erkl":"16.400,00 € − 3.900,00 € = 12.500,00 €; abzüglich Vollkasko-Selbstbeteiligung 500,00 € = 12.000,00 €. Der Restwert bleibt bei der Kundin (Verkauf des Wracks).","norm":"AKB 2015 (GDV-Muster) A.2.5.1 (Totalschaden), A.2.5.8 (Selbstbeteiligung)","id":"6.4-6-2"},{"typ":"mc","frage":"Ein Hagelschaden kostet laut Gutachten 2.800,00 € netto zuzüglich 19 % Umsatzsteuer. Frau Petersen lässt nicht reparieren und rechnet fiktiv ab. Laut Vertrag wird Umsatzsteuer nur ersetzt, wenn sie tatsächlich anfällt. Was zahlt die Proximus?","optionen":["2.650,00 € (Nettobetrag abzüglich Teilkasko-Selbstbeteiligung)","3.182,00 € (Bruttobetrag abzüglich Teilkasko-Selbstbeteiligung)","2.300,00 € (Nettobetrag abzüglich Vollkasko-Selbstbeteiligung)","2.800,00 € (Nettobetrag ohne jeden Abzug, da Teilkasko)"],"richtig":[0],"erkl":"Bei fiktiver Abrechnung fällt keine Umsatzsteuer an, also wird netto entschädigt: 2.800,00 € − 150,00 € = 2.650,00 €. Für Teilkasko-Schäden gilt laut Vertrag die Teilkasko-Selbstbeteiligung.","norm":"AKB 2015 (GDV-Muster) A.2.5.4 (Mehrwertsteuer), A.2.5.8 (Selbstbeteiligung)","id":"6.4-6-3"},{"typ":"wf","frage":"Frau Petersen fragt nach dem Versicherungsschutz für die Fahrt nach Montenegro. Welche Aussagen treffen zu?","aussagen":[["Die Kfz-Haftpflicht muss in Europa mindestens den in Deutschland vorgeschriebenen Umfang gewähren.",true],["Die Grüne Karte (Internationale Versicherungskarte) weist den Kfz-Haftpflichtschutz nach, nicht aber den Kaskoschutz.",true],["In den EU-Staaten genügt in der Regel das Kennzeichen als Nachweis der Kfz-Haftpflicht.",true],["Ohne mitgeführte Grüne Karte besteht im Ausland kein Kfz-Haftpflichtschutz.",false]],"erkl":"Der räumliche Geltungsbereich umfasst Europa, mit mindestens deutschem Schutzumfang. Die Karte ist nur ein Nachweis; der Schutz selbst ergibt sich aus dem Vertrag. Für Fahrten außerhalb der EU sollte sie mitgeführt werden.","norm":"§ 1 Abs. 1 KfzPflVV, § 1 Nr. 7 AuslPflVG, Art. 4 RL 2009/103/EG","id":"6.4-6-4"}]},{"typ":"situation","titel":"Fall 7: Herr Lindner – Beitrag, SF-Klasse und Fahrerkreis","situation":"Marco Lindner (46) aus Halle (Saale) ist bei der Proximus in der Kfz-Haftpflicht in SF 8 eingestuft. Laut Tarif der Proximus beträgt der Grundbeitrag (100 %) in der Haftpflicht 820,00 €. Beitragssätze: SF 4 = 55 %, SF 8 = 45 %, SF 9 = 43 %. Rückstufung bei einem Schaden im Kalenderjahr: aus SF 8 nach SF 4. Laut Bedingungen kann er eine Rückstufung vermeiden, wenn er die Entschädigung innerhalb von sechs Monaten nach Mitteilung erstattet. Vereinbart ist der Fahrerkreis „nur Versicherungsnehmer und Ehepartnerin, beide älter als 25 Jahre“. Sohn Felix (19) hat gerade den Führerschein gemacht und darf den Wagen mit Erlaubnis seines Vaters nutzen. Laut Bedingungen wird bei unrichtigem Fahrerkreis der Beitrag rückwirkend ab Beginn der laufenden Versicherungsperiode nach dem richtigen Fahrerkreis berechnet.","items":[{"typ":"zahl","frage":"Herr Lindner verursacht in diesem Jahr einen Haftpflichtschaden. Um wie viel Euro ist sein Haftpflichtbeitrag im nächsten Jahr höher, als er ohne Schaden gewesen wäre?","wert":98.4,"einheit":"€","tol":0.01,"erkl":"Ohne Schaden: SF 9 = 43 % von 820,00 € = 352,60 €. Mit Schaden: SF 4 = 55 % von 820,00 € = 451,00 €. Differenz: 451,00 € − 352,60 € = 98,40 €.","norm":"AKB 2015 (GDV-Muster) I.3.2 und I.3.5 (Besser- und Rückstufung), Tarif laut Fall","id":"6.4-7-1"},{"typ":"zuo","frage":"Ordnen Sie dem Beitragsmerkmal zu, wonach es sich richtet.","paare":[["Typklasse","Schadenbilanz des Fahrzeugmodells"],["Regionalklasse","Schadenbilanz des Zulassungsbezirks, in dem der Halter wohnt"],["Schadenfreiheitsklasse","Zahl der schadenfreien Jahre des Vertrags"],["Fahrerkreis","Alter und Kreis der Personen, die das Fahrzeug fahren"]],"erkl":"Typ- und Regionalklassen werden jährlich aus der Schadenstatistik ermittelt, getrennt für Haftpflicht, Teil- und Vollkasko. SF-Klasse und Fahrerkreis sind persönliche Merkmale des Vertrags.","norm":"AKB 2015 (GDV-Muster) J.1 (Typklasse), J.2 (Regionalklasse), I (SF-System), K.4 (Merkmale zur Beitragsberechnung)","id":"6.4-7-2"},{"typ":"wf","frage":"Welche Aussagen zur Schadenfreiheitsklasse von Herrn Lindner treffen zu?","aussagen":[["Hätte Herr Lindner auch eine Vollkasko, würde ein Schaden, für den nur die Haftpflicht zahlt, die Vollkasko nicht zurückstufen.",true],["Herr Lindner kann die Rückstufung vermeiden, wenn er der Proximus die Entschädigung fristgerecht erstattet.",true],["Ist der Vertrag ein ganzes Kalenderjahr ununterbrochen und schadenfrei, wird er im Folgejahr in die nächstbessere SF-Klasse eingestuft.",true],["Ein Teilkaskoschaden führt in der Haftpflicht zur Rückstufung.",false]],"erkl":"Haftpflicht und Vollkasko haben getrennte SF-Verläufe; die Teilkasko kennt keine SF-Klassen. Durch Erstattung der Entschädigung wird der Fall so behandelt, als sei er nicht eingetreten.","norm":"AKB 2015 (GDV-Muster) I.3.2, I.4, I.5","id":"6.4-7-3"},{"typ":"mc","frage":"Felix fährt regelmäßig mit dem Wagen und verursacht einen Unfall. Was gilt?","optionen":["Die Proximus ersetzt dem Geschädigten den Schaden; Herr Lindner zahlt den Beitrag für den richtigen Fahrerkreis nach.","Die Proximus verweigert dem Geschädigten jede Zahlung, weil Felix nicht zum vereinbarten Fahrerkreis gehört.","Felix haftet allein mit seinem Vermögen, weil die Kfz-Haftpflicht nur den vereinbarten Fahrerkreis schützt.","Der Vertrag gilt rückwirkend als nicht geschlossen, und der Geschädigte muss sich an den Entschädigungsfonds wenden."],"richtig":[0],"erkl":"Der Fahrerkreis ist ein Tarifmerkmal. Die Kfz-Haftpflicht schützt jeden berechtigten Fahrer; die Folge der falschen Angabe ist laut Bedingungen die Nachberechnung des Beitrags.","norm":"§ 4 Abs. 3 Nr. 3 PflVG, AKB 2015 (GDV-Muster) K.4 (Merkmale zur Beitragsberechnung)","id":"6.4-7-4"}]}]},{"nr":"6.5","titel":"Prüfungsfälle: Reisen und Fahrrad","lf":"LF 6","buch":"S. 289–294","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Okafor storniert die Algarve-Reise","situation":"Chidi (44) und Ines Okafor aus Halle (Saale) haben mit Sohn Daniel (12) eine Pauschalreise an die Algarve (Portugal) für 3.600,00 € gebucht; Reisebeginn ist Samstag, 24. Oktober 2026. Alle drei sind über eine Reiserücktrittsversicherung (Familientarif, Versicherungssumme 3.600,00 €) versichert. Laut Bedingungen gilt bei Rücktritt wegen Krankheit ein Selbstbehalt von 20 % des erstattungsfähigen Schadens; die Reise ist unverzüglich nach Eintritt des Rücktrittsgrundes zu stornieren, Mehrkosten einer verspäteten Stornierung werden nicht erstattet. Stornostaffel des Veranstalters: bis 30. Tag vor Reisebeginn 25 %, 29. bis 15. Tag 40 %, 14. bis 7. Tag 60 %, ab 6. Tag 80 % des Reisepreises. Daniel erkrankt am 5. Oktober schwer; der Arzt bescheinigt noch am selben Tag, dass er die Reise nicht antreten kann. Die Familie hofft trotzdem auf Besserung und storniert erst am 12. Oktober.","items":[{"typ":"wf","frage":"Welche Aussagen zum Rücktritt der Familie Okafor treffen zu?","aussagen":[["Die unerwartete schwere Erkrankung des mitversicherten Sohnes ist ein versicherter Rücktrittsgrund.",true],["Hätte die Familie einfach keine Lust mehr auf die Reise, würde die Reiserücktrittsversicherung nicht leisten.",true],["Bei einem schweren Waldbrand am Zielort, der die Reise erheblich beeinträchtigt, kann der Veranstalter keine Entschädigung verlangen.",true],["Die Reiserücktrittsversicherung zahlt den vollen Reisepreis auch dann, wenn der Veranstalter gar keine Stornokosten verlangt.",false]],"erkl":"Versichert sind die vertraglich geschuldeten Stornokosten bei versicherten, unerwarteten Gründen. Bei unvermeidbaren, außergewöhnlichen Umständen am Zielort ist der Rücktritt ohnehin entschädigungsfrei; dann entsteht kein versicherter Schaden.","norm":"§ 651h Abs. 1 und 3 BGB, VB Reiserücktritt (laut Vertrag)","id":"6.5-1-1"},{"typ":"zahl","frage":"Welchen Betrag erstattet die Reiserücktrittsversicherung der Familie Okafor? Geben Sie den Betrag in Euro an.","wert":1152.0,"einheit":"€","tol":0.01,"erkl":"Maßgeblich ist die Stornostufe bei unverzüglicher Stornierung am 5. Oktober: 19 Tage vor Reisebeginn = 40 %. 40 % von 3.600,00 € = 1.440,00 €; abzüglich 20 % Selbstbehalt (288,00 €) = 1.152,00 €. Die Mehrkosten der Stornierung am 12. Oktober (60 %) trägt die Familie selbst.","norm":"§ 82 VVG, VB Reiserücktritt (laut Vertrag)","id":"6.5-1-2"},{"typ":"mc","frage":"Die Familie fragt, warum nicht die tatsächlich berechneten 60 % Stornokosten Grundlage der Erstattung sind. Was antworten Sie?","optionen":["Sie hätte unverzüglich am 5. Oktober stornieren müssen; die Mehrkosten durch das Abwarten sind nicht versichert.","Die Versicherung erstattet grundsätzlich nur die niedrigste Stufe der Stornostaffel, hier also 25 % des Reisepreises.","Stornokosten über 40 % gelten als unangemessen und müssen vom Reiseveranstalter selbst getragen werden.","Bei Krankheit eines Kindes erstattet die Versicherung nur die Hälfte der tatsächlich berechneten Stornokosten."],"richtig":[0],"erkl":"Der Versicherungsnehmer muss den Schaden möglichst gering halten. Laut Bedingungen ist sofort zu stornieren, sobald feststeht, dass die Reise nicht angetreten werden kann.","norm":"§ 82 Abs. 1 und 3 VVG, VB Reiserücktritt (laut Vertrag)","id":"6.5-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Ereignis zu, wer bzw. welche Absicherung dafür aufkommt.","paare":[["Daniel erkrankt vor Reisebeginn, die Reise wird storniert.","Reiserücktrittsversicherung: Stornokosten"],["Ein Familienmitglied verunglückt am Urlaubsort, die Familie reist vorzeitig heim.","Reiseabbruchversicherung: nicht genutzte Reiseleistungen und Mehrkosten der Rückreise"],["Der Reiseveranstalter wird vor Reisebeginn zahlungsunfähig.","Insolvenzabsicherung des Veranstalters (Sicherungsschein)"],["Ines Okafor wird im Urlaub privatärztlich behandelt und per Ambulanzflug heimgebracht.","Auslandsreisekrankenversicherung"]],"erkl":"Jede Absicherung deckt einen eigenen Abschnitt der Reise. Gegen die Insolvenz des Veranstalters schützt nicht eine Versicherung des Kunden, sondern die gesetzliche Kundengeldabsicherung.","norm":"§ 651r BGB, VB Reiseversicherungen (laut Vertrag)","id":"6.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Ehepaar Petrescu bricht die Kanadareise ab","situation":"Sorin (58) und Elena Petrescu aus Halle (Saale) machen eine Pauschalreise durch Kanada mit 14 Reisetagen; der Reisepreis beträgt 4.200,00 € (2.100,00 € je Person). Beide haben eine Reiseabbruchversicherung und eine Auslandsreisekrankenversicherung. Laut Bedingungen erstattet die Reiseabbruchversicherung je versicherter Person den anteiligen Reisepreis der nicht genutzten Reisetage (Reisepreis je Person : Reisetage × nicht genutzte Tage) sowie Mehrkosten der Rückreise mitreisender versicherter Personen. Die Auslandsreisekrankenversicherung zahlt Behandlungskosten und einen medizinisch sinnvollen Rücktransport; ausgeschlossen sind Behandlungen, deren Notwendigkeit bei Reiseantritt feststand. Herr Petrescu hat einen gut eingestellten Diabetes. Am 10. Reisetag bricht er sich bei einem Sturz auf einem Wanderweg das Bein; er wird im Krankenhaus behandelt und nach Hause transportiert. Frau Petrescu fliegt mit; ihre Umbuchung kostet 640,00 € mehr. Beide können 4 der 14 Reisetage nicht nutzen.","items":[{"typ":"zahl","frage":"Welchen Betrag zahlt die Reiseabbruchversicherung insgesamt? Geben Sie den Betrag in Euro an.","wert":1840.0,"einheit":"€","tol":0.01,"erkl":"Je Person: 2.100,00 € : 14 × 4 = 600,00 €; für zwei Personen 1.200,00 €. Zuzüglich Mehrkosten der Rückreise von Frau Petrescu 640,00 € = 1.840,00 €. Den Rücktransport von Herrn Petrescu zahlt die Auslandsreisekrankenversicherung.","norm":"VB Reiseabbruch (laut Vertrag)","id":"6.5-2-1"},{"typ":"zuo","frage":"Ordnen Sie der Kostenposition die zuständige Absicherung zu.","paare":[["Krankenhausbehandlung des Beinbruchs in Kanada","Auslandsreisekrankenversicherung"],["nicht genutzte Hotelnächte und Ausflüge","Reiseabbruchversicherung"],["Koffer, der auf dem Rückflug zerstört wird","Reisegepäckversicherung"],["Physiotherapie nach der Rückkehr in Halle (Saale)","gesetzliche oder private Krankenversicherung in Deutschland"]],"erkl":"Die Auslandsreisekrankenversicherung deckt die Behandlung im Ausland; nach der Rückkehr ist wieder die eigene Krankenversicherung zuständig. Die Reiseabbruchversicherung ersetzt den Wert ungenutzter Reiseleistungen.","norm":"VB Reiseversicherungen (laut Vertrag)","id":"6.5-2-2"},{"typ":"mc","frage":"Zahlt die Auslandsreisekrankenversicherung die Behandlung des Beinbruchs, obwohl Herr Petrescu Diabetiker ist?","optionen":["Ja, denn die Unfallbehandlung war bei Reiseantritt nicht absehbar; der Ausschluss erfasst sie nicht.","Nein, denn wegen der Vorerkrankung ist Herr Petrescu für die gesamte Reise vom Schutz ausgeschlossen.","Nein, denn Behandlungen in Kanada zahlt immer die gesetzliche Krankenversicherung in Deutschland.","Ja, aber nur, wenn der Diabetes vor der Reise der Reiseversicherung schriftlich gemeldet wurde."],"richtig":[0],"erkl":"Der Ausschluss betrifft nur Behandlungen, deren Notwendigkeit bei Reiseantritt feststand. Ein Sturz während der Reise ist ein unvorhersehbares Ereignis.","norm":"VB Auslandsreisekrankenversicherung (laut Vertrag)","id":"6.5-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Reiseabbruchversicherung der Petrescus treffen zu?","aussagen":[["Sie ersetzt auch die Mehrkosten für die Rückreise der mitreisenden Ehefrau.",true],["Sie übernimmt die Krankenhauskosten in Kanada.",false],["Hätte Herr Petrescu die Reise nur wegen schlechten Wetters abgebrochen, bestünde kein Anspruch.",true],["Sie erstattet nicht genutzte Reisetage nur, wenn der Reiseveranstalter zahlungsunfähig ist.",false]],"erkl":"Die Reiseabbruchversicherung leistet bei versicherten Abbruchgründen wie Unfall oder schwerer Erkrankung; Behandlungskosten gehören zur Auslandsreisekrankenversicherung.","norm":"VB Reiseabbruch (laut Vertrag)","id":"6.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Ritter – Mietwagen und Gepäck auf der Albanienreise","situation":"Paula und Jonas Ritter aus Halle (Saale) mieten auf einer Rundreise durch Albanien bei einem gewerblichen Vermieter einen Pkw. Die Haftpflichtversicherung des Mietwagens ist laut Mietvertrag auf 500.000 € je Schadenfall begrenzt; für Schäden am Mietwagen gilt eine Vollkasko mit 800,00 € Selbstbeteiligung. Ihr eigener Kfz-Vertrag bei der Proximus enthält eine Mallorca-Deckung: Bei Mietwagen gewerblicher Vermieter in Europa ergänzt die Proximus die Haftpflichtdeckung bis zu den eigenen Versicherungssummen (100 Mio. € pauschal, je geschädigte Person höchstens 15 Mio. €); Schäden am Mietwagen selbst sind nicht versichert. Ihre Reisegepäckversicherung hat eine Versicherungssumme von 3.000,00 €; Elektronik und Schmuck sind zusammen bis 25 % der Versicherungssumme versichert; ersetzt wird der Zeitwert. Diebstahl aus einem abgestellten Kfz ist nur versichert, wenn das Gepäck im verschlossenen Kofferraum liegt und die Tat zwischen 6 und 22 Uhr geschieht. Diebstähle sind unverzüglich der Polizei anzuzeigen.","items":[{"typ":"zahl","frage":"Jonas Ritter verursacht mit dem Mietwagen einen Unfall; der Personenschaden des verletzten Motorradfahrers beträgt 750.000,00 €. Welchen Betrag übernimmt die Proximus aus der Mallorca-Deckung? Geben Sie den Betrag in Euro an.","wert":250000.0,"einheit":"€","tol":0.01,"erkl":"Die Haftpflicht des Mietwagens zahlt bis 500.000 €. Die Mallorca-Deckung füllt die Differenz bis zu den eigenen Summen auf: 750.000 € − 500.000 € = 250.000 € (unter der Grenze von 15 Mio. € je Person).","norm":"Mallorca-Deckung laut Kfz-Vertrag (Zusatzbaustein)","id":"6.5-3-1"},{"typ":"mc","frage":"Bei dem Unfall entsteht am Mietwagen ein Schaden von 4.000,00 €. Was gilt?","optionen":["Die Mallorca-Deckung zahlt nicht; über die Vollkasko des Mietvertrags tragen die Ritters 800,00 € selbst.","Die Mallorca-Deckung ersetzt den Schaden am Mietwagen vollständig, weil der Vermieter gewerblich handelt.","Die Proximus zahlt aus der eigenen Vollkasko der Ritters, weil diese für jedes Fahrzeug weltweit gilt.","Die Ritters müssen den gesamten Schaden selbst zahlen, weil Albanien nicht zur Europäischen Union gehört."],"richtig":[0],"erkl":"Die Mallorca-Deckung ist eine Haftpflicht-Ergänzung und deckt keine Eigenschäden am gemieteten Fahrzeug. Dafür gilt die im Mietvertrag vereinbarte Vollkasko mit Selbstbeteiligung.","norm":"Mallorca-Deckung laut Kfz-Vertrag","id":"6.5-3-2"},{"typ":"zahl","frage":"Um 15 Uhr werden während eines Strandbesuchs aus dem verschlossenen Kofferraum gestohlen: Koffer mit Kleidung (Zeitwert 1.100,00 €), Laptop (Zeitwert 900,00 €) und Kamera (Zeitwert 350,00 €). Wie hoch ist die Entschädigung aus der Reisegepäckversicherung in Euro?","wert":1850.0,"einheit":"€","tol":0.01,"erkl":"Elektronik zusammen 900,00 € + 350,00 € = 1.250,00 €, begrenzt auf 25 % von 3.000,00 € = 750,00 €. Kleidung 1.100,00 € voll. Summe 1.100,00 € + 750,00 € = 1.850,00 € (unter der Versicherungssumme).","norm":"VB Reisegepäck (laut Vertrag)","id":"6.5-3-3"},{"typ":"wf","frage":"Welche Aussagen zum Gepäckdiebstahl treffen laut den Bedingungen der Ritters zu?","aussagen":[["Wäre das Gepäck um 23:30 Uhr aus dem Kofferraum gestohlen worden, bestünde kein Versicherungsschutz.",true],["Die Versicherung ersetzt den Neuwert der gestohlenen Sachen.",false],["Die Ritters müssen den Diebstahl unverzüglich der Polizei anzeigen.",true],["Ein Diebstahl vom sichtbar belegten Rücksitz wäre genauso versichert wie aus dem Kofferraum.",false]],"erkl":"Die Bedingungen knüpfen den Schutz bei Kfz-Diebstahl an Ort (verschlossener Kofferraum) und Zeit (6 bis 22 Uhr). Ersetzt wird der Zeitwert; die Anzeige bei der Polizei ist eine Obliegenheit nach dem Schadenfall.","norm":"VB Reisegepäck (laut Vertrag), § 28 VVG","id":"6.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Herr Hoffmann – Fahrraddiebstahl im Keller","situation":"Malte Hoffmann aus Halle (Saale) hat eine Hausratversicherung nach den VHB 2022 mit 65.000,00 € Versicherungssumme. Vereinbart ist die Klausel Fahrraddiebstahl; laut Vertrag ist die Entschädigung je Versicherungsfall auf 2 % der Versicherungssumme begrenzt, eine Selbstbeteiligung gibt es nicht. Sein Pedelec (Tretunterstützung bis 25 km/h) hat er 2024 für 2.600,00 € gekauft; ein gleichartiges neues kostet heute 2.450,00 €. Am Dienstag, 6. Oktober 2026, wird es aus dem gemeinschaftlichen Fahrradkeller des Mehrfamilienhauses gestohlen; es war mit einem Bügelschloss abgeschlossen. Aus demselben Keller verschwindet das S-Pedelec (bis 45 km/h) seiner Ehefrau Svenja, für das nur eine Kfz-Haftpflicht mit Versicherungskennzeichen besteht.","items":[{"typ":"zahl","frage":"Welche Entschädigung erhält Herr Hoffmann für sein Pedelec aus der Hausratversicherung? Geben Sie den Betrag in Euro an.","wert":1300.0,"einheit":"€","tol":0.01,"erkl":"Die Hausratversicherung ersetzt den Wiederbeschaffungspreis neuwertiger Sachen (2.450,00 €), höchstens aber die vereinbarte Grenze: 2 % von 65.000,00 € = 1.300,00 €.","norm":"VHB 2022 (GDV-Muster), Klausel PK 7110 (23) Fahrraddiebstahl, Entschädigungsgrenze laut Vertrag","id":"6.5-4-1"},{"typ":"wf","frage":"Welche Pflichten hat Herr Hoffmann nach der Klausel Fahrraddiebstahl?","aussagen":[["Er muss den Diebstahl unverzüglich der Polizei anzeigen.",true],["Er muss nachweisen, dass das Pedelec nicht innerhalb von drei Wochen seit der Anzeige wieder aufgefunden wurde.",true],["Er muss Unterlagen über Erwerb, Hersteller, Marke und Rahmennummer beschaffen und aufbewahren.",true],["Weil der Keller abgeschlossen war, hätte er das Pedelec dort nicht zusätzlich anschließen müssen.",false]],"erkl":"Die Klausel verlangt ein verkehrsübliches Schloss auch im gemeinschaftlichen Abstellraum, Belege zur Identität des Rades, die sofortige Polizeianzeige und den Ablauf der Drei-Wochen-Frist. Bei Verstößen kann der Versicherer ganz oder teilweise leistungsfrei sein.","norm":"VHB 2022 (GDV-Muster), Klausel PK 7110 (23) Nr. 1.1–1.5, § 28 VVG","id":"6.5-4-2"},{"typ":"mc","frage":"Ersetzt die Hausratversicherung auch das gestohlene S-Pedelec von Frau Hoffmann?","optionen":["Nein, S-Pedelecs sind versicherungspflichtige Kfz; Diebstahl deckt nur eine Teilkasko für das S-Pedelec.","Ja, alle Fahrräder mit Tretkurbel sind über die Klausel Fahrraddiebstahl in der Hausrat versichert.","Ja, denn die Kfz-Haftpflicht des S-Pedelecs zahlt bei Diebstahl immer den Zeitwert des Fahrzeugs.","Nein, aber die Privathaftpflicht ersetzt den Diebstahl, weil kein Dritter beteiligt ist."],"richtig":[0],"erkl":"Die Klausel erfasst nur Fahrräder und nicht versicherungspflichtige Pedelecs bis 25 km/h. Ein S-Pedelec ist ein Kfz; Diebstahl wäre nur über eine Teilkasko versichert, die Haftpflicht deckt keine Eigenschäden.","norm":"VHB 2022 (GDV-Muster), Klausel PK 7110 (23), AKB A.2.2.1","id":"6.5-4-3"},{"typ":"mc","frage":"Herr Hoffmann fährt mit dem Pedelec eine Fußgängerin an und verletzt sie fahrlässig. Welche Versicherung prüft den Anspruch?","optionen":["seine Privathaftpflichtversicherung, denn das Pedelec gilt rechtlich als Fahrrad","eine Kfz-Haftpflichtversicherung, die er für das Pedelec abschließen musste","seine Hausratversicherung über die Klausel Fahrraddiebstahl","keine, denn Pedelec-Fahrer haften nur bei Vorsatz"],"richtig":[0],"erkl":"Pedelecs bis 25 km/h sind keine Kraftfahrzeuge; für sie gilt das Fahrradrecht, also keine Versicherungspflicht. Die Haftung nach § 823 BGB deckt die Privathaftpflicht.","norm":"§ 1 Abs. 3 StVG, § 823 Abs. 1 BGB","id":"6.5-4-4"}]}]}]}]};
const K='gap1_training_v1';let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){S={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}
const online=/^https?:$/.test(location.protocol);
function simStand(){const s=S._sim;return s&&typeof s==='object'&&s.beste&&typeof s.beste.r==='number'?s:null}
const $=s=>document.querySelector(s);const app=$('#app');
$('#brand').innerHTML=D.titel+'<small>'+D.untertitel+'</small>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
function pills(st){return `<div class="pills"><span class="pill"><span class="dot ${st.pR?'g':''}"></span>${st.pR} % Richtig</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % Fortschritt</span></div>`}
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p[1]?`<a data-go="${p[1]}">${esc(p[0])}</a>`:esc(p[0])).join(' › ')+'</div>'}
function home(){const all=D.module.flatMap(modItems),st=stat(all);
 app.innerHTML=`<div class="box"><h1>Prüfungsvorbereitung Teil 1</h1><p class="hint">Trainieren Sie die sechs Prüfungsbereiche der GAP 1: je Kompetenzbereich die Lektionen „Grundwissen“ und „Prüfungssituation“, dazu Prüfungsfälle wie in der Prüfung und die Rechenwerkstatt Wohnen mit Tarifblatt. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.${online?' Ihren Gesamtstand aus Training und Lernzentrale zeigt der <a href="pruefungspass.html">Prüfungspass</a>.':''}</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}</div>
 <div class="box">${D.module.map((m,i)=>{const s=stat(modItems(m));return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${m.abschnitte.length} Abschnitte · ${s.t} Seiten · ${esc(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">20 zufällige Aufgaben aus allen Bereichen, Auswertung je Prüfungsbereich</div>${simKurz()}</div></div></div>`}
function simKurz(){const s=simStand();if(!s)return '<div class="meta" data-sim="leer">Noch keine Simulation abgeschlossen.</div>';const p=x=>Math.round(100*x.r/x.n);return `<div class="pills" data-sim="${s.beste.r}"><span class="pill"><span class="dot g"></span>Bestes Ergebnis ${s.beste.r} von ${s.beste.n} (${p(s.beste)} %)</span><span class="pill"><span class="dot b"></span>Zuletzt ${s.letzte.r} von ${s.letzte.n}</span><span class="pill">${s.anz} ${s.anz===1?'Durchgang':'Durchgänge'}</span></div>`}
function modul(i){const m=D.module[i];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel]])+`<div class="box"><h1>${m.nr}. ${esc(m.titel)}</h1>${m.abschnitte.map((a,j)=>{const s=stat(abItems(a)),f=a.art==='faelle',prev=m.abschnitte[j-1];const tr=f&&(!prev||prev.art!=='faelle')?'<div class="art">Prüfungsfälle und Rechenwerkstatt</div>':'';return tr+`<div class="card" data-go="a${i}.${j}"><div class="ic">${a.nr}</div><div><div class="ct">${a.nr} ${esc(a.titel)}</div><div class="meta">${a.lektionen.length} ${f?(a.lektionen.length===1?'Fall':'Fälle'):'Lektionen'} · ${s.t} Seiten · ${esc(a.lf)}</div>${pills(s)}</div></div>`}).join('')}</div>`}
function abschnitt(i,j){const m=D.module[i],a=m.abschnitte[j];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel]])+`<div class="box"><h1>${a.nr} ${esc(a.titel)}</h1>${a.lektionen.map((l,k)=>{const s=stat(l.items);return `<div class="card" data-go="l${i}.${j}.${k}"><div class="ic">${k+1}</div><div><div class="ct">${a.art==='faelle'?esc(l.titel):'Lektion '+(k+1)+': '+esc(l.titel)}</div><div class="meta">${s.t} Seiten</div>${pills(s)}</div></div>`}).join('')}</div>`}
let P=null; // Spieler
function start(list,ctx){P={list,ctx,pos:0,ans:{},done:{}};show()}
function render(q,seed){let h=`<div class="q">${esc(q.frage)}</div>`;
 if(q.typ==='mc'||q.typ==='mehr'){const ord=shuf(q.optionen.map((_,i)=>i),q.id+seed);if(q.typ==='mehr')h+='<div class="hint">Mehrere Antworten können richtig sein.</div>';
  h+=ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='mc'?'radio':'checkbox'}" name="o" value="${i}"><span>${esc(q.optionen[i])}</span></label>`).join('')}
 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')return[...r.querySelectorAll('input:checked')].map(x=>+x.value);
 if(q.typ==='wf')return[...r.querySelectorAll('.wf')].map(w=>{const b=w.querySelector('button.on');return b?+b.dataset.v:null});
 if(q.typ==='zuo')return[...r.querySelectorAll('.zu select')].map(s=>s.value);
 if(q.typ==='zahl'){const v=r.querySelector('input').value.trim().replace(/\./g,'').replace(',','.');return v===''?null:+v}}
function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');
 if(q.typ==='zuo')return q.paare.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>');if(q.typ==='wf')return q.aussagen.map(x=>(x[1]?'✔ richtig: ':'✘ falsch: ')+esc(x[0])).join('<br>');
 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}
function mark(q,a){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(q.richtig.includes(i))o.classList.add('ok');else if(a.includes(i))o.classList.add('bad')});
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>w.classList.add((q.aussagen[i][1]?1:0)===a[i]?'ok':'bad'));
 if(q.typ==='zuo')r.querySelectorAll('.zu').forEach((z,i)=>z.classList.add(q.paare[i][1]===a[i]?'ok':'bad'));
 r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function hilfeHtml(h,offen){return `<details class="hilfe"${offen?' open':''}><summary>Tarifblatt (Hilfsmittel)</summary><div class="tw">${h.map(t=>`<h3>${esc(t.titel)}</h3><table><thead><tr>${t.kopf.map(k=>`<th>${esc(k)}</th>`).join('')}</tr></thead><tbody>${t.zeilen.map(z=>`<tr>${z.map(x=>`<td>${esc(x)}</td>`).join('')}</tr>`).join('')}</tbody></table>${t.hinweis?`<p class="hn">${esc(t.hinweis)}</p>`:''}`).join('')}</div></details>`}
function show(){const q=P.list[P.pos],c=P.ctx,n=P.list.length,sit=c.sit?(c.sit[q.id]||''):'',hl=c.hl?c.hl[q.id]:null;
 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div>${hl?hilfeHtml(hl,q.typ==='zahl'):''}</div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Prüfungsbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert${online?' und im <a href="pruefungspass.html">Prüfungspass</a> sichtbar':''}. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={},hl={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);if(l.hilfe)l.items.forEach(q=>hl[q.id]=l.hilfe);
 const lt=a.art==='faelle'?l.titel:'Lektion '+(k+1);
 start(l.items,{titel:`${a.nr} · ${a.art==='faelle'?l.titel:'Lektion '+(k+1)+': '+l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],[lt]],back:'a'+i+'.'+j,seed:'s',sit,hl,full:l.items})}
function sim(){const all=[],sit={},hl={};D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>l.items.forEach(q=>{all.push(q);if(l.situation)sit[q.id]=l.situation;if(l.hilfe)hl[q.id]=l.hilfe}))));
 const pick=shuf(all,String(Date.now())).slice(0,20);start(pick,{titel:'Prüfungssimulation',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed:String(Date.now()),sit,hl,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else if(v==='pass')location.href='pruefungspass.html';else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(online)$('#menu').insertAdjacentHTML('beforeend','<button data-a="pass">Mein Prüfungspass</button>');
// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
</body>
</html>
