örde (Nachhaftung).","norm":"§ 49 FZV, § 13 Abs. 6 FZV, § 5c Abs. 1 PflVG, § 117 Abs. 2 VVG","id":"6.4-2-5"}]},{"typ":"situation","titel":"Fall 3: Frau Brandt verkauft ihren Pkw","situation":"Helga Brandt (67) aus Halle (Saale) verkauft ihren Pkw am Dienstag, 15. September 2026, an Jannik Weber und übergibt ihm Wagen und Papiere. Der Pkw ist bei der Proximus haftpflicht- und teilkaskoversichert. Frau Brandt hat den Jahresbeitrag von 876,00 € für das Versicherungsjahr 1. Januar bis 31. Dezember 2026 im Voraus bezahlt. Herr Weber ist in dieselbe SF-Klasse eingestuft, die Prämie bleibt nach dem Übergang unverändert. Herr Weber kündigt den übergegangenen Vertrag wirksam zum 30. September 2026 (24 Uhr). Laut AKB 2021 steht der Proximus bei vorzeitigem Vertragsende die Prämie anteilig für die Zeit des Versicherungsschutzes zu (zeitanteilig nach 30/360).","items":[{"typ":"mc","frage":"Welche Rechtsfolge hat der Verkauf am 15. September für Frau Brandts Kfz-Versicherung?","optionen":["Herr Weber tritt in die Rechte und Pflichten aus dem Vertrag ein; er läuft weiter.","Der Vertrag endet automatisch mit der Übergabe von Wagen und Papieren an Herrn Weber.","Der Vertrag ruht, bis Herr Weber bei der Proximus einen eigenen Antrag stellt.","Der Vertrag bleibt bei Frau Brandt und erlischt erst mit Ablauf des Versicherungsjahres."],"richtig":[0],"erkl":"Bei Veräußerung der versicherten Sache tritt der Erwerber kraft Gesetzes in den Vertrag ein. Die AKB 2021 der Proximus übernehmen diese Regel für das Kfz (ausgenommen die Fahrerschutz-Versicherung).","norm":"§ 95 Abs. 1 VVG, Proximus 5, AKB 2021 G.7.1","id":"6.4-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Verkauf treffen zu?","aussagen":[["Bis zur Kündigung haften Frau Brandt und Herr Weber für die Prämie der laufenden Versicherungsperiode als Gesamtschuldner.",true],["Nach der Kündigung durch Herrn Weber schuldet allein Frau Brandt die Prämie; Herr Weber haftet dafür nicht.",true],["Die Proximus muss den Eintritt von Herrn Weber erst gegen sich gelten lassen, wenn sie davon Kenntnis erlangt.",true],["Unterbleibt die Anzeige des Verkaufs, ist die Proximus in der Kfz-Haftpflicht auch gegenüber einem Unfallopfer leistungsfrei.",false]],"erkl":"Veräußerer und Erwerber haften gemeinsam für die laufende Prämie; wird gekündigt, zahlt nur der Veräußerer. Eine mögliche Leistungsfreiheit wirkt in der Pflichtversicherung nur im Innenverhältnis; gegenüber dem Geschädigten bleibt der Versicherer verpflichtet.","norm":"§§ 95 Abs. 2 und 3, 96 Abs. 3, 117 Abs. 1 VVG, Proximus 5, AKB 2021 G.7.3, G.7.5","id":"6.4-3-2"},{"typ":"zuo","frage":"Ordnen Sie den Vorgängen nach einer Fahrzeugveräußerung die Regel aus Gesetz und AKB 2021 zu.","paare":[["Anzeige der Veräußerung","unverzüglich durch Veräußerer oder Erwerber"],["Kündigung durch den Erwerber","mit sofortiger Wirkung oder spätestens zum Ablauf des Vertrags"],["Kündigung durch den Versicherer gegenüber dem Erwerber","wirksam einen Monat nach Zugang beim Erwerber"],["Erwerber schließt eine neue Kfz-Haftpflicht ab, ohne den alten Vertrag zu kündigen","der übergegangene Vertrag gilt mit Beginn des neuen als gekündigt"]],"erkl":"Der Erwerber kann innerhalb eines Monats nach dem Erwerb kündigen, der Versicherer innerhalb eines Monats ab Kenntnis. Legt der Erwerber der Zulassungsbehörde die Versicherungsbestätigung eines neuen Vertrags vor, gilt der übergegangene Vertrag als gekündigt.","norm":"§§ 96, 97 Abs. 1 VVG, § 5a Abs. 2 PflVG, Proximus 5, AKB 2021 G.2.5, G.2.6, G.3.7, G.7.4","id":"6.4-3-3"},{"typ":"zahl","frage":"Welchen Betrag erstattet die Proximus Frau Brandt nach dem Vertragsende zum 30. September 2026? Geben Sie den Betrag in Euro an.","wert":219.0,"einheit":"€","tol":0.01,"erkl":"Der Proximus steht nur die Prämie für die Zeit mit Versicherungsschutz zu: 1. Januar bis 30. September = 270 Tage (30/360). 876,00 € × 270 : 360 = 657,00 €. Erstattung: 876,00 € − 657,00 € = 219,00 € an Frau Brandt, die nach der Kündigung des Erwerbers allein die Prämie schuldet und gezahlt hat.","norm":"Proximus 5, AKB 2021 G.6, G.7.5; § 39 Abs. 1 VVG","id":"6.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Hampel – Zweiräder und Saisonkennzeichen","situation":"Rüdiger Hampel (52) aus Halle (Saale) fährt ein Motorrad mit Saisonkennzeichen für den Betriebszeitraum 04–10 (April bis Oktober). Es ist bei der Proximus haftpflicht- und teilkaskoversichert. Laut Bedingungen gelten außerhalb der Saison die Regeln der Ruheversicherung: Haftpflicht und Teilkasko bestehen weiter, wenn das Motorrad in einem Einstellraum oder auf einem umfriedeten Abstellplatz steht und nicht gefahren wird. Tochter Lea (15) kauft am Donnerstag, 15. Oktober 2026, einen E-Scooter und erhält von der Proximus eine Versicherungsplakette. Ehefrau Sabine schwankt zwischen einem Pedelec (Unterstützung bis 25 km/h) und einem S-Pedelec (Unterstützung bis 45 km/h).","items":[{"typ":"zahl","frage":"In wie vielen Monaten des Jahres darf Herr Hampel sein Motorrad auf öffentlichen Straßen in Betrieb setzen und dort abstellen?","wert":7,"einheit":"Monate","tol":0,"erkl":"Der Betriebszeitraum April bis Oktober umfasst 7 volle Monate. Nur in diesem Zeitraum darf das Fahrzeug auf öffentlichen Straßen gefahren oder abgestellt werden; zulässig sind Zeiträume von 2 bis 11 Monaten.","norm":"§ 10 Abs. 3 FZV","id":"6.4-4-1"},{"typ":"mc","frage":"Im Januar 2027 wird das Motorrad aus Herrn Hampels abgeschlossener Einzelgarage gestohlen. Was gilt?","optionen":["Die Proximus leistet aus der Teilkasko, weil außerhalb der Saison die Regeln der Ruheversicherung gelten.","Die Proximus leistet nicht, weil außerhalb des Betriebszeitraums gar kein Versicherungsschutz besteht.","Die Proximus leistet nur aus der Kfz-Haftpflicht, weil die Teilkasko im Winter vollständig ruht.","Die Proximus leistet nur, wenn Herr Hampel den Diebstahl erst in der nächsten Saison anzeigt."],"richtig":[0],"erkl":"Außerhalb der Saison besteht Ruheversicherungsschutz mit Haftpflicht und Teilkasko, solange das Fahrzeug in einem Einstellraum steht. Diebstahl (Entwendung) ist eine Teilkasko-Gefahr; die Entwendung ist der Proximus unverzüglich in Textform und bei mehr als 500 € auch der Polizei anzuzeigen.","norm":"Proximus 5, AKB 2021 H.2.2, H.1.4, H.1.5, A.2.2.2, E.3.1, E.3.3","id":"6.4-4-2"},{"typ":"zahl","frage":"Wie viele Kalendertage gilt Leas Versicherungsplakette, wenn man den 15. Oktober 2026 mitzählt?","wert":137,"einheit":"Tage","tol":0,"erkl":"Das Verkehrsjahr läuft vom 1. März bis zum Ablauf des Februars des Folgejahres; die Plakette gilt also bis 28. Februar 2027. Oktober 17 + November 30 + Dezember 31 + Januar 31 + Februar 28 = 137 Tage.","norm":"§ 56 Abs. 2 FZV i. V. m. § 52 Abs. 1 FZV, Proximus 5, AKB 2021 G.1.3","id":"6.4-4-3"},{"typ":"zuo","frage":"Ordnen Sie dem Fahrzeug der Familie den passenden Nachweis bzw. die passende Kennzeichnung zu.","paare":[["S-Pedelec mit Unterstützung bis 45 km/h","Versicherungskennzeichen: Schild mit Erkennungsnummer und Verkehrsjahr"],["E-Scooter (Elektrokleinstfahrzeug)","Versicherungsplakette: Aufkleber mit fälschungserschwerendem Hologramm"],["Motorrad, nur im Sommer genutzt","amtliches Saisonkennzeichen mit Betriebszeitraum in vollen Monaten"],["Pedelec mit Unterstützung bis 25 km/h","kein Kennzeichen, denn es gilt rechtlich als Fahrrad"]],"erkl":"S-Pedelecs sind Kleinkrafträder und brauchen ein Versicherungskennzeichen; für E-Scooter ist die Plakette der Versicherungsnachweis. Pedelecs bis 25 km/h mit höchstens 0,25 kW sind keine Kraftfahrzeuge; Haftpflichtschäden mit dem Pedelec deckt die Privathaftpflicht (Proximus: Ziff. 6.7.3).","norm":"§§ 4 Abs. 3, 52 Abs. 2, 56 Abs. 2 FZV, § 10 Abs. 3 FZV, § 1 Abs. 3 StVG, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.7.3","id":"6.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Unfall mit dem geliehenen Wagen","situation":"Lukas Engel (29) aus Halle (Saale) ist Halter und Versicherungsnehmer eines Pkw, der bei der Proximus haftpflichtversichert ist. Er leiht den Wagen seiner Freundin Mira Haddad für einen Einkauf. Ohne sein Wissen fährt sie danach mit 1,2 Promille zu Freunden und übersieht den Radfahrer Karl Obst (63). Herr Obst wird verletzt, sein Rad ist zerstört. Er verlangt insgesamt 18.400,00 € (Behandlung, Verdienstausfall, Schmerzensgeld, Fahrrad). Die Proximus zahlt den Betrag.","items":[{"typ":"mc","frage":"Haftet Herr Engel als Halter gegenüber Herrn Obst, obwohl er selbst nicht gefahren ist?","optionen":["Ja, der Halter haftet ohne Verschulden für Schäden beim Betrieb seines Kfz; er hat ihn überlassen.","Nein, ohne eigenes Verschulden haftet nur Frau Haddad als Fahrerin des Wagens gegenüber Herrn Obst.","Nein, weil Frau Haddad den Wagen alkoholisiert ohne sein Wissen gefahren hat (Schwarzfahrt).","Ja, aber nur bis zur Höhe des Zeitwerts seines Pkw, weil er nicht selbst gefahren ist."],"richtig":[0],"erkl":"Die Halterhaftung ist eine Gefährdungshaftung. Eine Schwarzfahrt liegt nicht vor, wenn der Halter dem Fahrer das Fahrzeug überlassen hat.","norm":"§ 7 Abs. 1 und 3 StVG","id":"6.4-5-1"},{"typ":"wf","frage":"Welche Aussagen zum Anspruch von Herrn Obst treffen zu?","aussagen":[["Herr Obst kann seinen Schadensersatzanspruch direkt gegen die Proximus geltend machen.",true],["Die Proximus und Herr Engel als ersatzpflichtiger Versicherungsnehmer haften Herrn Obst als Gesamtschuldner.",true],["Die Proximus darf die Zahlung an Herrn Obst verweigern, weil die Fahrerin alkoholisiert war.",false],["Die Proximus muss den Schadensersatz in Geld leisten.",true]],"erkl":"In der Kfz-Pflichtversicherung hat der Geschädigte einen Direktanspruch gegen den Versicherer. Eine Leistungsfreiheit wegen Alkohols wirkt nur im Innenverhältnis; gegenüber dem Dritten bleibt die Leistungspflicht bestehen. Begründete Ansprüche ersetzt die Proximus in Geld.","norm":"§ 115 Abs. 1 VVG, § 117 Abs. 1 VVG, Proximus 5, AKB 2021 A.1.1.2","id":"6.4-5-2"},{"typ":"zahl","frage":"Wie viel Euro kann die Proximus von Frau Haddad wegen der Trunkenheitsfahrt höchstens zurückfordern?","wert":5000.0,"einheit":"€","tol":0.01,"erkl":"Fahren unter Alkohol verletzt eine Pflicht beim Gebrauch des Fahrzeugs (vor dem Versicherungsfall). Frau Haddad ist als Fahrerin mitversichert; die Leistungsfreiheit ist gegenüber VN und mitversicherten Personen auf höchstens je 5.000 € begrenzt. Gegen Herrn Engel besteht kein Regress, weil er sie nicht wissentlich alkoholisiert fahren ließ.","norm":"Proximus 5, AKB 2021 A.1.2, D.2.1, D.5.1, D.5.3; § 5 Abs. 1 Nr. 5, Abs. 2 und 3 KfzPflVV","id":"6.4-5-3"},{"typ":"zuo","frage":"Ordnen Sie dem Sachverhalt die zutreffende Rechtsfolge zu.","paare":[["Der Fahrer verursacht mit 1,4 Promille einen Unfall.","Regress beim Fahrer höchstens 5.000 €"],["Der VN macht nach dem Unfall grob fahrlässig unvollständige Angaben zum Hergang; das erschwert die Feststellung des Schadens.","Leistungsfreiheit gegenüber dem VN höchstens 2.500 €"],["Ein Dieb verursacht mit dem gestohlenen Wagen einen Unfall.","Regress beim Fahrer ohne die 5.000-€-Grenze"],["Ein Aufsitzrasenmäher mit höchstens 15 km/h beschädigt ein parkendes Auto.","keine Gefährdungshaftung des Halters nach § 7 StVG"]],"erkl":"Die KfzPflVV begrenzt den Regress bei Obliegenheitsverletzungen vor dem Versicherungsfall auf 5.000 €, danach in der Regel auf 2.500 € (bei besonders schwerwiegender vorsätzlicher Verletzung 5.000 €); für einen Fahrer, der das Fahrzeug durch eine Straftat erlangt hat, gilt die Grenze nicht. Fahrzeuge bis 20 km/h fallen nicht unter § 7 StVG.","norm":"Proximus 5, AKB 2021 D.5.3, D.5.4, E.7.3, E.7.4; § 5 Abs. 3, § 6 Abs. 1 KfzPflVV, § 8 Nr. 1 StVG","id":"6.4-5-4"}]},{"typ":"situation","titel":"Fall 6: Frau Petersen – Kaskoschäden und Auslandsfahrt","situation":"Annika Petersen (34) aus Halle (Saale) hat ihren fünf Jahre alten Pkw bei der Proximus mit Kfz-Haftpflicht, Vollkasko (Selbstbeteiligung 500 €), Teilkasko (Selbstbeteiligung 150 €) und Autoschutzbrief versichert. Laut ihrem Vertrag gilt bei Teilkasko-Schäden die Teilkasko-Selbstbeteiligung, Teilkasko-Schäden führen nicht zu einer Rückstufung, und eine Neupreisentschädigung kommt wegen des Fahrzeugalters nicht mehr in Betracht. Für den nächsten Sommer plant sie eine Urlaubsfahrt mit dem eigenen Pkw nach Montenegro.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Schadenereignis die Leistung aus Frau Petersens Vertrag zu.","paare":[["Hagel beschädigt das Dach des Pkw.","Teilkasko: 150 € Selbstbeteiligung, keine Rückstufung"],["Sie fährt beim Rückwärtsfahren selbst gegen eine Mauer.","Vollkasko: 500 € Selbstbeteiligung, Rückstufung"],["Die Batterie versagt 250 km von zu Hause; ein Pannendienst startet das Auto vor Ort.","Autoschutzbrief: Pannenhilfe am Schadenort"],["Der Motor wird ohne äußere Einwirkung durch Ölmangel zerstört.","keine Kaskoleistung, da Betriebsschaden"]],"erkl":"Hagel ist Teilkasko-Gefahr, der selbst verschuldete Unfall Vollkasko-Gefahr. Betriebs- und reine Bruchschäden sind keine Unfallschäden. Der Schutzbrief organisiert und bezahlt Hilfe bei Panne oder Unfall unterwegs (Pannenhilfe vor Ort bis 300 €).","norm":"Proximus 5, AKB 2021 A.2.2.3, A.2.3.2, A.3.5.2, I.1","id":"6.4-6-1"},{"typ":"zahl","frage":"Frau Petersen verursacht selbst einen Unfall mit Totalschaden. Laut Gutachten beträgt der Wiederbeschaffungswert 16.400,00 €, der Restwert 3.900,00 €. Laut Vertrag zahlt die Vollkasko den Wiederbeschaffungswert abzüglich Restwert und Selbstbeteiligung. Wie hoch ist die Entschädigung in Euro?","wert":12000.0,"einheit":"€","tol":0.01,"erkl":"16.400,00 € − 3.900,00 € = 12.500,00 €; abzüglich Vollkasko-Selbstbeteiligung 500,00 € = 12.000,00 €. Der Restwert bleibt bei der Kundin (Verkauf des Wracks).","norm":"Proximus 5, AKB 2021 A.2.6.1 (Totalschaden), A.2.12 (Selbstbeteiligung), A.2.13.2 (Restwert)","id":"6.4-6-2"},{"typ":"mc","frage":"Ein Hagelschaden kostet laut Gutachten 2.800,00 € netto zuzüglich 19 % Umsatzsteuer. Frau Petersen lässt nicht reparieren und rechnet fiktiv ab. Laut Vertrag wird Umsatzsteuer nur ersetzt, wenn sie tatsächlich anfällt. Was zahlt die Proximus?","optionen":["2.650,00 € (Nettobetrag abzüglich Teilkasko-Selbstbeteiligung)","3.182,00 € (Bruttobetrag abzüglich Teilkasko-Selbstbeteiligung)","2.300,00 € (Nettobetrag abzüglich Vollkasko-Selbstbeteiligung)","2.800,00 € (Nettobetrag ohne jeden Abzug, da Teilkasko)"],"richtig":[0],"erkl":"Ohne Reparatur zahlt die Proximus die erforderlichen Reparaturkosten; Mehrwertsteuer nur, soweit sie tatsächlich angefallen ist. Also netto: 2.800,00 € − 150,00 € = 2.650,00 €. Für Teilkasko-Schäden gilt laut Vertrag die Teilkasko-Selbstbeteiligung.","norm":"Proximus 5, AKB 2021 A.2.7.1, A.2.9 (Mehrwertsteuer), A.2.12 (Selbstbeteiligung)","id":"6.4-6-3"},{"typ":"wf","frage":"Frau Petersen fragt nach dem Versicherungsschutz für die Fahrt nach Montenegro. Welche Aussagen treffen zu?","aussagen":[["Der Kfz-Haftpflichtschutz richtet sich dort nach dem vorgeschriebenen Umfang, mindestens aber nach ihrem Vertrag.",true],["Die Grüne Karte (Internationale Versicherungskarte) weist den Kfz-Haftpflichtschutz nach, nicht aber den Kaskoschutz.",true],["In den EU-Staaten genügt in der Regel das Kennzeichen als Nachweis der Kfz-Haftpflicht.",true],["Ohne mitgeführte Grüne Karte besteht im Ausland kein Kfz-Haftpflichtschutz.",false]],"erkl":"Kfz-Haftpflicht, Kasko und Schutzbrief gelten in den geografischen Grenzen Europas; der Haftpflichtschutz richtet sich nach dem Recht des Besuchslands, mindestens nach dem Vertrag. Die Karte ist nur ein Nachweis; der Schutz selbst ergibt sich aus dem Vertrag. Für Fahrten außerhalb der EU sollte sie mitgeführt werden.","norm":"Proximus 5, AKB 2021 A.1.4.1, A.1.4.2, A.2.5.1, A.3.4; Art. 4 RL 2009/103/EG","id":"6.4-6-4"}]},{"typ":"situation","titel":"Fall 7: Herr Lindner – Beitrag, SF-Klasse und Fahrerkreis","situation":"Marco Lindner (46) aus Halle (Saale) ist mit seinem Pkw bei der Proximus in der Kfz-Haftpflicht in SF 8 eingestuft. Laut Versicherungsschein beträgt die Prämie zu 100 % (nach Typ- und Regionalklasse) in der Haftpflicht 820,00 €. Beitragssätze laut AKB 2021 Anhang 1, Tabelle 1.1 (Pkw, Kfz-Haftpflicht): SF 2 = 49 %, SF 8 = 36 %, SF 9 = 34 %. Rückstufung bei einem Schaden im Kalenderjahr laut Tabelle 1.2 (Pkw, Kfz-Haftpflicht): aus SF 8 nach SF 2. Laut AKB 2021 kann er eine Rückstufung vermeiden, wenn er die Entschädigung innerhalb von sechs Monaten nach Mitteilung der Proximus erstattet. Vereinbart ist der Einzel-/Partner-Nachlass (−10 % in der Kfz-Haftpflicht): Laut Antrag fahren nur Herr Lindner und seine Ehefrau den Wagen. Sohn Felix (19) hat gerade den Führerschein gemacht und darf den Wagen mit Erlaubnis seines Vaters regelmäßig nutzen. Laut AKB 2021 gilt bei unzutreffenden Angaben zu Merkmalen der Prämienberechnung rückwirkend ab Beginn des laufenden Versicherungsjahres die Prämie, die den tatsächlichen Merkmalen entspricht.","items":[{"typ":"zahl","frage":"Herr Lindner verursacht in diesem Jahr einen Haftpflichtschaden. Um wie viel Euro ist sein Haftpflichtbeitrag im nächsten Jahr (vor Nachlässen, Zahlungsweise und Versicherungsteuer) höher, als er ohne Schaden gewesen wäre?","wert":123.0,"einheit":"€","tol":0.01,"erkl":"Ohne Schaden: SF 9 = 34 % von 820,00 € = 278,80 €. Mit Schaden: Rückstufung aus SF 8 nach SF 2 = 49 % von 820,00 € = 401,80 €. Differenz: 401,80 € − 278,80 € = 123,00 €. Maßgeblich sind die Pkw-Tabellen der Kfz-Haftpflicht in Anhang 1, nicht die Vollkasko- oder Zweiradtabellen.","norm":"Proximus 5, AKB 2021 I.3.2, I.3.5 mit Anhang 1 Tabellen 1.1 und 1.2","id":"6.4-7-1"},{"typ":"zuo","frage":"Ordnen Sie dem Beitragsmerkmal zu, wonach es sich richtet.","paare":[["Typklasse","Schadenbilanz des Fahrzeugmodells"],["Regionalklasse","Schadenbilanz des Zulassungsbezirks, in dem der Halter wohnt"],["Schadenfreiheitsklasse","Zahl der schadenfreien Jahre des Vertrags"],["Einzel-/Partner-Nachlass","Kreis der Personen, die das Fahrzeug fahren"]],"erkl":"Typ- und Regionalklassen ermittelt ein unabhängiger Treuhänder jährlich aus dem Schadenbedarf, getrennt für Haftpflicht, Voll- und Teilkasko. SF-Klasse und Fahrerkreis (im Tarif der Proximus: Einzel-/Partner- oder Familien-Nachlass) sind persönliche Merkmale des Vertrags.","norm":"Proximus 5, AKB 2021 J.1 (Typklasse), J.2 (Regionalklasse), I.1 mit Anhang 1 (SF-System), K.4 (Merkmale zur Prämienberechnung); Tarif zur Kraftfahrtversicherung (Nachlässe)","id":"6.4-7-2"},{"typ":"wf","frage":"Welche Aussagen zur Schadenfreiheitsklasse von Herrn Lindner treffen zu?","aussagen":[["Hätte Herr Lindner auch eine Vollkasko, würde ein Schaden, für den nur die Haftpflicht zahlt, die Vollkasko nicht zurückstufen.",true],["Herr Lindner kann die Rückstufung vermeiden, wenn er der Proximus die Entschädigung fristgerecht erstattet.",true],["Ist der Vertrag ein ganzes Kalenderjahr ununterbrochen und schadenfrei, wird er im Folgejahr in die nächstbessere SF-Klasse eingestuft.",true],["Ein Teilkaskoschaden führt in der Haftpflicht zur Rückstufung.",false]],"erkl":"Haftpflicht und Vollkasko haben getrennte SF-Verläufe; die Teilkasko kennt keine SF-Klassen. Erstattet Herr Lindner die Entschädigung innerhalb von sechs Monaten nach Mitteilung, wird der Vertrag als schadenfrei behandelt.","norm":"Proximus 5, AKB 2021 I.1, I.3.2, I.4, I.5.1","id":"6.4-7-3"},{"typ":"mc","frage":"Felix fährt regelmäßig mit dem Wagen und verursacht einen Unfall. Was gilt?","optionen":["Die Proximus ersetzt dem Geschädigten den Schaden; Herr Lindner zahlt den Beitrag für den richtigen Fahrerkreis nach.","Die Proximus verweigert dem Geschädigten jede Zahlung, weil Felix nicht zum vereinbarten Fahrerkreis gehört.","Felix haftet allein mit seinem Vermögen, weil die Kfz-Haftpflicht nur den vereinbarten Fahrerkreis schützt.","Der Vertrag gilt rückwirkend als nicht geschlossen, und der Geschädigte muss sich an den Entschädigungsfonds wenden."],"richtig":[0],"erkl":"Der Fahrerkreis ist ein Merkmal der Prämienberechnung. Die Kfz-Haftpflicht schützt jeden berechtigten Fahrer als mitversicherte Person; Folge der unzutreffenden Angabe ist die richtige Prämie rückwirkend ab Beginn des Versicherungsjahres, bei Vorsatz zusätzlich eine Vertragsstrafe in Höhe einer Jahresprämie.","norm":"Proximus 5, AKB 2021 A.1.2, D.1.2, K.4.1, K.4.3, K.4.4; § 115 Abs. 1 VVG","id":"6.4-7-4"}]}]},{"nr":"6.5","titel":"Prüfungsfälle: Reisen und Fahrrad","lf":"LF 6","buch":"S. 289–294","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Okafor storniert die Algarve-Reise","situation":"Chidi (44) und Ines Okafor aus Halle (Saale) haben mit Sohn Daniel (12) eine Pauschalreise an die Algarve (Portugal) für 3.600,00 € gebucht; Reisebeginn ist Samstag, 24. Oktober 2026. Alle drei sind bei der Proximus über eine Reiserücktrittsversicherung (Familientarif mit Selbstbehalt, Versicherungssumme 3.600,00 €) versichert. Laut VB-Reiserücktritt 2021 beträgt der Selbstbehalt 20 % des erstattungsfähigen Schadens, mindestens 25 € je versicherte Person; die Reise ist unverzüglich nach Eintritt des Rücktrittsgrundes zu stornieren. Stornostaffel des Veranstalters: bis 30. Tag vor Reisebeginn 25 %, 29. bis 15. Tag 40 %, 14. bis 7. Tag 60 %, ab 6. Tag 80 % des Reisepreises. Daniel erkrankt am 5. Oktober erstmals schwer; der Arzt bescheinigt noch am selben Tag, dass er die Reise nicht antreten kann. Die Familie wartet trotzdem bewusst ab und storniert erst am 12. Oktober.","items":[{"typ":"wf","frage":"Welche Aussagen zum Rücktritt der Familie Okafor treffen zu?","aussagen":[["Die unerwartete schwere Erkrankung des mitversicherten Sohnes ist ein versicherter Rücktrittsgrund.",true],["Hätte die Familie einfach keine Lust mehr auf die Reise, würde die Reiserücktrittsversicherung nicht leisten.",true],["Bei einem schweren Waldbrand am Zielort, der die Reise erheblich beeinträchtigt, kann der Veranstalter keine Entschädigung verlangen.",true],["Die Reiserücktrittsversicherung zahlt den vollen Reisepreis auch dann, wenn der Veranstalter gar keine Stornokosten verlangt.",false]],"erkl":"Versichert sind die vertraglich geschuldeten Stornokosten bei versicherten Gründen, z. B. unerwarteter schwerer Erkrankung einer mitversicherten Person. Bei unvermeidbaren, außergewöhnlichen Umständen am Zielort ist der Rücktritt ohnehin entschädigungsfrei; dann entsteht kein versicherter Schaden.","norm":"§ 651h Abs. 1 und 3 BGB, Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, 2.1.3, 3","id":"6.5-1-1"},{"typ":"zahl","frage":"Welchen Betrag erstattet die Reiserücktrittsversicherung der Familie Okafor? Geben Sie den Betrag in Euro an.","wert":1152.0,"einheit":"€","tol":0.01,"erkl":"Maßgeblich ist die Stornostufe bei unverzüglicher Stornierung am 5. Oktober: 19 Tage vor Reisebeginn = 40 %. 40 % von 3.600,00 € = 1.440,00 €; abzüglich 20 % Selbstbehalt (288,00 €, mehr als 3 × 25 € = 75,00 €) = 1.152,00 €. Die Mehrkosten der Stornierung am 12. Oktober (60 %) trägt die Familie selbst.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.1, 7; AT-Reise 2021 Ziff. 9.4; § 28 Abs. 2 und 3 VVG","id":"6.5-1-2"},{"typ":"mc","frage":"Die Familie fragt, warum nicht die tatsächlich berechneten 60 % Stornokosten Grundlage der Erstattung sind. Was antworten Sie?","optionen":["Sie hätte unverzüglich am 5. Oktober stornieren müssen; die Mehrkosten durch das Abwarten sind nicht versichert.","Die Versicherung erstattet grundsätzlich nur die niedrigste Stufe der Stornostaffel, hier also 25 % des Reisepreises.","Stornokosten über 40 % gelten als unangemessen und müssen vom Reiseveranstalter selbst getragen werden.","Bei Krankheit eines Kindes erstattet die Versicherung nur die Hälfte der tatsächlich berechneten Stornokosten."],"richtig":[0],"erkl":"Die Reise ist unverzüglich nach Eintritt des Rücktrittsgrundes zu stornieren. Die Familie hat diese Obliegenheit bewusst verletzt; die Proximus leistet nur, soweit die Verletzung nicht ursächlich war, also in Höhe der Stornostufe bei rechtzeitiger Stornierung.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.1, 6; AT-Reise 2021 Ziff. 9.4; § 28 Abs. 2 und 3 VVG, § 82 VVG","id":"6.5-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Ereignis zu, wer bzw. welche Absicherung dafür aufkommt.","paare":[["Daniel erkrankt vor Reisebeginn, die Reise wird storniert.","Reiserücktrittsversicherung: Stornokosten"],["Ein Familienmitglied verunglückt am Urlaubsort, die Familie reist vorzeitig heim.","Reiseabbruchversicherung: Rückreisekosten und nicht genutzte Reiseleistungen"],["Der Reiseveranstalter wird vor Reisebeginn zahlungsunfähig.","Insolvenzabsicherung des Veranstalters (Sicherungsschein)"],["Ines Okafor wird im Urlaub privatärztlich behandelt und medizinisch notwendig per Ambulanzflug heimgebracht.","Auslandsreisekrankenversicherung"]],"erkl":"Jede Absicherung deckt einen eigenen Abschnitt der Reise. Gegen die Insolvenz des Veranstalters schützt nicht eine Versicherung des Kunden, sondern die gesetzliche Kundengeldabsicherung.","norm":"§ 651r BGB, Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, VB-Reiseabbruch 2021 Ziff. 1.1 und 1.2, Tarif Auslandsreisekrankenversicherung (AKV)","id":"6.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Ehepaar Petrescu bricht die Kanadareise ab","situation":"Sorin (58) und Elena Petrescu aus Halle (Saale) machen eine Pauschalreise durch Kanada mit 14 Reisetagen; der Reisepreis beträgt 4.200,00 € (2.100,00 € je Person, mit Hin- und Rückflug). Beide haben bei der Proximus eine Reiserücktrittsversicherung inklusive Reiseabbruch (Paartarif ohne Selbstbehalt, Versicherungssumme 4.200,00 €) und eine Auslandsreisekrankenversicherung (Tarif AKV I). Laut VB-Reiseabbruch 2021 erstattet die Proximus bei Abbruch aus versichertem Grund die Kosten der Rückreise entsprechend der gebuchten Art und Qualität (Ziff. 1.1) und den anteiligen Reisepreis für nicht genutzte Reiseleistungen abzüglich der Rückreisekosten (Ziff. 1.2). Die AKV zahlt medizinisch notwendige Behandlungen akut im Ausland eingetretener Krankheiten und Unfälle sowie den medizinisch notwendigen Krankenrücktransport; kein Schutz besteht für Behandlungen, die vor Reiseantritt geplant waren oder deren Notwendigkeit feststand. Herr Petrescu hat einen gut eingestellten Diabetes. Am 10. Reisetag bricht er sich bei einem Sturz auf einem Wanderweg das Bein; er wird im Krankenhaus behandelt und medizinisch notwendig nach Hause transportiert. Frau Petrescu fliegt mit; die Umbuchung ihres Rückflugs in derselben Klasse kostet 640,00 € mehr. Laut Veranstalter entfallen auf die 4 nicht genutzten Reisetage (ohne Rückflug) 600,00 € je Person.","items":[{"typ":"zahl","frage":"Welchen Betrag zahlt die Reiseabbruchversicherung insgesamt? Geben Sie den Betrag in Euro an.","wert":1840.0,"einheit":"€","tol":0.01,"erkl":"Nicht genutzte Reiseleistungen (Ziff. 1.2): 600,00 € je Person, für zwei Personen 1.200,00 €. Rückreisekosten der mitreisenden Ehefrau als Risikoperson (Ziff. 1.1): 640,00 €. Ohne Selbstbehalt: 1.200,00 € + 640,00 € = 1.840,00 €. Den Rücktransport von Herrn Petrescu zahlt die Auslandsreisekrankenversicherung.","norm":"Proximus 5, VB-Reiseabbruch 2021 Ziff. 1.1, 1.2, 2.1, 3; VB-Reiserücktritt 2021 Ziff. 3.2","id":"6.5-2-1"},{"typ":"zuo","frage":"Ordnen Sie der Kostenposition die zuständige Absicherung zu.","paare":[["Krankenhausbehandlung des Beinbruchs in Kanada","Auslandsreisekrankenversicherung"],["nicht genutzte Hotelnächte und Ausflüge","Reiseabbruchversicherung"],["Koffer, der auf dem Rückflug zerstört wird","Reisegepäckversicherung"],["Physiotherapie nach der Rückkehr in Halle (Saale)","gesetzliche oder private Krankenversicherung in Deutschland"]],"erkl":"Die Auslandsreisekrankenversicherung deckt die Behandlung im Ausland; nach der Rückkehr ist wieder die eigene Krankenversicherung zuständig. Die Reiseabbruchversicherung ersetzt den Wert ungenutzter Reiseleistungen; den Koffer ersetzt die Reisegepäckversicherung, wenn er im Gewahrsam der Fluggesellschaft beschädigt wird.","norm":"Proximus 5, VB-Reiseabbruch 2021 Ziff. 1.2, VB-Reisegepäck 2021 Ziff. 2.1, Tarif Auslandsreisekrankenversicherung (AKV)","id":"6.5-2-2"},{"typ":"mc","frage":"Zahlt die Auslandsreisekrankenversicherung die Behandlung des Beinbruchs, obwohl Herr Petrescu Diabetiker ist?","optionen":["Ja, denn die Unfallbehandlung war bei Reiseantritt nicht absehbar; der Ausschluss erfasst sie nicht.","Nein, denn wegen der Vorerkrankung ist Herr Petrescu für die gesamte Reise vom Schutz ausgeschlossen.","Nein, denn Behandlungen in Kanada zahlt immer die gesetzliche Krankenversicherung in Deutschland.","Ja, aber nur, wenn der Diabetes vor der Reise der Reiseversicherung schriftlich gemeldet wurde."],"richtig":[0],"erkl":"Der Ausschluss betrifft nur Behandlungen, die vor Reiseantritt geplant waren oder deren Notwendigkeit feststand. Der Beinbruch ist ein akut im Ausland eingetretener Unfall.","norm":"Proximus 5, Tarif Auslandsreisekrankenversicherung (AKV I/AKV II), Leistungen und Ausschluss","id":"6.5-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Reiseabbruchversicherung der Petrescus treffen zu?","aussagen":[["Sie ersetzt auch die Mehrkosten für die Rückreise der mitreisenden Ehefrau.",true],["Sie übernimmt die Krankenhauskosten in Kanada.",false],["Hätte Herr Petrescu die Reise nur wegen schlechten Wetters abgebrochen, bestünde kein Anspruch.",true],["Sie erstattet nicht genutzte Reisetage nur, wenn der Reiseveranstalter zahlungsunfähig ist.",false]],"erkl":"Die Reiseabbruchversicherung leistet bei versicherten Gründen wie schwerer Unfallverletzung oder unerwarteter schwerer Erkrankung der versicherten Person oder einer Risikoperson (z. B. des Ehepartners); Behandlungskosten gehören zur Auslandsreisekrankenversicherung.","norm":"Proximus 5, VB-Reiseabbruch 2021 Ziff. 1.1, 1.2, 2.1, 3; VB-Reiserücktritt 2021 Ziff. 2.1, 3.2","id":"6.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Ritter – Mietwagen und Gepäck auf der Albanienreise","situation":"Das Ehepaar Paula und Jonas Ritter aus Halle (Saale) mietet auf einer Rundreise durch Albanien bei einem Vermieter einen Pkw. Die Haftpflichtversicherung des Mietwagens ist laut Mietvertrag auf 500.000 € je Schadenfall begrenzt; für Schäden am Mietwagen gilt eine Vollkasko mit 800,00 € Selbstbeteiligung. Paula Ritter ist Versicherungsnehmerin eines Kfz-Vertrags bei der Proximus (Kfz-Haftpflicht mit 100 Mio. € Deckungssumme pauschal laut Versicherungsschein). Nach AKB 2021 A.1.1.6 (Mallorca-Police) sind Schäden versichert, die sie oder ihr Ehegatte als Fahrer eines fremden, versicherungspflichtigen Fahrzeugs auf einer Reise im europäischen Ausland verursachen; die Proximus leistet im Anschluss an die Haftpflichtversicherung des fremden Fahrzeugs bis zur vereinbarten Deckungssumme. Ihre Reisegepäckversicherung bei der Proximus (VB-Reisegepäck 2021) hat eine Versicherungssumme von 3.000,00 €, die dem Wert des gesamten Reisegepäcks entspricht; ersetzt wird der Zeitwert. Pelze, Schmuck sowie Foto- und Filmapparate sind bis 50 % der Versicherungssumme versichert, in unbeaufsichtigt abgestellten Kfz jedoch gar nicht. Diebstahl aus einem unbeaufsichtigt abgestellten Kfz ist nur versichert, wenn das Gepäck im verschlossenen Innen- oder Kofferraum liegt; in voller Höhe nur tagsüber (6 bis 22 Uhr), in einer abgeschlossenen Garage oder bei einer Fahrtunterbrechung von höchstens 2 Stunden, sonst bis 10 % der Versicherungssumme, höchstens 400 €. Diebstähle sind unverzüglich der Polizei mit einer Liste der gestohlenen Sachen anzuzeigen.","items":[{"typ":"zahl","frage":"Jonas Ritter verursacht mit dem Mietwagen einen Unfall; der Personenschaden des verletzten Motorradfahrers beträgt 750.000,00 €. Welchen Betrag übernimmt die Proximus aus der Mallorca-Deckung? Geben Sie den Betrag in Euro an.","wert":250000.0,"einheit":"€","tol":0.01,"erkl":"Die Haftpflicht des Mietwagens zahlt bis 500.000 €. Die Mallorca-Deckung leistet im Anschluss daran bis zur vereinbarten Deckungssumme: 750.000 € − 500.000 € = 250.000 €. Jonas ist als Ehegatte der Versicherungsnehmerin erfasst; Albanien gehört zum Geltungsbereich Europa.","norm":"Proximus 5, AKB 2021 A.1.1.6, A.1.3.1, A.1.4.1","id":"6.5-3-1"},{"typ":"mc","frage":"Bei dem Unfall entsteht am Mietwagen ein Schaden von 4.000,00 €. Was gilt?","optionen":["Die Mallorca-Deckung zahlt nicht; über die Vollkasko des Mietvertrags tragen die Ritters 800,00 € selbst.","Die Mallorca-Deckung ersetzt den Schaden am Mietwagen vollständig, weil der Vermieter gewerblich handelt.","Die Proximus zahlt aus der eigenen Vollkasko der Ritters, weil diese für jedes Fahrzeug weltweit gilt.","Die Ritters müssen den gesamten Schaden selbst zahlen, weil Albanien nicht zur Europäischen Union gehört."],"richtig":[0],"erkl":"Die Mallorca-Police ergänzt nur die Haftpflichtdeckung für Schäden Dritter und deckt keine Schäden am gefahrenen Mietwagen selbst. Dafür gilt die im Mietvertrag vereinbarte Vollkasko mit Selbstbeteiligung.","norm":"Proximus 5, AKB 2021 A.1.1.6","id":"6.5-3-2"},{"typ":"zahl","frage":"Um 15 Uhr werden während eines Strandbesuchs aus dem verschlossenen Kofferraum des Mietwagens gestohlen: Koffer mit Kleidung (Zeitwert 1.100,00 €), privater Laptop (Zeitwert 900,00 €) und Kamera (Zeitwert 350,00 €). Wie hoch ist die Entschädigung aus der Reisegepäckversicherung in Euro?","wert":2000.0,"einheit":"€","tol":0.01,"erkl":"Die Tat geschah tagsüber aus dem verschlossenen Kofferraum: Kleidung und Laptop werden voll zum Zeitwert ersetzt (1.100,00 € + 900,00 € = 2.000,00 €, unter der Versicherungssumme). Die Kamera ist ein Fotoapparat; in einem unbeaufsichtigt abgestellten Kfz ist sie nicht versichert.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 1.4, 5.1, 5.2.1, 5.4, 6.1, 7.1.1","id":"6.5-3-3"},{"typ":"wf","frage":"Welche Aussagen zum Gepäckdiebstahl treffen laut den Bedingungen der Ritters zu?","aussagen":[["Wäre das Gepäck um 23:30 Uhr auf einem öffentlichen Parkplatz nach drei Stunden Abwesenheit gestohlen worden, wäre die Entschädigung auf 300,00 € begrenzt.",true],["Die Versicherung ersetzt den Neuwert der gestohlenen Sachen.",false],["Die Ritters müssen den Diebstahl unverzüglich der Polizei anzeigen und eine Liste der gestohlenen Sachen einreichen.",true],["Für die gestohlene Kamera zahlt die Versicherung bis 50 % der Versicherungssumme.",false]],"erkl":"Bei Diebstahl aus dem Kfz knüpfen die Bedingungen die volle Leistung an Tageszeit (6 bis 22 Uhr), abgeschlossene Garage oder kurze Fahrtunterbrechung; sonst höchstens 10 % von 3.000,00 € = 300,00 €. Ersetzt wird der Zeitwert. Fotoapparate sind in unbeaufsichtigten Kfz nicht versichert. Die Anzeige bei der Polizei mit Liste ist eine Obliegenheit nach dem Schadenfall.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 5.2, 5.4, 6.1, 8.3; § 28 VVG","id":"6.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Herr Hoffmann – Fahrraddiebstahl im Keller","situation":"Malte Hoffmann aus Halle (Saale) hat bei der Proximus eine Hausratversicherung nach den VHB 2021 mit 65.000,00 € Versicherungssumme; eine Unterversicherung besteht nicht. Vereinbart ist die Klausel PK 7110 Fahrraddiebstahl ohne abweichende Entschädigungsgrenze; eine Selbstbeteiligung gibt es nicht. Sein Pedelec (Tretunterstützung bis 25 km/h) hat er 2024 für 2.600,00 € gekauft; ein gleichartiges neues kostet heute 2.450,00 €. Am Dienstag, 6. Oktober 2026, wird es aus dem gemeinschaftlichen Fahrradkeller des Mehrfamilienhauses gestohlen; es war mit einem Bügelschloss abgeschlossen. Aus demselben Keller verschwindet das S-Pedelec (bis 45 km/h) seiner Ehefrau Svenja, für das nur eine Kfz-Haftpflicht mit Versicherungskennzeichen besteht.","items":[{"typ":"zahl","frage":"Welche Entschädigung erhält Herr Hoffmann für sein Pedelec aus der Hausratversicherung? Geben Sie den Betrag in Euro an.","wert":715.0,"einheit":"€","tol":0.01,"erkl":"Die Hausratversicherung ersetzt den Neuwert, also den Wiederbeschaffungspreis neuwertiger Sachen (2.450,00 €), höchstens aber die Grenze der Klausel: 1 % der Versicherungssumme zuzüglich 10 % Vorsorge = 1 % von 71.500,00 € = 715,00 €.","norm":"Proximus 5, VHB 2021 Ziff. 14.1.1, 17.1.1, 17.2, Klausel PK 7110 Nr. 2","id":"6.5-4-1"},{"typ":"wf","frage":"Welche Pflichten hat Herr Hoffmann nach der Klausel Fahrraddiebstahl?","aussagen":[["Er muss den Diebstahl unverzüglich der Polizei anzeigen.",true],["Er muss nachweisen, dass das Pedelec nicht innerhalb von drei Wochen seit der Anzeige wieder aufgefunden wurde.",true],["Er muss Unterlagen über Erwerb, Hersteller, Marke und Rahmennummer beschaffen und aufbewahren.",true],["Weil der Keller abgeschlossen war, hätte er das Pedelec dort nicht zusätzlich anschließen müssen.",false]],"erkl":"Die Klausel verlangt ein verkehrsübliches Schloss (kein Rahmenschloss) auch im gemeinschaftlichen Fahrradabstellraum, Belege zur Identität des Rades, die unverzügliche Polizeianzeige und den Nachweis, dass das Rad nicht binnen drei Wochen wieder herbeigeschafft wurde. Bei Verstößen kann der Versicherer nach § 28 VVG kündigen oder ganz oder teilweise leistungsfrei sein.","norm":"Proximus 5, VHB 2021, Klausel PK 7110 Nr. 1.1–1.5; § 28 VVG","id":"6.5-4-2"},{"typ":"mc","frage":"Ersetzt die Hausratversicherung auch das gestohlene S-Pedelec von Frau Hoffmann?","optionen":["Nein, S-Pedelecs sind versicherungspflichtige Kfz; Diebstahl deckt nur eine Teilkasko für das S-Pedelec.","Ja, alle Fahrräder mit Tretkurbel sind über die Klausel Fahrraddiebstahl in der Hausrat versichert.","Ja, denn die Kfz-Haftpflicht des S-Pedelecs zahlt bei Diebstahl immer den Zeitwert des Fahrzeugs.","Nein, aber die Privathaftpflicht ersetzt den Diebstahl, weil kein Dritter beteiligt ist."],"richtig":[0],"erkl":"Zum Hausrat zählen Fahrräder und Pedelecs bis 25 km/h; Kraftfahrzeuge aller Art sind in der Hausratversicherung nicht versichert. Ein S-Pedelec ist ein Kfz; Diebstahl wäre nur über eine Teilkasko versichert, die Haftpflicht deckt keine Eigenschäden.","norm":"Proximus 5, VHB 2021 Ziff. 8.3.4, 9.3, Klausel PK 7110; AKB 2021 A.2.2.2","id":"6.5-4-3"},{"typ":"mc","frage":"Herr Hoffmann fährt mit dem Pedelec eine Fußgängerin an und verletzt sie fahrlässig. Welche Versicherung prüft den Anspruch?","optionen":["seine Privathaftpflichtversicherung, denn das Pedelec gilt rechtlich als Fahrrad","eine Kfz-Haftpflichtversicherung, die er für das Pedelec abschließen musste","seine Hausratversicherung über die Klausel Fahrraddiebstahl","keine, denn Pedelec-Fahrer haften nur bei Vorsatz"],"richtig":[0],"erkl":"Pedelecs bis 25 km/h sind keine Kraftfahrzeuge; für sie gilt das Fahrradrecht, also keine Versicherungspflicht. Die Haftung nach § 823 BGB deckt die Privathaftpflicht; die Proximus behandelt Pedelecs bis 25 km/h ausdrücklich als Fahrräder.","norm":"§ 1 Abs. 3 StVG, § 823 Abs. 1 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.7.3","id":"6.5-4-4"}]}]}]}],"reset":["1.1-2-2","1.3-5-1","1.3-5-2","1.3-5-3","1.3-5-4","2.6-4-3","2.6-5-2","3.3-1-5","3.5-3-4","3.5-4-2","3.5-5-1","3.5-5-3","3.5-6-2","3.6-3-2","3.6-4-3","3.6-4-4","3.6-6-3","4.1-1-4","4.1-2-1","4.1-2-2","4.2-1-1","4.3-1-1","4.3-1-3","4.3-1-4","4.3-2-1","4.4-1-1","4.4-1-2","4.4-1-3","4.4-2-2","4.4-2-3","4.6-1-3","4.7-2-1","4.7-3-1","4.7-3-4","4.7-5-1","4.7-5-2","4.7-6-3","4.8-1-3","4.8-3-2","4.8-6-1","4.9-1-3","4.9-2-1","4.9-2-4","5.1-1-1","5.2-2-1","5.4-2-2","5.4-3-4","5.4-5-4","5.4-6-1","5.4-6-2","5.4-6-3","5.4-7-1","5.4-7-4","5.5-1-1","5.5-1-3","5.5-1-4","5.5-2-3","5.5-2-4","5.5-3-4","5.5-4-1","5.5-4-2","6.2-1-3","6.2-1-5","6.4-2-3","6.4-3-3","6.4-6-4","6.4-7-1","6.4-7-2","6.5-1-4","6.5-3-3","6.5-3-4","6.5-4-1"]};
const K='gap1_training_v1';let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){S={}}
const save=()=>{S._rw=2;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
// Umstellung auf Proximus 5 (15.10.2026): alte Stände der Rechenwerkstatt 4.10–4.14 und der Aufgaben mit geänderter Lösung (D.reset) gelten nicht mehr (einmalig löschen)
if(Object.keys(S).length&&S._rw!==2){const R=new Set(D.reset||[]);for(const k of Object.keys(S))if(/^4\.1[0-4]-/.test(k)||R.has(k))delete S[k];save()}
const tagStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const heute=()=>tagStr(new Date());
const plusTage=(t,n)=>{const z=t.split('-').map(Number);return tagStr(new Date(z[0],z[1]-1,z[2]+n))};
const datKurz=t=>{const z=t.split('-');return +z[2]+'.'+(+z[1])+'.'};
// Stufenmodell (Lernregeln, Entscheidung Christian 11.10.2026): 0 bearbeitet, noch nicht richtig · 1 abgerufen (richtig) ·
// 2 gefestigt (an einem späteren Tag wieder richtig) · 3 sitzt (nach 7 Tagen Abstand noch richtig).
// Wiedervorlage nach 1/3/7/21 Tagen; falsch → zurück auf „abgerufen“ (bzw. 0), morgen wieder fällig; am selben Tag ändert Wiederholen die Stufe nicht.
// Eintrag S[id] = {ok, t, st, k, f, d, n}: ok = zuletzt richtig (für ältere Auswertungen), st = Stufe, k = Abstandsstufe, f = fällig ab (JJJJ-MM-TT), d = Tag der letzten Antwort, n = Antworten
const ABST=[1,3,7,21],GEW=[0,.25,.6,1],STN=['noch nicht richtig','abgerufen','gefestigt','sitzt'];
const istTag=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x);
function eintrag(id){const s=S[id];if(!s||typeof s!=='object')return null;
 if(typeof s.st==='number'&&s.st>=0&&s.st<=3&&istTag(s.f))return{ok:!!s.ok,t:s.t,st:s.st|0,k:Math.min(3,Math.max(0,s.k|0)),f:s.f,d:istTag(s.d)?s.d:s.f,n:s.n|0};

 else{st=p.st;k=p.k;f=p.f>h?p.f:plusTage(h,1)}

 chk.onclick=()=>{const a=read(q),ok=check(q,a),h=heute();P.ans[q.id]=a;P.done[q.id]=ok;LZRANG.zeitBuchen(S,LZRANG.uhr.stopp(),h);if(!c.sim){const v=eintrag(q.id),e=bewerte(q.id,ok);P.stufe[q.id]={st:e.st,f:e.f,vor:v?v.st:-1};LZRANG.verlaufBuchen(S,LZRANG.score(stat(ALLE).w,ALLE.length),h);lerntag()}save();fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function stufeHtml(x){if(!x)return '';const auf=x.st>x.vor&&x.vor>=0?' (eine Stufe höher)':x.st<x.vor?' (zurückgestuft)':'';
 return `<div class="stufe" data-stufe="${x.st}">Stufe: <b>${STN[x.st]}</b>${auf} · wieder fällig am ${datKurz(x.f)}</div>`}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Prüfungsbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert${online?' und im <a href="pruefungspass.html">Prüfungspass</a> sichtbar':''}. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}${c.rep?repRest():''}${!c.sim&&wrong.length?'<p class="hint" data-schwer>Falsch gelöst? Gut, dass es jetzt auffällt – Schwierigkeit ist ein Zeichen von Lernen. Diese Aufgaben kommen morgen wieder.</p>':''}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}${c.rep&&!faellig().length?'':`<button class="btn-p" id="again">${c.rep?'Nächste Runde':'Neu starten'}</button>`}</span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));const ag=$('#again');if(ag)ag.onclick=()=>c.sim?sim():c.rep?rep():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function repRest(){const up=P.list.filter(q=>{const x=P.stufe[q.id];return x&&x.vor>=0&&x.st>x.vor}).length,n=faellig().length;
 return `<p class="hint" data-represt="${n}">${up?up+(up===1?' Aufgabe ist':' Aufgaben sind')+' eine Stufe aufgestiegen. ':''}${n?'Noch heute fällig: '+n+'. Eine weitere Runde ist möglich; 15 bis 25 Minuten am Tag genügen.':'Für heute ist alles wiederholt.'} Falsch gelöste Aufgaben kommen morgen wieder.</p>`}
// Heute wiederholen: fällige Aufgaben gemischt, die am längsten fälligen zuerst, höchstens RUNDE; Auswahl-Möglichkeiten erst nach „Antwort überlegt“
function rep(){const due=faellig();if(!due.length)return home();const f=q=>eintrag(q.id).f;
 const pick=shuf(due,String(Date.now())).sort((a,b)=>f(a)<f(b)?-1:f(a)>f(b)?1:0).slice(0,RUNDE);
 start(shuf(pick,'r'+Date.now()),{titel:'Heute wiederholen',crumb:[['Start','home'],['Heute wiederholen']],back:'home',seed:'w'+Date.now(),sit:SIT,hl:HL,verdeckt:true,rep:true})}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={},hl={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);if(l.hilfe)l.items.forEach(q=>hl[q.id]=l.hilfe);
 const lt=a.art==='faelle'?l.titel:'Lektion '+(k+1);
 start(l.items,{titel:`${a.nr} · ${a.art==='faelle'?l.titel:'Lektion '+(k+1)+': '+l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],[lt]],back:'a'+i+'.'+j,seed:'s',sit,hl,full:l.items})}
function sim(){const all=ALLE,pick=shuf(all,String(Date.now())).slice(0,20);start(pick,{titel:'Prüfungssimulation',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed:String(Date.now()),sit:SIT,hl:HL,sim:true,zaehlt:true,verdeckt:true})}
function go(t){window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();if(t==='rep')return rep();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else if(v==='pass'){e.preventDefault();location.href='pruefungspass.html'}else if(v==='tour'){if(document.querySelector('#rating'))tour();else{home();tour()}}else if(v==='stand')LZCOACH.kopieren(standText(),a);else go(v)}});
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(online){$('#zurlz').hidden=false;$('#hilfelink').hidden=false;$('#logo').setAttribute('href','pruefungspass.html');$('#logo').removeAttribute('data-go');$('#logo').setAttribute('aria-label','Zur Lernzentrale')}
// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation, #wiederholen die fälligen Aufgaben (11.10.2026)
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();if(h==='wiederholen')return rep();if(h==='rating'){home();const r=document.getElementById('rating');if(r)r.scrollIntoView();return}
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
