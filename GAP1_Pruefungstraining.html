güten lassen.","norm":"§ 11a Abs. 1 und 2 GewO, § 34d Abs. 2, 5 und 10 GewO, § 48 Abs. 4 VAG","id":"2.4-1-3"},{"typ":"mc","frage":"Frau Lindqvist möchte neben ihrer Maklertätigkeit zusätzlich als Versicherungsberaterin gegen Honorar arbeiten. Wie ist das zu beurteilen?","optionen":["Unzulässig, weil Vermittler kein Gewerbe als Versicherungsberater ausüben dürfen.","Zulässig, weil Makler Verbraucher gegen Honorar beliebig rechtlich beraten dürfen.","Zulässig, wenn sie die Provisionen der Versicherer an ihre Kunden auszahlt.","Unzulässig, weil Makler überhaupt keine Vergütung von Kunden annehmen dürfen."],"richtig":[0],"erkl":"Das Gesetz trennt Vermittlung und Versicherungsberatung strikt. Die Maklererlaubnis umfasst nur die Rechtsberatung von Nicht-Verbrauchern gegen gesondertes Entgelt, nicht von Verbrauchern.","norm":"§ 34d Abs. 3 und Abs. 1 GewO (letzter Satz)","id":"2.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Agenturvertrag von Darius Nowak","situation":"Darius Nowak (52) ist seit dem 1. März 2018 selbständiger Versicherungsvertreter und ausschließlich für die Proximus Versicherung AG tätig. Im Agenturvertrag gelten die gesetzlichen Kündigungsfristen. Seine durchschnittliche Jahresprovision der letzten fünf Jahre beträgt 62.400,00 €. Ein Bekannter bietet ihm an, nebenbei Hausratversicherungen eines anderen Versicherers zu vermitteln. Am 28. September 2026 geht ihm eine ordentliche Kündigung der Proximus zu; ein Fehlverhalten liegt nicht vor.","items":[{"typ":"mc","frage":"Darf Herr Nowak während des Agenturvertrags ohne Zustimmung der Proximus zusätzlich Hausratversicherungen des anderen Versicherers vermitteln?","optionen":["Ja, als selbständiger Gewerbetreibender darf er jederzeit Produkte jedes beliebigen Versicherers anbieten.","Ja, wenn er der Proximus die nebenbei vermittelten Verträge spätestens am Jahresende vollständig mitteilt.","Nein, weil Versicherungsvertreter grundsätzlich keine Hausratversicherungen fremder Versicherer vermitteln.","Nein, als Handelsvertreter muss er die Interessen der Proximus wahren und darf ihr keine Konkurrenz machen."],"richtig":[3],"erkl":"Aus der Pflicht, das Interesse des Unternehmers wahrzunehmen, folgt während des Vertrags ein Wettbewerbsverbot für konkurrierende Produkte. Als gebundener Vertreter verlöre er zudem die Erlaubnisfreiheit, weil die Hausratprodukte miteinander konkurrieren.","norm":"§ 86 Abs. 1 HGB, § 92 Abs. 2 HGB","id":"2.4-2-1"},{"typ":"zahl","frage":"Wie hoch ist der Ausgleichsanspruch von Herrn Nowak nach dem Gesetz höchstens (in Euro)?","wert":187200,"einheit":"€","tol":0.01,"erkl":"Der Ausgleich des Versicherungsvertreters beträgt höchstens drei Jahresprovisionen: 3 × 62.400,00 € = 187.200,00 €. Die tatsächliche Höhe wird in der Praxis nach den „Grundsätzen zur Errechnung der Höhe des Ausgleichsanspruchs“ ermittelt und liegt meist darunter.","norm":"§ 89b Abs. 5 Satz 2 HGB","id":"2.4-2-2"},{"typ":"zahl","frage":"Wie viele Monate beträgt die gesetzliche Kündigungsfrist für den Agenturvertrag von Herrn Nowak?","wert":6,"einheit":"Monate","tol":0,"erkl":"Nach mehr als fünf Jahren Vertragsdauer beträgt die Frist sechs Monate zum Schluss eines Kalendermonats. Die Kündigung vom 28.09.2026 wirkt daher zum 31.03.2027.","norm":"§ 89 Abs. 1 HGB, § 92 Abs. 2 HGB","id":"2.4-2-3"},{"typ":"wf","frage":"Welche Aussagen zum Ausgleichsanspruch und zum Wettbewerb nach Vertragsende treffen zu?","aussagen":[["Der Anspruch muss innerhalb eines Jahres nach Vertragsende geltend gemacht werden.",true],["Der Anspruch kann im Agenturvertrag schon im Voraus wirksam ausgeschlossen werden.",false],["Hätte Herr Nowak ohne Anlass selbst gekündigt, stünde ihm kein Ausgleich zu – außer aus Alters- oder Krankheitsgründen.",true],["Ein nachvertragliches Wettbewerbsverbot darf höchstens zwei Jahre dauern und verpflichtet die Proximus zu einer angemessenen Entschädigung.",true],["Ein nachvertragliches Wettbewerbsverbot ist auch mündlich wirksam vereinbart.",false]],"erkl":"Der Ausgleich ist unabdingbar und fristgebunden; die Eigenkündigung schließt ihn grundsätzlich aus. Eine Wettbewerbsabrede nach Vertragsende braucht Schriftform, ist auf zwei Jahre begrenzt und muss entschädigt werden.","norm":"§ 89b Abs. 3 und 4 HGB, § 90a Abs. 1 HGB","id":"2.4-2-4"}]},{"typ":"situation","titel":"Fall 3: Lea Hoffmann – angestellt oder selbständig?","situation":"Lea Hoffmann (23) hat ihre Ausbildung abgeschlossen. Die Proximus Versicherung AG bietet ihr zwei Wege an: eine Stelle im angestellten Außendienst mit 3.100,00 € Festgehalt plus Bonus oder eine eigene Agentur als selbständige Vertreterin, vergütet nur über Provisionen. Sie wägt Sicherheit, Freiheit und Verdienstchancen ab und bittet Sie um eine Übersicht der Vertriebswege.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Merkmal den passenden Vertriebsweg zu.","paare":[["bestimmt Arbeitszeit und Tätigkeit im Wesentlichen frei und trägt das Unternehmerrisiko","selbständiger Versicherungsvertreter"],["erhält ein Festgehalt, ist weisungsgebunden und sozialversicherungspflichtig beschäftigt","angestellter Außendienst des Versicherers"],["wird vom Kunden beauftragt und sucht für ihn passende Angebote am Markt","Versicherungsmakler"],["Kunden schließen ohne Vermittler über Website oder App des Versicherers ab","Direktvertrieb des Versicherers"]],"erkl":"Das HGB unterscheidet den selbständigen Handelsvertreter vom Angestellten danach, ob er Tätigkeit und Arbeitszeit frei gestalten kann.","norm":"§ 84 Abs. 1 und 2 HGB, § 59 Abs. 2 und 3 VVG","id":"2.4-3-1"},{"typ":"mc","frage":"Frau Hoffmann entscheidet sich für die Selbständigkeit. Ab wann hat sie für einen vermittelten Vertrag Anspruch auf Provision?","optionen":["Sobald der Kunde den Antrag in ihrer Agentur vollständig unterschrieben hat.","Sobald der Kunde die Prämie gezahlt hat, aus der sich die Provision berechnet.","Sobald die Proximus den Antrag angenommen und die Police ausgestellt hat.","Erst wenn der Vertrag ein volles Versicherungsjahr ohne Kündigung bestanden hat."],"richtig":[1],"erkl":"Für Versicherungsvertreter gilt eine Sonderregel: Der Provisionsanspruch entsteht mit der Prämienzahlung des Versicherungsnehmers.","norm":"§ 92 Abs. 4 HGB","id":"2.4-3-2"},{"typ":"wf","frage":"Welche Aussagen zum angestellten Außendienst treffen zu?","aussagen":[["Als Angestellte braucht Frau Hoffmann keine eigene Gewerbeerlaubnis nach § 34d GewO.",true],["Die Proximus muss sicherstellen, dass ihre Angestellten im Vertrieb qualifiziert sind und sich regelmäßig fortbilden.",true],["Wie ein Vertreter gilt die Angestellte als bevollmächtigt, Anträge von Kunden entgegenzunehmen.",true],["Endet das Arbeitsverhältnis, hat sie einen Ausgleichsanspruch für den aufgebauten Kundenstamm.",false]],"erkl":"Angestellte sind keine Gewerbetreibenden; für ihre Qualifikation ist der Versicherer verantwortlich. Die Vollmachtsregeln gelten entsprechend. Der Ausgleichsanspruch steht nur selbständigen Handelsvertretern zu.","norm":"§ 48 Abs. 2 VAG, § 73 i. V. m. § 69 VVG, § 89b HGB","id":"2.4-3-3"},{"typ":"mc","frage":"Ein Kunde übergibt der selbständigen Vertreterin Frau Hoffmann bei der Antragsaufnahme die erste Jahresprämie von 186,00 € in bar. Wie ist die Zahlung zu beurteilen?","optionen":["Sie ist unwirksam, weil Versicherungsprämien gesetzlich nur per Lastschrift gezahlt werden dürfen.","Sie wirkt gegenüber der Proximus, weil die Vertreterin als bevollmächtigt gilt, Zahlungen anzunehmen.","Sie wirkt erst dann, wenn Frau Hoffmann das Bargeld vollständig an die Proximus weitergeleitet hat.","Sie ist unwirksam, weil nur der Innendienst des Versicherers Geld von Kunden annehmen darf."],"richtig":[1],"erkl":"Der Vertreter gilt als bevollmächtigt, Zahlungen im Zusammenhang mit Vermittlung oder Abschluss anzunehmen. Eine Beschränkung wirkt gegen den Kunden nur, wenn er sie kannte oder grob fahrlässig nicht kannte.","norm":"§ 69 Abs. 2 VVG","id":"2.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Optikerin, E-Bike-Händler, Trainer und Vergleichsportal","situation":"Optikerin Hanna Petrović in Halle (Saale), Stadtteil Neustadt, bietet nebenbei zu jeder Brille eine Brillenversicherung gegen Bruch und Verlust an (Jahresprämie 39,00 €). Ein E-Bike-Händler vermittelt zu hochwertigen Rädern eine Fahrradvollkasko für 780,00 € im Jahr; die IHK hat ihn auf Antrag von der Erlaubnispflicht befreit. Fitnesstrainer Malik Osei gibt nur Namen und Telefonnummern interessierter Mitglieder an Ihre Agentur weiter. Das Portal „tarifblick24“ zeigt Hausrattarife als Rangliste an; Kunden können direkt über die Seite abschließen.","items":[{"typ":"mc","frage":"Braucht Frau Petrović für die Vermittlung der Brillenversicherung eine Erlaubnis der IHK?","optionen":["Ja, jede Vermittlung von Versicherungen erfordert eine Erlaubnis nach § 34d Abs. 1 GewO.","Nein, weil Brillenversicherungen keine Versicherungen im Sinne des VVG sind.","Ja, aber nur, wenn sie mehr als 50 Brillenversicherungen im Kalenderjahr vermittelt.","Nein, weil sie nebenbei eine Zusatzversicherung zur Ware unter 600 € Jahresprämie vermittelt."],"richtig":[3],"erkl":"Annexvermittler in Nebentätigkeit sind erlaubnisfrei, wenn die Versicherung eine Zusatzleistung zur Ware ist, Defekt, Verlust oder Beschädigung der Ware abdeckt und die Prämie auf Jahresbasis 600 € nicht übersteigt.","norm":"§ 34d Abs. 8 Nr. 1 GewO","id":"2.4-4-1"},{"typ":"zahl","frage":"Bis zu welcher Jahresprämie (in Euro) ist die Vermittlung einer Zusatzversicherung zu einer verkauften Ware erlaubnisfrei möglich?","wert":600,"einheit":"€","tol":0,"erkl":"Die Grenze liegt bei 600 € (zeitanteilig auf Jahresbasis berechnet). Für Versicherungen zu Dienstleistungen von höchstens drei Monaten gilt stattdessen eine Grenze von 200 € je Person.","norm":"§ 34d Abs. 8 Nr. 1 Buchst. c GewO","id":"2.4-4-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Beteiligten seine vermittlerrechtliche Einordnung zu.","paare":[["Fitnesstrainer Osei","Tippgeber ohne Vermittlertätigkeit, keine Erlaubnis nötig"],["Optikerin Petrović","Annexvermittlerin in Nebentätigkeit, erlaubnisfrei und nicht registriert"],["E-Bike-Händler","produktakzessorischer Vermittler mit Befreiung und Registereintrag"],["Portal „tarifblick24“","Versicherungsvermittler mit Erlaubnis nach § 34d Abs. 1 GewO"]],"erkl":"Wer nur Kontaktdaten weitergibt, vermittelt nicht. Über 600 € Jahresprämie braucht der Händler eine Erlaubnis oder – wie hier – eine Befreiung auf Antrag. Rangliste plus Abschlussmöglichkeit gilt als Vermittlung.","norm":"§ 34d Abs. 1 Satz 4 Nr. 2, Abs. 6, Abs. 8 und Abs. 10 GewO","id":"2.4-4-3"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten von Frau Petrović und dem Portal treffen zu?","aussagen":[["Frau Petrović muss der Kundin vor Abschluss das Informationsblatt zu Versicherungsprodukten aushändigen.",true],["Frau Petrović muss jedes Jahr 15 Stunden Weiterbildung nachweisen.",false],["Das Portal muss Kunden beim ersten Geschäftskontakt seine Statusinformation geben.",true],["Für das Portal gelten keine Beratungspflichten, weil Kunden den Tarif selbst auswählen.",false]],"erkl":"Annexvermittler nach § 34d Abs. 8 GewO müssen über Identität, Anschrift und Beschwerdeverfahren informieren und das Informationsblatt aushändigen; die Weiterbildungspflicht trifft sie nicht. Ein Vergleichsportal ist Vermittler und hat Status- und Beratungspflichten.","norm":"§ 66 VVG, § 34d Abs. 9 Satz 2 GewO, § 15 VersVermV, § 61 VVG","id":"2.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Kundendaten und Weiterbildung in der Agentur Szymańska","situation":"Agnieszka Szymańska ist gebundene Vertreterin der Proximus in Halle (Saale) und beschäftigt zwei Kundenberaterinnen. Beim Durchsehen des Kundenverwaltungssystems (CRM) im November 2026 stoßen Sie auf mehrere Hinweise, die Beratungsanlässe sein könnten. Kundenberaterin Fabienne Roth hat in diesem Jahr bisher 9 Stunden anerkannte Weiterbildung besucht.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Hinweis aus dem CRM den passenden Beratungsansatz zu.","paare":[["Tochter (19) des Kunden zieht zum Studium in eine WG nach Jena","prüfen, ob sie noch über Familien-Haftpflicht und Außenversicherung geschützt ist"],["Kunde hat ein Elektroauto gekauft und eine Wallbox in der Garage montiert","Kfz-Vertrag anpassen und Einschluss der Wallbox im Wohngebäudevertrag prüfen"],["Kundin macht sich als Grafikdesignerin selbständig","Einkommensabsicherung und Altersvorsorge neu planen, weil Arbeitgeberleistungen entfallen"],["Hausratvertrag läuft seit 2009 ohne Änderung","Versicherungssumme und Unterversicherungsverzicht überprüfen"]],"erkl":"Veränderungen im Leben und alte Verträge sind Anlässe für eine Bedarfsanalyse. Der Versicherer muss auch während der Laufzeit beraten, wenn ein Anlass erkennbar ist; die Agentur nutzt dafür ihre Kundendaten. Bei der Proximus bleibt ein Kind in Erstausbildung oder Studium in der Familien-Haftpflicht mitversichert; die Außenversicherung im Hausrat gilt, solange es keinen eigenen Hausstand gründet.","norm":"§ 6 Abs. 4 VVG, § 61 Abs. 1 VVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 2.1.2, VHB 2021 Ziff. 12.2, VGB 2021 Ziff. 7.2 und 7.6.2, VHB 2021 Ziff. 14.3, Klausel PK 7712","id":"2.4-5-1"},{"typ":"mc","frage":"Welcher Eintrag darf nach den Grundsätzen der DSGVO in die Kundenakte aufgenommen werden?","optionen":["Kundin wünscht im März Beratung zur Berufsunfähigkeitsversicherung.","Kunde wirkt chaotisch, die Ehe kriselt nach meinem Eindruck wohl.","Kunde erzählte nebenbei, dass sein Bruder hohe private Schulden hat.","Kopie des Personalausweises der Nachbarin, die beim Termin dabei war."],"richtig":[0],"erkl":"Gespeichert werden dürfen nur Daten, die für den Zweck – Beratung und Vertrag – erforderlich und sachlich richtig sind. Persönliche Wertungen und Daten unbeteiligter Dritter gehören nicht in die Akte.","norm":"Art. 5 Abs. 1 Buchst. b, c und d DSGVO","id":"2.4-5-2"},{"typ":"zahl","frage":"Wie viele Stunden Weiterbildung muss Frau Roth im Jahr 2026 noch mindestens nachweisen?","wert":6,"einheit":"Stunden","tol":0,"erkl":"Unmittelbar bei der Vermittlung mitwirkende Beschäftigte müssen sich 15 Stunden je Kalenderjahr weiterbilden: 15 − 9 = 6 Stunden.","norm":"§ 34d Abs. 9 Satz 2 GewO, § 7 VersVermV","id":"2.4-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Weiterbildungspflicht in der Agentur treffen zu?","aussagen":[["Die Pflicht gilt für Frau Szymańska und für ihre unmittelbar bei der Vermittlung mitwirkenden Beschäftigten.",true],["Die Nachweise über die Weiterbildung sind fünf Jahre aufzubewahren.",true],["Selbststudium zählt nur, wenn der Anbieter eine nachweisbare Lernerfolgskontrolle durchführt.",true],["Eine Buchhalterin ohne jeden Kundenkontakt muss ebenfalls 15 Stunden jährlich nachweisen.",false]],"erkl":"Die Pflicht trifft den Vermittler und die direkt mitwirkenden Beschäftigten. Nachweise sind fünf Jahre ab Ende des Kalenderjahres der Maßnahme aufzubewahren.","norm":"§ 34d Abs. 9 Satz 2 GewO, § 7 Abs. 1 und 2 VersVermV","id":"2.4-5-4"}]}]},{"nr":"2.5","titel":"Prüfungsfälle: Kommunikation und Beschwerden","lf":"LF 3","buch":"S. 32–41","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Reuter wählt ihre Kommunikationswege","situation":"Die Agentur von Annika Reuter in Halle (Saale) betreut 420 Privatkunden, von Studierenden bis zu Rentnern über 80. Bisher gehen alle Mitteilungen per Brief hinaus; das Porto beträgt 0,95 € je Standardbrief. 60 % der Kunden haben zugestimmt, Vertragspost per E-Mail zu erhalten. Frau Reuter möchte die Kanäle gezielter einsetzen.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Kundenanliegen den am besten geeigneten Kommunikationsweg zu.","paare":[["Kundin (82) ohne Internet möchte Unterlagen in Ruhe zu Hause lesen","Brief per Post"],["Kunde in Elternzeit möchte abends beraten werden und Dokumente gemeinsam ansehen","Videoberatung mit Bildschirmfreigabe"],["Kunde will Fotos eines Wasserschadens und Rechnungen einreichen","Upload im geschützten Kundenportal"],["Kundin ist verärgert und will ihr Problem sofort schildern","persönliches Telefonat mit Rückfragemöglichkeit"]],"erkl":"Der Kanal richtet sich nach Kunde, Anliegen, Dringlichkeit und Datenschutz. Sensible Unterlagen gehören auf sichere, verschlüsselte Wege.","norm":"Art. 32 DSGVO","id":"2.5-1-1"},{"typ":"wf","frage":"Welche Aussagen zu Vor- und Nachteilen der Kommunikationswege treffen zu?","aussagen":[["Ein Brief hält den Inhalt dauerhaft fest, verursacht aber Porto und hat eine längere Laufzeit.",true],["Eine einfache E-Mail ist immer automatisch verschlüsselt und deshalb für alle Daten geeignet.",false],["Am Telefon sind schnelle Rückfragen möglich, das Gesagte ist aber ohne Notiz schwer nachweisbar.",true],["In einer Videoberatung sind Mimik und Gestik teilweise sichtbar, was den Beziehungsaufbau erleichtert.",true]],"erkl":"Analoge Wege sind persönlich und nachweisbar, digitale schnell und günstig. Bei jedem Weg sind Nachweisbarkeit und Datensicherheit abzuwägen.","norm":"Art. 32 DSGVO, § 126b BGB","id":"2.5-1-2"},{"typ":"mc","frage":"Herr Ilić widerruft seinen neuen Vertrag per E-Mail mit seinem Namen. Das Gesetz verlangt dafür Textform. Wie ist die E-Mail einzuordnen?","optionen":["Sie wahrt die Schriftform, weil sie jederzeit ausgedruckt und unterschrieben werden kann.","Sie ist formlos und rechtlich unverbindlich, weil E-Mails keine Unterschrift tragen.","Sie wahrt die Textform: lesbare Erklärung mit Namen auf einem dauerhaften Datenträger.","Sie wahrt die Textform nur, wenn eine qualifizierte elektronische Signatur angehängt ist."],"richtig":[2],"erkl":"Textform verlangt eine lesbare Erklärung mit Nennung des Erklärenden auf einem dauerhaften Datenträger; eine E-Mail erfüllt das. Der Widerruf nach § 8 VVG ist in Textform zu erklären.","norm":"§ 126b BGB, § 8 Abs. 1 VVG","id":"2.5-1-3"},{"typ":"zahl","frage":"Die Agentur verschickt ein Rundschreiben an alle 420 Kunden. Wie viel Porto (in Euro) spart sie, wenn sie es allen Kunden, die der E-Mail-Zustellung zugestimmt haben, per E-Mail statt per Brief schickt?","wert":239.4,"einheit":"€","tol":0.01,"erkl":"60 % von 420 Kunden = 252 Kunden; 252 × 0,95 € = 239,40 € Ersparnis.","norm":"Kommunikationswege (Kostenvergleich)","id":"2.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Ein Instagram-Auftritt für die Agentur Lorenz","situation":"Die Agentur Lorenz in Halle (Saale) möchte junge Kunden über Instagram erreichen. Auszubildender Finn Becker schlägt vor, ein Foto der Kundin Jana Wolff zu posten, die gerade eine Entschädigung für ihren gestohlenen Laptop erhalten hat. Außerdem soll jeder Neukunde, der bis Freitag abschließt, einen Gutschein im Wert von 50,00 € bekommen. Unter einem ersten Beitrag beschwert sich ein Kunde öffentlich über eine lange Schadenbearbeitung.","items":[{"typ":"mc","frage":"Unter welcher Voraussetzung darf die Agentur das Foto von Frau Wolff mit ihrer Geschichte veröffentlichen?","optionen":["Ohne Weiteres, weil sie Kundin ist und der Versicherungsvertrag Werbung abdeckt.","Ohne Einwilligung, wenn ihr Name im Beitrag nirgends genannt wird.","Ohne Einwilligung, wenn das Foto nach 30 Tagen wieder entfernt wird.","Nur mit ihrer vorherigen freiwilligen Einwilligung in diese Veröffentlichung."],"richtig":[3],"erkl":"Ein Foto mit Bezug zu einem Schadenfall ist ein personenbezogenes Datum; für Werbung fehlt eine andere Rechtsgrundlage. Auch das Recht am eigenen Bild verlangt die Einwilligung. Sie ist jederzeit widerruflich.","norm":"Art. 6 Abs. 1 Buchst. a, Art. 7 Abs. 3 DSGVO, § 22 KUG","id":"2.5-2-1"},{"typ":"zahl","frage":"Statt des 50-€-Gutscheins möchte die Agentur jedem Neukunden ein kleines Geschenk machen. Bis zu welchem Gesamtwert (in Euro) je Versicherungsverhältnis und Kalenderjahr gilt es als geringwertig und ist zulässig?","wert":15,"einheit":"€","tol":0,"erkl":"Sondervergütungen an Versicherungsnehmer sind verboten. Ausgenommen sind geringwertige Geschenke bis 15 € je Versicherungsverhältnis und Kalenderjahr; der 50-€-Gutschein ist daher unzulässig.","norm":"§ 48b Abs. 1 und 2 VAG","id":"2.5-2-2"},{"typ":"wf","frage":"Welche Aussagen zum Social-Media-Auftritt der Agentur treffen zu?","aussagen":[["Das Profil braucht ein leicht erreichbares Impressum mit den Anbieterangaben.",true],["Werbebeiträge müssen als Werbung erkennbar sein.",true],["Fragen zu einem konkreten Schaden dürfen in den öffentlichen Kommentaren mit Vertragsnummer beantwortet werden.",false],["Ein Instagram-Beitrag ersetzt die Statusinformation beim ersten Geschäftskontakt.",false]],"erkl":"Für geschäftliche Profile gilt die Impressumspflicht; Werbung muss als solche erkennbar sein. Vertragsdaten gehören nicht in öffentliche Kommentare.","norm":"§ 5 DDG, § 5a Abs. 4 UWG, § 1a Abs. 3 i. V. m. § 59 Abs. 1 VVG, §§ 15, 16 VersVermV, Art. 5 Abs. 1 Buchst. f DSGVO","id":"2.5-2-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation auf Instagram die passende Reaktion oder das passende Format zu.","paare":[["Junge Menschen sollen für Fahrradversicherungen sensibilisiert werden","kurzes Erklärvideo mit einem Alltagsbeispiel"],["Die Agentur will Vertrauen und Nähe aufbauen","Teamvorstellung mit Fotos der Mitarbeitenden, die eingewilligt haben"],["Ein Kunde beschwert sich öffentlich unter einem Beitrag","sachlich antworten und Klärung per Telefon oder Direktnachricht anbieten"],["Eine Followerin fragt, welcher Tarif für sie passt","Beratungstermin anbieten, statt öffentlich einen Tarif zu empfehlen"]],"erkl":"Social Media eignet sich für Information und Beziehungspflege. Beschwerden und Beratung werden in einen geschützten Kanal verlagert.","norm":"§ 61 VVG, Art. 5 Abs. 1 Buchst. f DSGVO","id":"2.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Beratungsgespräch mit Benedikt Sauer","situation":"Sie beraten Benedikt Sauer (41), der in Halle (Saale) ein Einfamilienhaus in Saalenähe besitzt, zum Einschluss weiterer Naturgefahren (Elementar) in seine Wohngebäudeversicherung. Der Zuschlag beträgt laut Angebot 168,00 € im Jahr. Herr Sauer äußert mehrere Einwände: „Bei uns war noch nie Hochwasser.“ – „Das ist mir zu teuer.“ – „Das muss ich erst mit meiner Frau besprechen.“","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Methode der Einwandbehandlung ein passendes Beispiel zu.","paare":[["Bedingte Zustimmung (Ja-aber-Methode)","„Sie haben recht, bisher blieb es trocken. Starkregen kann aber jedes Haus treffen.“"],["Rückfragemethode","„Womit vergleichen Sie den Beitrag von 168 Euro?“"],["Bumerang-Methode","„Gerade weil Sie nah an der Saale wohnen, ist der Schutz für Sie wichtig.“"],["Vorwegnahme","„Vielleicht fragen Sie sich, ob sich das lohnt – dazu ein Beispiel.“"]],"erkl":"Gute Einwandbehandlung nimmt den Kunden ernst, klärt den Hintergrund und lenkt auf den Nutzen. Sie widerspricht nicht frontal.","norm":"Gesprächsführung (Einwandbehandlung)","id":"2.5-3-1"},{"typ":"mc","frage":"Herr Sauer hatte zuvor erzählt, dass er alle Versicherungsfragen allein entscheidet. Nun sagt er: „Das muss ich erst mit meiner Frau besprechen.“ Wie reagieren Sie am besten?","optionen":["Den Einwand übergehen und ihm sofort den Antrag zur Unterschrift vorlegen.","Ihm vorhalten, dass er solche Entscheidungen doch sonst immer allein trifft.","Nachfragen, ob außer der Absprache etwas offen ist; Termin zu dritt anbieten.","Einen Beitragsnachlass versprechen, wenn er sich heute noch entscheidet."],"richtig":[2],"erkl":"Ein Widerspruch zu früheren Aussagen deutet auf einen Vorwand hin. Eine offene Rückfrage deckt den echten Einwand auf; Druck und Rabattversprechen sind unseriös, Provisionsabgaben zudem verboten.","norm":"Gesprächsführung; § 48b VAG","id":"2.5-3-2"},{"typ":"mc","frage":"Welche Aussage formuliert das Merkmal „Elementarschutz deckt Überschwemmung durch Starkregen“ als Kundennutzen?","optionen":["„Läuft nach Starkregen Ihr Keller voll, zahlt die Versicherung Trocknung und Reparatur – Ihre Rücklagen bleiben.“","„Der Baustein deckt die Gefahr Überschwemmung durch Witterungsniederschläge nach den Bedingungen der Proximus ab.“","„Elementarschutz ist eine Erweiterung Ihrer Wohngebäudeversicherung um weitere Naturgefahren wie Erdrutsch.“","„Der Zuschlag für den Elementarschutz beträgt bei Ihrem Haus laut Angebot 168 Euro im Jahr.“"],"richtig":[0],"erkl":"Nutzenargumentation übersetzt ein Produktmerkmal in einen Vorteil für die Lebenssituation des Kunden (Merkmal – Vorteil – Nutzen).","norm":"Gesprächsführung (Nutzenargumentation); Proximus 5, VGB 2021 Ziff. 1.3.2 und 5.4.1","id":"2.5-3-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Phase des Beratungsgesprächs mit Herrn Sauer die passende Handlung zu.","paare":[["Kontaktphase","begrüßen, Zeitrahmen und Ziel des Gesprächs klären"],["Bedarfsermittlung","mit offenen Fragen Lage des Hauses und Vorschäden erfragen"],["Angebots- und Argumentationsphase","Lösung vorstellen und mit Nutzen begründen"],["Abschlussphase","Ergebnisse zusammenfassen, Entscheidung herbeiführen, Rat und Gründe dokumentieren"]],"erkl":"Ein strukturiertes Gespräch erfüllt zugleich die gesetzlichen Pflichten: befragen, beraten, begründen und dokumentieren.","norm":"§ 61 Abs. 1 VVG, § 62 VVG","id":"2.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Beschwerde von Olga Wiśniewska","situation":"Olga Wiśniewska (57) aus Halle (Saale) ist Verbraucherin und hat ihre Hausratversicherung bei der Proximus Versicherung AG, die Mitglied im Versicherungsombudsmann e. V. ist. Die Proximus hat die Entschädigung für ihr gestohlenes Fahrrad von 2.900,00 € schriftlich abgelehnt. Frau Wiśniewska ruft verärgert in Ihrer Agentur an. Sie überlegt, sich beim Versicherungsombudsmann oder bei der BaFin zu beschweren.","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Stufe des Beschwerdemanagements die passende Handlung zu.","paare":[["Beschwerdeannahme","aufmerksam zuhören, Anliegen vollständig aufnehmen, für den Hinweis danken"],["Beschwerdebearbeitung","Sachverhalt prüfen, intern klären und der Kundin einen Zeitrahmen nennen"],["Beschwerdereaktion","Ergebnis verständlich begründen und weitere Wege wie den Ombudsmann nennen"],["Beschwerdeauswertung","Ursachen sammeln und Abläufe verbessern, damit sich Fehler nicht wiederholen"]],"erkl":"Beschwerden sind eine Chance zur Kundenbindung. Kann einer Beschwerde nicht abgeholfen werden, sind die Gründe zu erläutern und weitere Möglichkeiten zu nennen.","norm":"vgl. § 17 Abs. 2 und 3 VersVermV","id":"2.5-4-1"},{"typ":"mc","frage":"Frau Wiśniewska ruft den Ombudsmann an, der zu ihren Gunsten entscheidet. Welche Wirkung hat die Entscheidung bei 2.900,00 € Beschwerdewert?","optionen":["Sie bindet beide Seiten; ein Gerichtsverfahren ist danach für beide ausgeschlossen.","Sie bindet die Proximus; Frau Wiśniewska könnte trotzdem noch vor Gericht gehen.","Sie ist nur eine Empfehlung, an die sich die Proximus nicht halten muss.","Sie bindet nur Frau Wiśniewska; die Proximus kann ihr frei widersprechen."],"richtig":[1],"erkl":"Bis 10.000 € Beschwerdewert ist die Entscheidung für den Versicherer bindend. Für die Kundin ist sie nie bindend; ihr bleibt der Weg zu den ordentlichen Gerichten offen.","norm":"§ 10 Abs. 3, § 11 VomVO (Verfahrensordnung des Versicherungsombudsmanns)","id":"2.5-4-2"},{"typ":"zahl","frage":"Bis zu welchem Beschwerdewert (in Euro) kann der Versicherungsombudsmann einen Versicherer verbindlich zur Leistung verpflichten?","wert":10000,"einheit":"€","tol":0,"erkl":"Bis 10.000 € erlässt der Ombudsmann eine für den Versicherer bindende Entscheidung. Über 10.000 € bis 100.000 € spricht er eine unverbindliche Empfehlung aus.","norm":"§ 10 Abs. 3, § 11 Abs. 1 VomVO","id":"2.5-4-3"},{"typ":"wf","frage":"Welche Aussagen zu Ombudsmann und BaFin treffen zu?","aussagen":[["Das Ombudsmannverfahren ist für Frau Wiśniewska kostenfrei.",true],["Während des Ombudsmannverfahrens ist die Verjährung ihres Anspruchs gehemmt.",true],["Der Ombudsmann wird erst tätig, wenn sie ihren Anspruch zuvor bei der Proximus geltend gemacht hat.",true],["Die BaFin kann die Proximus im Einzelfall verbindlich zur Zahlung der 2.900,00 € verurteilen.",false],["Bei Streit mit einer privaten Krankenversicherung wäre ebenfalls der Versicherungsombudsmann zuständig.",false]],"erkl":"Die BaFin prüft Beschwerden aufsichtsrechtlich auf Missstände, entscheidet aber keine zivilrechtlichen Einzelansprüche. Für die private Kranken- und Pflegeversicherung gibt es einen eigenen Ombudsmann.","norm":"§§ 2, 12, 14 VomVO; §§ 294, 298 VAG","id":"2.5-4-4"}]}]},{"nr":"2.6","titel":"Prüfungsfälle: Informations-, Beratungs- und Dokumentationspflichten","lf":"LF 2","buch":"S. 42–58","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Erstinformation in der Agentur Costa","situation":"Rafael Costa ist gebundener Vertreter der Proximus Versicherung AG und ihrer Konzerngesellschaften für Leben und Kranken. Am 12. Oktober 2026 hat er den ersten Termin mit der Neukundin Svenja Albrecht (31) aus Halle (Saale). Sie sollen die Statusinformation vorbereiten. Herr Costa erhält Provisionen, die in den Prämien enthalten sind, und nimmt an Vertriebswettbewerben der Proximus teil.","items":[{"typ":"wf","frage":"Welche Angaben muss die Statusinformation von Herrn Costa enthalten?","aussagen":[["seinen Namen und seine betriebliche Anschrift",true],["seinen Status als gebundener Vertreter und wie sich die Registereintragung überprüfen lässt",true],["seine Registrierungsnummer und die Kontaktdaten der gemeinsamen Registerstelle",true],["die genaue Höhe seiner Provision in Euro für jeden angebotenen Vertrag",false],["die Anschrift der Schlichtungsstelle für Streitigkeiten mit Vermittlern",true],["seine private Wohnanschrift und sein Geburtsdatum",false]],"erkl":"Zur Statusinformation gehören u. a. Name, betriebliche Anschrift, Status, Registerdaten, Angaben zu Beratung und zur Art der Vergütung sowie die Schlichtungsstelle. Die Provisionshöhe in Euro ist nicht anzugeben.","norm":"§ 15 Abs. 1 VersVermV","id":"2.6-1-1"},{"typ":"mc","frage":"In welcher Form muss Herr Costa die Statusinformation übermitteln?","optionen":["Mündlich zu Beginn des Gesprächs; eine schriftliche Übergabe ist gesetzlich nicht vorgeschrieben.","Ausschließlich als Aushang in der Agentur, den die Kundin beim Termin lesen kann.","Unentgeltlich auf Papier oder – wenn die Kundin es wählt – auf anderem dauerhaftem Datenträger.","Auf Papier gegen eine Gebühr, die mit dem ersten Beitrag verrechnet werden darf."],"richtig":[2],"erkl":"Die Mitteilung erfolgt grundsätzlich auf Papier, klar, verständlich und unentgeltlich. Ein anderer dauerhafter Datenträger wie eine E-Mail ist möglich, wenn die Kundin die Wahl hatte und sich dafür entschieden hat.","norm":"§ 16 Abs. 1 und 2 VersVermV","id":"2.6-1-2"},{"typ":"mc","frage":"Frau Albrecht hatte schon am 8. Oktober angerufen, um einen Termin zu vereinbaren und erste Fragen zu ihrer Haftpflicht zu stellen. Wann hätte Herr Costa die Statusinformation übermitteln müssen?","optionen":["Unmittelbar nach diesem ersten telefonischen Geschäftskontakt.","Erst beim persönlichen Termin am 12. Oktober in der Agentur.","Mit dem Versicherungsschein, nachdem ein Vertrag geschlossen wurde.","Überhaupt nicht, weil am Telefon noch kein Antrag gestellt wurde."],"richtig":[0],"erkl":"Bei einem telefonischen Kontakt ist die Statusinformation unmittelbar nach dem ersten Geschäftskontakt zu erteilen, nicht erst beim Termin.","norm":"§ 16 Abs. 4 VersVermV, § 15 Abs. 1 VersVermV","id":"2.6-1-3"},{"typ":"zuo","frage":"Die Statusinformation muss die Art der Vergütung offenlegen. Ordnen Sie jedem Vergütungsmodell die passende Angabe zu.","paare":[["Herr Costa erhält Provision, die in der Prämie einkalkuliert ist","Vergütung als Provision in der Versicherungsprämie enthalten"],["Ein Honorarberater stellt der Kundin seine Stunden in Rechnung","Vergütung ist direkt vom Kunden zu zahlen"],["Herr Costa gewinnt eine Reise in einem Vertriebswettbewerb","Vermittler erhält als Vergütung andere Zuwendungen"],["Ein Makler erhält Courtage und zusätzlich eine Servicegebühr vom Kunden","Vergütung besteht aus einer Verknüpfung mehrerer Arten"]],"erkl":"Der Kunde soll erkennen, wer den Vermittler bezahlt und welche Interessenkonflikte entstehen können. Anzugeben ist die Art, nicht die Höhe.","norm":"§ 15 Abs. 1 Nr. 5 bis 8 VersVermV","id":"2.6-1-4"}]},{"typ":"situation","titel":"Fall 2: Ines Bauer will „nur schnell abschließen“","situation":"Ines Bauer (29) kommt in die Agentur von Marek Szabo, gebundener Vertreter der Proximus. Sie hat im Internet verglichen und möchte eine Privathaftpflicht- und eine Hausratversicherung abschließen. Außerdem überlegt sie, als frisch angestellte Physiotherapeutin eine Berufsunfähigkeitsversicherung abzuschließen. Sie bittet darum, den Rat mündlich zu bekommen, weil sie wenig Zeit hat.","items":[{"typ":"mc","frage":"Wovon hängt ab, wie ausführlich Herr Szabo Frau Bauer befragen und beraten muss?","optionen":["Allein von der Höhe der Provision, die Herr Szabo für den jeweiligen Vertrag erhält.","Allein davon, ob sich Frau Bauer vorher schon selbst im Internet über die angebotenen Tarife informiert hat.","Von den Vorgaben des Versicherers, der den Umfang der Beratung für jede Sparte verbindlich festlegt.","Von der Schwierigkeit des Produkts, von Person und Lage der Kundin und vom Verhältnis Aufwand zu Prämie."],"richtig":[3],"erkl":"Die Beratung ist anlassbezogen: Komplexe Produkte wie die Berufsunfähigkeitsversicherung erfordern mehr Beratung als eine einfache Haftpflicht. Der Aufwand muss in angemessenem Verhältnis zur Prämie stehen.","norm":"§ 61 Abs. 1 VVG","id":"2.6-2-1"},{"typ":"wf","frage":"Welche Aussagen zur Beratung von Frau Bauer treffen zu?","aussagen":[["Für die Berufsunfähigkeitsversicherung besteht wegen der Komplexität ein höherer Beratungsbedarf.",true],["Herr Szabo muss für jeden Rat die Gründe angeben.",true],["Weil Frau Bauer online verglichen hat, entfällt die Beratungspflicht automatisch.",false],["Der Umfang der Dokumentation richtet sich nach der Komplexität des Vertrags.",true]],"erkl":"Befragung, Beratung und Begründung sind Pflicht, soweit ein Anlass besteht. Ein eigener Vergleich der Kundin ersetzt die Beratung nicht; dafür wäre ein förmlicher Verzicht nötig.","norm":"§ 61 Abs. 1 und 2 VVG","id":"2.6-2-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation zu, wann und wie der Rat und die Gründe dokumentiert übermittelt werden müssen.","paare":[["Regelfall ohne besondere Wünsche","vor Abschluss des Vertrags in Textform"],["Frau Bauer wünscht die mündliche Übermittlung","unverzüglich nach Vertragsschluss, spätestens mit dem Versicherungsschein in Textform"],["Kunde hat durch gesonderte schriftliche Erklärung mit Warnhinweis verzichtet","keine Dokumentation, soweit der Verzicht reicht"],["Vorläufige Deckung in der Kfz-Haftpflicht als Pflichtversicherung","keine Nachholpflicht für den Vertrag über die vorläufige Deckung"]],"erkl":"Grundsätzlich ist vor Vertragsschluss in Textform zu dokumentieren. Bei mündlicher Übermittlung wird nachgeholt; bei vorläufiger Deckung in Pflichtversicherungen entfällt die Nachholpflicht.","norm":"§ 62 Abs. 1 und 2 VVG, § 61 Abs. 2 VVG","id":"2.6-2-3"},{"typ":"mc","frage":"Was muss Herr Szabo als Versicherungsvertreter Frau Bauer zusätzlich über seine Beratungsgrundlage mitteilen?","optionen":["Eine vollständige Liste aller Versicherer am Markt mit den jeweiligen Prämien.","Für welche Versicherer er tätig ist und ob er für diese ausschließlich tätig ist.","Die genaue Höhe seiner Provision in Euro für jeden angebotenen Vertrag.","Die Schadenquote der Proximus aus dem letzten abgeschlossenen Geschäftsjahr."],"richtig":[1],"erkl":"Vertreter müssen ihre Markt- und Informationsgrundlage offenlegen, die Versicherer nennen und angeben, ob sie ausschließlich für diese tätig sind. Eine breite Marktuntersuchung schuldet der Makler, nicht der Vertreter.","norm":"§ 60 Abs. 2 VVG","id":"2.6-2-4"}]},{"typ":"situation","titel":"Fall 3: Tomás Ferreira schließt online direkt ab","situation":"Tomás Ferreira (31) schließt am 30. Oktober 2026 direkt über die Website der Proximus Versicherung AG, ohne Vermittler, eine Hausratversicherung ab; der Versicherer nimmt den Antrag am selben Tag an und schickt ihm den Versicherungsschein per E-Mail. Wegen eines technischen Fehlers erhält er die Versicherungsbedingungen, die Verbraucherinformationen und die Widerrufsbelehrung erst am 3. November 2026 per E-Mail. Sonst ist alles ordnungsgemäß.","items":[{"typ":"mc","frage":"Wer muss Herrn Ferreira bei diesem Online-Abschluss nach seinen Wünschen und Bedürfnissen befragen und beraten?","optionen":["Niemand, weil bei einem Abschluss über eine Website grundsätzlich keine Beratungspflicht besteht.","Der Versicherer selbst, soweit Anlass besteht; im Fernabsatz ist ein Verzicht in Textform möglich.","Ein Versicherungsmakler, den der Direktversicherer für jeden Online-Kunden beauftragen muss.","Der Versicherer, ein Verzicht des Kunden ist im Fernabsatz aber ausgeschlossen."],"richtig":[1],"erkl":"Ohne Vermittler trifft die Beratungspflicht den Versicherer. Bei Fernabsatzverträgen genügt für den Verzicht die Textform.","norm":"§ 6 Abs. 1 und 3 VVG","id":"2.6-3-1"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten der Proximus bei diesem Direktabschluss treffen zu?","aussagen":[["Erkennt der Versicherer während der Laufzeit einen Anlass, muss er Herrn Ferreira auch dann beraten.",true],["Hätte ein Makler den Vertrag vermittelt, wäre der Versicherer von seiner Beratungspflicht befreit.",true],["Verletzt der Versicherer die Beratungspflicht, haftet er nur bei Vorsatz.",false],["Auf der Website, über die er abgeschlossen hat, muss während der Widerrufsfrist eine gut sichtbare Widerrufsfunktion „Vertrag widerrufen“ bereitstehen.",true],["Das Informationsblatt zu Versicherungsprodukten ersetzt die Versicherungsbedingungen.",false]],"erkl":"Die Beratungspflicht gilt auch während der Laufzeit und entfällt nur bei Maklervermittlung oder Großrisiken. Der Versicherer haftet, wenn er die Pflichtverletzung zu vertreten hat. Für Online-Abschlüsse gilt die elektronische Widerrufsfunktion.","norm":"§ 6 Abs. 4 bis 6 VVG, § 8 Abs. 1 Satz 3 VVG i. V. m. § 356a BGB, § 7 Abs. 1 VVG","id":"2.6-3-2"},{"typ":"zuo","frage":"Herr Ferreira hat auch ein Informationsblatt zu Versicherungsprodukten (IPID) erhalten. Ordnen Sie jeder Überschrift den passenden Inhalt zu.","paare":[["Was ist nicht versichert?","z. B. Sachen, die nicht zum Hausrat gehören, wie Kraftfahrzeuge"],["Wo bin ich versichert?","räumlicher Geltungsbereich, z. B. die Wohnung als Versicherungsort und die Außenversicherung"],["Welche Verpflichtungen habe ich?","z. B. Schäden unverzüglich melden und Stehlgutliste bei der Polizei einreichen"],["Wann und wie zahle ich?","Fälligkeit und Zahlungsweise der Prämie"]],"erkl":"Verbraucher erhalten ein Informationsblatt im EU-weit einheitlichen Format mit festen Überschriften; ausgedruckt umfasst es in der Regel zwei Seiten DIN A4. Die Inhalte stammen aus den Bedingungen, bei der Proximus z. B. Kraftfahrzeuge nicht versichert, Polizeianzeige und Stehlgutliste als Obliegenheit.","norm":"§ 4 Abs. 1 und 2 VVG-InfoV, Durchführungsverordnung (EU) 2017/1469; Proximus 5, VHB 2021 Ziff. 9.3, 10, 12, 15.2, 22.1.2, 22.1.5 und 22.1.6","id":"2.6-3-3"},{"typ":"zahl","frage":"Am wievielten Tag im November 2026 endet die Widerrufsfrist von Herrn Ferreira?","wert":17,"einheit":"November","tol":0,"erkl":"Die 14-tägige Frist beginnt erst, wenn Versicherungsschein, Bedingungen, Informationen und Belehrung in Textform zugegangen sind. Zugang 3. November; dieser Tag zählt nicht mit. 3 + 14 = 17. November (Dienstag).","norm":"§ 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"2.6-3-4"}]},{"typ":"situation","titel":"Fall 4: Schadenersatz für Familie Nguyen","situation":"Vertreter Henrik Lammers ist gebundener Vertreter der Proximus; sie hat die Haftung für ihn übernommen. Er hat im Mai 2024 für Familie Nguyen eine Wohngebäudeversicherung für ihr Haus in einer Senke in Halle (Saale) vermittelt. Herr Nguyen hatte nach Starkregen gefragt; Herr Lammers ging darauf nicht ein, bot keinen Elementarschutz an und dokumentierte nichts. Im Juli 2026 entsteht durch Überschwemmung nach Starkregen ein Schaden von 38.000,00 €, der nicht versichert ist. Laut Tarif Wohngebäude der Proximus gilt für den Einschluss weiterer Naturgefahren (Elementar) eine Selbstbeteiligung von 500,00 € je Versicherungsfall.","items":[{"typ":"mc","frage":"Auf welche Rechtsgrundlage kann Familie Nguyen einen Anspruch gegen Herrn Lammers stützen?","optionen":["Leistung aus der Wohngebäudeversicherung, weil Elementar immer mitversichert ist.","Rücktritt vom Vertrag mit Rückzahlung aller seit 2024 gezahlten Beiträge.","Anfechtung des Vertrags wegen arglistiger Täuschung durch den Vertreter.","Schadenersatz wegen Verletzung seiner Beratungs- und Dokumentationspflicht."],"richtig":[3],"erkl":"Der Vermittler haftet für den Schaden, der aus einer Verletzung seiner Pflichten zur Befragung, Beratung und Dokumentation entsteht. Die Nguyens sind so zu stellen, als wären sie richtig beraten worden.","norm":"§ 63 VVG i. V. m. § 61 Abs. 1 VVG","id":"2.6-4-1"},{"typ":"wf","frage":"Welche Aussagen zur Haftung in diesem Fall treffen zu?","aussagen":[["Herr Lammers muss beweisen, dass er die Pflichtverletzung nicht zu vertreten hat.",true],["Die fehlende Dokumentation erschwert Herrn Lammers den Nachweis einer ordnungsgemäßen Beratung.",true],["Die Nguyens können sich wegen der Haftungsübernahme auch an die Proximus halten.",true],["Der Anspruch ist ausgeschlossen, weil die Nguyens den Antrag unterschrieben haben.",false]],"erkl":"Das Verschulden des Vermittlers wird vermutet. Fehlt die Dokumentation eines wichtigen Hinweises, wird vermutet, dass er nicht erteilt wurde (Beweiserleichterung für den Kunden). Für gebundene Vertreter haftet zudem der Versicherer.","norm":"§ 63 Satz 2 VVG, § 62 VVG, § 34d Abs. 7 Satz 1 Nr. 1 GewO","id":"2.6-4-2"},{"typ":"zahl","frage":"Unterstellen Sie, die Nguyens hätten bei richtiger Beratung den Elementarbaustein abgeschlossen. Welchen Schaden (in Euro) kann die Familie ersetzt verlangen? Ersparte Beiträge bleiben außer Betracht.","wert":37500,"einheit":"€","tol":0.01,"erkl":"Selbstbeteiligung für Elementarschäden laut Tarif: 500,00 € je Versicherungsfall. Die Versicherung hätte 38.000,00 € − 500,00 € = 37.500,00 € gezahlt; diesen Betrag schuldet Herr Lammers als Schadenersatz. Die Wartezeit von einem Monat war längst abgelaufen.","norm":"§ 63 VVG, § 249 Abs. 1 BGB; Proximus 5, Tarif Wohngebäude Ziff. 6.2 und 6.3, VGB 2021 Ziff. 5.4","id":"2.6-4-3"},{"typ":"mc","frage":"In welchem Fall hätte Familie Nguyen keinen Schadenersatzanspruch gegen Herrn Lammers?","optionen":["Wenn sie den angebotenen Elementarschutz nach Beratung abgelehnt hätten und dies dokumentiert wäre.","Wenn Herr Lammers den Elementarschutz zwar nie angeboten, aber schon lange als Vertreter gearbeitet hätte.","Wenn der Schaden erst zwei Jahre nach Vertragsschluss eingetreten wäre.","Wenn Herr Lammers für die Wohngebäudeversicherung nur wenig Provision erhalten hätte."],"richtig":[0],"erkl":"Lehnt der Kunde nach richtiger Beratung einen Baustein ab, fehlt die Pflichtverletzung. Die Dokumentation dient dann als Beweis.","norm":"§ 61 Abs. 1 VVG, § 62 VVG, § 63 VVG","id":"2.6-4-4"}]},{"typ":"situation","titel":"Fall 5: Spartentrennung und Aufsicht im Proximus-Konzern","situation":"Praktikant Jannik Schulze fragt in Ihrer Agentur, warum zum Proximus-Konzern mehrere Gesellschaften gehören: die Proximus Versicherung AG (Sach-, Haftpflicht- und Unfallversicherung), die Proximus Lebensversicherung AG, die Proximus Krankenversicherung AG und die Proximus Rechtsschutz Versicherung AG. Außerdem möchte er wissen, wer die Gesellschaften kontrolliert.","items":[{"typ":"mc","frage":"Warum betreibt der Konzern die Lebensversicherung in einer eigenen Aktiengesellschaft?","optionen":["Lebensversicherungen dürfen nur von Gesellschaften mit Sitz außerhalb Deutschlands betrieben werden.","Eine eigene Gesellschaft für Leben ist nur aus steuerlichen Gründen vorteilhaft, aber gesetzlich nicht vorgeschrieben.","Das Gesetz verbietet einem Lebensversicherer andere Sparten, um die Sparanteile der Kunden vor deren Risiken zu schützen.","Die IHK erteilt Lebensversicherern nur dann eine Erlaubnis, wenn sie keine weiteren Sparten führen."],"richtig":[2],"erkl":"Die Erlaubnis für die Lebensversicherung und für andere Sparten schließen sich aus (Spartentrennung). So können Großschäden etwa in der Sachversicherung nicht die angesammelten Sparanteile der Lebensversicherten gefährden.","norm":"§ 8 Abs. 4 Satz 2 VAG","id":"2.6-5-1"},{"typ":"zuo","frage":"Ordnen Sie jedes Geschäft der zuständigen Gesellschaft im Proximus-Konzern zu.","paare":[["fondsgebundene Rentenversicherung","Proximus Lebensversicherung AG"],["private Krankenvollversicherung","Proximus Krankenversicherung AG"],["Wohngebäude- und Unfallversicherung","Proximus Versicherung AG"],["Rechtsschutzversicherung nach ARB 2021","Proximus Rechtsschutz Versicherung AG"]],"erkl":"Leben und substitutive Krankenversicherung sind jeweils von anderen Sparten getrennt. Wer Rechtsschutz zusammen mit anderen Sparten betreibt, muss die Leistungsbearbeitung auf ein Schadenabwicklungsunternehmen übertragen; die Proximus führt die Rechtsschutzversicherung in einer eigenen Gesellschaft.","norm":"§ 8 Abs. 4 VAG, § 164 Abs. 1 VAG, Anlage 1 VAG; Proximus 5, ARB 2021 Ziff. 3.1.1 (Proximus Rechtsschutz Versicherung AG)","id":"2.6-5-2"},{"typ":"wf","frage":"Welche Aussagen zur Aufsicht über die Proximus-Gesellschaften treffen zu?","aussagen":[["Die BaFin übt eine Rechtsaufsicht und eine Finanzaufsicht aus.",true],["Zur Finanzaufsicht gehört die Prüfung, ob die Verpflichtungen dauernd erfüllbar sind (z. B. Solvabilität).",true],["Ein Versicherer mit Sitz im Inland braucht für seinen Geschäftsbetrieb eine Erlaubnis der Aufsichtsbehörde.",true],["Die BaFin erteilt auch den gebundenen Vertretern der Proximus ihre Gewerbeerlaubnis.",false]],"erkl":"Die BaFin überwacht den gesamten Geschäftsbetrieb rechtlich und finanziell. Für die Erlaubnis und Registrierung der Vermittler sind die IHKs zuständig.","norm":"§ 8 Abs. 1 VAG, § 294 Abs. 2 bis 4 VAG, § 34d GewO","id":"2.6-5-3"},{"typ":"mc","frage":"Was ist nach dem Gesetz das Hauptziel der Versicherungsaufsicht?","optionen":["Die Sicherung möglichst hoher Gewinne für die Aktionäre der Versicherer.","Die Festsetzung einheitlicher Prämien für alle Versicherer am Markt.","Die verbindliche Entscheidung einzelner Leistungsstreitigkeiten zwischen Kunden und Versicherern.","Der Schutz der Versicherungsnehmer und der Begünstigten von Versicherungsleistungen."],"richtig":[3],"erkl":"Das VAG nennt den Schutz der Versicherten als Hauptziel. Prämien legen die Versicherer selbst fest; Einzelstreitigkeiten klären Ombudsmann oder Gerichte.","norm":"§ 294 Abs. 1 VAG","id":"2.6-5-4"}]},{"typ":"situation","titel":"Fall 6: Datenschutz und fairer Wettbewerb in der Agentur Frank","situation":"In der Agentur von Paula Frank, gebundene Vertreterin der Proximus in Halle (Saale), werden Kundendaten in einer eigenen Kundendatei geführt; die Agentur ist dafür selbst Verantwortliche im Sinne der DSGVO. Am Montag um 9:00 Uhr bemerkt sie, dass ein unverschlüsselter Laptop mit Kundendaten gestohlen wurde. Ein neuer Mitarbeiter will Kunden eines Mitbewerbers mit einem Flyer abwerben, auf dem steht: „Die Konkurrenz zahlt im Schadenfall sowieso nie.“","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Grundsatz der DSGVO das passende Beispiel aus der Agentur zu.","paare":[["Zweckbindung","Daten aus dem Hausratantrag werden nicht ohne Weiteres für Werbung eines Partnerunternehmens genutzt"],["Datenminimierung","für ein Hausratangebot wird nicht nach dem Arbeitgeber des Ehepartners gefragt"],["Speicherbegrenzung","Daten werden gelöscht, sobald Zweck und Aufbewahrungsfristen entfallen sind"],["Integrität und Vertraulichkeit","Laptops sind verschlüsselt und Kundenakten vor Zugriff Unbefugter geschützt"]],"erkl":"Die DSGVO verlangt u. a. Zweckbindung, Datenminimierung, Richtigkeit, Speicherbegrenzung sowie Integrität und Vertraulichkeit; der Verantwortliche muss die Einhaltung nachweisen können (Rechenschaftspflicht).","norm":"Art. 5 Abs. 1 Buchst. b, c, e und f, Abs. 2 DSGVO","id":"2.6-6-1"},{"typ":"zahl","frage":"Innerhalb von wie vielen Stunden nach Bekanntwerden muss die Agentur den Laptopdiebstahl in der Regel der Datenschutzaufsichtsbehörde melden?","wert":72,"einheit":"Stunden","tol":0,"erkl":"Eine Verletzung des Schutzes personenbezogener Daten ist möglichst binnen 72 Stunden nach Bekanntwerden zu melden, außer sie führt voraussichtlich nicht zu einem Risiko für die Betroffenen. Bei unverschlüsselten Kundendaten ist ein Risiko anzunehmen.","norm":"Art. 33 Abs. 1 DSGVO","id":"2.6-6-2"},{"typ":"wf","frage":"Welche Aussagen zu Wettbewerbsrichtlinien und UWG treffen zu?","aussagen":[["Unwahre oder herabsetzende Äußerungen über Mitbewerber sind unzulässig.",true],["Vergleichende Werbung ist erlaubt, wenn sie sachlich, nachprüfbar und vollständig ist.",true],["Die Wettbewerbsrichtlinien sind ein Gesetz des Bundestages mit Bußgeldern der BaFin.",false],["Mit der staatlichen Versicherungsaufsicht darf als Besonderheit des eigenen Unternehmens geworben werden.",false]],"erkl":"Die Wettbewerbsrichtlinien sind eine Selbstverpflichtung von Versicherern und Vermittlerverbänden, die das UWG konkretisiert. Die Aufsicht gilt für alle Versicherer und ist kein Werbeargument.","norm":"Wettbewerbsrichtlinien der Versicherungswirtschaft Ziff. 3, 29, 36; § 6 UWG","id":"2.6-6-3"},{"typ":"mc","frage":"Wie ist der geplante Flyer „Die Konkurrenz zahlt im Schadenfall sowieso nie.“ zu beurteilen?","optionen":["Zulässig, weil Meinungsäußerungen in der Werbung grundsätzlich erlaubt sind.","Zulässig, wenn der Flyer nur an Kunden des Mitbewerbers verteilt wird.","Unlauter, weil er den Mitbewerber mit einer unwahren Pauschalbehauptung herabsetzt.","Unlauter nur dann, wenn der betroffene Mitbewerber vorher schriftlich widersprochen hat."],"richtig":[2],"erkl":"Wer Mitbewerber herabsetzt oder geschäftsschädigende Tatsachen behauptet, die nicht erweislich wahr sind, handelt unlauter; der Mitbewerber kann Unterlassung verlangen.","norm":"§ 4 Nr. 1 und 2 UWG, § 8 Abs. 1 UWG, Wettbewerbsrichtlinien Ziff. 3 und 8","id":"2.6-6-4"}]}]}]},{"nr":"3","titel":"Rechtliche und vertragliche Rahmenbedingungen einhalten","lf":"LF 2 / LF 3","abschnitte":[{"nr":"3.1","titel":"Verbraucherschutz, Wettbewerbsrecht, Geldwäsche, Aufsicht und Vermittlerrecht","lf":"LF 3","buch":"S. 59–72","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wer braucht für die Versicherungsvermittlung KEINE eigene Erlaubnis der IHK?","optionen":["Der Mehrfachvertreter, der ohne Haftungsübernahme für mehrere Versicherer tätig ist.","Der Versicherungsmakler, der im Auftrag des Kunden mehrere Versicherer vergleicht.","Der Versicherungsberater, der gegen Honorar unabhängig von Versicherern berät.","Der gebundene Vertreter, für den der Versicherer die uneingeschränkte Haftung übernimmt."],"richtig":[3],"erkl":"Der gebundene (Ausschließlichkeits-)Vertreter wird vom Versicherer ins Register gemeldet und braucht keine eigene Erlaubnis.","norm":"§ 34d Abs. 7 GewO","id":"3.1-1-1"},{"typ":"zahl","frage":"Wie viele Stunden Weiterbildung muss ein Versicherungsvermittler mindestens je Kalenderjahr nachweisen?","wert":15,"einheit":"Stunden","tol":0,"erkl":"Vermittler und die an der Vermittlung mitwirkenden Beschäftigten müssen sich jährlich mindestens 15 Stunden weiterbilden.","norm":"§ 34d Abs. 9 GewO, § 7 VersVermV","id":"3.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie den Vermittlertyp seiner Rechtsstellung zu.","paare":[["Versicherungsvertreter","ist vom Versicherer beauftragt und steht in dessen Lager"],["Versicherungsmakler","ist vom Kunden beauftragt und steht in dessen Lager"],["Versicherungsberater","berät gegen Honorar, ohne Provision von Versicherern anzunehmen"]],"erkl":"Die Stellung entscheidet über Pflichten und Haftung.","norm":"§ 59 VVG, § 34d GewO","id":"3.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Geldwäschegesetz bei der Vermittlung von Lebensversicherungen treffen zu?","aussagen":[["Ein Versicherungsmakler, der Lebensversicherungen vermittelt, gehört zu den Verpflichteten nach dem Geldwäschegesetz.",true],["Der Vertragspartner ist zu identifizieren, z. B. anhand des Personalausweises; ein gebundener Vertreter tut dies für den Versicherer.",true],["Verdachtsfälle werden an die Zentralstelle für Finanztransaktionsuntersuchungen (FIU) gemeldet.",true],["Der Kunde muss vorab darüber informiert werden, dass eine Verdachtsmeldung abgegeben wird.",false]],"erkl":"Gebundene Vertreter sind wegen der Ausnahme für § 34d Abs. 7 GewO nicht selbst Verpflichtete; sie wirken für den Versicherer mit und melden über dessen Geldwäschebeauftragten. Der Kunde darf über eine Verdachtsmeldung nicht informiert werden.","norm":"§§ 2, 10, 43, 47 GwG","id":"3.1-1-4"},{"typ":"mc","frage":"Ein Vertreter bietet einem Kunden an, ihm einen Teil seiner Provision zurückzugeben, wenn er den Vertrag abschließt. Wie ist das zu beurteilen?","optionen":["Zulässig, weil es sich um einen üblichen Preisnachlass handelt.","Zulässig bei Verträgen mit einer Laufzeit von mehr als zehn Jahren.","Unzulässig, weil es gegen das Provisionsabgabeverbot verstößt.","Zulässig, wenn der Vertreter den Versicherer vorher informiert."],"richtig":[2],"erkl":"Sondervergütungen an Versicherungsnehmer sind grundsätzlich verboten (Ausnahme: geringwertige Zuwendungen); zulässig ist sie außerdem zur dauerhaften Prämiensenkung oder Leistungserhöhung (§ 48c VAG).","norm":"§ 48b VAG","id":"3.1-1-5"},{"typ":"mc","frage":"Welche Behörde beaufsichtigt in Deutschland die Versicherungsunternehmen?","optionen":["Der Versicherungsombudsmann als unabhängige Schlichtungsstelle.","Die Bundesanstalt für Finanzdienstleistungsaufsicht (BaFin).","Die Industrie- und Handelskammer am Sitz des Versicherers.","Das Bundeskartellamt als oberste Wettbewerbsbehörde."],"richtig":[1],"erkl":"Die BaFin übt die Rechts- und Finanzaufsicht aus; die IHK ist für die Erlaubnis und Registrierung der Vermittler zuständig.","norm":"§ 320 Abs. 1 VAG (Zuständigkeit), § 294 VAG (Aufgaben)","id":"3.1-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Brandt (62) möchte bei Ihnen eine Rentenversicherung gegen Einmalbeitrag von 180.000 € abschließen. Den Betrag will er bar einzahlen. Auf die Frage nach der Herkunft des Geldes reagiert er ausweichend.","items":[{"typ":"mc","frage":"Was muss vor Vertragsschluss in jedem Fall geschehen?","optionen":["Herrn Brandt identifizieren (lassen) und seine Daten aufzeichnen.","Auf die Identifizierung verzichten, weil er bereits älter als 60 Jahre ist.","Nichts, weil Rentenversicherungen nicht unter das Geldwäschegesetz fallen.","Den Betrag annehmen und die Herkunft erst nach Vertragsschluss klären."],"richtig":[0],"erkl":"Bei der Vermittlung von Lebensversicherungen ist der Vertragspartner zu identifizieren; ein gebundener Vertreter erledigt das für den Versicherer, der Verpflichteter nach dem GwG ist.","norm":"§§ 10, 11 GwG","id":"3.1-2-1"},{"typ":"mc","frage":"Welches Verhalten ist richtig, wenn Sie einen Geldwäscheverdacht haben?","optionen":["Den Verdacht der Polizei melden und den Kunden über die Meldung informieren.","Den Kunden auf den Verdacht ansprechen und ihm Gelegenheit zur Erklärung geben.","Den Vertrag abschließen und den Verdacht erst bei der nächsten Jahresprüfung melden.","Den Verdacht unverzüglich melden, ohne den Kunden darüber zu informieren."],"richtig":[3],"erkl":"Verdachtsmeldepflicht und Verbot der Informationsweitergabe gelten nebeneinander. Als gebundener Vertreter melden Sie über den Geldwäschebeauftragten des Versicherers an die FIU.","norm":"§§ 43, 47 GwG","id":"3.1-2-2"},{"typ":"zahl","frage":"Wie viele Jahre müssen die Aufzeichnungen aus der Identifizierung mindestens aufbewahrt werden?","wert":5,"einheit":"Jahre","tol":0,"erkl":"Die Aufzeichnungen sind fünf Jahre aufzubewahren.","norm":"§ 8 Abs. 4 GwG","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Über das Zustandekommen von Verträgen informieren","lf":"LF 2","buch":"S. 73–89","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Begriffe richtig zu.","paare":[["Antragsmodell","Der Kunde stellt den Antrag, der Versicherer nimmt ihn mit der Police an."],["Invitatiomodell","Der Kunde fordert ein Angebot an, der Versicherer macht es, der Kunde nimmt an."],["Vorläufige Deckung","eigenständiger Vertrag, der Schutz bis zur Entscheidung über den Hauptvertrag gibt"]],"erkl":"Beim Antragsmodell ist der Antrag des Kunden das Angebot im Sinne des BGB.","norm":"§§ 145 ff. BGB, §§ 49 ff. VVG","id":"3.2-1-1"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Hausratversicherung?","wert":14,"einheit":"Tage","tol":0,"erkl":"Die Frist beginnt, wenn der Kunde Police, Bedingungen, Informationen und die Belehrung in Textform erhalten hat.","norm":"§ 8 Abs. 1 und 2 VVG","id":"3.2-1-2"},{"typ":"zahl","frage":"Wie viele Tage beträgt die Widerrufsfrist bei einer Lebensversicherung?","wert":30,"einheit":"Tage","tol":0,"erkl":"Für Lebensversicherungen gilt eine verlängerte Widerrufsfrist.","norm":"§ 152 Abs. 1 VVG","id":"3.2-1-3"},{"typ":"mc","frage":"Die Police weicht vom Antrag ab, der Versicherer hat auf die Abweichung deutlich hingewiesen. Was gilt, wenn der Kunde nicht reagiert?","optionen":["Der Vertrag ist unwirksam, weil sich Antrag und Police inhaltlich nicht decken.","Die Abweichung gilt als genehmigt, wenn er nicht binnen 14 Tagen nach Zugang widerspricht.","Die Abweichung gilt als genehmigt, wenn er nicht binnen eines Monats nach Zugang widerspricht.","Der Vertrag gilt mit dem Inhalt des Antrags, solange der Kunde der Abweichung nicht zustimmt."],"richtig":[2],"erkl":"Bei deutlichem Hinweis gilt die Abweichung als genehmigt, wenn der Kunde nicht binnen eines Monats in Textform widerspricht; ohne Hinweis gilt der Antragsinhalt.","norm":"§ 5 VVG","id":"3.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe zum Versicherungsbeginn zu.","paare":[["Formeller Beginn","Zeitpunkt des Vertragsschlusses"],["Materieller Beginn","Zeitpunkt, ab dem der Versicherer haftet"],["Technischer Beginn","Zeitpunkt, ab dem die Prämie berechnet wird"]],"erkl":"Die drei Zeitpunkte können auseinanderfallen, z. B. bei einer Rückwärtsversicherung.","norm":"Grundlagen; § 2 VVG (Rückwärtsversicherung)","id":"3.2-1-5"},{"typ":"wf","frage":"Welche Aussagen zur Geschäftsfähigkeit treffen zu?","aussagen":[["Ein Sechsjähriger ist geschäftsunfähig.",true],["Ein 16-Jähriger braucht für einen Versicherungsvertrag grundsätzlich die Zustimmung seiner gesetzlichen Vertreter, es sei denn, er bewirkt die Leistung mit Mitteln, die ihm zur freien Verfügung überlassen wurden.",true],["Ein ohne Zustimmung geschlossener Vertrag eines Minderjährigen ist grundsätzlich schwebend unwirksam, bis die Eltern ihn genehmigen.",true],["Ab 14 Jahren ist man voll geschäftsfähig.",false]],"erkl":"Volle Geschäftsfähigkeit beginnt mit 18; zwischen 7 und 17 ist man beschränkt geschäftsfähig.","norm":"§§ 104, 106, 107, 108, 110 BGB","id":"3.2-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Leonie (17) hat einen E-Scooter von ihren Großeltern geschenkt bekommen und möchte bei Ihnen eine Versicherungsplakette kaufen. Sie will den Beitrag von ihrem Taschengeld bezahlen. Ihre Eltern wissen noch nichts davon.","items":[{"typ":"mc","frage":"Kann Leonie den Vertrag ohne Zustimmung der Eltern wirksam schließen?","optionen":["Ja, weil ihr der Versicherungsvertrag nur einen rechtlichen Vorteil bringt.","Ja, wenn sie den Beitrag sofort aus ihrem frei verfügbaren Taschengeld bezahlt.","Ja, weil sie mit 17 Jahren für Versicherungsverträge voll geschäftsfähig ist.","Nein, Minderjährige können Verträge nur durch ihre Eltern schließen lassen."],"richtig":[1],"erkl":"Ein Vertrag ist von Anfang an wirksam, wenn der Minderjährige die Leistung mit Taschengeld bewirkt. Ein Versicherungsvertrag bringt wegen der Prämienpflicht nicht nur einen rechtlichen Vorteil.","norm":"§§ 107, 110 BGB","id":"3.2-2-1"},{"typ":"mc","frage":"Welche Angabe ist für die Versicherungsplakette richtig?","optionen":["Sie gilt für ein Verkehrsjahr vom 1. März bis Ende Februar des Folgejahres.","Sie gilt immer genau zwölf Monate ab dem Tag des Kaufs der Plakette.","Sie gilt für ein Kalenderjahr vom 1. Januar bis zum 31. Dezember.","Sie gilt nur in der Saison vom 1. März bis zum 31. Oktober eines jeden Jahres."],"richtig":[0],"erkl":"Versicherungskennzeichen bzw. -plaketten (für E-Scooter) wechseln jährlich zum 1. März die Farbe. Der Vertrag endet mit Ablauf des Verkehrsjahres, ohne dass es einer Kündigung bedarf.","norm":"FZV, eKFV; Proximus 5, AKB 2021 G.1.3","id":"3.2-2-2"},{"typ":"mc","frage":"Leonie fragt, ob sie den Vertrag widerrufen kann, wenn ihre Eltern dagegen sind. Was ist richtig?","optionen":["Nein, bei Versicherungskennzeichen ist der Widerruf gesetzlich grundsätzlich ausgeschlossen.","Nur mit Zustimmung des Versicherers, weil die Plakette bereits ausgehändigt wurde.","Ja, innerhalb von 30 Tagen ab Zahlung des Beitrags, auch ohne Belehrung in Textform.","Ja, innerhalb von 14 Tagen ab Erhalt aller Vertragsunterlagen und der Belehrung in Textform."],"richtig":[3],"erkl":"Das Widerrufsrecht entfällt nur in gesetzlichen Ausnahmen, z. B. bei Verträgen mit einer Laufzeit von weniger als einem Monat.","norm":"§ 8 VVG","id":"3.2-2-3"}]}]},{"nr":"3.3","titel":"Rechtsgrundlagen bei der Antrags- und Vertragsbearbeitung einhalten","lf":"LF 2","buch":"S. 90–122","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Der Kunde zahlt die erste Prämie nicht. Was gilt für den Versicherer, wenn vor der Zahlung ein Schaden eintritt?","optionen":["Der Vertrag ist rückwirkend nichtig, sodass der Kunde auch keine Prämie mehr schuldet.","Er muss leisten, darf aber die doppelte Erstprämie von der Entschädigung abziehen.","Er ist leistungsfrei, wenn der Kunde die Nichtzahlung zu vertreten hat und darauf hingewiesen wurde.","Er ist erst leistungsfrei, wenn er den Kunden gemahnt und eine Zahlungsfrist von zwei Wochen gesetzt hat."],"richtig":[2],"erkl":"Der Hinweis muss in Textform oder durch auffälligen Hinweis im Versicherungsschein erfolgen. Zusätzlich kann der Versicherer vom Vertrag zurücktreten, solange die Erstprämie nicht gezahlt ist.","norm":"§ 37 VVG; Proximus 5, VHB 2021 Ziff. 15.2.2 und 15.2.3","id":"3.3-1-1"},{"typ":"zahl","frage":"Wie viele Wochen muss die Zahlungsfrist bei einer nicht gezahlten Folgeprämie mindestens betragen?","wert":2,"einheit":"Wochen","tol":0,"erkl":"Der Versicherer bestimmt in Textform eine Zahlungsfrist von mindestens zwei Wochen mit Belehrung über die Folgen.","norm":"§ 38 Abs. 1 VVG","id":"3.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur vorvertraglichen Anzeigepflicht treffen zu?","aussagen":[["Der Kunde muss die ihm bekannten gefahrerheblichen Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat.",true],["Bei vorsätzlicher oder grob fahrlässiger Verletzung kann der Versicherer vom Vertrag zurücktreten.",true],["Bei einfacher Fahrlässigkeit kann der Versicherer kündigen oder den Vertrag anpassen.",true],["Der Kunde muss auch Umstände anzeigen, nach denen nie gefragt wurde, sonst ist der Vertrag nichtig.",false]],"erkl":"Die Rechtsfolgen sind nach dem Verschulden abgestuft; der Versicherer muss sie innerhalb eines Monats nach Kenntnis geltend machen.","norm":"§§ 19, 21 VVG","id":"3.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie dem Verschulden bei einer Obliegenheitsverletzung die Rechtsfolge zu.","paare":[["Vorsatz","Der Versicherer ist leistungsfrei."],["Grobe Fahrlässigkeit","Der Versicherer kann die Leistung entsprechend der Schwere des Verschuldens kürzen."],["Einfache Fahrlässigkeit","Die Leistung bleibt voll erhalten."]],"erkl":"Außer bei Arglist bleibt der Versicherer zur Leistung verpflichtet, wenn die Verletzung weder für den Eintritt noch für den Umfang des Schadens ursächlich war.","norm":"§ 28 Abs. 2 und 3 VVG","id":"3.3-1-4"},{"typ":"mc","frage":"Ein Kunde hat bei einem anderen Versicherer einen Hausratvertrag mit fünf Jahren Laufzeit. Wann kann er ihn nach dem VVG frühestens ordentlich kündigen?","optionen":["Zum Schluss des ersten Versicherungsjahres mit einer Frist von einem Monat.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von drei Monaten.","Zum Ende der fünfjährigen Laufzeit mit einer Frist von drei Monaten.","Zum Schluss des dritten Versicherungsjahres mit einer Frist von einem Monat."],"richtig":[1],"erkl":"Verträge mit einer Laufzeit von mehr als drei Jahren kann der Versicherungsnehmer zum Schluss des dritten oder jedes folgenden Jahres kündigen. Die Proximus lässt in der Hausratversicherung höchstens drei Jahre Vertragsdauer zu; ihre VHB 2021 wiederholen die gesetzliche Regel.","norm":"§ 11 Abs. 4 VVG; Proximus 5, VHB 2021 Ziff. 27.4, Tarif Hausrat Ziff. 0.2","id":"3.3-1-5"},{"typ":"mc","frage":"Nach einem Leitungswasserschaden hat der Versicherer gezahlt. Bis wann können beide Vertragspartner den Vertrag kündigen?","optionen":["Innerhalb eines Monats nach Abschluss der Verhandlungen über die Entschädigung.","Innerhalb eines Monats nach dem Schadentag, aber nur durch den Versicherer.","Innerhalb von drei Monaten nach dem Tag, an dem der Schaden eingetreten ist.","Nur zum Ende der laufenden Versicherungsperiode mit einer Frist von drei Monaten."],"richtig":[0],"erkl":"Der Versicherer muss eine Frist von einem Monat einhalten; der Kunde kann sofort oder zum Ende der laufenden Periode kündigen.","norm":"§ 92 VVG; Proximus 5, VHB 2021 Ziff. 26 bzw. VGB 2021 Ziff. 26","id":"3.3-1-6"},{"typ":"mc","frage":"Ein Kunde lässt in seinem Einfamilienhaus die Einbruchmeldeanlage dauerhaft abschalten, deren Einbau ein Rabattgrund war. Wie nennt man diesen Vorgang?","optionen":["Doppelversicherung","Obliegenheit im Versicherungsfall","Unterversicherung","Gefahrerhöhung"],"richtig":[3],"erkl":"Nach Vertragsschluss darf der Kunde ohne Einwilligung des Versicherers keine Gefahrerhöhung vornehmen; er muss sie anzeigen. Die VHB 2021 der Proximus nennen ausdrücklich den Fall, dass vereinbarte Sicherungen beseitigt oder vermindert werden.","norm":"§§ 23 ff. VVG; Proximus 5, VHB 2021 Ziff. 23.1.4 und 23.2","id":"3.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Albers hat am 3. März bei der Proximus Versicherung AG eine Hausratversicherung beantragt. Die Police (Versicherungsbeginn 10. März) mit Belehrung und Unterlagen geht ihr am 10. März zu; zur Fälligkeit der Erstprämie ist nichts Abweichendes vereinbart. Am 20. März wird in ihre Wohnung eingebrochen. Die Prämie hatte sie noch nicht gezahlt.","items":[{"typ":"mc","frage":"Muss der Versicherer für den Einbruch leisten?","optionen":["Nein, denn während der laufenden Widerrufsfrist besteht noch kein Schutz.","Nur anteilig, denn der Versicherungsbeginn liegt vor der Prämienfälligkeit.","Ja, denn die Erstprämie war am Schadentag noch nicht fällig.","Nein, denn ohne gezahlte Erstprämie beginnt der Versicherungsschutz nicht."],"richtig":[2],"erkl":"Leistungsfreiheit setzt voraus, dass die fällige Erstprämie schuldhaft nicht gezahlt wurde. Nach VHB 2021 Ziff. 15.2.1 (Proximus 5) wird sie erst unverzüglich nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins fällig, also ab 25. März; am 20. März war sie noch nicht fällig, die Kundin hat die Nichtzahlung also nicht zu vertreten.","norm":"§ 37 Abs. 2 VVG; Proximus 5, VHB 2021 Ziff. 15.2.1 und 15.2.2","id":"3.3-2-1"},{"typ":"zahl","frage":"An welchem Tag endet die Widerrufsfrist von Frau Albers (Tag im März)?","wert":24,"einheit":". März","tol":0,"erkl":"Fristbeginn mit Zugang am 10. März; 14 Tage → Ende am 24. März (ein Werktag). Der rechtzeitige Versand des Widerrufs genügt.","norm":"§ 8 VVG, §§ 187, 188 BGB","id":"3.3-2-2"},{"typ":"mc","frage":"Frau Albers zahlt im Folgejahr den Beitrag nicht. Nach Ablauf der zweiwöchigen Zahlungsfrist kündigt der Versicherer. Wie kann sie den Vertrag noch retten?","optionen":["Sie zahlt innerhalb von zwei Wochen nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie widerspricht innerhalb eines Monats nach der Kündigung; dann wird die Kündigung unwirksam.","Sie zahlt innerhalb von drei Monaten nach der Kündigung; dann lebt der Vertrag rückwirkend auf."],"richtig":[1],"erkl":"Die Zahlung heilt die Kündigung; für Versicherungsfälle zwischen Fristablauf und Zahlung bleibt der Versicherer leistungsfrei.","norm":"§ 38 Abs. 3 VVG","id":"3.3-2-3"}]}]},{"nr":"3.4","titel":"Prüfungsfälle: Verbraucherschutz, Geldwäsche, Datenschutz, AGB","lf":"LF 3","buch":"S. 59–72","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Kowalczyk – Einmalbeitrag einer ehemaligen Abgeordneten","situation":"Die Agentur Kowalczyk in Halle (Saale) arbeitet als gebundener Vertreter (§ 34d Abs. 7 Nr. 1 GewO) ausschließlich für die Versicherer einer Versicherungsgruppe, darunter deren Lebensversicherer. Frau Ilse Hartwig (61) war bis Februar 2026 Abgeordnete des Deutschen Bundestages. Im Oktober 2026 möchte sie eine private Rentenversicherung gegen Einmalbeitrag von 250.000,00 € abschließen. Bezugsberechtigt im Todesfall soll ihr Neffe Lars Hartwig sein. Den Beitrag will sie vom Konto einer Firma überweisen lassen, zu der sie keine Angaben machen möchte.","items":[{"typ":"mc","frage":"Wer ist bei diesem Geschäft Verpflichteter im Sinne des Geldwäschegesetzes?","optionen":["Der Lebensversicherer, für den die Agentur vermittelt; die gebundene Agentur selbst dagegen nicht.","Nur die Agentur Kowalczyk, weil sie Frau Hartwig persönlich trifft, berät und den Antrag aufnimmt.","Niemand, weil private Rentenversicherungen nicht unter die Pflichten des Geldwäschegesetzes fallen.","Versicherer und Agentur gleichermaßen, weil jeder Vermittler von Lebensversicherungen verpflichtet ist."],"richtig":[0],"erkl":"Lebensversicherer (dazu zählen Rentenversicherungen) sind Verpflichtete. Vermittler sind es nur, soweit sie keine gebundenen Vertreter nach § 34d Abs. 7 Nr. 1 GewO sind; die Agentur wirkt aber für den Versicherer an dessen Pflichten mit (z. B. Identifizierung).","norm":"§ 2 Abs. 1 Nr. 7 und 8 GwG, § 34d Abs. 7 Nr. 1 GewO","id":"3.4-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Identifizierung bei diesem Vertrag treffen zu?","aussagen":[["Von Frau Hartwig sind u. a. Vor- und Nachname, Geburtsort, Geburtsdatum, Staatsangehörigkeit und Wohnanschrift zu erheben.",true],["Beruf und Jahreseinkommen gehören zu den Pflichtangaben, die bei jeder Identifizierung einer natürlichen Person zu erheben sind.",false],["Die Identität des Neffen als abweichender Bezugsberechtigter ist festzustellen; die Überprüfung kann spätestens bis zur Auszahlung erfolgen.",true],["Auf Wunsch der Kundin darf die Identifizierung grundsätzlich erst nach Vertragsschluss erfolgen.",false]],"erkl":"Identifiziert wird grundsätzlich vor Begründung der Geschäftsbeziehung; § 11 Abs. 4 GwG nennt die zu erhebenden Angaben (Beruf und Einkommen gehören nicht zu diesen Pflichtangaben). Für einen abweichenden Bezugsberechtigten gilt die Sonderregel des VAG.","norm":"§ 11 Abs. 1 und 4 GwG, § 54 Abs. 1 und 2 VAG","id":"3.4-1-2"},{"typ":"mc","frage":"Welche Pflicht gilt wegen der früheren Tätigkeit von Frau Hartwig?","optionen":["Verstärkte Sorgfaltspflichten: u. a. Zustimmung der Führungsebene, Herkunft der Mittel klären, verstärkte Überwachung.","Keine besonderen Pflichten, weil sie ihr Mandat schon im Februar 2026 beendet hat und nicht mehr als politisch exponiert gilt.","Ein Vertrag mit einer politisch exponierten Person ist verboten und muss deshalb abgelehnt werden.","Nur vereinfachte Sorgfaltspflichten, weil Abgeordnete bereits staatlich überprüft und registriert sind."],"richtig":[0],"erkl":"Abgeordnete sind politisch exponierte Personen. Das besondere Risiko ist mindestens zwölf Monate nach dem Ausscheiden weiter zu berücksichtigen; deshalb gelten im Oktober 2026 noch die verstärkten Sorgfaltspflichten.","norm":"§ 1 Abs. 12 GwG, § 15 Abs. 3 Nr. 1 und Abs. 4 Satz 1 und 3 GwG","id":"3.4-1-3"},{"typ":"zahl","frage":"Angenommen, der Vertrag wird im Jahr 2031 vollständig abgewickelt und die Geschäftsbeziehung endet. Bis zum Ende welches Jahres müssen die Identifizierungsunterlagen mindestens aufbewahrt werden?","wert":2036,"einheit":"(Jahr)","tol":0,"erkl":"Die Aufbewahrungsfrist beträgt fünf Jahre und beginnt mit dem Schluss des Kalenderjahres, in dem die Geschäftsbeziehung endet: 31.12.2031 + 5 Jahre = 31.12.2036. Spätestens nach zehn Jahren sind die Unterlagen zu vernichten.","norm":"§ 8 Abs. 4 GwG","id":"3.4-1-4"},{"typ":"wf","frage":"Der Versicherer hält die Überweisung von einem unbekannten Firmenkonto für verdächtig. Welche Aussagen treffen zu?","aussagen":[["Der Verdacht ist unverzüglich der Zentralstelle für Finanztransaktionsuntersuchungen (FIU) zu melden.",true],["Gemeldet werden muss erst, wenn der Betrag 15.000,00 € übersteigt.",false],["Die Transaktion darf frühestens durchgeführt werden, wenn FIU oder Staatsanwaltschaft zugestimmt haben oder der dritte Werktag nach Abgang der Meldung ohne Untersagung verstrichen ist.",true],["Die Agentur darf Frau Hartwig über die Meldung informieren, damit sie Belege nachreichen kann.",false]],"erkl":"Die Meldepflicht gilt unabhängig vom Wert. Nach der Meldung gilt eine Stillhaltefrist; der Kunde darf über die Meldung nicht informiert werden (Verbot der Informationsweitergabe).","norm":"§§ 43 Abs. 1, 46 Abs. 1, 47 Abs. 1 GwG","id":"3.4-1-5"}]},{"typ":"situation","titel":"Fall 2: Agentur Ebert – Daten von Frau Nguyen","situation":"Frau Mai Linh Nguyen (29) lässt sich in der Agentur Ebert in Halle (Saale) zu einer Hausrat- und einer Berufsunfähigkeitsversicherung beraten. Die Agentur ist für die Verarbeitung der Daten ihrer Kunden und Interessenten selbst Verantwortliche im Sinne der DSGVO. Frau Nguyen hat noch keinen Vertrag bei der Agentur. Die Agentur möchte ihr außerdem einen monatlichen Werbe-Newsletter per E-Mail schicken.","items":[{"typ":"zuo","frage":"Ordnen Sie der Datenverarbeitung die passende Rechtsgrundlage zu.","paare":[["Name, Anschrift und Wohnfläche für das Hausratangebot","Art. 6 Abs. 1 Buchst. b DSGVO – Vertrag bzw. vorvertragliche Maßnahme"],["Angaben zu Vorerkrankungen für den BU-Antrag","Art. 9 Abs. 2 Buchst. a DSGVO – ausdrückliche Einwilligung"],["Werbe-Newsletter per E-Mail an Frau Nguyen","Art. 6 Abs. 1 Buchst. a DSGVO – Einwilligung"],["Aufbewahrung von Buchungsbelegen nach Handels- und Steuerrecht","Art. 6 Abs. 1 Buchst. c DSGVO – rechtliche Verpflichtung"]],"erkl":"Gesundheitsdaten sind besondere Kategorien personenbezogener Daten und brauchen eine ausdrückliche Einwilligung. E-Mail-Werbung an eine Interessentin ohne Kundenbeziehung setzt zusätzlich nach UWG eine vorherige ausdrückliche Einwilligung voraus.","norm":"Art. 6 Abs. 1, Art. 9 Abs. 2 DSGVO, § 7 Abs. 2 Nr. 2 UWG","id":"3.4-2-1"},{"typ":"zuo","frage":"Ordnen Sie dem Vorgehen der Agentur den Grundsatz der Datenverarbeitung zu, den es umsetzt.","paare":[["Für das Hausratangebot fragt die Agentur nicht nach Religion oder Einkommen.","Datenminimierung"],["Die Hausratdaten werden nicht an ein Autohaus für dessen Werbung weitergegeben.","Zweckbindung"],["Kundenakten liegen in verschlossenen Schränken, Passwörter werden nicht weitergegeben.","Integrität und Vertraulichkeit"],["Daten eines Interessenten ohne Vertrag werden gelöscht, sobald sie nicht mehr gebraucht werden.","Speicherbegrenzung"],["Eine falsch erfasste Anschrift wird sofort berichtigt.","Richtigkeit"]],"erkl":"Art. 5 Abs. 1 DSGVO nennt die Grundsätze; der Verantwortliche muss ihre Einhaltung nachweisen können (Rechenschaftspflicht).","norm":"Art. 5 Abs. 1 und 2 DSGVO","id":"3.4-2-2"},{"typ":"wf","frage":"Frau Nguyen macht ihre Rechte als betroffene Person geltend. Welche Aussagen treffen zu?","aussagen":[["Sie kann Auskunft darüber verlangen, welche Daten die Agentur über sie verarbeitet.",true],["Die Agentur muss grundsätzlich innerhalb eines Monats antworten; in begründeten Fällen ist eine Verlängerung um zwei Monate möglich.",true],["Für die erste Auskunft darf die Agentur eine Bearbeitungsgebühr verlangen.",false],["Der Verwendung ihrer Daten für Direktwerbung kann sie jederzeit widersprechen.",true],["Belege, die die Agentur aus rechtlichen Gründen aufbewahren muss, sind auf ihr Verlangen trotzdem sofort zu löschen.",false]],"erkl":"Auskunft und erste Kopie sind unentgeltlich. Das Recht auf Löschung gilt nicht, soweit eine rechtliche Aufbewahrungspflicht besteht.","norm":"Art. 12 Abs. 3 und 5, Art. 15, Art. 17 Abs. 3 Buchst. b, Art. 21 Abs. 2 DSGVO","id":"3.4-2-3"},{"typ":"mc","frage":"Frau Nguyen hat in den Newsletter eingewilligt, widerruft ihre Einwilligung aber nach drei Monaten per E-Mail. Was gilt?","optionen":["Der Widerruf wirkt ab sofort für die Zukunft; die bis dahin versandten Newsletter bleiben rechtmäßig.","Der Widerruf ist nur schriftlich mit eigenhändiger Unterschrift und mit einer Begründung wirksam.","Der Widerruf wirkt zurück; alle bisher versandten Newsletter waren damit von Anfang an rechtswidrig.","Ein Widerruf ist erst nach Ablauf von zwölf Monaten seit der Einwilligung und nur zum Monatsende möglich."],"richtig":[0],"erkl":"Eine Einwilligung kann jederzeit widerrufen werden; der Widerruf muss so einfach sein wie die Erteilung und berührt die Rechtmäßigkeit der bisherigen Verarbeitung nicht.","norm":"Art. 7 Abs. 3 DSGVO","id":"3.4-2-4"},{"typ":"zahl","frage":"Aus dem Auto eines Außendienstmitarbeiters wird ein unverschlüsseltes Notebook mit Kundendaten gestohlen. Die Agentur erfährt sofort davon. Binnen wie vielen Stunden soll sie die Datenpanne möglichst der Aufsichtsbehörde melden?","wert":72,"einheit":"Stunden","tol":0,"erkl":"Eine Verletzung des Schutzes personenbezogener Daten ist unverzüglich und möglichst binnen 72 Stunden nach Bekanntwerden zu melden, es sei denn, sie führt voraussichtlich nicht zu einem Risiko für die Betroffenen.","norm":"Art. 33 Abs. 1 DSGVO","id":"3.4-2-5"}]},{"typ":"situation","titel":"Fall 3: Herr Ohlsen – Bedingungen und Sonderabsprachen","situation":"Herr Sven Ohlsen (45) schließt in der Agentur eine Hausratversicherung bei der Proximus Versicherung AG ab. Die Allgemeinen Versicherungsbedingungen (AVB) und die Verbraucherinformationen hat er vorher in Textform erhalten. Er schließt die Klausel PK 7110 (Fahrraddiebstahl) ein; danach ist die Entschädigung je Versicherungsfall auf 1 % der Versicherungssumme zuzüglich Vorsorge begrenzt, eine andere Grenze kann vereinbart werden. Die Versicherungssumme beträgt 50.000,00 €. Auf seinen Wunsch hat der Agent im Antrag vermerkt „Fahrraddiebstahl bis 3.000,00 €“; die Proximus hat den Antrag mit dieser Vereinbarung angenommen. Ein Bekannter zeigt ihm die Bedingungen eines anderen Anbieters mit der Klausel „Kündigungen sind nur per Einschreiben wirksam“.","items":[{"typ":"wf","frage":"Welche Aussagen zu Allgemeinen Geschäftsbedingungen treffen zu?","aussagen":[["Allgemeine Versicherungsbedingungen sind AGB, weil sie für eine Vielzahl von Verträgen vorformuliert sind und vom Versicherer gestellt werden.",true],["Versicherungsbedingungen sind keine AGB, weil sie vor ihrer Verwendung von der BaFin genehmigt werden.",false],["Ob AGB vorliegen, hängt nicht von Schriftart, Umfang oder der Form des Vertrags ab.",true],["Vertragsbedingungen, die im Einzelnen ausgehandelt wurden, sind keine AGB.",true]],"erkl":"AGB sind vorformulierte Bedingungen, die eine Partei der anderen stellt. Eine Vorabgenehmigung von AVB durch die Aufsicht gibt es nicht mehr.","norm":"§ 305 Abs. 1 BGB","id":"3.4-3-1"},{"typ":"mc","frage":"Herrn Ohlsens Fahrrad (Wert 2.400,00 €) wird gestohlen. Bis zu welchem Betrag ist der Diebstahl versichert?","optionen":["Bis 3.000,00 €, weil die individuelle Vereinbarung im Antrag den AVB vorgeht.","Bis 550,00 €, weil die AVB immer Vorrang vor handschriftlichen Vermerken des Agenten haben.","G
