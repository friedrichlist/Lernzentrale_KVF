aus den gebäudeeigenen Ableitungsrohren austritt.",true],["Grundwasser, das nicht an die Oberfläche tritt, sondern durch die Kellerwand drückt, ist keine Überschwemmung.",true],["Sturmflut ist über den Einschluss weiterer Naturgefahren versichert.",false],["Weitere Naturgefahren können nur zusammen mit mindestens einer Grundgefahr wie Feuer, Leitungswasser oder Sturm/Hagel versichert werden.",true]],"erkl":"Überschwemmung verlangt Wasser auf der Geländeoberfläche, Rückstau den Austritt aus gebäudeeigenen Ableitungsrohren. Sturmflut ist ausgeschlossen. Nach dem GDV-Muster sind Naturgefahren nur in Verbindung mit einer Grundgefahr versicherbar.","norm":"VGB 2022 (GDV-Muster), weitere Naturgefahren","id":"4.8-3-3"},{"typ":"mc","frage":"Der Sturm hat den Baum entwurzelt. Er liegt auf dem Dach. Welche Pflicht haben die Bergmanns jetzt?","optionen":["für die Minderung des Schadens sorgen, z. B. das Dach provisorisch abdecken lassen","nichts verändern, auch das Dach nicht abdecken, bis ein Gutachter es besichtigt hat","den Schaden erst nach Abschluss aller Reparaturen schriftlich melden","den Baum selbst zersägen und verbrennen, um Kosten zu sparen"],"richtig":[0],"erkl":"Der Versicherungsnehmer muss den Schaden nach Möglichkeit abwenden und mindern und Weisungen einholen. Aufwendungen dafür ersetzt der Versicherer, auch wenn sie erfolglos bleiben, soweit sie geboten erscheinen durften.","norm":"§§ 82, 83 VVG","id":"4.8-3-4"}]},{"typ":"situation","titel":"Fall 4: Haus Jankowski – Erbfall, Leerstand und Verkauf","situation":"Elfriede Jankowski war Versicherungsnehmerin einer Wohngebäudeversicherung für ihr Haus in Halle (Saale)-Ammendorf; die Versicherungsperiode läuft vom 1. Januar bis 31. Dezember. Sie stirbt am 5. Januar 2027. Ihr Sohn Marek erbt das Haus; er lebt in Hamburg, das Haus steht leer. Am 15. Mai 2027 verkauft er es notariell an Frau Seidel. Besitz, Nutzen und Lasten gehen am 1. Juni 2027 über, die Eintragung im Grundbuch erfolgt am 2. August 2027. Laut Bedingungen ist es eine anzeigepflichtige Gefahrerhöhung, wenn das Gebäude nicht mehr genutzt wird.","items":[{"typ":"mc","frage":"Was gilt für die Wohngebäudeversicherung nach dem Tod von Frau Jankowski?","optionen":["Marek tritt als Erbe in den Vertrag ein; ein Sonderkündigungsrecht nach § 96 VVG hat er nicht.","Der Vertrag endet mit dem Tod der Versicherungsnehmerin automatisch zum Monatsende.","Marek tritt ein und kann den Vertrag wie ein Erwerber nach § 96 VVG fristlos kündigen.","Der Vertrag ruht beitragsfrei, bis das Haus verkauft oder wieder bewohnt ist."],"richtig":[0],"erkl":"Mit dem Erbfall geht das Vermögen als Ganzes auf den Erben über, auch der Versicherungsvertrag. Ein Erbfall ist keine Veräußerung; das Kündigungsrecht des Erwerbers nach § 96 VVG gilt daher nicht.","norm":"§ 1922 Abs. 1 BGB; §§ 95, 96 VVG","id":"4.8-4-1"},{"typ":"wf","frage":"Das Haus steht seit dem Erbfall leer. Welche Aussagen treffen zu?","aussagen":[["Marek muss den Leerstand dem Versicherer unverzüglich anzeigen.",true],["Er muss das leere Haus genügend häufig kontrollieren und wasserführende Anlagen absperren und entleeren.",true],["Statt zu kündigen kann der Versicherer für die höhere Gefahr einen höheren Beitrag verlangen.",true],["Wird der Leerstand nicht angezeigt, ist der Versicherer bei jedem späteren Schaden ohne Weiteres leistungsfrei.",false]],"erkl":"Leerstand ist laut Vertrag eine Gefahrerhöhung und unverzüglich anzuzeigen. Der Versicherer kann kündigen oder den Beitrag erhöhen. Leistungsfreiheit setzt u. a. voraus, dass die Gefahrerhöhung für den Schaden ursächlich war.","norm":"§§ 23, 25, 26 VVG; VGB 2022 (GDV-Muster), Gefahrerhöhung und Sicherheitsvorschriften","id":"4.8-4-2"},{"typ":"mc","frage":"Am 20. Juni 2027, nach der Übergabe, aber vor der Grundbucheintragung, platzt im Haus ein Rohr. Wer ist zu diesem Zeitpunkt Versicherungsnehmer?","optionen":["Marek, weil Frau Seidel erst mit dem Eigentumsübergang eintritt","Frau Seidel, weil Besitz, Nutzen und Lasten übergegangen sind","Frau Seidel, weil der Kaufvertrag notariell beurkundet ist","niemand, weil der Vertrag in dieser Zeit ruht"],"richtig":[0],"erkl":"Der Erwerber tritt mit der Veräußerung in den Vertrag ein. Bei Grundstücken geht das Eigentum erst mit der Eintragung im Grundbuch über, hier am 2. August 2027.","norm":"§ 95 Abs. 1 VVG; § 873 Abs. 1 BGB","id":"4.8-4-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation nach dem Verkauf an Frau Seidel die Rechtsfolge zu.","paare":[["Frau Seidel kündigt den Vertrag fristgerecht","nur Marek schuldet den Beitrag, Frau Seidel haftet dafür nicht"],["Frau Seidel kündigt nicht","Marek und Frau Seidel haften für den Beitrag der laufenden Periode als Gesamtschuldner"],["Der Versicherer erfährt vom Verkauf","er kann binnen eines Monats mit einer Frist von einem Monat kündigen"],["Frau Seidel kennt den Vertrag erst später","ihre Kündigungsfrist beginnt erst mit Kenntnis vom Vertrag"]],"erkl":"Ohne Kündigung haften Veräußerer und Erwerber für die laufende Periode gesamtschuldnerisch. Kündigt der Erwerber oder der Versicherer nach § 96 VVG, schuldet allein der Veräußerer den Beitrag. Die Monatsfrist des Erwerbers läuft bei fehlender Kenntnis ab Kenntnis.","norm":"§ 95 Abs. 2, § 96 VVG","id":"4.8-4-4"}]},{"typ":"situation","titel":"Fall 5: Frau Albrecht – vermietetes Haus, Öltank und Verkehrssicherung","situation":"Renate Albrecht wohnt in ihrem eigenen Einfamilienhaus, das in ihrer Privathaftpflicht mitversichert ist. Außerdem besitzt sie ein vermietetes Dreifamilienhaus in Halle (Saale) mit einem 5.000-Liter-Heizöltank im Keller. Die Stadt hat den Winterdienst auf dem Gehweg per Satzung den Eigentümern übertragen. Laut ihrer Privathaftpflicht sind vermietete Häuser nicht mitversichert; Gewässerschäden sind nur aus Kleingebinden bis 50 Liter gedeckt. Im Mietvertrag hat sie den Winterdienst vor dem Dreifamilienhaus auf den Mieter Herrn Yıldız übertragen. Im Winter 2026/2027 kommt es zu mehreren Schäden.","items":[{"typ":"zuo","frage":"Welche Versicherung ist für das Ereignis zuständig? Ordnen Sie zu.","paare":[["Öl aus dem undichten Tank im Dreifamilienhaus verunreinigt das Grundwasser","Gewässerschadenhaftpflicht (Anlagenrisiko)"],["Ein Besucher stürzt auf dem vereisten Weg vor Frau Albrechts eigenem Einfamilienhaus","Privathaftpflichtversicherung"],["Ein Sturm mit Windstärke 9 deckt das Dach des Dreifamilienhauses ab","Wohngebäudeversicherung"],["Eine lockere Dachrinne am Dreifamilienhaus fällt bei leichtem Wind auf das Auto eines Passanten","Haus- und Grundbesitzerhaftpflicht"]],"erkl":"Haftpflichtrisiken aus vermieteten Gebäuden deckt die Haus- und Grundbesitzerhaftpflicht, das selbst genutzte Haus die Privathaftpflicht. Für den Öltank braucht es eine Gewässerschadenhaftpflicht. Eigene Gebäudeschäden durch Sturm trägt die Wohngebäudeversicherung.","norm":"§ 89 WHG; § 836 BGB; VGB; Bedingungen Haus- und Grundbesitzerhaftpflicht","id":"4.8-5-1"},{"typ":"mc","frage":"Die Dachrinne hat sich gelöst, weil sie seit Jahren verrostet war. Was gilt für die Haftung von Frau Albrecht gegenüber dem Passanten?","optionen":["Sie haftet, wenn sie nicht beweist, dass sie die erforderliche Sorgfalt beachtet hat.","Sie haftet nie, weil der Wind und nicht sie selbst den Schaden ausgelöst hat.","Allein ihre Mieter haften, weil sie das Haus bewohnen und die Rinne sehen konnten.","Sie haftet nur, wenn der Passant ihr ein vorsätzliches Handeln nachweisen kann."],"richtig":[0],"erkl":"Löst sich ein Gebäudeteil infolge mangelhafter Unterhaltung, haftet der Grundstücksbesitzer; das Verschulden wird vermutet. Er kann sich nur entlasten, wenn er die erforderliche Sorgfalt nachweist. Die Haus- und Grundbesitzerhaftpflicht prüft und reguliert den Anspruch.","norm":"§ 836 Abs. 1 BGB","id":"4.8-5-2"},{"typ":"wf","frage":"Welche Aussagen zum Heizöltank von Frau Albrecht treffen zu?","aussagen":[["Als Betreiberin des Tanks haftet sie für die Verunreinigung des Grundwassers auch ohne Verschulden.",true],["Ihre Ersatzpflicht entfällt, wenn der Schaden durch höhere Gewalt verursacht wurde.",true],["Ihre Privathaftpflicht deckt den Tank nach den Bedingungen im Fall mit ab.",false],["Für das Anlagenrisiko braucht sie eine Gewässerschadenhaftpflichtversicherung.",true]],"erkl":"Der Betreiber einer Anlage haftet für Schäden durch eine nachteilige Veränderung der Wasserbeschaffenheit verschuldensunabhängig, außer bei höherer Gewalt. Die Privathaftpflicht von Frau Albrecht deckt nur Kleingebinde bis 50 Liter.","norm":"§ 89 Abs. 2 WHG","id":"4.8-5-3"},{"typ":"mc","frage":"Herr Yıldız vergisst zu streuen; eine Fußgängerin stürzt vor dem Dreifamilienhaus. Was gilt?","optionen":["Herr Yıldız haftet aus dem übernommenen Winterdienst; Frau Albrecht muss ihn aber überwachen.","Nur Frau Albrecht haftet, weil die Streupflicht nicht auf Mieter übertragen werden kann.","Niemand haftet, weil Glätte im Winter zum allgemeinen Lebensrisiko der Fußgänger gehört.","Nur die Stadt haftet, weil der Gehweg vor dem Haus eine öffentliche Fläche ist."],"richtig":[0],"erkl":"Die Verkehrssicherungspflicht kann vertraglich übertragen werden. Wer sie übernimmt, haftet selbst nach § 823 BGB; meist prüft seine Privathaftpflicht den Anspruch. Der Eigentümer bleibt zur Auswahl und Kontrolle verpflichtet.","norm":"§ 823 Abs. 1 BGB (Verkehrssicherungspflicht)","id":"4.8-5-4"}]},{"typ":"situation","titel":"Fall 6: Familie Schröder – Bau eines Einfamilienhauses","situation":"Lukas und Mia Schröder bauen ein Einfamilienhaus in Teutschenthal bei Halle (Saale). Die Bausumme beträgt 420.000 €, Baubeginn ist der 1. März 2027. Ihre Privathaftpflicht deckt Bauvorhaben laut Bedingungen nur bis zu einer Bausumme von 100.000 €. Die Wohngebäudeversicherung haben sie bei der Proximus Versicherung AG abgeschlossen. Eingeschlossen ist eine Feuerrohbauversicherung: beitragsfrei für höchstens 12 Monate ab Baubeginn, danach bis zur Bezugsfertigkeit gegen Beitrag. Außerdem bietet die Proximus an: Bauleistungsversicherung für unvorhergesehene Schäden an der Bauleistung, z. B. durch Sturm, Vandalismus oder Diebstahl fest eingebauter Teile, nicht aber durch Feuer und nicht für Diebstahl lose gelagerter Baustoffe.","items":[{"typ":"mc","frage":"Brauchen die Schröders eine eigene Bauherrenhaftpflichtversicherung?","optionen":["Ja, weil ihre Privathaftpflicht Bauvorhaben nur bis 100.000 € Bausumme deckt.","Nein, weil die Baufirmen für alle Schäden auf der Baustelle allein haften.","Nein, weil die Bauleistungsversicherung auch Schäden Dritter übernimmt.","Ja, aber erst ab dem Einzug in das fertige Haus."],"richtig":[0],"erkl":"Der Bauherr bleibt für die Sicherheit der Baustelle verantwortlich. Übersteigt die Bausumme die Grenze der Privathaftpflicht, braucht er eine eigene Bauherrenhaftpflicht. Die Bauleistungsversicherung deckt nur Schäden an der Bauleistung, keine Haftpflichtansprüche.","norm":"§ 823 Abs. 1 BGB; Bedingungen Privat- und Bauherrenhaftpflicht","id":"4.8-6-1"},{"typ":"zuo","frage":"Welche Versicherung ist für den Schaden am Bau der Schröders zuständig? Ordnen Sie zu.","paare":[["Ein Sturm wirft die frisch gemauerte Giebelwand um","Bauleistungsversicherung"],["Ein Blitz setzt den Dachstuhl des Rohbaus in Brand","Feuerrohbauversicherung"],["Ein Spaziergänger stürzt nachts in die ungesicherte Baugrube","Bauherrenhaftpflichtversicherung"],["Unbekannte stehlen lose gelagerte Dachziegel vom Grundstück","nicht versichert nach den Bedingungen im Fall"]],"erkl":"Die Bauleistungsversicherung schützt die entstehende Bauleistung, die Feuerrohbauversicherung den Rohbau gegen Feuer, die Bauherrenhaftpflicht gegen Ansprüche Dritter. Diebstahl lose gelagerter Baustoffe ist laut Angebot nicht versichert.","norm":"Bedingungen Bauleistung, Feuerrohbau, Bauherrenhaftpflicht (laut Angebot)","id":"4.8-6-2"},{"typ":"wf","frage":"Welche Aussagen zur Bauherrenhaftpflicht der Schröders treffen zu?","aussagen":[["Sie deckt Schäden Dritter, für die die Schröders als Bauherren haften.",true],["Schäden am eigenen Rohbau sind über die Bauherrenhaftpflicht versichert.",false],["Die Schröders müssen die Baustelle gegen Gefahren für Dritte sichern, auch wenn sie Firmen beauftragt haben.",true],["Sie prüft auch, ob ein Anspruch berechtigt ist, und wehrt unberechtigte Ansprüche ab.",true]],"erkl":"Haftpflichtversicherungen prüfen die Haftung, zahlen berechtigte Ansprüche und wehren unberechtigte ab. Eigene Schäden sind nicht gedeckt. Der Bauherr hat Auswahl-, Überwachungs- und Sicherungspflichten.","norm":"§ 100 VVG; § 823 Abs. 1 BGB","id":"4.8-6-3"},{"typ":"mc","frage":"Der Bau verzögert sich; das Haus ist erst im Mai 2028 bezugsfertig. Was gilt für den Feuerschutz des Rohbaus?","optionen":["Ab März 2028 ist er beitragspflichtig, weil die 12 Monate abgelaufen sind.","Er bleibt bis zur Bezugsfertigkeit beitragsfrei, egal wie lange der Bau dauert.","Er endet am 1. März 2028 ersatzlos und kann nicht verlängert werden.","Er geht automatisch in eine Bauleistungsversicherung über."],"richtig":[0],"erkl":"Die Beitragsfreiheit gilt laut Vertrag höchstens 12 Monate ab Baubeginn (1. März 2027), also bis Ende Februar 2028. Danach ist der Schutz bis zur Fertigstellung beitragspflichtig.","norm":"Feuerrohbauversicherung (Regelung laut Fall); VGB","id":"4.8-6-4"}]}]},{"nr":"4.9","titel":"Prüfungsfälle: Glas, Elementar, Service und Recht rund ums Wohnen","lf":"LF 4","buch":"S. 180–233","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Aydın – Glasversicherung und Assistance","situation":"Elif Aydın wohnt zur Miete in einer 68-m²-Wohnung in Halle (Saale). Ihre Glasversicherung umfasst laut Bedingungen die Scheiben der Fenster und Türen ihrer Wohnung, Glas in Möbeln und ihr Glaskeramik-Kochfeld gegen Bruch; nicht versichert sind Bildschirme, Handspiegel, Hohlgläser sowie Kratzer und Kantenschäden. Versichert sind auch Kosten für eine Notverglasung. Ihr Assistance-Baustein bezahlt einen Schlüsselnotdienst, wenn sie sich aussperrt, bis 150 € je Fall. Ihr Smart-Home-Paket mit Wassermelder und automatischem Absperrventil bringt 10 % Nachlass.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden bei Frau Aydın das Ergebnis der Glasversicherung zu.","paare":[["Ein Topf fällt auf das Ceranfeld, es springt","versichert: Glaskeramik-Kochfläche"],["Ein Kratzer zieht sich über die Glastischplatte","nicht versichert: Oberflächenschaden"],["Das Display ihres Smartphones zerbricht","nicht versichert: Bildschirm"],["Ein Fußball zerschlägt die Fensterscheibe im Wohnzimmer","versichert: Fensterscheibe der Wohnung"]],"erkl":"Die Glasversicherung deckt nur Bruch. Kratzer und Kantenschäden sind keine Brüche; Bildschirme sind laut Bedingungen ausgeschlossen.","norm":"Bedingungen Glasversicherung (laut Fall)","id":"4.9-1-1"},{"typ":"zahl","frage":"Frau Aydın hat sich ausgesperrt. Der Schlüsseldienst stellt 190,00 € in Rechnung. Wie viel Euro muss sie selbst tragen?","wert":40,"einheit":"€","tol":0.01,"erkl":"Die Assistance zahlt bis 150,00 € je Fall: 190,00 € − 150,00 € = 40,00 € trägt Frau Aydın selbst.","norm":"Assistance-Baustein (laut Fall)","id":"4.9-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Smart-Home-Paket und zu den Serviceleistungen treffen zu?","aussagen":[["Das automatische Absperrventil kann einen Leitungswasserschaden begrenzen, bevor er groß wird.",true],["Durch das Smart-Home-Paket entfällt ihre Pflicht, nach einem Schaden für dessen Minderung zu sorgen.",false],["Der Nachlass zeigt, dass Prävention für Versicherer und Kundin wirtschaftlich sinnvoll ist.",true],["Der Assistance-Baustein übernimmt jede Handwerkerrechnung ohne Grenze, auch ohne Versicherungsfall.",false]],"erkl":"Smart-Home-Technik senkt Häufigkeit und Höhe von Schäden. Die gesetzliche Pflicht zur Schadenminderung bleibt bestehen. Assistance-Leistungen sind auf bestimmte Anlässe und Beträge begrenzt.","norm":"§ 82 Abs. 1 VVG; Bedingungen Assistance (laut Fall)","id":"4.9-1-3"},{"typ":"mc","frage":"Nachts zerschlägt ein Unbekannter mit einem Stein die Scheibe der Wohnungstür von Frau Aydın. Was ist richtig?","optionen":["Sie meldet den Schaden dem Vermieter; die Notverglasung trägt ihre Glasversicherung.","Sie muss bis zur Reparatur warten, weil eine Notverglasung nicht versichert ist.","Sie darf den Schaden verschweigen, weil der Täter unbekannt ist.","Nur die Hausratversicherung zahlt, weil ein Stein von außen kam."],"richtig":[0],"erkl":"Ein Mieter muss Mängel der Mietsache unverzüglich anzeigen. Kosten für das vorläufige Verschließen der Öffnung (Notverglasung) sind laut Bedingungen versichert.","norm":"§ 536c Abs. 1 BGB; Bedingungen Glasversicherung (laut Fall)","id":"4.9-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Krüger – Starkregen und Rückstau","situation":"Familie Krüger besitzt ein Einfamilienhaus in Naumburg (Saale), ZÜRS-Gefährdungsklasse 2. Wohngebäude- und Hausratversicherung schließen weitere Naturgefahren ein. Laut Vertrag beträgt der Selbstbehalt für Naturgefahren in jedem Vertrag 10 % des Schadens, mindestens 500 €, höchstens 5.000 € je Versicherungsfall. Die Rückstausicherung ist laut Sicherheitsvorschriften funktionsbereit zu halten. Im Juli 2027 sammelt sich nach Starkregen Wasser auf dem Grundstück und läuft durch die Kellerfenster; zugleich drückt Abwasser durch den Bodenablauf der Waschküche. Der Gebäudeschaden beträgt 23.400 €, der Hausratschaden im Keller 3.800 €.","items":[{"typ":"zahl","frage":"Wie hoch ist der Selbstbehalt der Krügers in der Wohngebäudeversicherung für diesen Schaden?","wert":2340,"einheit":"€","tol":0.01,"erkl":"10 % von 23.400,00 € = 2.340,00 €. Der Betrag liegt zwischen der Mindestgrenze 500 € und der Höchstgrenze 5.000 €.","norm":"Vertrag weitere Naturgefahren (Selbstbehalt laut Fall)","id":"4.9-2-1"},{"typ":"zahl","frage":"Wie viel Euro zahlt die Hausratversicherung der Krügers für den Schaden im Keller nach Abzug des Selbstbehalts?","wert":3300,"einheit":"€","tol":0.01,"erkl":"10 % von 3.800,00 € = 380,00 € liegt unter dem Mindestselbstbehalt; es gilt 500,00 €. Entschädigung: 3.800,00 € − 500,00 € = 3.300,00 €.","norm":"Vertrag weitere Naturgefahren (Selbstbehalt laut Fall)","id":"4.9-2-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die passende Einordnung nach den Bedingungen zu.","paare":[["Starkregenwasser sammelt sich auf dem Grundstück und läuft in den Keller","Überschwemmung"],["Abwasser drückt aus dem Kanal durch den Bodenablauf der Waschküche","Rückstau"],["Durch anhaltende Nässe rutscht der Hang hinter dem Haus ab","Erdrutsch"],["Schneelast drückt das Dach des Gartenhauses ein","Schneedruck"],["Grundwasser drückt durch die Kellerwand, ohne an die Oberfläche zu treten","keine versicherte Naturgefahr"]],"erkl":"Überschwemmung verlangt Wasser auf der Geländeoberfläche, Rückstau den Austritt aus gebäudeeigenen Ableitungsrohren. Erdrutsch und Schneedruck sind eigene Naturgefahren. Grundwasser ist nur versichert, wenn es an die Oberfläche tritt.","norm":"VGB 2022 und VHB 2022 (GDV-Muster), weitere Naturgefahren","id":"4.9-2-3"},{"typ":"wf","frage":"Welche Aussagen zum Elementarschutz der Krügers treffen zu?","aussagen":[["War die Rückstausicherung grob fahrlässig nicht funktionsbereit, kann der Versicherer die Leistung kürzen.",true],["In der ZÜRS-Gefährdungsklasse 2 ist Hochwasser statistisch einmal in 100 bis 200 Jahren zu erwarten.",true],["Der Selbstbehalt wird bei einem Ereignis nur einmal abgezogen, auch wenn Gebäude und Hausrat betroffen sind.",false],["Ohne Einschluss der weiteren Naturgefahren wäre der Starkregenschaden nicht versichert.",true]],"erkl":"Die Rückstausicherung ist eine Sicherheitsvorschrift; bei grober Fahrlässigkeit ist eine Kürzung möglich, soweit die Verletzung ursächlich war. Der Selbstbehalt gilt laut Vertrag je Vertrag. Starkregen fällt nur mit Einschluss unter den Schutz.","norm":"§ 28 Abs. 2 VVG; VGB 2022 (GDV-Muster), Sicherheitsvorschriften und weitere Naturgefahren","id":"4.9-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Franke – Eigentumswohnung, Mieterin und Gemeinschaft","situation":"Jonas Franke besitzt eine Eigentumswohnung in einer Wohnungseigentümergemeinschaft mit zwölf Wohnungen in Halle (Saale). Er hat sie an Frau Lehmann vermietet. Die Gemeinschaft hat eine Wohngebäudeversicherung für das ganze Gebäude einschließlich des Sondereigentums und eine Haus- und Grundbesitzerhaftpflicht abgeschlossen und den Winterdienst einer Firma übertragen. Die Beiträge legt Herr Franke über die Betriebskosten auf Frau Lehmann um, wie im Mietvertrag vereinbart.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache richtig zu.","paare":[["Dach und tragende Wände","Gemeinschaftseigentum (Bestand und Sicherheit des Gebäudes)"],["Aufzug und zentrale Klingelanlage","Gemeinschaftseigentum (gemeinschaftlicher Gebrauch)"],["Innentüren in der Wohnung von Herrn Franke","Sondereigentum"],["Möbel von Frau Lehmann","Hausrat der Mieterin"]],"erkl":"Teile, die für Bestand oder Sicherheit des Gebäudes nötig sind, und Einrichtungen für den gemeinschaftlichen Gebrauch sind kein Sondereigentum. Sondereigentum sind die Räume und Bestandteile, die verändert werden können, ohne andere zu beeinträchtigen. Möbel der Mieterin sind ihr Hausrat.","norm":"§ 5 Abs. 1 und 2 WEG","id":"4.9-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Mietverhältnis zwischen Herrn Franke und Frau Lehmann treffen zu?","aussagen":[["Ein undichtes Heizkörperventil muss Frau Lehmann dem Vermieter unverzüglich anzeigen.",true],["Ist die Wohnung nach einem Wasserschaden nur eingeschränkt nutzbar, ist die Miete angemessen gemindert.",true],["Abnutzungen durch vertragsgemäßen Gebrauch muss Frau Lehmann ersetzen.",false],["Die Kosten der Gebäudeversicherung dürfen als Betriebskosten umgelegt werden.",true]],"erkl":"Der Mieter muss Mängel unverzüglich anzeigen; bei geminderter Tauglichkeit mindert sich die Miete kraft Gesetzes. Abnutzung durch vertragsgemäßen Gebrauch hat er nicht zu vertreten. Sach- und Haftpflichtversicherungen des Gebäudes sind umlagefähige Betriebskosten.","norm":"§§ 536, 536c, 538 BGB; § 2 Nr. 13 BetrKV","id":"4.9-3-2"},{"typ":"mc","frage":"Ein Fußgänger stürzt auf dem vereisten Gehweg vor dem Haus, weil die Winterdienstfirma nicht gestreut hat. Welche Versicherung der Eigentümer prüft den Anspruch?","optionen":["die Haus- und Grundbesitzerhaftpflicht der Gemeinschaft","die Privathaftpflichtversicherung von Herrn Franke","die Privathaftpflichtversicherung von Frau Lehmann","die Wohngebäudeversicherung der Gemeinschaft"],"richtig":[0],"erkl":"Die Verkehrssicherungspflicht für das gemeinschaftliche Grundstück trifft die Gemeinschaft; sie haftet neben der beauftragten Firma, wenn sie Auswahl oder Kontrolle vernachlässigt. Dieses Risiko deckt die Haus- und Grundbesitzerhaftpflicht der Gemeinschaft. Die Wohngebäudeversicherung deckt keine Ansprüche Dritter.","norm":"§ 19 Abs. 2 Nr. 3 WEG; § 823 Abs. 1 BGB","id":"4.9-3-3"},{"typ":"mc","frage":"In der Wohnung von Herrn Franke bricht ein Wasserrohr in der Wand. Wand, das vom Bauträger verlegte Parkett und die Möbel von Frau Lehmann werden nass. Wer ersetzt was?","optionen":["Die Gebäudeversicherung der Gemeinschaft ersetzt Rohr, Wand und Parkett, die Hausratversicherung von Frau Lehmann die Möbel.","Die Hausratversicherung von Frau Lehmann ersetzt Parkett und Möbel, weil sie die Wohnung bewohnt und täglich nutzt.","Herr Franke trägt das Parkett im Sondereigentum selbst, die Gebäudeversicherung der Gemeinschaft nur Rohr und Wand.","Die Gebäudeversicherung der Gemeinschaft ersetzt alles, auch die Möbel von Frau Lehmann, weil sie im Gebäude stehen."],"richtig":[0],"erkl":"Die Wohngebäudeversicherung der Gemeinschaft umfasst hier das ganze Gebäude, also Gemeinschafts- und Sondereigentum; das vom Bauträger verlegte Parkett ist Gebäudebestandteil. Bewegliche Sachen der Mieterin sind Hausrat und über ihre eigene Hausratversicherung gegen Leitungswasser versichert.","norm":"VGB 2022 (GDV-Muster), versicherte Sachen; VHB, Leitungswasser; § 5 WEG","id":"4.9-3-4"}]}]},{"nr":"4.10","titel":"Rechenwerkstatt: Hausratbeitrag","lf":"LF 4","buch":"S. 180–227","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Sommer – erste eigene Wohnung","situation":"Lea Sommer (27), Pflegefachfrau, ist am 01.03.2026 in eine Mietwohnung in der Großen Ulrichstraße eingezogen und bittet die Proximus Versicherung AG um ein Hausratangebot. Wohnfläche: 62 m², Anschrift: 06108 Halle (Saale), Altstadt. Versicherungsbeginn: 01.03.2026. Die Versicherungssumme soll so hoch sein, dass der Unterversicherungsverzicht gilt (Mindestsumme nach Tarif). Gewünschte Bausteine: Fahrraddiebstahl. Vereinbart bzw. vorhanden: eine Selbstbeteiligung von 150 € je Schaden. Zahlungsweise: jährlich. Rechnen Sie mit dem Übungstarif PROXIMUS Wohnen 2026.","items":[{"typ":"zahl","frage":"Wie hoch ist für Frau Sommer die Mindestversicherungssumme, mit der der Unterversicherungsverzicht gilt?","wert":40300.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 62 m² × 650 €/m² = 40.300,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-1-1"},{"typ":"zahl","frage":"Berechnen Sie für Frau Sommer den Grundbeitrag der Hausratversicherung (Beitragssatz der Tarifzone × Versicherungssumme), ohne Zuschläge, Nachlässe und Versicherungsteuer.","wert":84.63,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 62 m² × 650 €/m² = 40.300,00 €. PLZ 06108 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 40.300,00 € × 2,10 ‰ = 84,63 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-1-2"},{"typ":"zahl","frage":"Berechnen Sie für Frau Sommer die Summe aller Beitragszuschläge für die gewählten Zusatzbausteine (ohne Grundbeitrag).","wert":16.12,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 62 m² × 650 €/m² = 40.300,00 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 40.300,00 € × 0,40 ‰ = 16,12 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-1-3"},{"typ":"zahl","frage":"Berechnen Sie für Frau Sommer den Jahresnettobeitrag einschließlich Zuschlägen und nach Abzug aller Nachlässe, ohne Ratenzuschlag und ohne Versicherungsteuer.","wert":90.67,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 62 m² × 650 €/m² = 40.300,00 €. PLZ 06108 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 40.300,00 € × 2,10 ‰ = 84,63 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 40.300,00 € × 0,40 ‰ = 16,12 €. Beitrag einschließlich Zuschlägen: 84,63 € + 16,12 € = 100,75 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 100,75 € × 10 % = 10,08 €. Jahresnettobeitrag: 100,75 € − 10,08 € = 90,67 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-1-4"},{"typ":"zahl","frage":"Berechnen Sie für Frau Sommer den Jahresbruttobeitrag einschließlich Ratenzuschlag und Versicherungsteuer.","wert":105.31,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 62 m² × 650 €/m² = 40.300,00 €. PLZ 06108 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 40.300,00 € × 2,10 ‰ = 84,63 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 40.300,00 € × 0,40 ‰ = 16,12 €. Beitrag einschließlich Zuschlägen: 84,63 € + 16,12 € = 100,75 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 100,75 € × 10 % = 10,08 €. Jahresnettobeitrag: 100,75 € − 10,08 € = 90,67 €. Jährliche Zahlung: kein Ratenzuschlag (0,00 €). Versicherungsteuer Hausrat: 90,67 € × 16,15 % = 14,64 €. Jahresbruttobeitrag: 90,67 € + 14,64 € = 105,31 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 5, § 6 VersStG","id":"4.10-1-5"},{"typ":"mc","frage":"Welche Tarifzone und welcher Beitragssatz gelten für die Wohnung von Frau Sommer in 06108 Halle (Saale), Altstadt?","optionen":["Tarifzone 1 mit 1,20 ‰ der Versicherungssumme","Tarifzone 3 mit 2,10 ‰ der Versicherungssumme","Tarifzone 2 mit 1,60 ‰ der Versicherungssumme","Tarifzone 4 mit 2,80 ‰ der Versicherungssumme"],"richtig":[1],"erkl":"Laut Zonenliste gehört die PLZ 06108 zur Tarifzone 3; der Hausrat-Beitragssatz beträgt dort 2,10 ‰ der VS. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-1-6"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Tarifzonen nach Postleitzahl (Auszug, Hausrat und Wohngebäude)","kopf":["PLZ","Ort","Tarifzone"],"zeilen":[["01067","Dresden – Innere Altstadt","4"],["04109","Leipzig – Zentrum","4"],["04277","Leipzig – Connewitz","4"],["06108","Halle (Saale) – Altstadt","3"],["06110","Halle (Saale) – Südliche Innenstadt","3"],["06114","Halle (Saale) – Paulusviertel","3"],["06120","Halle (Saale) – Heide-Süd","2"],["06122","Halle (Saale) – Neustadt","2"],["06217","Merseburg","2"],["06366","Köthen (Anhalt)","1"],["06484","Quedlinburg","1"],["06526","Sangerhausen","1"],["06618","Naumburg (Saale)","1"],["06844","Dessau-Roßlau","2"],["06886","Lutherstadt Wittenberg","2"],["39104","Magdeburg – Altstadt","3"],["99084","Erfurt – Altstadt","3"]],"hinweis":""},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addieren und in einem Schritt anwenden (VS × Summe der Zuschlagssätze ÷ 1.000). Nachlässe addieren und in einem Schritt auf den Beitrag einschließlich Zuschlägen anwenden."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]},{"typ":"situation","titel":"Fall 2: Herr Yıldız – Altbau in Connewitz","situation":"Malik Yıldız (34), Tontechniker, mietet eine Altbauwohnung in Leipzig-Connewitz. Wegen seiner Studiotechnik möchte er Überspannungsschutz; der Keller liegt nahe der Pleiße. Wohnfläche: 88 m², Anschrift: 04277 Leipzig, Connewitz. Versicherungsbeginn: 01.05.2026. Die Versicherungssumme soll so hoch sein, dass der Unterversicherungsverzicht gilt (Mindestsumme nach Tarif). Gewünschte Bausteine: Überspannung durch Blitz und weitere Naturgefahren (ZÜRS-Gefährdungsklasse 2). Vereinbart bzw. vorhanden: eine Laufzeit von 3 Jahren und eine VdS-anerkannte Einbruchmeldeanlage. Zahlungsweise: monatlich per Lastschrift. Rechnen Sie mit dem Übungstarif PROXIMUS Wohnen 2026.","items":[{"typ":"zahl","frage":"Berechnen Sie für Herrn Yıldız den Grundbeitrag der Hausratversicherung (Beitragssatz der Tarifzone × Versicherungssumme), ohne Zuschläge, Nachlässe und Versicherungsteuer.","wert":160.16,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 88 m² × 650 €/m² = 57.200,00 €. PLZ 04277 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 57.200,00 € × 2,80 ‰ = 160,16 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-2-1"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Yıldız die Summe aller Beitragszuschläge für die gewählten Zusatzbausteine (ohne Grundbeitrag).","wert":22.88,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 88 m² × 650 €/m² = 57.200,00 €. Zuschlagssätze: Überspannung 0,10 ‰ + Naturgefahren ZÜRS GK 2 0,30 ‰ = 0,40 ‰; Zuschläge = 57.200,00 € × 0,40 ‰ = 22,88 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-2-2"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Yıldız den Nachlass in Euro (alle Nachlässe zusammen, bezogen auf den Beitrag einschließlich Zuschlägen).","wert":27.46,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 88 m² × 650 €/m² = 57.200,00 €. PLZ 04277 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 57.200,00 € × 2,80 ‰ = 160,16 €. Zuschlagssätze: Überspannung 0,10 ‰ + Naturgefahren ZÜRS GK 2 0,30 ‰ = 0,40 ‰; Zuschläge = 57.200,00 € × 0,40 ‰ = 22,88 €. Beitrag einschließlich Zuschlägen: 160,16 € + 22,88 € = 183,04 €. Nachlässe: Laufzeit 3 Jahre 10 % + Einbruchmeldeanlage (VdS) 5 % = 15 %; Nachlass = 183,04 € × 15 % = 27,46 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-2-3"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Yıldız den Jahresnettobeitrag einschließlich Zuschlägen und nach Abzug aller Nachlässe, ohne Ratenzuschlag und ohne Versicherungsteuer.","wert":155.58,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 88 m² × 650 €/m² = 57.200,00 €. PLZ 04277 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 57.200,00 € × 2,80 ‰ = 160,16 €. Zuschlagssätze: Überspannung 0,10 ‰ + Naturgefahren ZÜRS GK 2 0,30 ‰ = 0,40 ‰; Zuschläge = 57.200,00 € × 0,40 ‰ = 22,88 €. Beitrag einschließlich Zuschlägen: 160,16 € + 22,88 € = 183,04 €. Nachlässe: Laufzeit 3 Jahre 10 % + Einbruchmeldeanlage (VdS) 5 % = 15 %; Nachlass = 183,04 € × 15 % = 27,46 €. Jahresnettobeitrag: 183,04 € − 27,46 € = 155,58 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-2-4"},{"typ":"zahl","frage":"Wie hoch ist die monatliche Rate einschließlich Versicherungsteuer, die Herr Yıldız zahlen muss?","wert":15.81,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 88 m² × 650 €/m² = 57.200,00 €. PLZ 04277 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 57.200,00 € × 2,80 ‰ = 160,16 €. Zuschlagssätze: Überspannung 0,10 ‰ + Naturgefahren ZÜRS GK 2 0,30 ‰ = 0,40 ‰; Zuschläge = 57.200,00 € × 0,40 ‰ = 22,88 €. Beitrag einschließlich Zuschlägen: 160,16 € + 22,88 € = 183,04 €. Nachlässe: Laufzeit 3 Jahre 10 % + Einbruchmeldeanlage (VdS) 5 % = 15 %; Nachlass = 183,04 € × 15 % = 27,46 €. Jahresnettobeitrag: 183,04 € − 27,46 € = 155,58 €. Ratenzuschlag monatlich 5 %: 155,58 € × 5 % = 7,78 €. Jahresbeitrag mit Ratenzuschlag: 155,58 € + 7,78 € = 163,36 €. Versicherungsteuer Hausrat: 163,36 € × 16,15 % = 26,38 €. Jahresbruttobeitrag: 163,36 € + 26,38 € = 189,74 €. Monatliche Rate mit Versicherungsteuer: 189,74 € ÷ 12 = 15,81 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 5, § 6 VersStG","id":"4.10-2-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnet ngssumme), ohne Zuschläge, Nachlässe und Versicherungsteuer.","wert":114.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 134 m² × 650 €/m² = 87.100,00 €. Vereinbarte VS 95.000,00 € (nicht unter der Mindest-VS → Unterversicherungsverzicht gilt). PLZ 06618 → Tarifzone 1, Beitragssatz 1,20 ‰; Grundbeitrag = 95.000,00 € × 1,20 ‰ = 114,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-3-2"},{"typ":"zahl","frage":"Berechnen Sie für Familie Nowak den Nachlass in Euro (alle Nachlässe zusammen, bezogen auf den Beitrag einschließlich Zuschlägen).","wert":32.3,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 134 m² × 650 €/m² = 87.100,00 €. Vereinbarte VS 95.000,00 € (nicht unter der Mindest-VS → Unterversicherungsverzicht gilt). PLZ 06618 → Tarifzone 1, Beitragssatz 1,20 ‰; Grundbeitrag = 95.000,00 € × 1,20 ‰ = 114,00 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰ + Überspannung 0,10 ‰ = 0,50 ‰; Zuschläge = 95.000,00 € × 0,50 ‰ = 47,50 €. Beitrag einschließlich Zuschlägen: 114,00 € + 47,50 € = 161,50 €. Nachlässe: Selbstbeteiligung 150 € 10 % + Laufzeit 3 Jahre 10 % = 20 %; Nachlass = 161,50 € × 20 % = 32,30 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-3-3"},{"typ":"zahl","frage":"Wie hoch ist die vierteljährliche Rate ohne Versicherungsteuer, die Familie Nowak zahlen muss?","wert":33.92,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 134 m² × 650 €/m² = 87.100,00 €. Vereinbarte VS 95.000,00 € (nicht unter der Mindest-VS → Unterversicherungsverzicht gilt). PLZ 06618 → Tarifzone 1, Beitragssatz 1,20 ‰; Grundbeitrag = 95.000,00 € × 1,20 ‰ = 114,00 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰ + Überspannung 0,10 ‰ = 0,50 ‰; Zuschläge = 95.000,00 € × 0,50 ‰ = 47,50 €. Beitrag einschließlich Zuschlägen: 114,00 € + 47,50 € = 161,50 €. Nachlässe: Selbstbeteiligung 150 € 10 % + Laufzeit 3 Jahre 10 % = 20 %; Nachlass = 161,50 € × 20 % = 32,30 €. Jahresnettobeitrag: 161,50 € − 32,30 € = 129,20 €. Ratenzuschlag vierteljährlich 5 %: 129,20 € × 5 % = 6,46 €. Jahresbeitrag mit Ratenzuschlag: 129,20 € + 6,46 € = 135,66 €. Vierteljährliche Rate: 135,66 € ÷ 4 = 33,92 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.10-3-4"},{"typ":"mc","frage":"Gilt für Familie Nowak der Unterversicherungsverzicht?","optionen":["Nein, weil eine VS über der Mindestsumme ihn ausschließt.","Nein, er gilt nur bei jährlicher Zahlung des Beitrags.","Ja, aber nur für Schäden bis 10 % der Summe.","Ja, weil die VS nicht unter Wohnfläche × 650 €/m² liegt."],"richtig":[3],"erkl":"Mindest-VS 87.100,00 €; vereinbart 95.000,00 €. Eine höhere VS ist erlaubt, der Verzicht bleibt bestehen; der Beitrag richtet sich nach der höheren VS. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB; § 75 VVG","id":"4.10-3-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Tarifzonen nach Postleitzahl (Auszug, Hausrat und Wohngebäude)","kopf":["PLZ","Ort","Tarifzone"],"zeilen":[["01067","Dresden – Innere Altstadt","4"],["04109","Leipzig – Zentrum","4"],["04277","Leipzig – Connewitz","4"],["06108","Halle (Saale) – Altstadt","3"],["06110","Halle (Saale) – Südliche Innenstadt","3"],["06114","Halle (Saale) – Paulusviertel","3"],["06120","Halle (Saale) – Heide-Süd","2"],["06122", 948 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 27.000 Mark. PLZ 06114 → Tarifzone 3; Beitragssatz: Feuer 0,55 ‰ + Leitungswasser 1,00 ‰ + Sturm/Hagel 0,45 ‰ + Naturgefahren ZÜRS GK 2 0,40 ‰ = 2,40 ‰. Grundbeitrag 1914 = 27.000 Mark × 2,40 ‰ = 64,80 Mark. Jahresbeitrag vor Nachlässen = 64,80 Mark × 25,40 (gleitender Neuwertfaktor) = 1.645,92 €. Nachlässe: Neubau (Baujahr 2017, 9 Jahre) 15 % + Selbstbeteiligung 500 € 15 % + Dauernachlass 3 Jahre 10 % = 40 %; Nachlass = 1.645,92 € × 40 % = 658,37 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.11-8-4"},{"typ":"zahl","frage":"Wie hoch ist die halbjährliche Rate der Wohngebäudeversicherung ohne Versicherungsteuer, die Frau König zahlen muss?","wert":508.59,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert gehobene Ausstattung 124 m² × 190 Mark = 23.560 Mark + Vollkeller 124 m² × 12 Mark = 1.488 Mark + Doppelgarage 1.900 Mark = 26.948 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 27.000 Mark. PLZ 06114 → Tarifzone 3; Beitragssatz: Feuer 0,55 ‰ + Leitungswasser 1,00 ‰ + Sturm/Hagel 0,45 ‰ + Naturgefahren ZÜRS GK 2 0,40 ‰ = 2,40 ‰. Grundbeitrag 1914 = 27.000 Mark × 2,40 ‰ = 64,80 Mark. Jahresbeitrag vor Nachlässen = 64,80 Mark × 25,40 (gleitender Neuwertfaktor) = 1.645,92 €. Nachlässe: Neubau (Baujahr 2017, 9 Jahre) 15 % + Selbstbeteiligung 500 € 15 % + Dauernachlass 3 Jahre 10 % = 40 %; Nachlass = 1.645,92 € × 40 % = 658,37 €. Jahresnettobeitrag: 1.645,92 € − 658,37 € = 987,55 €. Ratenzuschlag halbjährlich 3 %: 987,55 € × 3 % = 29,63 €. Jahresbeitrag mit Ratenzuschlag: 987,55 € + 29,63 € = 1.017,18 €. Halbjährliche Rate: 1.017,18 € ÷ 2 = 508,59 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.11-8-5"},{"typ":"wf","frage":"Welche Aussagen zum Wohngebäudebeitrag von Frau König treffen zu?","aussagen":[["Frau König erhält den Neubaunachlass, weil das Haus 2017 gebaut wurde.",true],["Die Nachlässe werden nacheinander vom jeweils verminderten Beitrag abgezogen.",false],["Der Ratenzuschlag wird auf den Jahresbeitrag nach Nachlässen berechnet.",true],["Die Versicherungsteuer für Wohngebäude beträgt 19 % des vollen Beitrags.",false]],"erkl":"Nachlässe werden addiert und in einem Schritt abgezogen; Wohngebäude: 19 % auf 86 % des Entgelts = 16,34 %. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB; § 5, § 6 VersStG","id":"4.11-8-6"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Tarifzonen nach Postleitzahl (Auszug, Hausrat und Wohngebäude)","kopf":["PLZ","Ort","Tarifzone"],"zeilen":[["01067","Dresden – Innere Altstadt","4"],["04109","Leipzig – Zentrum","4"],["04277","Leipzig – Connewitz","4"],["06108","Halle (Saale) – Altstadt","3"],["06110","Halle (Saale) – Südliche Innenstadt","3"],["06114","Halle (Saale) – Paulusviertel","3"],["06120","Halle (Saale) – Heide-Süd","2"],["06122","Halle (Saale) – Neustadt","2"],["06217","Merseburg","2"],["06366","Köthen (Anhalt)","1"],["06484","Quedlinburg","1"],["06526","Sangerhausen","1"],["06618","Naumburg (Saale)","1"],["06844","Dessau-Roßlau","2"],["06886","Lutherstadt Wittenberg","2"],["39104","Magdeburg – Altstadt","3"],["99084","Erfurt – Altstadt","3"]],"hinweis":""},{"titel":"Wohngebäude: Versicherungssumme 1914","kopf":["Merkmal","Tarif"],"zeilen":[["Grundwert je m² Wohnfläche","einfache Ausstattung 140 Mark · mittlere 160 Mark · gehobene 190 Mark"],["Vollkeller","+ 12 Mark je m² Wohnfläche"],["Fußbodenheizung","+ 6 Mark je m² Wohnfläche"],["Garage","Einzelgarage + 1.100 Mark · Doppelgarage + 1.900 Mark"],["Ausgebautes Dachgeschoss","in der Wohnfläche enthalten, kein Zuschlag"],["Ergebnis Summenermittlungsbogen","auf volle 100 Mark aufrunden; Unterversicherungsverzicht"],["Alternativ: Baupreisindex","VS 1914 = Neubauwert 2026 in € ÷ 2.450,0 × 100, kaufmännisch auf volle Mark runden; kein Unterversicherungsverzicht"]],"hinweis":""},{"titel":"Wohngebäude: Beitragssätze in ‰ der VS 1914","kopf":["Gefahr","Zone 1","Zone 2","Zone 3","Zone 4"],"zeilen":[["Feuer","0,40","0,45","0,55","0,65"],["Leitungswasser","0,70","0,85","1,00","1,25"],["Sturm/Hagel","0,20","0,30","0,45","0,65"],["Weitere Naturgefahren (ZÜRS, unabhängig von der Zone)","GK 1: 0,15","GK 2: 0,40","GK 3: 1,20","GK 4: auf Anfrage"]],"hinweis":"Grundbeitrag 1914 = Summe der Beitragssätze × VS 1914 ÷ 1.000 (in Mark, auf Cent runden). Jahresbeitrag = Grundbeitrag 1914 × gleitender Neuwertfaktor 25,40. Nachlässe (addiert, in % des Jahresbeitrags): Neubau (Gebäudealter bis 10 Jahre, gerechnet ab Baujahr bis Beginnjahr) 15 % · Selbstbeteiligung 500 € 15 % · Dauernachlass 3 Jahre 10 %."},{"titel":"Zahlungsweise","kopf":["Zahlungsweise","Ratenzuschlag","Zahl der Raten"],"zeilen":[["jährlich","0 %","1"],["halbjährlich","3 %","2"],["vierteljährlich","5 %","4"],["monatlich (nur Lastschrift)","5 %","12"]],"hinweis":"Ratenzuschlag in % des Jahresnettobeitrags. Rate = (Jahresnettobeitrag + Ratenzuschlag) ÷ Zahl der Raten, auf Cent gerundet."}]}]},{"nr":"4.12","titel":"Rechenwerkstatt: Glas, Elementar, Zahlungsweise","lf":"LF 4","buch":"S. 180–227","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Brandt – kleine Wohnung, Mindestbeitrag","situation":"Nele Brandt (23) wohnt seit dem 01.09.2026 in einer 46 m² großen Wohnung in Halle (Saale)-Neustadt. Ihre Einbauküche hat ein Ceranfeld. Sie beantragt bei der Proximus Versicherung AG eine Glasversicherung für die Wohnungsverglasung (Hausrat- und Gebäudeteil) und möchte monatlich per Lastschrift zahlen.","items":[{"typ":"zahl","frage":"Berechnen Sie den Jahresnettobeitrag der Glasversicherung für Frau Brandt (ohne Ratenzuschlag und Versicherungsteuer).","wert":30.0,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 46 m² × 0,50 € = 23,00 €; das liegt unter dem Mindestbeitrag, also 30,00 €. Keine Zuschläge (Ceranfeld ist eingeschlossen). Jahresnettobeitrag Glas: 30,00 € + 0,00 € = 30,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-1-1"},{"typ":"zahl","frage":"Wie hoch ist die monatliche Rate der Glasversicherung ohne Versicherungsteuer für Frau Brandt?","wert":2.63,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 46 m² × 0,50 € = 23,00 €; das liegt unter dem Mindestbeitrag, also 30,00 €. Keine Zuschläge (Ceranfeld ist eingeschlossen). Jahresnettobeitrag Glas: 30,00 € + 0,00 € = 30,00 €. Ratenzuschlag monatlich 5 %: 30,00 € × 5 % = 1,50 €. Jahresbeitrag mit Ratenzuschlag: 30,00 € + 1,50 € = 31,50 €. Monatliche Rate: 31,50 € ÷ 12 = 2,63 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-1-2"},{"typ":"zahl","frage":"Berechnen Sie für Frau Brandt den Jahresbruttobeitrag der Glasversicherung bei monatlicher Zahlung (einschließlich Ratenzuschlag und 19 % Versicherungsteuer).","wert":37.49,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 46 m² × 0,50 € = 23,00 €; das liegt unter dem Mindestbeitrag, also 30,00 €. Keine Zuschläge (Ceranfeld ist eingeschlossen). Jahresnettobeitrag Glas: 30,00 € + 0,00 € = 30,00 €. Ratenzuschlag monatlich 5 %: 30,00 € × 5 % = 1,50 €. Jahresbeitrag mit Ratenzuschlag: 30,00 € + 1,50 € = 31,50 €. Versicherungsteuer Glas: 31,50 € × 19 % = 5,99 €. Jahresbruttobeitrag: 31,50 € + 5,99 € = 37,49 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-1-3"},{"typ":"zahl","frage":"Wie hoch ist die monatliche Rate der Glasversicherung einschließlich Versicherungsteuer, die Frau Brandt zahlt?","wert":3.12,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 46 m² × 0,50 € = 23,00 €; das liegt unter dem Mindestbeitrag, also 30,00 €. Keine Zuschläge (Ceranfeld ist eingeschlossen). Jahresnettobeitrag Glas: 30,00 € + 0,00 € = 30,00 €. Ratenzuschlag monatlich 5 %: 30,00 € × 5 % = 1,50 €. Jahresbeitrag mit Ratenzuschlag: 30,00 € + 1,50 € = 31,50 €. Versicherungsteuer Glas: 31,50 € × 19 % = 5,99 €. Jahresbruttobeitrag: 31,50 € + 5,99 € = 37,49 €. Monatliche Rate mit Versicherungsteuer: 37,49 € ÷ 12 = 3,12 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-1-4"},{"typ":"mc","frage":"Frau Brandt fragt, ob ihr Ceranfeld in der Glasversicherung extra kostet. Was gilt nach dem Übungstarif?","optionen":["Es kostet pauschal 18 € im Jahr.","Es kostet 2,50 € je m² Glasfläche.","Es ist nur über Hausrat versichert.","Es ist ohne Zuschlag eingeschlossen."],"richtig":[3],"erkl":"Laut Tarif ist das Ceranfeld in der Wohnungsverglasung eingeschlossen; Zuschläge gibt es nur für Aquarium/Terrarium und Wintergarten. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-1-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Glas: Wohnungsverglasung","kopf":["Merkmal","Tarif"],"zeilen":[["Beitrag","0,50 € je m² Wohnfläche, Mindestbeitrag 30,00 € (Hausrat- und Gebäudeteil der Wohnung)"],["Ceranfeld","eingeschlossen, kein Zuschlag"],["Aquarium/Terrarium","Zuschlag pauschal 18,00 €"],["Wintergarten-Verglasung","Zuschlag 2,50 € je m² Glasfläche"]],"hinweis":"Der Mindestbeitrag gilt für den Wohnflächenbeitrag; Zuschläge kommen danach hinzu. Keine Nachlässe."},{"titel":"Zahlungsweise","kopf":["Zahlungsweise","Ratenzuschlag","Zahl der Raten"],"zeilen":[["jährlich","0 %","1"],["halbjährlich","3 %","2"],["vierteljährlich","5 %","4"],["monatlich (nur Lastschrift)","5 %","12"]],"hinweis":"Ratenzuschlag in % des Jahresnettobeitrags. Rate = (Jahresnettobeitrag + Ratenzuschlag) ÷ Zahl der Raten, auf Cent gerundet."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]},{"typ":"situation","titel":"Fall 2: Familie Weber – Glas mit Aquarium","situation":"Familie Weber (Versicherungsnehmerin: Corinna Weber) wohnt in einer 118 m² großen Eigentumswohnung in Magdeburg. Im Wohnzimmer steht ein 400-Liter-Aquarium. Frau Weber wünscht eine Glasversicherung für die Wohnungsverglasung einschließlich Aquarium und zahlt vierteljährlich. Beginn: 01.11.2026.","items":[{"typ":"zahl","frage":"Berechnen Sie für Frau Weber den Wohnflächenbeitrag der Glasversicherung (ohne Zuschläge).","wert":59.0,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 118 m² × 0,50 € = 59,00 € (über dem Mindestbeitrag von 30,00 €). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-2-1"},{"typ":"zahl","frage":"Berechnen Sie für Frau Weber den Jahresnettobeitrag der Glasversicherung einschließlich Aquarium-Zuschlag (ohne Ratenzuschlag und Versicherungsteuer).","wert":77.0,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 118 m² × 0,50 € = 59,00 € (über dem Mindestbeitrag von 30,00 €). Zuschläge: Aquarium/Terrarium pauschal 18,00 €. Jahresnettobeitrag Glas: 59,00 € + 18,00 € = 77,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-2-2"},{"typ":"zahl","frage":"Berechnen Sie für Frau Weber die Versicherungsteuer auf den Jahresbeitrag der Glasversicherung einschließlich Ratenzuschlag.","wert":15.36,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 118 m² × 0,50 € = 59,00 € (über dem Mindestbeitrag von 30,00 €). Zuschläge: Aquarium/Terrarium pauschal 18,00 €. Jahresnettobeitrag Glas: 59,00 € + 18,00 € = 77,00 €. Ratenzuschlag vierteljährlich 5 %: 77,00 € × 5 % = 3,85 €. Jahresbeitrag mit Ratenzuschlag: 77,00 € + 3,85 € = 80,85 €. Versicherungsteuer Glas: 80,85 € × 19 % = 15,36 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-2-3"},{"typ":"zahl","frage":"Wie hoch ist die vierteljährliche Rate der Glasversicherung einschließlich Versicherungsteuer, die Frau Weber zahlt?","wert":24.05,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 118 m² × 0,50 € = 59,00 € (über dem Mindestbeitrag von 30,00 €). Zuschläge: Aquarium/Terrarium pauschal 18,00 €. Jahresnettobeitrag Glas: 59,00 € + 18,00 € = 77,00 €. Ratenzuschlag vierteljährlich 5 %: 77,00 € × 5 % = 3,85 €. Jahresbeitrag mit Ratenzuschlag: 77,00 € + 3,85 € = 80,85 €. Versicherungsteuer Glas: 80,85 € × 19 % = 15,36 €. Jahresbruttobeitrag: 80,85 € + 15,36 € = 96,21 €. Vierteljährliche Rate mit Versicherungsteuer: 96,21 € ÷ 4 = 24,05 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-2-4"},{"typ":"wf","frage":"Welche Aussagen zur Glasversicherung von Frau Weber treffen nach dem Übungstarif zu?","aussagen":[["Für das Aquarium wird ein pauschaler Zuschlag von 18 € berechnet.",true],["Der Mindestbeitrag von 30 € spielt bei 118 m² keine Rolle.",true],["Für die Glasversicherung gilt ein wirksamer Steuersatz von 16,15 %.",false],["Bei vierteljährlicher Zahlung entfällt der Ratenzuschlag.",false]],"erkl":"Glas: 19 % Versicherungsteuer auf das volle Entgelt; vierteljährlich 5 % Ratenzuschlag; 118 m² × 0,50 € liegt über 30 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-2-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Glas: Wohnungsverglasung","kopf":["Merkmal","Tarif"],"zeilen":[["Beitrag","0,50 € je m² Wohnfläche, Mindestbeitrag 30,00 € (Hausrat- und Gebäudeteil der Wohnung)"],["Ceranfeld","eingeschlossen, kein Zuschlag"],["Aquarium/Terrarium","Zuschlag pauschal 18,00 €"],["Wintergarten-Verglasung","Zuschlag 2,50 € je m² Glasfläche"]],"hinweis":"Der Mindestbeitrag gilt für den Wohnflächenbeitrag; Zuschläge kommen danach hinzu. Keine Nachlässe."},{"titel":"Zahlungsweise","kopf":["Zahlungsweise","Ratenzuschlag","Zahl der Raten"],"zeilen":[["jährlich","0 %","1"],["halbjährlich","3 %","2"],["vierteljährlich","5 %","4"],["monatlich (nur Lastschrift)","5 %","12"]],"hinweis":"Ratenzuschlag in % des Jahresnettobeitrags. Rate = (Jahresnettobeitrag + Ratenzuschlag) ÷ Zahl der Raten, auf Cent gerundet."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]},{"typ":"situation","titel":"Fall 3: Herr Neumann – Wintergarten und Naturgefahren","situation":"Klaus Neumann besitzt ein Einfamilienhaus in Naumburg (Saale) mit 152 m² Wohnfläche und einem Wintergarten mit 22 m² Glasfläche. Die VS 1914 seiner Wohngebäudeversicherung beträgt laut Police 31.600 Mark; die Hausratversicherung läuft mit Unterversicherungsverzicht (Mindestsumme nach Tarif). Das Haus liegt in ZÜRS-Gefährdungsklasse 2. Herr Neumann möchte ab 01.01.2027 eine Glasversicherung (jährliche Zahlung) und in beiden Verträgen weitere Naturgefahren einschließen.","items":[{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann den Jahresnettobeitrag der Glasversicherung einschließlich Wintergarten-Zuschlag (ohne Versicherungsteuer).","wert":131.0,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 152 m² × 0,50 € = 76,00 € (über dem Mindestbeitrag von 30,00 €). Zuschläge: Wintergarten 22 m² × 2,50 € = 55,00 €. Jahresnettobeitrag Glas: 76,00 € + 55,00 € = 131,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung","id":"4.12-3-1"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann den Jahresbruttobeitrag der Glasversicherung einschließlich 19 % Versicherungsteuer (jährliche Zahlung).","wert":155.89,"einheit":"€","tol":0.01,"erkl":"Wohnungsverglasung: 152 m² × 0,50 € = 76,00 € (über dem Mindestbeitrag von 30,00 €). Zuschläge: Wintergarten 22 m² × 2,50 € = 55,00 €. Jahresnettobeitrag Glas: 76,00 € + 55,00 € = 131,00 €. Jährliche Zahlung: kein Ratenzuschlag (0,00 €). Versicherungsteuer Glas: 131,00 € × 19 % = 24,89 €. Jahresbruttobeitrag: 131,00 € + 24,89 € = 155,89 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; Glasversicherung; § 5, § 6 VersStG","id":"4.12-3-2"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann den Grundbeitrag 1914 (in Mark) für den Baustein weitere Naturgefahren in der Wohngebäudeversicherung.","wert":12.64,"einheit":"Mark","tol":0.01,"erkl":"Anteil weitere Naturgefahren Wohngebäude GK 2: 31.600 Mark × 0,40 ‰ = 12,64 Mark (Grundbeitrag 1914). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.12-3-3"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann den Jahresbeitrag in Euro für den Baustein weitere Naturgefahren in der Wohngebäudeversicherung (vor Nachlässen, ohne Versicherungsteuer).","wert":321.06,"einheit":"€","tol":0.01,"erkl":"Anteil weitere Naturgefahren Wohngebäude GK 2: 31.600 Mark × 0,40 ‰ = 12,64 Mark (Grundbeitrag 1914). Jahresbeitrag dafür: 12,64 Mark × 25,40 = 321,06 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.12-3-4"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann den Jahreszuschlag für weitere Naturgefahren in der Hausratversicherung (ohne Nachlässe und Versicherungsteuer).","wert":29.64,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 152 m² × 650 €/m² = 98.800,00 €. Zuschlag weitere Naturgefahren Hausrat GK 2: 98.800,00 € × 0,30 ‰ = 29,64 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.12-3-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Glas: Wohnungsverglasung","kopf":["Merkmal","Tarif"],"zeilen":[["Beitrag","0,50 € je m² Wohnfläche, Mindestbeitrag 30,00 € (Hausrat- und Gebäudeteil der Wohnung)"],["Ceranfeld","eingeschlossen, kein Zuschlag"],["Aquarium/Terrarium","Zuschlag pauschal 18,00 €"],["Wintergarten-Verglasung","Zuschlag 2,50 € je m² Glasfläche"]],"hinweis":"Der Mindestbeitrag gilt für den Wohnflächenbeitrag; Zuschläge kommen danach hinzu. Keine Nachlässe."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addieren und in einem Schritt anwenden (VS × Summe der Zuschlagssätze ÷ 1.000). Nachlässe addieren und in einem Schritt auf den Beitrag einschließlich Zuschlägen anwenden."},{"titel":"Wohngebäude: Beitragssätze in ‰ der VS 1914","kopf":["Gefahr","Zone 1","Zone 2","Zone 3","Zone 4"],"zeilen":[["Feuer","0,40","0,45","0,55","0,65"],["Leitungswasser","0,70","0,85","1,00","1,25"],["Sturm/Hagel","0,20","0,30","0,45","0,65"],["Weitere Naturgefahren (ZÜRS, unabhängig von der Zone)","GK 1: 0,15","GK 2: 0,40","GK 3: 1,20","GK 4: auf Anfrage"]],"hinweis":"Grundbeitrag 1914 = Summe der Beitragssätze × VS 1914 ÷ 1.000 (in Mark, auf Cent runden). Jahresbeitrag = Grundbeitrag 1914 × gleitender Neuwertfaktor 25,40. Nachlässe (addiert, in % des Jahresbeitrags): Neubau (Gebäudealter bis 10 Jahre, gerechnet ab Baujahr bis Beginnjahr) 15 % · Selbstbeteiligung 500 € 15 % · Dauernachlass 3 Jahre 10 %."}]},{"typ":"situation","titel":"Fall 4: Frau Schmidt – welche Zahlungsweise lohnt sich?","situation":"Julia Schmidt (31) hat ein Hausratangebot der Proximus Versicherung AG vorliegen: Jahresnettobeitrag nach allen Zuschlägen und Nachlässen 214,70 € (ohne Ratenzuschlag und Versicherungsteuer). Sie überlegt, halbjährlich, vierteljährlich oder monatlich zu zahlen, und bittet um einen Vergleich.","items":[{"typ":"zahl","frage":"Wie hoch wäre die halbjährliche Rate ohne Versicherungsteuer für Frau Schmidt?","wert":110.57,"einheit":"€","tol":0.01,"erkl":"Ratenzuschlag halbjährlich 3 %: 214,70 € × 3 % = 6,44 €. Jahresbeitrag halbjährlich: 214,70 € + 6,44 € = 221,14 €. Halbjährliche Rate: 221,14 € ÷ 2 = 110,57 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Zahlungsweise","id":"4.12-4-1"},{"typ":"zahl","frage":"Wie hoch wäre die vierteljährliche Rate ohne Versicherungsteuer für Frau Schmidt?","wert":56.36,"einheit":"€","tol":0.01,"erkl":"Ratenzuschlag vierteljährlich 5 %: 214,70 € × 5 % = 10,74 €. Jahresbeitrag vierteljährlich: 214,70 € + 10,74 € = 225,44 €. Vierteljährliche Rate: 225,44 € ÷ 4 = 56,36 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Zahlungsweise","id":"4.12-4-2"},{"typ":"zahl","frage":"Wie hoch wäre die monatliche Rate ohne Versicherungsteuer für Frau Schmidt?","wert":18.79,"einheit":"€","tol":0.01,"erkl":"Ratenzuschlag monatlich 5 %: 214,70 € × 5 % = 10,74 €. Jahresbeitrag monatlich: 214,70 € + 10,74 € = 225,44 €. Monatliche Rate: 225,44 € ÷ 12 = 18,79 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Zahlungsweise","id":"4.12-4-3"},{"typ":"zahl","frage":"Um wie viel Euro ist der Jahresbeitrag von Frau Schmidt bei monatlicher Zahlung höher als bei jährlicher Zahlung (Ratenzuschlag, ohne Versicherungsteuer)?","wert":10.74,"einheit":"€","tol":0.01,"erkl":"Ratenzuschlag monatlich 5 %: 214,70 € × 5 % = 10,74 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Zahlungsweise","id":"4.12-4-4"},{"typ":"zahl","frage":"Wie hoch wäre die monatliche Rate von Frau Schmidt einschließlich Versicherungsteuer (Hausrat 16,15 %)?","wert":21.82,"einheit":"€","tol":0.01,"erkl":"Ratenzuschlag monatlich 5 %: 214,70 € × 5 % = 10,74 €. Jahresbeitrag monatlich: 214,70 € + 10,74 € = 225,44 €. Versicherungsteuer Hausrat: 225,44 € × 16,15 % = 36,41 €. Jahresbruttobeitrag: 225,44 € + 36,41 € = 261,85 €. Monatliche Rate mit Versicherungsteuer: 261,85 € ÷ 12 = 21,82 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 5, § 6 VersStG","id":"4.12-4-5"},{"typ":"mc","frage":"Frau Schmidt möchte monatlich per Überweisung zahlen. Was gilt nach dem Übungstarif?","optionen":["Monatlich kostet per Überweisung 3 % mehr.","Monatlich ist nur ab 500 € Beitrag möglich.","Monatlich ist nur per Lastschrift möglich.","Monatlich ist ohne Ratenzuschlag möglich."],"richtig":[2],"erkl":"Laut Tarif: monatliche Zahlung nur per Lastschrift, Ratenzuschlag 5 %. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Zahlungsweise","id":"4.12-4-6"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Zahlungsweise","kopf":["Zahlungsweise","Ratenzuschlag","Zahl der Raten"],"zeilen":[["jährlich","0 %","1"],["halbjährlich","3 %","2"],["vierteljährlich","5 %","4"],["monatlich (nur Lastschrift)","5 %","12"]],"hinweis":"Ratenzuschlag in % des Jahresnettobeitrags. Rate = (Jahresnettobeitrag + Ratenzuschlag) ÷ Zahl der Raten, auf Cent gerundet."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]},{"typ":"situation","titel":"Fall 5: Familie Fischer – Haus an der Saale","situation":"Familie Fischer (Versicherungsnehmer: Ralf Fischer) wohnt im eigenen Haus in Halle (Saale) direkt an der Saale; ZÜRS-Gefährdungsklasse 3. Die Hausratversicherung (120 m² Wohnfläche) läuft mit der Mindestsumme für den Unterversicherungsverzicht, die Wohngebäudeversicherung mit einer VS 1914 von 26.300 Mark. Herr Fischer möchte ab 01.04.2027 in beiden Verträgen weitere Naturgefahren einschließen; beide Verträge werden jährlich gezahlt, Nachlässe bestehen nicht. Sein Nachbar, dessen Grundstück in Gefährdungsklasse 4 liegt, fragt ebenfalls an.","items":[{"typ":"zahl","frage":"Berechnen Sie für Herrn Fischer den Jahreszuschlag für weitere Naturgefahren in der Hausratversicherung (ohne Versicherungsteuer).","wert":70.2,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 120 m² × 650 €/m² = 78.000,00 €. Zuschlag weitere Naturgefahren Hausrat GK 3: 78.000,00 € × 0,90 ‰ = 70,20 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.12-5-1"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Fischer den Grundbeitrag 1914 (in Mark) für weitere Naturgefahren in der Wohngebäudeversicherung.","wert":31.56,"einheit":"Mark","tol":0.01,"erkl":"Anteil weitere Naturgefahren Wohngebäude GK 3: 26.300 Mark × 1,20 ‰ = 31,56 Mark (Grundbeitrag 1914). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.12-5-2"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Fischer den Jahresbeitrag in Euro für weitere Naturgefahren in der Wohngebäudeversicherung (ohne Versicherungsteuer).","wert":801.62,"einheit":"€","tol":0.01,"erkl":"Anteil weitere Naturgefahren Wohngebäude GK 3: 26.300 Mark × 1,20 ‰ = 31,56 Mark (Grundbeitrag 1914). Jahresbeitrag dafür: 31,56 Mark × 25,40 = 801,62 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.12-5-3"},{"typ":"zahl","frage":"Wie viel zahlt Herr Fischer für weitere Naturgefahren in beiden Verträgen zusammen im Jahr einschließlich Versicherungsteuer (Hausrat 16,15 %, Wohngebäude 16,34 %)?","wert":1014.14,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 120 m² × 650 €/m² = 78.000,00 €. Zuschlag weitere Naturgefahren Hausrat GK 3: 78.000,00 € × 0,90 ‰ = 70,20 €. Mit Versicherungsteuer Hausrat: 70,20 € + 70,20 € × 16,15 % (11,34 €) = 81,54 €. Anteil weitere Naturgefahren Wohngebäude GK 3: 26.300 Mark × 1,20 ‰ = 31,56 Mark (Grundbeitrag 1914). Jahresbeitrag dafür: 31,56 Mark × 25,40 = 801,62 €. Mit Versicherungsteuer Wohngebäude: 801,62 € + 801,62 € × 16,34 % (130,98 €) = 932,60 €. Zusammen: 81,54 € + 932,60 € = 1.014,14 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 5, § 6 VersStG","id":"4.12-5-4"},{"typ":"mc","frage":"Was antworten Sie dem Nachbarn von Herrn Fischer (ZÜRS-Gefährdungsklasse 4)?","optionen":["Er zahlt 1,20 ‰ wie in Gefährdungsklasse 3.","Der Baustein ist ohne Zuschlag eingeschlossen.","Er zahlt den doppelten Satz der Klasse 3.","Der Baustein ist nur auf Anfrage möglich."],"richtig":[3],"erkl":"Laut Übungstarif ist GK 4 in Hausrat und Wohngebäude nur auf Anfrage versicherbar (individuelle Risikoprüfung). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, VGB, Naturgefahren","id":"4.12-5-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addieren und in einem Schritt anwenden (VS × Summe der Zuschlagssätze ÷ 1.000). Nachlässe addieren und in einem Schritt auf den Beitrag einschließlich Zuschlägen anwenden."},{"titel":"Wohngebäude: Beitragssätze in ‰ der VS 1914","kopf":["Gefahr","Zone 1","Zone 2","Zone 3","Zone 4"],"zeilen":[["Feuer","0,40","0,45","0,55","0,65"],["Leitungswasser","0,70","0,85","1,00","1,25"],["Sturm/Hagel","0,20","0,30","0,45","0,65"],["Weitere Naturgefahren (ZÜRS, unabhängig von der Zone)","GK 1: 0,15","GK 2: 0,40","GK 3: 1,20","GK 4: auf Anfrage"]],"hinweis":"Grundbeitrag 1914 = Summe der Beitragssätze × VS 1914 ÷ 1.000 (in Mark, auf Cent runden). Jahresbeitrag = Grundbeitrag 1914 × gleitender Neuwertfaktor 25,40. Nachlässe (addiert, in % des Jahresbeitrags): Neubau (Gebäudealter bis 10 Jahre, gerechnet ab Baujahr bis Beginnjahr) 15 % · Selbstbeteiligung 500 € 15 % · Dauernachlass 3 Jahre 10 %."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]}]},{"nr":"4.13","titel":"Rechenwerkstatt: Nach- und Rückbeitrag","lf":"LF 4","buch":"S. 211–226","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Albrecht – Umzug in eine größere Wohnung","situation":"Clara Albrecht hat ihre Hausratversicherung mit Versicherungsjahr 01.01. bis 31.12. und jährlicher Zahlung. Bisher: 58 m² in 06110 Halle (Saale), Mindestsumme mit Unterversicherungsverzicht, Fahrraddiebstahl, Selbstbeteiligung 150 €. Am 12.08.2026 zieht sie in eine 84 m² große Wohnung in 06114 Halle (Saale); die VS wird auf die neue Mindestsumme angepasst, alle übrigen Vereinbarungen bleiben.","items":[{"typ":"zahl","frage":"Wie hoch war der bisherige Jahresnettobeitrag der Hausratversicherung von Frau Albrecht (58-m²-Wohnung)?","wert":84.82,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 58 m² × 650 €/m² = 37.700,00 €. PLZ 06110 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 37.700,00 € × 2,10 ‰ = 79,17 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 37.700,00 € × 0,40 ‰ = 15,08 €. Beitrag einschließlich Zuschlägen: 79,17 € + 15,08 € = 94,25 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 94,25 € × 10 % = 9,43 €. Jahresnettobeitrag: 94,25 € − 9,43 € = 84,82 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.13-1-1"},{"typ":"zahl","frage":"Wie hoch ist der neue Jahresnettobeitrag der Hausratversicherung von Frau Albrecht für die 84-m²-Wohnung?","wert":122.85,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 84 m² × 650 €/m² = 54.600,00 €. PLZ 06114 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 54.600,00 € × 2,10 ‰ = 114,66 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 54.600,00 € × 0,40 ‰ = 21,84 €. Beitrag einschließlich Zuschlägen: 114,66 € + 21,84 € = 136,50 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 136,50 € × 10 % = 13,65 €. Jahresnettobeitrag: 136,50 € − 13,65 € = 122,85 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.13-1-2"},{"typ":"zahl","frage":"Für wie viele Monate des laufenden Versicherungsjahres wird bei Frau Albrecht der Unterschiedsbetrag berechnet?","wert":5.0,"einheit":"Monate","tol":0,"erkl":"Versicherungsjahr 01.01.2026 bis 31.12.2026; Ereignis am 12.08.2026 → neuer Beitrag ab 01.08.2026; Restmonate bis Ende des Versicherungsjahres: 5 Monate. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Wohnungswechsel","id":"4.13-1-3"},{"typ":"zahl","frage":"Berechnen Sie den Nachbeitrag (ohne Versicherungsteuer), den Frau Albrecht für das laufende Versicherungsjahr zahlen muss.","wert":15.85,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 58 m² × 650 €/m² = 37.700,00 €. PLZ 06110 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 37.700,00 € × 2,10 ‰ = 79,17 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 37.700,00 € × 0,40 ‰ = 15,08 €. Beitrag einschließlich Zuschlägen: 79,17 € + 15,08 € = 94,25 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 94,25 € × 10 % = 9,43 €. Jahresnettobeitrag: 94,25 € − 9,43 € = 84,82 €. Mindest-VS mit Unterversicherungsverzicht: 84 m² × 650 €/m² = 54.600,00 €. PLZ 06114 → Tarifzone 3, Beitragssatz 2,10 ‰; Grundbeitrag = 54.600,00 € × 2,10 ‰ = 114,66 €. Zuschlagssätze: Fahrraddiebstahl 0,40 ‰; Zuschläge = 54.600,00 € × 0,40 ‰ = 21,84 €. Beitrag einschließlich Zuschlägen: 114,66 € + 21,84 € = 136,50 €. Nachlässe: Selbstbeteiligung 150 € 10 %; Nachlass = 136,50 € × 10 % = 13,65 €. Jahresnettobeitrag: 136,50 € − 13,65 € = 122,85 €. Unterschied der Jahresnettobeiträge: 122,85 € − 84,82 € = 38,03 €. Versicherungsjahr 01.01.2026 bis 31.12.2026; Ereignis am 12.08.2026 → neuer Beitrag ab 01.08.2026; Restmonate bis Ende des Versicherungsjahres: 5 Monate. Nachbeitrag = 38,03 € × 5 ÷ 12 = 15,85 €, also Nachbeitrag von 15,85 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Wohnungswechsel","id":"4.13-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Vertragsanpassung bei Frau Albrecht treffen zu?","aussagen":[["Der neue Beitrag gilt laut Tarif ab dem 01.08.2026.",true],["Frau Albrecht erhält wegen des Umzugs einen Rückbeitrag.",false],["Damit der Verzicht weiter gilt, muss die VS mindestens 84 m² × 650 € betragen.",true],["Der Unterschiedsbetrag wird für volle 12 Monate berechnet.",false]],"erkl":"Änderung ab dem 1. des Umzugsmonats, Restmonate August bis Dezember = 5; der Beitrag steigt, also Nachbeitrag. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Wohnungswechsel","id":"4.13-1-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Nach- und Rückbeitrag","kopf":["Anlass","Regel"],"zeilen":[["Vertragsänderung (Umzug, Anbau, Wegfall eines Bausteins)","neuer Beitrag ab dem 1. des Monats, in den das Ereignis fällt"],["Vertragsende nach Veräußerung","Beitrag nur bis zum Vertragsende (§ 39 Abs. 1 VVG); Rückbeitrag für die vollen Monate danach bis Ende des Versicherungsjahres"],["Berechnung","(neuer − alter Jahresnettobeitrag) × Restmonate bis Ende des Versicherungsjahres ÷ 12"],["Vorzeichen","Ergebnis positiv = Nachbeitrag, negativ = Rückbeitrag; bei Vertragsende ist der neue Beitrag 0,00 €. Antwort: Betrag ohne Vorzeichen"]],"hinweis":"Grundlage ist der Jahresnettobeitrag (ohne Ratenzuschlag und Versicherungsteuer)."},{"titel":"Tarifzonen nach Postleitzahl
