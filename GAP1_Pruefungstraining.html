ar nicht, weil der Vermerk im Antrag die AVB insgesamt unwirksam macht.","Bis 1.500,00 €, weil sich AVB und Vermerk zur Hälfte gegenseitig ausgleichen."],"richtig":[0],"erkl":"Individuelle Vertragsabreden haben Vorrang vor AGB. Nach der Klausel wären es nur 1 % von 55.000,00 € (50.000,00 € zuzüglich 10 % Vorsorge) = 550,00 €; vereinbart sind aber 3.000,00 €, der Schaden von 2.400,00 € ist damit voll gedeckt.","norm":"§ 305b BGB; Proximus 5, Klausel PK 7110 Ziff. 2, VHB 2021 Ziff. 17.2","id":"3.4-3-2"},{"typ":"zuo","frage":"Ordnen Sie der Klausel bzw. dem Vorgang die richtige Rechtsfolge zu.","paare":[["Klausel: „Kündigungen sind nur per Einschreiben wirksam.“","unwirksam: Für Erklärungen des Kunden dürfen höchstens Textform und keine besonderen Zugangswege verlangt werden"],["Unklar formulierte Klausel: Es bleibt offen, ob eine Smartwatch als „Wertsache“ gilt.","Zweifel bei der Auslegung gehen zulasten des Versicherers"],["Unter „Begriffsbestimmungen“ versteckt: Pflicht zum jährlichen Kauf eines Gutachtens bei einer bestimmten Firma","wird als überraschende Klausel nicht Vertragsbestandteil"],["AVB, auf die bei Vertragsschluss weder hingewiesen noch deren Kenntnisnahme ermöglicht wurde","werden mangels Einbeziehung nicht Vertragsbestandteil"]],"erkl":"Das AGB-Recht schützt den Vertragspartner des Verwenders bei Einbeziehung, Auslegung und Inhalt der Klauseln.","norm":"§§ 305 Abs. 2, 305c Abs. 1 und 2, 309 Nr. 13 Buchst. b und c BGB","id":"3.4-3-3"},{"typ":"mc","frage":"Die Einschreiben-Klausel des anderen Anbieters ist unwirksam. Was bedeutet das für den betroffenen Versicherungsvertrag?","optionen":["Der Vertrag bleibt wirksam; statt der Klausel gelten die gesetzlichen Vorschriften.","Der gesamte Versicherungsvertrag ist unwirksam und muss rückabgewickelt werden.","Die Klausel wird so umgedeutet, dass nur noch der Versicherer per Einschreiben kündigen muss.","Die Klausel gilt weiter, bis ein Gericht ihre Unwirksamkeit festgestellt hat."],"richtig":[0],"erkl":"Ist eine AGB-Klausel unwirksam, bleibt der Vertrag im Übrigen wirksam; an ihre Stelle tritt das Gesetz. Eine Kündigung muss dann nicht per Einschreiben erklärt werden.","norm":"§ 306 Abs. 1 und 2 BGB","id":"3.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Adeyemi – Minderjährige als Kunden","situation":"Familie Adeyemi aus Halle (Saale) hat drei Kinder: Noah (6), Lina (15) und Ben (17). Ben ist Auszubildender, seine Ausbildungsvergütung steht ihm zur freien Verfügung. Ohne Wissen seiner Eltern schließt Ben bei der Proximus Versicherung AG eine Unfallversicherung mit monatlicher Prämienzahlung per Lastschrift ab. Als der Versicherer von seinem Alter erfährt, fordert er die Eltern zur Genehmigung auf; das Schreiben geht ihnen am Dienstag, 3. November 2026, zu. Ben wird am 1. Dezember 2026 volljährig.","items":[{"typ":"zuo","frage":"Ordnen Sie der Person die richtige Einordnung zu.","paare":[["Noah, 6 Jahre","geschäftsunfähig – seine Willenserklärung ist nichtig"],["Lina, 15 Jahre","beschränkt geschäftsfähig – ein Vertrag mit Beitragspflicht braucht die Zustimmung der Eltern"],["Ben ab dem 1. Dezember 2026","voll geschäftsfähig – er kann Verträge allein schließen"]],"erkl":"Geschäftsunfähig ist, wer das siebte Lebensjahr nicht vollendet hat; bis 17 Jahre ist man beschränkt geschäftsfähig, mit 18 volljährig. Ein Versicherungsvertrag bringt wegen der Beitragspflicht nicht lediglich einen rechtlichen Vorteil.","norm":"§§ 2, 104 Nr. 1, 105, 106, 107 BGB","id":"3.4-4-1"},{"typ":"mc","frage":"Ben hat die ersten zwei Monatsbeiträge von seiner Ausbildungsvergütung bezahlt. Ist der Vertrag dadurch nach § 110 BGB wirksam geworden?","optionen":["Nein, die künftigen Beiträge sind noch nicht bewirkt; der Vertrag bleibt schwebend unwirksam.","Ja, weil jede Zahlung aus frei verfügbaren Mitteln den gesamten Vertrag sofort voll wirksam macht.","Ja, weil Auszubildende für alle Verträge, die sie von ihrer Vergütung zahlen, voll geschäftsfähig sind.","Nein, der Vertrag ist von Anfang an nichtig und kann auch später nicht mehr genehmigt werden."],"richtig":[0],"erkl":"Der „Taschengeldparagraf“ setzt voraus, dass die vertragsmäßige Leistung vollständig bewirkt ist. Bei laufenden Beiträgen ist das nicht der Fall. § 113 BGB hilft nicht: Er erfasst nur Geschäfte, die das Dienst- oder Arbeitsverhältnis selbst betreffen (auf Ausbildungsverhältnisse ist er nach h. M. ohnehin nicht anwendbar), keine private Versicherung.","norm":"§§ 108 Abs. 1, 110, 113 Abs. 1 BGB","id":"3.4-4-2"},{"typ":"mc","frage":"Bis wann können die Eltern den Vertrag nach der Aufforderung des Versicherers genehmigen?","optionen":["Bis zum Ablauf des 17. November 2026; danach gilt die Genehmigung als verweigert.","Bis zum Ablauf des 3. Dezember 2026; danach gilt die Genehmigung als stillschweigend erteilt.","Bis zum Ablauf des 10. November 2026; danach gilt die Genehmigung als verweigert.","Unbefristet, solange Ben noch minderjährig ist und den Beitrag weiter zahlt."],"richtig":[0],"erkl":"Nach der Aufforderung kann die Genehmigung nur bis zum Ablauf von zwei Wochen nach Empfang erklärt werden; Schweigen gilt als Verweigerung. Zugang Dienstag, 3.11.2026 → Fristende Dienstag, 17.11.2026.","norm":"§ 108 Abs. 2 BGB, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.4-4-3"},{"typ":"wf","frage":"Welche Aussagen zu Bens Vertrag treffen zu?","aussagen":[["Hatten die Eltern die Genehmigung vor der Aufforderung nur gegenüber Ben erklärt, wird diese durch die Aufforderung unwirksam; sie müssen sie gegenüber dem Versicherer erklären.",true],["Ist die Schwebezeit am 1. Dezember 2026 noch nicht beendet, kann Ben den Vertrag ab diesem Tag selbst genehmigen.",true],["Der Versicherer kann bis zur Genehmigung widerrufen, auch wenn er bei Vertragsschluss wusste, dass Ben minderjährig ist und keine Einwilligung hat.",false],["Kündigt Ben mit 17 ohne Einwilligung der Eltern eine bestehende, wirksame Versicherung, ist die Kündigung unwirksam.",true]],"erkl":"Die Aufforderung lenkt die Genehmigung auf den Versicherer um. Mit Volljährigkeit tritt Bens Genehmigung an die Stelle der Eltern. Wer die Minderjährigkeit kannte, kann nicht widerrufen (Ausnahme: falsche Behauptung der Einwilligung). Eine Kündigung ist ein einseitiges Rechtsgeschäft und ohne Einwilligung unwirksam.","norm":"§§ 108 Abs. 2 und 3, 109, 111 BGB","id":"3.4-4-4"}]}]},{"nr":"3.5","titel":"Prüfungsfälle: Zustandekommen und Beginn des Vertrags","lf":"LF 2","buch":"S. 73–89","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Herr Petrović – Antrag mit Bindefrist","situation":"Herr Jonas Petrović (31) hat die Bedingungen und Verbraucherinformationen in Textform erhalten. Am Montag, 2. November 2026, unterschreibt er in der Agentur einen Antrag auf Hausratversicherung bei der Proximus Versicherung AG. Laut Antrag hält er sich einen Monat ab Unterschrift an seinen Antrag gebunden. Die Proximus will den Antrag durch Übersendung des Versicherungsscheins annehmen.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Vorgang die rechtliche Bedeutung zu.","paare":[["Antrag von Herrn Petrović","Angebot (Antrag) im Sinne des BGB"],["Zugang des Versicherungsscheins bei Herrn Petrović","Annahme – der Vertrag kommt zustande"],["Ein Monat Bindung laut Antrag","Frist, innerhalb der der Antrag angenommen werden kann"],["Übermittlung von AVB und Informationen vor der Unterschrift","Erfüllung der Informationspflicht des Versicherers"]],"erkl":"Beim Antragsmodell macht der Kunde das Angebot, der Versicherer nimmt es mit dem Versicherungsschein an. Die Informationen müssen rechtzeitig vor der Vertragserklärung des Kunden in Textform vorliegen.","norm":"§§ 145, 148 BGB, § 7 Abs. 1 VVG","id":"3.5-1-1"},{"typ":"mc","frage":"Bis wann muss der Versicherungsschein Herrn Petrović spätestens zugehen, damit der Vertrag durch diese Annahme zustande kommt?","optionen":["Bis zum Ablauf des 2. Dezember 2026.","Bis zum Ablauf des 16. November 2026.","Bis zum Ablauf des 30. November 2026.","Bis zum Ablauf des 2. Februar 2027."],"richtig":[0],"erkl":"Eine nach Monaten bestimmte Frist, die mit einem Ereignis beginnt (Unterschrift am 2.11.), endet mit Ablauf des Tages im Folgemonat mit derselben Zahl: 2.12.2026 (Mittwoch). Die Annahme muss innerhalb der Frist zugehen.","norm":"§ 148 BGB, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-1-2"},{"typ":"mc","frage":"Der Versicherungsschein geht Herrn Petrović erst am 7. Dezember 2026 zu. Was gilt?","optionen":["Die verspätete Annahme gilt als neuer Antrag des Versicherers, den Herr Petrović annehmen kann.","Der Vertrag ist trotzdem am 2. November 2026 zustande gekommen, weil er unterschrieben hat.","Der Vertrag kommt automatisch zustande, weil Herr Petrović nicht widersprochen hat.","Der Vertrag ist endgültig nichtig; ein Vertragsschluss ist nur mit neuem Antragsformular möglich."],"richtig":[0],"erkl":"Nach Ablauf der Bindefrist ist der Antrag erloschen. Die verspätete Annahme ist ein neues Angebot des Versicherers; Herr Petrović kann es ausdrücklich oder schlüssig (z. B. durch Zahlung der Erstprämie) annehmen.","norm":"§§ 146, 148, 150 Abs. 1 BGB","id":"3.5-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Zustandekommen von Versicherungsverträgen treffen zu?","aussagen":[["Beim Invitatiomodell fordert der Kunde den Versicherer nur auf, ihm ein Angebot zu machen.",true],["Beim Invitatiomodell kommt der Vertrag zustande, wenn die Annahmeerklärung des Kunden dem Versicherer zugeht.",true],["Beim Antragsmodell kommt der Vertrag bereits mit der Unterschrift des Kunden unter den Antrag zustande.",false],["Schweigt der Versicherer auf den Antrag, gilt der Vertrag nach Ablauf der Bindefrist als geschlossen.",false]],"erkl":"Ein Vertrag braucht zwei übereinstimmende, zugegangene Willenserklärungen. Schweigen ist grundsätzlich keine Annahme.","norm":"§§ 145 ff. BGB, § 7 Abs. 1 VVG","id":"3.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Frau Krasniqi – Versicherungsschein weicht vom Antrag ab","situation":"Frau Leonora Krasniqi (36) hat bei der Proximus Versicherung AG eine Privathaftpflichtversicherung mit 15 Mio. € Versicherungssumme (Tarif Alternative A) ohne Selbstbehalt beantragt. Der Versicherungsschein geht ihr am Montag, 16. November 2026, zu. Er weist die Tarifvariante mit 150,00 € Selbstbehalt je Versicherungsfall aus. Der Versicherer hat bei der Übermittlung auf die Genehmigungswirkung hingewiesen und die Abweichung im Versicherungsschein durch einen auffälligen Hinweis hervorgehoben.","items":[{"typ":"mc","frage":"Bis wann muss Frau Krasniqi spätestens widersprechen, damit die Abweichung nicht als genehmigt gilt?","optionen":["Innerhalb eines Monats nach Zugang, also bis zum 16. Dezember 2026.","Innerhalb von 14 Tagen nach Zugang, also bis zum 30. November 2026.","Innerhalb von drei Monaten nach Zugang, also bis zum 16. Februar 2027.","Innerhalb eines Jahres nach Zugang, also bis zum 16. November 2027."],"richtig":[0],"erkl":"Die Abweichung gilt als genehmigt, wenn die Kundin nicht innerhalb eines Monats nach Zugang des Versicherungsscheins in Textform widerspricht. Zugang 16.11.2026 → Fristende 16.12.2026.","norm":"§ 5 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-2-1"},{"typ":"mc","frage":"In welcher Form muss Frau Krasniqi widersprechen?","optionen":["In Textform, z. B. per E-Mail mit ihrem Namen.","Schriftlich mit eigenhändiger Unterschrift auf Papier.","Nur per Einschreiben mit Rückschein an den Versicherer.","Formlos, ein kurzer Anruf in der Agentur genügt."],"richtig":[0],"erkl":"Das Gesetz verlangt Textform: eine lesbare Erklärung mit Namen des Erklärenden auf einem dauerhaften Datenträger, z. B. E-Mail oder Brief.","norm":"§ 5 Abs. 1 VVG, § 126b BGB","id":"3.5-2-2"},{"typ":"zuo","frage":"Ordnen Sie der Fallvariante die Rechtsfolge zu.","paare":[["Hinweise ordnungsgemäß, kein Widerspruch innerhalb der Frist","Der Vertrag gilt mit der Selbstbeteiligung (Abweichung genehmigt)."],["Hinweise ordnungsgemäß, Widerspruch rechtzeitig in Textform","Ein Vertrag mit der abweichenden Selbstbeteiligung kommt nicht zustande."],["Auffälliger Hinweis auf die Abweichung fehlt","Der Vertrag gilt als mit dem Inhalt des Antrags geschlossen (ohne Selbstbeteiligung)."]],"erkl":"Nur wenn der Versicherer beide Hinweispflichten erfüllt, kann Schweigen zur Genehmigung führen; sonst gilt der Inhalt des Antrags.","norm":"§ 5 Abs. 1 bis 3 VVG","id":"3.5-2-3"},{"typ":"wf","frage":"Welche Aussagen zum abweichenden Versicherungsschein treffen zu?","aussagen":[["Der Versicherer muss auf jede einzelne Abweichung und ihre Rechtsfolgen durch einen auffälligen Hinweis im Versicherungsschein aufmerksam machen.",true],["Eine Vereinbarung, mit der Frau Krasniqi auf die Anfechtung wegen Irrtums verzichtet, ist unwirksam.",true],["Ein allgemeiner Satz in den AVB „Abweichungen gelten als genehmigt“ genügt als Hinweis.",false],["Die Monatsfrist beginnt bereits mit dem Datum, an dem der Versicherer den Schein ausgestellt hat.",false]],"erkl":"Die Frist läuft ab Zugang des Versicherungsscheins. Die Hinweise müssen bei Übermittlung erfolgen und die konkrete Abweichung hervorheben.","norm":"§ 5 Abs. 1, 2 und 4 VVG","id":"3.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Engel – Rückwärtsversicherung und Rückdatierung","situation":"Herr Tobias Engel hat sein neu gebautes Einfamilienhaus in Halle (Saale) am 1. Oktober 2026 übernommen. Erst am 20. Oktober 2026 beantragt er bei der Proximus Versicherung AG eine Wohngebäudeversicherung mit Versicherungsschutz und Beitragsberechnung ab dem 1. Oktober 2026. Der Versicherungsschein geht ihm am 30. Oktober 2026 zu; die Erstprämie zahlt er am 12. November 2026. Am 5. November entdeckt er einen Leitungswasserschaden, der am 14. Oktober entstanden ist. Seine Frau Miriam (geboren am 12. Oktober 1981) beantragt am 18. Januar 2027 bei der Proximus Lebensversicherung AG eine Risikolebensversicherung mit Beginn 1. Februar 2027; auf ihren Wunsch wird der Vertrag auf den 1. Dezember 2026 rückdatiert. Laut Tarif gilt: Eintrittsalter = Beginn minus Geburtsjahr.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Zeitpunkt aus dem Wohngebäudevertrag den passenden Begriff zu.","paare":[["30. Oktober 2026 – Zugang des Versicherungsscheins","formeller Beginn (Vertragsschluss)"],["1. Oktober 2026 – ab hier besteht Versicherungsschutz","materieller Beginn"],["1. Oktober 2026 – ab hier wird der Beitrag berechnet","technischer Beginn"],["12. November 2026 – Zahlung der Erstprämie","Einlösung des Versicherungsscheins"]],"erkl":"Bei einer Rückwärtsversicherung liegen materieller und technischer Beginn vor dem formellen Beginn.","norm":"§ 2 Abs. 1 VVG, § 37 VVG","id":"3.5-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Wohngebäudevertrag von Herrn Engel treffen zu?","aussagen":[["Der Leitungswasserschaden vom 14. Oktober ist versichert, weil Herr Engel ihn bei seinem Antrag am 20. Oktober nicht kannte.",true],["Hätte Herr Engel am 20. Oktober bereits von dem Schaden gewusst, müsste der Versicherer dafür nicht leisten.",true],["Weil die Erstprämie erst am 12. November gezahlt wurde, ist der Versicherer für den Schaden vom 14. Oktober leistungsfrei.",false],["Eine Rückwärtsversicherung ist nach dem VVG unzulässig, weil der Schutz nicht vor Vertragsschluss beginnen darf.",false]],"erkl":"Die Rückwärtsversicherung ist ausdrücklich erlaubt. Leistungsfrei ist der Versicherer nur, wenn der Kunde bei Abgabe seiner Vertragserklärung den eingetretenen Versicherungsfall kannte. Die Leistungsfreiheit wegen nicht gezahlter Erstprämie gilt hier nicht; zudem war die Erstprämie erst nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins fällig, die Zahlung am 12. November also rechtzeitig.","norm":"§ 2 Abs. 1, 2 und 4 VVG; Proximus 5, VGB 2021 Ziff. 27.1 und 27.2.1","id":"3.5-3-2"},{"typ":"mc","frage":"Angenommen, Frau Engel hat den Wohngebäudeantrag als bevollmächtigte Vertreterin ihres Mannes unterschrieben und wusste vom Schaden, er nicht. Was gilt?","optionen":["Der Versicherer muss nicht leisten, weil auch die Kenntnis der Vertreterin zählt.","Der Versicherer muss leisten, weil es nur auf das Wissen des Versicherungsnehmers ankommt.","Der Versicherer muss die Hälfte leisten, weil nur einer der Ehegatten Kenntnis hatte.","Der Vertrag ist nichtig, weil eine Vertreterin keine Rückwärtsversicherung beantragen darf."],"richtig":[0],"erkl":"Wird der Vertrag von einem Vertreter geschlossen, sind sowohl die Kenntnis des Vertreters als auch die des Vertretenen zu berücksichtigen.","norm":"§ 2 Abs. 2 Satz 2 und Abs. 3 VVG","id":"3.5-3-3"},{"typ":"mc","frage":"Was bewirkt die Rückdatierung der Risikolebensversicherung von Frau Engel auf den 1. Dezember 2026?","optionen":["Der technische Beginn liegt im Jahr 2026: Eintrittsalter 45 statt 46, Beiträge ab Dezember 2026.","Der formelle Beginn wird vorverlegt: Der Vertrag gilt als am 1. Dezember 2026 geschlossen.","Der Beitrag wird nach Alter 46 berechnet, muss aber erst ab Februar 2027 gezahlt werden.","Die Widerrufsfrist beginnt rückwirkend am 1. Dezember 2026 und ist deshalb schon fast vollständig abgelaufen."],"richtig":[0],"erkl":"Nach dem Tarif gilt Eintrittsalter = Beginn minus Geburtsjahr: 2026 − 1981 = 45; ohne Rückdatierung (Beginn 2027) wären es 46. Die Rückdatierung legt den technischen Beginn vor: niedrigeres Eintrittsalter und damit geringerer Beitrag, dafür Beitragszahlung ab dem rückdatierten Beginn. Vertragsschluss und Widerrufsfrist bleiben unberührt.","norm":"Proximus 5, Leben, Erläuterung zu den Tarifen (Berechnung des Eintrittsalters); Begriffe formeller und technischer Versicherungsbeginn; § 152 Abs. 1 VVG (Widerrufsfrist)","id":"3.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Frau Kaya – vorläufige Deckung","situation":"Frau Aylin Kaya (34) beantragt am Dienstag, 6. Oktober 2026, in der Agentur eine Unfallversicherung bei der Proximus Versicherung AG. Der Agent, der dafür Vollmacht hat, sagt ihr im Namen der Proximus sofort vorläufigen Versicherungsschutz ab dem 7. Oktober 2026 zu; die vorläufige Deckung ist auf unbestimmte Zeit geschlossen. Vereinbart ist: Kommt der Hauptvertrag nicht zustande, zahlt Frau Kaya für die vorläufige Deckung den anteiligen Beitrag. Der Jahresbeitrag des Hauptvertrags würde 360,00 € betragen. Nach Prüfung lehnt die Proximus den Antrag ab und kündigt die vorläufige Deckung; das Kündigungsschreiben geht Frau Kaya am Dienstag, 3. November 2026, zu.","items":[{"typ":"mc","frage":"Bis wann besteht die vorläufige Deckung nach der Kündigung des Versicherers noch?","optionen":["Bis zum Ablauf des 17. November 2026.","Nur bis zum Ablauf des 3. November 2026.","Bis zum Ablauf des 3. Dezember 2026.","Bis zum Ablauf des 6. Oktober 2027."],"richtig":[0],"erkl":"Bei einer vorläufigen Deckung auf unbestimmte Zeit kann jede Partei ohne Frist kündigen; die Kündigung des Versicherers wird aber erst nach Ablauf von zwei Wochen nach Zugang wirksam: Zugang 3.11. → Ende mit Ablauf des 17.11.2026.","norm":"§ 52 Abs. 4 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.5-4-1"},{"typ":"zahl","frage":"Die vorläufige Deckung bestand vom 7. Oktober bis einschließlich 17. November 2026. Wie viel Euro muss Frau Kaya dafür zahlen? Rechnen Sie nach der Zinsmethode 30/360 wie in der Prüfung (360,00 € Jahresbeitrag = 1,00 € je Tag).","wert":41.0,"einheit":"€","tol":0.01,"erkl":"Der Versicherer erhält den der Laufzeit entsprechenden Teil des Beitrags. Nach 30/360 hat jeder Monat 30 Tage, erster und letzter Tag zählen: 7.–30. Oktober = 24 Tage, 1.–17. November = 17 Tage, zusammen 41 Tage × 1,00 € = 41,00 €.","norm":"§ 50 VVG; Zinsmethode 30/360 laut Prüfungshinweis GAP 1","id":"3.5-4-2"},{"typ":"wf","frage":"Welche Aussagen zur vorläufigen Deckung von Frau Kaya treffen zu?","aussagen":[["Die vorläufige Deckung ist ein eigener Versicherungsvertrag neben dem beantragten Hauptvertrag.",true],["Frau Kaya kann die in der Agentur vereinbarte vorläufige Deckung innerhalb von 14 Tagen widerrufen.",false],["Es kann vereinbart werden, dass ihr Bedingungen und Informationen erst auf Anforderung, spätestens mit dem Versicherungsschein, übermittelt werden.",true],["Wäre der Hauptvertrag zustande gekommen, hätte die vorläufige Deckung spätestens mit Beginn des Schutzes aus dem Hauptvertrag geendet.",true]],"erkl":"Bei vorläufiger Deckung besteht kein Widerrufsrecht, es sei denn, es handelt sich um einen Fernabsatzvertrag; hier wurde in der Agentur abgeschlossen.","norm":"§§ 8 Abs. 3 Nr. 2, 49 Abs. 1, 52 Abs. 1 VVG","id":"3.5-4-3"},{"typ":"mc","frage":"Angenommen, die Proximus hätte den Hauptvertrag angenommen und Frau Kaya ihn fristgerecht widerrufen; der Widerruf geht am 20. Oktober 2026 zu. Was gilt für die vorläufige Deckung?","optionen":["Sie endet spätestens mit dem Zugang des Widerrufs am 20. Oktober 2026.","Sie läuft unabhängig vom Widerruf weiter, bis ein volles Versicherungsjahr vorbei ist.","Sie gilt rückwirkend ab dem 7. Oktober 2026 als nie geschlossen.","Sie endet erst zwei Wochen nach Zugang des Widerrufs beim Versicherer."],"richtig":[0],"erkl":"Kommt der Hauptvertrag wegen eines Widerrufs nicht zustande, endet die vorläufige Deckung spätestens mit dem Zugang des Widerrufs beim Versicherer.","norm":"§ 52 Abs. 3 VVG","id":"3.5-4-4"}]},{"typ":"situation","titel":"Fall 5: Frau Haidari – Erstprämie und Einlösung","situation":"Frau Mariam Haidari (27) schließt eine Hausratversicherung bei der Proximus Versicherung AG ab, Versicherungsbeginn 1. Dezember 2026. Der Versicherungsschein geht ihr am Mittwoch, 18. November 2026, zu; er enthält einen auffälligen Hinweis auf die Folgen einer nicht rechtzeitig gezahlten Erstprämie. Zur Fälligkeit ist nichts Abweichendes vereinbart; Frau Haidari zahlt per Überweisung. Ohne besonderen Grund hat sie bis zum 21. Dezember 2026 nicht gezahlt; an diesem Tag wird in ihre Wohnung eingebrochen. Am selben Tag wie die Hausratversicherung hat sie auch eine private Rentenversicherung abgeschlossen.","items":[{"typ":"mc","frage":"Wann ist die Erstprämie der Hausratversicherung nach den Bedingungen der Proximus zu zahlen?","optionen":["Unverzüglich nach Ablauf des 2. Dezember 2026 (14 Tage nach Zugang).","Sofort mit Zugang des Versicherungsscheins am 18. November 2026.","Am 1. Dezember 2026, dem vereinbarten Versicherungsbeginn.","Unverzüglich nach Ablauf des 18. Dezember 2026 (ein Monat nach Zugang)."],"richtig":[0],"erkl":"Die erste Prämie wird unverzüglich nach Ablauf von 14 Tagen nach Zugang des Versicherungsscheins fällig, jedoch nicht vor dem vereinbarten Beginn: 19.11. bis 2.12. sind 14 Tage, fällig also ab 3.12.2026 (nach dem Beginn am 1.12.). Das entspricht § 33 Abs. 1 VVG.","norm":"Proximus 5, VHB 2021 Ziff. 15.2.1; § 33 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-5-1"},{"typ":"mc","frage":"Muss die Proximus den Einbruchschaden vom 21. Dezember 2026 ersetzen?","optionen":["Nein, die fällige Erstprämie ist schuldhaft nicht gezahlt und der Hinweis war erteilt.","Ja, weil der vereinbarte Versicherungsbeginn (1. Dezember) vor dem Schadentag lag.","Ja, aber nur zur Hälfte, weil die Prämie erst seit wenigen Tagen fällig und offen ist.","Nein, weil vor Zahlung der Erstprämie noch gar kein Versicherungsvertrag zustande kommt."],"richtig":[0],"erkl":"Ist die Erstprämie bei Eintritt des Versicherungsfalls nicht gezahlt, ist der Versicherer leistungsfrei, wenn der Kunde die Nichtzahlung zu vertreten hat und auf diese Folge auffällig oder gesondert in Textform hingewiesen wurde. Der Vertrag besteht trotzdem.","norm":"§ 37 Abs. 2 VVG; Proximus 5, VHB 2021 Ziff. 15.1 und 15.2.2","id":"3.5-5-2"},{"typ":"zahl","frage":"Wie viele Tage nach Zugang des Versicherungsscheins ist die erste Prämie der Rentenversicherung von Frau Haidari nach dem VVG zu zahlen (ohne abweichende Vereinbarung)?","wert":30,"einheit":"Tage","tol":0,"erkl":"Bei der Lebensversicherung (dazu gehört die Rentenversicherung) ist die erste Prämie abweichend von § 33 VVG unverzüglich nach Ablauf von 30 Tagen nach Zugang des Versicherungsscheins zu zahlen – passend zur 30-tägigen Widerrufsfrist. Die Regel ist abdingbar: Die Bedingungen der Proximus verlangen den ersten Beitrag unverzüglich nach Abschluss des Vertrages, jedoch nicht vor dem vereinbarten Beginn.","norm":"§ 152 Abs. 5 VVG, § 171 VVG; Proximus 5, Allgemeine Bedingungen für die Rentenversicherung mit aufgeschobener Rentenzahlung Ziff. 10.2","id":"3.5-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Erstprämie treffen zu?","aussagen":[["Solange die Erstprämie nicht gezahlt ist, kann der Versicherer hier vom Vertrag zurücktreten und eine angemessene Geschäftsgebühr verlangen.",true],["Wäre SEPA-Lastschrift vereinbart und hätte der Versicherer versehentlich nicht abgebucht, müsste er den Einbruch ersetzen.",true],["Ohne auffälligen Hinweis im Versicherungsschein oder gesonderte Mitteilung in Textform wäre der Versicherer nicht leistungsfrei.",true],["Zahlt Frau Haidari am 22. Dezember 2026, muss der Versicherer den Einbruch vom 21. Dezember nachträglich ersetzen.",false]],"erkl":"Die Zahlung wirkt nicht zurück; maßgeblich ist, ob die Prämie bei Eintritt des Versicherungsfalls gezahlt war. Hat der Kunde die Nichtzahlung nicht zu vertreten (z. B. Versäumnis des Versicherers beim Lastschrifteinzug), bleibt der Versicherer leistungspflichtig.","norm":"§§ 37 Abs. 1 und 2, 39 Abs. 1 Satz 3 VVG; Proximus 5, VHB 2021 Ziff. 15.2.2 und 15.2.3","id":"3.5-5-4"}]},{"typ":"situation","titel":"Fall 6: Herr Nowak – Widerruf von zwei Verträgen","situation":"Herr Dariusz Nowak (40) hat zwei neue Verträge. (1) Risikolebensversicherung bei einem Lebensversicherer: Versicherungsschein, Bedingungen, Informationen und Widerrufsbelehrung gehen ihm am Montag, 9. November 2026, in Textform zu. (2) Hausratversicherung bei der Proximus Versicherung AG, in der Agentur abgeschlossen, Versicherungsbeginn 1. Dezember 2026: Alle Unterlagen einschließlich Belehrung gehen ihm am Montag, 30. November 2026, zu. Vor seinem Antrag wurde er ordnungsgemäß darauf hingewiesen, dass bei Widerruf nur der Beitrag für die Zeit nach Zugang des Widerrufs erstattet wird. Den Hausrat-Jahresbeitrag von 144,00 € hat er am 1. Dezember gezahlt.","items":[{"typ":"zahl","frage":"An welchem Tag im Dezember 2026 endet die Widerrufsfrist für die Risikolebensversicherung?","wert":9,"einheit":". Dezember","tol":0,"erkl":"Bei der Lebensversicherung beträgt die Widerrufsfrist 30 Tage ab Zugang aller Unterlagen: 10.11. bis 9.12. sind 30 Tage; der 9.12.2026 ist ein Mittwoch. Zur Fristwahrung genügt die rechtzeitige Absendung.","norm":"§ 152 Abs. 1 VVG, § 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-6-1"},{"typ":"zahl","frage":"Herr Nowak widerruft die Hausratversicherung per E-Mail; der Widerruf geht am 10. Dezember 2026 zu. Wie viel Euro muss die Proximus erstatten? Rechnen Sie nach der Zinsmethode 30/360; der Tag des Zugangs zählt noch zur Zeit mit Versicherungsschutz.","wert":140.0,"einheit":"€","tol":0.01,"erkl":"Der Schutz begann vor Ende der Widerrufsfrist und Herr Nowak war ordnungsgemäß hingewiesen; erstattet wird nur der Beitrag für die Zeit nach Zugang des Widerrufs. Gedeckt waren 1.–10.12. = 10 Tage; erstattet werden 360 − 10 = 350 Tage: 144,00 € ÷ 360 × 350 = 140,00 € (so rechnet auch die Lösung der GAP 1 Herbst 2025: 71,40 € ÷ 360 × 343 Tage).","norm":"§ 9 Abs. 2 Satz 1 Nr. 1 VVG; Zinsmethode 30/360 laut Prüfungshinweis GAP 1","id":"3.5-6-2"},{"typ":"mc","frage":"Angenommen, die Widerrufsbelehrung für die Hausratversicherung wäre Herrn Nowak erst am Montag, 7. Dezember 2026, in Textform zugegangen. Wann endet dann die Widerrufsfrist?","optionen":["Mit Ablauf des 21. Dezember 2026.","Mit Ablauf des 14. Dezember 2026.","Mit Ablauf des 30. Dezember 2026.","Mit Ablauf des 6. Januar 2027."],"richtig":[0],"erkl":"Die Frist beginnt erst, wenn Versicherungsschein, Bedingungen, Informationen und Belehrung in Textform zugegangen sind: Zugang der Belehrung 7.12. → 14 Tage → Ende am 21.12.2026 (Montag). Den Zugang muss der Versicherer nachweisen.","norm":"§ 8 Abs. 1 und 2 VVG, §§ 187 Abs. 1, 188 Abs. 1 BGB","id":"3.5-6-3"},{"typ":"wf","frage":"Welche Aussagen zum Widerrufsrecht treffen zu?","aussagen":[["Der Widerruf muss nicht begründet werden.",true],["Für eine Reisekrankenversicherung mit drei Wochen Laufzeit besteht kein Widerrufsrecht.",true],["Nach einem wirksamen Widerruf muss der Versicherer die zu erstattenden Beträge spätestens innerhalb von 30 Tagen zurückzahlen.",true],["Der Widerruf ist nur wirksam, wenn er innerhalb der Frist beim Versicherer eingeht; die Absendung genügt nicht.",false],["Ein Widerruf per E-Mail ist unwirksam, weil der Widerruf schriftlich mit Unterschrift erklärt werden muss.",false]],"erkl":"Der Widerruf ist in Textform (z. B. E-Mail) ohne Begründung zu erklären; die rechtzeitige Absendung wahrt die Frist. Kein Widerrufsrecht besteht u. a. bei Verträgen mit weniger als einem Monat Laufzeit.","norm":"§§ 8 Abs. 1 und 3 Nr. 1, 9 Abs. 1 VVG","id":"3.5-6-4"}]}]},{"nr":"3.6","titel":"Prüfungsfälle: Prämie, Anzeigepflicht, Gefahrerhöhung, Kündigung","lf":"LF 2","buch":"S. 90–122","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Okonkwo – Folgeprämie im Verzug","situation":"Frau Nadine Okonkwo (44) hat bei der Proximus Versicherung AG eine Hausratversicherung. Der Jahresbeitrag von 186,00 € für 2027 ist am 1. Februar 2027 fällig; sie zahlt ohne besonderen Grund nicht. Die Proximus schickt ihr eine Mahnung in Textform, die am Mittwoch, 10. Februar 2027, zugeht. Darin wird eine Zahlungsfrist von zwei Wochen ab Zugang gesetzt und die Kündigung für den Fall erklärt, dass sie bei Fristablauf noch in Verzug ist. Am 27. Februar 2027 wird bei ihr eingebrochen. Am 15. März 2027 zahlt sie alle offenen Beträge.","items":[{"typ":"zahl","frage":"An welchem Tag im Februar 2027 endet die Zahlungsfrist?","wert":24,"einheit":". Februar","tol":0,"erkl":"Zwei Wochen ab Zugang am Mittwoch, 10.2.: Die Frist endet mit Ablauf des Tages der zweiten Woche, der durch seine Benennung dem Zugangstag entspricht – Mittwoch, 24.2.2027.","norm":"§ 38 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-1-1"},{"typ":"wf","frage":"Welche Anforderungen muss die Mahnung erfüllen, damit sie die Rechtsfolgen des § 38 VVG auslösen kann?","aussagen":[["Sie muss die rückständige Prämie, Zinsen und Kosten im Einzelnen beziffern.",true],["Sie muss die Rechtsfolgen angeben, die mit dem Fristablauf verbunden sind.",true],["Die Zahlungsfrist muss mindestens zwei Wochen betragen.",true],["Sie muss per Einschreiben mit eigenhändiger Unterschrift verschickt werden.",false],["Die Mahnkosten muss der Versicherer selbst tragen.",false]],"erkl":"Die Zahlungsfrist wird in Textform und auf Kosten des Versicherungsnehmers bestimmt. Fehlt eine Pflichtangabe, ist die Fristbestimmung unwirksam.","norm":"§ 38 Abs. 1 VVG","id":"3.6-1-2"},{"typ":"mc","frage":"Muss die Proximus den Einbruch vom 27. Februar 2027 ersetzen?","optionen":["Nein, der Einbruch geschah nach Fristablauf, während Frau Okonkwo noch in Verzug war.","Ja, weil ein bestehender Vertrag nur durch eine gesonderte, spätere Kündigung beendet wird.","Ja, weil sie die Prämie am 15. März und damit noch rechtzeitig gezahlt hat.","Nur zur Hälfte, weil es sich um eine Folgeprämie und nicht um die Erstprämie handelt."],"richtig":[0],"erkl":"Tritt der Versicherungsfall nach Ablauf der wirksam gesetzten Zahlungsfrist ein und ist der Kunde noch in Verzug, ist der Versicherer leistungsfrei. Die spätere Zahlung ändert daran nichts.","norm":"§ 38 Abs. 2 VVG","id":"3.6-1-3"},{"typ":"mc","frage":"Welche Wirkung hat die Zahlung vom 15. März 2027 auf die mit der Mahnung verbundene Kündigung?","optionen":["Die Kündigung wird unwirksam, weil innerhalb eines Monats nach Fristablauf gezahlt wurde.","Keine; die Kündigung bleibt wirksam, weil Frau Okonkwo erst nach Ablauf der Zahlungsfrist gezahlt hat.","Die Kündigung wird unwirksam und der Einbruch vom 27. Februar ist doch versichert.","Die Kündigung wird erst unwirksam, wenn der Versicherer der Zahlung zustimmt."],"richtig":[0],"erkl":"Ist die Kündigung mit der Fristbestimmung verbunden, wird sie unwirksam, wenn der Kunde innerhalb eines Monats nach Fristablauf zahlt (hier bis 24.3.2027). Die Leistungsfreiheit für den Einbruch vom 27.2. bleibt bestehen.","norm":"§ 38 Abs. 3 VVG","id":"3.6-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Brandes – verschwiegene Rückenbehandlung","situation":"Herr Ole Brandes (39) hat am 1. April 2025 eine Berufsunfähigkeitsversicherung bei der Proximus Lebensversicherung AG beantragt; der Vertrag kam im April 2025 zustande. Im Antrag wurde er in Textform nach Behandlungen der letzten fünf Jahre gefragt und durch gesonderte Mitteilung in Textform über die Folgen falscher Angaben belehrt. Eine Physiotherapie wegen Rückenbeschwerden aus dem Jahr 2023 gab er nicht an. Im Februar 2027 beantragt er Leistungen wegen eines Bandscheibenvorfalls. Der Versicherer erfährt am Freitag, 12. März 2027, von der früheren Behandlung.","items":[{"typ":"zuo","frage":"Ordnen Sie dem Verschulden von Herrn Brandes die Rechtsfolge zu.","paare":[["Arglist: Er verschweigt die Behandlung bewusst, um den Vertrag zu bekommen.","Anfechtung; keine Leistung, auch wenn der Umstand für den Leistungsfall nicht ursächlich wäre"],["Vorsatz ohne Arglist","Rücktritt; Leistung nur, wenn der Umstand für den Leistungsfall nicht ursächlich war"],["Grobe Fahrlässigkeit; der Versicherer hätte mit Ausschluss von Rückenleiden angenommen","kein Rücktritt; auf Verlangen des Versicherers wird der Ausschluss rückwirkend Vertragsbestandteil"],["Einfache Fahrlässigkeit; der Versicherer hätte den Antrag abgelehnt","Kündigung mit Monatsfrist für die Zukunft; der eingetretene Leistungsfall bleibt gedeckt"]],"erkl":"Die Rechtsfolgen sind nach dem Verschulden abgestuft. Rücktritt wegen grober Fahrlässigkeit und Kündigung sind ausgeschlossen, wenn der Versicherer den Vertrag auch zu anderen Bedingungen geschlossen hätte; dann wird der Vertrag angepasst.","norm":"§§ 19 Abs. 2 bis 4, 21 Abs. 2, 22 VVG, § 123 BGB; Proximus 5, Allgemeine Bedingungen für die Berufsunfähigkeitsversicherung Ziff. 6.5 bis 6.11 und 6.17","id":"3.6-2-1"},{"typ":"mc","frage":"Bis wann muss der Versicherer seine Rechte wegen der Anzeigepflichtverletzung spätestens geltend machen?","optionen":["Bis zum 12. April 2027, schriftlich und unter Angabe der Gründe.","Bis zum 26. März 2027, in beliebiger Form auch telefonisch.","Bis zum 1. April 2027, also bis zwei Jahre nach Antragstellung.","Bis zum 12. März 2028, schriftlich und unter Angabe der Gründe."],"richtig":[0],"erkl":"Der Versicherer muss seine Rechte innerhalb eines Monats ab Kenntnis schriftlich geltend machen und die Umstände angeben, auf die er sich stützt: Kenntnis 12.3.2027 → Fristende Montag, 12.4.2027.","norm":"§ 21 Abs. 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB; Proximus 5, Allgemeine Bedingungen für die Berufsunfähigkeitsversicherung Ziff. 6.15","id":"3.6-2-2"},{"typ":"zahl","frage":"Nach wie vielen Jahren ab Vertragsschluss erlöschen die Rechte des Versicherers bei einer grob fahrlässigen Anzeigepflichtverletzung (für Versicherungsfälle nach Ablauf der Frist)?","wert":5,"einheit":"Jahre","tol":0,"erkl":"Die Rechte erlöschen fünf Jahre nach Vertragsschluss, außer für Versicherungsfälle, die vorher eingetreten sind. Bei Vorsatz oder Arglist beträgt die Frist zehn Jahre.","norm":"§ 21 Abs. 3 VVG; Proximus 5, Allgemeine Bedingungen für die Berufsunfähigkeitsversicherung Ziff. 6.16","id":"3.6-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Anzeigepflicht von Herrn Brandes und zu den Rechten der Beteiligten treffen zu?","aussagen":[["Herr Brandes musste nur Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat.",true],["Ohne gesonderte Mitteilung in Textform über die Folgen hätte der Versicherer keine Rechte nach § 19 Abs. 2 bis 4 VVG.",true],["Steigt die Prämie durch eine Vertragsanpassung um mehr als 10 %, kann Herr Brandes innerhalb eines Monats nach Zugang der Mitteilung fristlos kündigen.",true],["Kannte der Versicherer die Behandlung bereits bei Vertragsschluss, kann er trotzdem zurücktreten.",false]],"erkl":"Die Anzeigepflicht ist auf Textform-Fragen beschränkt. Die Rechte des Versicherers setzen eine Belehrung voraus und sind ausgeschlossen, wenn er den Umstand kannte.","norm":"§ 19 Abs. 1, 5 und 6 VVG; Proximus 5, Allgemeine Bedingungen für die Berufsunfähigkeitsversicherung Ziff. 6.1, 6.12 bis 6.14","id":"3.6-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Aydın – Werkstatt in der Garage","situation":"Herr Kemal Aydın besitzt ein Einfamilienhaus mit angebauter Garage in Halle (Saale), versichert in einer Wohngebäudeversicherung bei der Proximus Versicherung AG: VS 1914 20.000 M nach dem Ermittlungsbogen, PLZ 06110 (Feuer 0,20 ‰, Leitungswasser Zone II 0,35 ‰, Sturm/Hagel Zone I 0,25 ‰), Anpassungsfaktor 2027: 27,63 (wie im Vorjahr angenommen), jährliche Zahlung, Nettoprämie gemäß Zahlungsweise 419,98 €. Laut seinen Bedingungen (VGB 2021) kann eine Gefahrerhöhung insbesondere vorliegen, wenn im Gebäude ein Gewerbebetrieb aufgenommen wird. Im Februar 2027 richtet er ohne Rücksprache in der Garage eine Werkstatt ein, in der er nebenberuflich alte Möbel abschleift und lackiert. Im April meldet er dies der Agentur. Die Proximus verlangt statt einer Kündigung ab dem Zeitpunkt der Gefahrerhöhung den Tarifzuschlag für gewerbliche Teilnutzung bis 50 % von 1,3 ‰ (Tarif Wohngebäude Ziff. 5).","items":[{"typ":"zuo","frage":"Ordnen Sie dem Vorgang die richtige Einordnung zu.","paare":[["Herr Aydın richtet selbst die Lackierwerkstatt ein.","Gefahrerhöhung durch den Versicherungsnehmer – nur mit Einwilligung des Versicherers zulässig"],["Auf dem Nachbargrundstück eröffnet ein Fremder ein Lager für Feuerwerkskörper.","Gefahrerhöhung unabhängig vom Willen – nach Kenntnis unverzüglich anzeigen"],["Herr Aydın lässt Rauchwarnmelder und eine Rückstausicherung einbauen.","Gefahrminderung – keine Gefahrerhöhung"]],"erkl":"Eine vom Kunden vorgenommene oder gestattete Gefahrerhöhung braucht die Einwilligung des Versicherers; eine ungewollte muss er nach Kenntnis unverzüglich anzeigen. Die VGB 2021 der Proximus nennen die Aufnahme eines Gewerbebetriebs im Gebäude ausdrücklich als Beispiel.","norm":"§ 23 Abs. 1 und 3 VVG; Proximus 5, VGB 2021 Ziff. 23.1.5 und 23.2","id":"3.6-3-1"},{"typ":"zahl","frage":"Um wie viel Prozent erhöht sich die Nettoprämie gemäß Zahlungsweise von Herrn Aydın durch den Zuschlag (auf zwei Nachkommastellen)?","wert":162.5,"einheit":"%","tol":0.01,"erkl":"Neuer Prämiensatz 0,80 ‰ + 1,30 ‰ = 2,10 ‰; 20.000 M × 2,10 ‰ = 42,00 M; × 27,63 = 1.160,46 €; − 5 % jährliche Zahlung 58,02 € = 1.102,44 €. Erhöhung (1.102,44 € − 419,98 €) : 419,98 € × 100 = 162,50 %. Da die Erhöhung mehr als 10 % beträgt, hat Herr Aydın ein Sonderkündigungsrecht.","norm":"§ 25 Abs. 2 VVG; Proximus 5, Tarif Wohngebäude Ziff. 0.3, 2.1 und 5","id":"3.6-3-2"},{"typ":"mc","frage":"Wie kann Herr Aydın auf die Beitragserhöhung reagieren?","optionen":["Innerhalb eines Monats nach Zugang der Mitteilung ohne Einhaltung einer Frist kündigen.","Nur zum Ende des Versicherungsjahres mit einer Frist von drei Monaten kündigen.","Gar nicht, weil er die Gefahrerhöhung selbst vorgenommen hat und deshalb an den neuen Beitrag gebunden ist.","Innerhalb von zwei Wochen nach Zugang widersprechen; dann gilt der alte Beitrag."],"richtig":[0],"erkl":"Erhöht sich die Prämie wegen der Gefahrerhöhung um mehr als 10 %, kann der Versicherungsnehmer innerhalb eines Monats nach Zugang der Mitteilung fristlos kündigen; der Versicherer muss darauf hinweisen.","norm":"§ 25 Abs. 2 VVG","id":"3.6-3-3"},{"typ":"wf","frage":"Bevor er die Werkstatt meldet, entsteht ein Schaden. Welche Aussagen zur Leistungspflicht der Proximus treffen zu?","aussagen":[["Hat Herr Aydın die Gefahr vorsätzlich ohne Einwilligung erhöht und entsteht ein Brand durch Lösemittel, ist der Versicherer leistungsfrei.",true],["Bei grober Fahrlässigkeit kann der Versicherer die Leistung entsprechend der Schwere des Verschuldens kürzen.",true],["Deckt ein Sturm das Dach ab, muss der Versicherer leisten, weil die Werkstatt dafür nicht ursächlich war.",true],["Der Versicherer ist bei jeder Gefahrerhöhung unabhängig vom Verschulden immer vollständig leistungsfrei.",false]],"erkl":"Die Leistungsfreiheit ist nach dem Verschulden abgestuft. Der Versicherer bleibt zur Leistung verpflichtet, soweit die Gefahrerhöhung nicht ursächlich war oder seine Kündigungsfrist ungenutzt abgelaufen ist.","norm":"§ 26 Abs. 1 und 3 VVG; Proximus 5, VGB 2021 Ziff. 23.2 (Verweis auf §§ 24 ff. VVG)","id":"3.6-3-4"}]},{"typ":"situation","titel":"Fall 4: Herr Dos Santos – Kündigung nach dem Schaden","situation":"Herr Rafael Dos Santos (52) hat bei der Proximus Versicherung AG eine Hausrat- und eine Privathaftpflichtversicherung; die Versicherungsperiode läuft jeweils vom 1. Juli bis 30. Juni. Nach einem Leitungswasserschaden im Januar 2027 zahlt der Versicherer die abschließend berechnete Entschädigung; das Abrechnungsschreiben geht Herrn Dos Santos am Dienstag, 9. März 2027, zu. Damit sind die Verhandlungen über die Entschädigung abgeschlossen. Er ist mit der Bearbeitung unzufrieden und will den Hausratvertrag kündigen.","items":[{"typ":"mc","frage":"Bis wann muss Herr Dos Santos seine Kündigung des Hausratvertrags spätestens erklären?","optionen":["Bis zum 9. April 2027.","Bis zum 23. März 2027.","Bis zum 31. März 2027.","Bis zum 30. Juni 2027."],"richtig":[0],"erkl":"Die Kündigung nach dem Versicherungsfall ist nur bis zum Ablauf eines Monats seit Abschluss der Verhandlungen über die Entschädigung zulässig: 9.3.2027 → 9.4.2027 (Freitag). Die Kündigung ist in Textform zu erklären.","norm":"Proximus 5, VHB 2021 Ziff. 26.1; § 92 Abs. 2 Satz 1 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-4-1"},{"typ":"mc","frage":"Zu welchem Zeitpunkt kann Herr Dos Santos den Hausratvertrag nach dem Schaden kündigen?","optionen":["Sofort oder zu einem späteren Zeitpunkt, spätestens zum 30. Juni 2027.","Nur mit einer Frist von einem Monat zum Monatsende, frühestens zum 30. April 2027.","Nur mit einer Frist von drei Monaten zum Ende der Versicherungsperiode.","Zu jedem beliebigen Zeitpunkt, auch zum 30. Juni 2028 oder später."],"richtig":[0],"erkl":"Der Versicherungsnehmer kann fristlos kündigen, aber nicht für einen späteren Zeitpunkt als den Schluss der laufenden Versicherungsperiode (30.6.2027).","norm":"Proximus 5, VHB 2021 Ziff. 26.2; § 92 Abs. 2 Satz 3 VVG","id":"3.6-4-2"},{"typ":"zuo","frage":"Ordnen Sie der Situation die passende Regel zur Kündigung nach einem Versicherungsfall zu.","paare":[["Die Proximus kündigt den Hausratvertrag nach dem Schaden.","Sie muss eine Kündigungsfrist von einem Monat einhalten."],["Herr Dos Santos kündigt den Hausratvertrag nach dem Schaden.","Er kann ohne Frist oder zum Schluss der laufenden Periode kündigen."],["Die Proximus leistet in der Privathaftpflicht eine Schadenersatzzahlung an den Geschädigten.","Kündigung ist innerhalb eines Monats seit der Schadenersatzzahlung zulässig."],["Herrn Dos Santos wird eine Klage über einen versicherten Haftpflichtanspruch zugestellt.","Kündigung ist innerhalb eines Monats seit Zustellung der Klage zulässig."]],"erkl":"In der Sachversicherung regeln VHB 2021 Ziff. 26 (wie § 92 VVG) die Kündigung nach dem Versicherungsfall. Für die Privathaftpflicht knüpfen die Bedingungen der Proximus an die Schadenersatzzahlung oder die Zustellung einer Klage an; das Gesetz (§ 111 VVG, abdingbar) nennt Anerkennung, Ablehnung und Weisung zum Rechtsstreit.","norm":"Proximus 5, VHB 2021 Ziff. 26.1 bis 26.3, AVB PHV 2021 Teil B Abschnitt 2 Ziff. 3.1 und 3.2; §§ 92 Abs. 2, 111, 112 VVG","id":"3.6-4-3"},{"typ":"wf","frage":"Welche Aussagen zur Kündigung nach dem Schadenfall treffen zu?","aussagen":[["Das Kündigungsrecht nach dem Versicherungsfall steht beiden Vertragsparteien zu.",true],["Der Versicherer kann nach einem Schaden fristlos kündigen.",false],["Geht eine Kündigung der Proximus am 15. März 2027 zu, endet der Hausratschutz mit Ablauf des 15. April 2027.",true],["In der Privathaftpflicht der Proximus besteht das Kündigungsrecht auch, wenn dem Kunden eine Klage über einen versicherten Haftpflichtanspruch zugestellt wird.",true]],"erkl":"Der Versicherer muss eine Kündigungsfrist von einem Monat einhalten (Zugang 15.3. → Ende 15.4.). In der Privathaftpflicht der Proximus lösen eine Schadenersatzzahlung des Versicherers oder die Zustellung einer Klage das Kündigungsrecht aus.","norm":"Proximus 5, VHB 2021 Ziff. 26.1 und 26.3, AVB PHV 2021 Teil B Abschnitt 2 Ziff. 3.1; § 92 Abs. 1 und 2 VVG","id":"3.6-4-4"}]},{"typ":"situation","titel":"Fall 5: Verkauf des Hauses von Frau Lehmann","situation":"Frau Ingrid Lehmann (68) verkauft ihr Einfamilienhaus in Halle (Saale) an Herrn Amir Haddad. Der notarielle Kaufvertrag wird am 15. Januar 2027 geschlossen, Besitz, Nutzen und Lasten gehen am 1. März 2027 über, Herr Haddad wird am Dienstag, 20. April 2027, als Eigentümer im Grundbuch eingetragen. Für das Haus besteht eine Wohngebäudeversicherung bei der Proximus Versicherung AG; Versicherungsperiode ist das Kalenderjahr. Laut den Bedingungen gilt bei Immobilien das Datum der Grundbucheintragung als Zeitpunkt des Eigentumsübergangs.","items":[{"typ":"mc","frage":"Ab wann tritt Herr Haddad in die Wohngebäudeversicherung ein?","optionen":["Mit der Eintragung im Grundbuch am 20. April 2027.","Mit dem notariellen Kaufvertrag am 15. Januar 2027.","Mit dem Übergang von Besitz und Lasten am 1. März 2027.","Erst mit Beginn der nächsten Periode am 1. Januar 2028."],"richtig":[0],"erkl":"Der Erwerber tritt mit dem Eigentumsübergang in die Rechte und Pflichten des Versicherungsnehmers ein; bei Immobilien ist das die Eintragung im Grundbuch. Bis dahin bleibt Frau Lehmann Versicherungsnehmerin.","norm":"Proximus 5, VGB 2021 Ziff. 25.1.1; § 95 Abs. 1 VVG","id":"3.6-5-1"},{"typ":"mc","frage":"Herr Haddad möchte den übernommenen Vertrag kündigen. Was gilt?","optionen":["Er kann bis zum 20. Mai 2027 mit sofortiger Wirkung oder zum 31. Dezember 2027 kündigen.","Er kann nur mit einer Frist von drei Monaten zum Ende der Periode am 31. Dezember 2027 kündigen.","Er kann bis zum 1. April 2027 nur mit einer Frist von einem Monat zum Monatsende kündigen.","Er kann nicht kündigen, weil er kraft Gesetzes in den laufenden Vertrag eingetreten ist."],"richtig":[0],"erkl":"Der Erwerber kann mit sofortiger Wirkung oder zum Schluss der laufenden Versicherungsperiode kündigen, aber nur innerhalb eines Monats nach dem Erwerb: 20.4.2027 → 20.5.2027. Die Kündigung ist in Textform zu erklären.","norm":"Proximus 5, VGB 2021 Ziff. 25.2.2; § 96 Abs. 2 VVG, §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"3.6-5-2"},{"typ":"zuo","frage":"Ordnen Sie der Person ihr Recht bzw. ihre Pflicht nach der Veräußerung zu.","paare":[["Herr Haddad (Erwerber)","Kündigung sofort oder zum Periodenende, innerhalb eines Monats nach dem Erwerb"],["Proximus Versicherung AG","Kündigung mit einer Frist von einem Monat, innerhalb eines Monats ab Kenntnis"],["Frau Lehmann (Veräußerin)","zahlt bei einer Kündigung nach der Veräußerung die Prämie allein"]],"erkl":"Beide Vertragsparteien des übergegangenen Vertrags haben ein Sonderkündigungsrecht. Wird gekündigt, schuldet nur die Veräußerin die Prämie, der Erwerber haftet dafür nicht.","norm":"Proximus 5, VGB 2021 Ziff. 25.2.1 bis 25.2.3; § 96 Abs. 1 bis 3 VVG","id":"3.6-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Veräußerung treffen zu?","aussagen":[["Ohne Kündigung haften Frau Lehmann und Herr Haddad für die Prämie des Jahres 2027 als Gesamtschuldner.",true],["Die Veräußerung ist dem Versicherer vom Veräußerer oder vom Erwerber unverzüglich anzuzeigen.",true],["Unterbleibt die Anzeige, ist der Versicherer bei jedem späteren Schaden leistungsfrei.",false],["Der Versicherer muss den Eintritt des Erwerbers erst gegen sich gelten lassen, wenn er davon Kenntnis erlangt hat.",true]],"erkl":"Leistungsfrei wegen fehlender Anzeige ist der Versicherer nur, wenn der Schaden später als einen Monat nach dem Zeitpunkt eintritt, zu dem die Anzeige hätte zugehen müssen, und er den Vertrag mit dem Erwerber nicht geschlossen hätte.","norm":"Proximus 5, VGB 2021 Ziff. 25.1.2, 25.1.3 und 25.3; §§ 95 Abs. 2 und 3, 97 VVG","id":"3.6-5-4"}]},{"typ":"situation","titel":"Fall 6: Familie Osei – Beitragsrechnung, Beitragsanpassung, Laufzeit","situation":"Familie Osei aus Halle (Saale) hat bei der Proximus Versicherung AG für ihr Einfamilienhaus eine verbundene Wohngebäudeversicherung (Nettobeitrag 850,00 € jährlich), eine Glasversicherung (60,00 € laut Tarif für ein Einfamilienhaus bis 100 m²), eine Hausratversicherung (240,00 €) und eine Privathaftpflichtversicherung; Versicherungsperiode ist jeweils das Kalenderjahr. Für die Versicherungsteuer gilt laut Tarif: Wohngebäude mit Feuer 16,34 % (19 % auf 86 % des Nettobeitrags), Hausrat 16,15 % (19 % auf 85 %), Glas 19 % auf den vollen Nettobeitrag. Am 20. November 2026 geht der Familie eine Mitteilung zu: Aufgrund der Prämienangleichung steigt der Beitrag der Privathaftpflichtversicherung ab 1. Januar 2027, der Versicherungsschutz bleibt unverändert; auf das Kündigungsrecht wird hingewiesen.","items":[{"typ":"zahl","frage":"Wie hoch ist die Versicherungsteuer für die Hausratversicherung (Nettobeitrag 240,00 €)?","wert":38.76,"einheit":"€","tol":0.01,"erkl":"Bemessungsgrundlage 85 % von 240,00 € = 204,00 €; 19 % davon = 38,76 € (gleich 16,15 % von 240,00 €). Bruttobeitrag 278,76 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 0.4; § 5 Abs. 1 Nr. 3 Buchst. c, § 6 Abs. 2 Nr. 3 VersStG","id":"3.6-6-1"},{"typ":"zahl","frage":"Wie hoch ist der Gesamtbetrag der Rechnung für Wohngebäude- und Glasversicherung einschließlich Versicherungsteuer?","wert":1060.29,"einheit":"€","tol":0.01,"erkl":"Wohngebäude: 86 % von 850,00 € = 731,00 €, davon 19 % = 138,89 € (gleich 16,34 % von 850,00 €) → 988,89 €. Glas: 19 % von 60,00 € = 11,40 € → 71,40 €. Summe 988,89 € + 71,40 € = 1.060,29 €.","norm":"Proximus 5, Tarif Wohngebäude Ziff. 0.4, Tarif Glasversicherung Ziff. 0.4 und 1.1; § 5 Abs. 1 Nr. 1 und Nr. 3 Buchst. b, § 6 Abs. 1 und Abs. 2 Nr. 2 VersStG","id":"3.6-6-2"},{"typ":"mc","frage":"Wie kann Familie Osei auf die Beitragserhöhung in der Privathaftpflichtversicherung reagieren?","optionen":["Innerhalb eines Monats nach Zugang kündigen, frühestens zum 1. Januar 2027.","Nur mit einer Frist von drei Monaten zum Ende des Versicherungsjahres kündigen.","Innerhalb von 14 Tagen widerrufen; dann gilt der bisherige Beitrag weiter.","Gar nicht, weil die Erhöhung auf einer vereinbarten Anpassungsklausel beruht."],"richtig":[0],"erkl":"Erhöht der Versicherer aufgrund einer Anpassungsklausel (hier: Prämienangleichung) die Prämie ohne Änderung des Schutzes, kann der Kunde innerhalb eines Monats nach Zugang mit sofortiger Wirkung kündigen, frühestens zum Wirksamwerden der Erhöhung. Die Mitteilung muss spätestens einen Monat vorher zugehen – hier erfüllt. Eine Erhöhung der Versicherungsteuer begründet kein Kündigungsrecht.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 7 Ziff. 3.5; § 40 Abs. 1 VVG","id":"3.6-6-3"},{"typ":"wf","frage":"Welche Aussagen zur Vertragsdauer und Kündigung nach § 11 VVG treffen zu?","aussagen":[["Verlängert sich ein Vertrag laut Bedingungen stillschweigend um jeweils drei Jahre, ist die Verlängerung nur für ein Jahr wirksam.",true],["Die Kündigungsfrist muss für beide Vertragsparteien gleich sein und zwischen einem und drei Monaten liegen.",true],["Ein Vertrag auf unbestimmte Zeit kann nur zum Schluss der laufenden Versicherungsperiode gekündigt werden.",true],["Auf das Kündigungsrecht bei unbestimmter Dauer kann einvernehmlich für bis zu fünf Jahre verzichtet werden.",false]],"erkl":"Ein Kündigungsverzicht ist nur bis zur Dauer von zwei Jahren möglich. Stillschweigende Verlängerungen sind auf je ein Jahr begrenzt; so regeln es auch die Bedingungen der Proximus (Verlängerung um ein Jahr, Kündigungsfrist drei Monate).","norm":"§ 11 Abs. 1 bis 3 VVG; Proximus 5, VHB 2021 Ziff. 27.2, VGB 2021 Ziff. 28.2, AVB PHV 2021 Teil B Abschnitt 2 Ziff. 1.2","id":"3.6-6-4"}]}]}]},{"nr":"4","titel":"Wohnen und Wohneigentum absichern","lf":"LF 4","abschnitte":[{"nr":"4.1","titel":"Beratungsanlässe: Hausstandsgründung und veränderte Wohnsituation","lf":"LF 4","buch":"S. 123–124","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde zieht innerhalb Deutschlands um. Was gilt in der Hausratversicherung?","optionen":["Der Schutz geht auf die neue Wohnung über; während des Umzugs gilt er in beiden.","Der Vertrag endet mit dem Umzug; für die neue Wohnung ist ein neuer Antrag nötig.","Der Schutz bleibt in der alten Wohnung, bis der Versicherer der neuen schriftlich zustimmt.","Der Schutz geht erst nach der Anzeige über; bis dahin gilt er nur in der alten Wohnung."],"richtig":[0],"erkl":"Während des Umzugs besteht Schutz in beiden Wohnungen, in der alten längstens zwei Monate nach Umzugsbeginn. Der Umzug ist spätestens bei Beginn des Einzugs anzuzeigen; Wohnfläche und Tarifzone können sich ändern.","norm":"Proximus 5, VHB 2021 Ziff. 16.1, 16.4.1 und 16.5.1","id":"4.1-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Umzug ins Ausland treffen zu?","aussagen":[["Der Versicherungsschutz geht bei einem Umzug ins Ausland nicht auf die neue Wohnung über.",true],["Der Versicherungsschutz in der bisherigen Wohnung erlischt spätestens zwei Monate nach Umzugsbeginn.",true],["Der Hausrat ist im Ausland automatisch weiter versichert.",false]],"erkl":"Liegt die neue Wohnung nicht in Deutschland, geht der Schutz nicht auf sie über; in der bisherigen Wohnung erlischt er spätestens zwei Monate nach Umzugsbeginn.","norm":"Proximus 5, VHB 2021 Ziff. 16.3","id":"4.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie dem Anlass die wichtigste Prüfung zu.","paare":[["Zwei Haushalte werden zusammengelegt","doppelte Hausratverträge auflösen, Versicherungssumme anpassen"],["Erwerb einer Eigentumswohnung","Gemeinschaftseigentum über die Gemeinschaft, eigene Einbauten prüfen"],["Bau eines Einfamilienhauses","Bauherrenhaftpflicht, Bauleistung, Feuer-Rohbau, später Wohngebäude"]],"erkl":"Jeder Anlass verändert Risiko und Bedarf. Einbauten, die ein Wohnungseigentümer auf eigene Kosten beschafft, gehören zu seinem Hausrat; die Feuerrohbauversicherung ist im Proximus-Tarif Wohngebäude geregelt.","norm":"Bedarfsanalyse; Proximus 5, VHB 2021 Ziff. 8.3.1; VGB 2021 Ziff. 7.5.2; Tarif Wohngebäude Ziff. 4","id":"4.1-1-3"},{"typ":"mc","frage":"Eine Kundin zieht dauerhaft in ein Pflegeheim und löst ihren Hausrat vollständig auf. Was gilt nach Proximus 5 für ihre Hausratversicherung?","optionen":["Der Vertrag läuft als Wohnungswechsel weiter; das Heimzimmer wird die versicherte Wohnung.","Der Vertrag endet erst nach einer Kündigung zum Ende der laufenden Versicherungsperiode.","Das versicherte Interesse fällt weg; der Vertrag endet, sobald der Versicherer davon erfährt.","Der Hausrat im Heim ist über die Gebäudeversicherung des Heimträgers mitversichert."],"richtig":[2],"erkl":"Die vollständige und dauerhafte Auflösung des Hausrats nach Aufnahme in eine stationäre Pflegeeinrichtung gilt als Wegfall des versicherten Interesses. Der Vertrag endet zu dem Zeitpunkt, zu dem der Versicherer davon Kenntnis erlangt. Ein bloßer Wohnungswechsel ist dagegen kein Wegfall des Interesses.","norm":"Proximus 5, VHB 2021 Ziff. 25 und 25.1.1; § 80 Abs. 2 VVG","id":"4.1-1-4"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Jonas Becker (24) zieht nach seiner Ausbildung aus dem Elternhaus aus in seine erste eigene Mietwohnung (55 m²). Er fragt, ob er über die Verträge seiner Eltern weiter versichert ist.","items":[{"typ":"mc","frage":"Ist Jonas noch über die Privathaftpflicht seiner Eltern versichert?","optionen":["Ja, bis zum Ende des ersten Mietjahres in der neuen Wohnung.","Ja, solange er noch unter der Anschrift seiner Eltern gemeldet ist.","Nein, weil die Mitversicherung volljähriger Kinder mit dem Ende der Ausbildung endet.","Ja, weil unverheiratete Kinder bis zum 25. Lebensjahr in jedem Fall mitversichert sind."],"richtig":[2],"erkl":"Unverheiratete volljährige Kinder sind in der Proximus-PHV nur während einer Schul- oder unmittelbar (innerhalb von 12 Monaten) anschließenden Berufsausbildung mitversichert; eine innerhalb von 12 Monaten folgende zweite Ausbildung ist ebenfalls erfasst. Jonas hat seine Ausbildung beendet und braucht eine eigene Privathaftpflicht.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 2.1.2","id":"4.1-2-1"},{"typ":"zahl","frage":"Für den Unterversicherungsverzicht verlangt die Proximus mindestens 650 € Versicherungssumme je m² Wohnfläche; die Summe ist auf volle 100 € aufzurunden. Wie hoch muss die Summe für Jonas mindestens sein?","wert":35800,"einheit":"€","tol":0,"erkl":"55 m² × 650 €/m² = 35.750 €, auf volle 100 € aufgerundet: 35.800 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 1.1; Klausel PK 7712","id":"4.1-2-2"},{"typ":"mc","frage":"Jonas fragt, ob sein Fahrrad, das er im Hausflur abschließt, gegen Diebstahl versichert ist. Was ist richtig?","optionen":["Der Diebstahl ist versichert, wenn das Fahrrad abgeschlossen war, auch ohne Zusatzklausel.","Diebstahl ohne Einbruch ist nur versichert, wenn die Fahrraddiebstahl-Klausel vereinbart ist.","Fahrräder sind nur versichert, wenn sie in der Wohnung selbst abgestellt werden.","Fahrräder sind in jeder Hausratversicherung auch gegen einfachen Diebstahl versichert."],"richtig":[1],"erkl":"Einfacher Diebstahl aus dem Hausflur ist kein Einbruchdiebstahl. Mit der Klausel PK 7110 sind Fahrräder auch gegen Diebstahl versichert, je Versicherungsfall bis 1 % der Versicherungssumme zuzüglich Vorsorge; Jonas muss das Rad dann mit einem verkehrsüblichen Schloss sichern.","norm":"Proximus 5, VHB 2021 Ziff. 4.1; Klausel PK 7110 Fahrraddiebstahl","id":"4.1-2-3"}]}]},{"nr":"4.2","titel":"Individuelle Bedarfe analysieren, Risikoprävention und -absicherung","lf":"LF 4","buch":"S. 125–140","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Gefahren sind in der Hausratversicherung nach Proximus 5 (VHB 2021) versichert?","aussagen":[["Brand, Blitzschlag, Explosion",true],["Einbruchdiebstahl, Raub und Vandalismus nach einem Einbruch",true],["Leitungswasser, Sturm und Hagel",true],["Überschwemmung durch Starkregen ohne besondere Vereinbarung",false]],"erkl":"Weitere Naturgefahren (Elementargefahren) wie Überschwemmung und Rückstau sind nur versichert, soweit sie zusätzlich vereinbart sind.","norm":"Proximus 5, VHB 2021 Ziff. 1","id":"4.2-1-1"},{"typ":"zahl","frage":"Ab welcher Windstärke liegt ein Sturm im Sinne der Bedingungen vor?","wert":8,"einheit":"Beaufort","tol":0,"erkl":"Sturm ist eine wetterbedingte Luftbewegung von mindestens Windstärke 8 nach der Beaufortskala (mindestens 62 km/h).","norm":"Proximus 5, VHB 2021 Ziff. 6.1; VGB 2021 Ziff. 5.1","id":"4.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie der Präventionsmaßnahme das Risiko zu, das sie mindert.","paare":[["Rückstauklappe im Abwasserrohr","Rückstau bei Starkregen"],["Rauchmelder","Personenschäden und Ausbreitung von Bränden"],["einbruchhemmende Fenster und Türen","Einbruchdiebstahl"],["Wasserleitungen im Winter entleeren","Frostschäden an Rohren"]],"erkl":"Prävention verringert Schäden; manche Maßnahmen sind vertragliche Sicherheitsvorschriften, z. B. Rückstausicherungen funktionsbereit halten und wasserführende Leitungen in der kalten Jahreszeit absperren und entleeren, wenn nicht beheizt wird.","norm":"Proximus 5, VGB 2021 Ziff. 21.1.3 und 21.1.4; VHB 2021 Ziff. 21.1","id":"4.2-1-3"},{"typ":"mc","frage":"Wann liegt ein Einbruchdiebstahl im Sinne der Bedingungen vor?","optionen":["Der Dieb bricht die Wohnungstür auf, dringt ein und stiehlt Sachen.","Ein Gast nimmt bei einem Besuch heimlich eine wertvolle Uhr mit.","Einer Kundin wird im Café die Handtasche vom Stuhl gestohlen.","Ein Dieb nimmt ein unverschlossenes Fahrrad vom offenen Hinterhof mit."],"richtig":[0],"erkl":"Kennzeichnend ist das Eindringen in einen Raum eines Gebäudes, z. B. durch Einbrechen, Einsteigen oder mit falschen Schlüsseln.","norm":"Proximus 5, VHB 2021 Ziff. 4.1.1","id":"4.2-1-4"},{"typ":"mc","frage":"Welcher Schaden ist in der Hausratversicherung über die Gefahr Leitungswasser versichert?","optionen":["Regenwasser läuft durch ein offen gelassenes Fenster ins Wohnzimmer.","Beim Blumengießen kippt ein Eimer Wasser um und durchnässt den Teppich.","Nach starkem Regen dringt Grundwasser durch die Kellerwand in den Keller ein.","Aus einem geplatzten Waschmaschinenschlauch tritt Wasser aus und beschädigt Möbel."],"richtig":[3],"erkl":"Leitungswasser ist bestimmungswidrig ausgetretenes Wasser aus Rohren und angeschlossenen Einrichtungen; Plansch- oder Reinigungswasser, Grundwasser und Witterungsniederschläge sind ausgeschlossen.","norm":"Proximus 5, VHB 2021 Ziff. 5.2 und 5.4","id":"4.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Yilmaz wohnt in einem gemieteten Reihenhaus in Flussnähe. Im letzten Sommer lief nach einem Starkregen Wasser über die Kellertreppe in den Keller, in dem Möbel und eine Gefriertruhe standen. Die Hausratversicherung hat nicht gezahlt.","items":[{"typ":"mc","frage":"Warum hat die Hausratversicherung vermutlich nicht gezahlt?","optionen":["Wasser, das über die Kellertreppe eindringt, gilt immer als grob fahrlässig herbeigeführter Schaden.","Möbel und Gefriertruhen im Keller gehören grundsätzlich nicht zum versicherten Hausrat der Familie.","Überschwemmung durch Starkregen ist eine weitere Naturgefahr, die gesondert vereinbart sein muss.","Mieter eines Reihenhauses können eine Hausratversicherung nur über ihren Vermieter abschließen."],"richtig":[2],"erkl":"Leitungswasser deckt keine Witterungsniederschläge; Überschwemmung durch Starkregen ist nur mit dem Einschluss weiterer Naturgefahren versichert.","norm":"Proximus 5, VHB 2021 Ziff. 1.4.2, 5.4.3 und 6.4.1","id":"4.2-2-1"},{"typ":"wf","frage":"Was empfehlen Sie der Familie?","aussagen":[["Einschluss der weiteren Naturgefahren in die Hausratversicherung prüfen",true],["hochwertige Sachen nicht im Keller lagern",true],["den Vermieter auf einen Schutz am Kellerabgang (Schwelle, Abdeckung) ansprechen",true],["die Hausratversicherung kündigen, weil sie nichts bringt",false]],"erkl":"Absicherung und Prävention ergänzen sich. Vorschäden erschweren den Einschluss: Bei Proximus führt ein Vorschaden in den letzten 10 Jahren in Tarifzone II, bei zwei oder mehr Vorschäden wird das Elementarrisiko nicht übernommen; es gilt eine Selbstbeteiligung von 500 € je Versicherungsfall.","norm":"Beratung; Proximus 5, Tarif Hausrat Ziff. 3","id":"4.2-2-2"},{"typ":"mc","frage":"Wer versichert das Reihenhaus selbst gegen Elementarschäden?","optionen":["Die Gemeinde, weil sie für den Hochwasserschutz zuständig ist.","Der Vermieter über die Wohngebäudeversicherung mit Elementarschutz.","Die Familie Yilmaz über ihre eigene Hausratversicherung.","Der Vermieter über seine Haus- und Grundbesitzerhaftpflicht."],"richtig":[1],"erkl":"Gebäude und Gebäudebestandteile versichert der Eigentümer; weitere Naturgefahren kann er nur zusammen mit Feuer, Leitungswasser oder Sturm/Hagel einschließen. Der Mieter versichert seinen Hausrat.","norm":"Proximus 5, VGB 2021 Ziff. 1.3.2 und 6","id":"4.2-2-3"}]}]},{"nr":"4.3","titel":"Lösungsmöglichkeiten durch private Versicherungen aufzeigen","lf":"LF 4","buch":"S. 141–179","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Hausrat nach Proximus 5: Versicherungssumme 40.000 €, Versicherungswert 50.000 €, Schaden 10.000 €, kein Unterversicherungsverzicht. Wie hoch ist die Entschädigung?","wert":8800,"einheit":"€","tol":0,"erkl":"Die Versicherungssumme erhöht sich um die Vorsorge von 10 % auf 44.000 €. Entschädigung = 10.000 € × 44.000 € / 50.000 € = 8.800 €.","norm":"Proximus 5, VHB 2021 Ziff. 17.2 und 17.5; § 75 VVG","id":"4.3-1-1"},{"typ":"mc","frage":"Was versteht man unter der Außenversicherung in der Hausratversicherung?","optionen":["Hausrat, der sich vorübergehend außerhalb der Wohnung befindet, ist begrenzt mitversichert.","Alle Sachen auf Balkon und Terrasse sind ohne jede Entschädigungsgrenze mitversichert.","Hausrat ist weltweit dauerhaft und ohne Begrenzung der Entschädigung versichert.","Nebengebäude wie Garagen und Gartenhäuser sind als Gebäude mitversichert."],"richtig":[0],"erkl":"Vorübergehend heißt: höchstens drei Monate. Die Entschädigung ist auf 10 % der Versicherungssumme zuzüglich Vorsorge, höchstens 10.000 €, begrenzt; Einbruchdiebstahl setzt das Eindringen in einen Raum eines Gebäudes voraus.","norm":"Proximus 5, VHB 2021 Ziff. 12.1 und 12.4","id":"4.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Begriffe der Wohngebäudeversicherung zu.","paare":[["Versicherungssumme 1914","Wert des Gebäudes in Preisen des Jahres 1914 als Rechengrundlage"],["Anpassungsfaktor (gleitende Neuwertversicherung)","passt die Prämie jährlich an die Entwicklung von Baupreisen und Tariflöhnen an"],["Gleitende Neuwertversicherung","ersetzt den ortsüblichen Neubauwert zum Schadenzeitpunkt"]],"erkl":"Bei korrekt ermittelter Summe 1914 verzichtet der Versicherer auf den Einwand der Unterversicherung.","norm":"Proximus 5, VGB 2021 Ziff. 14.1.1, 15.2.1 und 17.2","id":"4.3-1-3"},{"typ":"wf","frage":"Was gehört nach Proximus 5 (VHB 2021) zum versicherten Hausrat?","aussagen":[["Möbel, Kleidung, Bücher und Haushaltsgeräte",true],["vom Mieter auf eigene Kosten eingebaute Einbauküche",true],["das Auto in der Garage",false],["Bargeld und Schmuck mit Entschädigungsgrenzen",true]],"erkl":"Kraftfahrzeuge sind kein Hausrat (Ausnahmen z. B. Krankenfahrstühle, Rasenmäher, Pedelecs bis 25 km/h); Wertsachen sind begrenzt.","norm":"Proximus 5, VHB 2021 Ziff. 8.2, 8.3.1, 8.3.4 und 9.3","id":"4.3-1-4"},{"typ":"mc","frage":"Was ist in der Wohngebäudeversicherung, anders als in der Hausratversicherung, typischerweise versichert?","optionen":["Schäden an Kleidung durch Leitungswasser aus einem Rohrbruch.","Einbruchdiebstahl von Schmuck und Bargeld aus dem Wohnhaus.","Die Möbel und elektrischen Geräte des Mieters im Gebäude.","Frost- und Bruchschäden an Rohren der Wasserversorgung im Gebäude."],"richtig":[3],"erkl":"Frost- und sonstige Bruchschäden an Rohren der Wasserversorgung innerhalb von Gebäuden gehören zur Gefahr Leitungswasser in der Wohngebäudeversicherung.","norm":"Proximus 5, VGB 2021 Ziff. 4.3.1","id":"4.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr und Frau Hartmann haben ein Einfamilienhaus mit Photovoltaikanlage auf dem Dach, eine Holzgartenhütte und einen Gartenteich. Im Wohnzimmer steht ein wertvolles Klavier, im Schlafzimmer ein Tresor mit Schmuck.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache dem passenden Vertrag zu.","paare":[["Photovoltaikanlage auf dem Dach","eigene Photovoltaikversicherung, weil die Proximus-Wohngebäudeversicherung sie ausschließt"],["Klavier","Hausratversicherung"],["Schmuck im Tresor","Hausratversicherung mit Entschädigungsgrenzen für Wertsachen"],["fest errichtete Gartenhütte","Wohngebäudeversicherung, wenn sie als Grundstücksbestandteil (Klausel PK 7264) vereinbart ist"]],"erkl":"Gebäude und fest verbundene Sachen gehören in die Wohngebäudeversicherung, bewegliche Sachen in die Hausratversicherung. Photovoltaikanlagen sind nach Proximus 5 in der Wohngebäudeversicherung nicht versichert; Gartenhäuser nur durch zusätzliche Vereinbarung.","norm":"Proximus 5, VGB 2021 Ziff. 7.5.1 und 7.6.2.2; Klausel PK 7264; VHB 2021 Ziff. 8 und 18","id":"4.3-2-1"},{"typ":"mc","frage":"Warum sollte die Versicherungssumme für den Schmuck genau geprüft werden?","optionen":["Schmuck ist in der Hausratversicherung grundsätzlich nicht versichert.","Für Schmuck zahlt der Versicherer nur bei Brand, nicht aber bei einem Einbruch.","Für Wertsachen gelten Entschädigungsgrenzen je nach Art der Aufbewahrung.","Schmuck wird immer zum Neuwert und ohne jede Höchstgrenze ersetzt."],"richtig":[2],"erkl":"Wertsachen werden je Versicherungsfall insgesamt bis 20 % der Versicherungssumme entschädigt. Liegt Schmuck außerhalb eines verschlossenen, anerkannten Wertschutzschranks, gilt zusätzlich eine Grenze von 20.000 €; ein Tresor zählt nur als Wertschutzschrank, wenn er die Anforderungen (z. B. VdS-Anerkennung, 200 kg oder Verankerung) erfüllt.","norm":"Proximus 5, VHB 2021 Ziff. 18.2 und 18.3","id":"4.3-2-2"},{"typ":"mc","frage":"Der Kunde fragt, ob ein Rasensprenger-Schlauch, der im Garten platzt und den Rasen flutet, über Leitungswasser versichert ist. Was ist richtig?","optionen":["Ja, wenn der Schaden am Rasen mehr als 1.000 € beträgt.","Nein, der Rasen gehört als Grund und Boden nicht zu den versicherten Sachen.","Ja, jeder Wasseraustritt auf dem versicherten Grundstück ist versichert.","Ja, aber nur, wenn der Schlauch durch Frost geplatzt ist."],"richtig":[1],"erkl":"Ersetzt werden nur Schäden an versicherten Sachen; Grund und Boden, also auch der Rasen, gehört nicht dazu.","norm":"Proximus 5, VGB 2021 Ziff. 4.2 und 6","id":"4.3-2-3"}]}]},{"nr":"4.4","titel":"Kundengerechte Angebote erstellen, Rechtsstreitigkeiten und Ansprüche Dritter, Vertragsschluss","lf":"LF 4 / LF 5","buch":"S. 180–227","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Versicherungssumme 1914: 22.000 Mark, Anpassungsfaktor 24,9, Prämiensatz 1,5 ‰ (Promille). Wie hoch ist die Nettojahresprämie ohne Versicherungsteuer und vor Nachlässen?","wert":821.7,"einheit":"€","tol":0.01,"erkl":"22.000 M × 1,5 ‰ = 33,00 M (Jahresprämie 1914) × Anpassungsfaktor 24,9 = 821,70 €.","norm":"Proximus 5, VGB 2021 Ziff. 16 und 17","id":"4.4-1-1"},{"typ":"mc","frage":"Eine Kundin vermietet eine Wohnung in ihrem Zweifamilienhaus, die andere bewohnt sie selbst. Welche Haftpflichtversicherung braucht sie nach Proximus 5 für die Vermietung?","optionen":["Keine zusätzliche, weil ihre Privathaftpflicht die Vermietung im selbst bewohnten Zweifamilienhaus einschließt.","Eine Haus- und Grundbesitzerhaftpflicht, weil vermietete Wohnungen nie über die Privathaftpflicht laufen.","Eine Rechtsschutzversicherung, weil sie die Haftpflichtansprüche der Mieter vollständig bezahlt.","Eine Gewässerschadenhaftpflicht, weil sie das gesamte Vermietungsrisiko vollständig abdeckt."],"richtig":[0],"erkl":"Die Proximus-Privathaftpflicht umfasst das selbst bewohnte Zweifamilienhaus und ausdrücklich die Vermietung einer Wohnung darin. Eine Haus- und Grundbesitzerhaftpflicht braucht sie erst für Häuser, die die Privathaftpflicht nicht erfasst, z. B. ein vermietetes Mehrfamilienhaus.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.3.1 und 6.3.2.3; Abschnitt 4","id":"4.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Rechtsschutzversicherung für Wohnungs- und Grundstückseigentum treffen zu?","aussagen":[["Sie hilft z. B. bei Streit mit dem Mieter über Mietzahlungen.",true],["Für sie gilt nach Proximus 5 eine Wartezeit von drei Monaten.",true],["Streitigkeiten rund um Planung und Errichtung eines Hauses sind ausgeschlossen.",true],["Sie ersetzt Schäden, die der Kunde Dritten zufügt.",false]],"erkl":"Rechtsschutz trägt Kosten der Rechtsverfolgung; die Abwehr von Schadenersatzansprüchen Dritter gehört in die Haftpflichtversicherung. Ohne lückenlose Vorversicherung gilt im Wohnungs- und Grundstücks-Rechtsschutz eine Wartezeit von drei Monaten.","norm":"Proximus 5, ARB 2021 Ziff. 2.2.3, 3.1.1, 3.2.2 und 3.2.3","id":"4.4-1-3"},{"typ":"mc","frage":"Wie verhält sich die Kundin richtig, wenn sie einen Heizöltank im Keller ihres Hauses hat?","optionen":["Sie meldet den Tank ihrem Wohngebäudeversicherer, der dann die Haftung übernimmt.","Sie schließt eine Glasversicherung ab, weil diese auch Schäden am Tank deckt.","Sie braucht nichts, weil Ölschäden immer gesetzlich über die Gemeinde gedeckt sind.","Sie prüft eine Gewässerschadenhaftpflicht für ihren Heizöltank (Anlagenrisiko)."],"richtig":[3],"erkl":"Für Anlagen, die Gewässer verunreinigen können, haftet der Betreiber verschuldensunabhängig. Die Proximus-Privathaftpflicht deckt Gewässerschäden nur aus Kleingebinden bis 100 Liter (insgesamt höchstens 1.000 Liter); für den Heizöltank braucht sie die Gewässerschaden-Haftpflicht (Anlagenrisiko).","norm":"§ 89 WHG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.21.1; Abschnitt 6","id":"4.4-1-4"},{"typ":"mc","frage":"Ein Kunde unterschreibt den Antrag für eine Wohngebäudeversicherung. Was ist der nächste Schritt bis zum Vertragsschluss?","optionen":["Der Vertrag ist bereits mit der Unterschrift des Kunden auf dem Antrag geschlossen.","Der Kunde muss den Antrag nach Ablauf von 14 Tagen erneut unterschreiben.","Der Versicherer prüft den Antrag und nimmt ihn durch Übersendung der Police an.","Der Vertrag muss vom Vermittler notariell beurkundet werden, um wirksam zu sein."],"richtig":[2],"erkl":"Beim Antragsmodell kommt der Vertrag mit Zugang der Annahme (Police) zustande; der Kunde ist bis dahin an seinen Antrag gebunden.","norm":"§§ 145 ff. BGB","id":"4.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Lorenz bittet um ein Angebot für die Hausratversicherung seiner neuen 80-m²-Wohnung, die nach dem Proximus-Tarif in Tarifzone H III liegt (Grundprämie 2,30 ‰ der Versicherungssumme, ohne Versicherungsteuer). Für den Unterversicherungsverzicht verlangt die Proximus 650 € je m² Wohnfläche.","items":[{"typ":"zahl","frage":"Wie hoch ist die Mindestversicherungssumme für den Unterversicherungsverzicht?","wert":52000,"einheit":"€","tol":0,"erkl":"80 m² × 650 € = 52.000 €; der Betrag ist bereits ein Vielfaches von 100 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 1.1; Klausel PK 7712","id":"4.4-2-1"},{"typ":"zahl","frage":"Wie hoch ist die Nettojahresprämie für diese Versicherungssumme (vor Nachlässen, ohne Versicherungsteuer)?","wert":119.6,"einheit":"€","tol":0.01,"erkl":"52.000 € × 2,30 ‰ = 119,60 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 2.1.1","id":"4.4-2-2"},{"typ":"mc","frage":"Herr Lorenz möchte die Prämie monatlich zahlen. Was müssen Sie ihm erklären?","optionen":["Bei monatlicher Zahlung entfällt der Unterversicherungsverzicht.","Monatlich entfällt der Nachlass von 5 % für jährliche Zahlung.","Bei monatlicher Zahlung sinkt die Jahresprämie um ein Skonto von 5 %.","Bei monatlicher Zahlung muss er eine Selbstbeteiligung vereinbaren."],"richtig":[1],"erkl":"Proximus 5 gewährt für die Zahlungsweise einen Nachlass: jährlich 5 %, halbjährlich 3 %, vierteljährlich 2 %, monatlich 0 %; monatlich nur per SEPA-Lastschrift, Mindestrate 5 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 0.1 und 0.3","id":"4.4-2-3"}]}]},{"nr":"4.5","titel":"Ergänzende Serviceleistungen aufzeigen","lf":"LF 4","buch":"S. 228–230","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Leistungen werden häufig als Assistance- oder Serviceleistung zur Hausrat- oder Wohngebäudeversicherung angeboten?","aussagen":[["Vermittlung eines Schlüsseldienstes bei ausgesperrter Tür",true],["Vermittlung von Handwerkern nach einem Schaden",true],["Rohrreinigung bei Verstopfung, je nach Tarif",true],["Übernahme aller Handwerkerrechnungen ohne Schaden und ohne Höchstbetrag",false]],"erkl":"Serviceleistungen sind meist Organisations- und Vermittlungsleistungen, teils mit Kostenübernahme bis zu Grenzen. Proximus 5 enthält keinen Assistance-Baustein; Kosten für die Beseitigung von Rohrverstopfungen sind dort nur über die Klausel PK 7167 bis zu einem vereinbarten Betrag versichert.","norm":"Marktübliche Serviceleistungen (nicht Teil von Proximus 5); Proximus 5, Klausel PK 7167","id":"4.5-1-1"},{"typ":"mc","frage":"Welcher Nutzen steht bei Smart-Home-Bausteinen (z. B. Wassermelder mit Absperrventil) für Kunde und Versicherer im Vordergrund?","optionen":["Schäden früh erkennen und begrenzen.","Die Prämie automatisch erhöhen.","Verträge leichter kündigen können.","Kundendaten für Werbung auswerten."],"richtig":[0],"erkl":"Prävention senkt Schadenhöhe und -häufigkeit.","norm":"Prävention","id":"4.5-1-2"},{"typ":"mc","frage":"Nach einem Brand ist die Wohnung eines Kunden unbewohnbar. Welche Kosten übernimmt die Hausratversicherung in der Regel?","optionen":["Die Mehrkosten einer dauerhaft teureren Ersatzwohnung.","Die Miete für eine neue Wohnung für die Dauer von zehn Jahren.","Keine Kosten, ersetzt werden nur die beschädigten Sachen.","Hotelkosten für eine begrenzte Zeit und bis zu einem Höchstbetrag."],"richtig":[3],"erkl":"Versicherte Kosten sind u. a. Hotel-, Transport- und Lagerkosten. Hotelkosten ohne Nebenkosten werden bis zur Bewohnbarkeit ersetzt, längstens 100 Tage und je Tag bis 1 ‰ der Versicherungssumme zuzüglich Vorsorge.","norm":"Proximus 5, VHB 2021 Ziff. 13.3 und 13.4","id":"4.5-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Demir ruft an einem Sonntagabend in der Agentur-Hotline an: Im Badezimmer läuft Wasser aus einem Anschluss, sie bekommt den Haupthahn nicht zu. Ihr Vertrag enthält einen Assistance-Baustein.","items":[{"typ":"mc","frage":"Welche Maßnahme hat für Frau Demir sofort Vorrang?","optionen":["Bis Montag warten und den Schaden dann in der Agentur persönlich melden.","Zuerst den Schaden fotografieren und erst danach das Wasser abstellen lassen.","Den Schaden mindern, z. B. das Wasser abstellen lassen und die Assistance anrufen.","Den Schaden schriftlich beim Versicherer melden und dessen Freigabe abwarten."],"richtig":[2],"erkl":"Der Versicherungsnehmer muss den Schaden nach Möglichkeit abwenden und mindern und den Schaden unverzüglich anzeigen; Kosten dafür ersetzt der Versicherer.","norm":"§§ 82, 83 VVG; Proximus 5, VHB 2021 Ziff. 22.1.1 und 22.1.2","id":"4.5-2-1"},{"typ":"mc","frage":"Wer trägt die Kosten für den Notdienst, der den Schaden begrenzt?","optionen":["Frau Demir allein, weil Notdienstkosten vom Versicherer nie übernommen werden.","Der Versicherer, weil er Aufwendungen zur Abwendung und Minderung ersetzt.","Der Versicherer, aber nur, wenn die Maßnahme den Schaden tatsächlich verhindert hat.","Der Notdienst selbst, wenn der Schaden trotz seines Einsatzes eintritt."],"richtig":[1],"erkl":"Rettungskosten werden ersetzt, auch wenn die Maßnahme erfolglos bleibt, soweit die Kundin sie den Umständen nach für geboten halten durfte. Kosten, die auf Weisung des Versicherers entstehen, ersetzt die Proximus unbegrenzt.","norm":"§ 83 VVG; Proximus 5, VHB 2021 Ziff. 17.4 und 17.6","id":"4.5-2-2"}]}]},{"nr":"4.6","titel":"Versicherungsrelevante rechtliche Regelungen rund ums Wohnen","lf":"LF 4","buch":"S. 231–233","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein versichertes Haus wird verkauft. Was geschieht mit der Wohngebäudeversicherung?","optionen":["Der Erwerber tritt mit dem Eigentumsübergang in den Vertrag ein.","Der Verkäufer bleibt bis zum Vertragsende allein Versicherungsnehmer.","Der Vertrag endet automatisch mit Abschluss des Kaufvertrags.","Der Vertrag ruht, bis der Erwerber einen eigenen Antrag stellt."],"richtig":[0],"erkl":"Mit dem Eigentumsübergang (Grundbucheintrag) tritt der Erwerber anstelle des Veräußerers in den Vertrag ein. Für die laufende Versicherungsperiode haften Veräußerer und Erwerber gesamtschuldnerisch für die Prämie.","norm":"§ 95 VVG; Proximus 5, VGB 2021 Ziff. 25.1.1 und 25.1.2","id":"4.6-1-1"},{"typ":"zuo","frage":"Wer darf nach der Veräußerung wie kündigen?","paare":[["Erwerber","mit sofortiger Wirkung oder zum Schluss der laufenden Periode, innerhalb eines Monats nach Erwerb bzw. Kenntnis"],["Versicherer","mit einer Frist von einem Monat, innerhalb eines Monats nach Kenntnis"],["Veräußerer","hat nach dem Verkauf kein Kündigungsrecht mehr aus dem übergegangenen Vertrag"]],"erkl":"Die Kündigungsrechte stehen dem Erwerber und dem Versicherer zu.","norm":"§ 96 VVG; Proximus 5, VGB 2021 Ziff. 25.2.1 und 25.2.2","id":"4.6-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Haftung von Mietern treffen zu?","aussagen":[["Beschädigt ein Mieter grob fahrlässig das Mietobjekt, kann der Vermieter Schadenersatz verlangen.",true],["Schäden an der gemieteten Wohnung sind in der Proximus-Privathaftpflicht als Mietsachschäden eingeschlossen.",true],["Abnutzung durch normalen Gebrauch muss der Mieter ersetzen
