:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.kopfz{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center;text-decoration:none}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}[hidden]{display:none!important}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.hilfe{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--card)}.hilfe>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px}
.hilfe .tw{overflow-x:auto;padding:0 12px 10px;max-width:100%}.hilfe{min-width:0;max-width:100%;overflow:hidden}.box{min-width:0}.hilfe h3{font-size:14px;margin:8px 0 4px}.hilfe table{border-collapse:collapse;font-size:13px;min-width:100%}
.hilfe th,.hilfe td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.hilfe th{background:var(--pill)}.hilfe .hn{font-size:12px;color:var(--mute);margin:4px 0 0}
.art{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 0}
.verdeckt .opt{display:none}.ueb{margin:10px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}.ueb p{margin:0 0 8px}
.stz{font-size:13px;color:var(--mute);margin-top:6px}.stufe{font-size:13px;margin-top:6px;color:var(--mute)}.stufe b{color:var(--ink)}
.hilfe.erkl>div{padding:0 12px 10px;font-size:14px}.hilfe.erkl ol{margin:6px 0;padding-left:20px}
.fuss{max-width:860px;margin:0 auto;padding:4px 16px 32px;font-size:13px;color:var(--mute);display:grid;gap:8px}
.fuss .knoepfe{display:flex;flex-wrap:wrap;gap:8px}.fuss button{font-size:13px;padding:6px 12px}
#app{display:grid;gap:16px}#app>.box{margin-bottom:0}
.box h2{margin-bottom:6px}
.zurueck{font-size:14px;margin:0 0 4px}.zurueck a{color:var(--acc2);text-decoration:none;cursor:pointer;font-weight:600}
/* Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026): Rangkarte (.rk), „Heute dran“ (.hd), Kacheln (.kl), Umschalter (.seg), Knoten-Motiv.
   Nur CD-Werte: --cd-* aus cd.py, Dunkelgrün #223D42, Grün #6FA895, Sekundärfarben, Weiß. Hell und dunkel über die Tokens. */
.lz-knoten{display:block;fill:none;stroke-width:1.3}
.rk{display:grid;gap:14px}
.rk-karte,.rk.kompakt{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:18px;display:grid;gap:12px}
.rk h3{margin:0;font-size:17px}
.rk-kopf{display:flex;gap:16px;align-items:center}
.rk-siegel{flex:none;display:block}
.rk-s-ring{fill:none;stroke:var(--cd-leit);stroke-width:1.5}
.rk-s-feld{fill:var(--cd-akzent-hell)}
.rk-s-rund{font-size:7.6px;font-weight:600;letter-spacing:1.9px;fill:var(--cd-leit)}
.rk-s-knoten path{fill:none;stroke:var(--cd-leit);stroke-width:5}
.rk-s-code{font-weight:700;fill:var(--cd-leit);font-family:var(--cd-schrift)}
.rk-titel{font-size:21px;font-weight:700;line-height:1.2}
.rk.kompakt .rk-titel{font-size:17px}
.rk-score{font-size:14px;font-weight:600;margin-top:2px}
.rk-leise,.rk-skala.leise{font-size:13px;color:var(--cd-leise);line-height:1.45;margin:0}
.rk-skala{display:flex;justify-content:space-between;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rk-balken{position:relative;height:34px}
.rk-spur{position:absolute;left:0;right:0;top:11px;height:12px;border-radius:99px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-fill{position:absolute;left:0;top:10px;height:14px;border-radius:99px;background:var(--cd-akzent);min-width:14px}
.rk-ist{position:absolute;top:3px;width:2px;height:28px;margin-left:-1px;background:var(--cd-leit)}
.rk-ghost{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px dashed var(--cd-leit);box-sizing:border-box;background:var(--cd-flaeche);font-size:10px;font-weight:700;color:var(--cd-leit)}
.rk-balken .rk-ghost{position:absolute;top:6px;margin-left:-11px}
.rk-ghost.gross{width:40px;height:40px;font-size:15px;flex:none}
.rk-fehlt,.rk-ausblick{margin:0;font-size:15px;line-height:1.45}
.rk-ausblick{background:var(--cd-teilweise-flaeche);border:1px solid var(--cd-teilweise);border-radius:10px;padding:8px 12px}
.rk-zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.rk-zahlen>div{background:var(--cd-sunk);border-radius:12px;padding:8px 10px;display:grid;align-content:start}
.rk-zahlen span{font-size:11.5px;color:var(--cd-leise)}.rk-zahlen b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bm{display:flex;gap:12px;align-items:flex-start}
.rk-bm p{margin:4px 0 0;font-size:14.5px;line-height:1.45}.rk-bm .rk-leise{font-size:13px}
.rk-bm-t{font-weight:700}
.rk-leiter{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;min-height:110px}
.rk-stufe{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.rk-saeule{align-self:stretch;border-radius:4px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-stufe.erreicht .rk-saeule{background:var(--cd-akzent);border-color:var(--cd-akzent)}
.rk-stufe.aktuell .rk-saeule{background:var(--cd-leit);border-color:var(--cd-leit)}
.rk-code{font-size:11px;font-weight:700}.rk-ab{font-size:10px;color:var(--cd-leise);font-variant-numeric:tabular-nums}
.rk-stufe:not(.aktuell):not(.erreicht) .rk-code{color:var(--cd-leise)}
.rk-kurs{width:100%;height:auto;display:block;font-family:var(--cd-schrift)}
.rk-k-band{stroke:var(--cd-rand);stroke-width:1}.rk-k-band.ig{stroke-width:1.8}
.rk-k-achse{stroke:var(--cd-leise);stroke-width:1}
.rk-k-txt{font-size:10px;fill:var(--cd-leise)}.rk-k-txt.ig,.rk-k-txt.fett{fill:var(--cd-text);font-weight:700}
.rk-k-ghost{fill:none;stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:5 4}
.rk-k-ist{fill:none;stroke:var(--cd-akzent);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.rk-k-prog{fill:none;stroke:var(--cd-akzent);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.rk-k-punkt{fill:var(--cd-akzent);stroke:var(--cd-flaeche);stroke-width:2}
.rk-k-gpunkt{fill:var(--cd-flaeche);stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:2 2}
.rk-k-pruef{stroke:var(--cd-leit);stroke-width:1.5}
.rk-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--cd-leise)}
.rk-legende span{display:flex;align-items:center;gap:6px}.rk-legende i{display:inline-block;width:18px;height:0;border-top:3px solid var(--cd-akzent)}
.rk-legende i.gh{border-top:2px dashed var(--cd-leit)}.rk-legende i.pr{border-top:2px dotted var(--cd-akzent)}
.rk-mehr{font-weight:600;font-size:14px;justify-self:start}
/* „Heute dran“: in beiden Ansichten Dunkelgrün mit weißer Schrift */
.hd{position:relative;overflow:hidden;background:#223D42;color:#FFFFFF;border-radius:20px;padding:20px;display:grid;gap:8px}
.hd .lz-knoten{position:absolute;right:-56px;top:-30px;width:220px;height:190px;stroke:#6FA895}
.hd>*:not(.lz-knoten){position:relative}
.hd-ober{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#CEE3DD}
.hd-gross{font-size:25px;font-weight:700;line-height:1.2}
.hd p,.hd li{margin:0;font-size:14.5px;line-height:1.45;color:#E9F1ED;max-width:34em}
.hd a{color:#FFFFFF}
.hd-knopf{justify-self:start;margin-top:4px;background:#FFFFFF;color:#223D42 !important;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:12px 20px;border:0;cursor:pointer;font-family:inherit}
.hd-knopf:hover{background:#E9F1ED}
.hd ol{margin:4px 0 0;padding-left:1.2rem;display:grid;gap:4px}
.hd-fertig{display:inline-block;background:#6FA895;color:#223D42;font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px}
/* Kacheln mit Motiv */
.kl-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.kl{text-decoration:none;color:var(--cd-text);background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.kl:hover{border-color:var(--cd-akzent)}
.kl-bild{position:relative;height:84px;overflow:hidden;background:var(--cd-akzent-hell)}
.kl-bild.dunkel{background:#223D42}.kl-bild.gruen{background:#6FA895}.kl-bild.grau{background:#CDD9DF}
.kl-bild .lz-knoten{position:absolute;right:-38px;bottom:-40px;width:150px;height:128px;stroke:var(--cd-flaeche)}
.kl-bild.grau .lz-knoten{stroke:#FFFFFF}
.kl-bild.dunkel .lz-knoten{stroke:#6FA895}.kl-bild.gruen .lz-knoten{stroke:#CEE3DD}
.kl-sym{position:absolute;left:14px;top:14px;width:30px;height:30px;fill:none;stroke:var(--cd-leit);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kl-bild.dunkel .kl-sym{stroke:#FFFFFF}.kl-bild.grau .kl-sym,.kl-bild.gruen .kl-sym{stroke:#223D42}
.kl-neu{position:absolute;right:10px;top:10px;background:#FFFFFF;color:#223D42;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.kl-bild.gruen .kl-neu,.kl-bild.grau .kl-neu,.kl-bild:not(.dunkel) .kl-neu{background:#223D42;color:#FFFFFF}
.kl-text{padding:12px 14px 14px;display:grid;gap:3px}
.kl-titel{font-size:15px;font-weight:700;line-height:1.25}.kl-meta{font-size:12.5px;color:var(--cd-leise)}
/* Umschalter (Segmente) */
.seg{display:flex;gap:4px;background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:14px;padding:4px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:var(--cd-text);cursor:pointer;display:grid;gap:1px;min-height:2.75rem}
.seg button small{font-size:11.5px;font-weight:500;color:var(--cd-leise)}
.seg button[aria-pressed="true"]{background:var(--cd-leit);color:var(--cd-auf-leit)}
.seg button[aria-pressed="true"] small{color:var(--cd-auf-leit)}
/* aufklappbare Zeilen */
.zeilen{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:2px 16px}
.zeilen>details{border-top:1px solid var(--cd-sunk);margin:0}.zeilen>details:first-child{border-top:0}
.zeilen>details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:700}
.zeilen>details>summary::-webkit-details-marker{display:none}
.zeilen>details>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--cd-leit);border-bottom:2px solid var(--cd-leit);transform:rotate(45deg);flex:none;margin-right:4px;transition:transform .15s}
.zeilen>details[open]>summary::after{transform:rotate(225deg)}
.zeilen summary small{display:block;font-weight:500;font-size:13px;color:var(--cd-leise)}
.zeilen>details>.inhalt{padding:0 0 14px}
/* Coach-Zeile und Einführung (seit 11.10.2026) */
.hd-coach{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hd-zweit{background:transparent;color:#FFFFFF !important;border:1px solid #6FA895;border-radius:10px;padding:7px 11px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:2.5rem;display:inline-flex;align-items:center}
.hd-zweit:hover{border-color:#FFFFFF}
.hilfe-link{font-size:13px;font-weight:600;color:var(--cd-link);justify-self:start}
.tour-sperre{position:fixed;inset:0;z-index:999}
.tour-licht{position:fixed;z-index:1000;border-radius:14px;box-shadow:0 0 0 9999px color-mix(in srgb,#132224 72%,transparent);pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s}
.tour-blase{position:fixed;z-index:1001;background:var(--cd-flaeche);color:var(--cd-text);border:1px solid var(--cd-rand);border-radius:16px;padding:16px;width:min(340px,calc(100vw - 24px));box-shadow:var(--cd-schatten);font-family:var(--cd-schrift)}
.tour-blase h2{font-size:18px;margin:2px 0 6px}.tour-blase p{margin:0 0 12px;font-size:15px;line-height:1.45}
.tour-schritt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cd-leise)}
.tour-knoepfe{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tour-knoepfe button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:8px 14px;border:1px solid var(--cd-rand);background:var(--cd-flaeche);color:var(--cd-text);cursor:pointer;min-height:2.6rem}
.tour-knoepfe .tour-vor{background:var(--cd-leit);border-color:var(--cd-leit);color:var(--cd-auf-leit)}
.tour-knoepfe .tour-weg{margin-right:auto;border-color:transparent;color:var(--cd-leise)}
.tour-knoepfe button:disabled{opacity:.4;cursor:default}

@media (max-width:480px){h1{font-size:20px}.num input{width:130px}.brand small{display:none}}
</style>
</head>

<footer class="fuss" id="fuss"><div class="knoepfe"><button data-a="home">Startseite des Trainings</button><button data-a="tour">Einführung</button><a class="btn" id="hilfelink" href="hilfe.html" hidden>So funktioniert die Lernzentrale</a><button data-a="theme">Hell/Dunkel</button><button data-a="reset">Fortschritt zurücksetzen</button></div><div>Ihr Fortschritt bleibt nur in diesem Browser gespeichert. Die Lernzeit zählt nur die aktive Zeit an einer Aufgabe, höchstens drei Minuten je Aufgabe.</div></footer>
<script>
// Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026, Entscheidung Christian, Variante C):
// Rating-Leiter NR–AAA auf dem Score 0–1000 (= Reife × 10), Benchmark („Ghost“) je Klasse, Tempo, Lernzeit, Rangkarte, Knoten-Motiv.
// Eingebunden von Werkzeug/gap1/build.py (Prüfungstraining) und Werkzeug/pass/bau_pass.py (Startseite) über cd.bausteine_js().
// Keine Abhängigkeiten, kein Netz; alle Texte sind feste Bausteintexte (Zahlen werden eingesetzt, nichts aus Nutzereingaben).
const LZRANG = (() => {
  'use strict';
  // [ab Score, Kürzel, Kurztext] – Schwellen: BBB = 60 % Reife (teilweise sicher, „Investment Grade“), AA = 85 % (sicher)
  const LEITER = [
    [0, 'NR', 'Not Rated – noch ohne Bewertung'],
    [10, 'CCC', 'Erste Aufgaben abgerufen'],
    [80, 'B', 'Der Anfang ist gemacht'],
    [250, 'BB', 'Spürbarer Grundstock'],
    [400, 'BB+', 'Knapp vor Investment Grade'],
    [600, 'BBB', 'Investment Grade – prüfungsfähig'],
    [750, 'A', 'Solide prüfungsfähig'],
    [850, 'AA', 'Sicher für die Prüfung'],
    [950, 'AAA', 'Peak – Spitzenbewertung'],
  ];
  const ZIEL_GHOST = 850;          // AA eine Woche vor der Prüfung
  const KURVE = 1.5;               // langsamer Beginn, steiler vor der Prüfung
  const MAX_SEK_JE_AUFGABE = 180;  // aktive Lernzeit: höchstens 3 Minuten je Aufgabe
  const istTag = x => typeof x === 'string' && /^\d{4}-\d\d-\d\d$/.test(x);
  const tagNr = s => { const z = s.split('-').map(Number); return Math.round(Date.UTC(z[0], z[1] - 1, z[2]) / 864e5); };
  const tagIso = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
  const datum = s => { const z = s.split('-'); return +z[2] + '.' + (+z[1]) + '.' + z[0]; };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function score(w, n) { return n ? Math.max(0, Math.min(1000, Math.round(1000 * w / n))) : 0; }
  function rang(s) { let i = 0; LEITER.forEach((x, k) => { if (s >= x[0]) i = k; }); return i; }

  // Benchmark: Soll-Score am Tag heute; g = { von: 'JJJJ-MM-TT' (Ausbildungsbeginn), bis: 'JJJJ-MM-TT' (Prüfung − 7 Tage) }
  function ghost(g, heute) {
    if (!g || !istTag(g.von) || !istTag(g.bis) || !istTag(heute)) return null;
    const a = tagNr(g.von), b = tagNr(g.bis), h = tagNr(heute);
    if (b <= a) return null;
    const x = Math.min(1, Math.max(0, (h - a) / (b - a)));
    return Math.round(ZIEL_GHOST * Math.pow(x, KURVE));
  }
  // Ghost-Parameter aus Klasse und Termin: beginn 'JJJJ-MM', termin 'JJJJ-MM-TT' oder 'JJJJ-MM' (dann der Monatserste)
  function ghostVon(beginn, termin) {
    if (!/^\d{4}-\d\d$/.test(beginn || '') || !/^\d{4}-\d\d(-\d\d)?$/.test(termin || '')) return null;
    const t = termin.length === 7 ? termin + '-01' : termin;
    return { von: beginn + '-01', bis: tagIso(tagNr(t) - 7), pruefung: t };
  }

  // Verlauf { 'JJJJ-MM-TT': Score } bereinigt und sortiert
  function reihe(v) { return Object.keys(v && typeof v === 'object' ? v : {}).filter(k => istTag(k) && typeof v[k] === 'number' && isFinite(v[k])).sort().map(k => [k, v[k]]); }
  // Tempo in Score je Tag: Anstieg über die letzten 14 Tage (mindestens 3 Tage Abstand), sonst null
  function tempo(v, heute, jetzt) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return null;
    const h = tagNr(heute), ziel = h - 14;
    let ab = r[0]; r.forEach(x => { if (tagNr(x[0]) <= ziel) ab = x; });
    const tage = h - tagNr(ab[0]); if (tage < 3) return null;
    const t = ((typeof jetzt === 'number' ? jetzt : r[r.length - 1][1]) - ab[1]) / tage;
    return t > 0 ? t : null;
  }
  // angezeigter Rang: der höchste Rang der letzten 7 Tage; liegt der Score darunter → „Ausblick negativ“ (Abstieg erst nach 7 Tagen)
  function anzeige(s, v, heute) {
    const jetzt = rang(s); let hoch = jetzt;
    const h = tagNr(heute);
    reihe(v).forEach(x => { const d = h - tagNr(x[0]); if (d >= 0 && d <= 6) hoch = Math.max(hoch, rang(x[1])); });
    return { i: hoch, jetzt, ausblick: hoch > jetzt };
  }

  // Lernzeit: Sekunden → „31 h 20 min“ / „45 min“
  function zeit(sek) { const m = Math.round((sek || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; }
  function zeitTage(z, heute, tage) { if (!z || typeof z !== 'object') return 0; const h = tagNr(heute); let s = 0; Object.keys(z).forEach(k => { if (istTag(k) && typeof z[k] === 'number') { const d = h - tagNr(k); if (d >= 0 && d < tage) s += z[k]; } }); return s; }
  // aktive Zeit messen: start() beim Anzeigen einer Aufgabe, stopp() beim Prüfen → Sekunden (Tab im Hintergrund zählt nicht, höchstens 3 Minuten)
  const uhr = (() => { let seit = null, summe = 0;
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { const n = Date.now(); if (document.hidden) { if (seit !== null) { summe += n - seit; seit = null; } } else if (seit === null) seit = n; });
    return { start() { summe = 0; seit = (typeof document !== 'undefined' && document.hidden) ? null : Date.now(); },
      stopp() { const n = Date.now(), ms = summe + (seit !== null ? n - seit : 0); summe = 0; seit = null; return Math.min(MAX_SEK_JE_AUFGABE, Math.max(0, Math.round(ms / 1000))); } }; })();
  function zeitBuchen(S, sek, heute) {
    if (!sek) return; const z = S._zeit && typeof S._zeit === 'object' ? S._zeit : {};
    z[heute] = (typeof z[heute] === 'number' ? z[heute] : 0) + sek;
    const k = Object.keys(z).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 60)).forEach(x => delete z[x]);
    S._zeit = z; S._zeitGes = (typeof S._zeitGes === 'number' ? S._zeitGes : 0) + sek;
  }
  function verlaufBuchen(S, s, heute) {
    const v = S._verlauf && typeof S._verlauf === 'object' ? S._verlauf : {}; v[heute] = s;
    const k = Object.keys(v).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 400)).forEach(x => delete v[x]);
    S._verlauf = v;
  }

  // Knoten aus dem Schul-Icon als Motiv (wie auf Mappe und Design Manual): vergrößert, angeschnitten, nur Strich
  const KNOTEN = ['M100.44,95.07l20.74-20.74c.69-.69,1.81-.69,2.5,0l29.96,29.96c6.42,6.42,6.42,16.82,0,23.23h0c-6.42,6.42-16.82,6.42-23.23,0l-29.96-29.96c-.69-.69-.69-1.81,0-2.5Z',
    'M123.67,74.34l20.74,20.74c.69,.69,.69,1.81,0,2.5l-29.96,29.96c-6.42,6.42-16.82,6.42-23.23,0h0c-6.42-6.42-6.42-16.82,0-23.23l29.96-29.96c.69-.69,1.81-.69,2.5,0Z',
    'M100.44,111.08l20.74,20.74c.69,.69,1.81,.69,2.5,0l29.96-29.96c6.42-6.42,6.42-16.82,0-23.23h0c-6.42-6.42-16.82-6.42-23.23,0l-29.96,29.96c-.69,.69-.69,1.81,0,2.5Z',
    'M123.67,131.82l20.74-20.74c.69-.69,.69-1.81,0-2.5l-29.96-29.96c-6.42-6.42-16.82-6.42-23.23,0h0c-6.42,6.42-6.42,16.82,0,23.23l29.96,29.96c.69,.69,1.81,.69,2.5,0Z'];
  function knoten(klasse) { return '<svg class="' + esc(klasse || 'lz-knoten') + '" aria-hidden="true" focusable="false" viewBox="86 72 73 62">' + KNOTEN.map(d => '<path d="' + d + '"/>').join('') + '</svg>'; }

  // Siegel mit Rating (rund, nach dem Schulsiegel „Schule mit kaufmännischer Tradition“)
  let siegelNr = 0;
  function siegel(code, ziel, gross) {
    const id = 'lzs' + (++siegelNr), s = gross ? 104 : 64;
    return '<svg class="rk-siegel" role="img" aria-label="Rating ' + esc(code) + '" width="' + s + '" height="' + s + '" viewBox="0 0 108 108">' +
      '<defs><path id="' + id + '" d="M54,54 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>' +
      '<circle cx="54" cy="54" r="52" class="rk-s-ring"/><circle cx="54" cy="54" r="37" class="rk-s-feld"/>' +
      (gross ? '<text class="rk-s-rund"><textPath href="#' + id + '">LERNZENTRALE KVF · RATING ' + esc(ziel) + ' · LISTSCHULE ·</textPath></text>' : '') +
      '<g transform="translate(45 ' + (gross ? 25 : 27) + ') scale(0.24)" class="rk-s-knoten">' + KNOTEN.map(d => '<path d="' + d + '" transform="translate(-86 -74)"/>').join('') + '</g>' +
      '<text x="54" y="' + (gross ? 71 : 72) + '" text-anchor="middle" class="rk-s-code" font-size="' + (code.length > 2 ? 24 : 28) + '">' + esc(code) + '</text></svg>';
  }

  // Kursverlauf: Ist, Benchmark, Prognose; Bänder BB, BBB, AA
  function kurs(v, g, heute, tp) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return '';
    const a = tagNr(r[0][0]), h = tagNr(heute);
    const b = g ? Math.max(tagNr(g.bis), h + 7) : h + 30;
    const W = 360, H = 180, x0 = 40, x1 = 348, y0 = 150, y1 = 14;
    const X = t => (x0 + (x1 - x0) * (t - a) / Math.max(1, b - a)).toFixed(1), Y = s => (y0 - (y0 - y1) * Math.min(1000, Math.max(0, s)) / 1000).toFixed(1);
    let o = '<svg class="rk-kurs" role="img" aria-label="Kursverlauf seit ' + datum(r[0][0]) + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    [[250, 'BB'], [600, 'BBB'], [850, 'AA']].forEach(([s, t]) => { o += '<line x1="' + x0 + '" y1="' + Y(s) + '" x2="' + x1 + '" y2="' + Y(s) + '" class="rk-k-band' + (s === 600 ? ' ig' : '') + '"/><text x="' + (x0 - 6) + '" y="' + (+Y(s) + 3.5) + '" text-anchor="end" class="rk-k-txt' + (s === 600 ? ' ig' : '') + '">' + t + '</text>'; });
    o += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1 + '" y2="' + y0 + '" class="rk-k-achse"/>';
    if (g) { const p = []; for (let t = a; t <= b; t += Math.max(1, Math.round((b - a) / 40))) p.push(X(t) + ',' + Y(ghost(g, tagIso(t)))); p.push(X(b) + ',' + Y(ghost(g, tagIso(b)))); o += '<polyline class="rk-k-ghost" points="' + p.join(' ') + '"/>'; }
    o += '<polyline class="rk-k-ist" points="' + r.map(x => X(tagNr(x[0])) + ',' + Y(x[1])).join(' ') + '"/>';
    const jetzt = r[r.length - 1][1];
    if (tp) o += '<polyline class="rk-k-prog" points="' + X(h) + ',' + Y(jetzt) + ' ' + X(b) + ',' + Y(jetzt + tp * (b - h)) + '"/>';
    if (g) o += '<circle cx="' + X(h) + '" cy="' + Y(ghost(g, heute)) + '" r="5" class="rk-k-gpunkt"/>';
    o += '<circle cx="' + X(h) + '" cy="' + Y(jetzt) + '" r="5" class="rk-k-punkt"/>';
    if (+X(h) - x0 > 46) o += '<text x="' + x0 + '" y="166" class="rk-k-txt">' + datum(r[0][0]).replace(/\.\d{2}(\d{2})$/, '.$1') + '</text>'; o += '<text x="' + X(h) + '" y="170" text-anchor="middle" class="rk-k-txt fett">heute</text>';
    if (g) o += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y0 + '" class="rk-k-pruef"/><text x="' + x1 + '" y="10" text-anchor="end" class="rk-k-txt fett">Prüfung ' + datum(g.pruefung) + '</text>';
    return o + '</svg>';
  }

  // Rangkarte als HTML. o = { score, verlauf, heute, ghost (Parameter oder null), zeit: {ges, woche}, lerntage, ziel ('GAP 1'),
  //   kompakt (Startseite), link (Ziel der Karte in kompakter Form), ohneKlasse (Hinweis statt Benchmark), beispiel }
  function karte(o) {
    const s = o.score, V = Object.assign({}, o.verlauf && typeof o.verlauf === 'object' ? o.verlauf : {}); V[o.heute] = s;   // heutiger Stand gehört in den Verlauf
    const A = anzeige(s, V, o.heute), L = LEITER[A.i], N = LEITER[A.i + 1] || null;
    const gs = ghost(o.ghost, o.heute), tp = tempo(V, o.heute, s);
    const von = L[0], bis = N ? N[0] : 1000, pIst = Math.max(0, Math.min(100, 100 * (s - von) / Math.max(1, bis - von)));
    const pG = gs === null ? null : Math.max(3, Math.min(97, 100 * (gs - von) / Math.max(1, bis - von)));   // Marker bleibt sichtbar im Balken
    const fehlt = N ? Math.max(0, N[0] - s) : 0;
    const dauer = n => n <= 13 ? 'etwa ' + n + (n === 1 ? ' Tag' : ' Tage') : 'etwa ' + Math.round(n / 7) + ' Wochen';
    let ziel = A.ausblick ? '<p class="rk-ausblick" data-ausblick=""><b>Ausblick negativ:</b> Ihr Score liegt unter ' + L[0] + '. Bleibt das sieben Tage so, sinkt das Rating auf ' + LEITER[A.jetzt][1] + '. Wiederholen hilft am schnellsten.</p>'
      : N ? '<p class="rk-fehlt" data-fehlt="' + fehlt + '"><b>Noch ' + fehlt + ' bis ' + N[1] + '.</b>' + (tp ? ' Bei Ihrem Tempo ' + dauer(Math.ceil(fehlt / tp)) + '.' : ' Mit regelmäßigen kurzen Lerntagen kommen Sie voran.') + '</p>'
      : '<p class="rk-fehlt" data-fehlt="0"><b>Höchste Stufe erreicht.</b> Halten Sie sie mit kurzen Wiederholungen.</p>';
    let bm = '';
    if (gs !== null) {
      const d = s - gs, steig = (ghost(o.ghost, tagIso(tagNr(o.heute) + 7)) - gs) / 7;
      let satz;
      if (d >= 0) satz = 'Sie liegen <b>' + d + ' vor</b> dem Benchmark – ein Puffer für die Prüfungsphase.';
      else if (tp && tp > steig) satz = 'Der Benchmark liegt <b>' + (-d) + ' vor</b> Ihnen. Bei Ihrem Tempo holen Sie ihn in ' + dauer(Math.ceil(-d / (tp - steig))) + ' ein.';
      else satz = 'Der Benchmark liegt <b>' + (-d) + ' vor</b> Ihnen. Mehrere kurze Lerntage pro Woche bringen Sie heran – 15 bis 25 Minuten genügen.';
      bm = '<div class="rk-bm" data-ghost="' + gs + '"><span class="rk-ghost gross" aria-hidden="true">B</span><div><div class="rk-bm-t">Benchmark heute: ' + LEITER[rang(gs)][1] + ' · ' + gs + '</div><p>' + satz + '</p>' +
        (o.hilfe ? '<p><a class="hilfe-link" href="' + esc(o.hilfe) + '#benchmark">Was ist der Benchmark?</a></p>' : '') +
        (o.kompakt ? '' : '<p class="rk-leise">Der Benchmark ist der Soll-Stand für Ihre Prüfung am ' + datum(o.ghost.pruefung) + ': Er beginnt mit der Ausbildung langsam und steht eine Woche vor der Prüfung auf AA.</p>') + '</div></div>';
    } else if (o.ohneKlasse) bm = '<p class="rk-leise" data-ghost="">Den Benchmark sehen Sie, sobald Sie auf der Startseite der Lernzentrale Ihre Klasse gewählt haben.</p>';
    const balken = '<div class="rk-skala"><span>' + L[1] + ' · ' + von + '</span><span>' + (N ? N[1] + ' · ' + N[0] : '1000') + '</span></div>' +
      '<div class="rk-balken" role="img" aria-label="Score ' + s + ' zwischen ' + von + ' und ' + bis + (gs !== null ? ', Benchmark ' + gs : '') + '"><span class="rk-spur"></span><span class="rk-fill" style="width:' + pIst.toFixed(1) + '%"></span><span class="rk-ist" style="left:' + pIst.toFixed(1) + '%"></span>' +
      (pG !== null ? '<span class="rk-ghost" style="left:' + pG.toFixed(1) + '%">B</span>' : '') + '</div>' +
      '<div class="rk-skala leise"><span>Sie: ' + s + '</span>' + (gs !== null ? '<span>Benchmark: ' + gs + '</span>' : '<span></span>') + '</div>';
    const kopf = '<div class="rk-kopf">' + siegel(L[1], o.ziel, !o.kompakt) + '<div><div class="rk-titel">Rating ' + L[1] + (o.kompakt ? ' · Score ' + s : '') + '</div><div class="rk-leise">' + L[2] + '</div>' + (o.kompakt ? '' : '<div class="rk-score">Score ' + s + ' von 1000</div>') + '</div></div>';
    const hl = o.hilfe ? '<a class="hilfe-link" href="' + esc(o.hilfe) + '#score" data-hilfe="score">Was bedeuten Score und Rating?</a>' : '';
    if (o.kompakt) return '<div class="rk kompakt" data-rang="' + L[1] + '" data-score="' + s + '">' + kopf + balken + ziel + hl + bm + (o.link ? '<a class="rk-mehr" href="' + esc(o.link) + '">Rating, Rangleiter und Kursverlauf</a>' : '') + '</div>';
    const zeitbox = '<div class="rk-zahlen"><div><span>Lernzeit gesamt</span><b data-lernzeit="' + Math.round((o.zeit && o.zeit.ges) || 0) + '">' + zeit(o.zeit && o.zeit.ges) + '</b></div><div><span>letzte 7 Tage</span><b>' + zeit(o.zeit && o.zeit.woche) + '</b></div>' +
      (typeof o.lerntage === 'number' ? '<div><span>Lerntage</span><b>' + o.lerntage + ' / 28</b></div>' : '') + '</div>';
    const leiter = '<div class="rk-leiter" role="img" aria-label="Rangleiter von NR bis AAA, aktuell ' + L[1] + '">' + LEITER.map((x, k) => '<div class="rk-stufe' + (k < A.i ? ' erreicht' : k === A.i ? ' aktuell' : '') + '">' +
      (gs !== null && rang(gs) === k ? '<span class="rk-ghost">B</span>' : '') + '<span class="rk-saeule" style="height:' + (14 + k * 7) + 'px"></span><span class="rk-code">' + x[1] + '</span><span class="rk-ab">' + x[0] + '</span></div>').join('') + '</div>' +
      '<p class="rk-leise">Ab BBB „Investment Grade“: prüfungsfähig. Ab AA: sicher. Score = Reife × 10. Ein Rating sinkt erst, wenn der Score sieben Tage unter der Schwelle bleibt.</p>';
    const r = reihe(V);
    const kv = r.length && tagNr(o.heute) - tagNr(r[0][0]) >= 13 ? kurs(V, gs !== null ? o.ghost : null, o.heute, tp) +
      '<div class="rk-legende"><span><i class="ist"></i>Sie</span>' + (gs !== null ? '<span><i class="gh"></i>Benchmark</span>' : '') + (tp ? '<span><i class="pr"></i>Prognose bei Ihrem Tempo</span>' : '') + '</div>'
      : '<p class="rk-leise" data-kurs="leer">Den Kursverlauf zeigt die Karte nach zwei Wochen Übung.</p>';
    return '<div class="rk" data-rang="' + L[1] + '" data-score="' + s + '">' +
      '<section class="rk-karte">' + kopf + balken + ziel + zeitbox + hl + '</section>' +
      (bm ? '<section class="rk-karte">' + bm + '</section>' : '') +
      '<section class="rk-karte"><h3>Rangleiter</h3>' + leiter + '</section>' +
      '<section class="rk-karte"><h3>Kursverlauf</h3>' + kv + '</section></div>';
  }

  return { LEITER, ZIEL_GHOST, score, rang, ghost, ghostVon, tempo, anzeige, zeit, zeitTage, uhr, zeitBuchen, verlaufBuchen, knoten, siegel, karte, tagNr, tagIso };
})();

// ------------------------------------------------------------------ Coach (seit 11.10.2026, Entscheidung Christian: regelbasiert, ohne KI, ohne Netz)
// Ein Hinweis je Besuch, der wichtigste zuerst. Die Seite zeichnet ihn im Kasten „Heute dran“; knopf.ziel: rep | tour | neu | sim.
const LZCOACH = (() => {
  'use strict';
  // c = { tourGesehen, faellig, fehlt, naechster, ausblick, rang, tageOhne (Tage seit dem letzten Lerntag, null = nie), hinterBm (Abstand, 0 = vorn),
  //       simAnz, reife (%), minHeute, neu (Text der nächsten neuen Lektion oder null) }
  function tipp(c) {
    const n = c.faellig | 0, nah = typeof c.fehlt === 'number' && c.naechster && c.naechster !== 'CCC' && c.fehlt > 0 && c.fehlt <= 20;   // „fast“ erst ab dem ersten Rating
    // Einführung als Haupthinweis nur beim allerersten Besuch (noch nie geübt, nichts fällig); sonst bietet die Seite sie als Zweitknopf an
    if (!c.tourGesehen && c.tageOhne === null && !n) return { id: 'einfuehrung', titel: 'Willkommen in der Lernzentrale', text: 'In zwei Minuten zeigt die Einführung, wie „Heute dran“, Rating, Benchmark und Trainingspunkte zusammenhängen.', knopf: { label: 'Einführung starten', ziel: 'tour' } };
    if (c.ausblick) return { id: 'ausblick', titel: 'Ihr ' + c.rang + ' wackelt', text: 'Ihr Score liegt unter der Schwelle für ' + c.rang + '. Bleibt das sieben Tage so, sinkt das Rating. Eine Runde Wiederholen sichert es am schnellsten.', knopf: n ? { label: 'Jetzt wiederholen', ziel: 'rep' } : { label: 'Weiter üben', ziel: 'neu' } };
    if (n) {
      const text = nah ? 'Noch ' + c.fehlt + ' bis ' + c.naechster + ' – eine Runde kann schon reichen.'
        : (c.tageOhne !== null && c.tageOhne >= 3 && c.hinterBm > 0) ? 'Schön, dass Sie wieder da sind. Eine Runde bringt Sie dem Benchmark näher.'
          : 'Eine Runde: bis zu 15 Aufgaben gemischt aus allen Bereichen. Erst selbst überlegen, dann die Möglichkeiten ansehen.';
      return { id: nah ? 'faellig-nah' : 'faellig', titel: n + (n === 1 ? ' Aufgabe' : ' Aufgaben') + ' fällig', text, knopf: { label: 'Jetzt wiederholen', ziel: 'rep' } };
    }
    if ((c.minHeute | 0) >= 15) return { id: 'fertig', titel: 'Fertig für heute', text: 'Heute ' + c.minHeute + ' Minuten geübt. Der Rest passiert im Schlaf – morgen geht es weiter.', knopf: c.neu ? { label: 'Trotzdem weiter', ziel: 'neu' } : null };
    if (!(c.simAnz | 0) && (c.reife | 0) >= 25) return { id: 'simulation', titel: 'Zeit für eine Generalprobe', text: 'Testen Sie sich mit der Prüfungssimulation: ' + ((c.simN | 0) || 20) + ' Aufgaben gemischt wie in der Prüfung, Auswertung je Bereich.', knopf: { label: 'Simulation starten', ziel: 'sim' } };
    if (nah) return { id: 'nah', titel: 'Fast ' + c.naechster, text: 'Noch ' + c.fehlt + ' bis ' + c.naechster + '. Eine neue Lektion heute, morgen die Wiederholung – dann steigen Sie auf.', knopf: { label: 'Neue Lektion starten', ziel: 'neu' } };

    return { id: 'weiter', titel: c.tageOhne === null ? 'Los geht’s' : 'Ihr nächster Schritt', text: c.neu ? 'Heute ist nichts fällig. Als Nächstes: ' + c.neu + '.' : 'Alles bearbeitet. Halten Sie Ihren Stand mit der Simulation und den Wiederholungen.', knopf: c.neu ? { label: 'Neue Lektion starten', ziel: 'neu' } : { label: 'Simulation starten', ziel: 'sim' } };
  }
  // Text für „Meinen Stand kopieren“ (ohne Namen; für den Lerncoach in AIS.chat)
  function standText(o) {
    const t = ['Mein Stand im Prüfungstraining ' + o.ziel + ': Rating ' + o.rang + ' (Score ' + o.score + ' von 1000)'];

    if (typeof o.gs === 'number') t.push('Benchmark ' + o.gs + ' (' + (o.score >= o.gs ? (o.score - o.gs) + ' hinter mir' : (o.gs - o.score) + ' vor mir') + ')');
    if (typeof o.lerntage === 'number') t.push(o.lerntage + (o.lerntage === 1 ? ' Lerntag' : ' Lerntage') + ' in den letzten 28 Tagen');
    return t.join(', ') + '.';
  }
  function kopieren(text, knopf) {
    const fertig = () => { if (knopf) { knopf.textContent = 'Kopiert ✓'; knopf.setAttribute('data-kopiert', ''); } };
    const ersatz = () => { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* manuell */ } ta.remove(); fertig(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(fertig, ersatz); else ersatz();
  }
  // Coach-Link (AIS.chat) und Benchmark merkt die Startseite in 'pruefungspass-v1'; nur Links von app.ais-chat.schule
  const linkOk = l => typeof l === 'string' && /^https:\/\/app\.ais-chat\.schule\/[\w\-./?=&%#]*$/.test(l);
  return { tipp, standText, kopieren, linkOk };
})();

t."],"richtig":[3],"erkl":"Das Gebäude dient als Kreditsicherheit (Grundschuld); die Bank will es gegen Zerstörung abgesichert wissen.","norm":"Grundlagen","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Auswirkungen von Entwicklungstrends auf die Versicherungswirtschaft","lf":"LF 1 / LF 2","buch":"S. 13–18","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Trend eine typische Folge für Versicherer zu.","paare":[["Klimawandel","mehr und höhere Schäden durch Starkregen, Hochwasser und Sturm"],["Demografischer Wandel","wachsender Bedarf an privater Alters- und Pflegevorsorge"],["Digitalisierung","Onlineabschluss, digitale Schadenmeldung, neue Wettbewerber (Insurtechs)"],["Inflation","steigende Wiederherstellungskosten und Gefahr der Unterversicherung"]],"erkl":"Trends verändern Produkte, Prämien und Vertriebswege; Berater müssen Bestände daraufhin prüfen.","norm":"Grundlagen","id":"1.2-1-1"},{"typ":"mc","frage":"Ein Kunde möchte eine fondsgebundene Rentenversicherung abschließen. Was müssen Sie seit 2022 im Beratungsgespräch zusätzlich erfragen?","optionen":["Seine Zustimmung zur Datenweitergabe an Vergleichsportale.","Seine Schadenfreiheitsklasse in der Kfz-Versicherung.","Seine Nachhaltigkeitspräferenzen.","Seinen Verzicht auf das Widerrufsrecht."],"richtig":[2],"erkl":"Bei Versicherungsanlageprodukten gehören die Nachhaltigkeitspräferenzen zur Geeignetheitsprüfung.","norm":"Delegierte VO (EU) 2017/2359, geändert durch Delegierte VO (EU) 2021/1257; § 7c VVG","id":"1.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Digitalisierung in der Versicherungswirtschaft treffen zu?","aussagen":[["Telematiktarife in der Kfz-Versicherung belohnen ein vorsichtiges Fahrverhalten.",true],["Künstliche Intelligenz kann einfache Schadenfälle automatisch prüfen.",true],["Durch Vergleichsportale wird der Markt für Kunden transparenter.",true],["Bei einem Onlineabschluss gelten keine Informationspflichten.",false]],"erkl":"Auch im Fernabsatz gel eine Nachhaltigkeit nach gesetzlichen Vorgaben.",true]],"erkl":"ESG umfasst Umwelt (Environment), Soziales (Social) und gute Unternehmensführung (Governance).","norm":"Offenlegungs-VO (EU) 2019/2088","id":"1.2-2-2"},{"typ":"mc","frage":"Ein Kunde meint, der Klimawandel betreffe ihn nicht, er wohne ja nicht an einem Fluss. Welche Antwort ist fachlich richtig?","optionen":["Gegen Folgen des Klimawandels kann man sich in Deutschland nicht versichern; hier hilft nur der Staat.","Ohne Fluss in der Nähe sind Überschwemmungsschäden durch Starkregen praktisch ausgeschlossen.","Überschwemmung durch Starkregen ist in jeder Wohngebäudeversicherung automatisch mitversichert.","Starkregen kann überall zu Überschwemmung führen; dagegen hilft der Einschluss weiterer Naturgefahren."],"richtig":[3],"erkl":"Überschwemmung durch Starkregen und Rückstau gehören zu den Elementargefahren und müssen gesondert vereinbart werden.","norm":"Proximus 5, VGB 2021 Ziff. 1.3.2 und 5.4, VHB 2021 Ziff. 6.4 (weitere Naturgefahren, soweit zusätzlich vereinbart)","id":"1.2-2-3"}]}]},{"nr":"1.3","titel":"Prüfungsfälle: Versicherungswirtschaft und Trends","lf":"LF 1","buch":"S. 8–18","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Bäckerei Okonkwo – wozu Versicherung?","situation":"Ada Okonkwo (41) führt in Halle (Saale) eine Bäckerei mit zwölf Beschäftigten. Für Betriebsgebäude, Inventar, Betriebshaftpflicht und Betriebsunterbrechung zahlt sie zusammen 6.400,00 € Beitrag im Jahr. Für einen neuen Backofen (85.000,00 €) verlangt ihre Bank vor der Auszahlung des Kredits den Nachweis einer Feuerversicherung. Im Jahresgespräch fragt sie: „Was habe ich – und was hat die Allgemeinheit – eigentlich von all diesen Versicherungen?“","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Funktion der Versicherung das passende Beispiel aus der Lage von Frau Okonkwo zu.","paare":[["Risikoübernahme (Schutzfunktion)","Ein Großbrand zerstört die Backstube; der Versicherer ersetzt den Schaden."],["Kreditsicherungsfunktion","Die Bank finanziert den Backofen nur bei nachgewiesenem Feuerschutz."],["Kapitalanlagefunktion","Der Versicherer legt die Beiträge vieler Kunden in Anleihen und Immobilien an."],["Schadenverhütung (Prävention)","Der Versicherer berät zu Rauchmeldern und Brandschutz in der Backstube."]],"erkl":"Versicherer übernehmen Risiken, sichern Kredite ab, sammeln Kapital und legen es an und helfen, Schäden zu vermeiden. Die Bank will ihre Sicherheit (Backofen, Gebäude) gegen Zerstörung geschützt wissen.","norm":"§ 1 VVG; § 124 VAG","id":"1.3-1-1"},{"typ":"wf","frage":"Welche Aussagen beschreiben die gesamtwirtschaftliche (volkswirtschaftliche) Bedeutung der Versicherung zutreffend?","aussagen":[["Weil Schäden ersetzt werden, können zerstörte Betriebe weiterarbeiten; Arbeitsplätze und Steuereinnahmen bleiben erhalten.",true],["Versicherer beschäftigen viele Menschen im Innen- und Außendienst und sind ein bedeutender Arbeitgeber.",true],["Die Versicherungsteuer auf die Beiträge ist eine Einnahme des Staates.",true],["Die gesamtwirtschaftliche Bedeutung liegt allein darin, dass einzelne Kunden ihre Schäden ersetzt bekommen.",false]],"erkl":"Gesamtwirtschaftlich sichern Versicherer Produktion, Arbeitsplätze und Investitionen und bringen Steuereinnahmen. Der Ersatz des einzelnen Schadens ist dagegen der einzelwirtschaftliche Nutzen.","norm":"VersStG; Grundlagen Versicherungswirtschaft","id":"1.3-1-2"},{"typ":"mc","frage":"Welches Argument beschreibt den einzelwirtschaftlichen Nutzen für Frau Okonkwo am treffendsten?","optionen":["Sie tauscht ein ungewisses, möglicherweise existenzbedrohendes Risiko gegen feste Beiträge.","Sie erhält ihre Beiträge nach einigen schadenfreien Jahren vollständig zurückerstattet.","Die Beiträge mindern ihre Steuerlast so stark, dass die Versicherung sie nichts kostet.","Mit Versicherung muss sie sich um den Brandschutz in der Backstube nicht mehr kümmern."],"richtig":[0],"erkl":"Einzelwirtschaftlich macht Versicherung das Risiko planbar: Statt eines ungewissen Großschadens trägt der Betrieb einen festen, kalkulierbaren Beitrag. Beiträge werden nicht angespart und zurückgezahlt; Sicherheitspflichten bleiben bestehen.","norm":"§ 1 VVG","id":"1.3-1-3"},{"typ":"zahl","frage":"Ohne Versicherung müsste Frau Okonkwo für einen möglichen Brandschaden von 640.000,00 € selbst vorsorgen. Wie vielen Jahresbeiträgen von 6.400,00 € entspricht dieser Betrag?","wert":100,"einheit":"Jahresbeiträge","tol":0,"erkl":"640.000,00 € : 6.400,00 € = 100. Sie müsste also 100 Jahre lang zurücklegen – ein Brand kann aber schon morgen eintreten. Die Versicherung übernimmt das Risiko sofort ab Vertragsbeginn.","norm":"§ 1 VVG","id":"1.3-1-4"}]},{"typ":"situation","titel":"Fall 2: Proximus Versicherung – Risikoausgleich bei Feuerschäden","situation":"Die Proximus Versicherung AG versichert in Sachsen-Anhalt 20.000 vergleichbare Einfamilienhäuser gegen Feuer. Aus der Statistik weiß sie: Im Durchschnitt brennt es jährlich in 0,15 % der Häuser, ein Brandschaden kostet im Durchschnitt 80.000,00 €. Im Jahr 2025 gab es 41 Brände, im Jahr 2024 nur 22. Die Auszubildende Marlene Fuchs soll Kunden erklären, wie der Versicherer trotz solcher Schwankungen zuverlässig zahlen kann.","items":[{"typ":"zahl","frage":"Wie viele Brandschäden erwartet der Versicherer bei 20.000 Häusern und einer Schadenwahrscheinlichkeit von 0,15 % statistisch im Jahr?","wert":30,"einheit":"Schäden","tol":0,"erkl":"20.000 × 0,15 % = 20.000 × 0,0015 = 30 erwartete Brandschäden im Jahr.","norm":"Grundlagen Prämienkalkulation","id":"1.3-2-1"},{"typ":"zahl","frage":"Bei 20.000 Häusern, einer Schadenwahrscheinlichkeit von 0,15 % und einem Durchschnittsschaden von 80.000,00 €: Wie hoch ist die reine Risikoprämie (ohne Kosten, Sicherheitszuschlag und Gewinn) je Haus und Jahr?","wert":120.0,"einheit":"€","tol":0.01,"erkl":"Erwarteter Gesamtschaden: 30 × 80.000,00 € = 2.400.000,00 €. Verteilt auf 20.000 Häuser: 2.400.000,00 € : 20.000 = 120,00 €. Kürzer: 0,0015 × 80.000,00 € = 120,00 €.","norm":"Grundlagen Prämienkalkulation","id":"1.3-2-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff des Risikoausgleichs die passende Beschreibung zu.","paare":[["Risikoausgleich im Kollektiv","Die Beiträge der vielen schadenfreien Kunden finanzieren die Schäden der wenigen Betroffenen."],["Risikoausgleich in der Zeit","Überschüsse aus schadenarmen Jahren werden zurückgestellt und in schadenreichen Jahren verbraucht."],["Gesetz der großen Zahl","Je mehr gleichartige Risiken versichert sind, desto näher liegt der tatsächliche am erwarteten Schadenverlauf."],["Rückversicherung","Der Erstversicherer gibt einen Teil seiner Großrisiken gegen Prämie an ein anderes Unternehmen ab."]],"erkl":"Schwankungen wie 22 oder 41 Brände gleicht der Versicherer über das Kollektiv, über mehrere Jahre (Schwankungsrückstellung) und über Rückversicherung aus.","norm":"§ 341h HGB","id":"1.3-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Schwankungsrückstellung eines Schadenversicherers treffen zu?","aussagen":[["Sie dient dazu, Schwankungen im Schadenverlauf künftiger Jahre auszugleichen.",true],["Eine Voraussetzung für ihre Bildung ist, dass im Versicherungszweig mit erheblichen Schwankungen der jährlichen Schadenaufwendungen zu rechnen ist.",true],["Aus ihr zahlt der Versicherer am Jahresende die Beiträge schadenfreier Kunden zurück.",false],["Sie macht eine Rückversicherung in jedem Fall überflüssig.",false]],"erkl":"Die Schwankungsrückstellung ist das Werkzeug des Risikoausgleichs in der Zeit. Sie wird u. a. nur gebildet, soweit Schwankungen nicht durch Rückversicherung gedeckt sind – beide Instrumente ergänzen sich.","norm":"§ 341h Abs. 1 HGB","id":"1.3-2-4"}]},{"typ":"situation","titel":"Fall 3: Nachhaltigkeitsbericht der Proximus Versicherung","situation":"Die Proximus Versicherung AG veröffentlicht ihren Nachhaltigkeitsbericht. Von 4,0 Mrd. € Kapitalanlagen sind 600 Mio. € in Wind- und Solarparks investiert; Unternehmen, die mehr als 25 % ihres Umsatzes mit Kohle erzielen, sind von der Anlage ausgeschlossen. In der Kfz-Kasko werden kleine Lackschäden bevorzugt repariert, statt Teile zu tauschen. Kunde Tobias Brandt (38) fragt in der Agentur, ob das „nur Werbung“ sei, und interessiert sich für eine fondsgebundene Rentenversicherung mit nachhaltigen Fonds.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Maßnahme dem passenden ESG-Bereich zu.","paare":[["Ausschluss von Kohleunternehmen aus der Kapitalanlage","Environment (Umwelt)"],["faire Bezahlung, Weiterbildung und Gesundheitsschutz für alle Beschäftigten","Social (Soziales)"],["unabhängige Kontrolle der Geschäftsleitung und ein Hinweisgebersystem gegen Korruption","Governance (Unternehmensführung)"]],"erkl":"ESG steht für Environment, Social, Governance. Nachhaltigkeit betrifft damit Kapitalanlage, Personal und die Art, wie ein Unternehmen geführt und kontrolliert wird.","norm":"Grundlagen ESG; Offenlegungs-VO (EU) 2019/2088, Art. 2 Nr. 17 und 24","id":"1.3-3-1"},{"typ":"zahl","frage":"Wie viel Prozent der Kapitalanlagen der Proximus Versicherung AG sind in Wind- und Solarparks investiert?","wert":15,"einheit":"%","tol":0,"erkl":"600 Mio. € : 4.000 Mio. € × 100 = 15 %.","norm":"Rechenweg Prozentanteil","id":"1.3-3-2"},{"typ":"mc","frage":"Herr Brandt liest im Fondsprospekt: „Produkt nach Artikel 9 der Offenlegungsverordnung“. Was bedeutet das?","optionen":["Der Fonds strebt nachhaltige Investitionen ausdrücklich als Anlageziel an.","Der Fonds bewirbt ökologische Merkmale, hat aber kein nachhaltiges Anlageziel.","Der Fonds garantiert eine höhere Rendite als vergleichbare herkömmliche Fonds.","Der Fonds wurde von der BaFin geprüft und als risikofreie Anlage eingestuft."],"richtig":[0],"erkl":"Art.-9-Produkte haben nachhaltige Investitionen zum Ziel („dunkelgrün“); Art.-8-Produkte bewerben nur ökologische oder soziale Merkmale („hellgrün“). Eine Rendite- oder Sicherheitsgarantie ist damit nicht verbunden.","norm":"Art. 8, Art. 9 Offenlegungs-VO (EU) 2019/2088","id":"1.3-3-3"},{"typ":"wf","frage":"Welche Aussagen zur Nachhaltigkeit bei der Proximus Versicherung AG treffen zu?","aussagen":[["Reparatur statt Austausch in der Schadenregulierung spart Ressourcen und kann Kosten senken.",true],["Wirbt der Versicherer mit unwahren Umweltaussagen, kann das eine unlautere irreführende geschäftliche Handlung sein.",true],["Auch bei Nachhaltigkeitszielen muss die Kapitalanlage Sicherheit, Qualität, Liquidität und Rentabilität des Portfolios sichern.",true],["Nachhaltigkeit betrifft nur die Kapitalanlage, nicht die Unternehmensführung oder die Schadenregulierung.",false]],"erkl":"Nachhaltigkeit wirkt in alle Bereiche. Die Anlagegrundsätze des VAG gelten weiter; „Greenwashing“ mit falschen Angaben ist irreführende Werbung.","norm":"§ 124 Abs. 1 Nr. 2 VAG; § 5 UWG","id":"1.3-3-4"}]},{"typ":"situation","titel":"Fall 4: Jannik Schreiber – Abschluss im Netz","situation":"Jannik Schreiber (24) aus Halle (Saale) sucht eine Hausratversicherung. Er vergleicht Tarife auf einem Vergleichsportal, über das er direkt abschließen kann. Die Proximus Versicherung AG bietet auf ihrer Website zusätzlich einen digitalen Berater (Robo-Advice) an, der Fragen stellt und einen Tarif empfiehlt. Kleine Schäden bis 1.500,00 € reguliert sie per App vollautomatisch (Dunkelverarbeitung). Jannik möchte direkt beim Versicherer online abschließen, ohne beraten zu werden.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem digitalen Angebot die passende Beschreibung zu.","paare":[["Robo-Advice","Ein Programm fragt Bedarf und Wünsche ab und empfiehlt automatisiert ein Produkt."],["Vergleichsportal","Eine Website stellt Tarife mehrerer Anbieter nach gewählten Kriterien in einer Rangliste dar."],["Dunkelverarbeitung","Ein Vorgang wird ohne menschliches Eingreifen vollständig automatisch bearbeitet."],["Chatbot","Ein textbasiertes Dialogsystem beantwortet rund um die Uhr Fragen von Kunden."]],"erkl":"Digitale Werkzeuge verändern Vertrieb (Portale, Robo-Advice), Service (Chatbot) und Schadenbearbeitung (Dunkelverarbeitung).","norm":"§ 34d Abs. 1 GewO; Art. 22 DSGVO","id":"1.3-4-1"},{"typ":"mc","frage":"Wie ist das Vergleichsportal, über das Jannik direkt abschließen kann, rechtlich einzuordnen?","optionen":["Es vermittelt Versicherungen und braucht eine Erlaubnis als Versicherungsvermittler.","Es ist ein reines Werbemedium und unterliegt keinerlei Pflichten für Vermittler.","Es ist eine Behörde, die Tarife im Auftrag der BaFin neutral miteinander vergleicht.","Es ist selbst Versicherer und trägt die Risiken aller verglichenen Tarife selbst."],"richtig":[0],"erkl":"Erstellt eine Website Ranglisten oder Preisvergleiche und kann der Kunde darüber abschließen, ist das Vermittlung. Das Portal braucht die Erlaubnis der IHK und unterliegt den Vermittlerpflichten.","norm":"§ 34d Abs. 1 Satz 4 Nr. 2 GewO","id":"1.3-4-2"},{"typ":"mc","frage":"Jannik möchte beim Onlineabschluss direkt beim Versicherer auf die Beratung verzichten. Welche Form genügt?","optionen":["Textform, weil es ein Fernabsatzvertrag ist; der Warnhinweis bleibt nötig.","Nur eine notariell beglaubigte Erklärung mit eigenhändiger Unterschrift.","Keine; das Absenden des Onlineantrags gilt automatisch als Verzicht.","Ein Verzicht ist online nicht möglich; der Versicherer muss anrufen."],"richtig":[0],"erkl":"Grundsätzlich ist eine gesonderte schriftliche Verzichtserklärung mit Warnhinweis nötig. Bei Verträgen im Fernabsatz genügt der Verzicht in Textform; der Hinweis auf mögliche Nachteile bleibt Pflicht.","norm":"§ 6 Abs. 3 VVG","id":"1.3-4-3"},{"typ":"wf","frage":"Welche Aussagen zur Dunkelverarbeitung der Schadenmeldungen treffen zu?","aussagen":[["Zahlt das System den gemeldeten Schaden vollständig aus, ist die vollautomatische Entscheidung im Versicherungsvertrag zulässig.",true],["Lehnt das System einen Schaden vollautomatisch ab, muss Jannik zumindest eine Überprüfung durch einen Menschen verlangen können.",true],["Dunkelverarbeitung beschleunigt einfache Schadenfälle und senkt die Verwaltungskosten.",true],["Für vollautomatische Entscheidungen gilt die DSGVO nicht, weil kein Mensch beteiligt ist.",false]],"erkl":"Die DSGVO schützt vor rein automatisierten Entscheidungen. Im Versicherungsvertrag sind sie erlaubt, wenn dem Begehren voll entsprochen wird; sonst braucht es Schutzmaßnahmen wie das Recht auf Eingreifen einer Person.","norm":"Art. 22 DSGVO; § 37 Abs. 1 BDSG","id":"1.3-4-4"}]},{"typ":"situation","titel":"Fall 5: Agentur Wolff – Demografie und Klimawandel","situation":"Die Agentur von Irina Wolff in Halle (Saale) plant ihre Schwerpunkte für 2027. Ihr Bestand altert: Ein Drittel der Kunden ist älter als 60 Jahre. Gleichzeitig häufen sich Starkregenschäden in der Region. Familie Hamdan hat für ihr Einfamilienhaus in Halle (Saale) eine Wohngebäudeversicherung bei der Proximus Versicherung AG ohne Elementarschutz; Vorschäden gab es in den letzten zehn Jahren nicht. Beim Einschluss weiterer Naturgefahren gelten laut Tarif eine Wartezeit von einem Monat und eine Selbstbeteiligung von 500,00 € je Versicherungsfall.","items":[{"typ":"mc","frage":"Nach welchem Merkmal ordnet die Proximus Versicherung AG das Haus der Familie Hamdan für die weiteren Naturgefahren einer Tarifzone zu?","optionen":["Nach der Postleitzahl; ohne Vorschaden in zehn Jahren gilt hier Tarifzone I.","Nach der Bauartklasse; massive Häuser kommen stets in die günstigste Zone.","Nach dem Baujahr; Häuser vor 1914 sind von Naturgefahren ausgeschlossen.","Nach der Wohnfläche; Häuser über 150 m² kommen stets in Tarifzone II."],"richtig":[0],"erkl":"Der Tarif Wohngebäude teilt die weiteren Naturgefahren nach Postleitzahlen in Zone I und II ein. Halle (Saale) (PLZ 06…) steht nicht in der Liste der Zone II; ohne Vorschaden in den letzten zehn Jahren gilt Zone I. Bei zwei oder mehr Vorschäden in zehn Jahren übernimmt der Versicherer das Risiko nicht. Starkregen kann überall auftreten – der Einschluss bleibt sinnvoll.","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 1.3 und 6.4","id":"1.3-5-1"},{"typ":"zahl","frage":"Familie Hamdan schließt die weiteren Naturgefahren ein. Nach Ablauf der Wartezeit verursacht ein Starkregen eine Überschwemmung mit einem versicherten Schaden von 32.000,00 €. Wie viel Euro zahlt der Versicherer nach Abzug der Selbstbeteiligung?","wert":31500.0,"einheit":"€","tol":0.01,"erkl":"Für die weiteren Naturgefahren gilt laut Tarif eine feste Selbstbeteiligung von 500,00 € je Versicherungsfall: 32.000,00 € − 500,00 € = 31.500,00 €. Der Schutz beginnt erst nach einer Wartezeit von einem Monat ab dem beantragten Beginn.","norm":"Proximus 5, VGB 2021 Ziff. 5.4 und 5.4.1; Tarif Wohngebäude Ziff. 6.2 und 6.3","id":"1.3-5-2"},{"typ":"wf","frage":"Welche Aussagen zum demografischen Wandel treffen zu?","aussagen":[["Weil immer weniger Beitragszahler immer mehr Rentner finanzieren, gerät das Umlageverfahren der gesetzlichen Rentenversicherung unter Druck.",true],["Mit der wachsenden Zahl Pflegebedürftiger steigt der Bedarf an privater Pflegezusatzversicherung.",true],["Für ältere Kunden gewinnen Hilfsleistungen nach einem Unfall wie Menüservice oder Wohnungsreinigung an Bedeutung.",true],["Der demografische Wandel betrifft nur Lebensversicherer, nicht die Arbeit einer Agentur.",false]],"erkl":"Eine alternde Gesellschaft verändert Bedarf (Alters- und Pflegevorsorge, Assistance), Kundenansprache und Personalgewinnung in allen Sparten. Die Unfallversicherung der Proximus bietet z. B. Hilfs- und Pflegeleistungen (Assistance) nach einem Unfall.","norm":"§ 153 SGB VI (Umlageverfahren); Proximus 5, AUB 2022 Ziff. 2.9.5.2","id":"1.3-5-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Trend eine passende Antwort der Agentur zu.","paare":[["häufigere Starkregen und Hitzeperioden (Klimawandel)","Einschluss weiterer Naturgefahren (u. a. Überschwemmung, Rückstau)"],["alternde Kundschaft (demografischer Wandel)","Unfallversicherung im Seniorentarif mit Hilfs- und Pflegeleistungen"],["weniger junge Bewerber für den Außendienst (Fachkräftemangel)","eigene Ausbildung und digitale Beratungswege"]],"erkl":"Trends werden zu Beratungsanlässen: Die Agentur passt Produkte, Prävention und Personalplanung an. Bei der Proximus gibt es für Senioren ab 50 Jahren den Unfalltarif 50 und als Baustein die Assistance-Leistungen.","norm":"Proximus 5, VGB 2021 Ziff. 5.4; AUB 2022 Ziff. 2.9; Tarif Unfall (Tarif 50)","id":"1.3-5-4"}]}]}]},{"nr":"2","titel":"Kundinnen und Kunden ganzheitlich beraten und betreuen","lf":"LF 3 / LF 2","abschnitte":[{"nr":"2.1","titel":"Kundendaten erheben und pflegen, Anlässe zur Bedarfsanalyse nutzen","lf":"LF 3","buch":"S. 19–31","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Lebensereignissen einen typischen Versicherungsbedarf zu.","paare":[["Auszug aus dem Elternhaus","eigene Privathaftpflicht- und Hausratversicherung"],["Geburt eines Kindes","Risikolebensversicherung und Prüfung der Familienabsicherung"],["Kauf eines Hauses","Wohngebäudeversicherung und Absicherung des Darlehens"],["Erster Arbeitsvertrag","Absicherung der Arbeitskraft (Berufsunfähigkeit)"]],"erkl":"Lebensereignisse sind die wichtigsten Beratungsanlässe; sie verändern Risiken und Bedarf.","norm":"Bedarfsanalyse","id":"2.1-1-1"},{"typ":"mc","frage":"Auf welcher Rechtsgrundlage darf die Agentur Kundendaten verarbeiten, die für den Abschluss eines Versicherungsvertrags nötig sind?","optionen":["Gar nicht, denn Kundendaten dürfen ausschließlich beim Versicherer liegen.","Nur auf der Grundlage einer notariell beglaubigten Einwilligung des Kunden.","Auf der Grundlage der Vertragserfüllung bzw. vorvertraglicher Maßnahmen.","Nur auf der Grundlage einer Genehmigung der Datenschutzaufsichtsbehörde."],"richtig":[2],"erkl":"Die DSGVO erlaubt die Verarbeitung, wenn sie für einen Vertrag oder vorvertragliche Maßnahmen erforderlich ist.","norm":"Art. 6 Abs. 1 lit. b DSGVO","id":"2.1-1-2"},{"typ":"mc","frage":"Für die Verarbeitung von Gesundheitsdaten (z. B. Vorerkrankungen im Antrag) gilt …","optionen":["… nur die Pflicht, sie spätestens ein Jahr nach Vertragsschluss wieder zu löschen.","… ein besonderer Schutz; sie ist in der Regel nur mit ausdrücklicher Einwilligung zulässig.","… nichts Besonderes; sie werden genauso wie Name und Anschrift behandelt.","… ein generelles Verbot, selbst wenn der Kunde ausdrücklich und schriftlich einwilligt."],"richtig":[1],"erkl":"Gesundheitsdaten gehören zu den besonderen Kategorien personenbezogener Daten.","norm":"Art. 9 DSGVO","id":"2.1-1-3"},{"typ":"wf","frage":"Welche Rechte hat ein Kunde nach der DSGVO?","aussagen":[["Er kann Auskunft über die gespeicherten Daten verlangen.",true],["Er kann die Berichtigung falscher Daten verlangen.",true],["Er kann die Löschung verlangen, wenn die Daten nicht mehr benötigt werden und keine Aufbewahrungspflicht besteht.",true],["Er kann verlangen, dass der Versicherer seine Schadenakte sofort vernichtet, auch wenn der Schaden noch läuft.",false]],"erkl":"Auskunft, Berichtigung und Löschung sind Betroffenenrechte; gesetzliche Aufbewahrungspflichten gehen der Löschung vor.","norm":"Art. 15–17 DSGVO","id":"2.1-1-4"},{"typ":"mc","frage":"Was ist der Zweck eines Kundenbetreuungssystems (CRM) in der Agentur?","optionen":["Kundendaten, Verträge und Kontakte zentral zu pflegen und Beratungsanlässe zu erkennen.","Kundendaten ohne deren Wissen an Adresshändler und andere Unternehmen weiterzugeben.","Die gesamte Finanzbuchhaltung der Agentur einschließlich der Steuererklärung zu ersetzen.","Werbeanrufe automatisch an alle gespeicherten Telefonnummern zu richten."],"richtig":[0],"erkl":"Ein gepflegter Bestand zeigt Lücken und Anlässe (z. B. Geburtstag, Vertragsablauf) und ermöglicht gezielte Ansprache.","norm":"Grundlagen","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Kessler (28) meldet in der Agentur ihren Umzug in eine größere Wohnung. Sie zieht mit ihrem Partner zusammen und erwähnt beiläufig, dass sie bald heiraten wollen. Bisher hat sie bei Ihnen nur eine Hausratversicherung.","items":[{"typ":"mc","frage":"Was ist Ihr wichtigster nächster Schritt?","optionen":["Nur die neue Adresse ändern, da sich am Versicherungsbedarf dadurch nichts ändert.","Die Hausratversicherung kündigen, weil sie in der neuen Wohnung nicht mehr gilt.","Sofort und ohne Rückfrage ein Angebot für eine Lebensversicherung zusenden.","Den Anlass für eine umfassende Bedarfsanalyse nutzen und einen Termin vorschlagen."],"richtig":[3],"erkl":"Umzug, Zusammenziehen und Heirat verändern den Bedarf; der Kontakt ist ein Beratungsanlass.","norm":"§ 61 VVG","id":"2.1-2-1"},{"typ":"wf","frage":"Welche Punkte sollten Sie im Termin prüfen?","aussagen":[["Versicherungssumme der Hausratversicherung für die größere Wohnung und den gemeinsamen Hausrat",true],["ob beide Partner in einer gemeinsamen Privathaftpflicht abgesichert werden können",true],["eine Kündigung ihrer Hausratversicherung, weil der Partner schon eine hat, ohne dessen Versicherungssumme zu prüfen",false],["bestehende Verträge des Partners, um Doppelversicherungen zu vermeiden",true]],"erkl":"Bei Zusammenzug drohen Unterversicherung im Hausrat und doppelte Verträge. In der Privathaftpflicht der Proximus ist der Partner einer nichtehelichen Lebensgemeinschaft, der in häuslicher Gemeinschaft lebt, in der Familien-Versicherung mitversichert.","norm":"Bedarfsanalyse; Proximus 5, VHB 2021 Ziff. 16.4.3, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 2.1.4","id":"2.1-2-2"},{"typ":"mc","frage":"Frau Kessler möchte, dass Sie ihre neue Telefonnummer speichern und sie künftig auch telefonisch zu neuen Angeboten anrufen. Was müssen Sie beachten?","optionen":["Eine Einwilligung in Werbeanrufe ist nur wirksam, wenn sie notariell beurkundet wird.","Als Bestandskundin dürfen Sie sie ohne Einwilligung jederzeit zu Werbezwecken anrufen.","Für Werbeanrufe brauchen Sie ihre vorherige ausdrückliche Einwilligung, die Sie dokumentieren.","Eine mutmaßliche Einwilligung genügt, weil sie Ihnen die Nummer selbst gegeben hat."],"richtig":[2],"erkl":"Werbeanrufe bei Verbrauchern ohne vorherige ausdrückliche Einwilligung sind eine unzumutbare Belästigung; die Einwilligung ist zu dokumentieren.","norm":"§ 7 Abs. 2 UWG, § 7a UWG","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Kommunikationsformen und -wege kunden- und serviceorientiert wählen","lf":"LF 3","buch":"S. 32–41","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Fragetyp dem Beispiel zu.","paare":[["Offene Frage","Wie wohnen Sie zurzeit?"],["Geschlossene Frage","Haben Sie einen Hund?"],["Alternativfrage","Passt Ihnen Dienstag oder Donnerstag besser?"],["Suggestivfrage","Sie wollen doch sicher nicht ohne Schutz dastehen, oder?"]],"erkl":"Offene Fragen erschließen den Bedarf; Suggestivfragen manipulieren und sind in der Beratung zu vermeiden.","norm":"Gesprächsführung","id":"2.2-1-1"},{"typ":"mc","frage":"Ein Kunde sagt: „Das ist mir zu teuer.“ Welche Reaktion entspricht einer guten Einwandbehandlung?","optionen":["Das Thema sofort wechseln und später erneut auf einen Abschluss drängen.","Den Einwand ernst nehmen, nach dem Vergleichsmaßstab fragen und den Nutzen darstellen.","Ohne Rücksprache einen Rabatt aus der eigenen Provision anbieten.","Dem Kunden widersprechen und den Preis mit dem Hinweis auf die Qualität verteidigen."],"richtig":[1],"erkl":"Einwände sind Signale für Informationsbedarf. Provisionsabgaben sind zudem grundsätzlich verboten.","norm":"§ 48b VAG","id":"2.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Kommunikationswegen treffen zu?","aussagen":[["Ein Videogespräch eignet sich für Beratungen, wenn der Kunde nicht in die Agentur kommen kann.",true],["Werbe-E-Mails an Verbraucher sind ohne vorherige Einwilligung grundsätzlich unzulässig.",true],["Über einen Messengerdienst dürfen Gesundheitsdaten ohne Weiteres ausgetauscht werden.",false],["Ein Brief eignet sich für förmliche Mitteilungen, die nachweisbar sein sollen.",true]],"erkl":"Bei jedem Kanal sind Datenschutz und Wettbewerbsrecht zu beachten; sensible Daten nur über sichere Wege.","norm":"§ 7 UWG, Art. 32 DSGVO","id":"2.2-1-3"},{"typ":"mc","frage":"Nach dem Vier-Ohren-Modell kann eine Nachricht auf vier Ebenen gehört werden. Welche gehört NICHT dazu?","optionen":["Preisebene","Appellebene","Beziehungsebene","Sachebene"],"richtig":[0],"erkl":"Die vier Seiten sind Sachinhalt, Selbstkundgabe, Beziehung und Appell (Schulz von Thun).","norm":"Kommunikationsmodell","id":"2.2-1-4"},{"typ":"mc","frage":"Was gehört zum aktiven Zuhören?","optionen":["Den Kunden unterbrechen, sobald er vom Thema abweicht.","Nebenbei Notizen und E-Mails bearbeiten, um Zeit zu sparen.","Möglichst früh die passenden Produkte ausführlich erklären.","Das Gesagte mit eigenen Worten zusammenfassen und nachfragen."],"richtig":[3],"erkl":"Paraphrasieren und Nachfragen zeigen Interesse und verhindern Missverständnisse.","norm":"Gesprächsführung","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ihre Agentur plant eine Aktion zum Thema Elementarschutz für alle Hausratkunden. Ihr Kollege schlägt vor, alle Kunden aus dem Bestand unangekündigt anzurufen und zusätzlich einen Newsletter an alle E-Mail-Adressen zu senden.","items":[{"typ":"mc","frage":"Wie beurteilen Sie den Vorschlag der unangekündigten Werbeanrufe?","optionen":["Zulässig, weil bei Bestandskunden eine mutmaßliche Einwilligung ausreicht.","Zulässig, wenn der Anruf nicht mit unterdrückter Rufnummer erfolgt.","Unzulässig bei Kunden ohne vorherige ausdrückliche Einwilligung in Telefonwerbung.","Zulässig, wenn die Kunden in den letzten zwei Jahren einen Vertrag abgeschlossen haben."],"richtig":[2],"erkl":"Auch Bestandskunden dürfen ohne vorherige ausdrückliche Einwilligung nicht zu Werbezwecken angerufen werden.","norm":"§ 7 Abs. 2 UWG","id":"2.2-2-1"},{"typ":"mc","frage":"Unter welcher Voraussetzung darf die Agentur Bestandskunden ohne gesonderte Einwilligung per E-Mail auf ähnliche eigene Produkte hinweisen?","optionen":["Die Adresse stammt aus einem Vertrag, es geht um beliebige Versicherungsprodukte und der Kunde wird einmal im Jahr auf sein Widerspruchsrecht hingewiesen.","Die Adresse stammt aus einem Vertrag, es geht um ähnliche Produkte, der Kunde hat nicht widersprochen und wird stets auf sein Widerspruchsrecht hingewiesen.","Die Adresse ist öffentlich bekannt, es geht um ähnliche Produkte und der Kunde kann sich jederzeit über einen Link in der Mail vom Newsletter abmelden.","Die Adresse stammt aus einem Vertrag, der Kunde ist seit mindestens zwei Jahren Kunde und die Mail wird von der Agentur selbst und nicht vom Versicherer versandt."],"richtig":[1],"erkl":"Das UWG kennt für Bestandskunden eine eng begrenzte Ausnahme mit allen vier Voraussetzungen.","norm":"§ 7 Abs. 3 UWG","id":"2.2-2-2"},{"typ":"zuo","frage":"Welcher Kommunikationsweg passt zu welchem Ziel der Aktion?","paare":[["Kunden ohne jede Werbeeinwilligung informieren","Hinweis bei der nächsten Vertragskorrespondenz oder im persönlichen Gespräch"],["Kunden mit Einwilligung kurzfristig erreichen","E-Mail-Newsletter mit Abmeldelink"],["Kunden mit Beratungsbedarf individuell beraten","persönlicher Termin oder Videogespräch"]],"erkl":"Der Kanal muss zum Ziel und zur rechtlichen Lage passen.","norm":"§ 7 UWG","id":"2.2-2-3"}]}]},{"nr":"2.3","titel":"Informations-, Beratungs- und Dokumentationspflichten einhalten","lf":"LF 2 / LF 3","buch":"S. 42–58","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann muss der Versicherungsvertreter dem Kunden seine Statusinformation (u. a. Name, Anschrift, Status, Registernummer) geben?","optionen":["Beim ersten Geschäftskontakt, klar und verständlich in Textform.","Einmal jährlich, zusammen mit der Beitragsrechnung in Textform.","Nur auf ausdrücklichen Wunsch des Kunden, dann in Textform.","Erst bei Vertragsschluss, gemeinsam mit dem Versicherungsschein."],"richtig":[0],"erkl":"Die Erstinformation gehört an den Anfang der Geschäftsbeziehung.","norm":"§ 15 VersVermV","id":"2.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie den Pflichten des Vermittlers den passenden Inhalt zu.","paare":[["Befragungspflicht","nach Wünschen und Bedürfnissen des Kunden fragen"],["Beratungspflicht","auf Grundlage der Angaben einen geeigneten Rat geben"],["Begründungspflicht","die Gründe für den Rat angeben"],["Dokumentationspflicht","Wünsche, Rat und Gründe vor Vertragsschluss in Textform festhalten"]],"erkl":"Die Pflichten richten sich nach der Schwierigkeit des Produkts, der Person und der Situation des Kunden.","norm":"§§ 61, 62 VVG","id":"2.3-1-2"},{"typ":"mc","frage":"Ein Kunde möchte auf die Beratung verzichten. Was ist dafür nötig?","optionen":["Ein angekreuztes Feld im Antrag mit kurzem Hinweis auf mögliche Nachteile.","Eine gesonderte Erklärung in Textform ohne weiteren Hinweis auf Nachteile.","Eine mündliche Erklärung, die der Vermittler im Gesprächsprotokoll vermerkt.","Eine gesonderte schriftliche Erklärung mit Hinweis auf mögliche Nachteile."],"richtig":[3],"erkl":"Der Verzicht muss gesondert, schriftlich und mit Warnhinweis erklärt werden; im Fernabsatz genügt die Textform (§ 61 Abs. 2 Satz 2 VVG).","norm":"§ 61 Abs. 2 VVG, § 6 Abs. 3 VVG","id":"2.3-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Informationspflichten des Versicherers treffen zu?","aussagen":[["Die Informationen müssen rechtzeitig vor Abgabe der Vertragserklärung in Textform übermittelt werden.",true],["Zu den Informationen gehören die Versicherungsbedingungen.",true],["Verbraucher erhalten zusätzlich ein Produktinformationsblatt.",true],["Die Informationen dürfen immer erst mit der Police verschickt werden.",false]],"erkl":"Wird der Vertrag auf Verlangen des Kunden telefonisch oder über ein anderes Kommunikationsmittel geschlossen, das die vorherige Information nicht erlaubt, oder verzichtet der Kunde durch gesonderte schriftliche Erklärung, ist die Information unverzüglich nachzuholen.","norm":"§ 7 VVG, VVG-InfoV","id":"2.3-1-4"},{"typ":"mc","frage":"Ein Vermittler berät falsch und dokumentiert die Beratung nicht. Der Kunde erleidet dadurch einen Schaden. Welche Folge ist möglich?","optionen":["Der Vertrag gilt automatisch als von Anfang an nicht geschlossen.","Der Vermittler kann lediglich vom Versicherer abgemahnt werden.","Der Vermittler ist dem Kunden zum Schadenersatz verpflichtet.","Der Kunde hat keine Ansprüche, weil er den Antrag unterschrieben hat."],"richtig":[2],"erkl":"Bei schuldhafter Verletzung der Beratungs- oder Dokumentationspflicht haftet der Vermittler; fehlende Dokumentation erschwert ihm den Beweis.","norm":"§ 63 VVG","id":"2.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Okafor (45) ruft in der Agentur an und möchte „ganz schnell“ eine Unfallversicherung abschließen, weil er nächste Woche mit dem Mountainbike in die Alpen fährt. Für ein Beratungsgespräch habe er keine Zeit.","items":[{"typ":"mc","frage":"Darf der Vertreter auf die Beratung verzichten, weil der Kunde keine Zeit hat?","optionen":["Ja, weil bei der Unfallversicherung grundsätzlich keine Beratungspflicht besteht.","Nur bei gesondertem Verzicht mit Hinweis auf Nachteile; am Telefon genügt die Textform.","Ja, weil Zeitmangel des Kunden den Vertreter von der Beratungspflicht befreit.","Nein, ein Verzicht auf die Beratung ist gesetzlich in keinem Fall möglich."],"richtig":[1],"erkl":"Zeitdruck ersetzt nicht den förmlichen Verzicht; im Fernabsatz genügt dafür die Textform.","norm":"§ 61 Abs. 2 VVG","id":"2.3-2-1"},{"typ":"mc","frage":"Herr Okafor möchte den Vertrag am Telefon abschließen und die Unterlagen später lesen. Wann müssen die Vertragsinformationen dann übermittelt werden?","optionen":["Unverzüglich nach Vertragsschluss, wenn der telefonische Abschluss auf seinen Wunsch erfolgt.","Erst nach Ablauf der Widerrufsfrist, damit der Vertrag bereits sicher besteht.","Innerhalb von 14 Tagen nach Vertragsschluss, sobald er die erste Prämie gezahlt hat.","Gar nicht mehr, weil er mit dem telefonischen Abschluss auf die Unterlagen verzichtet hat."],"richtig":[0],"erkl":"Bei telefonischem Abschluss auf Verlangen des Kunden darf die Information unverzüglich nachgeholt werden.","norm":"§ 7 Abs. 1 Satz 3 VVG","id":"2.3-2-2"},{"typ":"wf","frage":"Was gehört in die Beratungsdokumentation des Vertreters?","aussagen":[["die geäußerten Wünsche und Bedürfnisse des Kunden",true],["der erteilte Rat und seine Gründe",true],["ein Verzicht des Kunden auf die Beratung mit dem Warnhinweis, falls er verzichtet hat",true],["die private Meinung des Vertreters über den Kunden",false]],"erkl":"Die Dokumentation ist dem Kunden vor Vertragsschluss in Textform zu übermitteln.","norm":"§ 62 VVG","id":"2.3-2-3"}]}]},{"nr":"2.4","titel":"Prüfungsfälle: Vermittler, Vertriebswege und Kundendaten","lf":"LF 3","buch":"S. 19–31","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Yıldız – wer braucht welche Erlaubnis?","situation":"Selin Yıldız (34) führt in Halle (Saale) eine Agentur. Sie vermittelt ausschließlich Verträge der Proximus Versicherung AG und ihrer Konzernschwestern für Leben und Kranken; die Proximus hat die uneingeschränkte Haftung für ihre Vermittlertätigkeit übernommen. Ihr Bekannter Jonas Brandt ist Mehrfachagent und vermittelt Hausratversicherungen von drei miteinander konkurrierenden Versicherern. Mara Lindqvist arbeitet als Versicherungsmaklerin, Dr. Henrik Vogt als Versicherungsberater gegen Honorar.","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Person die Rechtsgrundlage ihrer Tätigkeit zu.","paare":[["Selin Yıldız (nur Proximus-Konzern, Haftungsübernahme)","erlaubnisfrei als gebundene Vertreterin; Registrierung über den Versicherer"],["Jonas Brandt (drei konkurrierende Versicherer)","Erlaubnis der IHK als Versicherungsvertreter nach § 34d Abs. 1 GewO"],["Mara Lindqvist (Maklerin)","Erlaubnis der IHK als Versicherungsmaklerin nach § 34d Abs. 1 GewO"],["Dr. Henrik Vogt (Honorarberater)","Erlaubnis der IHK als Versicherungsberater nach § 34d Abs. 2 GewO"]],"erkl":"Als Vertreter erlaubnisfrei ist, wer ausschließlich für einen Versicherer (oder mehrere mit nicht konkurrierenden Produkten) tätig ist und für den der Versicherer die uneingeschränkte Haftung übernimmt. Mehrfachagent, Makler und Berater brauchen eine IHK-Erlaubnis.","norm":"§ 34d Abs. 1, 2 und 7 Satz 1 Nr. 1 GewO","id":"2.4-1-1"},{"typ":"mc","frage":"Ein Kunde von Frau Yıldız erleidet durch einen Beratungsfehler einen Vermögensschaden. An wen kann er sich wegen Schadenersatz wenden?","optionen":["Nur an Frau Yıldız, weil ein Versicherer niemals für Fehler selbständiger Vertreter haftet.","An die IHK, weil sie Frau Yıldız nach ihrer Prüfung in das Vermittlerregister eingetragen hat.","Auch an die Proximus, weil sie die uneingeschränkte Haftung für Frau Yıldız übernommen hat.","An niemanden, weil gebundene Vertreter für Fehler in ihrer Beratung grundsätzlich nicht haften."],"richtig":[2],"erkl":"Für den gebundenen Vertreter übernimmt der Versicherer die uneingeschränkte Haftung aus der Vermittlertätigkeit. Deshalb braucht Frau Yıldız keine eigene Berufshaftpflichtversicherung; der Kunde kann sich an die Proximus halten.","norm":"§ 34d Abs. 7 Satz 1 Nr. 1 GewO, § 63 VVG","id":"2.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Vermittlerregister und zu den Pflichten der vier Personen treffen zu?","aussagen":[["Jeder kann im Internet prüfen, ob und mit welchem Status ein Vermittler eingetragen ist.",true],["Für Frau Yıldız teilt die Proximus der Registerbehörde die einzutragenden Angaben mit.",true],["Frau Lindqvist muss sich unverzüglich nach Aufnahme ihrer Tätigkeit eintragen lassen.",true],["Herr Brandt braucht keine Berufshaftpflichtversicherung, weil die Versicherer für ihn haften.",false],["Dr. Vogt darf sich zusätzlich zum Honorar Provisionen der Versicherer zahlen lassen.",false]],"erkl":"Das Register dient der Überprüfung von Zulassung und Status. Der Mehrfachagent braucht für die Erlaubnis eine Berufshaftpflichtversicherung; der Versicherungsberater darf sich nur vom Auftraggeber ver
