.",false],["Der Wohngebäudeversicherer kann den Mieter bei leichter Fahrlässigkeit in der Regel nicht in Regress nehmen.",true]],"erkl":"Normale Abnutzung ist durch die Miete abgegolten; der Regress des Gebäudeversicherers gegen Mieter ist nach der Rechtsprechung auf Vorsatz und grobe Fahrlässigkeit beschränkt. Die Proximus-Privathaftpflicht deckt Mietsachschäden an Wohnräumen, nicht aber Abnutzung, Verschleiß und übermäßige Beanspruchung.","norm":"§ 538 BGB, § 86 VVG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.5.1","id":"4.6-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kraus hat sein Einfamilienhaus zum 1. Mai verkauft (Eigentumsumschreibung im Grundbuch). Die Wohngebäudeversicherung hat eine Versicherungsperiode vom 1. Januar bis 31. Dezember. Die Käuferin, Frau Neumann, möchte einen eigenen Vertrag bei ihrem Hausversicherer.","items":[{"typ":"mc","frage":"Was gilt für den bisherigen Vertrag ab dem 1. Mai?","optionen":["Der Vertrag endet zum 1. Mai automatisch, ohne dass jemand kündigen muss.","Frau Neumann tritt in den Vertrag ein, kann ihn aber erst zum Ende der Periode kündigen.","Herr Kraus bleibt Versicherungsnehmer und muss bis Jahresende weiterzahlen.","Frau Neumann tritt in den Vertrag ein und kann ihn binnen eines Monats nach Erwerb kündigen."],"richtig":[3],"erkl":"Der Vertrag geht mit dem Eigentum (Grundbucheintrag) über; danach kann der Erwerber sofort oder zum Ende der Periode kündigen, innerhalb eines Monats nach Erwerb bzw. Kenntnis.","norm":"§§ 95, 96 VVG; Proximus 5, VGB 2021 Ziff. 25.1.1 und 25.2.2","id":"4.6-2-1"},{"typ":"mc","frage":"Frau Neumann kündigt den übergegangenen Vertrag fristgerecht. Wer schuldet die Prämie für die laufende Periode?","optionen":["Herr Kraus und Frau Neumann als Gesamtschuldner.","Beide je zur Hälfte.","Nur Herr Kraus.","Nur Frau Neumann."],"richtig":[2],"erkl":"Kündigt der Erwerber, ist er zur Zahlung der Prämie nicht verpflichtet; sie schuldet allein der Veräußerer. Ohne Kündigung hafteten beide als Gesamtschuldner (§ 95 Abs. 2 VVG).","norm":"§ 96 Abs. 3 VVG; Proximus 5, VGB 2021 Ziff. 25.1.2 und 25.2.3","id":"4.6-2-2"},{"typ":"mc","frage":"Was ist dem Versicherer mitzuteilen?","optionen":["Die Veräußerung ist ihm binnen drei Monaten anzuzeigen.","Die Veräußerung ist ihm unverzüglich anzuzeigen.","Nichts, weil ihm der Grundbucheintrag automatisch mitgeteilt wird.","Nur die neue Bankverbindung für den Lastschrifteinzug."],"richtig":[1],"erkl":"Veräußerer oder Erwerber müssen die Veräußerung unverzüglich in Textform anzeigen. Unterbleibt die Anzeige, kann der Versicherer unter Umständen leistungsfrei sein.","norm":"§ 97 Abs. 1 VVG; Proximus 5, VGB 2021 Ziff. 25.3","id":"4.6-2-3"}]}]},{"nr":"4.7","titel":"Prüfungsfälle: Hausrat – Deckung prüfen","lf":"LF 4","buch":"S. 141–179","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Okafor – Einbruch in die Mietwohnung","situation":"Chiara und Daniel Okafor wohnen zur Miete in einer 92-m²-Wohnung im Paulusviertel in Halle (Saale). Ihre Hausratversicherung bei der Proximus Versicherung AG hat eine Versicherungssumme von 60.000 € mit Unterversicherungsverzicht. Laut ihren Bedingungen gilt: Die Versicherungssumme erhöht sich um einen Vorsorgebetrag von 10 %; Wertsachen werden insgesamt bis 20 % der Versicherungssumme entschädigt; außerhalb eines verschlossenen Wertschutzschranks Bargeld bis 1.500 € und Schmuck bis 20.000 €. Nach einem Einbruchdiebstahl müssen die Versicherten den Schaden unverzüglich der Polizei anzeigen und dem Versicherer und der Polizei unverzüglich ein Verzeichnis der gestohlenen Sachen (Stehlgutliste) einreichen. Am 14. November 2026 hebeln Täter abends die Wohnungstür auf. Sie stehlen 2.300 € Bargeld aus dem Schreibtisch, einen Laptop und einen Ring im Wert von 1.200 €, zerschneiden das Sofa und besprühen die Wohnzimmerwände mit Farbe.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden der Familie Okafor die passende Grundlage in der Hausratversicherung zu.","paare":[["gestohlener Laptop","Einbruchdiebstahl"],["zerschnittenes Sofa","Vandalismus nach einem Einbruch"],["aufgehebelte Wohnungstür der Mietwohnung","versicherte Kosten: Reparatur von Gebäudeschäden nach einem Einbruch"],["2.300 € Bargeld aus dem Schreibtisch","Wertsache mit eigener Entschädigungsgrenze"]],"erkl":"Die Täter sind durch Aufbrechen in die Wohnung eingedrungen: Der Diebstahl ist Einbruchdiebstahl, die mutwillige Zerstörung danach Vandalismus nach einem Einbruch. Schäden am Gebäude in einer gemieteten Wohnung ersetzt die Hausratversicherung als versicherte Kosten; Bargeld ist eine Wertsache mit Grenze.","norm":"Proximus 5, VHB 2021 Ziff. 4.1.1, 4.2, 13.7, 18.1.1","id":"4.7-1-1"},{"typ":"zahl","frage":"Wie viel Euro ersetzt der Versicherer höchstens für das gestohlene Bargeld der Familie Okafor?","wert":1500,"einheit":"€","tol":0,"erkl":"Das Bargeld lag nicht in einem verschlossenen Wertschutzschrank, daher gilt die Grenze von 1.500 €. Die Gesamtgrenze für Wertsachen (20 % von 66.000 € Versicherungssumme einschließlich Vorsorge = 13.200 €) ist mit Bargeld und Ring nicht erreicht. Von 2.300 € werden also 1.500 € ersetzt.","norm":"Proximus 5, VHB 2021 Ziff. 17.2, 18.3.1 und 18.3.2.1","id":"4.7-1-2"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten der Familie Okafor nach dem Einbruch treffen zu?","aussagen":[["Die Okafors müssen den Einbruch unverzüglich bei der Polizei anzeigen.",true],["Die Stehlgutliste hilft der Polizei, gestohlene Sachen wiederzufinden, und ist deshalb unverzüglich einzureichen.",true],["Reichen sie die Liste grob fahrlässig verspätet ein, kann der Versicherer seine Leistung nach der Schwere des Verschuldens kürzen.",true],["Bei einer nur leicht fahrlässigen Verspätung ist der Versicherer vollständig leistungsfrei.",false],["Taucht der Laptop nach der Zahlung wieder auf, müssen sie das dem Versicherer nicht mitteilen.",false]],"erkl":"Stehlgutliste und Polizeianzeige sind Obliegenheiten nach dem Versicherungsfall. Bei Vorsatz ist der Versicherer leistungsfrei, bei grober Fahrlässigkeit kann er kürzen, bei leichter Fahrlässigkeit bleibt die volle Leistung. Wiedergefundene Sachen sind dem Versicherer unverzüglich in Textform anzuzeigen.","norm":"§ 28 Abs. 2 VVG; Proximus 5, VHB 2021 Ziff. 22.1.5, 22.1.6, 22.3 und 24.1","id":"4.7-1-3"},{"typ":"mc","frage":"Die Täter haben die Wände der Mietwohnung mit Farbe besprüht. Wer ersetzt die Kosten für die Beseitigung?","optionen":["die Hausratversicherung der Okafors als Reparaturkosten für Gebäudeschäden","nur die Wohngebäudeversicherung des Vermieters, weil Wände zum Gebäude gehören","niemand, weil Farbe an Wänden als gewöhnliche Abnutzung der Mietsache gilt","die Privathaftpflicht der Okafors, weil sie die Wohnung zurückgeben müssen"],"richtig":[0],"erkl":"Die Hausratversicherung ersetzt Reparaturkosten für Gebäudeschäden im Bereich der Wohnung nach Einbruchdiebstahl oder Raub; Schäden innerhalb der Wohnung durch Vandalismus nach einem Einbruch zählen dazu. Die Wohngebäudeversicherung deckt Einbruch und Vandalismus nicht; die Okafors haben den Schaden auch nicht verursacht.","norm":"Proximus 5, VHB 2021 Ziff. 13.7; VGB 2021 Ziff. 1","id":"4.7-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Nowak – Außenversicherung und Raub","situation":"Familie Nowak wohnt im Stadtteil Neustadt von Halle (Saale) und hat eine Hausratversicherung mit 70.000 € Versicherungssumme. Laut Bedingungen sind Sachen weltweit versichert, solange sie nur vorübergehend, höchstens drei Monate, außerhalb der Wohnung sind (Außenversicherung). Die Entschädigung ist dort auf 10 % der Versicherungssumme zuzüglich Vorsorge (10 % der Versicherungssumme), höchstens 10.000 €, begrenzt. Für Kinder, die während der Ausbildung oder des Studiums auswärts wohnen und keinen eigenen Hausstand gründen, gilt die Außenversicherung ohne Zeitgrenze. Tochter Lena (20) studiert in Leipzig und wohnt im Wohnheim, ohne einen eigenen Hausstand zu gründen. Zum Versicherungsort gehören laut Bedingungen auch verschließbare, gemeinschaftlich genutzte Räume auf dem Grundstück, etwa der Fahrradkeller. Sohn Max (17) fährt zwei Wochen mit Kamera nach Spanien. Der Wintermantel von Frau Nowak liegt seit fünf Monaten bei ihrer Mutter.","items":[{"typ":"zahl","frage":"Bis zu welchem Betrag in Euro ersetzt der Versicherer einen Schaden in der Außenversicherung der Familie Nowak höchstens?","wert":7700,"einheit":"€","tol":0,"erkl":"Versicherungssumme zuzüglich Vorsorge: 70.000 € + 7.000 € = 77.000 €; davon 10 % = 7.700 €. Die Obergrenze von 10.000 € greift nicht, weil 7.700 € darunter liegen.","norm":"Proximus 5, VHB 2021 Ziff. 12.4 und 17.2","id":"4.7-2-1"},{"typ":"wf","frage":"Welche Aussagen zur Außenversicherung der Familie Nowak treffen zu?","aussagen":[["Die Kamera, die Max für zwei Wochen nach Spanien mitnimmt, ist über die Außenversicherung versichert.",true],["Wird sein verschlossenes Hotelzimmer aufgebrochen und die Kamera gestohlen, liegt ein Einbruchdiebstahl vor.",true],["Ein Taschendiebstahl am Strand ist als Einbruchdiebstahl versichert.",false],["Lenas Laptop im Wohnheimzimmer ist versichert, obwohl sie dort länger als drei Monate wohnt.",true],["Der Wintermantel bei der Mutter ist weiter versichert, weil er Frau Nowak gehört.",false]],"erkl":"Außenversicherung setzt einen nur vorübergehenden Aufenthalt voraus; nach mehr als drei Monaten ist der Mantel nicht mehr erfasst. Für Kinder in Ausbildung oder Studium ohne eigenen Hausstand gilt die Außenversicherung unabhängig von der Dauer. Einbruchdiebstahl verlangt das Eindringen in einen Raum eines Gebäudes; Taschendiebstahl ist einfacher Diebstahl.","norm":"Proximus 5, VHB 2021 Ziff. 4.1.1, 12.1, 12.2 und 12.3","id":"4.7-2-2"},{"typ":"mc","frage":"Welcher Vorfall ist über die Außenversicherung der Familie Nowak versichert?","optionen":["Ein Täter bedroht Herrn Nowak an der Haltestelle mit einem Messer und nimmt ihm die Uhr ab.","Am Bahnhof wird die Jacke von Frau Nowak aus dem Fahrradkorb des abgestellten Rades gestohlen.","Im Café wird Max die Geldbörse unbemerkt aus der Jacke über der Stuhllehne gezogen.","Ein Fremder bittet Lena um Wechselgeld und zieht dabei unbemerkt zwei Scheine aus ihrer Geldbörse."],"richtig":[0],"erkl":"Raub liegt vor, wenn der Täter Gewalt anwendet oder mit einer Gewalttat gegen Leib oder Leben droht; in der Außenversicherung muss die angedrohte Gewalttat an Ort und Stelle verübt werden sollen. Die übrigen Fälle sind einfacher Diebstahl oder Trickdiebstahl ohne Gewalt; dafür besteht keine Deckung.","norm":"Proximus 5, VHB 2021 Ziff. 4.3 und 12.3.1","id":"4.7-2-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Sache der Familie Nowak den Versicherungsschutz laut Vertrag zu.","paare":[["Laptop von Lena im Wohnheim in Leipzig","Außenversicherung ohne Zeitgrenze (Ausbildung, kein eigener Hausstand)"],["Kamera von Max im Hotel in Spanien","Außenversicherung, weil nur vorübergehend außerhalb der Wohnung"],["Wintermantel seit fünf Monaten bei der Mutter","nicht versichert, weil nicht mehr vorübergehend außerhalb"],["Fahrrad im verschlossenen Gemeinschaftskeller des Wohnhauses","Versicherungsort (gemeinschaftlich genutzter Raum)"]],"erkl":"Die Außenversicherung erfasst nur vorübergehend ausgelagerte Sachen, hier höchstens drei Monate; für Kinder in Ausbildung gilt eine Ausnahme. Verschließbare, gemeinschaftlich genutzte Räume auf dem Grundstück, etwa der Fahrradkeller, gehören zum Versicherungsort.","norm":"Proximus 5, VHB 2021 Ziff. 10.3, 12.1.2 und 12.2","id":"4.7-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Kaya – Was gehört zum Hausrat?","situation":"Ahmet Kaya (31) wohnt zur Miete in Halle (Saale). Er hat in die vorher leere Küche auf eigene Kosten eine Einbauküche einbauen lassen und trägt dafür die Gefahr. Am Balkon hängt seine Markise. Im Kellerverschlag lagern die Winterreifen seines Autos, außerdem besitzt er ein Pedelec (Unterstützung bis 25 km/h) und einen E-Scooter mit Versicherungskennzeichen. Laut seinen Bedingungen gehören Kraftfahrzeuge aller Art und Anhänger sowie deren Teile und Zubehör nicht zum Hausrat; ausgenommen sind nicht versicherungspflichtige Fahrzeuge wie Krankenfahrstühle, Rasenmäher, Pedelecs (Tretunterstützung bis 25 km/h) und Spielfahrzeuge. Sachen außerhalb von Gebäuden, auch auf dem Balkon, sind gegen Sturm nicht versichert, ausgenommen Antennen und Markisen, die nur seiner Wohnung dienen. Seine Hausratversicherung hat er bei der Proximus Versicherung AG nach den VHB 2021 abgeschlossen.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache von Herrn Kaya richtig zu.","paare":[["Einbauküche, die Herr Kaya auf eigene Kosten einbauen ließ","Hausrat, weil der Mieter sie beschafft hat und die Gefahr trägt"],["Pedelec mit Unterstützung bis 25 km/h","Hausrat, weil Pedelecs ausdrücklich dazu zählen"],["Winterreifen im Kellerverschlag","kein Hausrat: Teile und Zubehör von Kraftfahrzeugen"],["E-Scooter mit Versicherungskennzeichen","kein Hausrat: versicherungspflichtiges Kraftfahrzeug"]],"erkl":"Einbauten des Mieters auf eigene Kosten zählen zum Hausrat. Pedelecs bis 25 km/h sind nicht versicherungspflichtig und in den Bedingungen ausdrücklich als Hausrat genannt. Kfz-Teile und versicherungspflichtige Fahrzeuge sind laut Bedingungen kein Hausrat; der E-Scooter braucht eine eigene Kfz-Versicherung.","norm":"Proximus 5, VHB 2021 Ziff. 8.3.1, 8.3.4 und 9.3; § 1 Abs. 3 StVG; § 1 PflVG","id":"4.7-3-1"},{"typ":"mc","frage":"Ein Leitungswasserschaden zerstört die Einbauküche von Herrn Kaya und das Parkett, das der Vermieter beim Bau verlegt hat. Was gilt?","optionen":["Die Küche ersetzt die Hausratversicherung von Herrn Kaya, das Parkett die Wohngebäudeversicherung.","Beides ersetzt die Wohngebäudeversicherung, weil beides fest mit dem Gebäude verbunden ist.","Beides ersetzt die Hausratversicherung von Herrn Kaya, weil er die Wohnung nutzt.","Die Küche ersetzt die Wohngebäudeversicherung, das Parkett die Hausratversicherung."],"richtig":[0],"erkl":"Einbauten, die ein Mieter auf eigene Kosten beschafft hat und für die er die Gefahr trägt, gehören zu seinem Hausrat und sind in der Wohngebäudeversicherung ausgeschlossen. Das vom Eigentümer verlegte Parkett ist Gebäudebestandteil.","norm":"Proximus 5, VHB 2021 Ziff. 8.3.1 und 9.2; VGB 2021 Ziff. 7.2 und 7.5.2","id":"4.7-3-2"},{"typ":"mc","frage":"Ein Sturm mit Windstärke 9 reißt die Markise ab und weht die Balkonstühle von Herrn Kaya in den Hof. Was ersetzt die Hausratversicherung?","optionen":["nur die Markise, weil sie laut Bedingungen auch außen gegen Sturm versichert ist","nur die Balkonstühle, weil die Markise fest am Gebäude des Vermieters angebracht ist","beides, weil der Balkon zur versicherten Wohnung gehört","nichts, weil Sturmschäden nur die Wohngebäudeversicherung trägt"],"richtig":[0],"erkl":"Sachen außerhalb von Gebäuden sind gegen Sturm nicht versichert. Ausgenommen sind Antennen und Markisen, die nur der Wohnung dienen. Windstärke 9 erfüllt die Sturmdefinition (mindestens Windstärke 8).","norm":"Proximus 5, VHB 2021 Ziff. 6.1, 6.5.7 und 8.3.3","id":"4.7-3-3"},{"typ":"wf","frage":"Welche Aussagen zur Gefahr „Überspannung durch Blitz“ im Proximus-Vertrag von Herrn Kaya treffen zu?","aussagen":[["Zerstört ein Blitzeinschlag in der Nähe durch Überspannung seinen Fernseher, ist der Schaden versichert.",true],["Ein Kurzschluss im Fernseher ohne Blitz oder atmosphärische Elektrizität ist versichert.",false],["Für Überspannungsschäden durch Blitz braucht Herr Kaya einen besonderen Einschluss.",false],["Ein Blitz, der ins Haus einschlägt und in der Wohnung einen Brand auslöst, ist versichert.",true]],"erkl":"Nach Proximus 5 gehören Brand, Blitzschlag und Überspannung durch Blitz zur Grunddeckung der Hausratversicherung. Überspannung durch Blitz ist ein Schaden durch Überspannung, Überstrom oder Kurzschluss infolge eines Blitzes oder sonstiger atmosphärisch bedingter Elektrizität; ein Defekt ohne diese Ursache ist nicht erfasst.","norm":"Proximus 5, VHB 2021 Ziff. 1.1, 3.1, 3.2 und 3.3","id":"4.7-3-4"}]},{"typ":"situation","titel":"Fall 4: Familie Schubert – Wasser, Sturm und Regen","situation":"Familie Schubert wohnt in einer Erdgeschosswohnung in Dessau-Roßlau. Ihre Hausratversicherung umfasst Feuer, Einbruchdiebstahl, Raub, Vandalismus, Leitungswasser, Sturm und Hagel, aber keine weiteren Naturgefahren. Im Jahr 2026 meldet Herr Schubert mehrere Schäden: Im März platzt der Schlauch der Waschmaschine. Im Mai platzt das Aquarium im Wohnzimmer. Im Juni läuft nach einem Starkregen Wasser über die Terrasse in die Wohnung. Im August tropft Wasser aus der Wohnung darüber auf das Sofa, weil dort ein Rohr gebrochen ist. Im Oktober drückt ein Sturm mit Windstärke 10 ein geschlossenes Fenster ein.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis bei Familie Schubert das Ergebnis der Deckungsprüfung zu.","paare":[["Waschmaschinenschlauch platzt, der Teppich wird nass","versichert: Leitungswasser"],["Starkregen, Wasser läuft über die Terrasse in die Wohnung","nicht versichert: weitere Naturgefahr ohne Einschluss"],["Aquarium platzt, die Zierfische verenden","nicht versichert: Inhalt des Aquariums"],["Sturm drückt das geschlossene Fenster ein, Regen beschädigt die Möbel","versichert: Sturm einschließlich Folgeschäden"],["Regen dringt bei einem Sturm durch ein offen gelassenes Fenster","nicht versichert: Regen durch nicht geschlossene Öffnung"]],"erkl":"Leitungswasser ist bestimmungswidrig ausgetretenes Wasser aus Rohren und angeschlossenen Einrichtungen; der Inhalt eines Aquariums ist ausgeschlossen. Starkregen ist eine weitere Naturgefahr. Bei Sturm sind Folgeschäden versichert, nicht aber Regen durch nicht ordnungsgemäß geschlossene Fenster.","norm":"Proximus 5, VHB 2021 Ziff. 5.2, 5.4.8, 6.3.1, 6.4.1 und 6.5.2","id":"4.7-4-1"},{"typ":"mc","frage":"Der Rohrbruch in der Wohnung über den Schuberts beschädigt ihr Sofa. Was gilt?","optionen":["Der Hausratversicherer zahlt und kann den Nachbarn in Regress nehmen, wenn dieser haftet.","Die Schuberts müssen sich zuerst an den Nachbarn wenden; der Versicherer zahlt nur ersatzweise.","Kein Schutz, weil das gebrochene Rohr nicht in der Wohnung der Schuberts liegt.","Nur die Wohngebäudeversicherung des Hauses ersetzt das Sofa, weil ein Rohr gebrochen ist."],"richtig":[0],"erkl":"Leitungswasser setzt nicht voraus, dass das Rohr in der eigenen Wohnung liegt. Der Hausratversicherer leistet und erwirbt einen möglichen Ersatzanspruch gegen den Verursacher. Die Wohngebäudeversicherung ersetzt Gebäudeschäden, keinen Hausrat.","norm":"§ 86 Abs. 1 VVG; Proximus 5, VHB 2021 Ziff. 5.2","id":"4.7-4-2"},{"typ":"wf","frage":"Welche Aussagen zur Gefahr Leitungswasser in der Hausratversicherung der Schuberts treffen zu?","aussagen":[["Kippt beim Wischen ein Eimer um und dringt Wasser in das Parkett, ist das kein Leitungswasserschaden.",true],["Läuft ein Wasserbett aus, ist das ein Leitungswasserschaden.",true],["Grundwasser, das durch die Kellerwand drückt, ist ein Leitungswasserschaden.",false],["Schäden durch Schwamm (Hausfäulepilz) sind über Leitungswasser ausgeschlossen.",true]],"erkl":"Ausgeschlossen sind u. a. Plansch- und Reinigungswasser, Schwamm sowie Grundwasser und Überschwemmung. Wasserbetten zählen zu den Einrichtungen, aus denen Leitungswasser austreten kann.","norm":"Proximus 5, VHB 2021 Ziff. 5.2.5 und 5.4","id":"4.7-4-3"},{"typ":"mc","frage":"An Schuberts Wohnort wurde die Windstärke nicht gemessen. Wann gilt ein Sturm laut Bedingungen trotzdem als nachgewiesen?","optionen":["wenn der Wind in der Umgebung Schäden an einwandfreien Gebäuden verursacht hat","wenn Herr Schubert schriftlich versichert, dass es an dem Tag sehr stürmisch war","wenn der Wetterdienst für die Region eine Unwetterwarnung herausgegeben hatte","wenn der Schaden höher als 1.000 € ist und Fotos vom Schaden vorliegen"],"richtig":[0],"erkl":"Ist die Windstärke am Schadenort nicht feststellbar, genügt der Nachweis, dass der Wind in der Umgebung Schäden an einwandfreien Gebäuden verursacht hat oder dass der Schaden nur durch Sturm entstanden sein kann.","norm":"Proximus 5, VHB 2021 Ziff. 6.1.1 und 6.1.2","id":"4.7-4-4"}]},{"typ":"situation","titel":"Fall 5: Familie Lindner – Trennung und Umzug nach Wien","situation":"Tobias und Sophie Lindner sind gemeinsam Versicherungsnehmer der Hausratversicherung für die Ehewohnung in Halle (Saale); Hauptfälligkeit des Jahresbeitrags ist jeweils der 1. Juli. Sophie zieht nach der Trennung am 1. März 2027 in eine eigene Wohnung, Tobias bleibt in der Ehewohnung. Laut Bedingungen gilt: Sind beide Ehegatten Versicherungsnehmer und zieht einer aus, sind die bisherige Ehewohnung und die neue Wohnung des ausziehenden Ehegatten versichert, bis der Vertrag geändert wird, längstens bis zum Ablauf von drei Monaten nach der auf den Auszug folgenden Hauptfälligkeit; danach erlischt der Schutz für die neue Wohnung. Bei einem Umzug ins Ausland geht der Schutz nicht auf die neue Wohnung über; in der bisherigen Wohnung erlischt er spätestens zwei Monate nach Umzugsbeginn. Nach der Scheidung führt Tobias den Vertrag allein weiter. Er zieht beruflich nach Wien und bringt am 1. April 2028 die ersten Möbel dauerhaft dorthin.","items":[{"typ":"mc","frage":"Bis wann ist Sophies neue Wohnung über den gemeinsamen Vertrag längstens versichert, wenn der Vertrag nicht geändert wird?","optionen":["bis 1. Oktober 2027, drei Monate nach der Fälligkeit am 1. Juli","bis 1. Juni 2027, drei Monate nach Sophies Auszug am 1. März","bis 1. Juli 2027, dem Tag der nächsten Fälligkeit","bis 1. März 2028, ein Jahr nach Sophies Auszug"],"richtig":[0],"erkl":"Maßgeblich ist die auf den Auszug folgende Hauptfälligkeit, hier der 1. Juli 2027. Mit Ablauf von drei Monaten danach erlischt der Schutz für Sophies neue Wohnung spätestens.","norm":"Proximus 5, VHB 2021 Ziff. 16.6.2","id":"4.7-5-1"},{"typ":"wf","frage":"Welche Aussagen zur Trennung der Lindners treffen zu?","aussagen":[["In der Übergangszeit sind Sophies Sachen in ihrer neuen Wohnung über den gemeinsamen Vertrag versichert.",true],["Nach Ablauf der Übergangszeit ist nur noch die bisherige Ehewohnung Versicherungsort.",true],["Sophies neue Wohnung bleibt dauerhaft versichert, weil Sophie Versicherungsnehmerin ist.",false],["Sophie sollte rechtzeitig eine eigene Hausratversicherung für ihre Wohnung abschließen.",true]],"erkl":"Die Trennungsregel schafft nur eine Übergangszeit: Sind beide Ehegatten Versicherungsnehmer, erlischt der Schutz für die neue Wohnung des ausziehenden Ehegatten spätestens drei Monate nach der folgenden Hauptfälligkeit, auch wenn er Versicherungsnehmer bleibt. Danach ist nur noch die Ehewohnung versichert; Sophie braucht einen eigenen Vertrag.","norm":"Proximus 5, VHB 2021 Ziff. 16.6.2","id":"4.7-5-2"},{"typ":"mc","frage":"Am 20. Mai 2028 wird in die noch nicht geräumte Wohnung von Tobias in Halle (Saale) eingebrochen. Ist der Schaden versichert?","optionen":["Ja, denn der Schutz dort endet erst zwei Monate nach Umzugsbeginn, also am 1. Juni.","Nein, denn mit dem ersten Möbeltransport nach Wien ist die alte Wohnung nicht mehr versichert.","Nein, denn bei einem Umzug ins Ausland endet der ganze Vertrag sofort.","Ja, denn die alte Wohnung bleibt bis zur Kündigung des Mietvertrags versichert."],"richtig":[0],"erkl":"Umzugsbeginn ist der 1. April 2028. Die bisherige Wohnung bleibt laut Vertrag noch höchstens zwei Monate versichert, also bis 1. Juni 2028. Der Einbruch am 20. Mai liegt in dieser Frist.","norm":"Proximus 5, VHB 2021 Ziff. 16.1 und 16.3","id":"4.7-5-3"},{"typ":"wf","frage":"Welche Aussagen zum Umzug von Tobias nach Wien treffen zu?","aussagen":[["Der Versicherungsschutz geht nicht auf die Wohnung in Wien über.",true],["Umzugsbeginn ist der Tag, an dem erstmals Sachen dauerhaft in die neue Wohnung gebracht werden.",true],["Während des Umzugs sind die Möbel in Wien über den bisherigen Vertrag voll versichert.",false],["Tobias muss seinen Hausrat in Wien neu versichern.",true]],"erkl":"Bei einem Umzug ins Ausland ist die neue Wohnung nicht versichert, auch nicht in der Übergangszeit. Der Schutz in der bisherigen Wohnung läuft nur noch befristet aus. Der Umzug beginnt, wenn erstmals versicherte Sachen dauerhaft in die neue Wohnung gebracht werden.","norm":"Proximus 5, VHB 2021 Ziff. 16.1 und 16.3","id":"4.7-5-4"}]},{"typ":"situation","titel":"Fall 6: Frau Hoffmann – Küchenbrand, Ferienwohnung und Pflegeheim","situation":"Gerda Hoffmann (81) wohnt in einer 70-m²-Wohnung in Halle (Saale) und hat dort eine Hausratversicherung. Außerdem besitzt sie eine dauerhaft eingerichtete Ferienwohnung in Zinnowitz auf Usedom, für die kein Vertrag besteht. Nach einem Küchenbrand im Januar 2027 ist ihre Wohnung drei Wochen unbewohnbar. Laut Bedingungen gilt: Wird der Hausrat nach Aufnahme der Versicherungsnehmerin in eine stationäre Pflegeeinrichtung vollständig und dauerhaft aufgelöst, fällt das versicherte Interesse weg; der Vertrag endet zu dem Zeitpunkt, zu dem der Versicherer davon Kenntnis erlangt. Ein Wohnungswechsel gilt nicht als Wegfall des Interesses. In der kalten Jahreszeit ist die Wohnung zu beheizen und genügend häufig zu kontrollieren, oder alle wasserführenden Anlagen sind abzusperren, zu entleeren und entleert zu halten.","items":[{"typ":"zuo","frage":"Ordnen Sie den Kosten nach dem Küchenbrand die Regelung der Hausratversicherung zu.","paare":[["Hotelzimmer, solange die Wohnung unbewohnbar ist","Hotelkosten, zeitlich und der Höhe nach begrenzt"],["Abtransport des verbrannten Hausrats zur Entsorgung","Aufräumungskosten"],["Einlagerung der unbeschädigten Möbel während der Sanierung","Transport- und Lagerkosten"],["Frühstück im Hotel","nicht ersetzt: Nebenkosten der Unterkunft"]],"erkl":"Versicherte Kosten sind u. a. Aufräumungs-, Transport- und Lagerkosten sowie Hotelkosten, wenn die Wohnung unbewohnbar ist (längstens 100 Tage, je Tag bis 1 ‰ der Versicherungssumme zuzüglich Vorsorge). Nebenkosten wie Frühstück sind ausdrücklich nicht erfasst.","norm":"Proximus 5, VHB 2021 Ziff. 13.1, 13.3 und 13.4","id":"4.7-6-1"},{"typ":"mc","frage":"Frau Hoffmann fragt, ob der Hausrat in ihrer Ferienwohnung über ihren Vertrag in Halle (Saale) versichert ist. Was antworten Sie?","optionen":["Nein, er ist dort dauerhaft und nicht nur vorübergehend; sie braucht einen eigenen Vertrag.","Ja, über die Außenversicherung, weil sie selbst nur in den Sommermonaten dort wohnt.","Ja, weil jede Wohnung der Versicherungsnehmerin in Deutschland automatisch versichert ist.","Ja, aber nur gegen Sturm und Hagel, weil die Ferienwohnung an der Ostseeküste liegt."],"richtig":[0],"erkl":"Versicherungsort ist die im Versicherungsschein genannte Wohnung. Die Außenversicherung erfasst nur Sachen, die vorübergehend (höchstens drei Monate) außerhalb sind; die dauerhafte Einrichtung einer Ferienwohnung gehört nicht dazu. Bei Proximus ist Hausrat in Zweit- oder Ferienwohnungen nur durch eine eigene Vereinbarung mit der Klausel PK 7213 versicherbar.","norm":"Proximus 5, VHB 2021 Ziff. 7, 10 und 12.1.2; Tarif Hausrat Ziff. 2.1.2 und 2.1.3; Klausel PK 7213","id":"4.7-6-2"},{"typ":"wf","frage":"Frau Hoffmann zieht dauerhaft in ein Pflegeheim und löst ihren Hausrat vollständig auf. Welche Aussagen treffen nach den Bedingungen im Fall zu?","aussagen":[["Das versicherte Interesse fällt weg.",true],["Der Vertrag endet, sobald der Versicherer von der Auflösung des Hausrats erfährt.",true],["Der Vertrag läuft als Wohnungswechsel weiter; das Heimzimmer wird versicherte Wohnung.",false],["Der Vertrag endet erst nach einer Kündigung zum Ende der Versicherungsperiode.",false]],"erkl":"Die vollständige und dauerhafte Auflösung des Hausrats nach Aufnahme in eine stationäre Pflegeeinrichtung gilt als Wegfall des versicherten Interesses. Der Vertrag endet mit der Kenntnis des Versicherers, ohne Kündigung; bis dahin steht ihm die Prämie zu. Frau Hoffmann sollte den Versicherer daher rasch informieren.","norm":"Proximus 5, VHB 2021 Ziff. 25 und 25.1.1; § 80 Abs. 2 VVG","id":"4.7-6-3"},{"typ":"mc","frage":"Im Februar 2027 ist Frau Hoffmann vier Wochen in Kur. Die Heizung ist aus, das Wasser nicht abgesperrt; ein Rohr platzt durch Frost. Was gilt?","optionen":["Sie hat eine Sicherheitsvorschrift verletzt; je nach Verschulden kann der Versicherer kürzen.","Der Schaden ist voll versichert, weil Frost eine Grundgefahr der Hausratversicherung ist.","Der Schaden ist nie versichert, weil Frostschäden ausschließlich den Gebäudeversicherer betreffen.","Sie verliert den Schutz nur, wenn sie die Kur nicht vorher beim Versicherer gemeldet hat."],"richtig":[0],"erkl":"Sicherheitsvorschriften sind Obliegenheiten vor dem Versicherungsfall. Bei Vorsatz ist der Versicherer leistungsfrei, bei grober Fahrlässigkeit kann er kürzen; das gilt nur, soweit die Verletzung für den Schaden ursächlich war.","norm":"§ 28 Abs. 2 und 3 VVG; Proximus 5, VHB 2021 Ziff. 21.1 und 21.2","id":"4.7-6-4"}]}]},{"nr":"4.8","titel":"Prüfungsfälle: Wohngebäude – Deckung prüfen","lf":"LF 4","buch":"S. 141–179","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Brandt – Haus, Garage und Photovoltaik","situation":"Familie Brandt besitzt ein Einfamilienhaus von 1998 in Halle (Saale)-Kröllwitz mit Doppelgarage und Photovoltaikanlage auf dem Dach. Die Wohngebäudeversicherung bei der Proximus Versicherung AG (gleitende Neuwertversicherung, Versicherungssumme 1914 mit Unterversicherungsverzicht) umfasst Feuer, Leitungswasser sowie Sturm und Hagel; die Doppelgarage ist im Versicherungsschein genannt, Grundstücksbestandteile wie Zäune sind über die Klausel PK 7264 mitversichert. Photovoltaikanlagen samt Zubehör sind laut Bedingungen nicht versichert. Den Teil der Entschädigung, der über den Zeitwert hinausgeht (Neuwertanteil), erhält die Familie laut Bedingungen nur, wenn sie innerhalb von drei Jahren sicherstellt, dass sie das Gebäude wiederherstellt.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache auf dem Grundstück der Brandts richtig zu.","paare":[["individuell für das Haus gefertigte, aufwendig eingepasste Küche","Gebäudebestandteil"],["Mülltonnenbox an der Hauswand","Gebäudezubehör"],["Gartenzaun","Grundstücksbestandteil"],["Waschmaschine im Keller","Hausrat"]],"erkl":"Individuell für das Gebäude gefertigte und eingepasste Küchen verlieren durch die feste Verbindung ihre Selbstständigkeit und sind Gebäudebestandteil. Müllboxen dienen dem Gebäude und sind Zubehör. Zäune sind mit dem Grundstück verbunden. Bewegliche Haushaltsgeräte gehören zum Hausrat.","norm":"Proximus 5, VGB 2021 Ziff. 7.2, 7.3, 7.4 und 7.6.2.3; Klausel PK 7264; § 94 BGB","id":"4.8-1-1"},{"typ":"mc","frage":"Ein Sturm mit Windstärke 9 reißt Module der Photovoltaikanlage ab, die dabei Dachziegel zerschlagen. Was ersetzt die Wohngebäudeversicherung?","optionen":["die Dachziegel, nicht aber die Photovoltaikmodule","die Photovoltaikmodule und die Dachziegel","nur die Photovoltaikmodule, weil sie den Schaden ausgelöst haben","nichts, weil die Anlage den Schaden verursacht hat"],"richtig":[0],"erkl":"Das Dach ist Gebäudebestandteil und gegen Sturm versichert, auch wenn der Sturm Gegenstände auf das Gebäude wirft. Photovoltaikanlagen und ihre Installationen sind in der Proximus-Wohngebäudeversicherung nicht versicherte Sachen; dafür braucht es eine eigene Photovoltaikversicherung.","norm":"Proximus 5, VGB 2021 Ziff. 5.3.4, 7.2 und 7.5.1","id":"4.8-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Unterversicherungsverzicht im Vertrag der Brandts treffen zu?","aussagen":[["Er setzt voraus, dass die Versicherungssumme 1914 nach den Angaben der Brandts zu Größe, Ausbau und Ausstattung ermittelt wurde.",true],["Bauen die Brandts das Dachgeschoss aus und melden es nicht, kann der Versicherer bei einem Schaden in einer späteren Periode Unterversicherung einwenden.",true],["Der Verzicht gilt auch dann, wenn die Wohnfläche im Antrag zu niedrig angegeben wurde.",false],["Wegen des Verzichts darf der Beitrag nie an die Baupreise angepasst werden.",false]],"erkl":"Der Verzicht beruht auf richtigen Angaben zum Gebäude. Falsche Angaben oder nicht unverzüglich gemeldete wertsteigernde Umbauten lassen ihn entfallen; ausgenommen sind Umbauten in der Versicherungsperiode, in der der Schaden eintritt. Die jährliche Anpassung über den Anpassungsfaktor bleibt davon unberührt.","norm":"Proximus 5, VGB 2021 Ziff. 15.1, 15.2 und 17.2; § 75 VVG","id":"4.8-1-3"},{"typ":"mc","frage":"Die Doppelgarage brennt ab. Die Brandts wollen sie nicht wieder aufbauen. Was erhalten sie nach den Bedingungen im Fall?","optionen":["nur den Zeitwertschaden, weil der Neuwertanteil an die Wiederherstellung gebunden ist","den vollen Neuwert, weil sie eine gleitende Neuwertversicherung ohne Unterversicherung haben","nichts, weil Garagen als Nebengebäude in keiner Wohngebäudeversicherung versichert sind","den Neuwert, wenn sie das Geld innerhalb von drei Jahren in eine andere Immobilie anlegen"],"richtig":[0],"erkl":"Den Neuwertanteil, also den Teil über den Zeitwertschaden hinaus, erwerben die Brandts nur, wenn sie innerhalb von drei Jahren sicherstellen, dass sie die Entschädigung zur Wiederherstellung in gleicher Art und Zweckbestimmung verwenden. Ohne Wiederaufbau bleibt es beim Zeitwert.","norm":"§ 93 VVG; Proximus 5, VGB 2021 Ziff. 18.6 und 20.1.2","id":"4.8-1-4"}]},{"typ":"situation","titel":"Fall 2: Herr Petrović – Leitungswasser im Mehrfamilienhaus","situation":"Milan Petrović besitzt ein Mehrfamilienhaus mit sechs Mietwohnungen in Halle (Saale)-Giebichenstein. Seine Wohngebäudeversicherung umfasst Leitungswasser und Mietausfall bis zu zwölf Monate. Bruchschäden an Ableitungsrohren außerhalb des Gebäudes sind laut Vertrag nur mit einer besonderen Klausel (PK 7262) versichert, die nicht vereinbart ist. Im Winter 2026/2027 kommt es zu mehreren Schäden. Die Mieterin von Wohnung 3 hat auf eigene Kosten zusätzlich Laminat über den vorhandenen Dielenboden verlegen lassen und trägt dafür die Gefahr. Der Dachboden des Hauses ist unbeheizt.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden am Haus von Herrn Petrović das Ergebnis der Deckungsprüfung zu.","paare":[["Ein Wasserrohr in der Wand von Wohnung 2 bricht, die Wand wird nass","versichert: Bruchschaden innen und Nässeschaden"],["das Zuleitungsrohr im Vorgarten, das das Haus versorgt, bricht","versichert: Zuleitungsrohr außerhalb auf dem Grundstück"],["Wurzeln brechen das Abwasserrohr unter dem Rasen","nicht versichert: Ableitungsrohr außen ohne Klausel"],["der Küchenabfluss ist verstopft, ohne dass ein Rohr gebrochen ist","nicht versichert: kein Bruch- oder Nässeschaden"]],"erkl":"Innerhalb des Gebäudes sind Bruch- und Frostschäden an Zu- und Ableitungsrohren versichert, außerhalb auf dem Grundstück nur Zuleitungs- und Heizungsrohre, die das Gebäude versorgen. Ableitungsrohre außerhalb brauchen die Klausel PK 7262. Eine bloße Verstopfung ist kein Versicherungsfall; die Kosten der Beseitigung deckt nur die Klausel PK 7167.","norm":"Proximus 5, VGB 2021 Ziff. 4.3.1 und 4.4; Klauseln PK 7167 und PK 7262","id":"4.8-2-1"},{"typ":"mc","frage":"Das Laminat in Wohnung 3, das die Mieterin auf eigene Kosten verlegt hat, wird durch Leitungswasser zerstört. Wer ersetzt es?","optionen":["die Hausratversicherung der Mieterin, weil sie es beschafft hat und die Gefahr trägt","die Wohngebäudeversicherung, weil Bodenbeläge in Mietwohnungen immer Gebäudebestandteile sind","Herr Petrović persönlich, weil er als Vermieter die Wohnung in gutem Zustand erhalten muss","niemand, weil Laminat weder Gebäude noch Hausrat ist"],"richtig":[0],"erkl":"Sachen, die Mieter nachträglich auf eigene Kosten eingefügt haben und für die sie die Gefahr tragen, sind in der Wohngebäudeversicherung nicht versichert (nur durch besondere Vereinbarung) und gehören zum Hausrat der Mieterin.","norm":"Proximus 5, VGB 2021 Ziff. 7.5.2 und 7.6.1; VHB 2021 Ziff. 8.3.1","id":"4.8-2-2"},{"typ":"wf","frage":"Im Januar 2027 platzt die Wasserleitung im unbeheizten Dachboden durch Frost; sie war weder entleert noch abgesperrt. Welche Aussagen treffen zu?","aussagen":[["Herr Petrović hat eine Sicherheitsvorschrift (Obliegenheit vor dem Versicherungsfall) verletzt.",true],["Bei grober Fahrlässigkeit kann der Versicherer die Leistung nach der Schwere des Verschuldens kürzen.",true],["Bei leichter Fahrlässigkeit ist der Versicherer vollständig leistungsfrei.",false],["Der Versicherer kann den Vertrag innerhalb eines Monats nach Kenntnis fristlos kündigen, wenn die Verletzung vorsätzlich oder grob fahrlässig war.",true]],"erkl":"In der kalten Jahreszeit sind Gebäudeteile zu beheizen und zu kontrollieren oder wasserführende Anlagen abzusperren und zu entleeren. Die Rechtsfolgen richten sich nach § 28 VVG: Kürzung nach Verschulden, Kündigungsrecht bei Vorsatz und grober Fahrlässigkeit.","norm":"§ 28 Abs. 1 und 2 VVG; Proximus 5, VGB 2021 Ziff. 21.1.3 und 21.2","id":"4.8-2-3"},{"typ":"mc","frage":"Wohnung 1 ist nach einem versicherten Rohrbruch vier Monate unbewohnbar; der Mieter zahlt keine Miete. Wer trägt den Mietausfall?","optionen":["die Wohngebäudeversicherung von Herrn Petrović über den mitversicherten Mietausfall","der Mieter, weil er trotz der unbewohnbaren Wohnung weiter die volle Miete schuldet","die Hausratversicherung des Mieters, weil er in der beschädigten Wohnung wohnt","Herr Petrović selbst, weil ein Mietausfall in der Wohngebäudeversicherung nie versichert ist"],"richtig":[0],"erkl":"Ist die Wohnung durch einen Mangel unbenutzbar, ist der Mieter von der Miete befreit. Den Mietausfall des Vermieters ersetzt die Wohngebäudeversicherung, höchstens für zwölf Monate seit dem Versicherungsfall.","norm":"§ 536 Abs. 1 BGB; Proximus 5, VGB 2021 Ziff. 13.1.1 und 13.2.1","id":"4.8-2-4"}]},{"typ":"situation","titel":"Fall 3: Familie Bergmann – Sturm, Hagel und Hochwassergefahr","situation":"Familie Bergmann besitzt ein Einfamilienhaus in 06231 Bad Dürrenberg nahe der Saale; 2024 lief bei Hochwasser Wasser in den Keller (einziger Vorschaden der letzten 10 Jahre). Die Wohngebäudeversicherung umfasst Feuer, Leitungswasser sowie Sturm und Hagel; weitere Naturgefahren sind nicht eingeschlossen. Im Sommer 2027 gibt es mehrere Unwetter: Ein Sturm mit Windstärke 10 wirft einen Baum aus dem Garten auf das Dach, Hagel zerschlägt ein Dachfenster, und nach einem Starkregen steht Wasser im Keller.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis am Haus der Bergmanns das Ergebnis zu.","paare":[["Der vom Sturm umgeworfene Baum beschädigt das Dach","versichert: Sturm (Gegenstand auf das Gebäude geworfen)"],["Regen dringt durch das vom Hagel zerschlagene Dachfenster","versichert: Folgeschaden von Hagel"],["Starkregenwasser läuft über die Kellertreppe in den Keller","nicht versichert: Überschwemmung ohne Einschluss"],["Regen dringt während des Sturms durch ein gekipptes Dachfenster","nicht versichert: Regen durch nicht geschlossene Öffnung"]],"erkl":"Sturm umfasst auch Schäden durch Gegenstände, die der Sturm auf das Gebäude wirft, und Folgeschäden. Regen durch nicht ordnungsgemäß geschlossene Fenster ist ausgeschlossen, wenn die Öffnung nicht durch Sturm oder Hagel entstanden ist. Überschwemmung durch Starkregen ist eine weitere Naturgefahr.","norm":"Proximus 5, VGB 2021 Ziff. 5.3.1, 5.3.4, 5.4.1 und 5.5.2","id":"4.8-3-1"},{"typ":"mc","frage":"Welche Tarifzone gilt für die Bergmanns, wenn sie weitere Naturgefahren einschließen?","optionen":["Zone II mit 0,50 ‰, wegen des einen Vorschadens.","Zone I mit 0,20 ‰, weil die PLZ nicht gelistet ist.","Keine Übernahme, weil schon ein Vorschaden vorliegt.","Zone II mit 0,20 ‰, wegen der Lage an der Saale."],"richtig":[0],"erkl":"Proximus teilt die weiteren Naturgefahren nach PLZ in Zone I (0,20 ‰) und Zone II (0,50 ‰) ein. 06231 steht nicht in der Liste der Zone II, aber ein Vorschaden in den letzten 10 Jahren führt in Zone II. Erst ab 2 Vorschäden übernimmt Proximus das Risiko nicht.","norm":"Proximus 5, Tarif Wohngebäude Ziff. 1.3, 2.1 und 6.4","id":"4.8-3-2"},{"typ":"wf","frage":"Die Bergmanns überlegen, weitere Naturgefahren einzuschließen. Welche Aussagen treffen zu?","aussagen":[["Rückstau liegt vor, wenn Wasser infolge Starkregen oder Ausuferung aus den gebäudeeigenen Ableitungsrohren austritt.",true],["Grundwasser, das nicht an die Oberfläche tritt, sondern durch die Kellerwand drückt, ist keine Überschwemmung.",true],["Sturmflut ist über den Einschluss weiterer Naturgefahren versichert.",false],["Weitere Naturgefahren können nur zusammen mit mindestens einer Grundgefahr wie Feuer, Leitungswasser oder Sturm/Hagel versichert werden.",true]],"erkl":"Überschwemmung verlangt Wasser auf der Geländeoberfläche, Rückstau das Eindringen von Wasser aus gebäudeeigenen Ableitungsrohren. Sturmflut ist ausgeschlossen. Nach Proximus 5 sind weitere Naturgefahren nur in Verbindung mit Feuer, Leitungswasser oder Sturm/Hagel versicherbar; es gelten eine Wartezeit von einem Monat und eine Selbstbeteiligung von 500 € je Versicherungsfall.","norm":"Proximus 5, VGB 2021 Ziff. 1.3.2, 5.4.1, 5.4.2 und 5.5.1; Tarif Wohngebäude Ziff. 6","id":"4.8-3-3"},{"typ":"mc","frage":"Der Sturm hat den Baum entwurzelt. Er liegt auf dem Dach. Welche Pflicht haben die Bergmanns jetzt?","optionen":["für die Minderung des Schadens sorgen, z. B. das Dach provisorisch abdecken lassen","nichts verändern, auch das Dach nicht abdecken, bis ein Gutachter es besichtigt hat","den Schaden erst nach Abschluss aller Reparaturen schriftlich melden","den Baum selbst zersägen und verbrennen, um Kosten zu sparen"],"richtig":[0],"erkl":"Der Versicherungsnehmer muss den Schaden nach Möglichkeit abwenden und mindern und Weisungen einholen. Aufwendungen dafür ersetzt der Versicherer, auch wenn sie erfolglos bleiben, soweit sie geboten erscheinen durften. Sind Veränderungen am Schadenbild unumgänglich, ist es vorher z. B. mit Fotos zu dokumentieren.","norm":"§§ 82, 83 VVG; Proximus 5, VGB 2021 Ziff. 22.1.1 bis 22.1.3 und 22.1.7","id":"4.8-3-4"}]},{"typ":"situation","titel":"Fall 4: Haus Jankowski – Erbfall, Leerstand und Verkauf","situation":"Elfriede Jankowski war Versicherungsnehmerin einer Wohngebäudeversicherung für ihr Haus in Halle (Saale)-Ammendorf; die Versicherungsperiode läuft vom 1. Januar bis 31. Dezember. Sie stirbt am 5. Januar 2027. Ihr Sohn Marek erbt das Haus; er lebt in Hamburg, das Haus steht leer. Am 15. Mai 2027 verkauft er es notariell an Frau Seidel. Besitz, Nutzen und Lasten gehen am 1. Juni 2027 über, die Eintragung im Grundbuch erfolgt am 2. August 2027. Laut Bedingungen ist es eine anzeigepflichtige Gefahrerhöhung, wenn das Gebäude nicht mehr genutzt wird.","items":[{"typ":"mc","frage":"Was gilt für die Wohngebäudeversicherung nach dem Tod von Frau Jankowski?","optionen":["Marek tritt als Erbe in den Vertrag ein; ein Sonderkündigungsrecht nach § 96 VVG hat er nicht.","Der Vertrag endet mit dem Tod der Versicherungsnehmerin automatisch zum Monatsende.","Marek tritt ein und kann den Vertrag wie ein Erwerber nach § 96 VVG fristlos kündigen.","Der Vertrag ruht beitragsfrei, bis das Haus verkauft oder wieder bewohnt ist."],"richtig":[0],"erkl":"Mit dem Erbfall geht das Vermögen als Ganzes auf den Erben über, auch der Versicherungsvertrag. Ein Erbfall ist keine Veräußerung; das Kündigungsrecht des Erwerbers nach § 96 VVG gilt daher nicht.","norm":"§ 1922 Abs. 1 BGB; §§ 95, 96 VVG","id":"4.8-4-1"},{"typ":"wf","frage":"Das Haus steht seit dem Erbfall leer. Welche Aussagen treffen zu?","aussagen":[["Marek muss den Leerstand dem Versicherer unverzüglich anzeigen.",true],["Er muss das leere Haus genügend häufig kontrollieren und wasserführende Anlagen absperren und entleeren.",true],["Statt zu kündigen kann der Versicherer für die höhere Gefahr einen höheren Beitrag verlangen.",true],["Wird der Leerstand nicht angezeigt, ist der Versicherer bei jedem späteren Schaden ohne Weiteres leistungsfrei.",false]],"erkl":"Leerstand ist laut Vertrag eine Gefahrerhöhung und unverzüglich anzuzeigen. Der Versicherer kann kündigen oder den Beitrag erhöhen. Leistungsfreiheit setzt u. a. voraus, dass die Gefahrerhöhung für den Schaden ursächlich war. Nicht genutzte Gebäude sind zu jeder Jahreszeit genügend häufig zu kontrollieren, wasserführende Anlagen abzusperren und zu entleeren.","norm":"§§ 23, 25, 26 VVG; Proximus 5, VGB 2021 Ziff. 21.1.2 und 23.1.2","id":"4.8-4-2"},{"typ":"mc","frage":"Am 20. Juni 2027, nach der Übergabe, aber vor der Grundbucheintragung, platzt im Haus ein Rohr. Wer ist zu diesem Zeitpunkt Versicherungsnehmer?","optionen":["Marek, weil Frau Seidel erst mit dem Eigentumsübergang eintritt","Frau Seidel, weil Besitz, Nutzen und Lasten übergegangen sind","Frau Seidel, weil der Kaufvertrag notariell beurkundet ist","niemand, weil der Vertrag in dieser Zeit ruht"],"richtig":[0],"erkl":"Der Erwerber tritt mit dem Eigentumsübergang in den Vertrag ein; bei Immobilien ist das laut Bedingungen das Datum des Grundbucheintrags, hier der 2. August 2027.","norm":"§ 95 Abs. 1 VVG; § 873 Abs. 1 BGB; Proximus 5, VGB 2021 Ziff. 25.1.1","id":"4.8-4-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation nach dem Verkauf an Frau Seidel die Rechtsfolge zu.","paare":[["Frau Seidel kündigt den Vertrag fristgerecht","nur Marek schuldet den Beitrag, Frau Seidel haftet dafür nicht"],["Frau Seidel kündigt nicht","Marek und Frau Seidel haften für den Beitrag der laufenden Periode als Gesamtschuldner"],["Der Versicherer erfährt vom Verkauf","er kann binnen eines Monats mit einer Frist von einem Monat kündigen"],["Frau Seidel kennt den Vertrag erst später","ihre Kündigungsfrist beginnt erst mit Kenntnis vom Vertrag"]],"erkl":"Ohne Kündigung haften Veräußerer und Erwerber für die laufende Periode gesamtschuldnerisch. Kündigt der Erwerber oder der Versicherer nach § 96 VVG, schuldet allein der Veräußerer den Beitrag. Die Monatsfrist des Erwerbers läuft bei fehlender Kenntnis ab Kenntnis.","norm":"§ 95 Abs. 2, § 96 VVG; Proximus 5, VGB 2021 Ziff. 25.1.2 und 25.2","id":"4.8-4-4"}]},{"typ":"situation","titel":"Fall 5: Frau Albrecht – vermietetes Haus, Öltank und Verkehrssicherung","situation":"Renate Albrecht wohnt in ihrem eigenen Einfamilienhaus, das in ihrer Privathaftpflicht mitversichert ist. Außerdem besitzt sie ein vermietetes Dreifamilienhaus in Halle (Saale) mit einem 5.000-Liter-Heizöltank im Keller. Die Stadt hat den Winterdienst auf dem Gehweg per Satzung den Eigentümern übertragen. Laut ihrer Privathaftpflicht (Proximus 5) sind nur selbst bewohnte Ein- und Zweifamilienhäuser mitversichert, vermietete Mehrfamilienhäuser nicht; Gewässerschäden sind nur aus Kleingebinden bis 100 Liter (insgesamt höchstens 1.000 Liter) gedeckt. Im Mietvertrag hat sie den Winterdienst vor dem Dreifamilienhaus auf den Mieter Herrn Yıldız übertragen. Im Winter 2026/2027 kommt es zu mehreren Schäden.","items":[{"typ":"zuo","frage":"Welche Versicherung ist für das Ereignis zuständig? Ordnen Sie zu.","paare":[["Öl aus dem undichten Tank im Dreifamilienhaus verunreinigt das Grundwasser","Gewässerschadenhaftpflicht (Anlagenrisiko)"],["Ein Besucher stürzt auf dem vereisten Weg vor Frau Albrechts eigenem Einfamilienhaus","Privathaftpflichtversicherung"],["Ein Sturm mit Windstärke 9 deckt das Dach des Dreifamilienhauses ab","Wohngebäudeversicherung"],["Eine lockere Dachrinne am Dreifamilienhaus fällt bei leichtem Wind auf das Auto eines Passanten","Haus- und Grundbesitzerhaftpflicht"]],"erkl":"Haftpflichtrisiken aus vermieteten Gebäuden deckt die Haus- und Grundbesitzerhaftpflicht, das selbst genutzte Haus die Privathaftpflicht. Für den Öltank braucht es eine Gewässerschadenhaftpflicht. Eigene Gebäudeschäden durch Sturm trägt die Wohngebäudeversicherung.","norm":"§ 89 WHG; § 836 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.3.1, Abschnitt 4 Ziff. 1, Abschnitt 6 Ziff. 1; VGB 2021 Ziff. 5.3","id":"4.8-5-1"},{"typ":"mc","frage":"Die Dachrinne hat sich gelöst, weil sie seit Jahren verrostet war. Was gilt für die Haftung von Frau Albrecht gegenüber dem Passanten?","optionen":["Sie haftet, wenn sie nicht beweist, dass sie die erforderliche Sorgfalt beachtet hat.","Sie haftet nie, weil der Wind und nicht sie selbst den Schaden ausgelöst hat.","Allein ihre Mieter haften, weil sie das Haus bewohnen und die Rinne sehen konnten.","Sie haftet nur, wenn der Passant ihr ein vorsätzliches Handeln nachweisen kann."],"richtig":[0],"erkl":"Löst sich ein Gebäudeteil infolge mangelhafter Unterhaltung, haftet der Grundstücksbesitzer; das Verschulden wird vermutet. Er kann sich nur entlasten, wenn er die erforderliche Sorgfalt nachweist. Die Haus- und Grundbesitzerhaftpflicht prüft und reguliert den Anspruch.","norm":"§ 836 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 4 Ziff. 1","id":"4.8-5-2"},{"typ":"wf","frage":"Welche Aussagen zum Heizöltank von Frau Albrecht treffen zu?","aussagen":[["Als Betreiberin des Tanks haftet sie für die Verunreinigung des Grundwassers auch ohne Verschulden.",true],["Ihre Ersatzpflicht entfällt, wenn der Schaden durch höhere Gewalt verursacht wurde.",true],["Ihre Privathaftpflicht deckt den Tank nach den Bedingungen im Fall mit ab.",false],["Für das Anlagenrisiko braucht sie eine Gewässerschadenhaftpflichtversicherung.",true]],"erkl":"Der Betreiber einer Anlage haftet für Schäden durch eine nachteilige Veränderung der Wasserbeschaffenheit verschuldensunabhängig, außer bei höherer Gewalt. Die Privathaftpflicht von Frau Albrecht deckt nur Kleingebinde bis 100 Liter auf dem Grundstück ihres selbst genutzten Hauses; für den 5.000-Liter-Tank braucht sie die Gewässerschaden-Haftpflicht (Anlagenrisiko).","norm":"§ 89 Abs. 2 WHG; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.21.1; Abschnitt 6 Ziff. 1.1","id":"4.8-5-3"},{"typ":"mc","frage":"Herr Yıldız vergisst zu streuen; eine Fußgängerin stürzt vor dem Dreifamilienhaus. Was gilt?","optionen":["Herr Yıldız haftet aus dem übernommenen Winterdienst; Frau Albrecht muss ihn aber überwachen.","Nur Frau Albrecht haftet, weil die Streupflicht nicht auf Mieter übertragen werden kann.","Niemand haftet, weil Glätte im Winter zum allgemeinen Lebensrisiko der Fußgänger gehört.","Nur die Stadt haftet, weil der Gehweg vor dem Haus eine öffentliche Fläche ist."],"richtig":[0],"erkl":"Die Verkehrssicherungspflicht kann vertraglich übertragen werden. Wer sie übernimmt, haftet selbst nach § 823 BGB; die Proximus-Privathaftpflicht eines Mieters deckt auch die vertraglich übernommene Streupflicht. Der Eigentümer bleibt zur Auswahl und Kontrolle verpflichtet.","norm":"§ 823 Abs. 1 BGB (Verkehrssicherungspflicht); Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.3.2.1","id":"4.8-5-4"}]},{"typ":"situation","titel":"Fall 6: Familie Schröder – Bau eines Einfamilienhauses","situation":"Lukas und Mia Schröder bauen ein Einfamilienhaus in Teutschenthal bei Halle (Saale). Die Bausumme beträgt 420.000 €, Baubeginn ist der 1. März 2027. Ihre Privathaftpflicht (Proximus 5) deckt sie als Bauherren nur bis zu einer Bausumme von 200.000 € je Bauvorhaben; wird der Betrag überschritten, entfällt die Mitversicherung. Die Wohngebäudeversicherung haben sie mit 3-jähriger Vertragsdauer bei der Proximus Versicherung AG abgeschlossen. Laut Tarif sind dann während des Rohbaus das Gebäude und die Baustoffe auf dem Baugrundstück gegen Feuer prämienfrei versichert (Feuerrohbauversicherung), bis zur Fertigstellung, längstens 12 Monate, hier ab Baubeginn; danach ist der Feuerschutz prämienpflichtig. Leitungswasser und Sturm/Hagel gelten erst ab Bezugsfertigkeit. Ein anderer Versicherer bietet zusätzlich eine Bauleistungsversicherung für unvorhergesehene Schäden an der Bauleistung an, z. B. durch Sturm, Vandalismus oder Diebstahl fest eingebauter Teile, nicht aber durch Feuer und nicht für Diebstahl lose gelagerter Baustoffe.","items":[{"typ":"mc","frage":"Brauchen die Schröders eine eigene Bauherrenhaftpflichtversicherung?","optionen":["Ja, weil ihre Privathaftpflicht Bauvorhaben nur bis 200.000 € Bausumme deckt.","Nein, weil die Baufirmen für alle Schäden auf der Baustelle allein haften.","Nein, weil die Bauleistungsversicherung auch Schäden Dritter übernimmt.","Ja, aber erst ab dem Einzug in das fertige Haus."],"richtig":[0],"erkl":"Der Bauherr bleibt für die Sicherheit der Baustelle verantwortlich. Bei 420.000 € Bausumme entfällt die Mitversicherung in der Privathaftpflicht ganz; das neue Risiko fällt nur vorläufig unter die Vorsorgeversicherung und muss angezeigt werden. Die Schröders brauchen daher eine eigene Bauherrenhaftpflicht. Die Bauleistungsversicherung deckt nur Schäden an der Bauleistung, keine Haftpflichtansprüche.","norm":"§ 823 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.3.2.4 und 9; Abschnitt 5","id":"4.8-6-1"},{"typ":"zuo","frage":"Welche Versicherung ist für den Schaden am Bau der Schröders zuständig? Ordnen Sie zu.","paare":[["Ein Sturm wirft die frisch gemauerte Giebelwand um","Bauleistungsversicherung"],["Ein Blitz setzt den Dachstuhl des Rohbaus in Brand","Feuerrohbauversicherung"],["Ein Spaziergänger stürzt nachts in die ungesicherte Baugrube","Bauherrenhaftpflichtversicherung"],["Unbekannte stehlen lose gelagerte Dachziegel vom Grundstück","nicht versichert nach den Bedingungen im Fall"]],"erkl":"Die Bauleistungsversicherung schützt die entstehende Bauleistung, die Feuerrohbauversicherung den Rohbau gegen Feuer, die Bauherrenhaftpflicht gegen Ansprüche Dritter. Diebstahl lose gelagerter Baustoffe ist laut Angebot nicht versichert; die Feuerrohbauversicherung schützt die Baustoffe nur gegen Feuer.","norm":"Proximus 5, Tarif Wohngebäude Ziff. 4; AVB PHV 2021 Teil A Abschnitt 5; Bauleistungsversicherung (Angebot laut Fall)","id":"4.8-6-2"},{"typ":"wf","frage":"Welche Aussagen zur Bauherrenhaftpflicht der Schröders treffen zu?","aussagen":[["Sie deckt Schäden Dritter, für die die Schröders als Bauherren haften.",true],["Schäden am eigenen Rohbau sind über die Bauherrenhaftpflicht versichert.",false],["Die Schröders müssen die Baustelle gegen Gefahren für Dritte sichern, auch wenn sie Firmen beauftragt haben.",true],["Sie prüft auch, ob ein Anspruch berechtigt ist, und wehrt unberechtigte Ansprüche ab.",true]],"erkl":"Haftpflichtversicherungen prüfen die Haftung, stellen von berechtigten Ansprüchen frei und wehren unberechtigte ab. Eigene Schäden sind nicht gedeckt. Der Bauherr hat Auswahl-, Überwachungs- und Sicherungspflichten; die Proximus-Bauherrenhaftpflicht setzt voraus, dass Planung, Bauleitung und Bauausführung an Dritte vergeben sind.","norm":"§ 100 VVG; § 823 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 4.1; Abschnitt 5 Ziff. 1","id":"4.8-6-3"},{"typ":"mc","frage":"Der Bau verzögert sich; das Haus ist erst im Mai 2028 bezugsfertig. Was gilt für den Feuerschutz des Rohbaus?","optionen":["Ab März 2028 ist er beitragspflichtig, weil die 12 Monate abgelaufen sind.","Er bleibt bis zur Bezugsfertigkeit beitragsfrei, egal wie lange der Bau dauert.","Er endet am 1. März 2028 ersatzlos und kann nicht verlängert werden.","Er geht automatisch in eine Bauleistungsversicherung über."],"richtig":[0],"erkl":"Die Prämienfreiheit gilt laut Tarif längstens 12 Monate, hier ab Baubeginn (1. März 2027), also bis Ende Februar 2028. Danach ist der Feuerschutz bis zur Fertigstellung prämienpflichtig.","norm":"Proximus 5, Tarif Wohngebäude Ziff. 4 (Feuerrohbauversicherung)","id":"4.8-6-4"}]}]},{"nr":"4.9","titel":"Prüfungsfälle: Glas, Elementar, Service und Recht rund ums Wohnen","lf":"LF 4","buch":"S. 180–233","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Aydın – Glasversicherung und Notdienste","situation":"Elif Aydın wohnt zur Miete in einer 68-m²-Wohnung in Halle (Saale). Ihre Glasversicherung bei der Proximus Versicherung AG (AGlB 2021) umfasst laut Bedingungen die Scheiben der Fenster und Türen ihrer Wohnung, Glas in Möbeln und ihr Glaskeramik-Kochfeld gegen Bruch; nicht versichert sind Bildschirme, Handspiegel, Hohlgläser sowie Kratzer und Kantenschäden. Versichert sind auch Kosten für eine Notverglasung. Über ihr Girokonto hat sie einen Schutzbrief, der einen Schlüsselnotdienst bis 150 € je Fall bezahlt, wenn sie sich aussperrt. Sie hat sich außerdem ein Smart-Home-Paket mit Wassermelder und automatischem Absperrventil gekauft.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden bei Frau Aydın das Ergebnis der Glasversicherung zu.","paare":[["Ein Topf fällt auf das Ceranfeld, es springt","versichert: Glaskeramik-Kochfläche"],["Ein Kratzer zieht sich über die Glastischplatte","nicht versichert: Oberflächenschaden"],["Das Display ihres Smartphones zerbricht","nicht versichert: Bildschirm"],["Ein Fußball zerschlägt die Fensterscheibe im Wohnzimmer","versichert: Fensterscheibe der Wohnung"]],"erkl":"Die Glasversicherung deckt nur Bruch. Kratzer und Kantenschäden sind keine Brüche; Displays und Bildschirme sind laut Bedingungen ausgeschlossen.","norm":"Proximus 5, AGlB 2021 Ziff. 1, 2.1.1, 4.1.1 und 4.3.3","id":"4.9-1-1"},{"typ":"zahl","frage":"Frau Aydın hat sich ausgesperrt. Der Schlüsseldienst stellt 190,00 € in Rechnung. Wie viel Euro muss sie selbst tragen?","wert":40,"einheit":"€","tol":0.01,"erkl":"Der Schutzbrief zahlt bis 150,00 € je Fall: 190,00 € − 150,00 € = 40,00 € trägt Frau Aydın selbst. Die Hausratversicherung zahlt beim bloßen Aussperren nicht; Schlossänderungskosten ersetzt sie nur, wenn Schlüssel durch einen Versicherungsfall abhandengekommen sind.","norm":"Schutzbrief (laut Fall); Proximus 5, VHB 2021 Ziff. 13.5","id":"4.9-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Smart-Home-Paket und zu den Serviceleistungen treffen zu?","aussagen":[["Das automatische Absperrventil kann einen Leitungswasserschaden begrenzen, bevor er groß wird.",true],["Durch das Smart-Home-Paket entfällt ihre Pflicht, nach einem Schaden für dessen Minderung zu sorgen.",false],["Einen Prämiennachlass gibt der Proximus-Hausrattarif z. B. für eine Selbstbeteiligung von 500 €.",true],["Der Schutzbrief übernimmt jede Handwerkerrechnung ohne Grenze, auch ohne ein Aussperren.",false]],"erkl":"Smart-Home-Technik senkt Häufigkeit und Höhe von Schäden; einen eigenen Smart-Home-Nachlass sieht der Proximus-Tarif aber nicht vor, wohl aber 20 % Nachlass bei 500 € Selbstbeteiligung je Versicherungsfall. Die Pflicht zur Schadenminderung bleibt bestehen. Schutzbrief-Leistungen sind auf bestimmte Anlässe und Beträge begrenzt.","norm":"§ 82 Abs. 1 VVG; Proximus 5, VHB 2021 Ziff. 22.1.1; Tarif Hausrat Ziff. 1.2; Klausel PK 7710","id":"4.9-1-3"},{"typ":"mc","frage":"Nachts zerschlägt ein Unbekannter mit einem Stein die Scheibe der Wohnungstür von Frau Aydın. Was ist richtig?","optionen":["Sie meldet den Schaden dem Vermieter; die Notverglasung trägt ihre Glasversicherung.","Sie muss bis zur Reparatur warten, weil eine Notverglasung nicht versichert ist.","Sie darf den Schaden verschweigen, weil der Täter unbekannt ist.","Nur die Hausratversicherung zahlt, weil ein Stein von außen kam."],"richtig":[0],"erkl":"Ein Mieter muss Mängel der Mietsache unverzüglich anzeigen. Kosten für das vorläufige Verschließen der Öffnung (Notverglasung) sind versichert; Frau Aydın darf die Notverglasung selbst in Auftrag geben.","norm":"§ 536c Abs. 1 BGB; Proximus 5, AGlB 2021 Ziff. 1, 5.1.1 und 10.2","id":"4.9-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Krüger – Starkregen und Rückstau","situation":"Familie Krüger besitzt ein Einfamilienhaus in 06618 Naumburg (Saale), Vorschäden gab es nicht. Wohngebäude- und Hausratversicherung bei der Proximus Versicherung AG schließen weitere Naturgefahren ein. Laut Tarif gilt für weitere Naturgefahren in jedem der beiden Verträge eine Selbstbeteiligung von 500 € je Versicherungsfall. Die Rückstausicherung ist laut Sicherheitsvorschriften funktionsbereit zu halten. Im Juli 2027 sammelt sich nach Starkregen Wasser auf dem Grundstück und läuft durch die Kellerfenster; zugleich drückt Abwasser durch den Bodenablauf der Waschküche. Der Gebäudeschaden beträgt 23.400 €, der Hausratschaden im Keller 3.800 €.","items":[{"typ":"zahl","frage":"Wie viel Euro zahlt die Wohngebäudeversicherung der Krügers für den Gebäudeschaden nach Abzug der Selbstbeteiligung?","wert":22900,"einheit":"€","tol":0.01,"erkl":"23.400,00 € − 500,00 € Selbstbeteiligung für weitere Naturgefahren = 22.900,00 €.","norm":"Proximus 5, Tarif Wohngebäude Ziff. 6.3; VGB 2021 Ziff. 18.10","id":"4.9-2-1"},{"typ":"zahl","frage":"Wie viel Euro zahlt die Hausratversicherung der Krügers für den Schaden im Keller nach Abzug des Selbstbehalts?","wert":3300,"einheit":"€","tol":0.01,"erkl":"Auch im Hausratvertrag gilt für weitere Naturgefahren eine eigene Selbstbeteiligung von 500,00 €: 3.800,00 € − 500,00 € = 3.300,00 €.","norm":"Proximus 5, Tarif Hausrat Ziff. 3.3; VHB 2021 Ziff. 17.7","id":"4.9-2-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die passende Einordnung nach den Bedingungen zu.","paare":[["Starkregenwasser sammelt sich auf dem Grundstück und läuft in den Keller","Überschwemmung"],["Abwasser drückt aus dem Kanal durch den Bodenablauf der Waschküche","Rückstau"],["Durch anhaltende Nässe rutscht der Hang hinter dem Haus ab","Erdrutsch"],["Schneelast drückt das Dach des Gartenhauses ein","Schneedruck"],["Grundwasser drückt durch die Kellerwand, ohne an die Oberfläche zu treten","keine versicherte Naturgefahr"]],"erkl":"Überschwemmung verlangt Wasser auf der Geländeoberfläche, Rückstau den Austritt aus gebäudeeigenen Ableitungsrohren. Erdrutsch und Schneedruck sind eigene Naturgefahren. Grundwasser ist nur versichert, wenn es infolge von Niederschlägen oder Ausuferung an die Oberfläche tritt.","norm":"Proximus 5, VGB 2021 Ziff. 5.4.1, 5.4.2, 5.4.5, 5.4.6 und 5.5.3; VHB 2021 Ziff. 6.4 und 6.5.3","id":"4.9-2-3"},{"typ":"wf","frage":"Welche Aussagen zum Elementarschutz der Krügers treffen zu?","aussagen":[["War die Rückstausicherung grob fahrlässig nicht funktionsbereit, kann der Versicherer die Leistung kürzen.",true],["Für 06618 Naumburg (Saale) ohne Vorschaden gilt Elementar-Zone I mit 0,20 ‰.",true],["Der Selbstbehalt wird bei einem Ereignis nur einmal abgezogen, auch wenn Gebäude und Hausrat betroffen sind.",false],["Ohne Einschluss der weiteren Naturgefahren wäre der Starkregenschaden nicht versichert.",true]],"erkl":"Die Rückstausicherung ist eine Sicherheitsvorschrift; bei grober Fahrlässigkeit ist eine Kürzung möglich, soweit die Verletzung ursächlich war. Die Selbstbeteiligung von 500 € gilt in jedem Vertrag je Versicherungsfall. Starkregen fällt nur mit Einschluss unter den Schutz. 06618 steht nicht in der Liste der Zone II, ohne Vorschaden gilt Zone I.","norm":"§ 28 Abs. 2 VVG; Proximus 5, VGB 2021 Ziff. 21.1.4.1 und 21.2; Tarif Wohngebäude Ziff. 6.3; Tarif Hausrat Ziff. 3.3","id":"4.9-2-4"}]},{"typ":"situation","titel":"Fall 3: Herr Franke – Eigentumswohnung, Mieterin und Gemeinschaft","situation":"Jonas Franke besitzt eine Eigentumswohnung in einer Wohnungseigentümergemeinschaft mit zwölf Wohnungen in Halle (Saale). Er hat sie an Frau Lehmann vermietet. Die Gemeinschaft hat eine Wohngebäudeversicherung für das ganze Gebäude einschließlich des Sondereigentums und eine Haus- und Grundbesitzerhaftpflicht abgeschlossen und den Winterdienst einer Firma übertragen. Die Beiträge legt Herr Franke über die Betriebskosten auf Frau Lehmann um, wie im Mietvertrag vereinbart.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Sache richtig zu.","paare":[["Dach und tragende Wände","Gemeinschaftseigentum (Bestand und Sicherheit des Gebäudes)"],["Aufzug und zentrale Klingelanlage","Gemeinschaftseigentum (gemeinschaftlicher Gebrauch)"],["Innentüren in der Wohnung von Herrn Franke","Sondereigentum"],["Möbel von Frau Lehmann","Hausrat der Mieterin"]],"erkl":"Teile, die für Bestand oder Sicherheit des Gebäudes nötig sind, und Einrichtungen für den gemeinschaftlichen Gebrauch sind kein Sondereigentum. Sondereigentum sind die Räume und Bestandteile, die verändert werden können, ohne andere zu beeinträchtigen. Möbel der Mieterin sind ihr Hausrat.","norm":"§ 5 Abs. 1 und 2 WEG","id":"4.9-3-1"},{"typ":"wf","frage":"Welche Aussagen zum Mietverhältnis zwischen Herrn Franke und Frau Lehmann treffen zu?","aussagen":[["Ein undichtes Heizkörperventil muss Frau Lehmann dem Vermieter unverzüglich anzeigen.",true],["Ist die Wohnung nach einem Wasserschaden nur eingeschränkt nutzbar, ist die Miete angemessen gemindert.",true],["Abnutzungen durch vertragsgemäßen Gebrauch muss Frau Lehmann ersetzen.",false],["Die Kosten der Gebäudeversicherung dürfen als Betriebskosten umgelegt werden.",true]],"erkl":"Der Mieter muss Mängel unverzüglich anzeigen; bei geminderter Tauglichkeit mindert sich die Miete kraft Gesetzes. Abnutzung durch vertragsgemäßen Gebrauch hat er nicht zu vertreten. Sach- und Haftpflichtversicherungen des Gebäudes sind umlagefähige Betriebskosten.","norm":"§§ 536, 536c, 538 BGB; § 2 Nr. 13 BetrKV","id":"4.9-3-2"},{"typ":"mc","frage":"Ein Fußgänger stürzt auf dem vereisten Gehweg vor dem Haus, weil die Winterdienstfirma nicht gestreut hat. Welche Versicherung der Eigentümer prüft den Anspruch?","optionen":["die Haus- und Grundbesitzerhaftpflicht der Gemeinschaft","die Privathaftpflichtversicherung von Herrn Franke","die Privathaftpflichtversicherung von Frau Lehmann","die Wohngebäudeversicherung der Gemeinschaft"],"richtig":[0],"erkl":"Die Verkehrssicherungspflicht für das gemeinschaftliche Grundstück trifft die Gemeinschaft; sie haftet neben der beauftragten Firma, wenn sie Auswahl oder Kontrolle vernachlässigt. Dieses Risiko deckt die Haus- und Grundbesitzerhaftpflicht der Gemeinschaft; Versicherungsnehmer ist dort die Gemeinschaft der Wohnungseigentümer. Die Wohngebäudeversicherung deckt keine Ansprüche Dritter.","norm":"§ 19 Abs. 2 Nr. 3 WEG; § 823 Abs. 1 BGB; Proximus 5, AVB PHV 2021 Teil A Abschnitt 4 Ziff. 1 und 3.2","id":"4.9-3-3"},{"typ":"mc","frage":"In der Wohnung von Herrn Franke bricht ein Wasserrohr in der Wand. Wand, das vom Bauträger verlegte Parkett und die Möbel von Frau Lehmann werden nass. Wer ersetzt was?","optionen":["Die Gebäudeversicherung der Gemeinschaft ersetzt Rohr, Wand und Parkett, die Hausratversicherung von Frau Lehmann die Möbel.","Die Hausratversicherung von Frau Lehmann ersetzt Parkett und Möbel, weil sie die Wohnung bewohnt und täglich nutzt.","Herr Franke trägt das Parkett im Sondereigentum selbst, die Gebäudeversicherung der Gemeinschaft nur Rohr und Wand.","Die Gebäudeversicherung der Gemeinschaft ersetzt alles, auch die Möbel von Frau Lehmann, weil sie im Gebäude stehen."],"richtig":[0],"erkl":"Die Wohngebäudeversicherung der Gemeinschaft umfasst hier das ganze Gebäude, also Gemeinschafts- und Sondereigentum; das vom Bauträger verlegte Parkett ist Gebäudebestandteil. Bewegliche Sachen der Mieterin sind Hausrat und über ihre eigene Hausratversicherung gegen Leitungswasser versichert.","norm":"Proximus 5, VGB 2021 Ziff. 4.3.1, 6 und 7.2; VHB 2021 Ziff. 5.2; § 5 WEG","id":"4.9-3-4"}]}]},{"nr":"4.10","titel":"Rechenwerkstatt: Hausratbeitrag","lf":"LF 4","buch":"S. 180–227","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Frau Sommer – erste eigene Wohnung","situation":"Lea Sommer (27), Pflegefachfrau, ist am 01.03.2026 in eine Mietwohnung in der Großen Ulrichstraße eingezogen. Sie möchte ihr Rad (1 % der VS) mitversichern; Laufzeit ein Jahr. Wohnfläche: 62 m², Anschrift: 06108 Halle (Saale), Altstadt. Die Versicherungssumme soll den Unterversicherungsverzicht sichern (Klausel 7712). Zahlungsweise: jährlich. Rechnen Sie mit dem Tarif Hausrat aus Proximus 5 (Tarifblatt).","items":[{"typ":"zahl","frage":"Ermitteln Sie für Frau Sommer die Versicherungssumme mit Unterversicherungsverzicht (Klausel 7712).","wert":40300.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 62 m² × 650 € = 40.300,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.10-1-1"},{"typ":"zahl","frage":"Ermitteln Sie für Frau Sommer den Gesamtprämiensatz der Hausratversicherung in ‰ (Grundprämie und alle Zuschläge).","wert":3.3,"einheit":"‰","tol":0.001,"erkl":"PLZ 06108 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.10-1-2"},{"typ":"zahl","frage":"Berechnen Sie für Frau Sommer die Nettojahresprämie der Hausratversicherung vor allen Nachlässen und ohne Versicherungsteuer.","wert":132.99,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 62 m² × 650 € = 40.300,00 €. PLZ 06108 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 40.300,00 € × 3,30 ‰ = 132,99 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.10-1-3"},{"typ":"zahl","frage":"Wie hoch ist der Abschlag in Euro, den Frau Sommer in der Hausratversicherung für die jährliche Zahlung erhält?","wert":6.65,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 62 m² × 650 € = 40.300,00 €. PLZ 06108 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 40.300,00 € × 3,30 ‰ = 132,99 €; − Abschlag für jährliche Zahlung 5 % von 132,99 € = 6,65 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat; Proximus 5, Tarif Ziff. 0.1–0.3 (Mindestprämie, Dauernachlass, Ratenzahlung)","id":"4.10-1-4"},{"typ":"zahl","frage":"Welchen Betrag zahlt Frau Sommer für die Hausratversicherung jährlich einschließlich Versicherungsteuer?","wert":146.74,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 62 m² × 650 € = 40.300,00 €. PLZ 06108 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 40.300,00 € × 3,30 ‰ = 132,99 €; − Abschlag für jährliche Zahlung 5 % von 132,99 € = 6,65 €; Nettoprämie gemäß Zahlungsweise: 126,34 €. Versicherungsteuer Hausrat 16,15 % auf die Jahresprämie: 126,34 € × 16,15 % = 20,40 €. Zu zahlen jährlich: 126,34 € + 20,40 € = 146,74 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.10-1-5"},{"typ":"mc","frage":"Welche Tarifzone und welche Grundprämie gelten für die Wohnung von Frau Sommer in 06108 Halle (Saale), Altstadt?","optionen":["Zone H I mit 1,70 ‰","Zone H IV mit 2,70 ‰","Zone H II mit 2,00 ‰","Zone H III mit 2,30 ‰"],"richtig":[1],"erkl":"Laut Zonentabelle (Tarif Hausrat Ziff. 1.3) gehört die PLZ 06108 zur Zone H IV; die Grundprämie für eine ständig bewohnte Wohnung beträgt dort 2,70 ‰ der VS (Ziff. 2.1.1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.10-1-6"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Tarifzonen nach Postleitzahl (Auszug aus den Proximus-Tabellen)","kopf":["PLZ","Ort","Hausrat","Wohngebäude Leitungswasser","Wohngebäude Sturm/Hagel","weitere Naturgefahren"],"zeilen":[["06108","Halle (Saale), Altstadt","H IV","II","I","I"],["06110","Halle (Saale), Südliche Innenstadt","H IV","II","I","I"],["06114","Halle (Saale), Paulusviertel","H IV","II","I","I"],["06120","Halle (Saale), Heide-Süd","H IV","II","I","I"],["06122","Halle (Saale), Neustadt","H IV","II","I","I"],["06217","Merseburg","H II","I","I","I"],["06366","Köthen (Anhalt)","H I","I","I","I"],["06526","Sangerhausen","H II","I","I","I"],["06618","Naumburg (Saale)","H II","I","I","I"],["06844","Dessau-Roßlau","H II","II","I","I"],["06886","Lutherstadt Wittenberg","H I","I","I","I"],["04109","Leipzig, Zentrum","H III","I","I","I"],["04277","Leipzig, Connewitz","H III","I","I","I"],["01067","Dresden, Innere Altstadt","H I","I","I","I"],["39104","Magdeburg, Altstadt","H III","II","I","I"],["99084","Erfurt, Altstadt","H II","II","I","I"],["10115","Berlin, Mitte","H V","II","I","I"]],"hinweis":"Weitere Naturgefahren: Zone II für die im Tarif genannten PLZ oder bei einem Vorschaden in den letzten 10 Jahren; bei 2 oder mehr Vorschäden keine Risikoübernahme. Quelle: Tarif Hausrat Ziff. 1.3 und 3.6, Tarif Wohngebäude Ziff. 1.1–1.3."},{"titel":"Tarif Hausrat (Proximus 5, Auszug) – Prämien je 1.000 € VS, ohne Steuer","kopf":["Merkmal","H I","H II","H III","H IV","H V","H VI"],"zeilen":[["2.1.1 Grundprämie Hauptwohnung","1,70 ‰","2,00 ‰","2,30 ‰","2,70 ‰","3,20 ‰","3,90 ‰"],["2.2.2 Klausel 7110 Fahrrad je 1 % der VS","0,30 ‰","0,40 ‰","0,50 ‰","0,60 ‰","0,70 ‰","0,80 ‰"],["2.2.1 Wertsachen von 20 % auf 25 %","0,20 ‰","0,30 ‰ reifamilienhaus in Merseburg (Massivbau, drei Wohnungen, im Antrag „Mehrfamilienhaus“). Weil der Ermittlungsbogen nur für Ein- und Zweifamilienhäuser gilt, hat ein Sachverständiger die VS 1914 mit 52.400 M festgestellt. Versichert werden Feuer, Leitungswasser und Sturm/Hagel sowie Gebäudebeschädigungen durch unbefugte Dritte (Klausel 7361); Laufzeit drei Jahre. Anschrift: 06217 Merseburg. Anpassungsfaktor 2026: 27,63. Zahlungsweise: jährlich. Rechnen Sie mit dem Tarif Wohngebäude aus Proximus 5 (Tarifblatt).","items":[{"typ":"zahl","frage":"Ermitteln Sie für Herrn Krause den Gesamtprämiensatz der Wohngebäudeversicherung in ‰ (Grundprämie und alle Zuschläge).","wert":0.84,"einheit":"‰","tol":0.001,"erkl":"PLZ 06217 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ + Klausel 7361 Gebäudebeschädigung durch Unbefugte 0,09 ‰ = 0,84 ‰. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.11-4-1"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Krause die Jahresprämie 1914 (in M, auf zwei Nachkommastellen).","wert":44.02,"einheit":"M","tol":0.01,"erkl":"PLZ 06217 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ + Klausel 7361 Gebäudebeschädigung durch Unbefugte 0,09 ‰ = 0,84 ‰. Jahresprämie 1914: 52.400 M × 0,84 ‰ = 44,02 M. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.11-4-2"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Krause die Nettojahresprämie der Wohngebäudeversicherung vor allen Nachlässen und ohne Versicherungsteuer.","wert":1216.27,"einheit":"€","tol":0.01,"erkl":"PLZ 06217 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ + Klausel 7361 Gebäudebeschädigung durch Unbefugte 0,09 ‰ = 0,84 ‰. Jahresprämie 1914: 52.400 M × 0,84 ‰ = 44,02 M. Nettojahresprämie: 44,02 M × Anpassungsfaktor 27,63 = 1.216,27 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.11-4-3"},{"typ":"zahl","frage":"Wie hoch ist die Prämie der Wohngebäudeversicherung von Herrn Krause nach Abzug des Mehrfamilienhausrabatts?","wert":1094.64,"einheit":"€","tol":0.01,"erkl":"PLZ 06217 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ + Klausel 7361 Gebäudebeschädigung durch Unbefugte 0,09 ‰ = 0,84 ‰. Jahresprämie 1914: 52.400 M × 0,84 ‰ = 44,02 M. Nettojahresprämie: 44,02 M × Anpassungsfaktor 27,63 = 1.216,27 €; − Mehrfamilienhausrabatt 10 % von 1.216,27 € = 121,63 €; verbleiben 1.094,64 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.11-4-4"},{"typ":"zahl","frage":"Welchen Betrag zahlt Herr Krause für die Wohngebäudeversicherung jährlich einschließlich Versicherungsteuer?","wert":1088.85,"einheit":"€","tol":0.01,"erkl":"PLZ 06217 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ + Klausel 7361 Gebäudebeschädigung durch Unbefugte 0,09 ‰ = 0,84 ‰. Jahresprämie 1914: 52.400 M × 0,84 ‰ = 44,02 M. Nettojahresprämie: 44,02 M × Anpassungsfaktor 27,63 = 1.216,27 €; − Mehrfamilienhausrabatt 10 % von 1.216,27 € = 121,63 €; verbleiben 1.094,64 €. − Dauernachlass (3 Jahre) 10 % von 1.094,64 € = 109,46 €; verbleiben 985,18 €. − Abschlag für jährliche Zahlung 5 % von 985,18 € = 49,26 €; Nettoprämie gemäß Zahlungsweise: 935,92 €. Versicherungsteuer Wohngebäude mit Feuer 16,34 % auf die Jahresprämie: 935,92 € × 16,34 % = 152,93 €. Zu zahlen jährlich: 935,92 € + 152,93 € = 1.088,85 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.11-4-5"},{"typ":"mc","frage":"Warum erhält Herr Krause den Mehrfamilienhausrabatt?","optionen":["Jedes vermietete Haus erhält ihn ohne jede Grenze.","Die VS 1914 des Mehrfamilienhauses liegt ab 50.000 M.","Er gilt für alle Häuser mit Selbstbeteiligung.","Er ersetzt bei vermieteten Häusern den Dauernachlass."],"richtig":[1],"erkl":"Tarif Wohngebäude Ziff. 3.2: Mehrfamilienhäuser mit einer VS ab 50.000 M/1914 erhalten 10 % auf die Tarifprämie; hier 52.400 M.","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.11-4-6"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antr
