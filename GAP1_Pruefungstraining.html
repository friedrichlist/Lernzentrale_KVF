ht er in ein gemietetes Haus mit 95 m² in 06618 Naumburg (Saale). Die VS wird auf die neue Mindestsumme angepasst; die übrigen Vereinbarungen bleiben.","items":[{"typ":"zahl","frage":"Wie hoch war der bisherige Jahresnettobeitrag der Hausratversicherung von Herrn Peters in Leipzig?","wert":122.15,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 72 m² × 650 €/m² = 46.800,00 €. PLZ 04109 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 46.800,00 € × 2,80 ‰ = 131,04 €. Zuschlagssätze: Überspannung 0,10 ‰; Zuschläge = 46.800,00 € × 0,10 ‰ = 4,68 €. Beitrag einschließlich Zuschlägen: 131,04 € + 4,68 € = 135,72 €. Nachlässe: Laufzeit 3 Jahre 10 %; Nachlass = 135,72 € × 10 % = 13,57 €. Jahresnettobeitrag: 135,72 € − 13,57 € = 122,15 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.13-2-1"},{"typ":"zahl","frage":"Wie hoch ist der neue Jahresnettobeitrag der Hausratversicherung von Herrn Peters in Naumburg (Saale)?","wert":72.25,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 €/m² = 61.750,00 €. PLZ 06618 → Tarifzone 1, Beitragssatz 1,20 ‰; Grundbeitrag = 61.750,00 € × 1,20 ‰ = 74,10 €. Zuschlagssätze: Überspannung 0,10 ‰; Zuschläge = 61.750,00 € × 0,10 ‰ = 6,18 €. Beitrag einschließlich Zuschlägen: 74,10 € + 6,18 € = 80,28 €. Nachlässe: Laufzeit 3 Jahre 10 %; Nachlass = 80,28 € × 10 % = 8,03 €. Jahresnettobeitrag: 80,28 € − 8,03 € = 72,25 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.13-2-2"},{"typ":"zahl","frage":"Für wie viele Monate wird bei Herrn Peters der Unterschiedsbetrag bis zum Ende des Versicherungsjahres berechnet?","wert":5.0,"einheit":"Monate","tol":0,"erkl":"Versicherungsjahr 01.04.2026 bis 31.03.2027; Ereignis am 03.11.2026 → neuer Beitrag ab 01.11.2026; Restmonate bis Ende des Versicherungsjahres: 5 Monate. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Wohnungswechsel","id":"4.13-2-3"},{"typ":"zahl","frage":"Berechnen Sie den Nach- bzw. Rückbeitrag für Herrn Peters bis zum Ende des Versicherungsjahres (Betrag ohne Vorzeichen, ohne Versicherungsteuer).","wert":20.79,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 72 m² × 650 €/m² = 46.800,00 €. PLZ 04109 → Tarifzone 4, Beitragssatz 2,80 ‰; Grundbeitrag = 46.800,00 € × 2,80 ‰ = 131,04 €. Zuschlagssätze: Überspannung 0,10 ‰; Zuschläge = 46.800,00 € × 0,10 ‰ = 4,68 €. Beitrag einschließlich Zuschlägen: 131,04 € + 4,68 € = 135,72 €. Nachlässe: Laufzeit 3 Jahre 10 %; Nachlass = 135,72 € × 10 % = 13,57 €. Jahresnettobeitrag: 135,72 € − 13,57 € = 122,15 €. Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 €/m² = 61.750,00 €. PLZ 06618 → Tarifzone 1, Beitragssatz 1,20 ‰; Grundbeitrag = 61.750,00 € × 1,20 ‰ = 74,10 €. Zuschlagssätze: Überspannung 0,10 ‰; Zuschläge = 61.750,00 € × 0,10 ‰ = 6,18 €. Beitrag einschließlich Zuschlägen: 74,10 € + 6,18 € = 80,28 €. Nachlässe: Laufzeit 3 Jahre 10 %; Nachlass = 80,28 € × 10 % = 8,03 €. Jahresnettobeitrag: 80,28 € − 8,03 € = 72,25 €. Unterschied der Jahresnettobeiträge: 72,25 € − 122,15 € = −49,90 €. Versicherungsjahr 01.04.2026 bis 31.03.2027; Ereignis am 03.11.2026 → neuer Beitrag ab 01.11.2026; Restmonate bis Ende des Versicherungsjahres: 5 Monate. Rückbeitrag = −49,90 € × 5 ÷ 12 = −20,79 €, also Rückbeitrag von 20,79 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VHB, Wohnungswechsel","id":"4.13-2-4"},{"typ":"mc","frage":"Ergibt sich für Herrn Peters ein Nach- oder ein Rückbeitrag?","optionen":["Ein Nachbeitrag, weil die neue Wohnung größer ist.","Keiner, die Änderung gilt erst ab Hauptfälligkeit.","Ein Rückbeitrag, weil der neue Jahresbeitrag sinkt.","Ein Nachbeitrag, weil er die Stadt gewechselt hat."],"richtig":[2],"erkl":"Neuer Jahresnettobeitrag 72,25 € < alter 122, ","1"],["06618","Naumburg (Saale)","1"],["06844","Dessau-Roßlau","2"],["06886","Lutherstadt Wittenberg","2"],["39104","Magdeburg – Altstadt","3"],["99084","Erfurt – Altstadt","3"]],"hinweis":""},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addieren und in einem Schritt anwenden (VS × Summe der Zuschlagssätze ÷ 1.000). Nachlässe addieren und in einem Schritt auf den Beitrag einschließlich Zuschlägen anwenden."}]},{"typ":"situation","titel":"Fall 3: Familie Zimmermann – Anbau fertig","situation":"Jan Zimmermann hat sein Einfamilienhaus in 06120 Halle (Saale) (Baujahr 1999, mittlere Ausstattung, Vollkeller, Einzelgarage) mit Versicherungsjahr 01.07. bis 30.06. versichert: Feuer, Leitungswasser, Sturm/Hagel, VS 1914 nach Summenermittlungsbogen, Selbstbeteiligung 500 €, jährliche Zahlung. Die Wohnfläche betrug 120 m². Am 21.02.2027 wird ein unterkellerter Anbau fertig; die Wohnfläche steigt auf 150 m². Die VS 1914 wird neu nach dem Bogen ermittelt.","items":[{"typ":"zahl","frage":"Wie hoch war die bisherige VS 1914 (in Mark) für das Haus von Herrn Zimmermann mit 120 m²?","wert":21800.0,"einheit":"Mark","tol":0,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 120 m² × 160 Mark = 19.200 Mark + Vollkeller 120 m² × 12 Mark = 1.440 Mark + Einzelgarage 1.100 Mark = 21.740 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 21.800 Mark. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.13-3-1"},{"typ":"zahl","frage":"Wie hoch ist die neue VS 1914 (in Mark) für das Haus von Herrn Zimmermann nach dem Anbau (150 m²)?","wert":26900.0,"einheit":"Mark","tol":0,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 150 m² × 160 Mark = 24.000 Mark + Vollkeller 150 m² × 12 Mark = 1.800 Mark + Einzelgarage 1.100 Mark = 26.900 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 26.900 Mark. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.13-3-2"},{"typ":"zahl","frage":"Um wie viel Euro steigt der Jahresnettobeitrag der Wohngebäudeversicherung von Herrn Zimmermann durch den Anbau?","wert":176.18,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 120 m² × 160 Mark = 19.200 Mark + Vollkeller 120 m² × 12 Mark = 1.440 Mark + Einzelgarage 1.100 Mark = 21.740 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 21.800 Mark. PLZ 06120 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 21.800 Mark × 1,60 ‰ = 34,88 Mark. Jahresbeitrag vor Nachlässen = 34,88 Mark × 25,40 (gleitender Neuwertfaktor) = 885,95 €. Nachlässe: Selbstbeteiligung 500 € 15 %; Nachlass = 885,95 € × 15 % = 132,89 €. Jahresnettobeitrag: 885,95 € − 132,89 € = 753,06 €. Summenermittlungsbogen: Grundwert mittlere Ausstattung 150 m² × 160 Mark = 24.000 Mark + Vollkeller 150 m² × 12 Mark = 1.800 Mark + Einzelgarage 1.100 Mark = 26.900 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 26.900 Mark. PLZ 06120 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 26.900 Mark × 1,60 ‰ = 43,04 Mark. Jahresbeitrag vor Nachlässen = 43,04 Mark × 25,40 (gleitender Neuwertfaktor) = 1.093,22 €. Nachlässe: Selbstbeteiligung 500 € 15 %; Nachlass = 1.093,22 € × 15 % = 163,98 €. Jahresnettobeitrag: 1.093,22 € − 163,98 € = 929,24 €. Unterschied der Jahresnettobeiträge: 929,24 € − 753,06 € = 176,18 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.13-3-3"},{"typ":"zahl","frage":"Berechnen Sie den Nachbeitrag (ohne Versicherungsteuer), den Herr Zimmermann bis zum Ende des Versicherungsjahres zahlen muss.","wert":73.41,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 120 m² × 160 Mark = 19.200 Mark + Vollkeller 120 m² × 12 Mark = 1.440 Mark + Einzelgarage 1.100 Mark = 21.740 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 21.800 Mark. PLZ 06120 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 21.800 Mark × 1,60 ‰ = 34,88 Mark. Jahresbeitrag vor Nachlässen = 34,88 Mark × 25,40 (gleitender Neuwertfaktor) = 885,95 €. Nachlässe: Selbstbeteiligung 500 € 15 %; Nachlass = 885,95 € × 15 % = 132,89 €. Jahresnettobeitrag: 885,95 € − 132,89 € = 753,06 €. Summenermittlungsbogen: Grundwert mittlere Ausstattung 150 m² × 160 Mark = 24.000 Mark + Vollkeller 150 m² × 12 Mark = 1.800 Mark + Einzelgarage 1.100 Mark = 26.900 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 26.900 Mark. PLZ 06120 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 26.900 Mark × 1,60 ‰ = 43,04 Mark. Jahresbeitrag vor Nachlässen = 43,04 Mark × 25,40 (gleitender Neuwertfaktor) = 1.093,22 €. Nachlässe: Selbstbeteiligung 500 € 15 %; Nachlass = 1.093,22 € × 15 % = 163,98 €. Jahresnettobeitrag: 1.093,22 € − 163,98 € = 929,24 €. Unterschied der Jahresnettobeiträge: 929,24 € − 753,06 € = 176,18 €. Versicherungsjahr 01.07.2026 bis 30.06.2027; Ereignis am 21.02.2027 → neuer Beitrag ab 01.02.2027; Restmonate bis Ende des Versicherungsjahres: 5 Monate. Nachbeitrag = 176,18 € × 5 ÷ 12 = 73,41 €, also Nachbeitrag von 73,41 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.13-3-4"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Nach- und Rückbeitrag","kopf":["Anlass","Regel"],"zeilen":[["Vertragsänderung (Umzug, Anbau, Wegfall eines Bausteins)","neuer Beitrag ab dem 1. des Monats, in den das Ereignis fällt"],["Vertragsende nach Veräußerung","Beitrag nur bis zum Vertragsende (§ 39 Abs. 1 VVG); Rückbeitrag für die vollen Monate danach bis Ende des Versicherungsjahres"],["Berechnung","(neuer − alter Jahresnettobeitrag) × Restmonate bis Ende des Versicherungsjahres ÷ 12"],["Vorzeichen","Ergebnis positiv = Nachbeitrag, negativ = Rückbeitrag; bei Vertragsende ist der neue Beitrag 0,00 €. Antwort: Betrag ohne Vorzeichen"]],"hinweis":"Grundlage ist der Jahresnettobeitrag (ohne Ratenzuschlag und Versicherungsteuer)."},{"titel":"Tarifzonen nach Postleitzahl (Auszug, Hausrat und Wohngebäude)","kopf":["PLZ","Ort","Tarifzone"],"zeilen":[["01067","Dresden – Innere Altstadt","4"],["04109","Leipzig – Zentrum","4"],["04277","Leipzig – Connewitz","4"],["06108","Halle (Saale) – Altstadt","3"],["06110","Halle (Saale) – Südliche Innenstadt","3"],["06114","Halle (Saale) – Paulusviertel","3"],["06120","Halle (Saale) – Heide-Süd","2"],["06122","Halle (Saale) – Neustadt","2"],["06217","Merseburg","2"],["06366","Köthen (Anhalt)","1"],["06484","Quedlinburg","1"],["06526","Sangerhausen","1"],[" gsende ist der neue Beitrag 0,00 €. Antwort: Betrag ohne Vorzeichen"]],"hinweis":"Grundlage ist der Jahresnettobeitrag (ohne Ratenzuschlag und Versicherungsteuer)."},{"titel":"Tarifzonen nach Postleitzahl (Auszug, Hausrat und Wohngebäude)","kopf":["PLZ","Ort","Tarifzone"],"zeilen":[["01067","Dresden – Innere Altstadt","4"],["04109","Leipzig – Zentrum","4"],["04277","Leipzig – Connewitz","4"],["06108","Halle (Saale) – Altstadt","3"],["06110","Halle (Saale) – Südliche Innenstadt","3"],["06114","Halle (Saale) – Paulusviertel","3"],["06120","Halle (Saale) – Heide-Süd","2"],["06122","Halle (Saale) – Neustadt","2"],["06217","Merseburg","2"],["06366","Köthen (Anhalt)","1"],["06484","Quedlinburg","1"],["06526","Sangerhausen","1"],["06618","Naumburg (Saale)","1"],["06844","Dessau-Roßlau","2"],["06886","Lutherstadt Wittenberg","2"],["39104","Magdeburg – Altstadt","3"],["99084","Erfurt – Altstadt","3"]],"hinweis":""},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addieren und in einem Schritt anwenden (VS × Summe der Zuschlagssätze ÷ 1.000). Nachlässe addieren und in einem Schritt auf den Beitrag einschließlich Zuschlägen anwenden."},{"titel":"Versicherungsteuer (§ 6 Abs. 2 i. V. m. § 5 Abs. 1 VersStG)","kopf":["Sparte","Steuer","wirksamer Satz"],"zeilen":[["Hausrat","19 % auf 85 % des Entgelts","16,15 %"],["Wohngebäude","19 % auf 86 % des Entgelts","16,34 %"],["Glas","19 % des Entgelts","19,00 %"]],"hinweis":"Bemessungsgrundlage ist der Jahresbeitrag einschließlich Ratenzuschlag. Bruttorate = Jahresbruttobeitrag ÷ Zahl der Raten, auf Cent gerundet. Feuerschutzsteuer wird in der Übung nicht gesondert berechnet."}]},{"typ":"situation","titel":"Fall 5: Frau Meier – Haus verkauft","situation":"Gisela Meier hat ihr Haus in 06886 Lutherstadt Wittenberg verkauft (104 m², Baujahr 1984, mittlere Ausstattung, Vollkeller, Einzelgarage; versichert: Feuer, Leitungswasser, Sturm/Hagel, VS 1914 nach Bogen, Dauernachlass 3 Jahre, Versicherungsjahr 01.01. bis 31.12., Beitrag im Januar gezahlt). Der Erwerber wird am 30.09.2026 im Grundbuch eingetragen und kündigt den Vertrag am selben Tag mit sofortiger Wirkung.","items":[{"typ":"zahl","frage":"Wie hoch ist der Jahresnettobeitrag der Wohngebäudeversicherung, den Frau Meier für 2026 gezahlt hat?","wert":694.94,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 104 m² × 160 Mark = 16.640 Mark + Vollkeller 104 m² × 12 Mark = 1.248 Mark + Einzelgarage 1.100 Mark = 18.988 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 19.000 Mark. PLZ 06886 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 19.000 Mark × 1,60 ‰ = 30,40 Mark. Jahresbeitrag vor Nachlässen = 30,40 Mark × 25,40 (gleitender Neuwertfaktor) = 772,16 €. Nachlässe: Dauernachlass 3 Jahre 10 %; Nachlass = 772,16 € × 10 % = 77,22 €. Jahresnettobeitrag: 772,16 € − 77,22 € = 694,94 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.13-5-1"},{"typ":"zahl","frage":"Für wie viele volle Monate erhält Frau Meier nach dem Übungstarif einen Rückbeitrag?","wert":3.0,"einheit":"Monate","tol":0,"erkl":"Versicherungsjahr 01.01.2026 bis 31.12.2026; Vertragsende am 30.09.2026 → Beitrag bis Ende September; Rückbeitrag ab 01.10.2026 für 3 Monate (volle Monate bis Ende des Versicherungsjahres). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 39 Abs. 1 VVG","id":"4.13-5-2"},{"typ":"zahl","frage":"Berechnen Sie den Rückbeitrag (ohne Versicherungsteuer), den Frau Meier erhält.","wert":173.74,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 104 m² × 160 Mark = 16.640 Mark + Vollkeller 104 m² × 12 Mark = 1.248 Mark + Einzelgarage 1.100 Mark = 18.988 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 19.000 Mark. PLZ 06886 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 19.000 Mark × 1,60 ‰ = 30,40 Mark. Jahresbeitrag vor Nachlässen = 30,40 Mark × 25,40 (gleitender Neuwertfaktor) = 772,16 €. Nachlässe: Dauernachlass 3 Jahre 10 %; Nachlass = 772,16 € × 10 % = 77,22 €. Jahresnettobeitrag: 772,16 € − 77,22 € = 694,94 €. Neuer Jahresnettobeitrag nach Vertragsende: 0,00 €. Unterschied der Jahresnettobeiträge: 0,00 € − 694,94 € = −694,94 €. Versicherungsjahr 01.01.2026 bis 31.12.2026; Vertragsende am 30.09.2026 → Beitrag bis Ende September; Rückbeitrag ab 01.10.2026 für 3 Monate (volle Monate bis Ende des Versicherungsjahres). Rückbeitrag = −694,94 € × 3 ÷ 12 = −173,74 €, also Rückbeitrag von 173,74 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 39 Abs. 1 VVG","id":"4.13-5-3"},{"typ":"zahl","frage":"Berechnen Sie den Rückbeitrag für Frau Meier einschließlich der anteiligen Versicherungsteuer (Wohngebäude 16,34 %).","wert":202.13,"einheit":"€","tol":0.01,"erkl":"Summenermittlungsbogen: Grundwert mittlere Ausstattung 104 m² × 160 Mark = 16.640 Mark + Vollkeller 104 m² × 12 Mark = 1.248 Mark + Einzelgarage 1.100 Mark = 18.988 Mark. Auf volle 100 Mark aufgerundet: VS 1914 = 19.000 Mark. PLZ 06886 → Tarifzone 2; Beitragssatz: Feuer 0,45 ‰ + Leitungswasser 0,85 ‰ + Sturm/Hagel 0,30 ‰ = 1,60 ‰. Grundbeitrag 1914 = 19.000 Mark × 1,60 ‰ = 30,40 Mark. Jahresbeitrag vor Nachlässen = 30,40 Mark × 25,40 (gleitender Neuwertfaktor) = 772,16 €. Nachlässe: Dauernachlass 3 Jahre 10 %; Nachlass = 772,16 € × 10 % = 77,22 €. Jahresnettobeitrag: 772,16 € − 77,22 € = 694,94 €. Neuer Jahresnettobeitrag nach Vertragsende: 0,00 €. Unterschied der Jahresnettobeiträge: 0,00 € − 694,94 € = −694,94 €. Versicherungsjahr 01.01.2026 bis 31.12.2026; Vertragsende am 30.09.2026 → Beitrag bis Ende September; Rückbeitrag ab 01.10.2026 für 3 Monate (volle Monate bis Ende des Versicherungsjahres). Rückbeitrag = −694,94 € × 3 ÷ 12 = −173,74 €, also Rückbeitrag von 173,74 €. Mit anteiliger Versicherungsteuer: 173,74 € + 173,74 € × 16,34 % (28,39 €) = 202,13 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; § 5, § 6 VersStG","id":"4.13-5-4"},{"typ":"mc","frage":"Wer schuldet nach der sofortigen Kündigung durch den Erwerber die Prämie bis zum Vertragsende?","optionen":["Der Erwerber, weil er nun Eigentümer ist.","Die Veräußerin Frau Meier allein (§ 96 Abs. 3 VVG).","Veräußerin und Erwerber als Gesamtschuldner.","Niemand, der Vertrag wird rückwirkend aufgehoben."],"richtig":[1],"erkl":"Kündigt der Erwerber nach § 96 Abs. 2 VVG, ist der Veräußerer zur Zahlung der Prämie verpflichtet; der Erwerber haftet nicht (§ 96 Abs. 3 VVG). Für die Zeit nach dem Vertragsende steht dem Versicherer keine Prämie zu (§ 39 Abs. 1 VVG). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"§ 39 Abs. 1, § 96 Abs. 2 und 3 VVG","id":"4.13-5-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobei HB","id":"4.14-1-4"},{"typ":"mc","frage":"Warum erhält Herr Wolff nicht den vollen Schaden ersetzt?","optionen":["Leitungswasserschäden werden immer nur zur Hälfte ersetzt.","Möbel sind in der Hausratversicherung nicht versichert.","Die VS liegt unter dem Versicherungswert; ein Verzicht fehlt.","Er hat den Schaden zu spät, nach drei Tagen gemeldet."],"richtig":[2],"erkl":"Die VS von 38.000,00 € liegt unter der Mindestsumme mit Verzicht und unter dem Versicherungswert; daher Kürzung nach § 75 VVG im Verhältnis VS : Versicherungswert. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"§ 75 VVG; Übungstarif PROXIMUS Wohnen 2026; VHB","id":"4.14-1-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Hausrat: Versicherungssumme, Beitrag, Zuschläge, Nachlässe","kopf":["Merkmal","Tarif"],"zeilen":[["VS mit Unterversicherungsverzicht","Wohnfläche × 650 €/m²; höhere VS möglich; niedrigere VS → kein Unterversicherungsverzicht"],["Beitragssatz (Grundbeitrag)","Zone 1: 1,20 ‰ · Zone 2: 1,60 ‰ · Zone 3: 2,10 ‰ · Zone 4: 2,80 ‰ der VS"],["Zuschlag Fahrraddiebstahl (bis 1 % der VS)","0,40 ‰ der VS"],["Zuschlag Überspannung durch Blitz","0,10 ‰ der VS"],["Zuschlag weitere Naturgefahren (ZÜRS)","GK 1: 0,15 ‰ · GK 2: 0,30 ‰ · GK 3: 0,90 ‰ der VS · GK 4: nur auf Anfrage"],["Nachlass Selbstbeteiligung 150 € je Schaden","10 %"],["Nachlass Laufzeit 3 Jahre (Dauernachlass)","10 %"],["Nachlass Einbruchmeldeanlage (VdS)","5 %"]],"hinweis":"Grundbeitrag = VS × Beitragssatz ÷ 1.000. Zuschlagssätze addie  Kaiser – Sturm und zu niedriger Neubauwert","situation":"Bernd Kaiser hat sein Haus in Merseburg 2026 gegen Feuer, Leitungswasser und Sturm/Hagel über den Baupreisindex versichert: Er gab einen Neubauwert von 465.500,00 € (Preisstand 2026) an. Nach einem Sturmschaden am 19.02.2027 in Höhe von 36.400,00 € ermittelt ein Gutachter den tatsächlichen Neubauwert mit 588.000,00 € (Preisstand 2026).","items":[{"typ":"zahl","frage":"Wie hoch ist die vereinbarte VS 1914 (in Mark) von Herrn Kaiser, ermittelt über den Baupreisindex?","wert":19000.0,"einheit":"Mark","tol":0,"erkl":"VS 1914 = 465.500,00 € ÷ 2.450,0 × 100 = 19.000,000 Mark ≈ 19.000 Mark (kaufmännisch auf volle Mark). Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-5-1"},{"typ":"zahl","frage":"Wie hoch ist der Versicherungswert 1914 (in Mark) des Hauses von Herrn Kaiser nach dem Gutachten?","wert":24000.0,"einheit":"Mark","tol":0,"erkl":"Versicherungswert 1914 = 588.000,00 € ÷ 2.450,0 × 100 = 24.000,000 Mark ≈ 24.000 Mark. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-5-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung, die Herr Kaiser für den Sturmschaden erhält.","wert":28816.67,"einheit":"€","tol":0.01,"erkl":"VS 1914 = 465.500,00 € ÷ 2.450,0 × 100 = 19.000,000 Mark ≈ 19.000 Mark (kaufmännisch auf volle Mark). Versicherungswert 1914 = 588.000,00 € ÷ 2.450,0 × 100 = 24.000,000 Mark ≈ 24.000 Mark. Kein Unterversicherungsverzicht (VS über Baupreisindex); Entschädigung = 36.400,00 € × 19.000 Mark ÷ 24.000 Mark = 28.816,67 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"§ 75 VVG; Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-5-3"},{"typ":"zahl","frage":"Um wie viel Euro wird die Entschädigung von Herrn Kaiser wegen Unterversicherung gekürzt?","wert":7583.33,"einheit":"€","tol":0.01,"erkl":"VS 1914 = 465.500,00 € ÷ 2.450,0 × 100 = 19.000,000 Mark ≈ 19.000 Mark (kaufmännisch auf volle Mark). Versicherungswert 1914 = 588.000,00 € ÷ 2.450,0 × 100 = 24.000,000 Mark ≈ 24.000 Mark. Kein Unterversicherungsverzicht (VS über Baupreisindex); Entschädigung = 36.400,00 € × 19.000 Mark ÷ 24.000 Mark = 28.816,67 €. Kürzungsbetrag: 36.400,00 € − 28.816,67 € = 7.583,33 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"§ 75 VVG; Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-5-4"},{"typ":"mc","frage":"Warum kürzt der Versicherer die Entschädigung von Herrn Kaiser?","optionen":["Sturmschäden werden nur zum Zeitwert ersetzt.","Der gleitende Neuwertfaktor ist seit 2026 gestiegen.","Die VS 1914 ist zu niedrig und nicht nach Bogen ermittelt.","Sturmschäden unter 50.000 € gelten nicht als versichert."],"richtig":[2],"erkl":"Ohne Summenermittlungsbogen kein Unterversicherungsverzicht; VS 1914 < Versicherungswert 1914, daher Kürzung nach § 75 VVG. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"§ 75 VVG; Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-5-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Wohngebäude: Versicherungssumme 1914","kopf":["Merkmal","Tarif"],"zeilen":[["Grundwert je m² Wohnfläche","einfache Ausstattung 140 Mark · mittlere 160 Mark · gehobene 190 Mark"],["Vollkeller","+ 12 Mark je m² Wohnfläche"],["Fußbodenheizung","+ 6 Mark je m² Wohnfläche"],["Garage","Einzelgarage + 1.100 Mark · Doppelgarage + 1.900 Mark"],["Ausgebautes Dachgeschoss","in der Wohnfläche enthalten, kein Zusc 80,00 €. Aufräumkosten 38.600,00 € übersteigen die Grenze von 30.380,00 € → 30.380,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB, Kosten","id":"4.14-6-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Mietausfall der Einliegerwohnung von Herrn Berger.","wert":7680.0,"einheit":"€","tol":0.01,"erkl":"Mietausfall: 15 Monate (höchstens 12) → 12 × 640,00 € = 7.680,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB, Mietausfall","id":"4.14-6-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Herrn Berger (Gebäudeschaden, Aufräumkosten und Mietausfall).","wert":252060.0,"einheit":"€","tol":0.01,"erkl":"Versicherungssumme in € (Neubauwert 2026): 24.800 Mark × 2.450,0 ÷ 100 = 607.600,00 € (Baupreisindex, nicht der Neuwertfaktor). Grenze Aufräum- und Abbruchkosten: 5 % × 607.600,00 € = 30.380,00 €. Aufräumkosten 38.600,00 € übersteigen die Grenze von 30.380,00 € → 30.380,00 €. Mietausfall: 15 Monate (höchstens 12) → 12 × 640,00 € = 7.680,00 €. Gesamt: Gebäudeschaden 214.000,00 € + Aufräumkosten 30.380,00 € + Mietausfall 7.680,00 € = 252.060,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-6-4"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Wohngebäude: Kosten und Mietausfall","kopf":["Position","Grenze"],"zeilen":[["Versicherungssumme in € (Neubauwert 2026)","VS 1 nheit":"€","tol":0.01,"erkl":"Mietausfall: 7 Monate (höchstens 12) → 7 × 520,00 € = 3.640,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB, Mietausfall","id":"4.14-7-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Frau Arslan.","wert":53890.0,"einheit":"€","tol":0.01,"erkl":"Versicherungssumme in € (Neubauwert 2026): 18.700 Mark × 2.450,0 ÷ 100 = 458.150,00 € (Baupreisindex, nicht der Neuwertfaktor). Grenze Aufräum- und Abbruchkosten: 5 % × 458.150,00 € = 22.907,50 €. Aufräumkosten 3.950,00 € liegen unter der Grenze von 22.907,50 € → 3.950,00 €. Mietausfall: 7 Monate (höchstens 12) → 7 × 520,00 € = 3.640,00 €. Gesamt: Gebäudeschaden 46.300,00 € + Aufräumkosten 3.950,00 € + Mietausfall 3.640,00 € = 53.890,00 €. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-7-4"},{"typ":"wf","frage":"Welche Aussagen zur Entschädigung von Frau Arslan treffen zu?","aussagen":[["Die Aufräumkosten werden voll ersetzt, weil sie unter der 5-%-Grenze liegen.",true],["Der Mietausfall wird nur bis 6 Monate ersetzt.",false],["Die 5-%-Grenze wird aus VS 1914 × Baupreisindex ÷ 100 berechnet.",true],["Der Gebäudeschaden wird wegen Unterversicherung gekürzt.",false]],"erkl":"Grenze 5 % von 458.150,00 € = 22.907,50 €; Mietausfall bis 12 Monate. Die VS nach Bogen sichert den Unterversicherungsverzicht, daher keine Kürzung. Rundung: jedes Zwischenergebnis kaufmännisch auf volle Cent.","norm":"Übungstarif PROXIMUS Wohnen 2026; VGB","id":"4.14-7-5"}],"hilfe":[{"titel":"Rechenregeln (alle Sparten)","kopf":["Regel","Festlegung"],"zeilen":[["Rundung","Jedes Zwischenergebnis kaufmännisch auf volle Cent runden (ab 0,5 Cent aufrunden)."],["Reihenfolge","Grundbeitrag + Zuschläge − Nachlässe = Jahresnettobeitrag; + Ratenzuschlag = Jahresbeitrag; + Versicherungsteuer = Jahresbruttobeitrag"],["Jahresnettobeitrag","nach Zuschlägen und Nachlässen, ohne Ratenzuschlag und ohne Versicherungsteuer"]],"hinweis":"Übungstarif PROXIMUS Wohnen 2026 (fiktiv, nur für die Übung)."},{"titel":"Wohngebäude: Kosten und Mietausfall","kopf":["Position","Grenze"],"zeilen":[["Versicherungssumme in € (Neubauwert 2026)","VS 1914 × 2.450,0 ÷ 100 (Baupreisindex 2026, 1914 = 100)"],["Aufräum- und Abbruchkosten","bis 5 % der Versicherungssumme in €"],["Mietausfall","höchstens 12 Monate"]],"hinweis":"Der Baupreisindex rechnet die VS 1914 in den heutigen Neubauwert um; der gleitende Neuwertfaktor (25,40) dient nur der Beitragsberechnung."}]}]}]},{"nr":"5","titel":"Berufsausübung und Freizeitgestaltung absichern","lf":"LF 5","abschnitte":[{"nr":"5.1","titel":"Beratungsanlässe in Beruf und Freizeit","lf":"LF 5","buch":"S. 234","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Anlass die passende Absicherung zu.","paare":[["Kauf eines Hundes","Tierhalterhaftpflichtversicherung (Hundehalter)"],["Kauf eines eigenen Reitpferdes","Tierhalterhaftpflichtversicherung (Pferdehalter)"],["private Drohne","Haftpflichtversicherung für Drohnen (gesetzliche Versicherungspflicht)"],["Ehrenamt als Trainer im Sportverein","Prüfung der Vereins- bzw. Privathaftpflicht"]],"erkl":"Hunde- und Pferdehalter sind in der normalen Privathaftpflicht nicht versichert; für Drohnen besteht eine Versicherungspflicht.","norm":"§ 833 BGB, § 43 LuftVG","id":"5.1-1-1"},{"typ":"mc","frage":"Welche Haustiere sind in der Privathaftpflicht in der Regel ohne Weiteres mitversichert?","optionen":["Zahme Haustiere wie Katzen oder Kaninchen","Eigene Pferde, die nur gelegentlich geritten werden","Wellensittiche nur, wenn sie in einer Voliere leben","Hunde, sofern sie nicht als gefährlich gelten"],"richtig":[0],"erkl":"Für Hunde und Pferde wird eine eigene Tierhalterhaftpflicht benötigt.","norm":"BBR PHV","id":"5.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Beratungsanlässen treffen zu?","aussagen":[["Der Beginn einer Ausbildung kann die Frage nach der eigenen Haftpflichtversicherung auslösen.",true],["Ein neues Hobby wie Segeln kann zusätzliche Haftpflichtrisiken bringen.",true],["Ein Wechsel des Arbeitgebers hat nie Auswirkungen auf Versicherungen.",false],["Bei Streit mit dem Arbeitgeber hilft eine Rechtsschutzversicherung mit Arbeits-Rechtsschutz.",true]],"erkl":"Beruf und Freizeit verändern Haftungs- und Rechtsschutzrisiken.","norm":"Bedarfsanalyse","id":"5.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Wagner ruft an: Er hat sich einen jungen Labrador gekauft, spielt seit Kurzem Fußball im Verein und fliegt am Wochenende mit einer kleinen Kameradrohne über den Feldern. Er hat bei Ihnen eine Privathaftpflichtversicherung.","items":[{"typ":"mc","frage":"Ist der Hund über seine Privathaftpflicht versichert?","optionen":["Ja, aber nur für Schäden innerhalb der eigenen Wohnung.","Ja, solange der Hund jünger als ein Jahr ist.","Ja, weil alle Haustiere in der Privathaftpflicht mitversichert sind.","Nein, er braucht eine eigene Hundehalterhaftpflichtversicherung."],"richtig":[3],"erkl":"Hundehalter haften als Halter eines Luxustieres verschuldensunabhängig; die PHV schließt Hunde regelmäßig aus.","norm":"§ 833 S. 1 BGB","id":"5.1-2-1"},{"typ":"mc","frage":"Wie ist die Drohne zu beurteilen?","optionen":["Für Drohnen besteht keine Versicherungspflicht, solange sie nur über freie Felder fliegen.","Drohnen sind immer über die Kfz-Haftpflichtversicherung des Halters automatisch mitversichert.","Für Drohnen besteht Versicherungspflicht; ob die Privathaftpflicht sie deckt, ist zu prüfen.","Drohnen sind über die Hausratversicherung gegen Haftpflichtschäden gedeckt."],"richtig":[2],"erkl":"Halter von Luftfahrzeugen, auch unbemannten, müssen eine Haftpflichtversicherung haben.","norm":"§ 43 LuftVG","id":"5.1-2-2"},{"typ":"mc","frage":"Herr Wagner verletzt beim Fußball einen Gegenspieler durch ein normales Foul. Was gilt?","optionen":["Der Verein haftet automatisch und zahlt dem Gegenspieler das Schmerzensgeld.","Bei sportüblichem Verhalten haftet er meist nicht; die Privathaftpflicht wehrt Ansprüche ab.","Er haftet voll, aber die Privathaftpflicht schließt Schäden beim Vereinssport grundsätzlich aus.","Er haftet für jede Verletzung voll, auch bei regelgerechtem Spiel im sportlichen Wettkampf."],"richtig":[1],"erkl":"Wer an einem Kampfspiel teilnimmt, nimmt regelgerechte Verletzungen in Kauf; die PHV übernimmt auch den passiven Rechtsschutz.","norm":"§ 823 BGB, AHB/BBR PHV","id":"5.1-2-3"}]}]},{"nr":"5.2","titel":"Haftungsansprüche analysieren und eigene Ansprüche durchsetzen","lf":"LF 5","buch":"S. 235–238","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Voraussetzungen der Haftung nach § 823 Abs. 1 BGB in die richtige Reihenfolge der Prüfung.","paare":[["1.","Handlung (Tun oder Unterlassen)"],["2.","dadurch verursachte Verletzung eines geschützten Rechtsguts"],["3.","Rechtswidrigkeit"],["4.","Verschulden (Vorsatz oder Fahrlässigkeit)"],["5.","Schaden, der auf der Rechtsgutverletzung beruht"]],"erkl":"Die Reihenfolge dient der Prüfung; fehlt eine Voraussetzung, besteht kein Anspruch aus § 823 Abs. 1 BGB.","norm":"§ 823 Abs. 1 BGB","id":"5.2-1-1"},{"typ":"wf","frage":"Welche Aufgaben übernimmt die Privathaftpflichtversicherung?","aussagen":[["Prüfung, ob und in welcher Höhe der Kunde haftet",true],["Abwehr unberechtigter Ansprüche (passiver Rechtsschutz)",true],["Ersatz berechtigter Ansprüche",true],["Ersatz von Schäden, die der Kunde an eigenen Sachen verursacht",false]],"erkl":"Eigenschäden sind nie Gegenstand der Haftpflichtversicherung.","norm":"§ 100 VVG, AHB","id":"5.2-1-2"},{"typ":"mc","frage":"Ein Fünfjähriger zerkratzt beim Spielen das Auto des Nachbarn. Wer haftet?","optionen":["Das Kind haftet grundsätzlich nicht; die Eltern nur bei Verletzung der Aufsichtspflicht.","Die Eltern haften immer, auch wenn sie ihre Aufsichtspflicht erfüllt haben.","Der Nachbar hat keinerlei Ansprüche, weil Kinder unter zehn Jahren nie haften.","Das Kind haftet ab fünf Jahren voll; die Eltern haften zusätzlich als Gesamtschuldner."],"richtig":[0],"erkl":"Kinder unter sieben Jahren sind nicht deliktsfähig; die Eltern haften nur bei Verletzung ihrer Aufsichtspflicht. Viele Privathaftpflicht-Tarife ersetzen solche Schäden trotzdem freiwillig (Deliktunfähigkeit mitversichert).","norm":"§§ 828 Abs. 1, 829, 832 BGB","id":"5.2-1-3"},{"typ":"mc","frage":"Ein Kunde wird von einem Radfahrer verletzt, der keine Haftpflichtversicherung hat und nicht zahlen kann. Welcher Baustein hilft dem Kunden?","optionen":["Die Unfallversicherung des Radfahrers, die für Schäden Dritter aufkommt","Die Hausratversicherung des Kunden, die auch Personenschäden ersetzt","Die Kfz-Haftpflichtversicherung des Kunden als Ausfalldeckung","Die Forderungsausfalldeckung seiner eigenen Privathaftpflichtversicherung"],"richtig":[3],"erkl":"Die Forderungsausfalldeckung zahlt, wenn ein Schädiger einen gerichtlich festgestellten Anspruch nicht erfüllen kann.","norm":"BBR PHV, Forderungsausfall","id":"5.2-1-4"},{"typ":"mc","frage":"Ein Kunde will Schadenersatz von einem Schädiger einklagen. Welche Rechtsschutzleistungsart ist einschlägig?","optionen":["Steuer-Rechtsschutz vor Gerichten","Beratungs-Rechtsschutz im Familienrecht","Schadenersatz-Rechtsschutz","Verwaltungs-Rechtsschutz in Verkehrssachen"],"richtig":[2],"erkl":"Der Schadenersatz-Rechtsschutz deckt die Durchsetzung gesetzlicher, nicht vertraglicher Schadenersatzansprüche; eine Wartezeit gilt in der Regel nicht.","norm":"ARB","id":"5.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Schulte lässt beim Besuch bei Freunden deren Laptop fallen. Außerdem hat sie Streit mit ihrem Arbeitgeber über eine Abmahnung, die sie vor drei Wochen erhalten hat, und möchte einen Anwalt einschalten. Ihre Rechtsschutzversicherung hat sie vor zwei Monaten abgeschlossen.","items":[{"typ":"mc","frage":"Wer reguliert den Schaden am Laptop?","optionen":["Ihre eigene Hausratversicherung, weil der Schaden in einer fremden Wohnung entstand.","Ihre Privathaftpflicht bei Fahrlässigkeit; bei geliehenen Sachen kommt es auf den Tarif an.","Die Hausratversicherung der Freunde, weil der Laptop zu deren Hausrat gehört.","Niemand, weil Schäden bei Besuchen unter Freunden nie versichert sind."],"richtig":[1],"erkl":"Die Privathaftpflicht leistet bei fahrlässiger Beschädigung fremder Sachen. Schäden an geliehenen oder gemieteten Sachen sind oft ausgeschlossen; bei Gefälligkeiten kommt es auf den Tarif an.","norm":"BBR PHV","id":"5.2-2-1"},{"typ":"mc","frage":"Zahlt die Rechtsschutzversicherung den Anwalt wegen der Abmahnung?","optionen":["Nein, weil die Abmahnung in die dreimonatige Wartezeit fällt.","Ja, weil die Wartezeit im Arbeits-Rechtsschutz nur einen Monat beträgt.","Nein, weil Arbeits-Rechtsschutz nur für Selbstständige versicherbar ist.","Ja, weil für den Arbeits-Rechtsschutz keine Wartezeit gilt."],"richtig":[0],"erkl":"Für Arbeits-Rechtsschutz gilt in der Regel eine Wartezeit von drei Monaten.","norm":"ARB","id":"5.2-2-2"},{"typ":"mc","frage":"Wer darf den Anwalt auswählen, wenn die Rechtsschutzversicherung leistet?","optionen":["Der Arbeitgeber bestimmt den Anwalt im Arbeitsrechtsstreit.","Der Anwalt mit dem günstigsten Honorar laut Versicherer.","Der Versicherer bestimmt den Anwalt aus seinem Netzwerk.","Die versicherte Person kann den Anwalt frei wählen."],"richtig":[3],"erkl":"Das Recht auf freie Anwaltswahl ist gesetzlich garantiert.","norm":"§ 127 VVG","id":"5.2-2-3"}]}]},{"nr":"5.3","titel":"Rechtliche Regelungen in Beruf und Freizeit","lf":"LF 5","buch":"S. 239–269","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Grad des Verschuldens die Haftung des Arbeitnehmers gegenüber dem Arbeitgeber zu (innerbetrieblicher Schadensausgleich).","paare":[["leichteste Fahrlässigkeit","keine Haftung"],["mittlere Fahrlässigkeit","anteilige Haftung"],["grobe Fahrlässigkeit und Vorsatz","in der Regel volle Haftung"]],"erkl":"Die Rechtsprechung schützt Arbeitnehmer bei betrieblich veranlassten Tätigkeiten.","norm":"BAG, innerbetrieblicher Schadensausgleich","id":"5.3-1-1"},{"typ":"mc","frage":"Ein Kollege verletzt einen anderen Kollegen fahrlässig bei der Arbeit. Wer leistet für den Personenschaden?","optionen":["Der Kollege über seine Privathaftpflicht, weil er fahrlässig handelte.","Die Krankenkasse des Arbeitgebers; der Kollege haftet überhaupt nicht.","Die gesetzliche Unfallversicherung; der Kollege haftet nur bei Vorsatz.","Der Arbeitgeber über seine Betriebshaftpflicht in voller Höhe."],"richtig":[2],"erkl":"Arbeitskollegen sind für Personenschäden bei betrieblicher Tätigkeit privilegiert.","norm":"§§ 104, 105 SGB VII","id":"5.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Tierhalterhaftung treffen zu?","aussagen":[["Der Halter eines privat gehaltenen Hundes haftet auch ohne eigenes Verschulden.",true],["Bei Nutztieren, die dem Beruf dienen, kann sich der Halter entlasten, wenn er die Sorgfalt beachtet hat.",true],["Tierhalter haften nur, wenn sie das Tier absichtlich losgelassen haben.",false]],"erkl":"§ 833 BGB unterscheidet Luxustiere (Gefährdungshaftung) und Nutztiere (vermutetes Verschulden).","norm":"§ 833 BGB","id":"5.3-1-3"},{"typ":"zahl","frage":"Wie viele Jahre beträgt die regelmäßige Verjährungsfrist für Schadenersatzansprüche?","wert":3,"einheit":"Jahre","tol":0,"erkl":"Sie beginnt mit dem Schluss des Jahres, in dem der Anspruch entstanden ist und der Gläubiger davon Kenntnis erlangt hat oder ohne grobe Fahrlässigkeit hätte erlangen müssen.","norm":"§§ 195, 199 BGB","id":"5.3-1-4"},{"typ":"mc","frage":"Ein Geschädigter hat den Schaden selbst mitverursacht (z. B. unachtsam gelaufen). Welche Folge hat das?","optionen":["Der Schädiger haftet trotzdem in voller Höhe für den Schaden.","Sein Anspruch wird entsprechend seinem Mitverschulden gekürzt.","Sein Anspruch wird stets pauschal um die Hälfte gekürzt.","Sein Anspruch entfällt vollständig, auch bei geringem Mitverschulden."],"richtig":[1],"erkl":"Das Mitverschulden des Geschädigten mindert den Ersatzanspruch.","norm":"§ 254 BGB","id":"5.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Der Hund von Familie Peters reißt sich im Park los und bringt eine Joggerin zu Fall. Sie bricht sich das Handgelenk und verlangt Behandlungskosten, Verdienstausfall und Schmerzensgeld. Familie Peters hat eine Hundehalterhaftpflicht.","items":[{"typ":"mc","frage":"Muss Familie Peters haften, obwohl sie den Hund gut erzogen hat?","optionen":["Ja, als Halterin eines Luxustieres haftet sie ohne Verschulden.","Nein, Tierhalter haften nur, wenn der Hund tatsächlich zugebissen hat.","Nein, weil ohne eigenes Verschulden der Halter keine Haftung besteht.","Nein, weil die Joggerin das Risiko im Park selbst trägt."],"richtig":[0],"erkl":"Gefährdungshaftung des Tierhalters.","norm":"§ 833 S. 1 BGB","id":"5.3-2-1"},{"typ":"wf","frage":"Welche Forderungen der Joggerin sind grundsätzlich ersatzfähig?","aussagen":[["Behandlungskosten",true],["Verdienstausfall",true],["Schmerzensgeld",true],["ein neues Auto",false]],"erkl":"Ersatzfähig sind Vermögensschäden infolge der Verletzung und ein angemessenes Schmerzensgeld.","norm":"§§ 249, 252, 253 Abs. 2 BGB","id":"5.3-2-2"},{"typ":"mc","frage":"Was muss Familie Peters gegenüber ihrem Versicherer tun?","optionen":["Erst nach einer Einigung mit der Joggerin den Versicherer über den Fall informieren.","Nichts, weil die Joggerin ihren Schaden selbst beim Versicherer anmeldet.","Den Schaden binnen eines Monats melden und die Forderung vorab selbst begleichen.","Den Schaden binnen einer Woche melden und Zahlungen mit dem Versicherer abstimmen."],"richtig":[3],"erkl":"Die Anzeigepflicht innerhalb einer Woche bleibt bestehen. Ein eigenes Anerkenntnis bindet den Versicherer nur, soweit der Anspruch tatsächlich besteht; ein Anerkenntnisverbot wäre unwirksam (§ 105 VVG).","norm":"§ 104 Abs. 1 VVG, § 105 VVG, AHB","id":"5.3-2-3"}]}]},{"nr":"5.4","titel":"Prüfungsfälle: Haftung und Privathaftpflicht","lf":"LF 5","buch":"S. 234–262","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Radfahrer Hartwig – Verschuldenshaftung","situation":"Leon Hartwig (34) fährt am 12.09.2026 in Halle (Saale) mit seinem Fahrrad (ohne Motor) und liest dabei eine Nachricht auf dem Smartphone. Er übersieht die Fußgängerin Marta Lewandowska (61), die bei Grün über den Überweg geht, und stößt mit ihr zusammen. Sie bricht sich das Handgelenk, ihre Brille geht zu Bruch. Frau Lewandowska ist selbstständige Physiotherapeutin und kann sechs Wochen nicht arbeiten. Herr Hartwig hat eine Privathaftpflichtversicherung bei der Proximus Versicherung AG ohne Selbstbeteiligung.","items":[{"typ":"wf","frage":"Welche Aussagen zur Haftung von Herrn Hartwig nach § 823 Abs. 1 BGB treffen zu?","aussagen":[["Er hat Körper, Gesundheit und Eigentum von Frau Lewandowska widerrechtlich verletzt.",true],["Er handelte fahrlässig, weil er die im Verkehr erforderliche Sorgfalt außer Acht ließ.",true],["Er haftet nicht, weil er den Unfall nicht absichtlich herbeigeführt hat.",false],["Er haftet nicht, weil zwischen ihm und Frau Lewandowska kein Vertrag besteht.",false]],"erkl":"§ 823 Abs. 1 BGB verlangt Vorsatz oder Fahrlässigkeit; Fahrlässigkeit genügt. Die Haftung aus unerlaubter Handlung setzt keinen Vertrag voraus. Wer beim Radfahren aufs Smartphone schaut, verletzt die verkehrserforderliche Sorgfalt.","norm":"§ 823 Abs. 1 BGB; § 276 Abs. 2 BGB","id":"5.4-1-1"},{"typ":"zahl","frage":"Die Brille kostete neu 480,00 € und war drei Jahre alt. Für die Abnutzung zieht der Versicherer 15 % des Neupreises je Jahr ab („neu für alt“). Wie viel Euro erstattet er für die Brille?","wert":264.0,"einheit":"€","tol":0.01,"erkl":"Abzug: 3 × 15 % = 45 % von 480,00 € = 216,00 €. Zeitwert: 480,00 € − 216,00 € = 264,00 €. Der Geschädigte soll durch den Ersatz nicht bessergestellt werden als vor dem Schaden.","norm":"§ 249 Abs. 2 BGB (Vorteilsausgleich „neu für alt“)","id":"5.4-1-2"},{"typ":"zuo","frage":"Frau Lewandowska macht mehrere Positionen geltend. Ordnen Sie jede Position der passenden Rechtsgrundlage zu.","paare":[["Kosten der ärztlichen Behandlung des Handgelenks","Heilungskosten wegen Verletzung der Person, § 249 Abs. 2 BGB"],["Einnahmen, die ihr als Selbstständige in sechs Wochen entgehen","entgangener Gewinn, § 252 BGB"],["Ausgleich für Schmerzen und Beeinträchtigungen","billige Entschädigung in Geld, § 253 Abs. 2 BGB"],["zerbrochene Brille","Sachschaden, Ersatz des Zeitwerts (Abzug „neu für alt“)"]],"erkl":"Ersetzt werden die Kosten der Heilung, der entgangene Gewinn, bei Körperverletzung ein Schmerzensgeld und der Wert der zerstörten Sache. Die Privathaftpflicht stellt Herrn Hartwig von diesen berechtigten Ansprüchen frei.","norm":"§§ 249, 252, 253 Abs. 2 BGB; § 100 VVG","id":"5.4-1-3"},{"typ":"mc","frage":"Herr Hartwig meint, Schmerzensgeld müsse er nicht zahlen, weil Schmerzen kein Vermögensschaden seien. Wie ist die Rechtslage?","optionen":["Bei einer Körperverletzung kann sie auch für den Nichtvermögensschaden Geld fordern.","Er hat recht; für Nichtvermögensschäden gibt es nie eine Entschädigung in Geld.","Schmerzensgeld gibt es nur, wenn er die Verletzung vorsätzlich verursacht hätte.","Schmerzensgeld zahlt ausschließlich ihre Krankenkasse, nicht der Schädiger selbst."],"richtig":[0],"erkl":"Grundsätzlich gibt es für Nichtvermögensschäden nur in gesetzlich bestimmten Fällen Geld. Bei Verletzung von Körper oder Gesundheit ist eine billige Entschädigung (Schmerzensgeld) vorgesehen – auch bei Fahrlässigkeit.","norm":"§ 253 Abs. 1 und 2 BGB","id":"5.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Familie Albrecht – Kinder als Schädiger","situation":"Familie Albrecht wohnt in Halle (Saale), Stadtteil Neustadt. Die Kinder sind Mila (6), Ben (8) und Tom (13). Ihre Familien-Privathaftpflicht bei der Proximus Versicherung AG enthält laut Bedingungen diese Erweiterung: „Schäden durch deliktsunfähige mitversicherte Kinder ersetzen wir bis 10.000,00 € je Schadenfall, auch wenn keine gesetzliche Haftung besteht, soweit kein anderer Versicherer leistet.“ Es gilt eine Selbstbeteiligung von 150,00 € je Schadenfall.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die Rechtslage des Kindes nach § 828 BGB zu.","paare":[["Mila (6) zerkratzt beim Spielen mit einem Stein ein Auto.","nicht verantwortlich, weil sie das 7. Lebensjahr nicht vollendet hat"],["Ben (8) fährt mit dem Rad unachtsam vor ein fahrendes Auto; das Auto wird beschädigt.","nicht verantwortlich, weil er bei einem Unfall mit einem Kfz unter 10 Jahren ist und nicht vorsätzlich handelte"],["Tom (13) schießt beim Bolzen unachtsam den Ball in die Scheibe eines Nachbarn.","verantwortlich, wenn er die zur Erkenntnis der Verantwortlichkeit erforderliche Einsicht hat"]],"erkl":"Unter 7 Jahren sind Kinder nie verantwortlich; von 7 bis unter 10 Jahren nicht bei Unfällen mit Kfz, Schienen- oder Schwebebahn (außer bei Vorsatz); im Übrigen kommt es bis 18 auf die Einsichtsfähigkeit an.","norm":"§ 828 Abs. 1–3 BGB","id":"5.4-2-1"},{"typ":"zahl","frage":"Mila (6) zerkratzt mit einem Stein das Auto des Nachbarn; die Reparatur kostet 1.380,00 €. Die Eltern hatten Mila ausreichend beaufsichtigt; kein anderer Versicherer leistet. Wie viel Euro zahlt die Proximus Versicherung AG?","wert":1230.0,"einheit":"€","tol":0.01,"erkl":"Gesetzlich haftet niemand: Mila ist nicht verantwortlich, die Eltern haben ihre Aufsichtspflicht erfüllt. Die Erweiterung im Tarif zahlt trotzdem: 1.380,00 € − 150,00 € Selbstbeteiligung = 1.230,00 €.","norm":"§ 828 Abs. 1 BGB; § 832 Abs. 1 Satz 2 BGB; Tarifbedingung laut Situation","id":"5.4-2-2"},{"typ":"mc","frage":"Ben (8) fährt mit dem Fahrrad unachtsam gegen ein ordnungsgemäß geparktes Auto. Was gilt nach der Rechtsprechung des BGH in der Regel?","optionen":["Das Haftungsprivileg für Kfz-Unfälle greift nicht; Ben haftet, wenn er einsichtsfähig ist.","Ben haftet nie, weil Kinder unter zehn Jahren bei allen Schäden an Autos geschützt sind.","Ben haftet nie, weil Kinder unter vierzehn Jahren grundsätzlich deliktsunfähig sind.","Für Ben haften stets die Eltern, auch wenn sie ihre Aufsichtspflicht erfüllt haben."],"richtig":[0],"erkl":"Das Privileg des § 828 Abs. 2 BGB soll Kinder vor der Überforderung durch den fließenden Verkehr schützen. Beim Anfahren eines ordnungsgemäß geparkten Autos verwirklicht sich diese Gefahr in der Regel nicht; dann gilt § 828 Abs. 3 BGB.","norm":"§ 828 Abs. 2 und 3 BGB; BGH, Urteile vom 30.11.2004 – VI ZR 365/03 und VI ZR 335/03","id":"5.4-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Haftung wegen Verletzung der Aufsichtspflicht treffen zu?","aussagen":[["Eltern haften für einen Schaden ihres Kindes, wenn sie ihre Aufsichtspflicht verletzt haben.",true],["Eltern haften nicht, wenn sie nachweisen, dass sie ausreichend beaufsichtigt haben oder der Schaden auch so entstanden wäre.",true],["Das Schild „Eltern haften für ihre Kinder“ bedeutet, dass Eltern stets ohne eigenes Verschulden haften.",false],["Eine bezahlte Babysitterin, die die Aufsicht vertraglich übernimmt, haftet nach denselben Grundsätzen.",true]],"erkl":"§ 832 BGB vermutet die Aufsichtspflichtverletzung, erlaubt aber den Entlastungsbeweis. Wer die Aufsicht durch Vertrag übernimmt, haftet ebenso.","norm":"§ 832 Abs. 1 und 2 BGB","id":"5.4-2-4"}]},{"typ":"situation","titel":"Fall 3: Labrador Bruno und die Hütehunde – Tierhalterhaftung","situation":"Familie Yılmaz aus Halle (Saale) hält privat den Labrador „Bruno“, eine Hauskatze und ein Freizeitpferd. Die Nachbarin Greta Hoffmann betreibt hauptberuflich eine Schäferei und setzt zwei Hütehunde beim Hüten ihrer Schafe ein. Am 14.09.2026 springt Bruno an der Leine plötzlich einen Radfahrer an. Der Radfahrer stürzt; sein Schaden beträgt 3.600,00 €. Er war in der Dämmerung ohne Licht unterwegs. Familie Yılmaz hat für Bruno eine Hundehalter-Haftpflichtversicherung ohne Selbstbeteiligung.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Tier die passende Haftpflichtabsicherung zu.","paare":[["Labrador Bruno (privat gehalten)","Hundehalter-Haftpflichtversicherung"],["Hauskatze der Familie Yılmaz","Privathaftpflichtversicherung (zahme Haustiere mitversichert)"],["Freizeitpferd der Familie Yılmaz","Pferdehalter-Haftpflichtversicherung"],["Hütehunde der Schäferei Hoffmann","Betriebshaftpflicht des landwirtschaftlichen Betriebs"]],"erkl":"Die Privathaftpflicht deckt zahme Haustiere, schließt Hunde und Pferde aber aus. Tiere eines Betriebs gehören in dessen Betriebshaftpflicht.","norm":"§ 833 BGB; AVB PHV (GDV-Muster), A1-6.9 (Tiere)","id":"5.4-3-1"},{"typ":"mc","frage":"Ein Hütehund von Frau Hoffmann beißt beim Treiben der Herde einen Spaziergänger. Frau Hoffmann weist nach, dass sie den Hund sorgfältig beaufsichtigt hat. Haftet sie nach § 833 BGB?","optionen":["Nein, denn der Hund dient ihrem Erwerb und sie hat die nötige Sorgfalt beachtet.","Ja, denn Tierhalter haften für jedes Tier stets ohne Rücksicht auf Verschulden.","Ja, denn Hunde können nach dem Gesetz niemals als Nutztiere eingestuft werden.","Nein, denn Tierhalter haften für Schäden ihrer Tiere grundsätzlich nur bei Vorsatz."],"richtig":[0],"erkl":"Für Haustiere, die dem Beruf oder Erwerb des Halters dienen (Nutztiere), haftet der Halter nur für vermutetes Verschulden und kann sich durch den Nachweis der erforderlichen Sorgfalt entlasten. Für Luxustiere wie Bruno gilt dagegen Gefährdungshaftung.","norm":"§ 833 Satz 2 BGB","id":"5.4-3-2"},{"typ":"zahl","frage":"Für den Sturz des Radfahrers haftet Familie Yılmaz als Halterin von Bruno. Wegen der fehlenden Beleuchtung wird dem Radfahrer ein Mitverschulden von einem Drittel angerechnet. Wie viel Euro muss die Hundehalter-Haftpflicht von 3.600,00 € ersetzen?","wert":2400.0,"einheit":"€","tol":0.01,"erkl":"Der Anspruch wird um den Mitverschuldensanteil gekürzt: 3.600,00 € × 2/3 = 2.400,00 €.","norm":"§ 833 Satz 1 BGB; § 254 Abs. 1 BGB","id":"5.4-3-3"},{"typ":"wf","frage":"Nachbar Paul Krämer führt Bruno während des Urlaubs der Familie Yılmaz unentgeltlich aus. Welche Aussagen treffen zu?","aussagen":[["Familie Yılmaz bleibt als Halterin für Schäden durch Bruno nach § 833 BGB verantwortlich.",true],["Wer die Aufsicht über ein Tier durch Vertrag übernimmt, haftet nach § 834 BGB, kann sich aber durch Nachweis der Sorgfalt entlasten.",true],["Nach den GDV-Musterbedingungen ist das nicht gewerbsmäßige Hüten fremder Hunde in der Privathaftpflicht mitversichert, soweit keine Tierhalter-Haftpflicht Schutz bietet.",true],["Ein Schaden, den Bruno dem Nachbarn selbst zufügt, ist in keinem Fall ersatzfähig.",false]],"erkl":"Die Halterhaftung endet nicht, wenn ein anderer das Tier führt; wer die Aufsicht vertraglich übernimmt, haftet daneben mit Entlastungsmöglichkeit. Für den Hüter springt subsidiär seine Privathaftpflicht ein.","norm":"§§ 833, 834 BGB; AVB PHV (GDV-Muster), A1-6.9 (Tiere)","id":"5.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Patchworkfamilie Weber – wer ist mitversichert?","situation":"Sandra Weber (45) hat eine Familien-Privathaftpflicht bei der Proximus Versicherung AG. Mit ihr leben in Halle (Saale): ihr nicht verheirateter Lebensgefährte Malik Haddad (47), ihr Sohn Felix (23, Masterstudium), ihre Tochter Lea (20, Ausbildung abgeschlossen, seit 01.08.2026 berufstätig) und Maliks Sohn Yusuf (16, Schüler). Laut Bedingungen sind mitversichert: der im Versicherungsschein genannte Lebensgefährte (Malik ist genannt) und dessen Kinder sowie unverheiratete Kinder, solange sie sich in Schul- oder Berufsausbildung befinden, auch in einem anschließenden Studium. Ansprüche der Versicherten untereinander sind ausgeschlossen. Gefälligkeitsschäden ersetzt der Tarif bis 5.000,00 €; die Selbstbeteiligung beträgt 150,00 € je Schadenfall.","items":[{"typ":"wf","frage":"Welche Personen sind laut Bedingungen über den Vertrag von Frau Weber mitversichert?","aussagen":[["Malik Haddad, der im Versicherungsschein genannte Lebensgefährte",true],["Felix, der sich im Masterstudium befindet",true],["Lea, die ihre Ausbildung abgeschlossen hat und berufstätig ist",false],["Yusuf, der Sohn des mitversicherten Lebensgefährten, der zur Schule geht",true]],"erkl":"Nach den Bedingungen endet der Schutz volljähriger Kinder mit dem Ende der Ausbildung. Lea braucht eine eigene Privathaftpflicht. Der genannte Lebensgefährte und sein Kind sind eingeschlossen.","norm":"AVB PHV (GDV-Muster), A1-2; Bedingungen laut Situation","id":"5.4-4-1"},{"typ":"mc","frage":"Malik stößt in der gemeinsamen Wohnung versehentlich Sandras Laptop vom Tisch. Leistet die Privathaftpflicht?","optionen":["Nein, Ansprüche zwischen Versicherten desselben Vertrags sind ausgeschlossen.","Ja, weil Malik im Versicherungsschein namentlich als Mitversicherter genannt ist.","Ja, aber nur zum halben Zeitwert, weil beide im selben Haushalt leben.","Nein, weil Laptops in der Privathaftpflicht grundsätzlich nie versichert sind."],"richtig":[0],"erkl":"Schäden innerhalb des versicherten Personenkreises sind ausgeschlossen, damit sich die Familie Schäden nicht gegenseitig „in Rechnung stellt“. Den Laptop könnte allenfalls eine Elektronik- oder Hausratversicherung abdecken, wenn die Gefahr versichert ist.","norm":"AVB PHV (GDV-Muster), A1-7.3","id":"5.4-4-2"},{"typ":"zahl","frage":"Felix hilft einem Freund unentgeltlich beim Umzug und lässt dessen Fernseher fallen (Zeitwert 640,00 €). Der Versicherer erkennt den Schaden als Gefälligkeitsschaden an. Wie viel Euro zahlt er?","wert":490.0,"einheit":"€","tol":0.01,"erkl":"Felix ist als Student mitversichert. Zeitwert 640,00 € − Selbstbeteiligung 150,00 € = 490,00 € (innerhalb der Grenze von 5.000,00 €).","norm":"§ 249 BGB; Tarifbedingung Gefälligkeitsschäden laut Situation","id":"5.4-4-3"},{"typ":"mc","frage":"Warum enthält der Tarif eine besondere Regelung für Gefälligkeitsschäden?","optionen":["Sie leistet auch, falls ein stillschweigender Haftungsverzicht unter Freunden die Haftung entfallen ließe.","Weil Schäden bei Gefälligkeiten sonst grundsätzlich über die Hausratversicherung des Helfers reguliert würden.","Weil Helfer bei Gefälligkeiten rechtlich immer als vorsätzlich handelnd gelten und sonst ohne Schutz wären.","Weil Schäden bei Freunden nach dem BGB höchstens bis 5.000,00 € ersetzt werden müssen und darüber nicht."],"richtig":[0],"erkl":"Ohne gesetzliche Haftung zahlt die Privathaftpflicht nicht. Bei Gefälligkeiten wird oft ein stillschweigender Haftungsverzicht für leichte Fahrlässigkeit eingewandt; der BGH nimmt ihn nur ausnahmsweise an, in der Regel nicht, wenn der Helfer haftpflichtversichert ist. Die Klausel schafft Klarheit: Der Versicherer zahlt bis zur Grenze, ohne sich auf diesen Einwand zu berufen.","norm":"§ 276 BGB; BGH, Urteil vom 26.04.2016 – VI ZR 467/15; Tarifbedingung laut Situation","id":"5.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Mieter Krüger – Mietsachschäden und Schlüsselverlust","situation":"Anton Krüger (22) mietet seit 2023 eine Zweizimmerwohnung in Halle (Saale); das Haus hat eine Zentralschließanlage. Seine Privathaftpflicht bei der Proximus Versicherung AG enthält laut Bedingungen: Mietsachschäden an gemieteten Wohnräumen bis 500.000,00 € (ausgeschlossen: Abnutzung und Verschleiß, Glasschäden, soweit gesondert versicherbar, Schäden an Elektro- und Gasgeräten); Verlust fremder privater Schlüssel einschließlich Schließanlage bis 30.000,00 €; Selbstbeteiligung 150,00 € je Schadenfall.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Schaden die zutreffende Beurteilung zu.","paare":[["Die Badewanne läuft über; das Parkett der Mietwohnung quillt auf.","Mietsachschaden an Wohnräumen – mitversichert"],["Das Wasser dringt in die Wohnung darunter und beschädigt das Sofa der Nachbarin.","Sachschaden eines Dritten – Grunddeckung der Privathaftpflicht"],["Ein Topf fällt auf das Ceranfeld des mitvermieteten Herds; die Glaskeramik springt.","ausgeschlossen – Glas- bzw. Elektrogeräteschaden"],["Der Teppichboden ist nach drei Jahren normalen Wohnens abgetreten.","keine Haftung – Abnutzung durch vertragsgemäßen Gebrauch"]],"erkl":"Mietsachschäden an Wohnräumen sind ein Einschluss mit Ausschlüssen; Schäden an Sachen Dritter sind Grunddeckung. Für normale Abnutzung haftet der Mieter gar nicht.","norm":"§ 538 BGB; AVB PHV (GDV-Muster), A1-6.6","id":"5.4-5-1"},{"typ":"mc","frage":"Anton verliert seinen Wohnungsschlüssel. Der Vermieter verlangt 2.400,00 € für den Austausch der Schließanlage, will sie aber vorerst nicht austauschen. Was gilt nach der Rechtsprechung des BGH?","optionen":["Ein ersatzfähiger Schaden entsteht erst, wenn die Anlage tatsächlich ausgetauscht wird.","Der Vermieter kann die 2.400,00 € sofort als Pauschale verlangen, auch ohne Austausch.","Anton muss nur den Preis eines Nachschlüssels zahlen, selbst nach einem Austausch.","Mieter haften für verlorene Schlüssel nie, weil Schlüssel nur Zubehör der Wohnung sind."],"richtig":[0],"erkl":"Der Verlust verletzt eine Nebenpflicht aus dem Mietvertrag. Die Kosten einer neuen Schließanlage sind aber erst ein Schaden, wenn sie tatsächlich ausgetauscht wird.","norm":"§ 280 Abs. 1 BGB; BGH, Urteil vom 05.03.2014 – VIII ZR 205/13","id":"5.4-5-2"},{"typ":"zahl","frage":"Der Vermieter tauscht die Schließanlage aus Sicherheitsgründen tatsächlich aus und verlangt von Anton 2.400,00 €. Wie viel Euro zahlt die Privathaftpflicht?","wert":2250.0,"einheit":"€","tol":0.01,"erkl":"Verlust fremder Schlüssel einschließlich Schließanlage ist bis 30.000,00 € mitversichert: 2.400,00 € − 150,00 € = 2.250,00 €.","norm":"Tarifbedingung Schlüsselverlust laut Situation","id":"5.4-5-3"},{"typ":"wf","frage":"Welche Aussagen zu Antons Mietverhältnis und seiner Privathaftpflicht treffen zu?","aussagen":[["Für Veränderungen durch vertragsgemäßen Gebrauch muss Anton keinen Ersatz leisten.",true],["Die Mietsachschaden-Deckung laut Bedingungen erfasst Wohnräume, nicht aber eine gemietete Bohrmaschine.",true],["Die vertraglich vereinbarten Schönheitsreparaturen beim Auszug bezahlt die Privathaftpflicht.",false],["Ersatzansprüche des Vermieters wegen Verschlechterung der Wohnung verjähren sechs Monate nach Rückgabe.",true]],"erkl":"Die Haftpflichtversicherung ersetzt Schadenersatz, keine Vertragserfüllung wie Schönheitsreparaturen. Vermieteransprüche wegen Verschlechterung verjähren kurz.","norm":"§ 538 BGB; § 548 Abs. 1 BGB; § 100 VVG","id":"5.4-5-4"}]},{"typ":"situation","titel":"Fall 6: Jens Kowalczyk – Drohne, Pedelec, Ehrenamt","situation":"Jens Kowalczyk (52) aus Halle (Saale) fährt ein Pedelec mit Tretunterstützung bis 25 km/h; er überlegt, auf ein S-Pedelec (bis 45 km/h) umzusteigen. Er fliegt eine Kameradrohne mit 900 g Startmasse. Ehrenamtlich leitet er die Kinderturngruppe seines Sportvereins und ist seit Kurzem gewählter Kassenwart im Vereinsvorstand; Geld erhält er dafür nicht. Seine Privathaftpflicht bei der Proximus Versicherung AG schließt laut Bedingungen versicherungspflichtige Drohnen bis 5 kg Startmasse ein; Schäden aus einer verantwortlichen Tätigkeit in Vereinen sind ausgeschlossen; als verantwortlich gilt laut Bedingungen ein Amt im Vorstand, nicht aber die Leitung einer Übungsgruppe.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Risiko die passende Absicherung zu.","paare":[["Unfall mit dem Pedelec bis 25 km/h","Privathaftpflichtversicherung, weil es kein Kraftfahrzeug ist"],["Unfall mit einem S-Pedelec bis 45 km/h","Kfz-Haftpflichtversicherung mit Versicherungskennzeichen"],["Absturz der 900-g-Drohne auf ein parkendes Auto","Privathaftpflicht, weil der Tarif Drohnen bis 5 kg einschließt"],["Fehler als Kassenwart im Vereinsvorstand","Vereinshaftpflicht bzw. D&O-Versicherung des Vereins"]],"erkl":"Pedelecs bis 25 km/h gelten als Fahrräder; S-Pedelecs sind Kraftfahrzeuge und fallen unter den Kfz-Ausschluss der Privathaftpflicht. Verantwortliche Vereinsämter sind über den Verein abzusichern.","norm":"§ 1 Abs. 3 StVG; AVB PHV (GDV-Muster), A1-7.14, A1-7.16","id":"5.4-6-1"},{"typ":"mc","frage":"Jens möchte eine größere Drohne mit 6,5 kg Startmasse kaufen. Was raten Sie ihm?","optionen":["Eine eigene Drohnen-Haftpflicht abschließen, weil sein Tarif nur Drohnen bis 5 kg einschließt.","Nichts unternehmen, weil Drohnen über die Hausratversicherung haftpflichtversichert sind.","Nichts unternehmen, weil für private Drohnen keine gesetzliche Versicherungspflicht besteht.","Die Drohne über das Versicherungskennzeichen eines S-Pedelecs mitversichern lassen."],"richtig":[0],"erkl":"Halter von Luftfahrzeugen – auch von Drohnen – müssen eine Haftpflichtversicherung haben. Liegt die Drohne über der Grenze des Tarifs, ist ein eigener Vertrag nötig.","norm":"§ 43 Abs. 2 LuftVG","id":"5.4-6-2"},{"typ":"wf","frage":"Welche Aussagen zu den Ehrenämtern von Jens treffen zu?","aussagen":[["Als Übungsleiter (nicht verantwortliche ehrenamtliche Tätigkeit) ist er grundsätzlich über seine Privathaftpflicht versichert.",true],["Als Kassenwart im Vorstand übt er eine verantwortliche Tätigkeit aus, die seine Privathaftpflicht laut Bedingungen nicht deckt.",true],["Als unentgeltlich tätiges Vorstandsmitglied haftet er dem Verein nur bei Vorsatz oder grober Fahrlässigkeit.",true],["Ehrenamtliche haften gegenüber Dritten grundsätzlich nicht, weil sie unentgeltlich handeln.",false]],"erkl":"Ehrenamtliche können Dritten gegenüber haften; das BGB privilegiert aber unentgeltlich tätige Organmitglieder gegenüber dem Verein und gibt ihnen bei leichter Fahrlässigkeit einen Freistellungsanspruch gegen den Verein.","norm":"§ 31a Abs. 1 und 2 BGB; AVB PHV (GDV-Muster), A1-6.2, A1-7.16","id":"5.4-6-3"},{"typ":"zahl","frage":"Bis zu welcher jährlichen Vergütung (in Euro) gilt für Vorstandsmitglieder eines Vereins die Haftungsbeschränkung auf Vorsatz und grobe Fahrlässigkeit gegenüber dem Verein?","wert":3300,"einheit":"€","tol":0,"erkl":"Die Privilegierung gilt für unentgeltlich Tätige und für eine Vergütung von höchstens 3.300 € im Jahr.","norm":"§ 31a Abs. 1 Satz 1 BGB","id":"5.4-6-4"}]},{"typ":"situation","titel":"Fall 7: Ayşe Demir – Haftung und Deckung nach der Geburtstagsfeier","situation":"Ayşe Demir (29) aus Halle (Saale) leiht sich für ihre Geburtstagsfeier am Samstag, 03.10.2026, von ihrem Kollegen Marco Ferri unentgeltlich einen Beamer (Zeitwert 700,00 €). Beim Aufbauen stößt sie ihn aus Unachtsamkeit vom Tisch; er ist zerstört. Auf der Feier kippt sie außerdem Rotwein über die Wildlederjacke ihres Gastes Jonas Berg (Zeitwert 260,00 €). Herr Berg verlangt am Montag, 05.10.2026, schriftlich Ersatz. Ihre Privathaftpflicht bei der Proximus Versicherung AG schließt laut Bedingungen Schäden an geliehenen Sachen aus.","items":[{"typ":"mc","frage":"Wie sind Haftung und Deckung beim zerstörten Beamer zu beurteilen?","optionen":["Sie haftet dem Grunde nach, die Privathaftpflicht leistet aber wegen des Ausschlusses nicht.","Sie haftet nicht, weil bei einer Leihe nur Vorsatz und grobe Fahrlässigkeit zu vertreten sind.","Sie haftet, und die Privathaftpflicht zahlt, weil sie nur leicht fahrlässig gehandelt hat.","Sie haftet nicht, weil bei einer unentgeltlichen Leihe niemand Schadenersatz schuldet."],"richtig":[0],"erkl":"Erst die Haftungsfrage, dann die Deckungsfrage: Die Entleiherin muss die Sache zurückgeben und haftet für Fahrlässigkeit. Die Haftungsmilderung des § 599 BGB gilt nur für den Verleiher. Geliehene Sachen sind in ihrer Privathaftpflicht ausgeschlossen.","norm":"§§ 280 Abs. 1, 599, 604 BGB; AVB PHV (GDV-Muster), A1-7.5","id":"5.4-7-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Prüffrage zu.","paare":[["Haftung dem Grunde nach","Besteht nach dem Gesetz überhaupt eine Pflicht zum Schadenersatz?"],["Haftung der Höhe nach","Welchen Betrag muss der Schädiger ersetzen?"],["Deckung","Muss der Versicherer nach dem Vertrag für diese Haftung eintreten?"],["Passiver Rechtsschutz","Wehrt der Versicherer eine unbegründete Forderung auf eigene Kosten ab?"]],"erkl":"Die Haftpflichtversicherung prüft die Haftpflichtfrage, stellt von berechtigten Ansprüchen frei und wehrt unberechtigte ab.","norm":"§ 100 VVG; AVB PHV (GDV-Muster), A1-4","id":"5.4-7-2"},{"typ":"zahl","frage":"Herr Berg macht seinen Anspruch wegen der Jacke am Montag, 05.10.2026, schriftlich geltend. Bis zu welchem Tag im Oktober 2026 muss Frau Demir diese Geltendmachung ihrem Versicherer spätestens anzeigen (Absendung genügt)? Geben Sie den Tag an.","wert":12,"einheit":"Oktober","tol":0,"erkl":"Die Anzeige ist innerhalb einer Woche nach der Geltendmachung fällig. Der Tag der Geltendmachung zählt nicht mit; die Frist endet mit dem gleichnamigen Wochentag der Folgewoche: Montag, 12.10.2026. Die rechtzeitige Absendung genügt.","norm":"§ 104 Abs. 1 Satz 2 und Abs. 3 VVG; §§ 187 Abs. 1, 188 Abs. 2 BGB","id":"5.4-7-3"},{"typ":"wf","frage":"Der Versicherer erkennt den Anspruch von Herrn Berg am 19.10.2026 an und zahlt. Welche Aussagen zur Kündigung nach dem Versicherungsfall treffen zu?","aussagen":[["Sowohl Frau Demir als auch der Versicherer können den Vertrag kündigen.",true],["Die Kündigung ist nur innerhalb eines Monats seit der Anerkennung zulässig.",true],["Kündigt der Versicherer, muss er eine Kündigungsfrist von einem Monat einhalten.",true],["Frau Demir kann nur mit einer Frist von drei Monaten zum Ende des Versicherungsjahres kündigen.",false]],"erkl":"Nach Anerkennung oder unberechtigter Ablehnung des Freistellungsanspruchs haben beide Seiten ein Sonderkündigungsrecht für einen Monat. Die Kundin kann sofort oder spätestens zum Ende der laufenden Versicherungsperiode kündigen; der Versicherer nur mit Monatsfrist.","norm":"§ 111 VVG; § 92 Abs. 2 Satz 2 und 3 VVG","id":"5.4-7-4"}]}]},{"nr":"5.5","titel":"Prüfungsfälle: Rechtsschutz und Freizeitrisiken","lf":"LF 5","buch":"S. 263–269","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Familie Nowak – Bausteine und Leistungsarten","situation":"Familie Nowak aus Halle (Saale) – Kerstin (44, Angestellte), Piotr (46, Beamter) und Sohn Jakub (15) – hat seit 01.03.2025 bei der Proximus Versicherung AG eine Rechtsschutzversicherung mit Privat-, Berufs- und Verkehrs-Rechtsschutz, aber ohne Wohnungs- und Grundstücks-Rechtsschutz. Die Familie wohnt zur Miete. Laut Bedingungen (angelehnt an die GDV-Musterbedingungen) gilt Beratungs-Rechtsschutz im Familien- und Erbrecht; ausgeschlossen sind u. a. Streitigkeiten um Planung und Errichtung eines Gebäudes, um spekulative Kapitalanlagen sowie aus Familien- und Erbrecht, soweit es nicht um Beratung geht.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Streit die zuständige Leistungsart zu.","paare":[["Kerstin wehrt sich gegen die Kündigung ihres Arbeitsvertrags.","Arbeits-Rechtsschutz"],["Jakub wird von einem Hund gebissen und verlangt Schmerzensgeld vom Halter.","Schadenersatz-Rechtsschutz"],["Piotr streitet mit einem Onlinehändler über eine defekte Waschmaschine.","Rechtsschutz im Vertrags- und Sachenrecht"],["Kerstin klagt gegen die Ablehnung einer Erwerbsminderungsrente.","Sozialgerichts-Rechtsschutz"],["Piotr erhält einen Bußgeldbescheid wegen zu schnellen Fahrens.","Ordnungswidrigkeiten-Rechtsschutz"]],"erkl":"Die Bausteine (Privat, Beruf, Verkehr, Wohnen) legen fest, in welchen Lebensbereichen Schutz besteht; die Leistungsarten beschreiben die Rechtsgebiete.","norm":"ARB 2012 (GDV-Muster), Ziffer 2.2","id":"5.5-1-1"},{"typ":"mc","frage":"Der Vermieter verlangt mit der Nebenkostenabrechnung 860,00 € nach; Familie Nowak hält die Abrechnung für falsch. Übernimmt die Rechtsschutzversicherung die Anwaltskosten?","optionen":["Nein, dafür ist Wohnungs- und Grundstücks-Rechtsschutz nötig, den die Familie nicht hat.","Ja, Streitigkeiten aus dem Mietvertrag sind immer über den Privat-Rechtsschutz versichert.","Ja, weil Streitigkeiten unter 1.000,00 € ohne besonderen Baustein mitversichert sind.","Nein, weil Streitigkeiten aus Mietverhältnissen in Deutschland nicht versicherbar sind."],"richtig":[0],"erkl":"Streit aus Miet- und Pachtverhältnissen über Wohnungen und Grundstücke deckt nur der Wohnungs- und Grundstücks-Rechtsschutz, der für die gemietete Wohnung vereinbart sein muss.","norm":"ARB 2012 (GDV-Muster), Ziffer 2.2.3","id":"5.5-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Versicherungsschutz der Familie Nowak treffen zu?","aussagen":[["Ein Streit mit der Baufirma über Mängel beim Bau eines Eigenheims ist ausgeschlossen.",true],["Für das Scheidungsverfahren von Kerstin und Piotr übernimmt der Versicherer die vollen Anwalts- und Gerichtskosten.",false],["Ein Streit über Verluste aus spekulativen Kryptowährungsgeschäften ist ausgeschlossen.",true],["Wird Piotr eine fahrlässige Körperverletzung bei einem Verkehrsunfall vorgeworfen, ist seine Verteidigung grundsätzlich versichert.",true]],"erkl":"Baurisiko, Spekulation und Familienrecht (außer Beratung) sind typische Ausschlüsse. Straf-Rechtsschutz besteht bei Vergehen, wenn Fahrlässigkeit vorgeworfen wird.","norm":"ARB 2012 (GDV-Muster), Ziffer 2.2.9, Ziffer 3.2","id":"5.5-1-3"},{"typ":"mc","frage":"Kerstins Vater stirbt; sie wurde im Testament übergangen und möchte sich zu ihrem Pflichtteil beraten lassen. Was übernimmt der Versicherer?","optionen":["Die Kosten für Rat oder Auskunft eines Anwalts, nicht aber dessen weitere Tätigkeit.","Alle Kosten eines Prozesses gegen die Erben bis zur vereinbarten Versicherungssumme.","Nichts, weil erbrechtliche Fragen vom Versicherungsschutz vollständig ausgeschlossen sind.","Nur die Notarkosten für den Erbschein, weil der Notar dort für die Erben tätig wird."],"richtig":[0],"erkl":"Der Beratungs-Rechtsschutz im Familien- und Erbrecht deckt einen Rat oder eine Auskunft eines Anwalts. Hängt die Beratung mit einer weiteren gebührenpflichtigen Tätigkeit zusammen (z. B. Klage), besteht kein Schutz.","norm":"ARB 2012 (GDV-Muster), Ziffer 2.2.11","id":"5.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Uwe Bergmann – Wartezeit und Selbstbeteiligung","situation":"Uwe Bergmann (39) aus Halle (Saale) hat eine Rechtsschutzversicherung mit Privat- und Berufs-Rechtsschutz bei der Proximus Versicherung AG; Versicherungsbeginn ist der 01.06.2026. Laut Bedingungen gilt eine Wartezeit von drei Monaten, ausgenommen u. a. Schadenersatz-, Straf- und Ordnungswidrigkeiten-Rechtsschutz. Maßgeblich ist beim Schadenersatz-Rechtsschutz das Schadenereignis, sonst der (behauptete) Verstoß gegen Rechtspflichten. Die Selbstbeteiligung beträgt 250,00 € je Rechtsschutzfall.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die zutreffende Beurteilung zu.","paare":[["10.07.2026: Ein Autofahrer verletzt Herrn Bergmann als Fußgänger; er verlangt Schmerzensgeld.","versichert – Schadenersatz-Rechtsschutz ohne Wartezeit"],["20.07.2026: Ein Handwerker stellt eine überhöhte Rechnung, Herr Bergmann will sie anfechten.","nicht versichert – Verstoß liegt in der Wartezeit"],["14.09.2026: Der Arbeitgeber zahlt die vereinbarte Überstundenvergütung nicht.","versichert – Verstoß nach Ablauf der Wartezeit"]],"erkl":"Die Wartezeit läuft vom 01.06. bis 31.08.2026. Entscheidend ist der Zeitpunkt des Rechtsschutzfalls, nicht der Zeitpunkt, zu dem der Kunde den Anwalt einschaltet.","norm":"ARB 2012 (GDV-Muster), Ziffer 2.4 und Ziffer 3.1.1","id":"5.5-2-1"},{"typ":"zahl","frage":"Im Streit um die Überstundenvergütung entstehen Anwaltskosten von 1.480,00 € und Gerichtskosten von 438,00 €. Wie viel Euro erstattet der Versicherer?","wert":1668.0,"einheit":"€","tol":0.01,"erkl":"Kosten gesamt: 1.480,00 € + 438,00 € = 1.918,00 €; abzüglich Selbstbeteiligung 250,00 € = 1.668,00 €.","norm":"§ 125 VVG; ARB 2012 (GDV-Muster), Ziffer 3.3; Selbstbeteiligung laut Situation","id":"5.5-2-2"},{"typ":"mc","frage":"Der Versicherer lehnt eine weitere Klage von Herrn Bergmann ab, weil sie keine hinreichende Aussicht auf Erfolg biete. Was kann Herr Bergmann tun?","optionen":["Er kann das im Vertrag vorgesehene Gutachter- oder Stichentscheidverfahren nutzen.","Nichts; die Entscheidung des Versicherers ist endgültig und gerichtlich nicht überprüfbar.","Er muss vor der Klage zuerst die BaFin um eine ausdrückliche Erlaubnis bitten.","Er kann den Rechtsschutzfall rückwirkend auf einen anderen Versicherer übertragen."],"richtig":[0],"erkl":"Bei Ablehnung wegen fehlender Erfolgsaussicht oder Mutwilligkeit muss der Vertrag ein unparteiisches Verfahren vorsehen; der Versicherer muss darauf hinweisen. Fehlt das Verfahren oder der Hinweis, gilt das Rechtsschutzbedürfnis als anerkannt.","norm":"§ 128 VVG; ARB 2012 (GDV-Muster), Ziffer 3.4","id":"5.5-2-3"},{"typ":"wf","frage":"Laut Bedingungen können beide Seiten kündigen, wenn der Versicherer für mindestens zwei Rechtsschutzfälle innerhalb von zwölf Monaten seine Leistungspflicht bestätigt hat; die Kündigung muss innerhalb eines Monats nach der Bestätigung für den zweiten Fall in Textform zugehen. Der Versicherer bestätigt bei Herrn Bergmann Fälle am 05.10.2026 und am 18.11.2026. Welche Aussagen treffen zu?","aussagen":[["Auch der Versicherer darf den Vertrag kündigen.",true],["Die Kündigung muss spätestens am 18.12.2026 zugehen.",true],["Herr Bergmann muss seine Kündigung eigenhändig unterschrieben per Brief schicken.",false]],"erkl":"Die Frist von einem Monat beginnt mit der Bestätigung für den zweiten Fall (18.11.2026) und endet am 18.12.2026. Textform (z. B. E-Mail) genügt.","norm":"ARB 2012 (GDV-Muster), Ziffer 6.2; § 188 Abs. 2 BGB; § 126b BGB","id":"5.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Ehepaar Schubert – Öltank und Anbau","situation":"Ehepaar Schubert bewohnt ein eigenes Einfamilienhaus in Halle (Saale). Im Keller steht ein oberirdischer Heizöltank mit 6.000 l Fassungsvermögen. Im Frühjahr 2027 wollen sie einen Anbau errichten lassen (Bausumme 180.000,00 €); die Arbeiten übernimmt eine Baufirma. Ihre Privathaftpflicht bei der Proximus Versicherung AG enthält laut Bedingungen: Haftpflicht als Inhaber des selbst bewohnten Einfamilienhauses; Gewässerschäden nur aus Behältern bis 50 l und einer Gesamtmenge bis 500 l; Haftpflicht als Bauherr bis zu einer Bausumme von 100.000,00 € je Bauvorhaben.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Risiko der Schuberts die passende Absicherung zu.","paare":[["Ein Fußgänger stürzt auf dem nicht geräumten Gehweg vor dem Haus.","Privathaftpflicht (selbst bewohntes Einfamilienhaus)"],["Aus dem 6.000-l-Tank sickert Heizöl ins Erdreich und ins Grundwasser.","Gewässerschaden-Haftpflicht für den Tank (Anlagenrisiko)"],["Ein Passant wird von herabfallendem Baumaterial des Anbaus verletzt.","eigene Bauherren-Haftpflichtversicherung"],["Ein ungewöhnlich schwerer Sturm zerstört den halbfertigen Rohbau des Anbaus.","Bauleistungsversicherung"]],"erkl":"Der Tank überschreitet die Mengengrenzen, die Bausumme die Grenze der Privathaftpflicht. Schäden am eigenen Bauwerk sind kein Haftpflicht-, sondern ein Sachrisiko; die Wohngebäudeversicherung deckt Sturm an nicht bezugsfertigen Gebäudeteilen nicht.","norm":"AVB PHV (GDV-Muster), A1-6.3, A2-1; § 89 Abs. 2 WHG","id":"5.5-3-1"},{"typ":"wf","frage":"Welche Aussagen zur Haftung der Schuberts für den Heizöltank treffen zu?","aussagen":[["Wer eine Anlage zum Lagern von Heizöl betreibt, haftet für eine nachteilige Veränderung eines Gewässers auch ohne Verschulden.",true],["Die Ersatzpflicht entfällt, wenn der Schaden durch höhere Gewalt verursacht wurde.",true],["Die Schuberts haften nur, wenn ihnen grobe Fahrlässigkeit nachgewiesen wird.",false],["Laut ihren Bedingungen ist der Tank über die Privathaftpflicht mitversichert, weil sie das Haus selbst bewohnen.",false]],"erkl":"Das Wasserhaushaltsgesetz sieht für Anlagen eine Gefährdungshaftung vor; nur höhere Gewalt entlastet. Gewässerschäden können Sanierungskosten in sechsstelliger Höhe verursachen.","norm":"§ 89 Abs. 2 WHG","id":"5.5-3-2"},{"typ":"mc","frage":"Die Schuberts meinen, mit dem Auftrag an die Baufirma hätten sie keine Pflichten mehr für die Baustelle. Was trifft zu?","optionen":["Die Firma sichert die Baustelle; die Schuberts müssen sie sorgfältig auswählen und überwachen.","Das stimmt; ein Bauherr haftet nie, sobald er eine Fachfirma mit dem Bau beauftragt hat.","Die Schuberts haf
