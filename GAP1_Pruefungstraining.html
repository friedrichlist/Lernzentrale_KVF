ahl","frage":"Berechnen Sie die Nettojahresprämie der Glasversicherung für Frau Brandt (vor Nachlässen, ohne Steuer).","wert":20.0,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 38 m² (Spalte „bis 40 m²“) = 20,00 €. Nettojahresprämie Glas: 20,00 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2","id":"4.12-1-1"},{"typ":"zahl","frage":"Wie hoch ist die Nettoprämie gemäß Zahlungsweise der Glasversicherung von Frau Brandt bei jährlicher Zahlung?","wert":20.0,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 38 m² (Spalte „bis 40 m²“) = 20,00 €. Nettojahresprämie Glas: 20,00 €; − Abschlag für jährliche Zahlung 5 % von 20,00 € = 1,00 €; Nettoprämie gemäß Zahlungsweise 19,00 € – das unterschreitet die Mindestjahresprämie von 20,00 €, die auch bei Nachlässen nicht unterschritten werden darf → 20,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.1–0.3 (Mindestprämie, Dauernachlass, Ratenzahlung)","id":"4.12-1-2"},{"typ":"zahl","frage":"Wie hoch ist die Versicherungsteuer auf die Glasprämie von Frau Brandt?","wert":3.8,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 38 m² (Spalte „bis 40 m²“) = 20,00 €. Nettojahresprämie Glas: 20,00 €; − Abschlag für jährliche Zahlung 5 % von 20,00 € = 1,00 €; Nettoprämie gemäß Zahlungsweise 19,00 € – das unterschreitet die Mindestjahresprämie von 20,00 €, die auch bei Nachlässen nicht unterschritten werden darf → 20,00 €. Versicherungsteuer Glas 19 % auf die Jahresprämie: 20,00 € × 19 % = 3,80 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-1-3"},{"typ":"zahl","frage":"Welchen Betrag zahlt Frau Brandt jährlich für die Glasversicherung einschließlich Versicherungsteuer?","wert":23.8,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 38 m² (Spalte „bis 40 m²“) = 20,00 €. Nettojahresprämie Glas: 20,00 €; − Abschlag für jährliche Zahlung 5 % von 20,00 € = 1,00 €; Nettoprämie gemäß Zahlungsweise 19,00 € – das unterschreitet die Mindestjahresprämie von 20,00 €, die auch bei Nachlässen nicht unterschritten werden darf → 20,00 €. Versicherungsteuer Glas 19 % auf die Jahresprämie: 20,00 € × 19 % = 3,80 €. Zu zahlen jährlich: 20,00 € + 3,80 € = 23,80 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-1-4"},{"typ":"mc","frage":"Warum kann Frau Brandt die Glasprämie nicht monatlich zahlen?","optionen":["Glas ist nach dem Proximus-Tarif nur jährlich zahlbar.","Monatlich geht nur bei drei Jahren Laufzeit.","Monatlich kostet Glas einen Zuschlag von 5 %.","Die Monatsrate läge unter der Mindestrate (5 €)."],"richtig":[3],"erkl":"Tarif Glas Ziff. 0.1: monatlich nur per Lastschrift, Mindestrate 5 €. 20,00 € ÷ 12 = 1,67 € – das reicht nicht. Das Ceranfeld ist als Glaskeramik-Kochfläche ohne Zuschlag eingeschlossen (AGlB 2021 Ziff. 4.1.1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2","id":"4.12-1-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Tarif Glasversicherung (Proximus 5, Auszug) – Grundprämien in €, ohne Steuer","kopf":["Wohnfläche bis … m²","Einfamilienhaus","Wohnung im Mehrfamilienhaus"],"zeilen":[["40","–","20"],["60","36","27"],["80","48","36"],["100","60","43"],["120","65","49"],["140","71","57"],["160","77","62"],["200","96","78"],["250","120","96"],["300","140","115"]],"hinweis":"Aquarium/Terrarium bis 500 l 10 €, über 500 l 20 € je Stück · künstlerisch bearbeitete Scheiben bis 500 € prämienfrei, je weitere 100 € 5 € · Glaskeramik-Kochflächen sind eingeschlossen (AGlB 2021 Ziff. 4.1.1) · Mindestjahresprämie 20 € · Dauernachlass und Abschlag Zahlungsweise wie Hausrat."},{"titel":"Allgemeine Tarifbestimmungen (Hausrat, Wohngebäude, Glas)","kopf":["Ziffer","Regel"],"zeilen":[["0.1 Mindestjahresprämie","Hausrat 40 €, Wohngebäude 40 €, Glas 20 € (ohne Steuer); monatlich nur per SEPA-Lastschrift, Mindestrate 5 €"],["0.2 Dauernachlass","bei 3-jähriger Laufzeit 10 %"],["0.3 Ratenzahlung","die Prämie verringert sich: jährlich um 5 %, halbjährlich um 3 %, vierteljährlich um 2 %, monatlich um 0 %"],["0.4 Versicherungsteuer","Hausrat 16,15 % · Wohngebäude mit Feuer 16,34 %, ohne Feuer 19 %, nur Feuer 13,20 % · Glas 19 %"]],"hinweis":"Proximus 5, Tarif Hausrat, Tarif Wohngebäude, Tarif Glas, jeweils Ziff. 0."}]},{"typ":"situation","titel":"Fall 2: Familie Weber – Glas mit Aquarium","situation":"Familie Weber (Versicherungsnehmerin: Corinna Weber) wohnt in einer 118 m² großen Eigentumswohnung in einem Mehrfamilienhaus in Magdeburg. Im Wohnzimmer steht ein 400-Liter-Aquarium. Frau Weber wünscht eine Glasversicherung einschließlich Aquarium, drei Jahre Laufzeit und vierteljährliche Zahlung. Beginn: 01.11.2026.","items":[{"typ":"zahl","frage":"Berechnen Sie für Frau Weber die Nettojahresprämie der Glasversicherung einschließlich Aquarium (vor Nachlässen).","wert":59.0,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 118 m² (Spalte „bis 120 m²“) = 49,00 €. Zuschläge: Aquarium 400 Liter (bis 500 Liter) 10,00 €; Nettojahresprämie Glas: 59,00 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2","id":"4.12-2-1"},{"typ":"zahl","frage":"Wie hoch ist die Glasprämie von Frau Weber nach Abzug des Dauernachlasses?","wert":53.1,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 118 m² (Spalte „bis 120 m²“) = 49,00 €. Zuschläge: Aquarium 400 Liter (bis 500 Liter) 10,00 €; Nettojahresprämie Glas: 59,00 €; − Dauernachlass (3 Jahre) 10 % von 59,00 € = 5,90 €; verbleiben 53,10 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.1–0.3 (Mindestprämie, Dauernachlass, Ratenzahlung)","id":"4.12-2-2"},{"typ":"zahl","frage":"Wie hoch ist die vierteljährliche Rate der Glasversicherung von Frau Weber ohne Versicherungsteuer?","wert":13.01,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 118 m² (Spalte „bis 120 m²“) = 49,00 €. Zuschläge: Aquarium 400 Liter (bis 500 Liter) 10,00 €; Nettojahresprämie Glas: 59,00 €; − Dauernachlass (3 Jahre) 10 % von 59,00 € = 5,90 €; verbleiben 53,10 €. − Abschlag für vierteljährliche Zahlung 2 % von 53,10 € = 1,06 €; Nettoprämie gemäß Zahlungsweise: 52,04 €. Vierteljährliche Rate: 52,04 € ÷ 4 = 13,01 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.1–0.3 (Mindestprämie, Dauernachlass, Ratenzahlung)","id":"4.12-2-3"},{"typ":"zahl","frage":"Welchen Betrag zahlt Frau Weber vierteljährlich für die Glasversicherung einschließlich Versicherungsteuer?","wert":15.48,"einheit":"€","tol":0.01,"erkl":"Grundprämie Wohnung im Mehrfamilienhaus mit 118 m² (Spalte „bis 120 m²“) = 49,00 €. Zuschläge: Aquarium 400 Liter (bis 500 Liter) 10,00 €; Nettojahresprämie Glas: 59,00 €; − Dauernachlass (3 Jahre) 10 % von 59,00 € = 5,90 €; verbleiben 53,10 €. − Abschlag für vierteljährliche Zahlung 2 % von 53,10 € = 1,06 €; Nettoprämie gemäß Zahlungsweise: 52,04 €. Vierteljährliche Rate: 52,04 € ÷ 4 = 13,01 €. Versicherungsteuer Glas 19 % auf die Rate: 13,01 € × 19 % = 2,47 €. Zu zahlen je Fälligkeit: 13,01 € + 2,47 € = 15,48 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-2-4"},{"typ":"wf","frage":"Welche Aussagen zur Glasversicherung von Frau Weber treffen nach Proximus 5 zu?","aussagen":[["Für das 400-Liter-Aquarium berechnet der Tarif 10 €.",true],["Dauernachlass und Abschlag für die Zahlungsweise gelten auch in der Glasversicherung.",true],["Für die Glasversicherung gilt ein Steuersatz von 16,15 %.",false],["Die Grundprämie hängt von Art der Wohnung und Wohnfläche ab.",true]],"erkl":"Tarif Glas: Festbetrag nach Gebäudeart und Fläche (MFH bis 120 m² 49 €), Aquarium bis 500 l 10 €; Dauernachlass 10 % und Ratenabschlag wie in den anderen Sparten; Steuer 19 %.","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-2-5"}],"hilfe":[{"t  €"],["0.2 Dauernachlass","bei 3-jähriger Laufzeit 10 %"],["0.3 Ratenzahlung","die Prämie verringert sich: jährlich um 5 %, halbjährlich um 3 %, vierteljährlich um 2 %, monatlich um 0 %"],["0.4 Versicherungsteuer","Hausrat 16,15 % · Wohngebäude mit Feuer 16,34 %, ohne Feuer 19 %, nur Feuer 13,20 % · Glas 19 %"]],"hinweis":"Proximus 5, Tarif Hausrat, Tarif Wohngebäude, Tarif Glas, jeweils Ziff. 0."}]},{"typ":"situation","titel":"Fall 3: Herr Neumann – Glas und Naturgefahren","situation":"Klaus Neumann besitzt ein Einfamilienhaus (152 m² Wohnfläche) in 06618 Naumburg (Saale) mit einer bleiverglasten Haustür; die künstlerisch bearbeiteten Scheiben sollen bis 1.000 € je Schadenfall versichert sein. Er beantragt eine Glasversicherung mit drei Jahren Laufzeit, jährliche Zahlung. Außerdem möchte er in seiner Hausratversicherung (152 m², VS = Mindestsumme nach Klausel 7712) und in seiner Wohngebäudeversicherung (VS 1914: 21.600 M) weitere Naturgefahren einschließen; Vorschäden gab es nicht. Anpassungsfaktor 2026: 27,63.","items":[{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann die Nettojahresprämie der Glasversicherung einschließlich der künstlerisch bearbeiteten Scheiben.","wert":102.0,"einheit":"€","tol":0.01,"erkl":"Grundprämie Einfamilienhaus mit 152 m² (Spalte „bis 160 m²“) = 77,00 €. Zuschläge: künstlerisch bearbeitete Scheiben: Erhöhung auf 1.000,00 €, 5 × 100 € × 5 € 25,00 €; Nettojahresprämie Glas: 102,00 €; Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2","id":"4.12-3-1"},{"typ":"zahl","frage":"Welchen Betrag zahlt Herr Neumann jährlich für die Glasversicherung einschließlich Versicherungsteuer?","wert":103.78,"einheit":"€","tol":0.01,"erkl":"Grundprämie Einfamilienhaus mit 152 m² (Spalte „bis 160 m²“) = 77,00 €. Zuschläge: künstlerisch bearbeitete Scheiben: Erhöhung auf 1.000,00 €, 5 × 100 € × 5 € 25,00 €; Nettojahresprämie Glas: 102,00 €; − Dauernachlass (3 Jahre) 10 % von 102,00 € = 10,20 €; verbleiben 91,80 €. − Abschlag für jährliche Zahlung 5 % von 91,80 € = 4,59 €; Nettoprämie gemäß Zahlungsweise: 87,21 €. Versicherungsteuer Glas 19 % auf die Jahresprämie: 87,21 € × 19 % = 16,57 €. Zu zahlen jährlich: 87,21 € + 16,57 € = 103,78 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Glasversicherung (AGlB 2021) Ziff. 0–2; Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-3-2"},{"typ":"zahl","frage":"Um wie viel Euro steigt die Nettojahresprämie der Hausratversicherung von Herrn Neumann durch die weiteren Naturgefahren (vor Nachlässen)?","wert":19.76,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 152 m² × 650 € = 98.800,00 €. Weitere Naturgefahren Hausrat Zone I: 98.800,00 € × 0,20 ‰ = 19,76 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.12-3-3"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Neumann die Jahresprämie 1914 (in M) für die weiteren Naturgefahren in der Wohngebäudeversicherung.","wert":4.32,"einheit":"M","tol":0.01,"erkl":"Weitere Naturgefahren Wohngebäude Zone I: 21.600 M × 0,20 ‰ = 4,32 M (Jahresprämie 1914). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.12-3-4"},{"typ":"zahl","frage":"Um wie viel Euro steigt die Nettojahresprämie der Wohngebäudeversicherung von Herrn Neumann durch die weiteren Naturgefahren (vor Nachlässen)?","wert":119.36,"einheit":"€","tol":0.01,"erkl":"Weitere Naturgefahren Wohngebäude Zone I: 21.600 M × 0,20 ‰ = 4,32 M (Jahresprämie 1914). Nettojahresprämie dafür: 4,32 M × 27,63 = 119,36 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tari  2024 hatte er einen Rückstauschaden im Keller – den einzigen Vorschaden der letzten 10 Jahre. Sein Nachbar hatte 2021 und 2024 je einen Überschwemmungsschaden und fragt ebenfalls an. Anpassungsfaktor 2026: 27,63.","items":[{"typ":"zahl","frage":"Um wie viel Euro steigt die Nettojahresprämie der Hausratversicherung von Herrn Fischer durch die weiteren Naturgefahren?","wert":39.0,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 120 m² × 650 € = 78.000,00 €. Weitere Naturgefahren Hausrat Zone II: 78.000,00 € × 0,50 ‰ = 39,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.12-5-1"},{"typ":"zahl","frage":"Berechnen Sie für Herrn Fischer die Jahresprämie 1914 (in M) für die weiteren Naturgefahren in der Wohngebäudeversicherung.","wert":13.15,"einheit":"M","tol":0.01,"erkl":"Weitere Naturgefahren Wohngebäude Zone II: 26.300 M × 0,50 ‰ = 13,15 M (Jahresprämie 1914). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.12-5-2"},{"typ":"zahl","frage":"Um wie viel Euro steigt die Nettojahresprämie der Wohngebäudeversicherung von Herrn Fischer durch die weiteren Naturgefahren?","wert":363.33,"einheit":"€","tol":0.01,"erkl":"Weitere Naturgefahren Wohngebäude Zone II: 26.300 M × 0,50 ‰ = 13,15 M (Jahresprämie 1914). Nettojahresprämie dafür: 13,15 M × 27,63 = 363,33 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.12-5-3"},{"typ":"zahl","frage":"Wie viel zahlt Herr Fischer für die weiteren Naturgefahren in beiden Verträgen zusammen im Jahr einschließlich Versicherungsteuer?","wert":468.0,"einheit":"€","tol":0.01,"erkl":"Hausrat-VS mit Unterversicherungsverzicht: 120 m² × 650 € = 78.000,00 €. Weitere Naturgefahren Hausrat Zone II: 78.000,00 € × 0,50 ‰ = 39,00 €. Weitere Naturgefahren Wohngebäude Zone II: 26.300 M × 0,50 ‰ = 13,15 M (Jahresprämie 1914). Nettojahresprämie dafür: 13,15 M × 27,63 = 363,33 €. Mit Versicherungsteuer: Hausrat 39,00 € + 6,30 € (16,15 %) = 45,30 €; Wohngebäude 363,33 € + 59,37 € (16,34 %) = 422,70 €; zusammen 468,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Ziff. 0.4 (Versicherungsteuer); § 6 VersStG","id":"4.12-5-4"},{"typ":"mc","frage":"Was antworten Sie dem Nachbarn von Herrn Fischer (zwei Vorschäden in den letzten 10 Jahren)?","optionen":["Er zahlt den Satz der Zone II wie Herr Fischer.","Er zahlt den doppelten Satz der Zone II.","Er erhält Zone I, weil die PLZ nicht gelistet ist.","Proximus übernimmt das Elementarrisiko nicht."],"richtig":[3],"erkl":"Tarif Hausrat Ziff. 3.4 und Tarif Wohngebäude Ziff. 6.4: keine Risikoübernahme bei 2 oder mehr Vorschäden in den letzten 10 Jahren. Ein einziger Vorschaden führt in Zone II (0,50 ‰).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat; Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.12-5-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"  Jahre) 10 % von 124,41 € = 12,44 €; verbleiben 111,97 €. − Abschlag für jährliche Zahlung 5 % von 111,97 € = 5,60 €; Nettoprämie gemäß Zahlungsweise: 106,37 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-1-1"},{"typ":"zahl","frage":"Wie hoch ist die neue Nettoprämie gemäß Zahlungsweise der Hausratversicherung von Frau Albrecht (84-m²-Wohnung)?","wert":154.05,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 84 m² × 650 € = 54.600,00 €. PLZ 06114 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 54.600,00 € × 3,30 ‰ = 180,18 €; − Dauernachlass (3 Jahre) 10 % von 180,18 € = 18,02 €; verbleiben 162,16 €. − Abschlag für jährliche Zahlung 5 % von 162,16 € = 8,11 €; Nettoprämie gemäß Zahlungsweise: 154,05 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-1-2"},{"typ":"zahl","frage":"Für wie viele Tage des Versicherungsjahres wird bei Frau Albrecht der Unterschiedsbetrag berechnet?","wert":139,"einheit":"Tage","tol":0,"erkl":"Zeitraum 12.08.2026 bis 31.12.2026 (Ende des Versicherungsjahres): 139 Tage (30/360, erster und letzter Tag zählen). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-1-3"},{"typ":"zahl","frage":"Berechnen Sie den Nachbeitrag ohne Versicherungsteuer, den Frau Albrecht für das laufende Versicherungsjahr zahlen muss.","wert":18.41,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 58 m² × 650 € = 37.700,00 €. PLZ 06110 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 37.700,00 € × 3,30 ‰ = 124,41 €; − Dauernachlass (3 Jahre) 10 % von 124,41 € = 12,44 €; verbleiben 111,97 €. − Abschlag für jährliche Zahlung 5 % von 111,97 € = 5,60 €; Nettoprämie gemäß Zahlungsweise: 106,37 €. Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 84 m² × 650 € = 54.600,00 €. PLZ 06114 → Tarifzone H IV. Gesamtprämiensatz: Grundprämie Zone H IV 2,70 ‰ + Klausel 7110 Fahrrad 1 % der VS (1 × 0,60 ‰) 0,60 ‰ = 3,30 ‰. Nettojahresprämie: 54.600,00 € × 3,30 ‰ = 180,18 €; − Dauernachlass (3 Jahre) 10 % von 180,18 € = 18,02 €; verbleiben 162,16 €. − Abschlag für jährliche Zahlung 5 % von 162,16 € = 8,11 €; Nettoprämie gemäß Zahlungsweise: 154,05 €. Nettoprämie gemäß Zahlungsweise neu 154,05 € − alt 106,37 € = 47,68 €. Änderung der Jahresprämie (ohne Vorzeichen): 47,68 €. Zeitraum 12.08.2026 bis 31.12.2026 (Ende des Versicherungsjahres): 139 Tage (30/360, erster und letzter Tag zählen). Nachbeitrag: 47,68 € × 139 ÷ 360 = 18,41 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Vertragsanpassung bei Frau Albrecht treffen zu?","aussagen":[["Der neue Tarif gilt ab Umzugsbeginn, dem 12.08.2026.",true],["Der Unterschiedsbetrag wird ab dem 01.08.2026 berechnet.",false],["Damit der Verzicht weiter gilt, muss die VS mindestens 84 m² × 650 € betragen.",true],["Gerechnet wird mit Monaten zu 30 und dem Jahr zu 360 Tagen.",true]],"erkl":"VHB 2021 Ziff. 16.5.1: mit Umzugsbeginn gelten die Tarifbe 1,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 72 m² × 650 € = 46.800,00 €. PLZ 04109 → Tarifzone H III. Gesamtprämiensatz: Grundprämie Zone H III 2,30 ‰ + Wertsachen 30 % 0,90 ‰ = 3,20 ‰. Nettojahresprämie: 46.800,00 € × 3,20 ‰ = 149,76 €; − Dauernachlass (3 Jahre) 10 % von 149,76 € = 14,98 €; verbleiben 134,78 €. − Abschlag für jährliche Zahlung 5 % von 134,78 € = 6,74 €; Nettoprämie gemäß Zahlungsweise: 128,04 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-2-1"},{"typ":"zahl","frage":"Wie hoch ist die neue Nettoprämie gemäß Zahlungsweise der Hausratversicherung von Herrn Peters in Naumburg (Saale)?","wert":115.6,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 80 m² × 650 € = 52.000,00 €. PLZ 06618 → Tarifzone H II. Gesamtprämiensatz: Grundprämie Zone H II 2,00 ‰ + Wertsachen 30 % 0,60 ‰ = 2,60 ‰. Nettojahresprämie: 52.000,00 € × 2,60 ‰ = 135,20 €; − Dauernachlass (3 Jahre) 10 % von 135,20 € = 13,52 €; verbleiben 121,68 €. − Abschlag für jährliche Zahlung 5 % von 121,68 € = 6,08 €; Nettoprämie gemäß Zahlungsweise: 115,60 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-2-2"},{"typ":"zahl","frage":"Für wie viele Tage wird bei Herrn Peters der Unterschiedsbetrag bis zum Ende des Versicherungsjahres berechnet?","wert":148,"einheit":"Tage","tol":0,"erkl":"Zeitraum 03.11.2026 bis 31.03.2027 (Ende des Versicherungsjahres): 148 Tage (30/360, erster und letzter Tag zählen). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-2-3"},{"typ":"zahl","frage":"Berechnen Sie den Rückbeitrag ohne Versicherungsteuer, den Herr Peters für das laufende Versicherungsjahr erhält.","wert":5.11,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 72 m² × 650 € = 46.800,00 €. PLZ 04109 → Tarifzone H III. Gesamtprämiensatz: Grundprämie Zone H III 2,30 ‰ + Wertsachen 30 % 0,90 ‰ = 3,20 ‰. Nettojahresprämie: 46.800,00 € × 3,20 ‰ = 149,76 €; − Dauernachlass (3 Jahre) 10 % von 149,76 € = 14,98 €; verbleiben 134,78 €. − Abschlag für jährliche Zahlung 5 % von 134,78 € = 6,74 €; Nettoprämie gemäß Zahlungsweise: 128,04 €. Mindest-VS mit Unterversicherungsverzicht (Klausel 7712): 80 m² × 650 € = 52.000,00 €. PLZ 06618 → Tarifzone H II. Gesamtprämiensatz: Grundprämie Zone H II 2,00 ‰ + Wertsachen 30 % 0,60 ‰ = 2,60 ‰. Nettojahresprämie: 52.000,00 € × 2,60 ‰ = 135,20 €; − Dauernachlass (3 Jahre) 10 % von 135,20 € = 13,52 €; verbleiben 121,68 €. − Abschlag für jährliche Zahlung 5 % von 121,68 € = 6,08 €; Nettoprämie gemäß Zahlungsweise: 115,60 €. Nettoprämie gemäß Zahlungsweise neu 115,60 € − alt 128,04 € = −12,44 €. Änderung der Jahresprämie (ohne Vorzeichen): 12,44 €. Zeitraum 03.11.2026 bis 31.03.2027 (Ende des Versicherungsjahres): 148 Tage (30/360, erster und letzter Tag zählen). Rückbeitrag: 12,44 € × 148 ÷ 360 = 5,11 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.13-2-4"},{"typ":"mc","frage":"Warum erhält Herr Peters einen Rückbeitrag, obwohl die neue Wohnung größer ist?","optionen":["Bei jedem Umzug gibt es einen Rückbeitrag.","Der Dauernachlass steigt durch den Umzug.","Naumburg liegt in einer günstigeren Tarifzone.","Ab 80 m² sinkt der Prämiensatz."],"richtig":[2],"erkl":"Leipzig 04109 liegt in Zone H III, Naumburg 06618 in Zone H II; die niedrigeren Sätze gleichen die größere Fläche mehr als aus (neu 115,60 € statt 128,04 €).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis","id":"4.13-2-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Nach- und Rückbeitrag (Prüfungslogik)","kopf":["Schritt","Regel"],"zeilen":[["Grundlage","Nettoprämie gemäß Zahlungsweise alt und neu (nach allen Nachlässen, ohne Steuer)"],["Beginn","Hausrat: mit Umzugsbeginn gilt der Tarif der neuen Wohnung (VHB 2021 Ziff. 16.5.1); sonst ab dem Tag der Vertragsänderung"],["Tage","vom Änderungstag bis zum Ende des Versicherungsjahres, erster und letzter Tag zählen; Monat 30, Jahr 360 Tage"],["Betrag","(neue − alte Nettoprämie) × Tage ÷ 360; dann + Versicherungsteuer"],["Vertragsende","Rückbeitrag für die Tage na unterkellerter Anbau wird fertig; die Wohnfläche steigt auf 150 m². Der Vertrag wird zum 21.02.2027 angepasst, die VS 1914 neu nach dem Bogen ermittelt.","items":[{"typ":"zahl","frage":"Wie hoch war die bisherige VS 1914 für das Haus von Herrn Zimmermann mit 120 m²?","wert":20500.0,"einheit":"M","tol":0,"erkl":"Gebäudetyp DG ausgebaut, EG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 120 m² × 165 M = 19.800 M + 1 Garage × 700 M = 700 M = 20.500 M. VS 1914 = 20.500 M (schon volle 100 M). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.13-3-1"},{"typ":"zahl","frage":"Wie hoch ist die neue VS 1914 für das Haus von Herrn Zimmermann nach dem Anbau (150 m²)?","wert":25500.0,"einheit":"M","tol":0,"erkl":"Gebäudetyp DG ausgebaut, EG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 150 m² × 165 M = 24.750 M + 1 Garage × 700 M = 700 M = 25.450 M. Auf volle 100 M aufgerundet: VS 1914 = 25.500 M. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.13-3-2"},{"typ":"zahl","frage":"Um wie viel Euro steigt die Nettoprämie gemäß Zahlungsweise der Wohngebäudeversicherung von Herrn Zimmermann durch den Anbau?","wert":84.0,"einheit":"€","tol":0.01,"erkl":"Gebäudetyp DG ausgebaut, EG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 120 m² × 165 M = 19.800 M + 1 Garage × 700 M = 700 M = 20.500 M. VS 1914 = 20.500 M (schon volle 100 M). PLZ 06120 → Leitungswasser Zone II, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone II 0,35 ‰ + Sturm/Hagel Zone I 0,25 ‰ = 0,80 ‰. Jahresprämie 1914: 20.500 M × 0,80 ‰ = 16,40 M. Nettojahresprämie: 16,40 M × Anpassungsfaktor 27,63 = 453,13 €; − Selbstbeteiligung Klausel 7761 20 % von 453,13 € = 90,63 €; verbleiben 362,50 €. − Abschlag für jährliche Zahlung erkellert, eine Garage, Baujahr 1984; Feuer, Leitungswasser, Sturm/Hagel ohne Selbstbeteiligung, VS 1914 nach dem Bogen, drei Jahre Laufzeit, Versicherungsjahr = Kalenderjahr, Anpassungsfaktor 2026: 27,63, Jahresprämie im Januar gezahlt). Der Erwerber wird am 18.09.2026 im Grundbuch eingetragen und kündigt am selben Tag mit sofortiger Wirkung; der Vertrag endet mit Ablauf des 18.09.2026.","items":[{"typ":"zahl","frage":"Wie hoch ist die Nettoprämie gemäß Zahlungsweise der Wohngebäudeversicherung, die Frau Meier für 2026 gezahlt hat?","wert":288.91,"einheit":"€","tol":0.01,"erkl":"Gebäudetyp DG ausgebaut, EG + OG, mit Unterkellerung: 150 M je m². Ermittlungsbogen: 104 m² × 150 M = 15.600 M + 1 Garage × 700 M = 700 M = 16.300 M. VS 1914 = 16.300 M (schon volle 100 M). PLZ 06886 → Leitungswasser Zone I, Sturm/Hagel Zone I. Gesamtprämiensatz: Feuer 0,20 ‰ + Leitungswasser Zone I 0,30 ‰ + Sturm/Hagel Zone I 0,25 ‰ = 0,75 ‰. Jahresprämie 1914: 16.300 M × 0,75 ‰ = 12,23 M. Nettojahresprämie: 12,23 M × Anpassungsfaktor 27,63 = 337,91 €; − Dauernachlass (3 Jahre) 10 % von 337,91 € = 33,79 €; verbleiben 304,12 €. − Abschlag für jährliche Zahlung 5 % von 304,12 € = 15,21 €; Nettoprämie gemäß Zahlungsweise: 288,91 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.13-5-1"},{"typ":"zahl","frage":"Für wie viele Tage erhält Frau Meier einen Rückbeitrag?","wert":102,"einheit":"Tage","tol":0,"erkl":"Vertragsende mit Ablauf des 18.09.2026; Rückbeitrag für 19.09.2026 bis 31.12.2026: 102 Tage (30/360, erster und letzter Tag zählen). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 16.5 bzw. VGB 2021; Zinsmethode 30/360 laut Prüfungshinweis; § 39 Abs. 1 VVG","id":"4.13-5-2"},{"typ":"zahl","frag I","0,20 / 0,50 ‰ (nicht für Ferien-/Wochenendhäuser)"],["2.2.1 Zuschlag Feuer andere Bauweise","Fertighaus Gr. 2/3 0,15 · BAK III 0,80 · BAK IV 2,10 · BAK V 2,85 ‰"],["2.2.2 Ferien-/Wochenendhaus","Feuer + 0,55 ‰, Leitungswasser + 0,05 ‰"],["2.2.3 Schwimmbecken im Gebäude","Leitungswasser + 0,15 ‰"],["2.3 Klauseln","7167 0,10 · 7168 0,05 · 7260 0,10 · 7261 0,10 · 7264 0,10 · 7361 0,09 · 7362 0,15 · 7363 0,05 · 7366 0,10 ‰"],["3 Nachlässe (nacheinander)","Neubaurabatt 20 % (bis Ende des Versicherungsjahres, in dem das Gebäude 10 Jahre alt wird) · Mehrfamilienhaus ab 50.000 M 10 % · Selbstbeteiligung 500 € (Klausel 7761) 20 %"],["Prämie","VS 1914 × Prämiensatz ÷ 1.000 = Jahresprämie 1914 (M); × Anpassungsfaktor = Nettojahresprämie (VGB 2021 Ziff. 16)"]],"hinweis":"Den Anpassungsfaktor nennt die Aufgabe (Prüfung: 2023 24,06 · 2024 26,01 · 2025 26,51; LF 4 für 2026: 27,63)."},{"titel":"Allgemeine Tarifbestimmungen (Hausrat, Wohngebäude, Glas)","kopf":["Ziffer","Regel"],"zeilen":[["0.1 Mindestjahresprämie","Hausrat 40 €, Wohngebäude 40 €, Glas 20 € (ohne Steuer); monatlich nur per SEPA-Lastschrift, Mindestrate 5 €"],["0.2 Dauernachlass","bei 3-jähriger Laufzeit 10 %"],["0.3 Ratenzahlung","die Prämie verringert sich: jährlich um 5 %, halbjährlich um 3 %, vierteljährlich um 2 %, monatlich um 0 %"],["0.4 Versicherungsteuer","Hausrat 16,15 % · Wohngebäude mit Feuer 16,34 %, ohne Feuer 19 %, nur Feuer 13,20 % · Glas 19 %"]],"hinweis":"Proximus 5, Tarif Hausrat, Tarif Wohngebäude, Tarif Glas, jeweils Ziff. 0."}]}]},{"nr":"4.14","titel":"Rechenwerkstatt: Entschädigung berechnen","lf":"LF 4","buch":"S. 141–179","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Herr Wolff – Leitungswasser bei zu niedriger Summe","situation":"Finn Wolff wohnt in einer 76 m² großen Wohnung in Halle (Saale). Um Prämie zu sparen, hat er seine Hausratversicherung bei der Proximus Versicherung AG (VHB 2021) nur mit 38.000,00 € abgeschlossen. Am 14.01.2027 platzt ein Heizungsrohr; Möbel und Teppiche im Wert von 7.850,00 € (Neuwert) werden zerstört. Ein Gutachter stellt einen Versicherungswert des gesamten Hausrats von 61.500,00 € fest.","items":[{"typ":"zahl","frage":"Wie hoch hätte die Versicherungssumme von Herrn Wolff mindestens sein müssen, damit der Unterversicherungsverzicht gilt?","wert":49400.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 76 m² × 650 € = 49.400,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Hausrat (VHB 2021) Ziff. 0–3; Antrag Hausrat","id":"4.14-1-1"},{"typ":"zahl","frage":"Mit welcher Versicherungssumme einschließlich Vorsorge rechnet der Versicherer bei Herrn Wolff?","wert":41800.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 76 m² × 650 € = 49.400,00 €. Vereinbarte VS 38.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 38.000,00 € × 1,1 = 41.800,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-1-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung, die Herr Wolff für den Leitungswasserschaden erhält.","wert":5335.45,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 76 m² × 650 € = 49.400,00 €. Vereinbarte VS 38.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 38.000,00 € × 1,1 = 41.800,00 €. Kein Unterversicherungsverzicht (38.000,00 € < 49.400,00 €); Entschädigung = 7.850,00 € × 41.800,00 € ÷ 61.500,00 € = 5.335,45 € (Ziff. 17.5). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-1-3"},{"typ":"zahl","frage":"Um wie viel Euro kürzt der Versicherer die Entschädigung von Herrn Wolff wegen Unterversicherung?","wert":2514.55,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 76 m² × 650 € = 49.400,00 €. Vereinbarte VS 38.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 38.000,00 € × 1,1 = 41.800,00 €. Kein Unterversicherungsverzicht (38.000,00 € < 49.400,00 €); Entschädigung = 7.850,00 € × 41.800,00 € ÷ 61.500,00 € = 5.335,45 € (Ziff. 17.5). Kürzung: 7.850,00 € − 5.335,45 € = 2.514,55 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-1-4"},{"typ":"mc","frage":"Warum erhält Herr Wolff nicht den vollen Schaden ersetzt?","optionen":["Leitungswasserschäden werden nur zur Hälfte ersetzt.","Möbel sind in der Hausratversicherung nicht versichert.","Die VS mit Vorsorge liegt unter dem Versicherungswert.","Er hat den Schaden zu spät beim Versicherer gemeldet."],"richtig":[2],"erkl":"Ohne Unterversicherungsverzicht kürzt der Versicherer nach VHB 2021 Ziff. 17.5 im Verhältnis VS zuzüglich Vorsorge zum Versicherungswert.","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-1-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Hausrat (VHB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["17.2 Vorsorge","die Versicherungssumme erhöht sich um 10 %"],["17.5 Unterversicherung","Schaden × (VS + Vorsorge) ÷ Versicherungswert; nicht bei Unterversicherungsverzicht (Klausel 7712, VS ≥ 650 €/m²)"],["18.3.1 Wertsachen","insgesamt 20 % der VS (mit Vorsorge, wie LF 4 und GAP 2)"],["18.3.2 außerhalb eines Wertschutzschranks","Bargeld 1.500 € · Urkunden/Sparbücher 3.000 € · Schmuck, Edelsteine, Münzen, Gold/Platin 20.000 €"],["12.4 Außenversicherung","10 % der VS zuzüglich Vorsorge, höchstens 10.000 €"],["13.3 Hotelkosten","höchstens 100 Tage, je Tag 1 ‰ der VS zuzüglich Vorsorge, ohne Nebenkosten (z. B. Frühstück)"]],"hinweis":"Erst die Einzelgrenzen (z. B. Bargeld), dann die Gesamtgrenze für Wertsachen anwenden."}]},{"typ":"situation","titel":"Fall 2: Frau Schulz – Einbruch mit Schmuck und Bargeld","situation":"Hanna Schulz (Wohnung 70 m² in Dessau-Roßlau, Hausrat bei der Proximus Versicherung AG mit VS nach Klausel 7712) wird am 22.11.2026 Opfer eines Einbruchs. Gestohlen werden Schmuck (Wiederbeschaffungswert 8.700,00 €), Sammlermünzen (1.900,00 €), Bargeld (2.300,00 €), ein Laptop (1.400,00 €) sowie Kleidung und Taschen (900,00 €). Schmuck, Münzen und Bargeld lagen nicht in einem Wertschutzschrank.","items":[{"typ":"zahl","frage":"Wie hoch ist die Entschädigungsgrenze für Wertsachen insgesamt im Vertrag von Frau Schulz?","wert":10010.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 70 m² × 650 € = 45.500,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 45.500,00 € × 1,1 = 50.050,00 €. Wertsachengrenze: 20 % × 50.050,00 € = 10.010,00 € (Ziff. 18.3.1). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-2-1"},{"typ":"zahl","frage":"Wie viel Euro erhält Frau Schulz für das gestohlene Bargeld höchstens?","wert":1500.0,"einheit":"€","tol":0.01,"erkl":"Bargeld außerhalb eines Wertschutzschranks: Schaden 2.300,00 €, Grenze 1.500,00 € → 1.500,00 € (Ziff. 18.3.2.1). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-2-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung von Frau Schulz für alle Wertsachen zusammen (einschließlich Bargeld).","wert":10010.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 70 m² × 650 € = 45.500,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 45.500,00 € × 1,1 = 50.050,00 €. Wertsachengrenze: 20 % × 50.050,00 € = 10.010,00 € (Ziff. 18.3.1). Bargeld außerhalb eines Wertschutzschranks: Schaden 2.300,00 €, Grenze 1.500,00 € → 1.500,00 € (Ziff. 18.3.2.1). Schmuck/Münzen/Gold: Schmuck 8.700,00 € + Sammlermünzen 1.900,00 € = 10.600,00 € (Grenze 20.000 €, Ziff. 18.3.2.3 → 10.600,00 €); mit Bargeld 12.100,00 €; das übersteigt die Gesamtgrenze von 10.010,00 € → 10.010,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-2-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Frau Schulz aus dem Einbruch.","wert":12310.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 70 m² × 650 € = 45.500,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 45.500,00 € × 1,1 = 50.050,00 €. Wertsachengrenze: 20 % × 50.050,00 € = 10.010,00 € (Ziff. 18.3.1). Bargeld außerhalb eines Wertschutzschranks: Schaden 2.300,00 €, Grenze 1.500,00 € → 1.500,00 € (Ziff. 18.3.2.1). Schmuck/Münzen/Gold: Schmuck 8.700,00 € + Sammlermünzen 1.900,00 € = 10.600,00 € (Grenze 20.000 €, Ziff. 18.3.2.3 → 10.600,00 €); mit Bargeld 12.100,00 €; das übersteigt die Gesamtgrenze von 10.010,00 € → 10.010,00 €. Übriger Hausrat (keine Wertsachen): Laptop 1.400,00 € + Kleidung und Taschen 900,00 € = 2.300,00 €. Gesamtentschädigung: 10.010,00 € + 2.300,00 € = 12.310,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-2-4"},{"typ":"wf","frage":"Welche Aussagen zur Entschädigung von Frau Schulz treffen zu?","aussagen":[["Die Bargeldgrenze wird vor der Gesamtgrenze für Wertsachen angewendet.",true],["Der Laptop zählt zu den Wertsachen.",false],["Die Gesamtgrenze für Wertsachen wird aus der VS zuzüglich Vorsorge berechnet.",true],["Wegen des Unterversicherungsverzichts gelten keine Entschädigungsgrenzen.",false]],"erkl":"Der Verzicht schützt nur vor der Kürzung wegen Unterversicherung, nicht vor vereinbarten Grenzen. Laptop und Kleidung sind gewöhnlicher Hausrat (VHB 2021 Ziff. 18.1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-2-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Hausrat (VHB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["17.2 Vorsorge","die Versicherungssumme erhöht sich um 10 %"],["17.5 Unterversicherung","Schaden × (VS + Vorsorge) ÷ Versicherungswert; nicht bei Unterversicherungsverzicht (Klausel 7712, VS ≥ 650 €/m²)"],["18.3.1 Wertsachen","insgesamt 20 % der VS (mit Vorsorge, wie LF 4 und GAP 2)"],["18.3.2 außerhalb eines Wertschutzschranks","Bargeld 1.500 € · Urkunden/Sparbücher 3.000 € · Schmuck, Edelsteine, Münzen, Gold/Platin 20.000 €"],["12.4 Außenversicherung","10 % der VS zuzüglich Vorsorge, höchstens 10.000 €"],["13.3 Hotelkosten","höchstens 100 Tage, je Tag 1 ‰ der VS zuzüglich Vorsorge, ohne Nebenkosten (z. B. Frühstück)"]],"hinweis":"Erst die Einzelgrenzen (z. B. Bargeld), dann die Gesamtgrenze für Wertsachen anwenden."}]},{"typ":"situation","titel":"Fall 3: Herr Haddad – Einbruch zu Hause und im Hotel","situation":"Omar Haddad (Wohnung 95 m² in Erfurt, Hausrat bei der Proximus Versicherung AG mit VS nach Klausel 7712) meldet zwei Schäden: Bei einem Einbruch in die Wohnung am 03.05.2027 werden Bargeld (900,00 €), eine Goldkette (3.200,00 €) und ein Fernseher (1.600,00 €) gestohlen. Während einer Dienstreise am 28.06.2027 bricht ein Täter in sein Hotelzimmer ein und stiehlt Kamera, Tablet und Kleidung im Wert von 4.300,00 €. Bargeld und Goldkette lagen nicht in einem Wertschutzschrank.","items":[{"typ":"zahl","frage":"Wie hoch ist die Entschädigungsgrenze für Wertsachen insgesamt im Vertrag von Herrn Haddad?","wert":13596.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 € = 61.800,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 61.800,00 € × 1,1 = 67.980,00 €. Wertsachengrenze: 20 % × 67.980,00 € = 13.596,00 € (Ziff. 18.3.1). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-3-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für Herrn Haddad aus dem Wohnungseinbruch vom 03.05.2027.","wert":5700.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 € = 61.800,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 61.800,00 € × 1,1 = 67.980,00 €. Wertsachengrenze: 20 % × 67.980,00 € = 13.596,00 € (Ziff. 18.3.1). Bargeld außerhalb eines Wertschutzschranks: Schaden 900,00 €, Grenze 1.500,00 € → 900,00 € (Ziff. 18.3.2.1). Schmuck/Münzen/Gold: Goldkette 3.200,00 € = 3.200,00 € (Grenze 20.000 €, Ziff. 18.3.2.3 → 3.200,00 €); mit Bargeld 4.100,00 €; unter der Gesamtgrenze von 13.596,00 € → 4.100,00 €. Übriger Hausrat (keine Wertsachen): Fernseher 1.600,00 € = 1.600,00 €. Gesamtentschädigung: 4.100,00 € + 1.600,00 € = 5.700,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-3-2"},{"typ":"zahl","frage":"Wie hoch ist die Entschädigungsgrenze der Außenversicherung im Vertrag von Herrn Haddad?","wert":6798.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 € = 61.800,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 61.800,00 € × 1,1 = 67.980,00 €. Außenversicherung: 10 % × 67.980,00 € = 6.798,00 € → 6.798,00 € (Ziff. 12.4). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-3-3"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für Herrn Haddad aus dem Einbruch in das Hotelzimmer.","wert":4300.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 95 m² × 650 € = 61.800,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 61.800,00 € × 1,1 = 67.980,00 €. Außenversicherung: 10 % × 67.980,00 € = 6.798,00 € → 6.798,00 € (Ziff. 12.4). Schaden 4.300,00 €, Grenze 6.798,00 € → Entschädigung 4.300,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-3-4"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Hausrat (VHB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["17.2 Vorsorge","die Versicherungssumme erhöht sich um 10 %"],["17.5 Unterversicherung","Schaden × (VS + Vorsorge) ÷ Versicherungswert; nicht bei Unterversicherungsverzicht (Klausel 7712, VS ≥ 650 €/m²)"],["18.3.1 Wertsachen","insgesamt 20 % der VS (mit Vorsorge, wie LF 4 und GAP 2)"],["18.3.2 außerhalb eines Wertschutzschranks","Bargeld 1.500 € · Urkunden/Sparbücher 3.000 € · Schmuck, Edelsteine, Münzen, Gold/Platin 20.000 €"],["12.4 Außenversicherung","10 % der VS zuzüglich Vorsorge, höchstens 10.000 €"],["13.3 Hotelkosten","höchstens 100 Tage, je Tag 1 ‰ der VS zuzüglich Vorsorge, ohne Nebenkosten (z. B. Frühstück)"]],"hinweis":"Erst die Einzelgrenzen (z. B. Bargeld), dann die Gesamtgrenze für Wertsachen anwenden."}]},{"typ":"situation","titel":"Fall 4: Frau Dr. Vogt – Ferienwohnung und Hotel","situation":"Dr. Marlene Vogt (Wohnung 168 m² in Leipzig) hat ihren Hausrat bei der Proximus Versicherung AG wegen wertvoller Kunst mit 165.000,00 € versichert (über der Mindestsumme, Klausel 7712). Im Juli 2027 wird während ihres Urlaubs in die gemietete Ferienwohnung an der Ostsee eingebrochen: Kameraausrüstung, Laptop und Kleidung im Wert von 17.800,00 € fehlen. Im Oktober 2027 ist ihre Wohnung nach einem Brand 26 Tage unbewohnbar; sie wohnt im Hotel für 189,00 € je Nacht (ohne Frühstück).","items":[{"typ":"zahl","frage":"Wie hoch ist die Entschädigungsgrenze der Außenversicherung für Frau Dr. Vogt?","wert":10000.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 168 m² × 650 € = 109.200,00 €. Vereinbarte VS 165.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 165.000,00 € × 1,1 = 181.500,00 €. Außenversicherung: 10 % × 181.500,00 € = 18.150,00 €, höchstens 10.000,00 € → 10.000,00 € (Ziff. 12.4). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-4-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für Frau Dr. Vogt aus dem Einbruch in die Ferienwohnung.","wert":10000.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 168 m² × 650 € = 109.200,00 €. Vereinbarte VS 165.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 165.000,00 € × 1,1 = 181.500,00 €. Außenversicherung: 10 % × 181.500,00 € = 18.150,00 €, höchstens 10.000,00 € → 10.000,00 € (Ziff. 12.4). Schaden 17.800,00 €, Grenze 10.000,00 € → Entschädigung 10.000,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-4-2"},{"typ":"zahl","frage":"Wie viel Euro Hotelkosten je Tag ersetzt der Versicherer Frau Dr. Vogt höchstens?","wert":181.5,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 168 m² × 650 € = 109.200,00 €. Vereinbarte VS 165.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 165.000,00 € × 1,1 = 181.500,00 €. Hotelkosten je Tag höchstens 1 ‰ × 181.500,00 € = 181,50 € (Ziff. 13.3). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-4-3"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für die Hotelkosten von Frau Dr. Vogt.","wert":4719.0,"einheit":"€","tol":0.01,"erkl":"Mindest-VS mit Unterversicherungsverzicht: 168 m² × 650 € = 109.200,00 €. Vereinbarte VS 165.000,00 €. VS zuzüglich Vorsorge 10 % (Ziff. 17.2): 165.000,00 € × 1,1 = 181.500,00 €. Hotelkosten je Tag höchstens 1 ‰ × 181.500,00 € = 181,50 € (Ziff. 13.3). 26 Tage (höchstens 100) → 26 × 181,50 € (Kosten 189,00 € je Nacht, Grenze 181,50 €) = 4.719,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-4-4"},{"typ":"wf","frage":"Welche Aussagen zu den Grenzen im Vertrag von Frau Dr. Vogt treffen zu?","aussagen":[["Bei der Außenversicherung greift die Höchstgrenze von 10.000 €.",true],["Die Hotelkosten werden in voller Höhe von 189 € je Nacht ersetzt.",false],["Hotelkosten werden höchstens für 100 Tage ersetzt.",true],["Für die Außenversicherung gilt keine Höchstgrenze in Euro.",false]],"erkl":"10 % der VS zuzüglich Vorsorge wären 18.150,00 €, gedeckelt auf 10.000,00 €; je Hoteltag bis 1 ‰ von 181.500,00 € = 181,50 €, die 189 € liegen darüber und werden gekürzt.","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 13.3, 17.2, 17.5, 18.3","id":"4.14-4-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Hausrat (VHB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["17.2 Vorsorge","die Versicherungssumme erhöht sich um 10 %"],["17.5 Unterversicherung","Schaden × (VS + Vorsorge) ÷ Versicherungswert; nicht bei Unterversicherungsverzicht (Klausel 7712, VS ≥ 650 €/m²)"],["18.3.1 Wertsachen","insgesamt 20 % der VS (mit Vorsorge, wie LF 4 und GAP 2)"],["18.3.2 außerhalb eines Wertschutzschranks","Bargeld 1.500 € · Urkunden/Sparbücher 3.000 € · Schmuck, Edelsteine, Münzen, Gold/Platin 20.000 €"],["12.4 Außenversicherung","10 % der VS zuzüglich Vorsorge, höchstens 10.000 €"],["13.3 Hotelkosten","höchstens 100 Tage, je Tag 1 ‰ der VS zuzüglich Vorsorge, ohne Nebenkosten (z. B. Frühstück)"]],"hinweis":"Erst die Einzelgrenzen (z. B. Bargeld), dann die Gesamtgrenze für Wertsachen anwenden."}]},{"typ":"situation","titel":"Fall 5: Herr Kaiser – Ausbau nicht gemeldet","situation":"Bernd Kaiser hat sein Einfamilienhaus in 06217 Merseburg (Erd- und Obergeschoss, unterkellert, Dachgeschoss damals nicht ausgebaut, 106 m²) bei der Proximus Versicherung AG nach dem Ermittlungsbogen versichert, Selbstbeteiligung 500 € (Klausel 7761). 2024 hat er das Dachgeschoss ausgebaut; die Wohnfläche beträgt seitdem 140 m². Gemeldet hat er das nicht. Nach einem Sturm am 19.11.2026 betragen der Gebäudeschaden 36.400,00 € und die Aufräumkosten 2.800,00 €.","items":[{"typ":"zahl","frage":"Wie hoch ist die vereinbarte VS 1914 von Herrn Kaiser (Bogen mit den ursprünglichen Angaben)?","wert":17500.0,"einheit":"M","tol":0,"erkl":"Gebäudetyp DG nicht ausgebaut, EG + OG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 106 m² × 165 M = 17.490 M. Auf volle 100 M aufgerundet: VS 1914 = 17.500 M. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.14-5-1"},{"typ":"zahl","frage":"Wie hoch ist der Versicherungswert 1914 des Hauses von Herrn Kaiser nach dem Ausbau?","wert":21000.0,"einheit":"M","tol":0,"erkl":"Gebäudetyp DG ausgebaut, EG + OG, mit Unterkellerung: 150 M je m². Ermittlungsbogen: 140 m² × 150 M = 21.000 M. VS 1914 = 21.000 M (schon volle 100 M). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, Tarif Wohngebäude (VGB 2021) Ziff. 0–3; Ermittlungsbogen VS 1914","id":"4.14-5-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Gebäudeschaden von Herrn Kaiser.","wert":30333.33,"einheit":"€","tol":0.01,"erkl":"Gebäudetyp DG nicht ausgebaut, EG + OG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 106 m² × 165 M = 17.490 M. Auf volle 100 M aufgerundet: VS 1914 = 17.500 M. Gebäudetyp DG ausgebaut, EG + OG, mit Unterkellerung: 150 M je m². Ermittlungsbogen: 140 m² × 150 M = 21.000 M. VS 1914 = 21.000 M (schon volle 100 M). Unterversicherung (Ziff. 15.2.2, 18.8): Gebäudeschaden 36.400,00 € × 17.500 M ÷ 21.000 M = 30.333,33 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-5-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Herrn Kaiser (Gebäudeschaden und Aufräumkosten, nach Selbstbeteiligung).","wert":32166.66,"einheit":"€","tol":0.01,"erkl":"Gebäudetyp DG nicht ausgebaut, EG + OG, mit Unterkellerung: 165 M je m². Ermittlungsbogen: 106 m² × 165 M = 17.490 M. Auf volle 100 M aufgerundet: VS 1914 = 17.500 M. Gebäudetyp DG ausgebaut, EG + OG, mit Unterkellerung: 150 M je m². Ermittlungsbogen: 140 m² × 150 M = 21.000 M. VS 1914 = 21.000 M (schon volle 100 M). Unterversicherung (Ziff. 15.2.2, 18.8): Gebäudeschaden 36.400,00 € × 17.500 M ÷ 21.000 M = 30.333,33 €. Aufräumkosten ebenso: 2.800,00 € × 17.500 M ÷ 21.000 M = 2.333,33 €. Gesamt: 30.333,33 € + 2.333,33 € − Selbstbeteiligung 500,00 € = 32.166,66 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-5-4"},{"typ":"mc","frage":"Warum kürzt der Versicherer die Entschädigung von Herrn Kaiser?","optionen":["Sturmschäden werden nur zum Zeitwert ersetzt.","Der Anpassungsfaktor ist seit 2024 gestiegen.","Der wertsteigernde Ausbau wurde nicht angezeigt.","Sturmschäden unter 50.000 € sind nicht versichert."],"richtig":[2],"erkl":"VGB 2021 Ziff. 15.2.2: Der Unterversicherungsverzicht entfällt bei nicht angezeigten wertsteigernden Baumaßnahmen, die nicht in derselben Versicherungsperiode wie der Schaden liegen; gekürzt wird nach Ziff. 18.8, Kosten ebenso (wie GAP 2 Sommer 2025).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-5-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Ermittlung der VS 1914 (Proximus-Ermittlungsbogen, Ein- und Zweifamilienhäuser BAK I/II)","kopf":["Gebäudetyp","ohne Unterkellerung","mit Unterkellerung (auch Teilunterkellerung)"],"zeilen":[["Flachdach, EG","160 M/m²","190 M/m²"],["Flachdach, EG + OG","160 M/m²","190 M/m²"],["DG nicht ausgebaut, EG","160 M/m²","190 M/m²"],["DG ausgebaut, EG","140 M/m²","165 M/m²"],["DG nicht ausgebaut, EG + OG","140 M/m²","165 M/m²"],["DG ausgebaut, EG + OG","130 M/m²","150 M/m²"]],"hinweis":"Zuschläge je m²: Naturschiefer-/Kupferdach 4 · Außenwände Naturstein/Klinker 5 · Stuck/Edelholz 6 · Natursteinböden/Parkett 4 · Leichtmetall-/Holzsprossenfenster 4 · Edelholztüren 3 · hochwertige Sanitär 6 · Wärmepumpe/Solar/Fußbodenheizung 6. Abschläge je m²: PVC-Böden 3 · einfaches Fensterglas 3 · ohne Bad/Dusche 4 · Ofenheizung 4. Ausgebaute Kellerfläche × 15 M · je Garage 700 M · Ergebnis auf volle 100 M aufrunden. Der Bogen gilt laut Proximus für BAK I/II; die Prüfung (GAP 1 Herbst 2025) ermittelt auch bei anderer Bauart so und rechnet den Feuerzuschlag der Bauartklasse dazu."},{"titel":"Entschädigung Wohngebäude (VGB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["11 Aufräumungs- und Abbruchkosten","je Versicherungsfall bis 5 % der VS 1914 × Anpassungsfaktor zum Zeitpunkt des Versicherungsfalles"],["13.2.1 Mietausfall","höchstens 12 Monate seit dem Versicherungsfall"],["15.2.1 Unterversicherungsverzicht","wenn die VS 1914 aus richtigen Antragsangaben (Bogen) ermittelt wurde"],["15.2.2 / 15.2.3","kein Verzicht bei nicht angezeigten wertsteigernden Baumaßnahmen (außer in derselben Versicherungsperiode) oder falschen Antragsangaben"],["18.8 Unterversicherung","Schaden × VS 1914 ÷ Versicherungswert 1914; Kosten und Mietausfall ebenso kürzen"],["Selbstbeteiligung","Klausel 7761 bzw. Elementar: 500 € je Versicherungsfall, von der Entschädigung abziehen"]],"hinweis":"Anpassungsfaktor 2026 laut LF 4: 27,63."}]},{"typ":"situation","titel":"Fall 6: Familie Berger – Brand mit hohen Aufräumkosten","situation":"Das Zweifamilienhaus von Thomas Berger in Sangerhausen ist bei der Proximus Versicherung AG gegen Feuer, Leitungswasser und Sturm/Hagel mit einer VS 1914 von 24.800 M nach dem Ermittlungsbogen versichert (Unterversicherungsverzicht). Am 08.12.2026 brennt es: Der Gebäudeschaden beträgt 214.000,00 €, Aufräumungs- und Abbruchkosten 38.600,00 €. Die vermietete Einliegerwohnung (Miete 640,00 € monatlich) ist 15 Monate unbewohnbar; der Mieter zahlt so lange keine Miete. Anpassungsfaktor 2026: 27,63.","items":[{"typ":"zahl","frage":"Wie hoch ist die Grenze für Aufräumungs- und Abbruchkosten im Vertrag von Herrn Berger?","wert":34261.2,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 24.800 M × 27,63 (Anpassungsfaktor 2026) = 34.261,20 € (VGB 2021 Ziff. 11). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-6-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für die Aufräumungs- und Abbruchkosten von Herrn Berger.","wert":34261.2,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 24.800 M × 27,63 (Anpassungsfaktor 2026) = 34.261,20 € (VGB 2021 Ziff. 11). Aufräumkosten 38.600,00 € übersteigen die Grenze von 34.261,20 € → 34.261,20 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-6-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Mietausfall der Einliegerwohnung von Herrn Berger.","wert":7680.0,"einheit":"€","tol":0.01,"erkl":"Mietausfall: 15 Monate (höchstens 12, Ziff. 13.2.1) → 12 × 640,00 € = 7.680,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-6-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Herrn Berger (Gebäudeschaden, Aufräumkosten und Mietausfall).","wert":255941.2,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 24.800 M × 27,63 (Anpassungsfaktor 2026) = 34.261,20 € (VGB 2021 Ziff. 11). Aufräumkosten 38.600,00 € übersteigen die Grenze von 34.261,20 € → 34.261,20 €. Mietausfall: 15 Monate (höchstens 12, Ziff. 13.2.1) → 12 × 640,00 € = 7.680,00 €. Gesamt: Gebäudeschaden 214.000,00 € + Aufräumkosten 34.261,20 € + Mietausfall 7.680,00 € = 255.941,20 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-6-4"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Wohngebäude (VGB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["11 Aufräumungs- und Abbruchkosten","je Versicherungsfall bis 5 % der VS 1914 × Anpassungsfaktor zum Zeitpunkt des Versicherungsfalles"],["13.2.1 Mietausfall","höchstens 12 Monate seit dem Versicherungsfall"],["15.2.1 Unterversicherungsverzicht","wenn die VS 1914 aus richtigen Antragsangaben (Bogen) ermittelt wurde"],["15.2.2 / 15.2.3","kein Verzicht bei nicht angezeigten wertsteigernden Baumaßnahmen (außer in derselben Versicherungsperiode) oder falschen Antragsangaben"],["18.8 Unterversicherung","Schaden × VS 1914 ÷ Versicherungswert 1914; Kosten und Mietausfall ebenso kürzen"],["Selbstbeteiligung","Klausel 7761 bzw. Elementar: 500 € je Versicherungsfall, von der Entschädigung abziehen"]],"hinweis":"Anpassungsfaktor 2026 laut LF 4: 27,63."}]},{"typ":"situation","titel":"Fall 7: Frau Arslan – Leitungswasserschaden im Mietshaus","situation":"Elif Arslan besitzt ein Haus mit zwei Wohnungen in Köthen (Anhalt), bei der Proximus Versicherung AG versichert gegen Feuer, Leitungswasser und Sturm/Hagel, VS 1914 18.700 M nach dem Ermittlungsbogen, Selbstbeteiligung 500 € (Klausel 7761). Am 30.11.2026 bricht eine Leitung im Dachgeschoss. Gebäudeschaden: 46.300,00 €, Aufräumungskosten: 3.950,00 €. Die vermietete Obergeschosswohnung (Miete 520,00 € monatlich) ist 7 Monate unbewohnbar. Anpassungsfaktor 2026: 27,63.","items":[{"typ":"zahl","frage":"Wie hoch ist die Grenze für Aufräumungs- und Abbruchkosten im Vertrag von Frau Arslan?","wert":25834.05,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 18.700 M × 27,63 (Anpassungsfaktor 2026) = 25.834,05 € (VGB 2021 Ziff. 11). Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-7-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für die Aufräumungskosten von Frau Arslan.","wert":3950.0,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 18.700 M × 27,63 (Anpassungsfaktor 2026) = 25.834,05 € (VGB 2021 Ziff. 11). Aufräumkosten 3.950,00 € liegen unter der Grenze von 25.834,05 € → 3.950,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-7-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Mietausfall von Frau Arslan.","wert":3640.0,"einheit":"€","tol":0.01,"erkl":"Mietausfall: 7 Monate (höchstens 12, Ziff. 13.2.1) → 7 × 520,00 € = 3.640,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-7-3"},{"typ":"zahl","frage":"Berechnen Sie die Gesamtentschädigung für Frau Arslan nach Abzug der Selbstbeteiligung.","wert":53390.0,"einheit":"€","tol":0.01,"erkl":"Grenze Aufräumungs- und Abbruchkosten: 5 % × 18.700 M × 27,63 (Anpassungsfaktor 2026) = 25.834,05 € (VGB 2021 Ziff. 11). Aufräumkosten 3.950,00 € liegen unter der Grenze von 25.834,05 € → 3.950,00 €. Mietausfall: 7 Monate (höchstens 12, Ziff. 13.2.1) → 7 × 520,00 € = 3.640,00 €. Gesamt: Gebäudeschaden 46.300,00 € + Aufräumkosten 3.950,00 € + Mietausfall 3.640,00 € − Selbstbeteiligung 500,00 € = 53.390,00 €. Rundung: jede Zwischenzahl kaufmännisch auf volle Cent (wie in den Lösungen der GAP 1).","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-7-4"},{"typ":"wf","frage":"Welche Aussagen zur Entschädigung von Frau Arslan treffen zu?","aussagen":[["Die Aufräumungskosten werden voll ersetzt, weil sie unter der Grenze liegen.",true],["Der Mietausfall wird nur bis 6 Monate ersetzt.",false],["Die Kostengrenze ist 5 % der VS 1914 × Anpassungsfaktor.",true],["Der Gebäudeschaden wird wegen Unterversicherung gekürzt.",false]],"erkl":"Grenze 25.834,05 € (VGB 2021 Ziff. 11); Mietausfall bis 12 Monate (Ziff. 13.2.1). Die VS nach dem Bogen sichert den Unterversicherungsverzicht (Ziff. 15.2.1); abgezogen wird nur die Selbstbeteiligung.","norm":"Proximus 5, VGB 2021 Ziff. 11, 13.2, 15.2, 18.8","id":"4.14-7-5"}],"hilfe":[{"titel":"Rechenweg wie in der Prüfung (Antrag Proximus, Lösungen GAP 1)","kopf":["Schritt","Festlegung"],"zeilen":[["1 Prämiensatz","Grundprämie + alle Zuschläge in ‰ addieren = Gesamtprämiensatz"],["2 Nettojahresprämie","Hausrat: VS × Gesamtprämiensatz ÷ 1.000 · Glas: Festbetrag nach Tabelle + Zuschläge · Wohngebäude: VS 1914 × Gesamtprämiensatz ÷ 1.000 = Jahresprämie 1914 (M), × Anpassungsfaktor"],["3 Nachlässe","nacheinander, jeweils vom verminderten Betrag: Neubau → Mehrfamilienhaus → Selbstbeteiligung → Dauernachlass → Abschlag Zahlungsweise"],["4 Mindestjahresprämie","darf auch nach Nachlässen nicht unterschritten werden (Hausrat, Wohngebäude 40 €, Glas 20 €)"],["5 Rate","Nettoprämie gemäß Zahlungsweise ÷ Zahl der Raten"],["6 Versicherungsteuer","auf die Rate (bei jährlicher Zahlung auf die Jahresprämie); zu zahlen = Rate + Steuer"],["Rundung","jede Zwischenzahl kaufmännisch auf Cent; VS Hausrat auf volle 100 € aufrunden, VS 1914 auf volle 100 M aufrunden"]],"hinweis":"Quelle: Proximus 5, Antrag Hausrat und Antrag Wohngebäude/Glas; Lösungen GAP 1 Herbst 2023 bis Herbst 2025."},{"titel":"Entschädigung Wohngebäude (VGB 2021, Proximus 5)","kopf":["Ziffer","Regel"],"zeilen":[["11 Aufräumungs- und Abbruchkosten","je Versicherungsfall bis 5 % der VS 1914 × Anpassungsfaktor zum Zeitpunkt des Versicherungsfalles"],["13.2.1 Mietausfall","höchstens 12 Monate seit dem Versicherungsfall"],["15.2.1 Unterversicherungsverzicht","wenn die VS 1914 aus richtigen Antragsangaben (Bogen) ermittelt wurde"],["15.2.2 / 15.2.3","kein Verzicht bei nicht angezeigten wertsteigernden Baumaßnahmen (außer in derselben Versicherungsperiode) oder falschen Antragsangaben"],["18.8 Unterversicherung","Schaden × VS 1914 ÷ Versicherungswert 1914; Kosten und Mietausfall ebenso kürzen"],["Selbstbeteiligung","Klausel 7761 bzw. Elementar: 500 € je Versicherungsfall, von der Entschädigung abziehen"]],"hinweis":"Anpassungsfaktor 2026 laut LF 4: 27,63."}]}]}]},{"nr":"5","titel":"Berufsausübung und Freizeitgestaltung absichern","lf":"LF 5","abschnitte":[{"nr":"5.1","titel":"Beratungsanlässe in Beruf und Freizeit","lf":"LF 5","buch":"S. 234","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie dem Anlass die passende Absicherung zu.","paare":[["Kauf eines Hundes","Tierhalterhaftpflichtversicherung (Hundehalter)"],["Kauf eines eigenen Reitpferdes","Tierhalterhaftpflichtversicherung (Pferdehalter)"],["private Kameradrohne mit 900 g Fluggewicht","Haftpflichtversicherung für Drohnen (gesetzliche Versicherungspflicht)"],["Ehrenamt als Trainer im Sportverein","Prüfung der Vereins- bzw. Privathaftpflicht"]],"erkl":"Hunde- und Pferdehalter sind in der Privathaftpflicht nicht versichert; dafür gibt es die Hundehalter- und die Pferdehalter-Haftpflicht. Für Drohnen besteht eine Versicherungspflicht; die Privathaftpflicht der Proximus deckt nur Drohnen bis 250 g. Ein Ehrenamt ist mitversichert, soweit kein anderer Vertrag (z. B. die Vereinshaftpflicht) leistet.","norm":"§ 833 BGB, § 43 LuftVG, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.2.2, 6.9, 6.11.1, Abschnitte 2 und 3","id":"5.1-1-1"},{"typ":"mc","frage":"Welche Haustiere sind in der Privathaftpflicht in der Regel ohne Weiteres mitversichert?","optionen":["Zahme Haustiere wie Katzen oder Kaninchen","Eigene Pferde, die nur gelegentlich geritten werden","Wellensittiche nur, wenn sie in einer Voliere leben","Hunde, sofern sie nicht als gefährlich gelten"],"richtig":[0],"erkl":"Mitversichert sind zahme Haustiere und gezähmte Kleintiere (z. B. Katzen, Hamster, Singvögel). Für Hunde und Pferde wird eine eigene Tierhalterhaftpflicht benötigt.","norm":"Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.9","id":"5.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Beratungsanlässen treffen zu?","aussagen":[["Der Beginn einer Ausbildung kann die Frage nach der eigenen Haftpflichtversicherung auslösen.",true],["Ein neues Hobby wie Segeln kann zusätzliche Haftpflichtrisiken bringen.",true],["Ein Wechsel des Arbeitgebers hat nie Auswirkungen auf Versicherungen.",false],["Bei Streit mit dem Arbeitgeber hilft eine Rechtsschutzversicherung mit Arbeits-Rechtsschutz.",true]],"erkl":"Beruf und Freizeit verändern Haftungs- und Rechtsschutzrisiken. Eigene Segelboote sind z. B. in der Privathaftpflicht der Proximus nicht versichert, fremde ohne Motor schon.","norm":"Bedarfsanalyse; Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 2.1.2, 6.12.1; ARB 2021 Ziff. 2.2.2","id":"5.1-1-3"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Wagner ruft an: Er hat sich einen jungen Labrador gekauft, spielt seit Kurzem Fußball im Verein und fliegt am Wochenende mit einer kleinen Kameradrohne über den Feldern. Er hat bei Ihnen eine Privathaftpflichtversicherung.","items":[{"typ":"mc","frage":"Ist der Hund über seine Privathaftpflicht versichert?","optionen":["Ja, aber nur für Schäden innerhalb der eigenen Wohnung.","Ja, solange der Hund jünger als ein Jahr ist.","Ja, weil alle Haustiere in der Privathaftpflicht mitversichert sind.","Nein, er braucht eine eigene Hundehalterhaftpflichtversicherung."],"richtig":[3],"erkl":"Hundehalter haften als Halter eines Luxustieres verschuldensunabhängig; die Privathaftpflicht der Proximus schließt Hunde aus. Versichert wird der Hund über die Hundehalter-Haftpflicht.","norm":"§ 833 S. 1 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.9, Abschnitt 2","id":"5.1-2-1"},{"typ":"mc","frage":"Wie ist die Drohne zu beurteilen?","optionen":["Für Drohnen besteht keine Versicherungspflicht, solange sie nur über freie Felder fliegen.","Drohnen sind immer über die Kfz-Haftpflichtversicherung des Halters automatisch mitversichert.","Für Drohnen besteht Versicherungspflicht; ob die Privathaftpflicht sie deckt, ist zu prüfen.","Drohnen sind über die Hausratversicherung gegen Haftpflichtschäden gedeckt."],"richtig":[2],"erkl":"Halter von Luftfahrzeugen, auch unbemannten, müssen eine Haftpflichtversicherung haben. Die Privathaftpflicht der Proximus deckt Drohnen nur bis 250 g Fluggewicht; für eine schwerere Drohne braucht Herr Wagner eine eigene Drohnen-Haftpflicht.","norm":"§ 43 LuftVG, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.11.1, 9.3.2","id":"5.1-2-2"},{"typ":"mc","frage":"Herr Wagner verletzt beim Fußball einen Gegenspieler durch ein normales Foul. Was gilt?","optionen":["Der Verein haftet automatisch und zahlt dem Gegenspieler das Schmerzensgeld.","Bei sportüblichem Verhalten haftet er meist nicht; die Privathaftpflicht wehrt Ansprüche ab.","Er haftet voll, aber die Privathaftpflicht schließt Schäden beim Vereinssport grundsätzlich aus.","Er haftet für jede Verletzung voll, auch bei regelgerechtem Spiel im sportlichen Wettkampf."],"richtig":[1],"erkl":"Wer an einem Kampfspiel teilnimmt, nimmt regelgerechte Verletzungen in Kauf. Die Privathaftpflicht deckt die Sportausübung und wehrt unberechtigte Ansprüche ab (passiver Rechtsschutz).","norm":"§ 823 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 4.1, 6.7.1","id":"5.1-2-3"}]}]},{"nr":"5.2","titel":"Haftungsansprüche analysieren und eigene Ansprüche durchsetzen","lf":"LF 5","buch":"S. 235–238","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Voraussetzungen der Haftung nach § 823 Abs. 1 BGB in die richtige Reihenfolge der Prüfung.","paare":[["1.","Handlung (Tun oder Unterlassen)"],["2.","dadurch verursachte Verletzung eines geschützten Rechtsguts"],["3.","Rechtswidrigkeit"],["4.","Verschulden (Vorsatz oder Fahrlässigkeit)"],["5.","Schaden, der auf der Rechtsgutverletzung beruht"]],"erkl":"Die Reihenfolge dient der Prüfung; fehlt eine Voraussetzung, besteht kein Anspruch aus § 823 Abs. 1 BGB.","norm":"§ 823 Abs. 1 BGB","id":"5.2-1-1"},{"typ":"wf","frage":"Welche Aufgaben übernimmt die Privathaftpflichtversicherung?","aussagen":[["Prüfung, ob und in welcher Höhe der Kunde haftet",true],["Abwehr unberechtigter Ansprüche (passiver Rechtsschutz)",true],["Ersatz berechtigter Ansprüche",true],["Ersatz von Schäden, die der Kunde an eigenen Sachen verursacht",false]],"erkl":"Eigenschäden sind nie Gegenstand der Haftpflichtversicherung; sie setzt die Inanspruchnahme durch einen Dritten voraus.","norm":"§ 100 VVG, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 3.1, 4.1","id":"5.2-1-2"},{"typ":"mc","frage":"Ein Fünfjähriger zerkratzt beim Spielen das Auto des Nachbarn. Wer haftet?","optionen":["Das Kind haftet grundsätzlich nicht; die Eltern nur bei Verletzung der Aufsichtspflicht.","Die Eltern haften immer, auch wenn sie ihre Aufsichtspflicht erfüllt haben.","Der Nachbar hat keinerlei Ansprüche, weil Kinder unter zehn Jahren nie haften.","Das Kind haftet ab fünf Jahren voll; die Eltern haften zusätzlich als Gesamtschuldner."],"richtig":[0],"erkl":"Kinder unter sieben Jahren sind nicht deliktsfähig; die Eltern haften nur bei Verletzung ihrer Aufsichtspflicht. Die Privathaftpflicht der Proximus beruft sich auf Wunsch des Versicherungsnehmers nicht auf die Deliktsunfähigkeit mitversicherter Kinder (bis 100.000 € je Versicherungsfall), außer z. B. eine Sachversicherung des Geschädigten leistet.","norm":"§§ 828 Abs. 1, 829, 832 BGB, Proximus 5, AVB PHV 2021 Teil A Abschnitt 1 Ziff. 6.1.6.1","id":"5.2-1-3"},{"t
