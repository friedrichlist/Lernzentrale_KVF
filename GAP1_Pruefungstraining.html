:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px color-mix(in srgb,#000000 15%,transparent);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
.hilfe{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--card)}.hilfe>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px}
.hilfe .tw{overflow-x:auto;padding:0 12px 10px}.hilfe h3{font-size:14px;margin:8px 0 4px}.hilfe table{border-collapse:collapse;font-size:13px;min-width:100%}
.hilfe th,.hilfe td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.hilfe th{background:var(--pill)}.hilfe .hn{font-size:12px;color:var(--mute);margin:4px 0 0}
.art{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>
</head>

<script>
const D={"titel":"Prüfungstraining GAP 1","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · Teil 1 der Abschlussprüfung","stand":"11.10.2026","module":[{"nr":"1","titel":"Prozesse in der Versicherungswirtschaft einschätzen und berücksichtigen","lf":"LF 1","abschnitte":[{"nr":"1.1","titel":"Bedeutung der Versicherungswirtschaft","lf":"LF 1 / LF 2","buch":"S. 8–12","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welcher Gedanke steht hinter dem Versicherungsprinzip?","optionen":["Jeder Versicherte spart mit seinen Beiträgen für den eigenen Schaden an und erhält sie am Ende zurück.","Der Staat gleicht über Steuermittel die Schäden aus, die einzelne Bürger nicht selbst tragen können.","Das Versicherungsunternehmen bezahlt alle Schäden aus seinem Eigenkapital, die Beiträge decken nur die Verwaltung.","Viele Versicherte mit gleichartigem Risiko zahlen Beiträge, aus denen die Schäden Einzelner bezahlt werden."],"richtig":[3],"erkl":"Versicherung beruht auf dem Risikoausgleich im Kollektiv: Die Gefahrengemeinschaft verteilt den zufälligen Schaden des Einzelnen auf alle.","norm":"Grundlagen","id":"1.1-1-1"},{"typ":"mc","frage":"Warum braucht ein Versicherer einen möglichst großen Bestand gleichartiger Risiken?","optionen":["Damit er höhere Provisionen an seine Vermittler zahlen und mehr Werbung finanzieren kann.","Damit er die Beiträge jedes Jahr unabhängig vom tatsächlichen Schadenverlauf erhöhen darf.","Damit sich der tatsächliche Schadenverlauf dem erwarteten annähert (Gesetz der großen Zahl).","Weil die Versicherungsaufsicht für jede Sparte eine Mindestzahl von Verträgen vorschreibt."],"richtig":[2],"erkl":"Je größer das Kollektiv, desto genauer lässt sich der Schadenbedarf vorhersagen – die Grundlage jeder Prämienkalkulation.","norm":"Grundlagen","id":"1.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie die Rechtsform des Versicherers dem passenden Merkmal zu.","paare":[["Versicherungsverein auf Gegenseitigkeit (VVaG)","Die Versicherungsnehmer sind zugleich Mitglieder des Unternehmens."],["Aktiengesellschaft","Die Eigentümer sind Aktionäre, die eine Rendite erwarten."],["Öffentlich-rechtlicher Versicherer","Träger sind Länder, Kommunen oder Sparkassenverbände."]],"erkl":"Neben der AG und dem VVaG gibt es öffentlich-rechtliche Versicherer; die Rechtsformen für Versicherer regelt das VAG.","norm":"§ 8 Abs. 2 VAG","id":"1.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zur volkswirtschaftlichen Bedeutung der Versicherungswirtschaft treffen zu?","aussagen":[["Versicherer legen die Beiträge an und sind damit bedeutende Kapitalgeber der Wirtschaft.",true],["Versicherungsschutz ermöglicht es Unternehmen, Risiken einzugehen und zu investieren.",true],["Versicherer entlasten die sozialen Sicherungssysteme, etwa durch private Altersvorsorge.",true],["Versicherungsbeiträge sind für den Staat ohne Bedeutung, weil auf sie keine Steuer anfällt.",false]],"erkl":"Auf die meisten Versicherungsbeiträge fällt Versicherungsteuer an; Versicherer sind Kapitalsammelstellen, Risikoträger und Arbeitgeber.","norm":"VersStG","id":"1.1-1-4"},{"typ":"mc","frage":"Was ist die Aufgabe eines Rückversicherers?","optionen":["Er schließt als Direktversicherer Verträge mit Privatkunden ab.","Er übernimmt einen Teil der Risiken des Erstversicherers.","Er prüft als staatliche Behörde die Zahlungsfähigkeit der Versicherer.","Er vermittelt als Makler Verträge zwischen Kunden und Versicherern."],"richtig":[1],"erkl":"Der Erstversicherer gibt Spitzen- und Großrisiken an Rückversicherer ab und stabilisiert so sein Ergebnis.","norm":"Grundlagen","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Lindner (zwei Kinder) hat gerade ein Grundstück gekauft und möchte darauf ein Einfamilienhaus bauen. Herr Lindner fragt Sie: „Wozu brauchen wir eigentlich so viele Versicherungen? Das kostet doch nur Geld.“","items":[{"typ":"mc","frage":"Mit welchem Argument erklären Sie Herrn Lindner den Nutzen einer Versicherung für seine Familie am besten?","optionen":["Ein Großschaden wie ein Brand des Rohbaus kann die Familie ruinieren; der Beitrag macht dieses Risiko kalkulierbar.","Ohne Versicherungsschutz für das Grundstück darf das Grundbuchamt die Familie nicht als Eigentümer eintragen.","Versicherungen lohnen sich, weil man über die Laufzeit in der Regel mehr zurückerhält, als man an Beiträgen einzahlt.","Für Bauherren ist der Abschluss aller wichtigen Versicherungen gesetzlich vorgeschrieben; sonst droht ein Bußgeld."],"richtig":[0],"erkl":"Einzelwirtschaftlich schützt Versicherung vor existenzbedrohenden Vermögensschäden (Planungssicherheit).","norm":"Grundlagen","id":"1.1-2-1"},{"typ":"zuo","frage":"Welche Gefahr während der Bauphase wird durch welche Versicherung abgedeckt?","paare":[["Ein Passant verletzt sich auf der ungesicherten Baustelle.","Bauherren-Haftpflichtversicherung"],["Ein Sturm reißt die frisch errichteten Dachsparren herunter.","Bauleistungsversicherung"],["Der Rohbau brennt nach einem Blitzschlag ab.","Feuer-Rohbauversicherung (meist im Wohngebäudevertrag)"]],"erkl":"Bauherren haften für die Verkehrssicherung der Baustelle; Bauleistungs- und Rohbauversicherung schützen das entstehende Gebäude.","norm":"§ 823 BGB","id":"1.1-2-2"},{"typ":"mc","frage":"Die Bank verlangt für die Baufinanzierung einen Nachweis. Welche Versicherung lässt sie sich in der Regel vor Auszahlung bestätigen?","optionen":["Die Rechtsschutzversicherung, weil sie jeden Streit mit der Baufirma abdeckt.","Die Hausratversicherung, weil sie den Neubau gegen Feuer und Sturm absichert.","Die Privathaftpflichtversicherung, weil sie Schäden am eigenen Neubau ersetzt.","Die Gebäudeversicherung mit Feuerrohbauschutz, weil das Haus das Darlehen sichert."],"richtig":[3],"erkl":"Das Gebäude dient als Kreditsicherheit (Grundschuld); die Bank will es gegen Zerstörung abgesichert wissen.","norm":"Grundlagen","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Auswirkungen von Entwicklungstrends auf die Versicherungswirtschaft","lf":"LF 1 / LF 2","buch":"S. 13–18","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Trend eine typische Folge für Versicherer zu.","paare":[["Klimawandel","mehr und höhere Schäden durch Starkregen, Hochwasser und Sturm"],["Demografischer Wandel","wachsender Bedarf an privater Alters- und Pflegevorsorge"],["Digitalisierung","Onlineabschluss, digitale Schadenmeldung, neue Wettbewerber (Insurtechs)"],["Inflation","steigende Wiederherstellungskosten und Gefahr der Unterversicherung"]],"erkl":"Trends verändern Produkte, Prämien und Vertriebswege; Berater müssen Bestände daraufhin prüfen.","norm":"Grundlagen","id":"1.2-1-1"},{"typ":"mc","frage":"Ein Kunde möchte eine fondsgebundene Rentenversicherung abschließen. Was müssen Sie seit 2022 im Beratungsgespräch zusätzlich erfragen?","optionen":["Seine Zustimmung zur Datenweitergabe an Vergleichsportale.","Seine Schadenfreiheitsklasse in der Kfz-Versicherung.","Seine Nachhaltigkeitspräferenzen.","Seinen Verzicht auf das Widerrufsrecht."],"richtig":[2],"erkl":"Bei Versicherungsanlageprodukten gehören die Nachhaltigkeitspräferenzen zur Geeignetheitsprüfung.","norm":"Delegierte VO (EU) 2017/2359, geändert durch Delegierte VO (EU) 2021/1257; § 7c VVG","id":"1.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Digitalisierung in der Versicherungswirtschaft treffen zu?","aussagen":[["Telematiktarife in der Kfz-Versicherung belohnen ein vorsichtiges Fahrverhalten.",true],["Künstliche Intelligenz kann einfache Schadenfälle automatisch prüfen.",true],["Durch Vergleichsportale wird der Markt für Kunden transparenter.",true],["Bei einem Onlineabschluss gelten keine Informationspflichten.",false]],"erkl":"Auch im Fernabsatz gelten die Informationspflichten; sie müssen in Textform erfüllt werden.","norm":"§ 7 VVG","id":"1.2-1-3"},{"typ":"mc","frage":"Warum steigt durch Cyberkriminalität auch der Beratungsbedarf bei Privatkunden?","optionen":["Weil Privatkunden gesetzlich verpflichtet sind, eine eigene Cyberversicherung abzuschließen.","Weil Schäden durch Identitätsdiebstahl oder Onlinebetrug in klassischen Verträgen oft nicht gedeckt sind.","Weil Banken seit 2020 Schäden aus Onlinebetrug ihrer Kunden grundsätzlich nicht mehr ersetzen dürfen.","Weil Cyberschäden seit 2022 automatisch in jeder Privathaftpflichtversicherung enthalten sind."],"richtig":[1],"erkl":"Viele Versicherer bieten Cyber- oder Internetschutz als Baustein an; die Lücke muss im Gespräch erkannt werden.","norm":"Grundlagen","id":"1.2-1-4"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ihre Agentur möchte nachhaltiger werden. Die Agenturleiterin bittet Sie, Vorschläge zu sammeln und den Kunden zu erklären, was Nachhaltigkeit für einen Versicherer bedeutet.","items":[{"typ":"mc","frage":"Welche Maßnahme senkt den Ressourcenverbrauch der Agentur am deutlichsten?","optionen":["Policen, Rechnungen und Schadenmeldungen auf digitalen Versand umstellen.","Kundenakten zusätzlich auf Papier archivieren und per Post an die Direktion senden.","Sämtliche Policen und Rechnungen zur Sicherheit doppelt ausdrucken und abheften.","Alle Beratungsgespräche ausschließlich als Präsenztermine in der Agentur durchführen."],"richtig":[0],"erkl":"Papierlose Prozesse sparen Papier, Porto und Transportwege.","norm":"Grundlagen","id":"1.2-2-1"},{"typ":"wf","frage":"Welche Aussagen beschreiben Nachhaltigkeit bei einem Versicherer zutreffend?","aussagen":[["Der Versicherer legt Kapital nach ökologischen und sozialen Kriterien (ESG) an.",true],["Bei Schäden werden Reparatur und gebrauchte Ersatzteile gefördert, wo es sinnvoll ist.",true],["Nachhaltigkeit betrifft nur die Werbung des Versicherers.",false],["Der Versicherer berichtet über seine Nachhaltigkeit nach gesetzlichen Vorgaben.",true]],"erkl":"ESG umfasst Umwelt (Environment), Soziales (Social) und gute Unternehmensführung (Governance).","norm":"Offenlegungs-VO (EU) 2019/2088","id":"1.2-2-2"},{"typ":"mc","frage":"Ein Kunde meint, der Klimawandel betreffe ihn nicht, er wohne ja nicht an einem Fluss. Welche Antwort ist fachlich richtig?","optionen":["Gegen Folgen des Klimawandels kann man sich in Deutschland nicht versichern; hier hilft nur der Staat.","Ohne Fluss in der Nähe sind Überschwemmungsschäden durch Starkregen praktisch ausgeschlossen.","Überschwemmung durch Starkregen ist in jeder Wohngebäudeversicherung automatisch mitversichert.","Starkregen kann überall zu Überschwemmung führen; dagegen hilft der Einschluss weiterer Naturgefahren."],"richtig":[3],"erkl":"Überschwemmung durch Starkregen und Rückstau gehören zu den Elementargefahren und müssen gesondert vereinbart werden.","norm":"VGB/VHB, weitere Naturgefahren","id":"1.2-2-3"}]}]},{"nr":"1.3","titel":"Prüfungsfälle: Versicherungswirtschaft und Trends","lf":"LF 1","buch":"S. 8–18","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Bäckerei Okonkwo – wozu Versicherung?","situation":"Ada Okonkwo (41) führt in Halle (Saale) eine Bäckerei mit zwölf Beschäftigten. Für Betriebsgebäude, Inventar, Betriebshaftpflicht und Betriebsunterbrechung zahlt sie zusammen 6.400,00 € Beitrag im Jahr. Für einen neuen Backofen (85.000,00 €) verlangt ihre Bank vor der Auszahlung des Kredits den Nachweis einer Feuerversicherung. Im Jahresgespräch fragt sie: „Was habe ich – und was hat die Allgemeinheit – eigentlich von all diesen Versicherungen?“","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Funktion der Versicherung das passende Beispiel aus der Lage von Frau Okonkwo zu.","paare":[["Risikoübernahme (Schutzfunktion)","Ein Großbrand zerstört die Backstube; der Versicherer ersetzt den Schaden."],["Kreditsicherungsfunktion","Die Bank finanziert den Backofen nur bei nachgewiesenem Feuerschutz."],["Kapitalanlagefunktion","Der Versicherer legt die Beiträge vieler Kunden in Anleihen und Immobilien an."],["Schadenverhütung (Prävention)","Der Versicherer berät zu Rauchmeldern und Brandschutz in der Backstube."]],"erkl":"Versicherer übernehmen Risiken, sichern Kredite ab, sammeln Kapital und legen es an und helfen, Schäden zu vermeiden. Die Bank will ihre Sicherheit (Backofen, Gebäude) gegen Zerstörung geschützt wissen.","norm":"§ 1 VVG; § 124 VAG","id":"1.3-1-1"},{"typ":"wf","frage":"Welche Aussagen beschreiben die gesamtwirtschaftliche (volkswirtschaftliche) Bedeutung der Versicherung zutreffend?","aussagen":[["Weil Schäden ersetzt werden, können zerstörte Betriebe weiterarbeiten; Arbeitsplätze und Steuereinnahmen bleiben erhalten.",true],["Versicherer beschäftigen viele Menschen im Innen- und Außendienst und sind ein bedeutender Arbeitgeber.",true],["Die Versicherungsteuer auf die Beiträge ist eine Einnahme des Staates.",true],["Die gesamtwirtschaftliche Bedeutung liegt allein darin, dass einzelne Kunden ihre Schäden ersetzt bekommen.",false]],"erkl":"Gesamtwirtschaftlich sichern Versicherer Produktion, Arbeitsplätze und Investitionen und bringen Steuereinnahmen. Der Ersatz des einzelnen Schadens ist dagegen der einzelwirtschaftliche Nutzen.","norm":"VersStG; Grundlagen Versicherungswirtschaft","id":"1.3-1-2"},{"typ":"mc","frage":"Welches Argument beschreibt den einzelwirtschaftlichen Nutzen für Frau Okonkwo am treffendsten?","optionen":["Sie tauscht ein ungewisses, möglicherweise existenzbedrohendes Risiko gegen feste Beiträge.","Sie erhält ihre Beiträge nach einigen schadenfreien Jahren vollständig zurückerstattet.","Die Beiträge mindern ihre Steuerlast so stark, dass die Versicherung sie nichts kostet.","Mit Versicherung muss sie sich um den Brandschutz in der Backstube nicht mehr kümmern."],"richtig":[0],"erkl":"Einzelwirtschaftlich macht Versicherung das Risiko planbar: Statt eines ungewissen Großschadens trägt der Betrieb einen festen, kalkulierbaren Beitrag. Beiträge werden nicht angespart und zurückgezahlt; Sicherheitspflichten bleiben bestehen.","norm":"§ 1 VVG","id":"1.3-1-3"},{"typ":"zahl","frage":"Ohne Versicherung müsste Frau Okonkwo für einen möglichen Brandschaden von 640.000,00 € selbst vorsorgen. Wie vielen Jahresbeiträgen von 6.400,00 € entspricht dieser Betrag?","wert":100,"einheit":"Jahresbeiträge","tol":0,"erkl":"640.000,00 € : 6.400,00 € = 100. Sie müsste also 100 Jahre lang zurücklegen – ein Brand kann aber schon morgen eintreten. Die Versicherung übernimmt das Risiko sofort ab Vertragsbeginn.","norm":"§ 1 VVG","id":"1.3-1-4"}]},{"typ":"situation","titel":"Fall 2: Proximus Versicherung – Risikoausgleich bei Feuerschäden","situation":"Die Proximus Versicherung AG versichert in Sachsen-Anhalt 20.000 vergleichbare Einfamilienhäuser gegen Feuer. Aus der Statistik weiß sie: Im Durchschnitt brennt es jährlich in 0,15 % der Häuser, ein Brandschaden kostet im Durchschnitt 80.000,00 €. Im Jahr 2025 gab es 41 Brände, im Jahr 2024 nur 22. Die Auszubildende Marlene Fuchs soll Kunden erklären, wie der Versicherer trotz solcher Schwankungen zuverlässig zahlen kann.","items":[{"typ":"zahl","frage":"Wie viele Brandschäden erwartet der Versicherer bei 20.000 Häusern und einer Schadenwahrscheinlichkeit von 0,15 % statistisch im Jahr?","wert":30,"einheit":"Schäden","tol":0,"erkl":"20.000 × 0,15 % = 20.000 × 0,0015 = 30 erwartete Brandschäden im Jahr.","norm":"Grundlagen Prämienkalkulation","id":"1.3-2-1"},{"typ":"zahl","frage":"Bei 20.000 Häusern, einer Schadenwahrscheinlichkeit von 0,15 % und einem Durchschnittsschaden von 80.000,00 €: Wie hoch ist die reine Risikoprämie (ohne Kosten, Sicherheitszuschlag und Gewinn) je Haus und Jahr?","wert":120.0,"einheit":"€","tol":0.01,"erkl":"Erwarteter Gesamtschaden: 30 × 80.000,00 € = 2.400.000,00 €. Verteilt auf 20.000 Häuser: 2.400.000,00 € : 20.000 = 120,00 €. Kürzer: 0,0015 × 80.000,00 € = 120,00 €.","norm":"Grundlagen Prämienkalkulation","id":"1.3-2-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff des Risikoausgleichs die passende Beschreibung zu.","paare":[["Risikoausgleich im Kollektiv","Die Beiträge der vielen schadenfreien Kunden finanzieren die Schäden der wenigen Betroffenen."],["Risikoausgleich in der Zeit","Überschüsse aus schadenarmen Jahren werden zurückgestellt und in schadenreichen Jahren verbraucht."],["Gesetz der großen Zahl","Je mehr gleichartige Risiken versichert sind, desto näher liegt der tatsächliche am erwarteten Schadenverlauf."],["Rückversicherung","Der Erstversicherer gibt einen Teil seiner Großrisiken gegen Prämie an ein anderes Unternehmen ab."]],"erkl":"Schwankungen wie 22 oder 41 Brände gleicht der Versicherer über das Kollektiv, über mehrere Jahre (Schwankungsrückstellung) und über Rückversicherung aus.","norm":"§ 341h HGB","id":"1.3-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Schwankungsrückstellung eines Schadenversicherers treffen zu?","aussagen":[["Sie dient dazu, Schwankungen im Schadenverlauf künftiger Jahre auszugleichen.",true],["Eine Voraussetzung für ihre Bildung ist, dass im Versicherungszweig mit erheblichen Schwankungen der jährlichen Schadenaufwendungen zu rechnen ist.",true],["Aus ihr zahlt der Versicherer am Jahresende die Beiträge schadenfreier Kunden zurück.",false],["Sie macht eine Rückversicherung in jedem Fall überflüssig.",false]],"erkl":"Die Schwankungsrückstellung ist das Werkzeug des Risikoausgleichs in der Zeit. Sie wird u. a. nur gebildet, soweit Schwankungen nicht durch Rückversicherung gedeckt sind – beide Instrumente ergänzen sich.","norm":"§ 341h Abs. 1 HGB","id":"1.3-2-4"}]},{"typ":"situation","titel":"Fall 3: Nachhaltigkeitsbericht der Proximus Versicherung","situation":"Die Proximus Versicherung AG veröffentlicht ihren Nachhaltigkeitsbericht. Von 4,0 Mrd. € Kapitalanlagen sind 600 Mio. € in Wind- und Solarparks investiert; Unternehmen, die mehr als 25 % ihres Umsatzes mit Kohle erzielen, sind von der Anlage ausgeschlossen. In der Kfz-Kasko werden kleine Lackschäden bevorzugt repariert, statt Teile zu tauschen. Kunde Tobias Brandt (38) fragt in der Agentur, ob das „nur Werbung“ sei, und interessiert sich für eine fondsgebundene Rentenversicherung mit nachhaltigen Fonds.","items":[{"typ":"zuo","frage":"Ordnen Sie jede Maßnahme dem passenden ESG-Bereich zu.","paare":[["Ausschluss von Kohleunternehmen aus der Kapitalanlage","Environment (Umwelt)"],["faire Bezahlung, Weiterbildung und Gesundheitsschutz für alle Beschäftigten","Social (Soziales)"],["unabhängige Kontrolle der Geschäftsleitung und ein Hinweisgebersystem gegen Korruption","Governance (Unternehmensführung)"]],"erkl":"ESG steht für Environment, Social, Governance. Nachhaltigkeit betrifft damit Kapitalanlage, Personal und die Art, wie ein Unternehmen geführt und kontrolliert wird.","norm":"Grundlagen ESG; Offenlegungs-VO (EU) 2019/2088, Art. 2 Nr. 17 und 24","id":"1.3-3-1"},{"typ":"zahl","frage":"Wie viel Prozent der Kapitalanlagen der Proximus Versicherung AG sind in Wind- und Solarparks investiert?","wert":15,"einheit":"%","tol":0,"erkl":"600 Mio. € : 4.000 Mio. € × 100 = 15 %.","norm":"Rechenweg Prozentanteil","id":"1.3-3-2"},{"typ":"mc","frage":"Herr Brandt liest im Fondsprospekt: „Produkt nach Artikel 9 der Offenlegungsverordnung“. Was bedeutet das?","optionen":["Der Fonds strebt nachhaltige Investitionen ausdrücklich als Anlageziel an.","Der Fonds bewirbt ökologische Merkmale, hat aber kein nachhaltiges Anlageziel.","Der Fonds garantiert eine höhere Rendite als vergleichbare herkömmliche Fonds.","Der Fonds wurde von der BaFin geprüft und als risikofreie Anlage eingestuft."],"richtig":[0],"erkl":"Art.-9-Produkte haben nachhaltige Investitionen zum Ziel („dunkelgrün“); Art.-8-Produkte bewerben nur ökologische oder soziale Merkmale („hellgrün“). Eine Rendite- oder Sicherheitsgarantie ist damit nicht verbunden.","norm":"Art. 8, Art. 9 Offenlegungs-VO (EU) 2019/2088","id":"1.3-3-3"},{"typ":"wf","frage":"Welche Aussagen zur Nachhaltigkeit bei der Proximus Versicherung AG treffen zu?","aussagen":[["Reparatur statt Austausch in der Schadenregulierung spart Ressourcen und kann Kosten senken.",true],["Wirbt der Versicherer mit unwahren Umweltaussagen, kann das eine unlautere irreführende geschäftliche Handlung sein.",true],["Auch bei Nachhaltigkeitszielen muss die Kapitalanlage Sicherheit, Qualität, Liquidität und Rentabilität des Portfolios sichern.",true],["Nachhaltigkeit betrifft nur die Kapitalanlage, nicht die Unternehmensführung oder die Schadenregulierung.",false]],"erkl":"Nachhaltigkeit wirkt in alle Bereiche. Die Anlagegrundsätze des VAG gelten weiter; „Greenwashing“ mit falschen Angaben ist irreführende Werbung.","norm":"§ 124 Abs. 1 Nr. 2 VAG; § 5 UWG","id":"1.3-3-4"}]},{"typ":"situation","titel":"Fall 4: Jannik Schreiber – Abschluss im Netz","situation":"Jannik Schreiber (24) aus Halle (Saale) sucht eine Hausratversicherung. Er vergleicht Tarife auf einem Vergleichsportal, über das er direkt abschließen kann. Die Proximus Versicherung AG bietet auf ihrer Website zusätzlich einen digitalen Berater (Robo-Advice) an, der Fragen stellt und einen Tarif empfiehlt. Kleine Schäden bis 1.500,00 € reguliert sie per App vollautomatisch (Dunkelverarbeitung). Jannik möchte direkt beim Versicherer online abschließen, ohne beraten zu werden.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem digitalen Angebot die passende Beschreibung zu.","paare":[["Robo-Advice","Ein Programm fragt Bedarf und Wünsche ab und empfiehlt automatisiert ein Produkt."],["Vergleichsportal","Eine Website stellt Tarife mehrerer Anbieter nach gewählten Kriterien in einer Rangliste dar."],["Dunkelverarbeitung","Ein Vorgang wird ohne menschliches Eingreifen vollständig automatisch bearbeitet."],["Chatbot","Ein textbasiertes Dialogsystem beantwortet rund um die Uhr Fragen von Kunden."]],"erkl":"Digitale Werkzeuge verändern Vertrieb (Portale, Robo-Advice), Service (Chatbot) und Schadenbearbeitung (Dunkelverarbeitung).","norm":"§ 34d Abs. 1 GewO; Art. 22 DSGVO","id":"1.3-4-1"},{"typ":"mc","frage":"Wie ist das Vergleichsportal, über das Jannik direkt abschließen kann, rechtlich einzuordnen?","optionen":["Es vermittelt Versicherungen und braucht eine Erlaubnis als Versicherungsvermittler.","Es ist ein reines Werbemedium und unterliegt keinerlei Pflichten für Vermittler.","Es ist eine Behörde, die Tarife im Auftrag der BaFin neutral miteinander vergleicht.","Es ist selbst Versicherer und trägt die Risiken aller verglichenen Tarife selbst."],"richtig":[0],"erkl":"Erstellt eine Website Ranglisten oder Preisvergleiche und kann der Kunde darüber abschließen, ist das Vermittlung. Das Portal braucht die Erlaubnis der IHK und unterliegt den Vermittlerpflichten.","norm":"§ 34d Abs. 1 Satz 4 Nr. 2 GewO","id":"1.3-4-2"},{"typ":"mc","frage":"Jannik möchte beim Onlineabschluss direkt beim Versicherer auf die Beratung verzichten. Welche Form genügt?","optionen":["Textform, weil es ein Fernabsatzvertrag ist; der Warnhinweis bleibt nötig.","Nur eine notariell beglaubigte Erklärung mit eigenhändiger Unterschrift.","Keine; das Absenden des Onlineantrags gilt automatisch als Verzicht.","Ein Verzicht ist online nicht möglich; der Versicherer muss anrufen."],"richtig":[0],"erkl":"Grundsätzlich ist eine gesonderte schriftliche Verzichtserklärung mit Warnhinweis nötig. Bei Verträgen im Fernabsatz genügt der Verzicht in Textform; der Hinweis auf mögliche Nachteile bleibt Pflicht.","norm":"§ 6 Abs. 3 VVG","id":"1.3-4-3"},{"typ":"wf","frage":"Welche Aussagen zur Dunkelverarbeitung der Schadenmeldungen treffen zu?","aussagen":[["Zahlt das System den gemeldeten Schaden vollständig aus, ist die vollautomatische Entscheidung im Versicherungsvertrag zulässig.",true],["Lehnt das System einen Schaden vollautomatisch ab, muss Jannik zumindest eine Überprüfung durch einen Menschen verlangen können.",true],["Dunkelverarbeitung beschleunigt einfache Schadenfälle und senkt die Verwaltungskosten.",true],["Für vollautomatische Entscheidungen gilt die DSGVO nicht, weil kein Mensch beteiligt ist.",false]],"erkl":"Die DSGVO schützt vor rein automatisierten Entscheidungen. Im Versicherungsvertrag sind sie erlaubt, wenn dem Begehren voll entsprochen wird; sonst braucht es Schutzmaßnahmen wie das Recht auf Eingreifen einer Person.","norm":"Art. 22 DSGVO; § 37 Abs. 1 BDSG","id":"1.3-4-4"}]},{"typ":"situation","titel":"Fall 5: Agentur Wolff – Demografie und Klimawandel","situation":"Die Agentur von Irina Wolff in Halle (Saale) plant ihre Schwerpunkte für 2027. Ihr Bestand altert: Ein Drittel der Kunden ist älter als 60 Jahre. Gleichzeitig häufen sich Starkregenschäden in der Region. Familie Hamdan hat für ihr Einfamilienhaus eine Wohngebäudeversicherung ohne Elementarschutz; laut Abfrage liegt das Haus in ZÜRS-Gefährdungsklasse 1. Beim Einschluss weiterer Naturgefahren gilt bei der Proximus Versicherung AG eine Selbstbeteiligung von 10 % des Schadens, mindestens 500,00 €, höchstens 5.000,00 €.","items":[{"typ":"mc","frage":"Was bedeutet die ZÜRS-Gefährdungsklasse 1 für das Haus der Familie Hamdan?","optionen":["Ein Flusshochwasser ist dort statistisch seltener als einmal in 200 Jahren zu erwarten.","Das Haus ist gegen Starkregen und Rückstau vollständig ungefährdet und braucht keinen Schutz.","Das Haus liegt in der höchsten Hochwasserklasse und kann nicht versichert werden.","Ein Hochwasser ist dort statistisch mindestens einmal in zehn Jahren zu erwarten."],"richtig":[0],"erkl":"ZÜRS Geo teilt Standorte nach Hochwassergefahr in vier Klassen ein; Klasse 1 ist die geringste (seltener als einmal in 200 Jahren), Klasse 4 die höchste. Starkregen kann aber überall auftreten – der Elementarschutz bleibt sinnvoll.","norm":"ZÜRS Geo (GDV), Gefährdungsklassen","id":"1.3-5-1"},{"typ":"zahl","frage":"Familie Hamdan schließt die weiteren Naturgefahren ein. Ein Starkregen verursacht einen versicherten Schaden von 32.000,00 €. Wie viel Euro zahlt der Versicherer nach Abzug der Selbstbeteiligung?","wert":28800.0,"einheit":"€","tol":0.01,"erkl":"Selbstbeteiligung: 10 % von 32.000,00 € = 3.200,00 € (liegt zwischen 500,00 € und 5.000,00 €). Leistung: 32.000,00 € − 3.200,00 € = 28.800,00 €.","norm":"VGB, weitere Naturgefahren; Selbstbeteiligung laut Situation","id":"1.3-5-2"},{"typ":"wf","frage":"Welche Aussagen zum demografischen Wandel treffen zu?","aussagen":[["Weil immer weniger Beitragszahler immer mehr Rentner finanzieren, gerät das Umlageverfahren der gesetzlichen Rentenversicherung unter Druck.",true],["Mit der wachsenden Zahl Pflegebedürftiger steigt der Bedarf an privater Pflegezusatzversicherung.",true],["Für ältere Kunden gewinnen Hilfeleistungen wie Haushaltshilfe nach einem Unfall an Bedeutung.",true],["Der demografische Wandel betrifft nur Lebensversicherer, nicht die Arbeit einer Agentur.",false]],"erkl":"Eine alternde Gesellschaft verändert Bedarf (Alters- und Pflegevorsorge, Assistance), Kundenansprache und Personalgewinnung in allen Sparten.","norm":"§ 153 SGB VI (Umlageverfahren); Grundlagen Entwicklungstrends","id":"1.3-5-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Trend eine passende Antwort der Agentur zu.","paare":[["häufigere Starkregen und Hitzeperioden (Klimawandel)","Einschluss weiterer Naturgefahren und Beratung zur Rückstausicherung"],["alternde Kundschaft (demografischer Wandel)","Senioren-Unfallversicherung mit Hilfeleistungen im Alltag"],["weniger junge Bewerber für den Außendienst (Fachkräftemangel)","eigene Ausbildung und digitale Beratungswege"]],"erkl":"Trends werden zu Beratungsanlässen: Die Agentur passt Produkte, Prävention und Personalplanung an.","norm":"Grundlagen Entwicklungstrends","id":"1.3-5-4"}]}]}]},{"nr":"2","titel":"Kundinnen und Kunden ganzheitlich beraten und betreuen","lf":"LF 3 / LF 2","abschnitte":[{"nr":"2.1","titel":"Kundendaten erheben und pflegen, Anlässe zur Bedarfsanalyse nutzen","lf":"LF 3","buch":"S. 19–31","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Lebensereignissen einen typischen Versicherungsbedarf zu.","paare":[["Auszug aus dem Elternhaus","eigene Privathaftpflicht- und Hausratversicherung"],["Geburt eines Kindes","Risikolebensversicherung und Prüfung der Familienabsicherung"],["Kauf eines Hauses","Wohngebäudeversicherung und Absicherung des Darlehens"],["Erster Arbeitsvertrag","Absicherung der Arbeitskraft (Berufsunfähigkeit)"]],"erkl":"Lebensereignisse sind die wichtigsten Beratungsanlässe; sie verändern Risiken und Bedarf.","norm":"Bedarfsanalyse","id":"2.1-1-1"},{"typ":"mc","frage":"Auf welcher Rechtsgrundlage darf die Agentur Kundendaten verarbeiten, die für den Abschluss eines Versicherungsvertrags nötig sind?","optionen":["Gar nicht, denn Kundendaten dürfen ausschließlich beim Versicherer liegen.","Nur auf der Grundlage einer notariell beglaubigten Einwilligung des Kunden.","Auf der Grundlage der Vertragserfüllung bzw. vorvertraglicher Maßnahmen.","Nur auf der Grundlage einer Genehmigung der Datenschutzaufsichtsbehörde."],"richtig":[2],"erkl":"Die DSGVO erlaubt die Verarbeitung, wenn sie für einen Vertrag oder vorvertragliche Maßnahmen erforderlich ist.","norm":"Art. 6 Abs. 1 lit. b DSGVO","id":"2.1-1-2"},{"typ":"mc","frage":"Für die Verarbeitung von Gesundheitsdaten (z. B. Vorerkrankungen im Antrag) gilt …","optionen":["… nur die Pflicht, sie spätestens ein Jahr nach Vertragsschluss wieder zu löschen.","… ein besonderer Schutz; sie ist in der Regel nur mit ausdrücklicher Einwilligung zulässig.","… nichts Besonderes; sie werden genauso wie Name und Anschrift behandelt.","… ein generelles Verbot, selbst wenn der Kunde ausdrücklich und schriftlich einwilligt."],"richtig":[1],"erkl":"Gesundheitsdaten gehören zu den besonderen Kategorien personenbezogener Daten.","norm":"Art. 9 DSGVO","id":"2.1-1-3"},{"typ":"wf","frage":"Welche Rechte hat ein Kunde nach der DSGVO?","aussagen":[["Er kann Auskunft über die gespeicherten Daten verlangen.",true],["Er kann die Berichtigung falscher Daten verlangen.",true],["Er kann die Löschung verlangen, wenn die Daten nicht mehr benötigt werden und keine Aufbewahrungspflicht besteht.",true],["Er kann verlangen, dass der Versicherer seine Schadenakte sofort vernichtet, auch wenn der Schaden noch läuft.",false]],"erkl":"Auskunft, Berichtigung und Löschung sind Betroffenenrechte; gesetzliche Aufbewahrungspflichten gehen der Löschung vor.","norm":"Art. 15–17 DSGVO","id":"2.1-1-4"},{"typ":"mc","frage":"Was ist der Zweck eines Kundenbetreuungssystems (CRM) in der Agentur?","optionen":["Kundendaten, Verträge und Kontakte zentral zu pflegen und Beratungsanlässe zu erkennen.","Kundendaten ohne deren Wissen an Adresshändler und andere Unternehmen weiterzugeben.","Die gesamte Finanzbuchhaltung der Agentur einschließlich der Steuererklärung zu ersetzen.","Werbeanrufe automatisch an alle gespeicherten Telefonnummern zu richten."],"richtig":[0],"erkl":"Ein gepflegter Bestand zeigt Lücken und Anlässe (z. B. Geburtstag, Vertragsablauf) und ermöglicht gezielte Ansprache.","norm":"Grundlagen","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Kessler (28) meldet in der Agentur ihren Umzug in eine größere Wohnung. Sie zieht mit ihrem Partner zusammen und erwähnt beiläufig, dass sie bald heiraten wollen. Bisher hat sie bei Ihnen nur eine Hausratversicherung.","items":[{"typ":"mc","frage":"Was ist Ihr wichtigster nächster Schritt?","optionen":["Nur die neue Adresse ändern, da sich am Versicherungsbedarf dadurch nichts ändert.","Die Hausratversicherung kündigen, weil sie in der neuen Wohnung nicht mehr gilt.","Sofort und ohne Rückfrage ein Angebot für eine Lebensversicherung zusenden.","Den Anlass für eine umfassende Bedarfsanalyse nutzen und einen Termin vorschlagen."],"richtig":[3],"erkl":"Umzug, Zusammenziehen und Heirat verändern den Bedarf; der Kontakt ist ein Beratungsanlass.","norm":"§ 61 VVG","id":"2.1-2-1"},{"typ":"wf","frage":"Welche Punkte sollten Sie im Termin prüfen?","aussagen":[["Versicherungssumme der Hausratversicherung für die größere Wohnung und den gemeinsamen Hausrat",true],["ob beide Partner in einer gemeinsamen Privathaftpflicht abgesichert werden können",true],["eine Kündigung ihrer Hausratversicherung, weil der Partner schon eine hat, ohne dessen Versicherungssumme zu prüfen",false],["bestehende Verträge des Partners, um Doppelversicherungen zu vermeiden",true]],"erkl":"Bei Zusammenzug drohen Unterversicherung im Hausrat und doppelte Verträge.","norm":"Bedarfsanalyse","id":"2.1-2-2"},{"typ":"mc","frage":"Frau Kessler möchte, dass Sie ihre neue Telefonnummer speichern und sie künftig auch telefonisch zu neuen Angeboten anrufen. Was müssen Sie beachten?","optionen":["Eine Einwilligung in Werbeanrufe ist nur wirksam, wenn sie notariell beurkundet wird.","Als Bestandskundin dürfen Sie sie ohne Einwilligung jederzeit zu Werbezwecken anrufen.","Für Werbeanrufe brauchen Sie ihre vorherige ausdrückliche Einwilligung, die Sie dokumentieren.","Eine mutmaßliche Einwilligung genügt, weil sie Ihnen die Nummer selbst gegeben hat."],"richtig":[2],"erkl":"Werbeanrufe bei Verbrauchern ohne vorherige ausdrückliche Einwilligung sind eine unzumutbare Belästigung; die Einwilligung ist zu dokumentieren.","norm":"§ 7 Abs. 2 UWG, § 7a UWG","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Kommunikationsformen und -wege kunden- und serviceorientiert wählen","lf":"LF 3","buch":"S. 32–41","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Fragetyp dem Beispiel zu.","paare":[["Offene Frage","Wie wohnen Sie zurzeit?"],["Geschlossene Frage","Haben Sie einen Hund?"],["Alternativfrage","Passt Ihnen Dienstag oder Donnerstag besser?"],["Suggestivfrage","Sie wollen doch sicher nicht ohne Schutz dastehen, oder?"]],"erkl":"Offene Fragen erschließen den Bedarf; Suggestivfragen manipulieren und sind in der Beratung zu vermeiden.","norm":"Gesprächsführung","id":"2.2-1-1"},{"typ":"mc","frage":"Ein Kunde sagt: „Das ist mir zu teuer.“ Welche Reaktion entspricht einer guten Einwandbehandlung?","optionen":["Das Thema sofort wechseln und später erneut auf einen Abschluss drängen.","Den Einwand ernst nehmen, nach dem Vergleichsmaßstab fragen und den Nutzen darstellen.","Ohne Rücksprache einen Rabatt aus der eigenen Provision anbieten.","Dem Kunden widersprechen und den Preis mit dem Hinweis auf die Qualität verteidigen."],"richtig":[1],"erkl":"Einwände sind Signale für Informationsbedarf. Provisionsabgaben sind zudem grundsätzlich verboten.","norm":"§ 48b VAG","id":"2.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Kommunikationswegen treffen zu?","aussagen":[["Ein Videogespräch eignet sich für Beratungen, wenn der Kunde nicht in die Agentur kommen kann.",true],["Werbe-E-Mails an Verbraucher sind ohne vorherige Einwilligung grundsätzlich unzulässig.",true],["Über einen Messengerdienst dürfen Gesundheitsdaten ohne Weiteres ausgetauscht werden.",false],["Ein Brief eignet sich für förmliche Mitteilungen, die nachweisbar sein sollen.",true]],"erkl":"Bei jedem Kanal sind Datenschutz und Wettbewerbsrecht zu beachten; sensible Daten nur über sichere Wege.","norm":"§ 7 UWG, Art. 32 DSGVO","id":"2.2-1-3"},{"typ":"mc","frage":"Nach dem Vier-Ohren-Modell kann eine Nachricht auf vier Ebenen gehört werden. Welche gehört NICHT dazu?","optionen":["Preisebene","Appellebene","Beziehungsebene","Sachebene"],"richtig":[0],"erkl":"Die vier Seiten sind Sachinhalt, Selbstkundgabe, Beziehung und Appell (Schulz von Thun).","norm":"Kommunikationsmodell","id":"2.2-1-4"},{"typ":"mc","frage":"Was gehört zum aktiven Zuhören?","optionen":["Den Kunden unterbrechen, sobald er vom Thema abweicht.","Nebenbei Notizen und E-Mails bearbeiten, um Zeit zu sparen.","Möglichst früh die passenden Produkte ausführlich erklären.","Das Gesagte mit eigenen Worten zusammenfassen und nachfragen."],"richtig":[3],"erkl":"Paraphrasieren und Nachfragen zeigen Interesse und verhindern Missverständnisse.","norm":"Gesprächsführung","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ihre Agentur plant eine Aktion zum Thema Elementarschutz für alle Hausratkunden. Ihr Kollege schlägt vor, alle Kunden aus dem Bestand unangekündigt anzurufen und zusätzlich einen Newsletter an alle E-Mail-Adressen zu senden.","items":[{"typ":"mc","frage":"Wie beurteilen Sie den Vorschlag der unangekündigten Werbeanrufe?","optionen":["Zulässig, weil bei Bestandskunden eine mutmaßliche Einwilligung ausreicht.","Zulässig, wenn der Anruf nicht mit unterdrückter Rufnummer erfolgt.","Unzulässig bei Kunden ohne vorherige ausdrückliche Einwilligung in Telefonwerbung.","Zulässig, wenn die Kunden in den letzten zwei Jahren einen Vertrag abgeschlossen haben."],"richtig":[2],"erkl":"Auch Bestandskunden dürfen ohne vorherige ausdrückliche Einwilligung nicht zu Werbezwecken angerufen werden.","norm":"§ 7 Abs. 2 UWG","id":"2.2-2-1"},{"typ":"mc","frage":"Unter welcher Voraussetzung darf die Agentur Bestandskunden ohne gesonderte Einwilligung per E-Mail auf ähnliche eigene Produkte hinweisen?","optionen":["Die Adresse stammt aus einem Vertrag, es geht um beliebige Versicherungsprodukte und der Kunde wird einmal im Jahr auf sein Widerspruchsrecht hingewiesen.","Die Adresse stammt aus einem Vertrag, es geht um ähnliche Produkte, der Kunde hat nicht widersprochen und wird stets auf sein Widerspruchsrecht hingewiesen.","Die Adresse ist öffentlich bekannt, es geht um ähnliche Produkte und der Kunde kann sich jederzeit über einen Link in der Mail vom Newsletter abmelden.","Die Adresse stammt aus einem Vertrag, der Kunde ist seit mindestens zwei Jahren Kunde und die Mail wird von der Agentur selbst und nicht vom Versicherer versandt."],"richtig":[1],"erkl":"Das UWG kennt für Bestandskunden eine eng begrenzte Ausnahme mit allen vier Voraussetzungen.","norm":"§ 7 Abs. 3 UWG","id":"2.2-2-2"},{"typ":"zuo","frage":"Welcher Kommunikationsweg passt zu welchem Ziel der Aktion?","paare":[["Kunden ohne jede Werbeeinwilligung informieren","Hinweis bei der nächsten Vertragskorrespondenz oder im persönlichen Gespräch"],["Kunden mit Einwilligung kurzfristig erreichen","E-Mail-Newsletter mit Abmeldelink"],["Kunden mit Beratungsbedarf individuell beraten","persönlicher Termin oder Videogespräch"]],"erkl":"Der Kanal muss zum Ziel und zur rechtlichen Lage passen.","norm":"§ 7 UWG","id":"2.2-2-3"}]}]},{"nr":"2.3","titel":"Informations-, Beratungs- und Dokumentationspflichten einhalten","lf":"LF 2 / LF 3","buch":"S. 42–58","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann muss der Versicherungsvertreter dem Kunden seine Statusinformation (u. a. Name, Anschrift, Status, Registernummer) geben?","optionen":["Beim ersten Geschäftskontakt, klar und verständlich in Textform.","Einmal jährlich, zusammen mit der Beitragsrechnung in Textform.","Nur auf ausdrücklichen Wunsch des Kunden, dann in Textform.","Erst bei Vertragsschluss, gemeinsam mit dem Versicherungsschein."],"richtig":[0],"erkl":"Die Erstinformation gehört an den Anfang der Geschäftsbeziehung.","norm":"§ 15 VersVermV","id":"2.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie den Pflichten des Vermittlers den passenden Inhalt zu.","paare":[["Befragungspflicht","nach Wünschen und Bedürfnissen des Kunden fragen"],["Beratungspflicht","auf Grundlage der Angaben einen geeigneten Rat geben"],["Begründungspflicht","die Gründe für den Rat angeben"],["Dokumentationspflicht","Wünsche, Rat und Gründe vor Vertragsschluss in Textform festhalten"]],"erkl":"Die Pflichten richten sich nach der Schwierigkeit des Produkts, der Person und der Situation des Kunden.","norm":"§§ 61, 62 VVG","id":"2.3-1-2"},{"typ":"mc","frage":"Ein Kunde möchte auf die Beratung verzichten. Was ist dafür nötig?","optionen":["Ein angekreuztes Feld im Antrag mit kurzem Hinweis auf mögliche Nachteile.","Eine gesonderte Erklärung in Textform ohne weiteren Hinweis auf Nachteile.","Eine mündliche Erklärung, die der Vermittler im Gesprächsprotokoll vermerkt.","Eine gesonderte schriftliche Erklärung mit Hinweis auf mögliche Nachteile."],"richtig":[3],"erkl":"Der Verzicht muss gesondert, schriftlich und mit Warnhinweis erklärt werden; im Fernabsatz genügt die Textform (§ 61 Abs. 2 Satz 2 VVG).","norm":"§ 61 Abs. 2 VVG, § 6 Abs. 3 VVG","id":"2.3-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Informationspflichten des Versicherers treffen zu?","aussagen":[["Die Informationen müssen rechtzeitig vor Abgabe der Vertragserklärung in Textform übermittelt werden.",true],["Zu den Informationen gehören die Versicherungsbedingungen.",true],["Verbraucher erhalten zusätzlich ein Produktinformationsblatt.",true],["Die Informationen dürfen immer erst mit der Police verschickt werden.",false]],"erkl":"Wird der Vertrag auf Verlangen des Kunden telefonisch oder über ein anderes Kommunikationsmittel geschlossen, das die vorherige Information nicht erlaubt, oder verzichtet der Kunde durch gesonderte schriftliche Erklärung, ist die Information unverzüglich nachzuholen.","norm":"§ 7 VVG, VVG-InfoV","id":"2.3-1-4"},{"typ":"mc","frage":"Ein Vermittler berät falsch und dokumentiert die Beratung nicht. Der Kunde erleidet dadurch einen Schaden. Welche Folge ist möglich?","optionen":["Der Vertrag gilt automatisch als von Anfang an nicht geschlossen.","Der Vermittler kann lediglich vom Versicherer abgemahnt werden.","Der Vermittler ist dem Kunden zum Schadenersatz verpflichtet.","Der Kunde hat keine Ansprüche, weil er den Antrag unterschrieben hat."],"richtig":[2],"erkl":"Bei schuldhafter Verletzung der Beratungs- oder Dokumentationspflicht haftet der Vermittler; fehlende Dokumentation erschwert ihm den Beweis.","norm":"§ 63 VVG","id":"2.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Okafor (45) ruft in der Agentur an und möchte „ganz schnell“ eine Unfallversicherung abschließen, weil er nächste Woche mit dem Mountainbike in die Alpen fährt. Für ein Beratungsgespräch habe er keine Zeit.","items":[{"typ":"mc","frage":"Darf der Vertreter auf die Beratung verzichten, weil der Kunde keine Zeit hat?","optionen":["Ja, weil bei der Unfallversicherung grundsätzlich keine Beratungspflicht besteht.","Nur bei gesondertem Verzicht mit Hinweis auf Nachteile; am Telefon genügt die Textform.","Ja, weil Zeitmangel des Kunden den Vertreter von der Beratungspflicht befreit.","Nein, ein Verzicht auf die Beratung ist gesetzlich in keinem Fall möglich."],"richtig":[1],"erkl":"Zeitdruck ersetzt nicht den förmlichen Verzicht; im Fernabsatz genügt dafür die Textform.","norm":"§ 61 Abs. 2 VVG","id":"2.3-2-1"},{"typ":"mc","frage":"Herr Okafor möchte den Vertrag am Telefon abschließen und die Unterlagen später lesen. Wann müssen die Vertragsinformationen dann übermittelt werden?","optionen":["Unverzüglich nach Vertragsschluss, wenn der telefonische Abschluss auf seinen Wunsch erfolgt.","Erst nach Ablauf der Widerrufsfrist, damit der Vertrag bereits sicher besteht.","Innerhalb von 14 Tagen nach Vertragsschluss, sobald er die erste Prämie gezahlt hat.","Gar nicht mehr, weil er mit dem telefonischen Abschluss auf die Unterlagen verzichtet hat."],"richtig":[0],"erkl":"Bei telefonischem Abschluss auf Verlangen des Kunden darf die Information unverzüglich nachgeholt werden.","norm":"§ 7 Abs. 1 Satz 3 VVG","id":"2.3-2-2"},{"typ":"wf","frage":"Was gehört in die Beratungsdokumentation des Vertreters?","aussagen":[["die geäußerten Wünsche und Bedürfnisse des Kunden",true],["der erteilte Rat und seine Gründe",true],["ein Verzicht des Kunden auf die Beratung mit dem Warnhinweis, falls er verzichtet hat",true],["die private Meinung des Vertreters über den Kunden",false]],"erkl":"Die Dokumentation ist dem Kunden vor Vertragsschluss in Textform zu übermitteln.","norm":"§ 62 VVG","id":"2.3-2-3"}]}]},{"nr":"2.4","titel":"Prüfungsfälle: Vermittler, Vertriebswege und Kundendaten","lf":"LF 3","buch":"S. 19–31","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Yıldız – wer braucht welche Erlaubnis?","situation":"Selin Yıldız (34) führt in Halle (Saale) eine Agentur. Sie vermittelt ausschließlich Verträge der Proximus Versicherung AG und ihrer Konzernschwestern für Leben und Kranken; die Proximus hat die uneingeschränkte Haftung für ihre Vermittlertätigkeit übernommen. Ihr Bekannter Jonas Brandt ist Mehrfachagent und vermittelt Hausratversicherungen von drei miteinander konkurrierenden Versicherern. Mara Lindqvist arbeitet als Versicherungsmaklerin, Dr. Henrik Vogt als Versicherungsberater gegen Honorar.","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Person die Rechtsgrundlage ihrer Tätigkeit zu.","paare":[["Selin Yıldız (nur Proximus-Konzern, Haftungsübernahme)","erlaubnisfrei als gebundene Vertreterin; Registrierung über den Versicherer"],["Jonas Brandt (drei konkurrierende Versicherer)","Erlaubnis der IHK als Versicherungsvertreter nach § 34d Abs. 1 GewO"],["Mara Lindqvist (Maklerin)","Erlaubnis der IHK als Versicherungsmaklerin nach § 34d Abs. 1 GewO"],["Dr. Henrik Vogt (Honorarberater)","Erlaubnis der IHK als Versicherungsberater nach § 34d Abs. 2 GewO"]],"erkl":"Als Vertreter erlaubnisfrei ist, wer ausschließlich für einen Versicherer (oder mehrere mit nicht konkurrierenden Produkten) tätig ist und für den der Versicherer die uneingeschränkte Haftung übernimmt. Mehrfachagent, Makler und Berater brauchen eine IHK-Erlaubnis.","norm":"§ 34d Abs. 1, 2 und 7 Satz 1 Nr. 1 GewO","id":"2.4-1-1"},{"typ":"mc","frage":"Ein Kunde von Frau Yıldız erleidet durch einen Beratungsfehler einen Vermögensschaden. An wen kann er sich wegen Schadenersatz wenden?","optionen":["Nur an Frau Yıldız, weil ein Versicherer niemals für Fehler selbständiger Vertreter haftet.","An die IHK, weil sie Frau Yıldız nach ihrer Prüfung in das Vermittlerregister eingetragen hat.","Auch an die Proximus, weil sie die uneingeschränkte Haftung für Frau Yıldız übernommen hat.","An niemanden, weil gebundene Vertreter für Fehler in ihrer Beratung grundsätzlich nicht haften."],"richtig":[2],"erkl":"Für den gebundenen Vertreter übernimmt der Versicherer die uneingeschränkte Haftung aus der Vermittlertätigkeit. Deshalb braucht Frau Yıldız keine eigene Berufshaftpflichtversicherung; der Kunde kann sich an die Proximus halten.","norm":"§ 34d Abs. 7 Satz 1 Nr. 1 GewO, § 63 VVG","id":"2.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Vermittlerregister und zu den Pflichten der vier Personen treffen zu?","aussagen":[["Jeder kann im Internet prüfen, ob und mit welchem Status ein Vermittler eingetragen ist.",true],["Für Frau Yıldız teilt die Proximus der Registerbehörde die einzutragenden Angaben mit.",true],["Frau Lindqvist muss sich unverzüglich nach Aufnahme ihrer Tätigkeit eintragen lassen.",true],["Herr Brandt braucht keine Berufshaftpflichtversicherung, weil die Versicherer für ihn haften.",false],["Dr. Vogt darf sich zusätzlich zum Honorar Provisionen der Versicherer zahlen lassen.",false]],"erkl":"Das Register dient der Überprüfung von Zulassung und Status. Der Mehrfachagent braucht für die Erlaubnis eine Berufshaftpflichtversicherung; der Versicherungsberater darf sich nur vom Auftraggeber vergüten lassen.","norm":"§ 11a Abs. 1 und 2 GewO, § 34d Abs. 2, 5 und 10 GewO, § 48 Abs. 4 VAG","id":"2.4-1-3"},{"typ":"mc","frage":"Frau Lindqvist möchte neben ihrer Maklertätigkeit zusätzlich als Versicherungsberaterin gegen Honorar arbeiten. Wie ist das zu beurteilen?","optionen":["Unzulässig, weil Vermittler kein Gewerbe als Versicherungsberater ausüben dürfen.","Zulässig, weil Makler Verbraucher gegen Honorar beliebig rechtlich beraten dürfen.","Zulässig, wenn sie die Provisionen der Versicherer an ihre Kunden auszahlt.","Unzulässig, weil Makler überhaupt keine Vergütung von Kunden annehmen dürfen."],"richtig":[0],"erkl":"Das Gesetz trennt Vermittlung und Versicherungsberatung strikt. Die Maklererlaubnis umfasst nur die Rechtsberatung von Nicht-Verbrauchern gegen gesondertes Entgelt, nicht von Verbrauchern.","norm":"§ 34d Abs. 3 und Abs. 1 GewO (letzter Satz)","id":"2.4-1-4"}]},{"typ":"situation","titel":"Fall 2: Agenturvertrag von Darius Nowak","situation":"Darius Nowak (52) ist seit dem 1. März 2018 selbständiger Versicherungsvertreter und ausschließlich für die Proximus Versicherung AG tätig. Im Agenturvertrag gelten die gesetzlichen Kündigungsfristen. Seine durchschnittliche Jahresprovision der letzten fünf Jahre beträgt 62.400,00 €. Ein Bekannter bietet ihm an, nebenbei Hausratversicherungen eines anderen Versicherers zu vermitteln. Am 28. September 2026 geht ihm eine ordentliche Kündigung der Proximus zu; ein Fehlverhalten liegt nicht vor.","items":[{"typ":"mc","frage":"Darf Herr Nowak während des Agenturvertrags ohne Zustimmung der Proximus zusätzlich Hausratversicherungen des anderen Versicherers vermitteln?","optionen":["Ja, als selbständiger Gewerbetreibender darf er jederzeit Produkte jedes beliebigen Versicherers anbieten.","Ja, wenn er der Proximus die nebenbei vermittelten Verträge spätestens am Jahresende vollständig mitteilt.","Nein, weil Versicherungsvertreter grundsätzlich keine Hausratversicherungen fremder Versicherer vermitteln.","Nein, als Handelsvertreter muss er die Interessen der Proximus wahren und darf ihr keine Konkurrenz machen."],"richtig":[3],"erkl":"Aus der Pflicht, das Interesse des Unternehmers wahrzunehmen, folgt während des Vertrags ein Wettbewerbsverbot für konkurrierende Produkte. Als gebundener Vertreter verlöre er zudem die Erlaubnisfreiheit, weil die Hausratprodukte miteinander konkurrieren.","norm":"§ 86 Abs. 1 HGB, § 92 Abs. 2 HGB","id":"2.4-2-1"},{"typ":"zahl","frage":"Wie hoch ist der Ausgleichsanspruch von Herrn Nowak nach dem Gesetz höchstens (in Euro)?","wert":187200,"einheit":"€","tol":0.01,"erkl":"Der Ausgleich des Versicherungsvertreters beträgt höchstens drei Jahresprovisionen: 3 × 62.400,00 € = 187.200,00 €. Die tatsächliche Höhe wird in der Praxis nach den „Grundsätzen zur Errechnung der Höhe des Ausgleichsanspruchs“ ermittelt und liegt meist darunter.","norm":"§ 89b Abs. 5 Satz 2 HGB","id":"2.4-2-2"},{"typ":"zahl","frage":"Wie viele Monate beträgt die gesetzliche Kündigungsfrist für den Agenturvertrag von Herrn Nowak?","wert":6,"einheit":"Monate","tol":0,"erkl":"Nach mehr als fünf Jahren Vertragsdauer beträgt die Frist sechs Monate zum Schluss eines Kalendermonats. Die Kündigung vom 28.09.2026 wirkt daher zum 31.03.2027.","norm":"§ 89 Abs. 1 HGB, § 92 Abs. 2 HGB","id":"2.4-2-3"},{"typ":"wf","frage":"Welche Aussagen zum Ausgleichsanspruch und zum Wettbewerb nach Vertragsende treffen zu?","aussagen":[["Der Anspruch muss innerhalb eines Jahres nach Vertragsende geltend gemacht werden.",true],["Der Anspruch kann im Agenturvertrag schon im Voraus wirksam ausgeschlossen werden.",false],["Hätte Herr Nowak ohne Anlass selbst gekündigt, stünde ihm kein Ausgleich zu – außer aus Alters- oder Krankheitsgründen.",true],["Ein nachvertragliches Wettbewerbsverbot darf höchstens zwei Jahre dauern und verpflichtet die Proximus zu einer angemessenen Entschädigung.",true],["Ein nachvertragliches Wettbewerbsverbot ist auch mündlich wirksam vereinbart.",false]],"erkl":"Der Ausgleich ist unabdingbar und fristgebunden; die Eigenkündigung schließt ihn grundsätzlich aus. Eine Wettbewerbsabrede nach Vertragsende braucht Schriftform, ist auf zwei Jahre begrenzt und muss entschädigt werden.","norm":"§ 89b Abs. 3 und 4 HGB, § 90a Abs. 1 HGB","id":"2.4-2-4"}]},{"typ":"situation","titel":"Fall 3: Lea Hoffmann – angestellt oder selbständig?","situation":"Lea Hoffmann (23) hat ihre Ausbildung abgeschlossen. Die Proximus Versicherung AG bietet ihr zwei Wege an: eine Stelle im angestellten Außendienst mit 3.100,00 € Festgehalt plus Bonus oder eine eigene Agentur als selbständige Vertreterin, vergütet nur über Provisionen. Sie wägt Sicherheit, Freiheit und Verdienstchancen ab und bittet Sie um eine Übersicht der Vertriebswege.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Merkmal den passenden Vertriebsweg zu.","paare":[["bestimmt Arbeitszeit und Tätigkeit im Wesentlichen frei und trägt das Unternehmerrisiko","selbständiger Versicherungsvertreter"],["erhält ein Festgehalt, ist weisungsgebunden und sozialversicherungspflichtig beschäftigt","angestellter Außendienst des Versicherers"],["wird vom Kunden beauftragt und sucht für ihn passende Angebote am Markt","Versicherungsmakler"],["Kunden schließen ohne Vermittler über Website oder App des Versicherers ab","Direktvertrieb des Versicherers"]],"erkl":"Das HGB unterscheidet den selbständigen Handelsvertreter vom Angestellten danach, ob er Tätigkeit und Arbeitszeit frei gestalten kann.","norm":"§ 84 Abs. 1 und 2 HGB, § 59 Abs. 2 und 3 VVG","id":"2.4-3-1"},{"typ":"mc","frage":"Frau Hoffmann entscheidet sich für die Selbständigkeit. Ab wann hat sie für einen vermittelten Vertrag Anspruch auf Provision?","optionen":["Sobald der Kunde den Antrag in ihrer Agentur vollständig unterschrieben hat.","Sobald der Kunde die Prämie gezahlt hat, aus der sich die Provision berechnet.","Sobald die Proximus den Antrag angenommen und die Police ausgestellt hat.","Erst wenn der Vertrag ein volles Versicherungsjahr ohne Kündigung bestanden hat."],"richtig":[1],"erkl":"Für Versicherungsvertreter gilt eine Sonderregel: Der Provisionsanspruch entsteht mit der Prämienzahlung des Versicherungsnehmers.","norm":"§ 92 Abs. 4 HGB","id":"2.4-3-2"},{"typ":"wf","frage":"Welche Aussagen zum angestellten Außendienst treffen zu?","aussagen":[["Als Angestellte braucht Frau Hoffmann keine eigene Gewerbeerlaubnis nach § 34d GewO.",true],["Die Proximus muss sicherstellen, dass ihre Angestellten im Vertrieb qualifiziert sind und sich regelmäßig fortbilden.",true],["Wie ein Vertreter gilt die Angestellte als bevollmächtigt, Anträge von Kunden entgegenzunehmen.",true],["Endet das Arbeitsverhältnis, hat sie einen Ausgleichsanspruch für den aufgebauten Kundenstamm.",false]],"erkl":"Angestellte sind keine Gewerbetreibenden; für ihre Qualifikation ist der Versicherer verantwortlich. Die Vollmachtsregeln gelten entsprechend. Der Ausgleichsanspruch steht nur selbständigen Handelsvertretern zu.","norm":"§ 48 Abs. 2 VAG, § 73 i. V. m. § 69 VVG, § 89b HGB","id":"2.4-3-3"},{"typ":"mc","frage":"Ein Kunde übergibt der selbständigen Vertreterin Frau Hoffmann bei der Antragsaufnahme die erste Jahresprämie von 186,00 € in bar. Wie ist die Zahlung zu beurteilen?","optionen":["Sie ist unwirksam, weil Versicherungsprämien gesetzlich nur per Lastschrift gezahlt werden dürfen.","Sie wirkt gegenüber der Proximus, weil die Vertreterin als bevollmächtigt gilt, Zahlungen anzunehmen.","Sie wirkt erst dann, wenn Frau Hoffmann das Bargeld vollständig an die Proximus weitergeleitet hat.","Sie ist unwirksam, weil nur der Innendienst des Versicherers Geld von Kunden annehmen darf."],"richtig":[1],"erkl":"Der Vertreter gilt als bevollmächtigt, Zahlungen im Zusammenhang mit Vermittlung oder Abschluss anzunehmen. Eine Beschränkung wirkt gegen den Kunden nur, wenn er sie kannte oder grob fahrlässig nicht kannte.","norm":"§ 69 Abs. 2 VVG","id":"2.4-3-4"}]},{"typ":"situation","titel":"Fall 4: Optikerin, E-Bike-Händler, Trainer und Vergleichsportal","situation":"Optikerin Hanna Petrović in Halle (Saale), Stadtteil Neustadt, bietet nebenbei zu jeder Brille eine Brillenversicherung gegen Bruch und Verlust an (Jahresprämie 39,00 €). Ein E-Bike-Händler vermittelt zu hochwertigen Rädern eine Fahrradvollkasko für 780,00 € im Jahr; die IHK hat ihn auf Antrag von der Erlaubnispflicht befreit. Fitnesstrainer Malik Osei gibt nur Namen und Telefonnummern interessierter Mitglieder an Ihre Agentur weiter. Das Portal „tarifblick24“ zeigt Hausrattarife als Rangliste an; Kunden können direkt über die Seite abschließen.","items":[{"typ":"mc","frage":"Braucht Frau Petrović für die Vermittlung der Brillenversicherung eine Erlaubnis der IHK?","optionen":["Ja, jede Vermittlung von Versicherungen erfordert eine Erlaubnis nach § 34d Abs. 1 GewO.","Nein, weil Brillenversicherungen keine Versicherungen im Sinne des VVG sind.","Ja, aber nur, wenn sie mehr als 50 Brillenversicherungen im Kalenderjahr vermittelt.","Nein, weil sie nebenbei eine Zusatzversicherung zur Ware unter 600 € Jahresprämie vermittelt."],"richtig":[3],"erkl":"Annexvermittler in Nebentätigkeit sind erlaubnisfrei, wenn die Versicherung eine Zusatzleistung zur Ware ist, Defekt, Verlust oder Beschädigung der Ware abdeckt und die Prämie auf Jahresbasis 600 € nicht übersteigt.","norm":"§ 34d Abs. 8 Nr. 1 GewO","id":"2.4-4-1"},{"typ":"zahl","frage":"Bis zu welcher Jahresprämie (in Euro) ist die Vermittlung einer Zusatzversicherung zu einer verkauften Ware erlaubnisfrei möglich?","wert":600,"einheit":"€","tol":0,"erkl":"Die Grenze liegt bei 600 € (zeitanteilig auf Jahresbasis berechnet). Für Versicherungen zu Dienstleistungen von höchstens drei Monaten gilt stattdessen eine Grenze von 200 € je Person.","norm":"§ 34d Abs. 8 Nr. 1 Buchst. c GewO","id":"2.4-4-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Beteiligten seine vermittlerrechtliche Einordnung zu.","paare":[["Fitnesstrainer Osei","Tippgeber ohne Vermittlertätigkeit, keine Erlaubnis nötig"],["Optikerin Petrović","Annexvermittlerin in Nebentätigkeit, erlaubnisfrei und nicht registriert"],["E-Bike-Händler","produktakzessorischer Vermittler mit Befreiung und Registereintrag"],["Portal „tarifblick24“","Versicherungsvermittler mit Erlaubnis nach § 34d Abs. 1 GewO"]],"erkl":"Wer nur Kontaktdaten weitergibt, vermittelt nicht. Über 600 € Jahresprämie braucht der Händler eine Erlaubnis oder – wie hier – eine Befreiung auf Antrag. Rangliste plus Abschlussmöglichkeit gilt als Vermittlung.","norm":"§ 34d Abs. 1 Satz 4 Nr. 2, Abs. 6, Abs. 8 und Abs. 10 GewO","id":"2.4-4-3"},{"typ":"wf","frage":"Welche Aussagen zu den Pflichten von Frau Petrović und dem Portal treffen zu?","aussagen":[["Frau Petrović muss der Kundin vor Abschluss das Informationsblatt zu Versicherungsprodukten aushändigen.",true],["Frau Petrović muss jedes Jahr 15 Stunden Weiterbildung nachweisen.",false],["Das Portal muss Kunden beim ersten Geschäftskontakt seine Statusinformation geben.",true],["Für das Portal gelten keine Beratungspflichten, weil Kunden den Tarif selbst auswählen.",false]],"erkl":"Annexvermittler nach § 34d Abs. 8 GewO müssen über Identität, Anschrift und Beschwerdeverfahren informieren und das Informationsblatt aushändigen; die Weiterbildungspflicht trifft sie nicht. Ein Vergleichsportal ist Vermittler und hat Status- und Beratungspflichten.","norm":"§ 66 VVG, § 34d Abs. 9 Satz 2 GewO, § 15 VersVermV, § 61 VVG","id":"2.4-4-4"}]},{"typ":"situation","titel":"Fall 5: Kundendaten und Weiterbildung in der Agentur Szymańska","situation":"Agnieszka Szymańska ist gebundene Vertreterin der Proximus in Halle (Saale) und beschäftigt zwei Kundenberaterinnen. Beim Durchsehen des Kundenverwaltungssystems (CRM) im November 2026 stoßen Sie auf mehrere Hinweise, die Beratungsanlässe sein könnten. Kundenberaterin Fabienne Roth hat in diesem Jahr bisher 9 Stunden anerkannte Weiterbildung besucht.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Hinweis aus dem CRM den passenden Beratungsansatz zu.","paare":[["Tochter (19) des Kunden zieht zum Studium in eine WG nach Jena","prüfen, ob sie noch über Familien-Haftpflicht und Außenversicherung geschützt ist"],["Kunde hat ein Elektroauto gekauft und eine Wallbox in der Garage montiert","Kfz-Vertrag anpassen und Einschluss der Wallbox im Wohngebäudevertrag prüfen"],["Kundin macht sich als Grafikdesignerin selbständig","Einkommensabsicherung und Altersvorsorge neu planen, weil Arbeitgeberleistungen entfallen"],["Hausratvertrag läuft seit 2009 ohne Änderung","Versicherungssumme und Unterversicherungsverzicht überprüfen"]],"erkl":"Veränderungen im Leben und alte Verträge sind Anlässe für eine Bedarfsanalyse. Der Versicherer muss auch während der Laufzeit beraten, wenn ein Anlass erkennbar ist; die Agentur nutzt dafür ihre Kundendaten.","norm":"§ 6 Abs. 4 VVG, § 61 Abs. 1 VVG","id":"2.4-5-1"},{"typ":"mc","frage":"Welcher Eintrag darf nach den Grundsätzen der DSGVO in die Kundenakte aufgenommen werden?","optionen":["Kundin wünscht im März Beratung zur Berufsunfähigkeitsversicherung.","Kunde wirkt chaotisch, die Ehe kriselt nach meinem Eindruck wohl.","Kunde erzählte nebenbei, dass sein Bruder hohe private Schulden hat.","Kopie des Personalausweises der Nachbarin, die beim Termin dabei war."],"richtig":[0],"erkl":"Gespeichert werden dürfen nur Daten, die für den Zweck – Beratung und Vertrag – erforderlich und sachlich richtig sind. Persönliche Wertungen und Daten unbeteiligter Dritter gehören nicht in die Akte.","norm":"Art. 5 Abs. 1 Buchst. b, c und d DSGVO","id":"2.4-5-2"},{"typ":"zahl","frage":"Wie viele Stunden Weiterbildung muss Frau Roth im Jahr 2026 noch mindestens nachweisen?","wert":6,"einheit":"Stunden","tol":0,"erkl":"Unmittelbar bei der Vermittlung mitwirkende Beschäftigte müssen sich 15 Stunden je Kalenderjahr weiterbilden: 15 − 9 = 6 Stunden.","norm":"§ 34d Abs. 9 Satz 2 GewO, § 7 VersVermV","id":"2.4-5-3"},{"typ":"wf","frage":"Welche Aussagen zur Weiterbildungspflicht in der Agentur treffen zu?","aussagen":[["Die Pflicht gilt für Frau Szymańska und für ihre unmittelbar bei der Vermittlung mitwirkenden Beschäftigten.",true],["Die Nachweise über die Weiterbildung sind fünf Jahre aufzubewahren.",true],["Selbststudium zählt nur, wenn der Anbieter eine nachweisbare Lernerfolgskontrolle durchführt.",true],["Eine Buchhalterin ohne jeden Kundenkontakt muss ebenfalls 15 Stunden jährlich nachweisen.",false]],"erkl":"Die Pflicht trifft den Vermittler und die direkt mitwirkenden Beschäftigten. Nachweise sind fünf Jahre ab Ende des Kalenderjahres der Maßnahme aufzubewahren.","norm":"§ 34d Abs. 9 Satz 2 GewO, § 7 Abs. 1 und 2 VersVermV","id":"2.4-5-4"}]}]},{"nr":"2.5","titel":"Prüfungsfälle: Kommunikation und Beschwerden","lf":"LF 3","buch":"S. 32–41","art":"faelle","lektionen":[{"typ":"situation","titel":"Fall 1: Agentur Reuter wählt ihre Kommunikationswege","situation":"Die Agentur von Annika Reuter in Halle (Saale) betreut 420 Privatkunden, von Studierenden bis zu Rentnern über 80. Bisher gehen alle Mitteilungen per Brief hinaus; das Porto beträgt 0,95 € je Standardbrief. 60 % der Kunden haben zugestimmt, Vertragspost per E-Mail zu erhalten. Frau Reuter möchte die Kanäle gezielter einsetzen.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Kundenanliegen den am besten geeigneten Kommunikationsweg zu.","paare":[["Kundin (82) ohne Internet möchte Unterlagen in Ruhe zu Hause lesen","Brief per Post"],["Kunde in Elternzeit möchte abends beraten werden und Dokumente gemeinsam ansehen","Videoberatung mit Bildschirmfreigabe"],["Kunde will Fotos eines Wasserschadens und Rechnungen einreichen","Upload im geschützten Kundenportal"],["Kundin ist verärgert und will ihr Problem sofort schildern","persönliches Telefonat mit Rückfragemöglichkeit"]],"erkl":"Der Kanal richtet sich nach Kunde, Anliegen, Dringlichkeit und Datenschutz. Sensible Unterlagen gehören auf sichere, verschlüsselte Wege.","norm":"Art. 32 DSGVO","id":"2.5-1-1"},{"typ":"wf","frage":"Welche Aussagen zu Vor- und Nachteilen der Kommunikationswege treffen zu?","aussagen":[["Ein Brief hält den Inhalt dauerhaft fest, verursacht aber Porto und hat eine längere Laufzeit.",true],["Eine einfache E-Mail ist immer automatisch verschlüsselt und deshalb für alle Daten geeignet.",false],["Am Telefon sind schnelle Rückfragen möglich, das Gesagte ist aber ohne Notiz schwer nachweisbar.",true],["In einer Videoberatung sind Mimik und Gestik teilweise sichtbar, was den Beziehungsaufbau erleichtert.",true]],"erkl":"Analoge Wege sind persönlich und nachweisbar, digitale schnell und günstig. Bei jedem Weg sind Nachweisbarkeit und Datensicherheit abzuwägen.","norm":"Art. 32 DSGVO, § 126b BGB","id":"2.5-1-2"},{"typ":"mc","frage":"Herr Ilić widerruft seinen neuen Vertrag per E-Mail mit seinem Namen. Das Gesetz verlangt dafür Textform. Wie ist die E-Mail einzuordnen?","optionen":["Sie wahrt die Schriftform, weil sie jederzeit ausgedruckt und unterschrieben werden kann.","Sie ist formlos und rechtlich unverbindlich, weil E-Mails keine Unterschrift tragen.","Sie wahrt die Textform: lesbare Erklärung mit Namen auf einem dauerhaften Datenträger.","Sie wahrt die Textform nur, wenn eine qualifizierte elektronische Signatur angehängt ist."],"richtig":[2],"erkl":"Textform verlangt eine lesbare Erklärung mit Nennung des Erklärenden auf einem dauerhaften Datenträger; eine E-Mail erfüllt das. Der Widerruf nach § 8 VVG ist in Textform zu erklären.","norm":"§ 126b BGB, § 8 Abs. 1 VVG","id":"2.5-1-3"},{"typ":"zahl","frage":"Die Agentur verschickt ein Rundschreiben an alle 420 Kunden. Wie viel Porto (in Euro) spart sie, wenn sie es allen Kunden, die der E-Mail-Zustellung zugestimmt haben, per E-Mail statt per Brief schickt?","wert":239.4,"einheit":"€","tol":0.01,"erkl":"60 % von 420 Kunden = 252 Kunden; 252 × 0,95 € = 239,40 € Ersparnis.","norm":"Kommunikationswege (Kostenvergleich)","id":"2.5-1-4"}]},{"typ":"situation","titel":"Fall 2: Ein Instagram-Auftritt für die Agentur Lorenz","situation":"Die Agentur Lorenz in Halle (Saale) möchte junge Kunden über Instagram erreichen. Auszubildender Finn Becker schlägt vor, ein Foto der Kundin Jana Wolff zu posten, die gerade eine Entschädigung für ihren gestohlenen Laptop erhalten hat. Außerdem soll jeder Neukunde, der bis Freitag abschließt, einen Gutschein im Wert von 50,00 € bekommen. Unter einem ersten Beitrag beschwert sich ein Kunde öffentlich über eine lange Schadenbearbeitung.","items":[{"typ":"mc","frage":"Unter welcher Voraussetzung darf die Agentur das Foto von Frau Wolff mit ihrer Geschichte veröffentlichen?","optionen":["Ohne Weiteres, weil sie Kundin ist und der Versicherungsvertrag Werbung abdeckt.","Ohne Einwilligung, wenn ihr Name im Beitrag nirgends genannt wird.","Ohne Einwilligung, wenn das Foto nach 30 Tagen wieder entfernt wird.","Nur mit ihrer vorherigen freiwilligen Einwilligung in diese Veröffentlichung."],"richtig":[3],"erkl":"Ein Foto mit Bezug zu einem Schadenfall ist ein personenbezogenes Datum; für Werbung fehlt eine andere Rechtsgrundlage. Auch das Recht am eigenen Bild verlangt die Einwilligung. Sie ist jederzeit widerruflich.","norm":"Art. 6 Abs. 1 Buchst. a, Art. 7 Abs. 3 DSGVO, § 22 KUG","id":"2.5-2-1"},{"typ":"zahl","frage":"Statt des 50-€-Gutscheins möchte die Agentur jedem Neukunden ein kleines Geschenk machen. Bis zu welchem Gesamtwert (in Euro) je Versicherungsverhältnis und Kalenderjahr gilt es als geringwertig und ist zulässig?","wert":15,"einheit":"€","tol":0,"erkl":"Sondervergütungen an Versicherungsnehmer sind verboten. Ausgenommen sind geringwertige Geschenke bis 15 € je Versicherungsverhältnis und Kalenderjahr; der 50-€-Gutschein ist daher unzulässig.","norm":"§ 48b Abs. 1 und 2 VAG","id":"2.5-2-2"},{"typ":"wf","frage":"Welche Aussagen zum Social-Media-Auftritt der Agentur treffen zu?","aussagen":[["Das Profil braucht ein leicht erreichbares Impressum mit den Anbieterangaben.",true],["Werbebeiträge müssen als Werbung erkennbar sein.",true],["Fragen zu einem konkreten Schaden dürfen in den öffentlichen Kommentaren mit Vertragsnummer beantwortet werden.",false],["Ein Instagram-Beitrag ersetzt die Statusinformation beim ersten Geschäftskontakt.",false]],"erkl":"Für geschäftliche Profile gilt die Impressumspflicht; Werbung muss als solche erkennbar sein. Vertragsdaten gehören nicht in öffentliche Kommentare.","norm":"§ 5 DDG, § 5a Abs. 4 UWG, § 1a Abs. 3 i. V. m. § 59 Abs. 1 VVG, §§ 15, 16 VersVermV, Art. 5 Abs. 1 Buchst. f DSGVO","id":"2.5-2-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Situation auf Instagram die passende Reaktion oder das passende Format zu.","paare":[["Junge Menschen sollen für Fahrradversicherungen sensibilisiert werden","kurzes Erklärvideo mit einem Alltagsbeispiel"],["Die Agentur will Vertrauen und Nähe aufbauen","Teamvorstellung mit Fotos der Mitarbeitenden, die eingewilligt haben"],["Ein Kunde beschwert sich öffentlich unter einem Beitrag","sachlich antworten und Klärung per Telefon oder Direktnachricht anbieten"],["Eine Followerin fragt, welcher Tarif für sie passt","Beratungstermin anbieten, statt öffentlich einen Tarif zu empfehlen"]],"erkl":"Social Media eignet sich für Information und Beziehungspflege. Beschwerden und Beratung werden in einen geschützten Kanal verlagert.","norm":"§ 61 VVG, Art. 5 Abs. 1 Buchst. f DSGVO","id":"2.5-2-4"}]},{"typ":"situation","titel":"Fall 3: Beratungsgespräch mit Benedikt Sauer","situation":"Sie beraten Benedikt Sauer (41), der in Halle (Saale) ein Einfamilienhaus in Saalenähe besitzt, zum Einschluss weiterer Naturgefahren (Elementar) in seine Wohngebäudeversicherung. Der Zuschlag beträgt laut Angebot 168,00 € im Jahr. Herr Sauer äußert mehrere Einwände: „Bei uns war noch nie Hochwasser.“ – „Das ist mir zu teuer.“ – „Das muss ich erst mit meiner Frau besprechen.“","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Methode der Einwandbehandlung ein passendes Beispiel zu.","paare":[["Bedingte Zustimmung (Ja-aber-Methode)","„Sie haben recht, bisher blieb es trocken. Starkregen kann aber jedes Haus treffen.“"],["Rückfragemethode","„Womit vergleichen Sie den Beitrag von 168 Euro?“"],["Bumerang-Methode","„Gerade weil Sie nah an der Saale wohnen, ist der Schutz für Sie wichtig.“"],["Vorwegnahme","„Vielleicht fragen Sie sich, ob sich das lohnt – dazu ein Beispiel.“"]],"erkl":"Gute Einwandbehandlung nimmt den Kunden ernst, klärt den Hintergrund und lenkt auf den Nutzen. Sie widerspricht nicht frontal.","norm":"Gesprächsführung (Einwandbehandlung)","id":"2.5-3-1"},{"typ":"mc","frage":"Herr Sauer hatte zuvor erzählt, dass er alle Versicherungsfragen allein entscheidet. Nun sagt er: „Das muss ich erst mit meiner Frau besprechen.“ Wie reagieren Sie am besten?","optionen":["Den Einwand übergehen und ihm sofort den Antrag zur Unterschrift vorlegen.","Ihm vorhalten, dass er solche Entscheidungen doch sonst immer allein trifft.","Nachfragen, ob außer der Absprache etwas offen ist; Termin zu dritt anbieten.","Einen Beitragsnachlass versprechen, wenn er sich heute noch entscheidet."],"richtig":[2],"erkl":"Ein Widerspruch zu früheren Aussagen deutet auf einen Vorwand hin. Eine offene Rückfrage deckt den echten Einwand auf; Druck und Rabattversprechen sind unseriös, Provisionsabgaben zudem verboten.","norm":"Gesprächsführung; § 48b VAG","id":"2.5-3-2"},{"typ":"mc","frage":"Welche Aussage formuliert das Merkmal „Elementarschutz deckt Überschwemmung durch Starkregen“ als Kundennutzen?","optionen":["„Läuft nach Starkregen Ihr Keller voll, zahlt die Versicherung Trocknung und Reparatur – Ihre Rücklagen bleiben.“","„Der Baustein deckt die Gefahr Überschwemmung durch Witterungsniederschläge nach den Bedingungen der Proximus ab.“","„Elementarschutz ist eine Erweiterung Ihrer Wohngebäudeversicherung um weitere Naturgefahren wie Erdrutsch.“","„Der Zuschlag für den Elementarschutz beträgt bei Ihrem Haus laut Angebot 168 Euro im Jahr.“"],"richtig":[0],"erkl":"Nutzenargumentation übersetzt ein Produktmerkmal in einen Vorteil für die Lebenssituation des Kunden (Merkmal – Vorteil – Nutzen).","norm":"Gesprächsführung (Nutzenargumentation)","id":"2.5-3-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Phase des Beratungsgesprächs mit Herrn Sauer die passende Handlung zu.","paare":[["Kontaktphase","begrüßen, Zeitrahmen und Ziel des Gesprächs klären"],["Bedarfsermittlung","mit offenen Fragen Lage des Hauses und Vorschäden erfragen"],["Angebots- und Argumentationsphase","Lösung vorstellen und mit Nutzen begründen"],["Abschlussphase","Ergebnisse zusammenfassen, Entscheidung herbeiführen, Rat und Gründe dokumentieren"]],"erkl":"Ein strukturiertes Gespräch erfüllt zugleich die gesetzlichen Pflichten: befragen, beraten, begründen und dokumentieren.","norm":"§ 61 Abs. 1 VVG, § 62 VVG","id":"2.5-3-4"}]},{"typ":"situation","titel":"Fall 4: Beschwerde von Olga Wiśniewska","situation":"Olga Wiśniewska (57) aus Halle (Saale) ist Verbraucherin und hat ihre Hausratversicherung bei der Proximus Versicherung AG, die Mitglied im Versicherungsombudsmann e. V. ist. Die Proximus hat die Entschädigung für ihr gestohlenes Fahrrad von 2.900,00 € schriftlich abgelehnt. Frau Wiśniewska ruft verärgert in Ihrer Agentur an. Sie überlegt, sich beim Versicherungsombudsmann oder bei der BaFin zu beschweren.","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Stufe des Beschwerdemanagements die passende Handlung zu.","paare":[["Beschwerdeannahme","aufmerksam zuhören, Anliegen vollständig aufnehmen, für den Hinweis danken"],["Beschwerdebearbeitung","Sachverhalt prüfen, intern klären und der Kundin einen Zeitrahmen nennen"],["Beschwerdereaktion","Ergebnis verständlich begründen und weitere Wege wie den Ombudsmann nennen"],["Beschwerdeauswertung","Ursachen sammeln und Abläufe verbessern, damit sich Fehler nicht wiederholen"]],"erkl":"Beschwerden sind eine Chance zur Kundenbindung. Kann einer Beschwerde nicht abgeholfen werden, sind die Gründe zu erläutern und weitere Möglichkeiten zu nennen.","norm":"vgl. § 17 Abs. 2 und 3 VersVermV","id":"2.5-4-1"},{"typ":"mc","frage":"Frau Wiśniewska ruft den Ombudsmann an, der zu ihren Gunsten entscheidet. Welche Wirkung hat die Entscheidung bei 2.900,00 € Beschwerdewert?","optionen":["Sie bindet beide Seiten; ein Gerichtsverfahren ist danach für beide ausgeschlossen.","Sie bindet die Proximus; Frau Wiśniewska könnte trotzdem noch vor Gericht gehen.","Sie ist nur eine Empfehlung, an die sich die Proximus nicht halten muss.","Sie bindet nur Frau Wiśniewska; die Proximus kann ihr frei widersprechen."],"richtig":[1],"erkl":"Bis 10.000 € Beschwerdewert ist die Entscheidung für den Versicherer bindend. Für die Kundin ist sie nie bindend; ihr bleibt der Weg zu den ordentlichen Gerichten offen.","norm":"§ 10 Abs. 3, § 11 VomVO (Verfahrensordnung des Versicherungsombudsmanns)","id":"2.5-4-2"},{"typ":"zahl","frage":"Bis zu welchem Beschwerdewert (in Euro) kann der Versicherungsombudsmann einen Versicherer verbindlich zur Leistung verpflichten?","wert":10000,"einheit":"€","tol":0,"erkl":"Bis 10.000 € erlässt der Ombudsmann eine für den Versicherer bindende Entscheidung. Über 10.000 € bis 100.000 € spricht er eine unverbindliche Empfehlung aus.","norm":"§ 10 Abs. 3, § 11 Abs. 1 VomVO","id":"2.5-4-3"},{"typ":"wf","frage":"Welche Aussagen zu Ombudsmann und BaFin treffen zu?","aussagen":[["Das Ombudsmannverfahren ist für Frau Wiśniewska kostenfrei.",true],["Wäh
