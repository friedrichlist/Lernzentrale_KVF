 Bundesbeihilfeverordnung erhält die Beihilfeberechtigte selbst 50 %, Ehegatten 70 % und Kinder 80 %. Den Rest deckt ein Beihilfe-Ergänzungstarif (Restkostentarif). Die Länder können abweichen.","norm":"§ 46 BBhV","id":"2.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Tarifmerkmal die passende Beschreibung zu.","paare":[["Selbstbehalt","Der Kunde trägt einen festen Betrag je Jahr selbst und zahlt dafür einen geringeren Beitrag."],["Beitragsrückerstattung","Wer im Kalenderjahr keine Leistungen einreicht, erhält einen Teil der Beiträge zurück."],["Krankenhaustagegeld","Fester Betrag je Tag eines stationären Aufenthalts, unabhängig von den Kosten."],["Stationäre Zusatzversicherung","Übernimmt für GKV-Versicherte Wahlleistungen wie Chefarzt und Zweibettzimmer."]],"erkl":"Selbstbehalt und Beitragsrückerstattung senken die Kosten des Kunden; Tagegelder sind Summenversicherung, Zusatzversicherungen ergänzen die GKV.","norm":"§ 192 Abs. 1 und 4 VVG, MB/KK 2009","id":"2.3-1-2"},{"typ":"mc","frage":"Ab welchem Tag der Arbeitsunfähigkeit beginnt bei Angestellten üblicherweise das Krankentagegeld?","optionen":["Ab dem 4. Tag, weil die ersten drei Tage ohne Attest gelten.","Ab dem 22. Tag, weil der Arbeitgeber drei Wochen weiterzahlt.","Ab dem 43. Tag, weil der Arbeitgeber sechs Wochen weiterzahlt.","Ab dem 92. Tag, weil die Krankenkasse drei Monate weiterzahlt."],"richtig":[2],"erkl":"Der Arbeitgeber zahlt das Entgelt sechs Wochen (42 Tage) fort. Eine Karenzzeit bis zum 42. Tag vermeidet doppelte Absicherung und senkt den Beitrag.","norm":"§ 3 EFZG, § 192 Abs. 5 VVG","id":"2.3-1-3"},{"typ":"zahl","frage":"Herr Daniel Vogt ist Angestellter mit 7.500 € brutto im Monat und privat vollversichert. Sein Beitrag zur Krankenversicherung (einschließlich Krankentagegeld) beträgt 1.060 € im Monat. Vorgaben 2026: BBG 5.812,50 € im Monat, allgemeiner Beitragssatz 14,6 %, durchschnittlicher Zusatzbeitrag 2,9 %. Wie hoch ist der Arbeitgeberzuschuss zur Krankenversicherung?","wert":508.59,"einheit":"€","tol":0.02,"erkl":"Höchstzuschuss: 5.812,50 € × (14,6 % + 2,9 %) ÷ 2 = 5.812,50 € × 8,75 % = 508,59 €. Die Hälfte seines Beitrags (530 €) ist höher, daher zahlt der Arbeitgeber 508,59 €.","norm":"§ 257 Abs. 2 SGB V","id":"2.3-1-4"},{"typ":"mc","frage":"Wozu dient eine private Krankentagegeldversicherung für einen pflichtversicherten Angestellten ab dem 43. Tag?","optionen":["Sie schließt die Lücke zwischen dem Krankengeld und seinem Nettoeinkommen.","Sie zahlt das volle Bruttogehalt, damit die Sozialabgaben weiterlaufen.","Sie ersetzt das Krankengeld der Krankenkasse, das dann nicht mehr gezahlt wird.","Sie zahlt nur bei einem Krankenhausaufenthalt einen festen Betrag je Tag."],"richtig":[0],"erkl":"Das Krankengeld beträgt 70 % des Bruttoentgelts, höchstens 90 % des Nettos, begrenzt durch die BBG. Die Lücke zum Netto deckt ein Krankentagegeld; zusammen dürfen beide das Nettoeinkommen nicht übersteigen.","norm":"§ 47 SGB V, § 4 Abs. 2 MB/KT","id":"2.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lukas Brenner (20) aus Halle (Saale) beginnt zum 01.10.2026 ein Studium. Bisher ist er bei seinem Vater Thomas, einem Bundesbeamten, in der Beihilfe berücksichtigungsfähig (Bemessungssatz 80 %) und hat bei der Proximus Versicherung AG einen Restkostentarif über 20 %. Der Vater verdient 6.900 € im Monat (12 Gehälter). Die Mutter Sandra ist Angestellte, pflichtversichert in der GKV und verdient 3.100 € im Monat. Die Eltern sind verheiratet. Ein Zwölftel der JAEG 2026 beträgt 6.450 €.","items":[{"typ":"mc","frage":"Wie ist Lukas ab Studienbeginn in der Krankenversicherung gestellt?","optionen":["Er ist über seine Mutter familienversichert, weil sie Mitglied einer Krankenkasse ist.","Er ist in der KVdS versicherungspflichtig, kann sich aber binnen drei Monaten befreien lassen.","Er bleibt automatisch privat versichert, weil er bisher über die Beihilfe abgesichert war.","Er muss in die KVdS eintreten; eine Befreiung ist für Kinder von Beamten ausgeschlossen."],"richtig":[1],"erkl":"Eine Familienversicherung über die Mutter scheidet aus: Der Vater ist nicht GKV-Mitglied, verdient mehr als 6.450 € im Monat und mehr als die Mutter. Als Student ist Lukas deshalb versicherungspflichtig und kann sich befreien lassen.","norm":"§ 5 Abs. 1 Nr. 9, § 8 Abs. 1 Nr. 5, § 10 Abs. 3 SGB V","id":"2.3-2-1"},{"typ":"wf","frage":"Lukas lässt sich befreien und bleibt in der PKV. Welche Aussagen treffen zu?","aussagen":[["Die Befreiung gilt für die gesamte Dauer des Studiums und kann nicht widerrufen werden.",true],["Endet der Kindergeldanspruch (spätestens mit 25 Jahren), fällt die Beihilfe weg; der Tarif muss auf 100 % aufgestockt werden.",true],["Nimmt er nach dem Studium eine Beschäftigung unter der JAEG auf, wird er versicherungspflichtig.",true],["Er kann nach dem ersten Semester in die KVdS wechseln, wenn ihm die PKV zu teuer wird.",false],["Die Hochschule zahlt ihm einen Zuschuss zum PKV-Beitrag wie ein Arbeitgeber.",false]],"erkl":"Die Befreiung wirkt nur für das Studium und ist unwiderruflich. Mit dem Ende der Beihilfe als Kind steigt der PKV-Beitrag stark; das ist im Beratungsgespräch anzusprechen.","norm":"§ 8 Abs. 2 SGB V, § 46 BBhV","id":"2.3-2-2"},{"typ":"zahl","frage":"Zum Vergleich: Welchen monatlichen Krankenversicherungsbeitrag müsste Lukas in der KVdS zahlen? Angenommene Werte 2026: Bemessungsgrundlage 855 € (BAföG-Bedarfssatz), Beitragssatz für Studierende 10,22 % (sieben Zehntel von 14,6 %), Zusatzbeitrag der Krankenkasse 2,9 %. Lukas trägt den Beitrag allein.","wert":112.18,"einheit":"€","tol":0.05,"erkl":"Beitragssatz: 10,22 % + 2,9 % = 13,12 %. Beitrag: 855 € × 13,12 % = 112,18 €. Hinzu käme der Beitrag zur Pflegeversicherung.","norm":"§§ 236, 245, 242 SGB V","id":"2.3-2-3"}]}]},{"nr":"2.4","titel":"Familie und Pflege","lf":"LF 8","buch":"PV2 3.5–3.6 S. 146–155 · Lösungen S. 685–687","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Eine pflichtversicherte Angestellte nimmt nach der Geburt zwölf Monate Elternzeit, bezieht Elterngeld und arbeitet nicht. Was gilt für ihre Krankenversicherung?","optionen":["Ihre Mitgliedschaft bleibt bestehen; aus dem Elterngeld zahlt sie keine Beiträge.","Sie muss sich freiwillig versichern und den Mindestbeitrag selbst zahlen.","Ihre Versicherung ruht; Leistungen erhält sie erst nach der Elternzeit wieder.","Sie wird über ihren privat versicherten Ehemann beitragsfrei mitversichert."],"richtig":[0],"erkl":"Die Pflichtmitgliedschaft bleibt während des Elterngeldbezugs und der Elternzeit erhalten. Das Elterngeld ist beitragsfrei.","norm":"§ 192 Abs. 1 Nr. 2, § 224 SGB V","id":"2.4-1-1"},{"typ":"mc","frage":"Ein Angestellter ist bei der Proximus Versicherung AG krankheitskostenvollversichert. Wie ist er gegen das Risiko der Pflegebedürftigkeit abzusichern?","optionen":["In der privaten Pflegepflichtversicherung, grundsätzlich bei der Proximus.","In der sozialen Pflegeversicherung bei einer gesetzlichen Pflegekasse.","Freiwillig bei einem beliebigen Versicherer, weil keine Pflegepflicht besteht.","Erst bei Pflegebedarf, durch einen Antrag bei der Pflegekasse der Kommune."],"richtig":[0],"erkl":"Wer privat krankenversichert ist, muss bei seinem Krankenversicherer eine private Pflegepflichtversicherung abschließen. Er kann auch ein anderes Unternehmen wählen; üblich und empfehlenswert ist derselbe Versicherer.","norm":"§ 23 Abs. 1 SGB XI, MB/PPV","id":"2.4-1-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Form der privaten Pflegezusatzvorsorge das passende Merkmal zu.","paare":[["Pflegetagegeldversicherung","fester Betrag je Tag nach Pflegegrad, frei verwendbar"],["Pflegekostenversicherung","erstattet nachgewiesene Restkosten nach der Pflegepflichtversicherung"],["Geförderte Pflegevorsorge (Förder-Pflege)","staatliche Zulage von 5 € im Monat, keine Gesundheitsprüfung"],["Pflegerentenversicherung","Lebensversicherung, die bei Pflegebedürftigkeit eine monatliche Rente zahlt"]],"erkl":"Tagegeld ist Summenversicherung, Kostenversicherung leistet nach Nachweis. Die Förder-Pflege ist ein Pflegetagegeld mit Zulage und Annahmepflicht; die Pflegerente bietet ein Lebensversicherer an.","norm":"§ 192 Abs. 6 VVG, §§ 126–128 SGB XI","id":"2.4-1-3"},{"typ":"wf","frage":"Welche Aussagen zur steuerlichen Behandlung und zur Beitragsentwicklung treffen zu?","aussagen":[["Beiträge zur Basisabsicherung in der PKV und zur Pflegepflichtversicherung sind in voller Höhe als Sonderausgaben absetzbar.",true],["Beitragsanteile für Wahlleistungen wie Chefarzt und Einbettzimmer gehören nicht zur Basisabsicherung.",true],["Der Beitrag zum Krankentagegeld zählt in voller Höhe zur steuerlich begünstigten Basisabsicherung.",false],["Fällt mit Rentenbeginn das Krankentagegeld weg, sinkt der Beitrag der Vollversicherung.",true],["Bei Eheschließung ist der nicht berufstätige Ehepartner eines PKV-Kunden beitragsfrei mitversichert.",false]],"erkl":"Nur die Basisabsicherung ist unbegrenzt absetzbar; Krankentagegeld und Wahlleistungen zählen zu den sonstigen Vorsorgeaufwendungen. In der PKV braucht jede Person einen eigenen Vertrag.","norm":"§ 10 Abs. 1 Nr. 3 und 3a EStG, § 193 Abs. 3 VVG","id":"2.4-1-4"},{"typ":"zahl","frage":"Frau Ilse Kranz schließt einen geförderten Pflegetagegeldtarif ab. Der Monatsbeitrag beträgt einschließlich der staatlichen Zulage von 5 € insgesamt 30 €. Wie viel zahlt sie im Jahr aus eigener Tasche?","wert":300,"einheit":"€","tol":0.02,"erkl":"Eigenanteil im Monat: 30 € − 5 € = 25 € (Mindesteigenbeitrag 10 € ist erfüllt). Im Jahr: 25 € × 12 = 300 €.","norm":"§ 127 SGB XI","id":"2.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Felix Sommer (34) aus Halle (Saale) ist angestellter IT-Berater mit 7.800 € brutto im Monat und seit 2021 bei der Proximus Versicherung AG vollversichert. Seine Ehefrau Nadine (32) ist Angestellte mit 3.400 € im Monat und pflichtversichert in der GKV. Am 14.09.2026 ist ihre Tochter Emma zur Welt gekommen. Für 2027 planen die Eheleute außerdem, einen fünfjährigen Jungen mit einem angeborenen Herzfehler zu adoptieren. Ein Zwölftel der JAEG 2026 beträgt 6.450 €.","items":[{"typ":"mc","frage":"Kann Emma über ihre Mutter in der GKV familienversichert werden?","optionen":["Nein, weil Felix nicht GKV-Mitglied ist und mehr als 6.450 € sowie mehr als Nadine verdient.","Ja, weil Kinder immer über den gesetzlich versicherten Elternteil mitversichert sind.","Ja, aber nur bis zum Ende der Elternzeit von Nadine, danach muss sie privat versichert werden.","Nein, weil Neugeborene in den ersten zwei Monaten nur privat versichert werden können."],"richtig":[0],"erkl":"Die Familienversicherung des Kindes ist ausgeschlossen, wenn der mit dem Kind verwandte Ehegatte nicht GKV-Mitglied ist, mehr als ein Zwölftel der JAEG verdient und mehr als das Mitglied (7.800 € > 6.450 € und > 3.400 €).","norm":"§ 10 Abs. 3 SGB V","id":"2.4-2-1"},{"typ":"mc","frage":"Felix möchte Emma bei der Proximus versichern. Was müssen Sie ihm sagen?","optionen":["Er muss Emma bis 14.10.2026 anmelden; dann entfallen nur die besonderen Wartezeiten.","Er muss Emma bis 14.12.2026 anmelden; dann gilt der Schutz ab dem Tag der Anmeldung.","Er muss Emma bis 14.11.2026 anmelden; dann gilt der Schutz ab Geburt ohne Prüfung.","Er kann Emma jederzeit anmelden; eine Gesundheitsprüfung ist bei Kindern nie nötig."],"richtig":[2],"erkl":"Felix ist länger als drei Monate versichert. Meldet er Emma spätestens zwei Monate nach der Geburt an, beginnt der Schutz rückwirkend ab Geburt ohne Risikozuschlag und Wartezeit; er darf nicht höher sein als sein eigener.","norm":"§ 198 Abs. 1 VVG","id":"2.4-2-2"},{"typ":"mc","frage":"Was gilt für die geplante Adoption des fünfjährigen Jungen?","optionen":["Eine Nachversicherung ist ausgeschlossen, weil sie nur für leibliche Neugeborene gilt.","Er kann wie ein Neugeborenes ohne jeden Zuschlag und ohne Prüfung versichert werden.","Er muss zuerst ein Jahr in der GKV versichert sein, bevor die PKV ihn aufnehmen darf.","Er kann ohne Wartezeit nachversichert werden; ein Risikozuschlag bis 100 % ist erlaubt."],"richtig":[3],"erkl":"Die Adoption eines minderjährigen Kindes steht der Geburt gleich (Anmeldung binnen zwei Monaten). Wegen eines erhöhten Risikos darf der Versicherer einen Zuschlag bis zur einfachen Prämienhöhe verlangen.","norm":"§ 198 Abs. 2 VVG","id":"2.4-2-3"}]}]},{"nr":"2.5","titel":"Versicherungspflicht und -freiheit: Wechsel zwischen GKV und PKV","lf":"LF 8","buch":"PV2 3.2 S. 95–113, 3.6 S. 151–155 · Lösungen S. 677–679, 685–687","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Herr Kaya ist Angestellter. Welche Zahlung bleibt bei der Ermittlung seines regelmäßigen Jahresarbeitsentgelts außer Ansatz?","optionen":["das im Arbeitsvertrag fest zugesagte Weihnachtsgeld in Höhe eines Monatsgehalts","das tarifliche Urlaubsgeld, das ihm jedes Jahr im Juni ausgezahlt wird","der Familienzuschlag, den er wegen seiner Ehe und seiner Kinder erhält","die unbefristete monatliche Funktionszulage für seine Tätigkeit als Teamleiter"],"richtig":[2],"erkl":"Zum regelmäßigen Jahresarbeitsentgelt zählen das laufende Entgelt und Sonderzahlungen, die mit hinreichender Sicherheit jedes Jahr fließen, z. B. vertragliches Weihnachtsgeld, tarifliches Urlaubsgeld und feste Zulagen. Zuschläge, die mit Rücksicht auf den Familienstand gezahlt werden, bleiben nach dem Gesetz unberücksichtigt.","norm":"§ 6 Abs. 1 Nr. 1 SGB V","id":"2.5-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Person ihren Status in der Krankenversicherung zu.","paare":[["Angestellte mit regelmäßigem Jahresarbeitsentgelt von 48.000 €","versicherungspflichtig in der GKV"],["Angestellter mit regelmäßigem Jahresarbeitsentgelt von 84.000 €","versicherungsfrei wegen Überschreitens der JAEG"],["Landesbeamtin auf Lebenszeit","versicherungsfrei; in der Regel Beihilfe und private Restkostenversicherung"],["hauptberuflich selbstständiger Handwerksmeister","nicht GKV-pflichtig; PKV oder ggf. freiwillige GKV"]],"erkl":"Angestellte sind bis zur JAEG (2026: 77.400 €) versicherungspflichtig, darüber versicherungsfrei. Beamte sind kraft Gesetzes versicherungsfrei und sichern sich über Beihilfe und eine private Restkostenversicherung ab. Hauptberuflich Selbstständige sind nicht versicherungspflichtig; sie müssen sich aber wegen der allgemeinen Pflicht zur Versicherung privat oder (bei erfüllter Vorversicherungszeit) freiwillig gesetzlich versichern.","norm":"§ 5 Abs. 1 Nr. 1 und Abs. 5, § 6 Abs. 1 Nr. 1 und 2, § 9 SGB V; § 193 Abs. 3 VVG","id":"2.5-1-2"},{"typ":"zahl","frage":"Berechnen Sie den monatlichen Höchstzuschuss des Arbeitgebers zur privaten Krankenversicherung (ohne Pflegeversicherung) für 2026. Werte 2026: Beitragsbemessungsgrenze KV 5.812,50 € im Monat, allgemeiner Beitragssatz 14,6 %, durchschnittlicher Zusatzbeitragssatz 2,9 %.","wert":508.59,"einheit":"€","tol":0.5,"erkl":"Maßgeblich sind die Hälfte des allgemeinen Beitragssatzes (7,3 %) und die Hälfte des durchschnittlichen Zusatzbeitragssatzes (1,45 %), zusammen 8,75 %. Rechnung: 5.812,50 € × 8,75 % = 508,59 €. Der Arbeitgeber zahlt höchstens die Hälfte des tatsächlichen Beitrags.","norm":"§ 257 Abs. 2 SGB V","id":"2.5-1-3"},{"typ":"wf","frage":"Herr Lindner (57) war 20 Jahre selbstständig und die ganze Zeit privat krankenversichert. Jetzt nimmt er eine Stelle als Angestellter mit 3.200 € im Monat an. Welche Aussagen treffen zu?","aussagen":[["Er bleibt versicherungsfrei, weil er in den letzten fünf Jahren nicht gesetzlich versichert und mindestens die Hälfte davon selbstständig war.",true],["Er wird Pflichtmitglied der GKV, weil sein Entgelt unter der Jahresarbeitsentgeltgrenze liegt.",false],["Wäre er erst 52 Jahre alt, würde er mit dieser Stelle grundsätzlich versicherungspflichtig in der GKV.",true],["Die Regel soll verhindern, dass langjährig privat Versicherte erst im Alter in die GKV wechseln.",true],["Er kann seine PKV wegen der neuen Stelle rückwirkend kündigen, weil Versicherungspflicht eintritt.",false]],"erkl":"Wer nach Vollendung des 55. Lebensjahres versicherungspflichtig würde, bleibt versicherungsfrei, wenn er in den letzten fünf Jahren nicht gesetzlich versichert war und mindestens die Hälfte dieser Zeit versicherungsfrei, befreit oder hauptberuflich selbstständig war. Herr Lindner erfüllt das; es tritt keine Versicherungspflicht ein, also besteht auch kein Sonderkündigungsrecht für die PKV.","norm":"§ 6 Abs. 3a SGB V; § 205 Abs. 2 VVG","id":"2.5-1-4"},{"typ":"wf","frage":"Frau Seidel (44) ist seit acht Jahren bei der Proximus privat krankenversichert. Sie wird arbeitslos und bezieht Arbeitslosengeld. Welche Aussagen treffen zu?","aussagen":[["Mit dem Bezug von Arbeitslosengeld wird sie grundsätzlich versicherungspflichtig in der GKV.",true],["Sie kann sich auf Antrag binnen drei Monaten von dieser Pflicht befreien lassen und in der PKV bleiben.",true],["Den Antrag auf Befreiung kann sie während des ganzen Leistungsbezugs jederzeit stellen.",false],["Bleibt sie in der GKV, kann sie ihre PKV binnen drei Monaten rückwirkend zum Beginn der Versicherungspflicht kündigen.",true],["Ihre PKV endet mit Beginn der Versicherungspflicht automatisch, eine Kündigung ist nicht nötig.",false]],"erkl":"Bezieher von Arbeitslosengeld sind versicherungspflichtig. Wer in den letzten fünf Jahren nicht gesetzlich versichert war und eine gleichwertige PKV hat, kann sich binnen drei Monaten befreien lassen. Bleibt sie in der GKV, muss sie die PKV selbst kündigen; innerhalb von drei Monaten wirkt die Kündigung rückwirkend zum Eintritt der Versicherungspflicht.","norm":"§ 5 Abs. 1 Nr. 2, § 8 Abs. 1 Nr. 1a und Abs. 2 SGB V; § 205 Abs. 2 VVG","id":"2.5-1-5"},{"typ":"mc","frage":"Unter welcher Voraussetzung erhält ein Beschäftigter von seinem Arbeitgeber einen Zuschuss zu seiner privaten Krankenversicherung?","optionen":["Er ist wegen Überschreitens der JAEG versicherungsfrei und privat krankenvollversichert.","Er ist Pflichtmitglied der GKV und hat zusätzlich eine private Zahnzusatzversicherung.","Er ist Beamter auf Lebenszeit und hat neben der Beihilfe eine private Restkostenversicherung.","Er ist geringfügig beschäftigt und über seine Ehefrau in der GKV familienversichert."],"richtig":[0],"erkl":"Den Zuschuss erhalten Beschäftigte, die nur wegen Überschreitens der JAEG versicherungsfrei (oder von der Versicherungspflicht befreit) sind und eine PKV mit Leistungen nach Art der GKV haben. Zusatzversicherungen von GKV-Mitgliedern sind nicht zuschussfähig; Beamte erhalten Beihilfe statt eines Zuschusses.","norm":"§ 257 Abs. 2 SGB V; § 61 Abs. 2 SGB XI","id":"2.5-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Malte Brenner (31, ledig, kinderlos) ist Ingenieur bei einem Anlagenbauer in Halle (Saale) und Pflichtmitglied einer Krankenkasse mit einem Zusatzbeitrag von 3,1 %. Bis Februar 2026 verdiente er 5.600 € im Monat; seit dem 01.03.2026 erhält er 6.300 € und laut Arbeitsvertrag jedes Jahr im November ein 13. Monatsgehalt in gleicher Höhe. Im Juni 2026 bekam er außerdem einmalig eine Projektprämie von 2.500 €. Die Personalabteilung geht davon aus, dass sein Entgelt auch die Jahresarbeitsentgeltgrenze 2027 übersteigt. Er lässt sich in der Agentur der Proximus Versicherung AG beraten; das Angebot nennt monatlich 584 € für die Krankheitskosten- und Krankentagegeldversicherung und 52 € für die private Pflegepflichtversicherung.","items":[{"typ":"zahl","frage":"Ermitteln Sie Herrn Brenners regelmäßiges Jahresarbeitsentgelt ab dem 01.03.2026 (vorausschauende Betrachtung über zwölf Monate).","wert":81900,"einheit":"€","tol":1,"erkl":"Regelmäßig sind das Monatsgehalt und das vertraglich zugesagte 13. Gehalt: 12 × 6.300 € + 6.300 € = 81.900 €. Die einmalige Projektprämie ist nicht regelmäßig und zählt nicht. 81.900 € übersteigen die JAEG 2026 von 77.400 €.","norm":"§ 6 Abs. 1 Nr. 1 SGB V","id":"2.5-2-1"},{"typ":"mc","frage":"Was gilt nun für Herrn Brenners Versicherungsstatus?","optionen":["Die Versicherungspflicht endet schon am 01.03.2026; er kann rückwirkend ab März in die PKV wechseln.","Die Versicherungspflicht endet erst, wenn er die Grenze drei Kalenderjahre hintereinander überschreitet.","Die Versicherungspflicht bleibt bestehen, weil die Projektprämie einmalig ist und nicht mitzählt.","Die Versicherungspflicht endet mit Ablauf des 31.12.2026; ein PKV-Vertrag kann ab dem 01.01.2027 beginnen."],"richtig":[3],"erkl":"Wird die JAEG überschritten, endet die Versicherungspflicht mit Ablauf des Kalenderjahres, wenn das Entgelt auch die Grenze des Folgejahres übersteigt. Das ist hier zu erwarten. Die Dreijahresregel gilt seit 2011 nicht mehr; die Projektprämie bleibt zwar außer Ansatz, er liegt aber auch ohne sie über der Grenze.","norm":"§ 6 Abs. 4 SGB V","id":"2.5-2-2"},{"typ":"zahl","frage":"Wie hoch ist Herrn Brenners monatlicher Arbeitnehmeranteil zur Kranken- und Pflegeversicherung ab März 2026, solange er noch Pflichtmitglied ist (Monat mit laufendem Gehalt, ohne Einmalzahlung)? Werte 2026: Beitragsbemessungsgrenze KV/PV 5.812,50 €, allgemeiner Beitragssatz 14,6 %, Zusatzbeitrag seiner Kasse 3,1 %, Pflegeversicherung 3,6 % (je zur Hälfte) und Kinderlosenzuschlag 0,6 %.","wert":653.91,"einheit":"€","tol":1,"erkl":"Sein laufendes Gehalt von 6.300 € liegt über der Beitragsbemessungsgrenze, also wird von 5.812,50 € gerechnet. KV: 7,3 % + 1,55 % = 8,85 %, das sind 514,41 €. PV: 1,8 % + 0,6 % Kinderlosenzuschlag = 2,4 %, das sind 139,50 €. Zusammen 653,91 €.","norm":"§§ 223, 226, 241, 242, 249 SGB V; §§ 55, 58 SGB XI","id":"2.5-2-3"},{"typ":"zahl","frage":"Wie hoch wäre der monatliche Arbeitgeberzuschuss zu Herrn Brenners PKV und PPV insgesamt? Rechnen Sie mit den Höchstzuschüssen 2026: 508,59 € (KV) und 104,63 € (PV).","wert":318,"einheit":"€","tol":0.5,"erkl":"Der Zuschuss beträgt höchstens die Hälfte des tatsächlichen Beitrags; das Krankentagegeld zählt mit, weil es dem Krankengeld der GKV entspricht. KV: 584 € : 2 = 292 € (unter 508,59 €). PPV: 52 € : 2 = 26 € (unter 104,63 €). Zuschuss: 318 €. Sein Eigenanteil von 318 € liegt unter dem GKV-Anteil von 653,91 €; zur Beurteilung gehören aber auch künftige Beitragsanpassungen und die fehlende beitragsfreie Familienversicherung in der PKV.","norm":"§ 257 Abs. 2 SGB V; § 61 Abs. 2 SGB XI","id":"2.5-2-4"}]}],"runde":"zusatz"},{"nr":"2.6","titel":"Familienangehörige: Familienversicherung, Geburt, Studium","lf":"LF 8","buch":"PV2 3.2 S. 95–113, 3.3 S. 114–128 · Lösungen S. 677–682","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Die Ehefrau eines GKV-Mitglieds hat 2026 nur Mieteinkünfte und keinen Minijob. Bis zu welchem regelmäßigen monatlichen Gesamteinkommen kann sie beitragsfrei familienversichert sein?","optionen":["bis 603 €, weil diese Grenze für alle Einkunftsarten gilt","bis 565 €, das ist ein Siebtel der monatlichen Bezugsgröße","bis 6.450 €, das ist ein Zwölftel der Jahresarbeitsentgeltgrenze","bis 3.955 €, das ist die volle monatliche Bezugsgröße"],"richtig":[1],"erkl":"Die Grenze für die Familienversicherung beträgt ein Siebtel der monatlichen Bezugsgröße: 3.955 € : 7 = 565 €. Nur bei einem Minijob gilt die höhere Grenze von 603 €. Ein Zwölftel der JAEG spielt beim Ausschluss von Kindern eine Rolle, nicht beim Ehegatten.","norm":"§ 10 Abs. 1 Satz 1 Nr. 5 SGB V; § 18 SGB IV","id":"2.6-1-1"},{"typ":"wf","frage":"Ein Vater ist Pflichtmitglied der GKV, die Mutter ist ebenfalls gesetzlich versichert. Welche Aussagen zur Familienversicherung ihrer Kinder treffen zu (Einkommensgrenze jeweils eingehalten)?","aussagen":[["Sein 16-jähriger Sohn, der zur Schule geht, ist familienversichert.",true],["Seine 22-jährige Tochter, die nicht erwerbstätig ist, ist noch familienversichert.",true],["Seine 24-jährige Tochter, die studiert, ist noch familienversichert.",true],["Sein 27-jähriger Sohn bleibt familienversichert, solange er an einer Hochschule eingeschrieben ist.",false],["Ein Kind mit Behinderung, das sich nicht selbst unterhalten kann, ist höchstens bis 25 familienversichert.",false]],"erkl":"Kinder sind bis 18 Jahre familienversichert, bis 23, wenn sie nicht erwerbstätig sind, und bis 25, wenn sie in Schul- oder Berufsausbildung oder im Studium sind (ggf. verlängert um einen Freiwilligendienst). Kinder mit Behinderung, die sich nicht selbst unterhalten können, sind unter bestimmten Voraussetzungen ohne Altersgrenze versichert.","norm":"§ 10 Abs. 2 SGB V","id":"2.6-1-2"},{"typ":"mc","frage":"Die Mutter ist Pflichtmitglied der GKV, der Vater ist privat versichert. In welchem Fall ist das gemeinsame Kind NICHT familienversichert? (Angaben: regelmäßiges Gesamteinkommen im Monat)","optionen":["Die Eltern sind nicht verheiratet; der Vater hat 7.200 €, die Mutter 2.800 €.","Die Eltern sind verheiratet; der Vater hat 5.900 €, die Mutter 2.800 €.","Die Eltern sind verheiratet; der Vater hat 7.200 €, die Mutter 7.500 €.","Die Eltern sind verheiratet; der Vater hat 7.200 €, die Mutter 2.800 €."],"richtig":[3],"erkl":"Das Kind ist ausgeschlossen, wenn alle Bedingungen vorliegen: Die Eltern sind verheiratet (oder Lebenspartner), der verwandte Ehegatte ist kein GKV-Mitglied, sein Gesamteinkommen übersteigt ein Zwölftel der JAEG (2026: 6.450 €) und ist höher als das des Mitglieds. Das trifft nur im letzten Fall zu.","norm":"§ 10 Abs. 3 SGB V","id":"2.6-1-3"},{"typ":"mc","frage":"Ein privat versicherter Vater möchte sein neugeborenes Kind bei seinem Versicherer versichern. Was gilt nach § 198 VVG?","optionen":["Anmeldung spätestens zwei Monate nach der Geburt; Schutz rückwirkend ab Geburt ohne Risikozuschlag und Wartezeit.","Anmeldung spätestens sechs Monate nach der Geburt; Schutz beginnt erst mit dem Eingang des Antrags beim Versicherer.","Anmeldung jederzeit möglich; die Gesundheitsprüfung entfällt aber nur, wenn beide Eltern bei der Proximus versichert sind.","Anmeldung binnen zwei Monaten; das Kind darf dabei einen umfassenderen Schutz als der versicherte Elternteil erhalten."],"richtig":[0],"erkl":"Der Versicherer muss das Neugeborene ab Vollendung der Geburt ohne Risikozuschläge und Wartezeiten versichern, wenn es spätestens zwei Monate nach dem Tag der Geburt rückwirkend angemeldet wird. Der Schutz darf nicht höher und nicht umfassender sein als der des versicherten Elternteils.","norm":"§ 198 Abs. 1 VVG; § 2 Abs. 2 MB/KK 2009","id":"2.6-1-4"},{"typ":"mc","frage":"Lina (19) beginnt im Oktober 2026 ein Studium in Halle (Saale). Ihre Eltern sind Landesbeamte; Lina ist bisher über die Beihilfe und eine private Restkostenversicherung abgesichert. Was gilt für ihre Krankenversicherung im Studium?","optionen":["Sie ist über ihre Eltern beitragsfrei in der GKV familienversichert, weil sie jünger als 25 ist.","Sie muss privat versichert bleiben, weil Kinder von Beamten keinen Zugang zur GKV haben.","Sie ist als Studentin versicherungspflichtig, kann sich aber binnen drei Monaten befreien lassen.","Sie kann sich von der Pflicht befreien lassen und die Befreiung später jederzeit widerrufen."],"richtig":[2],"erkl":"Eine Familienversicherung scheidet aus, weil die Eltern keine GKV-Mitglieder sind. Als Studentin ist Lina in der GKV versicherungspflichtig (KVdS). Sie kann sich binnen drei Monaten befreien lassen und über Beihilfe und PKV abgesichert bleiben; die Befreiung kann nicht widerrufen werden.","norm":"§ 5 Abs. 1 Nr. 9, § 8 Abs. 1 Nr. 5 und Abs. 2 SGB V","id":"2.6-1-5"},{"typ":"zuo","frage":"Ordnen Sie jeder studierenden Person ihre Absicherung im Krankheitsfall zu (kein eigenes Einkommen).","paare":[["Studentin, 23, beide Eltern sind Pflichtmitglieder der GKV","beitragsfreie Familienversicherung in der GKV"],["Student, 27, Eltern gesetzlich versichert","Pflichtversicherung als Student (KVdS) mit eigenem Beitrag"],["Student, 21, Eltern Beamte, von der KVdS befreit","Beihilfe und private Restkostenversicherung, ggf. Ausbildungstarif"],["Studentin, 31, ohne besondere Gründe für längeres Studium","freiwillige Versicherung in der GKV oder Versicherung in der PKV"]],"erkl":"Bis 25 hat die Familienversicherung Vorrang vor der Pflichtversicherung als Student. Danach greift die KVdS, in der Regel längstens bis zur Vollendung des 30. Lebensjahres. Befreite Beamtenkinder bleiben über Beihilfe und PKV abgesichert; nach dem Ende der KVdS folgt die freiwillige GKV oder die PKV.","norm":"§ 5 Abs. 1 Nr. 9 und Abs. 7, § 8 Abs. 1 Nr. 5, § 10 Abs. 2 SGB V","id":"2.6-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lea Hartmann (29) und Jonas Hartmann (32) sind verheiratet und wohnen in Halle (Saale). Lea ist Erzieherin, Pflichtmitglied einer Krankenkasse und hat ein regelmäßiges Gesamteinkommen von 3.300 € im Monat. Jonas ist angestellter Softwareentwickler mit einem regelmäßigen Gesamteinkommen von 7.000 € im Monat und seit 2021 bei der Proximus Versicherung AG privat krankenversichert (Krankheitskosten 560 €, Pflegepflicht 48 € im Monat). Am 18.11.2026 kommt ihre Tochter Mila zur Welt. Die Proximus bietet für Mila einen Kindertarif mit demselben Leistungsumfang wie Jonas' Tarif für 150 € im Monat an; in der Pflegepflichtversicherung wäre Mila beitragsfrei.","items":[{"typ":"mc","frage":"Lea möchte Mila beitragsfrei über ihre Krankenkasse familienversichern. Wie beurteilen Sie das?","optionen":["Möglich, weil Lea Pflichtmitglied ist und Kinder immer über die Mutter versichert werden.","Nicht möglich: Die Eltern sind verheiratet, und der privat versicherte Jonas hat mehr als Lea und über 6.450 €.","Möglich, wenn Lea die Familienversicherung binnen zwei Monaten nach der Geburt bei der Kasse anmeldet.","Nicht möglich, weil Kinder eines privat versicherten Elternteils nie gesetzlich versichert sein können."],"richtig":[1],"erkl":"Alle Ausschlussbedingungen liegen vor: Die Eltern sind verheiratet, Jonas ist kein GKV-Mitglied, sein Gesamteinkommen von 7.000 € übersteigt 6.450 € (ein Zwölftel der JAEG 2026) und ist höher als Leas 3.300 €. Wären die Eltern nicht verheiratet oder verdiente Lea mehr, wäre Mila familienversichert.","norm":"§ 10 Abs. 3 SGB V","id":"2.6-2-1"},{"typ":"wf","frage":"Jonas möchte Mila bei der Proximus nachversichern. Welche Aussagen treffen zu?","aussagen":[["Meldet er Mila spätestens am 18.01.2027 an, ist sie rückwirkend ab der Geburt versichert.",true],["Die Proximus darf für Mila wegen eines bei der Geburt festgestellten Herzfehlers einen Risikozuschlag verlangen.",false],["Für Mila gelten keine Wartezeiten.",true],["Mila kann ohne Gesundheitsprüfung zusätzlich einen Einbettzimmertarif erhalten, den Jonas selbst nicht hat.",false],["Die Mindestversicherungsdauer des Elternteils von drei Monaten ist bei Jonas erfüllt.",true]],"erkl":"Die Anmeldung muss spätestens zwei Monate nach dem Tag der Geburt erfolgen, hier bis zum 18.01.2027. Dann besteht Schutz ab Geburt ohne Risikozuschläge und Wartezeiten, aber nur bis zum Umfang von Jonas' Tarif. Jonas ist seit 2021 versichert, die Mindestversicherungsdauer von drei Monaten ist erfüllt.","norm":"§ 198 Abs. 1 und 3 VVG; § 2 Abs. 2 MB/KK 2009; §§ 187, 188 BGB","id":"2.6-2-2"},{"typ":"zahl","frage":"Um wie viel Euro steigt der monatliche Arbeitgeberzuschuss zu Jonas' Krankenversicherung, wenn er Mila bei der Proximus versichert? Höchstzuschuss KV 2026: 508,59 €.","wert":75,"einheit":"€","tol":0.5,"erkl":"Der Zuschuss umfasst auch Angehörige, die bei Versicherungspflicht von Jonas familienversichert wären. Das trifft auf Mila zu: Wäre Jonas GKV-Mitglied, griffe der Ausschluss nach § 10 Abs. 3 SGB V nicht. Bisher: 560 € : 2 = 280 €. Neu: (560 € + 150 €) : 2 = 355 €, das liegt unter 508,59 €. Anstieg: 355 € − 280 € = 75 €. Der PPV-Zuschuss ändert sich nicht, weil Mila dort beitragsfrei ist.","norm":"§ 257 Abs. 2 SGB V","id":"2.6-2-3"}]}],"runde":"zusatz"},{"nr":"2.7","titel":"PKV-Tarife und Pflegeabsicherung","lf":"LF 8","buch":"PV2 3.3 S. 114–128, 3.4 S. 129–145 · Lösungen S. 679–685","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Tarifbaustein der PKV seinen typischen Inhalt zu.","paare":[["Ambulanttarif","Arztbesuche, Arznei- und Heilmittel außerhalb des Krankenhauses"],["Stationärtarif","Behandlung und Unterkunft im Krankenhaus, ggf. Wahlleistungen"],["Zahntarif","Zahnbehandlung, Zahnersatz und Kieferorthopädie"],["Krankentagegeldtarif","Ersatz des Verdienstausfalls bei Arbeitsunfähigkeit"]],"erkl":"Die Krankheitskostenvollversicherung setzt sich aus Bausteinen für ambulante, stationäre und zahnärztliche Leistungen zusammen. Das Krankentagegeld ersetzt dagegen keine Behandlungskosten, sondern den Verdienstausfall.","norm":"MB/KK 2009 § 1; MB/KT 2009 § 1; Tarifbedingungen der Proximus","id":"2.7-1-1"},{"typ":"mc","frage":"Wozu dient die Alterungsrückstellung in der privaten Krankenversicherung?","optionen":["Beiträge aus jungen Jahren werden angespart, damit der Beitrag nicht allein wegen des Alters steigt.","Sie ist ein Sparguthaben, das der Kunde bei einer Kündigung vollständig in bar ausgezahlt bekommt.","Sie deckt alle Kostensteigerungen im Gesundheitswesen, sodass Beitragsanpassungen ausgeschlossen sind.","Sie finanziert die Leistungen für Kinder, die in der PKV beitragsfrei mitversichert sind."],"richtig":[0],"erkl":"Die PKV kalkuliert nach Art der Lebensversicherung: In jungen Jahren zahlt der Kunde mehr, als sein Risiko kostet; daraus wird die Alterungsrückstellung gebildet. Sie wird nicht ausgezahlt, und Anpassungen wegen steigender Kosten bleiben möglich. Bei Verträgen ab 2009 wird bei einem Wechsel des Versicherers nur ein Übertragungswert im Umfang des Basistarifs mitgegeben.","norm":"§ 146 Abs. 1 VAG; § 203 Abs. 2, § 204 Abs. 1 Nr. 2 VVG","id":"2.7-1-2"},{"typ":"mc","frage":"Worin unterscheiden sich Selbstbehalt und Beitragsrückerstattung in der PKV?","optionen":["Beide senken den laufenden Monatsbeitrag; die Rückerstattung ist zusätzlich jedes Jahr fest garantiert.","Der Selbstbehalt gilt je Behandlung; die Rückerstattung gibt es auch, wenn Rechnungen eingereicht wurden.","Der Selbstbehalt erhöht den Beitrag; die Rückerstattung wird nur bei Kündigung des Vertrags ausgezahlt.","Der Selbstbehalt senkt den Beitrag sicher; die Rückerstattung gibt es nur in leistungsfreien Kalenderjahren."],"richtig":[3],"erkl":"Mit einem Selbstbehalt trägt der Kunde Kosten bis zu einem Jahresbetrag selbst und zahlt dafür einen niedrigeren Beitrag. Die Beitragsrückerstattung gibt es nur, wenn im Kalenderjahr keine Leistungen bezogen wurden; sie ist meist erfolgsabhängig und nicht garantiert.","norm":"Tarifbedingungen der Proximus (Selbstbehalt, Beitragsrückerstattung)","id":"2.7-1-3"},{"typ":"wf","frage":"Welche Aussagen zur Pflegeversicherung treffen zu?","aussagen":[["Wer privat krankenvollversichert ist, muss eine private Pflegepflichtversicherung abschließen.",true],["Die Leistungen der privaten Pflegepflichtversicherung müssen denen der sozialen Pflegeversicherung gleichwertig sein.",true],["Pflegebedürftige werden in fünf Pflegegrade eingestuft; Pflegegrad 5 bedeutet die schwerste Beeinträchtigung.",true],["Die Pflegepflichtversicherung übernimmt die Kosten eines Pflegeheims in der Regel vollständig.",false],["Der Beitrag zur privaten Pflegepflichtversicherung richtet sich nach dem Einkommen der versicherten Person.",false]],"erkl":"Die Pflegeversicherung folgt der Krankenversicherung: PKV-Versicherte schließen eine private Pflegepflichtversicherung mit gleichwertigen Leistungen ab. Sie ist eine Teilabsicherung, deshalb bleibt im Heim ein hoher Eigenanteil. Der private Beitrag richtet sich nicht nach dem Einkommen.","norm":"§§ 15, 23 Abs. 1, § 110 SGB XI","id":"2.7-1-4"},{"typ":"zuo","frage":"Ordnen Sie jeder Form der privaten Pflegezusatzversicherung ihr Merkmal zu.","paare":[["Pflegetagegeld","fester Betrag je Tag nach Pflegegrad, frei verwendbar"],["Pflegekostenversicherung","Erstattung nachgewiesener Pflegekosten nach Vorleistung der Pflegepflichtversicherung"],["Pflegerentenversicherung","monatliche Rente bei Pflegebedürftigkeit, Vertrag nach Art der Lebensversicherung"],["geförderte Pflegevorsorge (Pflege-Bahr)","staatliche Zulage von 5 € im Monat, ohne Gesundheitsprüfung"]],"erkl":"Pflegetagegeld und Pflegerente zahlen feste Beträge ohne Kostennachweis; die Pflegekostenversicherung erstattet Kosten, die nach der Pflegepflichtversicherung übrig bleiben. Bei der geförderten Pflegevorsorge gibt es 5 € Zulage im Monat; der Versicherer darf niemanden wegen Vorerkrankungen ablehnen.","norm":"§§ 126–130 SGB XI; Musterbedingungen (MB/EPV)","id":"2.7-1-5"},{"typ":"mc","frage":"Ein 35-jähriger PKV-Kunde fragt nach einem Beitragsentlastungstarif. Was trifft zu?","optionen":["Er erhält ab dem vereinbarten Alter die angesparten Beiträge als einmalige Kapitalzahlung.","Er zahlt bis zum vereinbarten Alter einen Zusatzbeitrag; danach sinkt sein Beitrag um einen festen Betrag.","Der Versicherer senkt den Beitrag sofort, verlangt dafür aber im Rentenalter einen höheren Selbstbehalt.","Sein Arbeitgeber zahlt ab dem Rentenbeginn dauerhaft die Hälfte des PKV-Beitrags als Zuschuss weiter."],"richtig":[1],"erkl":"Mit dem Beitragsentlastungstarif spart der Kunde in der Erwerbsphase zusätzlich an. Ab dem vereinbarten Alter (z. B. 67) sinkt sein Beitrag um den vereinbarten Betrag; ausgezahlt wird nichts. Daneben dämpft der gesetzliche Zuschlag von 10 % (ab dem Jahr nach Vollendung des 21. bis zum Jahr der Vollendung des 60. Lebensjahres) Beitragssteigerungen im Alter.","norm":"Tarifbedingungen der Proximus (Beitragsentlastungstarif); §§ 149, 150 VAG","id":"2.7-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sabine Wolter (44) ist selbstständige Steuerberaterin in Halle (Saale) und seit zwölf Jahren bei der Proximus Versicherung AG privat krankenversichert. Ihr Krankheitskostentarif kostet 420 € im Monat und hat einen Selbstbehalt von 900 € je Kalenderjahr für ambulante Leistungen. Für das Kalenderjahr 2026 hat die Proximus bei Leistungsfreiheit eine Beitragsrückerstattung von drei Monatsbeiträgen beschlossen. 2026 hat sie bisher ambulante Rechnungen über 1.640 € gesammelt, die nach dem Tarif voll erstattungsfähig sind. Außerdem interessiert sie sich für ein Pflegetagegeld: Der Tarif zahlt in Pflegegrad 5 täglich 50 €, in Pflegegrad 4 davon 80 %, in Pflegegrad 3 60 %, in Pflegegrad 2 30 % und in Pflegegrad 1 10 %. Ihr Beitrag ist ihr insgesamt zu hoch.","items":[{"typ":"zahl","frage":"Um wie viel Euro steht Frau Wolter besser, wenn sie die Rechnungen über 1.640 € selbst bezahlt und die Beitragsrückerstattung erhält, statt sie einzureichen? Es kommen 2026 keine weiteren Rechnungen hinzu; steuerliche Wirkungen bleiben außer Betracht.","wert":520,"einheit":"€","tol":0.5,"erkl":"Einreichen: Erstattung 1.640 € − 900 € Selbstbehalt = 740 €; die Rückerstattung entfällt. Nicht einreichen: Rückerstattung 3 × 420 € = 1.260 €. Vorteil des Selbstzahlens: 1.260 € − 740 € = 520 €.","norm":"Tarifbedingungen der Proximus (Selbstbehalt, Beitragsrückerstattung)","id":"2.7-2-1"},{"typ":"mc","frage":"Was empfehlen Sie Frau Wolter zum Umgang mit ihren Arztrechnungen?","optionen":["Sofort alle Rechnungen einreichen, weil sonst ihre Erstattungsansprüche für 2026 verfallen.","Nur die Rechnungen über dem Selbstbehalt einreichen; so bleibt die Rückerstattung erhalten.","Rechnungen sammeln und nur dann einreichen, wenn ihre Jahressumme 2.160 € übersteigt.","Die Rechnungen einreichen und die Rückerstattung im Folgejahr zusätzlich beantragen."],"richtig":[2],"erkl":"Einreichen lohnt sich erst, wenn die Erstattung (Rechnungen minus 900 €) größer ist als die Rückerstattung von 1.260 €, also ab einer Jahressumme über 900 € + 1.260 € = 2.160 €. Jede Erstattung lässt die Rückerstattung entfallen. Der Erstattungsanspruch verfällt nicht sofort (Verjährung erst nach drei Jahren), deshalb kann sie bis zum Jahresende sammeln.","norm":"Tarifbedingungen der Proximus; § 195 BGB","id":"2.7-2-2"},{"typ":"zahl","frage":"Welche Monatsleistung (30 Tage) würde das Pflegetagegeld bei Pflegegrad 3 zahlen?","wert":900,"einheit":"€","tol":0.5,"erkl":"In Pflegegrad 3 zahlt der Tarif 60 % von 50 €, also 30 € je Tag. Für 30 Tage: 30 € × 30 = 900 €. Das Geld ist frei verwendbar, z. B. für den Eigenanteil im Pflegeheim oder für Angehörige, die pflegen.","norm":"Tarifbedingungen der Proximus (Pflegetagegeld); Musterbedingungen (MB/EPV)","id":"2.7-2-3"},{"typ":"mc","frage":"Frau Wolter möchte ihren Beitrag senken. Welchen Weg empfehlen Sie ihr?","optionen":["Wechsel in einen Proximus-Tarif mit höherem Selbstbehalt; die Alterungsrückstellung wird angerechnet.","Wechsel zu einem anderen Versicherer, der die gesamte Alterungsrückstellung vollständig übernimmt.","Rückkehr in die GKV als Pflichtmitglied, weil Selbstständige jederzeit in die GKV wechseln dürfen.","Kündigung der Pflegepflichtversicherung, weil für Selbstständige keine Pflicht zur Pflegeversicherung gilt."],"richtig":[0],"erkl":"Beim Tarifwechsel innerhalb der Proximus werden erworbene Rechte und die Alterungsrückstellung angerechnet; nur für Mehrleistungen darf eine Gesundheitsprüfung verlangt werden. Bei einem anderen Versicherer würde nur ein Übertragungswert im Umfang des Basistarifs mitgehen (ihr Vertrag stammt aus der Zeit nach 2009). Selbstständige werden nicht GKV-pflichtig, und als PKV-Versicherte muss sie eine Pflegepflichtversicherung haben.","norm":"§ 204 Abs. 1 VVG; § 5 Abs. 5 SGB V; § 23 SGB XI","id":"2.7-2-4"}]}],"runde":"zusatz"}]},{"nr":"3","titel":"Für das Alter vorsorgen und Vermögen bilden","lf":"LF 11, LF 10","abschnitte":[{"nr":"3.1","titel":"Drei-Schichten-Modell und Basisvorsorge","lf":"LF 11","buch":"PV2 4.1–4.2 S. 156–168 · Lösungen S. 687–690","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Vorsorgeprodukt die passende Schicht des Drei-Schichten-Modells zu.","paare":[["Gesetzliche Rente und Basisrente (Rürup)","Schicht 1: Basisversorgung"],["Riester-Rente und betriebliche Altersversorgung","Schicht 2: Zusatzversorgung"],["Private Rentenversicherung und Investmentfonds","Schicht 3: Kapitalanlageprodukte"]],"erkl":"Das Drei-Schichten-Modell ordnet die Altersvorsorge nach der steuerlichen Behandlung: Schicht 1 nachgelagert und streng zweckgebunden, Schicht 2 staatlich gefördert, Schicht 3 aus versteuertem Einkommen.","norm":"§ 10 Abs. 1 Nr. 2, § 10a, § 22 EStG","id":"3.1-1-1"},{"typ":"mc","frage":"Wie werden Beiträge zu einer Basisrente im Jahr 2026 steuerlich berücksichtigt?","optionen":["Zu 100 % als Sonderausgaben, begrenzt auf den jährlichen Höchstbetrag.","Zu 94 % als Sonderausgaben, begrenzt auf den jährlichen Höchstbetrag.","Nur bis 2.100 € jährlich als zusätzliche Sonderausgaben nach § 10a EStG.","In voller Höhe als Werbungskosten bei den Einkünften aus Arbeit."],"richtig":[0],"erkl":"Seit 2023 sind Altersvorsorgeaufwendungen der Schicht 1 zu 100 % als Sonderausgaben abziehbar (vorher stufenweiser Anstieg). Die Grenze von 2.100 € gilt für Riester (§ 10a EStG).","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b, Abs. 3 EStG","id":"3.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Basisrente treffen zu?","aussagen":[["Der Anspruch ist nicht vererblich, nicht übertragbar, nicht beleihbar und nicht veräußerbar.",true],["Bei Rentenbeginn kann sich der Kunde das Guthaben auf einmal auszahlen lassen.",false],["Die Rente darf bei Neuverträgen frühestens mit Vollendung des 62. Lebensjahres beginnen.",true],["Die Beiträge werden aus versteuertem Einkommen gezahlt, die Rente ist steuerfrei.",false],["Die Leistung wird als lebenslange monatliche Leibrente gezahlt.",true]],"erkl":"Die Förderung setzt eine streng zweckgebundene, lebenslange Rente voraus; eine Kapitalisierung ist ausgeschlossen. Die Beiträge sind abziehbar, die Rente wird nachgelagert besteuert.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b EStG","id":"3.1-1-3"},{"typ":"mc","frage":"Mit welchem Besteuerungsanteil wird eine Rente aus der Basisversorgung besteuert, die im Jahr 2026 erstmals gezahlt wird?","optionen":["82,5 %, weil der Anteil seit 2023 dauerhaft festgeschrieben ist.","84 %, weil der Anteil ab 2023 jährlich um 0,5 Punkte steigt.","100 %, weil seit 2023 für neue Renten die volle Besteuerung gilt.","17 %, weil der Ertragsanteil für 67-Jährige gilt."],"richtig":[1],"erkl":"Nach dem Wachstumschancengesetz steigt der Besteuerungsanteil ab 2023 (82,5 %) jährlich um 0,5 Prozentpunkte: 2026 also 84 %. Der steuerfreie Teil wird als fester Rentenfreibetrag festgeschrieben.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. aa EStG","id":"3.1-1-4"},{"typ":"zahl","frage":"Ein lediger Angestellter zahlt 2026 zur gesetzlichen Rentenversicherung insgesamt 9.300 € (Arbeitnehmer- und Arbeitgeberanteil je 4.650 €) und 12.000 € in eine Basisrente. Höchstbetrag 2026 (vorgegeben): 30.826 €. Der steuerfreie Arbeitgeberanteil wird vom abziehbaren Betrag abgezogen. Wie viel Euro kann er als Sonderausgaben abziehen?","wert":16650,"einheit":"€","tol":0.5,"erkl":"Summe Altersvorsorgeaufwendungen 9.300 + 12.000 = 21.300 € (unter dem Höchstbetrag), davon 100 % = 21.300 €; abzüglich steuerfreier Arbeitgeberanteil 4.650 € = 16.650 €.","norm":"§ 10 Abs. 3 EStG","id":"3.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lena Hoffmann (38) aus Halle (Saale) ist selbstständige Grafikdesignerin und nicht rentenversicherungspflichtig. Sie möchte ab 2026 jährlich 8.000 € in eine Basisrente der Proximus Versicherung AG einzahlen. Ihr Grenzsteuersatz beträgt (vereinfacht) 35 %. Rentenbeginn soll 2055 mit 67 sein.","items":[{"typ":"zahl","frage":"Um wie viel Euro sinkt die Einkommensteuer von Frau Hoffmann im Jahr 2026 durch die Basisrentenbeiträge ungefähr?","wert":2800,"einheit":"€","tol":0.5,"erkl":"Die 8.000 € liegen unter dem Höchstbetrag und sind zu 100 % abziehbar: 8.000 € × 35 % = 2.800 € Steuerersparnis.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b, Abs. 3 EStG","id":"3.1-2-1"},{"typ":"mc","frage":"Frau Hoffmann fragt, ob sie sich das angesparte Kapital mit 67 auf einmal auszahlen lassen kann. Was antworten Sie?","optionen":["Ja, sie kann bei Rentenbeginn jederzeit ein volles Kapitalwahlrecht ausüben.","Ja, aber nur bis zu 30 % des Guthabens als steuerfreie Einmalzahlung.","Nein, die Basisrente wird nur als lebenslange monatliche Rente gezahlt.","Nein, das Kapital fällt bei Rentenbeginn an die Rentenversicherung."],"richtig":[2],"erkl":"Eine Kapitalisierung ist bei der Basisrente ausgeschlossen. Nur Kleinbetragsrenten dürfen abgefunden werden.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b EStG","id":"3.1-2-2"},{"typ":"mc","frage":"Mit welchem Besteuerungsanteil wird ihre Rente bei Rentenbeginn 2055 nach heutiger Rechtslage besteuert?","optionen":["Mit 84 %, weil der Anteil des Abschlussjahres maßgeblich bleibt.","Mit 100 %, weil die volle Besteuerung bereits ab 2040 gilt.","Mit 17 %, weil für private Renten der Ertragsanteil gilt.","Mit 98,5 %, weil der Anteil des Jahres des Rentenbeginns zählt."],"richtig":[3],"erkl":"Maßgeblich ist das Jahr des Rentenbeginns: 84 % (2026) + 29 Jahre × 0,5 Punkte = 98,5 %. Die volle Besteuerung gilt erst ab Rentenbeginn 2058.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. aa EStG","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Private Rentenversicherung","lf":"LF 11","buch":"PV2 4.3 S. 169–182 · Lösungen S. 690–691","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Baustein einer Leibrentenversicherung mit aufgeschobener Rentenzahlung die passende Beschreibung zu.","paare":[["Aufschubzeit","Ansparphase vom Vertragsbeginn bis zum Rentenbeginn"],["Rentengarantiezeit","Rente wird bei Tod nach Rentenbeginn bis zum Ende dieser Zeit weitergezahlt"],["Beitragsrückgewähr","Bei Tod vor Rentenbeginn werden die gezahlten Beiträge erstattet"],["Kapitalwahlrecht","Statt der Rente wird zum Rentenbeginn eine einmalige Summe gezahlt"]],"erkl":"Die Bausteine bestimmen, was bei Tod vor oder nach Rentenbeginn geschieht und ob statt der Rente Kapital gezahlt werden kann. Jede Zusatzleistung verteuert den Beitrag.","norm":"Musterbedingungen (AVB Rentenversicherung)","id":"3.2-1-1"},{"typ":"mc","frage":"Wie wird die laufende Rente aus einer privaten Leibrentenversicherung (Schicht 3) besteuert?","optionen":["Nur mit dem Ertragsanteil, der vom Alter bei Rentenbeginn abhängt.","Mit dem Besteuerungsanteil des Jahres, in dem die Rente beginnt.","Mit 25 % Abgeltungsteuer auf den gesamten jährlichen Rentenbetrag.","Gar nicht, weil die Beiträge aus versteuertem Geld gezahlt wurden."],"richtig":[0],"erkl":"Private Leibrenten gelten nur in Höhe des Ertragsanteils als Einkünfte, z. B. 18 % bei Rentenbeginn mit 65 und 17 % mit 67. Der Besteuerungsanteil gilt für die Basisversorgung.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG","id":"3.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Überschussbeteiligung und zum Garantiezins treffen zu?","aussagen":[["Der Versicherungsnehmer hat einen gesetzlichen Anspruch auf Beteiligung an den Überschüssen.",true],["Die Überschussanteile sind bei Vertragsschluss in fester Höhe garantiert.",false],["Bei Vertragsende wird der Kunde zur Hälfte an den ihm zugeordneten Bewertungsreserven beteiligt.",true],["Der Höchstrechnungszins für Neuverträge beträgt seit 2025 1,0 %.",true],["Der Garantiezins wird auf den gesamten Beitrag einschließlich der Kosten gewährt.",false]],"erkl":"Überschüsse sind nicht garantiert, der Anspruch auf Beteiligung aber schon. Der Rechnungszins wirkt nur auf den Sparanteil des Beitrags.","norm":"§ 153 Abs. 1 und 3 VVG; DeckRV","id":"3.2-1-3"},{"typ":"mc","frage":"Welche Form der Überschussverwendung erhöht die versicherte Rente sofort und dauerhaft, ohne dass der Beitrag steigt?","optionen":["Die verzinsliche Ansammlung der Überschussanteile.","Die Bonusrente als beitragsfreie Zusatzrente.","Die Verrechnung der Überschüsse mit dem Beitrag.","Die Auszahlung der Überschüsse als Schlussbonus."],"richtig":[1],"erkl":"Bei der Bonusrente kaufen die Überschüsse eine zusätzliche, garantierte Rente. Verrechnung senkt den Beitrag, Ansammlung erhöht das Guthaben.","norm":"§ 153 VVG; Musterbedingungen (AVB Rentenversicherung)","id":"3.2-1-4"},{"typ":"zahl","frage":"Eine private Leibrentenversicherung zahlt ab Rentenbeginn mit 65 Jahren monatlich 400 €. Ertragsanteil bei Rentenbeginn mit 65: 18 % (vorgegeben). Welcher Betrag der Jahresrente ist als sonstige Einkünfte steuerpflichtig?","wert":864,"einheit":"€","tol":0.5,"erkl":"Jahresrente 400 € × 12 = 4.800 €; steuerpflichtiger Ertragsanteil 4.800 € × 18 % = 864 €.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG","id":"3.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Tobias Krämer (35) aus Halle (Saale) ist Angestellter und möchte bei der Proximus Versicherung AG eine Leibrentenversicherung mit aufgeschobener Rentenzahlung abschließen. Rentenbeginn mit 67, gewünschte garantierte Monatsrente 500 €, Rentengarantiezeit 10 Jahre, Beitragsrückgewähr bei Tod in der Aufschubzeit. Laut Tarif kosten je 100 € garantierter Monatsrente 41,20 € Monatsbeitrag (einschließlich Garantiezeit und Beitragsrückgewähr).","items":[{"typ":"zahl","frage":"Wie hoch ist der monatliche Beitrag für Herrn Krämer?","wert":206,"einheit":"€","tol":0.5,"erkl":"Beitrag = gewünschte Rente / 100 × Tarifwert: 500 € / 100 × 41,20 € = 5 × 41,20 € = 206,00 €.","norm":"Tarifkalkulation; § 153 VVG","id":"3.2-2-1"},{"typ":"mc","frage":"Herr Krämer stirbt drei Jahre nach Rentenbeginn mit 70. Was geschieht mit der Rente?","optionen":["Die Rente endet sofort, weil sie nur bis zum Tod gezahlt wird.","Die gezahlten Beiträge abzüglich der Renten werden erstattet.","Die Rente wird noch sieben Jahre an den Bezugsberechtigten gezahlt.","Die Rente wird lebenslang an seine Ehefrau weitergezahlt."],"richtig":[2],"erkl":"Die Rentengarantiezeit von 10 Jahren läuft ab Rentenbeginn: Nach 3 gezahlten Jahren wird die Rente noch 7 Jahre weitergezahlt. Die Beitragsrückgewähr gilt nur bei Tod in der Aufschubzeit.","norm":"Musterbedingungen (AVB Rentenversicherung)","id":"3.2-2-2"},{"typ":"mc","frage":"Herr Krämer überlegt, mit 67 das Kapitalwahlrecht auszuüben. Wie wird die Kapitalauszahlung besteuert?","optionen":["Wie die Rente nur mit dem Ertragsanteil von 17 % der Summe.","Gar nicht, weil Auszahlungen aus Versicherungen steuerfrei sind.","Voll mit dem persönlichen Steuersatz auf die ganze Auszahlung.","Nach § 20 EStG; bei 12 Jahren Laufzeit und 62 Jahren nur hälftig."],"richtig":[3],"erkl":"Kapitalleistungen aus Rentenversicherungen sind Kapitalerträge: Versteuert wird der Unterschied zwischen Auszahlung und Beiträgen, nach der 12/62-Regel nur zur Hälfte mit dem persönlichen Steuersatz.","norm":"§ 20 Abs. 1 Nr. 6 EStG","id":"3.2-2-3"}]}]},{"nr":"3.3","titel":"Kapitallebensversicherung, Riester-Rente und betriebliche Altersversorgung","lf":"LF 11","buch":"PV2 4.4–4.8 S. 183–211 · Lösungen S. 691–695","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Unter welchen Voraussetzungen wird der Ertrag aus einer ab 2012 abgeschlossenen Kapitallebensversicherung nur zur Hälfte besteuert?","optionen":["Laufzeit mindestens 12 Jahre und Auszahlung nach dem 62. Geburtstag.","Laufzeit mindestens 5 Jahre und Auszahlung nach dem 60. Geburtstag.","Laufzeit mindestens 12 Jahre und Auszahlung nach dem 60. Geburtstag.","Laufzeit mindestens 10 Jahre und Auszahlung nach dem 67. Geburtstag."],"richtig":[0],"erkl":"Nach der 12/62-Regel wird bei Neuverträgen ab 2012 nur die Hälfte des Unterschiedsbetrags mit dem persönlichen Steuersatz versteuert. Für Verträge von 2005 bis 2011 galt die Altersgrenze 60.","norm":"§ 20 Abs. 1 Nr. 6 Satz 2 EStG","id":"3.3-1-1"},{"typ":"zahl","frage":"Eine Kapitallebensversicherung (Laufzeit 25 Jahre) zahlt der 63-jährigen Kundin 58.000 € aus. Sie hat insgesamt 40.000 € Beiträge gezahlt. Welcher Betrag ist mit ihrem persönlichen Steuersatz zu versteuern?","wert":9000,"einheit":"€","tol":0.5,"erkl":"Unterschiedsbetrag 58.000 € − 40.000 € = 18.000 €; nach der 12/62-Regel steuerpflichtig zur Hälfte: 9.000 €.","norm":"§ 20 Abs. 1 Nr. 6 EStG","id":"3.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Durchführungsweg der betrieblichen Altersversorgung das passende Merkmal zu.","paare":[["Direktzusage","Der Arbeitgeber zahlt die Rente selbst und bildet dafür Rückstellungen."],["Unterstützungskasse","Versorgungseinrichtung, gegen die kein Rechtsanspruch des Arbeitnehmers besteht."],["Direktversicherung","Lebensversicherung des Arbeitgebers auf das Leben des Arbeitnehmers."],["Pensionsfonds","Einrichtung mit größerer Freiheit bei der Kapitalanlage, z. B. höherer Aktienanteil."]],"erkl":"Es gibt fünf Durchführungswege; neben den genannten die Pensionskasse. Bei der Unterstützungskasse richtet sich der Anspruch letztlich gegen den Arbeitgeber.","norm":"§ 1b BetrAVG","id":"3.3-1-3"},{"typ":"mc","frage":"Eine rentenversicherungspflichtige Mutter zweier Kinder (geboren 2015 und 2018) zahlt den Mindesteigenbeitrag in einen Riester-Vertrag. Grundzulage 175 €, Kinderzulage 300 € je Kind (vorgegeben). Wie hoch sind ihre Zulagen 2026 insgesamt?","optionen":["545 €","775 €","475 €","950 €"],"richtig":[1],"erkl":"Grundzulage 175 € + 2 × 300 € Kinderzulage (Kinder ab 2008 geboren) = 775 €. 545 € ergäbe sich mit der alten Kinderzulage von 185 €.","norm":"§§ 84, 85 EStG","id":"3.3-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Entgeltumwandlung treffen zu?","aussagen":[["Arbeitnehmer haben einen Rechtsanspruch auf Entgeltumwandlung.",true],["Bei Direktversicherung, Pensionskasse und Pensionsfonds muss der Arbeitgeber 15 % des umgewandelten Betrags zuschießen, soweit er Sozialabgaben spart.",true],["Beiträge an eine Direktversicherung sind bis 8 % der Beitragsbemessungsgrenze der Rentenversicherung steuerfrei.",true],["Beiträge bis 8 % der Beitragsbemessungsgrenze sind auch in voller Höhe sozialversicherungsfrei.",false],["Die späteren Leistungen aus der Direktversicherung sind steuerfrei.",false]],"erkl":"Steuerfrei sind 8 %, sozialversicherungsfrei nur 4 % der BBG. Weil die Beiträge steuerfrei waren, werden die Leistungen nachgelagert voll versteuert.","norm":"§ 1a BetrAVG; § 3 Nr. 63, § 22 Nr. 5 EStG","id":"3.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sabine Wolf (32) aus Halle (Saale) ist rentenversicherungspflichtige Bürokauffrau. Ihr Bruttoeinkommen 2025 betrug 36.000 €. Sie hat zwei Kinder (geboren 2016 und 2019) und möchte einen Riester-Vertrag bei der Proximus Versicherung AG abschließen. Ihr Arbeitgeber bietet zusätzlich eine Entgeltumwandlung über eine Direktversicherung an. Vorgaben 2026: Grundzulage 175 €, Kinderzulage 300 € je Kind, Mindesteigenbeitrag 4 % des Vorjahreseinkommens (höchstens 2.100 €) abzüglich Zulagen, Sockelbetrag 60 €; Beitragsbemessungsgrenze der Rentenversicherung 101.400 € jährlich.","items":[{"typ":"zahl","frage":"Wie hoch ist der jährliche Mindesteigenbeitrag, den Frau Wolf 2026 zahlen muss, um die vollen Zulagen zu erhalten?","wert":665,"einheit":"€","tol":0.5,"erkl":"4 % von 36.000 € = 1.440 €; abzüglich Zulagen 175 € + 2 × 300 € = 775 € ergibt 665 € (über dem Sockelbetrag von 60 €).","norm":"§ 86 EStG","id":"3.3-2-1"},{"typ":"mc","frage":"Bis zu welchem Jahresbetrag kann Frau Wolf 2026 Beiträge zur Direktversicherung steuerfrei aus ihrem Bruttolohn zahlen?","optionen":["4.056 €, das sind 4 % der Beitragsbemessungsgrenze.","2.100 €, das ist der Höchstbetrag der Riester-Förderung.","8.112 €, das sind 8 % der Beitragsbemessungsgrenze.","2.880 €, das sind 8 % des Vorjahresbruttoeinkommens."],"richtig":[2],"erkl":"Steuerfrei sind 8 % der BBG der Rentenversicherung: 101.400 € × 8 % = 8.112 €. Sozialversicherungsfrei sind nur 4 % = 4.056 €.","norm":"§ 3 Nr. 63 EStG; § 1 Abs. 1 Nr. 9 SvEV","id":"3.3-2-2"},{"typ":"mc","frage":"Frau Wolf wandelt monatlich 100 € ihres Bruttolohns in die Direktversicherung um. Ihr Arbeitgeber spart dadurch Sozialabgaben. Welchen Zuschuss muss der Arbeitgeber mindestens zahlen?","optionen":["Keinen, weil der Zuschuss bei Direktversicherungen freiwillig ist.","50 € monatlich, weil er die Hälfte der Beiträge tragen muss.","20 € monatlich, weil er den vollen Arbeitgeberanteil weitergibt.","15 € monatlich, das sind 15 % des umgewandelten Entgelts."],"richtig":[3],"erkl":"Der Arbeitgeber muss 15 % des umgewandelten Entgelts zuschießen, soweit er Sozialversicherungsbeiträge spart: 100 € × 15 % = 15 €.","norm":"§ 1a Abs. 1a BetrAVG","id":"3.3-2-3"}]}]},{"nr":"3.4","titel":"Investmentfonds","lf":"LF 10","buch":"PV2 5.1–5.2 S. 212–253 · Lösungen S. 695–702","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Fondskategorie das passende Merkmal zu.","paare":[["Aktienfonds","legt überwiegend in Aktien an: hohe Ertragschancen, starke Kursschwankungen"],["Rentenfonds","legt überwiegend in verzinslichen Wertpapieren an"],["Offener Immobilienfonds","Gewerbeimmobilien; Mindesthaltedauer und Kündigungsfrist bei Rückgabe"],["Geldmarktfonds","kurzfristige Anlagen wie Termingelder; geringe Schwankungen"],["Dachfonds","legt das Fondsvermögen in Anteilen anderer Investmentfonds an"]],"erkl":"Fondskategorien unterscheiden sich nach den Vermögensgegenständen. Mischfonds kombinieren Aktien und Anleihen; offene Immobilienfonds haben 24 Monate Mindesthaltedauer und 12 Monate Kündigungsfrist.","norm":"KAGB, § 255 KAGB","id":"3.4-1-1"},{"typ":"mc","frage":"Die Kapitalverwaltungsgesellschaft (KVG) eines Aktienfonds wird insolvent. Was gilt für das Geld der Anleger?","optionen":["Das Sondervermögen gehört nicht zur Insolvenzmasse; die Verwahrstelle wickelt ab.","Die Anleger erhalten aus der Einlagensicherung höchstens 100.000 € zurück.","Das Fondsvermögen fällt in die Insolvenzmasse; Anleger sind einfache Gläubiger.","Die Anteile verfallen, weil die KVG Eigentümerin der Wertpapiere ist."],"richtig":[0],"erkl":"Das Fondsvermögen ist Sondervermögen und von dem Vermögen der KVG getrennt. Es wird bei einer Verwahrstelle verwahrt und ist vor der Insolvenz der KVG geschützt.","norm":"§§ 92, 99, 100 KAGB","id":"3.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zu börsengehandelten Indexfonds (ETF) treffen zu?","aussagen":[["Ein ETF bildet einen Index wie den MSCI World möglichst genau nach.",true],["ETF haben meist eine deutlich niedrigere laufende Kostenquote (TER) als aktiv gemanagte Fonds.",true],["Ein Fondsmanager versucht, durch Einzelauswahl den Index zu schlagen.",false],["ETF-Anteile können über die Börse während der Handelszeit gekauft und verkauft werden.",true],["Ein Aktien-ETF ist kein Sondervermögen und daher bei Insolvenz nicht geschützt.",false]],"erkl":"ETF werden passiv verwaltet und sind wie andere offene Publikumsfonds Sondervermögen. Sie werden über die Börse gehandelt, meist ohne Ausgabeaufschlag.","norm":"KAGB","id":"3.4-1-3"},{"typ":"zahl","frage":"Ein Fonds hat Vermögensgegenstände im Wert von 250 Mio. € und Verbindlichkeiten von 2 Mio. €. Es sind 4 Mio. Anteile im Umlauf. Der Ausgabeaufschlag beträgt 5 %. Wie hoch ist der Ausgabepreis je Anteil?","wert":65.1,"einheit":"€","tol":0.01,"erkl":"Inventarwert je Anteil (Rücknahmepreis) = (250 − 2) Mio. € / 4 Mio. = 62,00 €; Ausgabepreis = 62,00 € × 1,05 = 65,10 €.","norm":"§ 168 KAGB","id":"3.4-1-4"},{"typ":"mc","frage":"Welcher Nachteil eines Dachfonds ist im Beratungsgespräch besonders anzusprechen?","optionen":["Er kann nur über die Börse und nie direkt bei der KVG gekauft werden.","Es fallen Kosten doppelt an: im Dachfonds und in den Zielfonds.","Er streut das Risiko schlechter als ein einzelner Aktienfonds.","Er ist kein Sondervermögen und bei Insolvenz nicht geschützt."],"richtig":[1],"erkl":"Ein Dachfonds streut sehr breit über mehrere Zielfonds. Dafür zahlt der Anleger die Verwaltungskosten auf beiden Ebenen.","norm":"KAGB","id":"3.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Jonas Becker (29) aus Halle (Saale) möchte über die Proximus Versicherung AG Vermögen aufbauen. Er überlegt, monatlich 150 € per Sparplan in einen Aktien-ETF ohne Ausgabeaufschlag (TER 0,2 %) zu investieren. Alternativ erwägt er eine Einmalanlage von 10.000 € in einen aktiv gemanagten Aktienfonds (Ausgabeaufschlag 5 %, TER 1,6 %). Der ETF-Anteil kostete in den ersten vier Monaten 30 €, 25 €, 20 € und 25 €.","items":[{"typ":"zahl","frage":"Welchen durchschnittlichen Preis je Anteil hat Herr Becker nach vier Sparraten gezahlt (Cost-Average-Effekt)? Runden Sie auf zwei Stellen.","wert":24.49,"einheit":"€","tol":0.01,"erkl":"Anteile: 150/30 = 5; 150/25 = 6; 150/20 = 7,5; 150/25 = 6 → 24,5 Anteile. Durchschnittspreis = 600 € / 24,5 = 24,49 €; er liegt unter dem Durchschnittskurs von 25,00 €.","norm":"Cost-Average-Effekt","id":"3.4-2-1"},{"typ":"mc","frage":"Herr Becker fragt, warum eine Anlage in einen offenen Aktienfonds für ihn sinnvoller sein kann als der Kauf einzelner Aktien. Was ist das beste Argument?","optionen":["Der Fonds garantiert ihm am Ende mindestens die eingezahlten Beiträge.","Der Fonds zahlt jedes Jahr einen festen Zins auf das angelegte Geld.","Schon kleine Beträge werden breit gestreut und professionell verwaltet.","Der Fonds ist von der Abgeltungsteuer vollständig befreit."],"richtig":[2],"erkl":"Offene Investmentvermögen bieten Risikostreuung, professionelles Management, tägliche Rückgabe und Insolvenzschutz. Eine Garantie oder einen festen Zins gibt es nicht.","norm":"KAGB; § 64 WpHG","id":"3.4-2-2"},{"typ":"zahl","frage":"Bei der Einmalanlage in den aktiv gemanagten Fonds sind die 10.000 € der gesamte Anlagebetrag einschließlich Ausgabeaufschlag (5 % auf den Anteilwert). Wie viel Euro davon entfallen auf den Ausgabeaufschlag?","wert":476.19,"einheit":"€","tol":0.5,"erkl":"Angelegter Betrag = 10.000 € / 1,05 = 9.523,81 €; Ausgabeaufschlag = 10.000 € − 9.523,81 € = 476,19 €. Der Aufschlag bezieht sich auf den Anteilwert, nicht auf den Anlagebetrag.","norm":"§§ 71, 165 KAGB","id":"3.4-2-3"}]}]},{"nr":"3.5","titel":"Aktien und Anleihen","lf":"LF 10","buch":"PV2 5.3 S. 254–266 · Lösungen S. 702–705","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Rechte hat ein Aktionär?","aussagen":[["Er darf an der Hauptversammlung teilnehmen und dort abstimmen.",true],["Er erhält einen Anteil am Bilanzgewinn, wenn die Hauptversammlung eine Dividende beschließt.",true],["Er hat Anspruch auf einen festen jährlichen Zins auf seine Einlage.",false],["Er hat bei einer Kapitalerhöhung ein Bezugsrecht auf neue Aktien.",true],["Er kann von der AG verlangen, dass sie seine Aktien zum Nennwert zurücknimmt.",false]],"erkl":"Aktionäre sind Miteigentümer: Stimmrecht, Dividendenanspruch, Bezugsrecht, Auskunftsrecht und Anteil am Liquidationserlös. Einen festen Zins und ein Rückgaberecht gibt es nicht.","norm":"§§ 58, 118, 131, 134, 186 AktG","id":"3.5-1-1"},{"typ":"mc","frage":"Wozu dient das gesetzliche Bezugsrecht bei einer Kapitalerhöhung?","optionen":["Es verpflichtet die Altaktionäre, die neuen Aktien zu kaufen.","Es gibt der AG das Recht, alte Aktien zurückzukaufen.","Es sichert den Banken die Platzierung der neuen Aktien.","Es schützt Altaktionäre vor Verwässerung von Stimme und Vermögen."],"richtig":[3],"erkl":"Mit dem Bezugsrecht können Altaktionäre ihre Beteiligungsquote halten. Wer nicht bezieht, kann das Bezugsrecht verkaufen und so den Kursverlust ausgleichen.","norm":"§ 186 AktG","id":"3.5-1-2"},{"typ":"zahl","frage":"Eine Anleihe (Nennwert 5.000 €, Kupon 4,0 % jährlich) wird 146 Tage nach dem letzten Zinstermin gekauft (Jahr mit 365 Tagen). Wie viel Euro Stückzinsen zahlt der Käufer an den Verkäufer?","wert":80,"einheit":"€","tol":0.5,"erkl":"Stückzinsen = Nennwert × Zinssatz × Tage / 365 = 5.000 € × 4 % × 146 / 365 = 80,00 €. Der Käufer erhält am nächsten Zinstermin den vollen Jahreszins.","norm":"Grundlagen Anleihen","id":"3.5-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Risiko einer Schuldverschreibung die passende Beschreibung zu.","paare":[["Kursrisiko (Zinsänderungsrisiko)","Steigt der Marktzins, sinkt der Kurs der Anleihe vor Fälligkeit."],["Bonitätsrisiko","Der Emittent kann Zinsen oder Rückzahlung nicht leisten."],["Inflationsrisiko","Die Kaufkraft von Zins und Rückzahlung sinkt durch Preissteigerungen."],["Liquiditätsrisiko","Die Anleihe lässt sich vor Fälligkeit nur schwer oder mit Abschlag verkaufen."]],"erkl":"Wer eine Anleihe bis zur Fälligkeit hält, trägt kein Kursrisiko, wohl aber Bonitäts- und Inflationsrisiko. Chance: fester Zins und Kursgewinn bei fallenden Zinsen.","norm":"§ 793 BGB; § 63 Abs. 7 WpHG","id":"3.5-1-4"},{"typ":"mc","frage":"Was sagt ein Rating von „AAA“ über eine Anleihe aus?","optionen":["Der Emittent hat die höchste Bonität; das Ausfallrisiko ist sehr gering.","Die Anleihe bietet die höchste Rendite aller bewerteten Anleihen am Markt.","Die Anleihe ist vom Staat gegen jeden Zahlungsausfall voll abgesichert.","Der Emittent ist spekulativ eingestuft; ein Ausfall ist gut möglich."],"richtig":[0],"erkl":"Ratingagenturen bewerten die Bonität. AAA ist die beste Note; Ratings unter BBB− gelten als spekulativ (Non-Investment-Grade) mit höherer Rendite.","norm":"Grundlagen; EU-Ratingverordnung","id":"3.5-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Melanie Schulze (45) aus Halle (Saale) ist Kundin der Proximus Versicherung AG und lässt sich zur Geldanlage beraten. Sie besitzt 400 Aktien der Saale Solar AG (fiktiv). Die AG erhöht ihr Kapital im Verhältnis 4 : 1; Kurs der alten Aktie 45 €, Bezugskurs 30 €. Außerdem erwägt sie den Kauf einer Anleihe: Nennwert 10.000 €, Kupon 3,0 % jährlich, Kurs 96 %, Restlaufzeit 4 Jahre.","items":[{"typ":"zahl","frage":"Wie hoch ist der rechnerische Wert eines Bezugsrechts?","wert":3,"einheit":"€","tol":0.01,"erkl":"B = (Ka − Kn) / (m/n + 1) = (45 € − 30 €) / (4/1 + 1) = 15 € / 5 = 3,00 €.","norm":"§ 186 AktG","id":"3.5-2-1"},{"typ":"mc","frage":"Wie viele junge Aktien kann Frau Schulze mit ihren Bezugsrechten beziehen?","optionen":["80 junge Aktien","100 junge Aktien","400 junge Aktien","1.600 junge Aktien"],"richtig":[1],"erkl":"Jede alte Aktie gibt ein Bezugsrecht; 4 Bezugsrechte berechtigen zum Bezug einer jungen Aktie: 400 / 4 = 100 junge Aktien.","norm":"§ 186 AktG","id":"3.5-2-2"},{"typ":"mc","frage":"Wie hoch ist die Rendite der Anleihe nach der Faustformel (Kupon + Kursgewinn je Jahr) / Kaufkurs ungefähr?","optionen":["3,00 %","3,13 %","4,17 %","4,00 %"],"richtig":[2],"erkl":"Kursgewinn bis Fälligkeit 100 − 96 = 4 Punkte, je Jahr 1 Punkt; (3 + 1) / 96 × 100 = 4,17 %. Der Kupon allein ergibt 3 %, bezogen auf den Kaufkurs 3,13 %.","norm":"Grundlagen Anleihen","id":"3.5-2-3"}]}]},{"nr":"3.6","titel":"Anlageberatung","lf":"LF 10","buch":"PV2 5.4–5.5 S. 267–284 · Lösungen S. 705–711","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was beschreibt das Magische Dreieck der Geldanlage?","optionen":["Eine Anlage erfüllt mit genügend Streuung alle drei Ziele zugleich.","Sicherheit, Rentabilität und Liquidität steigen immer gemeinsam.","Die drei Ziele gelten nur für Aktien, nicht für Sparanlagen.","Rentabilität, Sicherheit und Liquidität stehen im Zielkonflikt."],"richtig":[3],"erkl":"Keine Anlage erfüllt alle drei Ziele gleichzeitig maximal. Hohe Rendite bedeutet meist weniger Sicherheit, hohe Liquidität meist weniger Rendite.","norm":"Grundlagen Anlageberatung","id":"3.6-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Anlageform ihre typische Stärke bzw. Schwäche im Magischen Dreieck zu.","paare":[["Tagesgeld","sehr hohe Liquidität, geringe Rentabilität"],["Aktie","hohe Rentabilitätschance, geringere Sicherheit"],["Bundesanleihe bis zur Fälligkeit","sehr hohe Sicherheit, mäßige Rentabilität"],["Offener Immobilienfonds","eingeschränkte Liquidität durch Halte- und Kündigungsfristen"]],"erkl":"Die Gewichtung der Ziele hängt vom Anlagezweck und Anlagehorizont des Kunden ab. Daraus folgt die geeignete Anlageform.","norm":"Grundlagen Anlageberatung","id":"3.6-1-2"},{"typ":"mc","frage":"Welche Angaben muss der Berater vor einer Anlageempfehlung beim Kunden einholen (Geeignetheitsprüfung)?","optionen":["Kenntnisse und Erfahrungen, finanzielle Verhältnisse, Anlageziele und Risikotoleranz.","Nur Einkommen und Vermögen, weil allein die Zahlungsfähigkeit entscheidend ist.","Kenntnisse, Erfahrungen und Gesundheitszustand, nicht aber die Anlageziele.","Nur die Risikotoleranz, weil der Kunde die Ziele selbst verantwortet."],"richtig":[0],"erkl":"Der Berater muss Kenntnisse und Erfahrungen, die finanziellen Verhältnisse einschließlich der Verlusttragfähigkeit und die Anlageziele einschließlich der Risikotoleranz erfragen.","norm":"§ 64 Abs. 3 WpHG","id":"3.6-1-3"},{"typ":"wf","frage":"Welche Aussagen zur Besteuerung von Kapitalerträgen 2026 treffen zu?","aussagen":[["Die Abgeltungsteuer beträgt 25 % zuzüglich Solidaritätszuschlag und ggf. Kirchensteuer.",true],["Der Sparerpauschbetrag beträgt 1.000 € für Ledige und 2.000 € für zusammen Veranlagte.",true],["Ein Freistellungsauftrag darf nur bei einer einzigen Bank erteilt werden.",false],["Bei Aktienfonds bleiben 30 % der Erträge steuerfrei (Teilfreistellung).",true],["Tatsächliche Werbungskosten über den Sparerpauschbetrag hinaus sind abziehbar.",false]],"erkl":"Der Freistellungsauftrag kann auf mehrere Institute verteilt werden, insgesamt bis zum Sparerpauschbetrag. Werbungskosten sind darüber hinaus nicht abziehbar.","norm":"§ 20 Abs. 9, §§ 32d, 44a EStG; § 20 InvStG","id":"3.6-1-4"},{"typ":"mc","frage":"Ein Kunde verweigert im Beratungsgespräch alle Angaben zu seinen finanziellen Verhältnissen. Was folgt daraus?","optionen":["Der Berater wählt ein Produkt der mittleren Risikoklasse aus.","Der Berater darf ihm kein Finanzinstrument empfehlen.","Der Berater schätzt die Angaben und dokumentiert dies.","Der Berater darf nur Aktien der höchsten Risikoklasse anbieten."],"richtig":[1],"erkl":"Ohne die erforderlichen Informationen ist keine Geeignetheitsprüfung möglich. Dann darf keine Anlageempfehlung gegeben werden.","norm":"§ 64 Abs. 3 WpHG","id":"3.6-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Nadine und Marco Fischer aus Halle (Saale) werden zusammen veranlagt und haben einen gemeinsamen Freistellungsauftrag über 2.000 € erteilt. 2026 erzielen sie 800 € Zinsen und 3.000 € Gewinn aus dem Verkauf von Aktienfondsanteilen. Sie sind nicht kirchensteuerpflichtig (Abgeltungsteuer 25 %, Solidaritätszuschlag 5,5 %, Teilfreistellung Aktienfonds 30 %). Für 2028 planen sie den Kauf eines Autos für 25.000 € aus ihrem Ersparten und lassen sich bei der Proximus Versicherung AG beraten.","items":[{"typ":"zahl","frage":"Wie viel Euro Abgeltungsteuer einschließlich Solidaritätszuschlag fallen 2026 an?","wert":237.38,"einheit":"€","tol":0.5,"erkl":"Steuerpflichtig: 800 € + 3.000 € × 70 % = 2.900 €; abzüglich Sparerpauschbetrag 2.000 € = 900 €. Steuer: 900 € × 25 % = 225 € + 5,5 % Soli = 12,38 € → 237,38 € (900 € × 26,375 %).","norm":"§§ 20 Abs. 9, 32d EStG; § 20 InvStG; SolZG","id":"3.6-2-1"},{"typ":"mc","frage":"Welches Anlageziel hat für die 25.000 € Autokauf-Rücklage Vorrang, und welche Anlage passt dazu?","optionen":["Rentabilität; deshalb ein breit gestreuter Aktien-ETF.","Rentabilität; deshalb ein Dachfonds mit hohem Aktienanteil.","Sicherheit und Liquidität; deshalb Tages- oder Festgeld.","Liquidität; deshalb ein offener Immobilienfonds."],"richtig":[2],"erkl":"Bei kurzem Anlagehorizont und festem Verwendungszweck dürfen keine Kursverluste drohen. Tages- oder Festgeld bis 2028 sind sicher und verfügbar.","norm":"Grundlagen Anlageberatung; § 64 Abs. 3 WpHG","id":"3.6-2-2"},{"typ":"mc","frage":"Frau Fischer möchte für ihr übriges Vermögen eine Fondsanlage kaufen. Was muss der Berater ihr vor dem Geschäftsabschluss aushändigen?","optionen":["Eine Kopie des Freistellungsauftrags für das Finanzamt.","Eine Bescheinigung über die Höhe des Ausgabeaufschlags.","Eine Garantieerklärung der Verwahrstelle für die Anteile.","Eine Geeignetheitserklärung auf dauerhaftem Datenträger."],"richtig":[3],"erkl":"Bei Anlageberatung für Privatkunden muss vor Vertragsschluss eine Geeignetheitserklärung übergeben werden. Sie zeigt, wie die Empfehlung zu den Kundenangaben passt.","norm":"§ 64 Abs. 4 WpHG","id":"3.6-2-3"}]}]},{"nr":"3.7","titel":"Investmentfonds: Arten, Preise, Kosten und Risiko","lf":"LF 10","buch":"PV2 5.2 S. 215–253 · Lösungen S. 695–702","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde fragt, was mit seinen Fondsanteilen geschieht, wenn die Kapitalverwaltungsgesellschaft (KVG) insolvent wird. Was antworten Sie?","optionen":["Das Fondsvermögen fällt in die Insolvenzmasse der KVG; er erhält nur die Quote.","Die gesetzliche Einlagensicherung ersetzt ihm den Anteilswert bis 100.000 €.","Das Fondsvermögen ist Sondervermögen und gehört nicht zur Insolvenzmasse.","Die Anteile verfallen, die Verwahrstelle haftet ihm aber für alle Kursverluste."],"richtig":[2],"erkl":"Das Fondsvermögen ist Sondervermögen. Es wird getrennt vom Vermögen der KVG gehalten und gehört nicht zu ihrer Insolvenzmasse. Mit der Insolvenz erlischt das Verwaltungsrecht der KVG; das Sondervermögen bzw. das Verwaltungs- und Verfügungsrecht geht auf die Verwahrstelle über, die es abwickelt oder einer anderen KVG überträgt. Eine Einlagensicherung gibt es für Fondsanteile nicht, sie ist für diesen Fall auch nicht nötig.","norm":"§ 92, § 99 Abs. 3, § 100 Abs. 1 KAGB","id":"3.7-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Fondsart den passenden Anlageschwerpunkt zu.","paare":[["Aktienfonds","Legt überwiegend in Aktien an; hohe Chancen, starke Kursschwankungen."],["Rentenfonds","Legt überwiegend in verzinsliche Wertpapiere (Anleihen) an."],["Mischfonds","Kombiniert Aktien und Anleihen in wechselnden Anteilen."],["Offener Immobilienfonds","Investiert in Gewerbeimmobilien; Rückgabe nur mit Halte- und Kündigungsfrist."],["ETF (Indexfonds)","Bildet einen Index passiv nach und wird laufend an der Börse gehandelt."]],"erkl":"Die Fondsart richtet sich nach dem Anlageschwerpunkt. Bei offenen Immobilienfonds gelten eine Mindesthaltefrist von 24 Monaten und eine Rückgabefrist von 12 Monaten; ETFs werden an der Börse gehandelt.","norm":"KAGB (Anlagebedingungen; § 255 KAGB für Immobilienfonds)","id":"3.7-1-2"},{"typ":"zahl","frage":"Ein Aktienfonds hat ein Fondsvermögen von 186.000.000 € bei 2.400.000 umlaufenden Anteilen. Der Ausgabeaufschlag beträgt 4 %. Berechnen Sie den Ausgabepreis je Anteil.","wert":80.6,"einheit":"€","tol":0.05,"erkl":"Anteilswert = Fondsvermögen : Anteile = 186.000.000 € : 2.400.000 = 77,50 €. Ausgabepreis = 77,50 € + 4 % (3,10 €) = 80,60 €.","norm":"§ 168 Abs. 1 KAGB (Nettoinventarwert); § 71 Abs. 2 KAGB (Ausgabepreis); Anlagebedingungen des Fonds","id":"3.7-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Kosten einer Fondsanlage treffen zu?","aussagen":[["Der Ausgabeaufschlag fällt einmalig beim Kauf an und erhöht den Ausgabepreis.",true],["Die laufenden Kosten werden dem Fondsvermögen entnommen und mindern so den Anteilswert.",true],["Die laufenden Kosten werden dem Kunden jedes Jahr gesondert in Rechnung gestellt.",false],["Beim Kauf eines ETF über die Börse fällt meist kein Ausgabeaufschlag an, wohl aber Ordergebühren.",true],["Bei Fonds mit Ausgabeaufschlag liegt der Ausgabepreis unter dem Anteilswert.",false]],"erkl":"Der Ausgabeaufschlag wird auf den Anteilswert aufgeschlagen, der Ausgabepreis liegt also darüber. Die laufenden Kosten (z. B. Verwaltungsvergütung) werden direkt aus dem Fondsvermögen bezahlt und im Basisinformationsblatt ausgewiesen.","norm":"KAGB; VO (EU) Nr. 1286/2014 (Basisinformationsblatt)","id":"3.7-1-4"},{"typ":"mc","frage":"Was versteht man beim Fondssparplan unter dem Durchschnittskosteneffekt?","optionen":["Mit gleich hohen Raten kauft man bei niedrigen Preisen mehr und bei hohen weniger Anteile.","Mit gleich hohen Raten kauft man stets gleich viele Anteile, Schwankungen spielen keine Rolle.","Der Ausgabeaufschlag sinkt mit jeder Rate, bis er nach zwölf Monaten ganz entfallen ist.","Die KVG sichert zu, dass der Durchschnittspreis nie über dem ersten Kaufpreis liegen kann."],"richtig":[0],"erkl":"Bei festen Raten bekommt der Sparer für denselben Betrag in Tiefphasen mehr Anteile. Deshalb liegt sein durchschnittlicher Preis je Anteil bei schwankenden Kursen unter dem Durchschnitt der Kurse.","norm":"Lehrbuch: Fondssparplan (PV2 5.2)","id":"3.7-1-5"},{"typ":"mc","frage":"Ein Kollege empfiehlt einer Kundin einen Dachfonds. Welche Aussage beschreibt einen Dachfonds zutreffend?","optionen":["Er legt nur in Anleihen des Bundes an und hat deshalb weder Kurs- noch Bonitätsrisiko.","Er bündelt die Depots mehrerer Kunden; jeder Kunde wählt die Einzelwerte selbst aus.","Er ist ein Garantiefonds, der den eingezahlten Betrag am Ende vollständig zusichert.","Er legt in andere Investmentfonds an; das streut breit, kann aber Kosten doppeln."],"richtig":[3],"erkl":"Ein Dachfonds kauft Anteile anderer Fonds (Zielfonds). Das bringt eine breite Streuung, aber es fallen Kosten auf Ebene des Dachfonds und der Zielfonds an. Eine Garantie ist damit nicht verbunden.","norm":"KAGB (Dachfonds als Investmentvermögen, Anlagebedingungen)","id":"3.7-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Lea Sommer (28) ist Angestellte einer Steuerberatungskanzlei in Halle (Saale). Sie möchte in den nächsten 15 bis 20 Jahren Vermögen aufbauen. Einmalig kann sie 12.600 € anlegen, außerdem monatlich 120 € sparen. Kursschwankungen nimmt sie in Kauf, sie will aber breit streuen. Für die Einmalanlage interessiert sie sich für einen weltweit anlegenden Aktienfonds einer Partner-KVG der Proximus Versicherung AG (Anteilswert 80,00 €, Ausgabeaufschlag 5 %, laufende Kosten 1,5 % p. a.). Die Monatsrate soll in einen Sparplan auf einen weltweiten Aktien-ETF fließen (laufende Kosten 0,2 % p. a., im Sparplan keine Kaufkosten).","items":[{"typ":"zahl","frage":"Berechnen Sie, wie viele Anteile Frau Sommer für ihre Einmalanlage von 12.600 € erhält.","wert":150,"einheit":"Anteile","tol":0.1,"erkl":"Ausgabepreis = Anteilswert + Ausgabeaufschlag = 80,00 € + 5 % (4,00 €) = 84,00 €. Anteile = 12.600 € : 84,00 € = 150 Anteile.","norm":"§ 71 Abs. 2 KAGB (Ausgabepreis); Anlagebedingungen des Fonds"
