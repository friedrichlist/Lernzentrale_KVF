:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.card.z .ic{background:var(--cd-sunk);color:var(--ink);border:2px solid var(--cd-akzent)}.zk{margin-top:18px}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px color-mix(in srgb,#000000 15%,transparent);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>

<script>
const D={"key":"gap2_11_training_v1","titel":"Prüfungstraining GAP 2 · Teil 1.1","sparte":"Teil 1.1","intro":"Teil 1.1 schreiben alle SuS: fünf Aufgaben zu Mobilität und Freizeit, Gesundheit, Vorsorge und Finanzanlagen, Einkommen sowie kaufmännischer Steuerung. Üben Sie jeden Bereich, rechnen Sie mit vollständigem Rechenweg und begründen Sie mit der Fundstelle. Zu jeder Aufgabe gibt es danach eine Zusatzrunde mit weiteren Abschnitten und neuen Fällen.","lf":"LF 5–12","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · GAP 2 Teil 1.1","stand":"10.10.2026","module":[{"nr":"1","titel":"Mobilität und Reisen, Beruf und Freizeit","lf":"LF 6, LF 5","abschnitte":[{"nr":"1.1","titel":"Kfz-Versicherung: Versicherungsarten und Beitragsberechnung","lf":"LF 6","buch":"PV2 1.1–1.2 S. 10–30 · Lösungen S. 664–667","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Warum muss jeder Halter eines zugelassenen Pkw eine Kfz-Haftpflichtversicherung abschließen?","optionen":["Das Pflichtversicherungsgesetz schreibt sie zum Schutz der Verkehrsopfer vor.","Die Kfz-Steuer wird nur für Fahrzeuge mit Haftpflichtvertrag berechnet.","Die Hersteller verlangen sie als Bedingung für die Fahrzeuggarantie.","Die Banken schreiben sie bei jeder Fahrzeugfinanzierung zwingend vor."],"richtig":[0],"erkl":"Halter eines Kfz mit regelmäßigem Standort im Inland müssen eine Haftpflichtversicherung unterhalten; sie soll sicherstellen, dass Unfallopfer ihren Schaden ersetzt bekommen.","norm":"§ 1 PflVG","id":"1.1-1-1"},{"typ":"mc","frage":"Welcher Schaden ist nicht über die Teilkasko, sondern erst über die Vollkasko versichert?","optionen":["Der Hagel beschädigt Dach und Motorhaube des abgestellten Fahrzeugs.","Unbekannte zerkratzen den Lack des Fahrzeugs auf dem Parkplatz.","Ein Marder zerbeißt die Zündkabel im Motorraum des geparkten Fahrzeugs.","Ein Steinschlag auf der Autobahn beschädigt die Windschutzscheibe."],"richtig":[1],"erkl":"Mut- oder böswillige Handlungen Dritter (Vandalismus) und Unfälle sind nur in der Vollkasko versichert. Hagel, Tierbiss an der Verkabelung und Glasbruch gehören schon zur Teilkasko.","norm":"AKB 2015 A.2.2","id":"1.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Kundenwunsch die passende Versicherungsart rund ums Kfz zu.","paare":[["Der Unfallgegner soll seinen Schaden ersetzt bekommen.","Kfz-Haftpflichtversicherung"],["Das eigene Auto soll nach einem selbst verschuldeten Unfall repariert werden.","Vollkaskoversicherung"],["Nach einer Panne im Ausland soll das Fahrzeug abgeschleppt werden.","Schutzbrief"],["Die eigenen Verletzungen als Fahrer nach einem selbst verschuldeten Unfall sollen ausgeglichen werden.","Fahrerschutzversicherung"]],"erkl":"Die Haftpflicht deckt Schäden Dritter, die Kasko das eigene Fahrzeug, der Schutzbrief Hilfe nach Panne oder Unfall und der Fahrerschutz den Personenschaden des berechtigten Fahrers, den sonst niemand ersetzt.","norm":"AKB 2015 A.1–A.5","id":"1.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Beitragsmerkmalen in der Kfz-Versicherung treffen zu?","aussagen":[["Die Typklasse richtet sich nach dem Schaden- und Kostenaufwand des Fahrzeugmodells.",true],["Die Regionalklasse richtet sich nach dem Zulassungsbezirk, in dem der Halter wohnt.",true],["In der Teilkasko gibt es keine Einstufung nach Schadenfreiheitsklassen.",true],["Eine höhere Typklasse führt zu einem niedrigeren Beitrag.",false],["Die SF-Klasse hängt allein vom Alter des Fahrzeugs ab.",false]],"erkl":"Typ- und Regionalklassen beruhen auf der Schadenstatistik; je höher die Klasse, desto höher der Beitrag. Die SF-Klasse spiegelt die schadenfreien Jahre des Versicherungsnehmers und gilt nur in Haftpflicht und Vollkasko.","norm":"AKB 2015 Abschnitt I (SF-System); Tarifbestimmungen","id":"1.1-1-4"},{"typ":"zahl","frage":"Der Beitrag (100 %) für die Kfz-Haftpflicht beträgt nach Typ- und Regionalklasse 640,00 €. Der Kunde ist in SF 8 eingestuft (Beitragssatz 45 %). Für die Garage erhält er 5 % Nachlass auf den Beitrag nach SF-Einstufung. Berechnen Sie den Jahresbeitrag einschließlich 19 % Versicherungsteuer.","wert":325.58,"einheit":"€","tol":0.5,"erkl":"640,00 € × 45 % = 288,00 €; abzüglich 5 % Garagennachlass = 273,60 €; zuzüglich 19 % Versicherungsteuer = 325,58 €.","norm":"Tarifbestimmungen; VersStG","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Lukas Brandt (24) aus Halle (Saale) kauft einen zwei Jahre alten Pkw für 18.000 €, den er über seine Bank finanziert. Die Bank verlangt eine Vollkaskoversicherung. Herr Brandt hat seit drei Jahren einen eigenen schadenfreien Vertrag und ist in der Haftpflicht und in der Vollkasko jeweils in SF 3 eingestuft. Er möchte das Fahrzeug in drei Tagen zulassen.","items":[{"typ":"mc","frage":"Was benötigt Herr Brandt, damit die Zulassungsstelle das Fahrzeug zulassen kann?","optionen":["Eine Bestätigung der Bank, dass die Finanzierung vollständig bewilligt ist.","Den unterschriebenen Antrag und die Zahlung des ersten Jahresbeitrags.","Eine elektronische Versicherungsbestätigung (eVB) des Kfz-Haftpflichtversicherers.","Einen Nachweis über die abgeschlossene Vollkaskoversicherung mit Selbstbehalt."],"richtig":[2],"erkl":"Die Zulassungsstelle braucht den Nachweis der Haftpflichtversicherung als eVB-Nummer. Mit der Zulassung beginnt in der Kfz-Haftpflicht vorläufiger Versicherungsschutz; für die Kasko gilt er nur, wenn er vereinbart ist.","norm":"AKB 2015 B.2; § 49 VVG","id":"1.1-2-1"},{"typ":"zahl","frage":"Der Beitrag (100 %) beträgt für die Haftpflicht 580,00 € und für die Vollkasko 720,00 € (einschließlich Teilkasko). In SF 3 gilt in der Haftpflicht ein Beitragssatz von 70 %, in der Vollkasko von 65 %. Für den Fahrerkreis „nur Versicherungsnehmer“ gewährt die Proximus 10 % Nachlass auf die Summe beider Beiträge. Die Fahrleistung von 12.000 km im Jahr ändert den Beitrag nicht. Berechnen Sie den Jahresbeitrag einschließlich 19 % Versicherungsteuer.","wert":936.05,"einheit":"€","tol":0.5,"erkl":"Haftpflicht 580,00 € × 70 % = 406,00 €; Vollkasko 720,00 € × 65 % = 468,00 €; Summe 874,00 €; abzüglich 10 % = 786,60 €; zuzüglich 19 % Versicherungsteuer = 936,05 €.","norm":"Tarifbestimmungen; VersStG","id":"1.1-2-2"},{"typ":"mc","frage":"Nach Vertragsabschluss soll auch die Freundin von Herrn Brandt (22) das Auto regelmäßig fahren. Was raten Sie ihm?","optionen":["Nichts unternehmen, denn wer fährt, ist für den Beitrag ohne jede Bedeutung.","Die Vollkasko kündigen, weil sie für fremde Fahrer ohnehin nicht leistet.","Einen eigenen Haftpflichtvertrag für die Freundin auf dasselbe Auto schließen.","Den Fahrerkreis sofort ändern lassen, sonst drohen Nachzahlung und Vertragsstrafe."],"richtig":[3],"erkl":"Der Fahrerkreis ist ein Tarifmerkmal. Ändert er sich, muss der Kunde das anzeigen; sonst berechnet der Versicherer den Beitrag nach und kann laut Tarifbestimmungen eine Vertragsstrafe verlangen. Den Geschädigten gegenüber bleibt die Haftpflicht eintrittspflichtig.","norm":"AKB 2015 Abschnitt K (Merkmale zur Beitragsberechnung); Tarifbestimmungen","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Kfz-Vertragsfragen: Schadenverlauf, Stilllegung, Kündigung","lf":"LF 6","buch":"PV2 1.1–1.2 S. 10–30 · Lösungen S. 664–667","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde meldet sein Auto für den Winter bei der Zulassungsstelle ab (Außerbetriebsetzung). Was geschieht mit seinem Kfz-Vertrag?","optionen":["Der Vertrag endet automatisch, und die SF-Klasse verfällt sofort ganz.","Der Vertrag ruht; Haftpflicht und Teilkasko bestehen beitragsfrei weiter.","Der Vertrag läuft mit vollem Beitrag weiter, weil er nicht gekündigt ist.","Der Vertrag ruht; nur die Vollkasko bleibt gegen halben Beitrag bestehen."],"richtig":[1],"erkl":"Bei einer Außerbetriebsetzung geht der Vertrag in eine beitragsfreie Ruheversicherung über, die Haftpflicht und Teilkasko umfasst (Teilkasko nur, wenn Kasko bestand). Das Fahrzeug darf dabei nicht auf öffentlichen Straßen abgestellt oder benutzt werden.","norm":"AKB 2015 Abschnitt H (Außerbetriebsetzung)","id":"1.2-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Vorgang die passende Rechtsfolge zu.","paare":[["Der Kunde verkauft sein Auto samt Vertrag.","Der Vertrag geht auf den Erwerber über."],["Der Versicherer erhöht den Beitrag ohne Leistungsverbesserung.","Sonderkündigung innerhalb eines Monats nach Zugang der Mitteilung"],["Der Kunde ersetzt sein altes Auto durch ein neues.","Die SF-Klasse wird auf das neue Fahrzeug übertragen."],["Der Kunde will zum Ende des Versicherungsjahres wechseln.","Kündigung spätestens einen Monat vor Ablauf"]],"erkl":"Bei Veräußerung tritt der Erwerber in den Vertrag ein. Eine Beitragserhöhung ohne Änderung des Umfangs gibt ein Sonderkündigungsrecht. Beim Fahrzeugwechsel bleibt der Schadenverlauf beim Versicherungsnehmer.","norm":"§§ 40, 95 VVG; AKB 2015 G","id":"1.2-1-2"},{"typ":"mc","frage":"Ein Kunde mit SF 12 für seinen ersten Pkw versichert einen Zweitwagen. Wie wird der Zweitwagen nach vielen Tarifen eingestuft?","optionen":["Er übernimmt die SF 12 des Erstwagens, sodass beide Autos gleich stehen.","Er beginnt in SF 0 mit Zuschlag, weil er ein zusätzliches Risiko bildet.","Er erhält ohne Rücksicht auf den Erstwagen die Einstufung eines Fahranfängers.","Er startet in einer günstigeren Sonderklasse, z. B. SF 1/2 statt SF 0."],"richtig":[3],"erkl":"Der Schadenverlauf gehört zum Erstvertrag und kann nicht doppelt genutzt werden. Für Zweitwagen sehen viele Tarife eine günstigere Anfangseinstufung vor, wenn der Erstwagen eine Mindest-SF-Klasse hat.","norm":"Tarifbestimmungen; AKB 2015 Abschnitt I","id":"1.2-1-3"},{"typ":"wf","frage":"Ein Kunde verkauft seinen versicherten Pkw an einen Nachbarn. Welche Aussagen treffen zu?","aussagen":[["Der Versicherungsvertrag geht auf den Nachbarn als Erwerber über.",true],["Der Erwerber kann den übernommenen Vertrag innerhalb eines Monats kündigen.",true],["Der Verkauf muss dem Versicherer unverzüglich angezeigt werden.",true],["Der Schadenverlauf des Verkäufers geht mit dem Fahrzeug auf den Nachbarn über.",false],["Der Versicherer darf den Vertrag nach dem Verkauf nicht mehr kündigen.",false]],"erkl":"Mit der Veräußerung tritt der Erwerber in den Vertrag ein; Erwerber und Versicherer können kündigen. Die SF-Klasse bleibt beim bisherigen Versicherungsnehmer und kann für ein Folgefahrzeug genutzt werden.","norm":"§§ 95, 96, 97 VVG","id":"1.2-1-4"},{"typ":"mc","frage":"Wie lange besteht die Ruheversicherung nach den Musterbedingungen höchstens, bevor der Vertrag ohne Wiederzulassung endet?","optionen":["18 Monate seit der Außerbetriebsetzung","6 Monate seit der Außerbetriebsetzung","12 Monate seit der Außerbetriebsetzung","36 Monate seit der Außerbetriebsetzung"],"richtig":[0],"erkl":"Wird das Fahrzeug nicht innerhalb von 18 Monaten wieder zugelassen, endet der Vertrag ohne Kündigung. Die Tarife einzelner Versicherer können längere Fristen vorsehen.","norm":"AKB 2015 Abschnitt H (Außerbetriebsetzung)","id":"1.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Sabine Krüger (71) aus Halle (Saale) ist seit vielen Jahren schadenfrei in SF 25 eingestuft. Sie fährt nicht mehr selbst und will ihren Pkw zum 01.01.2027 an ihre Tochter Mia abgeben. Mia hat seit dem 15.06.2019 den Führerschein und fährt das Auto der Mutter seitdem regelmäßig mit. Laut Tarif der Proximus darf die übernehmende Person höchstens so viele schadenfreie Jahre übernehmen, wie sie seit dem Führerscheinerwerb bis zum Übernahmetag volle Jahre erreicht hat.","items":[{"typ":"zahl","frage":"In welche SF-Klasse wird Mia Krüger nach der Übernahme zum 01.01.2027 eingestuft? Geben Sie die Zahl der SF-Klasse an.","wert":7,"einheit":"SF-Klasse","tol":0,"erkl":"Vom 15.06.2019 bis zum 01.01.2027 sind sieben volle Jahre vergangen (15.06.2026 = 7 Jahre; das achte ist noch nicht vollendet). Mia kann deshalb höchstens 7 Jahre übernehmen und wird in SF 7 eingestuft.","norm":"Tarifbestimmungen; AKB 2015 Abschnitt I","id":"1.2-2-1"},{"typ":"mc","frage":"Was geschieht mit den restlichen schadenfreien Jahren von Frau Krüger?","optionen":["Sie bleiben Frau Krüger erhalten, falls sie später wieder ein Auto fährt.","Sie werden auf ein zweites Kind von Frau Krüger übertragen, wenn es das wünscht.","Sie verfallen; Frau Krüger gibt ihren gesamten Schadenverlauf ab.","Sie werden Mia nach jedem schadenfreien Jahr nachträglich gutgeschrieben."],"richtig":[2],"erkl":"Der Schadenverlauf wird nur als Ganzes abgegeben. Die nicht übertragbaren Jahre gehen verloren, und Frau Krüger müsste bei einem neuen Vertrag wie ein Neukunde eingestuft werden.","norm":"Tarifbestimmungen; AKB 2015 Abschnitt I","id":"1.2-2-2"},{"typ":"wf","frage":"Welche Voraussetzungen für die Übernahme eines Schadenverlaufs nennen die Tarife typischerweise?","aussagen":[["Die abgebende Person ist ein naher Angehöriger, etwa Elternteil oder Ehepartner.",true],["Die übernehmende Person hat das Fahrzeug nachweislich regelmäßig mitgenutzt.",true],["Die abgebende Person erklärt schriftlich, dass sie den Schadenverlauf abgibt.",true],["Die übernehmende Person muss mindestens 30 Jahre alt sein.",false],["Ein Schadenverlauf kann auch an einen beliebigen Arbeitskollegen gehen.",false]],"erkl":"Die Übernahme setzt in der Regel ein enges Verhältnis (Familie, Lebenspartner), die Mitnutzung des Fahrzeugs und eine Abgabeerklärung voraus. Die Höchstzahl der übernehmbaren Jahre richtet sich nach der Führerscheindauer.","norm":"Tarifbestimmungen; AKB 2015 Abschnitt I","id":"1.2-2-3"}]}]},{"nr":"1.3","titel":"Reiseversicherungen: Bedarf und Angebot","lf":"LF 6","buch":"PV2 1.3–1.4 S. 31–43 · Lösungen S. 667–669","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann beginnt der Versicherungsschutz in der Reiserücktrittsversicherung nach dem Allgemeinen Teil der Reisebedingungen?","optionen":["Mit dem Antritt der Reise, also mit der Abfahrt vom Wohnort.","Mit der Anzahlung des Reisepreises beim Reiseveranstalter.","Mit dem Abschluss der Versicherung; er endet mit dem Reiseantritt.","Mit der Ankunft am Urlaubsort; er endet mit der Rückreise."],"richtig":[2],"erkl":"Der Rücktrittsschutz muss vor der Reise wirken: Er beginnt mit dem Abschluss und endet mit dem Antritt der Reise. Die übrigen Reiseversicherungen beginnen erst mit dem Reiseantritt.","norm":"Musterbedingungen Reiseversicherung (Allgemeiner Teil)","id":"1.3-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Allgemeinen Teil der Reisebedingungen treffen zu?","aussagen":[["Versichert sind die im Versicherungsschein genannten Personen bzw. die Familie im Sinne des Tarifs.",true],["Im Jahresvertrag ist jede Reise nur bis zu einer festgelegten Höchstdauer versichert.",true],["Der Versicherte muss eine Reise bei Eintritt des Ereignisses unverzüglich stornieren.",true],["Der Geltungsbereich ist immer die ganze Welt, auch wenn „Europa“ vereinbart ist.",false],["Obliegenheiten gelten erst ab dem Tag, an dem die Reise angetreten wird.",false]],"erkl":"Der Allgemeine Teil regelt versicherte Personen, Geltungsbereich, Dauer und Obliegenheiten für alle Sparten. Die Pflicht zur sofortigen Stornierung (Schadenminderung) gilt schon vor der Reise; Mehrkosten durch spätes Stornieren werden nicht ersetzt.","norm":"Musterbedingungen Reiseversicherung (Allgemeiner Teil); §§ 28, 82 VVG","id":"1.3-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Risiko die passende Reiseversicherung zu.","paare":[["Die Kundin erkrankt vor Reiseantritt schwer und kann nicht reisen.","Reiserücktrittsversicherung"],["Der Kunde muss den Urlaub wegen des Todes seiner Mutter vorzeitig beenden.","Reiseabbruchversicherung"],["Der Koffer kommt am Urlaubsort beschädigt vom Gepäckband.","Reisegepäckversicherung"],["Der Kunde braucht in Spanien eine Behandlung und einen Rücktransport.","Auslandsreisekrankenversicherung"]],"erkl":"Rücktritt deckt Stornokosten vor Antritt, Abbruch Mehrkosten und nicht genutzte Leistungen nach Antritt, Gepäck Sachschäden am Reisegepäck und die Auslandsreisekranken Behandlungs- und Rücktransportkosten.","norm":"Musterbedingungen Reiseversicherung","id":"1.3-1-3"},{"typ":"zahl","frage":"Ein Tarif sieht in der Reiserücktrittsversicherung einen Selbstbehalt von 20 % des erstattungsfähigen Schadens, mindestens 25 €, vor. Welchen Betrag müssten Kunden bei Stornokosten von 1.850,00 € selbst tragen?","wert":370.0,"einheit":"€","tol":0.5,"erkl":"1.850,00 € × 20 % = 370,00 €; das liegt über dem Mindestselbstbehalt von 25 €, also tragen die Kunden 370,00 € selbst.","norm":"Tarifbestimmungen; Musterbedingungen Reiseversicherung","id":"1.3-1-4"},{"typ":"mc","frage":"Warum empfehlen Sie auch gesetzlich Krankenversicherten für eine Reise nach Italien eine Auslandsreisekrankenversicherung?","optionen":["Die GKV zahlt nur nach den Sätzen des Gastlandes und keinen Rücktransport.","Die GKV zahlt im europäischen Ausland grundsätzlich überhaupt keine Leistung.","Die Auslandsreisekranken ist für Reisen in die EU gesetzlich vorgeschrieben.","Die GKV erstattet Behandlungen im Ausland erst nach einer Wartezeit von drei Monaten."],"richtig":[0],"erkl":"Mit der Europäischen Krankenversicherungskarte gibt es in der EU nur Leistungen nach dem Recht des Gastlandes; Zuzahlungen, Privatbehandlungen und der Rücktransport nach Deutschland bleiben offen.","norm":"§ 13 Abs. 4, § 60 Abs. 4 SGB V","id":"1.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Hoffmann (Eltern, zwei Kinder von 8 und 11 Jahren) aus Halle (Saale) plant 2027 eine Sommerreise nach Kroatien für 3.400 € und eine Herbstreise an die Ostsee für 1.200 €. Die Proximus bietet an (Bruttobeiträge für die Familie): Einzel-Reiserücktritt/-abbruch bei Reisepreis bis 1.500 € 52 €, bis 2.500 € 78 €, bis 3.500 € 104 €; Einzel-Auslandsreisekranken je Auslandsreise 24 €. Der Jahresvertrag (Rücktritt/Abbruch bis 5.000 € je Reise und Auslandsreisekranken, Reisen bis 56 Tage) kostet 189 €.","items":[{"typ":"mc","frage":"Frau Hoffmann fragt, wer im Familientarif versichert ist. Was antworten Sie richtig?","optionen":["Nur die Person, die den Vertrag abschließt und auch die Reise bezahlt hat.","Alle Personen, die mit der Familie gemeinsam auf derselben Buchung reisen.","Alle Verwandten bis zum dritten Grad, auch wenn sie gar nicht mitreisen.","Die Eltern und die Kinder nach der Familiendefinition im Versicherungsschein."],"richtig":[3],"erkl":"Wer versicherte Person ist, legt der Allgemeine Teil zusammen mit dem Versicherungsschein fest; im Familientarif sind meist Ehe- oder Lebenspartner und Kinder bis zu einer Altersgrenze erfasst.","norm":"Musterbedingungen Reiseversicherung (Allgemeiner Teil)","id":"1.3-2-1"},{"typ":"zahl","frage":"Wie hoch sind die Beiträge, wenn Familie Hoffmann beide Reisen einzeln versichert (Rücktritt/Abbruch für beide Reisen, Auslandsreisekranken für die Auslandsreise)?","wert":180.0,"einheit":"€","tol":0.5,"erkl":"Sommerreise 3.400 € → Stufe bis 3.500 € = 104 €; Herbstreise 1.200 € → Stufe bis 1.500 € = 52 €; Auslandsreisekranken Kroatien 24 €; zusammen 180 €. Der Jahresvertrag kostet mit 189 € nur 9 € mehr.","norm":"Tarifbestimmungen","id":"1.3-2-2"},{"typ":"mc","frage":"Familie Hoffmann überlegt, kurzfristig noch eine Städtereise zu buchen. Welche Empfehlung ist fachlich richtig?","optionen":["Einzelverträge, weil der Jahresvertrag Kurzreisen generell nicht erfasst.","Den Jahresvertrag, weil schon eine dritte Reise ihn günstiger macht.","Gar keine Versicherung, weil Städtereisen kein nennenswertes Risiko haben.","Den Jahresvertrag, aber nur, wenn die dritte Reise ins Ausland geht."],"richtig":[1],"erkl":"Schon für zwei Reisen liegt der Jahresvertrag nur 9 € über den Einzelverträgen; jede weitere Reise müsste einzeln mindestens 52 € kosten. Außerdem gilt er für alle Reisen des Jahres ohne neuen Abschluss.","norm":"Tarifbestimmungen","id":"1.3-2-3"}]}]},{"nr":"1.4","titel":"Privathaftpflicht: Bedarf und Angebot","lf":"LF 5","buch":"PV2 2.1 S. 44–72 · Lösungen S. 669–673","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem privaten Risiko die passende Absicherung zu (Tarif ohne besondere Einschlüsse).","paare":[["Halten eines Hundes","Tierhalter-Haftpflichtversicherung"],["Heizöltank mit 6.000 Litern im eigenen Keller","Gewässerschaden-Haftpflicht (Anlagenrisiko)"],["Selbst bewohntes Einfamilienhaus mit Garten","in der Privathaftpflicht mitversichert"],["Vermietetes Mehrfamilienhaus","Haus- und Grundbesitzer-Haftpflichtversicherung"]],"erkl":"Die PHV deckt die Gefahren des täglichen Lebens einschließlich des selbst bewohnten Einfamilienhauses. Hundehaltung, größere Öltanks und vermietete Mehrfamilienhäuser brauchen eigene Verträge oder besondere Einschlüsse.","norm":"AHB; BBR PHV; § 833 BGB; § 89 WHG","id":"1.4-1-1"},{"typ":"mc","frage":"Für welches Tier besteht über die Privathaftpflicht üblicherweise kein Versicherungsschutz?","optionen":["für die Katze, die in der Wohnung der Familie lebt","für den Wellensittich, der im Kinderzimmer wohnt","für das Kaninchen, das im Garten im Stall gehalten wird","für das Reitpferd, das die Familie in einem Stall hält"],"richtig":[3],"erkl":"Zahme Haustiere und Kleintiere sind mitversichert. Hunde, Pferde und andere Reit- und Zugtiere sind ausgeschlossen, weil ihr Halter nach § 833 BGB ohne Verschulden haftet; dafür gibt es die Tierhalter-Haftpflicht.","norm":"BBR PHV; § 833 BGB","id":"1.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zu besonderen Regelungen in der Privathaftpflicht treffen zu?","aussagen":[["Schäden an gemieteten Wohnräumen sind in den meisten Tarifen mitversichert.",true],["Schäden an geliehenen oder gemieteten beweglichen Sachen sind grundsätzlich ausgeschlossen.",true],["Der Verlust fremder privater Schlüssel ist ohne besondere Vereinbarung immer versichert.",false],["Kleine Bauvorhaben sind bis zu einer im Tarif genannten Bausumme mitversichert.",true],["Ein privates Ehrenamt ist nie versichert, weil der Verein selbst haftet.",false]],"erkl":"Mietsachschäden an Wohnräumen sind ein üblicher Einschluss; bewegliche Mietsachen sind nach den AHB ausgeschlossen. Schlüsselverlust gilt nur, soweit vereinbart; das private Ehrenamt ist meist subsidiär mitversichert.","norm":"AHB Ziff. 7.6; BBR PHV","id":"1.4-1-3"},{"typ":"mc","frage":"Ein fünfjähriges Kind beschädigt beim Spielen das Auto des Nachbarn. Warum zahlt die Privathaftpflicht ohne Zusatzbaustein nichts?","optionen":["weil Kinder grundsätzlich nicht zu den versicherten Personen zählen","weil die Eltern immer allein haften und das Kind gar nicht beteiligt ist","weil Kinder unter sieben Jahren nicht haften und kein Anspruch entsteht","weil Sachschäden an Kraftfahrzeugen in der PHV generell ausgeschlossen sind"],"richtig":[2],"erkl":"Kinder unter sieben Jahren sind deliktsunfähig; ohne Haftung zahlt die PHV nicht (sie wehrt den Anspruch ab). Die Eltern haften nur bei verletzter Aufsichtspflicht. Viele Tarife zahlen solche Schäden optional bis zu einer Höchstsumme.","norm":"§§ 828, 832 BGB","id":"1.4-1-4"},{"typ":"zahl","frage":"Familie Lehmann wählt die PHV im Familientarif für 89,00 € netto und eine Hundehalter-Haftpflicht für 72,00 € netto. Berechnen Sie den Jahresbeitrag beider Verträge einschließlich 19 % Versicherungsteuer.","wert":191.59,"einheit":"€","tol":0.5,"erkl":"89,00 € + 72,00 € = 161,00 € netto; zuzüglich 19 % Versicherungsteuer (30,59 €) = 191,59 €.","norm":"Tarifbestimmungen; VersStG","id":"1.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Wendt aus Halle (Saale) möchte ihre Haftpflicht neu ordnen: Herr und Frau Wendt, Sohn Paul (16) und Tochter Ella (5). Die Familie hält einen Labrador, bewohnt ein eigenes Einfamilienhaus mit einem 5.000-Liter-Heizöltank und plant einen Carport für 30.000 €. Paul fliegt eine Kameradrohne (0,9 kg), Frau Wendt ist ehrenamtliche Übungsleiterin im Sportverein. Der Tarif „Proximus PHV Komfort“ schließt ein: Bauvorhaben bis 100.000 € Bausumme, Drohnen bis 5 kg, Gewässerschäden nur aus Kleingebinden bis 50 Liter; deliktsunfähige Kinder bis 15.000 € als Zusatzbaustein.","items":[{"typ":"mc","frage":"Welche Verträge braucht Familie Wendt mindestens, um ihre gesetzliche Haftpflicht aus allen genannten Risiken abzusichern?","optionen":["PHV Komfort allein, weil sie alle genannten Risiken der Familie enthält","PHV Komfort, Hundehalter-Haftpflicht und Gewässerschaden-Haftpflicht","Hundehalter-Haftpflicht allein, weil sie auch die Gefahren des Alltags deckt","PHV Komfort und eine Bauherren-Haftpflicht für den geplanten Carport"],"richtig":[1],"erkl":"Hund und Heizöltank sind in der PHV Komfort nicht enthalten und brauchen eigene Verträge. Carport (unter 100.000 €), Drohne (unter 5 kg) und Ehrenamt sind über den Tarif abgedeckt.","norm":"BBR PHV; § 833 BGB; § 89 WHG","id":"1.4-2-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Risiko der Familie Wendt die zutreffende Lösung zu.","paare":[["Carport für 30.000 €","über die PHV, weil die Bausumme unter der Tarifgrenze liegt"],["Kameradrohne von Paul (0,9 kg)","über die PHV, weil der Tarif Drohnen bis 5 kg einschließt"],["Ella (5) zerkratzt das Auto eines Nachbarn","nur mit dem Zusatzbaustein für deliktsunfähige Kinder"],["Übungsleitung von Frau Wendt","über die PHV, nachrangig zu einer Haftpflicht des Vereins"]],"erkl":"Die Tarifeinschlüsse entscheiden, welche besonderen Risiken die PHV trägt. Ohne Haftung des Kindes zahlt die PHV nur mit dem Zusatzbaustein. Das Ehrenamt ist subsidiär versichert.","norm":"BBR PHV; § 828 BGB","id":"1.4-2-2"},{"typ":"wf","frage":"Welche Aussagen zur Beratung der Familie Wendt treffen zu?","aussagen":[["Paul ist als minderjähriges, unverheiratetes Kind im Familientarif mitversichert.",true],["Für den Heizöltank haftet die Familie bei einem Ölaustritt auch ohne Verschulden.",true],["Für die Drohne besteht eine gesetzliche Pflicht zur Haftpflichtversicherung.",true],["Ein Single-Tarif für Herrn Wendt würde die ganze Familie ebenfalls schützen.",false],["Eine Deckungssumme von 1 Mio. € pauschal ist für Personenschäden heute ausreichend.",false]],"erkl":"Kinder sind im Familientarif mitversichert, ein Single-Tarif deckt nur den Versicherungsnehmer. Für Öltanks gilt die Gefährdungshaftung nach WHG, für Drohnen die Versicherungspflicht nach LuftVG. Empfohlen werden heute Pauschalsummen von mindestens 10 Mio. €.","norm":"§ 89 WHG; § 43 LuftVG; BBR PHV","id":"1.4-2-3"}]}]},{"nr":"1.5","titel":"Vertragsänderungen in Privathaftpflicht und Rechtsschutz","lf":"LF 5","buch":"PV2 2.3–2.4 S. 84–93 · Lösungen S. 675–677","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Kunde mit PHV kauft sich nach Vertragsabschluss ein Stand-up-Paddleboard. Wie ist das neue Risiko versichert?","optionen":["Das Risiko ist als Erhöhung bzw. Erweiterung des versicherten Risikos mitversichert.","Das Risiko ist erst versichert, wenn der Kunde einen neuen Antrag stellt.","Das Risiko ist nicht versichert, weil Wassersport in der PHV ausgeschlossen ist.","Das Risiko ist nur versichert, wenn der Kunde einen Zuschlag sofort bezahlt."],"richtig":[0],"erkl":"Erhöhungen und Erweiterungen des versicherten Risikos sind nach den AHB automatisch mitversichert. Nicht versicherungspflichtige Wassersportgeräte ohne Motor zählen in den meisten Tarifen ohnehin zu den Gefahren des täglichen Lebens.","norm":"AHB Ziff. 3.1","id":"1.5-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Vorsorgeversicherung nach den AHB treffen zu?","aussagen":[["Neue Risiken sind ab ihrer Entstehung sofort versichert.",true],["Der Kunde muss das neue Risiko innerhalb eines Monats nach Aufforderung anzeigen.",true],["Kommt keine Einigung über den Beitrag zustande, entfällt der Schutz rückwirkend.",true],["Die Vorsorge gilt ohne Begrenzung in Höhe der vollen Deckungssumme.",false],["Auch versicherungspflichtige Kraftfahrzeuge fallen unter die Vorsorge.",false]],"erkl":"Die Vorsorge schützt neue Risiken bis zur Einigung über den Beitrag, begrenzt auf die vereinbarten Vorsorgesummen. Versicherungspflichtige Fahrzeuge und andere Pflichtversicherungen sind ausgenommen.","norm":"AHB Ziff. 4","id":"1.5-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Rechtsschutz-Baustein den passenden Streitfall zu.","paare":[["Privat-Rechtsschutz","Streit mit einem Onlinehändler über ein defektes Notebook"],["Berufs-Rechtsschutz","Klage gegen die Kündigung durch den Arbeitgeber"],["Verkehrs-Rechtsschutz","Bußgeldverfahren wegen zu schnellen Fahrens"],["Wohnungs-Rechtsschutz","Streit mit dem Vermieter über die Nebenkostenabrechnung"]],"erkl":"Rechtsschutz wird in Bausteinen angeboten; erst die Kombination deckt Privat-, Berufs-, Verkehrs- und Wohnbereich. Welche Leistungsarten jeder Baustein umfasst, regeln die ARB.","norm":"ARB 2012 (Leistungsarten und Vertragsformen)","id":"1.5-1-3"},{"typ":"mc","frage":"Für welche Leistungsart gilt in der Rechtsschutzversicherung üblicherweise keine Wartezeit von drei Monaten?","optionen":["für den Arbeits-Rechtsschutz bei einem Streit mit dem Arbeitgeber","für den Wohnungs-Rechtsschutz bei einem Streit mit dem Vermieter","für den Schadenersatz-Rechtsschutz nach einem Verkehrsunfall","für den Vertrags-Rechtsschutz bei einem Streit mit einem Händler"],"richtig":[2],"erkl":"Schadenersatz-, Straf- und Ordnungswidrigkeiten-Rechtsschutz beginnen ohne Wartezeit, weil der Rechtsschutzfall unvorhersehbar eintritt. Für Arbeits-, Wohnungs- und Vertrags-Rechtsschutz gilt meist eine Wartezeit von drei Monaten.","norm":"ARB 2012 (Wartezeit)","id":"1.5-1-4"},{"typ":"mc","frage":"Ein Ehepaar hat nach der Heirat zwei PHV-Verträge, einen bei der Proximus und einen bei einem anderen Versicherer. Was raten Sie?","optionen":["Beide Verträge behalten, weil im Schadenfall dann doppelt gezahlt wird.","Beide Verträge sofort kündigen und einen ganz neuen Vertrag abschließen.","Den jüngeren Vertrag nur beitragsfrei stellen, damit er weiterhin ruht.","Einen Vertrag auf den Familientarif umstellen und den anderen aufheben."],"richtig":[3],"erkl":"Durch die Heirat ist der Ehepartner im Familientarif mitversichert; es entsteht eine Mehrfachversicherung. Der Kunde kann die Aufhebung des später geschlossenen Vertrags verlangen; doppelt gezahlt wird nie (Bereicherungsverbot).","norm":"§§ 78, 79 VVG","id":"1.5-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Jonas Albrecht (29) aus Halle (Saale) hat seit 2022 eine Single-PHV bei der Proximus. Im November 2026 heiratet er Frau Lea Albrecht, die eine eigene PHV bei einem anderen Versicherer hat. Er erbt außerdem eine vermietete Eigentumswohnung in Halle-Neustadt; vermietete Wohnungen sind in seinem PHV-Tarif nicht eingeschlossen. Für das Paar möchte er nun auch Rechtsschutz: Privat 168 €, Beruf 72 €, Verkehr 84 € und Wohnen (Mieter) 54 € netto; bei 150 € Selbstbeteiligung gewährt die Proximus 15 % Nachlass auf die Summe.","items":[{"typ":"mc","frage":"Ist die geerbte, vermietete Eigentumswohnung über die bestehende PHV versichert?","optionen":["Nein, weil vermietete Wohnungen von der Vorsorge immer ausgenommen sind.","Ja, vorläufig über die Vorsorge, bis Anzeige und Beitrag geregelt sind.","Ja, dauerhaft und ohne Anzeige, weil Wohneigentum in jeder PHV enthalten ist.","Nein, weil Herr Albrecht die Wohnung nur geerbt und nicht gekauft hat."],"richtig":[1],"erkl":"Die Vermietung ist ein neues Risiko, das über die Vorsorge sofort versichert ist, aber in der Höhe begrenzt. Herr Albrecht muss es nach Aufforderung innerhalb eines Monats anzeigen; dann wird ein Beitrag oder ein eigener Vertrag vereinbart.","norm":"AHB Ziff. 4","id":"1.5-2-1"},{"typ":"zahl","frage":"Berechnen Sie den Jahresbeitrag für die Rechtsschutz-Kombination mit 150 € Selbstbeteiligung einschließlich 19 % Versicherungsteuer.","wert":382.35,"einheit":"€","tol":0.5,"erkl":"168 € + 72 € + 84 € + 54 € = 378,00 €; abzüglich 15 % Nachlass = 321,30 €; zuzüglich 19 % Versicherungsteuer = 382,35 €.","norm":"Tarifbestimmungen; VersStG","id":"1.5-2-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Veränderung bei Herrn Albrecht die richtige Folge zu.","paare":[["Heirat mit Lea","Umstellung der Single-PHV auf den Familientarif"],["Zwei PHV-Verträge nach der Heirat","Aufhebung des später geschlossenen Vertrags verlangen"],["Vermietete Eigentumswohnung","Anzeige des neuen Risikos und Beitragsvereinbarung"],["Streit mit dem Arbeitgeber einen Monat nach Rechtsschutzbeginn","kein Arbeits-Rechtsschutz wegen der Wartezeit"]],"erkl":"Veränderungen im Familienstand und neue Risiken muss der Kunde melden, damit der Vertrag angepasst wird. Ein Arbeitsrechtsstreit innerhalb der ersten drei Monate fällt in die Wartezeit.","norm":"AHB Ziff. 4; § 79 VVG; ARB 2012 (Wartezeit)","id":"1.5-2-3"}]}]},{"nr":"1.6","titel":"Privathaftpflicht: versicherte Personen und besondere Risiken","lf":"LF 5","buch":"PV2 1.2–1.4 S. 12–43 · Lösungen S. 664–669","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Herr Krause hat eine Familien-Privathaftpflichtversicherung. Wer ist nach den Musterbedingungen mitversichert?","optionen":["Der 27-jährige Sohn, der seit vier Jahren als Elektriker arbeitet und noch bei den Eltern wohnt.","Die 20-jährige Tochter, die verheiratet ist und mit ihrem Ehemann eine eigene Wohnung hat.","Der 23-jährige ledige Sohn, der gleich nach dem Abitur ein Studium begann und im Wohnheim lebt.","Die 26-jährige ledige Tochter, die nach Lehre und drei Berufsjahren nun ein Studium begonnen hat."],"richtig":[2],"erkl":"Volljährige Kinder sind mitversichert, solange sie unverheiratet sind und sich in einer Schul- oder unmittelbar anschließenden Berufsausbildung befinden; dazu zählt auch ein Studium. Ein Wohnen im Haushalt der Eltern ist dafür nicht nötig. Berufstätigkeit, Heirat oder eine Ausbildung erst nach Jahren im Beruf beenden die Mitversicherung.","norm":"AVB PHV A1-2 bzw. BBR PHV (Musterbedingungen, mitversicherte Personen)","id":"1.6-1-1"},{"typ":"wf","frage":"Welche Aussagen zu besonderen Risiken in der Privathaftpflichtversicherung treffen zu?","aussagen":[["Die Haftpflicht als Halter einer Katze ist in der PHV mitversichert.",true],["Die Haftpflicht als Halter eines Hundes ist in der PHV mitversichert.",false],["Wer privat ein fremdes Pferd reitet, hat als Reiter Schutz über die PHV, soweit nicht die Tierhalterhaftpflicht des Halters eintritt.",true],["Beschädigt der Kunde beim Öffnen seiner Autotür ein parkendes Auto, zahlt seine PHV.",false],["Für Drohnen gilt eine gesetzliche Versicherungspflicht; die PHV deckt sie nur, wenn der Tarif sie ausdrücklich einschließt.",true]],"erkl":"Zahme Haustiere wie Katzen sind mitversichert, Hunde und Pferde als Halter nicht (Tierhalterhaftung nach § 833 BGB). Als Reiter fremder Pferde zu privaten Zwecken besteht Schutz nur nachrangig, soweit keine Tierhalterhaftpflicht eintritt. Schäden durch den Gebrauch eines Kfz fallen nach der Benzinklausel unter die Kfz-Haftpflicht. Drohnen sind Luftfahrzeuge mit Versicherungspflicht.","norm":"AVB PHV A1-6 bzw. BBR PHV (besondere Risiken: Tiere, Kfz, Luftfahrzeuge); § 833 BGB; § 1 PflVG; § 43 LuftVG","id":"1.6-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Risiko die Versicherung zu, die den Haftpflichtschaden deckt.","paare":[["Halterin eines Schäferhunds","Tierhalterhaftpflichtversicherung"],["Fahrer eines E-Scooters mit Versicherungskennzeichen","Kfz-Haftpflichtversicherung"],["Eigner eines führerscheinpflichtigen Motorboots mit 40 kW","Wassersporthaftpflichtversicherung"],["Mieterin, deren Waschmaschinenschlauch das Parkett der Mietwohnung beschädigt","Privathaftpflichtversicherung"]],"erkl":"Hundehaltung und versicherungspflichtige Kfz sind in der PHV ausgeschlossen. Eigene Motorboote schließen die Musterbedingungen ganz aus; manche Tarife decken nur kleine Motoren ohne Führerscheinpflicht. Diese Risiken brauchen eigene Verträge. Schäden an gemieteten Wohnräumen sind als Mietsachschaden in der PHV mitversichert.","norm":"BBR PHV (Musterbedingungen); § 1 PflVG; § 833 BGB","id":"1.6-1-3"},{"typ":"mc","frage":"Die fünfjährige Emma zerkratzt beim Spielen mit einem Stein das Auto des Nachbarn. Ihre Eltern haben ihre Aufsichtspflicht nachweislich erfüllt. Wie beurteilen Sie die Rechtslage?","optionen":["Emma ist deliktunfähig, die Eltern haften nicht; die PHV zahlt nur, wenn Schäden deliktunfähiger Kinder eingeschlossen sind.","Emma haftet selbst, weil Kinder schon ab fünf Jahren für Sachschäden verantwortlich sind; deshalb zahlt die PHV der Eltern.","Die Eltern haften immer für ihre Kinder; die PHV der Eltern ersetzt den Schaden daher in jedem Fall in voller Höhe.","Der Nachbar muss sich an die Kfz-Haftpflicht der Eltern wenden, weil ein Kraftfahrzeug beschädigt worden ist."],"richtig":[0],"erkl":"Kinder unter sieben Jahren sind nach § 828 Abs. 1 BGB nicht verantwortlich. Die Eltern haften nach § 832 BGB nur bei verletzter Aufsichtspflicht. Ohne Haftung muss die PHV nicht zahlen, es sei denn, der Tarif schließt Schäden durch deliktunfähige Kinder ein (von der seltenen Billigkeitshaftung nach § 829 BGB abgesehen).","norm":"§§ 828, 832 BGB; BBR PHV (Musterbedingungen)","id":"1.6-1-4"},{"typ":"mc","frage":"Was regelt die Vorsorgeversicherung in der Privathaftpflichtversicherung?","optionen":["Neue Risiken sind erst versichert, wenn der Kunde sie gemeldet und den Mehrbeitrag bezahlt hat.","Neue Risiken sind dauerhaft beitragsfrei mitversichert, eine Meldung an den Versicherer ist nie nötig.","Neue Risiken sind nur versichert, wenn sie schon vor Vertragsschluss bekannt waren und angezeigt wurden.","Neue Risiken sind sofort versichert; der Kunde muss sie nach Aufforderung binnen eines Monats melden."],"richtig":[3],"erkl":"Risiken, die nach Vertragsschluss neu entstehen, sind sofort im Rahmen des Vertrags versichert. Der Kunde muss sie nach Aufforderung innerhalb eines Monats anzeigen, sonst entfällt der Schutz rückwirkend. Ausgenommen sind z. B. versicherungspflichtige Kfz sowie Risiken, die eine eigene Pflichtversicherung brauchen.","norm":"AHB Ziffer 4; AVB PHV A1-9 (Vorsorgeversicherung)","id":"1.6-1-5"},{"typ":"wf","frage":"Welche Aussagen zu Mietsachschäden, Gefälligkeiten und Ehrenamt treffen zu?","aussagen":[["Schäden an der gemieteten Wohnung, z. B. ein Wasserschaden am Parkett, sind als Mietsachschaden in der Regel mitversichert.",true],["Schäden durch Abnutzung, Verschleiß und übermäßige Beanspruchung der Mietwohnung ersetzt die PHV.",false],["Bei einer Gefälligkeit, z. B. Umzugshilfe, kann ein stillschweigender Haftungsverzicht für leichte Fahrlässigkeit gelten; dann besteht keine Haftung.",true],["Einen Schaden, den der Kunde bei seiner bezahlten beruflichen Tätigkeit verursacht, ersetzt die PHV.",false],["Ein Ehrenamt ohne Vorstandsfunktion, z. B. als Übungsleiter, ist in vielen Tarifen mitversichert, oft nur nachrangig zur Vereinsversicherung.",true]],"erkl":"Mietsachschäden an Wohnräumen sind eingeschlossen, Abnutzung und Verschleiß nicht. Einen stillschweigenden Haftungsverzicht nehmen Gerichte nur ausnahmsweise an. Ohne gesetzliche Haftung zahlt die PHV nichts, es sei denn, Gefälligkeitsschäden sind besonders eingeschlossen. Berufliche Risiken gehören in eine Berufs- oder Betriebshaftpflicht.","norm":"AHB; BBR PHV (Musterbedingungen); § 823 BGB","id":"1.6-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Jens Lindner (52) aus Halle (Saale) hat bei der Proximus eine Familien-Privathaftpflichtversicherung mit 250 € Selbstbeteiligung je Sachschaden; laut Tarif sind auch Gefälligkeitsschäden versichert. Im Haushalt leben seine Ehefrau Sabine und Tochter Mia (6); Sohn Paul (22) ist ledig und studiert seit dem Abitur in Leipzig. Paul hat beim Umzug eines Kommilitonen dessen Fernseher fallen lassen, der Zeitwert lag bei 680 €. Ab dem 01.03.2027 nimmt die Familie einen Labrador auf; eine Tierhalterhaftpflicht der Proximus kostet 84 € im Jahr, Hauptfälligkeit ist der 01.01. Herr Lindner fragt Sie, ob alles über seinen Vertrag versichert ist.","items":[{"typ":"mc","frage":"Beurteilen Sie, ob Paul über den Vertrag seines Vaters versichert ist.","optionen":["Nein, weil volljährige Kinder ab dem 18. Lebensjahr immer einen eigenen Vertrag benötigen.","Ja, weil er ledig ist und sich unmittelbar nach der Schule in einer Berufsausbildung befindet.","Nein, weil er zum Studium nach Leipzig gezogen ist und nicht mehr im Haushalt der Eltern lebt.","Ja, aber nur bis zum Ende des 21. Lebensjahres; danach braucht er einen eigenen Vertrag."],"richtig":[1],"erkl":"Paul ist unverheiratet und studiert direkt nach dem Abitur. Ein Studium gilt als Berufsausbildung, die sich unmittelbar an die Schule anschließt. Der Auszug zum Studium ändert an der Mitversicherung nichts.","norm":"BBR PHV (Musterbedingungen, mitversicherte Personen)","id":"1.6-2-1"},{"typ":"zahl","frage":"Berechnen Sie, welchen Betrag die Proximus dem Kommilitonen für den Fernseher zahlt.","wert":430,"einheit":"€","tol":0.5,"erkl":"Gefälligkeitsschäden sind laut Tarif versichert, Paul ist mitversichert. Ersetzt wird der Zeitwert: 680 € − 250 € Selbstbeteiligung = 430 €.","norm":"Tarif der Proximus (Gefälligkeitsschäden); § 823 Abs. 1, § 249 BGB","id":"1.6-2-2"},{"typ":"mc","frage":"Welche Empfehlung geben Sie Herrn Lindner zum Labrador?","optionen":["Eine Tierhalterhaftpflicht abschließen, weil die PHV keine Hunde deckt und der Halter ohne Verschulden haftet.","Nichts unternehmen, weil der neue Hund über die Vorsorgeversicherung der PHV auf Dauer mitversichert ist.","Den Hund nur melden, weil Hunde als zahme Haustiere beitragsfrei in der PHV mitversichert sind.","Eine Tierkrankenversicherung abschließen, weil sie auch Schäden des Hundes an fremden Sachen zahlt."],"richtig":[0],"erkl":"Die Hundehaltung ist in der PHV ausgeschlossen; die Vorsorgeversicherung greift nicht für ein ausgeschlossenes Risiko. Der Halter haftet nach § 833 Satz 1 BGB auch ohne Verschulden. Deshalb ist eine eigene Tierhalterhaftpflicht nötig; in Sachsen-Anhalt ist sie für jeden Hund ohnehin Pflicht.","norm":"§ 833 BGB; § 2 Abs. 3 HundeG LSA; AVB PHV bzw. BBR PHV (Tiere)","id":"1.6-2-3"},{"typ":"zahl","frage":"Die Tierhalterhaftpflicht beginnt am 01.03.2027. Der erste Beitrag wird zeitanteilig bis zur Hauptfälligkeit am 01.01.2028 berechnet. Berechnen Sie diesen Beitrag.","wert":70,"einheit":"€","tol":0.5,"erkl":"Vom 01.03. bis 31.12. sind es 10 Monate. 84 € : 12 × 10 = 70 €.","norm":"Tarif der Proximus (zeitanteiliger Erstbeitrag bis zur Hauptfälligkeit)","id":"1.6-2-4"}]}],"runde":"zusatz"},{"nr":"1.7","titel":"Kraftfahrtversicherung im Kundenleben: SF-Rabatt, Stilllegung, Tarif","lf":"LF 6","buch":"PV2 2.1–2.2 S. 44–83 · Lösungen S. 669–675","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"wf","frage":"Welche Aussagen zum Schadenfreiheitsrabatt-System treffen zu?","aussagen":[["Verläuft der Vertrag ein ganzes Kalenderjahr mit ununterbrochenem Schutz schadenfrei, wird er im Folgejahr eine SF-Klasse besser eingestuft.",true],["Nach einem regulierten Schaden wird der Vertrag im Folgejahr nach der Rückstufungstabelle des Tarifs zurückgestuft.",true],["Der Schadenfreiheitsrabatt gehört zum Fahrzeug und geht beim Verkauf auf den Käufer über.",false],["Für einen Zweitwagen oder das erste Auto eines Kindes bieten viele Versicherer eine günstigere Ersteinstufung an.",true],["Den Schadenverlauf kann jede beliebige Person übernehmen, etwa auch ein Arbeitskollege.",false]],"erkl":"Besser gestuft wird nach einem Kalenderjahr, in dem der Schutz ununterbrochen bestand und die Proximus für keinen Schaden leisten musste. Der SF-Verlauf ist an den Versicherungsnehmer gebunden, nicht an das Fahrzeug; bei einem Fahrzeugwechsel nimmt der Kunde ihn mit. Eine Übernahme ist nur zwischen den im Tarif genannten Personen möglich, z. B. Ehepartnern oder Eltern und Kindern. Sonderregeln für Zweitwagen und Kinder legt jeder Tarif selbst fest.","norm":"AKB 2015 I.3.2 (Besserstufung), I.6 (Übernahme eines Schadenverlaufs); Tarifbestimmungen","id":"1.7-1-1"},{"typ":"wf","frage":"Herr Ritter meldet sein Motorrad im Herbst bei der Zulassungsstelle ab. Welche Aussagen treffen zu?","aussagen":[["Der Vertrag endet nicht, sondern wird in der Regel zu einer beitragsfreien Ruheversicherung.",true],["Während der Ruheversicherung darf das Motorrad gelegentlich auf öffentlichen Straßen gefahren werden.",false],["Schutz in der Ruheversicherung setzt voraus, dass das Motorrad z. B. in einer Garage oder auf einem umfriedeten Abstellplatz steht.",true],["Wird das Motorrad nicht innerhalb der vertraglichen Frist (oft 18 Monate) wieder zugelassen, endet der Vertrag ohne Kündigung.",true],["Ein Kalenderjahr, in dem der Vertrag nur ruhte, verbessert die SF-Klasse wie ein normales schadenfreies Jahr.",false]],"erkl":"Bei vorübergehender Außerbetriebsetzung läuft eine beitragsfreie Ruheversicherung mit Abstellpflicht; ein Gebrauch des Fahrzeugs ist nicht erlaubt. Ohne Wiederzulassung endet der Vertrag nach der vertraglichen Frist; die Musterbedingungen lassen die Zahl der Monate offen, viele Tarife nennen 18 Monate. Zeiten, in denen der Vertrag nur ruht, gelten als Unterbrechung und bringen keine Besserstufung.","norm":"AKB 2015 H.1 (Ruheversicherung, H.1.5 Abstellpflicht, H.1.7 Vertragsende) und I.3.2 (Besserstufung)","id":"1.7-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Tarifmerkmal der Kfz-Versicherung die passende Beschreibung zu.","paare":[["Typklasse","Einstufung des Fahrzeugmodells nach dessen Schadenbedarf"],["Regionalklasse","Einstufung nach dem Zulassungsbezirk des Halters"],["Fahrerkreis","Angabe, wer das Fahrzeug fahren darf und wie alt die Fahrer sind"],["Jährliche Fahrleistung","Geschätzte Kilometer je Versicherungsjahr"],["SF-Klasse","Einstufung nach der Zahl schadenfreier Jahre des Vertrags"]],"erkl":"Typ- und Regionalklassen werden jährlich aus der Schadenstatistik neu ermittelt. Fahrerkreis und Fahrleistung gibt der Kunde an; Änderungen muss er melden. Die SF-Klasse spiegelt den eigenen Schadenverlauf wider.","norm":"AKB 2015 Abschnitte J und K; Tarifbestimmungen der Proximus","id":"1.7-1-3"},{"typ":"mc","frage":"Eine Kundin möchte den Schadenverlauf ihres Vaters übernehmen. Welche Voraussetzung verlangen die Tarifbestimmungen in der Regel?","optionen":["Die Kundin muss mindestens 25 Jahre alt sein und schon ein eigenes Fahrzeug versichert haben.","Der Vater muss das Fahrzeug zuvor mindestens zwölf Monate bei der Zulassungsstelle abgemeldet haben.","Die Kundin muss glaubhaft machen, dass sie das Fahrzeug des Vaters bisher regelmäßig gefahren hat.","Die Übernahme ist nur möglich, wenn beide Personen in derselben Regionalklasse gemeldet sind."],"richtig":[2],"erkl":"Wer einen Schadenverlauf übernimmt, muss das Fahrzeug bisher regelmäßig selbst genutzt haben; beide Seiten unterschreiben eine Übertragungserklärung, und der Abgebende verzichtet auf seinen Verlauf. Angerechnet werden höchstens die Jahre, in denen die Kundin den Führerschein besitzt. Alter, Stilllegung oder Regionalklasse sind keine Voraussetzungen.","norm":"AKB 2015 I.6 (Übernahme eines Schadenverlaufs); Tarifbestimmungen","id":"1.7-1-4"},{"typ":"mc","frage":"Was kennzeichnet einen Telematik-Tarif in der Kfz-Versicherung?","optionen":["Die Proximus ortet das Fahrzeug nach einem Diebstahl und ersetzt dann stets den Neuwert.","Das Fahrverhalten wird per App oder Sensor erfasst; umsichtiges Fahren bringt einen Bonus.","Der Beitrag richtet sich allein nach den Kilometern, die der Kunde jährlich selbst angibt.","Schäden führen nie zu einer Rückstufung, wenn der Kunde ein Fahrtenbuch geführt hat."],"richtig":[1],"erkl":"Beim Telematik-Tarif werden z. B. Beschleunigen, Bremsen und Tempo ausgewertet; wer vorausschauend fährt, erhält einen Nachlass. Die Datenverarbeitung setzt eine wirksame Einwilligung des Kunden voraus.","norm":"Tarifbestimmungen der Proximus (Telematik); Art. 6 und 7 DSGVO","id":"1.7-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lea Brandt (24) aus Halle (Saale) hat seit sechs Jahren den Führerschein und fährt seitdem regelmäßig den Kleinwagen ihrer Mutter Karin, der bei der Proximus in der Kfz-Haftpflicht in SF 22 eingestuft ist. Frau Brandt will nicht mehr selbst fahren und Lea den Wagen mit ihrem Schadenverlauf überlassen; laut Tarif der Proximus übernimmt Lea höchstens so viele schadenfreie Jahre, wie sie selbst den Führerschein besitzt. Der Grundbeitrag (100 %) für Leas Kfz-Haftpflicht beträgt 640 €; Beitragssätze laut Tarif: SF 2 = 85 %, SF 3 = 80 %, SF 6 = 55 %, SF 7 = 52 %, SF 8 = 49 %. Laut Rückstufungstabelle fällt SF 6 nach einem Schaden auf SF 2; erstattet die Kundin der Proximus den Schaden innerhalb von sechs Monaten, entfällt die Rückstufung. Im ersten Jahr verursacht Lea einen Parkschaden, für den die Proximus dem Geschädigten 300 € zahlt.","items":[{"typ":"zahl","frage":"Berechnen Sie Leas Jahresbeitrag für die Kfz-Haftpflicht im ersten Jahr nach der Übernahme des Schadenverlaufs.","wert":352,"einheit":"€","tol":0.5,"erkl":"Lea besitzt den Führerschein seit sechs Jahren und übernimmt daher SF 6 mit 55 %. 640 € × 55 % = 352 €.","norm":"AKB 2015 Abschnitt I; Tarif der Proximus","id":"1.7-2-1"},{"typ":"mc","frage":"Frau Brandt fragt, welche Folgen die Übertragung für sie selbst hat. Was antworten Sie nach den AKB 2015?","optionen":["Sie behält die 16 nicht übertragenen Jahre und kann sie später für ein eigenes Auto nutzen.","Sie behält ihre SF 22, weil Lea nur eine Kopie ihres bisherigen Schadenverlaufs erhält.","Sie wird für drei Jahre gesperrt und erhält danach ihre SF 22 automatisch zurück.","Sie verliert ihren Schadenverlauf; die 16 Jahre, die Lea nicht erhält, verfallen."],"richtig":[3],"erkl":"Wer einen Schadenverlauf abgibt, verzichtet unwiderruflich auf ihn. Lea erhält 6 der 22 Jahre; die übrigen 22 − 6 = 16 Jahre verfallen. Fährt Frau Brandt später wieder, wird sie wie bei einem neuen Vertrag eingestuft.","norm":"AKB 2015 I.6 (Übernahme eines Schadenverlaufs) und Abschnitt I (Einstufung nach Abgabe des Schadenverlaufs)","id":"1.7-2-2"},{"typ":"zahl","frage":"Berechnen Sie den Mehrbeitrag in den beiden Jahren nach dem Parkschaden, wenn Lea den Schaden von der Proximus regulieren lässt. Der Grundbeitrag bleibt unverändert.","wert":409.6,"einheit":"€","tol":0.5,"erkl":"Ohne Rückstufung: SF 7 (52 %) und SF 8 (49 %) = 101 %. Mit Rückstufung: SF 2 (85 %) und SF 3 (80 %) = 165 %. Mehrbeitrag: (165 % − 101 %) × 640 € = 64 % × 640 € = 409,60 €.","norm":"AKB 2015 Abschnitt I (Rückstufung im Schadenfall); Tarif der Proximus","id":"1.7-2-3"},{"typ":"mc","frage":"Welche Empfehlung geben Sie Lea zum Parkschaden?","optionen":["Die 300 € binnen sechs Monaten selbst erstatten, weil die Rückstufung mehr kostet.","Den Schaden regulieren lassen, weil eine Rückstufung nur das erste Folgejahr betrifft.","Den Schaden selbst zahlen, aber erst nach sechs Monaten, damit der Anspruch verjährt.","Den Schaden über die Teilkasko abrechnen, weil es dort keine Rückstufung gibt."],"richtig":[0],"erkl":"Schon in zwei Jahren kostet die Rückstufung 409,60 € und damit mehr als der Schaden von 300 €. Lea sollte den Betrag fristgerecht erstatten. Ein Parkschaden an einem fremden Auto ist ein Haftpflichtschaden, kein Kaskoschaden.","norm":"AKB 2015 I.5 (Rückstufung vermeiden); AKB 2015 A.1 (Kfz-Haftpflicht)","id":"1.7-2-4"}]}],"runde":"zusatz"},{"nr":"1.8","titel":"Reiseversicherungen beraten","lf":"LF 6","buch":"PV2 2.1–2.2 S. 44–83 · Lösungen S. 669–675","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welches Ereignis ist in der Reiserücktrittsversicherung in der Regel versichert?","optionen":["Ein Wetterbericht, der für die gesamte Reisezeit Dauerregen vorhersagt.","Eine unerwartete schwere Erkrankung, die die Reise unzumutbar macht.","Eine Krankheit, wegen der bei Buchung schon eine Operation geplant war.","Ein günstigeres Angebot für dieselbe Reise bei einem anderen Anbieter."],"richtig":[1],"erkl":"Versichert sind unerwartete Ereignisse wie schwere Erkrankung, schwere Unfallverletzung oder Tod. Eine bei Buchung schon bekannte Behandlung ist nicht unerwartet; Wetter und Preisvergleich sind keine versicherten Gründe.","norm":"Musterbedingungen Reiserücktrittsversicherung; § 651h BGB","id":"1.8-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Reiseversicherung ihre typische Leistung zu.","paare":[["Reiserücktrittsversicherung","Stornokosten, wenn die Reise nicht angetreten wird"],["Reiseabbruchversicherung","Mehrkosten der Rückreise und nicht genutzte Reiseleistungen"],["Auslandsreisekrankenversicherung","Heilbehandlung im Ausland und medizinisch sinnvoller Rücktransport"],["Reisegepäckversicherung","Abhandenkommen oder Beschädigung mitgeführter Sachen"]],"erkl":"Rücktritt betrifft die Zeit vor Reiseantritt, Abbruch die Zeit danach. Die Auslandsreisekrankenversicherung zahlt Behandlung und Rücktransport, die Gepäckversicherung den Verlust von Sachen.","norm":"Musterbedingungen Reiseversicherung (Allgemeiner Teil und Sparten)","id":"1.8-1-2"},{"typ":"mc","frage":"Eine gesetzlich versicherte Kundin muss im Urlaub in Spanien zum Arzt. Was leistet ihre Krankenkasse mit der Europäischen Krankenversicherungskarte (EHIC)?","optionen":["Alle Kosten wie in Deutschland, auch eine Privatbehandlung und den Rücktransport nach Hause.","Keine Leistungen, weil die gesetzliche Krankenversicherung nur in Deutschland zahlt.","Alle Kosten der Behandlung, aber nur, wenn die Krankenkasse vorher zugestimmt hat.","Leistungen wie für Versicherte in Spanien; Zuzahlungen und Rücktransport trägt die Kundin."],"richtig":[3],"erkl":"Mit der EHIC erhält die Kundin die nötigen Sachleistungen nach dem Recht des Aufenthaltslandes. Eigenanteile vor Ort und Privatbehandlung trägt sie selbst. Den Rücktransport nach Deutschland übernimmt die GKV nicht; dafür ist eine Auslandsreisekrankenversicherung nötig.","norm":"Art. 19 VO (EG) Nr. 883/2004; § 60 Abs. 4 SGB V","id":"1.8-1-3"},{"typ":"wf","frage":"Welche Aussagen zur Auslandsreisekrankenversicherung und zum Jahresvertrag treffen zu?","aussagen":[["Ein Jahresvertrag lohnt sich meist für Kunden, die mehrmals im Jahr verreisen.",true],["Ein Jahresvertrag deckt in der Regel jede Reise ohne zeitliche Begrenzung der Reisedauer.",false],["Behandlungen, die der Anlass der Reise ins Ausland sind, sind nicht versichert.",true],["Die Versicherung leistet nur, wenn die gesetzliche Krankenkasse vorher eine Zahlung abgelehnt hat.",false]],"erkl":"Jahresverträge decken beliebig viele Reisen, aber jede nur bis zu einer im Tarif genannten Höchstdauer, z. B. sechs oder acht Wochen. Geplante Behandlungen im Ausland sind ausgeschlossen. Eine vorherige Ablehnung durch die Krankenkasse ist keine Voraussetzung.","norm":"Musterbedingungen Auslandsreisekrankenversicherung; Tarifbestimmungen","id":"1.8-1-4"},{"typ":"mc","frage":"Ein Kunde erkrankt 60 Tage vor Abreise so schwer, dass die Reise sicher nicht möglich ist. Er wartet ohne Grund ab und storniert erst 20 Tage vor Abreise; die Proximus wertet das als grob fahrlässig. Welche Leistung muss sie aus der Reiserücktrittsversicherung mindestens erbringen?","optionen":["Die vollen Stornokosten, weil der Rücktrittsgrund versichert ist.","Keine Leistung, weil jede verspätete Stornierung als Vorsatz gilt.","Die Stornokosten, die bei sofortiger Stornierung angefallen wären.","Die Hälfte der Stornokosten, weil grobe Fahrlässigkeit sie halbiert."],"richtig":[2],"erkl":"Der Kunde muss die Reise unverzüglich stornieren, um die Stornokosten gering zu halten. Bei grob fahrlässiger Verletzung darf die Proximus ihre Leistung nach der Schwere des Verschuldens kürzen, bei Vorsatz ist sie leistungsfrei (§ 82 Abs. 3 VVG). Das gilt aber nur für die Mehrkosten durch die Verspätung: Für die Kosten, die auch bei sofortiger Stornierung angefallen wären, war die Verspätung nicht ursächlich (§ 82 Abs. 4 VVG). Diese muss die Proximus mindestens erstatten, abzüglich eines vereinbarten Selbstbehalts.","norm":"§ 82 Abs. 3 und 4 VVG; Musterbedingungen Reiserücktrittsversicherung (Obliegenheiten)","id":"1.8-1-5"},{"typ":"zahl","frage":"Ein Kunde bricht eine 14-tägige Reise ab, weil seine Mutter gestorben ist; 6 der 14 Tage bleiben ungenutzt. Laut Tarif ersetzt die Reiseabbruchversicherung die Mehrkosten der Rückreise (380 €) und den anteiligen Wert der nicht genutzten Leistungen für Hotel und Verpflegung (1.400 € für 14 Tage). Berechnen Sie die Leistung ohne Selbstbehalt.","wert":980,"einheit":"€","tol":0.5,"erkl":"Nicht genutzte Leistungen: 1.400 € : 14 × 6 = 600 €. Dazu kommen 380 € Mehrkosten der Rückreise: 600 € + 380 € = 980 €.","norm":"Musterbedingungen Reiseabbruchversicherung; Tarif der Proximus","id":"1.8-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Anna Krüger (34) und Tom Weiß (36) aus Halle (Saale) haben vor zehn Tagen eine dreiwöchige Rundreise durch Thailand für 3.250 € je Person gebucht. Beide sind gesetzlich krankenversichert und haben je eine Privathaftpflichtversicherung; Tom hat zusätzlich eine Hausratversicherung der Proximus mit weltweiter Außenversicherung. Die Proximus bietet dem Paar eine gemeinsame Reiserücktritts- und Reiseabbruchversicherung für 3,8 % des gesamten Reisepreises an; der Selbstbehalt beträgt 20 % der erstattungsfähigen Kosten. Laut Reisebedingungen betragen die Stornokosten vom 45. bis zum 31. Tag vor Abreise 40 % des Reisepreises. Das Paar fragt Sie, welchen Schutz es für die Reise noch braucht.","items":[{"typ":"zahl","frage":"Berechnen Sie die Prämie der Reiserücktritts- und Reiseabbruchversicherung für das Paar.","wert":247,"einheit":"€","tol":0.5,"erkl":"Gesamter Reisepreis: 2 × 3.250 € = 6.500 €. Prämie: 6.500 € × 3,8 % = 247 €.","norm":"Tarif der Proximus (Beitragsberechnung nach Reisepreis)","id":"1.8-2-1"},{"typ":"zahl","frage":"Anna erkrankt 40 Tage vor Abreise unerwartet schwer, das Paar storniert sofort. Laut Tarif darf auch die mitreisende versicherte Person stornieren. Berechnen Sie die Erstattung der Proximus.","wert":2080,"einheit":"€","tol":0.5,"erkl":"Die Stornierung 40 Tage vor Abreise fällt in die Stufe vom 45. bis zum 31. Tag: 6.500 € × 40 % = 2.600 € Stornokosten. Selbstbehalt: 2.600 € × 20 % = 520 €. Erstattung: 2.600 € − 520 € = 2.080 €.","norm":"Musterbedingungen Reiserücktrittsversicherung (Selbstbehalt); § 651h BGB","id":"1.8-2-2"},{"typ":"mc","frage":"Welche Empfehlung geben Sie dem Paar zum Krankheitsschutz in Thailand?","optionen":["Eine Auslandsreisekrankenversicherung, weil die GKV in Thailand grundsätzlich nicht zahlt, auch keinen Rücktransport.","Keine weitere Versicherung, weil die GKV mit der Europäischen Krankenversicherungskarte weltweit die Behandlung zahlt.","Keine weitere Versicherung, weil die Reiserücktrittsversicherung auch die Arztkosten während der Reise übernimmt.","Keine weitere Versicherung, weil die GKV außerhalb Europas die Kosten stets bis zu den Inlandssätzen erstattet."],"richtig":[0],"erkl":"Die EHIC gilt nur in EU, EWR und der Schweiz. Für Thailand besteht kein Abkommen mit Krankenversicherungsschutz; die GKV zahlt dort grundsätzlich nicht und den Rücktransport nie. Die Reiserücktrittsversicherung deckt nur Stornokosten.","norm":"§§ 16, 18, 60 Abs. 4 SGB V; Musterbedingungen Auslandsreisekrankenversicherung","id":"1.8-2-3"},{"typ":"zuo","frage":"Prüfen Sie bestehenden und fehlenden Schutz: Ordnen Sie jedem möglichen Ereignis auf der Reise die zuständige Versicherung zu.","paare":[["Toms Kamera wird bei einem Raubüberfall in Bangkok entwendet.","Hausratversicherung (Außenversicherung)"],["Anna muss in Phuket im Krankenhaus behandelt werden.","Auslandsreisekrankenversicherung"],["Tom stößt einen Passanten an, der stürzt und sich das Handgelenk bricht.","Privathaftpflichtversicherung"],["Auf einem Markt in Bangkok wird Anna die Sonnenbrille aus der Tasche gestohlen.","Reisegepäckversicherung"]],"erkl":"Die Außenversicherung der Hausrat deckt Raub, aber keinen einfachen Diebstahl wie einen Taschendiebstahl; den deckt nur eine Reisegepäckversicherung. Die PHV gilt bei vorübergehenden Auslandsaufenthalten, Behandlungskosten zahlt die Auslandsreisekrankenversicherung.","norm":"Musterbedingungen VHB (Außenversicherung); BBR PHV; Musterbedingungen Reiseversicherung","id":"1.8-2-4"}]}],"runde":"zusatz"}]},{"nr":"2","titel":"Gesundheit fördern, Krankheit und Pflege absichern","lf":"LF 8","abschnitte":[{"nr":"2.1","titel":"GKV und Versicherungspflicht","lf":"LF 8","buch":"PV2 3.1–3.2 S. 94–113 · Lösungen S. 677–679","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wofür ist die Beitragsbemessungsgrenze der Krankenversicherung (2026: 69.750 € jährlich) maßgeblich?","optionen":["Sie legt fest, ab welchem Jahresarbeitsentgelt ein Arbeitnehmer versicherungsfrei wird.","Bis zu ihr werden Beiträge erhoben; Einkommen darüber bleibt in der GKV beitragsfrei.","Sie bestimmt, bis zu welchem Einkommen Angehörige familienversichert sein können.","Sie ist die Grenze, ab der eine Krankenkasse einen Zusatzbeitrag erheben darf."],"richtig":[1],"erkl":"Die BBG begrenzt das beitragspflichtige Einkommen. Über die Versicherungspflicht entscheidet dagegen die höhere JAEG (2026: 77.400 €).","norm":"§ 223 Abs. 3 SGB V, § 6 Abs. 6 SGB V","id":"2.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Person ihren Status in der gesetzlichen Krankenversicherung zu (Stand 2026).","paare":[["Beamtin des Landes Sachsen-Anhalt","versicherungsfrei nach § 6 Abs. 1 Nr. 2 SGB V"],["Angestellter mit 84.000 € regelmäßigem Jahresarbeitsentgelt","versicherungsfrei nach § 6 Abs. 1 Nr. 1 SGB V"],["Hauptberuflich selbstständiger Tischlermeister","nicht versicherungspflichtig nach § 5 Abs. 5 SGB V"],["Auszubildende mit 1.150 € Ausbildungsvergütung","versicherungspflichtig nach § 5 Abs. 1 Nr. 1 SGB V"],["Aushilfe mit einem Minijob mit 520 € im Monat","versicherungsfrei als geringfügig Beschäftigte (§ 7 SGB V)"]],"erkl":"Beamte und Arbeitnehmer über der JAEG sind versicherungsfrei, hauptberuflich Selbstständige nicht versicherungspflichtig. Auszubildende sind unabhängig vom Entgelt pflichtversichert; Minijobs bis 603 € (2026) sind versicherungsfrei.","norm":"§§ 5, 6, 7 SGB V","id":"2.1-1-2"},{"typ":"mc","frage":"Die 19-jährige Tochter eines GKV-Mitglieds macht eine schulische Ausbildung und hat einen Minijob mit 550 € im Monat. Ist sie 2026 familienversichert? (Grenze für Minijobber 2026: 603 €.)","optionen":["Nein, weil jedes eigene Einkommen die Familienversicherung ausschließt.","Nein, weil die Familienversicherung für Kinder mit dem 18. Lebensjahr endet.","Ja, weil sie in Ausbildung ist und unter der Grenze von 603 € bleibt.","Ja, aber nur, wenn ihr Arbeitgeber einen Zuschuss zum Beitrag zahlt."],"richtig":[2],"erkl":"Kinder in Schul- oder Berufsausbildung sind bis zum 25. Lebensjahr familienversichert. Bei einem Minijob gilt 2026 die Einkommensgrenze von 603 € statt 565 €.","norm":"§ 10 Abs. 1 Nr. 5, Abs. 2 Nr. 3 SGB V","id":"2.1-1-3"},{"typ":"zahl","frage":"Frau Selin Arslan ist Angestellte und verdient 4.200 € brutto im Monat. Allgemeiner Beitragssatz 14,6 %, Zusatzbeitrag ihrer Krankenkasse 2,9 %; Arbeitgeber und Arbeitnehmerin tragen je die Hälfte. Wie hoch ist ihr monatlicher Arbeitnehmeranteil zur Krankenversicherung?","wert":367.5,"einheit":"€","tol":0.02,"erkl":"Beitragssatz gesamt 14,6 % + 2,9 % = 17,5 %, Arbeitnehmeranteil 8,75 %. 4.200 € liegt unter der BBG von 5.812,50 €: 4.200 € × 8,75 % = 367,50 €.","norm":"§§ 241, 242, 249 SGB V","id":"2.1-1-4"},{"typ":"wf","frage":"Welche Aussagen zu den Wahltarifen der gesetzlichen Krankenkassen treffen zu?","aussagen":[["Bei einem Wahltarif mit Selbstbehalt trägt das Mitglied einen Teil der Kosten selbst und erhält dafür eine Prämie.",true],["An einen Wahltarif mit Selbstbehalt ist das Mitglied mindestens drei Jahre gebunden.",true],["Krankenkassen müssen hauptberuflich Selbstständigen einen Wahltarif mit Krankengeld anbieten.",true],["Wählt ein Mitglied einen Selbstbehalttarif, sinkt automatisch der Arbeitgeberanteil.",false],["Ein Wahltarif ersetzt den Zusatzbeitrag der Krankenkasse.",false]],"erkl":"Wahltarife ändern den Beitrag nach §§ 241 ff. SGB V nicht. Prämie, Selbstbehalt und Bindungsfrist regelt die Satzung der Kasse.","norm":"§ 53 Abs. 1, 6 und 8 SGB V","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Marco Heller (34) aus Halle (Saale) ist angestellter Vertriebsingenieur und bisher pflichtversichert in der GKV. 2025 verdiente er 5.500 € im Monat (13 Gehälter). Seit 01.01.2026 erhält er 6.600 € im Monat, weiterhin 13-mal im Jahr. Die JAEG beträgt 2026 77.400 €; für 2027 ist eine JAEG von 84.150 € geplant (Kabinettsbeschluss vom 07.10.2026). Herr Heller fragt Sie, ob und wann er in die private Krankenversicherung der Proximus Versicherung AG wechseln kann.","items":[{"typ":"zahl","frage":"Berechnen Sie das regelmäßige Jahresarbeitsentgelt von Herrn Heller ab 01.01.2026.","wert":85800,"einheit":"€","tol":0.5,"erkl":"Regelmäßige Sonderzahlungen wie das 13. Gehalt zählen mit: 6.600 € × 13 = 85.800 €. Das liegt über der JAEG 2026 von 77.400 €.","norm":"§ 6 Abs. 1 Nr. 1 SGB V","id":"2.1-2-1"},{"typ":"mc","frage":"Ab wann ist Herr Heller versicherungsfrei und kann eine Krankheitskostenvollversicherung abschließen?","optionen":["Ab dem 01.01.2026, weil sein Entgelt ab diesem Tag über der JAEG liegt.","Ab dem 01.01.2027, weil er die JAEG 2026 und auch die JAEG 2027 überschreitet.","Erst nach drei Kalenderjahren, in denen er die JAEG jeweils überschritten hat.","Ab dem 01.04.2026, also drei Monate nach Überschreiten der JAEG."],"richtig":[1],"erkl":"Die Versicherungspflicht endet mit Ablauf des Kalenderjahres, in dem die JAEG überschritten wird, wenn das Entgelt auch die JAEG des Folgejahres übersteigt (85.800 € > 84.150 €, geplante JAEG 2027). Die frühere Dreijahresfrist gilt seit 2011 nicht mehr.","norm":"§ 6 Abs. 4 SGB V","id":"2.1-2-2"},{"typ":"mc","frage":"Herr Heller unternimmt bis Ende 2026 nichts. Was geschieht ab 01.01.2027 mit seiner Krankenversicherung?","optionen":["Er ist ab 01.01.2027 ohne Versicherungsschutz und muss einen Prämienzuschlag zahlen.","Die Krankenkasse kündigt die Mitgliedschaft und meldet ihn bei einem privaten Versicherer an.","Er bleibt automatisch freiwilliges Mitglied, wenn er nicht binnen zwei Wochen nach Hinweis austritt.","Er bleibt Pflichtmitglied, bis er selbst einen privaten Versicherungsvertrag nachweist."],"richtig":[2],"erkl":"Die Mitgliedschaft wird als freiwillige Versicherung fortgesetzt (obligatorische Anschlussversicherung). Den Austritt muss er binnen zwei Wochen nach dem Hinweis der Kasse erklären und eine anderweitige Absicherung nachweisen.","norm":"§ 188 Abs. 4 SGB V","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Wechsel zwischen GKV und PKV","lf":"LF 8","buch":"PV2 3.3 S. 114–128 · Lösungen S. 679–682","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Eine Studentin, die bisher privat versichert war, möchte zu Studienbeginn in der PKV bleiben. Was gilt?","optionen":["Sie kann die Befreiung jederzeit während des Studiums widerrufen und in die KVdS wechseln.","Sie ist automatisch versicherungsfrei, weil sie vor dem Studium privat versichert war.","Sie muss den Antrag beim privaten Versicherer stellen, der die Krankenkasse informiert.","Sie muss die Befreiung binnen drei Monaten beantragen; sie gilt für das ganze Studium."],"richtig":[3],"erkl":"Studierende sind grundsätzlich in der KVdS versicherungspflichtig. Die Befreiung ist binnen drei Monaten bei der Krankenkasse zu beantragen und kann für die Dauer des Studiums nicht widerrufen werden.","norm":"§ 5 Abs. 1 Nr. 9, § 8 Abs. 1 Nr. 5 und Abs. 2 SGB V","id":"2.2-1-1"},{"typ":"mc","frage":"Ein privat vollversicherter Kunde wird kraft Gesetzes versicherungspflichtig. Wie kann er seinen Vertrag beenden?","optionen":["Nur zum Ende des Versicherungsjahres mit einer Frist von drei Monaten.","Binnen drei Monaten nach Eintritt der Versicherungspflicht rückwirkend zu diesem Tag.","Nur mit Zustimmung des Versicherers, weil die PKV eine Pflichtversicherung ist.","Binnen einem Monat nach Eintritt der Versicherungspflicht zum Monatsende."],"richtig":[1],"erkl":"Das Sonderkündigungsrecht erlaubt die Kündigung binnen drei Monaten rückwirkend zum Eintritt der Versicherungspflicht. Später ist sie nur zum Ende des Monats möglich, in dem die Versicherungspflicht nachgewiesen wird.","norm":"§ 205 Abs. 2 VVG","id":"2.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Tarifform der PKV die passende Beschreibung zu.","paare":[["Basistarif","Annahmepflicht ohne Risikozuschlag; Leistungen wie in der GKV, Beitrag höchstens GKV-Höchstbeitrag"],["Standardtarif","Nur für Versicherte mit Vertragsbeginn vor 2009; älterer Sozialtarif mit begrenztem Beitrag"],["Notlagentarif","Gilt bei Beitragsrückstand; nur Akut- und Schmerzbehandlung sowie Schwangerschaft"],["Anwartschaftsversicherung","Vertrag ruht gegen geringen Beitrag; der Gesundheitszustand bei Abschluss bleibt maßgeblich"]],"erkl":"Der Basistarif sichert seit 2009 den Zugang zur PKV, der Standardtarif bleibt für Altverträge. Der Notlagentarif schützt Beitragsschuldner, die Anwartschaft hält den Weg zurück in die PKV offen.","norm":"§ 152 und § 153 VAG, § 193 Abs. 5 und 7 VVG","id":"2.2-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Alterungsrückstellungen in der PKV treffen zu?","aussagen":[["Neue Vollversicherte zahlen vom 21. bis zum 60. Lebensjahr einen gesetzlichen Zuschlag von 10 % zur Beitragsentlastung im Alter.",true],["Beim Tarifwechsel innerhalb desselben Versicherers bleiben die erworbenen Rechte und die Alterungsrückstellung erhalten.",true],["Bei einem Wechsel zu einem anderen Versicherer wird für Verträge ab 2009 die Rückstellung im Umfang des Basistarifs mitgegeben.",true],["Wechselt ein Kunde in die GKV, überweist der Versicherer die Alterungsrückstellung an die Krankenkasse.",false]],"erkl":"Alterungsrückstellungen bleiben im Kollektiv der PKV. Übertragbar sind sie nur innerhalb der PKV, beim Unternehmenswechsel begrenzt auf den Basistarif.","norm":"§ 149 VAG, § 204 Abs. 1 VVG","id":"2.2-1-4"},{"typ":"zahl","frage":"Herr Karl Engel (35) schließt eine Krankheitskostenvollversicherung ab. Der Tarifbeitrag ohne gesetzlichen Zuschlag beträgt 480 € im Monat. Wie hoch ist sein Monatsbeitrag einschließlich des gesetzlichen Zuschlags von 10 %?","wert":528,"einheit":"€","tol":0.02,"erkl":"Gesetzlicher Zuschlag: 480 € × 10 % = 48 €. Monatsbeitrag: 480 € + 48 € = 528 €. Der Zuschlag fließt in die Beitragsentlastung ab 65.","norm":"§ 149 VAG","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Bei der Proximus Versicherung AG in Halle (Saale) sind zwei Kunden vollversichert, beide als Angestellte wegen Überschreitens der JAEG versicherungsfrei. Frau Petra Wiegand (56) ist seit 2010 privat versichert und war seitdem nie gesetzlich versichert. Herr Sven Krüger (42) ist seit 2015 privat versichert. Beide verringern zum 01.07.2026 ihre Arbeitszeit von 40 auf 20 Wochenstunden; ihr Entgelt sinkt auf 3.000 € im Monat und liegt damit unter der JAEG 2026 von 77.400 €. Herr Krüger schickt am 20.08.2026 eine Kündigung mit der Mitgliedsbescheinigung seiner Krankenkasse.","items":[{"typ":"mc","frage":"Wie beurteilen Sie die Lage von Frau Wiegand?","optionen":["Sie wird ab 01.07.2026 versicherungspflichtig und muss in die GKV zurückkehren.","Sie kann frei wählen, ob sie Pflichtmitglied wird oder in der PKV bleibt.","Sie wird versicherungspflichtig, kann sich aber binnen drei Monaten befreien lassen.","Sie bleibt versicherungsfrei, weil sie über 55 und fünf Jahre nicht GKV-versichert war."],"richtig":[3],"erkl":"Wer nach Vollendung des 55. Lebensjahres versicherungspflichtig würde, bleibt versicherungsfrei, wenn er in den letzten fünf Jahren nicht gesetzlich versichert und mindestens die Hälfte der Zeit versicherungsfrei war. Frau Wiegand bleibt in der PKV.","norm":"§ 6 Abs. 3a SGB V","id":"2.2-2-1"},{"typ":"mc","frage":"Zu welchem Zeitpunkt endet der Vertrag von Herrn Krüger, und bis wann steht der Proximus der Beitrag zu?","optionen":["Zum 31.08.2026, dem Ende des Monats, in dem die Kündigung eingeht.","Zum 31.12.2026, dem Ende des laufenden Versicherungsjahres.","Rückwirkend zum 01.07.2026; Beiträge ab Juli 2026 werden erstattet.","Zum 30.09.2026, drei Monate nach Eintritt der Versicherungspflicht."],"richtig":[2],"erkl":"Die Kündigung ging innerhalb von drei Monaten nach Eintritt der Versicherungspflicht (01.07.2026) ein und wirkt rückwirkend. Der Versicherer erhält den Beitrag nur bis zu diesem Zeitpunkt.","norm":"§ 205 Abs. 2 VVG","id":"2.2-2-2"},{"typ":"wf","frage":"Welche Aussagen zur Lage von Herrn Krüger treffen zu?","aussagen":[["Er hätte sich binnen drei Monaten von der Versicherungspflicht befreien lassen können, weil er seine Arbeitszeit halbiert und seit über fünf Jahren versicherungsfrei war.",true],["Mit einer Anwartschaftsversicherung kann er sich die Rückkehr in die PKV ohne neue Gesundheitsprüfung offenhalten.",true],["Seine Kündigung wird unwirksam, wenn er den Eintritt der Versicherungspflicht nicht binnen zwei Monaten nach Aufforderung nachweist.",true],["Weil er älter als 40 Jahre ist, darf er nicht mehr in die GKV zurückkehren.",false],["Er kann neben der GKV-Mitgliedschaft keine private Zusatzversicherung abschließen.",false]],"erkl":"Die Altersgrenze liegt bei 55 Jahren. Die Befreiung bei Teilzeit setzt fünf Jahre Versicherungsfreiheit voraus; Zusatzversicherungen sind für GKV-Mitglieder jederzeit möglich.","norm":"§ 6 Abs. 3a, § 8 Abs. 1 Nr. 3 SGB V, § 205 Abs. 2 VVG","id":"2.2-2-3"}]}]},{"nr":"2.3","titel":"PKV-Angebot für Kundengruppen","lf":"LF 8","buch":"PV2 3.4 S. 129–145 · Lösungen S. 682–685","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welchen Anteil der beihilfefähigen Kosten muss die PKV bei einer ledigen Bundesbeamtin ohne Kinder abdecken?","optionen":["30 %, weil die Beihilfe für Beamte grundsätzlich 70 % übernimmt.","20 %, weil die Beihilfe für Beamte grundsätzlich 80 % übernimmt.","100 %, weil die Beihilfe nur bei stationärer Behandlung leistet.","50 %, weil der Beihilfebemessungssatz für sie 50 % beträgt."],"richtig":[3],"erkl":"Nach der
