,"id":"3.7-2-1"},{"typ":"zahl","frage":"In den ersten vier Monaten kostet ein ETF-Anteil 96 €, 120 €, 80 € und 96 €. Frau Sommer zahlt jeweils 120 € ein. Berechnen Sie den durchschnittlichen Preis, den sie je Anteil bezahlt hat.","wert":96.0,"einheit":"€","tol":0.05,"erkl":"Anteile: 120 : 96 = 1,25; 120 : 120 = 1,00; 120 : 80 = 1,50; 120 : 96 = 1,25; zusammen 5 Anteile. Durchschnittspreis = 480 € : 5 = 96,00 €. Der Durchschnitt der Kurse liegt bei 98,00 €; der Vorteil von 2,00 € je Anteil ist der Durchschnittskosteneffekt.","norm":"Lehrbuch: Fondssparplan (PV2 5.2)","id":"3.7-2-2"},{"typ":"zahl","frage":"Drei Jahre nach dem Kauf beträgt der Rücknahmepreis des Aktienfonds 92,40 €. Der Fonds schüttet nicht aus (thesaurierend). Berechnen Sie die Wertentwicklung der Einmalanlage in Prozent, bezogen auf die eingesetzten 12.600 € (ohne Steuern).","wert":10.0,"einheit":"%","tol":0.05,"erkl":"Wert heute = 150 × 92,40 € = 13.860 €. Gewinn = 13.860 € − 12.600 € = 1.260 €. Wertentwicklung = 1.260 € : 12.600 € × 100 = 10,0 %. Der Ausgabeaufschlag ist im eingesetzten Betrag enthalten und mindert so das Ergebnis.","norm":"KAGB (Rücknahmepreis); Lehrbuch: Wertentwicklung von Fonds","id":"3.7-2-3"},{"typ":"mc","frage":"Ein Kollege sagt zu Frau Sommer: „Mit einem weltweit streuenden Aktienfonds können Sie kein Geld verlieren.“ Beurteilen Sie die Aussage.","optionen":["Richtig: Weil der Fonds Sondervermögen ist, ist der Anteilswert vor Kursverlusten geschützt.","Falsch: Die Streuung senkt das Risiko einzelner Aktien, das Kursrisiko des Marktes bleibt.","Richtig: Bei über hundert Aktien im Fonds gleichen sich Gewinne und Verluste immer aus.","Falsch: Verluste drohen nur bei Insolvenz der KVG, Kursschwankungen gibt es bei Fonds nicht."],"richtig":[1],"erkl":"Streuung verringert das unsystematische Risiko einzelner Unternehmen. Fällt der gesamte Aktienmarkt, sinkt auch der Anteilswert; dieses Marktrisiko bleibt. Das Sondervermögen schützt nur bei Insolvenz der KVG, nicht vor Kursverlusten.","norm":"KAGB (Sondervermögen); Lehrbuch: Risiken von Investmentfonds","id":"3.7-2-4"}]}],"runde":"zusatz"},{"nr":"3.8","titel":"Anlageberatung: magisches Dreieck, Aktie und Anleihe","lf":"LF 10","buch":"PV2 5.2 und 5.5 S. 215–253, 269–284 · Lösungen S. 695–702, 706–711","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Warum spricht man in der Anlageberatung vom „magischen“ Dreieck?","optionen":["Die Ziele ergänzen sich; eine sichere Anlage bringt meist auch die höchste Rendite.","Rendite, Sicherheit und Liquidität stehen im Konflikt; keine Anlage erfüllt alle optimal.","Nur Anlagen, die alle drei Ziele zugleich voll erfüllen, dürfen empfohlen werden.","Das Dreieck zeigt die drei Steuerarten, die bei einer Geldanlage anfallen können."],"richtig":[1],"erkl":"Eine hohe Rendite ist meist mit weniger Sicherheit oder geringerer Verfügbarkeit verbunden. Weil keine Anlage alle drei Ziele zugleich optimal erfüllt, muss der Kunde Schwerpunkte setzen.","norm":"Lehrbuch: Magisches Dreieck der Geldanlage (PV2 5.5)","id":"3.8-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Anlageform ihre typische Ausprägung im magischen Dreieck zu.","paare":[["Tagesgeld","Hohe Liquidität und Sicherheit, aber geringe Rendite."],["Aktie eines einzelnen Unternehmens","Hohe Renditechance, aber geringe Sicherheit."],["Bundesanleihe, bis zur Fälligkeit gehalten","Hohe Sicherheit und planbare, feste Verzinsung."],["Offener Immobilienfonds","Eingeschränkte Liquidität durch Halte- und Rückgabefrist."]],"erkl":"Tagesgeld ist jederzeit verfügbar und durch die gesetzliche Einlagensicherung bis 100.000 € je Kunde und Bank geschützt. Die Einzelaktie bietet Chancen bei hohem Risiko. Die Bundesanleihe wird bei Fälligkeit zum Nennwert zurückgezahlt. Beim offenen Immobilienfonds gelten 24 Monate Haltefrist und 12 Monate Rückgabefrist.","norm":"Magisches Dreieck; § 255 KAGB; EinSiG","id":"3.8-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Ermittlung des Anlegerprofils vor einer Empfehlung treffen zu?","aussagen":[["Sie fragen Anlageziel, Anlagedauer und Risikobereitschaft des Kunden ab.",true],["Auch Kenntnisse und Erfahrungen mit Finanzanlagen gehören zum Anlegerprofil.",true],["Die finanziellen Verhältnisse, z. B. die Fähigkeit, Verluste zu tragen, sind zu berücksichtigen.",true],["Hat der Kunde es eilig, dürfen Sie auf die Befragung verzichten und trotzdem empfehlen.",false],["Geeignet ist stets die Anlage mit der höchsten Renditechance, unabhängig vom Risiko.",false]],"erkl":"Eine Empfehlung muss zum Kunden passen (Geeignetheit). Dazu braucht der Vermittler Angaben zu Zielen, Risikobereitschaft, Kenntnissen und finanziellen Verhältnissen. Ohne diese Angaben darf er keine Anlage empfehlen.","norm":"§ 34f GewO; § 16 Abs. 1 und 3 FinVermV (Geeignetheit der Empfehlung)","id":"3.8-1-3"},{"typ":"mc","frage":"Welches Recht des Aktionärs gehört zu den Vermögensrechten?","optionen":["Das Stimmrecht in der Hauptversammlung.","Das Auskunftsrecht in der Hauptversammlung.","Das Recht, Beschlüsse der Hauptversammlung anzufechten.","Das Recht auf Anteil am Bilanzgewinn (Dividende)."],"richtig":[3],"erkl":"Vermögensrechte sind das Recht auf Dividende, das Bezugsrecht bei Kapitalerhöhungen und der Anteil am Liquidationserlös. Stimm-, Auskunfts- und Anfechtungsrecht sind Mitgliedschafts- bzw. Verwaltungsrechte.","norm":"AktG (§ 58 Abs. 4 Dividende, § 131 Auskunft, § 186 Bezugsrecht)","id":"3.8-1-4"},{"typ":"wf","frage":"Welche Aussagen zu den Risiken einer festverzinslichen Anleihe treffen zu?","aussagen":[["Steigt der Marktzins, fällt der Kurs bereits umlaufender Festzinsanleihen.",true],["Wer bis zur Fälligkeit hält, erhält bei zahlungsfähigem Emittenten den Nennwert zurück.",true],["Eine Herabstufung des Ratings des Emittenten senkt tendenziell den Kurs der Anleihe.",true],["Bonitätsrisiko bedeutet, dass der Kurs wegen steigender Marktzinsen fällt.",false],["Bei Staatsanleihen ist ein Bonitätsrisiko ausgeschlossen.",false]],"erkl":"Das Zinsänderungsrisiko trifft vor allem den, der vor Fälligkeit verkauft. Das Bonitätsrisiko ist das Risiko, dass der Emittent Zinsen oder Rückzahlung nicht leisten kann; es besteht auch bei Staaten (je nach Bonität unterschiedlich hoch), ausgeschlossen ist es also nicht.","norm":"§ 793 BGB (Schuldverschreibung); Anleihebedingungen","id":"3.8-1-5"},{"typ":"zahl","frage":"Eine Anleihe hat einen Nominalzins von 3,15 % und notiert an der Börse bei 105 %. Berechnen Sie die laufende Verzinsung.","wert":3.0,"einheit":"%","tol":0.05,"erkl":"Laufende Verzinsung = Nominalzins × 100 : Kurs = 3,15 × 100 : 105 = 3,00 %. Weil der Kurs über 100 % liegt, ist die laufende Verzinsung niedriger als der Nominalzins.","norm":"Lehrbuch: Rendite von Schuldverschreibungen (PV2 5.2)","id":"3.8-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Matthias Krüger (52), Werkstattleiter aus Halle (Saale), hat von seiner Tante geerbt: 60.000 € Guthaben, 200 Aktien der Saale-Chemie AG und eine Anleihe der Mitteldeutschen Energie AG im Nennwert von 20.000 € (Nominalzins 2,4 %, aktueller Kurs 96 %). Er hat Grundkenntnisse in Aktien und Fonds und eine mittlere Risikobereitschaft. 10.000 € will er jederzeit verfügbar halten, den Rest möchte er etwa zehn Jahre anlegen. Die Saale-Chemie AG erhöht ihr Grundkapital von 40 Mio. € auf 50 Mio. €. Der Kurs der alten Aktie beträgt 56 €, der Ausgabekurs der jungen Aktie 46 €.","items":[{"typ":"zahl","frage":"Berechnen Sie den rechnerischen Wert des Bezugsrechts der Saale-Chemie AG.","wert":2.0,"einheit":"€","tol":0.05,"erkl":"Bezugsverhältnis = altes Grundkapital : Erhöhung = 40 Mio. € : 10 Mio. € = 4 : 1. Bezugsrecht = (Kurs alt − Ausgabekurs neu) : (Bezugsverhältnis + 1) = (56 € − 46 €) : (4 + 1) = 2,00 €. Probe: Mischkurs (4 × 56 € + 46 €) : 5 = 54 € = 56 € − 2 €.","norm":"§§ 182, 186 AktG (Kapitalerhöhung, Bezugsrecht)","id":"3.8-2-1"},{"typ":"mc","frage":"Herr Krüger möchte keine weiteren Aktien kaufen. Welche Möglichkeit erläutern Sie ihm?","optionen":["Er kann die Bezugsrechte verkaufen; der Erlös gleicht den rechnerischen Kursrückgang aus.","Er muss die jungen Aktien kaufen, weil er sonst seine alten Aktien vollständig verliert.","Er sollte nichts tun; der Kurs der alten Aktie steigt nach der Erhöhung um das Bezugsrecht.","Er sollte die alten Aktien sofort verkaufen, weil sie nach der Erhöhung kein Stimmrecht haben."],"richtig":[0],"erkl":"Nach der Kapitalerhöhung sinkt der Kurs rechnerisch um den Wert des Bezugsrechts (auf 54 €). Verkauft Herr Krüger seine 200 Bezugsrechte zu je 2 €, erhält er 400 € und bleibt vermögensmäßig gleichgestellt; nur sein Stimmrechtsanteil sinkt leicht.","norm":"§ 186 AktG (Bezugsrecht)","id":"3.8-2-2"},{"typ":"zahl","frage":"Herr Krüger überlegt, die geerbte Anleihe zu verkaufen. Berechnen Sie den Kurswert ohne Stückzinsen und Gebühren.","wert":19200,"einheit":"€","tol":0.5,"erkl":"Kurswert = Nennwert × Kurs : 100 = 20.000 € × 96 : 100 = 19.200 €. Der Kurs unter 100 % deutet darauf hin, dass der Marktzins für vergleichbare Anleihen über dem Nominalzins von 2,4 % liegt.","norm":"§ 793 BGB; Anleihebedingungen","id":"3.8-2-3"},{"typ":"mc","frage":"Welche Empfehlung für die 60.000 € passt am besten zum Anlegerprofil von Herrn Krüger?","optionen":["60.000 € ganz in Aktien der Saale-Chemie AG, um junge Aktien günstig beziehen zu können.","60.000 € ganz als Tagesgeld, weil Sicherheit in der Beratung immer Vorrang vor Rendite hat.","10.000 € als Tagesgeld, 50.000 € gestreut in Misch- und Aktienfonds für die zehn Jahre.","60.000 € ganz in einen offenen Immobilienfonds, weil Immobilien als besonders wertstabil gelten."],"richtig":[2],"erkl":"Die Liquiditätsreserve von 10.000 € gehört in eine jederzeit verfügbare, sichere Anlage. Für zehn Jahre und mittlere Risikobereitschaft passt eine gestreute Fondsanlage mit Aktien- und Anleiheanteil. Eine Einzelaktie wäre zu riskant, reines Tagesgeld bringt zu wenig Rendite, der Immobilienfonds ist wegen Halte- und Rückgabefrist nicht jederzeit verfügbar und streut nicht über Anlageklassen.","norm":"§ 34f GewO; § 16 Abs. 1 FinVermV (Geeignetheit); magisches Dreieck","id":"3.8-2-4"}]}],"runde":"zusatz"},{"nr":"3.9","titel":"Private Rentenversicherung: Rente, Hinterbliebenenschutz und Steuer","lf":"LF 11","buch":"PV2 4.3–4.8 S. 169–211 · Lösungen S. 690–695","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Worin unterscheidet sich die fondsgebundene von der klassischen privaten Rentenversicherung?","optionen":["Bei der fondsgebundenen ist die Rente voll garantiert, bei der klassischen nicht.","Die fondsgebundene zahlt nur eine Kapitalleistung und nie eine lebenslange Rente.","Die klassische legt ausschließlich in Aktienfonds an, die fondsgebundene in Anleihen.","Die Rentenhöhe hängt vom Fondsguthaben ab; das Anlagerisiko trägt der Kunde."],"richtig":[3],"erkl":"Bei der fondsgebundenen Rentenversicherung fließen die Sparanteile in Fonds. Die Rente richtet sich nach dem Fondsguthaben bei Rentenbeginn; Chancen und Risiken trägt der Kunde. Die klassische Variante bietet garantierte Leistungen und Überschüsse.","norm":"Musterbedingungen (AVB Rentenversicherung, fondsgebunden)","id":"3.9-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Rentengarantiezeit","Stirbt der Versicherte nach Rentenbeginn, wird die Rente bis zum Ende dieser Frist weitergezahlt."],["Beitragsrückgewähr","Bei Tod vor Rentenbeginn werden die gezahlten Beiträge ausgezahlt."],["Kapitalwahlrecht","Statt der Rente kann vor Rentenbeginn eine einmalige Kapitalzahlung gewählt werden."],["Rentenfaktor","Monatsrente, die je 10.000 € Kapital bei Rentenbeginn gezahlt wird."],["Aufschubzeit","Zeitraum vom Vertragsbeginn bis zum Rentenbeginn (Ansparphase)."]],"erkl":"Beitragsrückgewähr schützt Hinterbliebene in der Ansparphase, die Rentengarantiezeit in der Rentenphase. Der Rentenfaktor rechnet das Kapital in eine Monatsrente um.","norm":"Musterbedingungen (AVB Rentenversicherung)","id":"3.9-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Überschussbeteiligung und zu den Bewertungsreserven treffen zu?","aussagen":[["Bewertungsreserven entstehen, wenn der Marktwert der Kapitalanlagen über ihrem Buchwert liegt.",true],["Bei Vertragsende, in der Rentenversicherung zum Ende der Ansparphase, wird grundsätzlich die Hälfte der zugeordneten Bewertungsreserven zugeteilt.",true],["Die Höhe der Überschussbeteiligung ist bei Vertragsschluss für die gesamte Laufzeit garantiert.",false],["Die Überschussbeteiligung kann durch ausdrückliche Vereinbarung ausgeschlossen werden, allerdings nur insgesamt.",true],["Bewertungsreserven werden jedes Jahr vollständig an alle Kunden ausgeschüttet.",false]],"erkl":"Nach § 153 Abs. 1 VVG steht dem Versicherungsnehmer eine Beteiligung an Überschuss und Bewertungsreserven zu, es sei denn, sie ist durch ausdrückliche Vereinbarung ausgeschlossen; ausgeschlossen werden kann sie nur insgesamt, nicht etwa nur für die Bewertungsreserven. Ohne eine solche Vereinbarung besteht der Anspruch, eine stillschweigende oder teilweise Kürzung wäre nach § 171 VVG unwirksam. Die Höhe der Überschüsse ist nicht garantiert. Bewertungsreserven werden jährlich neu ermittelt und bei Beendigung bzw. bei Rentenversicherungen zum Ende der Ansparphase zur Hälfte zugeteilt; aufsichtsrechtliche Regeln zur Sicherung der Erfüllbarkeit (§ 139 VAG) können den Betrag mindern.","norm":"§ 153 Abs. 1, 3 und 4 VVG; § 171 VVG","id":"3.9-1-3"},{"typ":"mc","frage":"Wie wird die lebenslange Rente aus einer privaten Rentenversicherung (3. Schicht) besteuert?","optionen":["Mit dem Ertragsanteil, der vom Alter bei Rentenbeginn abhängt.","Mit dem Besteuerungsanteil, der vom Jahr des Rentenbeginns abhängt.","Mit 25 % Abgeltungsteuer auf die volle Rente, ohne Steuererklärung.","Gar nicht, weil die Beiträge aus versteuertem Einkommen stammen."],"richtig":[0],"erkl":"Private Leibrenten werden nur mit dem Ertragsanteil besteuert, denn ein Teil der Rente ist Rückzahlung des Kapitals. Der Ertragsanteil ist umso niedriger, je älter der Kunde bei Rentenbeginn ist. Der Besteuerungsanteil gilt für Renten der 1. Schicht.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG","id":"3.9-1-4"},{"typ":"mc","frage":"Ein Kunde lässt sich statt der Rente das Kapital auszahlen (Vertrag von 2014). Wann ist nur die Hälfte des Ertrags steuerpflichtig?","optionen":["Wenn der Vertrag mindestens 5 Jahre lief, und zwar unabhängig vom Alter des Kunden.","Wenn er das Kapital innerhalb eines Jahres in eine selbst genutzte Immobilie steckt.","Bei mindestens 12 Jahren Laufzeit und Auszahlung nach Vollendung des 62. Lebensjahres.","Wenn er bei Auszahlung jünger als 60 ist und mindestens 10 Jahre eingezahlt hat."],"richtig":[2],"erkl":"Ertrag ist die Auszahlung minus Summe der Beiträge. Nur die Hälfte ist steuerpflichtig, wenn der Vertrag mindestens 12 Jahre lief und die Auszahlung nach Vollendung des 60. Lebensjahres erfolgt (§ 20 Abs. 1 Nr. 6 Satz 2 EStG); für Verträge ab 2012 tritt an die Stelle des 60. das 62. Lebensjahr (§ 52 Abs. 28 Satz 7 EStG). Sonst gilt die Abgeltungsteuer auf den vollen Ertrag.","norm":"§ 20 Abs. 1 Nr. 6 Satz 2 i. V. m. § 52 Abs. 28 Satz 7 EStG","id":"3.9-1-5"},{"typ":"mc","frage":"Eine Kundin (67) möchte 100.000 € so anlegen, dass sie bis an ihr Lebensende eine feste Zusatzrente erhält. Welches Produkt empfehlen Sie?","optionen":["Einen Fondsentnahmeplan, weil er eine lebenslange Zahlung in fester Höhe garantiert.","Eine sofort beginnende Rentenversicherung gegen Einmalbeitrag, weil sie lebenslang zahlt.","Eine Riester-Rente, weil Rentnerinnen ab 67 die volle Grundzulage bekommen.","Eine Risikolebensversicherung, weil sie im Erlebensfall eine lebenslange Rente zahlt."],"richtig":[1],"erkl":"Nur die Rentenversicherung sichert das Langlebigkeitsrisiko ab: Sie zahlt, solange die Kundin lebt. Ein Entnahmeplan endet, wenn das Kapital verbraucht ist. Eine Risikolebensversicherung leistet nur im Todesfall.","norm":"Musterbedingungen (AVB Rentenversicherung)","id":"3.9-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Jens Albrecht aus Halle (Saale) wird im Dezember 2026 65 Jahre alt. Seit dem 01.01.2013 hat er bei der Proximus Versicherung AG eine aufgeschobene klassische Rentenversicherung und zahlt monatlich 600 € Beitrag. Die Rente beginnt am 01.01.2027. Laut Mitteilung der Proximus stehen zum Rentenbeginn 120.000 € Kapital einschließlich Überschüssen zur Verfügung; der Rentenfaktor beträgt 32,50 € je 10.000 €. Vereinbart sind eine Rentengarantiezeit von 10 Jahren und ein Kapitalwahlrecht. Der Ertragsanteil beträgt bei Rentenbeginn mit 65 Jahren 18 %. Seine Ehefrau Karin (62) ist für den Todesfall bezugsberechtigt.","items":[{"typ":"zahl","frage":"Berechnen Sie die monatliche Rente von Herrn Albrecht.","wert":390,"einheit":"€","tol":0.5,"erkl":"Monatsrente = Kapital : 10.000 × Rentenfaktor = 120.000 € : 10.000 × 32,50 € = 12 × 32,50 € = 390,00 €.","norm":"Musterbedingungen (AVB Rentenversicherung); Tarif der Proximus","id":"3.9-2-1"},{"typ":"zahl","frage":"Berechnen Sie den steuerpflichtigen Ertragsanteil der Jahresrente 2027 von Herrn Albrecht (ohne Werbungskosten-Pauschbetrag).","wert":842.4,"einheit":"€","tol":0.5,"erkl":"Jahresrente = 12 × 390 € = 4.680 €. Steuerpflichtig ist der Ertragsanteil: 4.680 € × 18 % = 842,40 €. Bei der Ermittlung der sonstigen Einkünfte wird davon noch der Werbungskosten-Pauschbetrag von 102 € abgezogen (§ 9a Satz 1 Nr. 3 EStG).","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. bb EStG","id":"3.9-2-2"},{"typ":"mc","frage":"Herr Albrecht stirbt vier Jahre nach Rentenbeginn. Was gilt für Frau Albrecht?","optionen":["Sie erhält die Rente noch sechs Jahre bis zum Ende der Rentengarantiezeit.","Sie erhält die Beiträge von 100.800 € abzüglich der bereits gezahlten Renten.","Sie erhält die Rente lebenslang weiter, weil sie als Bezugsberechtigte eingetragen ist.","Sie erhält nichts, weil eine Rentenversicherung mit dem Tod der Person stets endet."],"richtig":[0],"erkl":"Mit der Rentengarantiezeit von 10 Jahren wird die Rente nach dem Tod bis zum Ende dieser Frist an die Bezugsberechtigte gezahlt. Nach vier Jahren Rentenbezug sind das noch sechs Jahre. Eine lebenslange Hinterbliebenenrente wäre eine eigene Vereinbarung.","norm":"Musterbedingungen (AVB Rentenversicherung); § 159 VVG (Bezugsrecht)","id":"3.9-2-3"},{"typ":"mc","frage":"Herr Albrecht überlegt, das Kapitalwahlrecht auszuüben. Wie wird die Kapitalzahlung von 120.000 € besteuert?","optionen":["Der volle Ertrag von 19.200 € mit 25 % Abgeltungsteuer zuzüglich Solidaritätszuschlag.","Das gesamte Kapital mit dem Ertragsanteil von 18 %, also 21.600 € mit seinem Steuersatz.","Gar nicht, weil der Vertrag länger als 12 Jahre lief und er dann älter als 60 Jahre ist.","Die Hälfte des Ertrags von 19.200 €, also 9.600 €, mit seinem persönlichen Steuersatz."],"richtig":[3],"erkl":"Beiträge = 14 Jahre × 12 × 600 € = 100.800 €. Ertrag = 120.000 € − 100.800 € = 19.200 €. Der Vertrag lief mindestens 12 Jahre und Herr Albrecht ist älter als 62, daher ist nur die Hälfte (9.600 €) zu versteuern, und zwar mit dem persönlichen Steuersatz statt mit der Abgeltungsteuer.","norm":"§ 20 Abs. 1 Nr. 6 Satz 2 i. V. m. § 52 Abs. 28 Satz 7 EStG; § 32d Abs. 2 Nr. 2 EStG","id":"3.9-2-4"}]}],"runde":"zusatz"},{"nr":"3.10","titel":"Drei-Schichten-Modell: Basisrente, Riester und betriebliche Altersversorgung","lf":"LF 11","buch":"PV2 4.2–4.3 S. 161–182 · Lösungen S. 689–691","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Vorsorgeprodukt seine Schicht und steuerliche Behandlung zu.","paare":[["Basisrente","1. Schicht: Beiträge als Sonderausgaben, Rente mit Besteuerungsanteil."],["Riester-Rente","2. Schicht: Zulagen und zusätzlicher Sonderausgabenabzug."],["Direktversicherung per Entgeltumwandlung","2. Schicht: Beiträge in Grenzen steuerfrei, Rente voll steuerpflichtig."],["Private Rentenversicherung","3. Schicht: Beiträge ohne Förderung, Rente mit Ertragsanteil."]],"erkl":"Die 1. Schicht umfasst die Basisversorgung (gesetzliche Rente, Basisrente), die 2. Schicht die geförderte Zusatzversorgung (Riester, bAV), die 3. Schicht die übrigen Kapitalanlageprodukte. Je stärker die Förderung in der Ansparphase, desto stärker die Besteuerung im Alter.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b, § 10a, § 3 Nr. 63, § 22 EStG","id":"3.10-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Basisrente treffen zu?","aussagen":[["Sie wird als lebenslange monatliche Rente gezahlt, bei Verträgen ab 2012 frühestens ab 62.",true],["Die Ansprüche sind nicht vererblich, nicht übertragbar und nicht beleihbar.",true],["Zum Rentenbeginn kann sich der Kunde das Kapital in einer Summe auszahlen lassen.",false],["Eine ergänzende Absicherung der Berufsunfähigkeit kann eingeschlossen werden.",true],["Beiträge sind 2026 bis 30.826 € (Ledige) nur zu 84 % als Sonderausgaben abziehbar.",false]],"erkl":"Die Basisrente ist eine lebenslange Leibrente ohne Kapitalwahlrecht; die Ansprüche dürfen nicht vererbt, übertragen, beliehen oder kapitalisiert werden. Beiträge sind 2026 bis 30.826 € (Ledige) zu 100 % abziehbar; 84 % ist der Besteuerungsanteil der Rente bei Rentenbeginn 2026.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b und Abs. 3 EStG","id":"3.10-1-2"},{"typ":"zahl","frage":"Frau Heike Lorenz geht am 01.01.2026 in Rente. Ihre Basisrente beträgt 600 € im Monat. Berechnen Sie den der Besteuerung unterliegenden Teil der Jahresrente 2026 (ohne Pauschbeträge).","wert":6048,"einheit":"€","tol":0.5,"erkl":"Jahresrente = 12 × 600 € = 7.200 €. Besteuerungsanteil bei Rentenbeginn 2026: 84 %. Steuerpflichtig: 7.200 € × 84 % = 6.048 €. Der steuerfreie Teil wird ab dem Folgejahr als fester Eurobetrag festgeschrieben.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. aa EStG","id":"3.10-1-3"},{"typ":"mc","frage":"Welche Aussage zur Riester-Förderung nach geltendem Recht 2026 trifft zu?","optionen":["Die Grundzulage beträgt 300 € im Jahr und wird auch ohne eigene Beiträge gezahlt.","Die Zulagen werden erst bei Rentenbeginn in einer Summe auf das Girokonto überwiesen.","Für jedes ab 2008 geborene Kind mit Kindergeldanspruch gibt es 300 € Kinderzulage.","Unmittelbar zulageberechtigt sind alle Selbstständigen, auch ohne Rentenpflicht."],"richtig":[2],"erkl":"Die Grundzulage beträgt 175 € jährlich, die Kinderzulage 300 € für ab 2008 geborene Kinder (185 € für ältere). Die Zulagen fließen jährlich auf den Vertrag, die volle Zulage gibt es nur bei Zahlung des Mindesteigenbeitrags. Nicht rentenversicherungspflichtige Selbstständige sind nicht unmittelbar berechtigt. Diese Werte gelten für das Beitragsjahr 2026; das Altersvorsorgereformgesetz (u. a. Altersvorsorgedepot) greift erst ab 01.01.2027.","norm":"§§ 79, 84, 85, 86 EStG","id":"3.10-1-4"},{"typ":"zuo","frage":"Ordnen Sie jedem Durchführungsweg der betrieblichen Altersversorgung die passende Beschreibung zu.","paare":[["Direktzusage","Der Arbeitgeber zahlt die Versorgung später selbst aus seinem Betriebsvermögen."],["Unterstützungskasse","Versorgungseinrichtung, die keinen Rechtsanspruch auf ihre Leistungen gewährt."],["Direktversicherung","Lebensversicherung, die der Arbeitgeber auf das Leben des Arbeitnehmers abschließt."],["Pensionskasse","Versorgungseinrichtung mit Rechtsanspruch, beaufsichtigt wie ein Lebensversicherer."],["Pensionsfonds","Versorgungseinrichtung mit Rechtsanspruch und freierer Kapitalanlage."]],"erkl":"Das Betriebsrentengesetz kennt fünf Durchführungswege. Direktzusage und Unterstützungskasse werden häufig als interne, die übrigen drei als externe Durchführungswege bezeichnet; nur für die externen gilt die Steuerfreiheit nach § 3 Nr. 63 EStG. Pensionskasse und Pensionsfonds gewähren beide einen Rechtsanspruch, der Pensionsfonds ist bei der Kapitalanlage freier.","norm":"§ 1 Abs. 1, § 1b Abs. 2–4 BetrAVG","id":"3.10-1-5"},{"typ":"mc","frage":"Bis zu welchem Betrag kann ein Arbeitnehmer 2026 nach § 1a BetrAVG die Umwandlung von Entgelt für seine bAV verlangen?","optionen":["Bis zu 8 % der BBG der Rentenversicherung, also 8.112 € im Jahr.","Bis zu 4 % der BBG der Rentenversicherung, also 4.056 € im Jahr.","Bis zu 4 % der BBG der Krankenversicherung, also 2.790 € im Jahr.","Bis zu 2.100 € im Jahr, wie beim Sonderausgabenabzug für Riester."],"richtig":[1],"erkl":"Der Anspruch auf Entgeltumwandlung umfasst bis zu 4 % der BBG der allgemeinen Rentenversicherung: 101.400 € × 4 % = 4.056 €. 8 % der BBG (8.112 €) ist die Grenze für die Steuerfreiheit der Beiträge nach § 3 Nr. 63 EStG.","norm":"§ 1a Abs. 1 BetrAVG; § 3 Nr. 63 EStG","id":"3.10-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Thomas Brandt (46) führt eine Tischlerei mit drei Beschäftigten in Halle (Saale). Nach 18 Jahren mit Pflichtbeiträgen hat er sich von der gesetzlichen Rentenversicherungspflicht befreien lassen und zahlt keine Beiträge mehr. Er möchte ab 2026 jährlich 12.000 € in eine Basisrente der Proximus Versicherung AG einzahlen; sein Grenzsteuersatz beträgt laut Steuerberater 35 % (ohne Solidaritätszuschlag und Kirchensteuer), der Höchstbetrag wird nicht ausgeschöpft. Seine Ehefrau Anja (43) ist als Bürokauffrau bei einer Hausverwaltung rentenversicherungspflichtig angestellt; ihr rentenversicherungspflichtiges Bruttoentgelt 2025 betrug 38.500 €. Für die Kinder Lisa (geb. 2011) und Max (geb. 2014) wird Kindergeld gezahlt, die Kinderzulagen erhält Anja. Anja hat einen Riester-Vertrag und möchte zusätzlich monatlich 150 € Entgelt in eine Direktversicherung ihres Arbeitgebers umwandeln.","items":[{"typ":"zahl","frage":"Berechnen Sie vereinfacht die jährliche Steuerersparnis von Herrn Brandt durch die Basisrente.","wert":4200,"einheit":"€","tol":0.5,"erkl":"Die Beiträge sind 2026 zu 100 % als Sonderausgaben abziehbar, der Höchstbetrag ist nicht erreicht. Steuerersparnis = 12.000 € × 35 % = 4.200 €.","norm":"§ 10 Abs. 1 Nr. 2 Buchst. b und Abs. 3 EStG","id":"3.10-2-1"},{"typ":"mc","frage":"Herr Brandt fragt, wie seine Basisrente später besteuert wird. Was antworten Sie?","optionen":["Nachgelagert mit einem Anteil, der sich nach dem Jahr des Rentenbeginns richtet.","Nur mit dem Ertragsanteil, der sich nach seinem Lebensalter bei Rentenbeginn richtet.","Gar nicht, weil er die Beiträge aus seinem bereits versteuerten Gewinn gezahlt hat.","Mit 25 % Abgeltungsteuer auf den Unterschied zwischen Renten und gezahlten Beiträgen."],"richtig":[0],"erkl":"Die Basisrente gehört zur 1. Schicht: Die Beiträge mindern heute die Steuer, die Rente wird später mit dem Besteuerungsanteil versteuert. Dieser richtet sich nach dem Jahr des Rentenbeginns und steigt für spätere Jahrgänge.","norm":"§ 22 Nr. 1 Satz 3 Buchst. a Doppelbuchst. aa EStG","id":"3.10-2-2"},{"typ":"zahl","frage":"Berechnen Sie den Mindesteigenbeitrag, den Anja 2026 in ihren Riester-Vertrag zahlen muss, um die vollen Zulagen zu erhalten.","wert":765,"einheit":"€","tol":0.5,"erkl":"4 % der beitragspflichtigen Einnahmen des Vorjahres 2025: 38.500 € × 4 % = 1.540 € (unter dem Höchstbetrag von 2.100 €). Zulagen: Grundzulage 175 € + 2 × 300 € Kinderzulage = 775 €. Mindesteigenbeitrag = 1.540 € − 775 € = 765 € (über dem Sockelbetrag von 60 €).","norm":"§ 86 Abs. 1 EStG; §§ 84, 85 EStG","id":"3.10-2-3"},{"typ":"zahl","frage":"Anjas Arbeitgeber spart durch die Entgeltumwandlung Sozialversicherungsbeiträge. Berechnen Sie den monatlichen Gesamtbeitrag zur Direktversicherung einschließlich des gesetzlichen Arbeitgeberzuschusses.","wert":172.5,"einheit":"€","tol":0.5,"erkl":"Der Arbeitgeber muss 15 % des umgewandelten Entgelts zusätzlich zahlen, soweit er Sozialversicherungsbeiträge spart. Anjas Entgelt liegt unter den Beitragsbemessungsgrenzen und die 150 € bleiben unter 4 % der BBG RV (338 € im Monat); der Arbeitgeber spart also seinen vollen Anteil (über 15 %). Zuschuss = 150 € × 15 % = 22,50 €. Gesamtbeitrag = 150 € + 22,50 € = 172,50 €.","norm":"§ 1a Abs. 1a BetrAVG","id":"3.10-2-4"}]}],"runde":"zusatz"}]},{"nr":"4","titel":"Einkommen absichern und Hinterbliebene versorgen","lf":"LF 7, LF 11","abschnitte":[{"nr":"4.1","titel":"Gesetzliche Absicherung und Versorgungslücke","lf":"LF 7, LF 11","buch":"PV2 6.1–6.2 S. 285–293 · Lösungen S. 711–712","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann ist eine Versicherte nach dem SGB VI voll erwerbsgemindert?","optionen":["Sie kann auf dem allgemeinen Arbeitsmarkt weniger als drei Stunden täglich arbeiten.","Sie kann in ihrem zuletzt ausgeübten Beruf weniger als sechs Stunden täglich arbeiten.","Sie kann auf dem allgemeinen Arbeitsmarkt weniger als sechs Stunden täglich arbeiten.","Sie kann in ihrem erlernten Beruf weniger als die Hälfte der üblichen Zeit arbeiten."],"richtig":[0],"erkl":"Volle Erwerbsminderung: unter drei Stunden täglich auf dem allgemeinen Arbeitsmarkt; drei bis unter sechs Stunden bedeutet teilweise Erwerbsminderung. Der bisherige Beruf spielt (außer für vor dem 2.1.1961 Geborene) keine Rolle.","norm":"§ 43 Abs. 1 und 2 SGB VI","id":"4.1-1-1"},{"typ":"mc","frage":"Welche versicherungsrechtlichen Voraussetzungen gelten neben der Erwerbsminderung für die Erwerbsminderungsrente?","optionen":["allgemeine Wartezeit von fünfzehn Jahren und ein Jahr Pflichtbeiträge in den letzten fünf Jahren","allgemeine Wartezeit von fünf Jahren und drei Jahre Pflichtbeiträge in den letzten fünf Jahren","Wartezeit von 35 Jahren und durchgehende Pflichtbeiträge in den letzten zehn Jahren vor Antrag","keine Wartezeit, aber mindestens sechs Monate Pflichtbeiträge im letzten Kalenderjahr vor Antrag"],"richtig":[1],"erkl":"Die Rente wegen Erwerbsminderung setzt die allgemeine Wartezeit (fünf Jahre) und drei Jahre Pflichtbeiträge in den letzten fünf Jahren vor Eintritt der Erwerbsminderung voraus; bei Arbeitsunfällen gilt die Wartezeit vorzeitig als erfüllt.","norm":"§ 43 Abs. 1 Satz 1 Nr. 2 und 3, §§ 50, 53 SGB VI","id":"4.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur gesetzlichen Unfallversicherung treffen zu?","aussagen":[["Ein Unfall auf dem unmittelbaren Weg zwischen Wohnung und Arbeitsstätte ist als Wegeunfall versichert.",true],["Unfälle in der Freizeit, etwa beim Sport am Wochenende, sind nicht versichert.",true],["Kinder in Kita und Schule sind während des Besuchs gesetzlich unfallversichert.",true],["Die Beiträge zur gesetzlichen Unfallversicherung teilen sich Arbeitgeber und Arbeitnehmer je zur Hälfte.",false],["Eine Verletztenrente wird schon ab einer Minderung der Erwerbsfähigkeit von 10 % gezahlt.",false]],"erkl":"Versichert sind Arbeits- und Wegeunfälle sowie Berufskrankheiten; die Beiträge trägt allein der Arbeitgeber. Verletztenrente gibt es erst ab einer MdE von mindestens 20 % über die 26. Woche hinaus – die Freizeit bleibt eine Lücke für die private Unfallversicherung.","norm":"§§ 2, 8, 56, 150 SGB VII","id":"4.1-1-3"},{"typ":"zuo","frage":"Ordnen Sie der Hinterbliebenenrente aus der gesetzlichen Rentenversicherung (neues Recht) den passenden Anteil an der Rente des Verstorbenen zu.","paare":[["große Witwen-/Witwerrente","55 % der Rente des Verstorbenen"],["kleine Witwen-/Witwerrente","25 %, in der Regel längstens 24 Monate"],["Halbwaisenrente","10 % zuzüglich eines Zuschlags"],["Vollwaisenrente","20 % zuzüglich eines Zuschlags"]],"erkl":"Die Hinterbliebenenrenten sind Bruchteile der Versichertenrente; eigenes Einkommen des Hinterbliebenen wird oberhalb eines Freibetrags zu 40 % angerechnet. Die Versorgungslücke ist deshalb meist erheblich.","norm":"§§ 46, 48, 67, 97 SGB VI","id":"4.1-1-4"},{"typ":"mc","frage":"Warum reicht die gesetzliche Erwerbsminderungsrente für einen 25-jährigen Angestellten in der Regel nicht aus?","optionen":["Sie wird erst nach Erreichen der Regelaltersgrenze ausgezahlt und ist damit für Junge wertlos.","Sie wird nur bei einem Arbeitsunfall gezahlt und deckt Erkrankungen nicht ab.","Sie liegt oft deutlich unter dem bisherigen Nettoeinkommen und bezieht sich nicht auf den Beruf.","Sie wird nur gezahlt, wenn zusätzlich eine private Berufsunfähigkeitsrente besteht."],"richtig":[2],"erkl":"Die EM-Rente orientiert sich an den Entgeltpunkten und an der Arbeitsfähigkeit auf dem allgemeinen Arbeitsmarkt, nicht am Beruf; sie ist häufig befristet und liegt weit unter dem Netto.","norm":"§§ 43, 102 Abs. 2 SGB VI","id":"4.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Tobias Engel (34) ist angestellter Elektriker in Halle (Saale), verheiratet mit Nina (32) und Vater einer Tochter (4). Er zahlt seit 16 Jahren Pflichtbeiträge. Sein Nettoeinkommen beträgt 2.500 € im Monat. Laut Renteninformation 2026 erhielte er bei voller Erwerbsminderung eine Rente von 1.150 € brutto, nach Abzug der Beiträge zur Kranken- und Pflegeversicherung rund 1.030 € netto. Er möchte wissen, wie gut seine Familie abgesichert ist.","items":[{"typ":"zahl","frage":"Herr Engel möchte bei voller Erwerbsminderung 80 % seines Nettoeinkommens zur Verfügung haben. Wie hoch ist seine monatliche Versorgungslücke in Euro?","wert":970,"einheit":"€","tol":0.5,"erkl":"Zielversorgung: 2.500 € × 80 % = 2.000 €. Abzüglich netto EM-Rente 1.030 € ergibt sich eine Lücke von 970 € im Monat.","norm":"§ 43 Abs. 2 SGB VI; Bedarfsanalyse","id":"4.1-2-1"},{"typ":"zahl","frage":"Herr Engel stirbt. Nina hat kein anrechenbares eigenes Einkommen und erfüllt die Voraussetzungen der großen Witwenrente (neues Recht). Wie hoch ist ihre monatliche Witwenrente brutto nach dem Sterbevierteljahr, wenn als Rente des Verstorbenen die volle EM-Rente von 1.150 € zugrunde gelegt wird?","wert":632.5,"einheit":"€","tol":0.5,"erkl":"Große Witwenrente: 55 % der Rente des Verstorbenen = 1.150 € × 0,55 = 632,50 € brutto. Gegenüber dem Haushaltsnetto von 2.500 € bleibt eine große Lücke für die Hinterbliebenenvorsorge.","norm":"§§ 46 Abs. 2, 67 Nr. 6 SGB VI","id":"4.1-2-2"},{"typ":"mc","frage":"Herr Engel meint: „Wenn mir etwas passiert, zahlt doch die Berufsgenossenschaft.“ Wie antworten Sie zutreffend?","optionen":["Ja, die Berufsgenossenschaft zahlt bei jedem Unfall und jeder Krankheit eine Rente in Höhe des Nettolohns.","Nur bei Freizeitunfällen, weil Arbeitsunfälle die gesetzliche Rentenversicherung abdeckt.","Nur dann, wenn er zusätzlich eine private Unfallversicherung bei uns abgeschlossen hat.","Nur bei Arbeits- und Wegeunfällen sowie Berufskrankheiten; Krankheit und Freizeitunfälle nicht."],"richtig":[3],"erkl":"Die gesetzliche Unfallversicherung (Berufsgenossenschaft) leistet nur für Versicherungsfälle nach § 7 SGB VII. Die häufigste Ursache für Erwerbs- und Berufsunfähigkeit, die Krankheit, ist nicht erfasst.","norm":"§§ 7–9 SGB VII","id":"4.1-2-3"}]}]},{"nr":"4.2","titel":"Private Unfallversicherung im Angebot","lf":"LF 7, LF 11","buch":"PV2 6.3 S. 294–310 · Lösungen S. 712–713","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Unter welcher Voraussetzung zahlt der Versicherer nach den Musterbedingungen eine vereinbarte Unfallrente?","optionen":["Der unfallbedingte Invaliditätsgrad beträgt mindestens 50 %.","Der unfallbedingte Invaliditätsgrad beträgt mindestens 25 %.","Die versicherte Person ist mindestens sechs Monate arbeitsunfähig.","Die versicherte Person hat das 65. Lebensjahr vollendet."],"richtig":[0],"erkl":"Die Unfallrente setzt einen Invaliditätsgrad von mindestens 50 % voraus; sie wird dann lebenslang monatlich gezahlt und ergänzt die einmalige Invaliditätsleistung.","norm":"AUB 2022 (Proximus 5), Ziff. 2.2","id":"4.2-1-1"},{"typ":"mc","frage":"Ein Angebot sieht eine Grundsumme von 100.000 € mit Progression 225 % vor (bis 25 % einfach, über 25 % bis 50 % doppelt, über 50 % dreifach). Welche Leistung ergäbe sich bei einem Invaliditätsgrad von 60 %?","optionen":["60.000 €","105.000 €","135.000 €","85.000 €"],"richtig":[1],"erkl":"25 % einfach = 25 %; 25 % doppelt = 50 %; 10 % dreifach = 30 %; zusammen 105 % von 100.000 € = 105.000 €. Die Progression verstärkt vor allem schwere Invaliditäten.","norm":"AUB 2022 (Proximus 5), Ziff. 2.1 (Invaliditätsleistung); Progression nach Tarif bzw. Besonderen Bedingungen","id":"4.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Gefahrengruppen und Tarifen in der privaten Unfallversicherung treffen zu?","aussagen":[["Gefahrengruppe A umfasst überwiegend kaufmännische oder verwaltende Tätigkeiten.",true],["Gefahrengruppe B umfasst körperliche oder handwerkliche Tätigkeiten und ist teurer.",true],["Für Kinder gibt es einen eigenen Kindertarif, der unabhängig vom Beruf der Eltern ist.",true],["Der Kindertarif läuft lebenslang weiter, solange die Eltern den Vertrag nicht kündigen.",false],["Seniorentarife verzichten stets auf eine Altersgrenze und kosten genauso viel wie der Erwachsenentarif.",false]],"erkl":"Der Beitrag richtet sich nach dem Beruf (Gefahrengruppe A/B) bzw. nach dem Alter (Kinder, Senioren). Der Kindertarif wird nach dem 18. Lebensjahr auf den Erwachsenentarif umgestellt; Seniorentarife haben eigene Leistungsbausteine und Beiträge.","norm":"AUB 2022 (Proximus 5), Ziff. 6","id":"4.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie der Leistungsart der privaten Unfallversicherung ihren Zweck zu.","paare":[["Invaliditätsleistung","einmalige Kapitalzahlung bei dauerhafter Beeinträchtigung"],["Unfallrente","lebenslange monatliche Zahlung ab 50 % Invalidität"],["Todesfallleistung","Zahlung an die Hinterbliebenen bei unfallbedingtem Tod"],["Krankenhaustagegeld","fester Betrag je Tag stationärer Behandlung"]],"erkl":"Im Angebot werden die Bausteine nach Bedarf kombiniert: Kapital für Umbau und Hilfsmittel, Rente für laufenden Einkommensausfall.","norm":"AUB 2022 (Proximus 5), Ziff. 2","id":"4.2-1-4"},{"typ":"zahl","frage":"Berechnen Sie den Jahresbeitrag einschließlich 19 % Versicherungsteuer: Gefahrengruppe A, Grundsumme Invalidität 200.000 € zu 1,10 € je 1.000 €, Todesfallsumme 10.000 € zu 1,50 € je 1.000 €.","wert":279.65,"einheit":"€","tol":0.5,"erkl":"Invalidität: 200 × 1,10 € = 220,00 €; Todesfall: 10 × 1,50 € = 15,00 €; netto 235,00 €. Versicherungsteuer 19 % = 44,65 €; Bruttobeitrag 279,65 €.","norm":"§ 6 VersStG; Tarif","id":"4.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sandra Kowalski (41) aus Halle (Saale) ist Bürokauffrau und hat bei der Proximus Versicherung AG eine Unfallversicherung mit 120.000 € Grundsumme in Gefahrengruppe A (Beitragssatz 1,50 € je 1.000 €, netto 180 € im Jahr). Ab dem 1. März arbeitet sie als Dachdeckerin im Betrieb ihres Bruders (Gefahrengruppe B, Beitragssatz 3,00 € je 1.000 €). Ihr Sohn Jonas, bisher im Kindertarif mitversichert, wird in diesem Jahr 18.","items":[{"typ":"zahl","frage":"Frau Kowalski will den bisherigen Nettobeitrag von 180 € beibehalten. Auf welche Grundsumme in Euro sinkt der Versicherungsschutz in Gefahrengruppe B?","wert":60000,"einheit":"€","tol":0.5,"erkl":"180 € ÷ 3,00 € × 1.000 € = 60.000 €. Bei gleichem Beitrag halbiert sich die Grundsumme, weil der Beitragssatz der Gruppe B doppelt so hoch ist.","norm":"AUB 2022 (Proximus 5), Ziff. 6.2","id":"4.2-2-1"},{"typ":"zahl","frage":"Frau Kowalski möchte stattdessen die Grundsumme von 120.000 € behalten. Wie hoch ist der neue Nettojahresbeitrag in Euro?","wert":360,"einheit":"€","tol":0.5,"erkl":"120 × 3,00 € = 360 € netto; der Beitrag steigt um 180 €.","norm":"AUB 2022 (Proximus 5), Ziff. 6.2","id":"4.2-2-2"},{"typ":"mc","frage":"Was gilt nach den Musterbedingungen, wenn Frau Kowalski die Änderung ihrer Berufstätigkeit nicht mitteilt und zwei Monate später verunglückt?","optionen":["Der Versicherer ist vollständig leistungsfrei, weil sie eine Obliegenheit verletzt hat.","Der Versicherer leistet ungekürzt, weil Berufswechsel nicht anzeigepflichtig sind.","Der Versicherer leistet aus den niedrigeren Summen, die sich für Gruppe B ergeben.","Der Vertrag endet automatisch mit dem Tag des Berufswechsels ohne Leistung."],"richtig":[2],"erkl":"Die Änderung ist unverzüglich mitzuteilen. Ergeben sich bei gleichem Beitrag niedrigere Summen, gelten diese nach Ablauf eines Monats ab der Änderung; auf Wunsch bleibt es bei den alten Summen gegen höheren Beitrag. Für Jonas besteht ein Wahlrecht beim Wechsel in den Erwachsenentarif (Summe senken oder Beitrag erhöhen).","norm":"AUB 2022 (Proximus 5), Ziff. 6.1 und 6.2","id":"4.2-2-3"}]}]},{"nr":"4.3","titel":"Berufsunfähigkeitsversicherung im Angebot","lf":"LF 7, LF 11","buch":"PV2 6.4–6.5 S. 311–340 · Lösungen S. 713–714","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann ist eine versicherte Person nach dem VVG berufsunfähig?","optionen":["Sie kann irgendeine Tätigkeit auf dem allgemeinen Arbeitsmarkt infolge Krankheit oder Unfall voraussichtlich auf Dauer nicht mehr ausüben.","Sie ist infolge Krankheit länger als sechs Wochen arbeitsunfähig und bezieht Krankengeld von ihrer gesetzlichen Krankenkasse.","Sie hat ihren Arbeitsplatz durch betriebsbedingte Kündigung verloren und findet in ihrem erlernten Beruf keine neue Stelle.","Sie kann ihren zuletzt ausgeübten Beruf aus gesundheitlichen Gründen voraussichtlich auf Dauer ganz oder teilweise nicht ausüben."],"richtig":[3],"erkl":"Maßstab ist der zuletzt ausgeübte Beruf, so wie er ohne gesundheitliche Beeinträchtigung ausgestaltet war. Die Bedingungen der Versicherer setzen meist einen Grad von 50 % und eine Prognose von sechs Monaten an.","norm":"§ 172 Abs. 2 VVG","id":"4.3-1-1"},{"typ":"mc","frage":"Was bedeutet der Verzicht auf die abstrakte Verweisung in einem BU-Angebot?","optionen":["Der Versicherer verweist nicht auf einen anderen Beruf, den die Person zwar ausüben könnte, aber tatsächlich nicht ausübt.","Der Versicherer verzichtet darauf, bei Antragstellung nach Vorerkrankungen und Freizeitrisiken der Person zu fragen.","Der Versicherer verzichtet darauf, die Berufsunfähigkeit nach Leistungsbeginn jemals erneut zu überprüfen.","Der Versicherer verweist nicht auf einen Beruf, den die Person nach Eintritt der BU tatsächlich neu ausübt."],"richtig":[0],"erkl":"§ 172 Abs. 3 VVG erlaubt die Vereinbarung einer Verweisung auf eine andere, der Ausbildung und Lebensstellung entsprechende Tätigkeit. Gute Tarife verzichten auf die abstrakte Verweisung; die konkrete Verweisung (tatsächlich ausgeübter neuer Beruf) bleibt meist möglich.","norm":"§ 172 Abs. 3 VVG","id":"4.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Bausteinen eines BU-Angebots treffen zu?","aussagen":[["Die Nachversicherungsgarantie erlaubt bei Ereignissen wie Heirat oder Geburt eines Kindes eine Erhöhung der Rente ohne erneute Gesundheitsprüfung.",true],["Eine Beitragsdynamik erhöht Beitrag und versicherte Rente regelmäßig, um die Inflation auszugleichen.",true],["Die Vertrags- und Leistungsdauer sollte möglichst bis zum Beginn der Altersrente, z. B. bis 67, reichen.",true],["Eine Leistungsdynamik erhöht die versicherte Rente nur vor Eintritt der Berufsunfähigkeit.",false],["Bei einer Nachversicherung stellt der Versicherer stets alle Gesundheitsfragen erneut.",false]],"erkl":"Beitragsdynamik wirkt vor dem Leistungsfall, Leistungsdynamik erhöht die laufende Rente im Leistungsfall. Eine zu kurze Laufzeit hinterlässt eine Lücke bis zur Altersrente.","norm":"Musterbedingungen BU (GDV); § 172 VVG","id":"4.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie der Alternative zur BU-Versicherung ihren Leistungsauslöser zu.","paare":[["Erwerbsunfähigkeitsversicherung","keine regelmäßige Tätigkeit auf dem allgemeinen Arbeitsmarkt mehr möglich"],["Grundfähigkeitsversicherung","Verlust einer körperlichen Fähigkeit wie Gehen, Sehen oder Greifen"],["Dread-Disease-Versicherung","Diagnose einer schweren Krankheit wie Krebs oder Herzinfarkt"],["private Unfallversicherung","dauerhafte Beeinträchtigung allein durch einen Unfall"]],"erkl":"Die Alternativen sind meist günstiger, decken aber nur einen Teil der Ursachen ab; eine BU bleibt die umfassendste Einkommensabsicherung.","norm":"Musterbedingungen BU (GDV); § 177 VVG","id":"4.3-1-4"},{"typ":"mc","frage":"Ein Kunde hat im Antrag eine Psychotherapie verschwiegen, nach der in Textform gefragt wurde. Was kann der Versicherer bei grob fahrlässiger Verletzung der Anzeigepflicht grundsätzlich tun?","optionen":["den Beitrag rückwirkend verdoppeln, ohne dass der Kunde der Vertragsänderung widersprechen kann","vom Vertrag zurücktreten, sofern er ihn bei Kenntnis nicht auch zu anderen Bedingungen geschlossen hätte","nichts unternehmen, weil Angaben zur Gesundheit nach dem Datenschutz freiwillig sind","den Vertrag fortführen, aber nur noch die Hälfte jeder künftigen Rente auszahlen"],"richtig":[1],"erkl":"Bei Vorsatz oder grober Fahrlässigkeit kann der Versicherer zurücktreten; hätte er zu anderen Bedingungen geschlossen, werden diese Vertragsbestandteil (Ausschluss, Zuschlag). Die Rechte erlöschen grundsätzlich nach fünf Jahren, bei Vorsatz oder Arglist nach zehn Jahren.","norm":"§§ 19, 21 VVG","id":"4.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Leonie Brandt (27) aus Halle (Saale) ist Bauzeichnerin im Büro eines Architekten (überwiegend Bürotätigkeit). Ihr Nettoeinkommen beträgt 2.400 € im Monat. Sie bittet Sie um ein Angebot für eine selbstständige Berufsunfähigkeitsversicherung. Laut Tarif kostet je 100 € monatlicher BU-Rente der Nettobeitrag 4,80 € im Monat bei Endalter 67 und 6,90 € bei handwerklicher Tätigkeit.","items":[{"typ":"zahl","frage":"Nach der Faustregel soll die BU-Rente 75 % des Nettoeinkommens betragen. Welche monatliche BU-Rente schlagen Sie vor (Euro)?","wert":1800,"einheit":"€","tol":0.5,"erkl":"2.400 € × 75 % = 1.800 € monatliche BU-Rente; die Faustregel liegt bei 70–80 % des Nettos, da im Leistungsfall auch Kranken- und Pflegeversicherung weiterlaufen.","norm":"Bedarfsanalyse; § 172 VVG","id":"4.3-2-1"},{"typ":"mc","frage":"Welcher monatliche Nettobeitrag ergibt sich für die vorgeschlagene Rente von 1.800 € bei Frau Brandt?","optionen":["124,20 €","48,00 €","86,40 €","76,80 €"],"richtig":[2],"erkl":"18 × 4,80 € = 86,40 €. Ihre Tätigkeit ist überwiegend Büroarbeit; der Satz für handwerkliche Tätigkeit (18 × 6,90 € = 124,20 €) gilt nicht.","norm":"Tarif; Berufsgruppeneinstufung","id":"4.3-2-2"},{"typ":"mc","frage":"Frau Brandt möchte Beitrag sparen und schlägt ein Endalter von 55 Jahren vor. Wie beraten Sie sie?","optionen":["Sie stimmen zu, weil nach dem 55. Lebensjahr die gesetzliche BU-Rente einspringt.","Sie stimmen zu, weil eine BU-Versicherung gesetzlich höchstens bis 55 laufen darf.","Davon raten Sie ab, weil ein kürzerer Vertrag nach dem VVG stets teurer ist.","Sie raten ab, weil das BU-Risiko im Alter steigt und bis 67 eine Lücke bliebe."],"richtig":[3],"erkl":"Gerade ab 50 treten BU-Fälle gehäuft auf; eine gesetzliche Berufsunfähigkeitsrente gibt es für jüngere Jahrgänge nicht mehr. Empfohlen ist ein Endalter passend zur Regelaltersgrenze (67).","norm":"§§ 43, 240 SGB VI; § 172 VVG","id":"4.3-2-3"}]}]},{"nr":"4.4","titel":"Hinterbliebenenvorsorge mit der Risikolebensversicherung","lf":"LF 7, LF 11","buch":"PV2 6.6–6.7 S. 341–342 · Lösungen S. 714–720","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Warum ist eine Risikolebensversicherung deutlich günstiger als eine kapitalbildende Lebensversicherung mit gleicher Todesfallsumme?","optionen":["Sie bietet nur Todesfallschutz für eine feste Laufzeit und enthält keinen Sparanteil.","Sie zahlt die Versicherungssumme auch im Erlebensfall aus, aber erst nach dem 85. Lebensjahr.","Sie ist eine Kapitalversicherung mit staatlicher Förderung, die den Sparanteil übernimmt.","Sie verzichtet auf eine Gesundheitsprüfung und spart dadurch Verwaltungskosten im Antrag."],"richtig":[0],"erkl":"Der Beitrag deckt nur das Todesfallrisiko und die Kosten. Erlebt die versicherte Person das Vertragsende, wird nichts ausgezahlt (allenfalls Überschüsse).","norm":"Musterbedingungen Risikolebensversicherung (GDV)","id":"4.4-1-1"},{"typ":"zuo","frage":"Ordnen Sie der Gestaltung der Risikolebensversicherung den typischen Einsatzzweck zu.","paare":[["konstante Versicherungssumme","Familienabsicherung mit gleichbleibendem Bedarf"],["linear fallende Versicherungssumme","Absicherung eines Ratenkredits mit gleichen Tilgungsbeträgen"],["annuitätisch fallende Versicherungssumme","Absicherung eines Annuitätendarlehens"],["verbundene Leben","ein Vertrag für zwei Personen, Zahlung beim ersten Todesfall"]],"erkl":"Die Summe sollte dem Verlauf des Bedarfs folgen; fallende Summen sind günstiger, wenn die Restschuld sinkt.","norm":"Musterbedingungen Risikolebensversicherung (GDV)","id":"4.4-1-2"},{"typ":"wf","frage":"Welche Aussagen zum widerruflichen und unwiderruflichen Bezugsrecht treffen zu?","aussagen":[["Beim widerruflichen Bezugsrecht erwirbt der Bezugsberechtigte den Anspruch erst mit Eintritt des Versicherungsfalls.",true],["Beim unwiderruflichen Bezugsrecht erwirbt der Bezugsberechtigte den Anspruch sofort.",true],["Eine Abtretung oder Verpfändung ist beim unwiderruflichen Bezugsrecht nur mit Zustimmung des Bezugsberechtigten möglich.",true],["Wird der Versicherungsnehmer insolvent, fällt der Vertrag mit unwiderruflichem Bezugsrecht in die Insolvenzmasse.",false],["Eine Scheidung beendet ein auf den Ehegatten lautendes Bezugsrecht automatisch.",false]],"erkl":"Das widerrufliche Bezugsrecht ist nur eine Aussicht; es kann jederzeit geändert werden und schützt nicht vor dem Zugriff der Insolvenzmasse. Nach einer Scheidung sollte der VN das Bezugsrecht ausdrücklich ändern.","norm":"§ 159 VVG","id":"4.4-1-3"},{"typ":"mc","frage":"Die Eheleute Ott möchten, dass die Todesfallleistung nicht der Erbschaftsteuer unterliegt. Welche Gestaltung empfehlen Sie?","optionen":["Verbundene Leben: Beide sind gemeinsam Versicherungsnehmer und versicherte Personen.","Überkreuz: Jeder ist Versicherungsnehmer und Bezugsberechtigter auf das Leben des anderen.","Jeder versichert das eigene Leben und setzt den Ehepartner widerruflich als Bezugsberechtigten ein.","Jeder versichert das eigene Leben und setzt die gemeinsamen Kinder unwiderruflich als Bezugsberechtigte ein."],"richtig":[1],"erkl":"Ist der Begünstigte selbst Versicherungsnehmer und Beitragszahler, erwirbt er die Leistung aus eigenem Vertrag und nicht vom Verstorbenen; es liegt kein Erwerb von Todes wegen vor. Die versicherte Person muss jeweils schriftlich einwilligen.","norm":"§ 3 Abs. 1 Nr. 4 ErbStG; § 150 Abs. 2 VVG","id":"4.4-1-4"},{"typ":"mc","frage":"Warum unterscheiden Versicherer in der Risikolebensversicherung zwischen Rauchern und Nichtrauchern?","optionen":["Raucher zahlen Tabaksteuer und erhalten deshalb einen gesetzlichen Nachlass auf den Beitrag.","Nichtraucher müssen jährlich einen Bluttest vorlegen, sonst entfällt der Versicherungsschutz.","Raucher haben eine höhere Sterbewahrscheinlichkeit; falsche Angaben verletzen die Anzeigepflicht.","Raucher erhalten eine höhere Versicherungssumme, weil sie im Todesfall früher Leistung brauchen."],"richtig":[2],"erkl":"Die Nichtrauchereigenschaft (meist mindestens zwölf Monate kein Tabakkonsum) wird im Antrag erfragt. Wer sich wahrheitswidrig als Nichtraucher einstuft, riskiert Rücktritt oder Anpassung des Vertrags.","norm":"§§ 19, 22 VVG","id":"4.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Ott aus Halle-Neustadt kauft eine Eigentumswohnung. Das Annuitätendarlehen beträgt 220.000 €. Herr Ott (38, Nichtraucher) verdient den Großteil des Haushaltseinkommens. Die Familie möchte nach seinem Tod 15 Jahre lang (bis die Kinder selbstständig sind) monatlich 1.200 € zusätzlich zur Witwen- und Waisenrente zur Verfügung haben. Vorhanden sind 40.000 € Ersparnisse. Der Tarif kostet je 10.000 € Versicherungssumme 3,60 € im Jahr für Nichtraucher und 8,10 € für Raucher.","items":[{"typ":"zahl","frage":"Wie hoch sollte die Versicherungssumme der Risikolebensversicherung für Herrn Ott sein (Euro, ohne Verzinsung)?","wert":396000,"einheit":"€","tol":0.5,"erkl":"Darlehen 220.000 € + Einkommensbedarf 1.200 € × 12 × 15 = 216.000 € = 436.000 €; abzüglich Ersparnisse 40.000 € = 396.000 €.","norm":"Bedarfsanalyse (Hinterbliebenenvorsorge)","id":"4.4-2-1"},{"typ":"zahl","frage":"Herr Ott schließt eine Versicherung über 400.000 € ab. Wie viel Euro spart er im Jahr als Nichtraucher gegenüber dem Rauchertarif?","wert":180,"einheit":"€","tol":0.5,"erkl":"40 × 3,60 € = 144 € (Nichtraucher); 40 × 8,10 € = 324 € (Raucher); Ersparnis 180 € im Jahr.","norm":"Tarif; § 19 VVG","id":"4.4-2-2"},{"typ":"mc","frage":"Die Bank verlangt die Abtretung der Versicherung für das Darlehen. Herr Ott möchte seiner Frau aber ein unwiderrufliches Bezugsrecht einräumen. Was müssen Sie beachten?","optionen":["Ein unwiderrufliches Bezugsrecht erlischt mit der Abtretung an die Bank automatisch.","Die Bank darf die Abtretung nach dem VVG nie verlangen, weil Lebensversicherungen unpfändbar sind.","Die Abtretung ist ohne Zustimmung wirksam, weil die Bank im Rang stets vorgeht.","Die Abtretung an die Bank ist dann nur mit Zustimmung von Frau Ott wirksam möglich."],"richtig":[3],"erkl":"Beim unwiderruflichen Bezugsrecht steht der Anspruch bereits Frau Ott zu; ohne ihre Zustimmung kann Herr Ott nicht mehr darüber verfügen. Üblich ist ein widerrufliches Bezugsrecht mit Abtretung in Höhe der Restschuld oder ein eigener Vertrag mit fallender Summe für das Darlehen.","norm":"§ 159 Abs. 3 VVG; § 398 BGB","id":"4.4-2-3"}]}]},{"nr":"4.5","titel":"Private Unfallversicherung beraten","lf":"LF 7","buch":"PV2 6.2 und 6.5 S. 286–293, 312–340 · Lösungen S. 711–712, 714","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welcher Sachverhalt erfüllt den Unfallbegriff des § 178 Abs. 2 VVG?","optionen":["Ein Jogger erleidet beim Laufen ohne äußeren Anlass einen Herzinfarkt.","Eine Kundin rutscht auf Glatteis aus und bricht sich das Handgelenk.","Ein Maurer bekommt nach Jahren schwerer Arbeit einen Bandscheibenschaden.","Ein Gärtner erkrankt nach vielen Sommern im Freien an Hautkrebs."],"richtig":[1],"erkl":"Ein Unfall liegt vor, wenn die versicherte Person durch ein plötzlich von außen auf ihren Körper wirkendes Ereignis unfreiwillig eine Gesundheitsschädigung erleidet. Nur der Sturz auf Glatteis erfüllt alle Merkmale. Ein Herzinfarkt ohne äußere Einwirkung und Schäden, die langsam durch Abnutzung oder Sonne entstehen, sind kein Unfall.","norm":"§ 178 Abs. 2 VVG","id":"4.5-1-1"},{"typ":"mc","frage":"Herr Kunze hebt allein eine schwere Waschmaschine an und zerrt sich dabei Muskeln im Oberarm. Ein äußeres Ereignis gab es nicht. Warum kann trotzdem ein Unfall vorliegen?","optionen":["Weil die Bedingungen eine Zerrung durch erhöhte Kraftanstrengung an Gliedmaßen als Unfall werten.","Weil nach § 178 VVG jede Verletzung im eigenen Haushalt automatisch als Unfall angesehen wird.","Weil Muskelzerrungen als Berufskrankheit gelten und deshalb wie Unfälle behandelt werden.","Weil die Unfreiwilligkeit vermutet wird und deshalb gar kein äußeres Ereignis nötig ist."],"richtig":[0],"erkl":"Die Musterbedingungen erweitern den Unfallbegriff: Als Unfall gilt auch, wenn sich die versicherte Person durch eine erhöhte Kraftanstrengung an Gliedmaßen oder Wirbelsäule ein Gelenk verrenkt oder Muskeln, Sehnen, Bänder oder Kapseln zerrt oder zerreißt. Die gesetzliche Vermutung der Unfreiwilligkeit ersetzt das äußere Ereignis nicht.","norm":"§ 178 Abs. 2 VVG; AUB 2022 (Proximus 5)","id":"4.5-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Merkmal der gesetzlichen und der privaten Unfallversicherung die passende Ausprägung zu.","paare":[["Träger der gesetzlichen Unfallversicherung","Berufsgenossenschaften und Unfallkassen"],["Versicherte Fälle der gesetzlichen Unfallversicherung","Arbeitsunfälle, Wegeunfälle und Berufskrankheiten"],["Beiträge zur gesetzlichen Unfallversicherung für Arbeitnehmer","trägt allein der Arbeitgeber als Unternehmer"],["Schutzumfang der privaten Unfallversicherung","weltweit, rund um die Uhr, in Beruf und Freizeit"]],"erkl":"Die gesetzliche Unfallversicherung schützt Beschäftigte nur bei Arbeits- und Wegeunfällen sowie bei Berufskrankheiten; die Beiträge zahlt allein der Unternehmer. Unfälle in der Freizeit deckt nur die private Unfallversicherung, die weltweit und rund um die Uhr gilt.","norm":"§§ 2, 7, 8, 9, 114, 150 SGB VII; AUB 2022 (Proximus 5)","id":"4.5-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Leistungsarten der privaten Unfallversicherung treffen zu?","aussagen":[["Die Invaliditätsleistung ist eine Kapitalleistung aus Grundsumme und Invaliditätsgrad.",true],["Krankenhaustagegeld wird für jeden Kalendertag unfallbedingter, medizinisch notwendiger vollstationärer Behandlung gezahlt.",true],["Die Todesfallleistung wird auch gezahlt, wenn die versicherte Person an einer Krankheit stirbt.",false],["Eine Unfallrente setzt im Tarif meist einen Mindest-Invaliditätsgrad voraus, z. B. 50 %.",true],["Die private Unfallversicherung leistet nur, wenn der Unfall bei der Arbeit passiert ist.",false]],"erkl":"Die private Unfallversicherung leistet bei Unfällen in Beruf und Freizeit. Die Invaliditätsleistung errechnet sich aus Grundsumme × Invaliditätsgrad, Krankenhaustagegeld gibt es je Tag unfallbedingter vollstationärer Behandlung, die Unfallrente meist ab einem Invaliditätsgrad von 50 %. Die Todesfallleistung setzt einen unfallbedingten Tod voraus.","norm":"AUB 2022 (Proximus 5); § 178 VVG","id":"4.5-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Bemessung der Invaliditätsleistung und zu den Fristen treffen zu?","aussagen":[["Ist ein Körperteil nur teilweise beeinträchtigt, gilt der entsprechende Teil des Werts der Gliedertaxe.",true],["Die Bedingungen setzen Fristen für Eintritt, ärztliche Feststellung und Geltendmachung der Invalidität.",true],["Weist der Versicherer nach der Unfallmeldung nicht in Textform auf die Fristen hin, kann er sich auf ihre Versäumnis nicht berufen.",true],["Eine schon vor dem Unfall bestehende Beeinträchtigung desselben Körperteils bleibt immer unberücksichtigt.",false],["Die Invaliditätsleistung wird in der Regel als lebenslange Monatsrente ausgezahlt.",false]],"erkl":"Für Gliedmaßen und Sinnesorgane bestimmt die Gliedertaxe den Invaliditätsgrad; bei teilweiser Beeinträchtigung gilt der entsprechende Anteil, eine Vorinvalidität wird abgezogen. Der Anspruch hängt an Fristen für Eintritt, ärztliche Feststellung und Geltendmachung: Nach den Bedingungen der Proximus (AUB 2022, Ziff. 2.1.1.2 und 2.1.1.3) muss die Invalidität innerhalb von 24 Monaten nach dem Unfall eingetreten und ärztlich schriftlich festgestellt sein und innerhalb von 24 Monaten geltend gemacht werden (die GDV-Musterbedingungen nennen 15 Monate). Auf die Fristen muss der Versicherer nach der Anzeige des Unfalls in Textform hinweisen (§ 186 VVG). Die Invaliditätsleistung ist eine Kapitalleistung.","norm":"§ 186 VVG; AUB 2022 (Proximus 5)","id":"4.5-1-5"},{"typ":"mc","frage":"Frau Sommer, bisher Bürokauffrau (Gefahrengruppe A), arbeitet künftig als Gerüstbauerin (Gefahrengruppe B). Was gilt für ihre private Unfallversicherung nach den Musterbedingungen?","optionen":["Der Vertrag endet mit dem Berufswechsel automatisch; sie muss einen neuen Antrag stellen.","Die Proximus darf wegen der Gefahrerhöhung fristlos kündigen und den Beitrag behalten.","Sie meldet den Wechsel; nach einem Monat gelten bei gleichem Beitrag niedrigere Summen.","Der Beruf spielt keine Rolle, weil die Unfallversicherung auch Freizeitunfälle abdeckt."],"richtig":[2],"erkl":"Eine Änderung der Berufstätigkeit muss unverzüglich gemeldet werden. Ergeben sich nach dem Tarif für Gefahrengruppe B bei gleichem Beitrag niedrigere Versicherungssummen, gelten diese nach Ablauf eines Monats ab der Änderung. Auf Wunsch führt der Versicherer den Vertrag mit den bisherigen Summen gegen höheren Beitrag fort. Als Gefahrerhöhung gilt in der Unfallversicherung nur, was ausdrücklich vereinbart ist; auch dann gelten nach § 181 Abs. 2 VVG bei gleichem Beitrag nach einem Monat die niedrigeren Leistungen; weitergehende Rechte hat der Versicherer nur, wenn die Änderung arglistig nicht angezeigt wurde.","norm":"§ 181 VVG; AUB 2022 (Proximus 5)","id":"4.5-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Marco Fiedler (38), Industriekaufmann aus Halle (Saale), hat bei der Proximus eine private Unfallversicherung: Invaliditätsgrundsumme 100.000 € mit Progression 225 %, Unfallrente 1.000 € monatlich ab einem Invaliditätsgrad von 50 % und Krankenhaustagegeld 20 €. Für die Progression 225 % gilt laut Vertrag: Den Teil des Invaliditätsgrads bis 25 % rechnet die Proximus mit der einfachen, den Teil über 25 % bis 50 % mit der doppelten und den Teil über 50 % mit der dreifachen Grundsumme. Am 14.06.2026 stürzte Herr Fiedler bei einer Mountainbike-Tour im Harz und lag danach 9 Tage im Krankenhaus. Der Arzt stellt eine dauernde Funktionsbeeinträchtigung des rechten Beins unterhalb des Knies von 3/5 fest; die Gliedertaxe des Vertrags sieht für ein Bein bis unterhalb des Knies 50 % vor. Vorschäden hatte Herr Fiedler nicht.","items":[{"typ":"zahl","frage":"Berechnen Sie die Invaliditätsleistung für Herrn Fiedler ohne Berücksichtigung der Progression.","wert":30000,"einheit":"€","tol":1,"erkl":"Invaliditätsgrad: 50 % × 3/5 = 30 %. Leistung ohne Progression: 100.000 € × 30 % = 30.000 €.","norm":"AUB 2022 (Proximus 5): Gliedertaxe; Versicherungsschein","id":"4.5-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Invaliditätsleistung, die die Proximus mit der vereinbarten Progression 225 % zahlt.","wert":35000,"einheit":"€","tol":1,"erkl":"Invaliditätsgrad 30 %. Teil bis 25 % einfach: 100.000 € × 25 % = 25.000 €. Teil über 25 % (hier 5 %) doppelt: 100.000 € × 5 % × 2 = 10.000 €. Leistung mit Progression: 25.000 € + 10.000 € = 35.000 €.","norm":"AUB 2022 (Proximus 5); Progressionsstaffel laut Versicherungsschein","id":"4.5-2-2"},{"typ":"mc","frage":"Herr Fiedler fragt, welche weiteren Leistungen ihm aus seinem Vertrag zustehen. Was antworten Sie?","optionen":["Er erhält 180 € Krankenhaustagegeld und zusätzlich lebenslang 1.000 € Unfallrente monatlich.","Er erhält keine weiteren Leistungen, weil Unfälle beim Freizeitsport ausgeschlossen sind.","Er erhält nur die Unfallrente, weil Krankenhaustagegeld neben der Invalidität entfällt.","Er erhält 180 € Krankenhaustagegeld; die Unfallrente entfällt, da der Grad unter 50 % liegt."],"richtig":[3],"erkl":"Krankenhaustagegeld: 9 Tage × 20 € = 180 €. Die Unfallrente setzt laut Vertrag einen Invaliditätsgrad von mindestens 50 % voraus; Herr Fiedler hat 30 %. Unfälle beim Freizeitsport wie Mountainbiken sind versichert.","norm":"AUB 2022 (Proximus 5); Versicherungsschein","id":"4.5-2-3"},{"typ":"zahl","frage":"Herr Fiedler arbeitet ab 01.01.2027 als Zweiradmechaniker in einer Fahrradwerkstatt (Gefahrengruppe B) und will alle Leistungen in bisheriger Höhe behalten. Jahresbeiträge laut Tarif: Invalidität mit Progression 225 % je 1.000 € Grundsumme 1,10 € (A) bzw. 1,85 € (B); Unfallrente je 100 € Monatsrente 9,00 € (A) bzw. 15,00 € (B); Krankenhaustagegeld je 1 € Tagegeld 1,20 € (A) bzw. 1,80 € (B). Um wie viel Euro steigt sein Jahresbeitrag?","wert":147,"einheit":"€","tol":0.5,"erkl":"Bisher (A): 100 × 1,10 € = 110 €; 10 × 9,00 € = 90 €; 20 × 1,20 € = 24 €; zusammen 224 €. Neu (B): 100 × 1,85 € = 185 €; 10 × 15,00 € = 150 €; 20 × 1,80 € = 36 €; zusammen 371 €. Mehrbeitrag: 371 € − 224 € = 147 € im Jahr. Ohne Mehrbeitrag würden nach einem Monat niedrigere Summen gelten.","norm":"§ 181 VVG; AUB 2022 (Proximus 5); Tarif im Fall vorgegeben","id":"4.5-2-4"}]}],"runde":"zusatz"},{"nr":"4.6","titel":"Risikolebensversicherung und Hinterbliebene","lf":"LF 11","buch":"PV2 6.2–6.3 S. 286–310 · Lösungen S. 711–713; Bezugsrecht: PV2 4.2 S. 161–168 · Lösungen S. 689–690","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Gestaltung der Risikolebensversicherung den passenden Einsatz zu.","paare":[["Konstante Versicherungssumme","Familie mit gleichbleibendem Bedarf an Einkommensersatz"],["Linear oder annuitätisch fallende Versicherungssumme","Absicherung der sinkenden Restschuld eines Tilgungsdarlehens"],["Verbundene Leben","zwei versicherte Personen, Leistung beim ersten Todesfall"],["Versicherung über Kreuz","jeder Partner versichert das Leben des anderen und ist selbst bezugsberechtigt"]],"erkl":"Eine fallende Summe folgt der sinkenden Restschuld und ist deshalb günstiger als eine konstante Summe. Bei verbundenen Leben zahlt der Versicherer einmal, wenn die erste der beiden Personen stirbt. Über Kreuz ist jeder Partner Versicherungsnehmer, Beitragszahler und Bezugsberechtigter eines Vertrags auf das Leben des anderen.","norm":"Musterbedingungen (AVB Risikolebensversicherung); § 150 VVG","id":"4.6-1-1"},{"typ":"wf","frage":"Welche Aussagen zum Bezugsrecht in der Lebensversicherung treffen zu?","aussagen":[["Ein widerruflich Bezugsberechtigter erwirbt den Anspruch erst mit Eintritt des Versicherungsfalls.",true],["Der Versicherungsnehmer kann ein widerrufliches Bezugsrecht ohne Zustimmung des Begünstigten ändern.",true],["Ein unwiderruflich Bezugsberechtigter erwirbt das Recht auf die Leistung bereits mit der Bezeichnung.",true],["Ein unwiderrufliches Bezugsrecht kann der Versicherungsnehmer jederzeit allein widerrufen.",false],["Ist ein Bezugsberechtigter benannt, fällt die Todesfallleistung in den Nachlass und geht an die Erben.",false]],"erkl":"Nach § 159 VVG erwirbt ein widerruflich Begünstigter den Anspruch erst mit dem Versicherungsfall; bis dahin kann der Versicherungsnehmer das Bezugsrecht frei ändern. Ein unwiderruflich Begünstigter erwirbt das Recht sofort, eine Änderung braucht seine Zustimmung. Die Leistung an einen benannten Bezugsberechtigten fällt nicht in den Nachlass.","norm":"§ 159 VVG; §§ 328, 331 BGB","id":"4.6-1-2"},{"typ":"mc","frage":"Herr Lorenz ist verstorben. In seiner Risikolebensversicherung hat er seine Lebensgefährtin als Bezugsberechtigte benannt. Seine Erben verlangen die Leistung für den Nachlass. Wie ist die Rechtslage?","optionen":["Die Erben erhalten die Leistung, weil alle Ansprüche des Verstorbenen in den Nachlass fallen.","Die Lebensgefährtin erwirbt den Anspruch direkt aus dem Vertrag; er fällt nicht in den Nachlass.","Die Leistung wird zwischen den Erben und der Lebensgefährtin je zur Hälfte aufgeteilt.","Die Proximus zahlt erst, wenn ein Gericht über die Verteilung des Nachlasses entschieden hat."],"richtig":[1],"erkl":"Die Lebensversicherung mit Bezugsrecht ist ein Vertrag zugunsten Dritter. Mit dem Tod erwirbt die Bezugsberechtigte den Anspruch unmittelbar gegen den Versicherer; die Leistung gehört nicht zum Nachlass. Die Erben haben gegen die Proximus keinen Anspruch auf die Leistung.","norm":"§ 159 VVG; §§ 328, 331 BGB","id":"4.6-1-3"},{"typ":"mc","frage":"Frau Neumann beantragt eine Risikolebensversicherung. Welche Umstände muss sie nach § 19 VVG anzeigen?","optionen":["Alle ihr bekannten Umstände, auch wenn die Proximus nicht ausdrücklich danach gefragt hat.","Nur Krankheiten, die ein Arzt ihr in den letzten zwölf Monaten schriftlich bestätigt hat.","Alle Umstände, die sie bis zur Zahlung des ersten Beitrags erfährt, auch ungefragt.","Ihr bekannte gefahrerhebliche Umstände, nach denen die Proximus in Textform gefragt hat."],"richtig":[3],"erkl":"Der Antragsteller muss bis zur Abgabe seiner Vertragserklärung die ihm bekannten gefahrerheblichen Umstände anzeigen, nach denen der Versicherer in Textform gefragt hat. Ungefragt muss er nichts anzeigen. Fragt der Versicherer nach der Vertragserklärung, aber vor der Annahme, sind auch diese Fragen zu beantworten.","norm":"§ 19 Abs. 1 VVG","id":"4.6-1-4"},{"typ":"mc","frage":"Was versteht man bei der Beratung zur Hinterbliebenenversorgung unter der Versorgungslücke?","optionen":["Den Betrag, den die gesetzliche Rentenversicherung den Hinterbliebenen monatlich zahlt.","Den Unterschied zwischen dem bisherigen Bruttoeinkommen und dem bisherigen Nettoeinkommen.","Den Bedarf der Hinterbliebenen abzüglich Renten, eigenem Einkommen und bestehender Vorsorge.","Die Summe aller Beiträge, die der Verstorbene in die gesetzliche Rentenversicherung zahlte."],"richtig":[2],"erkl":"Die Versorgungslücke ist der Teil des Bedarfs, der nach einem Todesfall nicht gedeckt ist: Bedarf minus Witwen- oder Waisenrenten, eigenes Einkommen der Hinterbliebenen und bestehende Vorsorge. Die Renten der gesetzlichen Rentenversicherung ersetzen nur einen Teil des Einkommens; die Lücke kann z. B. eine Risikolebensversicherung decken.","norm":"§§ 46, 48 SGB VI","id":"4.6-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lisa Brandt (31, Erzieherin, netto 2.100 € im Monat) und Jonas Weber (33, Elektroniker, netto 2.900 € im Monat) aus Halle (Saale) sind nicht verheiratet und haben eine zweijährige Tochter. Für ihr Reihenhaus in Landsberg haben sie gemeinsam ein Annuitätendarlehen aufgenommen; die Restschuld beträgt laut Tilgungsplan noch 228.000 €. Stirbt Jonas und ist das Darlehen getilgt, brauchen Lisa und die Tochter nach eigener Rechnung 2.900 € im Monat; Lisa erhielte keine Witwenrente, die Tochter eine Halbwaisenrente von rund 210 €. Jonas hat seit 2019 eine Risikolebensversicherung über 50.000 € bei der Proximus; widerruflich bezugsberechtigt ist seine Mutter. Beide möchten die Familie für 20 Jahre absichern.","items":[{"typ":"zahl","frage":"Berechnen Sie die monatliche Versorgungslücke von Lisa und der Tochter für den Fall, dass Jonas stirbt.","wert":590,"einheit":"€","tol":0.5,"erkl":"Bedarf 2.900 € − Lisas Nettoeinkommen 2.100 € − Halbwaisenrente 210 € = 590 € im Monat. Eine Witwenrente gibt es nicht, weil Lisa und Jonas nicht verheiratet sind.","norm":"§§ 46, 48 SGB VI","id":"4.6-2-1"},{"typ":"zahl","frage":"Jonas möchte die Restschuld und die Versorgungslücke für 20 Jahre absichern (vereinfacht: gleichbleibende Lücke, ohne Zinsen). Die bestehende Risikolebensversicherung wird angerechnet, weil Jonas dort künftig Lisa begünstigen will. Wie hoch ist die zusätzlich benötigte Todesfallsumme?","wert":319600,"einheit":"€","tol":1,"erkl":"Kapitalbedarf für die Lücke: 590 € × 12 × 20 = 141.600 €. Dazu die Restschuld: 141.600 € + 228.000 € = 369.600 €. Abzüglich bestehender Risikolebensversicherung: 369.600 € − 50.000 € = 319.600 €. Vereinfacht bleibt außer Betracht, dass die Halbwaisenrente in der Regel mit 18 Jahren endet und die Restschuld sinkt.","norm":"Bedarfsrechnung mit Werten aus dem Fall; §§ 46, 48 SGB VI; § 159 VVG","id":"4.6-2-2"},{"typ":"mc","frage":"Lisa und Jonas sind nicht verheiratet. Warum empfehlen Sie ihnen für die Darlehensabsicherung zwei Verträge über Kreuz?","optionen":["Der Überlebende erhält die Leistung aus dem eigenen Vertrag; meist fällt keine Erbschaftsteuer an.","Nur bei Verträgen über Kreuz darf die Proximus überhaupt eine fallende Versicherungssumme anbieten.","Bei Verträgen über Kreuz verzichtet die Proximus für beide Partner ganz auf die Gesundheitsfragen.","Bei Verträgen über Kreuz zahlt die Proximus im Todesfall die doppelte Versicherungssumme aus."],"richtig":[0],"erkl":"Bei Unverheirateten ist der Freibetrag in der Erbschaftsteuer gering. Über Kreuz ist jeder Partner Versicherungsnehmer, Beitragszahler und Bezugsberechtigter des Vertrags auf das Leben des anderen. Die Leistung stammt dann aus dem eigenen Vertrag des Überlebenden und ist in der Regel kein Erwerb von Todes wegen. Für den Vertrag auf das Leben des Partners ist dessen schriftliche Einwilligung nötig.","norm":"§ 150 Abs. 2 VVG; § 3 Abs. 1 Nr. 4 ErbStG","id":"4.6-2-3"},{"typ":"mc","frage":"Jonas möchte in seiner bestehenden Risikolebensversicherung künftig Lisa statt seiner Mutter begünstigen. Was gilt?","optionen":["Er braucht die schriftliche Zustimmung seiner Mutter, weil sie bereits begünstigt ist.","Er muss den bisherigen Vertrag kündigen und mit Lisa als Begünstigter neu abschließen.","Er kann das widerrufliche Bezugsrecht durch Erklärung gegenüber der Proximus ändern.","Eine Änderung zugunsten von Lisa ist erst möglich, wenn die beiden vorher heiraten."],"richtig":[2],"erkl":"Die Mutter ist nur widerruflich bezugsberechtigt und hat bis zum Versicherungsfall noch keinen Anspruch. Jonas kann das Bezugsrecht deshalb ohne ihre Zustimmung ändern; wirksam wird die Änderung, wenn sie der Proximus in der vereinbarten Form zugeht. Wäre die Mutter unwiderruflich begünstigt, bräuchte er ihre Zustimmung.","norm":"§ 159 Abs. 1 und 2 VVG; Musterbedingungen (AVB Risikolebensversicherung)","id":"4.6-2-4"}]}],"runde":"zusatz"},{"nr":"4.7","titel":"Berufsunfähigkeit absichern","lf":"LF 7","buch":"PV2 6.2–6.5 S. 286–340 · Lösungen S. 711–714","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann liegt nach üblichen Bedingungen der Berufsunfähigkeitsversicherung Berufsunfähigkeit vor?","optionen":["Wenn die versicherte Person auf dem allgemeinen Arbeitsmarkt weniger als drei Stunden täglich arbeiten kann.","Wenn sie voraussichtlich mindestens sechs Monate zu mindestens 50 % ihren zuletzt ausgeübten Beruf nicht ausüben kann.","Wenn sie wegen eines Unfalls dauerhaft zu mindestens 50 % in ihrer körperlichen Leistungsfähigkeit beeinträchtigt ist.","Wenn sie länger als sechs Wochen arbeitsunfähig ist und deshalb Krankengeld von ihrer Krankenkasse bezieht."],"richtig":[1],"erkl":"Berufsunfähig ist nach § 172 Abs. 2 VVG, wer seinen zuletzt ausgeübten Beruf, so wie er ohne gesundheitliche Beeinträchtigung ausgestaltet war, infolge Krankheit, Körperverletzung oder mehr als altersentsprechenden Kräfteverfalls ganz oder teilweise voraussichtlich auf Dauer nicht mehr ausüben kann. Die marktüblichen Werte – Grad mindestens 50 %, Prognose mindestens sechs Monate – stehen nicht im Gesetz, sondern in den Bedingungen der Versicherer. Maßstab ist der konkrete Beruf, nicht der allgemeine Arbeitsmarkt.","norm":"§ 172 Abs. 2 VVG; Musterbedingungen BU","id":"4.7-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff der Berufsunfähigkeitsversicherung die passende Beschreibung zu.","paare":[["Abstrakte Verweisung","Verweis auf eine andere zumutbare Tätigkeit, auch wenn sie nicht ausgeübt wird"],["Konkrete Verweisung","Verweis nur auf eine tatsächlich ausgeübte Tätigkeit, die der Lebensstellung entspricht"],["Nachprüfung","Prüfung nach dem Anerkenntnis, ob die Berufsunfähigkeit fortbesteht"],["Beitragsbefreiung","Während der Berufsunfähigkeit entfällt die Pflicht zur Beitragszahlung"],["Leistungsdauer","Zeitraum, bis zu dessen Ende längstens eine BU-Rente gezahlt wird"]],"erkl":"Bei der abstrakten Verweisung darf der Versicherer auf jede Tätigkeit verweisen, die der Kunde nach Ausbildung und Fähigkeiten ausüben könnte und die seiner bisherigen Lebensstellung entspricht; viele Tarife verzichten darauf. Bei der konkreten Verweisung zählt nur eine tatsächlich ausgeübte Tätigkeit, die der bisherigen Lebensstellung entspricht. Nach dem Anerkenntnis darf der Versicherer nachprüfen; während der Leistung ist der Kunde von der Beitragszahlung befreit.","norm":"§§ 172 Abs. 3, 174 VVG; Musterbedingungen BU","id":"4.7-1-2"},{"typ":"mc","frage":"Frau Albrecht (45) kann wegen einer Erkrankung auf nicht absehbare Zeit auf dem allgemeinen Arbeitsmarkt nur noch vier Stunden täglich arbeiten. Die versicherungsrechtlichen Voraussetzungen sind erfüllt. Wie ist sie nach § 43 SGB VI einzustufen?","optionen":["Sie ist teilweise erwerbsgemindert, weil sie weniger als sechs Stunden täglich arbeiten kann.","Sie ist voll erwerbsgemindert, weil sie weniger als sechs Stunden täglich arbeiten kann.","Sie ist nicht erwerbsgemindert, weil sie noch mehr als drei Stunden täglich arbeiten kann.","Sie gilt als berufsunfähig, weil sie ihren erlernten Beruf nicht mehr voll ausüben kann."],"richtig":[0],"erkl":"Teilweise erwerbsgemindert ist, wer auf dem allgemeinen Arbeitsmarkt auf nicht absehbare Zeit weniger als sechs Stunden täglich arbeiten kann; voll erwerbsgemindert ist, wer weniger als drei Stunden arbeiten kann. Maßstab ist jede Tätigkeit des allgemeinen Arbeitsmarkts, nicht der bisherige Beruf. Die Rente wegen teilweiser Erwerbsminderung ist nur halb so hoch wie die volle; diese Lücke schließt eine BU-Versicherung. Findet Frau Albrecht keinen passenden Teilzeitarbeitsplatz, kann sie trotz teilweiser Erwerbsminderung die volle Rente erhalten (Arbeitsmarktrente); an ihrer Einstufung ändert das nichts.","norm":"§ 43 Abs. 1 und 2 SGB VI","id":"4.7-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Leistungen der Berufsunfähigkeitsversicherung treffen zu?","aussagen":[["Die Leistungsdauer sollte möglichst bis zum Rentenbeginn reichen, z. B. bis zum Alter 67.",true],["Während der Berufsunfähigkeit ist der Kunde in der Regel von der Beitragszahlung befreit.",true],["Nach einem Leistungsantrag muss der Versicherer in Textform erklären, ob er seine Leistungspflicht anerkennt.",true],["Stellt der Versicherer bei der Nachprüfung eine Besserung fest, endet die Rente am Tag der Untersuchung.",false],["Eine BU-Rente zahlt der Versicherer nur, wenn ein Unfall die Berufsunfähigkeit verursacht hat.",false]],"erkl":"Die BU-Rente wird bei Krankheit, Körperverletzung oder mehr als altersentsprechendem Kräfteverfall gezahlt, längstens bis zum Ende der Leistungsdauer; dazu kommt die Beitragsbefreiung. Nach dem Leistungsantrag erklärt der Versicherer in Textform, ob er anerkennt. Will er nach einer Nachprüfung die Leistung einstellen, muss er die Veränderung in Textform darlegen; leistungsfrei wird er frühestens mit Ablauf des dritten Monats nach Zugang dieser Erklärung.","norm":"§§ 172, 173, 174 VVG; Musterbedingungen BU","id":"4.7-1-4"},{"typ":"zuo","frage":"Ein Antragsteller hat eine Gesundheitsfrage falsch beantwortet; er wurde in Textform gesondert über die Folgen belehrt. Ordnen Sie dem Verschulden die Rechtsfolge zu.","paare":[["Arglist","Anfechtung des Vertrags wegen Täuschung"],["Vorsatz","Rücktritt, auch wenn der Versicherer zu anderen Bedingungen geschlossen hätte"],["Grobe Fahrlässigkeit","Rücktritt, außer der Versicherer hätte zu anderen Bedingungen geschlossen"],["Einfache Fahrlässigkeit","kein Rücktritt; Kündigung mit Monatsfrist oder Vertragsanpassung"]],"erkl":"§ 19 VVG staffelt die Rechte nach dem Verschulden. Bei Vorsatz darf der Versicherer zurücktreten, bei grober Fahrlässigkeit nur, wenn er den Vertrag bei Kenntnis gar nicht geschlossen hätte; sonst wird der Vertrag angepasst. Bei einfacher Fahrlässigkeit ist der Rücktritt ausgeschlossen; möglich sind die Kündigung mit Monatsfrist oder, wenn er zu anderen Bedingungen geschlossen hätte, die Vertragsanpassung. Bei Arglist kann er den Vertrag zusätzlich anfechten.","norm":"§§ 19, 21, 22 VVG; § 123 BGB","id":"4.7-1-5"},{"typ":"mc","frage":"Ein Kunde stellt einen Antrag auf Leistungen aus seiner Berufsunfähigkeitsversicherung. Wann sind die Geldleistungen des Versicherers nach dem VVG fällig?","optionen":["Sofort mit Zugang des Leistungsantrags, und zwar unabhängig von weiteren Prüfungen des Versicherers.","Erst nach Ablauf von sechs Monaten, in denen die Berufsunfähigkeit ununterbrochen bestand.","Mit Beendigung der Erhebungen, die zur Feststellung von Versicherungsfall und Leistung nötig sind.","Erst wenn die gesetzliche Rentenversicherung über eine Rente wegen Erwerbsminderung entschieden hat."],"richtig":[2],"erkl":"Geldleistungen sind fällig, wenn die zur Feststellung des Versicherungsfalls und des Leistungsumfangs nötigen Erhebungen beendet sind. Dauern sie länger als einen Monat nach der Anzeige, kann der Kunde Abschlagszahlungen in Höhe des Betrags verlangen, den der Versicherer voraussichtlich mindestens zahlen muss. Eine Entscheidung der Rentenversicherung ist keine Voraussetzung.","norm":"§ 14 Abs. 1 und 2 VVG","id":"4.7-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Melanie Krüger (29) arbeitet in Vollzeit als Pflegefachkraft in einem Krankenhaus in Halle (Saale) und verdient 2.400 € netto im Monat. Sie möchte bei der Proximus eine Berufsunfähigkeitsversicherung mit Endalter 67 abschließen. Die Proximus empfiehlt als Faustregel eine BU-Rente von 75 % des Nettoeinkommens. Pflegefachkräfte gehören bei der Proximus zur Berufsgruppe 3; für Frau Krügers Eintrittsalter beträgt der Monatsbeitrag 6,40 € je 100 € versicherter Monatsrente. Im Antrag fragt die Proximus in Textform nach ambulanten Untersuch
