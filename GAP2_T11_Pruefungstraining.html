ungen und Behandlungen durch Ärzte oder andere Behandler (z. B. Physiotherapeuten) in den letzten fünf Jahren; Frau Krüger war 2024 wegen Rückenschmerzen acht Wochen in Physiotherapie.","items":[{"typ":"zahl","frage":"Welche monatliche BU-Rente empfehlen Sie Frau Krüger nach der Faustregel der Proximus?","wert":1800,"einheit":"€","tol":0.5,"erkl":"BU-Rente nach Faustregel: 2.400 € × 75 % = 1.800 € im Monat.","norm":"Beratungsgrundsatz der Proximus (im Fall vorgegeben); § 172 VVG","id":"4.7-2-1"},{"typ":"zahl","frage":"Berechnen Sie den Monatsbeitrag für die empfohlene BU-Rente in Berufsgruppe 3.","wert":115.2,"einheit":"€","tol":0.5,"erkl":"1.800 € : 100 € = 18 Einheiten. 18 × 6,40 € = 115,20 € Monatsbeitrag.","norm":"Tarif der Proximus (im Fall vorgegeben)","id":"4.7-2-2"},{"typ":"mc","frage":"Frau Krüger meint, die Physiotherapie sei harmlos gewesen und müsse im Antrag nicht angegeben werden. Wie beraten Sie sie?","optionen":["Sie muss sie nicht angeben, weil eine Physiotherapie keine Behandlung durch einen Arzt ist.","Sie kann sie weglassen, weil die Proximus nach fünf Jahren ohnehin nicht mehr zurücktreten kann.","Sie gibt sie erst an, wenn sie später wegen ihres Rückens einen Leistungsantrag stellen muss.","Sie gibt sie an, weil danach in Textform gefragt wird; sonst drohen Rücktritt oder Anpassung."],"richtig":[3],"erkl":"Die Proximus fragt in Textform nach ambulanten Behandlungen auch durch Physiotherapeuten in den letzten fünf Jahren; die Physiotherapie 2024 fällt darunter und ist Frau Krüger bekannt. Verschweigt sie sie, kann die Proximus je nach Verschulden zurücktreten, kündigen oder den Vertrag anpassen, etwa mit einem Ausschluss für Rückenleiden. Diese Rechte erlöschen zwar fünf Jahre nach Vertragsschluss, aber nicht für Versicherungsfälle, die vorher eingetreten sind; bei Vorsatz oder Arglist beträgt die Frist zehn Jahre.","norm":"§§ 19, 21 VVG","id":"4.7-2-3"},{"typ":"wf","frage":"Frau Krüger überlegt, statt der BU-Versicherung eine Unfallversicherung mit Unfallrente abzuschließen. Welche Aussagen treffen zu?","aussagen":[["Die BU-Rente leistet auch bei Krankheit, die Unfallrente nur nach einem Unfall.",true],["Die Unfallrente knüpft an den Invaliditätsgrad an, die BU-Rente an den zuletzt ausgeübten Beruf.",true],["Die Unfallrente wird meist lebenslang gezahlt, die BU-Rente längstens bis zum Ende der Leistungsdauer.",true],["Da die meisten Berufsunfähigkeiten durch Unfälle entstehen, reicht für sie die Unfallrente aus.",false],["Beide Renten setzen voraus, dass Frau Krüger keinen anderen Beruf mehr ausüben kann.",false]],"erkl":"Die meisten Berufsunfähigkeiten entstehen durch Krankheiten, etwa des Bewegungsapparats oder der Psyche; Unfälle sind nur ein kleiner Teil. Die Unfallrente setzt einen Unfall und einen Mindest-Invaliditätsgrad voraus und wird meist lebenslang gezahlt. Die BU-Rente knüpft an den zuletzt ausgeübten Beruf an und endet spätestens mit der Leistungsdauer. Für Frau Krüger ist die BU-Versicherung deshalb vorrangig.","norm":"§§ 172, 178 VVG; Musterbedingungen BU; AUB 2022 (Proximus 5)","id":"4.7-2-4"}]}],"runde":"zusatz"}]},{"nr":"5","titel":"Instrumente der kaufmännischen Steuerung und Kontrolle nutzen","lf":"LF 9, LF 12","abschnitte":[{"nr":"5.1","titel":"Buchführung und Erfolg","lf":"LF 9, LF 12","buch":"PV2 7.1 S. 343–398 · Lösungen S. 720–727","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welche Aussage beschreibt den Unterschied zwischen Bestands- und Erfolgskonten richtig?","optionen":["Bestandskonten erfassen Erträge, Erfolgskonten erfassen Vermögen und Schulden der Agentur.","Bestandskonten werden über die GuV abgeschlossen, Erfolgskonten über das Schlussbilanzkonto.","Bestandskonten zeigen Vermögen und Kapital, Erfolgskonten Aufwendungen und Erträge des Jahres.","Bestandskonten gibt es nur bei Versicherern, Erfolgskonten nur bei selbstständigen Vertretern."],"richtig":[2],"erkl":"Bestandskonten (Aktiv- und Passivkonten) stammen aus der Bilanz und gehen ins Schlussbilanzkonto. Erfolgskonten sind Unterkonten des Eigenkapitals und werden über das GuV-Konto abgeschlossen.","norm":"§§ 238, 242 HGB","id":"5.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Geschäftsfall der Agentur den richtigen Buchungssatz zu.","paare":[["Die Proximus überweist die Provisionsabrechnung für März auf das Geschäftskonto.","Bank an Provisionserlöse"],["Die Büromiete für April wird per Dauerauftrag abgebucht.","Büromiete an Bank"],["Die Inhaberin tankt den Agenturwagen und zahlt bar aus der Geschäftskasse.","Kfz-Kosten an Kasse"],["Bargeld aus der Geschäftskasse wird auf das Bankkonto eingezahlt.","Bank an Kasse"]],"erkl":"Zuerst wird das Soll-Konto genannt, dann das Haben-Konto. Erträge stehen im Haben, Aufwendungen im Soll. Ein Aktivtausch (Bank an Kasse) berührt den Erfolg nicht.","norm":"§ 238 HGB, Grundsätze ordnungsmäßiger Buchführung","id":"5.1-1-2"},{"typ":"mc","frage":"Die Agentur zahlt die Büromiete von 900 € per Banküberweisung. Wie lautet der Buchungssatz?","optionen":["Bank 900 € an Büromiete 900 €","Büromiete 900 € an Bank 900 €","Büromiete 900 € an Eigenkapital 900 €","Eigenkapital 900 € an Büromiete 900 €"],"richtig":[1],"erkl":"Die Miete ist Aufwand und steht im Soll des Aufwandskontos. Das Bankguthaben nimmt ab, deshalb Haben auf dem Aktivkonto Bank.","norm":"§ 238 HGB","id":"5.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zum Abschluss der Erfolgskonten über das GuV-Konto treffen zu?","aussagen":[["Die Salden der Aufwandskonten stehen auf der Sollseite des GuV-Kontos.",true],["Die Salden der Ertragskonten stehen auf der Habenseite des GuV-Kontos.",true],["Sind die Erträge größer als die Aufwendungen, ergibt sich ein Gewinn.",true],["Das GuV-Konto wird über das Schlussbilanzkonto abgeschlossen, nicht über das Eigenkapital.",false],["Eine Banküberweisung zwischen zwei Geschäftskonten verändert den Gewinn.",false]],"erkl":"Das GuV-Konto ist ein Unterkonto des Eigenkapitals; sein Saldo (Gewinn oder Verlust) geht auf das Eigenkapitalkonto. Erfolgsneutrale Vorgänge berühren die GuV nicht.","norm":"§ 242 Abs. 2 HGB","id":"5.1-1-4"},{"typ":"mc","frage":"Das GuV-Konto der Agentur weist einen Gewinn aus. Wie lautet die Abschlussbuchung?","optionen":["Eigenkapital an GuV","Schlussbilanzkonto an GuV","GuV an Schlussbilanzkonto","GuV an Eigenkapital"],"richtig":[3],"erkl":"Bei einem Gewinn ist die Habenseite (Erträge) größer; der Saldo steht im Soll des GuV-Kontos und erhöht das Eigenkapital im Haben.","norm":"§ 242 Abs. 2 HGB","id":"5.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Markus Brandt betreibt in Halle (Saale) als selbstständiger Versicherungsvertreter (Handelsvertreter nach § 84 HGB) eine Agentur der Proximus Versicherung AG. Er ist als Kaufmann buchführungspflichtig. Sie sind Auszubildende/r in der Agentur und helfen beim Jahresabschluss 2026. Die Erfolgskonten zeigen: Abschlussprovisionen 96.400 €, Bestandsprovisionen 18.600 €, Büromiete 10.800 €, Gehälter und Sozialaufwand 32.000 €, Kfz-Kosten 7.400 €, Abschreibungen 4.200 €, sonstige Aufwendungen 6.600 €.","items":[{"typ":"mc","frage":"Die Proximus schreibt Herrn Brandt eine Provisionsabrechnung über 4.300 € gut; das Geld geht erst im Folgemonat auf dem Konto ein. Wie wird die Gutschrift gebucht?","optionen":["Provisionsforderungen an Provisionserlöse","Provisionserlöse an Provisionsforderungen","Bank an Provisionsforderungen","Provisionsforderungen an Eigenkapital"],"richtig":[0],"erkl":"Mit der Abrechnung entsteht der Ertrag und zugleich eine Forderung gegen die Proximus. Bei Zahlungseingang wird gebucht: Bank an Provisionsforderungen.","norm":"§ 87 HGB, § 252 Abs. 1 Nr. 5 HGB","id":"5.1-2-1"},{"typ":"zahl","frage":"Ermitteln Sie den Gewinn der Agentur Brandt für 2026 laut GuV-Konto.","wert":54000,"einheit":"€","tol":0.5,"erkl":"Erträge: 96.400 + 18.600 = 115.000 €. Aufwendungen: 10.800 + 32.000 + 7.400 + 4.200 + 6.600 = 61.000 €. Gewinn = 115.000 − 61.000 = 54.000 €.","norm":"§ 242 Abs. 2 HGB","id":"5.1-2-2"},{"typ":"mc","frage":"Herr Brandt fragt, warum auf seinen Provisionsrechnungen keine Umsatzsteuer steht. Welche Antwort ist richtig?","optionen":["Provisionen sind nur steuerfrei, wenn die Agentur weniger als drei Mitarbeiter beschäftigt.","Die Proximus führt die Umsatzsteuer für ihn ab, deshalb erscheint sie nicht auf der Abrechnung.","Umsätze aus der Tätigkeit als Versicherungsvertreter sind von der Umsatzsteuer befreit.","Provisionen unterliegen dem ermäßigten Satz, der auf Abrechnungen nicht ausgewiesen wird."],"richtig":[2],"erkl":"Die Leistungen als Versicherungsvertreter sind nach § 4 Nr. 11 UStG steuerfrei. Folge: Ein Vorsteuerabzug aus Eingangsrechnungen ist ausgeschlossen, die Umsatzsteuer auf Einkäufe wird mit als Aufwand bzw. Anschaffungskosten gebucht.","norm":"§ 4 Nr. 11 UStG, § 15 Abs. 2 UStG","id":"5.1-2-3"}]}]},{"nr":"5.2","titel":"Privatkonto und Personal","lf":"LF 9, LF 12","buch":"PV2 7.1 S. 343–398 · Lösungen S. 720–727","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Die Agenturinhaberin hebt 1.500 € vom Geschäftskonto ab, um ihre private Wohnungsmiete zu zahlen. Wie wird gebucht?","optionen":["Privat an Bank","Büromiete an Bank","Bank an Privat","Eigenkapital an Büromiete"],"richtig":[0],"erkl":"Eine Geldentnahme für private Zwecke ist eine Privatentnahme. Sie mindert das Eigenkapital, wird aber über das Privatkonto gebucht und ist kein Aufwand.","norm":"§ 4 Abs. 1 Satz 2 EStG","id":"5.2-1-1"},{"typ":"zahl","frage":"Ein Versicherungsvertreter nutzt seinen Agenturwagen (Verbrenner, betriebliche Nutzung über 50 %, Bruttolistenpreis 38.600 €) auch privat. Er versteuert die Privatnutzung nach der 1-%-Regel. Welcher Betrag ist für das ganze Jahr als Entnahme zu buchen?","wert":4632,"einheit":"€","tol":0.5,"erkl":"1 % des Bruttolistenpreises je Monat: 38.600 × 1 % = 386 €; für 12 Monate 386 × 12 = 4.632 €. Buchung z. B.: Privat an Kfz-Kosten bzw. an das Konto für unentgeltliche Wertabgaben.","norm":"§ 6 Abs. 1 Nr. 4 Satz 2 EStG","id":"5.2-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Privatkonto eines Agenturinhabers treffen zu?","aussagen":[["Das Privatkonto ist ein Unterkonto des Eigenkapitalkontos.",true],["Privatentnahmen werden im Soll, Privateinlagen im Haben gebucht.",true],["Nimmt der Inhaber einen Laptop der Agentur dauerhaft privat mit nach Hause, ist das eine Sachentnahme.",true],["Privatentnahmen mindern als Aufwand den Gewinn der Agentur.",false],["Das Privatkonto wird über das GuV-Konto abgeschlossen.",false]],"erkl":"Entnahmen und Einlagen verändern das Eigenkapital, sind aber erfolgsneutral. Das Privatkonto wird deshalb direkt über das Eigenkapitalkonto abgeschlossen; Sachentnahmen sind mit dem Teilwert anzusetzen.","norm":"§ 4 Abs. 1 EStG, § 6 Abs. 1 Nr. 4 EStG","id":"5.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie die Bestandteile der Gehaltsabrechnung dem Konto zu, auf dem sie gebucht werden.","paare":[["Bruttogehalt der Mitarbeiterin","Gehälter (Aufwand)"],["einbehaltene Lohnsteuer und Solidaritätszuschlag","Verbindlichkeiten gegenüber Finanzbehörden"],["Gesamtsozialversicherungsbeitrag bis zur Abführung an die Krankenkasse","Verbindlichkeiten gegenüber Sozialversicherungsträgern"],["Arbeitgeberanteil zur Sozialversicherung als Kosten der Agentur","Gesetzliche soziale Aufwendungen"]],"erkl":"Personalaufwand = Bruttogehalt + Arbeitgeberanteil. Die Abzüge sind bis zur Abführung Verbindlichkeiten; der AG-Anteil wird als eigener Aufwand gebucht.","norm":"§ 38 EStG, § 28e SGB IV","id":"5.2-1-4"},{"typ":"mc","frage":"Eine Mitarbeiterin erhält am 10. Juni einen Gehaltsvorschuss von 400 € in bar. Wie lautet der Buchungssatz bei Auszahlung?","optionen":["Gehälter an Kasse","Kasse an Forderungen an Mitarbeiter","Gesetzliche soziale Aufwendungen an Kasse","Forderungen an Mitarbeiter an Kasse"],"richtig":[3],"erkl":"Ein Vorschuss ist noch kein Aufwand, sondern eine Forderung gegen die Mitarbeiterin. Sie wird bei der nächsten Gehaltsabrechnung verrechnet (Haben: Forderungen an Mitarbeiter).","norm":"§ 614 BGB, § 238 HGB","id":"5.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Sabine Krüger führt in Halle (Saale) eine Proximus-Agentur als Einzelunternehmerin (Handelsvertreterin nach § 84 HGB). Ihr Eigenkapital betrug am 1.1.2026 52.000 €. Im Jahr 2026 hat sie 30.000 € für private Zwecke vom Geschäftskonto entnommen; die private Kfz-Nutzung wurde mit 4.800 € als Entnahme gebucht. Im Mai legte sie 6.000 € aus einer Erbschaft auf das Geschäftskonto ein. Der Gewinn laut GuV beträgt 41.000 €. Ihre Bürokraft Frau Lea Hoffmann (Bruttogehalt 3.200 €) hat im Juni einen Vorschuss von 500 € erhalten.","items":[{"typ":"zahl","frage":"Berechnen Sie das Eigenkapital der Agentur Krüger am 31.12.2026.","wert":64200,"einheit":"€","tol":0.5,"erkl":"Eigenkapital 31.12. = Anfangskapital + Gewinn + Einlagen − Entnahmen = 52.000 + 41.000 + 6.000 − (30.000 + 4.800) = 64.200 €. Das Eigenkapital ist um 12.200 € gestiegen.","norm":"§ 4 Abs. 1 EStG","id":"5.2-2-1"},{"typ":"mc","frage":"Wie wird das Privatkonto von Frau Krüger zum 31.12.2026 abgeschlossen?","optionen":["Privat 28.800 € an Eigenkapital 28.800 €","GuV 28.800 € an Privat 28.800 €","Eigenkapital 28.800 € an Privat 28.800 €","Privat 28.800 € an GuV 28.800 €"],"richtig":[2],"erkl":"Entnahmen (Soll) 34.800 € übersteigen die Einlage (Haben) 6.000 €; Saldo 28.800 € im Haben des Privatkontos. Er mindert das Eigenkapital: Eigenkapital an Privat.","norm":"§ 4 Abs. 1 EStG","id":"5.2-2-2"},{"typ":"zahl","frage":"Die Juni-Abrechnung von Frau Hoffmann: Bruttogehalt 3.200,00 €, Lohnsteuer 312,50 €, Arbeitnehmeranteil Sozialversicherung 675,20 €; Solidaritätszuschlag und Kirchensteuer fallen nicht an. Der Vorschuss wird verrechnet. Welcher Betrag wird überwiesen?","wert":1712.3,"einheit":"€","tol":0.01,"erkl":"Netto = 3.200,00 − 312,50 − 675,20 = 2.212,30 €. Abzüglich Vorschuss 500,00 € ergibt eine Überweisung von 1.712,30 €. Buchung: Gehälter 3.200,00 an Bank 1.712,30, Verb. Finanzbehörden 312,50, Verb. SV-Träger 675,20, Forderungen an Mitarbeiter 500,00.","norm":"§ 38 EStG, § 28e SGB IV","id":"5.2-2-3"}]}]},{"nr":"5.3","titel":"Jahresabschluss","lf":"LF 9, LF 12","buch":"PV2 7.2 S. 399–415 · Lösungen S. 727–731","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zahl","frage":"Ein Agenturfahrzeug wird am 12.04.2026 angeschafft. Anschaffungskosten 42.000 € (einschließlich nicht abziehbarer Umsatzsteuer), Nutzungsdauer laut AfA-Tabelle 6 Jahre, lineare Abschreibung. Wie hoch ist die Abschreibung für 2026?","wert":5250,"einheit":"€","tol":0.5,"erkl":"Jahres-AfA = 42.000 : 6 = 7.000 €. Zeitanteilig ab dem Anschaffungsmonat April: 9 Monate, 7.000 × 9/12 = 5.250 €.","norm":"§ 7 Abs. 1 Satz 1 und 4 EStG, § 253 Abs. 3 HGB","id":"5.3-1-1"},{"typ":"mc","frage":"Die Agentur kauft einen Bürostuhl für 690 € zuzüglich 131,10 € Umsatzsteuer. Ein Vorsteuerabzug ist nicht möglich. Wie kann der Stuhl behandelt werden?","optionen":["Er muss aktiviert werden, weil der Rechnungsbetrag von 821,10 € über 800 € liegt.","Er darf als GWG sofort abgeschrieben werden, weil der Nettobetrag 800 € nicht übersteigt.","Er muss zwingend über die Nutzungsdauer von 13 Jahren abgeschrieben werden.","Er ist als Privatentnahme zu buchen, weil keine Vorsteuer abgezogen wird."],"richtig":[1],"erkl":"Für die GWG-Grenze von 800 € zählt der Betrag ohne Umsatzsteuer – auch wenn sie nicht abziehbar ist. Die Anschaffungskosten (821,10 €) können sofort voll abgeschrieben werden.","norm":"§ 6 Abs. 2 EStG","id":"5.3-1-2"},{"typ":"mc","frage":"Warum bildet die Agentur zum 31.12. eine Rückstellung für die Kosten des Jahresabschlusses durch den Steuerberater?","optionen":["Weil die Rechnung im neuen Jahr kommt und dann als Aufwand des neuen Jahres gilt.","Weil der Steuerberater eine Sicherheitsleistung auf einem Sonderkonto verlangt.","Weil Rückstellungen den Kassenbestand für spätere Zahlungen reservieren.","Weil der Aufwand zum alten Jahr gehört, Höhe und Zahlungstag aber ungewiss sind."],"richtig":[3],"erkl":"Rückstellungen erfassen ungewisse Verbindlichkeiten im Jahr ihrer Verursachung (periodengerechte Erfolgsermittlung). Buchung: Rechts- und Beratungskosten an Rückstellungen.","norm":"§ 249 Abs. 1 HGB, § 252 Abs. 1 Nr. 5 HGB","id":"5.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie jeden Fall zum 31.12.2026 der richtigen Abgrenzung zu.","paare":[["Die Kfz-Versicherung für Okt. 2026 bis Sept. 2027 wurde am 1.10.2026 im Voraus bezahlt.","Aktive Rechnungsabgrenzung"],["Ein Untermieter hat die Miete für Januar 2027 schon im Dezember 2026 überwiesen.","Passive Rechnungsabgrenzung"],["Die Provision für Dezember 2026 wird von der Proximus erst im Januar 2027 abgerechnet.","Sonstige Forderungen"],["Die Stromkosten für Dezember 2026 werden erst im Januar 2027 abgebucht.","Sonstige Verbindlichkeiten"]],"erkl":"RAP: Zahlung im alten Jahr, Erfolg im neuen Jahr. Sonstige Forderungen/Verbindlichkeiten: Erfolg im alten Jahr, Zahlung erst im neuen Jahr.","norm":"§ 250 HGB, § 252 Abs. 1 Nr. 5 HGB","id":"5.3-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Notwendigkeit zeitlicher Abgrenzungen treffen zu?","aussagen":[["Aufwendungen und Erträge sind dem Jahr zuzurechnen, zu dem sie wirtschaftlich gehören, unabhängig vom Zahlungstag.",true],["Ohne Abgrenzung würde der Gewinn eines Jahres durch Zahlungen verzerrt, die das Folgejahr betreffen.",true],["Eine aktive Rechnungsabgrenzung erhöht den Gewinn des alten Jahres gegenüber der ungebuchten Lage.",true],["Zeitliche Abgrenzungen sind freiwillig und nur für Kapitalgesellschaften gedacht.",false],["Eine passive Rechnungsabgrenzung erhöht den Gewinn des alten Jahres.",false]],"erkl":"Das HGB verlangt die periodengerechte Erfolgsermittlung für alle Kaufleute. Die ARA nimmt Aufwand aus dem alten Jahr heraus (Gewinn steigt), die PRA nimmt Ertrag heraus (Gewinn sinkt).","norm":"§ 250 HGB, § 252 Abs. 1 Nr. 5 HGB","id":"5.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Agenturinhaber Tobias Lehmann, Proximus-Agentur in Halle-Neustadt, hat für 2026 einen vorläufigen Gewinn von 58.000 € ermittelt. Folgende Vorgänge sind noch nicht berücksichtigt: Die Kfz-Versicherung für den Agenturwagen (1.200 € für 1.10.2026 bis 30.9.2027) wurde am 1.10. voll als Aufwand gebucht. Für die Erstellung des Jahresabschlusses erwartet er eine Rechnung des Steuerberaters über 2.400 €. Die Bestandsprovision für Dezember 2026 von 1.600 € rechnet die Proximus erst im Januar 2027 ab.","items":[{"typ":"mc","frage":"Wie lautet die Abgrenzungsbuchung für die Kfz-Versicherung zum 31.12.2026?","optionen":["Kfz-Versicherung 900 € an Aktive Rechnungsabgrenzung 900 €","Aktive Rechnungsabgrenzung 300 € an Kfz-Versicherung 300 €","Aktive Rechnungsabgrenzung 900 € an Kfz-Versicherung 900 €","Passive Rechnungsabgrenzung 900 € an Kfz-Versicherung 900 €"],"richtig":[2],"erkl":"Von 12 bezahlten Monaten gehören 9 (Jan.–Sept. 2027) ins neue Jahr: 1.200 × 9/12 = 900 €. Dieser Aufwand wird über die ARA ins Folgejahr übertragen.","norm":"§ 250 Abs. 1 HGB","id":"5.3-2-1"},{"typ":"zahl","frage":"Berechnen Sie den endgültigen Gewinn 2026 nach allen Abschlussbuchungen.","wert":58100,"einheit":"€","tol":0.5,"erkl":"58.000 € + 900 € (ARA mindert Aufwand) − 2.400 € (Rückstellung erhöht Aufwand) + 1.600 € (sonstige Forderung erhöht Ertrag) = 58.100 €.","norm":"§§ 249, 250, 252 Abs. 1 Nr. 5 HGB","id":"5.3-2-2"},{"typ":"mc","frage":"Im März 2027 berechnet der Steuerberater nur 2.150 €, die per Bank gezahlt werden. Wie wird gebucht?","optionen":["Rückstellungen 2.400 € an Bank 2.150 € und an Erträge aus der Auflösung von Rückstellungen 250 €","Rechts- und Beratungskosten 2.150 € an Bank 2.150 €; die Rückstellung bleibt unverändert bestehen","Rückstellungen 2.150 € an Bank 2.150 €; die restlichen 250 € werden auf das Privatkonto umgebucht","Rückstellungen 2.400 € an Bank 2.150 € und an Rechts- und Beratungskosten des Vorjahres 250 €"],"richtig":[0],"erkl":"Die Rückstellung wird in voller Höhe aufgelöst. Der zu viel zurückgestellte Betrag von 250 € ist ein periodenfremder Ertrag des Jahres 2027.","norm":"§ 249 Abs. 2 Satz 2 HGB","id":"5.3-2-3"}]}]},{"nr":"5.4","titel":"Kosten- und Leistungsrechnung","lf":"LF 9, LF 12","buch":"PV2 7.3 S. 416–432 · Lösungen S. 731–732","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wodurch unterscheidet sich die Kosten- und Leistungsrechnung (KLR) von der Finanzbuchhaltung?","optionen":["Die KLR ist gesetzlich vorgeschrieben und dient vor allem der Steuerberechnung.","Die KLR erfasst alle Aufwendungen und Erträge des Unternehmens, auch betriebsfremde.","Die KLR ersetzt die Bilanz und wird dem Finanzamt jährlich vorgelegt.","Die KLR erfasst nur den betrieblichen Werteverzehr und dient der internen Steuerung."],"richtig":[3],"erkl":"Die Finanzbuchhaltung (Rechnungskreis I) ist gesetzlich geregelt und ermittelt das Unternehmensergebnis. Die KLR (Rechnungskreis II) ist intern, erfasst nur Kosten und Leistungen und ermittelt das Betriebsergebnis.","norm":"§§ 238, 242 HGB (Abgrenzung)","id":"5.4-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeden Posten der sachlichen Abgrenzung richtig zu.","paare":[["Spende der Agentur an den örtlichen Sportverein","betriebsfremder Aufwand (neutral)"],["Verlust durch Einbruchdiebstahl, nicht versichert","außerordentlicher Aufwand (neutral)"],["Gewerbesteuernachzahlung für das Jahr 2024","periodenfremder Aufwand (neutral)"],["Kalkulatorischer Unternehmerlohn des Inhabers","Zusatzkosten"],["Kalkulatorische Abschreibung statt bilanzieller AfA","Anderskosten"]],"erkl":"Neutrale Aufwendungen gehen nicht in die KLR ein. Zusatzkosten stehen keinem Aufwand gegenüber; Anderskosten werden in anderer Höhe als der Aufwand angesetzt.","norm":"Sachliche Abgrenzung (Ergebnistabelle)","id":"5.4-1-2"},{"typ":"mc","frage":"Warum setzt ein selbstständiger Versicherungsvertreter in der KLR einen kalkulatorischen Unternehmerlohn an?","optionen":["Weil er sich das Geld monatlich als Gehalt überweisen muss.","Weil seine Arbeitsleistung sonst in den Kosten fehlen würde.","Weil der Unternehmerlohn als Aufwand den Gewinn senken soll.","Weil das Finanzamt den Unternehmerlohn als Betriebsausgabe fordert."],"richtig":[1],"erkl":"Der Inhaber erhält kein Gehalt; seine Arbeit verursacht dennoch Kosten. Der Unternehmerlohn ist Zusatzkosten und macht die Agentur mit einer Kapitalgesellschaft mit angestelltem Geschäftsführer vergleichbar.","norm":"Kalkulatorische Kosten (KLR)","id":"5.4-1-3"},{"typ":"wf","frage":"Welche Aussagen zu Kostenarten in einer Versicherungsagentur treffen zu?","aussagen":[["Die monatliche Büromiete ist fixe Kosten, weil sie nicht von der Zahl der Abschlüsse abhängt.",true],["Ein Werbegeschenk, das nur bei einem Abschluss an den Kunden geht, ist variable Kosten.",true],["Einzelkosten lassen sich einem Kostenträger (z. B. einer Sparte) direkt zurechnen.",true],["Die Gehälter der Bürokraft sind Einzelkosten jedes einzelnen Vertrags.",false],["Fixe Kosten je Vertrag bleiben gleich, wenn mehr Verträge vermittelt werden.",false]],"erkl":"Fixe Gesamtkosten verteilen sich bei steigender Menge auf mehr Einheiten; die fixen Stückkosten sinken (Fixkostendegression). Bürogehälter sind Gemeinkosten.","norm":"Kostenarten (KLR)","id":"5.4-1-4"},{"typ":"zahl","frage":"Für eine neue Sparte erhält die Agentur je Vertrag 180 € Provision. Variable Kosten je Vertrag: 45 €. Die zusätzlichen Fixkosten (Schulung, Software) betragen 10.800 € im Jahr. Ab wie vielen Verträgen ist die Gewinnschwelle erreicht?","wert":80,"einheit":"Verträge","tol":0.01,"erkl":"Deckungsbeitrag je Vertrag = 180 − 45 = 135 €. Break-even = Fixkosten : DB = 10.800 : 135 = 80 Verträge.","norm":"Deckungsbeitragsrechnung (KLR)","id":"5.4-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die Proximus-Agentur von Frau Nadine Schulze in Halle (Saale) weist für 2026 in der GuV aus: Provisionserlöse 172.000 €, Zinserträge 1.000 €, Mieterträge aus Untervermietung eines Büroraums 4.800 €, Erträge aus der Auflösung von Rückstellungen 2.200 €; Personalaufwand 48.000 €, Büromiete 14.400 €, Kfz-Kosten 9.600 €, bilanzielle Abschreibungen 6.000 €, Zinsaufwand 1.800 €, Spende 500 €, sonstige betriebliche Aufwendungen 12.000 €. Für die KLR setzt sie an: kalkulatorische Abschreibungen 7.200 €, kalkulatorische Zinsen 2.400 €, kalkulatorischer Unternehmerlohn 54.000 €. Die kalkulatorischen Abschreibungen und Zinsen ersetzen die bilanziellen Abschreibungen und den Zinsaufwand; die Spende ist betriebsfremd. Alle übrigen Aufwendungen sind Grundkosten, die Provisionserlöse sind die einzigen Leistungen.","items":[{"typ":"zahl","frage":"Ermitteln Sie das Betriebsergebnis der Agentur Schulze.","wert":24400,"einheit":"€","tol":0.5,"erkl":"Leistungen 172.000 €. Kosten: 48.000 + 14.400 + 9.600 + 12.000 (Grundkosten) + 7.200 + 2.400 (Anderskosten) + 54.000 (Zusatzkosten) = 147.600 €. Betriebsergebnis = 172.000 − 147.600 = 24.400 €.","norm":"Ergebnistabelle (sachliche Abgrenzung)","id":"5.4-2-1"},{"typ":"zahl","frage":"Ermitteln Sie das neutrale Ergebnis (Ergebnis aus unternehmensbezogenen Abgrenzungen und kostenrechnerischen Korrekturen).","wert":63300,"einheit":"€","tol":0.5,"erkl":"Unternehmensergebnis = 180.000 − 92.300 = 87.700 €. Neutrales Ergebnis = 87.700 − 24.400 = 63.300 €. Probe: neutrale Erträge 8.000 − Spende 500 + Korrekturen (63.600 verrechnete Kosten − 7.800 Aufwand) 55.800 = 63.300 €.","norm":"Ergebnistabelle (sachliche Abgrenzung)","id":"5.4-2-2"},{"typ":"mc","frage":"Wie behandeln Sie die Erträge aus der Auflösung von Rückstellungen (2.200 €) in der Ergebnistabelle?","optionen":["als Leistung, weil sie aus der Agenturtätigkeit des Jahres stammen","als neutralen Ertrag, weil sie periodenfremd sind und kein Leistungsertrag","als Zusatzleistung, die im Abgrenzungsbereich verrechnet werden muss","als Minderung der Grundkosten bei den Rechts- und Beratungskosten"],"richtig":[1],"erkl":"Der Ertrag entsteht nur, weil im Vorjahr zu viel zurückgestellt wurde. Er betrifft ein früheres Jahr und gehört nicht zur betrieblichen Leistung des Jahres 2026.","norm":"Ergebnistabelle (sachliche Abgrenzung), § 249 HGB","id":"5.4-2-3"}]}]},{"nr":"5.5","titel":"Agentursteuerung und Kennzahlen","lf":"LF 9, LF 12","buch":"PV2 7.4–7.6 S. 433–441 · Lösungen S. 732–733","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Kennzahl ihre Berechnung zu.","paare":[["Eigenkapitalquote","Eigenkapital : Gesamtkapital × 100"],["Eigenkapitalrentabilität","Gewinn : Eigenkapital × 100"],["Umsatzrentabilität","Gewinn : Umsatzerlöse (Provisionserlöse) × 100"],["Liquidität 1. Grades","flüssige Mittel : kurzfristige Verbindlichkeiten × 100"],["Liquidität 2. Grades","(flüssige Mittel + kurzfristige Forderungen) : kurzfristige Verbindlichkeiten × 100"]],"erkl":"Die Kennzahlen werden aus Bilanz (Kapitalstruktur, Liquidität) und GuV (Gewinn, Erlöse) gewonnen und im Zeit- oder Betriebsvergleich ausgewertet.","norm":"Kennzahlenanalyse (Bilanz und GuV)","id":"5.5-1-1"},{"typ":"mc","frage":"Die Liquidität 2. Grades einer Agentur liegt bei 85 %. Was bedeutet das?","optionen":["Die Agentur kann ihre kurzfristigen Schulden mit Geld und kurzfristigen Forderungen nicht ganz decken.","Die Agentur hat 85 % ihres Vermögens mit eigenen Mitteln finanziert und ist damit solide aufgestellt.","Die Agentur erzielt auf ihr eingesetztes Eigenkapital eine Verzinsung von 85 % im Geschäftsjahr.","Die Agentur hat 85 % ihrer langfristigen Darlehen bereits zurückgezahlt und ist bald schuldenfrei."],"richtig":[0],"erkl":"Als Richtwert gilt eine Liquidität 2. Grades von mindestens 100 %. Bei 85 % fehlen kurzfristig verfügbare Mittel; es drohen Zahlungsengpässe.","norm":"Kennzahlenanalyse (Liquidität)","id":"5.5-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Controlling-Kreislauf in der Agentur treffen zu?","aussagen":[["Am Anfang stehen Ziele und ein Plan, z. B. eine Neugeschäftsvorgabe je Sparte.",true],["Im Soll-Ist-Vergleich werden Planwerte und tatsächliche Werte gegenübergestellt.",true],["Die Ursachen der Abweichungen werden analysiert, bevor Maßnahmen beschlossen werden.",true],["Der Kreislauf endet mit der Kontrolle; neue Planungen sind nicht vorgesehen.",false],["Controlling bedeutet vor allem, Mitarbeiter auf Fehler zu überprüfen.",false]],"erkl":"Controlling ist ein Regelkreis: Planen – Durchführen – Kontrollieren (Soll-Ist) – Abweichungen analysieren – Gegensteuern – neu planen. Es dient der Steuerung, nicht der Personalkontrolle.","norm":"Controlling (Agentursteuerung)","id":"5.5-1-3"},{"typ":"mc","frage":"Was versteht man unter der Stornoquote einer Agentur?","optionen":["Anteil der Kunden, die im Jahr einen Schaden gemeldet haben, an allen Kunden","Anteil der Beitragserhöhungen, die Kunden im Jahr widersprochen haben","Anteil der vorzeitig aufgelösten Verträge an den vermittelten Verträgen","Anteil der Bestandsprovision an den gesamten Provisionserlösen des Jahres"],"richtig":[2],"erkl":"Eine hohe Stornoquote führt zu Provisionsrückforderungen (Stornohaftung) und senkt die Bestandsprovision. Sie ist eine zentrale Vertriebskennzahl.","norm":"§ 87a Abs. 3 HGB","id":"5.5-1-4"},{"typ":"mc","frage":"Die Agentur hat 2026 geplant, Provisionserlöse von 160.000 € zu erzielen; erreicht wurden 144.000 €. Welche Aussage zum Soll-Ist-Vergleich ist richtig?","optionen":["Die Abweichung beträgt +16.000 € bzw. +10 %; das Ziel wurde übertroffen.","Die Abweichung beträgt −16.000 € bzw. −11,1 % bezogen auf den Istwert.","Die Abweichung beträgt −14.400 € bzw. −9 % bezogen auf den Planwert.","Die Abweichung beträgt −16.000 € bzw. −10 % bezogen auf den Planwert."],"richtig":[3],"erkl":"Abweichung = Ist − Soll = 144.000 − 160.000 = −16.000 €; bezogen auf den Plan: −16.000 : 160.000 × 100 = −10 %.","norm":"Soll-Ist-Vergleich (Controlling)","id":"5.5-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Jonas Wagner leitet eine Proximus-Agentur in Halle (Saale). Seine Bilanz zum 31.12.2026: Anlagevermögen 70.000 €, Provisionsforderungen 15.000 €, Bank und Kasse 35.000 €; Eigenkapital 54.000 €, Darlehen (langfristig) 46.000 €, kurzfristige Verbindlichkeiten 20.000 €. Der Gewinn 2026 betrug 40.500 € bei Provisionserlösen von 162.000 €. Von 240 vermittelten Verträgen wurden 26 storniert (Vorjahr: Stornoquote 6 %).","items":[{"typ":"zahl","frage":"Berechnen Sie die Eigenkapitalrentabilität der Agentur Wagner (bezogen auf das Eigenkapital am 31.12.2026).","wert":75,"einheit":"%","tol":0.1,"erkl":"Eigenkapitalrentabilität = Gewinn : Eigenkapital × 100 = 40.500 : 54.000 × 100 = 75 %. Hinweis: Beim Einzelunternehmer enthält der Gewinn auch das Entgelt für die eigene Arbeit; deshalb fällt die Quote hoch aus.","norm":"Kennzahlenanalyse (Rentabilität)","id":"5.5-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Liquidität 2. Grades der Agentur Wagner.","wert":250,"einheit":"%","tol":0.1,"erkl":"(Bank und Kasse 35.000 + Provisionsforderungen 15.000) : kurzfristige Verbindlichkeiten 20.000 × 100 = 50.000 : 20.000 × 100 = 250 %.","norm":"Kennzahlenanalyse (Liquidität)","id":"5.5-2-2"},{"typ":"mc","frage":"Die Stornoquote ist von 6 % auf rund 10,8 % gestiegen. Welche Maßnahme leiten Sie für die Agentur am sinnvollsten ab?","optionen":["Neue Verträge nur noch mit Monatsbeitrag anbieten, damit Kunden leichter kündigen können","Gefährdete Verträge früh nachbearbeiten und die Bedarfsanalyse beim Abschluss verbessern","Das Neugeschäft deutlich ausweiten, damit die Stornos in der Statistik weniger auffallen","Die Eigenkapitalquote erhöhen, indem der Inhaber zusätzliches Privatgeld in die Agentur einlegt"],"richtig":[1],"erkl":"26 : 240 × 100 ≈ 10,8 %. Stornos kosten Provision (Rückbelastung) und Bestand. Bestandspflege und eine gründliche, bedarfsgerechte Beratung setzen an der Ursache an.","norm":"§ 87a Abs. 3 HGB, § 61 VVG","id":"5.5-2-3"}]}]},{"nr":"5.6","titel":"Geschäftsfälle der Agentur und ihre Wirkung auf GuV und Bilanz","lf":"LF 9","buch":"PV2 7.1 S. 343–398 · Lösungen S. 720–727","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Agenturinhaber Tom Brenner entnimmt der Geschäftskasse 1.500 € für einen privaten Einkauf. Wie wirkt sich das aus?","optionen":["Das Eigenkapital sinkt um 1.500 €; Aufwand und Gewinn laut GuV bleiben unverändert.","Es entsteht Aufwand von 1.500 €; Gewinn laut GuV und Eigenkapital sinken gleich stark.","Das Eigenkapital bleibt gleich; es liegt nur ein Aktivtausch zwischen Kasse und Privat vor.","Der Gewinn laut GuV sinkt um 1.500 €; das Eigenkapital bleibt wegen der Entnahme gleich."],"richtig":[0],"erkl":"Eine Privatentnahme ist kein betrieblicher Aufwand. Sie wird über das Privatkonto direkt gegen das Eigenkapital gebucht: Kasse und Eigenkapital sinken um 1.500 € (Aktiv-Passiv-Minderung). Die GuV und damit der Gewinn bleiben unberührt.","norm":"§ 4 Abs. 1 Satz 1 und 2 EStG; § 242 Abs. 2 HGB","id":"5.6-1-1"},{"typ":"wf","frage":"Herr Brenner bezahlt eine Rechnung über 300 € für die Reparatur des Agenturdruckers von seinem privaten Girokonto. Welche Aussagen treffen zu?","aussagen":[["Die Reparatur ist betrieblicher Aufwand und mindert den Gewinn laut GuV um 300 €.",true],["Die Zahlung aus privaten Mitteln ist eine Einlage und erhöht für sich genommen das Eigenkapital um 300 €.",true],["Weil vom Geschäftskonto kein Geld abfließt, entsteht in der GuV kein Aufwand.",false],["Das Eigenkapital ändert sich durch den Vorgang insgesamt nicht.",true],["Das Bankkonto der Agentur sinkt um 300 €.",false]],"erkl":"Die Reparatur ist betrieblich veranlasst und damit Aufwand (Gewinn −300 €). Weil Herr Brenner privat zahlt, liegt zugleich eine Einlage vor (Eigenkapital +300 €). Beide Wirkungen gleichen sich im Eigenkapital aus; das Geschäftskonto bleibt unberührt.","norm":"§ 4 Abs. 1 EStG (Entnahmen und Einlagen); § 242 Abs. 2 HGB","id":"5.6-1-2"},{"typ":"mc","frage":"Die Agentur lässt ihre gemieteten Büroräume für 4.000 € neu streichen und bezahlt per Bank. Wie ist der Vorgang zu beurteilen?","optionen":["Anschaffungskosten: Die Räume werden 4.000 € höher bewertet, die GuV bleibt gleich.","Privatentnahme: Das Eigenkapital sinkt um 4.000 €, die GuV bleibt aber unverändert.","Instandhaltungsaufwand: Bank, Gewinn laut GuV und Eigenkapital sinken um je 4.000 €.","Aktivtausch: Die Bank sinkt, die Räume steigen im Wert; der Gewinn ändert sich nicht."],"richtig":[2],"erkl":"Das Streichen erhält den bisherigen Zustand und schafft keinen neuen Vermögensgegenstand. Es ist Instandhaltungsaufwand: Er mindert in der GuV den Gewinn um 4.000 €; in der Bilanz sinken Bank und Eigenkapital (Aktiv-Passiv-Minderung).","norm":"§ 242 Abs. 2 HGB; § 4 Abs. 4 EStG","id":"5.6-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Geschäftsfall der Agentur die Wirkung auf die Bilanz zu.","paare":[["Die Agentur kauft einen Firmenwagen und bezahlt per Banküberweisung.","Aktivtausch"],["Die Agentur kauft Büromöbel für 9.000 € auf Ziel.","Aktiv-Passiv-Mehrung"],["Die Agentur tilgt 5.000 € ihres Bankdarlehens per Überweisung.","Aktiv-Passiv-Minderung"],["Eine Lieferantenverbindlichkeit wird in ein Darlehen umgewandelt.","Passivtausch"]],"erkl":"Beim Aktivtausch ändern sich nur Aktivposten (Fuhrpark +, Bank −). Bei der Aktiv-Passiv-Mehrung steigen Vermögen und Schulden, bei der Aktiv-Passiv-Minderung sinken Bank und Darlehen. Beim Passivtausch ändern sich nur Passivposten. Alle vier Fälle sind erfolgsneutral.","norm":"§ 242 Abs. 1 HGB; § 247 Abs. 1 HGB","id":"5.6-1-4"},{"typ":"wf","frage":"Die Agentur zahlt ein Bankdarlehen in Monatsraten aus Zins und Tilgung zurück. Welche Aussagen zu Darlehen und zur periodengerechten Erfolgsermittlung zum 31.12. treffen zu?","aussagen":[["Die Tilgung ist erfolgsneutral: Bank und Darlehensschuld sinken um denselben Betrag.",true],["Die Darlehenszinsen sind Aufwand und mindern den Gewinn laut GuV.",true],["Die gesamte Monatsrate aus Zins und Tilgung ist Aufwand der Agentur.",false],["Zinsen für Dezember, die die Bank erst im Januar abbucht, sind zum 31.12. als sonstige Verbindlichkeit zu erfassen.",true],["Zahlt ein Mitarbeiter sein zinsloses Darlehen zurück, entsteht bei der Agentur ein Ertrag.",false],["Für eine im Dezember unterlassene Instandhaltung, die im Februar nachgeholt wird, ist eine Rückstellung zu bilden.",true]],"erkl":"Die Tilgung ist eine Aktiv-Passiv-Minderung ohne Erfolgswirkung; nur die Zinsen sind Aufwand. Zinsen des alten Jahres, die erst im neuen Jahr gezahlt werden, gehören periodengerecht ins alte Jahr (sonstige Verbindlichkeit). Die Rückzahlung eines Mitarbeiterdarlehens ist ein Aktivtausch (Bank +, Forderung −). Unterlassene Instandhaltung, die in den ersten drei Monaten des Folgejahres nachgeholt wird, erfordert eine Rückstellung.","norm":"§ 252 Abs. 1 Nr. 5 HGB; § 249 Abs. 1 Satz 2 Nr. 1 HGB","id":"5.6-1-5"},{"typ":"zuo","frage":"Ordnen Sie jedem Sachverhalt zum 31.12.2026 den richtigen Bilanzposten zu.","paare":[["Die Dezembermiete für die Agenturräume wird erst am 05.01.2027 überwiesen.","Sonstige Verbindlichkeiten"],["Zinsen für Dezember auf das Festgeldkonto werden erst im Januar 2027 gutgeschrieben.","Sonstige Forderungen"],["Der Beitrag zur Vermögensschadenhaftpflicht für Januar bis Juni 2027 wird im Dezember 2026 bezahlt.","Aktiver Rechnungsabgrenzungsposten"],["Ein Untermieter überweist die Januarmiete 2027 schon im Dezember 2026.","Passiver Rechnungsabgrenzungsposten"]],"erkl":"Sonstige Forderungen und Verbindlichkeiten: Ertrag bzw. Aufwand gehört ins alte Jahr, die Zahlung kommt erst im neuen Jahr. Rechnungsabgrenzungsposten: Die Zahlung liegt im alten Jahr, Aufwand bzw. Ertrag gehört ins neue Jahr (aktiv bei Ausgabe, passiv bei Einnahme).","norm":"§ 250 Abs. 1 und 2 HGB; § 252 Abs. 1 Nr. 5 HGB","id":"5.6-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sie sind Auszubildende/r in der Agentur von Ines Kowalski in Halle (Saale). Frau Kowalski ist selbstständige Versicherungsvertreterin der Proximus Versicherung AG und als Kauffrau im Handelsregister eingetragen; sie erstellt Bilanz und GuV nach HGB. Ihre Vermittlungsumsätze sind nach § 4 Nr. 11 UStG steuerfrei; Vorsteuer kann sie daher nicht abziehen, alle Beträge sind Endbeträge. Geschäftsfälle 2026 (Auszug): (1) Privatentnahmen vom Geschäftskonto 12 × 3.500 €. (2) Rechnung über 600 € für die Wartung der Klimaanlage im Büro, bezahlt vom Privatkonto. (3) Kauf eines neuen Firmenwagens am 01.07.2026 für 39.000 €; der alte Wagen (Buchwert am Tag der Inzahlungnahme 5.500 €) wird für 7.000 € in Zahlung genommen, den Rest überweist sie. Die Abgabe des alten Wagens ist nach § 4 Nr. 28 UStG umsatzsteuerfrei. (4) Zinsloses Darlehen von 2.400 € an einen Mitarbeiter per Bank am 01.11.2026, Rückzahlung ab Januar 2027. Eigenkapital am 01.01.2026: 52.000 €; Gewinn laut GuV 2026 (alle Fälle berücksichtigt): 71.300 €; weitere Entnahmen oder Einlagen gab es nicht.","items":[{"typ":"zahl","frage":"Um welchen Betrag erhöht die Inzahlungnahme des alten Wagens (Fall 3) den Gewinn 2026?","wert":1500,"einheit":"€","tol":0.5,"erkl":"Der alte Wagen steht am Tag der Inzahlungnahme mit 5.500 € in den Büchern und wird mit 7.000 € angerechnet; weil die Abgabe nach § 4 Nr. 28 UStG steuerfrei ist, steckt darin keine Umsatzsteuer. Der Mehrbetrag ist ein Ertrag aus dem Abgang von Anlagevermögen: 7.000 € − 5.500 € = 1.500 €.","norm":"§ 242 Abs. 2 HGB; § 4 Nr. 28 UStG","id":"5.6-2-1"},{"typ":"mc","frage":"Wie wirkt sich Fall (3) im Zeitpunkt des Kaufs (vor Abschreibung) auf Bilanz und GuV aus?","optionen":["Fuhrpark +39.000 €, Bank −39.000 €; der Tausch berührt die GuV überhaupt nicht.","Fuhrpark per Saldo +33.500 €, Bank −32.000 €; Ertrag von 1.500 € in der GuV.","Fuhrpark +32.000 €, Bank −32.000 €; es liegt ein reiner Aktivtausch ohne Erfolg vor.","Fuhrpark per Saldo +33.500 €, Bank −32.000 €; Aufwand von 1.500 € in der GuV."],"richtig":[1],"erkl":"Der neue Wagen wird mit den Anschaffungskosten von 39.000 € aktiviert; mangels Vorsteuerabzug gehört die Umsatzsteuer dazu. Der alte Wagen geht mit 5.500 € ab: Fuhrpark per Saldo +33.500 €. Überwiesen werden 39.000 € − 7.000 € = 32.000 €. Die Differenz von 1.500 € (7.000 € Anrechnung, steuerfrei nach § 4 Nr. 28 UStG, − 5.500 € Buchwert) ist Ertrag; er erhöht Gewinn und Eigenkapital.","norm":"§ 255 Abs. 1 HGB; § 15 Abs. 2 Satz 1 Nr. 1 UStG; § 4 Nr. 28 UStG; § 242 Abs. 2 HGB","id":"5.6-2-2"},{"typ":"mc","frage":"Wie wirkt sich Fall (4) auf den Jahresabschluss 2026 aus?","optionen":["Personalaufwand von 2.400 €: Gewinn laut GuV und Eigenkapital sinken um diesen Betrag.","Aktiv-Passiv-Minderung: Bank und Eigenkapital sinken um 2.400 €; die GuV bleibt gleich.","Zinsaufwand in Höhe der entgangenen Zinsen; die Forderung selbst wird nicht bilanziert.","Aktivtausch: Die Forderung an den Mitarbeiter steigt, die Bank sinkt; die GuV bleibt gleich."],"richtig":[3],"erkl":"Das Darlehen ist kein Aufwand, weil der Mitarbeiter das Geld zurückzahlen muss. Es entsteht eine Forderung (Aktivtausch: Forderung +2.400 €, Bank −2.400 €). Entgangene Zinsen werden nicht als Aufwand gebucht. Gewinn und Eigenkapital bleiben unverändert.","norm":"§ 246 Abs. 1 HGB; § 247 Abs. 1 HGB","id":"5.6-2-3"},{"typ":"zahl","frage":"Wie hoch ist das Eigenkapital der Agentur am 31.12.2026?","wert":81900,"einheit":"€","tol":0.5,"erkl":"Eigenkapital 01.01. 52.000 € + Gewinn 71.300 € − Privatentnahmen 42.000 € (12 × 3.500 €) + Einlage 600 € (Fall 2) = 81.900 €. Fall 3 ist bereits im Gewinn enthalten, Fall 4 berührt das Eigenkapital nicht.","norm":"§ 4 Abs. 1 Satz 1 EStG","id":"5.6-2-4"}]}],"runde":"zusatz"},{"nr":"5.7","titel":"Erfolgsrechnung und Kosten- und Leistungsrechnung","lf":"LF 12","buch":"PV2 7.2 S. 399–415 · Lösungen S. 727–731","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Posten einer Versicherungsagentur die richtige Einordnung in der Abgrenzungsrechnung zu.","paare":[["Reparatur einer an einen Nachbarn vermieteten Garage der Agentur","Betriebsfremder Aufwand"],["Nachzahlung für die Stromabrechnung des Vorjahres","Periodenfremder Aufwand"],["Nicht versicherter Wasserschaden im Aktenarchiv","Außerordentlicher Aufwand"],["Gehälter der angestellten Mitarbeiter","Grundkosten (Zweckaufwand)"],["Kalkulatorischer Unternehmerlohn der Inhaberin","Zusatzkosten"]],"erkl":"Neutrale Aufwendungen sind betriebsfremd (nicht durch den Betriebszweck veranlasst, hier die Vermietung einer Garage), periodenfremd (betreffen ein anderes Jahr) oder außerordentlich (ungewöhnlich, nicht planbar). Sie gehen nicht in die KLR ein. Gehälter sind Aufwand und Kosten zugleich (Grundkosten). Der Unternehmerlohn ist Kosten ohne Aufwand (Zusatzkosten).","norm":"KLR, Abgrenzungsrechnung (PV2 7.2)","id":"5.7-1-1"},{"typ":"mc","frage":"Warum setzt die Inhaberin einer Agentur in der KLR einen kalkulatorischen Unternehmerlohn an, obwohl er in der GuV nicht erscheint?","optionen":["Er mindert als Betriebsausgabe den steuerlichen Gewinn und senkt so ihre Einkommensteuer.","Ihre Arbeit ist Werteverzehr; ohne Gehalt würde er sonst in den Kosten der Agentur fehlen.","Er ersetzt die Privatentnahmen, die sonst in der GuV als Personalaufwand erscheinen würden.","Das HGB schreibt ihn bei Einzelunternehmen vor; gebucht wird er erst im Folgejahr in der GuV."],"richtig":[1],"erkl":"Eine Einzelunternehmerin kann sich kein Gehalt zahlen; ihre Arbeit wird über den Gewinn vergütet. In der GuV erscheint dafür kein Aufwand. In der KLR wird ihre Arbeitsleistung als Zusatzkosten angesetzt, damit das Betriebsergebnis vollständig ist und mit Unternehmen vergleichbar wird, die eine Geschäftsführung bezahlen. Den steuerlichen Gewinn mindert er nicht.","norm":"§ 4 Abs. 1 und 4 EStG; KLR, kalkulatorische Kosten (PV2 7.2)","id":"5.7-1-2"},{"typ":"wf","frage":"Welche Aussagen zu kalkulatorischen Kosten treffen zu?","aussagen":[["Der kalkulatorische Unternehmerlohn orientiert sich am Gehalt einer angestellten Führungskraft mit vergleichbarer Aufgabe.",true],["Der kalkulatorische Unternehmerlohn mindert den steuerlichen Gewinn der Agentur.",false],["Eine kalkulatorische Miete wird angesetzt, wenn die Inhaberin eigene private Räume unentgeltlich für die Agentur nutzt.",true],["Kalkulatorische Abschreibungen können von den bilanziellen abweichen, z. B. bei Abschreibung vom Wiederbeschaffungswert.",true],["Kalkulatorische Zinsen werden nur auf das Fremdkapital berechnet.",false]],"erkl":"Kalkulatorische Kosten erfassen den betrieblichen Werteverzehr vollständig und realistisch. Zinsen werden auf das gesamte betriebsnotwendige Kapital berechnet, also auch auf das Eigenkapital. Steuerlich zählen nur tatsächliche Betriebsausgaben; kalkulatorische Zusatzkosten mindern den steuerlichen Gewinn nicht.","norm":"§ 4 Abs. 4 EStG; KLR, kalkulatorische Kosten (PV2 7.2)","id":"5.7-1-3"},{"typ":"mc","frage":"Wie hängen die Ergebnisse zusammen, wenn in der KLR keine kalkulatorischen Kosten angesetzt werden?","optionen":["Unternehmensergebnis = Betriebsergebnis + neutrales Ergebnis","Betriebsergebnis = Unternehmensergebnis + neutrales Ergebnis","Neutrales Ergebnis = Unternehmensergebnis + Betriebsergebnis","Unternehmensergebnis = Betriebsergebnis − neutrales Ergebnis"],"richtig":[0],"erkl":"Das Unternehmensergebnis der GuV (Erträge − Aufwendungen) besteht aus zwei Teilen: dem Betriebsergebnis (Leistungen − Kosten) und dem neutralen Ergebnis (neutrale Erträge − neutrale Aufwendungen). Werden kalkulatorische Kosten angesetzt, kommt das Ergebnis aus kostenrechnerischen Korrekturen hinzu.","norm":"§ 242 Abs. 2 HGB; KLR, Abgrenzungsrechnung (PV2 7.2)","id":"5.7-1-4"},{"typ":"mc","frage":"Welche Aufgabe hat die Abgrenzungsrechnung zwischen Finanzbuchhaltung und KLR?","optionen":["Sie verteilt die Gemeinkosten mit Schlüsseln auf die einzelnen Kostenstellen der Agentur.","Sie grenzt Aufwand und Ertrag zeitlich ab und bildet dafür Rechnungsabgrenzungsposten.","Sie ermittelt aus dem Gewinn laut Steuerbilanz die Einkommensteuer der Inhaberin.","Sie sondert neutrale Aufwendungen und Erträge aus und setzt kalkulatorische Kosten an."],"richtig":[3],"erkl":"Die Abgrenzungsrechnung (Ergebnistabelle) übernimmt die Werte der GuV, sondert betriebsfremde, periodenfremde und außerordentliche Posten aus und setzt kalkulatorische Kosten an: Sie ersetzt Aufwendungen durch Anderskosten und ergänzt Zusatzkosten wie den Unternehmerlohn. Übrig bleiben Kosten und Leistungen für das Betriebsergebnis. Die Verteilung auf Kostenstellen ist Aufgabe des BAB.","norm":"KLR, Abgrenzungsrechnung (PV2 7.2)","id":"5.7-1-5"},{"typ":"mc","frage":"Welcher Posten ist für eine Versicherungsagentur ein neutraler Ertrag?","optionen":["Abschlussprovision für einen vermittelten Kfz-Vertrag der Proximus","Bestandsprovision für die laufende Betreuung von Hausratverträgen","Ertrag aus dem Verkauf eines Firmenwagens über seinem Buchwert","Provision für eine vermittelte private Rentenversicherung"],"richtig":[2],"erkl":"Provisionen aus Vermittlung und Bestandsbetreuung entstehen aus dem Betriebszweck der Agentur; sie sind Leistungen. Der Ertrag aus dem Verkauf des Firmenwagens hängt zwar mit dem Betrieb zusammen, entsteht aber unregelmäßig und nicht aus der Vermittlung. In der KLR gilt er deshalb als außerordentlicher und damit neutraler Ertrag; er geht nicht in das Betriebsergebnis ein.","norm":"§ 242 Abs. 2 HGB; KLR, neutrale Erträge (PV2 7.2)","id":"5.7-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sie arbeiten in der Agentur von Marco Lindner, selbstständiger Versicherungsvertreter der Proximus Versicherung AG in Halle (Saale). Ein Gehalt zahlt er sich nicht; für seine Arbeit setzt er in der KLR einen kalkulatorischen Unternehmerlohn von 60.000 € an. GuV 2026 (Auszug) – Erträge: Provisionserlöse 286.000 €; Miete für eine an einen Nachbarn vermietete betriebliche Garage 2.400 €; Ertrag aus dem Verkauf des alten Firmenwagens über Buchwert 1.600 €. Aufwendungen: Gehälter und Sozialabgaben 128.000 €; Raummiete 18.000 €; Abschreibungen 9.000 €; sonstige Betriebskosten 31.000 €; Reparatur der vermieteten Garage 1.000 €; Nachzahlung Nebenkosten für 2025 800 €. Die kalkulatorischen Abschreibungen entsprechen den bilanziellen; weitere kalkulatorische Kosten gibt es nicht.","items":[{"typ":"zahl","frage":"Berechnen Sie das Unternehmensergebnis laut GuV 2026.","wert":102200,"einheit":"€","tol":0.5,"erkl":"Erträge: 286.000 € + 2.400 € + 1.600 € = 290.000 €. Aufwendungen: 128.000 € + 18.000 € + 9.000 € + 31.000 € + 1.000 € + 800 € = 187.800 €. Unternehmensergebnis: 290.000 € − 187.800 € = 102.200 €.","norm":"§ 242 Abs. 2 HGB","id":"5.7-2-1"},{"typ":"zahl","frage":"Berechnen Sie das neutrale Ergebnis 2026.","wert":2200,"einheit":"€","tol":0.5,"erkl":"Neutrale Erträge: Garagenmiete 2.400 € (betriebsfremd) + Ertrag aus dem Firmenwagen 1.600 € (außerordentlich) = 4.000 €. Neutrale Aufwendungen: Reparatur der vermieteten Garage 1.000 € (betriebsfremd) + Nachzahlung für 2025 800 € (periodenfremd) = 1.800 €. Neutrales Ergebnis: 4.000 € − 1.800 € = 2.200 €.","norm":"KLR, Abgrenzungsrechnung (PV2 7.2)","id":"5.7-2-2"},{"typ":"zahl","frage":"Berechnen Sie das Betriebsergebnis 2026 unter Berücksichtigung des kalkulatorischen Unternehmerlohns.","wert":40000,"einheit":"€","tol":0.5,"erkl":"Leistungen: Provisionserlöse 286.000 €. Kosten: Grundkosten 128.000 € + 18.000 € + 9.000 € + 31.000 € = 186.000 € plus kalkulatorischer Unternehmerlohn 60.000 € = 246.000 €. Betriebsergebnis: 286.000 € − 246.000 € = 40.000 €.","norm":"KLR, Betriebsergebnis (PV2 7.2)","id":"5.7-2-3"},{"typ":"mc","frage":"Herr Lindner wundert sich: Die GuV zeigt 102.200 € Gewinn, die KLR nur 40.000 € Betriebsergebnis. Welche Erklärung ist richtig?","optionen":["Die KLR zieht 60.000 € Unternehmerlohn als Kosten ab und lässt das neutrale Ergebnis von 2.200 € außer Acht.","Die KLR zieht seine Privatentnahmen als Kosten ab, die GuV dagegen nicht; deshalb ist ihr Ergebnis niedriger.","Das Betriebsergebnis ist der Gewinn nach Einkommensteuer; die Differenz ist seine Steuerschuld.","Die KLR rechnet mit Einnahmen und Ausgaben, die GuV dagegen mit Erträgen und Aufwendungen."],"richtig":[0],"erkl":"102.200 € − 60.000 € (Zusatzkosten Unternehmerlohn) − 2.200 € (neutrales Ergebnis) = 40.000 €. Das Betriebsergebnis zeigt, was die Agentur aus ihrer eigentlichen Tätigkeit erwirtschaftet, nachdem auch die Arbeit des Inhabers bezahlt ist. Beide Rechnungen arbeiten mit periodengerechten Größen, nicht mit Zahlungen.","norm":"§ 242 Abs. 2 HGB; KLR, Abgrenzungsrechnung (PV2 7.2)","id":"5.7-2-4"}]}],"runde":"zusatz"},{"nr":"5.8","titel":"Kennzahlen von Agentur und Versicherer","lf":"LF 12","buch":"PV2 7.3–7.4 S. 416–432 · Lösungen S. 731–732; 7.6 S. 435–441 · Lösungen S. 732–733","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Kennzahl die passende Berechnung zu (Schaden- und Unfallversicherung, Bezugsgröße verdiente Bruttobeiträge).","paare":[["Schadenquote","Schadenaufwand ÷ verdiente Beiträge × 100"],["Verwaltungskostenquote","Verwaltungsaufwendungen ÷ verdiente Beiträge × 100"],["Kostenquote","Aufwendungen für den Versicherungsbetrieb ÷ verdiente Beiträge × 100"],["Combined Ratio","Schadenquote + Kostenquote"],["Zuwachsrate","(Bestand Ende − Bestand Anfang) ÷ Bestand Anfang × 100"]],"erkl":"Schaden- und Kostenquoten setzen Aufwand ins Verhältnis zu den verdienten Beiträgen. Die Aufwendungen für den Versicherungsbetrieb bestehen aus Abschluss- und Verwaltungsaufwendungen. Die Combined Ratio fasst Schaden- und Kostenquote zusammen. Die Zuwachsrate misst die Veränderung eines Bestands gegenüber dem Anfangsbestand. In der Lebens- und Krankenversicherung gelten teils andere Bezugsgrößen; maßgeblich ist immer die Definition in der Aufgabe.","norm":"Betriebsübliche Kennzahlen (PV2 7.4); § 43 RechVersV (Aufwendungen für den Versicherungsbetrieb)","id":"5.8-1-1"},{"typ":"mc","frage":"Die Combined Ratio der Kfz-Sparte der Proximus beträgt 104 %. Was bedeutet das?","optionen":["Die Sparte erzielt einen versicherungstechnischen Gewinn von 4 % der verdienten Beiträge.","Die Schadenquote allein beträgt 104 %; die Kosten sind in der Kennzahl noch nicht enthalten.","Schäden und Kosten übersteigen die verdienten Beiträge; versicherungstechnisch entsteht Verlust.","Der Vertragsbestand der Sparte ist im Geschäftsjahr gegenüber dem Vorjahr um 4 % gewachsen."],"richtig":[2],"erkl":"Eine Combined Ratio über 100 % heißt: Auf 100 € verdiente Beiträge kommen 104 € Schäden und Kosten. Versicherungstechnisch entsteht ein Verlust von 4 % der Beiträge. Ausgleichen muss ihn der Versicherer aus anderen Quellen, vor allem aus Erträgen aus Kapitalanlagen.","norm":"Betriebsübliche Kennzahlen (PV2 7.4)","id":"5.8-1-2"},{"typ":"wf","frage":"Die Schadenquote in der Kfz-Versicherung der Proximus ist gestiegen. Welche Aussagen zu möglichen Ursachen treffen zu?","aussagen":[["Höhere Ersatzteilpreise und Werkstattlöhne erhöhen den Aufwand je Schaden.",true],["Mehr Unwetterschäden durch Hagel und Sturm belasten vor allem die Kaskoversicherung.",true],["Eine Beitragserhöhung bei gleichem Schadenaufwand lässt die Schadenquote steigen.",false],["Zu großzügige Annahmerichtlinien führen zu mehr schlechten Risiken im Bestand.",true],["Sinkende Verwaltungskosten erhöhen automatisch die Schadenquote.",false]],"erkl":"Die Schadenquote steigt, wenn der Schadenaufwand stärker wächst als die verdienten Beiträge. Ursachen sind teurere Reparaturen, mehr Elementarschäden und schlechtere Risiken. Höhere Beiträge senken die Quote. Verwaltungskosten fließen nur in die Kostenquote ein.","norm":"Betriebsübliche Kennzahlen (PV2 7.4); Controlling (PV2 7.6)","id":"5.8-1-3"},{"typ":"mc","frage":"Welche Maßnahme senkt die Schadenquote der Kfz-Sparte, indem sie den Schadenaufwand verringert?","optionen":["Höhere Bestandsprovisionen für Agenturen, damit mehr Verträge im Bestand bleiben.","Lenkung der Kaskoschäden in Partnerwerkstätten mit vereinbarten Stundensätzen.","Digitalisierung der Vertragsverwaltung, um die Verwaltungsaufwendungen zu senken.","Beitragsrabatte für alle Neukunden, um das Neugeschäft der Sparte auszuweiten."],"richtig":[1],"erkl":"Schadensteuerung in Partnerwerkstätten senkt die Reparaturkosten und damit direkt den Schadenaufwand. Provisionen und Verwaltung betreffen die Kostenquote. Rabatte senken die Beiträge und erhöhen bei gleichem Schadenaufwand eher die Schadenquote. Weitere Hebel sind Beitragsanpassungen, strengere Annahmerichtlinien und Telematik-Tarife.","norm":"Controlling (PV2 7.6); Betriebsübliche Kennzahlen (PV2 7.4)","id":"5.8-1-4"},{"typ":"mc","frage":"Eine Agentur steigert ihre Anbündelungsquote. Welche Wirkung erwartet sie davon vor allem?","optionen":["Die Zahl der Neukunden steigt, weil jeder neue Vertrag einen neuen Kunden voraussetzt.","Die Stornoquote steigt, weil Kunden mit vielen Verträgen häufiger den Anbieter wechseln.","Die Abschlussprovisionen sinken, weil Folgeverträge bei Bestandskunden provisionsfrei sind.","Kunden mit mehreren Verträgen sind enger an die Agentur gebunden; das Storno sinkt eher."],"richtig":[3],"erkl":"Die Anbündelungsquote zeigt, wie viele Kunden mehrere Verträge haben (oder wie viele Verträge auf einen Kunden kommen). Kunden mit mehreren Verträgen wechseln seltener. Das senkt die Stornoquote (stornierte Verträge im Verhältnis zum Bestand) und stabilisiert den Bestand.","norm":"Vertriebskennzahlen (PV2 7.3)","id":"5.8-1-5"},{"typ":"zahl","frage":"Die Agentur von Paul Seidel in Halle (Saale) betreute am 01.01.2026 1.250 Verträge und am 31.12.2026 1.340 Verträge. Berechnen Sie die Zuwachsrate des Bestands.","wert":7.2,"einheit":"%","tol":0.05,"erkl":"Zuwachsrate = (Endbestand − Anfangsbestand) ÷ Anfangsbestand × 100 = (1.340 − 1.250) ÷ 1.250 × 100 = 90 ÷ 1.250 × 100 = 7,2 %.","norm":"Vertriebskennzahlen (PV2 7.3)","id":"5.8-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sie bereiten in der Agentur von Sabine Ortmann in Halle (Saale) das Jahresgespräch mit dem Bezirksdirektor der Proximus Versicherung AG vor. Agenturzahlen 2026: vereinbarte Beratungstermine 260, davon wahrgenommen 221; Kunden 940, davon mit mindestens zwei Verträgen 423. Die Proximus definiert: Terminquote = wahrgenommene Termine ÷ vereinbarte Termine × 100; Anbündelungsquote = Kunden mit mindestens zwei Verträgen ÷ alle Kunden × 100. Aus dem Controlling der Proximus (Kfz-Sparte 2026, in Mio. €): verdiente Bruttobeiträge 480,0; Schadenaufwand 396,0; Abschlussaufwendungen 52,8; Verwaltungsaufwendungen 26,4. Alle Quoten des Versicherers beziehen sich auf die verdienten Bruttobeiträge.","items":[{"typ":"zahl","frage":"Berechnen Sie die Terminquote der Agentur.","wert":85.0,"einheit":"%","tol":0.05,"erkl":"Terminquote = 221 ÷ 260 × 100 = 85,0 %. 39 vereinbarte Termine fanden nicht statt; die Agentur kann z. B. mit einer Terminbestätigung am Vortag gegensteuern.","norm":"Vertriebskennzahlen (PV2 7.3); Definition im Fall","id":"5.8-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Anbündelungsquote der Agentur.","wert":45.0,"einheit":"%","tol":0.05,"erkl":"Anbündelungsquote = 423 ÷ 940 × 100 = 45,0 %. Gut die Hälfte der Kunden hat also nur einen Vertrag; hier liegt Potenzial für Cross-Selling.","norm":"Vertriebskennzahlen (PV2 7.3); Definition im Fall","id":"5.8-2-2"},{"typ":"zahl","frage":"Berechnen Sie die Schadenquote der Kfz-Sparte.","wert":82.5,"einheit":"%","tol":0.05,"erkl":"Schadenquote = Schadenaufwand ÷ verdiente Bruttobeiträge × 100 = 396,0 ÷ 480,0 × 100 = 82,5 %.","norm":"Betriebsübliche Kennzahlen (PV2 7.4)","id":"5.8-2-3"},{"typ":"zahl","frage":"Berechnen Sie die Combined Ratio der Kfz-Sparte.","wert":99.0,"einheit":"%","tol":0.05,"erkl":"Abschlusskostenquote 52,8 ÷ 480,0 × 100 = 11,0 %; Verwaltungskostenquote 26,4 ÷ 480,0 × 100 = 5,5 %; Kostenquote 16,5 %. Combined Ratio = 82,5 % + 16,5 % = 99,0 %. Vereinfacht betrachtet arbeitet die Sparte versicherungstechnisch knapp mit Gewinn.","norm":"Betriebsübliche Kennzahlen (PV2 7.4); § 43 RechVersV (Abschluss- und Verwaltungsaufwendungen)","id":"5.8-2-4"}]}],"runde":"zusatz"},{"nr":"5.9","titel":"Kosten vergleichen und entscheiden","lf":"LF 12","buch":"PV2 7.2 S. 399–415 · Lösungen S. 727–731; 7.6 S. 435–441 · Lösungen S. 732–733","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Stromtarif besteht aus einem Grundpreis von 15 € je Monat und einem Arbeitspreis von 0,32 € je kWh. Welche Aussage trifft zu?","optionen":["Der Grundpreis ist variabel, weil er jeden Monat neu für den Verbrauch berechnet wird.","Beide Preise sind fixe Kosten, weil sie im Vertrag für die ganze Laufzeit feststehen.","Der Arbeitspreis führt zu fixen Kosten, weil er je kWh immer gleich hoch bleibt.","Der Grundpreis ist fix; der Arbeitspreis führt zu Kosten, die mit dem Verbrauch steigen."],"richtig":[3],"erkl":"Fixe Kosten fallen unabhängig von der Menge an (Grundpreis 180 € im Jahr). Variable Kosten ändern sich mit der Menge: Je mehr kWh, desto höher die Kosten aus dem Arbeitspreis. Dass der Preis je kWh gleich bleibt, macht die Gesamtkosten daraus nicht fix.","norm":"KLR, Kostenverhalten (PV2 7.2)","id":"5.9-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Fixe Kosten","Bleiben gleich hoch, auch wenn sich die Menge in der Periode ändert."],["Variable Kosten","Steigen oder sinken mit der Menge."],["Kritische Menge","Menge, bei der zwei Alternativen gleich hohe Kosten verursachen."],["Kosten","Betriebsbedingter, bewerteter Verbrauch von Gütern und Leistungen einer Periode."],["Leistungen","Betriebsbedingter, bewerteter Wertzuwachs einer Periode."]],"erkl":"Kosten und Leistungen sind die Größen der KLR: nur betriebsbedingt und periodengerecht. Fixe und variable Kosten unterscheiden sich nach ihrem Verhalten bei Mengenänderungen. Die kritische Menge ist die Schwelle, ab der sich die Entscheidung umkehrt.","norm":"KLR, Grundbegriffe (PV2 7.2)","id":"5.9-1-2"},{"typ":"wf","frage":"Welche Aussagen zum Leasing eines Firmenwagens im Vergleich zum Kauf treffen zu?","aussagen":[["Gegenüber einem Kauf aus eigenen Mitteln schont Leasing die Liquidität, weil keine hohe Anschaffungszahlung anfällt.",true],["Feste Leasingraten machen die Kosten über die Laufzeit gut planbar.",true],["Wird das Fahrzeug dem Leasinggeber zugerechnet, erscheint es nicht in der Bilanz der Agentur; die Raten sind Aufwand.",true],["Über die gesamte Laufzeit ist Leasing immer günstiger als ein Kauf.",false],["Am Ende der Leasingzeit geht das Fahrzeug automatisch in das Eigentum der Agentur über.",false],["Beim Leasing trägt die Agentur in der Regel weder Wartung noch Versicherung des Fahrzeugs.",false]],"erkl":"Leasing schont Liquidität und Kreditrahmen, die Raten sind planbar und als Aufwand absetzbar. Eigentümer bleibt der Leasinggeber; bei üblichen Verträgen bilanziert er das Fahrzeug. Nachteile: oft höhere Gesamtkosten, kein Eigentum am Ende, Wartung und Vollkasko trägt meist der Leasingnehmer, Nachzahlungen bei Mehrkilometern oder Schäden.","norm":"§ 246 Abs. 1 Satz 2 HGB; §§ 535 ff. BGB entsprechend","id":"5.9-1-3"},{"typ":"mc","frage":"Zwei Tarife haben unterschiedliche Grundpreise und Arbeitspreise. Wie berechnen Sie die kritische Menge?","optionen":["Differenz der Fixkosten ÷ Differenz der variablen Kosten je Einheit","Differenz der variablen Kosten je Einheit ÷ Differenz der Fixkosten","Summe der Fixkosten ÷ Summe der variablen Kosten je Einheit beider Tarife","Fixkosten des teureren Tarifs ÷ Arbeitspreis des günstigeren Tarifs"],"richtig":[0],"erkl":"Bei der kritischen Menge x sind die Gesamtkosten gleich: Kf1 + kv1 · x = Kf2 + kv2 · x. Daraus folgt x = (Kf2 − Kf1) ÷ (kv1 − kv2). Unterhalb dieser Menge ist der Tarif mit dem niedrigeren Grundpreis günstiger, darüber der mit dem niedrigeren Arbeitspreis.","norm":"KLR, Kostenvergleich (PV2 7.2)","id":"5.9-1-4"},{"typ":"mc","frage":"Welche Aussage zur Kostenvergleichsrechnung trifft zu?","optionen":["Sie zinst alle Zahlungen auf den Entscheidungszeitpunkt ab und vergleicht die Barwerte.","Sie wählt die Alternative mit den niedrigsten Kosten je Periode; Erlöse bleiben außen vor.","Sie vergleicht die Gewinne der Alternativen und berücksichtigt unterschiedliche Erlöse.","Sie ermittelt, nach wie vielen Jahren das eingesetzte Kapital zurückgeflossen ist."],"richtig":[1],"erkl":"Die Kostenvergleichsrechnung ist ein statisches Verfahren. Sie stellt die Kosten der Alternativen (fixe und variable Kosten, ggf. Abschreibungen und Zinsen) gegenüber und setzt gleiche Erlöse voraus. Barwerte gehören zur Kapitalwertmethode, Gewinne zur Gewinnvergleichsrechnung, die Rückflussdauer zur Amortisationsrechnung.","norm":"KLR, Kostenvergleich (PV2 7.2); Controlling (PV2 7.6)","id":"5.9-1-5"},{"typ":"mc","frage":"Worin unterscheiden sich Aufwand und Kosten?","optionen":["Kosten erfassen jeden Werteverzehr der Periode, Aufwand nur den betriebsbedingten Teil davon.","Aufwand und Kosten sind inhaltlich gleich; sie unterscheiden sich nur im Zeitpunkt der Zahlung.","Aufwand erfasst jeden Werteverzehr der Periode, Kosten nur den betriebsbedingten, ordentlichen.","Kosten entstehen erst bei Abfluss von Geld; Aufwand entsteht bereits mit der Bestellung."],"richtig":[2],"erkl":"Aufwand ist der gesamte Werteverzehr laut Finanzbuchhaltung (GuV). Kosten sind nur der betriebsbedingte, periodengerechte und ordentliche Werteverzehr; neutrale Aufwendungen sind keine Kosten, kalkulatorische Zusatzkosten sind Kosten ohne Aufwand. Mit Zahlungen hat die Unterscheidung nichts zu tun.","norm":"KLR, Grundbegriffe (PV2 7.2)","id":"5.9-1-6"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Jana Behrendt führt eine Agentur der Proximus Versicherung AG in Halle (Saale); Sie unterstützen sie bei zwei Entscheidungen. Strom für das Büro: Tarif „Basis“ mit Grundpreis 12 €/Monat und Arbeitspreis 0,34 €/kWh; Tarif „Business“ mit Grundpreis 30 €/Monat und Arbeitspreis 0,28 €/kWh; erwarteter Jahresverbrauch 4.500 kWh. Firmenwagen für 36 Monate: Leasing mit Sonderzahlung 3.000 € und 36 Monatsraten zu je 420 € oder Kauf für 36.000 € über ein Bankdarlehen (Zinsen über die Laufzeit insgesamt 2.700 €) mit Verkauf nach 36 Monaten zum erwarteten Preis von 19.500 €. Versicherung, Kfz-Steuer und Wartung sind in beiden Fällen gleich hoch. Die Agentur kann keine Vorsteuer abziehen; alle Beträge sind Endbeträge.","items":[{"typ":"zahl","frage":"Wie viel Euro spart Frau Behrendt im Jahr, wenn sie bei 4.500 kWh den günstigeren Stromtarif wählt?","wert":54,"einheit":"€","tol":0.5,"erkl":"Basis: 12 × 12 € + 4.500 × 0,34 € = 144 € + 1.530 € = 1.674 €. Business: 12 × 30 € + 4.500 × 0,28 € = 360 € + 1.260 € = 1.620 €. Business ist günstiger; Ersparnis 1.674 € − 1.620 € = 54 €.","norm":"KLR, Kostenvergleich (PV2 7.2)","id":"5.9-2-1"},{"typ":"zahl","frage":"Bei welchem Jahresverbrauch (kritische Menge) sind beide Stromtarife gleich teuer?","wert":3600,"einheit":"kWh","tol":1,"erkl":"Differenz der Fixkosten: 360 € − 144 € = 216 €. Differenz der Arbeitspreise: 0,34 € − 0,28 € = 0,06 € je kWh. Kritische Menge: 216 € ÷ 0,06 €/kWh = 3.600 kWh. Darüber ist „Business“ günstiger, darunter „Basis“.","norm":"KLR, Kostenvergleich (PV2 7.2)","id":"5.9-2-2"},{"typ":"zahl","frage":"Um wie viel Euro ist das Leasing über die 36 Monate günstiger als der Kauf?","wert":1080,"einheit":"€","tol":0.5,"erkl":"Leasing: 3.000 € + 36 × 420 € = 3.000 € + 15.120 € = 18.120 €. Kauf: 36.000 € + 2.700 € Zinsen − 19.500 € Verkaufserlös = 19.200 €. Vorteil Leasing: 19.200 € − 18.120 € = 1.080 €.","norm":"KLR, Kostenvergleich (PV2 7.2); Controlling (PV2 7.6)","id":"5.9-2-3"},{"typ":"mc","frage":"Neben dem Kostenvorteil: Welchen Nachteil des Leasings sollte Frau Behrendt vor ihrer Entscheidung bedenken?","optionen":["Die Leasingraten mindern ihren Gewinn nicht, weil ihr das Fahrzeug gar nicht gehört.","Bei Mehrkilometern oder Schäden bei der Rückgabe können Nachzahlungen fällig werden.","Sie muss den Wagen nach 36 Monaten in jedem Fall zum Restwert selbst kaufen.","Die Leasinggesellschaft darf die Raten während der Laufzeit jederzeit frei erhöhen."],"richtig":[1],"erkl":"Bei der Rückgabe rechnet der Leasinggeber Mehrkilometer und Schäden über die normale Abnutzung hinaus ab; das kann den Kostenvorteil aufzehren. Die Raten sind dagegen fest vereinbart und als Aufwand gewinnmindernd. Eine Kaufpflicht besteht nur, wenn sie im Vertrag vereinbart ist. Weitere Nachteile: kein Eigentum am Ende, Bindung an die Laufzeit.","norm":"§§ 535 ff. BGB entsprechend; Leasingvertrag","id":"5.9-2-4"}]}],"runde":"zusatz"}]}]};
const K=D.key;let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){S={}}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}
const online=/^https?:$/.test(location.protocol);
function simStand(){const s=S._sim;return s&&typeof s==='object'&&s.beste&&typeof s.beste.r==='number'?s:null}
const $=s=>document.querySelector(s);const app=$('#app');
$('#brand').innerHTML=D.titel+'<small>'+D.untertitel+'</small>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const lfT=t=>esc(t).replace(/LF /g,'LF&nbsp;');
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
// Hauptrunde = Abschnitte ohne runde; Zusatzrunde = runde "zusatz" (zählt nicht zum Fortschritt der Hauptrunde)
const istZ=a=>a.runde==='zusatz',haupt=m=>m.abschnitte.filter(a=>!istZ(a)),zus=m=>m.abschnitte.filter(istZ),hItems=m=>haupt(m).flatMap(abItems),zItems=m=>zus(m).flatMap(abItems);
function pills(st){return `<div class="pills"><span class="pill"><span class="dot ${st.pR?'g':''}"></span>${st.pR} % Richtig</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % Fortschritt</span></div>`}
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p[1]?`<a data-go="${p[1]}">${esc(p[0])}</a>`:esc(p[0])).join(' › ')+'</div>'}
function home(){const all=D.module.flatMap(hItems),st=stat(all),za=D.module.flatMap(zItems),sz=stat(za);
 app.innerHTML=`<div class="box"><h1>GAP 2 Teil 1.1 · für alle</h1><p class="hint">${esc(D.intro)} Jeder Abschnitt hat eine Lektion „Grundwissen“ und eine „Prüfungssituation“. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}${za.length?`<p class="hint" data-zusatz="${sz.t}" style="margin:8px 0 0">Zusatzrunde: ${sz.t} weitere Aufgaben · ${sz.pR} % richtig · ${sz.pF} % bearbeitet</p>`:''}</div>
 <div class="box">${D.module.map((m,i)=>{const s=stat(hItems(m)),nz=zus(m).length;return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${haupt(m).length} Abschnitte · ${s.t} Seiten${nz?' · Zusatzrunde mit '+nz+' Abschnitten':''} · ${lfT(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">Je ein Fall aus jeder der fünf Prüfungsaufgaben wie in Teil 1.1, Auswertung je Aufgabe</div>${simKurz()}</div></div></div>`}
function simKurz(){const s=simStand();if(!s)return '<div class="meta" data-sim="leer">Noch keine Simulation abgeschlossen.</div>';const p=x=>Math.round(100*x.r/x.n);return `<div class="pills" data-sim="${s.beste.r}"><span class="pill"><span class="dot g"></span>Bestes Ergebnis ${s.beste.r} von ${s.beste.n} (${p(s.beste)} %)</span><span class="pill"><span class="dot b"></span>Zuletzt ${s.letzte.r} von ${s.letzte.n}</span><span class="pill">${s.anz} ${s.anz===1?'Durchgang':'Durchgänge'}</span></div>`}
function modul(i){const m=D.module[i],karte=j=>{const a=m.abschnitte[j],s=stat(abItems(a));return `<div class="card${istZ(a)?' z':''}" data-go="a${i}.${j}"><div class="ic">${a.nr}</div><div><div class="ct">${a.nr} ${esc(a.titel)}</div><div class="meta">2 Lektionen · ${s.t} Seiten · ${lfT(a.lf)}</div>${pills(s)}</div></div>`},
 H=m.abschnitte.map((a,j)=>j).filter(j=>!istZ(m.abschnitte[j])),Z=m.abschnitte.map((a,j)=>j).filter(j=>istZ(m.abschnitte[j]));
 app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel]])+`<div class="box"><h1>${m.nr}. ${esc(m.titel)}</h1>${H.map(karte).join('')}</div>`
 +(Z.length?`<div class="box" data-zusatzrunde><h2>Zusatzrunde</h2><p class="hint">Weitere Abschnitte zu dieser Prüfungsaufgabe mit neuen Fällen. Nutzen Sie sie, wenn Sie die Abschnitte oben sicher lösen oder mehr üben möchten. Sie zählen nicht zum Fortschritt auf der Startseite, die Prüfungssimulation zieht ihre Fälle aber mit.</p>${Z.map(karte).join('')}</div>`:'')}
function abschnitt(i,j){const m=D.module[i],a=m.abschnitte[j];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel]])+`<div class="box">${istZ(a)?'<div class="meta">Zusatzrunde</div>':''}<h1>${a.nr} ${esc(a.titel)}</h1>${a.lektionen.map((l,k)=>{const s=stat(l.items);return `<div class="card" data-go="l${i}.${j}.${k}"><div class="ic">${k+1}</div><div><div class="ct">Lektion ${k+1}: ${esc(l.titel)}</div><div class="meta">${s.t} Seiten</div>${pills(s)}</div></div>`}).join('')}</div>`}
let P=null; // Spieler
function start(list,ctx){P={list,ctx,pos:0,ans:{},done:{}};show()}
function render(q,seed){let h=`<div class="q">${esc(q.frage)}</div>`;
 if(q.typ==='mc'||q.typ==='mehr'){const ord=shuf(q.optionen.map((_,i)=>i),q.id+seed);if(q.typ==='mehr')h+='<div class="hint">Mehrere Antworten können richtig sein.</div>';
  h+=ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='mc'?'radio':'checkbox'}" name="o" value="${i}"><span>${esc(q.optionen[i])}</span></label>`).join('')}
 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')return[...r.querySelectorAll('input:checked')].map(x=>+x.value);
 if(q.typ==='wf')return[...r.querySelectorAll('.wf')].map(w=>{const b=w.querySelector('button.on');return b?+b.dataset.v:null});
 if(q.typ==='zuo')return[...r.querySelectorAll('.zu select')].map(s=>s.value);
 if(q.typ==='zahl'){const v=r.querySelector('input').value.trim().replace(/\./g,'').replace(',','.');return v===''?null:+v}}
function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');
 if(q.typ==='zuo')return q.paare.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>');if(q.typ==='wf')return q.aussagen.map(x=>(x[1]?'✔ richtig: ':'✘ falsch: ')+esc(x[0])).join('<br>');
 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}
function mark(q,a){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(q.richtig.includes(i))o.classList.add('ok');else if(a.includes(i))o.classList.add('bad')});
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>w.classList.add((q.aussagen[i][1]?1:0)===a[i]?'ok':'bad'));
 if(q.typ==='zuo')r.querySelectorAll('.zu').forEach((z,i)=>z.classList.add(q.paare[i][1]===a[i]?'ok':'bad'));
 r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function show(){const q=P.list[P.pos],c=P.ctx,n=P.list.length,sit=c.sit?(c.sit[q.id]||''):'';
 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div></div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Prüfungsaufgabe</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);
 start(l.items,{titel:(istZ(a)?'Zusatzrunde · ':'')+`${a.nr} · Lektion ${k+1}: ${l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],['Lektion '+(k+1)]],back:'a'+i+'.'+j,seed:'s',sit,full:l.items})}
function sim(){const seed=String(Date.now()),sit={},list=[];D.module.forEach((m,i)=>{const L=[];m.abschnitte.forEach(a=>a.lektionen.forEach(l=>{if(l.situation)L.push(l)}));const l=shuf(L,seed+i)[0];l.items.forEach(q=>{list.push(q);sit[q.id]=l.situation})});
 start(list,{titel:'Prüfungssimulation Teil 1.1 · fünf Aufgaben',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed,sit,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}

// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
