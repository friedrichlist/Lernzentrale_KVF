bhängig machen."],"richtig":[0],"erkl":"Art. 9 Abs. 3 GG schützt das Recht, Koalitionen zu bilden und ihnen beizutreten, aber auch, ihnen fernzubleiben. Daraus folgt die Tarifautonomie: Gewerkschaften und Arbeitgeberseite regeln Arbeitsbedingungen ohne staatliche Einmischung; Abreden, die die Koalitionsfreiheit behindern, sind nichtig.","norm":"Art. 9 Abs. 3 GG","id":"1.5-1-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Art des Tarifvertrags ihren typischen Inhalt zu.","paare":[["Manteltarifvertrag","Arbeitszeit, Urlaub, Kündigungsfristen; meist mehrjährige Laufzeit"],["Entgelttarifvertrag (Gehaltstarifvertrag)","Höhe der Gehälter und Ausbildungsvergütungen; kurze Laufzeit"],["Entgeltrahmentarifvertrag","Tarifgruppen und die Merkmale der Tätigkeiten in jeder Gruppe"],["Firmentarifvertrag (Haustarif)","Abschluss zwischen Gewerkschaft und einem einzelnen Arbeitgeber"]],"erkl":"Der Manteltarifvertrag regelt allgemeine Arbeitsbedingungen und läuft lange, der Entgelttarifvertrag nur die Beträge und wird häufig neu verhandelt. Der Rahmentarifvertrag ordnet Tätigkeiten Gruppen zu; Tarifpartei kann auch ein einzelner Arbeitgeber sein (§ 2 Abs. 1 TVG).","norm":"§§ 1, 2 TVG","id":"1.5-1-2"},{"typ":"mc","frage":"Eine Sachbearbeiterin ist kein Gewerkschaftsmitglied; ihr Arbeitgeber ist Mitglied im Arbeitgeberverband. Auf welchem Weg wird der Tarifvertrag in der Praxis meist dennoch auf ihr Arbeitsverhältnis angewendet?","optionen":["Durch eine Klausel in ihrem Arbeitsvertrag, die auf den Tarifvertrag verweist.","Automatisch, da die Tarifbindung des Arbeitgebers allein für alle Beschäftigten genügt.","Durch ihren eigenen Beitritt zum Arbeitgeberverband, den sie selbst beantragen kann.","Durch einen Beschluss des Betriebsrats, der für alle Nichtmitglieder verbindlich ist."],"richtig":[0],"erkl":"Tarifgebunden sind nur die Mitglieder beider Tarifparteien (§ 3 Abs. 1 TVG). Damit Nichtmitglieder gleich behandelt werden, verweisen Arbeitsverträge meist ausdrücklich auf den Tarifvertrag (Bezugnahmeklausel); daneben gibt es die Allgemeinverbindlicherklärung (§ 5 TVG).","norm":"§ 3 Abs. 1 TVG","id":"1.5-1-3"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zur Wirkung von Tarifverträgen.","aussagen":[["Ein Arbeitsvertrag darf zugunsten des Arbeitnehmers vom Tarifvertrag abweichen, z. B. mehr Urlaubstage gewähren.",true],["Nach Ablauf eines Tarifvertrags gelten seine Regeln weiter, bis eine andere Abmachung sie ersetzt.",true],["Während der Laufzeit eines Tarifvertrags darf über die darin geregelten Punkte jederzeit gestreikt werden.",false],["Die Allgemeinverbindlicherklärung eines Tarifvertrags spricht der Betriebsrat für seinen Betrieb aus.",false]],"erkl":"Abweichungen sind nur zugunsten des Arbeitnehmers oder bei einer Öffnungsklausel erlaubt (Günstigkeitsprinzip, § 4 Abs. 3), abgelaufene Tarifverträge wirken nach (§ 4 Abs. 5). Während der Laufzeit herrscht Friedenspflicht; allgemeinverbindlich erklärt das Bundesministerium für Arbeit und Soziales (§ 5).","norm":"§§ 4, 5 TVG","id":"1.5-1-4"},{"typ":"mc","frage":"Welche Aussage zu den Folgen eines rechtmäßigen Streiks für die Streikenden trifft zu?","optionen":["Das Arbeitsverhältnis ruht; Gewerkschaftsmitglieder bekommen Streikgeld.","Der Arbeitgeber zahlt das Gehalt weiter, darf aber die Urlaubstage entsprechend kürzen.","Das Arbeitsverhältnis endet und muss nach dem Streik durch neuen Vertrag begründet werden.","Alle Streikenden erhalten für die Streiktage Streikgeld von der Agentur für Arbeit."],"richtig":[0],"erkl":"Während des Streiks ruhen die Hauptpflichten: Es wird nicht gearbeitet und kein Gehalt gezahlt, das Arbeitsverhältnis besteht aber fort. Streikgeld zahlt nur die Gewerkschaft an ihre Mitglieder, nicht der Staat.","norm":"Art. 9 Abs. 3 GG (Arbeitskampfrecht)","id":"1.5-1-5"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff des Arbeitskampfs die passende Beschreibung zu.","paare":[["Warnstreik","Kurze Arbeitsniederlegung während laufender Verhandlungen nach Ende der Friedenspflicht"],["Schwerpunktstreik","Nur ausgewählte, für die Arbeitgeber wichtige Betriebe oder Abteilungen werden bestreikt"],["Generalstreik","Alle Branchen eines Landes legen die Arbeit nieder; in Deutschland unzulässig"],["Aussperrung","Arbeitgeber schließen Arbeitnehmer von Arbeit und Bezahlung aus"]],"erkl":"Warn- und Schwerpunktstreik sind Kampfmittel der Gewerkschaft in einer Tarifauseinandersetzung. Ein Generalstreik verfolgt politische Ziele und ist deshalb unzulässig; die Aussperrung ist das Abwehrmittel der Arbeitgeber.","norm":"Art. 9 Abs. 3 GG (Arbeitskampfrecht)","id":"1.5-1-6"},{"typ":"mc","frage":"Wozu dient die Urabstimmung vor einem unbefristeten Streik?","optionen":["Die Gewerkschaftsmitglieder entscheiden, ob gestreikt wird; meist sind 75 % Zustimmung nötig.","Alle Beschäftigten der Branche wählen die Mitglieder der Tarifkommission für die Verhandlungen.","Ein staatlicher Schlichter entscheidet für beide Seiten verbindlich, ob gestreikt werden darf.","Die Mitglieder des Arbeitgeberverbands stimmen darüber ab, ob sie dem Streik zustimmen."],"richtig":[0],"erkl":"Nach dem Scheitern von Verhandlungen und Schlichtung befragt die Gewerkschaft ihre Mitglieder. Nach den Satzungen ist in der Regel eine Mehrheit von mindestens 75 % für einen Streik erforderlich.","norm":"Arbeitskampfrecht (Satzung der Gewerkschaft)","id":"1.5-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Der Entgelttarifvertrag der Versicherungswirtschaft, der auch für die PROXIMUS Versicherung AG in Halle (Saale) gilt, ist zum 31. März ausgelaufen. Die Gewerkschaft fordert 7 % mehr Gehalt, der Arbeitgeberverband bietet 2,5 %. Die Sachbearbeiterin Hannah Weber ist Gewerkschaftsmitglied, ihr Kollege Felix Braun nicht.","items":[{"typ":"zuo","frage":"Ordnen Sie den Schritten der Tarifauseinandersetzung ihre Reihenfolge zu.","paare":[["Verhandlungen zwischen Gewerkschaft und Arbeitgeberverband","Schritt 1"],["Scheitern der Verhandlungen und erfolglose Schlichtung","Schritt 2"],["Urabstimmung der Gewerkschaftsmitglieder über einen Streik","Schritt 3"],["Streik und neue Verhandlungen bis zur Einigung","Schritt 4"],["Zweite Urabstimmung über das Verhandlungsergebnis","Schritt 5"]],"erkl":"Erst nach gescheiterten Verhandlungen und Schlichtung stimmen die Mitglieder über einen Streik ab. Der Streik erhöht den Druck für neue Verhandlungen; das Ergebnis wird in einer zweiten Urabstimmung angenommen und als neuer Tarifvertrag geschlossen.","norm":"Arbeitskampfrecht; § 1 TVG","id":"1.5-2-1"},{"typ":"mc","frage":"Noch vor der Urabstimmung legen Beschäftigte der PROXIMUS für zwei Stunden die Arbeit nieder. Unter welcher Voraussetzung ist dieser Warnstreik zulässig?","optionen":["Die Friedenspflicht ist abgelaufen und die Gewerkschaft ruft zum Warnstreik auf.","Die Beschäftigten haben ihn ohne Gewerkschaft spontan untereinander verabredet.","Der Betriebsrat hat den Warnstreik beschlossen und ihn im Betrieb ausgehängt.","Der Arbeitgeberverband hat dem Warnstreik vorher ausdrücklich zugestimmt."],"richtig":[0],"erkl":"Streiken darf nur eine Gewerkschaft, und erst nach Ende der Friedenspflicht, hier also nach Ablauf des Tarifvertrags am 31. März. Spontane („wilde“) Streiks sind unzulässig, und der Betriebsrat darf keine Arbeitskämpfe führen (§ 74 Abs. 2 BetrVG).","norm":"Art. 9 Abs. 3 GG; § 74 Abs. 2 BetrVG","id":"1.5-2-2"},{"typ":"wf","frage":"Nach der Urabstimmung wird bei PROXIMUS gestreikt; Hannah Weber beteiligt sich am Streik. Prüfen Sie die Aussagen.","aussagen":[["Hannah Weber erhält für die Streiktage Streikgeld von ihrer Gewerkschaft.",true],["Felix Braun darf sich am Streik beteiligen, obwohl er kein Gewerkschaftsmitglied ist.",true],["Beteiligt sich Felix Braun am Streik, zahlt PROXIMUS ihm für die Streiktage das Gehalt weiter.",false],["PROXIMUS darf Hannah Weber wegen ihrer Teilnahme am rechtmäßigen Streik abmahnen.",false]],"erkl":"Am rechtmäßigen Streik dürfen auch Nichtmitglieder teilnehmen; für alle Streikenden entfällt das Gehalt, Streikgeld bekommen nur Gewerkschaftsmitglieder. Die Teilnahme an einem rechtmäßigen Streik ist keine Pflichtverletzung.","norm":"Art. 9 Abs. 3 GG (Arbeitskampfrecht)","id":"1.5-2-3"},{"typ":"mc","frage":"Nach dem Streik einigen sich beide Seiten auf 4,5 % mehr Gehalt. Welche Aussage zum weiteren Verlauf trifft zu?","optionen":["In der zweiten Urabstimmung genügt meist die Zustimmung von 25 % der Mitglieder.","Der neue Tarifvertrag gilt erst, wenn der Bundestag ihn als Gesetz beschlossen hat.","Die Einigung gilt nur, wenn alle Beschäftigten ihr einzeln schriftlich zustimmen.","Für die Annahme der Einigung sind zwingend 75 % Zustimmung der Mitglieder nötig."],"richtig":[0],"erkl":"Für die Annahme eines Ergebnisses verlangen die Gewerkschaftssatzungen in der Regel nur 25 % Zustimmung, damit ein Streik leichter beendet werden kann. Der Tarifvertrag entsteht durch Vertrag der Tarifparteien, nicht durch Gesetz.","norm":"Arbeitskampfrecht (Satzung der Gewerkschaft); § 1 TVG","id":"1.5-2-4"}]}]},{"nr":"1.6","titel":"Sozialversicherung und gesetzliche Unfallversicherung","lf":"LF 1 / Sozialkunde","buch":"SGB IV, V, VI, VII, XI; EFZG","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Zweig der Sozialversicherung seinen Träger zu.","paare":[["Krankenversicherung","Krankenkassen"],["Pflegeversicherung","Pflegekassen bei den Krankenkassen"],["Rentenversicherung","Deutsche Rentenversicherung"],["Arbeitslosenversicherung","Bundesagentur für Arbeit"],["Unfallversicherung","Berufsgenossenschaften und Unfallkassen"]],"erkl":"Jeder Zweig hat eigene, selbstverwaltete Träger. Für Versicherungsunternehmen ist in der Unfallversicherung die VBG als Berufsgenossenschaft zuständig.","norm":"§ 4 SGB V; § 46 SGB XI; § 125 SGB VI; § 368 SGB III; § 114 SGB VII","id":"1.6-1-1"},{"typ":"mc","frage":"Was kennzeichnet das Umlageverfahren (Generationenvertrag) der gesetzlichen Rentenversicherung?","optionen":["Die Beiträge der heute Erwerbstätigen finanzieren die laufenden Renten.","Jeder Versicherte spart seine Beiträge auf einem eigenen Konto für das Alter an.","Die Renten werden vollständig aus den Steuereinnahmen des Bundes finanziert.","Die Beiträge richten sich nach Alter und Gesundheitszustand der Versicherten."],"richtig":[0],"erkl":"Die Ausgaben eines Jahres werden aus den Einnahmen desselben Jahres gedeckt: Die heutigen Beitragszahler finanzieren die heutigen Renten. Das unterscheidet die gesetzliche Rente vom Kapitaldeckungsverfahren privater Vorsorge.","norm":"§ 153 Abs. 1 SGB VI","id":"1.6-1-2"},{"typ":"mc","frage":"Welche Aussage zur Verteilung der Beiträge zwischen Arbeitnehmer und Arbeitgeber trifft zu?","optionen":["Den Zusatzbeitrag der Krankenkasse tragen beide je zur Hälfte.","Den Kinderlosenzuschlag zur Pflegeversicherung tragen beide je zur Hälfte.","Den Beitrag zur Unfallversicherung tragen beide je zur Hälfte.","Den Beitrag zur Rentenversicherung trägt der Arbeitnehmer allein."],"richtig":[0],"erkl":"KV einschließlich Zusatzbeitrag, PV, RV und AV werden je zur Hälfte getragen. Ausnahmen: Den Kinderlosenzuschlag von 0,6 % zahlt der Arbeitnehmer allein, die Unfallversicherung finanziert der Arbeitgeber allein.","norm":"§ 249 Abs. 1 SGB V; § 58 Abs. 1 SGB XI; § 150 SGB VII","id":"1.6-1-3"},{"typ":"mc","frage":"Eine neue Sachbearbeiterin beginnt am 1. September. Welche Aussage zu Meldung und Beitragszahlung trifft zu?","optionen":["Der Arbeitgeber meldet sie bei der Krankenkasse an und zahlt die Beiträge an diese.","Die Sachbearbeiterin meldet sich selbst bei der Rentenversicherung an und zahlt dort.","Der Arbeitgeber meldet sie beim Finanzamt an, das die Beiträge mit der Lohnsteuer erhebt.","Die Agentur für Arbeit meldet sie an und zieht die Beiträge vom Gehaltskonto selbst ein."],"richtig":[0],"erkl":"Der Arbeitgeber meldet Beschäftigte mit der ersten Entgeltabrechnung, spätestens sechs Wochen nach Beginn, bei der Krankenkasse an. Diese ist Einzugsstelle für den Gesamtsozialversicherungsbeitrag (KV, PV, RV, AV) und verteilt ihn weiter.","norm":"§§ 28a, 28h SGB IV; § 6 DEÜV","id":"1.6-1-4"},{"typ":"mc","frage":"Welche Leistung erbringt die Arbeitslosenversicherung?","optionen":["Kurzarbeitergeld bei vorübergehendem Arbeitsausfall","Krankengeld nach dem Ende der sechswöchigen Entgeltfortzahlung","Erwerbsminderungsrente bei dauerhafter Krankheit","Verletztenrente nach einem schweren Arbeitsunfall"],"richtig":[0],"erkl":"Die Bundesagentur für Arbeit zahlt Arbeitslosengeld und Kurzarbeitergeld. Krankengeld zahlt die Krankenkasse, Erwerbsminderungsrente die Rentenversicherung und Verletztenrente die Berufsgenossenschaft.","norm":"§ 95 SGB III","id":"1.6-1-5"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zur gesetzlichen Unfallversicherung.","aussagen":[["Auszubildende sind auf dem direkten Weg zur Berufsschule gesetzlich unfallversichert.",true],["Wer auf dem Heimweg privat einkaufen geht, ist während des Einkaufs gesetzlich unfallversichert.",false],["Verletzt ein Kollege einen anderen bei der Arbeit fahrlässig, haftet er für den Personenschaden in der Regel nicht privat.",true],["Die Berufsgenossenschaft bemisst den Beitrag nach dem Gesundheitszustand der Beschäftigten.",false]],"erkl":"Versichert sind Arbeitsunfälle, Wegeunfälle auf dem unmittelbaren Weg (auch zur Berufsschule) und Berufskrankheiten; private Unterbrechungen wie Einkaufen sind nicht versichert. Die BG löst die Haftung von Kollegen und Arbeitgeber ab (§§ 104, 105 SGB VII); den Beitrag zahlt der Arbeitgeber nach Entgeltsumme und Gefahrklasse (§ 153 SGB VII).","norm":"§§ 2, 8, 9, 104, 105, 153 SGB VII","id":"1.6-1-6"},{"typ":"zahl","frage":"Angenommen, ein Auszubildender erhält eine monatliche Ausbildungsvergütung von 310 €. Wie hoch ist sein Arbeitnehmeranteil zur Sozialversicherung?","wert":0,"einheit":"€","tol":0.01,"erkl":"Bei Auszubildenden mit einer Vergütung bis 325 € im Monat (Geringverdienergrenze) trägt der Arbeitgeber den Gesamtsozialversicherungsbeitrag allein. 310 € liegt darunter, der Arbeitnehmeranteil beträgt daher 0 €.","norm":"§ 20 Abs. 3 S. 1 Nr. 1 SGB IV","id":"1.6-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lukas Neumann (31 Jahre, Vater einer vierjährigen Tochter, die mit ihm in einem Haushalt lebt) ist Sachbearbeiter bei der PROXIMUS Versicherung AG in Halle (Saale) und verdient 3.400 € brutto im Monat; seine Krankenkasse erhebt einen Zusatzbeitrag von 2,9 %. An einem Dienstag bringt er seine Tochter vor der Arbeit in die Kita, die nicht auf seinem direkten Arbeitsweg liegt. Danach stürzt er auf dem Weg ins Büro mit dem Fahrrad und ist vom Unfalltag an zehn Kalendertage arbeitsunfähig.","items":[{"typ":"zahl","frage":"Berechnen Sie den Arbeitnehmeranteil von Lukas Neumann zur Krankenversicherung einschließlich Zusatzbeitrag (allgemeiner Beitragssatz 14,6 %).","wert":297.5,"einheit":"€","tol":0.01,"erkl":"Allgemeiner Beitragssatz und Zusatzbeitrag werden je zur Hälfte getragen: (14,6 % + 2,9 %) : 2 = 8,75 %. 3.400 € × 8,75 % = 297,50 €.","norm":"§§ 241, 242, 249 Abs. 1 SGB V","id":"1.6-2-1"},{"typ":"zahl","frage":"Berechnen Sie den Arbeitnehmeranteil von Lukas Neumann zur Renten- und Arbeitslosenversicherung zusammen (RV 18,6 %, AV 2,6 %).","wert":360.4,"einheit":"€","tol":0.01,"erkl":"Arbeitnehmeranteil RV 9,3 % und AV 1,3 %, zusammen 10,6 %. 3.400 € × 10,6 % = 360,40 € (RV 316,20 € + AV 44,20 €).","norm":"§ 168 Abs. 1 Nr. 1 SGB VI; § 346 Abs. 1 SGB III","id":"1.6-2-2"},{"typ":"mc","frage":"Ist der Sturz von Lukas Neumann gesetzlich unfallversichert?","optionen":["Ja, der Umweg zur Kita ist mitversichert; zuständig ist die Berufsgenossenschaft VBG.","Nein, durch den Umweg zur Kita hat er den Versicherungsschutz auf dem Arbeitsweg verloren.","Ja, zuständig ist aber seine Krankenkasse, da sie auch die Unfallversicherung trägt.","Nein, Wegeunfälle sind nur auf Fahrten mit öffentlichen Verkehrsmitteln versichert."],"richtig":[0],"erkl":"Versichert ist auch ein Umweg, um ein Kind wegen der Berufstätigkeit in fremde Obhut zu bringen (§ 8 Abs. 2 Nr. 2a SGB VII); das Verkehrsmittel spielt keine Rolle. Träger ist die Berufsgenossenschaft, für Versicherungsunternehmen die VBG.","norm":"§ 8 Abs. 2 Nr. 2a SGB VII","id":"1.6-2-3"},{"typ":"mc","frage":"Was muss die PROXIMUS Versicherung AG nach dem Unfall veranlassen?","optionen":["Eine Unfallanzeige an die VBG, da er mehr als drei Tage arbeitsunfähig ist.","Nichts, weil Unfälle auf dem Arbeitsweg grundsätzlich nicht angezeigt werden müssen.","Eine Unfallanzeige erst, wenn er länger als sechs Wochen arbeitsunfähig ist.","Eine Meldung nur an seine Krankenkasse, die über die Leistungen entscheidet."],"richtig":[0],"erkl":"Der Arbeitgeber muss einen Unfall anzeigen, wenn der Versicherte mehr als drei Tage arbeitsunfähig wird; das gilt auch für Wegeunfälle. Mit zehn Tagen Arbeitsunfähigkeit ist die Anzeige an die VBG daher Pflicht.","norm":"§ 193 Abs. 1 SGB VII","id":"1.6-2-4"}]}]}]},{"nr":"2","titel":"Sicherheit, Umwelt, Digitalisierung und Organisation","lf":"ca. 22 % der WISO","abschnitte":[{"nr":"2.1","titel":"Sicherheit und Gesundheit bei der Arbeit","lf":"LF 1 / Sozialkunde","buch":"ArbSchG §§ 3, 5, 15–17; ASiG; SGB VII § 22; ArbStättV; ArbMedVV","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wozu verpflichtet § 5 ArbSchG den Arbeitgeber?","optionen":["jeden Arbeitsplatz jährlich von der Berufsgenossenschaft abnehmen zu lassen","Gefährdungen am Arbeitsplatz zu beurteilen und daraus Schutzmaßnahmen abzuleiten","für alle Beschäftigten vor Arbeitsbeginn eine ärztliche Eignungsprüfung anzuordnen","jede neue Arbeitsstätte vor der Nutzung von der Behörde genehmigen zu lassen"],"richtig":[1],"erkl":"Die Gefährdungsbeurteilung ist das Kernstück des Arbeitsschutzes: Der Arbeitgeber ermittelt selbst, welche Gefährdungen bestehen, und legt die erforderlichen Maßnahmen fest. Eine behördliche Abnahme oder Genehmigung jedes Arbeitsplatzes sieht das Gesetz nicht vor.","norm":"§ 5 ArbSchG","id":"2.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie die Maßnahmen der richtigen Stufe des STOP-Prinzips zu.","paare":[["Lösemittelfreien Kleber statt lösemittelhaltigem verwenden","S – Substitution"],["Lose Kabel im Großraumbüro in einem Kabelkanal verlegen","T – technische Maßnahme"],["Bildschirmarbeit regelmäßig durch andere Tätigkeiten unterbrechen","O – organisatorische Maßnahme"],["Beim Aktenumzug Sicherheitsschuhe tragen","P – persönliche Schutzmaßnahme"]],"erkl":"Das STOP-Prinzip legt eine Rangfolge fest: Zuerst wird die Gefahrenquelle ersetzt, dann technisch und organisatorisch geschützt. Persönliche Schutzmaßnahmen kommen zuletzt, weil sie die Gefahr nicht beseitigen und nur wirken, wenn jeder Einzelne sie richtig anwendet.","norm":"§ 4 Nr. 5 ArbSchG (STOP-Prinzip)","id":"2.1-1-2"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zu Pflichten und Rechten der Beschäftigten nach dem Arbeitsschutzgesetz.","aussagen":[["Beschäftigte müssen die zur Verfügung gestellte Schutzausrüstung bestimmungsgemäß verwenden.",true],["Eine festgestellte erhebliche Gefahr müssen sie dem Arbeitgeber oder Vorgesetzten unverzüglich melden.",true],["Die Kosten vorgeschriebener Schutzausrüstung darf der Arbeitgeber vom Lohn abziehen.",false],["Beschwerden über Sicherheitsmängel dürfen sie nie an eine Behörde richten, nur an den Betriebsrat.",false]],"erkl":"Beschäftigte müssen Weisungen befolgen, Schutzausrüstung nutzen und Gefahren melden (§§ 15, 16). Die Kosten des Arbeitsschutzes trägt allein der Arbeitgeber (§ 3 Abs. 3). Hilft der Arbeitgeber berechtigten Beschwerden nicht ab, dürfen sich Beschäftigte an die Behörde wenden (§ 17 Abs. 2).","norm":"§§ 3 Abs. 3, 15, 16, 17 ArbSchG","id":"2.1-1-3"},{"typ":"mc","frage":"Was versteht man unter dem „dualen Arbeitsschutzsystem“ in Deutschland?","optionen":["Arbeitgeber und Betriebsrat erlassen gemeinsam die Unfallverhütungsvorschriften.","Arbeitsschutz gilt für Auszubildende und Beschäftigte nach zwei getrennten Gesetzen.","Staatliche Arbeitsschutzbehörden und Berufsgenossenschaften wirken nebeneinander.","Fachkraft für Arbeitssicherheit und Betriebsarzt überwachen sich gegenseitig."],"richtig":[2],"erkl":"Den Arbeitsschutz überwachen zwei Säulen: der Staat (Arbeitsschutzbehörden der Länder) und die Unfallversicherungsträger. Die Berufsgenossenschaften – für Versicherungsunternehmen die VBG – erlassen Unfallverhütungsvorschriften, beraten und überwachen die Betriebe.","norm":"§ 21 ArbSchG; §§ 15, 17 SGB VII","id":"2.1-1-4"},{"typ":"zuo","frage":"Ordnen Sie den Sicherheitszeichen ihre Gestaltung zu.","paare":[["Verbotszeichen","rund, roter Rand, roter Diagonalbalken"],["Warnzeichen","dreieckig, gelb, schwarzer Rand"],["Gebotszeichen","rund, blau, weißes Symbol"],["Rettungszeichen","rechteckig, grün, weißes Symbol"],["Brandschutzzeichen","rechteckig, rot, weißes Symbol"]],"erkl":"Form und Farbe zeigen sofort die Bedeutung: Runde Zeichen verbieten (rot) oder gebieten (blau), dreieckige gelbe Zeichen warnen. Rechteckige Zeichen informieren – grün über Rettungswege und Erste Hilfe, rot über Brandschutzeinrichtungen wie Feuerlöscher.","norm":"ASR A1.3 (Sicherheitskennzeichnung)","id":"2.1-1-5"},{"typ":"mehr","frage":"Welche zwei Aussagen zur Bildschirmarbeit treffen zu?","optionen":["Der Arbeitgeber muss eine Angebotsvorsorge anbieten, die u. a. die Augen umfasst.","Bildschirmarbeit ist regelmäßig durch Pausen oder andere Tätigkeiten zu unterbrechen.","Die Teilnahme an der Angebotsvorsorge ist für alle Beschäftigten verpflichtend.","Der Bildschirm wird am besten so gestellt, dass man direkt ins Fenster blickt.","Eine nötige spezielle Bildschirmbrille muss der Beschäftigte selbst bezahlen."],"richtig":[0,1],"erkl":"Bei Bildschirmarbeit muss der Arbeitgeber Angebotsvorsorge anbieten; die Teilnahme ist freiwillig. Ergibt sie, dass eine spezielle Sehhilfe nötig ist, stellt der Arbeitgeber sie auf seine Kosten. Der Arbeitsplatz muss blendfrei sein (Blick parallel zum Fenster) und die Arbeit regelmäßig durch Pausen oder Tätigkeitswechsel unterbrochen werden.","norm":"ArbStättV Anhang Nr. 6; § 5 ArbMedVV i. V. m. Anhang Teil 4","id":"2.1-1-6"},{"typ":"mc","frage":"Welche Aussage zur Gefährdungsbeurteilung trifft zu?","optionen":["Sie ist erst ab regelmäßig mehr als 20 Beschäftigten vorgeschrieben.","Sie gilt nicht für Tätigkeiten, die mobil im Homeoffice erledigt werden.","Sie wird von der Berufsgenossenschaft für jeden Betrieb erstellt.","Sie muss auch psychische Belastungen wie Zeitdruck berücksichtigen."],"richtig":[3],"erkl":"Seit 2013 nennt das Gesetz psychische Belastungen ausdrücklich als Gefährdung. Die Pflicht trifft jeden Arbeitgeber unabhängig von der Betriebsgröße; das Arbeitsschutzgesetz gilt auch bei mobiler Arbeit. Die Berufsgenossenschaft berät, die Verantwortung bleibt beim Arbeitgeber.","norm":"§ 5 Abs. 3 Nr. 6 ArbSchG","id":"2.1-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Lea Schubert (17) beginnt am 1. August 2026 ihre Ausbildung bei der PROXIMUS Versicherung AG in Halle (Saale) und arbeitet überwiegend am Bildschirm. Am Standort sind 230 Personen beschäftigt, von denen täglich regelmäßig 160 anwesend sind; PROXIMUS ist ein Verwaltungsbetrieb. In ihrer ersten Woche schneidet sich Lea an einer Papierschneidemaschine leicht in den Finger und wird von einem Ersthelfer versorgt. Die Geschäftsleitung überlegt, auf Sicherheitsbeauftragte zu verzichten, weil es bereits eine Fachkraft für Arbeitssicherheit gibt.","items":[{"typ":"mc","frage":"Wann muss PROXIMUS Lea nach dem Jugendarbeitsschutzgesetz über Unfall- und Gesundheitsgefahren unterweisen?","optionen":["vor Beginn der Beschäftigung und danach mindestens halbjährlich","innerhalb der ersten drei Monate und danach einmal jährlich","nur einmal zu Beginn, da sie ausschließlich im Büro arbeitet","erst nach dem Ende der Probezeit und danach alle zwei Jahre"],"richtig":[0],"erkl":"Lea ist mit 17 Jahren Jugendliche. Für Jugendliche schreibt das JArbSchG die Unterweisung vor Beginn der Beschäftigung und eine Wiederholung mindestens halbjährlich vor – strenger als die allgemeine Regel für Erwachsene.","norm":"§ 29 Abs. 1 und 2 JArbSchG","id":"2.1-2-1"},{"typ":"zahl","frage":"Wie viele Ersthelfer muss PROXIMUS am Standort mindestens bereitstellen? Bei mehr als 20 anwesenden Versicherten sind in Verwaltungsbetrieben 5 % der anwesenden Versicherten als Ersthelfer vorzusehen.","wert":8,"einheit":"Ersthelfer","tol":0.01,"erkl":"Maßgeblich ist die Zahl der anwesenden Versicherten, nicht die Gesamtzahl der Beschäftigten: 160 × 5 % = 8 Ersthelfer.","norm":"§ 26 Abs. 1 DGUV Vorschrift 1","id":"2.1-2-2"},{"typ":"mc","frage":"Wie ist mit der Erste-Hilfe-Leistung bei Leas kleiner Schnittverletzung umzugehen?","optionen":["Sie wird nur dokumentiert, wenn Lea anschließend einen Arzt aufsuchen muss.","Sie muss noch am selben Tag der staatlichen Arbeitsschutzbehörde gemeldet werden.","Sie wird z. B. im Verbandbuch dokumentiert, auch wenn die Verletzung gering ist.","Sie darf aus Datenschutzgründen überhaupt nicht schriftlich festgehalten werden."],"richtig":[2],"erkl":"Jede Erste-Hilfe-Leistung ist zu dokumentieren (Verbandbuch oder Meldeblock) und fünf Jahre verfügbar zu halten. So lässt sich später nachweisen, dass ein Arbeitsunfall vorlag, falls sich die Verletzung doch verschlimmert.","norm":"§ 24 Abs. 6 DGUV Vorschrift 1","id":"2.1-2-3"},{"typ":"mc","frage":"Beurteilen Sie die Überlegung der Geschäftsleitung, auf Sicherheitsbeauftragte zu verzichten.","optionen":["Zulässig, da die Fachkraft für Arbeitssicherheit diese Aufgabe ersetzt.","Unzulässig, da PROXIMUS regelmäßig mindestens 50 Beschäftigte hat.","Zulässig, da die Pflicht erst ab mehr als 250 Beschäftigten besteht.","Zulässig, solange die Berufsgenossenschaft dies nicht ausdrücklich anordnet."],"richtig":[1],"erkl":"Seit 29.05.2026 müssen Unternehmen mit regelmäßig 50 oder mehr Beschäftigten Sicherheitsbeauftragte bestellen (bei 20 bis 49 nur bei besonderer Gefährdung). Diese unterstützen ehrenamtlich ohne Weisungsbefugnis; die Fachkraft für Arbeitssicherheit nach dem ASiG ist eine andere Funktion und ersetzt sie nicht.","norm":"§ 22 Abs. 1 SGB VII (Fassung ab 29.05.2026)","id":"2.1-2-4"}]}]},{"nr":"2.2","titel":"Brandschutz und Verhalten im Notfall","lf":"Sozialkunde","buch":"ASR A2.2, A2.3; DGUV Information","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Verhaltensregeln im Brandfall der richtigen Reihenfolge zu (nach dem Grundsatz „Ruhe bewahren“).","paare":[["Brand melden","1. Schritt"],["In Sicherheit bringen","2. Schritt"],["Löschversuch unternehmen","3. Schritt"]],"erkl":"Zuerst wird gemeldet, damit Hilfe unterwegs ist, auch wenn später etwas schiefgeht. Danach gehen Menschenleben vor: sich und andere in Sicherheit bringen. Ein Löschversuch kommt nur zuletzt und nur ohne eigene Gefährdung infrage.","norm":"ASR A2.2; Aushang „Verhalten im Brandfall“","id":"2.2-1-1"},{"typ":"zuo","frage":"Ordnen Sie das Brandgut der richtigen Brandklasse zu.","paare":[["Papier, Holz, Textilien","Brandklasse A"],["Benzin, Wachs, Lacke","Brandklasse B"],["Erdgas, Propan","Brandklasse C"],["Magnesium, Natrium","Brandklasse D"],["Speiseöl, Frittierfett","Brandklasse F"]],"erkl":"Die Brandklassen richten sich nach dem brennenden Stoff: A feste, glutbildende Stoffe, B flüssige oder flüssig werdende Stoffe, C Gase, D Metalle, F Speiseöle und -fette. Nur ein Löscher mit passender Brandklasse ist sicher wirksam.","norm":"DIN EN 2 (Brandklassen); ASR A2.2","id":"2.2-1-2"},{"typ":"mc","frage":"Warum darf ein Fettbrand niemals mit Wasser gelöscht werden?","optionen":["Das Wasser leitet Strom und gefährdet dadurch die löschende Person.","Das Wasser kühlt das Fett so stark ab, dass giftige Gase entstehen.","Das Wasser verdünnt das Fett, sodass es danach deutlich länger brennt.","Das Wasser verdampft schlagartig und schleudert brennendes Fett heraus."],"richtig":[3],"erkl":"Wasser sinkt in das sehr heiße Fett, verdampft explosionsartig und reißt brennende Fetttröpfchen mit (Fettexplosion). Fettbrände werden mit Fettbrandlöschern der Brandklasse F oder durch Ersticken, z. B. mit einem Deckel, gelöscht.","norm":"DIN EN 2 (Brandklasse F); DGUV Information","id":"2.2-1-3"},{"typ":"mc","frage":"Welcher Feuerlöscher eignet sich besonders für einen Entstehungsbrand an einem Server im EDV-Raum?","optionen":["Kohlendioxidlöscher, weil er rückstandsfrei löscht","Wasserlöscher, weil Wasser am besten abkühlt","Schaumlöscher, weil Schaum Elektronik schützt","Fettbrandlöscher, weil er für alle Brände gilt"],"richtig":[0],"erkl":"Kohlendioxid (CO2) leitet keinen Strom und hinterlässt keine Rückstände, die Elektronik beschädigen. Wasser und Schaum können Elektronik beschädigen und Strom leiten; Fettbrandlöscher sind für Speiseöle und -fette gedacht.","norm":"ASR A2.2 (Löschmittel)","id":"2.2-1-4"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zum Verhalten bei einer Räumung des Gebäudes.","aussagen":[["Im Brandfall darf der Aufzug nicht benutzt werden.",true],["Türen zum Brandraum sollen geschlossen, aber nicht abgeschlossen werden.",true],["Brandschutztüren dürfen bei viel Betrieb mit einem Keil offen gehalten werden.",false],["Nach dem Verlassen des Gebäudes darf jeder direkt nach Hause gehen.",false]],"erkl":"Aufzüge können ausfallen oder sich mit Rauch füllen; geschlossene Türen bremsen Feuer und Rauch. Brandschutztüren müssen selbstständig schließen können. An der Sammelstelle wird geprüft, ob alle Personen das Gebäude verlassen haben – wer fehlt, wird gesucht.","norm":"ASR A2.3; § 4 Abs. 4 ArbStättV","id":"2.2-1-5"},{"typ":"mehr","frage":"Welche zwei Regeln gelten beim Einsatz von Feuerlöschern?","optionen":["Mehrere Feuerlöscher gleichzeitig statt nacheinander einsetzen","Das Feuer in Windrichtung, also mit dem Wind, angreifen","Das Löschmittel möglichst auf die Flammenspitzen richten","Gebrauchte Feuerlöscher sofort wieder an den Halter hängen","Wandbrände oben beginnend nach unten hin ablöschen"],"richtig":[0,1],"erkl":"Gleichzeitig eingesetzte Löscher wirken stärker, als wenn einer nach dem anderen leer gesprüht wird; mit dem Wind schützt man sich vor Hitze und Rauch. Gelöscht wird die Glut, nicht die Flamme; Wandbrände von unten nach oben. Benutzte Löscher müssen neu befüllt werden.","norm":"DGUV Information (Löschregeln)","id":"2.2-1-6"},{"typ":"mc","frage":"Was gilt nach der Arbeitsstättenverordnung für Fluchtwege und Notausgänge?","optionen":["Sie dürfen kurzfristig als Abstellfläche für Aktenkartons dienen.","Sie sind ständig freizuhalten, damit sie jederzeit benutzbar sind.","Sie müssen nur während der Kernarbeitszeit frei zugänglich sein.","Sie dürfen nachts abgeschlossen werden, auch wenn noch jemand arbeitet."],"richtig":[1],"erkl":"Im Notfall zählt jede Sekunde; ein zugestellter Fluchtweg kann Leben kosten. Deshalb verlangt die ArbStättV, Fluchtwege und Notausgänge ständig freizuhalten, einen Flucht- und Rettungsplan auszuhängen, wo nötig, und die Räumung in angemessenen Abständen zu üben.","norm":"§ 4 Abs. 4 ArbStättV","id":"2.2-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Der Auszubildende Jonas Becker (19) bemerkt im Kopierraum der PROXIMUS Versicherung AG in Halle (Saale) Rauch und kleine Flammen an einem Papierstapel neben dem Kopierer. Im Flur hängen ein Pulverlöscher und ein CO2-Löscher, in der Teeküche nebenan ein Fettbrandlöscher. Am Standort sind 260 Personen beschäftigt.","items":[{"typ":"mc","frage":"Was sollte Jonas als Erstes tun?","optionen":["Sofort allein löschen, damit kein Sachschaden entsteht","Zuerst seine Unterlagen vom Schreibtisch in Sicherheit bringen","Den Brand melden, z. B. über Notruf 112 oder den Brandmelder","Mit dem Aufzug zum Empfang fahren und dort Bescheid sagen"],"richtig":[2],"erkl":"Die Reihenfolge lautet: Ruhe bewahren, Brand melden, in Sicherheit bringen, Löschversuch unternehmen. Wer zuerst meldet, sorgt dafür, dass Feuerwehr und Kollegen gewarnt sind, auch wenn der eigene Löschversuch scheitert. Aufzüge sind im Brandfall tabu.","norm":"ASR A2.2; Aushang „Verhalten im Brandfall“","id":"2.2-2-1"},{"typ":"mc","frage":"Jonas wählt den Notruf 112. Welche Angabe gehört NICHT zu den W-Fragen eines Notrufs?","optionen":["Wo brennt es (Adresse, Stockwerk, Raum)?","Was ist passiert (Brand im Kopierraum)?","Wie viele Personen sind betroffen?","Wie hoch ist der Wert des Kopierers?"],"richtig":[3],"erkl":"Die W-Fragen liefern der Leitstelle, was sie für den Einsatz braucht: Wo, was, wie viele Betroffene, welche Verletzungen – und dann auf Rückfragen warten. Der Sachwert des Geräts spielt für die Rettung keine Rolle.","norm":"Notruf 112 (W-Fragen); DGUV Information","id":"2.2-2-2"},{"typ":"zahl","frage":"Wie viele Brandschutzhelfer sollte PROXIMUS am Standort in der Regel mindestens haben, wenn ein Anteil von 5 % der Beschäftigten zugrunde gelegt wird?","wert":13,"einheit":"Brandschutzhelfer","tol":0.01,"erkl":"Nach der ASR A2.2 ist ein Anteil von 5 % der Beschäftigten in der Regel ausreichend: 260 × 5 % = 13 Brandschutzhelfer. Die genaue Zahl ergibt sich aus der Gefährdungsbeurteilung.","norm":"ASR A2.2 (Brandschutzhelfer)","id":"2.2-2-3"},{"typ":"mc","frage":"Kurz darauf fängt in der Teeküche Öl in einer Pfanne Feuer. Welches Vorgehen ist richtig?","optionen":["die Pfanne mit einem Glas Wasser ablöschen","die brennende Pfanne schnell zum Fenster tragen","das brennende Öl mit reichlich Mehl bestreuen","den Fettbrandlöscher der Brandklasse F einsetzen"],"richtig":[3],"erkl":"Für Speiseöl- und Fettbrände ist die Brandklasse F zuständig. Wasser löst eine Fettexplosion aus, das Tragen der Pfanne verteilt brennendes Öl, und Mehl kann als Staubwolke selbst explosionsartig verbrennen.","norm":"DIN EN 2 (Brandklasse F); ASR A2.2","id":"2.2-2-4"}]}]},{"nr":"2.3","titel":"Umweltschutz, Nachhaltigkeit und Energie sparen","lf":"LF 1 / LF 2 / Sozialkunde","buch":"KrWG § 6; Nachhaltigkeit","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welches Beispiel betrifft vor allem die soziale Säule der Nachhaltigkeit?","optionen":["faire Arbeitsbedingungen und Gesundheitsförderung für Beschäftigte","Senkung des Papierverbrauchs durch eine digitale Kundenakte","langfristig stabile Erträge statt kurzfristiger Gewinnspitzen","Umstellung der Dienstwagenflotte auf Elektrofahrzeuge"],"richtig":[0],"erkl":"Nachhaltigkeit ruht auf drei Säulen: ökologisch (Umwelt und Ressourcen), ökonomisch (dauerhafte wirtschaftliche Stabilität) und sozial (Menschen, z. B. Arbeitsbedingungen, Gesundheit, Chancengleichheit). Papier sparen und E-Autos zählen zur ökologischen Säule.","norm":"Nachhaltigkeit: Drei-Säulen-Modell","id":"2.3-1-1"},{"typ":"zuo","frage":"Ordnen Sie die Stufen der Abfallhierarchie nach dem Kreislaufwirtschaftsgesetz ihrem Rang zu (Rang 1 = höchster Vorrang).","paare":[["Vermeidung","Rang 1"],["Vorbereitung zur Wiederverwendung","Rang 2"],["Recycling","Rang 3"],["sonstige, insbesondere energetische Verwertung","Rang 4"],["Beseitigung","Rang 5"]],"erkl":"Je höher die Stufe, desto mehr Ressourcen werden geschont: Abfall, der gar nicht entsteht, ist am besten. Erst wenn Wiederverwendung und stoffliches Recycling nicht möglich sind, folgen die energetische Verwertung und zuletzt die Beseitigung.","norm":"§ 6 Abs. 1 KrWG","id":"2.3-1-2"},{"typ":"mc","frage":"Restmüll wird in einem Müllheizkraftwerk verbrannt, das die gesetzlichen Vorgaben an die Energieeffizienz erfüllt; mit der Wärme werden Wohnungen beheizt. Welche Stufe der Abfallhierarchie liegt vor?","optionen":["Recycling, also stoffliche Verwertung des Abfalls","Beseitigung des Abfalls durch thermische Behandlung","sonstige, insbesondere energetische Verwertung","Vorbereitung zur Wiederverwendung des Abfalls"],"richtig":[2],"erkl":"Wird die Energie des Abfalls in einer ausreichend energieeffizienten Anlage genutzt, liegt eine energetische Verwertung vor (Rang 4). Recycling wäre es nur, wenn aus dem Abfall wieder Material entsteht; Beseitigung bedeutet Entsorgung ohne nennenswerten Nutzen.","norm":"§ 6 Abs. 1 Nr. 4 KrWG; Anlage 2 KrWG (R 1)","id":"2.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie die Abfälle aus dem Büro der richtigen Entsorgung zu.","paare":[["leerer Joghurtbecher aus Kunststoff","Gelbe Tonne / Gelber Sack"],["Kaffeesatz aus der Teeküche","Bioabfall"],["leere Batterien aus der Funkmaus","Batterie-Sammelbox"],["defekte Computertastatur","Elektroaltgeräte-Sammlung"],["leere Tonerkartusche","Rücknahme durch Hersteller oder Händler"]],"erkl":"Verpackungen gehören in die Wertstoffsammlung, organische Reste in den Bioabfall. Batterien und Elektrogeräte enthalten Schadstoffe und wertvolle Rohstoffe und dürfen nicht in den Restmüll; Tonerkartuschen werden gesondert zurückgegeben und oft wiederbefüllt.","norm":"KrWG; BattDG; ElektroG","id":"2.3-1-4"},{"typ":"mc","frage":"Wie lüften Sie ein Büro im Winter energiesparend?","optionen":["die Fenster den ganzen Tag über gekippt lassen","mehrmals täglich einige Minuten die Fenster weit öffnen","einmal täglich eine Stunde lang alle Fenster öffnen","die Heizung aufdrehen und dabei dauerhaft lüften"],"richtig":[1],"erkl":"Beim Stoßlüften wird die Luft schnell ausgetauscht, ohne dass Wände und Möbel auskühlen. Dauerkippen und langes Lüften kühlen den Raum aus und verschwenden viel Heizenergie.","norm":"Energie sparen im Büro","id":"2.3-1-5"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zum Energiesparen im Büro.","aussagen":[["Geräte im Standby-Betrieb verbrauchen weiterhin Strom.",true],["Jedes Grad weniger Raumtemperatur spart rund 6 % Heizenergie.",true],["LED-Lampen verbrauchen mehr Strom als Glühlampen, halten aber länger.",false],["Eine Videokonferenz verursacht meist mehr CO2 als eine Dienstreise mit dem Auto.",false]],"erkl":"Standby kostet dauerhaft Strom; eine schaltbare Steckerleiste trennt Geräte ganz vom Netz. Die Faustregel „1 Grad = rund 6 %“ zeigt, wie viel eine maßvolle Raumtemperatur bringt. LEDs sparen gegenüber Glühlampen viel Strom; Videokonferenzen ersetzen Reisen mit deutlich weniger CO2.","norm":"Energie sparen im Büro","id":"2.3-1-6"},{"typ":"mehr","frage":"Welche zwei Aussagen zur Nachhaltigkeit in der Versicherungswirtschaft treffen zu?","optionen":["Durch den Klimawandel steigen Schäden durch Starkregen und Überschwemmung.","Bei der Kapitalanlage berücksichtigen Versicherer zunehmend ESG-Kriterien.","Greenwashing bezeichnet die externe Prüfung eines Umweltmanagements.","EMAS ist eine reine Selbstauskunft ohne jede Prüfung durch Dritte.","Nachhaltigkeit betrifft Versicherer nicht, da sie nichts produzieren."],"richtig":[0,1],"erkl":"Der Klimawandel erhöht Elementarschäden und damit die Schadenaufwendungen; zugleich legen Versicherer Kundengelder nach Umwelt-, Sozial- und Governance-Kriterien (ESG) an. Greenwashing ist eine geschönte Selbstdarstellung; EMAS wird von Umweltgutachtern geprüft.","norm":"Nachhaltigkeit: ESG, EMAS, Greenwashing","id":"2.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) will klimafreundlicher werden. Nachhaltigkeitsbeauftragte Aylin Demir (34) stellt fest, dass die Geschäftsstelle bei 23 °C Raumtemperatur jährlich 40.000 € Heizkosten verursacht. PROXIMUS plant außerdem ein extern geprüftes Umweltmanagement, eine neue Werbekampagne und eine Schulung der Kundenberater zur Altersvorsorge mit fondsgebundenen Rentenversicherungen.","items":[{"typ":"zahl","frage":"Die Raumtemperatur soll von 23 °C auf 20 °C gesenkt werden. Gehen Sie vereinfachend davon aus, dass jedes Grad weniger 6 % der Heizkosten spart und die Prozentsätze addiert werden. Wie viel Euro spart PROXIMUS im Jahr?","wert":7200,"einheit":"€","tol":0.01,"erkl":"3 Grad × 6 % = 18 % Ersparnis; 40.000 € × 18 % = 7.200 € pro Jahr.","norm":"Energie sparen im Büro","id":"2.3-2-1"},{"typ":"mc","frage":"Welches Umweltmanagementsystem beruht auf einer EU-Verordnung und verlangt eine veröffentlichte, geprüfte Umwelterklärung?","optionen":["ISO 14001","ISO 9001","ISO 50001","EMAS"],"richtig":[3],"erkl":"EMAS (Eco-Management and Audit Scheme) ist das Umweltmanagementsystem der EU; die Umwelterklärung wird von Umweltgutachtern geprüft und veröffentlicht. ISO 14001 ist eine internationale Norm ohne Veröffentlichungspflicht, ISO 9001 betrifft Qualität, ISO 50001 das Energiemanagement.","norm":"Umweltmanagement: EMAS, ISO 14001","id":"2.3-2-2"},{"typ":"mc","frage":"Ein Werbeentwurf bezeichnet PROXIMUS als „klimaneutralen Versicherer“, obwohl bisher nur der Papierverbrauch gesenkt wurde. Wie ist das zu beurteilen?","optionen":["Greenwashing, weil mehr Klimaschutz behauptet wird, als erreicht ist","zulässig, weil jede Einsparung den Begriff „klimaneutral“ rechtfertigt","vorgeschrieben, weil Versicherer ihre Klimaneutralität bewerben müssen","zulässig, weil Werbeaussagen zur Umwelt nicht überprüft werden dürfen"],"richtig":[0],"erkl":"Greenwashing liegt vor, wenn sich ein Unternehmen umweltfreundlicher darstellt, als es ist. Eine solche Werbung täuscht Kunden und ist als irreführende geschäftliche Handlung unzulässig; seit dem 27.09.2026 schränkt das UWG pauschale Umwelt- und Klimaaussagen zusätzlich ausdrücklich ein.","norm":"Greenwashing; § 5 UWG; Anhang zu § 3 Abs. 3 UWG","id":"2.3-2-3"},{"typ":"mc","frage":"Kundenberater Paul Krüger berät Frau Schmitt zu einer fondsgebundenen Rentenversicherung. Was muss er zum Thema Nachhaltigkeit tun?","optionen":["Nachhaltigkeit nur ansprechen, wenn die Kundin von sich aus danach fragt","ihre Nachhaltigkeitspräferenzen abfragen und bei der Empfehlung berücksichtigen","ihr ausschließlich Fonds mit Nachhaltigkeitsbezug empfehlen und anbieten","Nachhaltigkeit nur bei Sachversicherungen wie der Hausratversicherung ansprechen"],"richtig":[1],"erkl":"Seit August 2022 müssen Berater bei Versicherungsanlageprodukten wie der fondsgebundenen Rentenversicherung die Nachhaltigkeitspräferenzen der Kunden erfragen und berücksichtigen. Die Kundin entscheidet selbst, ob und wie stark Nachhaltigkeit eine Rolle spielen soll.","norm":"IDD; Delegierte VO (EU) 2021/1257","id":"2.3-2-4"}]}]},{"nr":"2.4","titel":"Digitalisierung, Datenschutz und Informationssicherheit","lf":"LF 2 / LF 3 / Sozialkunde","buch":"DSGVO Art. 4–6, 9, 15–17, 32–34; BDSG § 38","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Kommunikationskanälen im Kundenkontakt ihren typischen Vorteil zu.","paare":[["Telefon","persönliches Gespräch mit sofortigen Rückfragen"],["E-Mail","zeitversetzt, schriftlich dokumentiert, mit Anhängen"],["Chatbot","rund um die Uhr erreichbar für Standardfragen"],["Videoberatung","Beratung mit Bild und Bildschirmfreigabe ohne Anfahrt"],["Kundenportal / App","Kunde ruft Vertragsdaten selbst ab und meldet Schäden"]],"erkl":"Jeder Kanal hat Stärken: Telefon und Video ermöglichen persönliche Beratung, E-Mail schafft Nachweise, Chatbot und Portal sind jederzeit verfügbar. Nachteile sind z. B. fehlende Mimik am Telefon oder begrenzte Antworten eines Chatbots.","norm":"Kommunikation: Kundenkanäle","id":"2.4-1-1"},{"typ":"mc","frage":"Was kennzeichnet einen Omnikanal-Ansatz im Kundenservice?","optionen":["Kunden werden nur noch über einen einzigen, festen Kanal betreut.","Jeder Kanal arbeitet getrennt mit einem eigenen Datenbestand.","Kunden wechseln nahtlos zwischen Kanälen; alle Kontakte sind verknüpft.","Kundenkontakte finden ausschließlich digital, nie persönlich statt."],"richtig":[2],"erkl":"Beim Omnikanal-Ansatz sind alle Kanäle miteinander verbunden: Ein Kunde kann per App eine Schadenmeldung beginnen und am Telefon fortsetzen, ohne alles erneut zu erklären. Getrennte Kanäle ohne gemeinsame Daten kennzeichnen dagegen den Multikanal-Ansatz.","norm":"Kommunikation: Omnikanal","id":"2.4-1-2"},{"typ":"mc","frage":"Welche Angabe ist KEIN personenbezogenes Datum im Sinne der DSGVO?","optionen":["die Versicherungsscheinnummer eines bestimmten Kunden","das Kfz-Kennzeichen in einer Schadenmeldung","die E-Mail-Adresse eines Interessenten","die durchschnittliche Schadenquote aller Hausratverträge"],"richtig":[3],"erkl":"Personenbezogen sind alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person beziehen – auch über eine Nummer oder ein Kennzeichen. Eine Durchschnittszahl über alle Verträge lässt keinen Rückschluss auf eine einzelne Person zu.","norm":"Art. 4 Nr. 1 DSGVO","id":"2.4-1-3"},{"typ":"zuo","frage":"Ordnen Sie die Beispiele dem passenden Datenschutzgrundsatz zu.","paare":[["Daten aus einem Schadenfall werden nicht für fremde Werbung genutzt.","Zweckbindung"],["Für den Hausratantrag wird nicht nach der Religion gefragt.","Datenminimierung"],["Eine veraltete Anschrift wird unverzüglich korrigiert.","Richtigkeit"],["Daten werden nach Ablauf der Aufbewahrungsfrist gelöscht.","Speicherbegrenzung"],["Kundendaten werden vor unbefugtem Zugriff geschützt.","Integrität und Vertraulichkeit"]],"erkl":"Art. 5 DSGVO nennt die Grundsätze jeder Verarbeitung: Daten nur für festgelegte Zwecke, nur so viele wie nötig, sachlich richtig, nicht länger als nötig und sicher gespeichert. Hinzu kommen Rechtmäßigkeit und Transparenz.","norm":"Art. 5 Abs. 1 lit. b–f DSGVO","id":"2.4-1-4"},{"typ":"mc","frage":"PROXIMUS speichert Name, Anschrift und Bankverbindung eines Kunden, um seinen Hausratvertrag zu verwalten. Worauf beruht diese Verarbeitung?","optionen":["auf der Erfüllung des Vertrags mit dem Kunden","auf einer jederzeit widerruflichen Einwilligung","auf dem berechtigten Interesse an Werbung","auf keiner Rechtsgrundlage, da er Kunde ist"],"richtig":[0],"erkl":"Jede Verarbeitung braucht eine Rechtsgrundlage nach Art. 6. Daten, die zur Durchführung eines Vertrags erforderlich sind, dürfen ohne gesonderte Einwilligung verarbeitet werden; ohne Anschrift und Bankverbindung ließe sich der Vertrag nicht verwalten.","norm":"Art. 6 Abs. 1 lit. b DSGVO","id":"2.4-1-5"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zum Datenschutz bei der PROXIMUS.","aussagen":[["Kunden haben das Recht, Auskunft über die zu ihnen gespeicherten Daten zu verlangen.",true],["Gesundheitsangaben in einem Antrag auf Berufsunfähigkeitsversicherung sind besonders geschützte Daten.",true],["Eine meldepflichtige Datenpanne muss der Aufsichtsbehörde erst nach 14 Tagen gemeldet werden.",false],["Einen Datenschutzbeauftragten muss ein Unternehmen erst ab 250 Beschäftigten benennen.",false]],"erkl":"Das Auskunftsrecht steht jeder betroffenen Person zu (Art. 15); Gesundheitsdaten gehören zu den besonderen Kategorien (Art. 9). Datenpannen sind unverzüglich, möglichst binnen 72 Stunden zu melden (Art. 33). Einen Datenschutzbeauftragten verlangt § 38 BDSG bereits, wenn in der Regel mindestens 20 Personen ständig mit automatisierter Verarbeitung beschäftigt sind; ein Versicherer, der umfangreich Gesundheitsdaten verarbeitet, braucht ihn ohnehin (Art. 37 DSGVO).","norm":"Art. 9, 15, 33, 37 DSGVO; § 38 Abs. 1 BDSG","id":"2.4-1-6"},{"typ":"mehr","frage":"Welche drei Maßnahmen verbessern die Informationssicherheit am Arbeitsplatz?","optionen":["Zwei-Faktor-Authentisierung für dienstliche Konten nutzen","Sicherheitsupdates zeitnah installieren lassen","lange, unterschiedliche Passwörter mit Passwortmanager","ein einziges Passwort für alle Konten verwenden","Datensicherungen abschalten, um Speicher zu sparen"],"richtig":[0,1,2],"erkl":"Ein zweiter Faktor schützt auch dann, wenn ein Passwort gestohlen wurde; Updates schließen bekannte Sicherheitslücken; ein Passwortmanager ermöglicht lange, für jedes Konto verschiedene Passwörter. Ein Passwort für alles und fehlende Datensicherung erhöhen das Risiko.","norm":"Art. 32 DSGVO; Informationssicherheit (BSI-Empfehlungen)","id":"2.4-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Timo Wagner (20) ist Auszubildender bei der PROXIMUS Versicherung AG in Halle (Saale). Er arbeitet zwei Tage pro Woche mobil von zu Hause und lernt Produktwissen über die betriebliche Lernplattform. Heute erhält er eine E-Mail „IT-Support: Ihr Konto wird in 2 Stunden gesperrt – bestätigen Sie hier Ihr Passwort“. Außerdem soll er einer Kundin schreiben, deren Schadenbericht eine ärztliche Diagnose enthält.","items":[{"typ":"mc","frage":"Timo möchte den Schadenbericht mit Name und Diagnose der Kundin in einen öffentlichen KI-Chatbot kopieren, um den Brief formulieren zu lassen. Wie ist das zu beurteilen?","optionen":["zulässig, weil die KI den Text nur kurzzeitig zur Formulierung verarbeitet","zulässig, wenn Timo den Brief vor dem Versand noch selbst sorgfältig prüft","unzulässig, weil Kundendaten – hier Gesundheitsdaten – so an Dritte gelangen","zulässig, weil die Kundin mit dem Vertrag jeder Verarbeitung zugestimmt hat"],"richtig":[2],"erkl":"Öffentliche KI-Werkzeuge sind externe Dienste; eingegebene Daten verlassen das Unternehmen und können weiterverwendet werden. Für Kundendaten, erst recht für besonders geschützte Gesundheitsdaten, fehlt dafür jede Rechtsgrundlage – sie haben in öffentlicher KI nichts zu suchen.","norm":"Art. 5 Abs. 1 lit. f, Art. 6, Art. 9 DSGVO","id":"2.4-2-1"},{"typ":"mc","frage":"Wie reagiert Timo richtig auf die E-Mail des angeblichen IT-Supports?","optionen":["Passwort schnell bestätigen, damit das Konto nicht gesperrt wird","Link nicht anklicken und die Mail der IT-Abteilung melden","Die Mail an alle Kollegen weiterleiten, damit sie gewarnt sind","Auf die Mail antworten und nach dem Grund der Sperre fragen"],"richtig":[1],"erkl":"Zeitdruck, Drohung mit Sperre und die Aufforderung, über einen Link das Passwort einzugeben, sind typische Merkmale von Phishing. Richtig ist, nichts anzuklicken und die IT-Abteilung zu informieren; Weiterleiten oder Antworten verbreitet die Gefahr bzw. bestätigt die Adresse.","norm":"Art. 32 DSGVO; Informationssicherheit (Phishing)","id":"2.4-2-2"},{"typ":"mehr","frage":"Welche zwei Maßnahmen schützen Kundendaten, wenn Timo mobil von zu Hause arbeitet?","optionen":["den Bildschirm beim Verlassen des Arbeitsplatzes sperren","Ausdrucke mit Kundendaten verschlossen aufbewahren","Kundendaten zur Sicherheit auf einen privaten USB-Stick kopieren","das dienstliche Notebook der Familie für Hausaufgaben leihen","das Firmenpasswort im Browser des Familien-PCs speichern"],"richtig":[0,1],"erkl":"Auch zu Hause gilt der Datenschutz: Familienangehörige dürfen keine Kundendaten sehen. Bildschirmsperre und verschlossene Unterlagen verhindern das; private Geräte und Speicher ohne Freigabe sind tabu, weil sie nicht abgesichert sind.","norm":"Art. 32 DSGVO (technische und organisatorische Maßnahmen)","id":"2.4-2-3"},{"typ":"mc","frage":"Welcher Nachteil der betrieblichen Lernplattform ist für Timo am ehesten zu erwarten?","optionen":["Er kann Inhalte nicht wiederholen, wenn er etwas nicht verstanden hat.","Er muss zu festen Zeiten in einem Schulungsraum der PROXIMUS sein.","Er kann nicht in seinem eigenen Tempo durch die Lerninhalte gehen.","Er braucht viel Selbstdisziplin, um regelmäßig selbstständig zu lernen."],"richtig":[3],"erkl":"E-Learning ist zeit- und ortsunabhängig, erlaubt eigenes Tempo und Wiederholungen. Dafür muss man sich selbst organisieren und motivieren; außerdem hängt man von der Technik ab und hat weniger direkten Austausch mit anderen.","norm":"Digitalisierung: E-Learning","id":"2.4-2-4"}]}]},{"nr":"2.5","titel":"Aufbauorganisation","lf":"LF 1 / Sozialkunde","buch":"Organisationslehre","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie den Begriffen der Aufbauorganisation die passende Erklärung zu.","paare":[["Stelle","kleinste organisatorische Einheit mit festem Aufgabenbereich"],["Instanz","Stelle mit Leitungs- und Weisungsbefugnis"],["Abteilung","mehrere Stellen unter einer gemeinsamen Instanz"],["Leitungsspanne","Zahl der einer Instanz direkt unterstellten Stellen"],["Leitungstiefe","Zahl der Hierarchieebenen im Unternehmen"]],"erkl":"Die Stelle ist der Baustein jeder Organisation; erhält sie Leitungsbefugnis, wird sie zur Instanz. Leitungsspanne (Breite) und Leitungstiefe (Zahl der Ebenen) beschreiben, wie ein Organigramm aufgebaut ist.","norm":"Organisationslehre: Grundbegriffe","id":"2.5-1-1"},{"typ":"mc","frage":"Was regelt die Aufbauorganisation im Unterschied zur Ablauforganisation?","optionen":["wer welche Aufgaben, Befugnisse und Vorgesetzten hat","in welcher Reihenfolge Arbeitsschritte erledigt werden","wie lange ein Vorgang von Eingang bis Abschluss dauert","welche Arbeitsschritte ein Schadenfall durchläuft"],"richtig":[0],"erkl":"Die Aufbauorganisation legt das Gerüst fest: Stellen, Abteilungen und Weisungsbeziehungen (dargestellt im Organigramm). Die Ablauforganisation regelt dagegen Reihenfolge, Zeit und Ort der Arbeitsschritte, z. B. bei der Schadenbearbeitung.","norm":"Organisationslehre: Aufbau- und Ablauforganisation","id":"2.5-1-2"},{"typ":"mc","frage":"Welcher Nachteil ist typisch für das Einliniensystem?","optionen":["Kompetenzkonflikte durch mehrere gleichrangige Vorgesetzte","lange Dienstwege und Überlastung der oberen Instanzen","unklare Zuständigkeiten, weil Weisungen sich widersprechen","hohe Kosten durch zahlreiche beratende Stabsstellen"],"richtig":[1],"erkl":"Im Einliniensystem hat jeder genau einen Vorgesetzten; das schafft klare Zuständigkeiten. Alle Informationen laufen aber über den Dienstweg nach oben und unten, was lange dauert und die oberen Instanzen belastet. Kompetenzkonflikte sind typisch für das Mehrliniensystem.","norm":"Organisationslehre: Einliniensystem","id":"2.5-1-3"},{"typ":"mc","frage":"Welche Aussage über eine Stabsstelle trifft zu?","optionen":["Sie entscheidet anstelle der Linie über alle fachlichen Fragen.","Sie ist allen Abteilungsleitungen gegenüber weisungsbefugt.","Sie berät und bereitet Entscheidungen vor, ohne Weisungsbefugnis.","Sie bildet die unterste Ebene der ausführenden Sachbearbeitung."],"richtig":[2],"erkl":"Stabsstellen wie Rechtsabteilung, Datenschutz, Assistenz der Geschäftsführung oder Unternehmenskommunikation entlasten die Leitung durch Fachwissen. Entscheiden und anweisen darf aber nur die Linie; sonst entstünde ein Mehrliniensystem.","norm":"Organisationslehre: Stabliniensystem","id":"2.5-1-4"},{"typ":"zuo","frage":"Ordnen Sie den Organisationsformen ihr kennzeichnendes Merkmal zu.","paare":[["Einliniensystem","jede Stelle hat genau einen Vorgesetzten"],["Mehrliniensystem","Weisungen kommen von mehreren Fachvorgesetzten"],["Spartenorganisation","Gliederung nach Produkten wie Komposit, Leben, Kranken"],["Matrixorganisation","Überlagerung zweier Dimensionen, z. B. Sparte und Funktion"],["Projektorganisation","zeitlich befristete Einheit für eine einmalige Aufgabe"]],"erkl":"Die Formen unterscheiden sich nach Weisungswegen (Ein- oder Mehrlinien) und nach dem Gliederungsmerkmal (Sparten, zwei Dimensionen). Versicherungskonzerne sind häufig nach Sparten gegliedert; für einmalige Vorhaben wie eine neue App bildet man Projekte.","norm":"Organisationslehre: Organisationsformen","id":"2.5-1-5"},{"typ":"mc","frage":"Welche Folge hat es typischerweise, wenn ein Unternehmen Hierarchieebenen abbaut (flache Hierarchie)?","optionen":["kleinere Leitungsspanne und längere Informationswege","größere Leitungstiefe und mehr Zwischeninstanzen","mehr Stabsstellen und strengere Kontrolle von oben","größere Leitungsspanne und kürzere Informationswege"],"richtig":[3],"erkl":"Fallen Ebenen weg, sinkt die Leitungstiefe; die verbleibenden Instanzen führen mehr Stellen direkt (größere Leitungsspanne). Entscheidungen werden schneller, und die Mitarbeitenden erhalten mehr Eigenverantwortung – ein Kerngedanke des Lean Managements.","norm":"Organisationslehre: flache Hierarchie, Lean Management","id":"2.5-1-6"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zur Organisation.","aussagen":[["Im Mehrliniensystem können Kompetenzkonflikte zwischen Vorgesetzten entstehen.",true],["In der Matrixorganisation hat jede Stelle genau einen Vorgesetzten.",false],["Agile Teams arbeiten in kurzen Arbeitsabschnitten und organisieren sich weitgehend selbst.",true],["Eine Stellenbeschreibung legt nur die Vergütung fest, nicht Aufgaben und Befugnisse.",false]],"erkl":"Mehrere Vorgesetzte können sich widersprechen; in der Matrix ist das sogar angelegt, weil zwei Dimensionen gleichzeitig führen. Agile Teams planen in kurzen Abschnitten und steuern sich selbst. Die Stellenbeschreibung hält vor allem Ziele, Aufgaben, Befugnisse und Unterstellung fest.","norm":"Organisationslehre: Mehrlinien, Matrix, Stellenbeschreibung","id":"2.5-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) ist so aufgebaut: Unter dem Vorstand stehen die Hauptabteilungen Komposit, Leben und Kranken; dem Vorstand direkt zugeordnet sind die Stabsstellen Recht und Datenschutz. Die Hauptabteilung Komposit gliedert sich in die Abteilungen Vertrag und Schaden. Die Abteilungsleitung Schaden führt drei Gruppenleitungen (Kfz, Haftpflicht, Sach); jeder Gruppenleitung sind 8, 6 bzw. 9 Sachbearbeitungsstellen unterstellt, die nur von ihr Weisungen erhalten.","items":[{"typ":"mc","frage":"Welche Organisationsform beschreibt den Aufbau der PROXIMUS am besten?","optionen":["Stabliniensystem, unter dem Vorstand nach Sparten gegliedert","Mehrliniensystem, unter dem Vorstand nach Funktionen gegliedert","Matrixorganisation aus Sparten und regionalen Vertriebsgebieten","reine Projektorganisation ohne dauerhafte Weisungslinien"],"richtig":[0],"erkl":"Jede Stelle erhält Weisungen nur von einer Instanz (Linie), und dem Vorstand sind beratende Stabsstellen zugeordnet – also ein Stabliniensystem. Die Hauptabteilungen Komposit, Leben und Kranken zeigen die für Versicherer typische Gliederung nach Sparten.","norm":"Organisationslehre: Stablinien- und Spartenorganisation","id":"2.5-2-1"},{"typ":"zahl","frage":"Wie groß ist die Leitungsspanne der Abteilungsleitung Schaden?","wert":3,"einheit":"Stellen","tol":0.01,"erkl":"Die Leitungsspanne zählt nur die direkt unterstellten Stellen. Der Abteilungsleitung sind die drei Gruppenleitungen unterstellt; die 23 Sachbearbeitungsstellen sind den Gruppenleitungen zugeordnet und zählen dort.","norm":"Organisationslehre: Leitungsspanne","id":"2.5-2-2"},{"typ":"mc","frage":"Die Stabsstelle Datenschutz stellt fest, dass in der Gruppe Kfz Schadenakten offen auf Schreibtischen liegen. Wie geht sie organisatorisch richtig vor?","optionen":["Sie weist die Sachbearbeiter direkt und verbindlich an.","Sie mahnt die Sachbearbeiter ab und kürzt deren Gehalt.","Sie berät die Linie, die dann die nötigen Weisungen erteilt.","Sie übernimmt selbst vorübergehend die Gruppe Kfz."],"richtig":[2],"erkl":"Eine Stabsstelle hat keine Weisungsbefugnis gegenüber der Linie. Sie weist auf den Mangel hin und berät; die Weisung, z. B. eine Clean-Desk-Regel einzuhalten, erteilen der Vorstand oder die zuständigen Vorgesetzten der Linie.","norm":"Organisationslehre: Stabliniensystem","id":"2.5-2-3"},{"typ":"mc","frage":"PROXIMUS schafft die Gruppenleitungen in der Abteilung Schaden ab; alle 23 Sachbearbeitungsstellen werden direkt der Abteilungsleitung unterstellt. Was ändert sich?","optionen":["Leitungsspanne sinkt von 23 auf 3, Leitungstiefe steigt um eine Ebene","Leitungsspanne steigt von 3 auf 23, Leitungstiefe sinkt um eine Ebene","Leitungsspanne bleibt bei 3, Leitungstiefe sinkt um eine Ebene","Leitungsspanne steigt von 3 auf 23, Leitungstiefe bleibt unverändert"],"richtig":[1],"erkl":"Statt drei Gruppenleitungen führt die Abteilungsleitung nun 23 Stellen direkt; zugleich entfällt die Gruppenebene. Das ist eine typische Verflachung der Hierarchie mit kürzeren Wegen, aber höherer Belastung der verbleibenden Instanz.","norm":"Organisationslehre: Leitungsspanne, Leitungstiefe","id":"2.5-2-4"}]}]}]},{"nr":"3","titel":"Volkswirtschaft","lf":"ca. 21 % der WISO","abschnitte":[{"nr":"3.1","titel":"Markt und Preisbildung","lf":"Sozialkunde / LF 13","buch":"VWL: Markt und Preis","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was versteht man in der Volkswirtschaftslehre unter einem Markt?","optionen":["Das Zusammentreffen von Angebot und Nachfrage nach einem Gut","Ein fester Platz, an dem Händler regelmäßig Waren verkaufen","Die Gesamtheit aller Unternehmen einer Branche in der Region","Ein staatlich überwachter Handelsplatz für Wertpapiere"],"richtig":[0],"erkl":"Markt ist jedes Zusammentreffen von Angebot und Nachfrage – egal ob Wochenmarkt, Online-Plattform oder Telefon. Dort bildet sich der Preis; ein fester Ort ist nicht nötig.","norm":"VWL: Markt und Preis","id":"3.1-1-1"},{"typ":"mc","frage":"Wie verlaufen Nachfrage- und Angebotskurve im Preis-Mengen-Diagramm üblicherweise?","optionen":["Die Nachfragekurve fällt, die Angebotskurve steigt mit dem Preis.","Die Nachfragekurve steigt, die Angebotskurve fällt mit dem Preis.","Beide Kurven steigen, weil höhere Preise mehr Umsatz bringen.","Beide Kurven fallen, weil höhere Preise alle Marktteilnehmer abschrecken."],"richtig":[0],"erkl":"Je höher der Preis, desto weniger fragen die Haushalte nach (fallende Nachfragekurve). Anbieter weiten dagegen bei höherem Preis ihr Angebot aus, weil sich die Produktion mehr lohnt (steigende Angebotskurve).","norm":"VWL: Markt und Preis","id":"3.1-1-2"},{"typ":"zahl","frage":"Für ein Gut liegen folgende Werte vor (Preis – nachgefragte Menge – angebotene Menge): 4 € – 900 – 300 Stück; 5 € – 800 – 500 Stück; 6 € – 700 – 700 Stück; 7 € – 550 – 900 Stück; 8 € – 450 – 1.100 Stück. Ermitteln Sie den Gleichgewichtspreis.","wert":6,"einheit":"€","tol":0.01,"erkl":"Bei 6 € sind angebotene und nachgefragte Menge gleich (700 Stück), der Markt wird geräumt. Abgesetzt wird immer nur die kleinere der beiden Mengen; sie ist beim Gleichgewichtspreis mit 700 Stück am größten (z. B. bei 7 € nur 550 Stück, bei 5 € nur 500 Stück).","norm":"VWL: Markt und Preis","id":"3.1-1-3"},{"typ":"zahl","frage":"Die Nachfrage nach einem Gut lautet N = 120 – 4p, das Angebot A = 20 + 6p (p = Preis in €, Mengen in Stück). Berechnen Sie die Gleichgewichtsmenge.","wert":80,"einheit":"Stück","tol":0.01,"erkl":"Im Gleichgewicht gilt N = A: 120 – 4p = 20 + 6p → 100 = 10p → p = 10 €. Eingesetzt: N = 120 – 40 = 80 und A = 20 + 60 = 80 Stück.","norm":"VWL: Markt und Preis","id":"3.1-1-4"},{"typ":"mc","frage":"Auf einem Markt liegt der Preis über dem Gleichgewichtspreis. Welche Entwicklung ist zu erwarten?","optionen":["Es entsteht ein Angebotsüberhang, und der Preis sinkt.","Es entsteht ein Nachfrageüberhang, und der Preis steigt.","Es entsteht ein Angebotsüberhang, und der Preis steigt.","Der Markt ist geräumt, deshalb bleibt der Preis stabil."],"richtig":[0],"erkl":"Über dem Gleichgewichtspreis bieten die Anbieter mehr an, als nachgefragt wird. Um ihre Ware loszuwerden, senken sie den Preis, bis sich das Gleichgewicht einstellt.","norm":"VWL: Markt und Preis","id":"3.1-1-5"},{"typ":"mc","frage":"Die Einkommen der privaten Haushalte steigen deutlich. Wie wirkt sich das bei sonst gleichen Bedingungen auf den Markt eines normalen Gutes aus?","optionen":["Die Nachfragekurve verschiebt sich nach rechts; Preis und Menge steigen.","Die Angebotskurve verschiebt sich nach rechts; der Preis sinkt, die Menge steigt.","Die Nachfragekurve verschiebt sich nach links; Preis und Menge sinken.","Es ändert sich nur die Menge entlang der Kurve; der Preis bleibt gleich."],"richtig":[0],"erkl":"Mit höherem Einkommen wird bei jedem Preis mehr von einem normalen Gut nachgefragt – die ganze Nachfragekurve wandert nach rechts. Das neue Gleichgewicht liegt bei höherem Preis und höherer Menge (ähnlich wirkt ein Modetrend).","norm":"VWL: Markt und Preis","id":"3.1-1-6"},{"typ":"wf","frage":"Beurteilen Sie die Aussagen zur Preisbildung.","aussagen":[["Ein staatlicher Höchstpreis unterhalb des Gleichgewichtspreises führt zu einem Nachfrageüberhang.",true],["Ein staatlicher Mindestpreis oberhalb des Gleichgewichtspreises führt zu einem Nachfrageüberhang.",false],["Die Konsumentenrente entsteht, weil einige Käufer bereit wären, mehr als den Marktpreis zu zahlen.",true],["Treten zusätzliche Anbieter in den Markt ein, verschiebt sich die Angebotskurve nach links.",false]],"erkl":"Ein Höchstpreis unter dem Gleichgewicht macht das Gut knapp (Nachfrageüberhang, Gefahr von Schwarzmärkten); ein Mindestpreis darüber erzeugt einen Angebotsüberhang. Mehr Anbieter erhöhen das Angebot – die Kurve wandert nach rechts.","norm":"VWL: Markt und Preis","id":"3.1-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) plant eine Werbeaktion für ihre E-Bike-Versicherung. Ausbilderin Katrin Wolff bespricht mit dem Auszubildenden Emre Yıldız eine Marktanalyse für E-Bikes in der Region: Bei einem Preis von 2.400 € werden 1.300 E-Bikes nachgefragt und 1.900 angeboten; bei 2.000 € stimmen Angebot und Nachfrage mit je 1.600 Stück überein. Emre wäre selbst bereit, bis zu 2.300 € für ein E-Bike zu zahlen.","items":[{"typ":"zahl","frage":"Berechnen Sie den Angebotsüberhang bei einem Preis von 2.400 €.","wert":600,"einheit":"Stück","tol":0.01,"erkl":"Angebot 1.900 – Nachfrage 1.300 = 600 Stück bleiben unverkauft. Dieser Überhang setzt die Anbieter unter Druck, den Preis in Richtung Gleichgewicht (2.000 €) zu senken.","norm":"VWL: Markt und Preis","id":"3.1-2-1"},{"typ":"mc","frage":"Emre kauft sein E-Bike zum Gleichgewichtspreis. Wie bezeichnet man den Vorteil von 300 €, den er dabei hat?","optionen":["Konsumentenrente","Produzentenrente","Preisdifferenzierung","Kaufkraftgewinn"],"richtig":[0],"erkl":"Emre wäre bereit, 2.300 € zu zahlen, zahlt aber nur den Marktpreis von 2.000 €; die Differenz ist seine Konsumentenrente. Die Produzentenrente betrifft dagegen Anbieter, die auch zu einem niedrigeren Preis verkauft hätten.","norm":"VWL: Markt und Preis","id":"3.1-2-2"},{"typ":"mc","frage":"Eine Pressemeldung berichtet, dass die Preise für Akkus stark steigen. Welche Wirkung ist auf dem E-Bike-Markt bei sonst gleichen Bedingungen zu erwarten?","optionen":["Das Angebot geht zurück; der Preis steigt, die Menge sinkt.","Die Nachfrage steigt; Preis und Menge nehmen zu.","Das Angebot steigt; der Preis sinkt, die Menge steigt.","Die Nachfrage sinkt; Preis und Menge nehmen ab."],"richtig":[0],"erkl":"Teurere Akkus erhöhen die Produktionskosten; zu jedem Preis wird weniger angeboten, die Angebotskurve wandert nach links. Im neuen Gleichgewicht ist der Preis höher und die abgesetzte Menge kleiner.","norm":"VWL: Markt und Preis","id":"3.1-2-3"},{"typ":"mc","frage":"Bei einem Preis von 2.000 € statt 2.400 € bieten nur noch die Händler an, die kostengünstig genug arbeiten. Welche Funktion des Preises zeigt sich darin?","optionen":["Auslesefunktion","Ausgleichsfunktion","Signalfunktion","Lenkungsfunktion"],"richtig":[0],"erkl":"Der Preis sortiert Anbieter aus, deren Kosten über dem Marktpreis liegen (Auslesefunktion). Ausgleich meint die Räumung des Marktes, Signal die Anzeige von Knappheit, Lenkung die Steuerung der Produktionsfaktoren.","norm":"VWL: Markt und Preis","id":"3.1-2-4"}]}]},{"nr":"3.2","titel":"Marktformen und Wettbewerb","lf":"Sozialkunde / LF 13","buch":"VWL: Marktformen","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Auf einem Markt stehen wenige große Anbieter sehr vielen Nachfragern gegenüber. Welche Marktform liegt vor?","optionen":["Angebotsoligopol","Nachfrageoligopol","Angebotsmonopol","Zweiseitiges Oligopol"],"richtig":[0],"erkl":"Die Marktform ergibt sich aus der Zahl der Anbieter und Nachfrager. Wenige Anbieter bei vielen Nachfragern bilden ein Angebotsoligopol (z. B. Mineralölkonzerne an der Tankstelle).","norm":"VWL: Marktformen","id":"3.2-1-1"},{"typ":"zuo","frage":"Ordnen Sie die Marktsituationen der richtigen Marktform zu.","paare":[["Ein Anbieter, viele Nachfrager","Angebotsmonopol"],["Viele Anbieter, ein Nachfrager","Nachfragemonopol"],["Ein Anbieter, ein Nachfrager","Zweiseitiges (bilaterales) Monopol"],["Viele Anbieter, viele Nachfrager","Polypol (vollständige Konkurrenz)"]],"erkl":"Das Marktformenschema kombiniert die Zahl der Anbieter (einer, wenige, viele) mit der Zahl der Nachfrager. „Mono“ steht für einen, „Oligo“ für wenige, „Poly“ für viele Marktteilnehmer.","norm":"VWL: Marktformen","id":"3.2-1-2"},{"typ":"mehr","frage":"Welche zwei Merkmale gehören zum Modell des vollkommenen Marktes?","optionen":["Die Güter sind homogen, also völlig gleichartig.","Alle Marktteilnehmer haben vollständige Markttransparenz.","Käufer bevorzugen Anbieter, die nahe am Wohnort liegen.","Anbieter reagieren erst nach einigen Wochen auf Preisänderungen.","Stammkunden erhalten besondere persönliche Konditionen."],"richtig":[0,1],"erkl":"Der vollkommene Markt setzt homogene Güter, vollständige Markttransparenz, keine Präferenzen, sofortige Reaktion und einen Punktmarkt voraus. Räumliche oder persönliche Vorlieben und verzögerte Reaktionen machen einen Markt unvollkommen.","norm":"VWL: Marktformen","id":"3.2-1-3"},{"typ":"mc","frage":"Warum ist der Versicherungsmarkt ein unvollkommener Markt?","optionen":["Tarife und Bedingungen unterscheiden sich, und Kunden haben Präferenzen.","Es gibt nur einen einzigen Anbieter, der den Preis allein festlegt.","Alle Versicherer bieten völlig gleiche Produkte zum gleichen Preis an.","Der Staat setzt für alle Versicherungen einheitliche Höchstpreise fest."],"richtig":[0],"erkl":"Versicherungsprodukte sind nicht homogen (unterschiedliche Bedingungen und Leistungen), Kunden binden sich an Vermittler oder Marken, und die Markttransparenz ist eingeschränkt. Damit fehlen wesentliche Bedingungen des vollkommenen Marktes.","norm":"VWL: Marktformen","id":"3.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie die Beispiele der passenden Art von Präferenz zu.","paare":[["Ein Kunde schließt beim Vermittler ab, den er aus dem Sportverein kennt.","Persönliche Präferenz"],["Eine Kundin wählt die Agentur direkt gegenüber ihrer Wohnung.","Räumliche Präferenz"],["Ein Käufer bevorzugt eine Marke, weil er sie für hochwertiger hält.","Sachliche Präferenz"],["Ein Kunde wählt den Anbieter, der am schnellsten liefert.","Zeitliche Präferenz"]],"erkl":"Präferenzen sind Vorlieben, die nicht auf dem Preis beruhen. Sie können an Personen, Orten, (vermeintlichen) Qualitätsunterschieden oder an Zeit (Lieferzeit, Öffnungszeiten) hängen.","norm":"VWL: Marktformen","id":"3.2-1-5"},{"typ":"mc","frage":"Welches Verhalten ist für Anbieter in einem Angebotsoligopol typisch?","optionen":["Sie beobachten einander genau und folgen oft einem Preisführer.","Sie setzen den Preis ohne Rücksicht auf Konkurrenten allein fest.","Sie müssen den Marktpreis als feste, unveränderliche Größe hinnehmen.","Sie sprechen ihre Preise rechtmäßig miteinander ab, um Verluste zu vermeiden."],"richtig":[0],"erkl":"Im Oligopol löst jede Preisänderung eines Anbieters Reaktionen der wenigen Konkurrenten aus; deshalb orientieren sie sich oft an einem Preisführer oder liefern sich einen ruinösen Preiskampf. Preisabsprachen sind als Kartell verboten.","norm":"VWL: Marktformen","id":"3.2-1-6"},{"typ":"mc","frage":"Drei Baustoffhändler einer Region vereinbaren, ihre Preise für Zement gemeinsam um 10 % anzuheben. Wie ist diese Absprache zu beurteilen?","optionen":["Sie ist als Kartell grundsätzlich verboten.","Sie ist erlaubt, solange alle Beteiligten zustimmen.","Sie ist erlaubt, wenn die Händler sie schriftlich festhalten.","Sie ist nur verboten, wenn ein Händler Marktführer ist."],"richtig":[0],"erkl":"§ 1 GWB verbietet Vereinbarungen zwischen Unternehmen, die den Wettbewerb verhindern, einschränken oder verfälschen; Preisabsprachen sind der Kernfall. Das Bundeskartellamt kann dafür Bußgelder verhängen.","norm":"§ 1 GWB","id":"3.2-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die Auszubildende Lea Hoffmann der PROXIMUS Versicherung AG in Halle (Saale) liest ihrem Ausbilder Herrn Nowak eine Pressemeldung vor: Zwei große Hersteller von Wärmepumpen wollen zu einem Unternehmen verschmelzen; zusammen hätten sie in Deutschland einen Marktanteil von über 50 %. Die zuständige Wettbewerbsbehörde prüft den Fall. Lea soll dazu eine kurze Übersicht für die Azubi-Runde erstellen.","items":[{"typ":"mc","frage":"Um welche Art des Unternehmenszusammenschlusses handelt es sich bei den beiden Wärmepumpenherstellern?","optionen":["Horizontaler Zusammenschluss","Vertikaler Zusammenschluss","Diagonaler Zusammenschluss","Kooperation in Form eines Kartells"],"richtig":[0],"erkl":"Beide Unternehmen gehören derselben Branche und derselben Produktionsstufe an – das ist ein horizontaler Zusammenschluss. Vertikal wäre z. B. Hersteller mit Zulieferer, diagonal ein Zusammenschluss verschiedener Branchen.","norm":"VWL: Marktformen","id":"3.2-2-1"},{"typ":"mc","frage":"Welche Behörde prüft in Deutschland, ob ein solcher Zusammenschluss wirksamen Wettbewerb erheblich behindert, und kann ihn untersagen?","optionen":["Das Bundeskartellamt im Rahmen der Fusionskontrolle","Die IHK als Selbstverwaltung der Wirtschaft","Die Europäische Zentralbank als Wettbewerbshüterin","Das Amtsgericht im Rahmen des Handelsregisters"],"richtig":[0],"erkl":"Zusammenschlüsse oberhalb bestimmter Umsatzschwellen müssen beim Bundeskartellamt angemeldet werden. Es untersagt sie, wenn sie wirksamen Wettbewerb erheblich behindern würden, etwa durch eine marktbeherrschende Stellung.","norm":"§§ 35, 36 GWB","id":"3.2-2-2"},{"typ":"zuo","frage":"Lea erstellt eine Übersicht. Ordnen Sie die Beschreibungen der richtigen Form der Unternehmensverbindung zu.","paare":[["Unternehmen bleiben selbstständig, sprechen aber ihre Preise ab","Kartell"],["Unternehmen bleiben rechtlich selbstständig, stehen aber unter einheitlicher Leitung","Konzern"],["Unternehmen verschmelzen zu einem einzigen Unternehmen","Fusion"]],"erkl":"Beim Kartell bleiben die Unternehmen rechtlich und wirtschaftlich selbstständig und koordinieren nur ihr Marktverhalten. Im Konzern verlieren sie die wirtschaftliche Selbstständigkeit, bei der Fusion auch die rechtliche.","norm":"VWL: Marktformen","id":"3.2-2-3"},{"typ":"mc","frage":"Lea fragt, warum der Staat marktbeherrschende Unternehmen besonders beobachtet. Welche Gefahr besteht, wenn ein Anbieter kaum Konkurrenz hat?","optionen":["Er kann überhöhte Preise verlangen, weil Kunden kaum ausweichen können.","Er muss den Marktpreis als gegeben hinnehmen und kann nichts ändern.","Er muss jeden Preis akzeptieren, den die Nachfrager ihm vorgeben.","Er ist verpflichtet, seine Preise vorab vom Staat genehmigen zu lassen."],"richtig":[0],"erkl":"Ein Monopolist wählt auf seiner Preis-Absatz-Funktion selbst den gewinnmaximalen Preis, der meist über dem Preis bei Wettbewerb liegt. Deshalb unterliegen marktbeherrschende Unternehmen der Missbrauchsaufsicht des Bundeskartellamts.","norm":"§ 19 GWB","id":"3.2-2-4"}]}]},{"nr":"3.3","titel":"Wirtschaftskreislauf und Bruttoinlandsprodukt","lf":"Sozialkunde / LF 13","buch":"VWL: VGR","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Vorgänge im Wirtschaftskreislauf dem passenden Begriff zu.","paare":[["Haushalte stellen den Unternehmen ihre Arbeitskraft zur Verfügung","Faktorleistung (Güterstrom)"],["Unternehmen zahlen Löhne und Gehälter an die Haushalte","Faktoreinkommen (Geldstrom)"],["Der Staat zahlt Kindergeld an Familien","Transferzahlung"],["Der Staat zahlt einem Landwirtschaftsbetrieb einen Zuschuss","Subvention"],["Haushalte legen einen Teil ihres Einkommens bei der Bank an","Sparen"]],"erkl":"Jedem Güterstrom (Arbeit, Waren) steht ein Geldstrom in Gegenrichtung gegenüber. Transfers fließen vom Staat an Haushalte, Subventionen an Unternehmen – jeweils ohne direkte Gegenleistung; Ersparnisse fließen über die Banken in Investitionen.","norm":"VWL: VGR","id":"3.3-1-1"},{"typ":"mc","frage":"Welche Definition des Bruttoinlandsprodukts (BIP) ist zutreffend?","optionen":["Wert aller im Inland in einem Zeitraum hergestellten Endprodukte zu Marktpreisen","Wert aller Einkommen, die Inländer in einem Jahr weltweit erzielt haben","Summe aller Umsätze inländischer Unternehmen einschließlich aller Vorleistungen","Wert aller im Inland vorhandenen Vermögensgegenstände am Ende eines Jahres"],"richtig":[0],"erkl":"Das BIP misst die Produktion im Inland (Inlandskonzept) in einem Zeitraum. Vorleistungen werden abgezogen, damit nichts doppelt gezählt wird; Vermögensbestände sind keine Produktion.","norm":"VWL: VGR","id":"3.3-1-2"},{"typ":"mc","frage":"Worin unterscheidet sich das Bruttonationaleinkommen (BNE) vom Bruttoinlandsprodukt (BIP)?","optionen":["Es erfasst Einkommen der Inländer, auch wenn sie im Ausland entstehen.","Es erfasst nur die Produktion staatlicher Unternehmen im Inland.","Es erfasst alle Leistungen, die innerhalb der Landesgrenzen entstehen.","Es erfasst nur Waren, Dienstleistungen bleiben dabei unberücksichtigt."],"richtig":[0],"erkl":"Das BIP folgt dem Inlandskonzept (Wo wurde produziert?), das BNE dem Inländerkonzept (Wer hat das Einkommen erzielt?). Einkommen von Inländern aus dem Ausland zählen zum BNE, Einkommen von Ausländern im Inland dagegen nicht.","norm":"VWL: VGR","id":"3.3-1-3"},{"typ":"zahl","frage":"Eine Bäckerei stellt im Jahr Backwaren im Wert von 480.000 € her und verkauft sie vollständig. Für Mehl, Energie und andere Vorleistungen zahlt sie 190.000 €. Berechnen Sie die Bruttowertschöpfung der Bäckerei.","wert":290000,"einheit":"€","tol":0.01,"erkl":"Wertschöpfung = Produktionswert – Vorleistungen = 480.000 € – 190.000 € = 290.000 €. Die Vorleistungen wurden bereits bei den Lieferanten als deren Wertschöpfung erfasst.","norm":"VWL: VGR","id":"3.3-1-4"},{"typ":"mc","frage":"Was gibt die Lohnquote an?","optionen":["Den Anteil der Arbeitnehmerentgelte am Volkseinkommen","Den Anteil der Erwerbstätigen an der Gesamtbevölkerung","Den Anteil der Lohnsteuer an allen Steuereinnahmen","Den Anstieg der Tariflöhne gegenüber dem Vorjahr"],"richtig":[0],"erkl":"Die Verteilungsrechnung teilt das Volkseinkommen in Arbeitnehmerentgelte sowie Unternehmens- und Vermögenseinkommen auf. Die Lohnquote ist der Anteil der Arbeitnehmerentgelte daran.","norm":"VWL: VGR","id":"3.3-1-5"},{"typ":"mc","frage":"Welcher Vorgang erhöht das BIP, obwohl der Wohlstand dadurch nicht steigt?","optionen":["Reparaturen an Häusern nach einem schweren Unwetter","Ehrenamtliche Betreuung von Kindern im Sportverein","Pflege eines Angehörigen durch die eigene Tochter","Renovierung der eigenen Wohnung in Eigenarbeit"],"richtig":[0],"erkl":"Bezahlte Reparaturen sind Marktleistungen und erhöhen das BIP, stellen aber nur den alten Zustand wieder her. Ehrenamt, Pflege in der Familie und Eigenarbeit sind unbezahlt und fehlen im BIP – eine Grenze des BIP als Wohlstandsmaß.","norm":"VWL: VGR","id":"3.3-1-6"},{"typ":"wf","frage":"Beurteilen Sie die Aussagen zur Volkswirtschaftlichen Gesamtrechnung.","aussagen":[["Der Außenbeitrag ist die Differenz aus Exporten und Importen.",true],["Vorleistungen werden im BIP zusätzlich zu den Endprodukten gezählt.",false],["Das reale BIP ist um Preisveränderungen bereinigt.",true],["Die Verwendungsrechnung zeigt, welche Einkommen Arbeitnehmer und Unternehmen erzielen.",false]],"erkl":"Vorleistungen werden nicht mitgezählt, sonst würde doppelt gerechnet. Die Einkommen zeigt die Verteilungsrechnung; die Verwendungsrechnung zeigt Konsum, Investitionen und Außenbeitrag.","norm":"VWL: VGR","id":"3.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Für die Mitarbeiterzeitschrift der PROXIMUS Versicherung AG in Halle (Saale) bereitet die Auszubildende Sofia Marković mit ihrem Ausbilder Herrn Krüger Zahlen eines Modelllandes auf (in Mrd. €): private Konsumausgaben 2.200, Konsumausgaben des Staates 950, Bruttoinvestitionen 900, Exporte 1.700, Importe 1.550. Das Land hat 50 Mio. Einwohner. Im Vorjahr betrug das nominale BIP 4.000 Mrd. €; das Preisniveau ist gegenüber dem Vorjahr um 2 % gestiegen.","items":[{"typ":"mc","frage":"Wie hoch ist der Außenbeitrag des Modelllandes, und was bedeutet er?","optionen":["+150 Mrd. €; das Land exportiert mehr, als es importiert.","–150 Mrd. €; das Land importiert mehr, als es exportiert.","+3.250 Mrd. €;
