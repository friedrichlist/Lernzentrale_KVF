 Exporte und Importe werden addiert.","+150 Mrd. €; das Land importiert mehr, als es exportiert."],"richtig":[0],"erkl":"Außenbeitrag = Exporte – Importe = 1.700 – 1.550 = +150 Mrd. €. Ein positiver Außenbeitrag bedeutet einen Exportüberschuss.","norm":"VWL: VGR","id":"3.3-2-1"},{"typ":"zahl","frage":"Berechnen Sie das BIP des Modelllandes nach der Verwendungsrechnung.","wert":4200,"einheit":"Mrd. €","tol":0.01,"erkl":"BIP = private Konsumausgaben + Staatskonsum + Bruttoinvestitionen + Außenbeitrag = 2.200 + 950 + 900 + (1.700 – 1.550) = 4.200 Mrd. €.","norm":"VWL: VGR","id":"3.3-2-2"},{"typ":"zahl","frage":"Das nominale BIP ist von 4.000 Mrd. € im Vorjahr auf 4.200 Mrd. € gestiegen, das Preisniveau um 2 %. Berechnen Sie näherungsweise das reale Wachstum in Prozent (reales Wachstum ≈ nominales Wachstum – Preisanstieg).","wert":3,"einheit":"%","tol":0.1,"erkl":"Nominales Wachstum: 200 : 4.000 × 100 = 5 %. Real ≈ 5 % – 2 % = 3 %, weil ein Teil des Anstiegs nur auf höheren Preisen beruht (genau: 1,05 : 1,02 – 1 ≈ 2,9 %).","norm":"VWL: VGR","id":"3.3-2-3"},{"typ":"zahl","frage":"Gehen Sie von einem BIP von 4.200 Mrd. € aus. Berechnen Sie das BIP pro Kopf der 50 Mio. Einwohner.","wert":84000,"einheit":"€","tol":0.01,"erkl":"BIP pro Kopf = BIP : Einwohner = 4.200.000.000.000 € : 50.000.000 = 84.000 €. Der Pro-Kopf-Wert macht Länder unterschiedlicher Größe vergleichbar.","norm":"VWL: VGR","id":"3.3-2-4"}]}]},{"nr":"3.4","titel":"Konjunktur und Wirtschaftspolitik","lf":"Sozialkunde / LF 13","buch":"StabG § 1; VWL: Konjunktur","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie die Merkmale der passenden Konjunkturphase zu.","paare":[["Auftragseingänge und Produktion steigen, die Arbeitslosigkeit beginnt zu sinken","Aufschwung (Expansion)"],["Kapazitäten voll ausgelastet, Preise und Zinsen steigen stark","Hochkonjunktur (Boom)"],["Produktion und Investitionen gehen zurück, Lagerbestände wachsen","Abschwung (Rezession)"],["Hohe Arbeitslosigkeit, geringe Auslastung, niedrige Zinsen","Tiefstand (Depression)"]],"erkl":"Die Phasen unterscheiden sich vor allem in Kapazitätsauslastung, Beschäftigung, Preisen und Zinsen. Im Boom ist die Nachfrage größer als die Kapazitäten, im Tiefstand bleiben Kapazitäten und Arbeitskräfte ungenutzt.","norm":"VWL: Konjunktur","id":"3.4-1-1"},{"typ":"mc","frage":"Welcher der folgenden Werte ist ein Frühindikator der Konjunktur?","optionen":["Baugenehmigungen","Arbeitslosenquote","Kapazitätsauslastung","Tariflohnentwicklung"],"richtig":[0],"erkl":"Frühindikatoren wie Baugenehmigungen, Auftragseingänge oder das ifo-Geschäftsklima zeigen die künftige Entwicklung an. Die Kapazitätsauslastung beschreibt die Gegenwart (Präsenzindikator), Arbeitslosenquote und Tariflöhne reagieren erst später (Spätindikatoren).","norm":"VWL: Konjunktur","id":"3.4-1-2"},{"typ":"mehr","frage":"Welche zwei Ziele gehören zum magischen Viereck nach dem Stabilitäts- und Wachstumsgesetz?","optionen":["Stabilität des Preisniveaus","Hoher Beschäftigungsstand","Gerechte Einkommensverteilung","Ausgeglichener Staatshaushalt","Erhaltung einer lebenswerten Umwelt"],"richtig":[0,1],"erkl":"§ 1 StabG nennt Stabilität des Preisniveaus, hohen Beschäftigungsstand, außenwirtschaftliches Gleichgewicht sowie stetiges und angemessenes Wachstum. Gerechte Verteilung und Umweltschutz erweitern das Viereck zum magischen Sechseck.","norm":"§ 1 StabG","id":"3.4-1-3"},{"typ":"mc","frage":"Welches Zielpaar steht typischerweise in Zielharmonie?","optionen":["Stetiges Wachstum und hoher Beschäftigungsstand","Stabiles Preisniveau und hoher Beschäftigungsstand","Starkes Wachstum und Erhaltung der Umwelt","Stabiles Preisniveau und starkes Wirtschaftswachstum"],"richtig":[0],"erkl":"Wächst die Wirtschaft, brauchen Unternehmen mehr Arbeitskräfte – beide Ziele fördern sich. Hohe Beschäftigung und starkes Wachstum treiben dagegen oft die Preise, starkes Wachstum belastet die Umwelt (Zielkonflikte).","norm":"§ 1 StabG","id":"3.4-1-4"},{"typ":"mc","frage":"Die Wirtschaft befindet sich in einer Rezession. Welche Maßnahme entspricht einer antizyklischen Fiskalpolitik?","optionen":["Der Staat erhöht seine Investitionen und nimmt dafür notfalls Kredite auf.","Der Staat erhöht die Steuern, um den Haushalt rasch auszugleichen.","Der Staat kürzt seine Ausgaben und bildet eine Konjunkturrücklage.","Der Staat verschlechtert die Abschreibungsmöglichkeiten für Betriebe."],"richtig":[0],"erkl":"Antizyklisch (nach Keynes) heißt: in der Rezession Nachfrage stützen – mehr Staatsausgaben, Steuersenkungen, notfalls auf Kredit (deficit spending); im Boom Ausgaben kürzen und Rücklagen bilden. Probleme sind Wirkungsverzögerungen, steigende Staatsschulden und die Grenzen der Schuldenbremse.","norm":"VWL: Konjunktur","id":"3.4-1-5"},{"typ":"zuo","frage":"Ordnen Sie die Fälle der passenden Art von Arbeitslosigkeit zu.","paare":[["Ein Maurer ist im Januar wegen Frost ohne Arbeit","Saisonale Arbeitslosigkeit"],["Eine Bürokauffrau sucht nach einem Umzug einige Wochen eine neue Stelle","Friktionelle Arbeitslosigkeit"],["In einer Rezession entlassen viele Betriebe wegen fehlender Aufträge","Konjunkturelle Arbeitslosigkeit"],["Durch Digitalisierung fallen in einer Branche dauerhaft Stellen weg","Strukturelle Arbeitslosigkeit"]],"erkl":"Die Art richtet sich nach der Ursache: Jahreszeit (saisonal), Wechsel zwischen zwei Stellen (friktionell), schwache Gesamtnachfrage (konjunkturell) oder dauerhafter Wandel von Branchen und Qualifikationen (strukturell).","norm":"VWL: Konjunktur","id":"3.4-1-6"},{"typ":"zahl","frage":"Der Verbraucherpreisindex (Basisjahr = 100) stieg in einem Modelljahr von 118,4 auf 121,9 Punkte. Berechnen Sie die Inflationsrate in Prozent (auf eine Nachkommastelle gerundet).","wert":3.0,"einheit":"%","tol":0.05,"erkl":"Inflationsrate = (121,9 – 118,4) : 118,4 × 100 ≈ 2,96 % ≈ 3,0 %. Maßgeblich ist die prozentuale Veränderung, nicht die Differenz der Indexpunkte; der Index misst die Preise eines festen Warenkorbs.","norm":"VWL: Konjunktur","id":"3.4-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Ausbilderin Frau Schulze bespricht mit der Auszubildenden Mia Baumann der PROXIMUS Versicherung AG in Halle (Saale) eine Pressemeldung: Das BIP ist im zweiten und im dritten Quartal jeweils gegenüber dem Vorquartal gesunken, viele Betriebe melden Kurzarbeit an. Gleichzeitig liegt die Inflationsrate bei 4 %, vor allem wegen stark gestiegener Energiepreise. Mias monatliche Ausbildungsvergütung von 1.040 € ist im Vergleich zum Vorjahr unverändert.","items":[{"typ":"mc","frage":"Warum spricht die Pressemeldung von einer (technischen) Rezession?","optionen":["Weil das BIP in zwei aufeinanderfolgenden Quartalen gesunken ist.","Weil die Inflationsrate über dem Zielwert von 2 % liegt.","Weil die Zahl der Kurzarbeiter in einem Quartal gestiegen ist.","Weil das BIP langsamer wächst als im Durchschnitt der Vorjahre."],"richtig":[0],"erkl":"Von einer technischen Rezession spricht man, wenn das (preisbereinigte) BIP zwei Quartale in Folge gegenüber dem Vorquartal sinkt. Ein bloß langsameres Wachstum oder eine hohe Inflation reichen dafür nicht.","norm":"VWL: Konjunktur","id":"3.4-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Kaufkraft von Mias Vergütung in Preisen des Vorjahres (Realeinkommen).","wert":1000,"einheit":"€","tol":0.01,"erkl":"Realeinkommen = Nominaleinkommen : (1 + Inflationsrate) = 1.040 € : 1,04 = 1.000 €. Mia kann sich also nur noch so viel kaufen wie im Vorjahr für 1.000 €.","norm":"VWL: Konjunktur","id":"3.4-2-2"},{"typ":"mc","frage":"Um welche Art von Inflation handelt es sich nach der Begründung in der Meldung vorrangig?","optionen":["Angebotsseitige Inflation durch gestiegene Kosten","Nachfrageseitige Inflation durch hohe Konsumausgaben","Nachfrageseitige Inflation durch hohe Staatsausgaben","Deflation durch sinkende Energie- und Rohstoffpreise"],"richtig":[0],"erkl":"Steigende Energiepreise erhöhen die Produktionskosten, die Unternehmen an die Kunden weitergeben (Kosten- bzw. angebotsseitige Inflation). Eine Nachfrageinflation passt nicht zu einer Rezession mit sinkender Gesamtnachfrage.","norm":"VWL: Konjunktur","id":"3.4-2-3"},{"typ":"wf","frage":"Mia notiert sich einige Aussagen zur Lage. Beurteilen Sie diese.","aussagen":[["Bei unerwarteter Inflation verlieren Gläubiger, weil das zurückgezahlte Geld weniger wert ist.",true],["Kurzarbeitergeld wird von der Agentur für Arbeit gezahlt und soll Entlassungen vermeiden.",true],["Eine angebotsorientierte Politik setzt vor allem auf höhere Staatsausgaben auf Kredit.",false],["Deflation bezeichnet einen nur langsameren Anstieg des Preisniveaus.",false]],"erkl":"Inflation entwertet Geldforderungen – Schuldner gewinnen, Gläubiger verlieren. Angebotsorientierte Politik verbessert die Bedingungen der Unternehmen (Steuern, Bürokratie, Flexibilisierung); Deflation ist ein sinkendes Preisniveau, ein nur langsamerer Anstieg heißt Disinflation.","norm":"VWL: Konjunktur; §§ 95 ff. SGB III","id":"3.4-2-4"}]}]},{"nr":"3.5","titel":"Europäische Zentralbank und Geldpolitik","lf":"Sozialkunde / LF 13","buch":"AEUV Art. 127, 130; EZB","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welches Gremium entscheidet im Eurosystem über die Leitzinsen?","optionen":["Der EZB-Rat","Das Europäische Parlament","Der Vorstand der Deutschen Bundesbank","Der Rat der EU-Finanzminister"],"richtig":[0],"erkl":"Der EZB-Rat besteht aus dem Direktorium der EZB und den Präsidentinnen und Präsidenten der nationalen Zentralbanken des Euroraums. Er legt die Geldpolitik fest; die nationalen Zentralbanken wie die Deutsche Bundesbank setzen sie um.","norm":"EZB: Eurosystem","id":"3.5-1-1"},{"typ":"mc","frage":"Welches Ziel verfolgt das Eurosystem nach dem AEU-Vertrag vorrangig?","optionen":["Die Gewährleistung der Preisstabilität","Die Sicherung der Vollbeschäftigung","Ein möglichst hohes Wirtschaftswachstum","Ein stabiler Wechselkurs zum US-Dollar"],"richtig":[0],"erkl":"Art. 127 Abs. 1 AEUV nennt die Preisstabilität als vorrangiges Ziel. Nur soweit dies ohne Beeinträchtigung dieses Ziels möglich ist, unterstützt das Eurosystem die allgemeine Wirtschaftspolitik der EU.","norm":"Art. 127 Abs. 1 AEUV","id":"3.5-1-2"},{"typ":"mc","frage":"Wie konkretisiert die EZB seit ihrer Strategieüberprüfung 2021 das Ziel der Preisstabilität?","optionen":["Inflationsrate von 2 % mittelfristig, Abweichungen nach oben und unten gleich unerwünscht","Inflationsrate unter, aber nahe 2 %, Abweichungen nach oben besonders unerwünscht","Inflationsrate von genau 0 %, jede Preisänderung gilt als unerwünscht","Inflationsrate von 3 % jährlich, die in jedem Monat einzuhalten ist"],"richtig":[0],"erkl":"Seit 2021 strebt die EZB mittelfristig 2 % an und behandelt Unter- und Überschreitungen gleich (symmetrisches Ziel). „Unter, aber nahe 2 %“ war die frühere Formulierung; gemessen wird mit dem HVPI für den Euroraum.","norm":"EZB: geldpolitische Strategie","id":"3.5-1-3"},{"typ":"wf","frage":"Beurteilen Sie die Aussagen zur Stellung der EZB.","aussagen":[["Die EZB darf keine Weisungen von Regierungen der Mitgliedstaaten entgegennehmen.",true],["Die EZB darf Staaten direkt Kredite gewähren, wenn deren Haushalt ein Defizit aufweist.",false],["Die EZB hat ihren Sitz in Frankfurt am Main.",true],["Die Deutsche Bundesbank gehört nicht zum Eurosystem, weil sie eine nationale Behörde ist.",false]],"erkl":"Art. 130 AEUV sichert die Unabhängigkeit, Art. 123 AEUV verbietet die monetäre Staatsfinanzierung. Das Eurosystem besteht aus der EZB und den nationalen Zentralbanken der Euro-Länder, also auch der Deutschen Bundesbank.","norm":"Art. 123, 130 AEUV","id":"3.5-1-4"},{"typ":"zuo","frage":"Ordnen Sie die Beschreibungen dem passenden geldpolitischen Instrument zu.","paare":[["Zinssatz, zu dem sich Banken regelmäßig für eine Woche Liquidität bei der Zentralbank leihen","Hauptrefinanzierungssatz"],["Zinssatz für Guthaben, die Banken über Nacht bei der Zentralbank anlegen","Einlagefazilität"],["Zinssatz, zu dem sich Banken kurzfristig über Nacht Geld bei der Zentralbank leihen können","Spitzenrefinanzierungsfazilität"],["Pflicht, 1 % bestimmter Verbindlichkeiten als Guthaben bei der Zentralbank zu halten","Mindestreserve"]],"erkl":"Die drei Leitzinsen bilden einen Zinskorridor: Einlagefazilität als Untergrenze, Spitzenrefinanzierungsfazilität als Obergrenze, dazwischen der Hauptrefinanzierungssatz. Die Mindestreserve verpflichtet Banken zu Guthaben bei der Zentralbank.","norm":"EZB: geldpolitische Instrumente","id":"3.5-1-5"},{"typ":"mc","frage":"Die EZB erhöht die Leitzinsen. Welche Wirkungskette ist zu erwarten?","optionen":["Kredite werden teurer, die Nachfrage sinkt, der Preisdruck lässt nach.","Kredite werden billiger, die Nachfrage steigt, die Inflation sinkt.","Sparen wird unattraktiver, der Konsum steigt, die Preise sinken.","Kredite werden teurer, die Nachfrage steigt, die Inflation nimmt zu."],"richtig":[0],"erkl":"Höhere Leitzinsen verteuern die Refinanzierung der Banken; sie geben das über höhere Kreditzinsen weiter, Sparen wird attraktiver. Konsum und Investitionen gehen zurück, die gesamtwirtschaftliche Nachfrage sinkt und mit ihr der Preisauftrieb.","norm":"EZB: geldpolitische Instrumente","id":"3.5-1-6"},{"typ":"mc","frage":"Die EZB kauft im Rahmen eines Ankaufprogramms in großem Umfang Anleihen am Kapitalmarkt. Welche Wirkung wird damit beabsichtigt?","optionen":["Langfristige Zinsen sinken; Kredite und Investitionen werden gefördert.","Die langfristigen Zinsen steigen, damit Sparen attraktiver wird.","Die Geldmenge sinkt, damit die Inflation schnell zurückgeht.","Die Banken müssen höhere Mindestreserven bei der Zentralbank halten."],"richtig":[0],"erkl":"Die zusätzliche Nachfrage nach Anleihen treibt deren Kurse nach oben und drückt die Renditen, also die langfristigen Zinsen. Billigere Finanzierung soll Investitionen und Konsum anregen – das wirkt wie eine Lockerung der Geldpolitik.","norm":"EZB: geldpolitische Instrumente","id":"3.5-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Kunde Jan Petersen kommt in die Agentur der PROXIMUS Versicherung AG in Halle (Saale) und spricht die Auszubildende Aylin Demir an: In der Zeitung stehe, die EZB habe die Leitzinsen deutlich erhöht, und der Euro habe gegenüber dem US-Dollar an Wert gewonnen. Er möchte wissen, was das für sein Tagesgeldkonto, die geplante Baufinanzierung seines Hauses und seine kapitalbildende Lebensversicherung bedeutet.","items":[{"typ":"mc","frage":"Was bedeutet die Leitzinserhöhung tendenziell für Herrn Petersens geplante Baufinanzierung?","optionen":["Neue Darlehen werden teurer, weil Banken sich teurer refinanzieren.","Neue Darlehen werden billiger, weil Banken mehr Liquidität haben.","Die Darlehenszinsen bleiben gleich, weil sie gesetzlich festgelegt sind.","Neue Darlehen sind nicht mehr zulässig, solange der Leitzins steigt."],"richtig":[0],"erkl":"Steigende Leitzinsen erhöhen die Refinanzierungskosten der Banken und das allgemeine Zinsniveau. Neue Baukredite werden dadurch tendenziell teurer; Kreditzinsen legen die Banken selbst fest.","norm":"EZB: geldpolitische Instrumente","id":"3.5-2-1"},{"typ":"mc","frage":"Wie wirkt sich die Leitzinserhöhung tendenziell auf sein Tagesgeldkonto aus?","optionen":["Banken heben die Tagesgeldzinsen eher an, Sparen wird attraktiver.","Banken senken die Tagesgeldzinsen, weil Kredite teurer werden.","Tagesgeld wird nicht mehr verzinst, weil die EZB es verbietet.","Die Tagesgeldzinsen sind fest an die Inflationsrate gekoppelt."],"richtig":[0],"erkl":"Banken erhalten selbst höhere Zinsen für Einlagen bei der Zentralbank und konkurrieren um Kundengelder. Deshalb steigen die Zinsen für Tagesgeld tendenziell – ein gewollter Anreiz, mehr zu sparen und weniger zu konsumieren.","norm":"EZB: geldpolitische Instrumente","id":"3.5-2-2"},{"typ":"mc","frage":"Warum profitieren Lebensversicherer und ihre Kunden langfristig von einem höheren Zinsniveau?","optionen":["Neue Kapitalanlagen in Anleihen bringen höhere laufende Erträge.","Die Kunden müssen dadurch automatisch geringere Beiträge zahlen.","Der Staat garantiert bei hohen Zinsen eine höhere Mindestrente.","Bestehende Anleihen gewinnen bei steigenden Zinsen an Kurswert."],"richtig":[0],"erkl":"Lebensversicherer legen die Beiträge überwiegend in festverzinslichen Wertpapieren an; neue Anlagen bringen bei höherem Zinsniveau mehr Ertrag, der den Kunden über die Überschussbeteiligung zugutekommen kann. Bereits gehaltene Anleihen verlieren dagegen zunächst an Kurswert.","norm":"EZB: geldpolitische Instrumente","id":"3.5-2-3"},{"typ":"mc","frage":"Herr Petersen fragt, warum der Euro nach der Zinserhöhung an Wert gewonnen hat. Welche Erklärung ist fachlich richtig?","optionen":["Anlagen in Euro werden für ausländische Anleger attraktiver.","Die EZB legt den Wechselkurs des Euro nach jeder Sitzung fest.","Höhere Zinsen verringern die Nachfrage nach Euro am Devisenmarkt.","Exporte aus dem Euroraum werden dadurch automatisch billiger."],"richtig":[0],"erkl":"Höhere Zinsen im Euroraum locken Kapital aus dem Ausland an; dafür wird Euro nachgefragt, und der Euro wertet tendenziell auf. Der Wechselkurs bildet sich am Devisenmarkt; ein stärkerer Euro verteuert Exporte eher.","norm":"EZB: geldpolitische Instrumente","id":"3.5-2-4"}]}]}]},{"nr":"4","titel":"Recht und Unternehmen","lf":"ca. 20 % der WISO","abschnitte":[{"nr":"4.1","titel":"Rechtsfähigkeit und Geschäftsfähigkeit","lf":"LF 2 / Sozialkunde","buch":"BGB §§ 1, 21 ff., 104–113","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ab wann ist ein Mensch nach dem BGB rechtsfähig, kann also Träger von Rechten und Pflichten sein?","optionen":["Mit der Vollendung des siebten Lebensjahres","Mit der Vollendung der Geburt","Mit der Eintragung in das Geburtenregister","Mit der Vollendung des 18. Lebensjahres"],"richtig":[1],"erkl":"Nach § 1 BGB beginnt die Rechtsfähigkeit des Menschen mit der Vollendung der Geburt und endet mit dem Tod. Das Alter ist erst für die Geschäftsfähigkeit wichtig, die Eintragung ins Register hat nur beurkundende Bedeutung.","norm":"§ 1 BGB","id":"4.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Rechtssubjekt die passende Einordnung zu.","paare":[["Auszubildende Lea Hoffmann, 17 Jahre","Natürliche Person"],["PROXIMUS Versicherung AG","Juristische Person des Privatrechts"],["Industrie- und Handelskammer","Körperschaft des öffentlichen Rechts"],["Öffentlich-rechtliche Rundfunkanstalt","Anstalt des öffentlichen Rechts"]],"erkl":"Jeder Mensch ist eine natürliche Person. Juristische Personen des Privatrechts (z. B. AG, GmbH, eingetragener Verein) entstehen durch Gründung nach Privatrecht; Kammern und Gemeinden sind mitgliedschaftlich aufgebaute Körperschaften, Rundfunkanstalten sind Anstalten des öffentlichen Rechts.","norm":"§§ 1, 21 BGB; § 1 AktG","id":"4.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Willenserklärung die zutreffende Rechtsfolge zu.","paare":[["Mia (6 Jahre) kauft am Kiosk ein Eis für 2 €.","Nichtig, weil Mia wegen ihres Alters geschäftsunfähig ist"],["Jonas (15 Jahre) kauft ohne Wissen der Eltern eine Spielkonsole auf Raten.","Schwebend unwirksam bis zur Genehmigung der Eltern"],["Aylin (18 Jahre) schließt einen Mobilfunkvertrag über 24 Monate.","Wirksam, weil Aylin voll geschäftsfähig ist"],["Herr Brandt (52) mit dauerhafter krankhafter Störung der Geistestätigkeit unterschreibt einen Kreditvertrag.","Nichtig wegen dauerhafter krankhafter Störung"]],"erkl":"Wer unter 7 Jahre alt oder dauerhaft krankhaft gestört ist, ist geschäftsunfähig; seine Willenserklärung ist nichtig (§§ 104, 105 BGB). Minderjährige ab 7 Jahren sind beschränkt geschäftsfähig, ihre zustimmungsbedürftigen Verträge sind schwebend unwirksam (§§ 106, 108 BGB); mit 18 Jahren tritt die volle Geschäftsfähigkeit ein (§ 2 BGB).","norm":"§§ 2, 104–106, 108 BGB","id":"4.1-1-3"},{"typ":"mc","frage":"Die 16-jährige Clara schließt ohne Wissen ihrer Eltern verschiedene Geschäfte ab. Welches Geschäft ist ohne Zustimmung der Eltern wirksam?","optionen":["Sie tauscht ihr altes Fahrrad gegen eine gebrauchte Spielkonsole.","Sie nimmt 200 € an, die ihr die Patentante ohne Auflage schenkt.","Sie meldet sich in einem Fitnessstudio für zwölf Monate an.","Sie kauft ein Smartphone, das sie in 24 Monatsraten abzahlt."],"richtig":[1],"erkl":"Nach § 107 BGB braucht ein beschränkt Geschäftsfähiger keine Einwilligung, wenn er lediglich einen rechtlichen Vorteil erlangt. Das trifft auf eine Geldschenkung ohne Pflichten zu; beim Tausch verliert Clara ihr Fahrrad, bei Abo und Ratenkauf geht sie Zahlungspflichten ein.","norm":"§ 107 BGB","id":"4.1-1-4"},{"typ":"wf","frage":"Welche Aussagen zu den Regeln für beschränkt Geschäftsfähige treffen zu?","aussagen":[["Ein Vertrag gilt als von Anfang an wirksam, wenn der Minderjährige die Leistung vollständig mit ihm überlassenen Mitteln bewirkt.",true],["Ein Ratenkauf wird nach dem Taschengeldparagrafen wirksam, sobald die erste Rate aus dem Taschengeld bezahlt ist.",false],["Für den selbstständigen Betrieb eines Erwerbsgeschäfts braucht die Ermächtigung der Eltern die Genehmigung des Familiengerichts.",true],["Fordert der Verkäufer die Eltern zur Genehmigung auf und äußern sie sich zwei Wochen lang nicht, gilt der Vertrag als genehmigt.",false]],"erkl":"§ 110 BGB greift nur, wenn die Leistung vollständig mit überlassenen Mitteln bewirkt ist – bei Raten erst mit der letzten Zahlung. § 112 BGB verlangt die Genehmigung des Familiengerichts; nach § 108 Abs. 2 BGB gilt Schweigen der Eltern nach zwei Wochen als Verweigerung.","norm":"§§ 108 Abs. 2, 110, 112 BGB","id":"4.1-1-5"},{"typ":"mc","frage":"Die Eltern der 17-jährigen Nele ermächtigen sie, in den Sommerferien als Aushilfe in einem Café zu arbeiten. Welche Aussage trifft zu?","optionen":["Nele darf mit dem Lohn ohne Zustimmung auch einen Ratenkredit aufnehmen.","Die Eltern können die einmal erteilte Ermächtigung nicht mehr zurücknehmen.","Nele kann den Arbeitsvertrag selbst schließen und selbst kündigen.","Die Ermächtigung wird erst mit Genehmigung des Familiengerichts wirksam."],"richtig":[2],"erkl":"Nach § 113 BGB ist Nele für alle Geschäfte unbeschränkt geschäftsfähig, die Eingehung, Aufhebung und Erfüllung dieses Arbeitsverhältnisses betreffen. Ein Kredit gehört nicht dazu, die Eltern können die Ermächtigung zurücknehmen (Abs. 2), und eine Genehmigung des Familiengerichts verlangt nur § 112 BGB.","norm":"§ 113 BGB","id":"4.1-1-6"},{"typ":"mc","frage":"Welche Aussage zur Deliktsfähigkeit (Verantwortlichkeit für Schäden) nach § 828 BGB trifft zu?","optionen":["Wer jünger als sieben Jahre ist, ist für einen Schaden nicht verantwortlich.","Jugendliche ab 14 Jahren haften für jeden Schaden, ohne dass ihre Einsicht geprüft wird.","Die Verantwortlichkeit für Schäden beginnt wie die volle Geschäftsfähigkeit erst mit 18.","Kinder unter zehn Jahren haften auch für vorsätzlich verursachte Schäden niemals."],"richtig":[0],"erkl":"Kinder unter 7 Jahren sind nach § 828 Abs. 1 BGB nicht deliktsfähig. Zwischen 7 und 17 Jahren hängt die Haftung von der Einsichtsfähigkeit ab (Abs. 3); bei Unfällen mit Kraftfahrzeugen oder Bahnen haften Kinder unter 10 Jahren nur bei Vorsatz (Abs. 2).","norm":"§ 828 BGB","id":"4.1-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Finn Schulze (17) ist seit dem 1. August 2026 Auszubildender bei der PROXIMUS Versicherung AG in Halle (Saale); seine Eltern haben dem Ausbildungsvertrag zugestimmt. Im September schließt Finn ohne Wissen seiner Eltern drei Verträge: einen Handyvertrag mit 24 Monaten Laufzeit für 39,99 € monatlich, den Kauf eines Laptops für 960 € in zwölf Monatsraten, die er von seiner Ausbildungsvergütung zahlen will, und den Kauf eines gebrauchten Fahrrads für 150 €, das er sofort bar von seinem Taschengeld bezahlt, über das er frei verfügen darf.","items":[{"typ":"mc","frage":"Wie ist der Handyvertrag rechtlich zu beurteilen?","optionen":["Er ist wirksam, weil Finn die Gebühr aus seiner Vergütung zahlen kann.","Er ist nichtig, weil Finn als 17-Jähriger noch gar nicht handeln kann.","Er ist schwebend unwirksam, bis die Eltern ihn genehmigen.","Er ist wirksam, weil ein Handyvertrag ein Geschäft des täglichen Lebens ist."],"richtig":[2],"erkl":"Finn ist beschränkt geschäftsfähig; der Vertrag bringt ihm laufende Zahlungspflichten und damit nicht lediglich einen rechtlichen Vorteil. Ohne Einwilligung ist er nach § 108 BGB schwebend unwirksam; § 110 BGB hilft nicht, weil die Leistung über 24 Monate noch nicht bewirkt ist.","norm":"§§ 107, 108, 110 BGB","id":"4.1-2-1"},{"typ":"mc","frage":"Finn meint, durch die Zustimmung der Eltern zum Ausbildungsvertrag sei er für alle Geschäfte rund um seine Ausbildung voll geschäftsfähig. Welche Aussage trifft zu?","optionen":["Der Laptop dient der Ausbildung, daher ist der Kauf nach § 113 BGB wirksam.","Die Zustimmung deckt nur den Ausbildungsvertrag; § 113 BGB gilt dafür nicht.","Weil Finn ein eigenes Einkommen hat, ist er nach § 112 BGB voll geschäftsfähig.","Mit dem Ausbildungsvertrag ist Finn in allen Geldfragen voll geschäftsfähig."],"richtig":[1],"erkl":"Die Zustimmung der Eltern bezieht sich nur auf den Ausbildungsvertrag selbst. § 113 BGB wird auf Berufsausbildungsverhältnisse nicht angewendet, weil dort der Ausbildungszweck im Vordergrund steht; § 112 BGB betrifft nur den selbstständigen Betrieb eines Erwerbsgeschäfts.","norm":"§§ 107, 112, 113 BGB","id":"4.1-2-2"},{"typ":"zuo","frage":"Ordnen Sie jedem von Finns Verträgen die zutreffende Begründung der Rechtslage zu.","paare":[["Handyvertrag über 24 Monate","Schwebend unwirksam: laufende Zahlungspflicht über die gesamte Laufzeit"],["Laptop in zwölf Monatsraten","Schwebend unwirksam: Ratenkauf, die Leistung ist noch nicht vollständig bewirkt"],["Fahrrad, bar vom Taschengeld bezahlt","Von Anfang an wirksam nach dem Taschengeldparagrafen"]],"erkl":"Der Taschengeldparagraf (§ 110 BGB) verlangt, dass Finn die vertragsmäßige Leistung vollständig mit frei verfügbaren Mitteln bewirkt hat – das ist nur beim Fahrrad der Fall. Handy- und Laptopvertrag hängen dagegen nach § 108 BGB von der Genehmigung der Eltern ab.","norm":"§§ 108, 110 BGB","id":"4.1-2-3"},{"typ":"mc","frage":"Die Eltern erfahren vom Laptopkauf und verweigern gegenüber dem Händler die Genehmigung. Welche Folge hat das?","optionen":["Der Vertrag wird mit Finns 18. Geburtstag automatisch wirksam.","Der Vertrag bleibt wirksam, weil Finn ihn selbst unterschrieben hat.","Der Vertrag wird wirksam, sobald Finn die letzte Rate bezahlt hat.","Der Vertrag ist nun endgültig unwirksam und bleibt es auch."],"richtig":[3],"erkl":"Mit der Verweigerung der Genehmigung endet der Schwebezustand: Der Vertrag ist endgültig unwirksam (§ 108 Abs. 1 BGB). Weder die spätere Volljährigkeit noch eine spätere Zahlung machen ihn wieder wirksam; bereits erbrachte Leistungen sind zurückzugeben.","norm":"§ 108 Abs. 1 BGB","id":"4.1-2-4"}]}]},{"nr":"4.2","titel":"Rechtsgeschäfte, Form, Nichtigkeit und Anfechtung, AGB","lf":"LF 2 / Sozialkunde","buch":"BGB §§ 116–144, 145–157, 305–310","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein Onlineshop zeigt eine Regenjacke mit dem Preis 89 €. Wie ist diese Darstellung rechtlich einzuordnen?","optionen":["Als verbindliches Angebot an jede Person, die den Shop besucht","Als Aufforderung an die Kunden, selbst ein Angebot abzugeben","Als Annahme aller künftigen Bestellungen zu diesem Preis","Als Vorvertrag, der den Händler zur Lieferung verpflichtet"],"richtig":[1],"erkl":"Warenpräsentationen in Schaufenstern, Katalogen oder Onlineshops sind noch kein Antrag, weil der Händler sich nicht gegenüber beliebig vielen Personen binden will. Erst die Bestellung des Kunden ist der Antrag, den der Händler annehmen kann.","norm":"§ 145 BGB (Aufforderung zur Abgabe eines Angebots)","id":"4.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zu Willenserklärungen sowie zu Antrag und Annahme treffen zu?","aussagen":[["Schweigen auf ein Angebot gilt unter Privatleuten grundsätzlich nicht als Annahme.",true],["Ein am Telefon gemachter Antrag kann nur sofort angenommen werden.",true],["Eine verspätet eingehende Annahme bringt den Vertrag trotzdem zustande.",false],["Eine Kündigung ist ein zweiseitiges Rechtsgeschäft, weil der Empfänger zustimmen muss.",false]],"erkl":"Schweigen ist grundsätzlich keine Willenserklärung (Ausnahme: kaufmännisches Bestätigungsschreiben). Telefonisch gilt der Antrag als unter Anwesenden gemacht (§ 147 Abs. 1 BGB); eine verspätete Annahme ist nur ein neuer Antrag (§ 150 Abs. 1 BGB). Die Kündigung ist einseitig und wird schon mit Zugang wirksam.","norm":"§§ 147, 150 BGB","id":"4.2-1-2"},{"typ":"mc","frage":"Ein Händler bietet einem Kunden per Brief einen Drucker für 300 € an. Der Kunde antwortet rechtzeitig: „Einverstanden, wenn Sie 10 % Rabatt gewähren.“ Wie ist die Antwort einzuordnen?","optionen":["Als Annahme, durch die der Vertrag zu 300 € zustande kommt","Als Annahme, durch die der Vertrag zu 270 € zustande kommt","Als Ablehnung, verbunden mit einem neuen Antrag des Kunden","Als Widerruf des Angebots, das dadurch vollständig erlischt"],"richtig":[2],"erkl":"Eine Annahme unter Änderungen gilt nach § 150 Abs. 2 BGB als Ablehnung, verbunden mit einem neuen Antrag. Ein Vertrag kommt erst zustande, wenn der Händler diesen neuen Antrag über 270 € annimmt.","norm":"§ 150 Abs. 2 BGB","id":"4.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Rechtsgeschäft die gesetzlich vorgeschriebene Form zu.","paare":[["Kauf einer Eigentumswohnung","Notarielle Beurkundung"],["Kündigung eines Arbeitsvertrags","Schriftform, elektronische Form ausgeschlossen"],["Anmeldung einer Prokura zum Handelsregister","Öffentliche Beglaubigung"],["Kauf eines gebrauchten Fahrrads","Keine Form vorgeschrieben (Formfreiheit)"]],"erkl":"Grundsätzlich gilt Formfreiheit. Für Grundstücksgeschäfte verlangt § 311b BGB die notarielle Beurkundung, für die Kündigung eines Arbeitsverhältnisses § 623 BGB die Schriftform; Anmeldungen zum Handelsregister sind nach § 12 HGB öffentlich beglaubigt einzureichen.","norm":"§§ 311b, 623 BGB; § 12 HGB","id":"4.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie jedem Fall die passende Vertragsart zu.","paare":[["Lena überlässt ihrer Freundin für eine Woche kostenlos ihr Fahrrad.","Leihvertrag"],["Ein Landwirt nutzt gegen Entgelt einen Acker und erntet das Getreide.","Pachtvertrag"],["Eine Werkstatt soll gegen Entgelt die Bremsen eines Autos reparieren.","Werkvertrag"],["Ein Nachhilfelehrer gibt gegen Stundenhonorar Mathematikunterricht.","Dienstvertrag"],["Eine Bank stellt einem Kunden 5.000 € gegen Zinsen zur Verfügung.","Darlehensvertrag"]],"erkl":"Die Leihe ist unentgeltlich (§ 598 BGB), die Pacht gewährt Gebrauch und Früchte (§ 581 BGB). Beim Werkvertrag wird ein Erfolg geschuldet (§ 631 BGB), beim Dienstvertrag nur die Tätigkeit (§ 611 BGB); das Gelddarlehen regelt § 488 BGB.","norm":"§§ 488, 581, 598, 611, 631 BGB","id":"4.2-1-5"},{"typ":"mc","frage":"Welches Rechtsgeschäft ist von Anfang an nichtig, ohne dass es angefochten werden muss?","optionen":["Ein Kauf, bei dem die Verkäuferin sich beim Preis verschrieben hat","Ein Kauf, bei dem der Verkäufer den Käufer arglistig getäuscht hat","Ein nur mündlich geschlossener Kaufvertrag über ein Grundstück","Ein Kauf, bei dem sich der Käufer über den Wiederverkaufswert irrt"],"richtig":[2],"erkl":"Fehlt die gesetzlich vorgeschriebene Form – hier die notarielle Beurkundung nach § 311b BGB –, ist das Geschäft nach § 125 BGB nichtig. Verschreiben und Täuschung machen ein Geschäft nur anfechtbar; ein Irrtum über den Wiederverkaufswert ist ein unbeachtlicher Motivirrtum.","norm":"§§ 119, 123, 125, 311b BGB","id":"4.2-1-6"},{"typ":"mehr","frage":"Welche drei Aussagen zu Allgemeinen Geschäftsbedingungen (AGB) treffen zu?","optionen":["Allgemeine Versicherungsbedingungen (AVB) sind AGB im Sinne des BGB.","Ist eine Klausel unwirksam, bleibt der Vertrag im Übrigen wirksam.","Eine individuelle Absprache tritt hinter abweichende AGB zurück.","Überraschende Klauseln werden nicht Bestandteil des Vertrags.","Ein Haftungsausschluss für grobe Fahrlässigkeit ist in AGB wirksam."],"richtig":[0,1,3],"erkl":"AVB sind für viele Verträge vorformuliert und damit AGB (§ 305 BGB). Unwirksame Klauseln werden durch das Gesetz ersetzt, der Vertrag bleibt bestehen (§ 306 BGB); überraschende Klauseln gelten nicht (§ 305c BGB), Individualabreden haben Vorrang (§ 305b BGB) und § 309 Nr. 7 b BGB verbietet den Haftungsausschluss für grobes Verschulden.","norm":"§§ 305–306, 309 Nr. 7 BGB","id":"4.2-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Sophie Wagner (19) ist Auszubildende im Einkauf der PROXIMUS Versicherung AG in Halle (Saale) und darf Büromaterial bestellen. Am 5. Oktober 2026 bestellt sie per E-Mail bei einem Bürobedarfshändler Kopierpapier. Sie will 50 Kartons bestellen, vertippt sich aber und schreibt „500 Kartons“. Der Händler bestätigt die Bestellung über 500 Kartons noch am selben Tag. Sophies Ausbilder bemerkt den Fehler am 7. Oktober 2026.","items":[{"typ":"mc","frage":"Welcher Irrtum liegt bei Sophie vor?","optionen":["Ein Inhaltsirrtum über die Bedeutung des Wortes „Karton“","Ein Erklärungsirrtum, weil sie sich vertippt hat","Ein Eigenschaftsirrtum über die Qualität des Papiers","Ein Motivirrtum über den späteren Papierbedarf"],"richtig":[1],"erkl":"Sophie wollte eine Erklärung dieses Inhalts („500“) gar nicht abgeben; Versprechen, Verschreiben und Vertippen sind Erklärungsirrtümer nach § 119 Abs. 1 BGB. Beim Inhaltsirrtum wählt man das gewünschte Zeichen, irrt aber über dessen Bedeutung.","norm":"§ 119 Abs. 1 BGB","id":"4.2-2-1"},{"typ":"mc","frage":"Innerhalb welcher Frist muss PROXIMUS die Bestellung wegen dieses Irrtums anfechten?","optionen":["Binnen eines Jahres nach Entdeckung des Irrtums","Innerhalb von zwei Wochen nach der Bestellung","Jederzeit, solange das Papier nicht geliefert ist","Unverzüglich, also ohne schuldhaftes Zögern"],"richtig":[3],"erkl":"Bei Irrtum muss die Anfechtung nach § 121 Abs. 1 BGB unverzüglich nach Kenntnis des Anfechtungsgrundes erfolgen – hier also sofort nach dem 7. Oktober. Die Jahresfrist des § 124 BGB gilt nur für Täuschung und Drohung.","norm":"§ 121 Abs. 1 BGB","id":"4.2-2-2"},{"typ":"mc","frage":"PROXIMUS ficht die Bestellung rechtzeitig gegenüber dem Händler an. Welche Wirkung hat die Anfechtung?","optionen":["Der Vertrag wird automatisch auf 50 Kartons herabgesetzt.","Der Vertrag ist als von Anfang an nichtig anzusehen.","Der Vertrag endet erst mit Zugang der Anfechtung.","Der Vertrag bleibt bestehen, der Preis wird gemindert."],"richtig":[1],"erkl":"Nach § 142 Abs. 1 BGB wirkt die Anfechtung zurück: Das Rechtsgeschäft gilt als von Anfang an nichtig. Die gewünschten 50 Kartons muss PROXIMUS neu bestellen; einen Vertrag mit geändertem Inhalt schafft die Anfechtung nicht.","norm":"§ 142 Abs. 1 BGB","id":"4.2-2-3"},{"typ":"wf","frage":"Welche Aussagen zur Anfechtung in diesem Fall treffen zu?","aussagen":[["Die Anfechtung muss gegenüber dem Händler erklärt werden.",true],["Der Händler kann Ersatz des Schadens verlangen, den er im Vertrauen auf die Bestellung erlitten hat.",true],["Eine Anfechtung ist ausgeschlossen, weil der Händler die Bestellung schon bestätigt hat.",false],["Hätte sich Sophie nur beim künftigen Papierverbrauch verschätzt, könnte PROXIMUS ebenfalls anfechten.",false]],"erkl":"Anfechtungsgegner ist der Vertragspartner (§ 143 BGB). Wer wegen Irrtums anficht, muss dem anderen den Vertrauensschaden ersetzen (§ 122 BGB). Eine Fehleinschätzung des Bedarfs ist ein Motivirrtum und berechtigt nicht zur Anfechtung.","norm":"§§ 119, 122, 143 BGB","id":"4.2-2-4"}]}]},{"nr":"4.3","titel":"Kaufvertrag, Eigentum und Besitz","lf":"Sozialkunde","buch":"BGB §§ 433–479, 854, 903, 929–935, 286–288, 195, 199; HGB § 377","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"In welchem Fall ist die genannte Person Besitzer, aber nicht Eigentümer der Sache?","optionen":["Eine Käuferin hat ihr Rad bezahlt, übereignet bekommen und fährt damit.","Ein Verkäufer hat sein Notebook verkauft, übereignet und übergeben.","Eine Kundin hat ein Kleid bestellt, das noch im Lager des Händlers liegt.","Ein Student fährt ein Fahrrad, das ihm ein Freund geliehen hat."],"richtig":[3],"erkl":"Besitz ist die tatsächliche Herrschaft über eine Sache (§ 854 BGB), Eigentum die rechtliche Herrschaft (§ 903 BGB). Der Entleiher hat das Rad in der Hand, Eigentümer bleibt aber der Freund.","norm":"§§ 854, 903 BGB","id":"4.3-1-1"},{"typ":"mc","frage":"Wie wird das Eigentum an einer beweglichen Sache übertragen?","optionen":["Allein durch den Abschluss des Kaufvertrags","Durch Einigung und Eintragung in das Grundbuch","Durch Einigung über den Übergang und Übergabe","Durch Übergabe der Sache, ohne jede Einigung"],"richtig":[2],"erkl":"Nach § 929 BGB sind die Einigung über den Eigentumsübergang und die Übergabe nötig. Der Kaufvertrag verpflichtet nur zur Übereignung; Einigung (Auflassung) und Grundbucheintragung gelten für Grundstücke (§§ 873, 925 BGB).","norm":"§ 929 BGB","id":"4.3-1-2"},{"typ":"wf","frage":"Welche Aussagen zu Eigentum und Eigentumserwerb treffen zu?","aussagen":[["Kaufvertrag (Verpflichtungsgeschäft) und Übereignung (Erfüllungsgeschäft) sind rechtlich getrennte Geschäfte.",true],["Wer eine geliehene Sache gutgläubig vom Entleiher kauft und übergeben bekommt, kann Eigentümer werden.",true],["An einer gestohlenen Sache erwirbt ein gutgläubiger Käufer in der Regel Eigentum, wenn er bar bezahlt.",false],["Beim Kauf unter Eigentumsvorbehalt wird der Käufer schon mit der Übergabe Eigentümer.",false]],"erkl":"Nach dem Abstraktionsprinzip sind Verpflichtungs- und Erfüllungsgeschäft zu trennen. Gutgläubiger Erwerb vom Nichtberechtigten ist möglich (§ 932 BGB), nicht aber bei gestohlenen oder abhanden gekommenen Sachen (§ 935 BGB). Beim Eigentumsvorbehalt geht das Eigentum erst mit vollständiger Zahlung über (§ 449 BGB).","norm":"§§ 449, 929, 932, 935 BGB","id":"4.3-1-3"},{"typ":"mc","frage":"Eine neu gekaufte Waschmaschine ist mangelhaft. Welches Recht muss die Käuferin grundsätzlich zuerst geltend machen?","optionen":["Rücktritt vom Kaufvertrag","Nacherfüllung nach ihrer Wahl","Minderung des Kaufpreises","Schadensersatz statt der Leistung"],"richtig":[1],"erkl":"Vorrangig ist die Nacherfüllung: Die Käuferin wählt zwischen Nachbesserung und Lieferung einer mangelfreien Sache (§ 439 Abs. 1 BGB). Rücktritt, Minderung und Schadensersatz setzen grundsätzlich voraus, dass eine Frist zur Nacherfüllung erfolglos abgelaufen ist (§§ 437, 323 BGB).","norm":"§§ 437, 439 BGB","id":"4.3-1-4"},{"typ":"wf","frage":"Welche Aussagen zur Gewährleistung beim Kauf einer beweglichen Sache treffen zu?","aussagen":[["Die Mängelansprüche verjähren grundsätzlich in zwei Jahren ab Ablieferung der Sache.",true],["Zeigt sich beim Verbrauchsgüterkauf innerhalb eines Jahres ein Mangel, wird vermutet, dass er schon bei Gefahrübergang vorlag.",true],["Eine freiwillige Herstellergarantie ersetzt die gesetzliche Gewährleistung des Verkäufers.",false],["Liefert der Verkäufer eine andere als die bestellte Sache, liegt kein Sachmangel vor.",false]],"erkl":"§ 438 BGB sieht für bewegliche Sachen zwei Jahre ab Ablieferung vor; § 477 BGB kehrt beim Verbrauchsgüterkauf für ein Jahr die Beweislast um. Eine Garantie gibt es nur zusätzlich, und eine Falschlieferung steht nach § 434 Abs. 5 BGB einem Sachmangel gleich.","norm":"§§ 434, 438, 477 BGB","id":"4.3-1-5"},{"typ":"mc","frage":"Ein Schuldner reagiert im gerichtlichen Mahnverfahren überhaupt nicht. In welcher Reihenfolge läuft das Verfahren ab?","optionen":["Antrag – Vollstreckungsbescheid – Mahnbescheid – Zwangsvollstreckung","Antrag – Mahnbescheid – Vollstreckungsbescheid – Zwangsvollstreckung","Mahnbescheid – Klageerhebung – Vollstreckungsbescheid – Zwangsvollstreckung","Antrag – Mahnbescheid – Zwangsvollstreckung – Vollstreckungsbescheid"],"richtig":[1],"erkl":"Auf Antrag erlässt das Mahngericht den Mahnbescheid; legt der Schuldner nicht binnen zwei Wochen Widerspruch ein, folgt auf Antrag der Vollstreckungsbescheid. Der Vollstreckungsbescheid ist ein Vollstreckungstitel, aus dem die Zwangsvollstreckung betrieben werden kann; ohne Einspruch binnen zwei Wochen wird er rechtskräftig.","norm":"§§ 688–700 ZPO","id":"4.3-1-6"},{"typ":"zahl","frage":"Ein Verbraucher kommt durch Mahnung mit einer Kaufpreiszahlung von 3.000 € in Verzug und zahlt genau 4 Monate zu spät. Der Basiszinssatz wird mit 1,27 % angenommen. Berechnen Sie die gesetzlichen Verzugszinsen (Zinsen = Betrag × Zinssatz × Monate / 12).","wert":62.7,"einheit":"€","tol":0.01,"erkl":"Ist ein Verbraucher beteiligt, beträgt der Verzugszins 5 Prozentpunkte über dem Basiszinssatz: 1,27 % + 5 % = 6,27 %. 3.000 € × 6,27 % × 4/12 = 62,70 €.","norm":"§ 288 Abs. 1 BGB","id":"4.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) kauft bei einem Bürotechnikhändler (GmbH) 40 Headsets für insgesamt 6.000 €; im Kaufvertrag ist als Zahlungstermin der 31. März 2026 vereinbart. Die Headsets werden am 2. März 2026 geliefert. Bei der Eingangsprüfung am selben Tag stellt der Auszubildende Jakob Neumann (18) fest, dass fünf Headsets kein Mikrofon haben. Nach der Rüge liefert der Händler am 9. März 2026 fünf einwandfreie Ersatz-Headsets. PROXIMUS überweist den Kaufpreis versehentlich erst am 30. April 2026.","items":[{"typ":"mc","frage":"Was muss PROXIMUS wegen der fehlenden Mikrofone tun, um ihre Mängelrechte nicht zu verlieren?","optionen":["Den Mangel innerhalb von zwei Jahren nach Lieferung anzeigen","Den Mangel dem Händler unverzüglich anzeigen (rügen)","Zunächst die gesamte Lieferung an den Händler zurücksenden","Den Mangel erst nach der Zahlung des Kaufpreises anzeigen"],"richtig":[1],"erkl":"Der Kauf ist für beide Seiten ein Handelsgeschäft, weil AG und GmbH Formkaufleute sind. Nach § 377 HGB muss PROXIMUS die Ware unverzüglich untersuchen und erkennbare Mängel unverzüglich rügen; sonst gilt die Ware als genehmigt.","norm":"§ 377 HGB","id":"4.3-2-1"},{"typ":"mc","frage":"Ab wann ist PROXIMUS mit der Zahlung in Verzug?","optionen":["Erst nach einer Mahnung des Händlers im April 2026","Erst 30 Tage nach dem vereinbarten Zahlungstermin","Erst mit Zustellung eines gerichtlichen Mahnbescheids","Ab dem 1. April 2026, ohne dass gemahnt werden muss"],"richtig":[3],"erkl":"Ist für die Leistung eine Zeit nach dem Kalender bestimmt, bedarf es keiner Mahnung (§ 286 Abs. 2 Nr. 1 BGB). Da der 31. März 2026 vertraglich vereinbart war, tritt der Verzug am folgenden Tag ein; die 30-Tage-Regel des Abs. 3 spielt hier keine Rolle.","norm":"§ 286 Abs. 2 Nr. 1 BGB","id":"4.3-2-2"},{"typ":"zahl","frage":"Berechnen Sie die gesetzlichen Verzugszinsen, die der Händler für den Kaufpreis von 6.000 € verlangen kann. Der Basiszinssatz wird mit 1,27 % angenommen; rechnen Sie mit 30 Verzugstagen und 360 Zinstagen je Jahr.","wert":51.35,"einheit":"€","tol":0.01,"erkl":"An dem Kauf ist kein Verbraucher beteiligt, daher gelten 9 Prozentpunkte über dem Basiszinssatz: 1,27 % + 9 % = 10,27 %. 6.000 € × 10,27 % × 30/360 = 51,35 €.","norm":"§ 288 Abs. 2 BGB","id":"4.3-2-3"},{"typ":"zahl","frage":"Angenommen, PROXIMUS hätte gar nicht gezahlt und der Händler hätte nichts unternommen. Der Kaufpreisanspruch ist im März 2026 entstanden. Mit Ablauf des 31. Dezember welchen Jahres verjährt der Anspruch?","wert":2029,"einheit":"(Jahr)","tol":0,"erkl":"Die regelmäßige Verjährungsfrist beträgt drei Jahre (§ 195 BGB) und beginnt mit dem Schluss des Jahres, in dem der Anspruch entstanden ist (§ 199 Abs. 1 BGB). Beginn: Ende 2026, Ende: 31. Dezember 2029.","norm":"§§ 195, 199 Abs. 1 BGB","id":"4.3-2-4"}]}]},{"nr":"4.4","titel":"Vollmachten im Unternehmen","lf":"LF 1 / Sozialkunde","buch":"HGB §§ 48–58; BGB §§ 164 ff.","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Unter welcher Voraussetzung wirkt die Willenserklärung eines Vertreters unmittelbar für und gegen den Vertretenen?","optionen":["Er handelt im eigenen Namen, aber im Interesse seines Arbeitgebers.","Er handelt im Namen des Vertretenen und hat dafür Vertretungsmacht.","Er ist volljährig und hat im Unternehmen mindestens Handlungsvollmacht.","Er handelt ohne Vertretungsmacht, glaubt aber, im Sinne des Chefs zu handeln."],"richtig":[1],"erkl":"Nach § 164 Abs. 1 BGB wirkt eine Erklärung für den Vertretenen, wenn der Vertreter erkennbar in dessen Namen und innerhalb seiner Vertretungsmacht handelt. Volljährigkeit ist nicht nötig (§ 165 BGB), und wer im eigenen Namen handelt, verpflichtet sich selbst.","norm":"§§ 164, 165 BGB","id":"4.4-1-1"},{"typ":"mc","frage":"Wer kann eine Prokura erteilen, und in welcher Form?","optionen":["Jeder Prokurist, wenn er die Erteilung schriftlich festhält","Der Inhaber oder sein gesetzlicher Vertreter, ausdrücklich","Der Abteilungsleiter, auch stillschweigend durch bloße Duldung","Das Registergericht durch Eintragung in das Handelsregister"],"richtig":[1],"erkl":"Nach § 48 Abs. 1 HGB kann nur der Inhaber des Handelsgeschäfts oder sein gesetzlicher Vertreter (bei einer AG der Vorstand) die Prokura erteilen, und zwar ausdrücklich. Die Eintragung ins Handelsregister ist Pflicht, wirkt aber nur deklaratorisch.","norm":"§§ 48, 53 HGB","id":"4.4-1-2"},{"typ":"mehr","frage":"Welche zwei Geschäfte darf eine Prokuristin ohne besondere Befugnis für das Unternehmen vornehmen?","optionen":["Einen Kredit für das Unternehmen aufnehmen","Einen Rechtsstreit für das Unternehmen führen","Ein Betriebsgrundstück des Unternehmens verkaufen","Die Jahresbilanz des Unternehmens unterschreiben","Einer Kollegin ebenfalls Prokura erteilen"],"richtig":[0,1],"erkl":"Die Prokura umfasst alle gerichtlichen und außergerichtlichen Geschäfte, die der Betrieb irgendeines Handelsgewerbes mit sich bringt (§ 49 Abs. 1 HGB) – also auch Kredite und Prozesse. Grundstücke darf sie nur mit besonderer Befugnis veräußern (§ 49 Abs. 2 HGB); Bilanzunterschrift und Erteilung der Prokura bleiben dem Inhaber vorbehalten.","norm":"§§ 48, 49 HGB","id":"4.4-1-3"},{"typ":"zuo","frage":"Ordnen Sie jeder Vollmacht die zutreffende Beschreibung zu.","paare":[["Prokura","Umfassende Vollmacht, Eintragung ins Handelsregister, Zeichnung „ppa.“"],["Allgemeine Handlungsvollmacht","Alle gewöhnlichen Geschäfte dieses Betriebs, Zeichnung „i. V.“"],["Artvollmacht","Eine bestimmte Art von Geschäften, z. B. alle Einkäufe"],["Einzelvollmacht","Nur ein einzelnes Geschäft, Zeichnung meist „i. A.“"]],"erkl":"Die Prokura (§§ 48–53 HGB) ist die weiteste Vollmacht und wird eingetragen. Die Handlungsvollmacht (§ 54 HGB) gibt es als allgemeine Vollmacht, als Art- und als Einzelvollmacht; sie richtet sich nach dem Gewöhnlichen und wird nicht eingetragen.","norm":"§§ 49, 51, 54, 57 HGB","id":"4.4-1-4"},{"typ":"mc","frage":"Laut Arbeitsvertrag darf ein Prokurist Verträge nur bis 50.000 € schließen. Er kauft trotzdem Software für 80.000 €; der Verkäufer kennt die Grenze nicht. Welche Aussage trifft zu?","optionen":["Der Vertrag ist unwirksam, weil die interne Grenze überschritten ist.","Der Vertrag ist nur bis 50.000 € wirksam, im Übrigen unwirksam.","Der Vertrag ist wirksam; die Grenze gilt nur im Innenverhältnis.","Der Vertrag wird erst mit Zustimmung des Inhabers wirksam."],"richtig":[2],"erkl":"Nach § 50 Abs. 1 HGB ist eine Beschränkung des Umfangs der Prokura Dritten gegenüber unwirksam. Der Vertrag bindet das Unternehmen; der Prokurist kann aber im Innenverhältnis arbeitsrechtliche Folgen und Schadensersatzpflichten auslösen.","norm":"§ 50 HGB","id":"4.4-1-5"},{"typ":"wf","frage":"Welche Aussagen zur Prokura treffen zu?","aussagen":[["Die Prokura kann jederzeit widerrufen werden.",true],["Die Prokura erlischt mit dem Tod des Inhabers des Handelsgeschäfts.",false],["Die Prokura kann nicht auf eine andere Person übertragen werden.",true],["Die Prokura entsteht erst mit der Eintragung in das Handelsregister.",false]],"erkl":"§ 52 HGB: Die Prokura ist jederzeit widerruflich, nicht übertragbar und erlischt nicht durch den Tod des Inhabers. Sie entsteht mit der ausdrücklichen Erteilung; die Eintragung macht sie nur bekannt (deklaratorisch).","norm":"§§ 48, 52, 53 HGB","id":"4.4-1-6"},{"typ":"mc","frage":"Für welches Geschäft braucht ein Abteilungsleiter mit allgemeiner Handlungsvollmacht eine besondere Befugnis?","optionen":["Bestellung von Büromaterial für seine Abteilung","Abschluss eines Wartungsvertrags für Drucker","Aufnahme eines Darlehens für das Unternehmen","Bezahlung einer fälligen Lieferantenrechnung"],"richtig":[2],"erkl":"Die Handlungsvollmacht deckt die Geschäfte, die ein derartiger Betrieb gewöhnlich mit sich bringt. Für Grundstücksgeschäfte, Wechselverbindlichkeiten, Darlehensaufnahme und Prozessführung braucht der Handlungsbevollmächtigte nach § 54 Abs. 2 HGB eine besondere Befugnis.","norm":"§ 54 Abs. 2 HGB","id":"4.4-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Bei der PROXIMUS Versicherung AG in Halle (Saale) gilt diese Vollmachtenregelung: Dr. Miriam Lehmann (45) ist Einzelprokuristin. Abteilungsleiter Stefan Ahmeti (38) hat von Frau Dr. Lehmann allgemeine Handlungsvollmacht ohne besondere Befugnisse erhalten. Die Auszubildende Hannah Becker (17) erhält am 12. Oktober 2026 eine Einzelvollmacht, im Fachhandel einen Beamer für den Schulungsraum bis 900 € zu kaufen.","items":[{"typ":"mc","frage":"PROXIMUS soll einen Bankkredit über 200.000 € aufnehmen. Wer von den drei Genannten kann den Kreditvertrag allein wirksam unterschreiben?","optionen":["Herr Ahmeti, weil Kredite zu den gewöhnlichen Geschäften zählen","Hannah Becker, wenn ihr Ausbilder der Unterschrift zustimmt","Nur Frau Dr. Lehmann, weil die Prokura Kredite umfasst","Keiner der drei, weil Kredite nur der Aufsichtsrat aufnimmt"],"richtig":[2],"erkl":"Die Prokura deckt die Aufnahme von Darlehen ohne besondere Befugnis (§ 49 Abs. 1 HGB). Herr Ahmeti bräuchte dafür eine besondere Befugnis (§ 54 Abs. 2 HGB), Hannahs Einzelvollmacht betrifft nur den Beamer, und der Aufsichtsrat überwacht, er führt keine Geschäfte.","norm":"§§ 49, 54 HGB","id":"4.4-2-1"},{"typ":"zuo","frage":"Ordnen Sie jeder Person die übliche Zeichnung zu.","paare":[["Dr. Miriam Lehmann","ppa. Lehmann"],["Stefan Ahmeti","i. V. Ahmeti"],["Hannah Becker","i. A. Becker"]],"erkl":"Der Prokurist zeichnet mit einem Zusatz, der die Prokura andeutet (§ 51 HGB: „ppa.“). Handlungsbevollmächtigte dürfen keinen Prokurazusatz verwenden (§ 57 HGB); üblich ist „i. V.“ bei allgemeiner Handlungsvollmacht und „i. A.“ bei Einzelaufträgen.","norm":"§§ 51, 57 HGB","id":"4.4-2-2"},{"typ":"wf","frage":"Welche Aussagen zur Vollmachtenregelung bei PROXIMUS treffen zu?","aussagen":[["Hannah kann trotz ihres Alters von 17 Jahren PROXIMUS beim Beamerkauf wirksam vertreten.",true],["Hannahs Einzelvollmacht muss in das Handelsregister eingetragen werden.",false],["Frau Dr. Lehmann durfte Herrn Ahmeti die Handlungsvollmacht erteilen.",true],["Herr Ahmeti darf ohne besondere Befugnis einen Prozess für PROXIMUS führen.",false]],"erkl":"Ein beschränkt geschäftsfähiger Vertreter kann wirksam vertreten, weil die Folgen nur den Vertretenen treffen (§ 165 BGB). Handlungsvollmachten sind formlos, werden nicht eingetragen und können auch von Prokuristen erteilt werden; für Prozesse braucht ein Handlungsbevollmächtigter eine besondere Befugnis (§ 54 Abs. 2 HGB).","norm":"§ 165 BGB; § 54 HGB","id":"4.4-2-3"},{"typ":"mc","frage":"Frau Dr. Lehmann soll ein Betriebsgrundstück von PROXIMUS verkaufen. Welche Aussage trifft zu?","optionen":["Sie darf es, weil die Prokura alle Geschäfte ohne Ausnahme umfasst.","Sie darf es nur, wenn ihr diese Befugnis besonders erteilt wurde.","Sie darf es, sofern der Kaufpreis unter 1 Million Euro liegt.","Sie darf es nie, Grundstücke verkauft nur der Aufsichtsrat."],"richtig":[1],"erkl":"Zur Veräußerung und Belastung von Grundstücken ist ein Prokurist nach § 49 Abs. 2 HGB nur ermächtigt, wenn ihm diese Befugnis besonders erteilt ist. Eine Wertgrenze kennt das Gesetz nicht, und der Aufsichtsrat vertritt die AG nicht nach außen.","norm":"§ 49 Abs. 2 HGB","id":"4.4-2-4"}]}]},{"nr":"4.5","titel":"Kaufleute, Rechtsformen und Finanzierung","lf":"LF 1 / Sozialkunde","buch":"HGB §§ 1–6, 8–15; GmbHG; AktG; VAG","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Kaufmannsart die passende Beschreibung zu.","paare":[["Istkaufmann","Betreibt ein Handelsgewerbe, das eine kaufmännische Einrichtung erfordert"],["Kannkaufmann","Kleingewerbetreibender, der sich freiwillig eintragen lässt"],["Formkaufmann","Ist Kaufmann allein aufgrund seiner Rechtsform, z. B. GmbH oder AG"]],"erkl":"Der Istkaufmann ist nach § 1 HGB schon kraft seines Gewerbes Kaufmann. Der Kleingewerbetreibende wird erst durch Eintragung Kaufmann (§ 2 HGB); Kapitalgesellschaften sind wegen ihrer Rechtsform Kaufleute (§ 6 HGB).","norm":"§§ 1, 2, 6 HGB","id":"4.5-1-1"},{"typ":"mc","frage":"Welche Aussage zum Handelsregister trifft zu?","optionen":["Es wird von der IHK geführt; Einsicht erhalten nur deren Mitglieder.","Abteilung A enthält Kapitalgesellschaften, Abteilung B Einzelkaufleute.","Das Amtsgericht führt es; Kapitalgesellschaften stehen in Abteilung B.","Eintragungen sind vertraulich und nur dem Finanzamt zugänglich."],"richtig":[2],"erkl":"Das Handelsregister wird elektronisch beim Amtsgericht geführt und ist öffentlich: Jeder darf Einsicht nehmen (§ 9 HGB). Abteilung A enthält Einzelkaufleute und Personengesellschaften, Abteilung B Kapitalgesellschaften.","norm":"§§ 8, 9 HGB","id":"4.5-1-2"},{"typ":"mc","frage":"In welchem Fall wirkt die Eintragung in das Handelsregister konstitutiv (rechtsbegründend)?","optionen":["Eintragung eines Istkaufmanns","Eintragung einer neuen GmbH","Eintragung einer Prokura","Eintragung eines Prokura-Widerrufs"],"richtig":[1],"erkl":"Eine GmbH entsteht als juristische Person erst mit der Eintragung (§ 11 Abs. 1 GmbHG); dasselbe gilt für den Kannkaufmann und die AG. Istkaufmann und Prokura bestehen schon vorher, ihre Eintragung wirkt nur deklaratorisch.","norm":"§ 11 Abs. 1 GmbHG; §§ 1, 2, 53 HGB","id":"4.5-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Unternehmen oder Gesellschafter die zutreffende Haftung zu.","paare":[["Einzelunternehmer (e. K.)","Haftet allein und unbeschränkt, auch mit dem Privatvermögen"],["Gesellschafter einer OHG","Haften unbeschränkt, unmittelbar und als Gesamtschuldner"],["Kommanditist einer KG","Haftet nur bis zur Höhe seiner eingetragenen Haftsumme"],["GmbH","Haftet nur mit dem Gesellschaftsvermögen"]],"erkl":"Der Einzelkaufmann haftet mit seinem ganzen Vermögen, OHG-Gesellschafter haften persönlich und als Gesamtschuldner (§ 126 HGB). Der Kommanditist haftet nur bis zur Höhe seiner im Handelsregister eingetragenen Haftsumme, nicht mehr, soweit die Einlage geleistet ist (§§ 171, 172 HGB); bei der GmbH haftet den Gläubigern nur das Gesellschaftsvermögen (§ 13 Abs. 2 GmbHG).","norm":"§§ 126, 171, 172 HGB; § 13 Abs. 2 GmbHG","id":"4.5-1-4"},{"typ":"mc","frage":"Welches Organ einer Aktiengesellschaft bestellt den Vorstand und überwacht dessen Geschäftsführung?","optionen":["Die Hauptversammlung","Der Aufsichtsrat","Der Abschlussprüfer","Der Betriebsrat"],"richtig":[1],"erkl":"Der Aufsichtsrat bestellt den Vorstand (§ 84 AktG) und überwacht die Geschäftsführung (§ 111 AktG). Die Hauptversammlung der Aktionäre wählt die Aufsichtsratsmitglieder der Anteilseigner und beschließt über die Gewinnverwendung.","norm":"§§ 84, 111, 119 AktG","id":"4.5-1-5"},{"typ":"mc","frage":"Welche Angabe zum gesetzlichen Mindestkapital trifft zu?","optionen":["GmbH: 50.000 € Stammkapital; AG: 25.000 € Grundkapital","GmbH: 12.500 € Stammkapital; AG: 100.000 € Grundkapital","GmbH: 25.000 € Stammkapital; AG: 50.000 € Grundkapital","GmbH: 10.000 € Stammkapital; AG: 250.000 € Grundkapital"],"richtig":[2],"erkl":"Das Stammkapital einer GmbH muss mindestens 25.000 € betragen (§ 5 Abs. 1 GmbHG), das Grundkapital einer AG mindestens 50.000 € (§ 7 AktG). Nur die Unternehmergesellschaft (haftungsbeschränkt) kann mit weniger, ab 1 €, gegründet werden (§ 5a GmbHG).","norm":"§ 5 GmbHG; § 7 AktG","id":"4.5-1-6"},{"typ":"mehr","frage":"Welche zwei Vorgänge gehören zur Innenfinanzierung eines Unternehmens?","optionen":["Einbehaltung von Gewinnen (Gewinnthesaurierung)","Finanzierung aus verdienten Abschreibungsgegenwerten","Aufnahme eines langfristigen Bankdarlehens","Aufnahme eines neuen Gesellschafters mit Einlage","Ausgabe neuer Aktien an der Börse"],"richtig":[0,1],"erkl":"Bei der Innenfinanzierung stammen die Mittel aus dem Umsatzprozess des Unternehmens selbst, etwa aus einbehaltenen Gewinnen oder über die Preise verdienten Abschreibungen. Kredite (Fremdfinanzierung) sowie Einlagen und Aktien (Eigenfinanzierung) fließen von außen zu.","norm":"BWL: Finanzierungsarten","id":"4.5-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) braucht für ihren Außendienst zwölf neue Dienstwagen. Zur Wahl stehen ein Kauf mit Bankkredit, für den die Bank Sicherheiten verlangt, oder ein Leasingvertrag über 36 Monate. Die Auszubildende Lina Krause (19) soll außerdem PROXIMUS mit einem Wettbewerber vergleichen, der als Versicherungsverein auf Gegenseitigkeit (VVaG) organisiert ist.","items":[{"typ":"mc","frage":"Welche Aussage zum Leasing der Dienstwagen trifft zu?","optionen":["PROXIMUS wird mit der ersten Leasingrate Eigentümerin der Wagen.","Der Leasinggeber bleibt Eigentümer, PROXIMUS wird Besitzerin.","Leasing ist eine Innenfinanzierung aus einbehaltenen Gewinnen.","Leasing ist in jedem Fall günstiger als ein Kauf mit Bankkredit."],"richtig":[1],"erkl":"Beim Leasing überlässt der Leasinggeber dem Leasingnehmer die Sache gegen Raten zum Gebrauch, ähnlich einer Miete. Der Leasinggeber bleibt Eigentümer, PROXIMUS erhält nur den Besitz; insgesamt ist Leasing oft sogar teurer als ein Kauf.","norm":"BWL: Leasing (mietähnlicher Vertrag, § 535 BGB entsprechend)","id":"4.5-2-1"},{"typ":"mehr","frage":"Welche zwei Vorteile hat das Leasing für PROXIMUS gegenüber dem Kauf?","optionen":["Es schont den Kreditrahmen, weil kein Kaufpreis zu finanzieren ist.","PROXIMUS muss dafür keine zusätzlichen Kreditsicherheiten stellen.","PROXIMUS erwirbt mit jeder Rate anteilig Eigentum an den Wagen.","Die Gesamtkosten sind immer niedriger als bei einem Kreditkauf.","Der Vertrag kann jederzeit ohne Kosten gekündigt werden."],"richtig":[0,1],"erkl":"Beim Leasing muss PROXIMUS keinen Kaufpreis finanzieren; Kreditrahmen und Liquidität bleiben frei. Sicherheiten wie beim Bankkredit entfallen, weil der Leasinggeber Eigentümer der Wagen bleibt. Nachteile sind die oft höheren Gesamtkosten, das fehlende Eigentum und die feste Vertragsbindung.","norm":"BWL: Leasing – Vor- und Nachteile","id":"4.5-2-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Kreditsicherheit die zutreffende Beschreibung zu.","paare":[["Bürgschaft eines Dritten","Personalsicherheit: Eine weitere Person haftet für die Schuld"],["Sicherungsübereignung der Wagen","Realsicherheit: Die Bank wird Eigentümerin, PROXIMUS bleibt Besitzerin"],["Grundschuld auf dem Bürogebäude","Realsicherheit: Belastung eines Grundstücks, im Grundbuch eingetragen"],["Eigentumsvorbehalt des Autohändlers","Realsicherheit: Eigentum geht erst mit vollständiger Zahlung über"]],"erkl":"Bei der Personalsicherheit haftet eine zusätzliche Person (§ 765 BGB). Realsicherheiten sichern durch Rechte an Sachen: Sicherungsübereignung (§ 930 BGB), Grundschuld (§ 1191 BGB) und Eigentumsvorbehalt (§ 449 BGB).","norm":"§§ 449, 765, 930, 1191 BGB","id":"4.5-2-3"},{"typ":"wf","frage":"Welche Aussagen zum Vergleich der PROXIMUS AG mit dem VVaG treffen zu?","aussagen":[["Beim VVaG sind die Versicherungsnehmer zugleich Mitglieder des Vereins.",true],["Die oberste Vertretung des VVaG übernimmt Aufgaben, die bei der AG die Hauptversammlung hat.",true],["Ein VVaG hat wie die AG Aktionäre, die eine Dividende erhalten.",false],["Ein VVaG braucht keinen Vorstand, weil die Mitglieder alles selbst entscheiden.",false]],"erkl":"Beim VVaG wird Mitglied, wer einen Versicherungsvertrag mit ihm schließt (§ 176 VAG). Seine Organe sind Vorstand, Aufsichtsrat und oberste Vertretung, für die die Regeln zur Hauptversammlung entsprechend gelten (§§ 184, 191 VAG); Aktionäre gibt es nicht.","norm":"§§ 176, 184, 191 VAG","id":"4.5-2-4"}]}]}]}]};

const tagStr=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const heute=()=>tagStr(new Date());
const plusTage=(t,n)=>{const z=t.split('-').map(Number);return tagStr(new Date(z[0],z[1]-1,z[2]+n))};
const datKurz=t=>{const z=t.split('-');return +z[2]+'.'+(+z[1])+'.'};
// Stufenmodell (Lernregeln, Entscheidung Christian 11.10.2026): 0 bearbeitet, noch nicht richtig · 1 abgerufen (richtig) ·
// 2 gefestigt (an einem späteren Tag wieder richtig) · 3 sitzt (nach 7 Tagen Abstand noch richtig).
// Wiedervorlage nach 1/3/7/21 Tagen; falsch → zurück auf „abgerufen“ (bzw. 0), morgen wieder fällig; am selben Tag ändert Wiederholen die Stufe nicht.
// Eintrag S[id] = {ok, t, st, k, f, d, n}: ok = zuletzt richtig (für ältere Auswertungen), st = Stufe, k = Abstandsstufe, f = fällig ab (JJJJ-MM-TT), d = Tag der letzten Antwort, n = Antworten
const ABST=[1,3,7,21],GEW=[0,.25,.6,1],STN=['noch nicht richtig','abgerufen','gefestigt','sitzt'];
const istTag=x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x);
function eintrag(id){const s=S[id];if(!s||typeof s!=='object')return null;
 if(typeof s.st==='number'&&s.st>=0&&s.st<=3&&istTag(s.f))return{ok:!!s.ok,t:s.t,st:s.st|0,k:Math.min(3,Math.max(0,s.k|0)),f:s.f,d:istTag(s.d)?s.d:s.f,n:s.n|0};
 // Lernstand aus der Zeit vor dem Stufenmodell: zuletzt richtig → abgerufen, sonst bearbeitet; beides heute fällig
 const d=typeof s.t==='number'&&isFinite(s.t)?tagStr(new Date(s.t)):plusTage(heute(),-1);return{ok:!!s.ok,t:s.t,st:s.ok?1:0,k:0,f:heute(),d,n:1}}
function bewerte(id,ok){const h=heute(),p=eintrag(id),n=(p?p.n:0)+1;let st,k,f;
 if(!ok){st=p&&p.st>=1?1:0;k=0;f=plusTage(h,1)}
 else if(!p||p.st===0){st=1;k=0;f=plusTage(h,ABST[0])}
 else if(h>=p.f&&p.d<h){k=Math.min(p.k+1,3);st=k>=3?3:2;f=plusTage(h,ABST[k])}
 else{st=p.st;k=p.k;f=p.f>h?p.f:plusTage(h,1)}
 S[id]={ok,t:Date.now(),st,k,f,d:h,n};return S[id]}
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}
const online=/^https?:$/.test(location.protocol);
function simStand(){const s=S._sim;return s&&typeof s==='object'&&s.beste&&typeof s.beste.r==='number'?s:null}
const $=s=>document.querySelector(s);const app=$('#app');

const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length,h=heute(),z=[0,0,0,0];let a=0,r=0,w=0,fa=0;list.forEach(q=>{const s=eintrag(q.id);if(s){a++;if(s.ok)r++;w+=GEW[s.st];z[s.st]++;if(s.f<=h)fa++}});
 const pz=x=>t?(x>0?Math.max(1,Math.round(100*x/t)):0):0;return{t,a,r,w,fa,z,pReife:pz(w),pF:pz(a)}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
const ALLE=[],SIT={},HL={};D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>l.items.forEach(q=>{ALLE.push(q);if(l.situation)SIT[q.id]=l.situation;if(l.hilfe)HL[q.id]=l.hilfe}))));
const RUNDE=15;

function pills(st){return `<div class="pills"><span class="pill" data-reife="${st.pReife}"><span class="dot ${st.pReife?'g':''}"></span>Reife ${st.pReife} %</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % bearbeitet</span>${st.fa?`<span class="pill" data-faellig="${st.fa}"><span class="dot b"></span>${st.fa} fällig</span>`:''}</div>`}

const ERKL=`<details class="hilfe erkl"><summary>So zählt die Reife</summary><div><p>Eine Aufgabe zählt erst voll, wenn Sie sie an verschiedenen Tagen richtig lösen. Denn was man nach einigen Tagen noch kann, hat man gelernt.</p><ol><li><b>abgerufen</b>: richtig gelöst (zählt ¼)</li><li><b>gefestigt</b>: an einem späteren Tag wieder richtig (zählt 0,6)</li><li><b>sitzt</b>: nach einer Woche Abstand noch richtig (zählt voll)</li></ol><p>Falsch gelöst? Dann geht die Aufgabe auf „abgerufen“ zurück und ist morgen wieder fällig. Mehrmals am selben Tag üben hebt die Stufe nicht. Fällige Aufgaben kommen gemischt unter „Heute wiederholen“ – am besten 15 bis 25 Minuten an jedem Lerntag.</p></div></details>`;

 <div class="box" id="bereiche"><h2>Prüfungsbereiche</h2><p class="hint">Je Abschnitt die Lektionen „Grundwissen“ und „Prüfungssituation“ – Fälle aus dem Ausbildungsbetrieb wie in der WISO-Prüfung.</p>${D.module.map((m,i)=>{const s=stat(modItems(m));return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${m.abschnitte.length} Abschnitte · ${s.t} Seiten · ${esc(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">30 zufällige Aufgaben aus allen Bereichen wie in der Prüfung (dort 60 Minuten), Auswertung je Bereich</div>${simKurz()}</div></div></div>`}
// „Heute dran“ (Lernregeln, Entscheidung 11.10.2026): fällige Wiederholung zuerst, sonst die nächste neue Lektion; 15–25 Minuten, außerhalb des Unterrichts
function naechsteLektion(){for(let i=0;i<D.module.length;i++){const m=D.module[i];for(let j=0;j<m.abschnitte.length;j++){const a=m.abschnitte[j];for(let k=0;k<a.lektionen.length;k++){const l=a.lektionen[k];if(l.items.some(q=>!eintrag(q.id)))return{go:'l'+i+'.'+j+'.'+k,text:a.nr+' · '+(a.art==='faelle'?l.titel:'Lektion '+(k+1)+': '+l.titel)}}}}return null}
function heuteDran(){const n=faellig().length,h=heute(),morgen=ALLE.filter(q=>{const s=eintrag(q.id);return s&&s.f===plusTage(h,1)}).length,min=Math.round(LZRANG.zeitTage(S._zeit,h,1)/60),neu=naechsteLektion();
 const st=stat(ALLE),sc=LZRANG.score(st.w,st.t),A=LZRANG.anzeige(sc,S._verlauf,h),L=LZRANG.LEITER,N=L[A.i+1],g=benchmark(),gs=LZRANG.ghost(g,h);
 const tage=(Array.isArray(S._tage)?S._tage.filter(d=>typeof d==='string'&&d<=h):[]).sort(),tageOhne=tage.length?LZRANG.tagNr(h)-LZRANG.tagNr(tage[tage.length-1]):null,sim=simStand();
 const tourNeu=!LZTOUR.gesehen('wiso');
 const c=LZCOACH.tipp({tourGesehen:!tourNeu,faellig:n,fehlt:N?N[0]-sc:null,naechster:N?N[1]:null,ausblick:A.ausblick,rang:L[A.i][1],tageOhne,hinterBm:gs!==null&&gs>sc?gs-sc:0,simAnz:sim?sim.anz:0,simN:30,reife:st.pReife,minHeute:min,neu:neu?neu.text:null});
 const ziel=k=>!k?'':k.ziel==='rep'?'data-go="rep"':k.ziel==='sim'?'data-go="sim"':k.ziel==='tour'?'data-a="tour"':neu?`data-go="${neu.go}"`:'data-go="sim"';
 const knopf=c.knopf?`<button class="hd-knopf" ${ziel(c.knopf)} data-coach-ziel="${c.knopf.ziel}">${esc(c.knopf.label)}</button>`:'';
 const link=coachLink(),zweit=(tourNeu&&c.id!=='einfuehrung'?'<button class="hd-zweit" data-a="tour">Einführung</button>':'')+(link?`<a class="hd-zweit" href="${esc(link)}" target="_blank" rel="noopener" data-coach-link="">Lerncoach (AIS.chat)</a><button class="hd-zweit" data-a="stand">Stand kopieren</button>`:'');
 return `<section class="hd" data-rep="${n}" data-coach="${c.id}">${LZRANG.knoten()}<div class="hd-ober">Heute dran · 15–25 Minuten</div><div class="hd-gross">${esc(c.titel)}</div><p>${esc(c.text)}${!n&&morgen?' Morgen fällig: '+morgen+'.':''}</p>${min?`<p data-heute-min="${min}">Heute geübt: ${min} min</p>`:''}${knopf}${zweit?`<div class="hd-coach">${zweit}</div>`:''}</section>`}

 return LZCOACH.standText({ziel:'WISO',rang:LZRANG.LEITER[A.i][1],score:sc,faellig:faellig().length,schwach:schw,gs:LZRANG.ghost(g,h),lerntage:tage})}

 return LZRANG.karte({score:LZRANG.score(st.w,st.t),verlauf:S._verlauf,heute:h,ghost:g,ohneKlasse:online&&!g,hilfe:online?'hilfe.html':null,zeit:{ges:typeof S._zeitGes==='number'?S._zeitGes:0,woche:LZRANG.zeitTage(S._zeit,h,7)},lerntage:tage,ziel:'WISO'})}

 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}

 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 if(vd)$('#uebb').onclick=()=>{P.auf[q.id]=true;qa.classList.remove('verdeckt');$('#ueb').remove();const f=qa.querySelector('input');if(f)f.focus()};
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}${stufeHtml(P.stufe[q.id])}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}else LZRANG.uhr.start();
 chk.onclick=()=>{const a=read(q),ok=check(q,a),h=heute();P.ans[q.id]=a;P.done[q.id]=ok;LZRANG.zeitBuchen(S,LZRANG.uhr.stopp(),h);if(!c.sim){const v=eintrag(q.id),e=bewerte(q.id,ok);P.stufe[q.id]={st:e.st,f:e.f,vor:v?v.st:-1};LZRANG.verlaufBuchen(S,LZRANG.score(stat(ALLE).w,ALLE.length),h);lerntag()}save();fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function stufeHtml(x){if(!x)return '';const auf=x.st>x.vor&&x.vor>=0?' (eine Stufe höher)':x.st<x.vor?' (zurückgestuft)':'';
 return `<div class="stufe" data-stufe="${x.st}">Stufe: <b>${STN[x.st]}</b>${auf} · wieder fällig am ${datKurz(x.f)}</div>`}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Prüfungsbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert${online?' und im <a href="pruefungspass.html">Prüfungspass</a> sichtbar':''}. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}${c.rep?repRest():''}${!c.sim&&wrong.length?'<p class="hint" data-schwer>Falsch gelöst? Gut, dass es jetzt auffällt – Schwierigkeit ist ein Zeichen von Lernen. Diese Aufgaben kommen morgen wieder.</p>':''}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}${c.rep&&!faellig().length?'':`<button class="btn-p" id="again">${c.rep?'Nächste Runde':'Neu starten'}</button>`}</span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));const ag=$('#again');if(ag)ag.onclick=()=>c.sim?sim():c.rep?rep():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function repRest(){const up=P.list.filter(q=>{const x=P.stufe[q.id];return x&&x.vor>=0&&x.st>x.vor}).length,n=faellig().length;
 return `<p class="hint" data-represt="${n}">${up?up+(up===1?' Aufgabe ist':' Aufgaben sind')+' eine Stufe aufgestiegen. ':''}${n?'Noch heute fällig: '+n+'. Eine weitere Runde ist möglich; 15 bis 25 Minuten am Tag genügen.':'Für heute ist alles wiederholt.'} Falsch gelöste Aufgaben kommen morgen wieder.</p>`}
// Heute wiederholen: fällige Aufgaben gemischt, die am längsten fälligen zuerst, höchstens RUNDE; Auswahl-Möglichkeiten erst nach „Antwort überlegt“
function rep(){const due=faellig();if(!due.length)return home();const f=q=>eintrag(q.id).f;
 const pick=shuf(due,String(Date.now())).sort((a,b)=>f(a)<f(b)?-1:f(a)>f(b)?1:0).slice(0,RUNDE);
 start(shuf(pick,'r'+Date.now()),{titel:'Heute wiederholen',crumb:[['Start','home'],['Heute wiederholen']],back:'home',seed:'w'+Date.now(),sit:SIT,hl:HL,verdeckt:true,rep:true})}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={},hl={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);if(l.hilfe)l.items.forEach(q=>hl[q.id]=l.hilfe);
 const lt=a.art==='faelle'?l.titel:'Lektion '+(k+1);
 start(l.items,{titel:`${a.nr} · ${a.art==='faelle'?l.titel:'Lektion '+(k+1)+': '+l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],[lt]],back:'a'+i+'.'+j,seed:'s',sit,hl,full:l.items})}
function sim(){const all=ALLE,pick=shuf(all,String(Date.now())).slice(0,30);start(pick,{titel:'Prüfungssimulation',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed:String(Date.now()),sit:SIT,hl:HL,sim:true,zaehlt:true,verdeckt:true})}
function go(t){window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();if(t==='rep')return rep();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else if(v==='pass'){e.preventDefault();location.href='pruefungspass.html'}else if(v==='tour'){if(document.querySelector('#rating'))tour();else{home();tour()}}else if(v==='stand')LZCOACH.kopieren(standText(),a);else go(v)}});
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}
if(online){$('#zurlz').hidden=false;$('#hilfelink').hidden=false;$('#logo').setAttribute('href','pruefungspass.html');$('#logo').removeAttribute('data-go');$('#logo').setAttribute('aria-label','Zur Lernzentrale')}
// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation, #wiederholen die fälligen Aufgaben (11.10.2026)
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();if(h==='wiederholen')return rep();if(h==='rating'){home();const r=document.getElementById('rating');if(r)r.scrollIntoView();return}
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
