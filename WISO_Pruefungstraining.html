:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.kopfz{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center;text-decoration:none}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
a.btn{text-decoration:none;display:inline-flex;align-items:center}[hidden]{display:none!important}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.hilfe{border:1px solid var(--line);border-radius:8px;margin:10px 0;background:var(--card)}.hilfe>summary{cursor:pointer;padding:8px 12px;font-weight:600;font-size:14px}
.hilfe .tw{overflow-x:auto;padding:0 12px 10px;max-width:100%}.hilfe{min-width:0;max-width:100%;overflow:hidden}.box{min-width:0}.hilfe h3{font-size:14px;margin:8px 0 4px}.hilfe table{border-collapse:collapse;font-size:13px;min-width:100%}
.hilfe th,.hilfe td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}.hilfe th{background:var(--pill)}.hilfe .hn{font-size:12px;color:var(--mute);margin:4px 0 0}
.art{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin:18px 0 0}
.verdeckt .opt{display:none}.ueb{margin:10px 0;padding:10px 12px;border:1px dashed var(--line);border-radius:8px}.ueb p{margin:0 0 8px}
.stz{font-size:13px;color:var(--mute);margin-top:6px}.stufe{font-size:13px;margin-top:6px;color:var(--mute)}.stufe b{color:var(--ink)}
.hilfe.erkl>div{padding:0 12px 10px;font-size:14px}.hilfe.erkl ol{margin:6px 0;padding-left:20px}
.fuss{max-width:860px;margin:0 auto;padding:4px 16px 32px;font-size:13px;color:var(--mute);display:grid;gap:8px}
.fuss .knoepfe{display:flex;flex-wrap:wrap;gap:8px}.fuss button{font-size:13px;padding:6px 12px}
#app{display:grid;gap:16px}#app>.box{margin-bottom:0}
.box h2{margin-bottom:6px}
.zurueck{font-size:14px;margin:0 0 4px}.zurueck a{color:var(--acc2);text-decoration:none;cursor:pointer;font-weight:600}
/* Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026): Rangkarte (.rk), „Heute dran“ (.hd), Kacheln (.kl), Umschalter (.seg), Knoten-Motiv.
   Nur CD-Werte: --cd-* aus cd.py, Dunkelgrün #223D42, Grün #6FA895, Sekundärfarben, Weiß. Hell und dunkel über die Tokens. */
.lz-knoten{display:block;fill:none;stroke-width:1.3}
.rk{display:grid;gap:14px}
.rk-karte,.rk.kompakt{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:18px;display:grid;gap:12px}
.rk h3{margin:0;font-size:17px}
.rk-kopf{display:flex;gap:16px;align-items:center}
.rk-siegel{flex:none;display:block}
.rk-s-ring{fill:none;stroke:var(--cd-leit);stroke-width:1.5}
.rk-s-feld{fill:var(--cd-akzent-hell)}
.rk-s-rund{font-size:7.6px;font-weight:600;letter-spacing:1.9px;fill:var(--cd-leit)}
.rk-s-knoten path{fill:none;stroke:var(--cd-leit);stroke-width:5}
.rk-s-code{font-weight:700;fill:var(--cd-leit);font-family:var(--cd-schrift)}
.rk-titel{font-size:21px;font-weight:700;line-height:1.2}
.rk.kompakt .rk-titel{font-size:17px}
.rk-score{font-size:14px;font-weight:600;margin-top:2px}
.rk-leise,.rk-skala.leise{font-size:13px;color:var(--cd-leise);line-height:1.45;margin:0}
.rk-skala{display:flex;justify-content:space-between;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rk-balken{position:relative;height:34px}
.rk-spur{position:absolute;left:0;right:0;top:11px;height:12px;border-radius:99px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-fill{position:absolute;left:0;top:10px;height:14px;border-radius:99px;background:var(--cd-akzent);min-width:14px}
.rk-ist{position:absolute;top:3px;width:2px;height:28px;margin-left:-1px;background:var(--cd-leit)}
.rk-ghost{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px dashed var(--cd-leit);box-sizing:border-box;background:var(--cd-flaeche);font-size:10px;font-weight:700;color:var(--cd-leit)}
.rk-balken .rk-ghost{position:absolute;top:6px;margin-left:-11px}
.rk-ghost.gross{width:40px;height:40px;font-size:15px;flex:none}
.rk-fehlt,.rk-ausblick{margin:0;font-size:15px;line-height:1.45}
.rk-ausblick{background:var(--cd-teilweise-flaeche);border:1px solid var(--cd-teilweise);border-radius:10px;padding:8px 12px}
.rk-zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.rk-zahlen>div{background:var(--cd-sunk);border-radius:12px;padding:8px 10px;display:grid;align-content:start}
.rk-zahlen span{font-size:11.5px;color:var(--cd-leise)}.rk-zahlen b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bm{display:flex;gap:12px;align-items:flex-start}
.rk-bm p{margin:4px 0 0;font-size:14.5px;line-height:1.45}.rk-bm .rk-leise{font-size:13px}
.rk-bm-t{font-weight:700}
.rk-leiter{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;min-height:110px}
.rk-stufe{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.rk-saeule{align-self:stretch;border-radius:4px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-stufe.erreicht .rk-saeule{background:var(--cd-akzent);border-color:var(--cd-akzent)}
.rk-stufe.aktuell .rk-saeule{background:var(--cd-leit);border-color:var(--cd-leit)}
.rk-code{font-size:11px;font-weight:700}.rk-ab{font-size:10px;color:var(--cd-leise);font-variant-numeric:tabular-nums}
.rk-stufe:not(.aktuell):not(.erreicht) .rk-code{color:var(--cd-leise)}
.rk-kurs{width:100%;height:auto;display:block;font-family:var(--cd-schrift)}
.rk-k-band{stroke:var(--cd-rand);stroke-width:1}.rk-k-band.ig{stroke-width:1.8}
.rk-k-achse{stroke:var(--cd-leise);stroke-width:1}
.rk-k-txt{font-size:10px;fill:var(--cd-leise)}.rk-k-txt.ig,.rk-k-txt.fett{fill:var(--cd-text);font-weight:700}
.rk-k-ghost{fill:none;stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:5 4}
.rk-k-ist{fill:none;stroke:var(--cd-akzent);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.rk-k-prog{fill:none;stroke:var(--cd-akzent);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.rk-k-punkt{fill:var(--cd-akzent);stroke:var(--cd-flaeche);stroke-width:2}
.rk-k-gpunkt{fill:var(--cd-flaeche);stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:2 2}
.rk-k-pruef{stroke:var(--cd-leit);stroke-width:1.5}
.rk-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--cd-leise)}
.rk-legende span{display:flex;align-items:center;gap:6px}.rk-legende i{display:inline-block;width:18px;height:0;border-top:3px solid var(--cd-akzent)}
.rk-legende i.gh{border-top:2px dashed var(--cd-leit)}.rk-legende i.pr{border-top:2px dotted var(--cd-akzent)}
.rk-mehr{font-weight:600;font-size:14px;justify-self:start}
/* „Heute dran“: in beiden Ansichten Dunkelgrün mit weißer Schrift */
.hd{position:relative;overflow:hidden;background:#223D42;color:#FFFFFF;border-radius:20px;padding:20px;display:grid;gap:8px}
.hd .lz-knoten{position:absolute;right:-56px;top:-30px;width:220px;height:190px;stroke:#6FA895}
.hd>*:not(.lz-knoten){position:relative}
.hd-ober{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#CEE3DD}
.hd-gross{font-size:25px;font-weight:700;line-height:1.2}
.hd p,.hd li{margin:0;font-size:14.5px;line-height:1.45;color:#E9F1ED;max-width:34em}
.hd a{color:#FFFFFF}
.hd-knopf{justify-self:start;margin-top:4px;background:#FFFFFF;color:#223D42 !important;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:12px 20px;border:0;cursor:pointer;font-family:inherit}
.hd-knopf:hover{background:#E9F1ED}
.hd ol{margin:4px 0 0;padding-left:1.2rem;display:grid;gap:4px}
.hd-fertig{display:inline-block;background:#6FA895;color:#223D42;font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px}
/* Kacheln mit Motiv */
.kl-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.kl{text-decoration:none;color:var(--cd-text);background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.kl:hover{border-color:var(--cd-akzent)}
.kl-bild{position:relative;height:84px;overflow:hidden;background:var(--cd-akzent-hell)}
.kl-bild.dunkel{background:#223D42}.kl-bild.gruen{background:#6FA895}.kl-bild.grau{background:#CDD9DF}
.kl-bild .lz-knoten{position:absolute;right:-38px;bottom:-40px;width:150px;height:128px;stroke:var(--cd-flaeche)}
.kl-bild.grau .lz-knoten{stroke:#FFFFFF}
.kl-bild.dunkel .lz-knoten{stroke:#6FA895}.kl-bild.gruen .lz-knoten{stroke:#CEE3DD}
.kl-sym{position:absolute;left:14px;top:14px;width:30px;height:30px;fill:none;stroke:var(--cd-leit);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kl-bild.dunkel .kl-sym{stroke:#FFFFFF}.kl-bild.grau .kl-sym,.kl-bild.gruen .kl-sym{stroke:#223D42}
.kl-neu{position:absolute;right:10px;top:10px;background:#FFFFFF;color:#223D42;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.kl-bild.gruen .kl-neu,.kl-bild.grau .kl-neu,.kl-bild:not(.dunkel) .kl-neu{background:#223D42;color:#FFFFFF}
.kl-text{padding:12px 14px 14px;display:grid;gap:3px}
.kl-titel{font-size:15px;font-weight:700;line-height:1.25}.kl-meta{font-size:12.5px;color:var(--cd-leise)}
/* Umschalter (Segmente) */
.seg{display:flex;gap:4px;background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:14px;padding:4px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:var(--cd-text);cursor:pointer;display:grid;gap:1px;min-height:2.75rem}
.seg button small{font-size:11.5px;font-weight:500;color:var(--cd-leise)}
.seg button[aria-pressed="true"]{background:var(--cd-leit);color:var(--cd-auf-leit)}
.seg button[aria-pressed="true"] small{color:var(--cd-auf-leit)}
/* aufklappbare Zeilen */
.zeilen{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:2px 16px}
.zeilen>details{border-top:1px solid var(--cd-sunk);margin:0}.zeilen>details:first-child{border-top:0}
.zeilen>details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:700}
.zeilen>details>summary::-webkit-details-marker{display:none}
.zeilen>details>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--cd-leit);border-bottom:2px solid var(--cd-leit);transform:rotate(45deg);flex:none;margin-right:4px;transition:transform .15s}
.zeilen>details[open]>summary::after{transform:rotate(225deg)}
.zeilen summary small{display:block;font-weight:500;font-size:13px;color:var(--cd-leise)}
.zeilen>details>.inhalt{padding:0 0 14px}
/* Coach-Zeile und Einführung (seit 11.10.2026) */
.hd-coach{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hd-zweit{background:transparent;color:#FFFFFF !important;border:1px solid #6FA895;border-radius:10px;padding:7px 11px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:2.5rem;display:inline-flex;align-items:center}
.hd-zweit:hover{border-color:#FFFFFF}
.hilfe-link{font-size:13px;font-weight:600;color:var(--cd-link);justify-self:start}
.tour-sperre{position:fixed;inset:0;z-index:999}
.tour-licht{position:fixed;z-index:1000;border-radius:14px;box-shadow:0 0 0 9999px color-mix(in srgb,#132224 72%,transparent);pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s}
.tour-blase{position:fixed;z-index:1001;background:var(--cd-flaeche);color:var(--cd-text);border:1px solid var(--cd-rand);border-radius:16px;padding:16px;width:min(340px,calc(100vw - 24px));box-shadow:var(--cd-schatten);font-family:var(--cd-schrift)}
.tour-blase h2{font-size:18px;margin:2px 0 6px}.tour-blase p{margin:0 0 12px;font-size:15px;line-height:1.45}
.tour-schritt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cd-leise)}
.tour-knoepfe{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tour-knoepfe button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:8px 14px;border:1px solid var(--cd-rand);background:var(--cd-flaeche);color:var(--cd-text);cursor:pointer;min-height:2.6rem}
.tour-knoepfe .tour-vor{background:var(--cd-leit);border-color:var(--cd-leit);color:var(--cd-auf-leit)}
.tour-knoepfe .tour-weg{margin-right:auto;border-color:transparent;color:var(--cd-leise)}
.tour-knoepfe button:disabled{opacity:.4;cursor:default}

@media (max-width:480px){h1{font-size:20px}.num input{width:130px}.brand small{display:none}}
</style>
</head>

<footer class="fuss" id="fuss"><div class="knoepfe"><button data-a="home">Startseite des Trainings</button><button data-a="tour">Einführung</button><a class="btn" id="hilfelink" href="hilfe.html" hidden>So funktioniert die Lernzentrale</a><button data-a="theme">Hell/Dunkel</button><button data-a="reset">Fortschritt zurücksetzen</button></div><div>Ihr Fortschritt bleibt nur in diesem Browser gespeichert. Die Lernzeit zählt nur die aktive Zeit an einer Aufgabe, höchstens drei Minuten je Aufgabe.</div></footer>
<script>
// Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026, Entscheidung Christian, Variante C):
// Rating-Leiter NR–AAA auf dem Score 0–1000 (= Reife × 10), Benchmark („Ghost“) je Klasse, Tempo, Lernzeit, Rangkarte, Knoten-Motiv.
// Eingebunden von Werkzeug/gap1/build.py (Prüfungstraining) und Werkzeug/pass/bau_pass.py (Startseite) über cd.bausteine_js().
// Keine Abhängigkeiten, kein Netz; alle Texte sind feste Bausteintexte (Zahlen werden eingesetzt, nichts aus Nutzereingaben).
const LZRANG = (() => {
  'use strict';
  // [ab Score, Kürzel, Kurztext] – Schwellen: BBB = 60 % Reife (teilweise sicher, „Investment Grade“), AA = 85 % (sicher)
  const LEITER = [
    [0, 'NR', 'Not Rated – noch ohne Bewertung'],
    [10, 'CCC', 'Erste Aufgaben abgerufen'],
    [80, 'B', 'Der Anfang ist gemacht'],
    [250, 'BB', 'Spürbarer Grundstock'],
    [400, 'BB+', 'Knapp vor Investment Grade'],
    [600, 'BBB', 'Investment Grade – prüfungsfähig'],
    [750, 'A', 'Solide prüfungsfähig'],
    [850, 'AA', 'Sicher für die Prüfung'],
    [950, 'AAA', 'Peak – Spitzenbewertung'],
  ];
  const ZIEL_GHOST = 850;          // AA eine Woche vor der Prüfung
  const KURVE = 1.5;               // langsamer Beginn, steiler vor der Prüfung
  const MAX_SEK_JE_AUFGABE = 180;  // aktive Lernzeit: höchstens 3 Minuten je Aufgabe
  const istTag = x => typeof x === 'string' && /^\d{4}-\d\d-\d\d$/.test(x);
  const tagNr = s => { const z = s.split('-').map(Number); return Math.round(Date.UTC(z[0], z[1] - 1, z[2]) / 864e5); };
  const tagIso = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
  const datum = s => { const z = s.split('-'); return +z[2] + '.' + (+z[1]) + '.' + z[0]; };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function score(w, n) { return n ? Math.max(0, Math.min(1000, Math.round(1000 * w / n))) : 0; }
  function rang(s) { let i = 0; LEITER.forEach((x, k) => { if (s >= x[0]) i = k; }); return i; }

  // Benchmark: Soll-Score am Tag heute; g = { von: 'JJJJ-MM-TT' (Ausbildungsbeginn), bis: 'JJJJ-MM-TT' (Prüfung − 7 Tage) }
  function ghost(g, heute) {
    if (!g || !istTag(g.von) || !istTag(g.bis) || !istTag(heute)) return null;
    const a = tagNr(g.von), b = tagNr(g.bis), h = tagNr(heute);
    if (b <= a) return null;
    const x = Math.min(1, Math.max(0, (h - a) / (b - a)));
    return Math.round(ZIEL_GHOST * Math.pow(x, KURVE));
  }
  // Ghost-Parameter aus Klasse und Termin: beginn 'JJJJ-MM', termin 'JJJJ-MM-TT' oder 'JJJJ-MM' (dann der Monatserste)
  function ghostVon(beginn, termin) {
    if (!/^\d{4}-\d\d$/.test(beginn || '') || !/^\d{4}-\d\d(-\d\d)?$/.test(termin || '')) return null;
    const t = termin.length === 7 ? termin + '-01' : termin;
    return { von: beginn + '-01', bis: tagIso(tagNr(t) - 7), pruefung: t };
  }

  // Verlauf { 'JJJJ-MM-TT': Score } bereinigt und sortiert
  function reihe(v) { return Object.keys(v && typeof v === 'object' ? v : {}).filter(k => istTag(k) && typeof v[k] === 'number' && isFinite(v[k])).sort().map(k => [k, v[k]]); }
  // Tempo in Score je Tag: Anstieg über die letzten 14 Tage (mindestens 3 Tage Abstand), sonst null
  function tempo(v, heute, jetzt) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return null;
    const h = tagNr(heute), ziel = h - 14;
    let ab = r[0]; r.forEach(x => { if (tagNr(x[0]) <= ziel) ab = x; });
    const tage = h - tagNr(ab[0]); if (tage < 3) return null;
    const t = ((typeof jetzt === 'number' ? jetzt : r[r.length - 1][1]) - ab[1]) / tage;
    return t > 0 ? t : null;
  }
  // angezeigter Rang: der höchste Rang der letzten 7 Tage; liegt der Score darunter → „Ausblick negativ“ (Abstieg erst nach 7 Tagen)
  function anzeige(s, v, heute) {
    const jetzt = rang(s); let hoch = jetzt;
    const h = tagNr(heute);
    reihe(v).forEach(x => { const d = h - tagNr(x[0]); if (d >= 0 && d <= 6) hoch = Math.max(hoch, rang(x[1])); });
    return { i: hoch, jetzt, ausblick: hoch > jetzt };
  }

  // Lernzeit: Sekunden → „31 h 20 min“ / „45 min“
  function zeit(sek) { const m = Math.round((sek || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; }
  function zeitTage(z, heute, tage) { if (!z || typeof z !== 'object') return 0; const h = tagNr(heute); let s = 0; Object.keys(z).forEach(k => { if (istTag(k) && typeof z[k] === 'number') { const d = h - tagNr(k); if (d >= 0 && d < tage) s += z[k]; } }); return s; }
  // aktive Zeit messen: start() beim Anzeigen einer Aufgabe, stopp() beim Prüfen → Sekunden (Tab im Hintergrund zählt nicht, höchstens 3 Minuten)
  const uhr = (() => { let seit = null, summe = 0;
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { const n = Date.now(); if (document.hidden) { if (seit !== null) { summe += n - seit; seit = null; } } else if (seit === null) seit = n; });
    return { start() { summe = 0; seit = (typeof document !== 'undefined' && document.hidden) ? null : Date.now(); },
      stopp() { const n = Date.now(), ms = summe + (seit !== null ? n - seit : 0); summe = 0; seit = null; return Math.min(MAX_SEK_JE_AUFGABE, Math.max(0, Math.round(ms / 1000))); } }; })();
  function zeitBuchen(S, sek, heute) {
    if (!sek) return; const z = S._zeit && typeof S._zeit === 'object' ? S._zeit : {};
    z[heute] = (typeof z[heute] === 'number' ? z[heute] : 0) + sek;
    const k = Object.keys(z).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 60)).forEach(x => delete z[x]);
    S._zeit = z; S._zeitGes = (typeof S._zeitGes === 'number' ? S._zeitGes : 0) + sek;
  }
  function verlaufBuchen(S, s, heute) {
    const v = S._verlauf && typeof S._verlauf === 'object' ? S._verlauf : {}; v[heute] = s;
    const k = Object.keys(v).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 400)).forEach(x => delete v[x]);
    S._verlauf = v;
  }

  // Knoten aus dem Schul-Icon als Motiv (wie auf Mappe und Design Manual): vergrößert, angeschnitten, nur Strich
  const KNOTEN = ['M100.44,95.07l20.74-20.74c.69-.69,1.81-.69,2.5,0l29.96,29.96c6.42,6.42,6.42,16.82,0,23.23h0c-6.42,6.42-16.82,6.42-23.23,0l-29.96-29.96c-.69-.69-.69-1.81,0-2.5Z',
    'M123.67,74.34l20.74,20.74c.69,.69,.69,1.81,0,2.5l-29.96,29.96c-6.42,6.42-16.82,6.42-23.23,0h0c-6.42-6.42-6.42-16.82,0-23.23l29.96-29.96c.69-.69,1.81-.69,2.5,0Z',
    'M100.44,111.08l20.74,20.74c.69,.69,1.81,.69,2.5,0l29.96-29.96c6.42-6.42,6.42-16.82,0-23.23h0c-6.42-6.42-16.82-6.42-23.23,0l-29.96,29.96c-.69,.69-.69,1.81,0,2.5Z',
    'M123.67,131.82l20.74-20.74c.69-.69,.69-1.81,0-2.5l-29.96-29.96c-6.42-6.42-16.82-6.42-23.23,0h0c-6.42,6.42-6.42,16.82,0,23.23l29.96,29.96c.69,.69,1.81,.69,2.5,0Z'];
  function knoten(klasse) { return '<svg class="' + esc(klasse || 'lz-knoten') + '" aria-hidden="true" focusable="false" viewBox="86 72 73 62">' + KNOTEN.map(d => '<path d="' + d + '"/>').join('') + '</svg>'; }

  // Siegel mit Rating (rund, nach dem Schulsiegel „Schule mit kaufmännischer Tradition“)
  let siegelNr = 0;
  function siegel(code, ziel, gross) {
    const id = 'lzs' + (++siegelNr), s = gross ? 104 : 64;
    return '<svg class="rk-siegel" role="img" aria-label="Rating ' + esc(code) + '" width="' + s + '" height="' + s + '" viewBox="0 0 108 108">' +
      '<defs><path id="' + id + '" d="M54,54 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>' +
      '<circle cx="54" cy="54" r="52" class="rk-s-ring"/><circle cx="54" cy="54" r="37" class="rk-s-feld"/>' +
      (gross ? '<text class="rk-s-rund"><textPath href="#' + id + '">LERNZENTRALE KVF · RATING ' + esc(ziel) + ' · LISTSCHULE ·</textPath></text>' : '') +
      '<g transform="translate(45 ' + (gross ? 25 : 27) + ') scale(0.24)" class="rk-s-knoten">' + KNOTEN.map(d => '<path d="' + d + '" transform="translate(-86 -74)"/>').join('') + '</g>' +
      '<text x="54" y="' + (gross ? 71 : 72) + '" text-anchor="middle" class="rk-s-code" font-size="' + (code.length > 2 ? 24 : 28) + '">' + esc(code) + '</text></svg>';
  }

  // Kursverlauf: Ist, Benchmark, Prognose; Bänder BB, BBB, AA
  function kurs(v, g, heute, tp) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return '';
    const a = tagNr(r[0][0]), h = tagNr(heute);
    const b = g ? Math.max(tagNr(g.bis), h + 7) : h + 30;
    const W = 360, H = 180, x0 = 40, x1 = 348, y0 = 150, y1 = 14;
    const X = t => (x0 + (x1 - x0) * (t - a) / Math.max(1, b - a)).toFixed(1), Y = s => (y0 - (y0 - y1) * Math.min(1000, Math.max(0, s)) / 1000).toFixed(1);
    let o = '<svg class="rk-kurs" role="img" aria-label="Kursverlauf seit ' + datum(r[0][0]) + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    [[250, 'BB'], [600, 'BBB'], [850, 'AA']].forEach(([s, t]) => { o += '<line x1="' + x0 + '" y1="' + Y(s) + '" x2="' + x1 + '" y2="' + Y(s) + '" class="rk-k-band' + (s === 600 ? ' ig' : '') + '"/><text x="' + (x0 - 6) + '" y="' + (+Y(s) + 3.5) + '" text-anchor="end" class="rk-k-txt' + (s === 600 ? ' ig' : '') + '">' + t + '</text>'; });
    o += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1 + '" y2="' + y0 + '" class="rk-k-achse"/>';
    if (g) { const p = []; for (let t = a; t <= b; t += Math.max(1, Math.round((b - a) / 40))) p.push(X(t) + ',' + Y(ghost(g, tagIso(t)))); p.push(X(b) + ',' + Y(ghost(g, tagIso(b)))); o += '<polyline class="rk-k-ghost" points="' + p.join(' ') + '"/>'; }
    o += '<polyline class="rk-k-ist" points="' + r.map(x => X(tagNr(x[0])) + ',' + Y(x[1])).join(' ') + '"/>';
    const jetzt = r[r.length - 1][1];
    if (tp) o += '<polyline class="rk-k-prog" points="' + X(h) + ',' + Y(jetzt) + ' ' + X(b) + ',' + Y(jetzt + tp * (b - h)) + '"/>';
    if (g) o += '<circle cx="' + X(h) + '" cy="' + Y(ghost(g, heute)) + '" r="5" class="rk-k-gpunkt"/>';
    o += '<circle cx="' + X(h) + '" cy="' + Y(jetzt) + '" r="5" class="rk-k-punkt"/>';
    if (+X(h) - x0 > 46) o += '<text x="' + x0 + '" y="166" class="rk-k-txt">' + datum(r[0][0]).replace(/\.\d{2}(\d{2})$/, '.$1') + '</text>'; o += '<text x="' + X(h) + '" y="170" text-anchor="middle" class="rk-k-txt fett">heute</text>';
    if (g) o += '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x1 + '" y2="' + y0 + '" class="rk-k-pruef"/><text x="' + x1 + '" y="10" text-anchor="end" class="rk-k-txt fett">Prüfung ' + datum(g.pruefung) + '</text>';
    return o + '</svg>';
  }

  // Rangkarte als HTML. o = { score, verlauf, heute, ghost (Parameter oder null), zeit: {ges, woche}, lerntage, ziel ('GAP 1'),
  //   kompakt (Startseite), link (Ziel der Karte in kompakter Form), ohneKlasse (Hinweis statt Benchmark), beispiel }
  function karte(o) {
    const s = o.score, V = Object.assign({}, o.verlauf && typeof o.verlauf === 'object' ? o.verlauf : {}); V[o.heute] = s;   // heutiger Stand gehört in den Verlauf
    const A = anzeige(s, V, o.heute), L = LEITER[A.i], N = LEITER[A.i + 1] || null;
    const gs = ghost(o.ghost, o.heute), tp = tempo(V, o.heute, s);
    const von = L[0], bis = N ? N[0] : 1000, pIst = Math.max(0, Math.min(100, 100 * (s - von) / Math.max(1, bis - von)));
    const pG = gs === null ? null : Math.max(3, Math.min(97, 100 * (gs - von) / Math.max(1, bis - von)));   // Marker bleibt sichtbar im Balken
    const fehlt = N ? Math.max(0, N[0] - s) : 0;
    const dauer = n => n <= 13 ? 'etwa ' + n + (n === 1 ? ' Tag' : ' Tage') : 'etwa ' + Math.round(n / 7) + ' Wochen';
    let ziel = A.ausblick ? '<p class="rk-ausblick" data-ausblick=""><b>Ausblick negativ:</b> Ihr Score liegt unter ' + L[0] + '. Bleibt das sieben Tage so, sinkt das Rating auf ' + LEITER[A.jetzt][1] + '. Wiederholen hilft am schnellsten.</p>'
      : N ? '<p class="rk-fehlt" data-fehlt="' + fehlt + '"><b>Noch ' + fehlt + ' bis ' + N[1] + '.</b>' + (tp ? ' Bei Ihrem Tempo ' + dauer(Math.ceil(fehlt / tp)) + '.' : ' Mit regelmäßigen kurzen Lerntagen kommen Sie voran.') + '</p>'
      : '<p class="rk-fehlt" data-fehlt="0"><b>Höchste Stufe erreicht.</b> Halten Sie sie mit kurzen Wiederholungen.</p>';
    let bm = '';
    if (gs !== null) {
      const d = s - gs, steig = (ghost(o.ghost, tagIso(tagNr(o.heute) + 7)) - gs) / 7;
      let satz;
      if (d >= 0) satz = 'Sie liegen <b>' + d + ' vor</b> dem Benchmark – ein Puffer für die Prüfungsphase.';
      else if (tp && tp > steig) satz = 'Der Benchmark liegt <b>' + (-d) + ' vor</b> Ihnen. Bei Ihrem Tempo holen Sie ihn in ' + dauer(Math.ceil(-d / (tp - steig))) + ' ein.';
      else satz = 'Der Benchmark liegt <b>' + (-d) + ' vor</b> Ihnen. Mehrere kurze Lerntage pro Woche bringen Sie heran – 15 bis 25 Minuten genügen.';
      bm = '<div class="rk-bm" data-ghost="' + gs + '"><span class="rk-ghost gross" aria-hidden="true">B</span><div><div class="rk-bm-t">Benchmark heute: ' + LEITER[rang(gs)][1] + ' · ' + gs + '</div><p>' + satz + '</p>' +
        (o.hilfe ? '<p><a class="hilfe-link" href="' + esc(o.hilfe) + '#benchmark">Was ist der Benchmark?</a></p>' : '') +
        (o.kompakt ? '' : '<p class="rk-leise">Der Benchmark ist der Soll-Stand für Ihre Prüfung am ' + datum(o.ghost.pruefung) + ': Er beginnt mit der Ausbildung langsam und steht eine Woche vor der Prüfung auf AA.</p>') + '</div></div>';
    } else if (o.ohneKlasse) bm = '<p class="rk-leise" data-ghost="">Den Benchmark sehen Sie, sobald Sie auf der Startseite der Lernzentrale Ihre Klasse gewählt haben.</p>';
    const balken = '<div class="rk-skala"><span>' + L[1] + ' · ' + von + '</span><span>' + (N ? N[1] + ' · ' + N[0] : '1000') + '</span></div>' +
      '<div class="rk-balken" role="img" aria-label="Score ' + s + ' zwischen ' + von + ' und ' + bis + (gs !== null ? ', Benchmark ' + gs : '') + '"><span class="rk-spur"></span><span class="rk-fill" style="width:' + pIst.toFixed(1) + '%"></span><span class="rk-ist" style="left:' + pIst.toFixed(1) + '%"></span>' +
      (pG !== null ? '<span class="rk-ghost" style="left:' + pG.toFixed(1) + '%">B</span>' : '') + '</div>' +
      '<div class="rk-skala leise"><span>Sie: ' + s + '</span>' + (gs !== null ? '<span>Benchmark: ' + gs + '</span>' : '<span></span>') + '</div>';
    const kopf = '<div class="rk-kopf">' + siegel(L[1], o.ziel, !o.kompakt) + '<div><div class="rk-titel">Rating ' + L[1] + (o.kompakt ? ' · Score ' + s : '') + '</div><div class="rk-leise">' + L[2] + '</div>' + (o.kompakt ? '' : '<div class="rk-score">Score ' + s + ' von 1000</div>') + '</div></div>';
    const hl = o.hilfe ? '<a class="hilfe-link" href="' + esc(o.hilfe) + '#score" data-hilfe="score">Was bedeuten Score und Rating?</a>' : '';
    if (o.kompakt) return '<div class="rk kompakt" data-rang="' + L[1] + '" data-score="' + s + '">' + kopf + balken + ziel + hl + bm + (o.link ? '<a class="rk-mehr" href="' + esc(o.link) + '">Rating, Rangleiter und Kursverlauf</a>' : '') + '</div>';
    const zeitbox = '<div class="rk-zahlen"><div><span>Lernzeit gesamt</span><b data-lernzeit="' + Math.round((o.zeit && o.zeit.ges) || 0) + '">' + zeit(o.zeit && o.zeit.ges) + '</b></div><div><span>letzte 7 Tage</span><b>' + zeit(o.zeit && o.zeit.woche) + '</b></div>' +
      (typeof o.lerntage === 'number' ? '<div><span>Lerntage</span><b>' + o.lerntage + ' / 28</b></div>' : '') + '</div>';
    const leiter = '<div class="rk-leiter" role="img" aria-label="Rangleiter von NR bis AAA, aktuell ' + L[1] + '">' + LEITER.map((x, k) => '<div class="rk-stufe' + (k < A.i ? ' erreicht' : k === A.i ? ' aktuell' : '') + '">' +
      (gs !== null && rang(gs) === k ? '<span class="rk-ghost">B</span>' : '') + '<span class="rk-saeule" style="height:' + (14 + k * 7) + 'px"></span><span class="rk-code">' + x[1] + '</span><span class="rk-ab">' + x[0] + '</span></div>').join('') + '</div>' +
      '<p class="rk-leise">Ab BBB „Investment Grade“: prüfungsfähig. Ab AA: sicher. Score = Reife × 10. Ein Rating sinkt erst, wenn der Score sieben Tage unter der Schwelle bleibt.</p>';
    const r = reihe(V);
    const kv = r.length && tagNr(o.heute) - tagNr(r[0][0]) >= 13 ? kurs(V, gs !== null ? o.ghost : null, o.heute, tp) +
      '<div class="rk-legende"><span><i class="ist"></i>Sie</span>' + (gs !== null ? '<span><i class="gh"></i>Benchmark</span>' : '') + (tp ? '<span><i class="pr"></i>Prognose bei Ihrem Tempo</span>' : '') + '</div>'
      : '<p class="rk-leise" data-kurs="leer">Den Kursverlauf zeigt die Karte nach zwei Wochen Übung.</p>';
    return '<div class="rk" data-rang="' + L[1] + '" data-score="' + s + '">' +
      '<section class="rk-karte">' + kopf + balken + ziel + zeitbox + hl + '</section>' +
      (bm ? '<section class="rk-karte">' + bm + '</section>' : '') +
      '<section class="rk-karte"><h3>Rangleiter</h3>' + leiter + '</section>' +
      '<section class="rk-karte"><h3>Kursverlauf</h3>' + kv + '</section></div>';
  }

  return { LEITER, ZIEL_GHOST, score, rang, ghost, ghostVon, tempo, anzeige, zeit, zeitTage, uhr, zeitBuchen, verlaufBuchen, knoten, siegel, karte, tagNr, tagIso };
})();

// ------------------------------------------------------------------ Coach (seit 11.10.2026, Entscheidung Christian: regelbasiert, ohne KI, ohne Netz)
// Ein Hinweis je Besuch, der wichtigste zuerst. Die Seite zeichnet ihn im Kasten „Heute dran“; knopf.ziel: rep | tour | neu | sim.
const LZCOACH = (() => {
  'use strict';
  // c = { tourGesehen, faellig, fehlt, naechster, ausblick, rang, tageOhne (Tage seit dem letzten Lerntag, null = nie), hinterBm (Abstand, 0 = vorn),
  //       simAnz, reife (%), minHeute, neu (Text der nächsten neuen Lektion oder null) }
  function tipp(c) {
    const n = c.faellig | 0, nah = typeof c.fehlt === 'number' && c.naechster && c.naechster !== 'CCC' && c.fehlt > 0 && c.fehlt <= 20;   // „fast“ erst ab dem ersten Rating
    // Einführung als Haupthinweis nur beim allerersten Besuch (noch nie geübt, nichts fällig); sonst bietet die Seite sie als Zweitknopf an
    if (!c.tourGesehen && c.tageOhne === null && !n) return { id: 'einfuehrung', titel: 'Willkommen in der Lernzentrale', text: 'In zwei Minuten zeigt die Einführung, wie „Heute dran“, Rating, Benchmark und Trainingspunkte zusammenhängen.', knopf: { label: 'Einführung starten', ziel: 'tour' } };
    if (c.ausblick) return { id: 'ausblick', titel: 'Ihr ' + c.rang + ' wackelt', text: 'Ihr Score liegt unter der Schwelle für ' + c.rang + '. Bleibt das sieben Tage so, sinkt das Rating. Eine Runde Wiederholen sichert es am schnellsten.', knopf: n ? { label: 'Jetzt wiederholen', ziel: 'rep' } : { label: 'Weiter üben', ziel: 'neu' } };
    if (n) {
      const text = nah ? 'Noch ' + c.fehlt + ' bis ' + c.naechster + ' – eine Runde kann schon reichen.'
        : (c.tageOhne !== null && c.tageOhne >= 3 && c.hinterBm > 0) ? 'Schön, dass Sie wieder da sind. Eine Runde bringt Sie dem Benchmark näher.'
          : 'Eine Runde: bis zu 15 Aufgaben gemischt aus allen Bereichen. Erst selbst überlegen, dann die Möglichkeiten ansehen.';
      return { id: nah ? 'faellig-nah' : 'faellig', titel: n + (n === 1 ? ' Aufgabe' : ' Aufgaben') + ' fällig', text, knopf: { label: 'Jetzt wiederholen', ziel: 'rep' } };
    }
    if ((c.minHeute | 0) >= 15) return { id: 'fertig', titel: 'Fertig für heute', text: 'Heute ' + c.minHeute + ' Minuten geübt. Der Rest passiert im Schlaf – morgen geht es weiter.', knopf: c.neu ? { label: 'Trotzdem weiter', ziel: 'neu' } : null };
    if (!(c.simAnz | 0) && (c.reife | 0) >= 25) return { id: 'simulation', titel: 'Zeit für eine Generalprobe', text: 'Testen Sie sich mit der Prüfungssimulation: ' + ((c.simN | 0) || 20) + ' Aufgaben gemischt wie in der Prüfung, Auswertung je Bereich.', knopf: { label: 'Simulation starten', ziel: 'sim' } };
    if (nah) return { id: 'nah', titel: 'Fast ' + c.naechster, text: 'Noch ' + c.fehlt + ' bis ' + c.naechster + '. Eine neue Lektion heute, morgen die Wiederholung – dann steigen Sie auf.', knopf: { label: 'Neue Lektion starten', ziel: 'neu' } };
    if (c.tageOhne !== null && c.tageOhne >= 3) return { id: 'zurueck', titel: 'Willkommen zurück', text: 'Kurze Lerntage wirken stärker als lange. ' + (c.neu ? 'Als Nächstes: ' + c.neu + '.' : ''), knopf: c.neu ? { label: 'Neue Lektion starten', ziel: 'neu' } : null };
    return { id: 'weiter', titel: c.tageOhne === null ? 'Los geht’s' : 'Ihr nächster Schritt', text: c.neu ? 'Heute ist nichts fällig. Als Nächstes: ' + c.neu + '.' : 'Alles bearbeitet. Halten Sie Ihren Stand mit der Simulation und den Wiederholungen.', knopf: c.neu ? { label: 'Neue Lektion starten', ziel: 'neu' } : { label: 'Simulation starten', ziel: 'sim' } };
  }
  // Text für „Meinen Stand kopieren“ (ohne Namen; für den Lerncoach in AIS.chat)
  function standText(o) {
    const t = ['Mein Stand im Prüfungstraining ' + o.ziel + ': Rating ' + o.rang + ' (Score ' + o.score + ' von 1000)'];
    t.push(o.faellig + (o.faellig === 1 ? ' Aufgabe' : ' Aufgaben') + ' fällig');
    if (o.schwach) t.push('schwächster Bereich ' + o.schwach.nr + ' „' + o.schwach.titel + '“ (Reife ' + o.schwach.reife + ' %)');
    if (typeof o.gs === 'number') t.push('Benchmark ' + o.gs + ' (' + (o.score >= o.gs ? (o.score - o.gs) + ' hinter mir' : (o.gs - o.score) + ' vor mir') + ')');
    if (typeof o.lerntage === 'number') t.push(o.lerntage + (o.lerntage === 1 ? ' Lerntag' : ' Lerntage') + ' in den letzten 28 Tagen');
    return t.join(', ') + '.';
  }
  function kopieren(text, knopf) {
    const fertig = () => { if (knopf) { knopf.textContent = 'Kopiert ✓'; knopf.setAttribute('data-kopiert', ''); } };
    const ersatz = () => { const ta = document.createElement('textarea'); ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { /* manuell */ } ta.remove(); fertig(); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(fertig, ersatz); else ersatz();
  }
  // Coach-Link (AIS.chat) und Benchmark merkt die Startseite in 'pruefungspass-v1'; nur Links von app.ais-chat.schule
  const linkOk = l => typeof l === 'string' && /^https:\/\/app\.ais-chat\.schule\/[\w\-./?=&%#]*$/.test(l);
  return { tipp, standText, kopieren, linkOk };
})();

// ------------------------------------------------------------------ Einführung (Tour): hebt echte Elemente nacheinander hervor
// LZTOUR.start([{ sel, titel, text }], { key, ende: { label, aktion }, nachher }) – Schritte ohne sichtbares Element werden übersprungen;
// nachher (seit 12.10.2026): wird nach jedem Schließen aufgerufen (Fertig, Überspringen, Esc), z. B. um die Startseite neu zu zeichnen.
const LZTOUR = (() => {
  'use strict';
  let offen = null, nach = null;
  const lies = k => { try { return JSON.parse(localStorage.getItem('lz-tour-v1') || '{}')[k] || null; } catch (e) { return null; } };
  const merke = k => { try { const x = JSON.parse(localStorage.getItem('lz-tour-v1') || '{}'); const d = new Date(); x[k] = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); localStorage.setItem('lz-tour-v1', JSON.stringify(x)); } catch (e) { /* ohne Speicher */ } };
  function zu(k, gesehen) { if (!offen) return; offen.forEach(e => e.remove()); offen = null; document.removeEventListener('keydown', taste); if (gesehen !== false) merke(k); const f = nach; nach = null; if (f && gesehen !== false) f(); }
  let taste = null;
  function start(schritte, o) {
    o = o || {}; const k = o.key || 'start';
    const liste = schritte.filter(s => { const e = document.querySelector(s.sel); return e && e.getClientRects().length; });
    if (!liste.length) return;
    if (offen) zu(k, false);
    nach = typeof o.nachher === 'function' ? o.nachher : null;
    const sperre = document.createElement('div'); sperre.className = 'tour-sperre';
    const licht = document.createElement('div'); licht.className = 'tour-licht'; licht.setAttribute('aria-hidden', 'true');
    const blase = document.createElement('div'); blase.className = 'tour-blase'; blase.setAttribute('role', 'dialog'); blase.setAttribute('aria-modal', 'true'); blase.setAttribute('aria-labelledby', 'tour-titel');
    document.body.append(sperre, licht, blase); offen = [sperre, licht, blase];
    let i = 0;
    function zeige() {
      const s = liste[i], e = document.querySelector(s.sel);
      e.scrollIntoView({ block: 'center', behavior: 'instant' in document.documentElement.style ? 'instant' : 'auto' });
      const r = e.getBoundingClientRect(), rand = 6;
      Object.assign(licht.style, { top: (r.top - rand) + 'px', left: (r.left - rand) + 'px', width: (r.width + 2 * rand) + 'px', height: Math.min(r.height + 2 * rand, innerHeight - 24) + 'px' });
      const letzter = i === liste.length - 1;
      blase.innerHTML = '';
      const kopf = document.createElement('div'); kopf.className = 'tour-schritt'; kopf.textContent = 'Einführung · Schritt ' + (i + 1) + ' von ' + liste.length;
      const h = document.createElement('h2'); h.id = 'tour-titel'; h.textContent = s.titel;
      const p = document.createElement('p'); p.textContent = s.text;
      const leiste = document.createElement('div'); leiste.className = 'tour-knoepfe';
      const weg = document.createElement('button'); weg.type = 'button'; weg.className = 'tour-weg'; weg.textContent = letzter ? 'Schließen' : 'Überspringen'; weg.onclick = () => zu(k);
      const zur = document.createElement('button'); zur.type = 'button'; zur.textContent = 'Zurück'; zur.disabled = i === 0; zur.onclick = () => { i--; zeige(); };
      const vor = document.createElement('button'); vor.type = 'button'; vor.className = 'tour-vor';
      if (letzter && o.ende) { vor.textContent = o.ende.label; vor.onclick = () => { zu(k); o.ende.aktion(); }; } else { vor.textContent = letzter ? 'Fertig' : 'Weiter'; vor.onclick = () => { if (letzter) zu(k); else { i++; zeige(); } }; }
      leiste.append(weg, zur, vor); blase.append(kopf, h, p, leiste);
      const bh = blase.offsetHeight, unten = r.bottom + 14 + bh < innerHeight;
      blase.style.top = Math.max(12, unten ? r.bottom + 14 : r.top - 14 - bh) + 'px';
      blase.style.left = Math.max(12, Math.min(innerWidth - blase.offsetWidth - 12, r.left)) + 'px';
      vor.focus();
    }
    taste = ev => { if (ev.key === 'Escape') zu(k); };
    document.addEventListener('keydown', taste);
    zeige();
  }
  return { start, gesehen: k => !!lies(k || 'start'), merke, offen: () => !!offen };
})();

const D={"titel":"Prüfungstraining WISO","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · Wirtschafts- und Sozialkunde","stand":"15.10.2026","module":[{"nr":"1","titel":"Arbeitswelt und Ausbildung","lf":"ca. 37 % der WISO","abschnitte":[{"nr":"1.1","titel":"Ausbildungsvertrag und Berufsausbildung","lf":"LF 1 / Sozialkunde","buch":"BBiG §§ 10–26","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was kennzeichnet das duale System der Berufsausbildung in Deutschland?","optionen":["Ausbildung in zwei Stufen: erst in der Berufsschule, dann im Betrieb","Ausbildung an zwei Lernorten: im Betrieb und in der Berufsschule","Ausbildung durch zwei Träger: die Agentur für Arbeit und den Betrieb","Ausbildung in zwei Betrieben, die sich die Ausbildungskosten teilen"],"richtig":[1],"erkl":"„Dual“ bedeutet: Die Ausbildung findet gleichzeitig an zwei Lernorten statt. Der Betrieb vermittelt die Praxis, die Berufsschule ergänzt sie durch fachtheoretischen und allgemeinbildenden Unterricht.","norm":"§ 2 Abs. 1 BBiG","id":"1.1-1-1"},{"typ":"zuo","frage":"Ordnen Sie jedem Regelwerk bzw. jeder Institution die passende Aufgabe zu.","paare":[["Ausbildungsordnung","legt bundeseinheitlich fest, was im Betrieb vermittelt und geprüft wird"],["Rahmenlehrplan der KMK","regelt den Unterricht in der Berufsschule nach Lernfeldern"],["Industrie- und Handelskammer","führt das Verzeichnis der Ausbildungsverhältnisse und nimmt Prüfungen ab"],["Berufsausbildungsvertrag","regelt Rechte und Pflichten zwischen Betrieb und Auszubildenden"]],"erkl":"Die Ausbildungsordnung (Bund) ist die Grundlage für den Betrieb, der Rahmenlehrplan (KMK) für die Berufsschule. Die IHK ist als zuständige Stelle für Eintragung, Überwachung und Prüfungen verantwortlich.","norm":"§§ 5, 10, 34, 71 Abs. 2 BBiG","id":"1.1-1-2"},{"typ":"mehr","frage":"Welche drei Pflichten treffen nach dem BBiG den Ausbildenden (den Ausbildungsbetrieb)?","optionen":["Ausbildungsmittel kostenlos zur Verfügung stellen","den Ausbildungsnachweis regelmäßig durchsehen","die Auszubildenden für die Berufsschule freistellen","den Ausbildungsnachweis selbst führen","über Betriebsgeheimnisse Stillschweigen wahren"],"richtig":[0,1,2],"erkl":"Kostenlose Ausbildungsmittel, die Durchsicht des Ausbildungsnachweises und die Freistellung für die Berufsschule sind Pflichten des Betriebs. Den Nachweis zu führen und Betriebsgeheimnisse zu wahren, sind dagegen Pflichten der Auszubildenden (§ 13).","norm":"§§ 13, 14, 15 BBiG","id":"1.1-1-3"},{"typ":"mc","frage":"Ein Ausbildungsbetrieb lässt einen Auszubildenden regelmäßig den privaten Pkw des Ausbildungsleiters waschen. Wie ist das zu beurteilen?","optionen":["Zulässig, weil Auszubildende allen Weisungen des Ausbilders folgen müssen","Zulässig, solange es höchstens zwei Stunden pro Woche in Anspruch nimmt","Unzulässig, da nur ausbildungsdienliche Aufgaben erlaubt sind","Unzulässig nur dann, wenn der Auszubildende noch nicht volljährig ist"],"richtig":[2],"erkl":"Auszubildenden dürfen nur Aufgaben übertragen werden, die dem Ausbildungszweck dienen. Die Weisungspflicht der Auszubildenden (§ 13) gilt nur für Weisungen im Rahmen der Berufsausbildung.","norm":"§ 14 Abs. 3 BBiG","id":"1.1-1-4"},{"typ":"mc","frage":"Welche Vereinbarung in einem Berufsausbildungsvertrag ist wirksam?","optionen":["Die Auszubildende zahlt für ihre Ausbildung ein Lehrgeld von 500 €.","Bei Abbruch der Ausbildung zahlt die Auszubildende eine Vertragsstrafe.","Fünf Monate vor dem Ende verpflichtet sie sich, als Angestellte zu bleiben.","Schon bei Vertragsschluss verpflichtet sie sich, nach der Ausbildung zu bleiben."],"richtig":[2],"erkl":"Nichtig sind u. a. Entschädigungen für die Ausbildung, Vertragsstrafen und Bindungen für die Zeit nach der Ausbildung. Ausnahme: Die Verpflichtung zu einem Arbeitsverhältnis wird erst in den letzten sechs Monaten der Ausbildung eingegangen.","norm":"§ 12 Abs. 1 und 2 BBiG","id":"1.1-1-5"},{"typ":"zahl","frage":"Jonas Krüger (19) hat eine regelmäßige Ausbildungszeit von 38 Stunden pro Woche an fünf Tagen. In dieser Woche hat er nur am Montag Berufsschule, und zwar sechs Unterrichtsstunden à 45 Minuten. Wie viele Stunden darf sein Betrieb ihn in dieser Woche höchstens noch im Betrieb ausbilden?","wert":30.4,"einheit":"Stunden","tol":0.01,"erkl":"Ein Berufsschultag mit mehr als fünf Unterrichtsstunden à 45 Minuten wird einmal pro Woche mit der durchschnittlichen täglichen Ausbildungszeit angerechnet: 38 : 5 = 7,6 Std. Es bleiben 38 − 7,6 = 30,4 Std. im Betrieb.","norm":"§ 15 Abs. 1 Satz 2 Nr. 2, Abs. 2 Nr. 2 BBiG","id":"1.1-1-6"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zum Ende der Berufsausbildung.","aussagen":[["Auf Verlangen muss das Ausbildungszeugnis auch Angaben über Verhalten und Leistung enthalten.",true],["Wer die Abschlussprüfung vorzeitig besteht, dessen Ausbildung endet mit Bekanntgabe des Ergebnisses durch den Prüfungsausschuss.",true],["Wer die Prüfung nicht besteht, kann die Ausbildung auf Verlangen um höchstens zwei Jahre verlängern.",false],["Wer nach der Ausbildung ohne Absprache weiterarbeitet, hat ein auf ein Jahr befristetes Arbeitsverhältnis.",false]],"erkl":"Das einfache Zeugnis wird auf Verlangen zum qualifizierten Zeugnis. Bei Nichtbestehen verlängert sich die Ausbildung auf Verlangen bis zur nächsten Wiederholungsprüfung, höchstens um ein Jahr; Weiterarbeit ohne Absprache begründet ein unbefristetes Arbeitsverhältnis.","norm":"§§ 16, 21, 24 BBiG","id":"1.1-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Leonie Wagner (18) beginnt am 1. August 2026 ihre dreijährige Ausbildung zur Kauffrau für Versicherungen und Finanzanlagen bei der PROXIMUS Versicherung AG in Halle (Saale). Der Vertrag sieht eine Probezeit von vier Monaten und im 1. Ausbildungsjahr eine Vergütung von 1.150 € monatlich vor, die jeweils am 15. des Folgemonats überwiesen werden soll. Weil Leonie das Abitur hat, wollen sie und PROXIMUS die Ausbildungszeit verkürzen.","items":[{"typ":"mc","frage":"Bis zu welchem Tag kann Leonies Ausbildungsverhältnis spätestens ohne Einhaltung einer Kündigungsfrist gekündigt werden (Zugang der Kündigung)?","optionen":["31.10.2026","30.11.2026","31.12.2026","31.01.2027"],"richtig":[1],"erkl":"Während der Probezeit kann das Ausbildungsverhältnis jederzeit ohne Frist gekündigt werden. Die vier Monate laufen vom 1. August bis zum Ablauf des 30. November 2026; die sechsmonatige Probezeit des BGB gilt für Ausbildungsverhältnisse nicht.","norm":"§§ 20, 22 Abs. 1 BBiG","id":"1.1-2-1"},{"typ":"wf","frage":"Prüfen Sie die Vergütungsregelung in Leonies Vertrag.","aussagen":[["Die vereinbarte Vergütung liegt über der Mindestvergütung für das 1. Ausbildungsjahr (Beginn 2026).",true],["Die Zahlung am 15. des Folgemonats ist zulässig, weil der Vertrag diesen Termin festlegt.",false],["Die Vergütung für August 2026 ist spätestens am letzten Arbeitstag im August zu zahlen.",true],["Die Vergütung darf in allen drei Ausbildungsjahren gleich hoch bleiben.",false]],"erkl":"Die Mindestvergütung bei Beginn 2026 beträgt 724 €; 1.150 € liegen darüber. Die Vergütung ist für den laufenden Monat spätestens am letzten Arbeitstag zu zahlen und muss mit fortschreitender Ausbildung mindestens jährlich steigen; ungünstigere Abreden sind nichtig (§ 25).","norm":"§§ 17, 18 Abs. 2, 25 BBiG","id":"1.1-2-2"},{"typ":"mc","frage":"Wer entscheidet über die Verkürzung von Leonies Ausbildungszeit?","optionen":["Der Ausbilder allein, da er den Lernstand am besten kennt","Die Berufsschule auf Antrag der Klassenlehrkraft","Die Agentur für Arbeit auf Antrag von Leonie allein","Die IHK auf gemeinsamen Antrag von Leonie und PROXIMUS"],"richtig":[3],"erkl":"Die zuständige Stelle (IHK) kürzt die Ausbildungszeit auf gemeinsamen Antrag von Auszubildender und Ausbildendem, wenn zu erwarten ist, dass das Ausbildungsziel in der kürzeren Zeit erreicht wird.","norm":"§ 8 Abs. 1 BBiG","id":"1.1-2-3"},{"typ":"mc","frage":"Im zweiten Ausbildungsjahr will Leonie die Ausbildung aufgeben, um zu studieren. Wie kann sie kündigen?","optionen":["Schriftlich unter Angabe des Grundes mit einer Frist von vier Wochen","Nur fristlos, und nur wenn PROXIMUS ihr dafür einen wichtigen Grund gibt","Gar nicht; möglich ist nur ein Aufhebungsvertrag mit PROXIMUS","Mündlich gegenüber der Ausbilderin mit einer Frist von zwei Wochen"],"richtig":[0],"erkl":"Nach der Probezeit können Auszubildende mit vier Wochen Frist kündigen, wenn sie die Ausbildung aufgeben oder wechseln wollen. Die Kündigung muss schriftlich und mit Angabe der Gründe erfolgen; der Betrieb kann nach der Probezeit nur fristlos aus wichtigem Grund kündigen.","norm":"§ 22 Abs. 2 Nr. 2, Abs. 3 BBiG","id":"1.1-2-4"}]}]},{"nr":"1.2","titel":"Jugendarbeitsschutz","lf":"LF 1 / Sozialkunde","buch":"JArbSchG","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Ein 17-jähriger Auszubildender arbeitet in einer Woche ohne Berufsschule am Freitag nur sechs Stunden. Wie lange darf er an den übrigen Werktagen dieser Woche täglich höchstens arbeiten?","optionen":["Bis zu 9 Stunden, höchstens 40 Stunden in der Woche","Bis zu 10 Stunden, höchstens 48 Stunden in der Woche","Bis zu 8,5 Stunden, höchstens 40 Stunden in der Woche","Bis zu 8 Stunden; eine Verlängerung ist niemals erlaubt"],"richtig":[2],"erkl":"Jugendliche dürfen höchstens 8 Std. täglich und 40 Std. wöchentlich arbeiten. Ist die Arbeitszeit an einzelnen Werktagen kürzer, sind an den übrigen Tagen derselben Woche bis zu 8,5 Std. erlaubt (hier 4 × 8,5 + 6 = 40).","norm":"§ 8 Abs. 1 und 2a JArbSchG","id":"1.2-1-1"},{"typ":"zuo","frage":"Ordnen Sie den Regeln des JArbSchG den richtigen Wert zu.","paare":[["tägliche Höchstarbeitszeit im Regelfall","8 Stunden"],["wöchentliche Höchstarbeitszeit","40 Stunden"],["Schichtzeit (Arbeitszeit plus Pausen) im Büro","10 Stunden"],["ununterbrochene Freizeit nach Arbeitsende","12 Stunden"],["Zeitraum, in dem Jugendliche beschäftigt werden dürfen","6 bis 20 Uhr"]],"erkl":"Das JArbSchG begrenzt Arbeitszeit (8/40 Std.), Schichtzeit (10 Std.) und schreibt 12 Std. Freizeit zwischen zwei Arbeitstagen sowie Nachtruhe von 20 bis 6 Uhr vor.","norm":"§§ 8, 12, 13, 14 JArbSchG","id":"1.2-1-2"},{"typ":"mc","frage":"Eine 17-jährige Auszubildende arbeitet an einem Tag sieben Stunden. Welche Ruhepausen stehen ihr mindestens zu?","optionen":["30 Minuten; als Pause zählen nur Abschnitte ab 15 Minuten","60 Minuten; als Pause zählen nur Abschnitte ab 15 Minuten","45 Minuten; als Pause zählen auch Abschnitte ab 10 Minuten","60 Minuten; die Pause muss vollständig am Stück liegen"],"richtig":[1],"erkl":"Bei mehr als sechs Stunden Arbeitszeit stehen Jugendlichen 60 Minuten Ruhepause zu (bei 4,5 bis 6 Std. 30 Minuten). Als Ruhepause gilt nur eine Unterbrechung von mindestens 15 Minuten.","norm":"§ 11 Abs. 1 JArbSchG","id":"1.2-1-3"},{"typ":"mehr","frage":"Welche drei Aussagen zum Jugendarbeitsschutz treffen zu?","optionen":["Jugendlicher ist, wer 15, aber noch nicht 18 Jahre alt ist.","Jugendliche dürfen grundsätzlich nur an fünf Tagen pro Woche beschäftigt werden.","Wer regelmäßig Jugendliche beschäftigt, muss das JArbSchG im Betrieb zugänglich machen.","In einem Versicherungsbüro dürfen Jugendliche samstags arbeiten, wenn sie zustimmen.","In einem Versicherungsbüro dürfen Jugendliche sonntags arbeiten, wenn sie dafür einen Tag frei bekommen."],"richtig":[0,1,2],"erkl":"Das JArbSchG gilt für 15- bis 17-Jährige, schreibt die Fünf-Tage-Woche vor und verlangt, das Gesetz auszuhängen, auszulegen oder elektronisch bereitzustellen. Für Büros greift keine Ausnahme von der Samstags- und Sonntagsruhe; Zustimmung oder Ersatzruhetag ändern daran nichts.","norm":"§§ 2, 15, 16, 17, 47 JArbSchG","id":"1.2-1-4"},{"typ":"wf","frage":"Eine 16-jährige Auszubildende hat montags von 8:00 bis 13:15 Uhr sechs Unterrichtsstunden à 45 Minuten. Prüfen Sie die Aussagen.","aussagen":[["Weil der Unterricht vor 9 Uhr beginnt, darf sie vorher nicht im Betrieb beschäftigt werden.",true],["Nach diesem Berufsschultag darf sie einmal pro Woche nicht mehr im Betrieb beschäftigt werden.",true],["Dieser Berufsschultag wird mit sechs Stunden auf die Arbeitszeit angerechnet.",false],["Eine Blockschulwoche mit mindestens 25 Stunden an fünf Tagen wird mit 40 Stunden angerechnet.",true]],"erkl":"Vor einem vor 9 Uhr beginnenden Unterricht und nach einem Schultag mit mehr als fünf Unterrichtsstunden (einmal pro Woche) darf nicht beschäftigt werden. Ein solcher Tag zählt mit 8 Stunden, eine Blockwoche mit 40 Stunden.","norm":"§ 9 Abs. 1 und 2 JArbSchG","id":"1.2-1-5"},{"typ":"zahl","frage":"Malik Haddad, geboren am 12.09.2008, ist seit August 2025 in Ausbildung. Wie viele Werktage Urlaub stehen ihm nach dem JArbSchG im Kalenderjahr 2026 mindestens zu?","wert":25,"einheit":"Werktage","tol":0.01,"erkl":"Maßgeblich ist das Alter zu Beginn des Kalenderjahres: Am 1.1.2026 ist Malik 17, also noch nicht 18 – das ergibt 25 Werktage. Dass er im September 18 wird, ändert am Anspruch für 2026 nichts.","norm":"§ 19 Abs. 2 JArbSchG","id":"1.2-1-6"},{"typ":"mc","frage":"Was gilt für die erste Nachuntersuchung nach dem JArbSchG?","optionen":["Fällig zwei Jahre nach Beginn; ohne Nachweis droht dem Betrieb nur ein Bußgeld","Fällig nur bei Krankheit; der Betrieb entscheidet über den Arztbesuch","Fällig ein Jahr nach Beginn; ohne Nachweis endet der Ausbildungsvertrag","Nach einem Jahr fällig; fehlt sie nach 14 Monaten, Beschäftigungsverbot"],"richtig":[3],"erkl":"Ein Jahr nach Aufnahme der Beschäftigung muss die Bescheinigung über die Nachuntersuchung vorliegen. Fehlt sie nach 14 Monaten, darf der Jugendliche bis zur Vorlage nicht weiterbeschäftigt werden – der Vertrag endet dadurch aber nicht.","norm":"§ 33 Abs. 1 und 3 JArbSchG","id":"1.2-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Aylin Demir, geboren am 03.02.2010, beginnt am 1. August 2026 ihre Ausbildung bei der PROXIMUS Versicherung AG in Halle (Saale). Ihre ärztliche Erstuntersuchung fand am 15. Mai 2026 statt. Montags hat sie Berufsschule von 8:00 bis 13:15 Uhr (sechs Unterrichtsstunden à 45 Minuten), von Dienstag bis Freitag ist sie im Betrieb. Für Dienstag plant ihre Ausbilderin eine Arbeitszeit von 8:00 bis 17:00 Uhr mit 45 Minuten Pause.","items":[{"typ":"mc","frage":"Darf PROXIMUS Aylin auf Grund der Erstuntersuchung vom 15. Mai 2026 beschäftigen?","optionen":["Nein, weil sie höchstens drei Monate zurückliegen darf","Ja, weil sie nicht länger als 14 Monate zurückliegt","Nein, weil sie erst nach Ausbildungsbeginn erfolgen darf","Ja, aber nur, weil Aylin bei Beginn schon 16 Jahre alt ist"],"richtig":[1],"erkl":"Ein Jugendlicher darf nur beschäftigt werden, wenn er innerhalb der letzten 14 Monate ärztlich untersucht wurde und die Bescheinigung vorliegt. Mai 2026 bis August 2026 liegt deutlich innerhalb dieser Frist; das Alter spielt dafür keine Rolle.","norm":"§ 32 Abs. 1 JArbSchG","id":"1.2-2-1"},{"typ":"mehr","frage":"Welche zwei Aussagen zum geplanten Dienstag treffen zu?","optionen":["Die Pause ist zu kurz; Aylin stehen mindestens 60 Minuten zu.","Die Schichtzeit von neun Stunden ist für Aylin zulässig.","Weil Aylin minderjährig ist, darf sie nur bis 16 Uhr arbeiten.","Die Pause darf vollständig in die letzte Arbeitsstunde gelegt werden.","Am Dienstag darf Aylin erst ab 9 Uhr arbeiten, weil montags Berufsschule ist."],"richtig":[0,1],"erkl":"Bei mehr als sechs Stunden Arbeit sind 60 Minuten Pause Pflicht; die Pausen liegen frühestens eine Stunde nach Beginn und spätestens eine Stunde vor Ende. Die Schichtzeit von 9 Std. liegt unter der Grenze von 10 Std.; Arbeit ist bis 20 Uhr erlaubt (mit nur 45 Min. Pause käme Aylin zudem auf unzulässige 8,25 Std. Arbeitszeit).","norm":"§§ 11, 12, 14 JArbSchG","id":"1.2-2-2"},{"typ":"zahl","frage":"Wie viele Stunden darf PROXIMUS Aylin in dieser Woche von Dienstag bis Freitag insgesamt höchstens beschäftigen?","wert":32,"einheit":"Stunden","tol":0.01,"erkl":"Der Berufsschultag mit mehr als fünf Unterrichtsstunden wird mit 8 Stunden auf die Wochenarbeitszeit angerechnet. Von höchstens 40 Stunden bleiben 40 − 8 = 32 Stunden für den Betrieb.","norm":"§ 8 Abs. 1, § 9 Abs. 2 Nr. 1 JArbSchG","id":"1.2-2-3"},{"typ":"zahl","frage":"Wie viele Werktage Urlaub stehen Aylin nach dem JArbSchG im Kalenderjahr 2027 mindestens zu?","wert":27,"einheit":"Werktage","tol":0.01,"erkl":"Am 1.1.2027 ist Aylin 16 Jahre alt, also noch nicht 17. Für Jugendliche, die zu Beginn des Kalenderjahres noch nicht 17 sind, beträgt der Mindesturlaub 27 Werktage.","norm":"§ 19 Abs. 2 Nr. 2 JArbSchG","id":"1.2-2-4"}]}]},{"nr":"1.3","titel":"Arbeitsvertrag, Arbeitsrecht und Ausscheiden","lf":"LF 1 / Sozialkunde","buch":"BGB §§ 611a, 622, 623, 626; KSchG; BUrlG; ArbZG; EFZG; GewO § 109; TzBfG","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Welche Rangfolge der arbeitsrechtlichen Regelungen ist richtig (vom höchsten zum niedrigsten Rang)?","optionen":["Grundgesetz – Tarifvertrag – Gesetz – Betriebsvereinbarung – Arbeitsvertrag – Weisung","Gesetz – Grundgesetz – Tarifvertrag – Arbeitsvertrag – Betriebsvereinbarung – Weisung","Grundgesetz – Gesetz – Tarifvertrag – Betriebsvereinbarung – Arbeitsvertrag – Weisung","Grundgesetz – Gesetz – Betriebsvereinbarung – Tarifvertrag – Weisung – Arbeitsvertrag"],"richtig":[2],"erkl":"Die rangniedrigere Regelung darf der ranghöheren grundsätzlich nicht widersprechen. Ganz unten steht die Weisung des Arbeitgebers (Direktionsrecht), die nur im Rahmen von Vertrag, Betriebsvereinbarung, Tarifvertrag und Gesetz gilt.","norm":"§ 106 GewO; § 4 TVG; § 77 BetrVG","id":"1.3-1-1"},{"typ":"mc","frage":"Für das Arbeitsverhältnis von Sofia Nowak gilt ein Tarifvertrag mit 30 Urlaubstagen; in ihrem Arbeitsvertrag stehen 32 Urlaubstage. Wie viele Urlaubstage stehen ihr zu?","optionen":["30 Tage, weil der Tarifvertrag höherrangig ist","24 Werktage, weil nur das Gesetz verbindlich ist","32 Tage, weil die für sie günstigere Regelung gilt","30 Tage, weil abweichende Arbeitsverträge nichtig sind"],"richtig":[2],"erkl":"Nach dem Günstigkeitsprinzip darf eine rangniedrigere Regelung zugunsten des Arbeitnehmers von der ranghöheren abweichen. Der Arbeitsvertrag mit 32 Tagen ist günstiger und gilt deshalb.","norm":"§ 4 Abs. 3 TVG","id":"1.3-1-2"},{"typ":"mehr","frage":"Welche zwei Aussagen zu den Pflichten im Arbeitsverhältnis treffen zu?","optionen":["Während des Arbeitsverhältnisses darf die Angestellte ihrem Arbeitgeber keine Konkurrenz machen.","Über das Direktionsrecht bestimmt der Arbeitgeber Inhalt, Ort und Zeit der Arbeit näher.","Über das Direktionsrecht darf der Arbeitgeber das vereinbarte Gehalt einseitig kürzen.","Ein Arbeitsvertrag wird erst wirksam, wenn der Arbeitgeber die Bedingungen nach dem NachwG nachweist.","Solange der Arbeitgeber das Gehalt zahlt, muss er die Angestellte nicht beschäftigen."],"richtig":[0,1],"erkl":"Aus der Treuepflicht folgen Wettbewerbsverbot und Verschwiegenheit; das Direktionsrecht betrifft nur Inhalt, Ort und Zeit, nicht das Gehalt. Der Arbeitsvertrag ist formfrei – der Nachweis nach dem NachwG ist nur eine Folgepflicht –, und der Arbeitgeber muss auch tatsächlich beschäftigen.","norm":"§ 611a BGB; § 106 GewO; § 60 HGB; § 2 NachwG","id":"1.3-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Gesetz seinen Regelungsinhalt zu.","paare":[["MuSchG","Schutz von Schwangeren und Müttern, u. a. Beschäftigungsverbote und Kündigungsschutz"],["BEEG","Elterngeld und Elternzeit"],["AGG","Benachteiligungsverbot wegen Rasse/ethnischer Herkunft, Geschlecht, Religion/Weltanschauung, Behinderung, Alter, sexueller Identität"],["MiLoG","Lohnuntergrenze pro Zeitstunde (2026: 13,90 €)"],["ArbSchG","Sicherheit und Gesundheit bei der Arbeit, z. B. Gefährdungsbeurteilung"]],"erkl":"Jedes dieser Gesetze schützt Arbeitnehmer in einem bestimmten Bereich. Das AGG nennt genau sechs geschützte Merkmale; Merkmale wie Familienstand oder Wohnort gehören nicht dazu.","norm":"MuSchG; BEEG; § 1 AGG; § 1 MiLoG; § 5 ArbSchG","id":"1.3-1-4"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zu Arbeitszeit und Urlaub volljähriger Beschäftigter.","aussagen":[["Bei mehr als neun Stunden Arbeitszeit stehen mindestens 45 Minuten Ruhepause zu.",true],["Zwischen zwei Arbeitstagen muss eine ununterbrochene Ruhezeit von mindestens elf Stunden liegen.",true],["Der gesetzliche Mindesturlaub beträgt bei einer Fünf-Tage-Woche 24 Arbeitstage.",false],["Nach dem BUrlG wird Resturlaub nur aus dringenden Gründen übertragen und ist dann bis 31. März zu nehmen.",true]],"erkl":"Pausen: 30 Min. bei mehr als 6 bis 9 Std., 45 Min. bei mehr als 9 Std.; Ruhezeit 11 Std. Der Mindesturlaub von 24 Werktagen (Mo–Sa) entspricht bei fünf Arbeitstagen 20 Arbeitstagen; nach der Rechtsprechung verfällt Urlaub nur, wenn der Arbeitgeber rechtzeitig darauf hingewiesen hat.","norm":"§§ 4, 5 ArbZG; §§ 3, 7 Abs. 3 BUrlG","id":"1.3-1-5"},{"typ":"mc","frage":"Eine gesetzlich versicherte Angestellte ist von Montag bis Freitag arbeitsunfähig erkrankt. Was gilt nach dem EFZG?","optionen":["Sie meldet sich erst, wenn ihr eine ärztliche Bescheinigung vorliegt.","Sie erhält für die Krankheitstage nur 70 % ihres Gehalts vom Arbeitgeber.","Sie meldet sich sofort und lässt die AU spätestens am 4. Tag feststellen.","Sie muss erst bei einer Krankheit von mehr als einer Woche zum Arzt gehen."],"richtig":[2],"erkl":"Die Arbeitsunfähigkeit ist unverzüglich mitzuteilen; dauert sie länger als drei Kalendertage, ist sie spätestens am folgenden Arbeitstag ärztlich festzustellen (eAU, der Arbeitgeber ruft sie bei der Krankenkasse ab). Das Entgelt läuft bis zu sechs Wochen voll weiter.","norm":"§§ 3, 5 Abs. 1 und 1a EFZG","id":"1.3-1-6"},{"typ":"mehr","frage":"Welche drei Aussagen zu Befristung und Kündigung treffen zu?","optionen":["Ohne Sachgrund ist bei einer Neueinstellung eine Befristung bis zu zwei Jahren mit höchstens drei Verlängerungen zulässig.","In einer vereinbarten Probezeit von höchstens sechs Monaten beträgt die Kündigungsfrist zwei Wochen.","Eine fristlose Kündigung muss binnen zwei Wochen nach Kenntnis des wichtigen Grundes erklärt werden.","Kündigt eine Arbeitnehmerin nach zehn Jahren selbst, gilt für sie gesetzlich eine Frist von vier Monaten.","Schwerbehinderten Menschen darf nur mit Zustimmung der Agentur für Arbeit gekündigt werden."],"richtig":[0,1,2],"erkl":"Die verlängerten Fristen nach Betriebszugehörigkeit gelten gesetzlich nur für Kündigungen durch den Arbeitgeber; der Arbeitnehmer kündigt mit der Grundfrist von vier Wochen zum 15. oder Monatsende. Bei Schwerbehinderten muss das Integrationsamt zustimmen.","norm":"§ 14 Abs. 2 TzBfG; § 622 Abs. 1–3 BGB; § 626 Abs. 2 BGB; § 168 SGB IX","id":"1.3-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Die PROXIMUS Versicherung AG in Halle (Saale) beschäftigt rund 240 Arbeitnehmer und hat einen Betriebsrat. Daniel Becker (44) arbeitet dort seit dem 1. April 2017 als Sachbearbeiter in einer Fünf-Tage-Woche; er ist weder schwerbehindert noch Betriebsratsmitglied. Wegen der Schließung seiner Abteilung will PROXIMUS ihm ordentlich kündigen. Das Kündigungsschreiben soll ihm am 15. Dezember 2026 zugehen.","items":[{"typ":"mc","frage":"Zu welchem Termin kann PROXIMUS Daniel frühestens ordentlich kündigen?","optionen":["15.01.2027","15.03.2027","31.03.2027","30.04.2027"],"richtig":[2],"erkl":"Bei mindestens acht (aber unter zehn) Jahren Betriebszugehörigkeit beträgt die Frist für den Arbeitgeber drei Monate zum Ende eines Kalendermonats. Ab Zugang am 15.12.2026 reichen drei Monate bis 15.03.2027, also endet das Arbeitsverhältnis zum 31.03.2027.","norm":"§ 622 Abs. 2 Satz 1 Nr. 3 BGB","id":"1.3-2-1"},{"typ":"mehr","frage":"Welche drei Aussagen zur geplanten Kündigung treffen zu?","optionen":["Die Kündigung muss Daniel schriftlich mit eigenhändiger Unterschrift zugehen.","PROXIMUS muss vor der Kündigung den Betriebsrat anhören.","Weil das KSchG gilt, muss die Kündigung sozial gerechtfertigt sein, z. B. betriebsbedingt.","Eine Kündigung per E-Mail genügt, wenn Daniel den Empfang bestätigt.","Gegen die Kündigung kann Daniel binnen drei Monaten beim Landesarbeitsgericht klagen."],"richtig":[0,1,2],"erkl":"Kündigungen bedürfen der Schriftform (keine E-Mail); ohne Anhörung des Betriebsrats sind sie unwirksam. Das KSchG gilt (mehr als 10 Arbeitnehmer, über 6 Monate beschäftigt); Klage ist binnen drei Wochen beim Arbeitsgericht zu erheben.","norm":"§ 623 BGB; § 102 BetrVG; §§ 1, 4, 23 KSchG","id":"1.3-2-2"},{"typ":"zahl","frage":"Daniel scheidet zum 31.03.2027 aus. Berechnen Sie seinen gesetzlichen Teilurlaub für 2027, ausgehend vom gesetzlichen Mindesturlaub von 20 Arbeitstagen bei einer Fünf-Tage-Woche.","wert":5,"einheit":"Arbeitstage","tol":0.01,"erkl":"Wer nach erfüllter Wartezeit in der ersten Jahreshälfte ausscheidet, erhält 1/12 des Jahresurlaubs je vollem Monat: 20 : 12 × 3 = 5 Arbeitstage. PROXIMUS bescheinigt ihm den gewährten Urlaub beim Ausscheiden (§ 6 Abs. 2 BUrlG).","norm":"§ 5 Abs. 1 Buchst. c BUrlG","id":"1.3-2-3"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zu Daniels Ausscheiden.","aussagen":[["Daniel muss sich spätestens drei Monate vor dem Ende bei der Agentur für Arbeit arbeitsuchend melden.",true],["Auf Verlangen muss PROXIMUS ihm ein qualifiziertes Zeugnis ausstellen, das auch Leistung und Verhalten beurteilt.",true],["Die Bescheinigung über den 2027 gewährten Urlaub stellt ihm die Agentur für Arbeit aus.",false],["Verliert Daniel vor dem Arbeitsgericht, geht die Berufung direkt an das Bundesarbeitsgericht in Erfurt.",false]],"erkl":"Die Meldepflicht trifft Daniel selbst; Zeugnis, Urlaubsbescheinigung, Arbeitsbescheinigung und Abmeldung bei der Krankenkasse sind Pflichten von PROXIMUS. Der Instanzenzug lautet Arbeitsgericht → Landesarbeitsgericht → Bundesarbeitsgericht (Erfurt).","norm":"§ 38 Abs. 1 SGB III; § 109 GewO; § 6 Abs. 2 BUrlG; § 312 SGB III; §§ 8, 64, 72 ArbGG","id":"1.3-2-4"}]}]},{"nr":"1.4","titel":"Betriebsrat und Jugend- und Auszubildendenvertretung","lf":"Sozialkunde","buch":"BetrVG §§ 1, 5, 7–9, 13, 21, 60–64, 77, 87, 99, 102, 111","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Unter welcher Voraussetzung ist ein Betrieb betriebsratsfähig, sodass ein Betriebsrat gewählt werden kann?","optionen":["Im Betrieb arbeiten in der Regel mindestens fünf ständige wahlberechtigte Arbeitnehmer, davon drei wählbar.","Im Betrieb arbeiten in der Regel mindestens zehn Arbeitnehmer, von denen mindestens fünf älter als 18 Jahre sind.","Der Arbeitgeber hat der Wahl eines Betriebsrats vorher schriftlich zugestimmt und die Kosten genehmigt.","Im Betrieb arbeiten mindestens 21 Arbeitnehmer, und eine Gewerkschaft hat die Wahl ausdrücklich beantragt."],"richtig":[0],"erkl":"Nach § 1 BetrVG genügen in der Regel fünf ständige wahlberechtigte Arbeitnehmer, von denen drei wählbar sind. Eine Zustimmung des Arbeitgebers ist nicht nötig; die Wahl geht von der Belegschaft aus.","norm":"§ 1 Abs. 1 BetrVG","id":"1.4-1-1"},{"typ":"mc","frage":"Welche Aussage zum Wahlrecht bei der Betriebsratswahl trifft zu?","optionen":["Wahlberechtigt sind Arbeitnehmer ab 16 Jahren; wählbar ist, wer 18 ist und sechs Monate dem Betrieb angehört.","Wahlberechtigt sind Arbeitnehmer ab 18 Jahren; wählbar ist, wer mindestens zwei Jahre dem Betrieb angehört.","Wahlberechtigt sind alle Beschäftigten einschließlich der leitenden Angestellten; wählbar sind nur Vollzeitkräfte.","Wahlberechtigt sind nur Mitglieder einer Gewerkschaft; wählbar sind alle wahlberechtigten Arbeitnehmer ab 16."],"richtig":[0],"erkl":"Aktives Wahlrecht haben alle Arbeitnehmer ab 16 Jahren (§ 7), passives Wahlrecht, wer 18 ist und dem Betrieb sechs Monate angehört (§ 8). Leitende Angestellte sind keine Arbeitnehmer im Sinne des BetrVG (§ 5 Abs. 3).","norm":"§§ 7, 8 BetrVG","id":"1.4-1-2"},{"typ":"zahl","frage":"In einem Betrieb sind in der Regel 340 Arbeitnehmer beschäftigt, davon 322 wahlberechtigt. Hinzu kommen 6 leitende Angestellte. Aus wie vielen Mitgliedern besteht der Betriebsrat?","wert":9,"einheit":"Mitglieder","tol":0.01,"erkl":"Leitende Angestellte zählen nicht mit (§ 5 Abs. 3 BetrVG). Ab 101 Arbeitnehmern richtet sich die Größe nach allen Arbeitnehmern, nicht nur den Wahlberechtigten: 340 liegt in der Stufe 201–400, also 9 Mitglieder.","norm":"§ 9 BetrVG","id":"1.4-1-3"},{"typ":"zuo","frage":"Ordnen Sie jeder geplanten Maßnahme des Arbeitgebers (Unternehmen mit 300 wahlberechtigten Arbeitnehmern) das Beteiligungsrecht des Betriebsrats zu.","paare":[["Ordentliche Kündigung einer Sachbearbeiterin","Anhörung; ohne sie ist die Kündigung unwirksam"],["Einstellung eines neuen Sachbearbeiters","Zustimmungsverweigerungsrecht aus bestimmten Gründen"],["Einführung einer Software, die die Leistung der Beschäftigten überwacht","Echte Mitbestimmung; im Streit entscheidet die Einigungsstelle"],["Geplante Stilllegung des ganzen Betriebs","Unterrichtung und Beratung über die Betriebsänderung"]],"erkl":"Die Beteiligung ist gestuft: Bei Kündigungen ist der Betriebsrat anzuhören (§ 102), bei Einstellungen kann er die Zustimmung verweigern (§ 99), in sozialen Angelegenheiten wie technischer Überwachung bestimmt er mit (§ 87 Abs. 1 Nr. 6), bei Betriebsänderungen ist er zu unterrichten, und sie sind mit ihm zu beraten (§ 111).","norm":"§§ 87, 99, 102, 111 BetrVG","id":"1.4-1-4"},{"typ":"mc","frage":"Welche Aussage zur Betriebsvereinbarung trifft zu?","optionen":["Sie wird von Arbeitgeber und Betriebsrat gemeinsam beschlossen und schriftlich festgehalten.","Sie wird vom Betriebsrat allein beschlossen und gilt ab dem Aushang am Schwarzen Brett im Betrieb.","Sie darf die im Tarifvertrag geregelten Gehälter für alle Beschäftigten frei absenken.","Sie gilt nur für die Beschäftigten, die ihr vorher einzeln und schriftlich zugestimmt haben."],"richtig":[0],"erkl":"Betriebsvereinbarungen schließen Arbeitgeber und Betriebsrat gemeinsam und schriftlich (§ 77 Abs. 2); sie gelten unmittelbar für alle Beschäftigten (§ 77 Abs. 4). Tariflich geregelte Entgelte sind ihr grundsätzlich entzogen (§ 77 Abs. 3).","norm":"§ 77 BetrVG","id":"1.4-1-5"},{"typ":"wf","frage":"Prüfen Sie die Aussagen zur Jugend- und Auszubildendenvertretung (JAV).","aussagen":[["Eine JAV wird in Betrieben gewählt, in denen in der Regel mindestens fünf Arbeitnehmer unter 18 Jahren oder Auszubildende beschäftigt sind.",true],["Die Amtszeit der JAV beträgt wie beim Betriebsrat vier Jahre.",false],["Die JAV kann mit dem Arbeitgeber eigenständig Betriebsvereinbarungen abschließen.",false],["Ein Mitglied des Betriebsrats kann nicht zugleich in die JAV gewählt werden.",true]],"erkl":"Die JAV entsteht ab fünf jugendlichen Arbeitnehmern oder Auszubildenden (§ 60) und wird für zwei Jahre gewählt (§ 64). Sie hat gegenüber dem Arbeitgeber keine eigenen Mitbestimmungsrechte, sondern wirkt über den Betriebsrat (§§ 67, 70); Betriebsratsmitglieder sind nicht wählbar (§ 61 Abs. 2).","norm":"§§ 60, 61, 64, 67 BetrVG","id":"1.4-1-6"},{"typ":"mc","frage":"Eine Versicherungs-AG beschäftigt in der Regel 1.400 Arbeitnehmer. Wie ist ihr Aufsichtsrat zusammengesetzt?","optionen":["Ein Drittel der Mitglieder sind Vertreter der Arbeitnehmer (Drittelbeteiligungsgesetz).","Je zur Hälfte Vertreter der Anteilseigner und der Arbeitnehmer (Mitbestimmungsgesetz).","Nur Vertreter der Anteilseigner, weil erst ab 2.000 Arbeitnehmern mitbestimmt wird.","Die Hälfte der Mitglieder entsendet der Betriebsrat direkt aus seinen eigenen Reihen."],"richtig":[0],"erkl":"Bei mehr als 500 Arbeitnehmern gilt das Drittelbeteiligungsgesetz: ein Drittel Arbeitnehmervertreter. Erst bei mehr als 2.000 Arbeitnehmern ist der Aufsichtsrat nach dem Mitbestimmungsgesetz paritätisch besetzt; bei Stimmengleichheit entscheidet dann die Stimme des Vorsitzenden.","norm":"§ 1 Abs. 1 Nr. 1, § 4 Abs. 1 DrittelbG; § 1 MitbestG","id":"1.4-1-7"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Im Kundenservicecenter der PROXIMUS Versicherung AG in Halle (Saale) gibt es noch keinen Betriebsrat; im November 2026 soll erstmals einer gewählt werden. Dort arbeiten: Centerleiterin Dr. Ingrid Sommer (52 Jahre, leitende Angestellte), 14 Sachbearbeiterinnen und Sachbearbeiter (25 bis 58 Jahre, alle seit über einem Jahr bei PROXIMUS), die Auszubildenden Mia Kowalski (16 Jahre, seit 2 Monaten bei PROXIMUS), Jonas Avcı (19 Jahre, seit 4 Monaten) und Lea Brandt (21 Jahre, seit 14 Monaten) sowie die Leiharbeitnehmer Tim Hoffmann (34 Jahre, Einsatz für 2 Monate) und Sevgi Yıldız (29 Jahre, Einsatz für 8 Monate).","items":[{"typ":"zahl","frage":"Wie viele Personen sind bei der Betriebsratswahl im Kundenservicecenter wahlberechtigt?","wert":18,"einheit":"Personen","tol":0.01,"erkl":"Wahlberechtigt sind alle Arbeitnehmer ab 16 Jahren (§ 7 S. 1) und Leiharbeitnehmer, die länger als drei Monate eingesetzt werden (§ 7 S. 2): 14 Sachbearbeiter + 3 Auszubildende + Sevgi Yıldız = 18. Dr. Sommer ist leitende Angestellte (§ 5 Abs. 3), Tim Hoffmann wird nur 2 Monate eingesetzt.","norm":"§§ 5, 7 BetrVG","id":"1.4-2-1"},{"typ":"zahl","frage":"Wie viele Personen sind in den Betriebsrat wählbar?","wert":15,"einheit":"Personen","tol":0.01,"erkl":"Wählbar ist, wer wahlberechtigt ist, 18 Jahre alt ist und sechs Monate dem Betrieb angehört (§ 8): die 14 Sachbearbeiter und Lea Brandt = 15. Mia ist zu jung, Jonas erst 4 Monate dabei; Leiharbeitnehmer sind nicht wählbar (§ 14 Abs. 2 AÜG).","norm":"§ 8 BetrVG; § 14 Abs. 2 AÜG","id":"1.4-2-2"},{"typ":"zahl","frage":"Aus wie vielen Mitgliedern besteht der Betriebsrat im Kundenservicecenter?","wert":1,"einheit":"Mitglieder","tol":0.01,"erkl":"In Betrieben mit 5 bis 20 wahlberechtigten Arbeitnehmern besteht der Betriebsrat aus einer Person. Mit 18 Wahlberechtigten liegt das Servicecenter in dieser Stufe; drei Mitglieder gäbe es erst ab 21 Wahlberechtigten.","norm":"§ 9 BetrVG","id":"1.4-2-3"},{"typ":"mc","frage":"Lea Brandt möchte, dass im Servicecenter auch eine Jugend- und Auszubildendenvertretung (JAV) gewählt wird. Welche Beurteilung ist richtig?","optionen":["Keine JAV, weil dort nur drei Auszubildende und keine weiteren Jugendlichen arbeiten.","Eine JAV mit einem Mitglied, weil im Servicecenter ein Betriebsrat gewählt wird.","Eine JAV erst, wenn alle Auszubildenden das 18. Lebensjahr vollendet haben.","Eine JAV, sobald die Centerleiterin der Gründung schriftlich zugestimmt hat."],"richtig":[0],"erkl":"Eine JAV setzt in der Regel mindestens fünf Arbeitnehmer unter 18 Jahren oder Auszubildende voraus (§ 60 Abs. 1). Im Servicecenter sind es nur Mia, Jonas und Lea, also drei; deren Interessen vertritt der Betriebsrat mit.","norm":"§ 60 Abs. 1 BetrVG","id":"1.4-2-4"},{"typ":"mc","frage":"Nach der Wahl will die Centerleiterin die Mittagspause für alle von 12:00–12:30 Uhr auf 13:00–13:30 Uhr verlegen. Welches Recht hat der Betriebsrat?","optionen":["Er bestimmt mit; einigen sich beide nicht, entscheidet die Einigungsstelle.","Er ist nur zu informieren; die Entscheidung trifft die Centerleiterin allein.","Er kann widersprechen, die Centerleiterin darf die Pause aber trotzdem verlegen.","Er muss zustimmen; verweigert er dies, entscheidet die Gewerkschaft verbindlich."],"richtig":[0],"erkl":"Lage der Pausen sowie Beginn und Ende der täglichen Arbeitszeit sind soziale Angelegenheiten mit echter Mitbestimmung (§ 87 Abs. 1 Nr. 2). Ohne Einigung entscheidet die Einigungsstelle verbindlich (§ 87 Abs. 2).","norm":"§ 87 Abs. 1 Nr. 2, Abs. 2 BetrVG","id":"1.4-2-5"}]}]},{"nr":"1.5","titel":"Tarifvertrag und Arbeitskampf","lf":"Sozialkunde","buch":"Art. 9 Abs. 3 GG; TVG","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was garantiert die Koalitionsfreiheit nach Art. 9 Abs. 3 GG?","optionen":["Jeder darf Gewerkschaften und Arbeitgeberverbände bilden, ihnen beitreten oder fernbleiben.","Jeder Arbeitnehmer muss der zuständigen Gewerkschaft seiner Branche als Mitglied angehören.","Der Staat legt die Gehälter fest, wenn sich die Tarifparteien nicht einigen können.","Arbeitgeber dürfen eine Einstellung vom Austritt aus der Gewerkschaft a
