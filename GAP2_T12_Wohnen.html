:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px color-mix(in srgb,#000000 15%,transparent);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>

<script>
const D={"key":"gap2_12_wohnen_v1","titel":"Prüfungstraining GAP 2 · Teil 1.2 · Wohnen","sparte":"Wohnen","intro":"Sie trainieren hier die Bearbeitung von Schäden in der Hausrat-, Wohngebäude- und Glasversicherung so, wie sie in Teil 1.2 der GAP 2 verlangt wird. Prüfen Sie in jedem Fall zuerst die Deckung dem Grunde nach und rechnen Sie dann die Entschädigung der Höhe nach mit vollständigem Rechenweg.","lf":"LF 4","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · GAP 2 Teil 1.2","stand":"15.10.2026","module":[{"nr":"1","titel":"Hausratversicherung: Deckung prüfen und Entschädigung berechnen","abschnitte":[{"nr":"1.1","titel":"Versicherte Gefahren, Sachen und Versicherungsort","lf":"LF 4","buch":"PV2 8.1.5 S. 454–480 · Lösungen S. 733–739","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann liegt ein Einbruchdiebstahl im Sinne der Hausratversicherung vor?","optionen":["Der Täter bricht in einen Raum eines Gebäudes ein, steigt ein oder dringt mit einem falschen Schlüssel ein.","Der Täter nimmt Sachen aus der Wohnung mit, deren Tür der Kunde beim Lüften weit offen stehen ließ.","Der Täter gibt sich an der Haustür als Handwerker aus und nimmt dabei unbemerkt den Schmuck mit.","Der Täter entwendet ein nicht angeschlossenes Fahrrad, das vor dem Hauseingang auf dem Gehweg stand."],"richtig":[0],"erkl":"Einbruchdiebstahl setzt ein Eindringen in einen Raum eines Gebäudes voraus: Einbrechen, Einsteigen oder Eindringen mit falschem Schlüssel oder anderen Werkzeugen. Einfacher Diebstahl und Trickdiebstahl sind nicht versichert.","norm":"Proximus 5, VHB 2021 Ziff. 4.1.1, 4.3.1","id":"1.1-1-1"},{"typ":"mc","frage":"Welcher Sachverhalt erfüllt den Tatbestand des Raubes in der Hausratversicherung?","optionen":["Ein Taschendieb zieht der Kundin im Gedränge der Straßenbahn unbemerkt die Geldbörse aus der Jacke.","Ein Täter droht der Kundin in der Wohnung mit einem Messer, bis sie ihm den Schmuck herausgibt.","Ein Täter findet den Wohnungsschlüssel unter der Fußmatte und räumt die Wohnung in Ruhe aus.","Ein Bekannter leiht sich die Spielekonsole aus und gibt sie trotz mehrfacher Mahnung nicht zurück."],"richtig":[1],"erkl":"Raub liegt vor, wenn gegen den Versicherungsnehmer Gewalt angewendet oder mit einer Gewalttat mit Gefahr für Leib oder Leben gedroht wird, um Sachen wegzunehmen. Unbemerkter Diebstahl und Unterschlagung sind kein Raub.","norm":"Proximus 5, VHB 2021 Ziff. 4.3.1, 4.3.2","id":"1.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zu den versicherten Sachen in der Hausratversicherung treffen zu?","aussagen":[["Versichert sind alle Sachen, die dem Haushalt des Versicherungsnehmers zur privaten Nutzung dienen.",true],["Eine Einbauküche, die der Mieter auf eigene Kosten eingebaut hat, kann zum versicherten Hausrat gehören.",true],["Der private Pkw in der Garage gehört zum versicherten Hausrat.",false],["Sachen, die Gäste in die Wohnung mitgebracht haben, sind mitversichert, wenn sie ihrer Art nach Hausrat sind.",true],["Der Hausrat eines Untermieters ist automatisch über den Vertrag des Hauptmieters versichert.",false]],"erkl":"Hausrat umfasst alle Sachen des privaten Haushalts, auch fremdes Eigentum im Haushalt; vom Mieter auf eigene Kosten eingefügte Sachen sind eingeschlossen. Kraftfahrzeuge (mit Ausnahmen wie Krankenfahrstühlen) und Hausrat von Untermietern gehören nicht dazu.","norm":"Proximus 5, VHB 2021 Ziff. 8.1, 8.3.1, 8.4, 9.3, 9.5","id":"1.1-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Schadenfall die versicherte Gefahr der Hausratversicherung zu.","paare":[["Ein Kurzschluss im Toaster löst ein Feuer aus, das auf die Küchenmöbel übergreift.","Brand"],["Der Schlauch der Waschmaschine platzt, Wasser durchnässt Teppich und Sofa.","Leitungswasser"],["Eine Böe der Windstärke 9 drückt das Fenster ein, Regen beschädigt die Möbel.","Sturm"],["Ein Täter hebelt die Wohnungstür auf und zerschneidet das Ledersofa.","Vandalismus nach einem Einbruch"]],"erkl":"Die Hausratversicherung deckt Brand, Blitzschlag, Überspannung durch Blitz, Explosion und weitere Feuergefahren, Einbruchdiebstahl samt Vandalismus nach einem Einbruch und Raub, Leitungswasser sowie Sturm und Hagel. Regen ist versichert, wenn er durch eine vom Sturm geschaffene Öffnung eindringt.","norm":"Proximus 5, VHB 2021 Ziff. 1, 3.1, 4.2, 5.2, 6.1, 6.5.2","id":"1.1-1-4"},{"typ":"mc","frage":"Ab welcher Windstärke liegt nach den Bedingungen der Proximus (VHB 2021, VGB 2021) ein Sturm vor?","optionen":["ab Windstärke 6 (starker Wind)","ab Windstärke 7 (steifer Wind)","ab Windstärke 8 (stürmischer Wind)","ab Windstärke 10 (schwerer Sturm)"],"richtig":[2],"erkl":"Sturm ist eine wetterbedingte Luftbewegung von mindestens Windstärke 8 nach Beaufort (mindestens 62 km/h). Lässt sich die Windstärke nicht feststellen, genügen Sturmschäden an einwandfreien Gebäuden in der Umgebung.","norm":"Proximus 5, VHB 2021 Ziff. 6.1; Proximus 5, VGB 2021 Ziff. 5.1","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Neumann wohnt in einer Mietwohnung im 2. OG in Halle (Saale), Stadtteil Neustadt, und hat bei der Proximus Versicherung AG eine Hausratversicherung nach den VHB 2021. Nach ihrem Urlaub findet sie die Wohnungstür aufgehebelt vor. Der Täter hat den Laptop und Bargeld mitgenommen und den Fernseher zertrümmert. Außerdem fehlt ihr Kinderwagen, den sie im frei zugänglichen Treppenhaus abgestellt hatte.","items":[{"typ":"mc","frage":"Wie ordnen Sie den zertrümmerten Fernseher ein?","optionen":["Nicht versichert, weil der Fernseher nicht gestohlen, sondern nur beschädigt wurde.","Nicht versichert, weil Vandalismus nur in der Wohngebäudeversicherung gedeckt ist.","Nur versichert, wenn Frau Neumann eine gesonderte Elektronikversicherung hat.","Versichert als Vandalismus nach einem Einbruch, weil der Täter eingebrochen ist."],"richtig":[3],"erkl":"Dringt ein Täter wie bei einem Einbruch in die Wohnung ein und zerstört oder beschädigt er dort vorsätzlich versicherte Sachen, liegt Vandalismus nach einem Einbruch vor. Diese Gefahr ist in der Hausratversicherung versichert.","norm":"Proximus 5, VHB 2021 Ziff. 1.2, 4.2","id":"1.1-2-1"},{"typ":"mc","frage":"Wie beurteilen Sie den Diebstahl des Kinderwagens aus dem frei zugänglichen Treppenhaus?","optionen":["Ohne besondere Vereinbarung nicht versichert, weil kein Einbruch in einen Raum vorliegt.","Versichert als Einbruchdiebstahl, weil der Täter das Mehrfamilienhaus betreten hat.","Versichert über die Außenversicherung, weil der Kinderwagen außerhalb der Wohnung stand.","Versichert als Raub, weil Frau Neumann den Kinderwagen nicht verteidigen konnte."],"richtig":[0],"erkl":"Aus einem frei zugänglichen Bereich weggenommene Sachen sind einfach gestohlen; ein Einbruch liegt nicht vor. Auch die Außenversicherung hilft nicht, denn sie gilt nur für die versicherten Gefahren, also ebenfalls nur bei Einbruchdiebstahl.","norm":"Proximus 5, VHB 2021 Ziff. 4.1, 10.3, 12.3","id":"1.1-2-2"},{"typ":"wf","frage":"Was teilen Sie Frau Neumann zur weiteren Bearbeitung mit?","aussagen":[["Sie muss den Einbruch unverzüglich der Polizei anzeigen und eine Liste der gestohlenen Sachen einreichen.",true],["Die Reparatur der aufgehebelten Wohnungstür kann als versicherte Kosten in der Hausratversicherung ersetzt werden.",true],["Das gestohlene Bargeld wird ohne jede Betragsgrenze ersetzt.",false],["Weil Frau Neumann im Urlaub war, besteht für den Einbruch kein Versicherungsschutz.",false]],"erkl":"Nach einem Einbruch muss die Kundin ihn unverzüglich der Polizei anzeigen und der Proximus und der Polizei ein Verzeichnis der abhandengekommenen Sachen einreichen. Reparaturkosten für Gebäudeschäden durch Einbruch im Bereich der Wohnung sind versicherte Kosten; für Bargeld außerhalb eines verschlossenen Wertschutzschranks gilt die Grenze von 1.500 €. Eine Urlaubsabwesenheit schließt den Schutz nicht aus.","norm":"Proximus 5, VHB 2021 Ziff. 13.7, 18.3.2.1, 22.1.5, 22.1.6; §§ 30, 31 VVG","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Außenversicherung und Wertsachen","lf":"LF 4","buch":"PV2 8.1.5 S. 454–480 · Lösungen S. 733–739","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann gilt Hausrat in der Außenversicherung als nur „vorübergehend“ außerhalb des Versicherungsortes?","optionen":["solange er nicht länger als vier Wochen fort ist","solange er nicht länger als drei Monate fort ist","solange er nicht länger als sechs Monate fort ist","solange er nicht länger als ein ganzes Jahr fort ist"],"richtig":[1],"erkl":"Die Außenversicherung schützt Hausrat, der sich vorübergehend außerhalb der Wohnung befindet. Zeiträume von mehr als 3 Monaten gelten nicht als vorübergehend.","norm":"Proximus 5, VHB 2021 Ziff. 12.1.2","id":"1.2-1-1"},{"typ":"mc","frage":"Ein Kunde zeltet an der Ostsee. Ein Sturm zerstört das Zelt und die Kleidung darin. Leistet seine Hausratversicherung?","optionen":["Ja, weil Sturm in der Außenversicherung ohne jede Einschränkung versichert ist.","Ja, aber nur dann, wenn der Campingplatz im Versicherungsschein genannt ist.","Nein, Sturm und Hagel sind in der Außenversicherung nur in Gebäuden versichert.","Nein, weil Urlaubsgepäck grundsätzlich nur in der Reisegepäckversicherung gilt."],"richtig":[2],"erkl":"In der Außenversicherung besteht für Schäden durch Naturgefahren wie Sturm und Hagel Versicherungsschutz nur innerhalb von Gebäuden. Ein Zelt ist kein Gebäude.","norm":"Proximus 5, VHB 2021 Ziff. 12.3.2","id":"1.2-1-2"},{"typ":"wf","frage":"Welche der folgenden Sachen zählen in der Hausratversicherung zu den Wertsachen?","aussagen":[["Bargeld in der Schreibtischschublade",true],["eine geerbte Briefmarkensammlung",true],["eine Halskette aus Gold",true],["ein neues Smartphone",false],["ein hochwertiger Flachbildfernseher",false]],"erkl":"Wertsachen sind unter anderem Bargeld, Urkunden und Sparbücher, Schmuck, Briefmarken, Münzen, Sachen aus Gold oder Platin, Pelze, Kunstgegenstände und Antiquitäten über 100 Jahre. Elektronische Geräte sind normaler Hausrat ohne Wertsachengrenze.","norm":"Proximus 5, VHB 2021 Ziff. 18.1","id":"1.2-1-3"},{"typ":"zuo","frage":"Ordnen Sie den Wertsachen außerhalb eines verschlossenen Wertschutzschranks die Entschädigungsgrenze nach den VHB 2021 der Proximus zu (sofern nichts anderes vereinbart ist).","paare":[["Bargeld","1.500 €"],["Urkunden einschließlich Sparbücher","3.000 €"],["Schmuck, Edelsteine, Briefmarken, Münzen","20.000 €"],["Wertsachen insgesamt","20 % der VS einschließlich Vorsorge"]],"erkl":"Für Wertsachen gilt je Versicherungsfall eine Gesamtgrenze von 20 % der Versicherungssumme; gerechnet wird wie in der Prüfung mit der Versicherungssumme einschließlich Vorsorge (Ziff. 17.2). Außerhalb eines verschlossenen Wertschutzschranks gelten zusätzlich die festen Grenzen nach Ziff. 18.3.2.","norm":"Proximus 5, VHB 2021 Ziff. 17.2, 18.3.1, 18.3.2","id":"1.2-1-4"},{"typ":"mc","frage":"Welche Wirkung hat ein anerkannter, verschlossener Wertschutzschrank auf die Entschädigung von Wertsachen?","optionen":["Wertsachen darin werden ohne jede Obergrenze und ohne Prüfung des Werts ersetzt.","Der Kunde muss für die Wertsachen darin einen gesonderten Vertrag abschließen.","Die Gesamtgrenze für Wertsachen in Prozent der Versicherungssumme fällt dann weg.","Die niedrigen Einzelgrenzen gelten nur für Wertsachen außerhalb des Schranks."],"richtig":[3],"erkl":"Die festen Grenzen (z. B. 1.500 € für Bargeld) gelten für Wertsachen außerhalb eines verschlossenen, anerkannten Wertschutzschranks. Für Wertsachen im Schrank bleibt die Gesamtgrenze von 20 % der Versicherungssumme maßgeblich.","norm":"Proximus 5, VHB 2021 Ziff. 18.2, 18.3","id":"1.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Hoffmann aus Halle (Saale) hat bei der Proximus eine Hausratversicherung nach den VHB 2021 mit 60.000 € Versicherungssumme. Eine Unterversicherung besteht nicht; für Außenversicherung und Wertsachen gelten die Grenzen der VHB 2021. Auf einer fünftägigen Reise nach Leipzig bricht ein Täter die Tür seines Hotelzimmers auf und stiehlt Laptop, Kamera und Uhr (Wiederbeschaffungspreis zusammen 7.400 €). Zwei Wochen später wird in seine Wohnung eingebrochen: Der Täter nimmt 2.300 € Bargeld aus dem Schreibtisch und Schmuck im Wert von 4.000 € aus der Kommode mit.","items":[{"typ":"mc","frage":"Besteht für den Diebstahl im Hotelzimmer Versicherungsschutz?","optionen":["Ja, über die Außenversicherung, weil der Hausrat nur vorübergehend dort war und ein Einbruch vorliegt.","Nein, weil nur der Hotelbetreiber für Sachen in seinen Zimmern haftet und die Hausrat nicht leistet.","Nein, weil die Außenversicherung nur Sachen schützt, die der Kunde am Körper getragen hat.","Ja, aber nur für die Uhr, weil nur Wertsachen über die Außenversicherung gedeckt sind."],"richtig":[0],"erkl":"Der Hausrat befand sich weniger als 3 Monate außerhalb der Wohnung. Das Aufbrechen der Hotelzimmertür erfüllt den Tatbestand des Einbruchdiebstahls, der auch in der Außenversicherung versichert ist.","norm":"Proximus 5, VHB 2021 Ziff. 4.1.1, 12.1, 12.3","id":"1.2-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Diebstahl im Hotelzimmer.","wert":6600,"einheit":"€","tol":0.5,"erkl":"Grenze der Außenversicherung: 10 % der Versicherungssumme zuzüglich Vorsorge, höchstens 10.000 €. Versicherungssumme mit Vorsorge: 60.000 € × 1,10 = 66.000 €; 10 % davon = 6.600 €. Der Schaden von 7.400 € übersteigt die Grenze, also werden 6.600 € gezahlt.","norm":"Proximus 5, VHB 2021 Ziff. 12.4, 17.2","id":"1.2-2-2"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Wohnungseinbruch (Bargeld und Schmuck).","wert":5500,"einheit":"€","tol":0.5,"erkl":"Bargeld außerhalb eines verschlossenen Wertschutzschranks: höchstens 1.500 € (statt 2.300 €). Schmuck: 4.000 € liegen unter der Grenze von 20.000 €. Summe 5.500 €; die Gesamtgrenze für Wertsachen von 20 % × 66.000 € (Versicherungssumme einschließlich Vorsorge) = 13.200 € ist eingehalten.","norm":"Proximus 5, VHB 2021 Ziff. 17.2, 18.3.1, 18.3.2","id":"1.2-2-3"}]}]},{"nr":"1.3","titel":"Entschädigung, Unterversicherung und Unterversicherungsverzicht","lf":"LF 4","buch":"PV2 8.1.5 S. 454–480 · Lösungen S. 733–739","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was ersetzt die Hausratversicherung für eine zerstörte oder gestohlene Sache?","optionen":["den Zeitwert, also den Neupreis abzüglich eines Abzugs für Alter und Abnutzung","den Wiederbeschaffungspreis einer Sache gleicher Art und Güte in neuwertigem Zustand","den ursprünglichen Kaufpreis laut Rechnung, auch wenn die Sache heute billiger ist","den Betrag, den der Kunde für die gebrauchte Sache beim Verkauf noch erzielt hätte"],"richtig":[1],"erkl":"Versicherungswert in der Hausratversicherung ist der Neuwert: der Betrag, der aufzuwenden ist, um Sachen gleicher Art und Güte in neuwertigem Zustand wiederzubeschaffen. Ein Abzug neu für alt erfolgt nicht; nur für nicht mehr verwendbare Sachen gilt der gemeine Wert.","norm":"Proximus 5, VHB 2021 Ziff. 14.1.1, 14.1.3, 17.1.1","id":"1.3-1-1"},{"typ":"mc","frage":"Wie wird eine beschädigte, aber reparierbare Sache in der Hausratversicherung entschädigt?","optionen":["Es wird immer der volle Wiederbeschaffungspreis gezahlt, die Reparatur ist Sache des Kunden.","Es werden nur die Reparaturkosten ersetzt, eine verbleibende Wertminderung trägt der Kunde.","Ersetzt werden Reparaturkosten und Wertminderung, höchstens der Wiederbeschaffungspreis.","Ersetzt wird der Zeitwert der Sache, von dem die Reparaturkosten abgezogen werden."],"richtig":[2],"erkl":"Bei beschädigten Sachen zahlt der Versicherer die erforderlichen Reparaturkosten zuzüglich einer verbleibenden Wertminderung, höchstens den Versicherungswert (Neuwert) zum Zeitpunkt des Versicherungsfalles.","norm":"Proximus 5, VHB 2021 Ziff. 17.1.2","id":"1.3-1-2"},{"typ":"zahl","frage":"Hausrat-Versicherungssumme 45.000 €, Versicherungswert des gesamten Hausrats 72.000 €, Schaden 9.600 €. Ein Unterversicherungsverzicht besteht nicht. Wie hoch ist die Entschädigung nach den VHB 2021?","wert":6600,"einheit":"€","tol":0.5,"erkl":"Unterversicherung, weil 45.000 € < 72.000 €. Formel: Schaden × Versicherungssumme zuzüglich Vorsorge ÷ Versicherungswert. Versicherungssumme mit Vorsorge: 45.000 € × 1,10 = 49.500 €. Entschädigung: 9.600 € × 49.500 ÷ 72.000 = 6.600 €.","norm":"Proximus 5, VHB 2021 Ziff. 17.2, 17.5; § 75 VVG","id":"1.3-1-3"},{"typ":"zahl","frage":"Nach dem Tarif Hausrat der Proximus wird der Unterversicherungsverzicht (Klausel 7712) bei mindestens 650 € Versicherungssumme je m² Wohnfläche gewährt; die Versicherungssumme ist auf volle 100 € aufzurunden. Welche Versicherungssumme braucht ein Kunde mit 85 m² Wohnfläche mindestens?","wert":55300,"einheit":"€","tol":0.5,"erkl":"85 m² × 650 €/m² = 55.250 €, aufgerundet auf volle 100 €: 55.300 €. Mit dieser Versicherungssumme kann die Klausel 7712 vereinbart werden; dann verzichtet die Proximus auf den Abzug wegen Unterversicherung.","norm":"Proximus 5, Tarif Hausrat Ziff. 1.1; Proximus 5, Klausel PK 7712","id":"1.3-1-4"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Beschreibung zu.","paare":[["Versicherungswert","tatsächlicher Wiederbeschaffungspreis des gesamten Hausrats"],["Versicherungssumme","im Vertrag vereinbarter Betrag, nach dem sich der Beitrag richtet"],["Unterversicherung","Versicherungssumme liegt unter dem Versicherungswert"],["Überversicherung","Versicherungssumme übersteigt den Versicherungswert erheblich"]],"erkl":"Bei Unterversicherung wird die Entschädigung im Verhältnis der Versicherungssumme zuzüglich Vorsorge zum Versicherungswert gekürzt (Ziff. 17.5 VHB 2021, § 75 VVG). Bei erheblicher Überversicherung können beide Seiten die Herabsetzung der Summe verlangen (§ 74 VVG).","norm":"Proximus 5, VHB 2021 Ziff. 14.1, 14.2, 17.5; §§ 74, 75 VVG","id":"1.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Schulze wohnt in Halle (Saale) in einer 90 m² großen Wohnung. Die Hausratversicherung nach den VHB 2021 bei der Proximus Versicherung AG hat eine Versicherungssumme von 52.000 €. Die Klausel 7712 (Unterversicherungsverzicht) gewährt die Proximus laut Tarif nur bei mindestens 650 € Versicherungssumme je m² Wohnfläche. Nach einem Rohrbruch in der Küche beträgt der Hausratschaden 7.800 €. Der Sachverständige ermittelt einen Versicherungswert des gesamten Hausrats von 78.000 €.","items":[{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für Familie Schulze.","wert":5720,"einheit":"€","tol":0.5,"erkl":"Kein Unterversicherungsverzicht, weil 52.000 € < 90 m² × 650 € = 58.500 €. Unterversicherung, weil 52.000 € < 78.000 €. Versicherungssumme mit Vorsorge: 52.000 € × 1,10 = 57.200 €. Entschädigung: 7.800 € × 57.200 ÷ 78.000 = 5.720 €.","norm":"Proximus 5, VHB 2021 Ziff. 17.2, 17.5; Proximus 5, Tarif Hausrat Ziff. 1.1","id":"1.3-2-1"},{"typ":"mc","frage":"Warum greift der Unterversicherungsverzicht bei Familie Schulze nicht?","optionen":["Weil ein Leitungswasserschaden grundsätzlich vom Unterversicherungsverzicht ausgenommen ist.","Weil der Verzicht nur gilt, wenn der Schaden unter 10 % der Versicherungssumme liegt.","Weil der Verzicht nur bei Wohneigentum und nicht bei einer Mietwohnung vereinbart wird.","Weil die Versicherungssumme unter dem Tarifwert von 650 € je m² Wohnfläche liegt."],"richtig":[3],"erkl":"Voraussetzung für die Klausel 7712 ist laut Tarif eine Versicherungssumme von mindestens 90 m² × 650 € = 58.500 €. Mit 52.000 € ist sie zu niedrig, also wird die Unterversicherung angerechnet.","norm":"Proximus 5, Tarif Hausrat Ziff. 1.1; Proximus 5, Klausel PK 7712","id":"1.3-2-2"},{"typ":"wf","frage":"Welche Hinweise geben Sie Familie Schulze im Beratungsgespräch nach dem Schaden?","aussagen":[["Mit einer Versicherungssumme von mindestens 58.500 € kann künftig der Unterversicherungsverzicht vereinbart werden.",true],["Eine jetzt vereinbarte Erhöhung der Versicherungssumme wirkt auch für den bereits eingetretenen Schaden.",false],["Bei Unterversicherung wird die Entschädigung im Verhältnis gekürzt, nicht ganz versagt.",true],["Größere Neuanschaffungen sollten Anlass sein, die Versicherungssumme zu überprüfen.",true],["Bei Unterversicherung zahlt der Versicherer im Schadenfall überhaupt nichts.",false]],"erkl":"Eine Summenerhöhung wirkt nur für künftige Versicherungsfälle. Die Unterversicherung führt zur verhältnismäßigen Kürzung nach Ziff. 17.5 VHB 2021; mit ausreichender Summe nach Wohnfläche kann die Klausel 7712 vereinbart werden, dann entfällt der Abzug.","norm":"Proximus 5, VHB 2021 Ziff. 17.5; Proximus 5, Tarif Hausrat Ziff. 1.1; Proximus 5, Klausel PK 7712","id":"1.3-2-3"}]}]}],"lf":"LF 4"},{"nr":"2","titel":"Wohngebäude- und Glasversicherung: Gefahren, Versicherungswert, Entschädigung","abschnitte":[{"nr":"2.1","titel":"Gebäudegefahren, Elementargefahren und Glasbruch","lf":"LF 4","buch":"PV2 8.1.5 S. 454–480 · Lösungen S. 733–739","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann liegt ein Brand im Sinne der VGB 2021 und VHB 2021 der Proximus vor?","optionen":["bei einem Feuer, das ohne bestimmungsgemäßen Herd entsteht oder ihn verlässt und sich aus eigener Kraft ausbreiten kann","bei jeder Hitzeeinwirkung, auch wenn eine Zigarette nur ein kleines Loch in den Teppich sengt und sofort erlischt","bei einem Feuer im Kaminofen, das wie vorgesehen brennt und dabei Ruß an der Decke des Wohnzimmers hinterlässt","bei einem Elektromotor, der durch Überhitzung durchschmort, ohne dass dabei irgendwo Flammen entstehen"],"richtig":[0],"erkl":"Brand setzt ein Schadenfeuer voraus: Es entsteht ohne bestimmungsgemäßen Herd oder verlässt ihn und kann sich aus eigener Kraft ausbreiten. Nutzfeuer und reine Seng- oder Schmorschäden sind kein Brand; Sengschäden sind nur versichert, wenn eine versicherte Gefahr sie verursacht hat.","norm":"Proximus 5, VGB 2021 Ziff. 3.1, 3.8.2; Proximus 5, VHB 2021 Ziff. 3.1","id":"2.1-1-1"},{"typ":"wf","frage":"Welche Schäden sind in der Wohngebäudeversicherung über die Gefahr Leitungswasser versichert?","aussagen":[["Ein Wasserrohr im Gebäude platzt bei Frost.",true],["Aus einer undichten Leitung tritt Wasser aus und durchnässt Estrich und Putz.",true],["Regenwasser dringt durch ein undichtes Dach in das Obergeschoss ein.",false],["Steigendes Grundwasser drückt durch die Kellerwand.",false],["Ein Rohr der Warmwasserheizung bricht und muss erneuert werden.",true]],"erkl":"Leitungswasser umfasst Bruchschäden an Rohren der Wasserversorgung und der Heizung sowie Nässeschäden durch bestimmungswidrig austretendes Leitungswasser. Witterungsniederschläge und Grundwasser sind kein Leitungswasser.","norm":"Proximus 5, VGB 2021 Ziff. 4.2, 4.3.1, 4.5.4","id":"2.1-1-2"},{"typ":"mc","frage":"Was versteht man unter Rückstau als weiterer Naturgefahr (Elementargefahr)?","optionen":["Wasser, das sich nach einem Rohrbruch im Gebäude in der Zwischendecke anstaut","Wasser, das nach Starkregen aus den Ableitungsrohren des Hauses ins Gebäude tritt","Regenwasser, das sich in einer verstopften Dachrinne staut und dann überläuft","Grundwasser, das bei hohem Pegel langsam durch die Bodenplatte nach oben drückt"],"richtig":[1],"erkl":"Rückstau liegt vor, wenn Wasser aus den gebäudeeigenen Ableitungsrohren in das Gebäude eindringt und Witterungsniederschläge oder die Ausuferung von Gewässern das verursacht haben. Die Gefahr ist nur versichert, wenn die weiteren Naturgefahren (Elementar) zusätzlich vereinbart sind.","norm":"Proximus 5, VGB 2021 Ziff. 1.3.2, 5.4.2","id":"2.1-1-3"},{"typ":"zuo","frage":"Ordnen Sie jedem Schadenereignis die weitere Elementargefahr zu.","paare":[["Ein Fluss tritt über die Ufer, Wasser überflutet das Grundstück.","Überschwemmung"],["Wasser aus dem Kanal drückt über den Bodenablauf in den Keller.","Rückstau"],["Der Boden über einem natürlichen Hohlraum sackt ab.","Erdsenkung"],["Die Last des Schnees auf dem Dach lässt den Dachstuhl einbrechen.","Schneedruck"]],"erkl":"Zu den weiteren Naturgefahren gehören Überschwemmung, Rückstau, Erdbeben, Erdsenkung, Erdrutsch, Schneedruck, Lawinen und Vulkanausbruch. Sie müssen zusätzlich vereinbart werden; der Schutz beginnt nach einer Wartezeit von einem Monat.","norm":"Proximus 5, VGB 2021 Ziff. 1.3.2, 5.4","id":"2.1-1-4"},{"typ":"mc","frage":"Welcher Schaden ist über die Glasversicherung (Mobiliarverglasung) versichert?","optionen":["Eine Kristallvase zerbricht beim Abstauben auf dem gefliesten Küchenboden.","Die Fensterscheibe hat nach dem Putzen tiefe Kratzer und feine Schrammen.","Die Glaskeramik-Kochfläche des Herdes springt, weil ein Topf darauf fällt.","Die Glühbirne der Deckenleuchte zerspringt beim Einschalten des Lichts."],"richtig":[2],"erkl":"Versichert ist der Bruch von Gebäude- und Mobiliarverglasung, also Glasscheiben, Platten und Spiegel aus Glas sowie Glaskeramikkochflächen. Hohlgläser wie Vasen, Beleuchtungskörper sowie bloße Kratzer und Schrammen sind nicht versichert.","norm":"Proximus 5, AGlB 2021 Ziff. 1, 2.1.1, 4.1.1, 4.3.1","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr und Frau Wagner besitzen ein Einfamilienhaus in Halle (Saale). Ihre Wohngebäudeversicherung nach den VGB 2021 bei der Proximus Versicherung AG schließt seit Jahren die weiteren Naturgefahren (Elementargefahren) ein; dafür gilt laut Tarif eine Selbstbeteiligung von 500 € je Versicherungsfall. Nach einem Starkregen fließt Oberflächenwasser über die Kellertreppe in den Keller, zusätzlich drückt Wasser aus der Kanalisation durch den Bodenablauf. Am Gebäude (Estrich, Putz, Heizungsanlage) entsteht ein Schaden von 18.400 €. Im Keller standen außerdem Waschmaschine und Gefriertruhe.","items":[{"typ":"mc","frage":"Welche Gefahren haben den Gebäudeschaden verursacht?","optionen":["Leitungswasser, weil das Wasser aus dem Bodenablauf des Gebäudes ausgetreten ist","Sturm, weil der Starkregen von kräftigem Wind begleitet war und so eindringen konnte","Grundwasser, das in jeder Wohngebäudeversicherung ohne Zusatz mitversichert ist","Überschwemmung und Rückstau, die als weitere Elementargefahren versichert sind"],"richtig":[3],"erkl":"Oberflächenwasser nach Starkregen auf dem Grundstück ist Überschwemmung, Wasser aus den Ableitungsrohren über den Bodenablauf nach Starkregen ist Rückstau. Beides sind weitere Naturgefahren; Leitungswasser schließt Schäden durch Witterungsniederschläge und Rückstau ausdrücklich aus.","norm":"Proximus 5, VGB 2021 Ziff. 4.5.4, 5.4.1, 5.4.2","id":"2.1-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Gebäudeschaden nach Abzug der Selbstbeteiligung.","wert":17900,"einheit":"€","tol":0.5,"erkl":"Für die weiteren Naturgefahren gilt laut Tarif Wohngebäude eine Selbstbeteiligung von 500 € je Versicherungsfall; sie wird von der Entschädigung abgezogen. Entschädigung: 18.400 € − 500 € = 17.900 €.","norm":"Proximus 5, VGB 2021 Ziff. 18.10; Proximus 5, Tarif Wohngebäude Ziff. 6.3","id":"2.1-2-2"},{"typ":"mc","frage":"Über welchen Vertrag ist der Schaden an Waschmaschine und Gefriertruhe zu regulieren?","optionen":["über die Hausratversicherung, wenn darin weitere Elementargefahren eingeschlossen sind","über die Wohngebäudeversicherung, weil die Geräte im Keller des Gebäudes standen","über die Glasversicherung, weil beide Geräte Glasteile und Bedienfelder besitzen","über keinen Vertrag, weil Haushaltsgeräte im Keller generell ausgeschlossen sind"],"richtig":[0],"erkl":"Waschmaschine und Gefriertruhe sind bewegliche Sachen des Haushalts und damit Hausrat. Für Überschwemmung und Rückstau braucht auch die Hausratversicherung den zusätzlich vereinbarten Einschluss der weiteren Naturgefahren (Selbstbeteiligung laut Tarif 500 €).","norm":"Proximus 5, VHB 2021 Ziff. 1.4.2, 6.4, 8.1; Proximus 5, Tarif Hausrat Ziff. 3.3","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Versicherungswert 1914 und Entschädigungsberechnung","lf":"LF 4","buch":"PV2 8.1.5 S. 454–480 · Lösungen S. 733–739","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Warum wird die Versicherungssumme in der gleitenden Neuwertversicherung als „Wert 1914“ angegeben?","optionen":["Weil nur Gebäude versichert werden dürfen, die schon vor dem Jahr 1914 gebaut wurden.","Weil der Neubauwert so in einer festen Bezugsgröße steht und über den Faktor aktuell bleibt.","Weil die Versicherungsaufsicht seit 1914 eine einheitliche Gebäudesteuer vorschreibt.","Weil Schäden stets mit den Baupreisen von 1914 und ohne heutige Preise abgerechnet werden."],"richtig":[1],"erkl":"Der gleitende Neuwert wird in Preisen des Jahres 1914 ausgedrückt. Über den jährlich angepassten Anpassungsfaktor folgt der Versicherungsschutz der Baukostenentwicklung, sodass keine Unterversicherung durch steigende Baupreise entsteht.","norm":"Proximus 5, VGB 2021 Ziff. 14.1.1.1, 14.1.1.3, 15.1","id":"2.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zur gleitenden Neuwertversicherung treffen zu?","aussagen":[["Der Anpassungsfaktor ändert sich jährlich mit der Entwicklung von Baupreisen und Tariflöhnen im Baugewerbe.",true],["Der Beitrag steigt oder sinkt mit dem Anpassungsfaktor.",true],["Der Kunde muss die Versicherungssumme jedes Jahr selbst neu berechnen und melden.",false],["Ist der Wert 1914 richtig ermittelt, verzichtet der Versicherer auf die Anrechnung einer Unterversicherung.",true],["Bei gleitendem Neuwert wird grundsätzlich nur der Zeitwert des Gebäudes ersetzt.",false]],"erkl":"Der Anpassungsfaktor ändert sich zum 1. Januar; die Änderung des Baupreisindex zählt zu 80 %, die des Tariflohnindex zu 20 %. Hat der Kunde die Antragsfragen zutreffend beantwortet und hat die Proximus danach den Wert 1914 berechnet, gilt der Unterversicherungsverzicht; ersetzt wird grundsätzlich der Neuwert.","norm":"Proximus 5, VGB 2021 Ziff. 15.1, 15.2.1, 16, 17.2","id":"2.2-1-2"},{"typ":"zahl","frage":"Versicherungssumme 1914: 25.000 Mark, Prämiensatz 1,2 ‰, Anpassungsfaktor 2026: 27,63. Wie hoch ist die Nettojahresprämie vor Nachlässen, ohne Versicherungsteuer?","wert":828.9,"einheit":"€","tol":0.01,"erkl":"Jahresprämie 1914 = 25.000 M × 1,2 ‰ = 30,00 M; Nettojahresprämie = 30,00 M × 27,63 = 828,90 €.","norm":"Proximus 5, VGB 2021 Ziff. 16","id":"2.2-1-3"},{"typ":"zahl","frage":"Bei Vertragsschluss hat der Kunde die Wohnfläche im Antrag zu klein angegeben; deshalb wurde die Versicherungssumme mit 20.000 Mark (Wert 1914) statt richtig 25.000 Mark bemessen. Ein Sturm verursacht Reparaturkosten von 45.000 € und Aufräumungskosten von 2.500 € (innerhalb der Kostengrenze). Vereinbart ist die Selbstbeteiligung von 500 € (Klausel 7761). Wie hoch ist die Entschädigung?","wert":37500,"einheit":"€","tol":0.5,"erkl":"Wegen der falschen Antragsangaben gilt der Unterversicherungsverzicht nicht (Ziff. 15.2.3). Gekürzt werden Schaden und versicherte Kosten im Verhältnis 20.000 ÷ 25.000 = 0,8: (45.000 € + 2.500 €) × 0,8 = 38.000 €. Abzüglich Selbstbeteiligung: 38.000 € − 500 € = 37.500 €.","norm":"Proximus 5, VGB 2021 Ziff. 15.2.3, 18.8, 18.10; Proximus 5, Klausel PK 7761","id":"2.2-1-4"},{"typ":"mc","frage":"In welchem Fall ersetzt der Wohngebäudeversicherer trotz Vereinbarung des gleitenden Neuwerts nur den gemeinen Wert?","optionen":["wenn das Gebäude älter als 30 Jahre ist und seitdem nicht saniert wurde","wenn der Kunde den Schaden nicht innerhalb einer Woche gemeldet hat","wenn das Gebäude zum Abbruch bestimmt oder sonst dauerhaft entwertet ist","wenn die Reparatur teurer ist als die Hälfte der Versicherungssumme"],"richtig":[2],"erkl":"Ist das Gebäude zum Abbruch bestimmt oder sonst dauerhaft entwertet, z. B. für seinen Zweck nicht mehr zu verwenden, ist der gemeine Wert Versicherungswert. Entschädigt wird dann nur der erzielbare Verkaufspreis ohne Grundstücksanteil.","norm":"Proximus 5, VGB 2021 Ziff. 14.2, 18.3","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Sommer besitzt ein Einfamilienhaus in Halle (Saale), versichert bei der Proximus nach den VGB 2021 zum gleitenden Neuwert mit Unterversicherungsverzicht. Durch einen Brand im Dachgeschoss entsteht ein Neuwertschaden von 120.000 €. Der Zeitwertschaden beträgt 84.000 €. Die Familie überlegt, das Haus nicht wieder aufzubauen, sondern das Grundstück zu verkaufen.","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Begriff aus dem Fall Sommer die richtige Beschreibung zu.","paare":[["Neuwertschaden","Kosten der Wiederherstellung in neuwertigem Zustand"],["Zeitwertschaden","Neuwertschaden abzüglich Wertminderung durch Alter und Abnutzung"],["Neuwertanteil (Neuwertspitze)","Unterschied zwischen Neuwert- und Zeitwertschaden"],["Aufräumungs- und Abbruchkosten","versicherte Kosten für Brandschutt und Abriss"]],"erkl":"Die Entschädigung setzt sich aus dem Zeitwertschaden und dem Neuwertanteil zusammen; zusätzlich sind versicherte Kosten wie Aufräumungs- und Abbruchkosten zu ersetzen (begrenzt auf 5 % der Versicherungssumme Wert 1914 × Anpassungsfaktor).","norm":"Proximus 5, VGB 2021 Ziff. 11, 12.1, 18.1, 18.2, 18.6; § 93 VVG","id":"2.2-2-1"},{"typ":"zahl","frage":"Wie hoch ist der Neuwertanteil (Neuwertspitze) im Fall Sommer?","wert":36000,"einheit":"€","tol":0.5,"erkl":"Neuwertanteil = Neuwertschaden − Zeitwertschaden = 120.000 € − 84.000 € = 36.000 €.","norm":"Proximus 5, VGB 2021 Ziff. 18.6; § 93 VVG","id":"2.2-2-2"},{"typ":"mc","frage":"Was zahlt die Proximus, wenn Familie Sommer das Haus nicht wieder aufbaut?","optionen":["sofort den gesamten Neuwertschaden, weil der Vertrag auf den gleitenden Neuwert lautet","nichts, weil ohne Wiederaufbau überhaupt kein Anspruch auf eine Entschädigung entsteht","nur die Hälfte des Neuwertschadens als pauschale Abfindung für den Verzicht auf den Bau","den Zeitwertschaden; die Neuwertspitze erst, wenn die Wiederherstellung gesichert ist"],"richtig":[3],"erkl":"Den Anspruch auf den Neuwertanteil erwirbt der Kunde nur, wenn er sicherstellt, dass er die Entschädigung zur Wiederherstellung verwendet, und dies innerhalb von 3 Jahren nach dem Versicherungsfall sichergestellt ist. Ohne Wiederaufbau bleibt es beim Zeitwertschaden von 84.000 €.","norm":"Proximus 5, VGB 2021 Ziff. 18.6, 20.1.2; § 93 VVG","id":"2.2-2-3"}]}]}],"lf":"LF 4"},{"nr":"3","titel":"Schadenregulierung: Obliegenheiten, Rechtsfolgen, Bearbeitungsweg und Service","abschnitte":[{"nr":"3.1","titel":"Obliegenheiten nach dem Versicherungsfall und grobe Fahrlässigkeit","lf":"LF 4","buch":"PV2 8.1.1–8.1.4 S. 448–453 · Lösungen S. 733","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jeder Pflicht des Versicherungsnehmers die gesetzliche Grundlage zu.","paare":[["Den Versicherungsfall nach Kenntnis unverzüglich anzeigen","§ 30 VVG"],["Auf Verlangen jede zur Feststellung erforderliche Auskunft erteilen","§ 31 VVG"],["Den Schaden nach Möglichkeit abwenden und mindern","§ 82 VVG"],["Ersatz der Aufwendungen für die Schadenminderung verlangen","§ 83 VVG"]],"erkl":"Anzeige- und Auskunftspflicht sowie die Rettungspflicht sind die zentralen Obliegenheiten nach dem Versicherungsfall; die VHB 2021 übernehmen sie in Ziff. 22.1. § 83 VVG gibt dem Kunden einen Anspruch auf Ersatz seiner Rettungskosten.","norm":"§§ 30, 31, 82, 83 VVG; Proximus 5, VHB 2021 Ziff. 22.1","id":"3.1-1-1"},{"typ":"mc","frage":"Ein Kunde verletzt nach dem Versicherungsfall vorsätzlich eine vertragliche Obliegenheit. Welche Rechtsfolge gilt nach § 28 VVG?","optionen":["Der Versicherer ist leistungsfrei, außer der Verstoß war für den Schaden nicht ursächlich und nicht arglistig.","Der Versicherer darf die Leistung nur um höchstens die Hälfte kürzen, nie aber ganz verweigern.","Der Versicherer muss voll leisten, kann aber vom Kunden eine Vertragsstrafe in Höhe eines Beitrags fordern.","Der Versicherer darf den Vertrag rückwirkend aufheben und alle bisher gezahlten Leistungen zurückfordern."],"richtig":[0],"erkl":"Bei vorsätzlicher Obliegenheitsverletzung ist der Versicherer leistungsfrei (§ 28 Abs. 2 VVG; Ziff. 22.3 VHB 2021). Der Kunde kann nachweisen, dass die Verletzung weder für den Eintritt noch für den Umfang des Schadens ursächlich war; bei Arglist hilft dieser Nachweis nicht (§ 28 Abs. 3 VVG).","norm":"§ 28 Abs. 2, 3 VVG; Proximus 5, VHB 2021 Ziff. 22.3","id":"3.1-1-2"},{"typ":"mc","frage":"Welche Rechtsfolge hat es, wenn der Kunde den Versicherungsfall grob fahrlässig herbeiführt?","optionen":["Der Versicherer ist vollständig leistungsfrei, wie bei vorsätzlicher Herbeiführung auch.","Der Versicherer darf die Leistung entsprechend der Schwere des Verschuldens kürzen.","Der Versicherer muss voll leisten, weil nur Vorsatz die Leistungspflicht berühren kann.","Der Versicherer darf pauschal genau die Hälfte kürzen, unabhängig vom Einzelfall."],"richtig":[1],"erkl":"Nach § 81 Abs. 2 VVG darf der Versicherer bei grober Fahrlässigkeit seine Leistung in einem der Schwere des Verschuldens entsprechenden Verhältnis kürzen (Quotelung). Nur bei Vorsatz ist er leistungsfrei (§ 81 Abs. 1 VVG).","norm":"§ 81 VVG","id":"3.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Rechtsfolgen von Obliegenheitsverletzungen nach § 28 VVG treffen zu?","aussagen":[["Bei grob fahrlässiger Verletzung darf der Versicherer im Verhältnis zur Schwere des Verschuldens kürzen.",true],["Bei leicht fahrlässiger Verletzung darf der Versicherer die Leistung um bis zu 50 % kürzen.",false],["Will der Versicherer wegen einer verletzten Auskunftspflicht kürzen, muss er vorher durch gesonderte Mitteilung in Textform auf diese Folge hingewiesen haben.",true],["Bei arglistigem Verhalten kann der Kunde sich nicht darauf berufen, dass der Verstoß folgenlos blieb.",true],["Um kürzen zu dürfen, muss der Versicherer beweisen, dass der Kunde grob fahrlässig gehandelt hat.",false]],"erkl":"Leichte Fahrlässigkeit bleibt folgenlos. Leistungsfreiheit oder Kürzung wegen Verletzung einer Auskunfts- oder Aufklärungsobliegenheit setzt eine gesonderte Mitteilung in Textform voraus (§ 28 Abs. 4 VVG). Grobe Fahrlässigkeit wird vermutet: Für ihr Fehlen trägt der Kunde die Beweislast (§ 28 Abs. 2 Satz 2 VVG).","norm":"§ 28 VVG","id":"3.1-1-4"},{"typ":"mc","frage":"Was muss ein Kunde nach einem Einbruchdiebstahl der Polizei unverzüglich einreichen?","optionen":["eine Kopie seines Versicherungsscheins mit der Versicherungssumme","ein Gutachten eines öffentlich bestellten Sachverständigen","ein Verzeichnis der abhandengekommenen Sachen (Stehlgutliste)","die Originalrechnungen aller Sachen, die sich in der Wohnung befanden"],"richtig":[2],"erkl":"Nach einem Einbruchdiebstahl oder Raub muss der Versicherungsnehmer der Proximus und der Polizei unverzüglich ein Verzeichnis der abhandengekommenen Sachen einreichen, damit nach dem Stehlgut gefahndet werden kann.","norm":"Proximus 5, VHB 2021 Ziff. 22.1.5, 22.1.6","id":"3.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Becker aus Halle (Saale) lässt die Kerzen ihres Adventskranzes brennen und geht zwei Stunden auf den Weihnachtsmarkt. Der Kranz fängt Feuer; am Hausrat entsteht ein Schaden von 8.000 €. Ihr Vertrag nach den VHB 2021 bei der Proximus Versicherung AG enthält keinen Verzicht auf die Kürzung bei grober Fahrlässigkeit. Die Fachabteilung bewertet das Verschulden mit einer Kürzung um 40 %. Beim Löschversuch hat Frau Becker ihren Feuerlöscher geleert und ihre Jacke beschädigt.","items":[{"typ":"mc","frage":"Wie ist das Verhalten von Frau Becker rechtlich einzuordnen?","optionen":["als Verletzung der Anzeigepflicht, die nach § 30 VVG zur vollen Leistungsfreiheit führt","als vorsätzliche Herbeiführung, weil sie die Kerzen absichtlich angezündet hat","als leichte Fahrlässigkeit, die für die Entschädigung ohne jede Bedeutung ist","als grob fahrlässige Herbeiführung, die eine Kürzung nach § 81 Abs. 2 VVG erlaubt"],"richtig":[3],"erkl":"Brennende Kerzen zwei Stunden unbeaufsichtigt zu lassen, verletzt die erforderliche Sorgfalt in besonders schwerem Maß (grobe Fahrlässigkeit). Den Brand wollte sie nicht, Vorsatz scheidet aus.","norm":"§ 81 Abs. 2 VVG","id":"3.1-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den Hausratschaden nach der Kürzung.","wert":4800,"einheit":"€","tol":0.5,"erkl":"Kürzung: 40 % × 8.000 € = 3.200 €. Entschädigung: 8.000 € − 3.200 € = 4.800 € (= 60 % von 8.000 €).","norm":"§ 81 Abs. 2 VVG","id":"3.1-2-2"},{"typ":"mc","frage":"Wie behandeln Sie die Kosten für das Nachfüllen des Feuerlöschers und die beschädigte Jacke?","optionen":["als Rettungskosten nach § 83 VVG, die im Verhältnis der Kürzungsquote gekürzt werden dürfen","als eigener Schaden der Kundin, den sie selbst tragen muss, weil sie den Brand verursacht hat","als Rettungskosten, die immer voll ersetzt werden, auch wenn die Hauptleistung gekürzt wird","als Fall der Haftpflichtversicherung, weil die Kundin ihre eigenen Sachen beschädigt hat"],"richtig":[0],"erkl":"Aufwendungen zur Abwendung und Minderung des Schadens sind nach § 83 Abs. 1 VVG zu ersetzen. Darf der Versicherer seine Leistung kürzen, kann er nach § 83 Abs. 2 VVG auch den Aufwendungsersatz entsprechend kürzen; unbegrenzt ersetzt werden nur Aufwendungen auf Weisung des Versicherers.","norm":"§ 83 VVG; Proximus 5, VHB 2021 Ziff. 17.4, 22.1.1","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Bearbeitungsweg, Service, Fälligkeit und Regress","lf":"LF 4","buch":"PV2 8.1 S. 442–447 · Lösungen S. 733","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Der Kunde hat den Schaden vor über einem Monat gemeldet, die Erhebungen dauern noch an. Was kann er nach § 14 VVG und den VHB 2021 verlangen?","optionen":["eine Verzinsung der Entschädigung mit dem gesetzlichen Basiszinssatz ab dem Schadentag","eine Abschlagszahlung in Höhe des Betrags, den der Versicherer voraussichtlich mindestens zahlt","die sofortige Zahlung der vollen Versicherungssumme, die später verrechnet werden kann","die Erstattung aller Beiträge des laufenden Jahres als Ausgleich für die lange Wartezeit"],"richtig":[1],"erkl":"Die Entschädigung ist fällig, wenn der Anspruch dem Grund und der Höhe nach festgestellt ist. Einen Monat nach Meldung des Schadens kann der Kunde den Betrag als Abschlagszahlung verlangen, der voraussichtlich mindestens zu zahlen ist (Ziff. 20.1 VHB 2021, § 14 Abs. 2 VVG). Verzinst wird nach Ziff. 20.2 ab der Schadenmeldung mit 1 % unter dem Basiszinssatz, mindestens 4 %, höchstens 6 %.","norm":"§ 14 VVG; Proximus 5, VHB 2021 Ziff. 20.1, 20.2","id":"3.2-1-1"},{"typ":"mc","frage":"Was bewirkt § 86 VVG, wenn ein Dritter den Schaden verschuldet und die Proximus den Kunden entschädigt hat?","optionen":["Der Kunde muss die Entschädigung zurückzahlen, sobald er den Dritten selbst verklagt hat.","Der Dritte wird von seiner Haftung frei, weil der Schaden bereits ersetzt worden ist.","Der Ersatzanspruch des Kunden gegen den Dritten geht auf die Proximus über (Regress).","Der Kunde darf vom Dritten zusätzlich den vollen Schadenersatz verlangen und behalten."],"richtig":[2],"erkl":"Soweit der Versicherer den Schaden ersetzt, geht der Ersatzanspruch des Versicherungsnehmers gegen den Schädiger auf ihn über (§ 86 Abs. 1 VVG). Gegen Personen in häuslicher Gemeinschaft ist der Regress nur bei Vorsatz möglich (§ 86 Abs. 3 VVG).","norm":"§ 86 VVG","id":"3.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Serviceleistung in der Schadenbearbeitung die passende Beschreibung zu.","paare":[["Handwerkerservice","Der Versicherer vermittelt einen Fachbetrieb und rechnet direkt mit ihm ab."],["Notverglasung","Eine zerbrochene Scheibe wird vorläufig gesichert, bis die neue eingebaut ist."],["Schadenregulierer vor Ort","Ein Außendienstmitarbeiter besichtigt einen Großschaden persönlich."],["Sachverständigenverfahren","Bei Streit über die Schadenhöhe stellen Sachverständige diese verbindlich fest."]],"erkl":"Serviceleistungen beschleunigen die Regulierung und mindern den Schaden. Das Sachverständigenverfahren (§ 84 VVG, Ziff. 19 VHB 2021) klärt Streit über die Höhe des Schadens, nicht über den Grund der Leistung.","norm":"§§ 82, 84 VVG; Proximus 5, VHB 2021 Ziff. 19; Proximus 5, AGlB 2021 Ziff. 5.1.1","id":"3.2-1-3"},{"typ":"mc","frage":"Wann sind die Feststellungen der Sachverständigen im Sachverständigenverfahren nicht verbindlich?","optionen":["wenn der Kunde mit dem Ergebnis nicht einverstanden ist und Widerspruch einlegt","wenn der Schaden höher ist als die Hälfte der vereinbarten Versicherungssumme","wenn die Sachverständigen länger als drei Monate für ihr Gutachten gebraucht haben","wenn sie offenbar von der wirklichen Sachlage erheblich abweichen"],"richtig":[3],"erkl":"Die Feststellungen der Sachverständigen bzw. des Obmanns sind unverbindlich, wenn nachgewiesen wird, dass sie offenbar von der wirklichen Sachlage erheblich abweichen; dann trifft das Gericht die Feststellung.","norm":"Proximus 5, VHB 2021 Ziff. 19.5; § 84 Abs. 1 VVG","id":"3.2-1-4"},{"typ":"wf","frage":"Welche Aussagen zum Bearbeitungsweg eines Sachschadens treffen zu?","aussagen":[["Bei der formellen Deckung prüfen Sie, ob der Vertrag am Schadentag bestand und der Beitrag gezahlt war.",true],["Zur materiellen Deckung gehört die Frage, ob eine versicherte Gefahr eine versicherte Sache am Versicherungsort beschädigt hat.",true],["War der Erstbeitrag bei Schadeneintritt schuldhaft nicht gezahlt, muss der Versicherer trotzdem leisten, wenn der Kunde sofort nachzahlt.",false],["Die Höhe der Entschädigung wird berechnet, nachdem die Deckung dem Grunde nach feststeht.",true],["Gegen den Ehepartner in häuslicher Gemeinschaft nimmt der Versicherer bei leichter Fahrlässigkeit Regress.",false]],"erkl":"Erst formelle, dann materielle Deckung prüfen, danach die Leistung der Höhe nach berechnen. Zahlt der Kunde die Erstprämie schuldhaft nicht rechtzeitig, beginnt der Schutz erst mit der Zahlung; für vorher eingetretene Fälle ist die Proximus leistungsfrei, wenn sie durch auffälligen Hinweis darauf aufmerksam gemacht hat (Ziff. 15.2.2 VHB 2021, § 37 Abs. 2 VVG). Regress gegen Familienangehörige in häuslicher Gemeinschaft nur bei Vorsatz (§ 86 Abs. 3 VVG).","norm":"Proximus 5, VHB 2021 Ziff. 15, 27; §§ 37, 86 VVG","id":"3.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Yilmaz wohnt in Halle (Saale) in einer Wohnung in einem Mehrfamilienhaus. Neben seiner Hausratversicherung hat er bei der Proximus Versicherung AG eine Glasversicherung nach den AGlB 2021 für die Gebäude- und Mobiliarverglasung seiner Wohnung; die Wohnfläche ist richtig angegeben. Beim Rasenmähen schleudert der Nachbar Herr Krause einen Stein durch das Wohnzimmerfenster. Herr Yilmaz lässt sofort eine Notverglasung anbringen (180 €). Die neue Isolierglasscheibe kostet 640 €, der Einbau 210 €.","items":[{"typ":"zahl","frage":"Wie hoch ist die Entschädigung aus der Glasversicherung?","wert":1030,"einheit":"€","tol":0.5,"erkl":"Die Geldleistung umfasst Wiederbeschaffung, Lieferung und Montage: Scheibe 640 € + Einbau 210 € = 850 €. Dazu kommen die Kosten der Notverglasung als versicherte Kosten: 180 €. Entschädigung: 850 € + 180 € = 1.030 €.","norm":"Proximus 5, AGlB 2021 Ziff. 1, 5.1.1, 10.1.1, 10.2","id":"3.2-2-1"},{"typ":"mc","frage":"Wie verfährt die Proximus nach der Zahlung mit Blick auf Herrn Krause?","optionen":["Sie prüft, ob Herr Krause haftet, und nimmt ihn oder seinen Haftpflichtversicherer in Regress.","Sie verlangt von Herrn Yilmaz, den Schaden zuerst selbst bei Herrn Krause geltend zu machen.","Sie verzichtet auf jeden Regress, weil Glasschäden unter Nachbarn stets ausgeschlossen sind.","Sie kündigt den Vertrag von Herrn Yilmaz, weil ein Dritter für den Schaden verantwortlich ist."],"richtig":[0],"erkl":"Haftet Herr Krause (z. B. nach § 823 BGB), geht der Anspruch von Herrn Yilmaz mit der Zahlung auf die Proximus über (§ 86 VVG). Sie kann sich dann an Herrn Krause bzw. seine Privathaftpflichtversicherung wenden.","norm":"§ 86 VVG; § 823 BGB","id":"3.2-2-2"},{"typ":"mc","frage":"Herr Yilmaz fragt, ob er die Notverglasung ohne Rücksprache beauftragen durfte. Was antworten Sie?","optionen":["Nein, er hätte zuerst die schriftliche Zustimmung der Proximus einholen müssen.","Ja, er ist zur Schadenminderung verpflichtet, die Kosten werden ersetzt.","Ja, aber die Kosten trägt er selbst, weil sie nicht zum Glasschaden gehören.","Nein, Notmaßnahmen darf nur ein Sachverständiger der Proximus anordnen."],"richtig":[1],"erkl":"Der Kunde muss den Schaden nach Möglichkeit abwenden und mindern; ein offenes Fenster würde weitere Schäden riskieren. Nach den AGlB 2021 darf er die Notverglasung selbst in Auftrag geben und die Kosten als versicherte Kosten geltend machen.","norm":"Proximus 5, AGlB 2021 Ziff. 10.2, 14.1.1; §§ 82, 83 VVG","id":"3.2-2-3"}]}]}],"lf":"LF 4"}],"reset":["1.1-1-5","1.2-1-4","1.2-2-2","1.3-1-3","1.3-1-4","1.3-2-1","1.3-2-2","1.3-2-3","2.1-1-1","2.1-1-3","2.1-2-2","2.2-1-3","2.2-1-4","2.2-1-5","2.2-2-1","2.2-2-2","3.2-1-1"]};
const K=D.key;let S={};try{S=JSON.parse(localStorage.getItem(K)||'{}')}catch(e){S={}}
const save=()=>{S._rw=2;try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
// Umstellung auf Proximus 5 (15.10.2026): alte Stände der Aufgaben mit geänderter Lösung (D.reset) gelten nicht mehr (einmalig löschen)
if(Object.keys(S).length&&S._rw!==2){for(const k of (D.reset||[]))delete S[k];save()}
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}
const online=/^https?:$/.test(location.protocol);
function simStand(){const s=S._sim;return s&&typeof s==='object'&&s.beste&&typeof s.beste.r==='number'?s:null}

$('#brand').innerHTML=D.titel+'<small>'+D.untertitel+'</small>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
function pills(st){return `<div class="pills"><span class="pill"><span class="dot ${st.pR?'g':''}"></span>${st.pR} % Richtig</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % Fortschritt</span></div>`}
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p[1]?`<a data-go="${p[1]}">${esc(p[0])}</a>`:esc(p[0])).join(' › ')+'</div>'}
function home(){const all=D.module.flatMap(modItems),st=stat(all);
 app.innerHTML=`<div class="box"><h1>${esc(D.sparte)} · GAP 2 Teil 1.2</h1><p class="hint">${esc(D.intro)} Jeder Abschnitt hat eine Lektion „Grundwissen“ und eine „Prüfungssituation“. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}</div>
 <div class="box">${D.module.map((m,i)=>{const s=stat(modItems(m));return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${m.abschnitte.length} Abschnitte · ${s.t} Seiten · ${esc(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">Drei Fälle aus verschiedenen Abschnitten wie in Teil 1.2 der Prüfung, Auswertung je Themenbereich</div>${simKurz()}</div></div></div>`}
function simKurz(){const s=simStand();if(!s)return '<div class="meta" data-sim="leer">Noch keine Simulation abgeschlossen.</div>';const p=x=>Math.round(100*x.r/x.n);return `<div class="pills" data-sim="${s.beste.r}"><span class="pill"><span class="dot g"></span>Bestes Ergebnis ${s.beste.r} von ${s.beste.n} (${p(s.beste)} %)</span><span class="pill"><span class="dot b"></span>Zuletzt ${s.letzte.r} von ${s.letzte.n}</span><span class="pill">${s.anz} ${s.anz===1?'Durchgang':'Durchgänge'}</span></div>`}
function modul(i){const m=D.module[i];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel]])+`<div class="box"><h1>${m.nr}. ${esc(m.titel)}</h1>${m.abschnitte.map((a,j)=>{const s=stat(abItems(a));return `<div class="card" data-go="a${i}.${j}"><div class="ic">${a.nr}</div><div><div class="ct">${a.nr} ${esc(a.titel)}</div><div class="meta">2 Lektionen · ${s.t} Seiten · ${esc(a.lf)}</div>${pills(s)}</div></div>`}).join('')}</div>`}
function abschnitt(i,j){const m=D.module[i],a=m.abschnitte[j];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel]])+`<div class="box"><h1>${a.nr} ${esc(a.titel)}</h1>${a.lektionen.map((l,k)=>{const s=stat(l.items);return `<div class="card" data-go="l${i}.${j}.${k}"><div class="ic">${k+1}</div><div><div class="ct">Lektion ${k+1}: ${esc(l.titel)}</div><div class="meta">${s.t} Seiten</div>${pills(s)}</div></div>`}).join('')}</div>`}
let P=null; // Spieler
function start(list,ctx){P={list,ctx,pos:0,ans:{},done:{}};show()}
function render(q,seed){let h=`<div class="q">${esc(q.frage)}</div>`;
 if(q.typ==='mc'||q.typ==='mehr'){const ord=shuf(q.optionen.map((_,i)=>i),q.id+seed);if(q.typ==='mehr')h+='<div class="hint">Mehrere Antworten können richtig sein.</div>';
  h+=ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='mc'?'radio':'checkbox'}" name="o" value="${i}"><span>${esc(q.optionen[i])}</span></label>`).join('')}
 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')return[...r.querySelectorAll('input:checked')].map(x=>+x.value);
 if(q.typ==='wf')return[...r.querySelectorAll('.wf')].map(w=>{const b=w.querySelector('button.on');return b?+b.dataset.v:null});
 if(q.typ==='zuo')return[...r.querySelectorAll('.zu select')].map(s=>s.value);
 if(q.typ==='zahl'){const v=r.querySelector('input').value.trim().replace(/\./g,'').replace(',','.');return v===''?null:+v}}
function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');
 if(q.typ==='zuo')return q.paare.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>');if(q.typ==='wf')return q.aussagen.map(x=>(x[1]?'✔ richtig: ':'✘ falsch: ')+esc(x[0])).join('<br>');
 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}
function mark(q,a){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(q.richtig.includes(i))o.classList.add('ok');else if(a.includes(i))o.classList.add('bad')});
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>w.classList.add((q.aussagen[i][1]?1:0)===a[i]?'ok':'bad'));
 if(q.typ==='zuo')r.querySelectorAll('.zu').forEach((z,i)=>z.classList.add(q.paare[i][1]===a[i]?'ok':'bad'));
 r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function show(){const q=P.list[P.pos],c=P.ctx,n=P.list.length,sit=c.sit?(c.sit[q.id]||''):'';
 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div></div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Themenbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);
 start(l.items,{titel:`${a.nr} · Lektion ${k+1}: ${l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],['Lektion '+(k+1)]],back:'a'+i+'.'+j,seed:'s',sit,full:l.items})}
function sim(){const L=[];D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>{if(l.situation)L.push(l)})));
 const seed=String(Date.now()),pick=shuf(L,seed).slice(0,3),sit={},list=[];pick.forEach(l=>l.items.forEach(q=>{list.push(q);sit[q.id]=l.situation}));
 start(list,{titel:'Prüfungssimulation Teil 1.2 · drei Fälle',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed,sit,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}

// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
</body>
</html>
