:root{--bg:var(--cd-grund);--card:var(--cd-flaeche);--ink:var(--cd-text);--mute:var(--cd-leise);--line:var(--cd-rand);--acc:var(--cd-leit);--acc2:var(--cd-leit);
--ok:var(--cd-ok-rand);--okbg:var(--cd-ok-flaeche);--bad:var(--cd-falsch);--badbg:var(--cd-falsch-flaeche);--pill:var(--cd-sunk);--shadow:var(--cd-schatten)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
header{background:var(--card);border-bottom:3px solid var(--cd-akzent);position:sticky;top:0;z-index:5}
.hd{max-width:860px;margin:auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{flex:none;color:var(--cd-leit);display:grid;place-items:center}
.brand{font-weight:700;letter-spacing:.01em}.brand small{display:block;font-weight:500;color:var(--mute);font-size:12px}
.sp{flex:1}button,.btn{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:8px 14px}
.btn-p{background:var(--acc);border-color:var(--acc);color:var(--cd-auf-leit);font-weight:600}.btn-p:disabled{opacity:.45;cursor:default}
main{max-width:860px;margin:auto;padding:16px}
.crumb{font-size:14px;color:var(--mute);margin:4px 0 12px}.crumb a{color:var(--acc2);text-decoration:none;cursor:pointer}
.box{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:18px;margin-bottom:16px;border:1px solid var(--line)}
h1{font-size:24px;margin:0 0 12px}h2{font-size:19px;margin:0 0 8px}
.card{display:flex;gap:14px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;background:var(--card)}
.card:hover{border-color:var(--cd-akzent)}.ic{width:34px;height:34px;border-radius:50%;background:var(--acc2);color:var(--cd-auf-leit);display:grid;place-items:center;font-weight:700;flex:none;font-size:14px}
.ct{font-weight:600}.meta{font-size:13px;color:var(--mute)}.pills{display:flex;gap:8px;margin-top:6px;flex-wrap:wrap}
.pill{font-size:12px;background:var(--pill);border-radius:99px;padding:2px 10px;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}.dot.g{background:var(--ok)}.dot.b{background:var(--cd-akzent)}
.bar{height:8px;background:var(--pill);border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:var(--cd-akzent)}
.sit{background:var(--pill);border-left:4px solid var(--cd-akzent);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:15px}
.q{font-weight:600;margin:12px 0}.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0;cursor:pointer}
.opt input{margin-top:4px}.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.wf{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid var(--line);padding:8px 0}
.wf .tg{display:flex;gap:6px}.tg button{padding:4px 10px}.tg button.on{background:var(--acc2);color:var(--cd-auf-leit);border-color:var(--acc2)}
.wf.ok{background:var(--okbg)}.wf.bad{background:var(--badbg)}
.zu{display:grid;grid-template-columns:1fr;gap:4px;margin:10px 0;padding:8px;border:1px solid var(--line);border-radius:8px}
.zu select{font:inherit;padding:6px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);width:100%}
.zu.ok{background:var(--okbg)}.zu.bad{background:var(--badbg)}
.num{display:flex;gap:8px;align-items:center}.num input{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--line);width:180px;background:var(--card);color:var(--ink)}
.fb{border-radius:8px;padding:10px 12px;margin-top:12px}.fb.ok>b::before{content:"\2713\00a0"}.fb.bad>b::before{content:"\2717\00a0";color:var(--bad)}
.opt.ok,.opt.bad{position:relative;padding-right:30px}.opt.ok::after,.opt.bad::after{position:absolute;right:10px;top:9px;font-weight:700}.opt.ok::after{content:"\2713"}.opt.bad::after{content:"\2717";color:var(--bad)}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}
.norm{font-size:13px;color:var(--mute);margin-top:4px}.nav{display:flex;gap:10px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--mute)}.big{font-size:40px;font-weight:800}
.menu{position:absolute;right:16px;top:58px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px color-mix(in srgb,#000000 15%,transparent);padding:6px;display:none}
.menu.on{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:2px 0}
@media (max-width:480px){h1{font-size:20px}.num input{width:130px}}
</style>

<script>
const D={"key":"gap2_12_mobilitaet_v1","titel":"Prüfungstraining GAP 2 · Teil 1.2 · Mobilität und Reisen","sparte":"Mobilität und Reisen","intro":"Hier trainieren Sie die Bearbeitung von Schäden in der Kfz-Haftpflicht, der Kasko und den Reiseversicherungen so, wie die GAP 2 es verlangt. Prüfen Sie in jedem Fall zuerst die Deckung dem Grunde nach und berechnen Sie dann die Leistung der Höhe nach.","lf":"LF 6","untertitel":"Kaufleute für Versicherungen und Finanzanlagen · GAP 2 Teil 1.2","stand":"15.10.2026","module":[{"nr":"1","titel":"Kfz-Haftpflichtversicherung","abschnitte":[{"nr":"1.1","titel":"Leistungen an den Geschädigten","lf":"LF 6","buch":"PV2 8.3.1–8.3.4 S. 521–528 · Lösungen S. 743","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Auf welcher Rechtsgrundlage kann ein Unfallgeschädigter seine Ansprüche direkt gegen den Kfz-Haftpflichtversicherer des Schädigers richten?","optionen":["Auf dem Direktanspruch nach § 115 VVG, der in der Pflichtversicherung gilt.","Auf der Abtretung nach § 398 BGB, die jeder Schädiger vorher erklären muss.","Auf dem Regress nach § 86 VVG, der automatisch auf den Geschädigten übergeht.","Auf der Halterhaftung nach § 7 StVG, die nur den Versicherer trifft."],"richtig":[0],"erkl":"In der Kfz-Pflichtversicherung hat der Geschädigte einen Direktanspruch gegen den Versicherer; Versicherer und Schädiger haften als Gesamtschuldner.","norm":"§ 115 Abs. 1 Nr. 1 VVG","id":"1.1-1-1"},{"typ":"mc","frage":"Wie haftet der Halter eines Kraftfahrzeugs nach § 7 StVG?","optionen":["Nur bei Verschulden, das der Geschädigte ihm nachweisen muss.","Ohne Verschulden aus der Betriebsgefahr; nicht bei höherer Gewalt.","Für vermutetes Verschulden, von dem er sich entlasten kann.","Nur dann, wenn er das Fahrzeug beim Unfall selbst gefahren hat."],"richtig":[1],"erkl":"Die Halterhaftung ist eine Gefährdungshaftung: Sie knüpft an die Betriebsgefahr an und entfällt nur bei höherer Gewalt. Der Fahrer haftet dagegen nach § 18 StVG für vermutetes Verschulden.","norm":"§ 7 Abs. 1 und 2 StVG, § 18 StVG","id":"1.1-1-2"},{"typ":"zuo","frage":"Ordnen Sie jeder Leistungsart der Kfz-Haftpflicht ein passendes Beispiel zu.","paare":[["Personenschaden","Schmerzensgeld einer verletzten Radfahrerin"],["Sachschaden","Reparatur eines umgefahrenen Gartenzauns"],["Sachfolgeschaden","Nutzungsausfall für den beschädigten Pkw"],["Abwehrschutz","Zurückweisen einer überhöhten Forderung"]],"erkl":"Die Kfz-Haftpflicht der Proximus stellt von Personen-, Sach- und Vermögensschäden frei, leistet bei begründeten Ansprüchen Schadenersatz in Geld und wehrt unbegründete Ansprüche auf eigene Kosten ab (passiver Rechtsschutz).","norm":"Proximus 5, AKB 2021 A.1.1.1–A.1.1.3; §§ 249, 253 BGB","id":"1.1-1-3"},{"typ":"wf","frage":"Welche Aussagen zu den Leistungen an den Geschädigten treffen zu?","aussagen":[["Der Versicherer ersetzt dem Geschädigten auch eine merkantile Wertminderung seines Fahrzeugs.",true],["Kosten eines Sachverständigengutachtens werden bei einem nicht nur geringfügigen Schaden ersetzt.",true],["Schmerzensgeld zahlt die Kfz-Haftpflicht nicht; dafür ist allein die Unfallversicherung zuständig.",false],["Der Schaden am eigenen, versicherten Fahrzeug wird über die eigene Kfz-Haftpflicht ersetzt.",false],["Unberechtigte Ansprüche wehrt der Versicherer auf eigene Kosten ab.",true]],"erkl":"Ersetzt wird der Schaden des Dritten nach § 249 BGB einschließlich Wertminderung, Gutachterkosten und Schmerzensgeld. Schäden am versicherten Fahrzeug selbst sind in der Kfz-Haftpflicht ausgeschlossen (AKB 2021 A.1.5.3); dafür gibt es die Kasko.","norm":"§§ 249, 253 Abs. 2 BGB; § 11 StVG; Proximus 5, AKB 2021 A.1.1.3, A.1.5.3","id":"1.1-1-4"},{"typ":"mc","frage":"Welche Mindestversicherungssumme schreibt das Pflichtversicherungsgesetz für Personenschäden je Schadenfall vor?","optionen":["1,22 Mio. Euro","2,5 Mio. Euro","7,5 Mio. Euro","5,0 Mio. Euro"],"richtig":[2],"erkl":"Nach der Anlage zum PflVG beträgt die Mindestversicherungssumme für Personenschäden 7,5 Mio. Euro. Die vereinbarten, meist deutlich höheren Summen stehen im Versicherungsschein (AKB 2021 A.1.3.1).","norm":"§ 4 Abs. 2 PflVG mit Anlage; Proximus 5, AKB 2021 A.1.3.1","id":"1.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Jonas Pietsch, Kunde der Proximus Versicherung AG, biegt in Halle-Neustadt links ab und stößt mit dem Pkw von Frau Melanie Krüger zusammen. Frau Krüger war deutlich zu schnell; die Haftung wird mit 75 % (Pietsch) zu 25 % (Krüger) bewertet. Frau Krüger meldet sich direkt bei Ihnen in der Schadenabteilung: Reparaturkosten 5.200 €, merkantile Wertminderung 400 €, Gutachterkosten 600 €, Nutzungsausfall 5 Tage zu je 59 € und eine Kostenpauschale von 25 €. Außerdem erlitt sie ein leichtes Schleudertrauma.","items":[{"typ":"mc","frage":"Frau Krüger fragt, warum ihr nicht der volle Schaden ersetzt wird. Welche Begründung ist richtig?","optionen":["Weil die Proximus bei jedem Unfall pauschal ein Viertel als Selbstbeteiligung abzieht.","Weil Frau Krüger nur Ansprüche gegen Herrn Pietsch persönlich, nicht gegen die Proximus hat.","Weil Wertminderung und Gutachterkosten über die Kfz-Haftpflicht nie ersetzt werden.","Weil sie sich die Betriebsgefahr ihres Pkw und ihr Mitverschulden anrechnen lassen muss."],"richtig":[3],"erkl":"Sind mehrere Kfz beteiligt, wird nach Verursachung und Verschulden abgewogen; Frau Krüger trägt 25 % ihres Schadens selbst.","norm":"§ 17 Abs. 1 und 2 StVG, § 254 BGB","id":"1.1-2-1"},{"typ":"zahl","frage":"Berechnen Sie den Betrag, den die Proximus Frau Krüger für den Sachschaden einschließlich Nebenkosten erstattet.","wert":4890,"einheit":"€","tol":0.5,"erkl":"Schaden: 5.200 + 400 + 600 + 5 × 59 (= 295) + 25 = 6.520 €. Haftungsquote 75 %: 6.520 × 0,75 = 4.890 €.","norm":"§ 115 VVG; § 17 StVG; § 249 BGB; Proximus 5, AKB 2021 A.1.1.2","id":"1.1-2-2"},{"typ":"mc","frage":"Frau Krüger verlangt außerdem Schmerzensgeld. Auf welcher Grundlage prüfen Sie den Anspruch?","optionen":["§ 253 Abs. 2 BGB und § 11 StVG: Schmerzensgeld bei Körperverletzung, auch aus Gefährdungshaftung.","§ 7 StVG allein: Schmerzensgeld gibt es nur, wenn der Halter grob fahrlässig gehandelt hat.","§ 115 VVG: Schmerzensgeld zahlt der Versicherer nur bei Verletzungen über zehn Tage.","§ 86 VVG: Schmerzensgeld geht zunächst auf die Krankenkasse über und entfällt dann."],"richtig":[0],"erkl":"Schmerzensgeld ist auch bei Gefährdungshaftung geschuldet; die Mithaftung von 25 % mindert auch diesen Anspruch.","norm":"§ 253 Abs. 2 BGB, § 11 StVG","id":"1.1-2-3"}]}]},{"nr":"1.2","titel":"Leistungsfreiheit im Innenverhältnis, Regress und Schadenfreiheitsrabatt","lf":"LF 6","buch":"PV2 8.3.1–8.3.4 S. 521–528 · Lösungen S. 743","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was bedeutet „Leistungsfreiheit im Innenverhältnis“ in der Kfz-Haftpflichtversicherung?","optionen":["Der Versicherer zahlt dem Geschädigten erst, wenn der VN den Schaden selbst beglichen hat.","Der Versicherer zahlt an den Geschädigten, nimmt aber den VN oder Fahrer in Regress.","Der Versicherer zahlt nur den Personenschaden, den Sachschaden trägt der VN allein.","Der Versicherer kündigt den Vertrag und der Geschädigte wendet sich an die Polizei."],"richtig":[1],"erkl":"Zum Schutz der Verkehrsopfer bleibt der Versicherer gegenüber dem Dritten leistungspflichtig; was er zahlt, holt er sich im Innenverhältnis vom VN oder Fahrer zurück – in der Kfz-Haftpflicht begrenzt auf die Beträge nach AKB 2021 D.5.3 und E.7.3 bis E.7.4.","norm":"§§ 116, 117 Abs. 1 VVG; Proximus 5, AKB 2021 D.5.3, E.7.3","id":"1.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zu Obliegenheiten vor dem Versicherungsfall treffen zu?","aussagen":[["Der Fahrer darf nicht fahren, wenn er wegen Alkohol oder anderer berauschender Mittel nicht sicher fahren kann.",true],["Das Fahrzeug darf nur von einem Fahrer mit der erforderlichen Fahrerlaubnis benutzt werden.",true],["Das unerlaubte Entfernen vom Unfallort ist eine Obliegenheit vor dem Versicherungsfall.",false],["Bei einer leicht fahrlässigen Verletzung bleibt der Versicherer voll leistungspflichtig.",true],["Bei grober Fahrlässigkeit ist der Versicherer stets vollständig leistungsfrei.",false]],"erkl":"Trunkenheits- und Führerscheinklausel sind Pflichten beim Gebrauch des Fahrzeugs (AKB 2021 D.1.3, D.2.1), die Fahrerflucht verletzt die Aufklärungspflicht im Schadenfall (E.1.3). Bei grober Fahrlässigkeit kürzt die Proximus nach der Schwere des Verschuldens, bei leichter Fahrlässigkeit bleibt der Schutz bestehen (D.5.1).","norm":"Proximus 5, AKB 2021 D.1.3, D.2.1, D.5.1, E.1.3; § 28 Abs. 2 VVG","id":"1.2-1-2"},{"typ":"zahl","frage":"Ein Kunde ist in der Kfz-Haftpflicht für seinen Pkw in SF 6 eingestuft; der Grundbeitrag (100 %) beträgt 640 €. Er verursacht einen Haftpflichtschaden, für den die Proximus 220 € zahlt. Beitragssätze laut Anhang 1 der AKB 2021 (Pkw, Kfz-Haftpflicht): SF 1 = 52 %, SF 2 = 49 %, SF 3 = 46 %, SF 7 = 37 %, SF 8 = 36 %, SF 9 = 34 %; SF 6 fällt nach einem Schaden auf SF 1. Berechnen Sie den Mehrbeitrag der ersten drei Jahre nach der Rückstufung (Grundbeitrag unverändert, keine weiteren Schäden).","wert":256,"einheit":"€","tol":0.5,"erkl":"Ohne Schaden: SF 7, 8, 9 = 37 + 36 + 34 = 107 %. Mit Rückstufung: SF 1, 2, 3 = 52 + 49 + 46 = 147 %. Mehrbeitrag: 40 % × 640 € = 256 € – schon in drei Jahren mehr als der Schaden von 220 €. Erstattet der Kunde die 220 € innerhalb von sechs Monaten nach der Mitteilung der Proximus, gilt der Vertrag als schadenfrei.","norm":"Proximus 5, AKB 2021 I.3.5, I.5.1; Anhang 1 Ziff. 1.1 und 1.2","id":"1.2-1-3"},{"typ":"mc","frage":"Bis zu welchem Betrag darf die Proximus den VN wegen einer Obliegenheitsverletzung vor dem Versicherungsfall (z. B. Trunkenheitsfahrt) höchstens in Regress nehmen?","optionen":["2.500 Euro","10.000 Euro","5.000 Euro","in voller Schadenhöhe"],"richtig":[2],"erkl":"Die Leistungsfreiheit gegenüber dem VN und den mitversicherten Personen ist bei Verletzung der Pflichten beim Gebrauch des Fahrzeugs auf höchstens je 5.000 Euro beschränkt.","norm":"Proximus 5, AKB 2021 D.5.3; § 5 Abs. 3 KfzPflVV","id":"1.2-1-4"},{"typ":"zuo","frage":"Ordnen Sie jedem Fall die Regressgrenze gegenüber dem VN zu.","paare":[["Trunkenheitsfahrt","höchstens 5.000 €"],["Grob fahrlässig verspätete Schadenmeldung","höchstens 2.500 €"],["Trunkenheitsfahrt und anschließende vorsätzliche Fahrerflucht","höchstens 10.000 €"],["Leicht fahrlässig verspätete Schadenmeldung","kein Regress"]],"erkl":"Für Pflichten beim Gebrauch des Fahrzeugs gilt die Grenze von 5.000 € (D.5.3), für Pflichten im Schadenfall 2.500 € (E.7.3) bzw. 5.000 € bei vorsätzlich besonders schwerwiegender Verletzung wie Fahrerflucht (E.7.4); beide Grenzen können zusammentreffen. Bei leichter Fahrlässigkeit bleibt der Versicherer voll leistungspflichtig (E.7.1).","norm":"Proximus 5, AKB 2021 D.5.3, E.7.1, E.7.3, E.7.4; §§ 5, 6 KfzPflVV","id":"1.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Kevin Bräuer, Kunde der Proximus Versicherung AG, fährt nach einer Feier mit 1,3 Promille durch Halle (Saale). Er beschädigt ein geparktes Auto und eine Ampelanlage; der Fremdschaden beträgt insgesamt 12.600 €. Danach entfernt er sich vorsätzlich vom Unfallort. Die Polizei ermittelt ihn am nächsten Morgen. Die Proximus reguliert die Fremdschäden und prüft den Regress.","items":[{"typ":"mc","frage":"Der Halter des geparkten Autos fragt, ob er wegen der Trunkenheit des Fahrers leer ausgeht. Was antworten Sie?","optionen":["Ja, weil der Versicherer bei Trunkenheit gegenüber jedermann leistungsfrei ist.","Nein, aber er muss sich zuerst erfolglos an Herrn Bräuer persönlich wenden.","Nein, die Verkehrsopferhilfe zahlt, weil die Proximus ganz leistungsfrei ist.","Nein, die Proximus bleibt ihm gegenüber zur Leistung verpflichtet (§ 117 VVG)."],"richtig":[3],"erkl":"Die Leistungsfreiheit wirkt nur im Innenverhältnis; gegenüber dem Geschädigten bleibt der Versicherer zur Leistung verpflichtet.","norm":"§ 117 Abs. 1 VVG, § 115 VVG; Proximus 5, AKB 2021 D.5.3","id":"1.2-2-1"},{"typ":"zahl","frage":"Wegen absoluter Fahruntüchtigkeit kürzt die Proximus im Innenverhältnis auf null; die Fahrerflucht wertet sie als vorsätzlich besonders schwerwiegende Verletzung. Berechnen Sie den höchstmöglichen Regress gegen Herrn Bräuer.","wert":10000,"einheit":"€","tol":0.5,"erkl":"Trunkenheit (Pflicht beim Gebrauch des Fahrzeugs): höchstens 5.000 € (D.5.3). Fahrerflucht (Pflicht im Schadenfall, vorsätzlich besonders schwerwiegend): höchstens 5.000 € (E.7.4). Zusammen 10.000 €; das liegt unter dem gezahlten Schaden von 12.600 €.","norm":"Proximus 5, AKB 2021 D.5.3, E.7.4; § 5 Abs. 3, § 6 Abs. 1 und 3 KfzPflVV; § 116 VVG","id":"1.2-2-2"},{"typ":"mc","frage":"Welche Folge hat der Unfall für die Beitragseinstufung von Herrn Bräuer, wenn er den Schaden nicht zurückkauft?","optionen":["Er wird im Folgejahr nach der Rückstufungstabelle in eine schlechtere SF-Klasse eingestuft.","Seine SF-Klasse bleibt unverändert, weil er im Innenverhältnis Regress leisten musste.","Er verliert alle schadenfreien Jahre und bleibt dauerhaft in der SF-Klasse 0.","Er wird nur in der Kasko zurückgestuft, die Kfz-Haftpflicht bleibt davon unberührt."],"richtig":[0],"erkl":"Jeder gemeldete Haftpflichtschaden, für den die Proximus zahlt, führt zum 1. Januar zur Rückstufung nach der Tabelle in Anhang 1; der Regress ist keine freiwillige Erstattung und ändert daran nichts.","norm":"Proximus 5, AKB 2021 I.3.5, I.4.2.1, I.5.1; Anhang 1 Ziff. 1.2","id":"1.2-2-3"}]}]}],"lf":"LF 6"},{"nr":"2","titel":"Kaskoversicherung","abschnitte":[{"nr":"2.1","titel":"Teilkasko","lf":"LF 6","buch":"PV2 8.3.5 S. 529–552 · Lösungen S. 743–747","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Ereignis die versicherte Gefahr der Teilkasko zu.","paare":[["Ein Hagelschauer verursacht Dellen im Dach.","Sturm, Hagel, Blitzschlag, Überschwemmung"],["Ein Steinschlag lässt die Windschutzscheibe springen.","Glasbruch"],["Auf der B 100 läuft ein Reh vor das fahrende Auto.","Zusammenstoß mit Tieren"],["Ein Kurzschluss schmort Kabel im Motorraum durch.","Kurzschlussschaden an der Verkabelung"],["Das Fahrzeug wird nachts vom Parkplatz gestohlen.","Entwendung"]],"erkl":"Die Teilkasko deckt einen festen Katalog von Gefahren; ein Unfall gehört nicht dazu. Bei der Proximus ist der Zusammenstoß des fahrenden Fahrzeugs mit Tieren aller Art versichert.","norm":"Proximus 5, AKB 2021 A.2.2.2–A.2.2.6","id":"2.1-1-1"},{"typ":"mc","frage":"Welcher Schaden ist bereits über die Teilkasko versichert?","optionen":["Ein Unbekannter zerkratzt nachts den Lack des geparkten Fahrzeugs.","Ein Kurzschluss löst einen Brand aus, der den Motorraum zerstört.","Der Fahrer rutscht auf Glatteis in den Graben und beschädigt die Front.","Beim Rangieren touchiert der Fahrer einen Poller auf dem Parkplatz."],"richtig":[1],"erkl":"Brand ist eine Teilkaskogefahr. Mut- oder böswillige Handlungen und Unfälle sind erst über die Vollkasko versichert.","norm":"Proximus 5, AKB 2021 A.2.2.1, A.2.3.2, A.2.3.3","id":"2.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Teilkasko der Proximus treffen zu?","aussagen":[["Ein Zusammenstoß des fahrenden Fahrzeugs mit einem Hund ist in der Teilkasko versichert.",true],["Ein Teilkaskoschaden führt nicht zur Rückstufung, weil es dort keinen Schadenfreiheitsrabatt gibt.",true],["Sturmschäden sind versichert, wenn der Wind mindestens Windstärke 8 erreicht.",true],["Eine vereinbarte Selbstbeteiligung wird auch in der Teilkasko je Schadenfall abgezogen.",true],["Ein reiner Brems- oder Betriebsschaden ist ein Teilkaskoschaden.",false]],"erkl":"Die Proximus versichert den Zusammenstoß mit Tieren aller Art. Die Teilkasko kennt keine SF-Klassen; die Selbstbeteiligung gilt je Schadenereignis (bei einer reinen Glasreparatur ohne Scheibentausch verzichtet die Proximus darauf). Brems- und Betriebsschäden sind keine Teilkaskogefahr.","norm":"Proximus 5, AKB 2021 A.2.2.3, A.2.2.4, A.2.2.5, A.2.12, I.1","id":"2.1-1-3"},{"typ":"mc","frage":"Welche Tierzusammenstöße sind in der Teilkasko der Proximus versichert?","optionen":["Nur Zusammenstöße mit Haarwild, also etwa mit Reh, Wildschwein oder Fuchs.","Nur Tiere, die in einem Wildgehege oder in einem Zoo gehalten werden.","Zusammenstöße des fahrenden Fahrzeugs mit Tieren aller Art, auch Hund oder Kuh.","Nur Großwild ab etwa 50 kg wie Hirsch, Elch oder Wildschwein."],"richtig":[2],"erkl":"Die Proximus versichert den Zusammenstoß des in Fahrt befindlichen Fahrzeugs mit Tieren aller Art – nicht nur mit Haarwild im Sinne des Bundesjagdgesetzes.","norm":"Proximus 5, AKB 2021 A.2.2.4","id":"2.1-1-4"},{"typ":"zahl","frage":"Ein Steinschlag beschädigt die Windschutzscheibe; sie muss ausgetauscht werden. Der Austausch kostet 1.150 €, in der Teilkasko ist eine Selbstbeteiligung von 150 € vereinbart. Wie hoch ist die Entschädigung?","wert":1000,"einheit":"€","tol":0.5,"erkl":"Glasbruch ist Teilkaskogefahr. Weil die Scheibe ausgetauscht und nicht nur repariert wird, gilt die Selbstbeteiligung: 1.150 € − 150 € = 1.000 €.","norm":"Proximus 5, AKB 2021 A.2.2.5, A.2.12","id":"2.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Sandra Heinicke aus Halle (Saale) hat bei der Proximus eine Teilkasko mit 150 € Selbstbeteiligung, aber keine Vollkasko. Bei einem Unwetter beschädigt Hagel Dach und Motorhaube; ein Gutachter schätzt die Reparatur auf 2.300 € netto. Auf der Heimfahrt am selben Abend weicht sie einem Reh aus, das plötzlich auf die Fahrbahn springt. Sie kommt von der Straße ab und prallt gegen einen Baum; das Reh berührt sie nicht.","items":[{"typ":"mc","frage":"Wie prüfen Sie den Schaden durch den Aufprall auf den Baum?","optionen":["Nicht versichert, weil die Teilkasko nur Schäden mit direktem Tierkontakt ersetzt.","Voll versichert als Zusammenstoß mit einem Tier, weil das Reh den Unfall auslöste.","Nur versichert, wenn Frau Heinicke ein Foto des Rehs auf der Fahrbahn vorlegt.","Als Rettungskosten, wenn das Ausweichen zur Abwehr eines Wildunfalls geboten war."],"richtig":[3],"erkl":"Ohne Berührung liegt kein Zusammenstoß mit einem Tier vor. Aufwendungen zur Abwendung eines versicherten Schadens ersetzt der Versicherer aber als Rettungskosten, wenn die Person sie für geboten halten durfte.","norm":"§§ 83, 90 VVG; Proximus 5, AKB 2021 A.2.2.4","id":"2.1-2-1"},{"typ":"mc","frage":"Frau Heinicke fragt, ob sie den Hagelschaden reparieren lassen muss. Was antworten Sie?","optionen":["Nein, sie kann nach Gutachten abrechnen, erhält dann aber keine Umsatzsteuer.","Ja, ohne Reparaturrechnung einer Fachwerkstatt leistet die Proximus nicht.","Nein, sie erhält dann aber nur die Hälfte des im Gutachten genannten Betrags.","Ja, sonst wird der Betrag als Wertminderung behandelt und nicht ersetzt."],"richtig":[0],"erkl":"Ohne Reparatur zahlt die Proximus die erforderlichen Reparaturkosten bis zum Wiederbeschaffungswert abzüglich Restwert; Mehrwertsteuer ersetzt sie nur, wenn sie tatsächlich angefallen ist.","norm":"Proximus 5, AKB 2021 A.2.7.1, A.2.9","id":"2.1-2-2"},{"typ":"wf","frage":"Welche Aussagen zum Fall von Frau Heinicke treffen zu?","aussagen":[["Den Hagelschaden reguliert die Proximus abzüglich 150 € Selbstbeteiligung.",true],["Weil sie keine Vollkasko hat, ist der Schaden am Baum in keinem Fall versichert.",false],["Wäre sie einem Hasen ausgewichen, wäre das Manöver in der Regel nicht geboten gewesen.",true],["Sie muss den Vorfall nicht melden, weil kein Tierkontakt bestand.",false]],"erkl":"Der Hagelschaden ist Teilkaskogefahr. Beim Ausweichen kommt Rettungskostenersatz in Betracht; bei Kleintieren ist ein riskantes Ausweichen nach der Rechtsprechung meist nicht geboten. Jedes Schadenereignis ist der Proximus innerhalb einer Woche anzuzeigen.","norm":"§§ 83, 90 VVG; Proximus 5, AKB 2021 A.2.2.3, A.2.12, E.1.1","id":"2.1-2-3"}]}]},{"nr":"2.2","titel":"Vollkasko und Leistung bei Beschädigung","lf":"LF 6","buch":"PV2 8.3.5 S. 529–552 · Lösungen S. 743–747","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Was ist in der Vollkasko ein „Unfall“?","optionen":["Jeder Schaden am Fahrzeug, gleich ob durch Verschleiß, Bedienfehler oder Bruch.","Ein unmittelbar von außen plötzlich mit mechanischer Gewalt einwirkendes Ereignis.","Nur ein Zusammenstoß mit einem anderen Kraftfahrzeug im öffentlichen Verkehr.","Ein Ereignis, das der Fahrer nicht verschuldet hat und das die Polizei erfasst hat."],"richtig":[1],"erkl":"Die AKB 2021 definieren den Unfall als plötzliches, von außen mit mechanischer Gewalt einwirkendes Ereignis; Brems-, Betriebs- und reine Bruchschäden zählen nicht dazu.","norm":"Proximus 5, AKB 2021 A.2.3.2","id":"2.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Vollkasko treffen zu?","aussagen":[["Vandalismus durch unbekannte Dritte ist als mut- oder böswillige Handlung versichert.",true],["Ein reiner Bremsschaden durch Überhitzung ist ein Unfallschaden.",false],["Die Vollkasko umfasst auch die Gefahren der Teilkasko.",true],["Ein selbst verschuldeter Unfall ist in der Vollkasko nicht versichert.",false],["Ein Vollkaskoschaden führt in der Regel zur Rückstufung in der Vollkasko.",true]],"erkl":"Die Vollkasko ergänzt die Teilkasko um Unfall und mut- oder böswillige Handlungen Unberechtigter – auch bei eigenem Verschulden. Ausgeschlossen ist Vorsatz; auf den Einwand grober Fahrlässigkeit verzichtet die Proximus außer bei ermöglichter Entwendung und bei Alkohol oder Drogen.","norm":"Proximus 5, AKB 2021 A.2.3.1–A.2.3.3, A.2.16.1, I.3.5","id":"2.2-1-2"},{"typ":"zahl","frage":"Ein Kunde lässt seinen Vollkaskoschaden nicht reparieren und rechnet nach Gutachten ab: Reparaturkosten 4.760 € brutto (davon 760 € Umsatzsteuer), Wiederbeschaffungswert 14.000 €, Restwert 6.000 €, Selbstbeteiligung 500 €. Wie hoch ist die Entschädigung?","wert":3500,"einheit":"€","tol":0.5,"erkl":"Grenze ohne Reparatur: 14.000 − 6.000 = 8.000 € – sie wird nicht erreicht. Umsatzsteuer fällt nicht an: 4.760 − 760 = 4.000 €. Abzüglich SB: 4.000 − 500 = 3.500 €.","norm":"Proximus 5, AKB 2021 A.2.7.1, A.2.9, A.2.12","id":"2.2-1-3"},{"typ":"mc","frage":"Welche Position ersetzt die Vollkasko bei einer Reparatur nicht?","optionen":["Die erforderlichen Lohnkosten der Werkstatt für die Instandsetzung.","Die Ersatzteilkosten, die für die Reparatur des Schadens nötig sind.","Die merkantile Wertminderung des Fahrzeugs nach der Reparatur.","Die Umsatzsteuer, wenn sie bei der Reparatur tatsächlich anfällt."],"richtig":[2],"erkl":"Die Kasko ersetzt die erforderlichen Reparaturkosten; eine Wertminderung ersetzt sie nicht – anders als die gegnerische Kfz-Haftpflicht.","norm":"Proximus 5, AKB 2021 A.2.7.1, A.2.13.1","id":"2.2-1-4"},{"typ":"zuo","frage":"Wer zahlt den Schaden? Ordnen Sie zu.","paare":[["Schaden am eigenen Pkw nach selbst verschuldetem Unfall","eigene Vollkasko"],["Schaden am Pkw des Unfallgegners, den der VN verursacht hat","Kfz-Haftpflicht des VN"],["Schaden am eigenen Pkw, den allein der Unfallgegner verschuldet hat","Kfz-Haftpflicht des Unfallgegners"],["Schaden am eigenen Pkw durch Zusammenstoß mit einem Reh","eigene Teilkasko"]],"erkl":"Fremdschäden trägt die Haftpflicht des Verursachers, Eigenschäden die Kasko; der Zusammenstoß mit Tieren gehört zur Teilkasko.","norm":"§ 115 VVG; Proximus 5, AKB 2021 A.1.1.1, A.1.5.3, A.2.2.4, A.2.3.2","id":"2.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Herr Tobias Wendt hat bei der Proximus eine Vollkasko mit 300 € und eine Teilkasko mit 150 € Selbstbeteiligung. Sein Pkw parkt über Nacht vor seiner Wohnung in Halle (Saale). Am Morgen sind der Außenspiegel abgetreten und die Motorhaube zerkratzt. Herr Wendt erstattet Anzeige bei der Polizei und lässt den Schaden reparieren: Rechnung 3.180 € brutto. Ein Gutachter bescheinigt eine merkantile Wertminderung von 400 €.","items":[{"typ":"mc","frage":"Über welchen Vertragsteil regulieren Sie den Schaden?","optionen":["Über die Teilkasko, weil Vandalismus als versuchte Entwendung gilt.","Über die Kfz-Haftpflicht, weil ein Dritter den Schaden verursacht hat.","Gar nicht, weil Schäden durch unbekannte Täter nicht versichert sind.","Über die Vollkasko als mut- oder böswillige Handlung Betriebsfremder."],"richtig":[3],"erkl":"Mut- oder böswillige Handlungen Unberechtigter sind in der Vollkasko versichert; die eigene Kfz-Haftpflicht deckt nie Schäden am versicherten Fahrzeug.","norm":"Proximus 5, AKB 2021 A.1.5.3, A.2.3.3","id":"2.2-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für Herrn Wendt.","wert":2880,"einheit":"€","tol":0.5,"erkl":"Reparaturkosten 3.180 € (Umsatzsteuer ist angefallen, Rechnung liegt vor). Die Wertminderung wird nicht ersetzt. 3.180 − 300 € SB Vollkasko = 2.880 €.","norm":"Proximus 5, AKB 2021 A.2.7.1, A.2.12, A.2.13.1","id":"2.2-2-2"},{"typ":"mc","frage":"Herr Wendt fragt, welche Folge die Regulierung für seinen Vertrag hat. Was antworten Sie?","optionen":["Die Vollkasko wird zurückgestuft; die SF-Klasse der Kfz-Haftpflicht bleibt unverändert.","Beide SF-Klassen werden zurückgestuft, weil die Proximus Kasko und Haftpflicht verbindet.","Es gibt keine Rückstufung, weil Vandalismus über die Teilkasko abgerechnet wird.","Nur die Kfz-Haftpflicht wird zurückgestuft, weil ein Dritter beteiligt war."],"richtig":[0],"erkl":"Kfz-Haftpflicht und Vollkasko sind rechtlich selbstständige Verträge mit getrennten SF-Klassen; zurückgestuft wird nur der Vertragsteil, der geleistet hat (Tabelle 1.3 in Anhang 1).","norm":"Proximus 5, AKB 2021 I.1, I.3.5; Anhang 1 Ziff. 1.3","id":"2.2-2-3"}]}]},{"nr":"2.3","titel":"Totalschaden, Diebstahl und vorübergehende Stilllegung","lf":"LF 6","buch":"PV2 8.3.5 S. 529–552 · Lösungen S. 743–747","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann liegt in der Kasko ein (wirtschaftlicher) Totalschaden vor?","optionen":["Wenn das Fahrzeug älter als zehn Jahre ist und die Reparatur 2.000 € übersteigt.","Wenn die erforderlichen Reparaturkosten den Wiederbeschaffungswert übersteigen.","Wenn der Restwert des Fahrzeugs höher ist als sein Wiederbeschaffungswert.","Wenn der Kunde erklärt, dass er das Fahrzeug nicht reparieren lassen möchte."],"richtig":[1],"erkl":"Übersteigen die Reparaturkosten den Wiederbeschaffungswert, ist eine Reparatur wirtschaftlich nicht sinnvoll; abgerechnet wird dann wie bei Zerstörung.","norm":"Proximus 5, AKB 2021 A.2.6.1, A.2.6.4","id":"2.3-1-1"},{"typ":"zahl","frage":"Bei einem Vollkaskoschaden liegt ein Totalschaden vor: Wiederbeschaffungswert 18.500 €, Restwert 4.200 €, Selbstbeteiligung 500 €. Wie hoch ist die Entschädigung?","wert":13800,"einheit":"€","tol":0.5,"erkl":"Wiederbeschaffungswert − Restwert − Selbstbeteiligung: 18.500 − 4.200 − 500 = 13.800 €.","norm":"Proximus 5, AKB 2021 A.2.6.1, A.2.12","id":"2.3-1-2"},{"typ":"mc","frage":"Was regelt die Neupreisentschädigung in den AKB 2021 der Proximus?","optionen":["Der Kunde erhält bei jeder Reparatur Neuteile ohne Abzug neu für alt.","Der Versicherer zahlt den Neupreis, wenn das Fahrzeug älter als fünf Jahre ist.","Bei Totalschaden oder Verlust kurz nach Erstzulassung wird der Neupreis ersetzt.","Der Kunde erhält bei einem Diebstahl einen Neuwagen statt einer Geldleistung."],"richtig":[2],"erkl":"Bei Pkw zahlt die Proximus den Neupreis (abzüglich Restwert), wenn innerhalb von 12 Monaten nach Erstzulassung ein Totalschaden, eine Zerstörung oder ein Verlust eintritt; bei Beschädigung innerhalb von 18 Monaten, wenn die Reparatur mindestens 80 % des Neupreises kostet. Voraussetzung: Der Ersterwerber ist noch Eigentümer.","norm":"Proximus 5, AKB 2021 A.2.6.2, A.2.6.3, A.2.6.7","id":"2.3-1-3"},{"typ":"wf","frage":"Welche Aussagen zu Diebstahl und Außerbetriebsetzung treffen zu?","aussagen":[["Wird ein gestohlenes Fahrzeug innerhalb eines Monats nach Eingang der Schadenanzeige wiedergefunden, muss der VN es zurücknehmen.",true],["Lässt der VN den Schlüssel im unverschlossenen Fahrzeug stecken, kann der Versicherer wegen grober Fahrlässigkeit kürzen.",true],["Bei vorübergehender Außerbetriebsetzung endet der Kfz-Vertrag sofort und muss neu abgeschlossen werden.",false],["Während der Ruheversicherung darf das Fahrzeug auf einer öffentlichen Straße abgestellt werden.",false],["Während der Ruheversicherung muss das Fahrzeug in einem Einstellraum oder auf einem umfriedeten Abstellplatz stehen.",true]],"erkl":"Die Monatsfrist schützt den Versicherer vor vorschneller Zahlung. Auf den Einwand grober Fahrlässigkeit verzichtet die Proximus nicht, wenn die Entwendung grob fahrlässig ermöglicht wurde. Bei Außerbetriebsetzung läuft eine prämienfreie Ruheversicherung mit Abstellpflicht.","norm":"Proximus 5, AKB 2021 A.2.10.1, A.2.16.1, H.1.1, H.1.2, H.1.5; § 81 Abs. 2 VVG","id":"2.3-1-4"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Bedeutung zu.","paare":[["Wiederbeschaffungswert","Preis eines gleichwertigen Gebrauchtfahrzeugs am Schadentag"],["Restwert","Erlös für das beschädigte Fahrzeug im unreparierten Zustand"],["Zerstörung","Fahrzeug ist technisch nicht mehr zu reparieren"],["Verlust","Fahrzeug ist z. B. durch Diebstahl dauerhaft abhandengekommen"]],"erkl":"Bei Totalschaden, Zerstörung und Verlust zahlt die Kasko den Wiederbeschaffungswert abzüglich Restwert und Selbstbeteiligung.","norm":"Proximus 5, AKB 2021 A.2.6.1, A.2.6.5, A.2.6.6, A.2.12","id":"2.3-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Lea Domröse aus Halle (Saale) hat bei der Proximus eine Vollkasko mit 500 € und eine Teilkasko mit 150 € Selbstbeteiligung. Am 3. März meldet sie schriftlich, dass ihr Pkw nachts vor dem Haus gestohlen wurde; die Anzeige bei der Polizei liegt vor. Der Wiederbeschaffungswert beträgt 22.000 €. Außerdem möchte sie ihr Cabrio, das ebenfalls bei der Proximus versichert ist, über den Winter vorübergehend abmelden.","items":[{"typ":"mc","frage":"Frau Domröse fragt, wann sie ihr Geld bekommt, falls der Pkw nicht wieder auftaucht. Was antworten Sie?","optionen":["Sofort nach Eingang der Diebstahlanzeige bei der Polizei.","Erst nach Ablauf eines Jahres, wenn das Verfahren eingestellt ist.","Nach drei Monaten, wenn die Polizei die Fahndung beendet hat.","Nach Ablauf eines Monats nach Eingang der Schadenanzeige."],"richtig":[3],"erkl":"Bei Entwendung zahlt die Proximus frühestens nach Ablauf eines Monats nach Eingang der Schadenanzeige in Textform, weil zunächst abzuwarten ist, ob das Fahrzeug wieder aufgefunden wird.","norm":"Proximus 5, AKB 2021 A.2.10.1, A.2.14.3","id":"2.3-2-1"},{"typ":"zahl","frage":"Der Pkw bleibt verschwunden. Berechnen Sie die Entschädigung.","wert":21850,"einheit":"€","tol":0.5,"erkl":"Diebstahl ist Entwendung und damit Teilkaskogefahr; es gilt die SB der Teilkasko. Ein Restwert fällt nicht an: 22.000 − 150 = 21.850 €.","norm":"Proximus 5, AKB 2021 A.2.2.2, A.2.6.1, A.2.12","id":"2.3-2-2"},{"typ":"mc","frage":"Was erklären Sie Frau Domröse zur vorübergehenden Außerbetriebsetzung des Cabrios?","optionen":["Der Vertrag ruht beitragsfrei; das Cabrio muss in Garage oder umfriedet stehen.","Der Vertrag endet; bei Wiederzulassung beginnt sie wieder in der SF-Klasse 0.","Der volle Beitrag läuft weiter, weil der Versicherungsschutz unverändert bleibt.","Sie darf das Cabrio während der Ruhezeit mit roten Kennzeichen weiter fahren."],"richtig":[0],"erkl":"Bei vorübergehender Außerbetriebsetzung (ab 2 Wochen) bleibt der Vertrag bestehen und geht in eine prämienfreie Ruheversicherung mit Kfz-Haftpflicht und Teilkasko über; das Fahrzeug muss in einem Einstellraum oder auf einem umfriedeten Abstellplatz stehen und darf nicht gebraucht werden. Ohne Wiederzulassung endet der Vertrag nach 18 Monaten.","norm":"Proximus 5, AKB 2021 H.1.2, H.1.4, H.1.5, H.1.7","id":"2.3-2-3"}]}]}],"lf":"LF 6"},{"nr":"3","titel":"Reiseversicherungen","abschnitte":[{"nr":"3.1","titel":"Reiserücktritt und Reiseabbruch","lf":"LF 6","buch":"PV2 2.1–2.4 S. 44–93 · Lösungen S. 669–677","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"zuo","frage":"Ordnen Sie jedem Begriff die passende Erklärung zu.","paare":[["Stornokosten","Entgelt, das der Reiseveranstalter beim Rücktritt verlangt"],["Reiseabbruch","vorzeitige Beendigung einer angetretenen Reise"],["Selbstbehalt","Eigenanteil der versicherten Person am erstattungsfähigen Schaden"],["Risikoperson","Angehöriger, dessen schwere Erkrankung ebenfalls zum Rücktritt berechtigt"]],"erkl":"Die Reiserücktrittsversicherung ersetzt die vertraglich geschuldeten Stornokosten, die der Veranstalter nach § 651h BGB verlangen kann; der Abbruchschutz deckt Rückreisekosten und nicht genutzte Reiseleistungen. Risikopersonen sind z. B. Angehörige und Mitreisende derselben Buchung.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, 3, 7; VB-Reiseabbruch 2021 Ziff. 1; § 651h BGB","id":"3.1-1-1"},{"typ":"mc","frage":"Welches Ereignis ist in der Reiserücktrittsversicherung typischerweise versichert?","optionen":["Für den Urlaubsort wird für die Reisezeit schlechtes Wetter vorhergesagt.","Die versicherte Person erkrankt unerwartet schwer und ist nicht reisefähig.","Die versicherte Person hat Angst vor dem Fliegen und möchte nicht reisen.","Die versicherte Person möchte lieber mit Freunden an einen anderen Ort."],"richtig":[1],"erkl":"Versichert sind unerwartete Ereignisse wie schwere Erkrankung, schwere Unfallverletzung oder Tod; persönliche Unlust oder Wetter sind es nicht.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 2.1","id":"3.1-1-2"},{"typ":"wf","frage":"Welche Aussagen zur Reiserücktritts- und Reiseabbruchversicherung treffen zu?","aussagen":[["Die versicherte Person muss die Reise unverzüglich stornieren, sobald das versicherte Ereignis eintritt.",true],["Eine schon bei Buchung bekannte Erkrankung ist in der Regel kein unerwartetes Ereignis.",true],["Die Versicherung ersetzt den ganzen Reisepreis, auch wenn der Veranstalter nur 30 % Storno verlangt.",false],["Ein Reiseabbruch wegen schwerer Erkrankung eines mitreisenden Angehörigen kann versichert sein.",true],["Ein vereinbarter Selbstbehalt wird bei Krankheit nie abgezogen.",false]],"erkl":"Ersetzt werden nur die tatsächlich geschuldeten Stornokosten, abzüglich eines vereinbarten Selbstbehalts (20 %, mindestens 25 € je versicherte Person); die Pflicht zur unverzüglichen Stornierung soll die Stornokosten gering halten.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, 4.2, 5.1, 7; VB-Reiseabbruch 2021 Ziff. 2; § 82 VVG","id":"3.1-1-3"},{"typ":"mc","frage":"Warum ist die Pflicht zur unverzüglichen Stornierung so wichtig?","optionen":["Weil der Veranstalter sonst die gesamte Reise kostenlos stornieren muss.","Weil der Vertrag sonst automatisch in einen Reiseabbruchschutz wechselt.","Weil die Stornokosten meist steigen, je näher der Reisebeginn rückt.","Weil die Krankenkasse nur bei sofortiger Stornierung die Arztkosten zahlt."],"richtig":[2],"erkl":"Die Stornostaffel steigt zum Reisebeginn hin; wer zu spät storniert, vergrößert den Schaden und verletzt seine Pflicht, die Stornokosten möglichst gering zu halten.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.1; § 82 VVG","id":"3.1-1-4"},{"typ":"zahl","frage":"Ein Kunde muss eine Reise zum Preis von 2.400 € wegen schwerer Erkrankung rechtzeitig stornieren. Der Veranstalter verlangt 40 % Stornokosten, vereinbart ist der Selbstbehalt der Proximus (20 %, mindestens 25 € je versicherte Person). Wie hoch ist die Erstattung?","wert":768,"einheit":"€","tol":0.5,"erkl":"Stornokosten: 2.400 × 40 % = 960 €. Selbstbehalt: 960 × 20 % = 192 € (mehr als 25 €). Erstattung: 960 − 192 = 768 €.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 1.1, 7","id":"3.1-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Familie Ostermann aus Halle (Saale) hat eine Pauschalreise nach Mallorca für 3.200 € gebucht; Reisebeginn ist der 20. Juni. Sie hat bei der Proximus eine Reiserücktrittsversicherung mit Selbstbehalt (20 %, mindestens 25 € je versicherte Person). Am 10. Mai erkrankt Herr Ostermann schwer, der Arzt bescheinigt Reiseunfähigkeit. Die Familie wartet trotzdem ab und storniert erst am 24. Mai; die Proximus wertet das als vorsätzliche Verletzung der Pflicht zur unverzüglichen Stornierung. Laut Stornostaffel kostet ein Rücktritt bis 30 Tage vor Reisebeginn 25 %, danach 50 % des Reisepreises.","items":[{"typ":"mc","frage":"Welche Unterlage verlangen Sie zuerst, um das versicherte Ereignis zu prüfen?","optionen":["Eine Bestätigung des Arbeitgebers über die genehmigte Urlaubszeit.","Ein Schreiben des Hotels, dass das gebuchte Zimmer neu vermietet wurde.","Eine Kopie der Reisepässe aller angemeldeten Reiseteilnehmer der Familie.","Ein ärztliches Attest mit Diagnose und Bescheinigung der Reiseunfähigkeit."],"richtig":[3],"erkl":"Eine unerwartete schwere Erkrankung ist durch ein ärztliches Attest mit Diagnose und Behandlungsdaten nachzuweisen.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.3; § 31 VVG","id":"3.1-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Erstattung der Proximus.","wert":640,"einheit":"€","tol":0.5,"erkl":"Am 10. Mai (41 Tage vor Reisebeginn) hätten die Stornokosten 3.200 × 25 % = 800 € betragen. Für den Mehrbetrag durch die vorsätzlich verspätete Stornierung ist die Proximus leistungsfrei; ersetzt werden nur die 800 €. 800 € − 20 % Selbstbehalt (160 €) = 640 €.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.1, 7; AT-Reise 2021 Ziff. 9.4; § 28 Abs. 2 und 3 VVG","id":"3.1-2-2"},{"typ":"mc","frage":"Herr Ostermann ist verärgert, dass nicht die berechneten 1.600 € zugrunde gelegt werden. Wie begründen Sie das?","optionen":["Wer verspätet storniert, erhält nur die Kosten, die bei sofortiger Stornierung entstanden wären.","Die Proximus erstattet Stornokosten grundsätzlich nur bis zur Hälfte des gesamten Reisepreises.","Bei einer Erkrankung des VN selbst werden Stornokosten generell nur zu 50 % ersetzt.","Eine Pauschalreise ist nur versichert, wenn sie über die Proximus gebucht worden ist."],"richtig":[0],"erkl":"Die vorsätzlich verspätete Stornierung verletzt die Obliegenheit nach VB-Reiserücktritt 2021 Ziff. 5.1. Für den Mehrschaden von 800 € ist die Proximus leistungsfrei; für die 800 €, die auch bei sofortiger Stornierung angefallen wären, war die Verspätung nicht ursächlich.","norm":"Proximus 5, VB-Reiserücktritt 2021 Ziff. 5.1; AT-Reise 2021 Ziff. 9.4; § 28 Abs. 2 und 3 VVG","id":"3.1-2-3"}]}]},{"nr":"3.2","titel":"Reisegepäck und Auslandsreisekrankenversicherung","lf":"LF 6","buch":"PV2 2.1–2.4 S. 44–93 · Lösungen S. 669–677","lektionen":[{"typ":"wissen","titel":"Grundwissen","items":[{"typ":"mc","frage":"Wann ist Reisegepäck im sogenannten Drittgewahrsam versichert?","optionen":["Wenn der VN es am Strand kurz unbeaufsichtigt neben dem Handtuch liegen lässt.","Wenn es einem Beförderungsunternehmen oder Beherbergungsbetrieb übergeben ist.","Wenn es über Nacht in einem fremden Pkw auf einer öffentlichen Straße liegt.","Wenn ein Mitreisender es ohne Auftrag des VN an sich nimmt und verliert."],"richtig":[1],"erkl":"Gepäck im Gewahrsam eines Beförderungsunternehmens, Beherbergungsbetriebs, Gepäckträgers oder einer Gepäckaufbewahrung ist gegen Abhandenkommen, Zerstörung und Beschädigung versichert.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 2.1","id":"3.2-1-1"},{"typ":"wf","frage":"Welche Aussagen zur Reisegepäckversicherung der Proximus treffen zu?","aussagen":[["Bargeld, Fahrkarten und Wertpapiere gehören nicht zum versicherten Reisegepäck.",true],["Abhandengekommene Sachen werden zum Zeitwert entschädigt.",true],["Geschenke und Reiseandenken, die auf der Reise gekauft wurden, sind nie versichert.",false],["Schmuck und Fotoapparate ersetzt die Proximus je Versicherungsfall bis 50 % der Versicherungssumme.",true],["Einen Diebstahl muss man der Polizei nicht anzeigen, wenn der Schaden unter 500 € liegt.",false]],"erkl":"Versichert sind Sachen des persönlichen Reisebedarfs einschließlich Geschenken (bis 10 % der Versicherungssumme, höchstens 400 €); Wertsachen sind auf 50 % der Versicherungssumme begrenzt, Geld und Fahrkarten ausgeschlossen. Ersetzt wird der Zeitwert. Diebstähle sind stets unverzüglich der Polizei zu melden.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 1.2, 1.5, 4.1, 4.2, 6.1, 7.1, 8.3","id":"3.2-1-2"},{"typ":"zuo","frage":"Ordnen Sie jedem Begriff das passende Beispiel zu.","paare":[["Beförderungsunternehmen","Fluggesellschaft, bei der der Koffer aufgegeben wurde"],["Beherbergungsbetrieb","Hotel, dessen Rezeption das Gepäck verwahrt"],["Gepäckaufbewahrung","Gepäckservice mit Abholschein am Hauptbahnhof"],["PIR-Bericht","Schadenprotokoll der Fluggesellschaft über fehlendes Gepäck"]],"erkl":"Drittgewahrsam bedeutet, dass das Gepäck in der Obhut eines Dritten ist. Schäden dort müssen dem Dritten unverzüglich gemeldet und der Proximus bescheinigt werden, am Flughafen mit dem PIR-Bericht.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 2.1, 8.2","id":"3.2-1-3"},{"typ":"mc","frage":"Was sind „Ersatzkäufe“ in der Reisegepäckversicherung?","optionen":["Der Kauf eines neuen Koffers, wenn der alte Koffer nicht mehr modern ist.","Die Erstattung des Zeitwerts aller Sachen, die endgültig verloren gegangen sind.","Notwendige Käufe, wenn aufgegebenes Gepäck den Zielort nicht rechtzeitig erreicht.","Der Austausch beschädigter Sachen durch den Hersteller im Rahmen der Garantie."],"richtig":[2],"erkl":"Erreicht das Gepäck den Bestimmungsort nicht am selben Tag wie der Versicherte, ersetzt die Proximus die nachgewiesenen Ersatzkäufe bis 10 % der Versicherungssumme, höchstens 400 € je Versicherungsfall.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 2.3","id":"3.2-1-4"},{"typ":"mc","frage":"Welche Leistung erbringt die Auslandsreisekrankenversicherung der Proximus?","optionen":["Die Kosten einer geplanten Zahnbehandlung, die im Ausland günstiger ist.","Den Verdienstausfall während einer Krankheit im Urlaub im Ausland.","Die Kosten von Behandlungen, deretwegen die Reise angetreten wurde.","Den medizinisch notwendigen Krankenrücktransport an den Heimatort."],"richtig":[3],"erkl":"Die Auslandsreisekrankenversicherung (Tarif AKV) ersetzt die Behandlung akut im Ausland eingetretener Krankheiten und Unfälle und den medizinisch notwendigen Rücktransport; vor Reiseantritt geplante Behandlungen sind nicht versichert.","norm":"Proximus 5, Tarif Auslandsreisekrankenversicherung (AKV I und AKV II)","id":"3.2-1-5"}]},{"typ":"situation","titel":"Prüfungssituation","situation":"Frau Nicole Jahnke aus Halle (Saale) fliegt nach Lissabon. Bei der Proximus hat sie eine Reisegepäckversicherung mit 2.000 € Versicherungssumme; Ersatzkäufe bei verspätetem Gepäck sind bis 10 % der Versicherungssumme, höchstens 400 €, versichert. Ihr Koffer kommt nicht an. Sie lässt am Flughafen einen PIR-Bericht erstellen und kauft Kleidung und Hygieneartikel für 285 €. Nach drei Wochen gilt der Koffer als verloren. Inhalt: Kleidung, Neupreis 1.000 € (Abzug 40 % für Alter und Abnutzung), Sportschuhe mit einem Zeitwert von 90 €; der Koffer selbst hat einen Zeitwert von 100 €.","items":[{"typ":"zahl","frage":"Wie viel Euro erstattet die Proximus für die Ersatzkäufe?","wert":200,"einheit":"€","tol":0.5,"erkl":"Höchstgrenze: 10 % von 2.000 € = 200 € (unter der Kappung von 400 €). Die Belege über 285 € übersteigen die Grenze, ersetzt werden 200 €.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 2.3","id":"3.2-2-1"},{"typ":"zahl","frage":"Berechnen Sie die Entschädigung für den verlorenen Koffer mit Inhalt zum Zeitwert (ohne die Ersatzkäufe).","wert":790,"einheit":"€","tol":0.5,"erkl":"Kleidung: 1.000 − 40 % = 600 €. Dazu Sportschuhe 90 € und Koffer 100 €: 600 + 90 + 100 = 790 €; das liegt unter der Versicherungssumme von 2.000 €.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 6.1, 7.1.1","id":"3.2-2-2"},{"typ":"mc","frage":"Warum ist der PIR-Bericht für die Regulierung wichtig?","optionen":["Er belegt, dass das Gepäck im Gewahrsam der Fluggesellschaft abhandengekommen ist.","Er ersetzt die Reisegepäckversicherung, weil nun allein die Airline zahlen muss.","Er ist nur für die Steuererklärung nötig, um Ersatzkäufe abzusetzen.","Er dient der Polizei als Strafanzeige gegen unbekannte Gepäckdiebe."],"richtig":[0],"erkl":"Der PIR-Bericht weist den Schaden im Drittgewahrsam nach und erfüllt die Pflicht, den Schaden unverzüglich beim Beförderungsunternehmen zu melden und der Proximus eine Bescheinigung einzureichen.","norm":"Proximus 5, VB-Reisegepäck 2021 Ziff. 8.2; § 31 VVG","id":"3.2-2-3"}]}]}],"lf":"LF 6"}],"reset":["1.2-1-3","2.1-1-1","2.1-1-3","2.1-1-4","2.1-1-5","2.3-1-3","3.1-1-5","3.2-1-2","3.2-1-5"]};

if(Object.keys(S).length&&S._rw!==2){for(const k of (D.reset||[]))delete S[k];save()}
const heute=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
// Lerntage: Tage, an denen geübt wurde (für den Prüfungspass), höchstens die letzten 60
function lerntag(){const t=heute(),a=Array.isArray(S._tage)?S._tage.filter(x=>typeof x==='string'&&/^\d{4}-\d\d-\d\d$/.test(x)):[];if(!a.includes(t))a.push(t);a.sort();S._tage=a.slice(-60)}

$('#brand').innerHTML=D.titel+'<small>'+D.untertitel+'</small>';
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let x=0;for(const c of seed)x=(x*31+c.charCodeAt(0))>>>0;return()=>{x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x/4294967296}}
function shuf(a,seed){const r=rng(seed),b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function items(arr){return arr.reduce((s,x)=>s+x,0)}
function lekItems(l){return l.items}
function stat(list){const t=list.length;let a=0,r=0;list.forEach(q=>{const s=S[q.id];if(s){a++;if(s.ok)r++}});return{t,a,r,pR:t?Math.round(100*r/t):0,pF:t?Math.round(100*a/t):0}}
const abItems=a=>a.lektionen.flatMap(l=>l.items),modItems=m=>m.abschnitte.flatMap(abItems);
function pills(st){return `<div class="pills"><span class="pill"><span class="dot ${st.pR?'g':''}"></span>${st.pR} % Richtig</span><span class="pill"><span class="dot ${st.pF?'b':''}"></span>${st.pF} % Fortschritt</span></div>`}
function crumb(parts){return '<div class="crumb">'+parts.map(p=>p[1]?`<a data-go="${p[1]}">${esc(p[0])}</a>`:esc(p[0])).join(' › ')+'</div>'}
function home(){const all=D.module.flatMap(modItems),st=stat(all);
 app.innerHTML=`<div class="box"><h1>${esc(D.sparte)} · GAP 2 Teil 1.2</h1><p class="hint">${esc(D.intro)} Jeder Abschnitt hat eine Lektion „Grundwissen“ und eine „Prüfungssituation“. Ihr Fortschritt bleibt nur in diesem Browser gespeichert.</p><div class="bar"><i style="width:${st.pF}%"></i></div>${pills(st)}</div>
 <div class="box">${D.module.map((m,i)=>{const s=stat(modItems(m));return `<div class="card" data-go="m${i}"><div class="ic">${m.nr}</div><div><div class="ct">${m.nr}. ${esc(m.titel)}</div><div class="meta">${m.abschnitte.length} Abschnitte · ${s.t} Seiten · ${esc(m.lf)}</div>${pills(s)}</div></div>`}).join('')}
 <div class="card" data-go="sim"><div class="ic">⏱</div><div><div class="ct">Prüfungssimulation</div><div class="meta">Drei Fälle aus verschiedenen Abschnitten wie in Teil 1.2 der Prüfung, Auswertung je Themenbereich</div>${simKurz()}</div></div></div>`}
function simKurz(){const s=simStand();if(!s)return '<div class="meta" data-sim="leer">Noch keine Simulation abgeschlossen.</div>';const p=x=>Math.round(100*x.r/x.n);return `<div class="pills" data-sim="${s.beste.r}"><span class="pill"><span class="dot g"></span>Bestes Ergebnis ${s.beste.r} von ${s.beste.n} (${p(s.beste)} %)</span><span class="pill"><span class="dot b"></span>Zuletzt ${s.letzte.r} von ${s.letzte.n}</span><span class="pill">${s.anz} ${s.anz===1?'Durchgang':'Durchgänge'}</span></div>`}
function modul(i){const m=D.module[i];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel]])+`<div class="box"><h1>${m.nr}. ${esc(m.titel)}</h1>${m.abschnitte.map((a,j)=>{const s=stat(abItems(a));return `<div class="card" data-go="a${i}.${j}"><div class="ic">${a.nr}</div><div><div class="ct">${a.nr} ${esc(a.titel)}</div><div class="meta">2 Lektionen · ${s.t} Seiten · ${esc(a.lf)}</div>${pills(s)}</div></div>`}).join('')}</div>`}
function abschnitt(i,j){const m=D.module[i],a=m.abschnitte[j];app.innerHTML=crumb([['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel]])+`<div class="box"><h1>${a.nr} ${esc(a.titel)}</h1>${a.lektionen.map((l,k)=>{const s=stat(l.items);return `<div class="card" data-go="l${i}.${j}.${k}"><div class="ic">${k+1}</div><div><div class="ct">Lektion ${k+1}: ${esc(l.titel)}</div><div class="meta">${s.t} Seiten</div>${pills(s)}</div></div>`}).join('')}</div>`}
let P=null; // Spieler
function start(list,ctx){P={list,ctx,pos:0,ans:{},done:{}};show()}
function render(q,seed){let h=`<div class="q">${esc(q.frage)}</div>`;
 if(q.typ==='mc'||q.typ==='mehr'){const ord=shuf(q.optionen.map((_,i)=>i),q.id+seed);if(q.typ==='mehr')h+='<div class="hint">Mehrere Antworten können richtig sein.</div>';
  h+=ord.map(i=>`<label class="opt" data-i="${i}"><input type="${q.typ==='mc'?'radio':'checkbox'}" name="o" value="${i}"><span>${esc(q.optionen[i])}</span></label>`).join('')}
 else if(q.typ==='wf'){h+='<div class="hint">Entscheiden Sie bei jeder Aussage: richtig oder falsch.</div>'+q.aussagen.map((a,i)=>`<div class="wf" data-i="${i}"><span>${esc(a[0])}</span><span class="tg"><button data-v="1">richtig</button><button data-v="0">falsch</button></span></div>`).join('')}
 else if(q.typ==='zuo'){const r=shuf(q.paare.map(p=>p[1]),q.id+seed);h+=q.paare.map((p,i)=>`<div class="zu" data-i="${i}"><b>${esc(p[0])}</b><select><option value="">– bitte wählen –</option>${r.map(x=>`<option>${esc(x)}</option>`).join('')}</select></div>`).join('')}
 else if(q.typ==='zahl'){h+=`<div class="num"><input inputmode="decimal" aria-label="Ergebnis"><span>${esc(q.einheit)}</span></div><div class="hint">Dezimalzahlen mit Komma eingeben, ohne Tausenderpunkt.</div>`}
 return h}
function read(q){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')return[...r.querySelectorAll('input:checked')].map(x=>+x.value);
 if(q.typ==='wf')return[...r.querySelectorAll('.wf')].map(w=>{const b=w.querySelector('button.on');return b?+b.dataset.v:null});
 if(q.typ==='zuo')return[...r.querySelectorAll('.zu select')].map(s=>s.value);
 if(q.typ==='zahl'){const v=r.querySelector('input').value.trim().replace(/\./g,'').replace(',','.');return v===''?null:+v}}
function complete(q,a){if(q.typ==='mc'||q.typ==='mehr')return a.length>0;if(q.typ==='wf')return a.every(x=>x!==null);if(q.typ==='zuo')return a.every(x=>x);return a!==null&&!isNaN(a)}
function check(q,a){if(q.typ==='mc'||q.typ==='mehr'){const s=new Set(a);return s.size===q.richtig.length&&q.richtig.every(x=>s.has(x))}
 if(q.typ==='wf')return q.aussagen.every((x,i)=>(x[1]?1:0)===a[i]);if(q.typ==='zuo')return q.paare.every((p,i)=>p[1]===a[i]);return Math.abs(a-q.wert)<=q.tol+1e-9}
function solution(q){if(q.typ==='mc'||q.typ==='mehr')return'Richtig: '+q.richtig.map(i=>'„'+esc(q.optionen[i])+'“').join(' · ');
 if(q.typ==='zuo')return q.paare.map(p=>esc(p[0])+' → '+esc(p[1])).join('<br>');if(q.typ==='wf')return q.aussagen.map(x=>(x[1]?'✔ richtig: ':'✘ falsch: ')+esc(x[0])).join('<br>');
 return'Ergebnis: '+String(q.wert).replace('.',',')+' '+esc(q.einheit)}
function mark(q,a){const r=app.querySelector('#qa');
 if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('.opt').forEach(o=>{const i=+o.dataset.i;if(q.richtig.includes(i))o.classList.add('ok');else if(a.includes(i))o.classList.add('bad')});
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>w.classList.add((q.aussagen[i][1]?1:0)===a[i]?'ok':'bad'));
 if(q.typ==='zuo')r.querySelectorAll('.zu').forEach((z,i)=>z.classList.add(q.paare[i][1]===a[i]?'ok':'bad'));
 r.querySelectorAll('input,select,button').forEach(x=>x.disabled=true)}
function show(){const q=P.list[P.pos],c=P.ctx,n=P.list.length,sit=c.sit?(c.sit[q.id]||''):'';
 app.innerHTML=crumb(c.crumb)+`<div class="box"><div class="meta">${esc(c.titel)} · Seite ${P.pos+1} von ${n}</div><div class="bar" style="margin:6px 0 4px"><i style="width:${Math.round(100*(P.pos)/n)}%"></i></div>
 ${sit?`<div class="sit"><b>Situation:</b> ${esc(sit)}</div>`:''}<div id="qa">${render(q,c.seed)}</div><div id="fb"></div>
 <div class="nav"><button id="back" ${P.pos?'':'disabled'}>Zurück</button><span><button class="btn-p" id="chk" disabled>Prüfen</button> <button class="btn-p" id="nx" style="display:none">${P.pos+1<n?'Weiter':'Auswertung'}</button></span></div></div>`;
 const qa=$('#qa'),chk=$('#chk');
 const upd=()=>{chk.disabled=!complete(q,read(q))};
 qa.addEventListener('change',upd);qa.addEventListener('input',upd);
 qa.querySelectorAll('.tg button').forEach(b=>b.onclick=()=>{b.parentNode.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');upd()});
 $('#back').onclick=()=>{P.pos--;show()};
 const fin=(ok,a)=>{mark(q,a);$('#fb').innerHTML=`<div class="fb ${ok?'ok':'bad'}"><b>${ok?'Richtig!':'Noch nicht ganz.'}</b><div>${ok?'':solution(q)+'<br>'}${esc(q.erkl)}</div>${q.norm?`<div class="norm">Fundstelle: ${esc(q.norm)}</div>`:''}</div>`;chk.style.display='none';$('#nx').style.display=''};
 if(P.done[q.id]!==undefined){restore(q,P.ans[q.id]);fin(P.done[q.id],P.ans[q.id])}
 chk.onclick=()=>{const a=read(q),ok=check(q,a);P.ans[q.id]=a;P.done[q.id]=ok;if(!c.sim){S[q.id]={ok,t:Date.now()};lerntag();save()}fin(ok,a)};
 $('#nx').onclick=()=>{if(P.pos+1<n){P.pos++;show()}else result()}}
function restore(q,a){const r=$('#qa');if(q.typ==='mc'||q.typ==='mehr')r.querySelectorAll('input').forEach(x=>x.checked=a.includes(+x.value));
 if(q.typ==='wf')r.querySelectorAll('.wf').forEach((w,i)=>{const b=w.querySelector(`button[data-v="${a[i]}"]`);if(b)b.classList.add('on')});
 if(q.typ==='zuo')r.querySelectorAll('.zu select').forEach((s,i)=>s.value=a[i]);if(q.typ==='zahl')r.querySelector('input').value=String(a).replace('.',',')}
function result(){const c=P.ctx,ok=P.list.filter(q=>P.done[q.id]).length,n=P.list.length,pct=Math.round(100*ok/n);let extra='';
 if(c.sim){const by={};P.list.forEach(q=>{const b=q.id.split('.')[0];by[b]=by[b]||[0,0];by[b][1]++;if(P.done[q.id])by[b][0]++});
  if(c.zaehlt&&!P.gespeichert){P.gespeichert=true;const s=simStand()||{anz:0,summe:{}},e={r:ok,n,d:heute(),by};
   s.anz=(s.anz|0)+1;s.letzte=e;if(!s.beste||e.r>s.beste.r)s.beste=e;s.summe=s.summe&&typeof s.summe==='object'?s.summe:{};
   Object.keys(by).forEach(b=>{const v=Array.isArray(s.summe[b])?s.summe[b]:[0,0];s.summe[b]=[v[0]+by[b][0],v[1]+by[b][1]]});S._sim=s;lerntag();save()}
  extra='<h2>Ergebnis je Themenbereich</h2>'+Object.keys(by).sort().map(b=>{const m=D.module.find(x=>x.nr===b);const p=Math.round(100*by[b][0]/by[b][1]);return `<div style="margin:8px 0"><div class="meta">${b}. ${esc(m.titel)}: ${by[b][0]} von ${by[b][1]} (${p} %) ${p>=85?'· sicher':p>=60?'· teilweise sicher':'· noch üben'}</div><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('')}
 if(c.sim&&c.zaehlt)extra+=`<p class="hint" data-simgespeichert>Ergebnis gespeichert. Das Wiederholen der Fehler zählt nicht als neue Simulation.</p>`;
 const wrong=P.list.filter(q=>!P.done[q.id]);
 app.innerHTML=crumb(c.crumb)+`<div class="box"><h1>Auswertung</h1><div class="big">${pct} %</div><p>${ok} von ${n} Aufgaben richtig.${pct>=85?' Sehr gut, weiter so!':pct>=60?' Ordentlich – wiederholen Sie die Fehler.':' Arbeiten Sie die Lektion noch einmal durch.'}</p>${extra}
 <div class="nav"><button data-go="${c.back}">Zur Übersicht</button><span>${wrong.length?'<button class="btn-p" id="wr">Fehler wiederholen</button> ':''}<button class="btn-p" id="again">Neu starten</button></span></div></div>`;
 const w=$('#wr');if(w)w.onclick=()=>start(wrong,Object.assign({},c,{seed:c.seed+'f',zaehlt:false}));$('#again').onclick=()=>c.sim?sim():start(c.full||P.list,Object.assign({},c,{seed:c.seed+'n'}))}
function lektion(i,j,k){const m=D.module[i],a=m.abschnitte[j],l=a.lektionen[k],sit={};if(l.situation)l.items.forEach(q=>sit[q.id]=l.situation);
 start(l.items,{titel:`${a.nr} · Lektion ${k+1}: ${l.titel}`,crumb:[['Start','home'],[m.nr+'. '+m.titel,'m'+i],[a.nr+' '+a.titel,'a'+i+'.'+j],['Lektion '+(k+1)]],back:'a'+i+'.'+j,seed:'s',sit,full:l.items})}
function sim(){const L=[];D.module.forEach(m=>m.abschnitte.forEach(a=>a.lektionen.forEach(l=>{if(l.situation)L.push(l)})));
 const seed=String(Date.now()),pick=shuf(L,seed).slice(0,3),sit={},list=[];pick.forEach(l=>l.items.forEach(q=>{list.push(q);sit[q.id]=l.situation}));
 start(list,{titel:'Prüfungssimulation Teil 1.2 · drei Fälle',crumb:[['Start','home'],['Prüfungssimulation']],back:'home',seed,sit,sim:true,zaehlt:true})}
function go(t){$('#menu').classList.remove('on');window.scrollTo(0,0);
 if(t==='home')return home();if(t==='sim')return sim();
 let m;if(m=t.match(/^m(\d+)$/))return modul(+m[1]);if(m=t.match(/^a(\d+)\.(\d+)$/))return abschnitt(+m[1],+m[2]);if(m=t.match(/^l(\d+)\.(\d+)\.(\d+)$/))return lektion(+m[1],+m[2],+m[3])}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const a=e.target.closest('[data-a]');if(a){const v=a.dataset.a;if(v==='theme'){const d=document.documentElement,cur=d.dataset.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');d.dataset.theme=cur==='dark'?'light':'dark';try{localStorage.setItem(K+'_th',d.dataset.theme)}catch(e){}}
 else if(v==='reset'){if(window.confirm('Gesamten Fortschritt einschließlich der Simulationen löschen?')){S={};save();home()}}else go(v);$('#menu').classList.remove('on')}});
$('#mbtn').onclick=()=>$('#menu').classList.toggle('on');
try{const th=localStorage.getItem(K+'_th');if(th)document.documentElement.dataset.theme=th}catch(e){}

// Direktlink von der Startseite (seit 10.10.2026): #bereich-<Nr> öffnet den Prüfungsbereich, #sim die Simulation
function sprung(){const h=decodeURIComponent(location.hash.slice(1));let m;
 if(h==='sim')return sim();
 if(m=h.match(/^bereich-(.+)$/)){const i=D.module.findIndex(x=>String(x.nr)===m[1]);if(i>=0)return modul(i)}
 home()}
window.addEventListener('hashchange',sprung);
sprung();
</script>
</body>
</html>
