.cd-logo{display:block;height:auto}.cd-logo .cdl-1{fill:var(--cd-logo-1)}.cd-logo .cdl-2{fill:var(--cd-logo-2)}.cd-logo .cdl-3{fill:var(--cd-logo-3)}.cd-icon{display:block}.cd-icon path{fill:none;stroke:currentColor;stroke-miterlimit:10;stroke-width:2.33px}

:root{--petrol:var(--cd-leit);--mint:var(--cd-akzent);--mint-hell:var(--cd-akzent-hell);--grund:var(--cd-grund);--text:var(--cd-text);--leise:var(--cd-leise);
  --karte:var(--cd-flaeche);--rand:var(--cd-rand);--sunk:var(--cd-sunk);--ok:var(--cd-ok);--ok-soft:var(--cd-ok-flaeche);--ok-rand:var(--cd-ok-rand);
  --mittel:var(--cd-teilweise);--mittel-soft:var(--cd-teilweise-flaeche);--schwach:var(--cd-falsch);--schwach-soft:var(--cd-falsch-flaeche);--fokus:var(--cd-fokus)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--grund);color:var(--text);font:16px/1.55 var(--cd-schrift);font-feature-settings:"lnum"}
.marke{background:var(--karte);border-bottom:3px solid var(--mint)}
.marke-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.marke .cd-logo{width:clamp(170px,40vw,230px)}
.marke-text{font-size:13px;font-weight:600;color:var(--leise);text-align:right;line-height:1.35}
@media (max-width:480px){.marke-text{display:none}}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 48px}
a{color:var(--cd-link)}
:focus-visible{outline:3px solid var(--fokus);outline-offset:2px}
.eyebrow{margin:0;color:var(--cd-akzent-text);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:12.5px}
h1{margin:2px 0 4px;font-size:28px;line-height:1.2;font-weight:700;letter-spacing:-.01em}
h2{font-size:19px;margin:0 0 4px}
.leise{color:var(--leise)}.klein{font-size:14px}
.karte{background:var(--karte);border:1px solid var(--rand);border-radius:20px;padding:18px;margin:0 0 16px}
.karte.akzent{border-left:6px solid var(--mint)}
.banner{background:var(--mittel-soft);border:1px solid var(--mittel);border-radius:10px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.kopf{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:end}
.gross{font-size:52px;font-weight:800;line-height:1;color:var(--petrol);font-variant-numeric:tabular-nums}
.gross small{font-size:16px;font-weight:600;color:var(--leise)}
.balken{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.balken>i{display:block;height:100%;background:var(--mint);border-radius:99px}
.balken.ok>i{background:var(--petrol)}.balken.mittel>i{background:var(--mittel)}.balken.schwach>i{background:var(--schwach)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--sunk);border:1px solid var(--rand);white-space:nowrap}
.chip.ok{background:var(--ok-soft);border-color:var(--ok-rand);color:var(--ok)}
.chip.mittel{background:var(--mittel-soft);border-color:var(--mittel);color:var(--mittel)}
.chip.schwach{background:var(--schwach-soft);border-color:var(--schwach);color:var(--schwach)}
a.bereich{color:inherit;text-decoration:none;border-radius:10px;margin:0 -8px;padding-left:8px;padding-right:8px}
a.bereich:hover,a.bereich:focus-visible{background:var(--cd-sunk)}
a.bereich:hover .titel{text-decoration:underline}
.bereich .pfeil{color:var(--cd-akzent);font-weight:700}
.bereich{display:grid;grid-template-columns:2.2rem minmax(0,1fr);gap:4px 12px;padding:12px 0;border-top:1px solid var(--rand)}
.bereich:first-of-type{border-top:0}
.nr{width:2.2rem;height:2.2rem;border-radius:50%;background:var(--petrol);color:var(--karte);display:grid;place-items:center;font-weight:700}
.bereich .zeile{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.bereich .titel{font-weight:650;min-width:0}
.zahlen{font-size:14px;color:var(--leise);font-variant-numeric:tabular-nums}
.schritte{margin:0;padding-left:1.2rem}.schritte li{margin:6px 0}
.tage{display:grid;grid-template-columns:repeat(14,minmax(0,1fr));gap:4px;margin:10px 0 6px;max-width:520px}
.tag{aspect-ratio:1;border-radius:4px;background:var(--sunk);border:1px solid var(--rand)}
.tag.an{background:var(--mint);border-color:var(--mint)}
.tag.heute{outline:2px solid var(--petrol);outline-offset:1px}
.lz{display:grid;gap:6px;padding:10px 0;border-top:1px solid var(--rand)}.lz:first-of-type{border-top:0}
.stempel{display:flex;flex-wrap:wrap;gap:6px}
.stempel span{font-size:13px;font-weight:700;padding:4px 9px;border-radius:8px;border:2px dashed var(--rand);color:var(--leise)}
.stempel span.an{border-style:solid;border-color:var(--ok-rand);color:var(--ok);background:var(--ok-soft)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:6px 4px;border-bottom:1px solid var(--rand);text-align:left;vertical-align:top}
td.z,th.z{text-align:right;white-space:nowrap}
tfoot td{font-weight:800;border-bottom:0}
label.feld{display:grid;gap:4px;font-weight:600;margin:10px 0}
input[type=text]{font:inherit;padding:10px 12px;border:1px solid var(--rand);border-radius:8px;background:var(--karte);color:var(--text);width:100%;max-width:22rem;min-height:2.75rem}
.aktionen{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{font:inherit;font-weight:650;cursor:pointer;border:1px solid var(--rand);background:var(--karte);color:var(--text);border-radius:8px;padding:9px 16px;min-height:2.75rem;text-decoration:none;display:inline-flex;align-items:center}
.btn.prim{background:var(--petrol);border-color:var(--petrol);color:var(--karte)}
.btn:disabled{opacity:.45;cursor:default}
.code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:22px;font-weight:800;letter-spacing:.06em;background:var(--sunk);border:2px dashed var(--mint);border-radius:10px;padding:12px 14px;margin:12px 0 4px;word-break:break-all;user-select:all}
details{margin-top:8px}summary{cursor:pointer;font-weight:650}
footer{margin-top:26px;font-size:14px;color:var(--leise)}
.klassenzeile{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin:0 0 14px;color:var(--leise);font-weight:600}
.klein-btn{min-height:2.4rem;padding:6px 12px;font-size:14px}
.ziele{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px;margin-top:10px}
.ziel{border:1px solid var(--rand);border-radius:10px;padding:12px 14px;display:grid;gap:4px;align-content:start;background:var(--karte)}
.ziel.aktiv{border-left:6px solid var(--mint)}
.ziel.spaeter{border-left:6px solid var(--rand)}
.ziel.abgelegt{opacity:.8;border-style:dashed}
.ziel .zeile{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ziel strong{font-size:18px}
.kacheln{display:grid;gap:4px}
.ablauf details{margin-top:6px;border-top:1px solid var(--rand);padding-top:6px}
.ablauf summary{cursor:pointer}
.ablauf table{font-size:14px}
.ablauf th,.ablauf td{padding:4px 6px;border-bottom:1px solid var(--rand);vertical-align:top;overflow-wrap:anywhere}
.ablauf ul{padding-left:18px;margin:6px 0}
.ablauf .hint{font-size:13px;opacity:.85}
.sparte{display:grid;gap:4px}
.sparte select{font:inherit;font-size:14px;padding:4px 6px;border:1px solid var(--rand);border-radius:6px;background:var(--karte);color:inherit;max-width:100%}
.sparte ul.module{margin:2px 0}
.termin{font-weight:650;font-variant-numeric:tabular-nums}
.klassen{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:12px}
.klasse-wahl{font:inherit;cursor:pointer;display:grid;gap:2px;text-align:left;border:1px solid var(--rand);border-left:6px solid var(--mint);border-radius:10px;padding:12px 14px;background:var(--karte);color:var(--text);min-height:3.5rem}
.klasse-wahl strong{font-size:20px}
.klasse-wahl:hover{border-color:var(--mint)}
ul.module{margin:8px 0 6px;padding-left:1.2rem}ul.module li{margin:4px 0}
.app-teil{margin:0 0 16px}
.zw{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:22px 0 10px}.zw h2{margin:0;font-size:20px}
.ziele-panel{margin-top:10px}.ziele-panel .ziel{border-left:1px solid var(--rand)}
.ziele-panel .ziel.aktiv{border-left:6px solid var(--mint)}
.zeilen .karte,.zeilen section.karte{border:0;padding:0;margin:0;background:transparent}
.zeilen .kopf{margin-bottom:4px}
.fuss-knoepfe{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
h1.gross-titel{font-size:32px;letter-spacing:-.02em;line-height:1.1;margin:2px 0 6px}
.willkommen h2{font-size:22px;margin-bottom:6px}.willkommen p{margin:0 0 4px}
.mini-kacheln{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.mini{font:inherit;cursor:pointer;text-align:left;display:grid;gap:2px;border:1px solid var(--rand);border-radius:12px;padding:10px 14px;background:var(--karte);color:var(--text);text-decoration:none;min-height:3.25rem}
.mini strong{font-size:15px}.mini span{font-size:13.5px;color:var(--leise)}
.mini:hover,.mini:focus-visible{border-color:var(--mint)}
.seg.modus{margin-top:4px}
.zw-kopf{display:flex;justify-content:space-between;align-items:baseline;gap:6px 12px;flex-wrap:wrap}.zw-kopf h2{margin:0}
[data-bereiche] h3{font-size:16px;margin:14px 0 2px}
.bereich.sim .nr{background:var(--cd-akzent);color:var(--cd-leit)}
.rang-ober{margin:0 0 6px}
.rang-mini{grid-template-columns:auto minmax(0,1fr);align-items:center;gap:12px}.rang-mini .rk-siegel{width:56px;height:56px}
.sgk-liste{display:grid;gap:8px}
.sgk-gruppe{background:var(--karte);border:1px solid var(--rand);border-radius:14px;padding:10px 14px;margin:0}
.sgk-gruppe summary{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;align-items:baseline}
.sgk-gruppe summary small{color:var(--leise);font-weight:600}
.sgk-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px;margin-top:10px}
.sgk{display:grid;gap:4px;align-content:start;border:1px solid var(--rand);border-radius:12px;padding:10px 12px;background:var(--grund);color:var(--text);text-decoration:none}
.sgk.an{border-left:5px solid var(--mint)}.sgk.an:hover,.sgk.an:focus-visible{border-color:var(--mint)}
.sgk.aus{opacity:.78}
.sgk.an.spaeter{border-left-color:var(--rand)}.sgk-kommt{font-size:13px;font-weight:600;color:var(--leise)}
.sgk-empf{margin:0 0 10px;max-width:520px}.sgk-empf .sgk-kicker{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--leise)}
.sgk-titel{font-weight:700;font-size:15px}.sgk-meta{font-size:13px;color:var(--leise)}.sgk-chips{display:flex;flex-wrap:wrap;gap:4px}
.rm-text{display:grid;gap:2px}.rm-text strong{font-size:16px}.rm-text .rm-link{color:var(--cd-link);font-weight:600}
/* Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026): Rangkarte (.rk), „Heute dran“ (.hd), Kacheln (.kl), Umschalter (.seg), Knoten-Motiv.
   Nur CD-Werte: --cd-* aus cd.py, Dunkelgrün #223D42, Grün #6FA895, Sekundärfarben, Weiß. Hell und dunkel über die Tokens. */
.lz-knoten{display:block;fill:none;stroke-width:1.3}
.rk{display:grid;gap:14px}
.rk-karte,.rk.kompakt{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:18px;display:grid;gap:12px}
.rk h3{margin:0;font-size:17px}
.rk-kopf{display:flex;gap:16px;align-items:center}
.rk-siegel{flex:none;display:block}
.rk-s-ring{fill:none;stroke:var(--cd-leit);stroke-width:1.5}
.rk-s-feld{fill:var(--cd-akzent-hell)}
.rk-s-rund{font-size:7.6px;font-weight:600;letter-spacing:1.9px;fill:var(--cd-leit)}
.rk-s-knoten path{fill:none;stroke:var(--cd-leit);stroke-width:5}
.rk-s-code{font-weight:700;fill:var(--cd-leit);font-family:var(--cd-schrift)}
.rk-titel{font-size:21px;font-weight:700;line-height:1.2}
.rk.kompakt .rk-titel{font-size:17px}
.rk-score{font-size:14px;font-weight:600;margin-top:2px}
.rk-leise,.rk-skala.leise{font-size:13px;color:var(--cd-leise);line-height:1.45;margin:0}
.rk-skala{display:flex;justify-content:space-between;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.rk-balken{position:relative;height:34px}
.rk-spur{position:absolute;left:0;right:0;top:11px;height:12px;border-radius:99px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-fill{position:absolute;left:0;top:10px;height:14px;border-radius:99px;background:var(--cd-akzent);min-width:14px}
.rk-ist{position:absolute;top:3px;width:2px;height:28px;margin-left:-1px;background:var(--cd-leit)}
.rk-ghost{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;border:2px dashed var(--cd-leit);box-sizing:border-box;background:var(--cd-flaeche);font-size:10px;font-weight:700;color:var(--cd-leit)}
.rk-balken .rk-ghost{position:absolute;top:6px;margin-left:-11px}
.rk-ghost.gross{width:40px;height:40px;font-size:15px;flex:none}
.rk-fehlt,.rk-ausblick{margin:0;font-size:15px;line-height:1.45}
.rk-ausblick{background:var(--cd-teilweise-flaeche);border:1px solid var(--cd-teilweise);border-radius:10px;padding:8px 12px}
.rk-zahlen{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.rk-zahlen>div{background:var(--cd-sunk);border-radius:12px;padding:8px 10px;display:grid;align-content:start}
.rk-zahlen span{font-size:11.5px;color:var(--cd-leise)}.rk-zahlen b{font-size:15px;font-variant-numeric:tabular-nums;white-space:nowrap}
.rk-bm{display:flex;gap:12px;align-items:flex-start}
.rk-bm p{margin:4px 0 0;font-size:14.5px;line-height:1.45}.rk-bm .rk-leise{font-size:13px}
.rk-bm-t{font-weight:700}
.rk-leiter{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;align-items:end;min-height:110px}
.rk-stufe{display:flex;flex-direction:column;align-items:center;gap:3px;justify-content:flex-end}
.rk-saeule{align-self:stretch;border-radius:4px;background:var(--cd-sunk);border:1px solid var(--cd-rand);box-sizing:border-box}
.rk-stufe.erreicht .rk-saeule{background:var(--cd-akzent);border-color:var(--cd-akzent)}
.rk-stufe.aktuell .rk-saeule{background:var(--cd-leit);border-color:var(--cd-leit)}
.rk-code{font-size:11px;font-weight:700}.rk-ab{font-size:10px;color:var(--cd-leise);font-variant-numeric:tabular-nums}
.rk-stufe:not(.aktuell):not(.erreicht) .rk-code{color:var(--cd-leise)}
.rk-kurs{width:100%;height:auto;display:block;font-family:var(--cd-schrift)}
.rk-k-band{stroke:var(--cd-rand);stroke-width:1}.rk-k-band.ig{stroke-width:1.8}
.rk-k-achse{stroke:var(--cd-leise);stroke-width:1}
.rk-k-txt{font-size:10px;fill:var(--cd-leise)}.rk-k-txt.ig,.rk-k-txt.fett{fill:var(--cd-text);font-weight:700}
.rk-k-ghost{fill:none;stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:5 4}
.rk-k-ist{fill:none;stroke:var(--cd-akzent);stroke-width:3.5;stroke-linejoin:round;stroke-linecap:round}
.rk-k-prog{fill:none;stroke:var(--cd-akzent);stroke-width:2;stroke-dasharray:1 5;stroke-linecap:round}
.rk-k-punkt{fill:var(--cd-akzent);stroke:var(--cd-flaeche);stroke-width:2}
.rk-k-gpunkt{fill:var(--cd-flaeche);stroke:var(--cd-leit);stroke-width:2;stroke-dasharray:2 2}
.rk-k-pruef{stroke:var(--cd-leit);stroke-width:1.5}
.rk-legende{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--cd-leise)}
.rk-legende span{display:flex;align-items:center;gap:6px}.rk-legende i{display:inline-block;width:18px;height:0;border-top:3px solid var(--cd-akzent)}
.rk-legende i.gh{border-top:2px dashed var(--cd-leit)}.rk-legende i.pr{border-top:2px dotted var(--cd-akzent)}
.rk-mehr{font-weight:600;font-size:14px;justify-self:start}
/* „Heute dran“: in beiden Ansichten Dunkelgrün mit weißer Schrift */
.hd{position:relative;overflow:hidden;background:#223D42;color:#FFFFFF;border-radius:20px;padding:20px;display:grid;gap:8px}
.hd .lz-knoten{position:absolute;right:-56px;top:-30px;width:220px;height:190px;stroke:#6FA895}
.hd>*:not(.lz-knoten){position:relative}
.hd-ober{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#CEE3DD}
.hd-gross{font-size:25px;font-weight:700;line-height:1.2}
.hd p,.hd li{margin:0;font-size:14.5px;line-height:1.45;color:#E9F1ED;max-width:34em}
.hd a{color:#FFFFFF}
.hd-knopf{justify-self:start;margin-top:4px;background:#FFFFFF;color:#223D42 !important;text-decoration:none;font-weight:700;font-size:15px;border-radius:12px;padding:12px 20px;border:0;cursor:pointer;font-family:inherit}
.hd-knopf:hover{background:#E9F1ED}
.hd ol{margin:4px 0 0;padding-left:1.2rem;display:grid;gap:4px}
.hd-fertig{display:inline-block;background:#6FA895;color:#223D42;font-weight:700;font-size:13px;border-radius:99px;padding:3px 10px}
/* Kacheln mit Motiv */
.kl-gitter{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.kl{text-decoration:none;color:var(--cd-text);background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.kl:hover{border-color:var(--cd-akzent)}
.kl-bild{position:relative;height:84px;overflow:hidden;background:var(--cd-akzent-hell)}
.kl-bild.dunkel{background:#223D42}.kl-bild.gruen{background:#6FA895}.kl-bild.grau{background:#CDD9DF}
.kl-bild .lz-knoten{position:absolute;right:-38px;bottom:-40px;width:150px;height:128px;stroke:var(--cd-flaeche)}
.kl-bild.grau .lz-knoten{stroke:#FFFFFF}
.kl-bild.dunkel .lz-knoten{stroke:#6FA895}.kl-bild.gruen .lz-knoten{stroke:#CEE3DD}
.kl-sym{position:absolute;left:14px;top:14px;width:30px;height:30px;fill:none;stroke:var(--cd-leit);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.kl-bild.dunkel .kl-sym{stroke:#FFFFFF}.kl-bild.grau .kl-sym,.kl-bild.gruen .kl-sym{stroke:#223D42}
.kl-neu{position:absolute;right:10px;top:10px;background:#FFFFFF;color:#223D42;font-size:11px;font-weight:700;border-radius:99px;padding:3px 9px}
.kl-bild.gruen .kl-neu,.kl-bild.grau .kl-neu,.kl-bild:not(.dunkel) .kl-neu{background:#223D42;color:#FFFFFF}
.kl-text{padding:12px 14px 14px;display:grid;gap:3px}
.kl-titel{font-size:15px;font-weight:700;line-height:1.25}.kl-meta{font-size:12.5px;color:var(--cd-leise)}
/* Umschalter (Segmente) */
.seg{display:flex;gap:4px;background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:14px;padding:4px}
.seg button{flex:1;font:inherit;font-size:14px;font-weight:600;border:0;border-radius:10px;padding:8px 6px;background:transparent;color:var(--cd-text);cursor:pointer;display:grid;gap:1px;min-height:2.75rem}
.seg button small{font-size:11.5px;font-weight:500;color:var(--cd-leise)}
.seg button[aria-pressed="true"]{background:var(--cd-leit);color:var(--cd-auf-leit)}
.seg button[aria-pressed="true"] small{color:var(--cd-auf-leit)}
/* aufklappbare Zeilen */
.zeilen{background:var(--cd-flaeche);border:1px solid var(--cd-rand);border-radius:20px;padding:2px 16px}
.zeilen>details{border-top:1px solid var(--cd-sunk);margin:0}.zeilen>details:first-child{border-top:0}
.zeilen>details>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;font-weight:700}
.zeilen>details>summary::-webkit-details-marker{display:none}
.zeilen>details>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--cd-leit);border-bottom:2px solid var(--cd-leit);transform:rotate(45deg);flex:none;margin-right:4px;transition:transform .15s}
.zeilen>details[open]>summary::after{transform:rotate(225deg)}
.zeilen summary small{display:block;font-weight:500;font-size:13px;color:var(--cd-leise)}
.zeilen>details>.inhalt{padding:0 0 14px}
/* Coach-Zeile und Einführung (seit 11.10.2026) */
.hd-coach{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.hd-zweit{background:transparent;color:#FFFFFF !important;border:1px solid #6FA895;border-radius:10px;padding:7px 11px;font:inherit;font-weight:600;font-size:13.5px;cursor:pointer;text-decoration:none;min-height:2.5rem;display:inline-flex;align-items:center}
.hd-zweit:hover{border-color:#FFFFFF}
.hilfe-link{font-size:13px;font-weight:600;color:var(--cd-link);justify-self:start}
.tour-sperre{position:fixed;inset:0;z-index:999}
.tour-licht{position:fixed;z-index:1000;border-radius:14px;box-shadow:0 0 0 9999px color-mix(in srgb,#132224 72%,transparent);pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s}
.tour-blase{position:fixed;z-index:1001;background:var(--cd-flaeche);color:var(--cd-text);border:1px solid var(--cd-rand);border-radius:16px;padding:16px;width:min(340px,calc(100vw - 24px));box-shadow:var(--cd-schatten);font-family:var(--cd-schrift)}
.tour-blase h2{font-size:18px;margin:2px 0 6px}.tour-blase p{margin:0 0 12px;font-size:15px;line-height:1.45}
.tour-schritt{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cd-leise)}
.tour-knoepfe{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.tour-knoepfe button{font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:8px 14px;border:1px solid var(--cd-rand);background:var(--cd-flaeche);color:var(--cd-text);cursor:pointer;min-height:2.6rem}
.tour-knoepfe .tour-vor{background:var(--cd-leit);border-color:var(--cd-leit);color:var(--cd-auf-leit)}
.tour-knoepfe .tour-weg{margin-right:auto;border-color:transparent;color:var(--cd-leise)}
.tour-knoepfe button:disabled{opacity:.4;cursor:default}

@media (max-width:480px){h1{font-size:23px}h1.gross-titel{font-size:29px}.gross{font-size:42px}.code{font-size:18px}.tage{grid-template-columns:repeat(7,minmax(0,1fr))}}
@media print{.aktionen,.btn{display:none}}
</style>

ilität, Beruf und Freizeit · 2 Gesundheit und Pflege · 3 Vorsorge und Finanzanlagen · 4 Einkommen und Hinterbliebene · 5 kaufmännische Steuerung<\/td><td style=\"text-align:right\">80<\/td><\/tr>\n   <tr><td>1.2<\/td><td><strong>Spezieller Teil<\/strong>, Versicherungs&shy;fall&shy;bearbeitung in einer Sparte: Schaden- oder Leistungsfall aufnehmen, Deckung prüfen, Leistung berechnen (drei Aufgaben)<\/td><td style=\"text-align:right\">20<\/td><\/tr>\n  <\/tbody>\n <\/table>\n <ul>\n  <li>Bearbeitungszeit 150 Minuten für beide Teile zusammen. Faustregel: etwa 1,5 Minuten je Punkt, also rund 120 Minuten für Teil 1.1 und 30 Minuten für Teil 1.2.<\/li>\n  <li>Sperrfach: Der Bereich muss mindestens mit „ausreichend“ bestanden werden; er zählt 30 % der Gesamtnote.<\/li>\n  <li>Erlaubte Hilfsmittel: Taschenrechner (nicht programmierbar, netzunabhängig, ohne Verbindung nach außen), Bedingungswerk PROXIMUS 5 und Gesetzestexte ohne Kommentierung. Erlaubt sind nur Unterstreichungen, farbige Markierungen und Verweise auf Paragrafen.<\/li>\n  <li>Die Sparte für Teil 1.2 legt Ihr Ausbildungsbetrieb bei der Anmeldung zu Teil 2 fest. Wählen Sie im Pass genau dieses Gebiet; wenn Sie es nicht wissen, fragen Sie im Betrieb nach.<\/li>\n  <li>Am zweiten Prüfungstag folgt Wirtschafts- und Sozialkunde: 60 Minuten, nur mit Taschenrechner.<\/li>\n <\/ul>\n <p class=\"hint\">* Punkte so in den Prüfungen W2024/25 bis S2026; die Prüfungsordnung selbst nennt nur die 150 Minuten. Angaben nach dem <a href=\"https://kvf-guide.bwv.de/pruefung/teil2-schriftlich/\">KVF-Guide des BWV<\/a>.<\/p>\n<\/details>"}</script>
<script>
// Gemeinsame Bausteine der Lernzentrale (seit 11.10.2026, Entscheidung Christian, Variante C):
// Rating-Leiter NR–AAA auf dem Score 0–1000 (= Reife × 10), Benchmark („Ghost“) je Klasse, Tempo, Lernzeit, Rangkarte, Knoten-Motiv.
// Eingebunden von Werkzeug/gap1/build.py (Prüfungstraining) und Werkzeug/pass/bau_pass.py (Startseite) über cd.bausteine_js().
// Keine Abhängigkeiten, kein Netz; alle Texte sind feste Bausteintexte (Zahlen werden eingesetzt, nichts aus Nutzereingaben).
const LZRANG = (() => {
  'use strict';
  // [ab Score, Kürzel, Kurztext] – Schwellen: BBB = 60 % Reife (teilweise sicher, „Investment Grade“), AA = 85 % (sicher)
  const LEITER = [
    [0, 'NR', 'Not Rated – noch ohne Bewertung'],
    [10, 'CCC', 'Erste Aufgaben abgerufen'],
    [80, 'B', 'Der Anfang ist gemacht'],
    [250, 'BB', 'Spürbarer Grundstock'],
    [400, 'BB+', 'Knapp vor Investment Grade'],
    [600, 'BBB', 'Investment Grade – prüfungsfähig'],
    [750, 'A', 'Solide prüfungsfähig'],
    [850, 'AA', 'Sicher für die Prüfung'],
    [950, 'AAA', 'Peak – Spitzenbewertung'],
  ];
  const ZIEL_GHOST = 850;          // AA eine Woche vor der Prüfung
  const KURVE = 1.5;               // langsamer Beginn, steiler vor der Prüfung
  const MAX_SEK_JE_AUFGABE = 180;  // aktive Lernzeit: höchstens 3 Minuten je Aufgabe
  const istTag = x => typeof x === 'string' && /^\d{4}-\d\d-\d\d$/.test(x);
  const tagNr = s => { const z = s.split('-').map(Number); return Math.round(Date.UTC(z[0], z[1] - 1, z[2]) / 864e5); };
  const tagIso = n => { const d = new Date(n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); };
  const datum = s => { const z = s.split('-'); return +z[2] + '.' + (+z[1]) + '.' + z[0]; };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function score(w, n) { return n ? Math.max(0, Math.min(1000, Math.round(1000 * w / n))) : 0; }
  function rang(s) { let i = 0; LEITER.forEach((x, k) => { if (s >= x[0]) i = k; }); return i; }

  // Benchmark: Soll-Score am Tag heute; g = { von: 'JJJJ-MM-TT' (Ausbildungsbeginn), bis: 'JJJJ-MM-TT' (Prüfung − 7 Tage) }
  function ghost(g, heute) {
    if (!g || !istTag(g.von) || !istTag(g.bis) || !istTag(heute)) return null;
    const a = tagNr(g.von), b = tagNr(g.bis), h = tagNr(heute);
    if (b <= a) return null;
    const x = Math.min(1, Math.max(0, (h - a) / (b - a)));
    return Math.round(ZIEL_GHOST * Math.pow(x, KURVE));
  }
  // Ghost-Parameter aus Klasse und Termin: beginn 'JJJJ-MM', termin 'JJJJ-MM-TT' oder 'JJJJ-MM' (dann der Monatserste)
  function ghostVon(beginn, termin) {
    if (!/^\d{4}-\d\d$/.test(beginn || '') || !/^\d{4}-\d\d(-\d\d)?$/.test(termin || '')) return null;
    const t = termin.length === 7 ? termin + '-01' : termin;
    return { von: beginn + '-01', bis: tagIso(tagNr(t) - 7), pruefung: t };
  }

  // Verlauf { 'JJJJ-MM-TT': Score } bereinigt und sortiert
  function reihe(v) { return Object.keys(v && typeof v === 'object' ? v : {}).filter(k => istTag(k) && typeof v[k] === 'number' && isFinite(v[k])).sort().map(k => [k, v[k]]); }
  // Tempo in Score je Tag: Anstieg über die letzten 14 Tage (mindestens 3 Tage Abstand), sonst null
  function tempo(v, heute, jetzt) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return null;
    const h = tagNr(heute), ziel = h - 14;
    let ab = r[0]; r.forEach(x => { if (tagNr(x[0]) <= ziel) ab = x; });
    const tage = h - tagNr(ab[0]); if (tage < 3) return null;
    const t = ((typeof jetzt === 'number' ? jetzt : r[r.length - 1][1]) - ab[1]) / tage;
    return t > 0 ? t : null;
  }
  // angezeigter Rang: der höchste Rang der letzten 7 Tage; liegt der Score darunter → „Ausblick negativ“ (Abstieg erst nach 7 Tagen)
  function anzeige(s, v, heute) {
    const jetzt = rang(s); let hoch = jetzt;
    const h = tagNr(heute);
    reihe(v).forEach(x => { const d = h - tagNr(x[0]); if (d >= 0 && d <= 6) hoch = Math.max(hoch, rang(x[1])); });
    return { i: hoch, jetzt, ausblick: hoch > jetzt };
  }

  // Lernzeit: Sekunden → „31 h 20 min“ / „45 min“
  function zeit(sek) { const m = Math.round((sek || 0) / 60); if (m < 60) return m + ' min'; return Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') + ' min'; }
  function zeitTage(z, heute, tage) { if (!z || typeof z !== 'object') return 0; const h = tagNr(heute); let s = 0; Object.keys(z).forEach(k => { if (istTag(k) && typeof z[k] === 'number') { const d = h - tagNr(k); if (d >= 0 && d < tage) s += z[k]; } }); return s; }
  // aktive Zeit messen: start() beim Anzeigen einer Aufgabe, stopp() beim Prüfen → Sekunden (Tab im Hintergrund zählt nicht, höchstens 3 Minuten)
  const uhr = (() => { let seit = null, summe = 0;
    if (typeof document !== 'undefined') document.addEventListener('visibilitychange', () => { const n = Date.now(); if (document.hidden) { if (seit !== null) { summe += n - seit; seit = null; } } else if (seit === null) seit = n; });
    return { start() { summe = 0; seit = (typeof document !== 'undefined' && document.hidden) ? null : Date.now(); },
      stopp() { const n = Date.now(), ms = summe + (seit !== null ? n - seit : 0); summe = 0; seit = null; return Math.min(MAX_SEK_JE_AUFGABE, Math.max(0, Math.round(ms / 1000))); } }; })();
  function zeitBuchen(S, sek, heute) {
    if (!sek) return; const z = S._zeit && typeof S._zeit === 'object' ? S._zeit : {};
    z[heute] = (typeof z[heute] === 'number' ? z[heute] : 0) + sek;
    const k = Object.keys(z).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 60)).forEach(x => delete z[x]);
    S._zeit = z; S._zeitGes = (typeof S._zeitGes === 'number' ? S._zeitGes : 0) + sek;
  }
  function verlaufBuchen(S, s, heute) {
    const v = S._verlauf && typeof S._verlauf === 'object' ? S._verlauf : {}; v[heute] = s;
    const k = Object.keys(v).filter(istTag).sort(); k.slice(0, Math.max(0, k.length - 400)).forEach(x => delete v[x]);
    S._verlauf = v;
  }

  // Knoten aus dem Schul-Icon als Motiv (wie auf Mappe und Design Manual): vergrößert, angeschnitten, nur Strich
  const KNOTEN = ['M100.44,95.07l20.74-20.74c.69-.69,1.81-.69,2.5,0l29.96,29.96c6.42,6.42,6.42,16.82,0,23.23h0c-6.42,6.42-16.82,6.42-23.23,0l-29.96-29.96c-.69-.69-.69-1.81,0-2.5Z',
    'M123.67,74.34l20.74,20.74c.69,.69,.69,1.81,0,2.5l-29.96,29.96c-6.42,6.42-16.82,6.42-23.23,0h0c-6.42-6.42-6.42-16.82,0-23.23l29.96-29.96c.69-.69,1.81-.69,2.5,0Z',
    'M100.44,111.08l20.74,20.74c.69,.69,1.81,.69,2.5,0l29.96-29.96c6.42-6.42,6.42-16.82,0-23.23h0c-6.42-6.42-16.82-6.42-23.23,0l-29.96,29.96c-.69,.69-.69,1.81,0,2.5Z',
    'M123.67,131.82l20.74-20.74c.69-.69,.69-1.81,0-2.5l-29.96-29.96c-6.42-6.42-16.82-6.42-23.23,0h0c-6.42,6.42-6.42,16.82,0,23.23l29.96,29.96c.69,.69,1.81,.69,2.5,0Z'];
  function knoten(klasse) { return '<svg class="' + esc(klasse || 'lz-knoten') + '" aria-hidden="true" focusable="false" viewBox="86 72 73 62">' + KNOTEN.map(d => '<path d="' + d + '"/>').join('') + '</svg>'; }

  // Siegel mit Rating (rund, nach dem Schulsiegel „Schule mit kaufmännischer Tradition“)
  let siegelNr = 0;
  function siegel(code, ziel, gross) {
    const id = 'lzs' + (++siegelNr), s = gross ? 104 : 64;
    return '<svg class="rk-siegel" role="img" aria-label="Rating ' + esc(code) + '" width="' + s + '" height="' + s + '" viewBox="0 0 108 108">' +
      '<defs><path id="' + id + '" d="M54,54 m-44,0 a44,44 0 1,1 88,0 a44,44 0 1,1 -88,0"/></defs>' +
      '<circle cx="54" cy="54" r="52" class="rk-s-ring"/><circle cx="54" cy="54" r="37" class="rk-s-feld"/>' +
      (gross ? '<text class="rk-s-rund"><textPath href="#' + id + '">LERNZENTRALE KVF · RATING ' + esc(ziel) + ' · LISTSCHULE ·</textPath></text>' : '') +
      '<g transform="translate(45 ' + (gross ? 25 : 27) + ') scale(0.24)" class="rk-s-knoten">' + KNOTEN.map(d => '<path d="' + d + '" transform="translate(-86 -74)"/>').join('') + '</g>' +
      '<text x="54" y="' + (gross ? 71 : 72) + '" text-anchor="middle" class="rk-s-code" font-size="' + (code.length > 2 ? 24 : 28) + '">' + esc(code) + '</text></svg>';
  }

  // Kursverlauf: Ist, Benchmark, Prognose; Bänder BB, BBB, AA
  function kurs(v, g, heute, tp) {
    const r = reihe(v).filter(x => x[0] <= heute); if (!r.length) return '';
    const a = tagNr(r[0][0]), h = tagNr(heute);
    const b = g ? Math.max(tagNr(g.bis), h + 7) : h + 30;
    const W = 360, H = 180, x0 = 40, x1 = 348, y0 = 150, y1 = 14;
    const X = t => (x0 + (x1 - x0) * (t - a) / Math.max(1, b - a)).toFixed(1), Y = s => (y0 - (y0 - y1) * Math.min(1000, Math.max(0, s)) / 1000).toFixed(1);
    let o = '<svg class="rk-kurs" role="img" aria-label="Kursverlauf seit ' + datum(r[0][0]) + '" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">';
    [[250, 'BB'], [600, 'BBB'], [850, 'AA']].forEach(([s, t]) => { o += '<line x1="' + x0 + '" y1="' + Y(s) + '" x2="' + x1 + '" y2="' + Y(s) + '" class="rk-k-band' + (s === 600 ? ' ig' : '') + '"/><text x="' + (x0 - 6) + '" y="' + (+Y(s) + 3.5) + '" text-anchor="end" class="rk-k-txt' + (s === 600 ? ' ig' : '') + '">' + t + '</text>'; });
    o += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + x1 + '" y2="' + y0 + '" class="rk-k-achse"/>';
    if (g) { const p = []; for (let t = a; t <= b; t += Math.max(1, Math.round((b - a) / 40))) p.push(X(t) + ',' + Y(ghost(g, tagIso(t)))); p.push(X(b) + ',' + Y(ghost(g, tagIso(b)))); o += '<polyline class="rk-k-ghost" points="' + p.join(' ') + '"/>'; }
    o += '<polyline class="rk-k-ist" points="' + r.map(x => X(tagNr(x[0])) + ',' + Y(x[1])).join(' ') + '"/>';
    const jetzt = r[r.length - 1][1];
    if (tp) o += '<polyline class="rk-k-prog" points="' + X(h) + ',' + Y(jetzt) + ' ' + X(b) + ',' + Y(jetzt + tp * (b - h)) + '"/>';

// ------------------------------------------------------------------ Einführung (Tour): hebt echte Elemente nacheinander hervor
// LZTOUR.start([{ sel, titel, text }], { key, ende: { label, aktion }, nachher }) – Schritte ohne sichtbares Element werden übersprungen;
// nachher (seit 12.10.2026): wird nach jedem Schließen aufgerufen (Fertig, Überspringen, Esc), z. B. um die Startseite neu zu zeichnen.
const LZTOUR = (() => {
  'use strict';

  const lies = k => { try { return JSON.parse(localStorage.getItem('lz-tour-v1') || '{}')[k] || null; } catch (e) { return null; } };
  const merke = k => { try { const x = JSON.parse(localStorage.getItem('lz-tour-v1') || '{}'); const d = new Date(); x[k] = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); localStorage.setItem('lz-tour-v1', JSON.stringify(x)); } catch (e) { /* ohne Speicher */ } };

  let taste = null;

    o = o || {}; const k = o.key || 'start';
    const liste = schritte.filter(s => { const e = document.querySelector(s.sel); return e && e.getClientRects().length; });
    if (!liste.length) return;
    if (offen) zu(k, false);
    nach = typeof o.nachher === 'function' ? o.nachher : null;
    const sperre = document.createElement('div'); sperre.className = 'tour-sperre';
    const licht = document.createElement('div'); licht.className = 'tour-licht'; licht.setAttribute('aria-hidden', 'true');
    const blase = document.createElement('div'); blase.className = 'tour-blase'; blase.setAttribute('role', 'dialog'); blase.setAttribute('aria-modal', 'true'); blase.setAttribute('aria-labelledby', 'tour-titel');
    document.body.append(sperre, licht, blase); offen = [sperre, licht, blase];
    let i = 0;

      const s = liste[i], e = document.querySelector(s.sel);

      const r = e.getBoundingClientRect(), rand = 6;

      const letzter = i === liste.length - 1;

      const kopf = document.createElement('div'); kopf.className = 'tour-schritt'; kopf.textContent = 'Einführung · Schritt ' + (i + 1) + ' von ' + liste.length;
      const h = document.createElement('h2'); h.id = 'tour-titel'; h.textContent = s.titel;
      const p = document.createElement('p'); p.textContent = s.text;
      const leiste = document.createElement('div'); leiste.className = 'tour-knoepfe';
      const weg = document.createElement('button'); weg.type = 'button'; weg.className = 'tour-weg'; weg.textContent = letzter ? 'Schließen' : 'Überspringen'; weg.onclick = () => zu(k);
      const zur = document.createElement('button'); zur.type = 'button'; zur.textContent = 'Zurück'; zur.disabled = i === 0; zur.onclick = () => { i--; zeige(); };
      const vor = document.createElement('button'); vor.type = 'button'; vor.className = 'tour-vor';
      if (letzter && o.ende) { vor.textContent = o.ende.label; vor.onclick = () => { zu(k); o.ende.aktion(); }; } else { vor.textContent = letzter ? 'Fertig' : 'Weiter'; vor.onclick = () => { if (letzter) zu(k); else { i++; zeige(); } }; }
      leiste.append(weg, zur, vor); blase.append(kopf, h, p, leiste);

// Meldecode des Prüfungspasses – gemeinsam für Pass (erzeugen) und Auswertung (lesen); bau_pass.py bettet diese Datei in beide ein.
// Aufbau (Version 2, ab 10.10.2026): 81 Bit Werte + 16 Bit Prüfsumme = 97 Bit in 20 Zeichen Crockford-Base32 (ohne I, L, O, U),
// Form PP-XXXXX-XXXXX-XXXXX-XXXXX. Version 1 (18 Zeichen) war nie veröffentlicht und wird nicht mehr gelesen.
// Version 3 (ab 11.10.2026, Plan „Trainingsmaterial in der Lernzentrale“ Schritt 4): wie Version 2, dazu Sparte (3 Bit, 0 = keine,
// 1–6 Teil 1.2), Reife je Bereich r1–r6 (je 3 Bit, 0–7 = Anteil richtig in Achteln) und Trainingspunkte aus Serious Games sg (6 Bit,
// 0–63, Entscheidung Christian 10.10.2026: 1 TP je 5 Ermittlungspunkte) = 108 + 16 = 124 Bit in 25 Zeichen,
// Form PP-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX. Die Auswertung liest Version 2 und 3; erzeugt wird die Version aus P.code.version.

const PCODE = (() => {

  // g Training richtig · b Training bearbeitet · s beste Simulation richtig · sn Simulationen

  function tagNr(t) { const [y, m, d] = String(t).split('-').map(Number); return Math.round((Date.UTC(y, m - 1, d) - T0) / 864e5); }
  function tagIso(n) { const d = new Date(T0 + n * 864e5); return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0'); }

          : kand.length ? el('p', { class: 'karte leise klein', 'data-sg-empfehlung': 'alle' }, 'Alle Spiele, die schon zu Ihrem Unterricht passen, sind gelöst. Neue kommen mit den nächsten Lernsituationen dazu.') : null;
        const gruppen = [];
        ['gap1', 'wiso', 'gap2'].forEach(zid => { [...new Set(SGK.filter(o => o.ziel === zid).map(o => String(o.bereich)))].sort((a, b) => a - b).forEach(b => {
          const L = SGK.filter(o => o.ziel === zid && String(o.bereich) === b), n = L.filter(o => o.status === 'spielbar').length;
          gruppen.push(el('details', { class: 'sgk-gruppe', 'data-sgk-gruppe': zid + '-' + b }, [el('summary', {}, [el('span', {}, zid === 'gap2' ? zt[zid] + ' · Teil 1.2 · ' + (L[0].btitel || b) : zt[zid] + ' · Bereich ' + b + ' · ' + btitel(zid, b)),
            el('small', {}, L.length + (L.length === 1 ? ' Spiel' : ' Spiele') + (n ? ' · ' + n + ' spielbar' : ''))]), el('div', { class: 'sgk-gitter' }, L.map(karte))])); }); });
        teile.push(el('section', { class: 'app-teil', 'aria-labelledby': 'h-sg', 'data-spielkatalog': String(SGK.length) }, [
          el('div', { class: 'zw' }, [el('h2', { id: 'h-sg' }, 'Serious Games'), el('span', { class: 'leise klein' }, anz('spielbar') + ' spielbar · ' + anz('in Arbeit') + ' in Arbeit · ' + anz('geplant') + ' geplant')]),
          el('p', { class: 'leise klein' }, 'Spiele zu jedem Prüfungsbereich: Fälle aus der Agentur Rehbein, allein spielbar. Leitspiele haben Filme, alle anderen Spiele einen kurzen Trailer. Ein gelöstes Spiel bringt ' + P.punkte.sg_geloest + ' Trainingspunkte. Die Spiele stehen in der Reihenfolge des Unterrichts; „ab LS“ zeigt, ab welcher Lernsituation ein Spiel passt. Was noch geplant ist, kommt nach und nach dazu.'),
          empf, el('div', { class: 'sgk-liste' }, gruppen)]));
      }
      teile.push(el('p', { class: 'leise klein' }, 'Weitere Module kommen im Takt des Unterrichts dazu. Ihre Noten und den Plan finden Sie in Mein KVF.'));
    }
    teile.push(fusszeile(() => tourStart()));
    teile.forEach(x => app.appendChild(x));
  }
  zeichne();
  window.addEventListener('pageshow', e => { if (e.persisted) zeichne(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !document.querySelector('[data-code]')) zeichne(); });
})();
</script>
</body>
</html>
